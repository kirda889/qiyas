anguage backgrounds and suggested that each culture has preferred patterns of organising ideas. He described Arabic-influenced writing as relying on **parallelism** and **coordination**, while English academic writing tends to be linear and to state links explicitly.","كابلان: لكل ثقافة أنماط في تنظيم الأفكار؛ العربية تميل للتوازي والعطف، والإنجليزية خطية بروابط صريحة."],["The idea has been criticised as too simple, but it still helps teachers anticipate common difficulties: long chains joined by *and*, restatement, few full stops, and general statements without specific support.","الفكرة انتُقدت لتبسيطها، لكنها تساعد على توقع الصعوبات: سلاسل بالواو وقلة النقاط والتعميم."]],"pts":[["Remedies: teach sentence boundaries and punctuation, a range of linking words, topic sentences with specific support.","العلاج: حدود الجملة والترقيم والروابط والتفاصيل الداعمة"]],"traps":[["The difficulty is mainly **cohesion and text organisation**, not vocabulary.","المشكلة في التماسك والتنظيم"]],"src":"Kaplan, Cultural Thought Patterns in Intercultural Education (1966); Connor, Contrastive Rhetoric"},"en.gr.dedind":{"k":"Grammar","t":["Deductive vs inductive grammar teaching","التدريس الاستنتاجي والاستقرائي"],"body":[["**Deductive** (rule-driven): the teacher states the rule, gives examples, and learners apply it. It is efficient and respects adult learners' analytical skills, but can be dry and teacher-centred.","الاستنتاجي: القاعدة ثم الأمثلة ثم التطبيق؛ سريع لكنه قد يكون جافاً."],["**Inductive** (discovery): learners meet examples and work out the rule. The mental effort aids memory and independence, but it takes longer and learners may reach a wrong rule — so teachers often use **guided discovery**, leading with focused questions.","الاستقرائي: الأمثلة أولاً والطالب يستخرج القاعدة؛ أرسخ لكنه أبطأ، فنستخدم الاكتشاف الموجّه."]],"map":{"type":"cards","groups":[{"n":"Deductive","ar":"⁧استنتاجي⁩","items":[{"n":"Rule → examples","ar":"⁧القاعدة أولاً⁩","kw":["explicit"]},{"n":"Fast","ar":"⁧سريع وواضح⁩","kw":["adults"]}]},{"n":"Inductive","ar":"⁧استقرائي⁩","items":[{"n":"Examples → rule","ar":"⁧الأمثلة أولاً⁩","kw":["discovery"]},{"n":"Memorable","ar":"⁧أرسخ في الذاكرة⁩","kw":["autonomy"]}]}]},"traps":[["Rule first, examples after = **deductive**.","القاعدة أولاً = استنتاجي"],["Students studying sentences and working out the rule = **inductive**.","يستخرجون القاعدة = استقرائي"]],"src":"Thornbury, How to Teach Grammar; Ur, Grammar Practice Activities"},"en.gr.fmu":{"k":"Grammar","t":["Larsen-Freeman: form, meaning and use","لارسن-فريمان: الشكل والمعنى والاستخدام"],"body":[["Larsen-Freeman pictures grammar as a pie with three slices. **Form** is how a structure is built (spelling, pronunciation, word order). **Meaning** is what it expresses. **Use** is when and why a speaker chooses it rather than an alternative.","القاعدة ثلاثة أبعاد: كيف تُبنى، وماذا تعني، ومتى ولماذا نختارها."],["The challenge for learners is often **use**: they can form the passive or the present perfect correctly but choose it in the wrong situation.","التحدي غالباً في الاستخدام: يعرف التركيب ويستعمله في غير موضعه."]],"ex":[["Present perfect — **form**: have/has + past participle; **meaning**: past action with present relevance; **use**: news (*I've passed!*), experience (*Have you ever…?*), not with *yesterday*.","مثال المضارع التام بأبعاده الثلاثة"]],"traps":[["The three dimensions are Larsen-Freeman's, not Nation's (Nation's form-meaning-use is about words).","أبعاد القاعدة للارسن-فريمان، وأبعاد الكلمة لنيشن"]],"src":"Larsen-Freeman, Teaching Language: From Grammar to Grammaring; Celce-Murcia & Larsen-Freeman, The Grammar Book"},"en.gr.fonf":{"k":"Grammar","t":["Focus on form, focus on forms, consciousness-raising","التركيز على الشكل وعلى الأشكال ورفع الوعي"],"body":[["Long distinguished **focus on forms** — the traditional syllabus that teaches discrete structures one by one — from **focus on form**, brief attention to linguistic form that arises during a meaning-focused, communicative activity.","لونغ: التركيز على الأشكال منهج قواعد منفصلة، والتركيز على الشكل التفات عابر أثناء نشاط تواصلي."],["**Consciousness-raising** (Rutherford, Sharwood Smith, Ellis) helps learners notice and understand a feature, often by analysing data, without requiring immediate production.","رفع الوعي: مساعدة الطالب على ملاحظة الظاهرة وفهمها دون مطالبته بإنتاجها فوراً."]],"pts":[["**Structure-based instruction** — teaching that focuses on the language itself (grammar, vocabulary) rather than on communication.","التعليم القائم على البنية"],["Good practice: grammar in context; non-contextualised drills are weak practice.","القواعد في سياق"]],"traps":[["A lesson that focuses mainly on structures = focus on **forms** (with an s).","تركيز على البنى = forms"],["Brief attention during a communicative task = focus on **form**.","التفات عابر = form"]],"ex":[["While pairs plan a class trip to the Red Sea, many students say *We will going*. The teacher pauses for one minute, writes *We are going to…* / *We will go…* on the board, then lets the planning continue — **focus on form**.","أثناء تخطيط رحلة يتوقف المعلم دقيقة لتصحيح الصيغة ثم يكمل النشاط: تركيز على الشكل."]],"src":"Long (1991); Lightbown & Spada, How Languages are Learned; Ellis, Instructed Second Language Acquisition"},"en.gr.frames":{"k":"Grammar","t":["PPP, TTT and ESA","أطر الدرس: PPP وTTT وESA"],"body":[["**PPP** — Presentation (teacher introduces the form in context, most teacher control) → Practice (controlled activities for accuracy) → Production (free use for fluency). Clear and easy to plan; criticised for assuming learners acquire forms in the order they are taught.","PPP: عرض ← ممارسة مضبوطة ← إنتاج حر. واضح، ويُنتقد بافتراض أن الطالب يكتسب بنفس ترتيب التدريس."],["**TTT** — Test → Teach → Test: a first task reveals what learners already know, the teacher teaches the gaps, a second task checks progress. **ESA** (Harmer) — Engage, Study, Activate: three elements every lesson needs; they can come in a *straight arrow*, *boomerang* or *patchwork* order.","TTT يبدأ بتشخيص ما يعرفه الطلاب. وESA لهارمر: شدّ ودراسة وتفعيل، بترتيب مستقيم أو مرتد أو متداخل."]],"traps":[["PPP order: Presentation first, Production last; the teacher has most control in **Presentation**.","العرض أولاً وفيه أعلى تحكم، والإنتاج آخراً"],["The first stage of TTT aims to **find out what students already know**.","أول TTT للتشخيص"]],"ex":[["TTT: students first describe their last holiday in pairs while the teacher listens (**Test**), she teaches the irregular past forms most of them got wrong (**Teach**), then pairs describe a different trip (**Test**).","يصفون عطلة ← يشرح الأفعال الشاذة التي أخطأوا فيها ← يصفون رحلة أخرى: TTT."]],"pts":[["Inside PPP — **Practice**: controlled and semi-controlled activities (drills, gap-fills, matching) with close monitoring and correction; **Production**: role plays and discussions, minimal intervention, delayed feedback.","الممارسة بمراقبة وتصحيح، والإنتاج بأقل تدخل وتصحيح مؤجل"]],"src":"Harmer, How to Teach English; Scrivener, Learning Teaching; Thornbury, How to Teach Grammar"},"en.gr.ccq":{"k":"Grammar","t":["CCQs and ICQs","أسئلة فحص المفهوم والتعليمات"],"body":[["**Concept-checking questions (CCQs)** check that learners understand the **meaning** of new language. They are short, simple, use easier language than the target item, and avoid repeating the target item itself.","أسئلة فحص المفهوم: قصيرة وبسيطة ولا تكرر التركيب المستهدف."],["**Instruction-checking questions (ICQs)** check that learners know **what to do** in a task: *Are you writing or speaking? Alone or in pairs? How many minutes?*","أسئلة فحص التعليمات: هل يعرف الطالب ماذا يفعل؟"]],"pts":[["*If I had a million riyals…* → *Do I have a million riyals now?* (No.)","الشرط الثاني: هل عندي المال الآن؟"],["*He used to smoke* → *Does he smoke now?* (No.) *Did he smoke in the past?* (Yes.)","used to: هل يدخن الآن؟"],["*You mustn't use your phone* → *Is it allowed?* (No.)","mustn't: هل هو مسموح؟"],["**Timelines** make tense meaning visible.","الخط الزمني للأزمنة"],["*He must wear a uniform* → *Does he have a choice?* (No.)","must: هل له خيار؟"],["*He was driving when it rained* → *Which started first?* (Driving.)","أيهما بدأ أولاً؟"]],"traps":[["*Do you understand?* is not a CCQ.","«فاهمين؟» ليس سؤال فحص"]],"src":"Scrivener, Learning Teaching; Thornbury, How to Teach Grammar"},"en.gr.pi":{"k":"Grammar","t":["Noticing, Processing Instruction and input enhancement","الملاحظة ومعالجة المدخلات وإبراز الشكل"],"body":[["Schmidt's **Noticing Hypothesis** holds that learners must consciously notice a form in the input before it can become intake. Several techniques aim to make noticing more likely.","فرضية الملاحظة لشميت: لا يُكتسب الشكل قبل أن يُلاحظ بوعي."],["**Processing Instruction** (VanPatten) gives brief explicit information, then **structured input** activities built so that learners can only interpret meaning correctly by processing the target form — for example, deciding *now or yesterday* from a verb ending. Production comes later.","معالجة المدخلات لفان باتن: شرح موجز ثم مدخلات مُهيكلة لا يُفهم معناها إلا بالانتباه للشكل، والإنتاج لاحقاً."]],"pts":[["**Input enhancement** (Sharwood Smith) — making forms salient: bold, colour, underlining (textual enhancement), or stress in speech.","إبراز الشكل: عريض ولون وخط"],["**Input flood** — a text with many examples of the target form.","الإغراق بالأمثلة"],["**Dictogloss** — hear, note, reconstruct in groups, compare with the original.","إعادة بناء النص جماعياً"]],"traps":[["Printing target verbs in bold = **input enhancement**, not input flood.","الخط العريض = إبراز"],["Processing Instruction is input-based: learners interpret before they produce.","معالجة المدخلات: فهم قبل الإنتاج"]],"ex":[["Structured input: students hear sentences and tick *now* or *yesterday*: *He walked to school* / *He walks to school*. The only clue is the ending **-ed**, so they must notice the form to get the meaning.","يسمعون جملاً ويحددون: الآن أم أمس؟ والدليل الوحيد نهاية ed: مدخلات مُهيكلة."]],"src":"VanPatten, Input Processing and Grammar Instruction; Schmidt (1990); Sharwood Smith (1993)"},"en.gr.cond":{"k":"Grammar","t":["Teaching the conditionals","تدريس الجمل الشرطية"],"body":[["Conditionals combine form and hidden meaning: the second and third conditionals say the opposite of what their words seem to say. That is why teachers rely on situations, timelines and CCQs rather than formulas alone.","الشرط الثاني والثالث يقولان عكس ظاهر الكلمات، فنعتمد على المواقف والأسئلة لا الصيغ وحدها."]],"map":{"type":"cards","groups":[{"n":"Zero","ar":"⁧الصفري⁩","items":[{"n":"If + present, present","ar":"⁧حقائق عامة⁩","kw":["If you heat ice, it melts"]}]},{"n":"First","ar":"⁧الأول⁩","items":[{"n":"If + present, will","ar":"⁧مستقبل محتمل⁩","kw":["If it rains, we'll stay"]}]},{"n":"Second","ar":"⁧الثاني⁩","items":[{"n":"If + past, would","ar":"⁧خيال في الحاضر⁩","kw":["If I had…, I would…"]}]},{"n":"Third","ar":"⁧الثالث⁩","items":[{"n":"If + had done, would have","ar":"⁧خيال في الماضي وندم⁩","kw":["If she had studied…"]}]}]},"pts":[["**Mixed** conditional: past condition, present result — *If I had studied medicine, I would be a doctor now.*","المختلط: شرط ماضٍ ونتيجة حاضرة"],["Practice ideas: chain stories (*If I go to Abha, I'll… If I…*), *What would you do if…?* discussions, regret stories for the third conditional.","قصص متسلسلة وأسئلة «ماذا لو» وقصص ندم"]],"traps":[["No *will* in the if-clause: *If it rains tomorrow* (not *will rain*).","لا will بعد if"],["*If she had studied, she would have passed* = she did NOT study and did NOT pass.","الثالث: لم تذاكر ولم تنجح"]],"src":"Swan, Practical English Usage; Thornbury, How to Teach Grammar"},"en.gr.transfer":{"k":"Grammar","t":["Typical grammar transfer errors of Arab learners","أخطاء النقل النحوي عند المتعلم العربي"],"body":[["Many systematic errors of Arab learners are **negative transfer** (interference) from Arabic. Recognising the source lets the teacher explain briefly through contrast instead of repeating the rule.","كثير من الأخطاء نقل سلبي من العربية، ومعرفة المصدر تتيح شرحاً سريعاً بالمقارنة."]],"pts":[["**Generic *the*** — *The honesty is important* (Arabic *al-* with abstract/generic nouns).","The مع المجرد والعام"],["**Resumptive pronoun** — *the book that I read it* (Arabic relative clauses keep a returning pronoun).","الضمير العائد في جمل الصلة"],["**Missing copula** — *He a teacher* (Arabic nominal sentences have no verb 'be' in the present).","حذف فعل الكينونة"],["**Present perfect** — no direct equivalent, so learners use the past simple or present instead.","المضارع التام بلا مقابل مباشر"],["**Uncountable nouns** — *informations, advices* (countable in Arabic).","جمع ما لا يُجمع"],["**Run-ons** — clauses joined with *and* (Arabic *wa*).","الجمل المتصلة بالواو"]],"traps":[["These are **interlingual** (transfer) errors, not developmental (intralingual) ones like *goed*.","أخطاء نقل بين لغتين، لا أخطاء نمائية"]],"src":"Swan & Smith, Learner English (Arabic speakers chapter); Brown, Principles of Language Learning and Teaching"},"en.sla-krashen":{"k":"SLA Theories","t":["Krashen's Monitor Model","نموذج المراقب عند كراشن"],"body":[["Stephen Krashen built the Monitor Model from five linked hypotheses. Its starting point is that **acquisition**, a subconscious process driven by understanding messages, is what produces fluent speech, while **learning**, conscious knowledge of rules, plays a limited role. The model shaped communicative teaching and Krashen and Terrell's **Natural Approach**, which puts comprehension first and lets speech emerge.","خمس فرضيات مترابطة: الاكتساب اللاواعي يصنع الطلاقة، والتعلم الواعي دوره محدود. وأثّر النموذج في التدريس التواصلي وفي المدخل الطبيعي الذي يقدّم الفهم على الكلام."],["Critics such as McLaughlin argued that the line between acquisition and learning cannot be tested, and that learned knowledge can become automatic through practice. Skill Acquisition Theory later developed that second point.","انتُقد لأن الفصل بين الاكتساب والتعلم يصعب اختباره، ولأن المعرفة المتعلَّمة قد تصير آلية بالتدريب."]],"pts":[["**Acquisition–Learning**: subconscious picking up versus conscious study.","الاكتساب والتعلم"],["**Monitor**: learned rules only edit output.","المراقب يحرر الكلام"],["**Natural Order**: structures are acquired in a predictable sequence.","ترتيب متوقع"],["**Input**: acquisition comes from comprehensible input at i+1.","مدخل مفهوم"],["**Affective Filter**: emotions block or admit input.","المصفاة الوجدانية"]],"traps":[["'Picking up an L2 resembles how children develop their L1' points to **Acquisition–Learning**, not the Input Hypothesis.","تشبيه الطفل يعني فرضية الاكتساب والتعلم"],["Acquisition is **subconscious**; learning is **conscious**. Do not swap them.","الاكتساب لا واعٍ والتعلم واعٍ"]],"src":"Krashen, Principles and Practice in Second Language Acquisition; Lightbown & Spada, How Languages are Learned; Brown, Principles of Language Learning and Teaching"},"en.sla-monitor":{"k":"Krashen","t":["The Monitor Hypothesis","فرضية المراقب"],"body":[["The Monitor is the learner's internal **editor**. Krashen argued that it works only when three conditions are met: the speaker has enough **time**, is **focused on form** (correctness) and actually **knows the rule**. In fast conversation these conditions rarely hold together, so the Monitor shows most in writing and in careful, planned speech.","المراقب محرر داخلي لا يعمل إلا بثلاثة شروط: وقت كافٍ، وتركيز على الصحة، ومعرفة القاعدة. لذلك يظهر في الكتابة والكلام المتأني أكثر من المحادثة السريعة."]],"pts":[["**Over-users** check everything, so they speak hesitantly and lack fluency.","المفرطون: كلام متردد بطيء"],["**Under-users** rely on feel and rarely self-correct, even when they know the rule.","المقلّون: نادراً ما يصححون"],["**Optimal users** apply the Monitor when it helps, such as when editing writing, without blocking communication.","المثاليون: يستعملونه عند الحاجة"]],"ex":[["A student rereads an email to her teacher and changes 'He go' to 'He goes'. She has time and is focused on form, so the Monitor can work.","مراجعة الرسالة قبل إرسالها مثال واضح على عمل المراقب."]],"traps":[["'Consciously correcting speech' and 'the device that edits output' both mean the **Monitor**.","التصحيح الواعي يعني المراقب"],["Hesitant, over-careful speakers are **over-users**, not under-users.","المتردد مفرط في المراقبة"]],"src":"Krashen, Principles and Practice in Second Language Acquisition; Brown, Principles of Language Learning and Teaching"},"en.sla-input":{"k":"Krashen","t":["The Input Hypothesis (i+1)","فرضية المدخل المفهوم"],"body":[["Krashen claims that we acquire language in one way: by understanding messages. Input must be **comprehensible** and pitched slightly beyond the learner's current competence (**i**), which gives **i+1**. Learners understand the extra step thanks to context, pictures and what they already know. Speaking is a result of acquisition, not its cause, so learners may go through a **silent period** before they speak.","نكتسب اللغة بفهم الرسائل. المدخل يجب أن يكون مفهوماً وأعلى قليلاً من الكفاية الحالية، والسياق والصور تساعد على فهم الزيادة. والكلام نتيجة للاكتساب لا سبب له، لذلك قد يمر المتعلم بفترة صمت."]],"pts":[["Good input is **comprehensible**: understood with help from context.","مفهوم"],["Good input is **interesting and relevant**, so learners attend to meaning.","ممتع ومناسب"],["Good input is **not grammatically sequenced**: rich natural input already contains i+1.","غير مرتب نحوياً"],["Good input comes in **sufficient quantity**.","كافٍ في كميته"]],"ex":[["A Grade 8 class reads a graded reader just above their level. Pictures and the familiar story let them understand new phrases from context, which is i+1 in practice.","قصة مبسطة أعلى قليلاً من المستوى، والصور والسياق يكملان الفهم."]],"traps":[["In i+1, **i** is the learner's current **competence**, not output or performance.","i هي الكفاية الحالية"],["'Ambiguous' is not one of Krashen's features of good input; **comprehensible** is.","الغموض ليس من صفات المدخل الجيد"],["The Input Hypothesis concerns **acquisition**, not instruction or training.","تخص الاكتساب"]],"src":"Krashen, The Input Hypothesis; Lightbown & Spada, How Languages are Learned"},"en.sla-filter":{"k":"Krashen","t":["The Affective Filter Hypothesis","فرضية المصفاة الوجدانية"],"body":[["The Affective Filter is an imaginary emotional screen between input and the part of the mind that acquires language. When learners are **anxious**, **shy**, **unmotivated** or low in **self-confidence**, the filter is **up** and even comprehensible input is blocked. When they feel relaxed, motivated and confident, the filter is **down** and input gets through. The idea was first proposed by Dulay and Burt, and Krashen made it one of his five hypotheses.","حاجز عاطفي بين المدخل والاكتساب: يرتفع مع القلق والخجل وضعف الدافعية والثقة فيحجب المدخل، وينخفض مع الراحة والدافعية والثقة فيمر المدخل."]],"pts":[["**Raises** the filter: anxiety, shyness, fear of mistakes, low motivation, peer pressure.","ترفعه: القلق والخجل والخوف من الخطأ"],["**Lowers** the filter: self-confidence, motivation, a relaxed, low-stakes atmosphere.","تخفضه: الثقة والدافعية والجو الآمن"]],"ex":[["A relaxed, personalised warm-up lowers the filter; a surprise graded quiz at the start of the lesson raises it.","النشاط التمهيدي الشخصي يخفضها، والاختبار المفاجئ يرفعها."],["Before a listening task, a Grade 10 teacher in Jeddah chats about the weekend, accepts short answers and does not correct every slip — keeping the **affective filter** low.","حديث خفيف بلا تصحيح متكرر يخفض المصفاة قبل الاستماع."]],"traps":[["Anxiety **raises** the filter. It does not lower it.","القلق يرفع المصفاة"],["Self-confidence is the variable that **helps** acquisition.","الثقة بالنفس تساعد الاكتساب"],["The filter blocks **input** from being acquired; it is not mainly about speaking.","تحجب المدخل"]],"src":"Krashen, Principles and Practice in Second Language Acquisition; Brown, Principles of Language Learning and Teaching"},"en.sla-interaction":{"k":"After Krashen","t":["Interaction, Output and Noticing","التفاعل والمخرج والملاحظة"],"body":[["**Long's Interaction Hypothesis** keeps Krashen's idea that comprehensible input matters, but adds that conversation is what makes input comprehensible. When a listener does not understand, both speakers adjust through **negotiation of meaning**, and these modifications push acquisition forward.","التفاعل يجعل المدخل مفهوماً: عند سوء الفهم يعدّل المتحدثان كلامهما، وهذا التفاوض يدفع الاكتساب."],["**Swain's Output Hypothesis** came from immersion students in Canada who understood French well but spoke it inaccurately. Producing language forces learners to process grammar, test hypotheses and **notice the gap** between what they want to say and what they can say. **Schmidt's Noticing Hypothesis** adds that input becomes **intake** only when learners consciously notice a feature.","الإنتاج يجبر المتعلم على معالجة القواعد واختبار فرضياته وملاحظة الفجوة. وعند شميت: المدخل لا يصبح مأخوذاً إلا بالملاحظة الواعية."]],"map":{"type":"cards","groups":[{"n":"Long","ar":"⁧فرضية التفاعل⁩","items":[{"n":"Negotiation","ar":"⁧التفاوض على المعنى⁩","kw":["negotiation of meaning"]},{"n":"Modified input","ar":"⁧تعديل الكلام ليُفهم⁩"}]},{"n":"Swain","ar":"⁧فرضية المخرج⁩","items":[{"n":"Notice the gap","ar":"⁧ملاحظة الفجوة⁩","kw":["pushed output"]},{"n":"Hypothesis testing","ar":"⁧تجربة القاعدة في الكلام⁩"}]},{"n":"Schmidt","ar":"⁧فرضية الملاحظة⁩","items":[{"n":"Input → intake","ar":"⁧الملاحظة شرط للأخذ⁩"},{"n":"Attention","ar":"⁧الانتباه الواعي للشكل⁩"}]}]},"pts":[["**Clarification request**: 'Sorry, what do you mean?'","طلب توضيح"],["**Confirmation check**: 'You mean the blue one?'","التحقق من الفهم"],["**Comprehension check**: 'Do you understand?'","التأكد من فهم المستمع"]],"traps":[["Negotiation of meaning = **Long**; noticing gaps through producing language = **Swain**; input must be noticed = **Schmidt**.","التفاوض لونغ، والمخرج سوين، والملاحظة شميت"],["Swain: gaps are noticed most when learners **talk to others**, not when they only listen.","الفجوة تظهر أكثر عند التحدث مع الآخرين"]],"src":"Lightbown & Spada, How Languages are Learned; Brown, Principles of Language Learning and Teaching"},"en.sla-compperf":{"k":"Learner errors","t":["Competence vs Performance","الكفاية والأداء"],"body":[["Chomsky distinguished **competence**, a speaker's underlying knowledge of the language system, from **performance**, the actual use of that knowledge in real time. Performance is affected by memory limits, tiredness, nerves and distraction, so it contains slips even when competence is complete.","الكفاية معرفة المتكلم الداخلية بنظام اللغة، والأداء استعمالها الفعلي الذي تؤثر فيه الذاكرة والتعب والتوتر."],["Corder applied the same idea to learners. An **error** reflects a gap in competence: the learner cannot correct it because he does not know the rule. A **mistake** is a performance slip: the learner knows the rule and can usually correct it himself.","وطبّقها كوردر على المتعلمين: الخطأ المنهجي نقص في الكفاية لا يستطيع المتعلم تصحيحه، والزلة خطأ أداء يصححه بنفسه."]],"pts":[["Knows the 3rd-person rule but says 'He run fast!' → has competence, **lacks performance**.","يعرف القاعدة ويخطئ: أداء"],["Says 'We swimmed' and does not know it is wrong → a **competence** problem.","لا يعرف خطأه: كفاية"],["Slips of the tongue, such as 'I will see you yesterday' → **performance** errors.","زلات اللسان: أداء"]],"traps":[["Self-repair while speaking shows **metalinguistic awareness**; the slip itself is performance, not lack of competence.","التصحيح الذاتي وعي ما وراء لغوي"],["Communicative competence (Hymes) is broader than Chomsky's competence.","الكفاية التواصلية أوسع من كفاية تشومسكي"]],"src":"Brown, Principles of Language Learning and Teaching; Yule, The Study of Language; Corder, The Significance of Learners' Errors"},"en.sla-bics":{"k":"Cummins","t":["BICS and CALP","مهارات التواصل والكفاءة الأكاديمية"],"body":[["Jim Cummins separated two kinds of proficiency. **BICS** (Basic Interpersonal Communicative Skills) is everyday social language: face-to-face, supported by context and cognitively light. It usually develops in about **2 years**. **CALP** (Cognitive Academic Language Proficiency) is the language of school subjects: abstract, less supported by context and cognitively demanding. It takes about **5–7 years**.","لغة التواصل اليومي مدعومة بالسياق وسهلة ذهنياً وتتكون في نحو سنتين. واللغة الأكاديمية مجردة وصعبة ذهنياً وتحتاج من 5 إلى 7 سنوات."]],"pts":[["Fluent chat is not proof of readiness for academic content.","الطلاقة في الحديث لا تعني الجاهزية الأكاديمية"],["Academic language grows through content-based and cross-curricular tasks.","تنمو بالمحتوى والروابط بين المواد"]],"traps":[["CALP takes **5–7 years**; BICS takes about **2**.","الأكاديمية 5–7 سنوات، والتواصلية نحو سنتين"],["Advanced fluency in the SLA stages is the level linked to **CALP**.","الطلاقة المتقدمة ترتبط بالكفاءة الأكاديمية"]],"src":"Cummins, Language, Power and Pedagogy; Brown, Principles of Language Learning and Teaching"},"en.sla-cc":{"k":"Communicative Competence","t":["From Hymes to Canale & Swain","من هايمز إلى كنال وسوين"],"body":[["Dell Hymes introduced **communicative competence** in reaction to Chomsky's narrow notion of competence. For Hymes, a speaker who produced perfect grammar at the wrong moment, or in the wrong tone, would not be competent. Knowing a language includes knowing what is **appropriate** in a given social situation.","هايمز أدخل المصطلح رداً على تشومسكي: من يتكلم بقواعد سليمة في موقف غير مناسب ليس كفئاً، فمعرفة اللغة تشمل معرفة المناسب للموقف."],["Canale and Swain (1980) built the first teaching model with grammatical, sociolinguistic and strategic competence, and Canale (1983) added **discourse** competence, giving the four-part model used today. Later, Bachman (1990) made **pragmatic** competence, understanding the function and intention of utterances, one of the two main branches of language competence, beside organizational competence.","نموذج كنال وسوين بدأ بثلاثة مكونات، ثم أضاف كنال الكفاية الخطابية فصارت أربعة. ولاحقاً جعل باكمان الكفاية التداولية أحد فرعين رئيسيين في نموذجه."]],"pts":[["**Grammatical**: vocabulary, grammar, pronunciation.","قواعدية"],["**Sociolinguistic**: appropriateness to setting, status and purpose.","اجتماعية لغوية"],["**Discourse**: cohesion and coherence across sentences.","خطابية"],["**Strategic**: compensating for gaps and repairing breakdowns.","استراتيجية"],["Hymes: knowing a language also means knowing **when, where and to whom** to say what.","متى وأين ولمن"]],"traps":[["The term was introduced by **Hymes**, not Chomsky or Krashen.","المصطلح لهايمز"],["Understanding the function of an utterance, such as a request, = **pragmatic** competence.","فهم وظيفة العبارة تداولية"],["'An animal that lives in water' for 'fish' = **strategic**, not discourse.","الوصف بدل الكلمة استراتيجية"]],"src":"Hymes, On Communicative Competence; Canale & Swain (1980); Brown, Principles of Language Learning and Teaching; Richards & Rodgers, Approaches and Methods in Language Teaching","ex":[["A student forgets 'umbrella' and says 'the thing you open when it rains' (**strategic**). Saying 'Give me the paper' to the principal shows a gap in **sociolinguistic** competence.","وصف الكلمة المنسية استراتيجية، والطلب الجاف من المدير ضعف اجتماعي لغوي."]]},"en.sla-order":{"k":"Krashen","t":["The Natural Order Hypothesis","فرضية الترتيب الطبيعي"],"body":[["The hypothesis grew out of the **morpheme order studies**. Roger Brown (1973) found that children acquiring English as an L1 master grammatical morphemes in a similar order. Dulay and Burt (1974) then found a shared order among child L2 learners from different L1 backgrounds, and similar results were reported for adults. Krashen concluded that structures are acquired in a **predictable sequence** that teaching does not change.","جاءت من دراسات ترتيب اكتساب الصرفيات: الأطفال في اللغة الأولى، ثم متعلمو اللغة الثانية من لغات أم مختلفة، يكتسبون التراكيب بترتيب متقارب لا يغيّره التدريس."]],"pts":[["Early: **-ing**, **plural -s**, **copula be**.","مبكرة: -ing والجمع وفعل الكون"],["Middle: **auxiliary be**, **articles**, then **irregular past**.","وسطى: الفعل المساعد وأدوات التعريف والماضي الشاذ"],["Late: **regular past -ed**, **third-person -s**, **possessive 's**.","متأخرة: -ed و-s الغائب والملكية"]],"traps":[["Krashen did **not** recommend teaching in this order; the order is acquired whatever the syllabus.","لا يعني ترتيب التدريس"],["Third-person -s is easy to state but **late** to acquire.","-s الغائب سهلة القاعدة متأخرة الاكتساب"]],"src":"Krashen, Principles and Practice in Second Language Acquisition; Lightbown & Spada, How Languages are Learned"},"en.sla-skill":{"k":"Cognitive SLA","t":["Skill Acquisition Theory (DeKeyser)","نظرية اكتساب المهارة"],"body":[["Robert DeKeyser, building on Anderson's cognitive psychology, treats language like any complex skill. Learning starts with **declarative** knowledge (knowing *that*: the rule can be stated), becomes **procedural** knowledge (knowing *how*: the rule can be used) through practice, and with long, meaningful practice becomes **automatic**: fast, accurate and needing little attention.","تبدأ بمعرفة تقريرية (أعرف القاعدة)، ثم إجرائية بالتدريب (أستعملها)، ثم آلية بالتدريب الطويل ذي المعنى (أستعملها بسرعة وبلا جهد)."]],"pts":[["Practice is **skill-specific**: practising comprehension improves comprehension more than production, and vice versa.","التدريب خاص بالمهارة"],["Unlike Krashen, the theory says learned knowledge **can** become fluent, automatic use.","بخلاف كراشن: المتعلَّم يمكن أن يصير آلياً"]],"traps":[["The direction is declarative → procedural → automatic, never the reverse.","الاتجاه من التقريرية إلى الإجرائية"],["Automaticity = performing without conscious effort; it is not fossilization.","الآلية ليست تحجراً"]],"src":"DeKeyser, Skill Acquisition Theory (in VanPatten & Williams, Theories in Second Language Acquisition); Lightbown & Spada, How Languages are Learned"},"en.sla-usage":{"k":"Cognitive SLA","t":["Usage-based Views of Learning","النظرة القائمة على الاستعمال"],"body":[["Usage-based researchers (for example Nick Ellis and Michael Tomasello) argue that no special innate grammar is needed. Learners meet language in use, notice **frequent patterns** and chunks ('Can I have…?', 'I don't know'), and gradually build more general rules from them. **Frequency** of exposure is therefore a key factor.","لا حاجة لقواعد فطرية خاصة: المتعلم يلتقط الأنماط والعبارات الجاهزة المتكررة في الاستعمال ثم يستخلص منها قواعد أعم، فكثرة التعرض عامل أساسي."]],"pts":[["Classroom link: rich input, repeated exposure to useful chunks, and extensive reading and listening.","مدخل غزير وتكرار العبارات المفيدة"]],"traps":[["Usage-based views stand **against** the nativist idea of an innate Universal Grammar.","عكس الفطرية"],["Frequency here means statistical learning from input, not behaviorist habit formation by reinforcement.","ليست السلوكية"]],"src":"Lightbown & Spada, How Languages are Learned; Ellis, The Study of Second Language Acquisition"},"en.sla-schumann":{"k":"Social SLA","t":["Schumann's Acculturation Model","نموذج التثاقف عند شومان"],"body":[["John Schumann (1978) studied Alberto, an adult Costa Rican immigrant in the US whose English stayed simple and pidgin-like. He explained it by **distance** from the English-speaking community: the more a learner stays apart from the target-language group, the less he acquires. Acculturation, adapting to the new culture, is therefore a major factor.","درس شومان مهاجراً بقيت إنجليزيته بسيطة كالهجين، وفسّر ذلك ببعده عن مجتمع اللغة: كلما زاد البعد قلّ الاكتساب."]],"pts":[["**Social distance**: the relation between the two groups, such as dominance, wish to assimilate, cohesiveness, size and intended length of stay.","البعد الاجتماعي بين الجماعتين"],["**Psychological distance**: the individual's language shock, culture shock and motivation.","البعد النفسي عند الفرد"]],"traps":[["Acculturation Model = social and psychological **distance**; investment and identity = Norton.","البعد لشومان، والاستثمار لنورتن"]],"src":"Brown, Principles of Language Learning and Teaching; Ellis, The Study of Second Language Acquisition"},"en.sla-norton":{"k":"Social SLA","t":["Norton — Investment and Identity","نورتن والاستثمار والهوية"],"body":[["Bonny Norton studied immigrant women in Canada who were motivated to learn English but often stayed silent in situations where they felt powerless. She proposed **investment**: learners commit to a language when they expect it to increase their symbolic and material resources (education, jobs, friendships, status), and this is tied to their changing **identity**. A learner can be highly motivated yet not invested in a particular classroom whose practices exclude her.","درست نورتن مهاجرات متحمسات للتعلم لكنهن يصمتن في مواقف يشعرن فيها بالضعف. الاستثمار: يلتزم المتعلم باللغة إذا رأى أنها تزيد موارده كالتعليم والعمل والمكانة، وهذا مرتبط بهويته المتغيرة."]],"pts":[["Investment is a **sociological** complement to the psychological idea of motivation.","مكمل اجتماعي لمفهوم الدافعية"],["**Imagined communities**: groups learners hope to join in future, such as a profession, shape their investment.","المجتمعات المتخيلة"]],"traps":[["Investment is about identity and power, not only instrumental motivation.","الاستثمار هوية وسلطة لا دافعية نفعية فقط"]],"src":"Norton, Identity and Language Learning; Lightbown & Spada, How Languages are Learned"},"en.sla-oxford":{"k":"Learning Strategies","t":["Oxford's Language Learning Strategies (1990)","استراتيجيات التعلم عند أكسفورد"],"body":[["Rebecca Oxford defined learning strategies as specific actions learners take to make learning easier, faster, more enjoyable, more self-directed and more effective. In *Language Learning Strategies: What Every Teacher Should Know* (1990) she grouped them into **direct** strategies, which work with the language itself, and **indirect** strategies, which support and manage learning. Her **SILL** (Strategy Inventory for Language Learning) is a questionnaire that measures how often learners use them.","الاستراتيجيات أفعال يقوم بها المتعلم ليجعل تعلمه أسهل وأسرع وأمتع وأكثر استقلالاً. قسمتها أكسفورد إلى مباشرة تتعامل مع اللغة، وغير مباشرة تدير التعلم، واستبانتها SILL تقيس كثرة استعمالها."]],"map":{"type":"cards","groups":[{"n":"Direct","ar":"⁧المباشرة⁩","items":[{"n":"Memory","ar":"⁧التصنيف والصور والمراجعة⁩"},{"n":"Cognitive","ar":"⁧التدريب والتحليل والتلخيص⁩"},{"n":"Compensation","ar":"⁧التخمين والإيماء والشرح بكلمات أخرى⁩"}]},{"n":"Indirect","ar":"⁧غير المباشرة⁩","items":[{"n":"Metacognitive","ar":"⁧التخطيط والمراقبة والتقويم⁩"},{"n":"Affective","ar":"⁧خفض القلق وتشجيع النفس⁩"},{"n":"Social","ar":"⁧طلب التوضيح والتعاون⁩"}]}]},"pts":[["O'Malley and Chamot (1990) use three groups instead: metacognitive, cognitive and social/affective.","تصنيف آخر بثلاث فئات"],["Direct: **memory** (grouping, associating, images and rhymes, reviewing), **cognitive** (practising, analysing, note-taking, summarising), **compensation** (guessing from context, gestures, synonyms, circumlocution).","ذاكرة، معرفية، تعويضية"],["Indirect: **metacognitive** (planning, organising, self-monitoring, self-evaluating), **affective** (lowering anxiety, self-encouragement, rewarding oneself), **social** (asking for clarification, cooperating with peers, cultural empathy).","ما وراء معرفية، وجدانية، اجتماعية"]],"traps":[["Compensation strategies are **direct**; metacognitive strategies are **indirect**.","التعويضية مباشرة، وما وراء المعرفية غير مباشرة"],["Planning and self-evaluation = **metacognitive**; asking for clarification = **social**.","التخطيط ما وراء معرفي، وطلب التوضيح اجتماعي"]],"src":"Oxford, Language Learning Strategies: What Every Teacher Should Know; Brown, Principles of Language Learning and Teaching"},"en.l17-ca":{"k":"Learner Language","t":["Contrastive Analysis and Transfer","التحليل التقابلي والنقل"],"body":[["Robert Lado's *Linguistics Across Cultures* (1957) proposed that L2 difficulty can be predicted by comparing the learner's L1 with the target language: where they are similar, learning is easy (positive transfer); where they differ, errors appear (negative transfer or interference). The idea fitted **behaviorism**, which saw language as habits and L1 habits as getting in the way of new ones.","لادو: المقارنة بين اللغتين تتنبأ بالصعوبة؛ التشابه يسهّل والاختلاف يسبب التداخل. والفكرة منسجمة مع السلوكية التي ترى اللغة عادات."],["The **strong version** (predict all errors in advance; Wardhaugh's term, 1970) failed: many predicted errors never appeared, and many real errors had nothing to do with the L1. A **weak version** survives: comparing languages helps explain errors after they occur, especially in pronunciation.","الصيغة القوية التي تتنبأ بكل الأخطاء فشلت، وبقيت الصيغة الضعيفة: المقارنة تفسر الأخطاء بعد وقوعها، خاصة في النطق."]],"pts":[["Adjective order: 'a pen blue', 'a smile beautiful'.","ترتيب الصفة بعد الاسم"],["Resumptive pronoun: 'the man whom I met him'.","ضمير زائد في جملة الصلة"],["Time expression: 'five years before' for 'five years ago'.","قبل بمعنى ago"],["Missing verb 'to be': 'He a teacher'.","حذف فعل الكينونة"],["Sound confusion: /p/ and /b/ ('park' / 'bark').","الخلط بين p و b"]],"traps":[["Contrastive Analysis is linked to **behaviorism**, not cognitivism or nativism.","مرتبط بالسلوكية"],["L1 influence is usually **most noticeable in pronunciation** (foreign accent).","أثر اللغة الأم أوضح في النطق"],["Similar structures produced correctly = **positive** transfer.","التشابه نقل إيجابي"]],"src":"Lado, Linguistics Across Cultures; Brown, Principles of Language Learning and Teaching; Swan & Smith, Learner English","ex":[["Positive transfer: an Arabic speaker easily produces 'The cat jumped over the fence'. Negative transfer: 'pen blue' follows Arabic noun–adjective order.","التشابه يسهّل، والاختلاف يسبب الخطأ."]]},"en.l17-ea":{"k":"Learner Language","t":["Error Analysis","تحليل الأخطاء"],"body":[["Pit Corder's 1967 paper on the significance of learners' errors changed how teachers see mistakes. Errors are useful three times over: they show the **teacher** how far the learner has come, show the **researcher** how languages are learned, and are the **learner's** own way of testing hypotheses about the new language.","كوردر: الأخطاء مفيدة للمعلم ليعرف تقدم الطالب، وللباحث ليفهم التعلم، وللمتعلم نفسه ليختبر فرضياته."],["Error Analysis classifies errors by source. **Interlingual** errors come from the L1. **Intralingual** errors come from the target language itself: **overgeneralization** ('goed', 'childs'), simplification and incomplete application of rules. Developmental errors follow similar paths for learners of any L1, and learners who share an L1 add the same transfer errors, so a class of Arab learners tends to show very similar errors.","الأخطاء نوعان: من اللغة الأم، ومن داخل اللغة الهدف كالتعميم الزائد. وأخطاء النمو متشابهة عند كل المتعلمين، ومن يشتركون في اللغة الأم يضيفون أخطاء النقل نفسها، فتتشابه أخطاء الطلاب العرب كثيراً."]],"map":{"type":"cards","groups":[{"n":"Interlingual","ar":"⁧من اللغة الأم⁩","items":[{"n":"Transfer","ar":"⁧نقل سلبي من العربية⁩","kw":["pen blue","five years before"]}]},{"n":"Intralingual","ar":"⁧من اللغة الهدف⁩","items":[{"n":"Overgeneralization","ar":"⁧تعميم القاعدة⁩","kw":["goed","tooths","childs"]},{"n":"Simplification","ar":"⁧تبسيط التركيب⁩","kw":["He go"]}]}]},"pts":[["Steps: collect samples → identify errors → describe → explain the source → evaluate seriousness.","اجمع، حدد، صِف، فسّر، قيّم"]],"traps":[["Errors like 'rided' and 'goed' **mean the student is learning**; they are not failure.","أخطاء النمو علامة تعلم"],["Teachers should analyse **errors** to find inappropriate L1 transfer.","حلل الأخطاء لتكتشف النقل"],["Error caused by the target language itself = **intralingual**, not interlingual.","من داخل اللغة الهدف"]],"src":"Corder, The Significance of Learners' Errors; Brown, Principles of Language Learning and Teaching; Ellis, The Study of Second Language Acquisition","ex":[["'Yesterday we swimmed and eated kabsa': the learner has found the -ed rule and applies it too widely — **intralingual** overgeneralization that shows learning.","تعميم قاعدة -ed خطأ من داخل اللغة يدل على التعلم."]]},"en.l17-il":{"k":"Learner Language","t":["Interlanguage, Fossilization and Avoidance","اللغة البينية والتحجر والتجنب"],"body":[["Larry Selinker (1972) used **interlanguage** for the system a learner builds on the way to the target language. It is **systematic**, because it has its own rules, and **dynamic**, because it keeps changing as new input arrives. Selinker linked it to processes such as L1 transfer, transfer of training, learning and communication strategies, and overgeneralization.","اللغة البينية نظام يبنيه المتعلم في طريقه إلى اللغة الهدف: منتظم له قواعده، ومتغير مع كل مدخل جديد."],["**Fossilization** happens when some interlanguage forms stop developing and resist correction, often in pronunciation and especially in adult learners. Lack of feedback and the fact that the message still gets across both help errors settle. **Avoidance** is harder to spot: learners simply do not use structures they find difficult, as Schachter showed with relative clauses, so the gap appears as something missing rather than as an error.","التحجر توقف بعض الأخطاء عن التطور ومقاومتها للتصحيح، ويساعد عليه غياب التغذية الراجعة ونجاح التواصل رغم الخطأ. والتجنب ترك التراكيب الصعبة، فيظهر غياباً لا خطأً."]],"pts":[["Interlanguage sits **between** L1 and L2; it is not a pidgin or a creole.","بين اللغتين وليست هجيناً"],["Negative transfer repeated without noticing or feedback → **fossilization**.","النقل السلبي المتكرر قد ينتهي بالتحجر"],["Loss of a language through disuse or the influence of another = **attrition**, not fossilization.","الفقد بقلة الاستعمال تآكل"]],"traps":[["Errors that become permanent and stop developing = **fossilization**.","الخطأ الدائم تحجر"],["A learner who never uses structures unlike Arabic to avoid being laughed at = **avoidance**.","ترك التركيب خوفاً من السخرية تجنب"]],"src":"Selinker, Interlanguage; Brown, Principles of Language Learning and Teaching; Lightbown & Spada, How Languages are Learned"},"en.l17-we":{"k":"TESOL Trends","t":["World Englishes, ELF and Kachru's Circles","الإنجليزيات العالمية والدوائر الثلاث"],"body":[["Braj Kachru described the spread of English as three concentric circles. The **inner circle** (UK, US, Australia) uses English as a first language and provides norms. The **outer circle** (India, Nigeria, Singapore) uses English as an official or second language with its own developing norms. The **expanding circle** (Saudi Arabia, China, Japan) learns English as a foreign language. From this view, Indian or Nigerian English are legitimate varieties, not failed British English.","كاتشرو: الدائرة الداخلية لغتها الأم الإنجليزية، والخارجية تستعملها لغة رسمية أو ثانية، والمتسعة تتعلمها لغة أجنبية. والتنوعات الهندية والنيجيرية مشروعة لا أخطاء."],["**English as a Lingua Franca** research (Jenkins, Seidlhofer) starts from the fact that most English conversations today happen between non-native speakers. The goal is **mutual intelligibility**, so teaching focuses on the pronunciation features that most affect understanding, and on accommodating to the listener.","أبحاث الإنجليزية المشتركة: أغلب المحادثات بين غير الناطقين، فالهدف الفهم المتبادل والتركيز على ما يؤثر في الوضوح."]],"map":{"type":"cards","groups":[{"n":"Inner circle","ar":"⁧الدائرة الداخلية⁩","items":[{"n":"UK · US · Australia","ar":"⁧لغة أولى تضع المعايير⁩","kw":["ENL"]}]},{"n":"Outer circle","ar":"⁧الدائرة الخارجية⁩","items":[{"n":"India · Nigeria","ar":"⁧لغة رسمية أو ثانية⁩","kw":["ESL"]}]},{"n":"Expanding circle","ar":"⁧الدائرة المتسعة⁩","items":[{"n":"Saudi Arabia · China","ar":"⁧لغة أجنبية⁩","kw":["EFL"]}]}]},"traps":[["Saudi Arabia is in the **expanding** circle.","السعودية في الدائرة المتسعة"],["ELF aims at **intelligibility**, not a native-like accent or perfect grammar.","الوضوح لا اللكنة الأصلية"],["Competent teachers make students **aware of varieties** of English rather than hiding them.","التوعية بالتنوعات"]],"src":"Kachru, The Other Tongue; Jenkins, The Phonology of English as an International Language; Harmer, The Practice of English Language Teaching"},"en.l17-icc":{"k":"TESOL Trends","t":["Byram's Intercultural Communicative Competence","كفاءة التواصل بين الثقافات عند بايرام"],"body":[["Michael Byram argued that the aim of language teaching is not to turn learners into imitation native speakers but into **intercultural speakers**: people who can see relationships between cultures, mediate between them and reflect on their own culture as well as others'. His model of intercultural communicative competence has five components.","بايرام: هدف تعليم اللغة متحدث بين الثقافات يفهم العلاقة بينها ويتوسط ويتأمل ثقافته وثقافة غيره، لا ناطق أصلي مقلَّد."],["The five components are often called Byram's **savoirs** (French for 'kinds of knowing').","وتُسمّى المكونات الخمسة savoirs."]],"pts":[["**Attitudes**: curiosity and openness, readiness to suspend judgement.","الفضول والانفتاح"],["**Knowledge**: of social groups and practices in one's own and other cultures.","معرفة المجتمعات"],["**Skills of interpreting and relating**: explaining a document or event from another culture.","التفسير والربط"],["**Skills of discovery and interaction**: learning new cultural knowledge in real time.","الاكتشاف والتفاعل"],["**Critical cultural awareness**: evaluating practices in one's own and other cultures on clear criteria.","الوعي الثقافي النقدي"]],"ex":[["Students compare wedding customs in Saudi Arabia and Japan, explain the reasons behind each and discuss what a visitor might misunderstand.","مقارنة عادات الزواج وتفسيرها وتوقع سوء الفهم تبني هذه الكفاءة."]],"traps":[["The ideal outcome is the **intercultural speaker**, not the native speaker.","المتحدث بين الثقافات"],["ICC adds culture to communicative competence; it does not replace language skills.","تضيف الثقافة ولا تلغي اللغة"]],"src":"Byram, Teaching and Assessing Intercultural Communicative Competence; Kramsch, Language and Culture"},"en.l17-postmethod":{"k":"TESOL Trends","t":["Post-method Pedagogy and the Native-speaker Debate","ما بعد الطريقة وقضية المعلم الناطق"],"body":[["B. Kumaravadivelu argued that the search for one best method had failed, because no method fits every context. Teachers should instead build their own practice from three parameters, **particularity** (the local context), **practicality** (teacher-generated theory) and **possibility** (learners' social and political realities), guided by ten **macrostrategies**. Concrete classroom techniques, the **microstrategies**, are derived from these principles.","كوماراڤاديفيلو: لا توجد طريقة مثلى لكل سياق. المعلم يبني ممارسته من خصوصية سياقه وتجربته وواقع طلابه، بإرشاد عشر استراتيجيات كبرى تُشتق منها الأساليب الصفية."],["Adrian Holliday named **native-speakerism**, the ideology that native speakers are the best models and teachers. Péter Medgyes showed that non-native teachers bring their own strengths and are not second-best.","هوليداي سمّى الانحياز للناطق الأصلي، وميدجيز بيّن مزايا المعلم غير الناطق."]],"pts":[["Macrostrategies: maximise learning opportunities; minimise perceptual mismatches; facilitate negotiated interaction; promote learner autonomy; foster language awareness.","استراتيجيات كبرى 1–5"],["Macrostrategies: activate intuitive heuristics; contextualise linguistic input; integrate language skills; ensure social relevance; raise cultural consciousness.","استراتيجيات كبرى 6–10"],["Medgyes: non-native teachers are models of successful learners, teach learning strategies, give information about the language, **anticipate difficulties**, show empathy and can use the **shared L1**.","مزايا المعلم غير الناطق"]],"traps":[["General principles like 'promote learner autonomy' = **macrostrategies**.","المبادئ العامة استراتيجيات كبرى"],["Native-speakerism is **Holliday's** term.","المصطلح لهوليداي"],["Post-method is principled, not 'anything goes': techniques must follow from the macrostrategies and the context.","ليس عشوائياً"]],"src":"Kumaravadivelu, Beyond Methods; Medgyes, The Non-native Teacher; Holliday, Native-speakerism"},"en.l17-reflect":{"k":"Teacher Development","t":["Reflective Teaching and Action Research","التدريس التأملي والبحث الإجرائي"],"body":[["Donald Schön described professionals as people who think while they work. **Reflection-in-action** is the quick thinking that changes a lesson as it happens. **Reflection-on-action** is the slower look back afterwards, often in a journal or a discussion with a colleague. Tools for reflection include teaching journals, audio or video recordings, peer observation, student feedback and portfolios.","شون: التأمل أثناء الفعل يغيّر الحصة وهي تجري، والتأمل بعد الفعل مراجعة لاحقة. وأدواته اليوميات والتسجيل وملاحظة الزملاء وآراء الطلاب وملف الإنجاز."],["**Action research** turns reflection into a cycle. Kemmis and McTaggart describe it as **plan → act → observe → reflect**, then a new plan. It is done by the teacher, in her own classroom, on a real local problem, and the results feed straight back into practice.","البحث الإجرائي دورة: خطط، نفّذ، لاحظ، تأمّل، ثم خطة جديدة. ينفذه المعلم في صفه على مشكلة حقيقية، ونتائجه تعود مباشرة إلى تدريسه."]],"pts":[["5 R's: **Reporting** (what happened) → **Responding** (feelings) → **Relating** (own experience) → **Reasoning** (theory) → **Reconstructing** (new plan).","المراحل الخمس للتأمل"],["Peer observation is for learning and feedback, not for evaluation.","ملاحظة الزميل للتعلم لا للتقييم"]],"traps":[["Changing an activity mid-lesson = reflection-**in**-action.","التعديل وسط الحصة أثناء الفعل"],["Explaining an event through a theory such as the ZPD = **Reasoning**.","التفسير بالنظرية Reasoning"],["Action research is small-scale and classroom-based, not a large experimental study.","بحث صغير داخل الصف"]],"src":"Schön, The Reflective Practitioner; Richards & Lockhart, Reflective Teaching in Second Language Classrooms; Burns, Doing Action Research in English Language Teaching","ex":[["Mr. Khalid's Grade 9 students rarely speak in groups. He introduces role cards (plan, act), counts who speaks for two weeks (observe), finds one leader still dominates (reflect) and adds a turn-taking rule: **action research**.","مشكلة في صفه، تجربة حل، بيانات، تأمل وتعديل."],["5 R's journal: 'Only three students spoke (Reporting). I felt frustrated (Responding). The same happened in my first year (Relating). The topic needed vocabulary beyond their ZPD (Reasoning). Next time I will pre-teach key phrases (Reconstructing).'","التفسير بالنظرية هو Reasoning."]]},"en.l17-culture":{"k":"TESOL and Culture","t":["Culture in the English Classroom","الثقافة في درس الإنجليزية"],"body":[["Language and culture are tied together, so every coursebook carries cultural content. Cortazzi and Jin described three choices: **source culture** (the learners' own), **target culture** (countries where English is a first language) and **international culture** (the many settings where English is used). Starting from source culture makes new content familiar before learners compare it with others.","كل كتاب يحمل محتوى ثقافياً: ثقافة المتعلم، أو ثقافة اللغة الهدف، أو ثقافات دولية. والبدء بثقافة المتعلم يسهّل المقارنة."],["The **Sapir–Whorf hypothesis** (linguistic relativity) holds that language shapes thought. Its strong version, that language **determines** thought, is largely rejected; its weak version, that language **influences** perception and memory, has some support. Robert Phillipson's **linguistic imperialism** argues that the dominance of English can maintain structural and cultural inequality.","النسبية اللغوية: الصيغة القوية (اللغة تحدد التفكير) مرفوضة غالباً، والضعيفة (اللغة تؤثر في الإدراك) لها دعم. والإمبريالية اللغوية ترى أن هيمنة الإنجليزية قد تكرّس عدم المساواة."]],"pts":[["**Big C**: literature, art, history, institutions.","الثقافة الكبرى"],["**Little c**: greetings, food, routines, gestures, values.","الثقافة الصغرى"],["Culture shock stages: honeymoon → frustration → adjustment → adaptation.","مراحل الصدمة الثقافية"],["A **stereotype** is an oversimplified belief about a group; teachers should challenge it.","الصورة النمطية"]],"traps":[["Shakespeare = **Big C**; how people greet = **little c**.","شكسبير كبرى والتحية صغرى"],["A unit on Jeddah's historic district = **source** culture.","جدة التاريخية ثقافة المصدر"],["Start from **familiar local** culture, then move to the unfamiliar.","ابدأ بالمألوف"]],"src":"Cortazzi & Jin, Cultural Mirrors; Kramsch, Language and Culture; Phillipson, Linguistic Imperialism; Brown, Principles of Language Learning and Teaching"},"en.l17-bilingual":{"k":"Bilingualism","t":["Bilingualism, Code-switching and Diglossia","الثنائية والتناوب والازدواجية"],"body":[["A **bilingual** person can use two languages. **Code-switching** is moving between them within one conversation or even one sentence ('Okay, yalla, let's start'). Research shows that it is normal and rule-governed: speakers switch to fill a gap, add emphasis, quote someone or show shared identity. It is not in itself a sign of weak proficiency.","ثنائي اللغة يستعمل لغتين، والتناوب الانتقال بينهما في الحديث نفسه. وهو سلوك طبيعي له قواعد: لسد فجوة أو للتأكيد أو لإظهار الانتماء، ولا يدل بذاته على ضعف."],["**Diglossia** (Ferguson, 1959) is different: one community uses two varieties of the **same** language for different functions, a 'high' variety for formal uses and a 'low' one for daily talk, as with Fusha and colloquial Arabic.","الازدواجية: صيغتان للغة نفسها لكل منهما وظيفة، رفيعة للرسمي ودارجة للحياة اليومية، كالفصحى والعامية."]],"pts":[["**EFL**: English learned where it is not the community language (Saudi Arabia); **ESL**: English needed in daily life around the learner.","لغة أجنبية / لغة ثانية"]],"traps":[["Switching between Arabic and English in one conversation = **code-switching**, not diglossia.","التناوب بين لغتين غير الازدواجية"],["Fusha and colloquial Arabic = **diglossia**, not bilingualism.","الفصحى والعامية ازدواجية"]],"src":"Ferguson, Diglossia; Wardhaugh, An Introduction to Sociolinguistics; Yule, The Study of Language"},"en.l17-translang":{"k":"TESOL Trends","t":["Translanguaging","توظيف المخزون اللغوي كاملاً"],"body":[["The term began in Welsh bilingual classrooms (Cen Williams, 1994), where input came in one language and output in the other. Ofelia García and Li Wei developed it into a view of bilinguals as having **one integrated linguistic repertoire**, not two separate languages. In class, learners use all their languages on purpose, for example reading or discussing in Arabic and then presenting or writing in English.","بدأ المصطلح في الصفوف الثنائية في ويلز، ثم طوّرته أوفيليا غارسيا ولي وي: للمتعلم مخزون لغوي واحد متكامل، ويوظفه كله عن قصد، كأن يناقش بالعربية ثم يعرض بالإنجليزية."]],"pts":[["Code-switching describes moving between two languages; translanguaging is also a **teaching approach** that plans for using the whole repertoire.","التناوب وصف، والتوظيف الكامل أسلوب تدريس مخطط"],["Aim: deeper understanding and confidence, with the English output as the goal.","الهدف فهم أعمق والناتج بالإنجليزية"]],"traps":[["Translanguaging is a planned use of L1 as a resource, not **negative transfer** and not Grammar-Translation.","ليس نقلاً سلبياً ولا ترجمة"]],"src":"García & Li Wei, Translanguaging: Language, Bilingualism and Education; Baker, Foundations of Bilingual Education and Bilingualism"},"en.l18-hockett":{"k":"Language as a System","t":["Hockett's Design Features","خصائص هوكيت للغة البشرية"],"body":[["Charles Hockett compared human language with animal systems such as bee dances, bird song and primate calls, and listed the features that a full human language has. Some features are shared with animals, such as the vocal-auditory channel, rapid fading and semanticity. Others appear fully only in human language: duality, prevarication and reflexiveness, together with unlimited productivity, displacement and cultural transmission. Animals show these last three only in a very limited form: bees can signal where food is, but cannot talk about yesterday's flowers.","قارن هوكيت لغة الإنسان بتواصل الحيوان. بعض الخصائص مشتركة كالقناة الصوتية والزوال السريع، وبعضها لا يكتمل إلا في لغة الإنسان كالازدواجية والكذب والانعكاسية، والإبداعية والإزاحة والانتقال الثقافي لا تظهر عند الحيوان إلا محدودة جداً، فالنحل مثلاً إزاحته محدودة."]],"pts":[["**Arbitrariness**: no natural link between form and meaning.","الاعتباطية"],["**Displacement**: talking about things absent in time or space.","الإزاحة"],["**Productivity / creativity**: endless new sentences from finite means.","الإبداعية"],["**Duality of patterning**: sounds (no meaning) → morphemes and words (meaning).","الازدواجية"],["**Cultural transmission**: learned from the community, not inherited.","الانتقال الثقافي"],["**Discreteness**: sounds are separate units; changing one changes the word (pin / bin).","التمايز"]],"traps":[["Generalization, receptiveness, imitation and translation are **not** design features.","ليست من الخصائص"],["Displacement = absent things; productivity = new messages. Do not swap them.","الإزاحة غير الإبداعية"],["Duality = two levels of structure; discreteness = distinct units.","الازدواجية غير التمايز"]],"src":"Hockett, The Origin of Speech; Yule, The Study of Language","ex":[["Students talk about a dream trip to Japan next summer — a place and time that are not here and now. Birds and cats cannot do this: **displacement**. ('tree' and 'shajara' name the same thing: **arbitrariness**.)","الحديث عن رحلة لم تحدث بعد: إزاحة."]]},"en.l18-functions":{"k":"Language as a System","t":["Transactional and Interactional Language","الوظيفة التبادلية والتفاعلية"],"body":[["Brown and Yule separated two broad functions. **Transactional** language is message-oriented: its purpose is to pass on information, so clarity and accuracy of content matter most. **Interactional** language is listener-oriented: its purpose is to establish and maintain social relationships, so friendliness and agreement matter most.","التبادلية موجهة للرسالة وغرضها نقل المعلومة بوضوح، والتفاعلية موجهة للمستمع وغرضها بناء العلاقة والود."],["Malinowski called talk whose main purpose is social contact **phatic communion**: greetings, weather talk and polite small talk. It carries little information, but it keeps relationships running.","سمّى مالينوفسكي كلام المجاملة الاجتماعية التواصل الاتصالي: تحيات وحديث عن الطقس، قليل المعلومة كثير الأثر في العلاقات."]],"pts":[["Giving directions, explaining a process, a news report → transactional.","أمثلة تبادلية"],["Greetings, compliments, small talk → interactional / phatic.","أمثلة تفاعلية"]],"traps":[["Passing on information = **transactional**, not interactional, international or translational.","نقل المعلومة تبادلية"],["'Nice weather, isn't it?' = **phatic** communication.","المجاملة اتصالية"]],"src":"Brown & Yule, Discourse Analysis; Yule, The Study of Language"},"en.l18-saussure":{"k":"Structural Linguistics","t":["Ferdinand de Saussure","فرديناند دي سوسير"],"body":[["Saussure moved linguistics from the history of words to the study of language as a **system** in which each unit gets its value from its relations with other units. His lectures were published by his students as the *Course in General Linguistics* (1916), after his death.","نقل سوسير اللسانيات من تاريخ الكلمات إلى دراسة اللغة نظاماً تأخذ فيه كل وحدة قيمتها من علاقتها بغيرها. ونشر طلابه محاضراته بعد وفاته."],["He described four pairs that are still basic to linguistics. Saussure himself called the paradigmatic relation 'associative'; the term 'paradigmatic' came later.","وضع أربع ثنائيات أساسية، وكان يسمي العلاقة الرأسية «ترابطية» ثم شاع اسم «استبدالية»."]],"map":{"type":"cards","groups":[{"n":"Linguistic sign","ar":"⁧العلامة اللغوية⁩","items":[{"n":"Signifier","ar":"⁧الصورة الصوتية أو الشكل⁩","kw":["/triː/"]},{"n":"Signified","ar":"⁧المفهوم⁩","kw":["the idea of a tree"]}]},{"n":"Langue / Parole","ar":"⁧اللسان والكلام⁩","items":[{"n":"Langue","ar":"⁧النظام المشترك في المجتمع⁩"},{"n":"Parole","ar":"⁧الكلام الفعلي للأفراد⁩"}]},{"n":"Time","ar":"⁧الزمن⁩","items":[{"n":"Synchronic","ar":"⁧اللغة في لحظة واحدة⁩"},{"n":"Diachronic","ar":"⁧تطور اللغة عبر الزمن⁩"}]},{"n":"Relations","ar":"⁧العلاقات⁩","items":[{"n":"Syntagmatic","ar":"⁧أفقية: تتابع الكلمات⁩","kw":["the + cat + sat"]},{"n":"Paradigmatic","ar":"⁧رأسية: الاستبدال في الموقع⁩","kw":["cat / dog / bird"]}]}]},"traps":[["The sound-image /triː/ = **signifier**; the concept 'tree' = **signified**.","الصورة الصوتية دال"],["Studying English as used today, without its history = **synchronic**.","دراسة اللغة اليوم تزامنية"],["Words that can replace each other in one slot = **paradigmatic**.","الاستبدال علاقة رأسية"],["Langue is social and shared; Chomsky's competence is individual knowledge. They are similar but not identical.","اللسان اجتماعي والكفاية فردية"]],"src":"Saussure, Course in General Linguistics; Yule, The Study of Language; Crystal, A Dictionary of Linguistics and Phonetics","pts":[["**Linguistic sign** = signifier (sound-image, /triː/) + signified (concept 'tree'), joined arbitrarily.","الدال + المدلول"],["**Synchronic** = a language at one point in time; **diachronic** = its change over time.","تزامني / تعاقبي"],["**Syntagmatic** = horizontal relations in sequence (the + cat + sat); **paradigmatic** = vertical relations of substitution in one slot (cat / dog / bird).","أفقية / رأسية"]],"ex":[["Substitution table (I / You / We + like / love / hate + tea / juice / dates): each column holds **paradigmatic** choices; each row read left to right is a **syntagmatic** chain.","الأعمدة رأسية، والصف أفقي."]]},"en.l18-origins":{"k":"Language Origins","t":["Theories of the Origin of Language","نظريات نشأة اللغة"],"body":[["Speech leaves no fossils, so the beginnings of language cannot be observed. Each theory picks one plausible source and stretches it; none can be proved. The **divine source** was even tested with isolation experiments on infants, reported since ancient times, but children who grow up without hearing language simply do not develop one.","الكلام لا يترك أثراً مادياً، فكل نظرية تخمين. وحتى تجارب عزل الأطفال لاختبار المصدر الإلهي لم تثبت شيئاً، فالطفل الذي لا يسمع لغة لا يتكلم."],["The **physical adaptation** view looks for evidence in the body. Human teeth are upright, lips are muscular and flexible, the mouth is small and the tongue agile, and the larynx sits lower than in other primates, creating a longer pharynx that works as a resonator. The human brain is **lateralised**, with language functions mainly in the left hemisphere, and the **tool-making** view links language to the same brain functions used for manipulating objects.","التكيف الجسدي: أسنان قائمة، وشفاه مرنة، وفم صغير، ولسان مرن، وحنجرة منخفضة تطيل البلعوم. والدماغ متخصص الجانبين، واللغة في الأيسر غالباً، وترتبط بالوظائف نفسها التي تدير صنع الأدوات."]],"pts":[["**Bow-wow** (natural sound): imitation of natural sounds; problem: few onomatopoeic words, and soundless or abstract things cannot be named this way.","محاكاة الطبيعة"],["**Pooh-pooh**: instinctive emotional cries; problem: such cries use sounds unlike ordinary speech.","صيحات الانفعال"],["**Yo-heave-ho** (social interaction): sounds of group work; explains the social setting, not the sounds.","العمل الجماعي"],["**Oral-gesture** (Paget): mouth and tongue movements copy hand gestures.","الإيماءة الفموية"],["**Genetic source** (innateness): humans are born with a capacity for language.","المصدر الوراثي"]],"traps":[["The main problem with all origin theories: they **lack scientific evidence**.","لا دليل علمي"],["'cuckoo', 'splash' = **bow-wow**; 'Ouch!' = **pooh-pooh**.","المحاكاة والانفعال"],["Teeth, lips, larynx and a lateralised brain = **physiological adaptation**, not the genetic source.","الأعضاء تكيف جسدي"]],"src":"Yule, The Study of Language","ex":[["The teacher drops a book (bang!), pretends to touch a hot cup (Ouch!) and pulls a desk with two students ('one, two, heave!'): bow-wow, pooh-pooh and yo-heave-ho.","ثلاثة مواقف لثلاث نظريات."]]},"en.l18-history":{"k":"History of English","t":["A Short History of English","تاريخ الإنجليزية باختصار"],"body":[["English began with Germanic tribes, the Angles, Saxons and Jutes, who settled in Britain from the 5th century. Viking settlers later added Old Norse words such as sky, egg and they. After the **Norman Conquest of 1066**, French became the language of the court, law and government for about three centuries, and English absorbed thousands of French words. The printing press and Shakespeare mark **Early Modern English**. The **Great Vowel Shift** (about 1400–1700), which ran from late Middle English into this period, changed the pronunciation of long vowels after spelling had begun to settle, so English spelling no longer matches sound.","بدأت الإنجليزية مع قبائل جرمانية في القرن الخامس، ثم أضاف الفايكنغ كلمات، ثم جاء الغزو النورماندي 1066 بآلاف الكلمات الفرنسية. والطباعة وشكسبير علامة الحديثة المبكرة. وتغيّر نطق الصوائت الطويلة بين 1400 و1700 تقريباً بعد أن بدأت التهجئة تستقر، فابتعدت التهجئة عن النطق."]],"map":{"type":"cards","groups":[{"n":"Old English","ar":"⁧الإنجليزية القديمة⁩","idea":"⁧450–1100 تقريباً⁩","items":[{"n":"Anglo-Saxon","ar":"⁧قبائل جرمانية⁩","kw":["Beowulf"]},{"n":"-en plural","ar":"⁧بقيت في oxen و children⁩"}]},{"n":"Middle English","ar":"⁧الإنجليزية الوسطى⁩","idea":"⁧1100–1500 تقريباً⁩","items":[{"n":"1066","ar":"⁧الغزو النورماندي⁩","kw":["French words"]},{"n":"Chaucer","ar":"⁧أشهر كتّابها⁩"}]},{"n":"Early Modern","ar":"⁧الحديثة المبكرة⁩","idea":"⁧1500–1700 تقريباً⁩","items":[{"n":"Shakespeare","ar":"⁧الطباعة وتوحيد الكتابة⁩","kw":["printing"]},{"n":"Vowel Shift","ar":"⁧تغيّر نطق الصوائت الطويلة⁩","kw":["Great Vowel Shift"]}]},{"n":"Modern","ar":"⁧الحديثة⁩","idea":"⁧من 1700 تقريباً⁩","items":[{"n":"Dictionaries","ar":"⁧المعاجم وتوحيد المعيار⁩"},{"n":"Global","ar":"⁧انتشار عالمي وتنوعات⁩","kw":["World Englishes"]}]}]},"pts":[["French: café, croissant, restaurant, government.","من الفرنسية"],["Greek and Latin: most scientific and biological terms.","من اليونانية واللاتينية"],["Arabic: algebra, alcohol, sugar, coffee, cotton.","من العربية"]],"traps":[["English is **Germanic** despite its many Latin and French words.","جرمانية رغم الكلمات اللاتينية"],["Shakespeare = **Early Modern** English; Chaucer = Middle English.","شكسبير حديثة مبكرة"],["The most frequent everyday words (the, be, have, of) are **Germanic**.","الكلمات الأكثر استعمالاً جرمانية"]],"src":"Crystal, The Cambridge Encyclopedia of the English Language; Baugh & Cable, A History of the English Language; Yule, The Study of Language"},"en.l18-varieties":{"k":"Language Variation","t":["Dialect, Accent and Contact Languages","اللهجة واللكنة ولغات التماس"],"body":[["Variation is a normal, built-in part of every language, not a sign of decay. A **dialect** is a variety marked by grammar, vocabulary and pronunciation, linked to region or social group; an **accent** concerns pronunciation only. Everyone speaks a dialect and has an accent, including speakers of the standard.","التنوع جزء أصيل من كل لغة. اللهجة تختلف في القواعد والمفردات والنطق، واللكنة في النطق فقط، وكل متكلم له لهجة ولكنة."],["When speakers with no common language must communicate, for trade for example, they create a **pidgin**: a reduced contact language with limited vocabulary and simple grammar and no native speakers. When a new generation grows up speaking it as a first language, it expands into a full **creole**. **Diglossia** (Ferguson) describes two varieties of one language with separate functions, as with Fusha and colloquial Arabic.","الهجين لغة تواصل مبسطة بلا متحدثين أصليين، فإذا نشأ عليها جيل صارت كريول كاملة. والازدواجية وجود صيغتين للغة الواحدة لكل منهما وظيفة، كالفصحى والعامية."]],"pts":[["**Register**: variety by situation and formality.","السجل"],["**Idiolect**: one person's own way of speaking.","اللهجة الفردية"],["**Isogloss**: a map line marking where a language feature changes.","خط تساوي الظاهرة"],["**Lingua franca**: a shared language between speakers of different L1s.","اللغة المشتركة"]],"traps":[["Pronunciation only = **accent**; grammar + vocabulary + pronunciation = **dialect**.","اللكنة نطق فقط"],["A pidgin that became a mother tongue = **creole**.","الهجين الذي صار لغة أم كريول"],["Language variation is **inherent**, not found only in uneducated speech.","التنوع أصيل"]],"src":"Yule, The Study of Language; Trudgill, Sociolinguistics; Wardhaugh, An Introduction to Sociolinguistics","ex":[["The same sentence read by a Scottish and an American speaker: same words and grammar, different sounds — **accent**, not dialect.","الكلمات والقواعد نفسها والنطق مختلف: لكنة."]]},"en.l18-rpga":{"k":"Language Variation","t":["RP and General American","النطق البريطاني المعياري والأمريكي العام"],"body":[["**Received Pronunciation** is the traditional prestige accent of British English. It is non-regional, but only a small minority of British people actually speak it. **General American** is the broad accent heard in much of the US media. Dictionaries and coursebooks usually model one of the two.","النطق البريطاني المعياري لكنة مرموقة غير مرتبطة بمنطقة ولا يتكلمها إلا قلة، والأمريكي العام هو الشائع في الإعلام الأمريكي، والمعاجم والكتب تعتمد أحدهما."]],"pts":[["**Rhoticity**: GA pronounces /r/ after vowels (car, hard); RP does not.","نطق الراء بعد الصائت"],["**Flapped t**: GA often says 'water' and 'better' with a quick d-like sound.","التاء المرنة في الأمريكية"],["**bath, dance, can't**: RP /ɑː/, GA /æ/.","صائت bath"],["**hot, stop**: RP /ɒ/, GA /ɑ/.","صائت hot"]],"traps":[["An accent that pronounces /r/ in 'car' = **rhotic**; RP is **non-rhotic**.","الراوي ينطق الراء"],["Standard English is about grammar and vocabulary, **not** a particular accent.","المعيارية ليست لكنة"]],"src":"Roach, English Phonetics and Phonology; Trudgill & Hannah, International English"},"en.assess.intl":{"k":"Assessment","t":["International Standardized Proficiency Tests","الاختبارات الدولية المقننة"],"body":[["A **standardized test** is administered and scored under uniform conditions with fixed procedures, so results can be compared across test-takers and administrations. International tests are **proficiency** tests (not tied to a course) and **high-stakes**, so they create strong **washback** on teaching.","تطبيق وتصحيح موحّد يسمح بالمقارنة، وهي اختبارات كفاءة عالية التأثير."]],"pts":[["**IELTS** (owned by the British Council, IDP and Cambridge): **Academic** and **General Training** versions; listening, reading, writing, speaking; **band scale of 0–9**; speaking is a **face-to-face interview**.","آيلتس: نسختان، 0–9، مقابلة وجهاً لوجه"],["**TOEFL iBT** (ETS): internet-based test of **academic** English in four skills; speaking responses (including a simulated 'Take an Interview' task) are **recorded** and rated — no live examiner.","توفل: أكاديمي والمحادثة مسجّلة"],["Since **21 January 2026** TOEFL scores are reported on a **1–6 band scale** aligned with the CEFR, with a comparable 0–120 score during a two-year transition.","من يناير 2026 مقياس 1–6 مع 0–120 مرحلياً"],["Cambridge English Qualifications: **A2 Key (KET)**, **B1 Preliminary (PET)**, B2 First, C1 Advanced, C2 Proficiency; Key, Preliminary and First have **'for Schools'** versions.","كامبريدج: اختبار لكل مستوى ونسخ للمدارس"]],"traps":[["IELTS speaking = live interview; TOEFL speaking = recorded responses.","مقابلة حية مقابل تسجيل"],["KET = A2 and PET = B1 — not the other way round.","KET = A2 وPET = B1"]],"src":"IELTS, ETS (TOEFL iBT) and Cambridge English official test information; Council of Europe, CEFR"},"en.assess.tos":{"k":"Test quality","t":["Table of Specifications","جدول المواصفات"],"body":[["A table of specifications is the test's blueprint: before writing items, the teacher lists the objectives and content taught and decides how many items, and which skills, will sample each one. It protects **content validity** because the test then represents the course fairly.","مخطط الاختبار قبل كتابة الأسئلة: يوزّع الأسئلة على الأهداف والمحتوى فيحمي صدق المحتوى."]],"pts":[["Careful consideration of objectives and content determines a course test's validity.","النظر في الأهداف والمحتوى يحدد الصدق"],["Weight each area by its importance and teaching time.","الوزن حسب الأهمية وزمن التدريس"]],"ex":[["A unit covered reading, vocabulary and writing equally, but the test is 80% grammar — a table of specifications would have shown the imbalance.","اختبار لا يمثّل الوحدة: خلل في صدق المحتوى"]],"traps":[["Table of specifications → content validity (not reliability).","جدول المواصفات = صدق المحتوى"]],"src":"Brown & Abeywickrama, Language Assessment; Hughes, Testing for Language Teachers"},"en.assess.ctest":{"k":"Testing skills","t":["Cloze and C-test","اختبار الإكمال واختبار C"],"body":[["Both are integrative gap tests. A classic **cloze** deletes words at a fixed interval (every nth word, e.g. every 7th — a **fixed-ratio** cloze) or selected words. A **C-test** deletes the **second half of every second word**; learners must read the damaged text to restore it.","الإكمال يحذف كلمات بانتظام، واختبار C يحذف النصف الثاني من كل كلمة ثانية."]],"pts":[["A C-test draws mainly on **reading** and overall proficiency.","يعتمد على القراءة والكفاءة العامة"],["Both are scored objectively although they are integrative.","تكاملي وموضوعي التصحيح"]],"ex":[["A Grade 11 cloze on Saudi coffee deletes every seventh word; students use grammar, vocabulary and reading together to restore it.","نص بفراغات يحتاج القواعد والمفردات والقراءة معاً"]],"traps":[["Deleting every nth word = fixed-ratio cloze; deleting half of every second word = C-test.","كل كلمة رقم n = إكمال، ونصف كل كلمة ثانية = C"]],"src":"Hughes, Testing for Language Teachers; Brown & Abeywickrama, Language Assessment"},"en.assess.stats":{"k":"Test analysis","t":["Describing and Using Test Results","وصف نتائج الاختبار واستخدامها"],"body":[["Descriptive statistics summarise a set of scores: where the centre is and how spread out the scores are. Item analysis then shows which questions, and which objectives, need attention.","الإحصاء الوصفي يلخّص الدرجات: مركزها وتشتتها."]],"pts":[["**Mean** = average; **median** = middle score; **mode** = most frequent score.","المتوسط والوسيط والمنوال"],["**Range** and **standard deviation** = how spread out the scores are.","المدى والانحراف المعياري للتشتت"],["If most of the class fails items on one objective, **reteach** that objective.","إعادة تدريس الهدف الضعيف"],["Keep records of each learner's results to track progress and plan remediation.","سجل النتائج للمتابعة والعلاج"]],"traps":[["Most frequent score = mode, not median.","الأكثر تكراراً = المنوال"]],"src":"Brown & Abeywickrama, Language Assessment; Hughes, Testing for Language Teachers"},"en.plan.routines":{"k":"Classroom management","t":["Instructions, Transitions and Routines","التعليمات والانتقالات والروتين"],"body":[["Most lost time comes from unclear instructions and messy changes between activities. Short instructions given at the right moment, practised routines and planned transitions keep the lesson moving and raise student talking time.","التعليمات الواضحة والروتين والانتقالات المخططة تحفظ وقت الدرس."]],"pts":[["Instructions: short, demonstrated, given **before** students move and before handing out materials; then check (ICQs or a student explains the steps).","قصيرة ومع نمذجة وقبل الحركة"],["Keep **TTT** (teacher talking time) low to raise **STT**: gestures, demonstration and model examples instead of long explanations.","قلّل كلام المعلم"],["Rules: few, clear, ideally agreed with students; calm, consistent consequences; aim: a safe, orderly, supportive environment.","قواعد قليلة متفق عليها"],["Routines are taught, modelled, practised and reinforced.","الروتين يُعلّم ويُدرّب"],["Smooth transitions: materials ready, **signposting** ('Now that we've read…'), time warnings ('one minute left'), **extension tasks** for fast finishers.","انتقال سلس"],["Give groups clear **roles**: leader, note-taker, timekeeper, reporter.","أدوار المجموعة"]],"traps":[["Instructions come before students move into groups, not after.","التعليمات قبل الحركة"]],"src":"Scrivener, Learning Teaching; Harmer, The Practice of English Language Teaching"},"en.mat.tools":{"k":"Technology","t":["Madrasati and Classroom Digital Tools","مدرستي والأدوات الرقمية الصفية"],"body":[["**Madrasati** (مدرستي) is the Saudi Ministry of Education's national e-learning platform (launched 2020) for virtual classes, digital lessons, assignments, tests and communication with students and parents.","منصة وزارة التعليم الوطنية للفصول الافتراضية والدروس والواجبات والتواصل."]],"pts":[["**Kahoot** (game-based quizzes), **Quizlet** (vocabulary sets and flashcards), **Padlet** (collaborative digital wall).","اختبارات ألعاب وبطاقات وجدار رقمي"],["**Edpuzzle** (video with embedded questions), **Nearpod** (interactive lessons), **Google Classroom / Microsoft Teams** (class management).","فيديو بأسئلة ودروس تفاعلية وإدارة الصف"],["**MALL** (mobile-assisted language learning): phones and tablets for vocabulary apps, recording speaking and podcasts.","التعلم بالجوال"]],"traps":[["MALL = mobile; CALL = computer.","MALL جوال وCALL حاسب"]],"src":"Saudi Ministry of Education; Dudeney & Hockly, How to Teach English with Technology"},"en.mat.digcit":{"k":"Technology","t":["Generative AI and Digital Citizenship","الذكاء الاصطناعي التوليدي والمواطنة الرقمية"],"body":[["**Generative AI** can produce texts, dialogues and practice items, but the teacher must check accuracy, level and cultural fit, and teach responsible use.","يولّد نصوصاً وتمارين، والمعلم يتحقق من الدقة والمستوى والملاءمة."]],"pts":[["**Digital citizenship**: online safety, privacy and respect for **copyright**.","السلامة والخصوصية وحقوق النشر"],["Prefer openly licensed (e.g. **Creative Commons**) materials and cite sources.","مواد مرخصة مفتوحاً مع ذكر المصدر"],["Evaluate any app or website by **learning objectives first**, then usability, accuracy, cost, privacy and accessibility.","الهدف أولاً ثم الجوانب الأخرى"]],"traps":[["The first criterion for choosing a tool is the learning objective, not popularity or cost.","الهدف قبل الشهرة والتكلفة"]],"src":"Dudeney & Hockly, How to Teach English with Technology"},"en.mat.writetools":{"k":"Technology","t":["Digital Tools for Writing and Skills Practice","أدوات رقمية للكتابة وممارسة المهارات"],"body":[["Match the tool to the skill: text-based tools practise writing, video sites mainly listening, live calls speaking.","لكل مهارة أداتها."]],"pts":[["**Google Docs**: collaborative writing — several students edit the same document online at the same time.","كتابة تعاونية متزامنة"],["**Grammarly** checks grammar, spelling and style (a **writing** tool); in Microsoft Word, the **spelling checker** marks misspellings, the **thesaurus** suggests synonyms, **word count** counts words.","أدوات التدقيق في الكتابة"],["Text-based social networks and blogs (posts and comment threads) → writing; video sites → listening.","المنشورات للكتابة والفيديو للاستماع"],["**Online tutoring platforms** (e.g. Cambly) → live speaking with native or proficient speakers.","منصات المحادثة الحية"],["**Vlog** = video blog; **vodcast** = video podcast — recorded, one-way input.","مدونة مرئية وبودكاست مرئي"]],"traps":[["The thesaurus suggests synonyms; it does not check spelling.","المكنز للمرادفات"]],"src":"Dudeney & Hockly, How to Teach English with Technology"},"en.lrn.sen":{"k":"Learner differences","t":["Dyslexia and ADHD","عسر القراءة وفرط الحركة وتشتت الانتباه"],"body":[["Learning difficulties are not learning styles: they persist despite adequate teaching and need planned support.","صعوبات التعلم ليست أنماطاً، وتحتاج دعماً مخططاً."]],"pts":[["**Dyslexia**: persistent difficulty
