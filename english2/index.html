ments on grammar, vocabulary and mechanics.","على الشكل"],["Constructive alignment","Objectives, activities and assessment aligned (Biggs).","مواءمة بنائية"]]}],"trap":[["Inter-rater reliability = several teachers, not student and peer.","أكثر من معلم"],["Reliability = consistency; validity = measures what it should.","ثبات / صدق"],["Co-constructed rubrics ≠ easier standards; they show assessment as a learning tool.","ليس تسهيلاً"]],"vid":[["DA9UKR-1WKE","ar","الاختبارات الموضوعية والمقالية","الدافورة",0],["zIVlBEwNVOs","ar","أدوات التقويم البديل","الدافورة",0],["VsaM7MXXXrw","en","Holistic vs Analytic Rubrics","English with Beth B",7],["O5hJNpO0JPE","en","Criterion vs Norm Referenced Assessment","Teachings in Education",2]],"n":10},{"id":"L11","d":"D","std":"6.9.5","en":"Learning Objectives & Bloom's Taxonomy","ar":"الأهداف وتصنيف بلوم","goal":["Write measurable objectives, classify verbs on Bloom's levels and know the three domains.","هدف قابل للقياس وتصنيف بلوم"],"sec":[{"h":["Goals, objectives and outcomes","الغايات والأهداف ونواتج التعلم"],"pts":[["Planning moves from broad to specific: [[goals|en.obj.goals]] are **more general** and long-term, while objectives are specific, observable and measurable, and they link each lesson to the **national standards**.","التخطيط من العام للخاص: الغاية عامة بعيدة، والهدف محدد قابل للقياس ويربط الدرس بالمعايير الوطنية."],["'Students will understand the plot' cannot be observed or measured directly, so it belongs under **learning goals**, not objectives.","عبارة «سيفهم الطلاب الحبكة» لا تُقاس مباشرة، لذلك تُكتب غاية لا هدفاً."],["Outcomes also range from general to specific: 'write academically' is a general outcome, and 'use the present tense in reports' is a specific one.","النواتج كذلك: «يكتب أكاديمياً» ناتج عام، و«يستعمل المضارع في التقارير» ناتج محدد."],["Begin every plan with the key question: **What should my students have learned by the end of this lesson?**","ابدأ التخطيط بسؤال واحد: ماذا يجب أن يتعلم طلابي بنهاية هذا الدرس؟"]],"t":[["Goal","A broad, long-term statement of intended learning.","غاية"],["Objective","A specific, observable and measurable statement of what learners will do.","هدف"],["Learning outcome","What learners are expected to be able to do after instruction.","ناتج التعلم"]]},{"h":["Writing measurable objectives","كتابة هدف قابل للقياس"],"pts":[["Good objectives are [[**SMART**|en.obj.smart]] — specific, measurable, achievable, relevant and time-bound ('by the end of this lesson') — and begin with action verbs; they meet every condition EXCEPT being **general/broad**.","الهدف الجيد ذكي ومحدد بزمن ويبدأ بفعل إجرائي، وكل الشروط تنطبق عليه إلا أن يكون عاماً."],["Measurable means observable: 'Students will pronounce /p/ and /b/', NOT 'be familiar with sounds'; use identify, list, **distinguish**, compare or write, and avoid know, understand or appreciate.","القابل للقياس يُرى: «ينطق الصوت /p/ والصوت /b/» لا «يتعرف على الأصوات»، وتجنّب أفعال يعرف ويفهم."],["Write objectives as **learner outcomes** — what students will do — not as teacher activities; the ABCD model names the Audience, Behavior, Condition and Degree.","اكتب الهدف بما سيفعله الطالب لا بما سيفعله المعلم، ونموذج ABCD يحدد الفئة والسلوك والشرط والدرجة."],["A good elementary listening objective is 'Students will listen **with the purpose of following directions**', because the stated purpose makes the skill observable.","هدف جيد للابتدائي: يستمع الطالب بهدف اتباع التعليمات، لأن الغرض المعلن يجعل المهارة ملحوظة.","o"]],"t":[["SMART","Specific, Measurable, Achievable, Relevant, Time-bound.","ذكي"],["ABCD model","Audience, Behavior, Condition, Degree.","نموذج ABCD"],["Action verb","An observable verb such as identify, distinguish or write.","فعل إجرائي"],["Behavioral objective","An objective stated in terms of observable learner behavior.","هدف سلوكي"],["Time-bound objective","The T in SMART: the objective states when it will be achieved ('by the end of this 45-minute lesson').","هدف محدد بزمن"]]},{"h":["From unit to lesson: terminal and enabling objectives","من الوحدة إلى الدرس: الأهداف النهائية والتمكينية"],"pts":[["**Unit objectives** state what learners achieve by the end of a unit, and **lesson objectives** break them into smaller steps across several lessons.","هدف الوحدة ما يحققه الطالب بنهايتها، وأهداف الدروس خطوات صغيرة توصل إليه."],["The [[**Terminal objective**|en.obj.terminal]] is the final outcome, such as writing an 80-word invitation email; **enabling objectives** are the sub-skills that lead to it, such as giving the date and time of an event.","الهدف النهائي هو الناتج الأخير كرسالة دعوة من 80 كلمة، والتمكيني مهارة فرعية توصل إليه."],["**Mager** writes an objective in three parts: performance (what learners do), condition (the circumstances) and criterion (how well) — e.g. 'Given a model (condition), students will write an invitation email (performance) of 80 words (criterion).'","الهدف عند ماجر ثلاثة أجزاء: الأداء والشرط والمعيار، مثل: بعد نموذج يكتب دعوة من 80 كلمة."]],"t":[["Unit (module) objective","A learning objective for a whole unit, achieved through several lessons.","هدف الوحدة"],["Terminal objective","The final performance expected at the end of a unit or course.","هدف نهائي"],["Enabling objective","A sub-objective that leads to a terminal objective.","هدف تمكيني"],["Mager's three components","Performance, condition and criterion of a behavioural objective.","مكونات ماجر"]]},{"h":["Bloom's taxonomy: 1956 and 2001","تصنيف بلوم: الأصلي والمعدّل"],"pts":[["[[Bloom|en.obj.bloom]] (1956) ranked six cognitive levels as nouns, from knowledge up to **evaluation** at the top; the 2001 revision by Anderson & Krathwohl renamed them as verbs and put **create** at the top.","بلوم 1956 رتب ستة مستويات بأسماء أعلاها التقويم، والمعدّل 2001 جعلها أفعالاً أعلاها الإبداع."],["The top two levels swapped: 1956's **synthesis** (level 5) — combining experience and new material into a new structure — became create at level 6 ('design an advertisement' is **creating**), and evaluation moved down to level 5.","تبادل المستويان الأعليان: التركيب كان خامساً فصار الإبداع سادساً، ونزل التقويم إلى الخامس."],["Match verbs to levels: 'name three manners of articulation' is knowledge (remember), explain is understand, using procedures to solve tasks is **application**, compare is analyze, judge is evaluate, design is create.","لكل مستوى أفعاله: يسمّي تذكّر، يشرح فهم، يحل بإجراء تطبيق، يقارن تحليل، يحكم تقويم، يصمم إبداع."],["'List' is a lower-order verb, while plan, assess and design are [[higher-order|en.obj.verbs]]; sorting items into groups by set criteria is **classifying**.","«يسرد» من المستويات الدنيا، و«يخطط ويقيّم ويصمم» عليا، وتوزيع العناصر على فئات بمعايير تصنيف."],["The revision also added a second dimension, the **knowledge dimension**: factual, conceptual, procedural and metacognitive knowledge.","أضاف المعدّل بُعداً ثانياً هو بُعد المعرفة: حقائق ومفاهيم وإجراءات وما وراء المعرفة."]],"t":[["Benjamin Bloom","Classified the cognitive domain of educational objectives.","بلوم"],["Knowledge (remember)","Recalling facts: list, name, define.","تذكّر"],["Comprehension (understand)","Explaining meaning: explain, summarize, paraphrase.","فهم"],["Application","Using information in new situations: use, solve.","تطبيق"],["Analysis","Breaking information into parts: compare, distinguish.","تحليل"],["Synthesis","Combining elements into a new whole.","تركيب"],["Evaluation","Judging value using criteria: judge, justify, critique.","تقويم"],["Create","Producing original work: design, compose (highest in revised Bloom).","إبداع"],["Knowledge dimension","Revised Bloom's types of knowledge: factual, conceptual, procedural, metacognitive.","بُعد المعرفة"]]},{"h":["Three domains and other taxonomies","المجالات الثلاثة وتصنيفات أخرى"],"pts":[["Objectives belong to three domains: cognitive (knowledge and intellectual skills, as in Bloom), affective (attitudes, values and feelings — Krathwohl) and psychomotor (physical and motor skills).","الأهداف ثلاثة مجالات: معرفي للتفكير، ووجداني للاتجاهات والقيم، ومهاري للحركة."],["An attitudinal objective, such as developing a critical attitude towards what students read, belongs to the affective domain.","الهدف الاتجاهي، كتنمية موقف ناقد مما يقرأ الطالب، ينتمي للمجال الوجداني."],["[[**SOLO**|en.obj.solo]] (Biggs & Collis) — the Structure of the Observed Learning Outcome — is another taxonomy, with 5 levels from prestructural to extended abstract.","تصنيف سولو لبيغز وكوليس فيه 5 مستويات، من ما قبل البنية إلى التجريد الممتد."]],"t":[["Cognitive domain","Objectives about knowledge and intellectual skills.","معرفي"],["Affective domain","Objectives about attitudes, values and feelings (Krathwohl).","وجداني"],["Psychomotor domain","Objectives about physical and motor skills.","مهاري"],["Attitudinal objective","An objective targeting attitudes (e.g. developing a critical attitude).","هدف اتجاهي"],["SOLO taxonomy","Prestructural, unistructural, multistructural, relational, extended abstract.","تصنيف سولو"]],"map":{"type":"fan","title":["Three domains","⁧المجالات الثلاثة⁩"],"groups":[{"n":"Cognitive","who":"Bloom","ar":"⁧المعرفة والتفكير: «يصف موضوعاً»⁩","items":[{"n":"remember → create"}],"d":"en.obj.domains"},{"n":"Affective","who":"Krathwohl","ar":"⁧الاتجاهات والقيم⁩","items":[{"n":"receiving → responding → valuing → organization → characterization"}],"d":"en.obj.domains"},{"n":"Psychomotor","who":"Dave · Simpson","ar":"⁧المهارات الجسدية: «يجري تجربة»⁩","items":[{"n":"imitation → manipulation → precision → articulation → naturalisation"}],"d":"en.obj.domains"}]}},{"h":["Sharing objectives with learners","إيصال الأهداف للطلاب"],"pts":[["Objectives are written by the **teacher** and shared **before and during** teaching, **orally and in writing**, in **student-friendly language**; letting students personalize them raises motivation.","يكتب المعلم الأهداف ويشرحها قبل التدريس وأثناءه شفهياً وكتابياً بلغة الطالب، وتخصيصها يرفع الدافعية."],["[[**Learning intentions**|en.obj.criteria]] state what students are learning, and **success criteria** tell them how they will know they succeeded — often written as **WALT** (We Are Learning To…), **WILF** (What I'm Looking For…) or can-do statements.","نية التعلم ما يتعلمه الطالب، ومعايير النجاح كيف يعرف أنه نجح، بصيغ مثل (WALT, WILF)."],["Learners then self-check with [[exit tickets|en.assess.formative]] or traffic lights, which links objectives to [[**self-assessment**|en.assess.alt]].","يتحقق الطلاب بأنفسهم ببطاقة الخروج أو إشارات المرور، فترتبط الأهداف بالتقييم الذاتي."],["In [[CLIL|en.meth.cbi]] or other content lessons, each lesson states a **content objective** plus a **language objective** (SIOP).","في دروس المحتوى يُكتب هدف للمحتوى وهدف للغة معاً، كما في نموذج SIOP."]],"t":[["Learning intention","A statement, shared with students, of what they are learning in a lesson.","نية التعلم"],["Success criteria","Statements that tell students how they will recognise successful learning.","معايير النجاح"],["WALT / WILF","'We Are Learning To' / 'What I'm Looking For': child-friendly frames for objectives and success criteria.","صيغ الأهداف للطلاب"],["Exit ticket","A short task at the end of a lesson that shows whether the objective was achieved.","بطاقة الخروج"],["Language objective","An objective stating the language learners will use to work with content (SIOP).","هدف لغوي"]]}],"trap":[["Highest level: evaluation (original) vs create (revised) — read which version the question means.","انتبه للنسخة"],["Conditions of objectives: all except 'general/broad'.","ما عدا عام"],["'Explain a character's feelings' = comprehension (explain), not evaluation.","يشرح = فهم"]],"vid":[["9RIWrf3YR24","ar","التصميم التعليمي","الدافورة",0],["ayefSTAnCR8","en","Bloom's Taxonomy: Structuring the Learning Journey","Sprouts",5],["uWC16myEYjI","en","Writing ABCD Learning Objectives","Jeff Grossenbacher",4]],"map":{"type":"steps","title":["Bloom (1956, nouns) → Anderson & Krathwohl (2001, verbs)","⁧تصنيف بلوم المعدّل⁩"],"swap":{"a":4,"b":5,"label":["Swapped in 2001","⁧تبادلا المكان⁩"]},"brackets":[{"from":0,"to":2,"n":"Lower-order thinking","ar":"⁧مهارات دنيا⁩"},{"from":3,"to":5,"n":"Higher-order thinking","ar":"⁧مهارات عليا⁩"}],"groups":[{"n":"Remember","ar":"⁧يتذكر⁩","d":"en.obj.bloom","items":[{"n":"list","d":"en.obj.verbs"},{"n":"define"},{"n":"recall"}],"tag":"1956: Knowledge","trap":"⁧list فعل منخفض المستوى⁩"},{"n":"Understand","ar":"⁧يفهم⁩","d":"en.obj.bloom","items":[{"n":"explain","d":"en.obj.verbs"},{"n":"summarize"}],"tag":"1956: Comprehension","trap":"⁧يشرح مشاعر الشخصية = فهم لا تقييم⁩"},{"n":"Apply","ar":"⁧يطبّق⁩","d":"en.obj.bloom","items":[{"n":"use","d":"en.obj.verbs"},{"n":"solve"}],"tag":"1956: Application","trap":"⁧استخدام إجراء لحل مهمة = تطبيق⁩"},{"n":"Analyze","ar":"⁧يحلّل⁩","d":"en.obj.bloom","items":[{"n":"compare","d":"en.obj.verbs"},{"n":"categorize"}],"tag":"1956: Analysis","trap":"⁧يقارن بين شخصيتين = تحليل⁩"},{"n":"Evaluate","ar":"⁧يقيّم⁩","d":"en.obj.bloom","items":[{"n":"judge","d":"en.obj.verbs"},{"n":"justify"}],"tag":"1956: Evaluation was the top (6)","hl":true},{"n":"Create","ar":"⁧يبتكر⁩","d":"en.obj.bloom","items":[{"n":"design","d":"en.obj.verbs"},{"n":"compose"}],"tag":"1956: Synthesis was level 5","hl":true}]},"n":11},{"id":"L12","d":"D","std":"6.9.2","en":"Lesson Planning & Sequencing","ar":"تخطيط الدرس وتسلسل الأنشطة","goal":["Know lesson plan components and stages, sequencing principles, curriculum/syllabus types and needs analysis.","مكونات الخطة والتسلسل والمنهج"],"sec":[{"h":["Lesson plans: what they contain and why","خطة الدرس: مكوناتها وفائدتها"],"pts":[["A [[lesson plan|en.plan.lessonplan]] is a written outline of the lesson: **objectives**, **procedures** (stages and activities), materials, timing and how learning will be checked.","خطة الدرس مخطط مكتوب يجمع الأهداف والإجراءات والمواد والوقت وطريقة التحقق من التعلم."],["Plan from the learners outwards: consider their **educational and cultural background**, needs and learning styles, then ask 'What will students achieve?'. **Class control** is the least important factor when choosing materials.","ابدأ بالطلاب وخلفيتهم ثم الهدف، وضبط الصف أقل العوامل أهمية عند اختيار المواد."],["A written plan guides the teacher and is a record and evidence for observers, but it does **NOT show students' motivation and performance** — those appear only during the lesson.","الخطة دليل وسجل، لكنها لا تُظهر دافعية الطلاب ولا أداءهم الفعلي."],["Treat the plan as a flexible **roadmap**, not a script; its **assessment** part states how the objectives will be checked, and students' reactions give **feedback** for the next plan.","الخطة خارطة مرنة، وجزء التقويم فيها يبين التحقق من الأهداف، وردود الطلاب تغذية راجعة للخطة القادمة."],["A **skeleton plan** gives only general information; a detailed plan lists each stage, its timing and interaction pattern.","الخطة الهيكلية معلومات عامة فقط، والمفصلة تذكر كل مرحلة ووقتها ونمط التفاعل."]],"t":[["Lesson plan","A written outline of objectives, procedures, materials, timing and assessment.","خطة الدرس"],["Procedures","The tasks and activities for each stage of a lesson.","الإجراءات"],["Interaction patterns","T–S, S–S, pair and group work arrangements.","أنماط التفاعل"],["Skeleton plan","An outline plan containing general information.","خطة هيكل"]]},{"h":["Lesson stages","مراحل الدرس"],"pts":[["A typical lesson moves through stages: **warm-up / lead-in** → presentation → practice → production → **consolidation**.","يمر الدرس بمراحل: تهيئة ثم عرض ثم تدريب ثم إنتاج ثم تثبيت."],["The lead-in introduces the topic and activates background knowledge — prior knowledge is activated here, not in the production stage.","التهيئة تقدّم الموضوع وتنشّط الخبرة السابقة، وهذا مكانها لا مرحلة الإنتاج."],["In [[**presentation → practice → production**|en.plan.ppp]] (PPP), presentation comes first: new language is shown, practised under control, then used freely.","في PPP يأتي العرض أولاً، ثم التدريب الموجّه، ثم الاستخدام الحر.","o"],["Each activity follows lead-in → activity → feedback, and the time for each step is **estimated**, not fixed.","لكل نشاط: تهيئة ثم نشاط ثم تغذية راجعة، ووقته تقديري لا ثابت."],["While students work, the teacher walks around, listens and takes notes — this is **monitoring**; **consolidation** at the end reviews and reinforces the new material.","المتابعة أن يتجول المعلم ويستمع ويدوّن، والتثبيت في النهاية يراجع الجديد ويعززه."]],"t":[["Warm-up / Lead-in","Opening stage that introduces the topic and activates prior knowledge.","التهيئة"],["Consolidation","A stage that reviews and reinforces learning.","التثبيت"],["Wrap-up / Closure","Summarizing the lesson and checking objectives.","الختام"],["Monitoring","Observing students as they work to support and assess them.","المتابعة"]],"map":{"type":"flow","title":["Stages of a lesson","⁧مراحل الدرس⁩"],"groups":[{"n":"Lead-in","ar":"⁧التهيئة⁩","idea":"⁧تقديم الموضوع وتنشيط الخبرة السابقة⁩","items":[{"n":"warm-up"},{"n":"schema"}],"trap":"⁧الخبرة السابقة تُنشَّط هنا لا في الإنتاج⁩"},{"n":"Presentation","ar":"⁧العرض⁩","idea":"⁧تقديم اللغة الجديدة بمعناها وشكلها⁩","items":[{"n":"CCQs"}]},{"n":"Practice","ar":"⁧التدريب⁩","idea":"⁧تدريب موجّه بدقة⁩","items":[{"n":"controlled"},{"n":"monitoring"}]},{"n":"Production","ar":"⁧الإنتاج⁩","idea":"⁧استخدام حر لما تعلّمه⁩","items":[{"n":"freer"}]},{"n":"Consolidation","ar":"⁧التثبيت⁩","idea":"⁧مراجعة الجديد وتعزيزه في النهاية⁩","items":[{"n":"wrap-up"}]}]}},{"h":["Sequencing principles","مبادئ ترتيب الأنشطة"],"pts":[["Order activities from simple → complex, known → unknown, receptive → productive and controlled → free.","رتّب الأنشطة من السهل للصعب، ومن المعروف للجديد، ومن الاستقبال للإنتاج، ومن الموجّه للحر."],["**Whole-to-part** sequencing gives an overview first, then the details.","الترتيب من الكل للجزء يعطي صورة عامة أولاً ثم التفاصيل."],["[[Gradual release|en.plan.gradual]] moves responsibility from teacher to learners — I do → we do → you do — and **scaffolding** is the temporary support removed as they become independent ([[ZPD|en.zpd]]).","نقل المسؤولية تدريجياً: أعمل أنا، ثم نعمل معاً، ثم تعمل وحدك، والسقالات دعم مؤقت يُسحب."],["[[**Backward design**|en.plan.backward]] plans in reverse: desired results → acceptable evidence → learning activities.","التصميم العكسي يبدأ بالنتائج المطلوبة، ثم أدلة تحققها، ثم الأنشطة."],["Across the lesson, activities should be **varied, flexible and coherent**: each one prepares for the next.","الأنشطة متنوعة ومرنة ومترابطة، وكل نشاط يمهّد للذي بعده."]],"t":[["Whole-to-part sequencing","Presenting an overview first, then details.","من الكل للجزء"],["Gradual release of responsibility","I do, we do, you do.","نقل المسؤولية التدريجي"],["Scaffolding","Temporary support withdrawn as learners become independent.","سقالات"],["Backward design","Planning from desired outcomes back to activities (Wiggins & McTighe).","التصميم العكسي"]]},{"h":["Curriculum, syllabus and needs analysis","المنهج والمقرر وتحليل الاحتياجات"],"pts":[["A **curriculum** is the whole plan — goals, content, methods and evaluation; a **syllabus** is narrower: the content of one course and its sequence.","المنهج أشمل: أهداف ومحتوى وطرق وتقويم، والمقرر محتوى المادة الواحدة وترتيبه."],["Selecting and organizing that content is **syllabus design**; a curriculum built on predetermined learner outcomes is **product-oriented**.","اختيار المحتوى وتنظيمه تصميم المقرر، والمنهج المبني على نواتج محددة مسبقاً موجّه بالمنتج."],["Before designing, run a [[**needs analysis**|en.plan.needs]] (design → conduct → analyze) to learn students' interests, abilities, necessities and wants.","قبل التصميم يُجرى تحليل احتياجات لمعرفة اهتمامات الطلاب وقدراتهم وما ينقصهم.","o"]],"t":[["Curriculum","The overall plan: goals, content, methods and evaluation.","منهج"],["Syllabus","The content of a course and its sequence.","مقرر"],["Syllabus design","Selecting and organizing instructional content.","تصميم المقرر"],["Structural syllabus","A syllabus organized by grammar structures.","مقرر بنيوي"],["Product-oriented curriculum","Organized around predetermined learner outcomes.","موجّه بالمنتج"],["Needs analysis","Collecting information about learners' necessities, lacks and wants.","تحليل الاحتياجات"]]},{"h":["Planning across a course","التخطيط على مستوى الفصل والوحدة"],"pts":[["Planning runs from long to short: **scheme of work** (term/year) → **unit plan** (related lessons with shared objectives) → lesson plans.","التخطيط من البعيد للقريب: توزيع المنهج، ثم خطة الوحدة، ثم خطة الدرس."],["Units are sequenced so language is **recycled** and builds towards a **final task or project**; at unit level, backward design starts from results and **essential questions**, then **evidence**, then activities.","الوحدة تعيد اللغة وتبني نحو مهمة ختامية، وتُخطَّط بالنتائج والأسئلة الجوهرية ثم الأدلة ثم الأنشطة."],["Bruner's **spiral curriculum** ([[Bruner|en.bruner]]) revisits key content at increasing complexity.","المنهج الحلزوني عند برونر يعود للمحتوى نفسه بعمق أكبر كل مرة."],["Sharing the **syllabus** at the start shows content, schedule and **expected learning outcomes**; good plans also include a **contingency plan** (Plan B) and homework linked to the objectives.","توزيع المقرر في البداية يوضح المحتوى والجدول والنواتج المتوقعة، والخطة الجيدة فيها خطة بديلة وواجب مرتبط بالهدف."],["The teaching cycle is **preparation** → **implementation** → [[reflection|en.l17-reflect]]: judge what worked, then modify the next plan.","دورة التدريس: تحضير ثم تنفيذ ثم تأمل يعدّل الخطة القادمة."]],"t":[["Scheme of work","A long-term plan distributing syllabus content across a term or year.","توزيع المنهج"],["Unit plan","A plan for a group of related lessons with shared objectives and a final assessment.","خطة الوحدة"],["Spiral curriculum","A curriculum that revisits topics repeatedly at higher levels of complexity (Bruner).","المنهج الحلزوني"],["Contingency plan","An alternative activity prepared in case the main plan does not work.","خطة بديلة"]]},{"h":["Types of syllabus","أنواع المقررات"],"pts":[["Every syllabus is organised around one main unit: grammar, notions/functions, situations, topics, skills, tasks, words or content.","كل مقرر يُنظَّم حول وحدة رئيسة: قواعد أو وظائف أو مواقف أو موضوعات أو مهارات أو مهام أو مفردات أو محتوى."],["[[Wilkins|en.plan.syllabus]] divides them into **synthetic** (language taught piece by piece, e.g. structural) and **analytic** (whole purposeful chunks, e.g. task-based).","عند ويلكنز: التركيبي يقدّم اللغة قطعة قطعة، والتحليلي يقدّمها كتلاً هادفة كاملة."],["Most modern coursebooks combine several of these units in a **multi-strand (integrated)** syllabus.","أغلب الكتب الحديثة تجمع أكثر من وحدة تنظيم في مقرر متعدد الخيوط."]],"t":[["Situational syllabus","A syllabus organised around situations where language is used.","منهج المواقف"],["Topic-based syllabus","A syllabus organised around topics or themes.","منهج الموضوعات"],["Skills-based syllabus","A syllabus organised around language skills and sub-skills.","منهج المهارات"],["Task-based syllabus","A syllabus organised around tasks learners carry out.","منهج المهام"],["Lexical syllabus","A syllabus organised around words, collocations and chunks.","منهج معجمي"],["Synthetic syllabus","Language taught as separate items that learners gradually combine (Wilkins).","منهج تركيبي"],["Analytic syllabus","Language presented in whole meaningful chunks organised by purpose (Wilkins).","منهج تحليلي"],["Multi-strand syllabus","A syllabus integrating several organising strands.","منهج متعدد الخيوط"]],"map":{"type":"tree","title":["Types of syllabus","⁧أنواع المقررات⁩"],"groups":[{"n":"Synthetic","ar":"⁧تركيبي: قطعة قطعة⁩","idea":"⁧ويلكنز: اللغة عناصر منفصلة يجمعها الطالب⁩","items":[{"n":"Structural","ar":"⁧قواعد من السهل للصعب⁩"},{"n":"Lexical","who":"Willis","ar":"⁧مفردات وتلازمات⁩"}]},{"n":"Analytic","ar":"⁧تحليلي: كتل هادفة⁩","idea":"⁧ويلكنز: اللغة كاملة منظمة حسب الغرض⁩","items":[{"n":"Notional-functional","who":"Wilkins","ar":"⁧مفاهيم ووظائف⁩"},{"n":"Situational","ar":"⁧في المطار، في البنك⁩"},{"n":"Task-based","who":"Prabhu, Long","ar":"⁧مهام⁩"},{"n":"Content-based","ar":"⁧مادة دراسية⁩"}]},{"n":"Other organisers","ar":"⁧منظِّمات أخرى⁩","idea":"⁧تُنظّم حول موضوع أو مهارة أو تجمع أكثر من خيط⁩","items":[{"n":"Topic-based","ar":"⁧رياضة، صحة⁩"},{"n":"Skills-based","ar":"⁧مهارات فرعية⁩"},{"n":"Multi-strand","ar":"⁧يجمع الخيوط كلها⁩"}]}]}},{"h":["Lesson planning models","نماذج تخطيط الدروس"],"pts":[["Planning models fix the order of steps: Gagné's nine events start by gaining attention, Hunter's model starts with the anticipatory set, and the 5E model lets learners explore before the teacher explains.","نماذج التخطيط تحدد ترتيب الخطوات: غانييه يبدأ بجذب الانتباه، وهنتر بالتهيئة الحافزة، و5E يجعل الاستكشاف قبل الشرح."],["Whatever the model, an integrated-skills lesson links a receptive skill (reading a text) to a productive one (discussing or writing).","في أي نموذج، الدرس المتكامل يربط مهارة استقبال بمهارة إنتاج."]],"t":[["Gagné's nine events of instruction","A nine-step instructional sequence from gaining attention to transfer.","أحداث التعليم التسعة"],["Anticipatory set","Hunter's opening step that focuses attention and connects to prior learning.","التهيئة"],["5E model","Engage, Explore, Explain, Elaborate, Evaluate.","النموذج الخماسي"]],"map":{"type":"fan","title":["Lesson planning models","⁧نماذج تخطيط الدروس⁩"],"groups":[{"n":"Nine events","who":"Gagné","ar":"⁧من جذب الانتباه وذكر الهدف إلى التقويم والنقل⁩","items":[{"n":"gain attention → … → transfer"}],"d":"en.plan.models"},{"n":"Hunter model","who":"Madeline Hunter","ar":"⁧يبدأ بالتهيئة الحافزة وينتهي بالتدريب المستقل⁩","items":[{"n":"anticipatory set → … → independent practice"}],"d":"en.plan.models"},{"n":"5E model","who":"Bybee (BSCS)","ar":"⁧استقصائي: الاستكشاف قبل الشرح⁩","items":[{"n":"Engage → Explore → Explain → Elaborate → Evaluate"}],"d":"en.plan.models"}]}},{"h":["Classroom management","إدارة الصف"],"pts":[["Seating follows the activity: **rows** for teacher-led input and tests, **clusters** for group projects, **horseshoe / circle** for discussion.","الجلوس حسب النشاط: صفوف للشرح والاختبار، ومجموعات للمشاريع، وحرف U أو دائرة للنقاش."],["Give instructions **before** students move or take materials, then check them with [[**ICQs**|en.plan.icq]] ('Alone or with a partner?'); check meaning with **CCQs**, because 'Do you understand?' usually gets 'yes' without real understanding.","أعط التعليمات قبل الحركة وتحقق منها بأسئلة ICQ، وتحقق من الفهم بأسئلة CCQ لا بسؤال «فاهمين؟»."],["Keep [[**TTT**|en.plan.routines]] low to raise STT, use clear rules and routines, and wait 3–5 seconds after a question (wait time) to increase participation.","قلل كلام المعلم ليزيد كلام الطلاب، وانتظر 3–5 ثوانٍ بعد السؤال لتزيد المشاركة."],["Handle minor misbehaviour with **non-verbal cues** — eye contact, gestures and [[**proximity**|en.plan.manage]] (how closely the teacher works with students) — so the lesson continues.","عالج المخالفات البسيطة بإشارات غير لفظية كالنظر والإيماءة والاقتراب حتى يستمر الدرس."],["Harmer lists the teacher's roles: controller, organizer, assessor, prompter, participant, resource, tutor and observer.","أدوار المعلم عند هارمر: ضابط ومنظم ومقيّم وملقّن ومشارك ومصدر ومرشد ومراقب."]],"t":[["Proximity","The physical distance between teacher and students.","القرب"],["Wait time","The pause after asking a question before calling on a student.","وقت الانتظار"],["Teacher Talking Time (TTT)","The proportion of lesson time in which the teacher talks.","وقت كلام المعلم"],["Student Talking Time (STT)","The proportion of lesson time in which learners use the language.","وقت كلام الطلاب"],["Horseshoe (U-shape)","Desks arranged in a U so all learners can see each other and the teacher.","ترتيب حرف U"],["Signposting","Language that marks the move from one lesson stage to the next.","عبارات الانتقال"]]}],"trap":[["Written lesson plans do NOT show students' motivation and performance.","لا تُظهر الدافعية"],["Prior knowledge is activated in the warm-up, not production.","التهيئة"],["A skeleton plan contains general (not detailed) information.","عامة"]],"vid":[["FuVFjKYQxsw","ar","عناصر كتابة خطة الدرس","الدافورة",18],["4tt_w3ft2R8","en","How Test-Teach-Test really works","Jo Gakonga",7],["jo1Vbop_STc","en","The ultimate guide to ICQs","Jo Gakonga",6]],"n":12},{"id":"L13","d":"D","std":"6.9.6","en":"Resources, Materials & Technology","ar":"مصادر التعلم والمواد والتقنية","goal":["Distinguish authentic from non-authentic materials, know adaptation, graphic organizers and learning technologies.","المواد الأصيلة والتكييف والتقنية"],"sec":[{"h":["Authentic and non-authentic materials","المواد الأصيلة وغير الأصيلة"],"pts":[["[[**Authentic**|en.mat.authentic]] materials were made for real-world purposes, not for teaching — newspapers, web pages, menus; non-authentic (pedagogic) materials such as textbooks and worksheets were designed for learners.","المادة الأصيلة صُنعت لغرض حقيقي كالصحف والقوائم، والكتاب المدرسي مادة غير أصيلة صُممت للتعليم."],["Real culture — customs of greeting, habitation and clothing — is best presented through **authentic** materials, because they show how people actually live and communicate.","عادات التحية والسكن واللباس تُعرض أفضل بمواد أصيلة لأنها تنقل الحياة كما هي."],["For intermediate students preparing a presentation, the most appropriate sources are **news websites**: authentic, current and on real topics.","لطلاب المستوى المتوسط الذين يعدّون عرضاً، مواقع الأخبار أنسب مصدر أصيل وحديث."]],"t":[["Authentic materials","Materials created for native speakers for real communicative purposes.","مواد أصيلة"],["Non-authentic (pedagogic) materials","Materials designed for teaching, e.g. textbooks and worksheets.","غير أصيلة"]]},{"h":["Selecting, evaluating and adapting materials","اختيار المواد وتقويمها وتكييفها"],"pts":[["The main criterion for selecting any material is that it **fulfils learning goals**; because no textbook is perfect, teachers [[**modify and supplement**|en.mat.adapt]] it for each lesson and class.","أهم معيار للاختيار أن تحقق المادة أهداف التعلم، ولأن الكتاب لا يكمل يعدّله المعلم ويضيف إليه."],["Coursebook evaluation is **predictive** (before use, e.g. Cunningsworth's checklist) or **retrospective** (after use); trying a textbook out in class to discover its strengths and weaknesses is **piloting**.","التقويم التنبؤي قبل الاستخدام والاسترجاعي بعده، وتجربة الكتاب في الصف لمعرفة قوته وضعفه تسمى تجريباً."],["McDonough & Shaw's adaptation techniques are adding, deleting, modifying, simplifying and reordering; adding has two forms — **extending** gives more of the same (more practice items), **expanding** adds a new dimension (a new pronunciation stage).","الإضافة نوعان: التمديد يزيد من النوع نفسه كتمارين أكثر، والتوسيع يضيف عنصراً جديداً كمرحلة نطق."],["Moving a vocabulary task before the reading is **reordering**; simplifying makes a text or its instructions easier, and deleting removes part of the material.","نقل نشاط المفردات قبل القراءة إعادة ترتيب، والتبسيط تسهيل النص، والحذف إزالة جزء منه."]],"t":[["Materials adaptation","Adding, deleting, modifying, simplifying or reordering material.","تكييف المواد"],["Piloting","Trying out a textbook in class to evaluate it.","التجريب"],["Adding (extending / expanding)","Supplementing material with more of the same, or with a new dimension.","الإضافة"],["Deleting (subtracting / abridging)","Removing part of the material, either reducing it or omitting a whole section.","الحذف"],["Modifying (rewriting / restructuring)","Changing the content or the classroom organisation of an activity.","التعديل"],["Simplifying","Making a text or instructions easier (vocabulary, sentence length).","التبسيط"],["Reordering","Changing the sequence of activities or units.","إعادة الترتيب"],["Replacing","Substituting material with a more suitable alternative.","الاستبدال"],["Predictive vs retrospective evaluation","Evaluating materials before use vs after using them.","تقويم تنبؤي / استرجاعي"]],"map":{"type":"fan","title":["McDonough & Shaw: adapting","⁧أساليب تكييف المواد⁩"],"groups":[{"n":"Adding","ar":"⁧تمديد من نفس النوع، أو توسيع بعنصر جديد⁩","items":[{"n":"extending"},{"n":"expanding"}],"d":"en.mat.adapt"},{"n":"Deleting","ar":"⁧تقليل الكمية، أو حذف جزء كامل⁩","items":[{"n":"subtracting"},{"n":"abridging"}],"d":"en.mat.adapt"},{"n":"Modifying","ar":"⁧إعادة كتابة المحتوى أو تنظيم الصف⁩","items":[{"n":"rewriting"},{"n":"restructuring"}],"d":"en.mat.adapt"},{"n":"Simplifying","ar":"⁧نص أو تعليمات أسهل⁩","d":"en.mat.adapt"},{"n":"Reordering","ar":"⁧تغيير تسلسل الأنشطة⁩","d":"en.mat.adapt"},{"n":"Replacing","ar":"⁧بديل أنسب: سياق سعودي بدل موضوع غير ملائم⁩","d":"en.mat.adapt"}]}},{"h":["Graphic organizers and visuals","المنظمات التخطيطية والمرئيات"],"pts":[["Each [[graphic organizer|en.mat.organizers]] serves one thinking purpose: a Venn diagram compares and contrasts, a flow chart shows the steps of a process, and a fishbone diagram shows cause and effect.","لكل منظم غرض: مخطط فن للمقارنة، والانسيابي لخطوات العملية، وعظمة السمكة للسبب والنتيجة."],["A concept map shows a central idea and the concepts related to it, while a mind map is a looser web of ideas radiating from one topic.","خريطة المفاهيم فكرة مركزية ومفاهيم مرتبطة بها، والخريطة الذهنية شبكة أفكار حرة حول موضوع."],["A KWL chart frames a topic: before the lesson learners note what they Know and Want to know, and afterwards what they Learned.","جدول KWL: ماذا أعرف وماذا أريد أن أعرف قبل الدرس، وماذا تعلمت بعده."],["A one-page visual that combines images, charts and minimal text is an **infographic**.","الإنفوجرافيك صفحة واحدة تجمع الصور والرسوم البيانية مع نص قليل."]],"t":[["Venn diagram","Overlapping circles for comparing and contrasting.","مخطط فن"],["Flow chart","A diagram showing the steps of a process.","مخطط انسيابي"],["Concept map","A diagram showing a central idea and related concepts.","خريطة مفاهيم"],["Mind map","A visual web of ideas around a central topic.","خريطة ذهنية"],["Infographic","A one-page visual combining images, charts and minimal text.","إنفوجرافيك"],["KWL chart","Know / Want to know / Learned.","جدول KWL"]]},{"h":["Learning technologies: CALL, VLEs and delivery modes","التقنية في التعليم: الحاسب والمنصات وأنماط التعلم"],"pts":[["In CALL, computers are best used as **teacher aids** and self-learning software helps independent learners; CALL software is evaluated by its use in the **teaching and learning process**.","الحاسب مساعد للمعلم، والبرنامج التعليمي يُقيَّم بدوره الفعلي في عملية التعليم والتعلم."],["Blackboard is a **virtual learning environment** (VLE / LMS): an online platform for course content, assignments and tests — not a social network.","بلاك بورد بيئة تعلم افتراضية لإدارة المقرر والواجبات والاختبارات، وليست شبكة اجتماعية."],["[[**Synchronous**|en.mat.sync]] learning happens at the same time for everyone (Skype, a live class); **asynchronous** learning happens at different times (email homework, blogs, wikis).","المتزامن في الوقت نفسه كالحصة المباشرة، وغير المتزامن في أوقات مختلفة كواجب البريد والمدونات."],["Combining online and face-to-face teaching is **blended learning**; a common downside of web resources is **technical problems**.","الجمع بين التعليم الإلكتروني والحضوري تعلم مدمج، وأبرز عيوب مصادر الويب المشكلات التقنية."],["Puentedura's SAMR model has four levels: Substitution and Augmentation enhance a task, while Modification and Redefinition transform it; TPACK names the technological, pedagogical and content knowledge a teacher needs.","في نموذج سامر: الاستبدال والتعزيز يحسّنان المهمة، والتعديل وإعادة التعريف يحوّلانها."]],"t":[["CALL","Computer-Assisted Language Learning.","التعلم بمساعدة الحاسب"],["Virtual learning environment (VLE / LMS)","An online platform for courses (Blackboard, Moodle).","بيئة افتراضية"],["Synchronous learning","Learning that happens at the same time for all participants.","متزامن"],["Asynchronous learning","Learning at different times and places.","غير متزامن"],["Blended learning","Combining online and face-to-face instruction.","تعلم مدمج"],["SAMR","Substitution, Augmentation, Modification, Redefinition.","نموذج سامر"],["TPACK","Technological, Pedagogical and Content Knowledge.","إطار تيباك"]],"map":{"type":"steps","title":["SAMR (Puentedura)","⁧مستويات دمج التقنية⁩"],"brackets":[{"from":0,"to":1,"n":"Enhancement","ar":"⁧تحسين⁩"},{"from":2,"to":3,"n":"Transformation","ar":"⁧تحويل⁩"}],"groups":[{"n":"Substitution","ar":"⁧استبدال⁩","tag":"typing instead of writing"},{"n":"Augmentation","ar":"⁧تعزيز⁩","tag":"spell-check added"},{"n":"Modification","ar":"⁧تعديل⁩","tag":"shared doc with comments"},{"n":"Redefinition","ar":"⁧إعادة تعريف⁩","tag":"video exchange with another school"}]}},{"h":["Digital tools and platforms in the classroom","الأدوات والمنصات الرقمية في الصف"],"pts":[["[[**Madrasati**|en.mat.tools]] (مدرستي) is the Ministry of Education's national e-learning platform (2020), used for classes, lessons, tests and communication with parents.","مدرستي منصة وزارة التعليم الرسمية للتعلم الإلكتروني منذ 2020 للحصص والدروس والاختبارات وأولياء الأمور."],["Each classroom app has a main use: Kahoot for game quizzes, Quizlet for flashcards, Padlet for a digital wall, Edpuzzle for video with questions, Prezi for presentations and OneNote for real-time collaboration.","لكل تطبيق استخدام رئيس: مسابقات، بطاقات، حائط رقمي، فيديو بأسئلة، عروض، وتعاون لحظي."],["For writing, [[**Google Docs**|en.mat.writetools]] lets several students write and edit one document at the same time, **Grammarly** checks grammar, spelling and style, and Word adds a spelling checker, thesaurus and word count.","قوقل دوكس للكتابة التعاونية في وقت واحد، وقرامرلي لتدقيق القواعد والإملاء والأسلوب."],["Learning with phones and tablets is **MALL**, and OCR turns printed text into editable text, which can then be converted into Braille.","التعلم بالجوال والجهاز اللوحي يسمى MALL، والتعرف الضوئي يحوّل المطبوع إلى نص قابل للتحرير."],["Use technology responsibly: the teacher checks [[**Generative AI**|en.mat.digcit]] output for accuracy, level and cultural fit, teaches **digital citizenship** (safety, privacy, copyright, Creative Commons), and judges any app by **learning objectives first**.","راجع مخرجات الذكاء الاصطناعي، وعلّم المواطنة الرقمية، واختر أي تطبيق بالهدف التعليمي أولاً."]],"t":[["Madrasati platform","The Saudi Ministry of Education's national learning management platform.","منصة مدرستي"],["MALL","Mobile-Assisted Language Learning.","التعلم بالأجهزة المحمولة"],["Interactive video","Video with embedded questions or notes that learners respond to (e.g. Edpuzzle).","فيديو تفاعلي"],["Digital citizenship","Safe, responsible and ethical use of technology.","المواطنة الرقمية"],["Creative Commons","Licences that let creators allow others to reuse their work under stated conditions.","رخص المشاع الإبداعي"],["OCR","Optical Character Recognition: converts printed text to editable text.","التعرف الضوئي على الحروف"]]},{"h":["Online platforms for skills practice","المنصات الرقمية لممارسة المهارات"],"pts":[["Match the platform to the skill: text-based posts and blogs give practice in **writing**, while video sites mainly support **listening**.","اختر المنصة حسب المهارة: المنشورات المكتوبة والمدونات للكتابة، ومواقع الفيديو للاستماع غالباً."],["**Online tutoring platforms** connect learners with tutors or proficient speakers for live one-to-one **speaking** practice.","منصات الدروس المباشرة تربط المتعلم بمتحدث متمكن ليمارس المحادثة مباشرة."],["A **vlog** is a video blog and a **vodcast** is a video podcast; both are recorded, one-way input, so they suit listening rather than live interaction.","مدونة الفيديو والبودكاست المرئي محتوى مسجل باتجاه واحد، يناسب الاستماع لا التفاعل المباشر."]],"t":[["Vlog","A video blog: regular video posts by one creator.","مدونة فيديو"],["Vodcast","A video podcast distributed as episodes.","بودكاست مرئي"],["Online tutoring platform","A service that connects learners with tutors for live one-to-one lessons.","منصة دروس مباشرة"]]},{"h":["Learner autonomy and independent learning","استقلال المتعلم والتعلم الذاتي"],"pts":[["[[**Autonomy**|en.mat.autonomy]] is the learner's ability to take charge of their own learning; tasks that let learners control what and how they learn develop it.","الاستقلالية قدرة الطالب على قيادة تعلمه، وتنمو بمهام تمنحه التحكم فيما يتعلم وكيف."],["The best way to encourage autonomy is to **train students to use reference resources**; this **learner training** also covers dictionaries, vocabulary notebooks, goal-setting and self-evaluation.","أفضل طريق للاستقلالية تدريب الطلاب على المراجع، ويشمل المعاجم ودفاتر المفردات وتحديد الأهداف والتقييم الذاتي."],["A **self-access centre** offers materials that learners choose and use on their own — [[graded readers|en.rd.er]], audio, answer keys.","مركز التعلم الذاتي يوفر مواد يختارها الطالب بنفسه كالقصص المتدرجة والتسجيلات ومفاتيح الإجابة."],["**Learning contracts**, learning logs and portfolios build responsibility, and tasks with choice and answer keys let learners correct themselves.","عقود التعلم وسجلاته وملفات الإنجاز تبني المسؤولية، ومفاتيح الإجابة تتيح للطالب تصحيح نفسه."]],"t":[["Learner autonomy","The learner's ability to take charge of their own learning.","استقلال المتعلم"],["Learner training","Explicitly teaching learners strategies and skills for learning on their own.","تدريب المتعلم"],["Self-access centre","A space or platform with materials learners use independently.","مركز التعلم الذاتي"],["Learning contract","An agreement between learner and teacher on goals, tasks and evaluation.","عقد التعلم"],["Learning log","A record in which learners note what they learned and how.","سجل التعلم"]]}],"trap":[["Web pages and newspapers are authentic; textbooks are not.","الأصيل"],["Blackboard = virtual learning environment, not a social network.","بيئة افتراضية"],["Email homework = asynchronous.","غير متزامن"]],"vid":[["MlnLRkSdjo0","en","Module 08: Authentic Materials","American English",11],["dX_nZTiZRPE","en","Synchronous vs Asynchronous Learning","John Spencer",3],["9b5yvgKQdqE","en","What is the SAMR model?","Common Sense Education",4]],"n":13},{"id":"L14","d":"D","std":"6.9.7","en":"Learners: Styles, Differences, Motivation & Culture","ar":"المتعلمون: الأنماط والدافعية والثقافة","goal":["Know learning styles, multiple intelligences, types of motivation, affective factors and culturally responsive planning.","الأنماط والذكاءات والدافعية"],"sec":[{"h":["Learning styles","أنماط التعلم"],"pts":[["Learning styles describe how a learner prefers to take in information: **visual** learners learn by seeing (they remember names by seeing them written), auditory learners by listening and discussion.","البصري يتعلم بالرؤية ويتذكر الأسماء حين يراها مكتوبة، والسمعي بالاستماع والنقاش."],["**Kinesthetic** (tactile) learners prefer physical, hands-on activity — for example, arranging jumbled word cut-outs into a sentence.","المتعلم الحركي يفضّل النشاط باليد والحركة، مثل ترتيب بطاقات كلمات مبعثرة في جملة."],["[[Problem-solving|en.lrn.styles]] tasks work best with **analytic** learners, who prefer step-by-step logic; logical learners make lists and look for relationships.","حل المشكلات يناسب المتعلم التحليلي، والمنطقي يكتب القوائم ويبحث عن العلاقات بين الأشياء."],["Kolb's model, built on his experiential learning cycle, names four styles: diverging, assimilating, converging and accommodating.","نموذج كولب مبني على دورة التعلم بالخبرة، وفيه أربعة أنماط."]],"t":[["Visual learner","Learns best through images and seeing.","بصري"],["Auditory learner","Learns best through listening and discussion.","سمعي"],["Kinesthetic (tactile) learner","Learns best through movement and hands-on activity.","حركي"],["Analytic learner","Prefers step-by-step, logical problem-solving.","تحليلي"],["Kolb's learning styles","Diverging, assimilating, converging, accommodating.","أنماط كولب"]]},{"h":["Cognitive styles and specific learning difficulties","الأساليب المعرفية وصعوبات التعلم"],"pts":[["Cognitive styles are stable ways of processing information: [[**Field-independent**|en.lrn.cogstyles]] learners pick out details apart from their context (analysis), while **field-dependent** learners see the whole and are more socially oriented (Witkin).","المستقل عن المجال يفصل التفاصيل ويحللها، والمعتمد على المجال يرى الكل ويميل للتواصل الاجتماعي."],["**Reflective** learners take time before answering and make fewer errors; **impulsive** learners answer quickly and guess more.","المتروّي يأخذ وقته ويخطئ أقل، والمندفع يجيب بسرعة ويخمّن أكثر."],["Some differences are specific learning difficulties, not styles: [[**Dyslexia**|en.lrn.sen]] is a persistent difficulty with decoding and spelling, helped by **multisensory** techniques, clear fonts and extra time.","عسر القراءة صعوبة دائمة في فك الرموز والإملاء، ويساعده التعليم متعدد الحواس والخط الواضح والوقت الإضافي."],["Learners with **ADHD** need short, varied tasks, clear routines, movement breaks and seating near the teacher.","طالب فرط الحركة يحتاج مهاماً قصيرة متنوعة وروتيناً واضحاً واستراحات حركة وجلوساً قرب المعلم."]],"t":[["Dyslexia","A specific learning difficulty mainly affecting reading accuracy and spelling.","عسر القراءة"],["ADHD","Attention deficit hyperactivity disorder: difficulty with attention, hyperactivity and impulsivity.","فرط الحركة وتشتت الانتباه"],["Field independence / dependence","A cognitive style: perceiving details separately from their context vs perceiving the whole field (Witkin).","الاستقلال / الاعتماد على المجال"],["Reflectivity vs impulsivity","A cognitive style: slow, careful responses vs quick, risk-taking responses.","التروي / الاندفاع"]]},{"h":["Multiple intelligences and differentiated instruction","الذكاءات المتعددة والتعليم المتمايز"],"pts":[["Gardner's [[**multiple intelligences**|en.lrn.mi]] theory says learners have several distinct intelligences, so one activity suits some learners more than others.","نظرية غاردنر: للمتعلم ذكاءات متعددة، فالنشاط الواحد يناسب بعض الطلاب أكثر من غيرهم."],["Word games and crosswords draw on **linguistic** intelligence; group activities develop interpersonal intelligence (working with others), not intrapersonal intelligence (understanding oneself).","الألغاز والكلمات المتقاطعة للذكاء اللغوي، والعمل الجماعي ينمي الذكاء الاجتماعي لا الذاتي."],["[[**Differentiated instruction**|en.lrn.diff]] (Tomlinson) adapts content, process, product and environment to individual needs, so lessons are designed for students' levels and abilities, culture and interests (an interest inventory collects them).","التعليم المتمايز يكيّف المحتوى والطريقة والناتج والبيئة حسب مستوى كل طالب وثقافته واهتماماته."]],"t":[["Multiple intelligences","Gardner's theory of several distinct intelligences.","الذكاءات المتعددة"],["Interpersonal intelligence","Ability to understand and work with others.","اجتماعي"],["Intrapersonal intelligence","Ability to understand oneself.","ذاتي"],["Linguistic intelligence","Sensitivity to words and language.","لغوي"],["Differentiated instruction","Tailoring teaching to individual learners' needs (Tomlinson).","تعليم متمايز"]]},{"h":["Mixed-ability classes: gifted and struggling learners","الفصل متفاوت المستوى: الموهوب والمتعثر"],"pts":[["In a **mixed-ability** class, use **tiered tasks** (same objective, different levels of support), open-ended tasks with many acceptable answers, and extension tasks for fast finishers.","في الفصل المتفاوت: مهام متدرجة لنفس الهدف، ومهام مفتوحة، ومهام إضافية لمن ينهي مبكراً."],["**Flexible grouping** changes groups by purpose: similar-level groups for targeted help, mixed-level groups for peer tutoring.","توزيع المجموعات المرن: متقاربة المستوى للدعم المركز، ومختلطة ليعلّم الطلاب بعضهم."],["Gifted learners need enrichment, acceleration or **curriculum compacting** (skipping mastered content to do advanced work) — not 'more of the same'.","الموهوب يحتاج إثراءً أو تسريعاً أو ضغطاً للمنهج، لا مزيداً من التمارين نفسها."],["Struggling learners benefit from pre-taught vocabulary, small steps, visuals and extra time, plus **remedial** lessons that target the weaknesses found through assessment.","المتعثر يفيده تقديم المفردات مسبقاً وخطوات صغيرة ووقت إضافي ودروس علاجية لضعفه المحدد."]],"t":[["Mixed-ability class","A class with learners of widely different levels and abilities.","فصل متفاوت المستوى"],["Tiered tasks","Versions of a task at different levels of difficulty for the same objective.","مهام متدرجة"],["Open-ended task","A task with many acceptable answers so learners respond at their own level.","مهمة مفتوحة"],["Extension task","Extra, more challenging work for learners who finish early.","مهمة إضافية"],["Enrichment","Deeper or broader learning experiences for able learners.","الإثراء"],["Curriculum compacting","Skipping content a gifted learner has mastered and using the time for advanced work.","ضغط المنهج"],["Remedial teaching","Extra instruction targeting specific weaknesses found through assessment.","التدريس العلاجي"],["Interest inventory","A questionnaire that collects learners' interests to personalise lessons.","استبيان الاهتمامات"]]},{"h":["Motivation","الدافعية"],"pts":[["Motivation is the **key factor** in success or failure, and it is described in two pairs: intrinsic vs extrinsic, and integrative vs instrumental.","الدافعية العامل الأهم في النجاح أو الفشل، وتُقسم إلى زوجين من الأنواع."],["[[**Intrinsic**|en.lrn.motivation]] motivation means the activity is satisfying in itself; **extrinsic** motivation comes from external rewards such as promotion, grades or academic requirements (Deci & Ryan).","الداخلية متعة النشاط نفسه، والخارجية مكافأة من الخارج كالترقية والدرجات ومتطلبات الدراسة."],["**Integrative** motivation is interest in the target people and culture; **instrumental** motivation is practical gain — a job, a scholarship, passing an exam (Gardner & Lambert).","التكاملية حب أهل اللغة وثقافتهم، والنفعية مكسب عملي كوظيفة أو بعثة أو نجاح."],["**Curiosity** motivates from inside, and interactive technology (games, quizzes, multimedia) **raises engagement and motivation**; correcting every mistake demotivates.","الفضول يحفّز من الداخل، والتقنية التفاعلية ترفع الدافعية، وتصحيح كل خطأ يحبط الطالب."],["[[Dörnyei|en.lrn.dornyei]]'s L2 Motivational Self System: motivation grows from the learner's vision of an ideal L2 self, alongside the ought-to self and the learning experience.","عند دورنيي تنمو الدافعية من صورة الطالب المثالية لنفسه متحدثاً باللغة."]],"t":[["Intrinsic motivation","Doing an activity for its own enjoyment and satisfaction.","داخلية"],["Extrinsic motivation","Doing an activity to gain external rewards.","خارجية"],["Integrative motivation","Desire to integrate with the target-language community and culture.","تكاملية"],["Instrumental motivation","Learning for practical gain such as a job or exam.","نفعية"],["L2 Motivational Self System","Dörnyei: ideal L2 self, ought-to self, learning experience.","نظام دورنيي"]],"ex":[["Faisal wants a scholarship (instrumental, extrinsic); Omar reads English novels for fun (intrinsic, integrative).","دافعان مختلفان"]]},{"h":["Affective factors and personality","العوامل الوجدانية والشخصية"],"pts":[["Anxiety and self-restriction are [[**affective**|en.lrn.affect]] factors: feelings, such as foreign language anxiety, that can stop a learner from taking part.","القلق وتقييد النفس عوامل وجدانية، مشاعر قد تمنع الطالب من المشاركة."],["Teachers lower anxiety and build **confidence** by modeling the performance before learners try it, which raises their willingness to communicate.","نمذجة الأداء قبل طلبه تبني الثقة وتخفف القلق وتزيد رغبة الطالب في الكلام."],["Personality matters too: **introverted** learners often prefer quiet, individual work such as an **independent project**, while debates suit extroverts.","الانطوائي يناسبه العمل الفردي الهادئ كالمشروع المستقل، والمناظرات تناسب المنفتح."]],"t":[["Foreign language anxiety","Fear and tension specific to learning/using a foreign language.","قلق اللغة"],["Willingness to communicate","A learner's readiness to speak when given the chance.","الرغبة في التواصل"],["Cross-cultural teaching","Teaching students from different cultural backgrounds.","تدريس عبر الثقافات"],["Introversion","A personality trait marked by preferring reflection and individual work to social interaction.","الانطوائية"]]},{"h":["Culture and participation","الثقافة والمشاركة"],"pts":[["Teaching greetings and social norms is teaching [[**culture**|en.l17-culture]], and nonverbal behaviour is part of it, because **gestures** are culture-specific.","تعليم التحيات والأعراف تعليم للثقافة، والإيماءات منها لأنها تختلف بين الثقافات."],["A multinational class needs **cross-cultural teaching**, and in a Saudi classroom culturally inappropriate texts should be avoided.","الفصل متعدد الجنسيات يحتاج تدريساً عبر الثقافات، وتُتجنب النصوص غير الملائمة للفصل السعودي."],["Students from **collectivist cultures** are often reluctant to **ask questions** in front of the class; small groups and anonymous question slips help.","طلاب الثقافات الجماعية يتجنبون السؤال العلني، وتساعدهم المجموعات الصغيرة والأسئلة المكتوبة دون اسم."],["Immediate public **criticism** discourages participation; praise effort and give [[wait time|en.plan.manage]] before calling on a student.","النقد العلني الفوري يقتل المشاركة، فامدح الجهد وأعطِ وقت انتظار قبل اختيار المجيب."]],"t":[["Collectivist culture","A culture that values group harmony and belonging over individual expression.","ثقافة جماعية"]]}],"trap":[["Remembering names by seeing them = visual.","بصري"],["Working for a promotion = extrinsic (instrumental).","خارجية"],["Group work develops interpersonal (not intrapersonal) skills.","اجتماعي"]],"vid":[["lpdQoTPhZFU","ar","أنماط التعلم","الدافورة",25],["g_ylvanjz10","ar","أنماط التعلم عند كولب","الدافورة",0],["s2EdujrM0vA","en","Theory of Multiple Intelligences explained","Practical Psychology",4],["8BVvImZcnkw","en","Differentiated Instruction: why, how, examples","Teachings in Education",6]],"map":{"type":"cards","title":["Learner Differences","⁧الفروق بين المتعلمين⁩"],"groups":[{"n":"Learning styles","short":"Styles","ar":"⁧أنماط التعلم⁩","idea":"⁧كيف يفضّل الطالب استقبال المعلومة؟⁩","items":[{"n":"VAK / VARK","who":"Fleming (VARK)","ar":"⁧بصري، سمعي، (قرائي)، حركي⁩","kw":["visual","kinesthetic"],"d":"en.lrn.styles"},{"n":"Experiential cycle","who":"Kolb","ar":"⁧أربعة أنماط من دورة الخبرة⁩","kw":["experiential"],"d":"en.lrn.styles"}],"trap":"⁧يتذكر الأسماء حين يراها مكتوبة = بصري⁩"},{"n":"Intelligences","short":"MI","ar":"⁧الذكاءات المتعددة⁩","idea":"⁧قدرات متعددة لا ذكاء واحد⁩","items":[{"n":"Linguistic","who":"Gardner","ar":"⁧ألعاب كلمات وقصص⁩","kw":["crosswords"],"d":"en.lrn.mi"},{"n":"Interpersonal","who":"Gardner","ar":"⁧العمل مع الآخرين⁩","kw":["group work"],"d":"en.lrn.mi"}],"trap":"⁧هوارد غاردنر (الذكاءات) غير روبرت غاردنر (الدافعية)⁩"},{"n":"Motivation","ar":"⁧الدافعية⁩","idea":"⁧العامل الأهم في النجاح أو الإخفاق⁩","items":[{"n":"Intrinsic","who":"Deci & Ryan","ar":"⁧داخلية مقابل خارجية⁩","kw":["extrinsic"],"d":"en.lrn.motivation"},{"n":"Integrative","who":"Gardner & Lambert","ar":"⁧تكاملية مقابل نفعية⁩","kw":["instrumental"],"d":"en.lrn.motivation"},{"n":"L2 Self","who":"Dörnyei","ar":"⁧الذات المثالية — دورنيي⁩","d":"en.lrn.dornyei"}],"trap":"⁧العمل من أجل ترقية = دافعية خارجية⁩"},{"n":"Affective factors","short":"Affect","ar":"⁧العوامل الوجدانية⁩","idea":"⁧المشاعر تفتح باب التعلم أو تغلقه⁩","items":[{"n":"Anxiety","who":"Horwitz","ar":"⁧قلق اللغة الأجنبية⁩","kw":["affective filter"],"d":"en.lrn.affect"},{"n":"WTC","who":"MacIntyre","ar":"⁧الاستعداد للتواصل⁩","kw":["confidence"],"d":"en.lrn.affect"}],"trap":"⁧القلق عامل وجداني⁩"},{"n":"Cognitive styles","short":"Cognitive","ar":"⁧الأساليب المعرفية⁩","idea":"⁧طريقة الإدراك والمعالجة⁩","items":[{"n":"Field indep.","who":"Witkin","ar":"⁧التفاصيل بمعزل عن السياق⁩","d":"en.lrn.cogstyles"},{"n":"Reflective","who":"Kagan","ar":"⁧متروٍّ مقابل مندفع⁩","kw":["impulsive"],"d":"en.lrn.cogstyles"}],"trap":"⁧المستقل عن المجال يحب التحليل والتركيز على الشكل⁩"},{"n":"Differentiation","short":"Differentiate","ar":"⁧التمايز⁩","idea":"⁧نكيّف المحتوى والعملية والناتج والبيئة⁩","items":[{"n":"Tiered tasks","who":"Tomlinson","ar":"⁧نفس الهدف بمستويات دعم⁩","kw":["mixed ability"],"d":"en.lrn.diff"},{"n":"Enrichment","who":"Renzulli","ar":"⁧إثراء للموهوبين⁩","kw":["compacting"],"d":"en.lrn.diff"}],"trap":"⁧الموهوب يحتاج عمقاً لا «مزيداً من الشيء نفسه»⁩"}]},"n":14},{"id":"L15","d":"T","std":"6.9.8","en":"Learning Theories","ar":"نظريات التعلم","goal":["Link each theory to its key figures, concepts and the teaching method it produced.","كل نظرية ورائدها ومفاهيمها"],"sec":[{"h":["Behaviorism: Skinner and Pavlov","السلوكية: سكنر وبافلوف"],"pts":[["Behaviorism sees learning as [[**imitation and habit formation**|en.l15-behav]]: a stimulus produces a response and reinforcement strengthens it; the mind starts as a **blank slate**.","السلوكية: التعلم تقليد وعادات تتكون بالمثير والاستجابة والتعزيز، والعقل صفحة بيضاء."],["[[**B.F. Skinner**|en.skinner]] led behaviorism with operant conditioning: behaviour is shaped by its consequences, so reinforcement follows the **response**.","سكنر رائد السلوكية بالإشراط الإجرائي، والتعزيز فيه يأتي بعد الاستجابة."],["In [[Pavlov|en.pavlov]]'s classical conditioning, learning comes from associating two stimuli, so the reinforcement is linked to the **stimulus**, not to the learner's response.","عند بافلوف في الإشراط الكلاسيكي يرتبط التعلم بالمثير لا باستجابة المتعلم."],["In language teaching, behaviorism produced the **Audio-Lingual Method** (drills and repetition) and Contrastive Analysis, which saw L1 habits as the main source of errors.","ومنها جاءت الطريقة السمعية الشفهية والتحليل التقابلي الذي يرى عادات اللغة الأم سبب الخطأ."]],"t":[["Behaviorism","Learning as habit formation through stimulus, response and reinforcement.","السلوكية"],["Tabula rasa (blank slate)","The behaviorist view that the mind starts empty.","صفحة بيضاء"],["Operant conditioning","Behavior shaped by consequences (reinforcement after a response) — Skinner.","إشراط إجرائي"],["Classical conditioning","Learning by associating stimuli — Pavlov.","إشراط كلاسيكي"]]},{"h":["Nativism: Chomsky and Lenneberg","الفطرية: تشومسكي ولينبرغ"],"pts":[["[[Chomsky|en.chomsky]] (nativism) argued that humans are born with a **Language Acquisition Device (LAD)** and that all languages share **Universal Grammar**.","تشومسكي: الإنسان يولد بجهاز لاكتساب اللغة، وكل اللغات تشترك في قواعد كلية."],["Chomsky's **generative grammar** — a finite set of rules that can produce an infinite number of sentences — is studied under **innatism (nativism)**, not behaviorism.","القواعد التوليدية قواعد محدودة تنتج جملاً لا نهائية، وتُدرس ضمن الفطرية لا السلوكية."],["Chomsky also separated **competence**, the speaker's underlying knowledge of the language, from **performance**, the actual use of that knowledge.","الكفاية معرفة المتكلم الكامنة باللغة، والأداء استعماله الفعلي لها."],["[[Lenneberg|en.lenneberg]]'s **Critical Period Hypothesis** — the ability to acquire language is biologically linked to age — supports nativism, not behaviorism.","فرضية المرحلة الحرجة عند لينبرغ تربط الاكتساب بالعمر، وتدعم الفطرية لا السلوكية."],["For innatists, input alone stimulates acquisition by triggering the LAD; feedback and correction do not change the sequence of development.","عند الفطريين يكفي المدخل لتشغيل جهاز الاكتساب، والتصحيح لا يغيّر ترتيب النمو."]],"t":[["Nativism (innatism)","The view that humans are born with an innate capacity for language.","الفطرية"],["Language Acquisition Device (LAD)","Chomsky's proposed innate mental faculty for language.","جهاز اكتساب اللغة"],["Universal Grammar","Principles and properties shared by all languages.","القواعد الكلية"],["Competence","A speaker's underlying (subconscious) knowledge of the language system.","الكفاية"],["Performance","The actual production and use of language.","الأداء"],["Critical Period Hypothesis","The ability to acquire language is biologically linked to age.","فرضية المرحلة الحرجة"],["Generative grammar","Chomsky's model of the finite set of rules that can generate all grammatical sentences of a language.","القواعد التوليدية"]]},{"h":["Cognitivism: Piaget and Ausubel","المعرفية: بياجيه وأوزوبل"],"pts":[["Cognitivism sees acquisition as active mental **rule formation**: language development follows **cognitive development** (attention, memory, linking new to known).","المعرفية: الاكتساب تكوين قواعد في الذهن، ونمو اللغة يتبع النمو المعرفي."],["[[Piaget|en.piaget]]: **assimilation** fits new information into an existing schema without changing it; **accommodation** changes the schema to fit the new information.","بياجيه: التمثّل إدخال الجديد في المخطط كما هو، والمواءمة تعديل المخطط ليناسب الجديد."],["In Piaget's preoperational stage (**2–7 years**), children use symbols, imagination and memorization; logical reasoning comes only in the later concrete and formal operational stages.","مرحلة ما قبل العمليات من 2 إلى 7 سنوات للرموز والخيال، والتفكير المنطقي يأتي بعدها."],["[[Ausubel|en.ausubel]], also a cognitivist, stressed **meaningful learning**: new material is linked to existing knowledge, for example through an advance organizer.","أوزوبل: التعلم ذو المعنى يربط الجديد بالمعرفة السابقة، مثل المنظم المتقدم."],["Piaget's view is cognitive constructivism — each child builds knowledge through his own activity; Vygotsky's **social constructivism** (next section) adds learning through interaction with others.","بياجيه: الطفل يبني معرفته بنشاطه، وفيجوتسكي يضيف أن المعرفة تُبنى بالتفاعل مع الآخرين."]],"t":[["Cognitivism","Learning as active mental processing and rule formation.","المعرفية"],["Accommodation","Modifying a schema to fit new information.","مواءمة"],["Assimilation","Incorporating new information into an existing schema.","تمثّل"],["Schema","An organized mental structure of knowledge.","مخطط ذهني"],["Cognitive development","The emergence of mental abilities and skills that make up the human intellect.","النمو المعرفي"],["Concrete operational stage","Piaget's stage (about 7–11) when children reason logically about concrete situations.","المرحلة الإجرائية المحسوسة"],["Formal operational stage","Piaget's stage (from about 11) when abstract and hypothetical reasoning develops.","المرحلة الإجرائية الشكلية"]],"map":{"type":"steps","title":["Piaget's stages of cognitive development","⁧مراحل النمو المعرفي عند بياجيه⁩"],"groups":[{"n":"Sensorimotor","ar":"⁧الحس الحركي⁩","tag":"0–2 · object permanence"},{"n":"Preoperational","ar":"⁧ما قبل العمليات⁩","tag":"2–7 · symbols, pretend play"},{"n":"Concrete operational","ar":"⁧العمليات المحسوسة⁩","tag":"7–11 · logic with real things"},{"n":"Formal operational","ar":"⁧العمليات المجردة⁩","tag":"11+ · abstract 'what if'"}]}},{"h":["Constructivism and sociocultural theory: Bruner and Vygotsky","البنائية والنظرية الاجتماعية الثقافية: برونر وفيجوتسكي"],"pts":[["Constructivism holds that learners **construct** knowledge actively; [[Bruner|en.bruner]] applied it through discovery learning and the spiral curriculum.","البنائية: المتعلم يبني معرفته بنفسه، وطبّقها برونر بالتعلم بالاكتشاف والمنهج الحلزوني."],["[[Vygotsky|en.zpd]]'s **Sociocultural theory**: learning happens with a more knowledgeable other inside the **ZPD**: the gap between what a learner can do alone and with help.","فيجوتسكي: التعلم يحدث مع شخص أكثر معرفة داخل منطقة النمو القريبة."],["**Scaffolding** is the temporary support that lets learners work in the ZPD until they can work alone; it also makes input more **comprehensible**.","السقالات دعم مؤقت داخل منطقة النمو يُسحب تدريجياً، ويجعل المدخل أوضح."],["In class, a more capable peer scaffolds a weaker one within the ZPD, and the interactionist view adds that meaningful conversation drives acquisition — hence mixed-ability pairing, collaborative writing and peer feedback.","الزميل الأقدر يدعم الأضعف، والحوار الهادف يدفع الاكتساب، ومنه الكتابة التعاونية وتغذية الأقران."]],"t":[["Zone of Proximal Development (ZPD)","The gap between what a learner can do alone and with help.","منطقة النمو القريبة"],["More Knowledgeable Other (MKO)","A teacher or peer who supports learning.","الأكثر معرفة"],["Scaffolding","Temporary support gradually removed as competence grows.","سقالات"],["Sociocultural theory","Learning as a social process mediated by interaction.","النظرية الاجتماعية الثقافية"],["Discovery learning","Learners find principles for themselves (Bruner).","التعلم بالاكتشاف"],["Social constructivism","The view that knowledge is built through social interaction with more capable others.","البنائية الاجتماعية"]],"map":{"type":"nest","title":["Vygotsky: the Zone of Proximal Development","⁧فيجوتسكي: منطقة النمو القريبة⁩"],"groups":[{"n":"Not yet","tag":"too difficult even with help","ar":"⁧مهام أصعب من قدرته حالياً حتى مع المساعدة⁩"},{"n":"ZPD","tag":"can do with help · MKO · scaffolding","ar":"⁧ما يستطيعه بمساعدة معلم أو زميل أكثر معرفة، وهنا يحدث التعلم⁩","trap":"⁧منطقة النمو القريبة ما يستطيعه بمساعدة، لا ما يفعله وحده⁩"},{"n":"Can do alone","tag":"independent level","ar":"⁧ما يستطيعه وحده دون مساعدة⁩"}]}},{"h":["Humanism and other theories","الإنسانية ونظريات أخرى"],"pts":[["Humanism ([[Maslow|en.maslow]], [[Rogers|en.rogers]]) focuses on the whole learner — feelings, needs and self-actualisation — so learning needs a supportive, low-anxiety classroom.","الإنسانية عند ماسلو وروجرز تهتم بالمتعلم كله: مشاعره وحاجاته، فتحتاج صفاً داعماً بلا قلق."],["Gestalt theory holds that the whole is greater than the sum of its parts, and Bandura's social learning theory says people learn by observing and imitating models.","الجشطالت: الكل أكبر من مجموع أجزائه، وباندورا: التعلم بملاحظة النماذج وتقليدها."],["Theories of writing: **Ecological theory** (Cooper) says writing is shaped by **place, community and local context**.","النظرية البيئية في الكتابة عند كوبر: الكتابة تتشكل بالمكان والمجتمع والسياق المحلي."],["The cognitive theory of writing studies the writer's mental processes — planning, translating, reviewing (Flower & Hayes) — while the sociocultural theory stresses collaboration and peer feedback.","المعرفية في الكتابة تدرس عمليات الكاتب الذهنية، والاجتماعية الثقافية تركز على التعاون."]],"t":[["Ecological theory of writing","A view that writing is shaped by the writer's place, community and local context.","النظرية البيئية في الكتابة"],["Gestalt","The whole is greater than the sum of its parts.","الجشطالت"]]},{"h":["First language acquisition and views of language","اكتساب اللغة الأولى والنظرة إلى اللغة"],"pts":[["Children pass through the same stages: cooing and babbling → one word → two-word **pivot grammar** ('allgone shoe') → **telegraphic speech**, with content words and no function words ('Daddy go car').","مراحل الطفل: مناغاة ثم كلمة ثم كلمتان ثم كلام برقي بلا كلمات وظيفية."],["Children say things they never heard, such as 'I goed', and imitate deep rather than surface structure ('Nobody don't like me'): they apply rules, not just imitate.","الطفل يقول goed ولم يسمعها، ويقلد البنية العميقة لا السطحية، فهو يطبق قواعد."],["Each school explains these facts differently: behaviorists by imitation and reinforcement, nativists by the LAD, cognitivists by rule formation, and interactionists by conversation with caregivers.","كل مدرسة تفسرها بطريقتها: التقليد، أو جهاز الاكتساب، أو تكوين القواعد، أو التفاعل."],["Views of language (Richards & Rodgers): **structural** (a system of related elements), **functional** (a vehicle for functions) and **interactional** (a vehicle for relationships).","النظرة البنيوية ترى اللغة نظاماً، والوظيفية أداة لوظائف، والتفاعلية أداة للعلاقات."]],"t":[["Telegraphic speech","Speech using content words without function words ('Daddy go car').","كلام برقي"],["Pivot grammar","Early two-word combinations ('allgone shoe').","قواعد المحور"],["Structural view of language","Language as a system of structurally related elements for transmitting meaning.","النظرة البنيوية"]]}],"trap":[["Changing existing structures = accommodation; fitting in without change = assimilation.","مواءمة / تمثّل"],["The Critical Period Hypothesis supports nativism, not behaviorism.","الفطرية"],["Blank slate = behaviorism.","السلوكية"]],"vid":[["IhcgYgx7aAA","en","Piaget's Theory of Cognitive Development","Sprouts",7],["EYbCE1udazw","en","Piaget's Schema: Accommodation and Assimilation","Sprouts",6],["8I2hrSRbmHE","en","Vygotsky's Theory of Cognitive Development","Sprouts",5],["2e4GsZFgKQo","en","Behaviorism, Cognitivism, Constructivism","ETH Zurich",9]],"map":{"title":["Learning Theories","⁧نظريات التعلم⁩"],"groups":[{"n":"Behaviorism","ar":"⁧السلوكية⁩","idea":"⁧التعلم عادة تتكوّن بالمثير والاستجابة والتعزيز⁩","items":[{"n":"Classical","who":"Pavlov","ar":"⁧الاشتراط الكلاسيكي⁩","kw":["classical conditioning"],"d":"en.pavlov"},{"n":"Operant","who":"Skinner","ar":"⁧التعزيز بعد الاستجابة⁩","kw":["operant conditioning","reinforcement"],"d":"en.skinner"}],"trap":"⁧ترتبط بالطريقة السمعية الشفهية (ALM): تكرار وتقليد وتجنّب الخطأ⁩"},{"n":"Nativism","ar":"⁧الفطرية⁩","idea":"⁧الطفل يولد بقدرة لغوية فطرية⁩","items":[{"n":"LAD · UG","who":"Chomsky","ar":"⁧جهاز الاكتساب والقواعد الكلية⁩","kw":["LAD","Universal Grammar"],"d":"en.chomsky"},{"n":"Critical period","who":"Lenneberg","ar":"⁧الاكتساب مرتبط بالعمر⁩","kw":["Critical Period Hypothesis"],"d":"en.lenneberg"}],"trap":"⁧تشومسكي هو من انتقد سكنر (1959)، لا العكس⁩"},{"n":"Cognitivism","ar":"⁧المعرفية⁩","idea":"⁧المتعلم يعالج المعلومات ويبني معنى⁩","items":[{"n":"Schemas","who":"Piaget","ar":"⁧تمثّل ومواءمة⁩","kw":["assimilation","accommodation"],"d":"en.piaget"},{"n":"Meaningful","who":"Ausubel","ar":"⁧ربط الجديد بالمعروف⁩","kw":["meaningful learning","advance organizer"],"d":"en.ausubel"}],"trap":"⁧التعلم الآلي (rote) عكس التعلم ذي المعنى عند أوزوبل⁩"},{"n":"Social Constructivism","short":"Constructivism","ar":"⁧البنائية الاجتماعية⁩","idea":"⁧المعرفة تُبنى بالتفاعل مع الآخرين⁩","items":[{"n":"ZPD","who":"Vygotsky","ar":"⁧منطقة النمو القريبة⁩","kw":["ZPD","scaffolding","MKO"],"d":"en.zpd"},{"n":"Discovery","who":"Bruner","ar":"⁧الاكتشاف والمنهج الحلزوني⁩","kw":["discovery learning","spiral curriculum"],"d":"en.bruner"}],"trap":"⁧ZPD هي ما يستطيعه المتعلم بمساعدة، لا ما يفعله وحده⁩"},{"n":"Humanism","ar":"⁧الإنسانية⁩","idea":"⁧مشاعر المتعلم وحاجاته قبل المعلومة⁩","items":[{"n":"Needs","who":"Maslow","ar":"⁧هرم الحاجات⁩","kw":["hierarchy of needs"],"d":"en.maslow"},{"n":"Facilitator","who":"Rogers","ar":"⁧التعلم المتمركز حول المتعلم⁩","kw":["learner-centered","facilitator"],"d":"en.rogers"}],"trap":"⁧طرق مثل CLL والإيحائية (Suggestopedia) تُصنَّف طرقاً إنسانية⁩"}]},"n":15},{"id":"L16","d":"T","std":"6.9.8","en":"Second Language Acquisition Theories","ar":"نظريات اكتساب اللغة الثانية","goal":["Know Krashen's five hypotheses precisely, later SLA theories and the components of communicative competence.","فرضيات كراشن والكفاية التواصلية"],"sec":[{"h":["Krashen's Monitor Model: five hypotheses","نموذج المراقب عند كراشن: الفرضيات الخمس"],"pts":[["[[Krashen|en.sla-krashen]]'s **Monitor Model** is five linked hypotheses; its core claim is that fluency comes from subconscious **acquisition**, not from consciously learned rules.","نموذج كراشن خمس فرضيات مترابطة، وفكرته أن الطلاقة من الاكتساب اللاواعي لا من القواعد."],["The [[Monitor|en.sla-monitor]] is learned knowledge acting as a conscious editor when there is time, focus on form and knowledge of the rule: conscious error correction while speaking is the Monitor, and over-users speak hesitantly.","المراقب محرر واعٍ يصحح الكلام، ومن يُفرط في استخدامه يتكلم بتردد."],["The Natural Order Hypothesis says structures are acquired in a predictable sequence; the Input Hypothesis (i+1) says acquisition comes from comprehensible input slightly above the learner's level — it is about acquisition, not teaching.","الترتيب الطبيعي ثابت ومتوقع، والاكتساب يأتي من مدخل مفهوم أعلى قليلاً من مستوى الطالب."],["The Affective Filter Hypothesis: anxiety, low motivation and low self-confidence raise the filter and block input from being acquired.","القلق وضعف الدافعية والثقة ترفع المرشح الوجداني فتمنع المدخل من الوصول."]],"t":[["Acquisition–Learning Hypothesis","Distinguishes subconscious acquisition from conscious learning.","الاكتساب والتعلم"],["Monitor Hypothesis","Learned knowledge edits output when there is time, focus on form and knowledge of the rule.","المراقب"],["Natural Order Hypothesis","Structures are acquired in a predictable sequence.","الترتيب الطبيعي"],["Input Hypothesis (i+1)","Acquisition results from comprehensible input slightly above current level.","المدخل المفهوم"],["Affective Filter Hypothesis","Emotional factors can block input from being acquired.","المرشح الوجداني"],["Comprehensible input","Input learners can understand, with a little beyond their level.","مدخل مفهوم"]],"map":{"type":"fan","title":["Krashen's Five Hypotheses","⁧فرضيات كراشن الخمس⁩"],"groups":[{"n":"Acquisition–Learning","ar":"⁧اكتساب لا واعٍ مثل الطفل / تعلّم واعٍ للقواعد⁩","items":[{"n":"subconscious"},{"n":"conscious, deliberate"}],"d":"en.sla-krashen"},{"n":"Monitor","ar":"⁧المعرفة المتعلَّمة محرر يصحح الكلام عند توفر الوقت والتركيز ومعرفة القاعدة⁩","items":[{"n":"conscious error correction"}],"d":"en.sla-monitor"},{"n":"Natural Order","ar":"⁧التراكيب تُكتسب بترتيب متوقع⁩","items":[{"n":"predictable order"}],"d":"en.sla-order"},{"n":"Input (i+1)","ar":"⁧مدخل مفهوم فوق المستوى بقليل؛ i هي الكفاية الحالية⁩","items":[{"n":"comprehensible input"},{"n":"i = competence"}],"d":"en.sla-input"},{"n":"Affective Filter","ar":"⁧القلق والخجل وضعف الدافعية ترفعه، والثقة تخفضه⁩","items":[{"n":"anxiety raises it"}],"d":"en.sla-filter"}]}},{"h":["The five stages of second language acquisition","مراحل اكتساب اللغة الثانية الخمس"],"pts":[["Krashen & Terrell's [[**Natural Approach**|en.l16-stages]] described 3 early stages; teacher-education materials extend them to 5, and each stage has its own kind of teacher question.","المنهج الطبيعي وصف 3 مراحل، ومواد إعداد المعلمين مدّتها إلى 5، ولكل مرحلة أسئلتها."],["Stage one, **Preproduction** (the silent period): learners understand but answer by pointing or nodding, so the teacher uses **TPR**, pictures and yes/no questions.","ما قبل الإنتاج: يفهم ولا يتكلم، فنستخدم الاستجابة الجسدية والصور وأسئلة نعم أو لا."],["Stage two, **Early production**: one- or two-word answers and memorised chunks, so the teacher asks **either/or** questions and who/what/where questions.","الإنتاج المبكر: كلمة أو كلمتان، فنسأل أسئلة اختيار وأسئلة من وماذا وأين."],["Stage three, **Speech emergence**: simple sentences with frequent errors, so the teacher uses how/why questions, short stories and dialogues.","ظهور الكلام: جمل بسيطة بأخطاء كثيرة، فنسأل كيف ولماذا ونستخدم القصص والحوارات."],["Stage four, **Intermediate fluency**: complex sentences and opinions ('What would happen if…?'); stage five, **advanced fluency**, is close to native-like and roughly matches Cummins' CALP.","الطلاقة المتوسطة جمل مركبة وآراء، ثم الطلاقة المتقدمة القريبة من الكفاءة الأكاديمية."]],"t":[["Preproduction stage","The first SLA stage: comprehension with little or no speech.","مرحلة ما قبل الإنتاج"],["Early production stage","Learners produce one- or two-word responses and memorised phrases.","الإنتاج المبكر"],["Speech emergence stage","Learners produce simple sentences and short exchanges.","ظهور الكلام"],["Intermediate fluency stage","Learners use more complex sentences and express opinions with fewer errors.","الطلاقة المتوسطة"],["Advanced fluency stage","Learners approach native-like proficiency in social and academic language.","الطلاقة المتقدمة"]],"map":{"type":"steps","title":["Stages of second language acquisition (Krashen & Terrell)","⁧مراحل اكتساب اللغة الثانية⁩"],"groups":[{"n":"Preproduction","ar":"⁧ما قبل الإنتاج⁩","items":[{"n":"silent period"},{"n":"TPR"}],"tag":"understands; points or nods"},{"n":"Early production","ar":"⁧الإنتاج المبكر⁩","items":[{"n":"1–2 words"},{"n":"yes/no"}],"tag":"one- or two-word answers, memorised phrases"},{"n":"Speech emergence","ar":"⁧ظهور الكلام⁩","items":[{"n":"simple sentences"}],"tag":"simple sentences, short exchanges"},{"n":"Intermediate fluency","ar":"⁧الطلاقة المتوسطة⁩","items":[{"n":"opinions"}],"tag":"complex sentences, fewer errors"},{"n":"Advanced fluency","ar":"⁧الطلاقة المتقدمة⁩","items":[{"n":"near-native"}],"tag":"social and academic language"}]}},{"h":["L1 and L2 compared: input, time and performance","بين اللغة الأولى والثانية: المدخل والزمن والأداء"],"pts":[["L1 and L2 acquisition are alike in that both occur through **comprehensible input**, and early L2 learners, like young children, show **limited production** (the silent period).","الاكتسابان يعتمدان على المدخل المفهوم، والمبتدئ في الثانية يمر بفترة صمت مثل الطفل."],["They differ in outcome: L1 is instinctive, rapid and complete, while adult L2 learners usually **do not reach native-like grammatical competence**.","الأولى فطرية سريعة كاملة، والكبير في الثانية نادراً ما يصل لكفاية قواعدية كالناطق الأصلي."],["Cummins: [[BICS|en.sla-bics]], everyday social language, takes about 2 years, while CALP, academic language, takes 5–7 years.","عند كمنز: لغة التواصل اليومي تحتاج نحو سنتين، واللغة الأكاديمية 5–7 سنوات."],["A learner who knows the rule but says 'He run fast' [[**has competence but lacks performance**|en.sla-compperf]]: such slips are **performance** errors (mistakes), not gaps in knowledge.","من يعرف القاعدة ويخطئ فيها لديه الكفاية وينقصه الأداء، وزلته خطأ أداء لا جهل."],["Correcting your own slip while speaking ('I goed… went') shows **metalinguistic awareness**: awareness of language as an object you can think about.","تصحيح الطالب زلّته أثناء الكلام دليل على وعيه بما وراء اللغة."]],"t":[["Silent period","An early stage with little or no L2 production.","فترة الصمت"],["BICS","Basic Interpersonal Communicative Skills.","مهارات التواصل الأساسية"],["CALP","Cognitive Academic Language Proficiency.","الكفاءة الأكاديمية"],["Performance error","A slip in use despite knowing the rule.","خطأ أداء"],["Metalinguistic awareness","Awareness of language as an object one can think about.","الوعي بما وراء اللغة"]]},{"h":["After Krashen: interaction, output, noticing and acculturation","بعد كراشن: التفاعل والمخرج والملاحظة والتثاقف"],"pts":[["Later theories asked whether input alone is enough: Long's [[**Interaction Hypothesis**|en.sla-interaction]] says negotiation of meaning in conversation makes input comprehensible.","لونق: التفاوض على المعنى أثناء الحوار هو ما يجعل المدخل مفهوماً."],["Swain's **Output Hypothesis**: producing language reveals gaps in what learners know, and these gaps are noticed most when learners **talk to others**.","سوين: الإنتاج يكشف للمتعلم فجواته، ويلاحظها أكثر حين يتكلم مع غيره."],["Schmidt's **Noticing** Hypothesis: input must be consciously noticed to become intake — a challenge to Krashen's purely subconscious acquisition.","شميت: المدخل لا يُكتسب حتى يلاحظه المتعلم بوعي، خلافاً لكراشن."],["**Acculturation** ([[Schumann|en.sla-schumann]]): the greater the social and psychological distance from the target-language group, the less the learner acquires.","شومان: كلما زادت المسافة الاجتماعية والنفسية عن أهل اللغة قلّ الاكتساب."],["**Syntactic bootstrapping** means inferring a word's meaning from its position and from the sentence structure around it.","الإقلاع النحوي: استنتاج معنى الكلمة من موقعها وتركيب الجملة حولها."]],"t":[["Interaction Hypothesis","Long: negotiation of meaning in interaction promotes acquisition.","فرضية التفاعل"],["Output Hypothesis","Swain: producing language pushes learners to notice gaps.","فرضية المخرج"],["Noticing Hypothesis","Schmidt: learners must consciously notice input features.","فرضية الملاحظة"],["Acculturation Model","Schumann: social and psychological distance affects acquisition.","نموذج التثاقف"],["Automaticity","Performing a skill without conscious effort.","الآلية"],["Syntactic bootstrapping","Using syntax to infer word meaning.","الإقلاع النحوي"]]},{"h":["More SLA perspectives: skill, identity and usage","منظورات أخرى: المهارة والهوية والاستعمال"],"pts":[["[[**Skill Acquisition Theory**|en.sla-skill]] (DeKeyser) treats
