strategies explicitly","develops learners' speaking fluency","trains learners to decode connected speech"],"نقد «طريقة الفهم»: تشغيل ثم أسئلة يختبر ولا يعلّم."],["L01","n","Which of the following is a METACOGNITIVE listening strategy?",["Checking whether one's prediction about the topic was correct","Recognizing the weak form of 'can'","Identifying the past tense ending -ed","Writing down every word heard"],"مراقبة صحة التوقع وتقويمه استراتيجية ما وراء معرفية، والباقي معالجة من الأسفل."],["L02","n","In which word is the stress on the SECOND syllable?",["decide","table","happy","window"],"de-CIDE: كثير من الأفعال ذات المقطعين تُنبر على الثاني."],["L02","n","A student says 'I will REcord the song' with stress on the first syllable. The correct stress for the verb is:",["reCORD, because many two-syllable verbs stress the second syllable","REcord, because verbs stress the first syllable","Both are equally correct for the verb","Stress never changes word class in English"],"النبر يميّز نوع الكلمة: REcord اسم، أما reCORD ففعل."],["L02","n","'You're coming tomorrow, aren't you?' said with a FALLING tag usually means the speaker:",["is fairly sure and expects agreement","is completely unsure and wants information","is giving an order","is asking for permission"],"الذيل الهابط طلب تأكيد، والصاعد سؤال حقيقي."],["L02","n","Which sentence is most naturally said with RISING intonation?",["Do you like dates?","Where do you live?","Close the door, please.","I live in Taif."],"أسئلة نعم/لا غالباً صاعدة؛ أسئلة wh والأوامر والإخبار هابطة."],["L02","n","'I didn't take YOUR pen.' The capitalized stress is an example of:",["contrastive stress","word stress","a weak form","elision"],"نقل النبر لإبراز التقابل: أخذت قلم غيرك."],["L02","n","Current research on pronunciation teaching for international communication sets the main goal as:",["intelligibility","a perfect native-like accent","mastery of RP only","eliminating all L1 influence"],"الهدف الحديث أن يُفهم المتحدث لا أن يقلد الناطق الأصلي."],["L02","n","A student gives the same talk to three different partners in four, then three, then two minutes. This activity mainly develops:",["fluency","spelling accuracy","listening for gist","pronunciation of minimal pairs"],"تقنية 4/3/2: التكرار مع ضغط الوقت يبني الطلاقة."],["L02","n","According to Jenkins' Lingua Franca Core, which feature is considered LEAST essential for international intelligibility?",["The /θ/ and /ð/ sounds","Vowel length contrasts","Word-initial consonant clusters","Nuclear stress placement"],"الصوتان (/θ/, /ð/) خارج النواة، أما طول الصائت والتجمعات والنبر النووي فمن النواة."],["L03","n","Which is NOT one of Day & Bamford's principles of extensive reading?",["Texts should be above learners' level to challenge them","Learners choose what they want to read","Learners read as much as possible","Reading is its own reward"],"القراءة الموسعة مادتها سهلة، لا أعلى من المستوى."],["L03","n","A young learner is taught the sounds of s, a, t and then blends /s/ /æ/ /t/ to read 'sat'. This is:",["synthetic phonics","analytic phonics","whole-language reading","skimming"],"صوت صوت ثم دمج = الصوتيات التركيبية."],["L03","n","To build reading fluency, students read the same short passage several times, aiming to read more quickly and smoothly each time. This technique is:",["repeated reading","intensive reading","reciprocal teaching","scanning"],"القراءة المتكررة تبني السرعة والدقة والتعبير."],["L04","n","According to Nation's four strands, a well-balanced vocabulary programme gives:",["roughly equal time to meaning-focused input, meaning-focused output, language-focused learning and fluency development","most time to memorizing word lists","most time to translation exercises","no time to deliberate learning"],"الخيوط الأربعة بنسب متقاربة."],["L04","n","Research suggests that for comfortable, unassisted reading a learner should know about ___ of the running words in a text.",["98%","50%","75%","80%"],"98% للفهم المريح (و95% حد أدنى)."],["L04","n","A student knows the meaning of 'commit' but not its collocations, pronunciation or derived forms. The student lacks vocabulary:",["depth","breadth","size","frequency"],"العمق: جودة معرفة الكلمة، والاتساع: عدد الكلمات."],["L04","n","A teacher shows learners 30 corpus lines containing 'make' and 'do' and asks them to discover the patterns. This approach is:",["data-driven learning","the Grammar-Translation Method","the Silent Way","Total Physical Response"],"اكتشاف الأنماط من بيانات المدونة = التعلم من البيانات."],["L04","n","Coxhead's Academic Word List contains:",["570 word families common across academic texts","the 2,000 most frequent English words","every word in a learner's dictionary","technical terms of one subject only"],"AWL = 570 عائلة أكاديمية؛ الألفان الأكثر تكراراً هي GSL."],["L05","n","A teacher underlines errors in an essay and writes codes such as 'sp' and 'vt', but does not write the correct forms. This is:",["indirect corrective feedback","direct corrective feedback","a recast","unfocused direct correction"],"الإشارة للخطأ دون إعطاء الصحيح = تصحيح غير مباشر."],["L05","n","Which researcher argued in 1996 that grammar correction in L2 writing classes is ineffective and should be abandoned?",["Truscott","Ferris","Swain","Halliday"],"تروسكوت 1996، وردّت عليه فيريس 1999."],["L05","n","This week a teacher corrects only article errors in students' essays and ignores other errors. This is:",["focused feedback","unfocused feedback","holistic scoring","peer review"],"تصحيح نوع واحد من الأخطاء = مركّز."],["L05","n","In the genre-based teaching-learning cycle, the teacher and class compose a text together on the board before students write alone. This stage is:",["joint construction","independent construction","deconstruction of a model","building the field"],"الكتابة المشتركة تسبق الكتابة المستقلة."],["L05","n","Combining knowledge of text types with the stages of drafting and revising is known as the:",["process-genre approach","product approach","controlled writing approach","Audio-Lingual approach"],"منهج Badger & White يجمع الجنس والعملية."],["L05","n","A short one-to-one meeting in which the teacher discusses a draft with a student is a:",["writing conference","peer review","portfolio","journal"],"المناقشة الفردية حول المسودة."],["L06","n","Which conditional sentence is correct?",["If it rains tomorrow, we will stay at home.","If it will rain tomorrow, we will stay at home.","If it rains tomorrow, we would stay at home.","If it would rain tomorrow, we stay at home."],"الشرط الأول: if + مضارع، will في الجواب؛ لا will بعد if."],["L06","n","'If I had a million riyals, I would buy a farm.' Which concept-checking question best checks the meaning?",["Do I have a million riyals now?","What is the past participle of 'buy'?","Is 'would' a modal verb?","How do you spell 'million'?"],"سؤال التحقق يفحص المعنى: الموقف خيالي (لا أملك المبلغ)."],["L06","n","'If she had studied, she would have passed.' What does this sentence tell us?",["She did not study and did not pass.","She studied and passed.","She will study and pass.","She studied but did not pass."],"الشرط الثالث ماضٍ غير واقعي: لم تذاكر ولم تنجح."],["L06","n","'If you heat ice, it melts' is an example of the:",["zero conditional","first conditional","second conditional","third conditional"],"حقيقة عامة = الشرط الصفري."],["L06","n","Which is the correct reported form of the question 'Where do you live?'",["She asked me where I lived.","She asked me where did I live.","She asked me where do I live.","She told me where I lived."],"السؤال المنقول بترتيب الخبر وبلا did."],["L06","n","Which sentence uses 'say' and 'tell' correctly?",["He told me that he was tired.","He said me that he was tired.","He told that he was tired.","He said to me tired."],"الفعل tell يحتاج مفعولاً بالشخص، أما say فلا يأخذه مباشرة."],["L06","n","A Saudi student writes 'The honesty is very important in our life.' The error is most likely due to:",["negative transfer of the Arabic definite article used with generic and abstract nouns","overgeneralization of the -ed rule","a pronunciation slip","lack of phonological awareness"],"العربية تقول «الأمانة»، والإنجليزية بلا أداة للتعميم: Honesty is…"],["L06","n","Which sentence uses the noun 'advice' correctly?",["She gave me some useful advice.","She gave me some useful advices.","She gave me an useful advice.","She gave me many useful advice."],"advice غير معدود: لا جمع ولا a/an ولا many."],["L06","n","Which sentence is grammatically correct?",["The accident happened at night.","The accident was happened at night.","The accident is happened at night.","The accident was happen at night."],"happen فعل لازم فلا يُبنى للمجهول."],["L06","n","A teacher wants a meaningful context for practising the present simple passive. The best choice is:",["describing how dates are picked, packed and exported","telling a personal story about last weekend","giving directions to the school","talking about future plans"],"وصف العمليات سياق طبيعي للمبني للمجهول."],["L06","n","Which sentence contains a NON-defining relative clause?",["My father, who lives in Abha, is a doctor.","The man who lives next door is a doctor.","The book that I bought is interesting.","Students who study hard pass."],"غير المحددة معلومة إضافية بين فاصلتين."],["L06","n","A learner writes 'This is the book that I read it last week.' The best explanation is:",["L1 transfer of the Arabic resumptive pronoun in relative clauses","an error in subject–verb agreement","overuse of the zero article","a pronunciation slip"],"العربية: «الكتاب الذي قرأته» فيه ضمير عائد ينتقل للإنجليزية."],["L06","n","Printing the target verb forms in bold in a reading text so that learners notice them is called:",["input enhancement","structured output","a recast","backshift"],"إبراز الشكل بالخط العريض = تعزيز المدخلات (Sharwood Smith)."],["L06","n","In Processing Instruction (VanPatten), after brief explicit information learners mainly:",["work with structured input activities that require attention to form to get meaning","produce the target form in free writing first","memorize rules through choral drills","translate sentences into their L1"],"تعليم المعالجة يقوم على المدخلات المهيكلة قبل الإنتاج."],["L09","n","A learner can understand the main points of clear standard speech on familiar topics, deal with most travel situations and write simple connected text on familiar topics. According to the CEFR, this learner is at:",["B1","A1","C1","C2"],"هذا وصف B1 (المستخدم المستقل)."],["L09","n","In the CEFR, levels B1 and B2 describe the:",["independent user","basic user","proficient user","native user"],"A أساسي، B مستقل، C متمكن."],["L09","n","Which statement about the CEFR is correct?",["It is a framework of reference describing proficiency levels, not a test.","It is a standardized test produced by Cambridge.","It describes English grammar only.","It has four levels from beginner to advanced."],"الإطار مرجع للمستويات الست، وليس اختباراً."],["L09","n","CEFR descriptors are written as positive 'can-do' statements because the framework takes:",["an action-oriented approach that sees learners as social agents","a behaviourist approach based on habit formation","a grammar-translation approach","a norm-referenced approach to ranking learners"],"المنهج الموجه للفعل: ماذا يستطيع المتعلم أن يفعل باللغة."],["L09","n","The 2020 CEFR Companion Volume added new descriptor scales for:",["mediation","handwriting","spelling only","literary periods"],"أضاف الوساطة ومستوى Pre-A1."],["L09","n","Which Cambridge English exam targets CEFR level A2?",["A2 Key (KET)","B1 Preliminary (PET)","C1 Advanced","IELTS General Training"],"اختبار KET يستهدف المستوى A2، واختبار PET يستهدف B1."],["L09","n","A student needs an English test for university admission abroad that has Academic and General Training versions and reports results on a 0–9 band scale. This test is:",["IELTS","TOEFL iBT","B1 Preliminary","A2 Key"],"آيلتس: نسختان ومقياس 0–9."],["L09","n","In which test is the speaking section a face-to-face interview with a live human examiner?",["IELTS","TOEFL iBT","a computer-scored C-test","a multiple-choice grammar test"],"محادثة آيلتس مقابلة حيّة مع ممتحن، وتوفل (حتى مهمة المقابلة المحاكاة منذ 2026) تُسجَّل إجاباتها."],["L10","n","A teacher assesses writing by asking students to find errors in multiple-choice sentences instead of writing a text. This is:",["an indirect test","a direct test","an integrative performance test","a portfolio assessment"],"قياس القدرات الكامنة بدل أداء المهارة = غير مباشر."],["L10","n","Students listen to a recording of directions and complete a map. This listening test technique is:",["information transfer","dictation","cloze","matching headings"],"نقل المعلومات من التسجيل إلى خريطة."],["L10","n","A reading item that most students can answer correctly without reading the passage, using only general knowledge, lacks:",["passage dependence","inter-rater reliability","practicality","washback"],"سؤال القراءة يجب ألا يُجاب إلا بقراءة النص."],["L10","n","Fifteen of 20 students answered an item correctly. The item facility is:",["0.75","0.15","0.25","1.5"],"15 ÷ 20 = 0.75 (سهل نسبياً)."],["L10","n","In a high-scoring group of 10 students, 8 answered an item correctly; in a low-scoring group of 10, 2 did. Using ID = (high correct − low correct) ÷ (½ × total in both groups), the discrimination index is:",["0.6","0.8","0.2","1.0"],"(8 − 2) ÷ 10 = 0.6."],["L10","n","An item is answered correctly by more low-achieving than high-achieving students. The teacher should:",["revise or remove the item, because it has negative discrimination","keep it, because it is very easy","place it first on the test","double its score"],"التمييز السالب علامة سؤال معيب."],["L10","n","In a multiple-choice item, distractor C was chosen by no student. This suggests that distractor C:",["is not functioning and should be revised","is the most effective distractor","is actually the correct answer","makes the item more reliable"],"المشتت الذي لا يختاره أحد غير فعال."],["L10","n","Item analysis shows that most of the class failed all the items linked to one objective. The best use of this information is to:",["reteach that objective and adjust instruction","delete the objective from the syllabus","give the same test again immediately","lower all students' grades"],"تحليل النتائج يوجّه إعادة التدريس."],["L11","n","'By the end of the unit, students will write an 80-word email inviting a friend to an event.' This is best described as a:",["terminal (unit-level) objective","enabling objective","yearly curriculum goal","warm-up activity"],"النتيجة النهائية للوحدة = هدف نهائي."],["L11","n","In the objective 'Students will write five past simple sentences with at least four correct', the phrase 'with at least four correct' is Mager's:",["criterion","performance","condition","audience"],"المعيار: إلى أي درجة."],["L11","n","In the objective 'Given a map, students will describe the route to the school with no more than two errors', the phrase 'Given a map' is the:",["condition","performance","criterion","goal"],"الشرط: الظروف التي يتم فيها الأداء."],["L11","n","A teacher writes 'WALT: give reasons using because' and 'WILF: two reasons with because' on the board. This practice mainly helps to:",["communicate the learning objective and success criteria to students","replace the lesson plan","assess students summatively","reduce wait time"],"عبارة WALT هي نية التعلم، وعبارة WILF هي معيار النجاح."],["L11","n","At the end of a lesson, students write one sentence using the target structure on a card before leaving. This is an:",["exit ticket","anticipatory set","information gap","KWL chart"],"بطاقة الخروج تتحقق من بلوغ الهدف."],["L11","n","In SIOP lesson planning, teachers write two kinds of objectives for each lesson:",["content objectives and language objectives","cognitive and psychomotor objectives only","goals and aims","norm-referenced and criterion-referenced objectives"],"نموذج SIOP: هدف محتوى + هدف لغوي."],["L11","n","In the revised Bloom's taxonomy, the knowledge dimension consists of factual, conceptual, procedural and ___ knowledge.",["metacognitive","affective","declarative","psychomotor"],"البعد الرابع ما وراء المعرفي."],["L12","n","A long-term plan that distributes syllabus content across the weeks of a term is a:",["scheme of work","lesson plan","skeleton plan","contingency plan"],"توزيع المنهج على الأسابيع."],["L12","n","A syllabus organised around situations such as 'at the airport' and 'at the restaurant' is:",["situational","structural","lexical","skills-based"],"المواقف = منهج موقفي."],["L12","n","A syllabus organised around activities such as planning a trip and solving a timetable problem is:",["task-based","structural","notional-functional","lexical"],"المهام = منهج المهام."],["L12","n","A syllabus built around high-frequency words, collocations and lexical chunks is:",["lexical","situational","procedural","topic-based"],"المفردات والمتلازمات = منهج معجمي (Willis)."],["L12","n","According to Wilkins, a syllabus that presents grammar items one at a time for learners to gradually put together is:",["synthetic","analytic","procedural","process"],"تقديم اللغة قطعاً منفصلة = تركيبي."],["L12","n","Students meet the past simple in Grade 7 and revisit it with more complex uses in Grades 8 and 9. This follows the idea of a:",["spiral curriculum","product-oriented curriculum","lexical syllabus","hidden curriculum"],"العودة للموضوع بعمق متزايد = منهج حلزوني (Bruner)."],["L12","n","A teacher plans a unit by first deciding what students must do at the end (an oral presentation), then designing the rubric, and only then choosing activities. This is:",["backward design","forward design","PPP","the Silent Way"],"النتائج ← الأدلة ← الأنشطة."],["L12","n","Which sequence matches the 5E instructional model?",["Engage, Explore, Explain, Elaborate, Evaluate","Engage, Study, Activate","Presentation, Practice, Production","Explain, Engage, Evaluate, Explore, Elaborate"],"الترتيب الصحيح يبدأ بالتهيئة ثم الاستكشاف."],["L13","n","A coursebook unit has only four practice items on comparatives, so the teacher adds six more similar items. In McDonough & Shaw's terms, this is:",["extending","expanding","abridging","reordering"],"زيادة من نفس النوع = extending."],["L13","n","A coursebook lesson has no pronunciation work, so the teacher adds a stage on the stress of compound nouns. This is:",["expanding","extending","simplifying","subtracting"],"إضافة عنصر جديد = expanding."],["L13","n","A teacher rewrites a reading text with shorter sentences and more frequent words for a weaker class. This is:",["simplifying","expanding","reordering","replacing"],"تسهيل اللغة والتراكيب = تبسيط."],["L13","n","A teacher does the vocabulary exercise from the end of the unit before the reading text. This adaptation technique is:",["reordering","deleting","extending","replacing"],"تغيير التسلسل = إعادة ترتيب."],["L13","n","A teacher substitutes a coursebook text on a topic unsuitable for the class with a text about a family trip to AlUla. This is:",["replacing","extending","abridging","simplifying"],"وضع مادة أنسب مكان الأصلية = استبدال."],["L13","n","Evaluating a coursebook with a checklist before deciding to adopt it is:",["predictive evaluation","retrospective evaluation","summative assessment of students","item analysis"],"قبل الاستخدام = تنبؤي، وبعده = استرجاعي."],["L13","n","Which practice BEST helps students become independent learners?",["Training them to keep vocabulary notebooks, use dictionaries and set their own goals","Correcting every error for them","Giving the same worksheet to every student","Allowing only teacher-selected materials"],"تدريب المتعلم على أدوات التعلم يبني الاستقلالية."],["L13","n","A student and teacher sign an agreement on the student's goals, tasks and deadlines for extra reading. This is a:",["learning contract","rubric","lesson plan","placement test"],"عقد التعلم يحمّل الطالب المسؤولية."],["L13","n","The Saudi Ministry of Education's national e-learning platform used for virtual classes, assignments and tests is:",["Madrasati","Rosetta Stone","Prezi","OCR"],"منصة مدرستي هي المنصة الرسمية للوزارة."],["L14","n","In a mixed-ability class, all students work on the same objective, but some get a version with sentence starters and others an open version with no support. This is:",["tiered tasks","whole-class drilling","norm-referenced testing","the Silent Way"],"نفس الهدف بمستويات دعم مختلفة = مهام متدرجة."],["L14","n","A gifted student has already mastered the unit's grammar. The best response is to:",["replace the mastered content with enrichment or advanced project work","give the student twice as many of the same exercises","ask the student to wait quietly","move the student to a lower group"],"ضغط المنهج والإثراء، لا «مزيداً من نفس الشيء»."],["L14","n","Which strategy best supports a struggling learner before a reading task?",["Pre-teaching key vocabulary and giving a graphic organizer","Giving a longer text","Removing all visuals","Asking the learner to read aloud without preparation"],"دعم المتعثر: مفردات مسبقة ومنظِّم بصري."],["L14","n","A learner focuses on details, analyses rules well and prefers form-focused tasks. This learner is probably:",["field-independent","field-dependent","impulsive","kinesthetic"],"الاستقلال عن المجال: تفاصيل وتحليل."],["L14","n","At the start of the year a teacher gives a short questionnaire about students' hobbies and favourite topics to adapt lesson content. This is an:",["interest inventory","aptitude test","achievement test","exit ticket"],"استبيان الاهتمامات لتكييف المحتوى."],["L14","n","A student with dyslexia has persistent difficulty decoding words. A suitable support is:",["multisensory techniques, clear fonts and extra time","timed reading under pressure with no help","extra dictation with penalties","removing the student from all reading activities"],"عسر القراءة: طرق متعددة الحواس ووقت إضافي."],["L16","n","A newly arrived learner understands simple instructions and responds by pointing and nodding but rarely speaks. According to Krashen & Terrell, the learner is in the:",["preproduction stage","speech emergence stage","intermediate fluency stage","advanced fluency stage"],"يفهم ولا يتكلم = ما قبل الإنتاج (الفترة الصامتة)."],["L16","n","A learner answers mainly with one or two words such as 'red car' and memorized phrases. The most suitable teacher questions are:",["either/or and who/what/where questions","questions requiring long, justified opinions","questions about abstract hypothetical situations","none; the teacher should avoid all questions"],"الإنتاج المبكر: أسئلة اختيار وأسئلة قصيرة."],["L16","n","A learner now uses simple sentences in short conversations but still makes many errors. This is the ___ stage.",["speech emergence","preproduction","early production","advanced fluency"],"جمل بسيطة مع أخطاء = ظهور الكلام."],["L16","n","In Oxford's (1990) classification, memory, cognitive and compensation strategies are:",["direct strategies","indirect strategies","social strategies","metacognitive strategies"],"المباشرة تتعامل مع اللغة نفسها."],["L16","n","A learner plans study time, sets weekly goals and evaluates her progress. These are ___ strategies.",["metacognitive","compensation","memory","cognitive"],"التخطيط والتقويم ما وراء معرفية."],["L16","n","A learner who forgets the word 'scissors' says 'the thing you use to cut paper'. In Oxford's classification this is a ___ strategy.",["compensation","memory","affective","social"],"تعويض النقص بالوصف."],["L16","n","Oxford's questionnaire for measuring language learning strategy use is the:",["SILL","MLAT","TOEFL","SOLO"],"Strategy Inventory for Language Learning."],["L16","n","According to Skill Acquisition Theory, practice helps learners move from:",["declarative knowledge to procedural knowledge and automaticity","procedural knowledge to declarative knowledge","acquisition to learning","output to a silent period"],"من معرفة القاعدة إلى استعمالها التلقائي (DeKeyser)."],["L17","n","A teacher treats Indian and Nigerian English as legitimate varieties rather than as errors. This reflects the concept of:",["World Englishes","Contrastive Analysis","fossilization","the Audio-Lingual Method"],"تعدد الإنجليزيات المشروعة (Kachru)."],["L17","n","In English as a Lingua Franca (ELF) research, the main aim of communication between non-native speakers is:",["mutual intelligibility","native-like accuracy","British spelling","avoiding all L1 influence"],"الوضوح المتبادل لا معايير الناطق الأصلي."],["L17","n","According to Byram, the ideal outcome of intercultural language teaching is the:",["intercultural speaker","native speaker","monolingual speaker","professional translator"],"المتحدث بين الثقافات بدل تقليد الناطق الأصلي."],["L17","n","Students plan a presentation in Arabic in their groups and then deliver it in English, using all their languages as resources. This practice is known as:",["translanguaging","negative transfer","the Direct Method","fossilization"],"توظيف كامل المخزون اللغوي كمورد."],["L17","n","Kumaravadivelu suggested that teachers go beyond methods by using general principles such as 'maximize learning opportunities' and 'promote learner autonomy'. These are called:",["macrostrategies","microteaching steps","drills","design features"],"ما بعد الطريقة: الاستراتيجيات الكبرى."],["L17","n","The belief that native speakers are automatically the best English teachers is called:",["native-speakerism","linguistic relativity","Universal Grammar","eclecticism"],"مصطلح Holliday."],["L17","n","According to Medgyes, one advantage of non-native English-speaking teachers is that they:",["can anticipate learners' difficulties and serve as models of successful learners","always have native-like pronunciation","never use the learners' L1","do not need to study grammar"],"مر بنفس التجربة فيتوقع الصعوبات."],["L17","n","A teacher notices low participation, tries a new group technique for two weeks, collects data, reflects and plans again. This is:",["action research","a placement test","the Silent Way","an aptitude test"],"دورة: خطط، نفّذ، لاحظ، تأمّل."],["L17","n","A teacher changes an activity in the middle of a lesson after noticing students' confusion. Schön calls this:",["reflection-in-action","reflection-on-action","action research","peer observation"],"التأمل أثناء الفعل."],["L17","n","A science subject taught entirely in English to Grade 10 students is an example of:",["hard CLIL","soft CLIL","ESP for adults","Grammar-Translation"],"المادة نفسها بالإنجليزية = CLIL قوي."],["L17","n","Teaching about Shakespeare's plays is an example of ___ culture, while teaching how people greet each other is ___ culture.",["Big C / little c","little c / Big C","deep / surface","high-context / low-context"],"الإنجازات الكبرى Big C، والحياة اليومية little c."],["L17","n","A coursebook unit about Jeddah's historic district and Saudi customs mainly presents ___ culture (Cortazzi & Jin).",["source","target","international","Big C only"],"ثقافة المتعلم نفسه = ثقافة المصدر."],["L18","n","The theory that words originated from imitating natural sounds such as 'cuckoo' and 'splash' is called the:",["bow-wow theory","pooh-pooh theory","yo-heave-ho theory","divine source theory"],"محاكاة أصوات الطبيعة."],["L18","n","The theory that language began with instinctive emotional cries such as 'Ouch!' is the:",["pooh-pooh theory","bow-wow theory","yo-heave-ho theory","oral-gesture theory"],"صيحات الانفعال."],["L18","n","Upright teeth, flexible lips, a lowered larynx and a lateralized brain are evidence cited by the ___ view of language origin.",["physiological adaptation","divine source","bow-wow","pooh-pooh"],"التكيف الجسدي لأعضاء النطق والدماغ."],["L18","n","The view that humans are born with a special capacity for language is the:",["genetic source (innateness hypothesis)","natural sound source","social interaction source","oral-gesture source"],"المصدر الوراثي / الفطري."],["L18","n","In Saussure's terms, the sound-image /triː/ is the ___ and the concept 'tree' is the ___.",["signifier / signified","signified / signifier","langue / parole","syntagm / paradigm"],"الصورة الصوتية دال، والمفهوم مدلول."],["L18","n","Studying English as it is used today, without reference to its history, is ___ linguistics.",["synchronic","diachronic","historical","comparative"],"في نقطة زمنية واحدة = تزامني."],["L18","n","In 'The cat sat', the relation between 'cat' and words that could replace it in the same position (dog, bird) is:",["paradigmatic","syntagmatic","diachronic","arbitrary"],"علاقة الاستبدال رأسية = paradigmatic."],["L18","n","The ability to use language to talk about language itself, e.g. asking what 'syntax' means, is called:",["reflexiveness","displacement","prevarication","rapid fading"],"الانعكاسية."],["L18","n","The design feature that allows humans to lie or talk about imaginary things is:",["prevarication","interchangeability","specialization","semanticity"],"القدرة على الكذب والخيال."],["L18","n","An accent in which /r/ is pronounced in words such as 'car' and 'hard' is called:",["rhotic","non-rhotic","RP","Cockney"],"الأمريكي العام ينطق الراء هنا، أما RP فلا ينطقها."],["L01","hn","Recognising word endings, word order and sentence patterns while listening (bottom-up processing) draws mainly on the learner's ___ competence.",["grammatical (linguistic)","sociolinguistic (contextual)","strategic (compensatory)","discourse (textual)"],"المعالجة من الأسفل تبني المعنى من الأصوات والكلمات والقواعد، فتعتمد على المعرفة اللغوية (النحوية). أما المعالجة من الأعلى فتعتمد على الخلفية والسياق."],["L01","hn","Following a set of spoken classroom instructions in order to complete a task mainly develops:",["listening","reading","writing","handwriting"],"فهم التعليمات الشفهية وترتيبها قبل التنفيذ عمل استماع بالدرجة الأولى."],["L02","hn","Practising adjacency pairs (e.g., offer–acceptance) and discourse markers such as 'well' and 'anyway' mainly develops:",["speaking (managing a conversation)","reading (following text structure)","writing (linking paragraphs)","listening (identifying details)"],"الأزواج المتجاورة وأدوات الخطاب تنظّم تبادل الأدوار وربط الكلام في المحادثة، فأكثر ما تخدمه مهارة التحدث."],["L03","hn","Encouraging students to read silently, rather than aloud, mainly helps to build their reading:",["fluency (speed with comprehension)","accuracy (correct pronunciation)","vocabulary (word knowledge)","spelling (letter–sound rules)"],"القراءة الصامتة أسرع وتركّز على المعنى فتبني طلاقة القراءة والفهم، أما الجهرية فتخدم دقة النطق وفك الرموز."],["L03","hn","A reader who works out an unfamiliar word from its prefix, root and suffix, and follows grammatical cues and discourse markers, is using a ___ strategy.",["bottom-up","top-down","field-dependent","concept-driven"],"الاعتماد على الإشارات اللغوية داخل النص (اللواحق والسوابق والقواعد وأدوات الربط) معالجة من الأسفل إلى الأعلى."],["L05","hn","Teaching students the features of different text types mainly helps them decide on the appropriate ___ when they write.",["tense, vocabulary and register","speed of handwriting","spelling of single words","length of the title"],"كل نوع نص (تقرير، رسالة شكوى، قصة) له زمن ومفردات ومستوى رسمية معتاد، فمعرفته توجّه اختيارات الكاتب."],["L05","hn","Which of the following belongs to the PRE-writing stage?",["Freewriting to generate ideas","Proofreading for spelling","Publishing the final copy","Revising after peer feedback"],"الكتابة الحرة مثل العصف الذهني: توليد أفكار قبل كتابة المسودة، فهي من مرحلة ما قبل الكتابة."],["L05","hn","An essay that uses facts, logic and expert opinion to convince readers to accept the writer's position is a(n) ___ essay.",["persuasive","narrative","descriptive","expository"],"الإقناعي يتبنى موقفاً ويدعمه بالأدلة والمنطق ليقنع القارئ؛ التفسيري يشرح فقط دون أن يتبنى موقفاً."],["L05","hn","Arab students' English essays often join ideas with repeated 'and', restate points and stay general, whereas English expects explicit and specific linking. This contrast mainly concerns:",["cohesion and text organisation","morphology and word formation","phonology and sound patterns","orthography and spelling rules"],"هذا ما يسميه Kaplan البلاغة التقابلية: الفرق في طريقة ربط الأفكار وتنظيم النص، أي في التماسك."],["L11","hn","A teacher is planning a single lesson on kitchen utensils. Which is the most appropriate objective?",["By the end of the lesson, students will be able to use the names of five kitchen utensils in sentences.","By the end of the year, students will appreciate the importance of cooking vocabulary.","By the end of the lesson, students will understand the importance of household items in daily life.","By the end of the semester, students will be able to label kitchen tools used around the world."],"هدف الدرس يكون بحدود الدرس نفسه، ومرتبطاً بموضوعه تحديداً، وبفعل قابل للملاحظة والقياس (use)، لا appreciate ولا know."],["L12","hn","Giving students the course syllabus at the start of the term mainly helps the teacher to:",["inform them of the expected learning outcomes","replace the daily lesson plans for the term","grade their homework more quickly and easily","avoid the need for formal assessment"],"توزيع المنهج يوضح للطلاب المحتوى والجدول والنواتج المتوقعة من البداية."],["L12","hn","After finishing a unit, a teacher reviews what worked and what did not, and changes her next lessons accordingly. This phase of the teaching cycle is:",["reflection","preparation","administration","implementation"],"مرحلة التأمل تأتي بعد التنفيذ: الحكم على نجاح التعلم وتعديل التدريس القادم."],["L12","hn","According to the integrated-skills view, an L2 programme should ideally:",["develop the four skills together, linked within lessons","teach listening and speaking for a whole year before any reading","teach only reading and writing","teach each skill in a separate course with no links"],"التواصل الحقيقي يستعمل المهارات معاً، فالأفضل ربطها في الدرس الواحد (قراءة ثم نقاش ثم كتابة) بمستويات تناسب الطلاب."],["L15","hn","In Chomsky's terms, the actual use of language in real situations — what speakers really say, including slips — is called:",["performance","competence","interference","interlanguage"],"الأداء هو الاستعمال الفعلي للغة، والكفاية هي المعرفة الضمنية بنظامها."],["L15","hn","A view of writing that sees every text as shaped by the writer's place, community and local surroundings is the:",["Ecological theory","Cognitive theory","Formalist theory","Behaviorist theory"],"النظرية البيئية ترى الكتابة متأثرة بالمكان والمجتمع والسياق المحلي، بينما المعرفية تركز على عمليات الكاتب الذهنية."],["L18","hn","The most noticeable difference between British and American English that learners meet is in:",["vocabulary","grammar","the alphabet","basic word order"],"الفروق الأوضح في المفردات (lift/elevator) ثم التهجئة والنطق؛ أما القواعد وترتيب الكلمات فمتقاربة جداً."],["L18","hn","The plural ending in 'oxen' and 'children' is a remnant of:",["Old English","borrowing from French","Latin plural rules","modern American usage"],"-en لاحقة جمع قديمة من الإنجليزية القديمة بقيت في كلمات قليلة."],["L15","hn","Chomsky's generative grammar belongs to which view of language acquisition?",["Innatism (nativism)","Behaviorism","Social constructivism","Connectionism"],"القواعد التوليدية لتشومسكي تقوم على قدرة لغوية فطرية = الفطرية."],["L18","hn","Which of the following lists contains only design features of human language?",["arbitrariness, rapid fading, displacement","productivity, generalization, cultural transmission","displacement, duality, receptiveness","arbitrariness, imitation, translation"],"الاعتباطية والتلاشي السريع والإزاحة من خصائص هوكت، أما (generalization, receptiveness, imitation) فليست منها."],["L18","hn","The statement 'every language follows rules and patterns at the level of sounds, words and sentences' shows that language is:",["systematic","random","fixed and unchanging","purely visual"],"اللغة نظام له قواعد وأنماط في كل مستوياتها."]];
window.OFFICIAL = [["L19","The initial sounds in the words 'bear' and 'dare' differ in:",["place of articulation","manner of articulation","alternation","nasalization"],0,"/b/ شفوي ثنائي و/d/ لثوي، وكلاهما مجهور انفجاري، فالفرق في **المخرج** فقط. هذا مثال الدليل على تنظيم السؤال."],["L19","Which of the following is produced with a complete air obstruction?",["/u/","/j/","/t/","/s/"],2,"/t/ انفجاري: قفل كامل ثم انفجار. /u/ صائت بهواء حر، و/j/ شبه حركة، و/s/ احتكاكي."],["L03","Which of the following is an effective strategy for learning new vocabulary while reading in an EFL classroom?",["memorization","guessing","discrete slots","brainstorming"],1,"التخمين من السياق استراتيجية لازم يتقنها الطالب. الحفظ ليس استراتيجية قراءة، وdiscrete slots للنطق، والعصف الذهني للكتابة."],["L08","Anxiety can be reduced in EFL classrooms when teachers ___.",["test students on the material they are working with","function as partners and mentors to students","do not check homework regularly","do not correct students' errors"],1,"المعلم الشريك والمرشد يخفض القلق ويوضح أن الخطأ جزء من التعلم. وترك التصحيح ليس هو الحل، لازم يكون للمعلم استراتيجية في التصحيح."],["L17","From a teaching point of view, students' grammar errors such as 'rided' and 'goed' ___.",["must be eradicated","mean that the student is learning","hinder a student's progress","are a failure to learn correct English"],1,"أخطاء النمو تتبع نمطاً منتظماً، وتعني أن الطالب يتعلم ويكوّن قواعد."],["L18","The function of language to pass on information is called ___.",["transactional","international","interactional","translational"],0,"علمياً الجواب **تبادلية**: نقل المعلومات = transactional. نسخة الدليل المسودة تكتب (c) interactional، لكن شرحها نفسه يقول إن interactional للعلاقات الاجتماعية وtransactional للمحتوى، فالخطأ في المفتاح. والملخصات المتداولة كلها تجاوب transactional."],["L18","The main problem when dealing with the theories of the origin of human language is that ___.",["there are too many of them","they are based on observation","they are not related to primates","they lack scientific evidence"],3,"نظريات نشأة اللغة تخمينية، وما يدعمها دليل علمي."],["L18","The relationship between linguistic form and meaning is ___.",["arbitrary","informative","non-directional","onomatopoeic"],0,"العلاقة اعتباطية، والمحاكاة الصوتية استثناء قليل."],["L18","The ability of human language to refer to things not present in the immediate environment is called ___.",["discreteness","diversity","duality","displacement"],3,"الإزاحة: الكلام عن الغائب، حتى عن أشياء ما نتأكد من وجودها."],["L21","'If you study hard' is ___.",["a simple sentence","an independent clause","a dependent clause","an example of ellipsis"],2,"جملة شرط تابعة، ما تقف وحدها."],["L21","Adverbs can modify all of the following EXCEPT ___.",["other adverbs","nouns","verbs","adjectives"],1,"الظرف يصف الفعل والصفة والظرف، ولا يصف الاسم عادةً (إلا ظروف التركيز مثل only John)."],["L21","In the sentence 'The teacher saw one of the students cheating in the exam', the word 'cheating' is a ___ verb.",["linking","finite","copulative","non-finite"],3,"cheating صيغة ‎-ing بلا زمن، فهي غير متصرفة."],["L19","The vowel in 'two' is ___.",["high front vowel","mid central vowel","high back vowel","low back vowel"],2,"/uː/ عالٍ خلفي مستدير."],["L20","The word 'reopened' consists of ___ morpheme(s).",["one","two","three","four"],2,"re + open + ed = 3."],["L21","The sentence 'Young boys and girls love the adventure playground' is ___.",["syntactically ambiguous","lexically ambiguous","unambiguous","ungrammatical"],0,"هل young تصف الأولاد فقط أم الاثنين؟ هذا غموض تركيبي."],["L22","What a speaker assumes is true or known by a listener can be described as ___.",["entailment","coherence","cohesion","presupposition"],3,"الافتراض المسبق."],["L17","The term 'negative transfer' is used to refer to ___.",["the effect of an unfavorable learning environment on the student","the negative influence of L1 on L2","the imitation of other students' mistakes","the imitation of teachers' mistakes"],1,"النقل السلبي: تأثير اللغة الأم السلبي على الثانية."],["L01","Before starting a listening activity, the teacher should ___.",["set a listening objective","verify predictions","evaluate comprehension","modify listening strategies"],0,"قبل الاستماع حدد الهدف. والتحقق من التوقعات وتقييم الفهم يكونان بعده."],["L03","Reading from the beginning of a text word by word, stopping to look up every unknown vocabulary item until the end, is an example of ___.",["scanning","skimming","bottom-up strategy","top-down strategy"],2,"المعالجة كلمة كلمة بالتسلسل = من الأسفل."],["L05","___ is the first stage in the writing process.",["Reviewing","Editing","Drafting","Evaluation"],2,"بين هذه الخيارات، المسودة أسبقها. وما قبل الكتابة غير موجود في الخيارات."],["L07","___ in language learning is the situation where the learner spends time in an environment operating solely in the target language.",["Immersion","The communicative approach","The direct method","Scaffolding"],0,"الانغماس: بيئة كاملة باللغة الهدف."],["L04","What is the easiest way of presenting the word 'snake' to the learners?",["Defining the word","Using a real snake","Drawing the object on the whiteboard","Using the word in a sentence"],2,"الرسم أسهل وأوضح. والثعبان الحقيقي غير عملي، والتعريف أصعب على الطالب."],["L11","A good learning objective for an elementary English class is: 'At the end of the lesson, learners will be able to ___'.",["listen with the purpose of following directions","listen and talk to native English speakers","listen to a conversation","listen to a conversation and identify various English accents"],0,"هدف محدد قابل للملاحظة ومناسب للمبتدئ."],["L12","In an effective lesson, which stage comes first?",["Expansion","Presentation","Practice","Evaluation"],1,"العرض ثم الممارسة ثم التوسع والتقييم."],["L14","To collect information about students' learning interests and abilities for designing a language lesson, a teacher needs to conduct ___.",["a program evaluation","an assessment plan","a needs analysis","a teaching portfolio"],2,"تحليل الاحتياجات (المعيار 6٫9٫7)."],["L19","Which of the following is a liquid consonant?",["[i]","[l]","[m]","[g]"],1,"/l/ و/r/ أصوات سائلة."],["L08","Projects for producing posters, brochures, and pamphlets are examples of ___.",["the Natural Approach","task-based learning","community language learning","the Structural Approach"],1,"مهام لها ناتج حقيقي = تعلم بالمهمة."],["L08","In ___ setting, students in small groups acquire and apply knowledge and skills to solve real-world situations.",["the Silent Way","a problem-based learning","a grammar-translation","the Direct Method"],1,"التعلم بحل المشكلات."],["L09","To identify learners' strengths and weaknesses and find out what learning still needs to take place, the teacher needs to develop a ___ test.",["proficiency","norm-referenced","diagnostic","achievement"],2,"التشخيصي."],["L09","___ are designed to help teachers roughly monitor students' progress and keep students on their toes.",["Proficiency tests","Placement tests","Pop quizzes","Achievement tests"],2,"الاختبارات القصيرة المفاجئة."],["L09","By using ___, the teacher regularly monitors the students' performance without interrupting the instruction time.",["formative assessment","summative assessment","placement tests","diagnostic tests"],0,"التكويني."],["L09","___ is/are used to guide and inform teaching practice and modify language programs in response to students' needs and abilities.",["Lesson plans","Course description","Assessment information","Course syllabi"],2,"معلومات التقويم."]];
