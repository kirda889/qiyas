language as a skill: **declarative** knowledge (knowing the rule) becomes **procedural** knowledge (using it) and then automaticity through practice.","ديكيسر: معرفة القاعدة تتحول بالتدريب إلى استعمال ثم إلى أداء تلقائي."],["**Investment** ([[Norton|en.sla-norton]]): learners invest in a language when it promises symbolic and material resources, so their effort is tied to **identity**.","نورتن: المتعلم يستثمر في اللغة إذا وعدته بمكاسب، واستثماره مرتبط بهويته."],["[[**Usage-based**|en.sla-usage]] views: learners extract patterns gradually from frequent exposure to real language use, not from an innate grammar.","النظرة المبنية على الاستعمال: الأنماط تُستخرج تدريجياً من تكرار سماع اللغة الحقيقية."]],"t":[["Skill Acquisition Theory","SLA as a skill moving from declarative to procedural knowledge and automaticity (DeKeyser).","نظرية اكتساب المهارة"],["Declarative knowledge","Knowing about something: facts and rules that can be stated.","معرفة تقريرية"],["Procedural knowledge","Knowing how to do something: the ability to use knowledge in performance.","معرفة إجرائية"],["Investment (Norton)","A learner's commitment to learning a language, tied to identity and expected returns.","الاستثمار"]]},{"h":["Communicative competence","الكفاية التواصلية"],"pts":[["[[**Dell Hymes**|en.sla-cc]] coined **communicative** competence, widening Chomsky's competence: knowing not only the grammar but what to say and how to say it appropriately.","هايمز وسّع كفاية تشومسكي: معرفة ما يُقال وكيف يُقال بما يناسب الموقف."],["Canale & Swain's model has grammatical, sociolinguistic, discourse and strategic competence; **discourse** competence was added by Canale in 1983.","مكونات كنال وسوين أربعة: قواعدية واجتماعية لغوية وخطابية واستراتيجية."],["Producing a cohesive, coherent text with links between sentences (intersentential) is **discourse** competence; saying 'an animal that lives in water' for 'fish' is **strategic** competence.","ربط الجمل في نص متماسك كفاية خطابية، والتعويض عن كلمة منسية كفاية استراتيجية."],["Understanding the function of a spoken utterance — that 'It's cold in here' may be a request — is **pragmatic** competence.","فهم وظيفة العبارة وقصد المتكلم منها كفاية تداولية."]],"t":[["Communicative competence","Knowing how to use language appropriately in context (Hymes).","الكفاية التواصلية"],["Grammatical competence","Knowledge of vocabulary, grammar and pronunciation rules.","قواعدية"],["Sociolinguistic competence","Using language appropriately for the social context.","اجتماعية لغوية"],["Discourse competence","Producing and understanding cohesive, coherent texts.","خطابية"],["Strategic competence","Using strategies to compensate for gaps and repair breakdowns.","استراتيجية"],["Pragmatic competence","Understanding the function and intention of utterances.","تداولية"],["Circumlocution","Describing a word you don't know with other words.","الشرح بكلمات أخرى"]]},{"h":["Learning strategies and the good language learner","استراتيجيات التعلم والمتعلم الجيد"],"pts":[["[[Oxford|en.sla-oxford]] (1990) divides strategies into direct (memory, cognitive, compensation) and indirect (metacognitive, affective, social), and measures them with the **SILL** questionnaire.","أكسفورد: استراتيجيات مباشرة وغير مباشرة، وتقيسها باستبانة SILL."],["O'Malley & Chamot use three groups instead: metacognitive, cognitive and social/affective strategies.","أومالي وشاموت يقسمانها ثلاثة: ما وراء معرفية ومعرفية واجتماعية وجدانية."],["The [[**Good language learner**|en.l16-gll]] (Rubin, 1975) guesses willingly, wants to communicate and is not inhibited by mistakes.","المتعلم الجيد عند روبن يخمّن بجرأة ويريد التواصل ولا تمنعه الأخطاء."]],"t":[["Direct strategies","Oxford: memory, cognitive and compensation strategies that work directly with the language.","استراتيجيات مباشرة"],["Indirect strategies","Oxford: metacognitive, affective and social strategies that support learning.","استراتيجيات غير مباشرة"],["Memory strategies","Techniques for storing and retrieving new information (grouping, imagery, rhymes).","استراتيجيات الذاكرة"],["Cognitive strategies","Mental operations on the language: practising, analysing, summarising.","استراتيجيات معرفية"],["Compensation strategies","Strategies to overcome gaps in knowledge, such as guessing or using synonyms.","استراتيجيات تعويضية"],["Metacognitive strategies","Planning, monitoring and evaluating one's own learning.","استراتيجيات ما وراء المعرفة"],["Affective strategies","Managing emotions, anxiety and motivation.","استراتيجيات وجدانية"],["Social strategies","Learning with and through others: asking questions, cooperating.","استراتيجيات اجتماعية"],["SILL","Strategy Inventory for Language Learning: Oxford's strategy questionnaire.","استبانة أكسفورد"]],"map":{"type":"fan","title":["Oxford (1990): learning strategies","⁧استراتيجيات التعلم عند أكسفورد⁩"],"groups":[{"n":"Direct","ar":"⁧تتعامل مع اللغة نفسها: ذاكرة (تصنيف وصور)، معرفية (تدريب وتلخيص)، تعويضية (تخمين وإيماء وشرح بكلمات أخرى)⁩","items":[{"n":"memory"},{"n":"cognitive"},{"n":"compensation"}],"d":"en.sla-oxford"},{"n":"Indirect","ar":"⁧تدير التعلم: ما وراء معرفية (تخطيط وتقويم ذاتي)، وجدانية (خفض القلق)، اجتماعية (طلب التوضيح)⁩","items":[{"n":"metacognitive"},{"n":"affective"},{"n":"social"}],"d":"en.sla-oxford"}]}}],"trap":[["Conscious error correction while speaking = Monitor Hypothesis.","المراقب"],["Anxiety raises the affective filter.","يرتفع"],["The Input Hypothesis focuses on acquisition, not teaching.","الاكتساب"]],"vid":[["NiTsduRreug","en","Stephen Krashen on Language Acquisition","Mark Rounds",15],["8qjLXjCqNyA","en","Krashen's Theory of SLA","Teacher Rafa",8],["45W5ucCLYqM","en","Unpacking terms: Communicative Competence","Unpacking language pedagogy",9]],"map":{"type":"cards","title":["SLA Theories","⁧نظريات اكتساب اللغة الثانية⁩"],"groups":[{"n":"Krashen","ar":"⁧الاكتساب بالمدخل المفهوم⁩","items":[{"n":"Monitor Model","who":"Krashen","ar":"⁧الطلاقة من الاكتساب لا من القواعد⁩","d":"en.sla-krashen"},{"n":"Natural Approach","who":"Krashen & Terrell","ar":"⁧الفهم أولاً ثم يظهر الكلام تدريجياً⁩","d":"en.l16-stages"}],"trap":"⁧فرضية المدخل تخص **الاكتساب** لا التدريس، و i هي الكفاية الحالية⁩"},{"n":"Interaction","ar":"⁧التفاعل والإنتاج⁩","items":[{"n":"Interaction","who":"Long","ar":"⁧التفاوض على المعنى⁩","d":"en.sla-interaction"},{"n":"Output","who":"Swain","ar":"⁧الإنتاج يكشف الفجوة⁩","d":"en.sla-interaction"},{"n":"Noticing","who":"Schmidt","ar":"⁧لا مأخوذ بلا ملاحظة⁩","d":"en.sla-interaction"}]},{"n":"Cognitive","ar":"⁧اللغة مهارة وكفاءة⁩","items":[{"n":"Skill Acquisition","who":"DeKeyser","ar":"⁧تقريرية ← إجرائية ← آلية⁩","d":"en.sla-skill"},{"n":"Usage-based","who":"N. Ellis · Tomasello","ar":"⁧الأنماط من تكرار الاستعمال⁩","d":"en.sla-usage"},{"n":"BICS / CALP","who":"Cummins","ar":"⁧سنتان للتواصل، 5–7 للأكاديمية⁩","d":"en.sla-bics"}]},{"n":"Social","ar":"⁧المجتمع والهوية⁩","items":[{"n":"Acculturation","who":"Schumann","ar":"⁧المسافة الاجتماعية والنفسية⁩","d":"en.sla-schumann"},{"n":"Investment","who":"Norton","ar":"⁧الاستثمار والهوية⁩","d":"en.sla-norton"}]},{"n":"Competence","ar":"⁧ماذا يكتسب المتعلم؟⁩","items":[{"n":"Communicative competence","who":"Hymes","ar":"⁧صاحب المصطلح⁩","d":"en.sla-cc"},{"n":"Four components","who":"Canale & Swain","ar":"⁧قواعدية، اجتماعية لغوية، خطابية، استراتيجية⁩","d":"en.sla-cc"},{"n":"Pragmatic competence","who":"Bachman","ar":"⁧فهم وظيفة العبارة وقصد المتكلم⁩","d":"en.sla-cc"}]}]},"n":16},{"id":"L17","d":"T","std":"6.9.9","en":"Learner Language, Individual Differences & TESOL","ar":"لغة المتعلم والفروق وتعليم الإنجليزية","goal":["Distinguish positive/negative transfer, interlingual/intralingual errors, interlanguage and fossilization; know TESOL terms.","النقل والأخطاء واللغة البينية"],"sec":[{"h":["Contrastive Analysis and transfer (Lado, 1957)","التحليل التقابلي والنقل: لادو 1957"],"pts":[["[[**Contrastive Analysis**|en.l17-ca]] (Lado, 1957) compared the L1 with the target language to predict difficulties; it is linked to **behaviorism**, which saw old L1 habits interfering with new L2 habits.","لادو قارن اللغتين ليتنبأ بالصعوبة، وفكرته سلوكية: عادات اللغة الأم تتدخل في الجديدة."],["Applying L1 knowledge to the L2 is **transfer**; when the two languages have similar structures, it gives correct output — **positive transfer**.","تطبيق معرفة اللغة الأم على الثانية نقل، وإذا تشابهت التراكيب كان النقل إيجابياً."],["**Negative transfer** (interference) is the negative influence of L1 on L2: Arab learners say 'I came here five years before' for 'ago', 'pen blue' (adjective after the noun) and 'the man whom I met him' (a pronoun kept from Arabic).","النقل السلبي أثر العربية الخاطئ، مثل pen blue لأن الصفة بعد الموصوف في العربية.","o"],["L1 influence is usually **most noticeable in phonology**: a [[foreign accent|en.spk.arab]] remains after grammar and vocabulary advance — for example, Arab learners merging /p/ and /b/.","أوضح أثر للغة الأم في النطق، فاللكنة تبقى بعد تحسن القواعد والمفردات."],["Teachers should analyze [[**errors**|en.spk.errors]] to find inappropriate L1 transfer, and expect learners to use their L1.","حلّل أخطاء الطلاب لتكتشف النقل الخاطئ من العربية، وتوقّع أنهم سيستخدمون لغتهم الأم."]],"t":[["Contrastive Analysis","Comparing L1 and L2 to predict learning difficulties (Lado).","التحليل التقابلي"],["Transfer","Applying L1 knowledge to the L2.","النقل"],["Positive transfer","L1–L2 similarity leads to correct L2 production.","نقل إيجابي"],["Negative transfer (interference)","L1 patterns cause errors in L2.","نقل سلبي"],["Foreign accent","Pronunciation features carried over from the first language.","لكنة أجنبية"]]},{"h":["From Error Analysis to interlanguage (Corder → Selinker)","من تحليل الأخطاء إلى اللغة البينية: كوردر ثم سيلينكر"],"pts":[["CA's predictions often failed — many real errors did not come from the L1 — so [[Error Analysis|en.l17-ea]] (Corder, 1967) studied the errors learners actually make, as evidence of learning.","لما فشلت تنبؤات التحليل التقابلي جاء كوردر بدراسة الأخطاء الفعلية كدليل على التعلم."],["Error Analysis sorts errors by source: **interlingual** errors come from the L1 (negative transfer), **intralingual** errors come from the target language itself.","الخطأ بين اللغتين مصدره اللغة الأم، والخطأ داخل اللغة مصدره قواعد الإنجليزية نفسها."],["Errors such as 'rided' and 'goed' **mean the student is learning**: they are developmental, and this **Overgeneralization** of a rule also produces 'writed', 'tooths', 'childs' and 'swimmed'.","أخطاء مثل goed علامة تعلم، فهي تعميم زائد لقاعدة صحيحة على كلمات شاذة.","o"],["Selinker (1972) called the learner's developing system — between L1 and L2, with its own rules — [[**interlanguage**|en.l17-il]].","سيلينكر سمّى نظام المتعلم المتطور بين اللغتين لغة بينية لها قواعدها الخاصة."],["When L1–L2 differences cause **negative transfer** that is repeated without noticing or feedback, incorrect forms become permanent: **fossilization**; a decrease in proficiency from disuse or L2 influence is **attrition**.","تكرار الخطأ بلا ملاحظة أو تغذية راجعة يسبب التحجر، أما التآكل فضعف اللغة بترك استخدامها."]],"t":[["Error analysis","Studying learners' errors as evidence of learning (Corder).","تحليل الأخطاء"],["Interlingual error","An error caused by L1 interference.","خطأ من اللغة الأم"],["Intralingual (developmental) error","An error caused by the target language itself.","خطأ داخل اللغة الهدف"],["Overgeneralization","Applying a rule too widely ('goed', 'tooths').","تعميم زائد"],["Interlanguage","The learner's evolving language system between L1 and L2 (Selinker).","لغة بينية"],["Fossilization","Incorrect forms that become permanent and resist correction.","تحجّر"],["Language attrition","Loss of language proficiency over time.","تآكل اللغة"]]},{"h":["Individual differences and learner behaviour","الفروق الفردية وسلوك المتعلم"],"pts":[["SLA research groups learner differences into categories: age, personality and experience are **individual** factors, and anxiety and self-restriction are [[**affective**|en.lrn.affect]] factors; **Technological** factors are NOT a category.","العمر والشخصية والخبرة عوامل فردية، والقلق عامل وجداني، والتقنية ليست من الفئات."],["Fluency, accuracy and complexity are classed as **cognitive** factors; strictly, they are the three dimensions used to describe L2 performance (Skehan, 1998).","الطلاقة والدقة والتعقيد تُصنف عوامل معرفية، وهي في الأصل أبعاد لوصف الأداء."],["Aptitude, a natural ability to learn languages, is measured by Carroll's MLAT, and the learning strategies a learner uses (Oxford) are another individual difference.","الاستعداد اللغوي قدرة طبيعية يقيسها اختبار كارول، والاستراتيجيات فرق فردي آخر."],["**Avoidance**: learners steer clear of difficult words or structures to escape errors or embarrassment, so the absence of an error does not prove mastery.","التجنب: يتحاشى الطالب التراكيب الصعبة خوفاً من الخطأ، فغياب الخطأ لا يعني الإتقان."]],"t":[["Aptitude","A natural ability to learn languages (Carroll's MLAT).","استعداد"],["Learning strategies (Oxford)","Memory, cognitive, compensation, metacognitive, affective, social.","استراتيجيات التعلم"],["Affective factors","Emotional variables such as anxiety, self-esteem and inhibition.","عوامل وجدانية"],["Avoidance","Not using difficult or unfamiliar language forms to escape errors.","التجنب"]]},{"h":["Bilingualism and TESOL terms","الثنائية اللغوية ومصطلحات تعليم الإنجليزية"],"pts":[["A person fluent in two languages is **bilingual**; alternating between them in one conversation is [[**code-switching**|en.l17-bilingual]], and using two varieties of one language for different functions (Standard and colloquial Arabic) is diglossia.","إتقان لغتين ثنائية، والتنقل بينهما تناوب لغوي، والفصحى والعامية ازدواجية."],["**TESOL** is Teaching English to Speakers of Other Languages, **TEFL** is Teaching English as a Foreign Language, and ESL is English used in the surrounding community.","تيسول تعليم الإنجليزية لغير الناطقين بها، وتيفل تعليمها لغة أجنبية، أما ESL فلغة المجتمع المحيط."],["ESP is English for Specific Purposes and EAP for Academic Purposes; workplace **ESP** courses are tailored to job-related needs (cabin crew, nurses, engineers).","الإنجليزية لأغراض خاصة تُصمم لحاجات العمل كالمضيفين والممرضين والمهندسين."]],"t":[["Bilingual","Fluent in two languages.","ثنائي اللغة"],["Code-switching","Alternating between two languages in conversation.","تناوب لغوي"],["Diglossia","Two varieties of one language used for different functions.","ازدواجية"],["TESOL","Teaching English to Speakers of Other Languages.","تيسول"],["TEFL","Teaching English as a Foreign Language.","إنجليزية لغة أجنبية"],["ESL","English as a Second Language (used in the surrounding community).","لغة ثانية"],["ESP","English for Specific Purposes (medicine, aviation, business).","لأغراض خاصة"],["EAP","English for Academic Purposes.","لأغراض أكاديمية"],["Culture shock","Honeymoon, frustration, adjustment, adaptation.","صدمة ثقافية"]]},{"h":["TESOL and related disciplines","علاقة تعليم الإنجليزية بالعلوم الأخرى"],"pts":[["TESOL draws on theories of **cognitive development** and on several fields: [[**Psycholinguistics**|en.l17-disc]] studies language in the mind, **sociolinguistics** language in society, and neurolinguistics language and the brain.","تعليم الإنجليزية يستفيد من علوم: النفسي للعقل، والاجتماعي للمجتمع، والعصبي للدماغ."],["Educational psychology informs motivation and assessment, anthropology informs culture, computer science gives CALL, and **corpus linguistics** gives word lists drawn from [[corpora|en.voc.corpus]].","علم النفس للدافعية والتقويم، والأنثروبولوجيا للثقافة، ولسانيات المدونات لقوائم الكلمات."],["[[**CLIL**|en.meth.cbi]] teaches content through English: **hard (strong) CLIL** teaches a school subject in English, while soft (weak) CLIL is an English course built on subject topics.","CLIL القوي يدرّس مادة بالإنجليزية، والخفيف مقرر إنجليزي يستعمل موضوعات المواد."],["**Cross-curricular links** — science texts, maths word problems — give language a real purpose and build CALP.","ربط الإنجليزية بالمواد الأخرى يعطي اللغة هدفاً حقيقياً ويبني اللغة الأكاديمية."]],"t":[["Psycholinguistics","The study of the mental processes involved in language use and acquisition.","علم اللغة النفسي"],["Sociolinguistics","The study of language in relation to society and social factors.","علم اللغة الاجتماعي"],["Corpus linguistics","The study of language through large computer-stored collections of real texts.","لسانيات المدونات"],["Hard vs soft CLIL","Subject-led CLIL (content taught in English) vs language-led CLIL (language course using subject content).","CLIL قوي / خفيف"],["Cross-curricular links","Connections between English lessons and other school subjects.","روابط بين المواد"]]},{"h":["Culture in TESOL","الثقافة في تعليم الإنجليزية"],"pts":[["Some see **culture** as the fifth skill; it includes **Big C culture** (literature, art, history, institutions) and little c culture (customs, food, greetings, values).","الثقافة عند بعضهم المهارة الخامسة، وفيها ثقافة كبرى كالأدب وثقافة يومية كالعادات."],["Cortazzi & Jin: materials may present the **source culture** (the learners' own), the target culture or an international culture.","كورتازي وجن: المواد تعرض ثقافة الطالب نفسه، أو ثقافة اللغة الهدف، أو ثقافة دولية."],["[[**Linguistic relativity**|en.l17-culture]] (Sapir–Whorf): the weak version — language **influences** thought — has support; the strong version, that language determines thought, is rejected.","النسبية اللغوية: الصيغة الضعيفة أن اللغة تؤثر في التفكير مقبولة، والقوية مرفوضة."],["**Linguistic imperialism** (Phillipson) is the view that the spread of English can reinforce inequality.","الإمبريالية اللغوية عند فيليبسون: انتشار الإنجليزية قد يرسّخ عدم المساواة."],["Good practice: compare cultures without judging, challenge **stereotypes**, and start from familiar local culture and Saudi values.","قارن الثقافات دون أحكام، وواجه الصور النمطية، وابدأ من الثقافة المحلية والقيم السعودية."]],"t":[["Big C culture","Formal culture: arts, literature, history and institutions.","الثقافة الكبرى"],["Little c culture","Everyday culture: customs, routines, behaviour and values.","الثقافة اليومية"],["Source / target / international culture","Cortazzi & Jin's three types of cultural content in materials.","أنواع المحتوى الثقافي"],["Linguistic relativity","The Sapir–Whorf idea that language influences how speakers think and perceive.","النسبية اللغوية"],["Linguistic imperialism","Phillipson's view that English dominance maintains structural inequalities.","الإمبريالية اللغوية"],["Stereotype","An oversimplified, generalised belief about a group of people.","صورة نمطية"]]},{"h":["Recent trends in TESOL","الاتجاهات الحديثة في تعليم الإنجليزية"],"pts":[["The recent trends share one direction: away from [[**native-speaker norms**|en.l17-we]] towards intelligibility, intercultural skill and the learner's whole language repertoire.","الاتجاهات الحديثة تنتقل من تقليد الناطق الأصلي إلى الوضوح والتواصل بين الثقافات."],["World Englishes and English as a Lingua Franca accept many varieties of English, and translanguaging lets learners use their full repertoire, Arabic included, to make meaning.","الإنجليزيات العالمية تقبل تنوعات كثيرة، والتنقل بين اللغات يوظف مخزون الطالب كله."],["[[**Native-speakerism**|en.l17-postmethod]] (Holliday) is the belief that native speakers are the best models and teachers; Medgyes lists the strengths of non-native teachers.","تفضيل الناطق الأصلي عند هوليداي، وميدجيس يبيّن نقاط قوة المعلم غير الناطق."]],"t":[["World Englishes","The view that English has many legitimate national and regional varieties.","الإنجليزيات العالمية"],["English as a Lingua Franca (ELF)","English used as a common language between speakers of different first languages.","الإنجليزية كلغة مشتركة"],["Intercultural communicative competence (ICC)","Byram's model of the ability to communicate and mediate across cultures.","الكفاءة التواصلية بين الثقافات"],["Intercultural speaker","A learner who mediates between cultures, as opposed to imitating a native speaker.","المتحدث بين الثقافات"],["Translanguaging","Using one's full linguistic repertoire, across languages, to make meaning and learn.","التنقّل بين اللغات (توظيف المخزون اللغوي كاملاً)"],["Macrostrategies (Kumaravadivelu)","General post-method principles from which teachers derive classroom techniques.","الاستراتيجيات الكبرى"],["Native-speakerism","An ideology that native speakers represent the best models and teachers (Holliday).","تفضيل الناطق الأصلي"],["NNEST","Non-Native English-Speaking Teacher.","معلم غير ناطق بالإنجليزية"]],"map":{"type":"fan","title":["Recent Trends in TESOL","⁧الاتجاهات الحديثة⁩"],"groups":[{"n":"World Englishes","who":"Kachru","ar":"⁧الإنجليزية أنواع مشروعة كثيرة، لا البريطانية والأمريكية فقط⁩","items":[{"n":"Indian · Nigerian · Singaporean"}],"d":"en.l17-we"},{"n":"English as a Lingua Franca (ELF)","who":"Jenkins · Seidlhofer","ar":"⁧أغلب الاستعمال بين غير الناطقين: الوضوح قبل معيار الناطق⁩","items":[{"n":"intelligibility"},{"n":"accommodation"}],"d":"en.l17-we"},{"n":"Intercultural communicative competence","who":"Byram","ar":"⁧متحدث بين الثقافات لا ناطق مقلَّد⁩","items":[{"n":"attitudes"},{"n":"knowledge"},{"n":"interpreting and relating"},{"n":"discovery and interaction"},{"n":"critical cultural awareness"}],"d":"en.l17-icc"},{"n":"Translanguaging","who":"García","ar":"⁧كل اللغات مورد للتعلم: خطط بالعربية واعرض بالإنجليزية⁩","items":[{"n":"whole linguistic repertoire"}],"d":"en.l17-translang"},{"n":"Post-method pedagogy","who":"Kumaravadivelu","ar":"⁧لا طريقة واحدة، بل استراتيجيات كبرى⁩","items":[{"n":"macrostrategies"},{"n":"learner autonomy"},{"n":"contextualising input"}],"d":"en.l17-postmethod"},{"n":"Native/non-native teacher","who":"Holliday · Medgyes","ar":"⁧للمعلم غير الناطق مزايا: نموذج متعلم ناجح ويتوقع الصعوبات⁩","items":[{"n":"native-speakerism"},{"n":"shared L1"}],"d":"en.l17-postmethod"}]}},{"h":["Reflective teaching and action research","التدريس التأملي والبحث الإجرائي"],"pts":[["[[**Reflective teaching**|en.l17-reflect]] means collecting evidence about your own teaching — journals, recordings, peer observation — and using it to improve.","التدريس التأملي جمع أدلة عن تدريسك كاليوميات والتسجيل وملاحظة الزملاء لتحسينه."],["Schön distinguished **reflection-in-action**, adjusting during the lesson, from reflection-on-action, thinking back afterwards.","شون: التأمل أثناء الفعل تعديل داخل الحصة، والتأمل بعد الفعل مراجعة بعدها."],["The **5 R's of reflection** move from description to change: Reporting → Responding → Relating → **Reasoning** (explaining with theory, e.g. [[ZPD|en.zpd]]) → Reconstructing.","مراحل التأمل الخمس: وصف ثم شعور ثم ربط ثم تفسير بالنظرية ثم إعادة بناء."],["**Action research** is a small-scale study by teachers of a problem in **their own classroom**, following the cycle plan → act → observe → reflect (Kemmis & McTaggart).","البحث الإجرائي دراسة المعلم لمشكلة في صفه بدورة: خطط، نفّذ، لاحظ، تأمّل."]],"t":[["Reflective teaching","Systematically examining one's own teaching to improve it.","التدريس التأملي"],["Reflection-in-action / on-action","Schön: thinking during an event vs thinking about it afterwards.","التأمل أثناء / بعد"],["Action research","Cyclical, classroom-based research by teachers to solve a local problem.","البحث الإجرائي"],["Peer observation","Teachers observing each other's lessons to give feedback and learn.","ملاحظة الزملاء"],["5 R's of reflection","Reporting, Responding, Relating, Reasoning, Reconstructing: stages of structured reflection.","مراحل التأمل الخمس"]]}],"trap":[["'I writed' / 'tooths' = overgeneralization.","تعميم زائد"],["'five years before' = negative transfer.","نقل سلبي"],["Contrastive Analysis is associated with behaviorism.","السلوكية"]],"vid":[["rrnYsi6sG8w","en","Interlanguage and Error Analysis","Peggy Marcy",4],["rbfEZ80GvqY","en","Interlanguage & Fossilization","Dr Shahzad Karim",5]],"map":{"type":"flow","title":["From predicting errors to studying learner language","⁧من التنبؤ بالأخطاء إلى دراسة لغة المتعلم⁩"],"groups":[{"n":"Contrastive Analysis","short":"Contrastive","ar":"⁧التحليل التقابلي⁩","who":"Lado (1957)","idea":"⁧قارن اللغتين لتتنبأ بالصعوبة — مرتبط بالسلوكية⁩","items":[{"n":"positive transfer"},{"n":"negative transfer"}]},{"n":"Error Analysis","short":"Error Analysis","ar":"⁧تحليل الأخطاء⁩","who":"Corder (1967)","idea":"⁧الخطأ دليل تعلم: من اللغة الأم أو من اللغة الهدف⁩","items":[{"n":"interlingual"},{"n":"intralingual"}],"trap":"⁧تعميم زائد (goed، tooths)، لا نقل من العربية⁩"},{"n":"Interlanguage","ar":"⁧اللغة البينية⁩","who":"Selinker (1972)","idea":"⁧نظام المتعلم المتطور بين اللغتين، وقد يتحجّر⁩","items":[{"n":"fossilization"}]}]},"n":17},{"id":"L18","d":"L","std":"6.9.10","en":"Language as a System, History & Varieties","ar":"اللغة كنظام وتاريخها وتنوعاتها","goal":["Know design features and functions of language, the history and sources of English, and language varieties.","خصائص اللغة وتاريخ الإنجليزية والتنوعات"],"sec":[{"h":["What language is and how linguists study it","ما اللغة وكيف تدرسها اللسانيات"],"pts":[["Language is an **arbitrary** system of vocal symbols used for communication, and its scientific study is **linguistics**, with branches such as applied, historical and neurolinguistics.","اللغة نظام رموز صوتية اعتباطية للتواصل، ودراستها العلمية هي اللسانيات بفروعها التطبيقية والتاريخية والعصبية."],["Classic [[definitions|en.l18-defs]] stress different sides: **Sapir** calls language purely human and non-instinctive, Hall a system of habitually used oral-auditory symbols, and Chomsky a set of sentences built from finite elements.","سابير: اللغة بشرية غير غريزية، وهول: رموز صوتية سمعية معتادة، وتشومسكي: مجموعة جمل من عناصر محدودة."],["Language is not only spoken: it can also be written or signed, so 'language is only verbal' is the least accurate description of it.","اللغة لا تقتصر على الكلام، فهي تُكتب وتُؤدّى بالإشارة، ووصفها بأنها لفظية فقط أقل الأوصاف دقة."],["Language is **systematic**: rules and patterns govern its sounds, words and sentences. A descriptive grammar records how people actually use it, while a **prescriptive** rule such as 'Don't split infinitives' tells them how they should speak.","اللغة منظمة بقواعد في كل مستوى، والقواعد الوصفية تصف الاستعمال الفعلي، والمعيارية تفرض ما يجب قوله."],["[[Ferdinand de Saussure|en.l18-saussure]] founded modern **structural linguistics**; his 'Course in General Linguistics' (1916) was published by his students after his death, and his key pairs, such as langue and parole, are in the map.","سوسير مؤسس اللسانيات البنيوية، ونشر طلابه كتابه عام 1916 بعد وفاته، وثنائياته الأساسية في الخريطة."]],"t":[["Linguistics","The scientific study of language and its structure.","اللسانيات"],["Prescriptive grammar","Rules for how people should use language.","قواعد معيارية"],["Descriptive grammar","A description of how people actually use language.","قواعد وصفية"],["Langue / Parole","Saussure: the language system / actual speech.","اللسان / الكلام"],["Applied linguistics","Linguistics applied to real problems such as language teaching.","لسانيات تطبيقية"],["Historical linguistics","The study of how language develops over time.","علم اللغة التاريخي"],["Neurolinguistics","The study of the relationship between language and the brain.","علم اللغة العصبي"],["Linguistic sign","Saussure's unit combining a signifier (form) and a signified (concept).","العلامة اللغوية"],["Signifier","The form of a sign: its sound-image or written form.","الدال"],["Signified","The concept or meaning a sign refers to.","المدلول"],["Synchronic linguistics","Studying a language as a system at a particular point in time.","اللسانيات التزامنية"],["Diachronic linguistics","Studying how a language changes over time.","اللسانيات التعاقبية"],["Syntagmatic relations","Relations between linguistic units that combine in sequence.","علاقات تركيبية"],["Paradigmatic relations","Relations between units that can substitute for each other in the same position.","علاقات استبدالية"]],"map":{"type":"cards","title":["Saussure's key pairs","⁧ثنائيات سوسير⁩"],"groups":[{"n":"Linguistic sign","ar":"⁧العلامة · العلاقة اعتباطية⁩","items":[{"n":"Signifier","ar":"⁧الدال: الصورة الصوتية ⁦/triː/⁩⁩"},{"n":"Signified","ar":"⁧المدلول: مفهوم الشجرة⁩"}]},{"n":"Time","ar":"⁧الزمن⁩","items":[{"n":"Synchronic","ar":"⁧اللغة في لحظة واحدة⁩"},{"n":"Diachronic","ar":"⁧تغيّرها عبر الزمن⁩"}]},{"n":"Relations","ar":"⁧العلاقات⁩","items":[{"n":"Syntagmatic","ar":"⁧أفقية: the + cat + sat⁩"},{"n":"Paradigmatic","ar":"⁧رأسية: cat / dog / bird⁩"}]},{"n":"System vs use","ar":"⁧النظام والاستعمال⁩","items":[{"n":"Langue","ar":"⁧النظام المشترك⁩"},{"n":"Parole","ar":"⁧الاستعمال الفعلي⁩"}]}]}},{"h":["Hockett's design features","خصائص اللغة البشرية عند هوكيت"],"pts":[["[[Hockett|en.l18-hockett]] compared human language with animal communication and listed the design features of a full human language; some are shared with animal systems, while others appear fully only in human language.","قارن هوكيت لغة الإنسان بتواصل الحيوان، فبعض الخصائص مشتركة وبعضها لا يكتمل إلا عند الإنسان."],["The relationship between form and meaning is **arbitrary**: nothing in the word 'tree' resembles a tree. Language is also learned from the community (cultural transmission), not inherited.","العلاقة بين اللفظ والمعنى اعتباطية، واللغة تُكتسب من المجتمع ولا تُورَّث.","o"],["**Displacement** is the ability to refer to things that are not present in time or space, such as yesterday's lesson or a city we have never visited.","الإزاحة قدرة الحديث عن أشياء غائبة في الزمان أو المكان.","o"],["**Creativity / productivity** means speakers produce and understand endless new messages; **duality** means a small set of distinct (discrete) sounds with no meaning combines into units that do have meaning.","الإبداعية إنتاج رسائل جديدة بلا حدود، وازدواجية البنية أصوات بلا معنى تتركب في وحدات ذات معنى."],["Other features describe the spoken signal: a vocal-auditory channel with **rapid fading**, [[**interchangeability**|en.l18-hockett2]] (anyone can send and receive), **total feedback** (speakers monitor what they say), specialisation and **semanticity** (signals carry fixed meanings).","الكلام صوتي يزول بسرعة، وكل متكلم مرسل ومستقبل يسمع نفسه، وإشاراته لها معانٍ ثابتة."],["Hockett later added **prevarication** (lying or talking about imaginary things), **reflexiveness** (using language to talk about language itself) and learnability (any human language can be learned).","أضاف لاحقاً القدرة على الكذب والتخيل، والحديث عن اللغة نفسها، وقابلية تعلّم أي لغة."]],"t":[["Arbitrariness","No natural connection between a word's form and its meaning.","اعتباطية"],["Displacement","The ability to refer to things not present in time or space.","الإزاحة"],["Productivity (creativity)","The ability to produce and understand infinite new utterances.","الإبداعية"],["Duality of patterning","Language works at two levels: sounds and meaningful units.","ازدواجية البنية"],["Cultural transmission","Language is learned from the community, not inherited.","النقل الثقافي"],["Discreteness","Language is made of distinct units.","التمايز"],["Interchangeability","Any user of a language can both send and receive messages.","التبادلية"],["Total feedback","Speakers can hear and monitor what they themselves say.","التغذية الراجعة الكاملة"],["Specialisation","Linguistic signals have communication as their only function.","التخصص"],["Semanticity","Linguistic signals have specific, fixed meanings.","الدلالية"],["Rapid fading","Spoken signals are transitory and quickly disappear.","الزوال السريع"],["Prevarication","The ability to say things that are false, misleading or imaginary.","القدرة على الكذب"],["Reflexiveness","The ability to use language to talk about language itself.","الانعكاسية"]]},{"h":["Functions of language","وظائف اللغة"],"pts":[["Brown and Yule separate two broad functions: the [[**transactional**|en.l18-functions]] function passes on information, while the **interactional** function establishes and maintains social relationships.","الوظيفة التبادلية تنقل المعلومة، والتفاعلية تبني العلاقات الاجتماعية وتحافظ عليها.","o"],["A news report, a lecture or a teacher's instructions are transactional because the message matters most; chatting with a colleague to keep a friendly relationship is interactional.","نشرة الأخبار والمحاضرة تبادليتان، والدردشة للحفاظ على الود تفاعلية."],["'Nice weather, isn't it?' is phatic communication: its job is social contact rather than information, so it belongs to the interactional side.","عبارات الطقس والمجاملة للتواصل الاجتماعي لا لنقل معلومة، فهي تفاعلية."],["Functionalist linguists argue that language developed to **communicate**, so they explain its forms by the jobs those forms do in real exchanges.","يرى الوظيفيون أن اللغة نشأت للتواصل، فيفسرون أشكالها بوظائفها في الاستعمال."]],"t":[["Transactional function","Language used to convey information/content.","تبادلية"],["Interactional function","Language used to establish and maintain social relationships.","تفاعلية"],["Phatic communication","Language used for social contact rather than information.","اتصالية"],["Utterance","A spoken word or sentence; a unit of verbal communication.","ملفوظ"]]},{"h":["Theories of the origin of language","نظريات نشأة اللغة"],"pts":[["Yule reviews several [[theories|en.l18-origins]] of how language began; each picks one possible source, but none can be proven because there is **no direct physical evidence** of the earliest speech.","عرض يول عدة نظريات لنشأة اللغة، ولا تثبت أي منها لغياب الدليل المادي المباشر."],["So the main problem shared by all origin-of-language theories is that they **lack scientific evidence**; even isolation experiments on children gave no reliable proof for the divine source.","مشكلة نظريات النشأة كلها أنها بلا دليل علمي، حتى تجارب عزل الأطفال لم تثبت شيئاً.","o"],["Exam items usually give a clue and ask for the theory: imitating natural sounds (onomatopoeia) is bow-wow, instinctive emotional cries are pooh-pooh, and sounds made during group work are yo-heave-ho.","المحاكاة الصوتية دليل نظرية باو-واو، والصيحات بوه-بوه، وأصوات العمل الجماعي يو-هيف-هو."]],"t":[["Divine source","The theory that language was given to humans by God.","المصدر الإلهي"],["Bow-wow theory","Natural sound source: words began as imitations of natural sounds.","نظرية محاكاة الأصوات"],["Onomatopoeia","Words that imitate the sounds associated with what they refer to (buzz, splash).","محاكاة صوتية"],["Pooh-pooh theory","Language began from instinctive emotional cries.","نظرية صيحات الانفعال"],["Yo-heave-ho theory","Language began from sounds made during collective physical work.","نظرية العمل الجماعي"],["Oral-gesture theory","Language developed from a link between hand gestures and mouth movements.","نظرية الإيماءة الفموية"],["Physiological adaptation","The evolution of human speech organs and brain features that make speech possible.","التكيف الفسيولوجي"],["Innateness hypothesis","The genetic-source view that humans are born with a capacity for language.","فرضية الفطرية"]],"map":{"type":"tree","title":["Origin of Language (Yule)","⁧نظريات نشأة اللغة⁩"],"groups":[{"n":"Divine source","ar":"⁧المصدر الإلهي⁩","idea":"⁧اللغة هبة من الله⁩","items":[{"n":"Isolation experiments","ar":"⁧تجارب عزل الأطفال لم تعطِ دليلاً موثوقاً⁩"}]},{"n":"Bow-wow","ar":"⁧محاكاة الطبيعة⁩","idea":"⁧الكلمات الأولى قلّدت أصوات الطبيعة⁩","items":[{"n":"cuckoo · splash · bang","ar":"onomatopoeia"},{"n":"Problem","ar":"⁧كلمات المحاكاة قليلة، والمجرد لا صوت له⁩"}]},{"n":"Pooh-pooh","ar":"⁧صيحات الانفعال⁩","idea":"⁧صيحات غريزية: Ouch! Ah! Wow!⁩","items":[{"n":"Problem","ar":"⁧تُنطق بأصوات تختلف عن أصوات الكلام العادي⁩"}]},{"n":"Yo-heave-ho","ar":"⁧العمل الجماعي⁩","idea":"⁧people working together: أصوات العمل المشترك صارت لغة⁩","items":[{"n":"Problem","ar":"⁧يفسر السياق الاجتماعي لا أصل الأصوات⁩"}]},{"n":"Oral-gesture","ar":"⁧الإيماءة الفموية⁩","idea":"⁧اللسان والفم يحاكيان إيماءات اليد⁩","items":[{"n":"Gesture → mouth","who":"Paget","ar":"⁧ربط الإيماءة بحركة الفم⁩"}]},{"n":"Physical (physiological) adaptation","ar":"⁧التكيف الجسدي⁩","idea":"⁧أسنان قائمة، شفاه مرنة، لسان رشيق، حنجرة منخفضة⁩","items":[{"n":"Lateralised brain","ar":"⁧اللغة غالباً في النصف الأيسر⁩"},{"n":"Tool-making","ar":"⁧وظائف الدماغ نفسها⁩"}]},{"n":"Genetic source","ar":"⁧المصدر الوراثي⁩","idea":"⁧قدرة فطرية موروثة⁩","items":[{"n":"Innateness hypothesis","who":"Chomsky","ar":"⁧تفسر سرعة اكتساب الطفل⁩"}]}]}},{"h":["History and spread of English","تاريخ الإنجليزية وانتشارها"],"pts":[["English is a **Germanic** language of the Indo-European family, like German and Dutch; Spanish, Portuguese and Italian are Romance languages, and Arabic is Semitic.","الإنجليزية جرمانية من الأسرة الهندية الأوروبية، والإسبانية والإيطالية رومانسية، والعربية سامية."],["[[Old English|en.l18-history]] became Middle English after the **Norman Conquest 1066** brought in French; Early Modern English is the age of Shakespeare, printing and the Great Vowel Shift, followed by Modern English.","مراحلها: القديمة، ثم الوسطى بعد الغزو النورماندي 1066، ثم الحديثة المبكرة زمن شكسبير والطباعة، ثم الحديثة."],["Borrowing filled English with foreign words: café from French, scientific terms from **Greek and Latin**, and alcohol, algebra and sugar from **Arabic**, often through Latin or French.","اقترضت الإنجليزية كلمات من الفرنسية، والمصطلحات العلمية من اليونانية واللاتينية، والجبر والسكر من العربية."],["Yet the most frequent everyday words (the, be, have) are **Germanic**, even though most words in a dictionary come from Latin or French — which is why English is still classed as Germanic.","الكلمات اليومية الأكثر استعمالاً جرمانية، وإن كانت أغلب كلمات المعجم لاتينية أو فرنسية."],["Settlers from **England** carried English to North America and later to Australia, where it developed into new inner-circle varieties with their own norms.","نقل المستوطنون من إنجلترا اللغة إلى أمريكا الشمالية ثم أستراليا، فنشأت فيهما تنوعات خاصة."]],"t":[["Indo-European","The language family that includes the Germanic and Romance branches.","هندو-أوروبية"],["Germanic","The branch of Indo-European that includes English, German and Dutch.","جرمانية"],["Romance languages","Languages descended from Latin: Spanish, Portuguese, Italian, French.","رومانسية"],["Norman Conquest (1066)","Event that brought many French words into English.","الغزو النورماندي"],["Great Vowel Shift","A major change in English long-vowel pronunciation (1400–1700).","التحول الصوتي الكبير"]],"map":{"type":"flow","title":["History of English","⁧تاريخ اللغة الإنجليزية⁩"],"groups":[{"n":"Old English","ar":"⁧الإنجليزية القديمة⁩","idea":"⁧تقريباً 450–1100 · جذور جرمانية⁩","items":[{"n":"Germanic"},{"n":"oxen, children"}]},{"n":"Middle English","ar":"⁧الوسطى⁩","idea":"⁧1100–1500 · بعد الغزو النورماندي دخلت كلمات فرنسية كثيرة⁩","items":[{"n":"Norman Conquest 1066"},{"n":"French words"}]},{"n":"Early Modern","ar":"⁧الحديثة المبكرة⁩","idea":"⁧1500–1800 · الطباعة وشكسبير والتحول الصوتي الكبير⁩","items":[{"n":"printing"},{"n":"Shakespeare"},{"n":"Great Vowel Shift"}]},{"n":"Modern English","ar":"⁧الحديثة⁩","idea":"⁧من 1800 · الانتشار العالمي وتنوعات كثيرة⁩","items":[{"n":"World Englishes"}]}]}},{"h":["Varieties of language","تنوعات اللغة"],"pts":[["Variation is an **inherent part of language**, not a sign of decay: every language has regional, social and personal varieties, and all languages change over time (**mutability**).","التنوع جزء أصيل من كل لغة وليس فساداً، وكل اللغات تتغير مع الزمن."],["A [[**dialect**|en.l18-varieties]] differs in grammar, vocabulary and pronunciation, while an **accent** differs in pronunciation only; an idiolect is one person's own way of speaking, and a register suits the situation.","اللهجة تختلف في القواعد والمفردات والنطق، واللكنة في النطق فقط، ولغة الفرد طريقته الخاصة."],["Dialect geographers draw an **isogloss**, a line on a map that separates areas using different language features, such as two different words for the same thing.","خط تساوي الظاهرة خط على الخريطة يفصل بين مناطق تختلف في سمة لغوية."],["When groups with no common language must communicate, for trade for example, they create a **pidgin**, a simplified contact language with no native speakers; when children acquire it as a first language, it becomes a **creole**.","الهجين لغة تواصل مبسطة بلا متحدثين أصليين، فإذا صارت لغة أولى لجيل جديد صارت كريولاً."],["English as a lingua franca (ELF) aims at **intelligibility** between speakers of different first languages; in Kachru's three circles, Saudi Arabia belongs to the **expanding circle**, where English is a foreign language.","الإنجليزية لغة مشتركة هدفها الوضوح المتبادل، والسعودية في الدائرة المتسعة عند كاتشرو."]],"t":[["Dialect","A variety differing in grammar, vocabulary and pronunciation.","لهجة"],["Accent","A variety differing only in pronunciation.","لكنة"],["Idiolect","An individual's personal way of speaking.","لغة الفرد"],["Register","Language variety according to situation and formality.","مستوى الخطاب"],["Pidgin","A simplified contact language with no native speakers.","هجين"],["Creole","A pidgin that has become the first language of a community.","كريول"],["Lingua franca","A common language used between speakers of different L1s.","لغة مشتركة"],["Isogloss","A boundary line on a map between areas with different language features.","خط تساوي الظاهرة"],["Kachru's three circles","Inner (UK, US), outer (India, Nigeria), expanding (Saudi Arabia, China).","دوائر كاتشرو"],["Mutability","The grammars of all languages change over time.","قابلية التغيّر"]],"map":{"type":"nest","title":["Kachru's three circles","⁧دوائر كاتشرو الثلاث⁩"],"groups":[{"n":"Expanding circle","tag":"EFL · Saudi Arabia, China","ar":"⁧الإنجليزية لغة أجنبية تُتعلّم في المدرسة⁩","trap":"⁧السعودية في الدائرة المتسعة (expanding) لا الخارجية⁩"},{"n":"Outer circle","tag":"ESL · India, Nigeria, Singapore","ar":"⁧الإنجليزية لغة ثانية رسمية بجانب لغات محلية⁩"},{"n":"Inner circle","tag":"native · UK, US, Australia","ar":"⁧الإنجليزية لغة أم لأغلب السكان⁩"}]}},{"h":["Standard and social varieties; British vs American","المعيارية والتنوع الاجتماعي والبريطانية والأمريكية"],"pts":[["**Standard English**, the variety of education, publishing and the media, is defined by its grammar and vocabulary, not by accent, so it can be spoken with any accent.","الإنجليزية المعيارية تتحدد بالقواعد والمفردات لا باللكنة، فيمكن نطقها بأي لكنة."],["Social variation has its own terms: a sociolect belongs to a social group, slang is very informal group vocabulary, jargon is the vocabulary of a profession, and a **speech community** shares a variety and its rules of use.","اللهجة الاجتماعية لفئة، والعامية كلمات غير رسمية، ولغة المهنة مصطلحاتها، والمجتمع اللغوي يتشارك قواعد الاستعمال."],["**RP** is the prestige non-regional British accent and General American (GA) the broad US standard; RP is [[**non-rhotic**|en.l18-rpga]] (car /kɑː/), while GA is **rhotic** (car /kɑr/) and often flaps the t in 'water'.","النطق البريطاني المعياري لا ينطق الراء بعد الصائت، والأمريكي العام ينطقها ويليّن التاء بين الصائتين."],["British and American English differ mainly in **vocabulary** (lift/elevator, petrol/gasoline), then in spelling (colour/color — Americans write **-or**) and pronunciation; grammar differs very little.","الفرق الأكبر بينهما في المفردات ثم الإملاء والنطق، أما القواعد فتختلف قليلاً جداً."],["British English uses past forms in **-t** more often (learnt, burnt), American English prefers **-ed** (learned, burned), and both keep plurals like oxen and children with the [[**Old English**|en.l18-brame]] ending -en.","البريطانية تفضّل -t في الماضي والأمريكية -ed، وجمع oxen بقية من الإنجليزية القديمة."]],"t":[["Standard English","The prestige variety of English used in formal writing, education and media.","الإنجليزية المعيارية"],["Received Pronunciation (RP)","The prestige, non-regional accent of British English.","النطق المعياري البريطاني"],["General American (GA)","The broad standard accent of American English.","الأمريكي العام"],["Rhotic accent","An accent in which /r/ is pronounced in all positions, including after vowels.","لكنة تنطق الراء"],["Sociolect","A variety of language used by a particular social group.","لهجة اجتماعية"],["Slang","Very informal, often temporary vocabulary used by a particular group.","العامية"],["Jargon","Specialised technical vocabulary of a profession or field.","لغة المهنة"],["Speech community","A group of people who share a language variety and rules for its use.","مجتمع لغوي"]]}],"trap":[["Referring to absent things = displacement; infinite new messages = creativity.","الإزاحة / الإبداعية"],["Dialect includes grammar + vocabulary + pronunciation; accent = pronunciation only.","لهجة / لكنة"],["English is Germanic despite its many Latin/French words.","جرمانية"],["Passing on information = transactional (the draft handbook's key 'interactional' contradicts its own explanation).","تبادلية"]],"vid":[["nzItwD2p2bY","ar","خصائص اللغة البشرية","الدافورة",21],["Fr3-Kb5hZjQ","ar","تاريخ اللغة الإنجليزية","الدافورة",12],["1rqxaJRcW38","ar","فرضيات نشوء اللغة","الدافورة",0],["H3r9bOkYW9s","en","The History of English (combined)","OpenLearn – Open University",11],["qqJI7SdS9Gg","en","What are Creoles and Pidgins?","Langfocus",6]],"n":18},{"id":"L19","d":"L","std":"6.9.11","en":"Phonetics & Phonology","ar":"علم الأصوات ووظائفها","goal":["Describe consonants by place, manner and voicing, describe vowels, apply -ed/-s rules and know connected-speech processes.","وصف الأصوات والقواعد والكلام المتصل"],"sec":[{"h":["Phonetics and phonology","علم الأصوات وعلم وظائف الأصوات"],"pts":[["[[Phonetics|en.ling.phonbranches]] describes speech sounds as physical events in any language; it has **four branches** (see the map), from how sounds are produced to how they are heard and used to identify speakers.","علم الأصوات يصف الصوت حدثاً فيزيائياً في أي لغة، وفروعه الأربعة في الخريطة."],["The movements of the speech organs (lips, tongue, teeth, palate and vocal cords) in producing sounds are called **articulation**; articulatory phonetics uses them to describe place, manner and voicing.","حركات أعضاء النطق لإخراج الصوت هي النطق، وعليها يقوم وصف المخرج والطريقة والجهر."],["**Phonology** studies the sound system and patterns of a particular language: which sounds change meaning in it and how they may combine — phonetics is general, phonology is language-specific.","علم وظائف الأصوات يدرس نظام لغة بعينها: أي الأصوات تغيّر المعنى وكيف تتركب."]],"t":[["Phonetics","The study of speech sounds and their production, transmission and perception.","علم الأصوات"],["Phonology","The study of the sound system of a particular language.","علم وظائف الأصوات"],["Articulatory phonetics","How speech sounds are produced by the speech organs.","نطقي"],["Acoustic phonetics","The physical properties of speech sounds as sound waves.","فيزيائي"],["Auditory phonetics","How speech sounds are heard and perceived.","سمعي"],["Forensic phonetics","Identifying speakers and analysing recordings.","جنائي"]],"map":{"type":"fan","title":["Branches of phonetics","⁧فروع علم الأصوات⁩"],"groups":[{"n":"Articulatory","ar":"⁧كيف تنتج أعضاء النطق الصوت⁩","items":[{"n":"production"}],"d":"en.ling.phonbranches"},{"n":"Acoustic","ar":"⁧خصائص موجات الصوت⁩","items":[{"n":"sound waves"}],"d":"en.ling.phonbranches"},{"n":"Auditory","ar":"⁧كيف تستقبل الأذن والدماغ الصوت⁩","items":[{"n":"perception"}],"d":"en.ling.phonbranches"},{"n":"Forensic","ar":"⁧تحديد المتكلم من تسجيل⁩","items":[{"n":"identifying speakers"}],"d":"en.ling.phonbranches"}]}}],"trap":[],"vid":[["HzsdfRT-l9Q","ar","مقدمة في الصوتيات","الدافورة",23],["_Gf-go_sZb8","ar","أماكن نطق الأصوات","الدافورة",0],["hnhwKrI2Vx4","ar","طريقة نطق الأصوات","الدافورة",0],["0wBzOn8NxCY","ar","أنواع المقاطع الصوتية","الدافورة",0],["sqrQ_4L-yJ8","ar","مقدمة في الفونولوجي","الدافورة",11],["vyea8Ph9BOM","en","Phonetics – Consonants (Crash Course #8)","CrashCourse",12],["vFU5kqxhD6s","en","Connected Speech: Assimilation, Elision & Intrusion","Billie English",15]],"map":{"type":"grid","ipa":true,"flip":true,"title":["English consonants: place × he internal structure of words, and its basic unit, the [[**morpheme**|en.ling.morpheme]], is the smallest meaningful unit: 'tourists' has three (tour + -ist + -s).","علم الصرف يدرس بنية الكلمة، والمورفيم أصغر وحدة ذات معنى فيها."],["**Free** morphemes can stand alone as words (book, the), while **bound** morphemes cannot: affixes such as un-, -ness and -s, and bound roots such as -ceive in receive.","الحر يقف وحده كلمة، والمقيد لا يقف وحده كالسوابق واللواحق وبعض الجذور."],["Free morphemes are either **lexical**, carrying content (nouns, verbs, adjectives), or [[grammatical (functional)|en.ling.wordclass]], showing relations (at, in, the, and); an ending like -ed is a bound inflectional morpheme, not a functional one.","الحرة معجمية تحمل المعنى أو وظيفية تربط الجملة، أما -ed فلاحقة تصريفية مقيدة."],["A **lexeme** covers all the forms of one word, so wolf and wolves are one lexeme; the variant forms of one morpheme, like the plural /s/, /z/ and /ɪz/, are allomorphs.","الوحدة المعجمية تجمع صيغ الكلمة الواحدة، وصور المورفيم الواحد تسمى صيغاً بديلة."]],"t":[["Morphology","The study of the internal structure and formation of words.","علم الصرف"],["Morpheme","The smallest meaningful unit in language.","مورفيم"],["Free morpheme","A morpheme that can stand alone as a word.","حر"],["Bound morpheme","A morpheme that cannot stand alone.","مقيّد"],["Lexical morpheme","A content morpheme carrying meaning (verbs, nouns, adjectives).","معجمي"],["Grammatical (functional) morpheme","A morpheme expressing grammatical relationships.","نحوي"],["Lexeme","An abstract dictionary word covering all its inflected forms.","وحدة معجمية"],["Allomorph","A variant form of a morpheme (plural /s/, /z/, /ɪz/).","صيغة بديلة"]]}],"trap":[],"vid":[["Udc5c1ikSD8","ar","مقدمة في المورفيم","الدافورة",18],["VC2URTSJC7Q","ar","أنواع الوحدات الصرفية","الدافورة",0],["xYQvuaFughM","ar","مصطلحات مهمة في المورفيم","الدافورة",0],["93sK4jTGrss","en","Morphology (Crash Course #2)","CrashCourse",11],["Ya7rLeGhY1M"," ax and word classes","النحو وأقسام الكلام"],"pts":[["Syntax studies the **grammatical structure of sentences** and the order of their words; the basic English word order is **SVO** (subject, verb, object), and every word belongs to a [[word class|en.ling.wordclass]].","النحو يدرس بنية الجملة وترتيب كلماتها، والترتيب الأساسي في الإنجليزية فاعل ثم فعل ثم مفعول."],["English has **two indefinite articles** (a, an); this and that are demonstratives, and 'each other' is a **reciprocal** pronoun, not a reflexive one like myself.","في الإنجليزية أداتا تنكير، والضمير each other تبادلي لا انعكاسي."],["An adjective before a noun, as in 'an expensive watch', is **attributive**; after a linking verb, as in 'the watch is expensive', it is predicative.","الصفة قبل الاسم صفة قبلية، وبعد فعل الربط صفة خبرية."],["Adverbs modify verbs, adjectives and other adverbs but **never nouns**; very and too are intensifiers that strengthen an adjective or an adverb.","الظرف يصف الفعل والصفة والظرف، ولا يصف الاسم أبداً.","o"],["'Ouch!' is an **interjection**, a word that expresses emotion, while may, can and should are **auxiliaries (modals)** that add meanings such as possibility or obligation.","أداة التعجب تعبّر عن الانفعال، أما (may, can, should) فأفعال مساعدة ناقصة."]],"t":[["Syntax","The study of sentence structure and word order.","النحو"],["Reciprocal pronoun","each other, one another.","ضمير تبادلي"],["Reflexive pronoun","myself, themselves.","ضمير انعكاس"],["Attributive adjective","An adjective before a noun.","صفة قبلية"],["Predicative adjective","An adjective after a linking verb.","صفة خبرية"],["Interjection","A word expressing emotion (Ouch!).","أداة تعجب"],["Modal auxiliary","can, may, should, must, will.","فعل ناقص"]]}],"trap":[],"vid":[["B1r1grQiLdk","en","Syntax – Morphosyntax (Crash Course #3)","CrashCourse",11],["n1zpnN-6pZQ","en","Syntax – Trees (Crash Course #4)","CrashCourse",11],["urr55rAreWc","en","The 4 English sentence types","engVid – Adam",15]],"map":null,"n":21,"locked":true},{"id":"L22","d":"L","std":"6.9.11","en":"Semantics, Pragmatics & Discourse","ar":"الدلالة والتداولية والخطاب","goal":["Distinguish lexical relations, speech acts, Grice's maxims, presupposition, cohesion and coherence.","علاقات المعنى والتداولية والخطاب"],"sec":[{"h":["Semantics and lexical relations","علم الدلالة وعلاقات المعنى"],"pts":[["Semantics is the study of **meaning** in words, phrases and sentences; it helps us interpret, for example, what a compound like 'risk management' actually refers to.","علم الدلالة يدرس معنى الكلمات والجمل، ويساعد في تفسير المركبات مثل risk management."],["[[Lexical relations|en.ling.lexrel]] link words by meaning: big and large are synonyms, banana is a kind of fruit (**hyponymy**), and a branch is part of a tree (**meronymy**).","الترادف تقارب المعنى، والاشتمال علاقة «نوع من»، والجزئية علاقة «جزء من كل»."],["Words can also share form: see/sea and stake/steak are **homophones** (same sound), lead/lead are homographs (same spelling), bank is a homonym (unrelated meanings), and head shows [[polysemy|en.ling.homonymy]] (related meanings).","المتجانس صوتاً نطقه واحد، والمتجانس كتابةً كتابته واحدة، والمشترك معانيه منفصلة، والمتعدد معانيه مترابطة."],["[[Antonyms|en.ling.antonyms]] come in three types: hot/cold are gradable (very hot), alive/dead are complementary (not alive means dead), and buy/sell are converse (the same event seen from two sides).","التضاد متدرج كحار وبارد، وتكاملي كحي وميت، وعكسي كباع واشترى."]],"t":[["Semantics","The study of meaning in words and sentences.","علم الدلالة"],["Synonymy","Words with the same or similar meaning.","ترادف"],["Antonymy","Words with opposite meanings (gradable, complementary, converse).","تضاد"],["Hyponymy","A 'kind of' relation (banana is a hyponym of fruit).","اشتمال"],["Meronymy","A part–whole relation (branch–tree).","جزء من كل"],["Homophones","Same sound, different spelling and meaning (see/sea).","متجانس صوتياً"],["Homographs","Same spelling, different meaning (lead/lead).","متجانس كتابياً"],["Homonyms","Same form, unrelated meanings (bank).","مشترك لفظي"],["Polysemy","One word with several related meanings.","تعدد المعنى"],["Metonymy","Using an associated word for a thing ('The White House said').","كناية"],["Collocation","Words that habitually co-occur (heavy rain).","تلازم لفظي"]]}],"trap":[],"vid":[["tg0_dFb1Z1c","ar","علم الدلالة (سيمانتك)","الدافورة",28],["XMey3ei7aRE","ar","التداولية (براغماتيك)","الدافورة",25],["6geQjY8b7sA","en","Semantics (Crash Course #5)","CrashCourse",11],["MPwpk-YgvjQ","en","Pragmatics (Crash Course #6)","CrashCourse",10],["e_3h0fB8Rhg","en","Lexical Semantics","Evan Ashworth",13]],"n":22,"locked":true}];
window.QB = [["L01","h","A listening activity in which students listen to a long audio passage for general understanding and pleasure is:",["Extensive listening","Intensive listening","Discriminative listening","Selective listening"],"الاستماع الموسّع: نص طويل للفهم العام والمتعة."],["L01","","The main aim of intensive listening activities is to:",["Develop bottom-up processing skills","Enjoy long stories","Practise turn-taking","Enable learners to listen to lengthy texts"],"الاستماع المكثف يركز على التفاصيل والشكل، فيطوّر المعالجة من الأسفل."],["L01","h","To improve students' listening comprehension, the input they receive should mainly be:",["Meaningful","Complex","General","Very fast"],"المدخل ذو المعنى والمفهوم هو أساس تحسين الاستماع."],["L01","","A learner keeps listening even though she does not understand some words, accepting the unclear parts. This strategy is called:",["Tolerance of ambiguity","Self-evaluation","Summarizing","Elaboration"],"قبول الغموض والاستمرار = تحمّل الغموض."],["L01","","The Cornell method is mainly a ______ technique.",["note-taking","previewing","pronunciation","skimming"],"طريقة كورنيل لتدوين الملاحظات."],["L01","","In the pre-listening stage, the teacher should mainly:",["Activate students' background knowledge","Ask detailed comprehension questions","Correct pronunciation errors","Assign a written summary"],"قبل الاستماع: تنشيط الخلفية وتحديد الهدف."],["L01","","When students listen to a recording for the first time, the teacher should usually ask them to listen for:",["The gist","Every single word","Spelling","Grammar errors"],"المرة الأولى للفكرة العامة، والثانية للتفاصيل."],["L01","m","A student listens to a long lecture and writes down only the main points relevant to her assignment. This is:",["Selective listening with note-taking","Appreciative listening for enjoyment","Discriminative listening to sounds","Therapeutic listening with empathy"],"التقاط معلومات محددة من كلام طويل = استماع انتقائي."],["L01","m","Which tool is MO "],"الحديث الفردي مهارة كلام."],["L02","m","Ship/sheep and pen/ben are examples of:",["Minimal pairs","Homographs","Collocations","Diphthongs"],"تختلف في صوت واحد = أزواج صغرى."],["L02","m","Physical-response activities in which learners follow commands such as 'Stand up' are known as:",["Imperative drills","Pair work","Conversational dialogues","Jigsaw reading"],"أوامر + حركة = تدريبات الأوامر."],["L02","m","L2 learners notice gaps in their language MOST clearly when they:",["Talk to others","Listen to music","Read a book","Watch TV"],"الإنتاج والتفاعل يكشفان الفجوة (فرضية المخرج)."],["L03","","Rewriting a sentence using different words while keeping the same meaning and similar length is:",["Paraphrasing","Summarizing","Outlining","Skimming"],"إعادة الصياغة."],["L03","","Which question best develops CRITICAL reading?",["Is the author's argument convincing? Why?","What is the name of the main character?","How many paragraphs are there?","What does the first word mean?"],"القراءة الناقدة تقيّم وتحكم."],["L03","m","Using what one already knows about a topic to understand a passage involves:",["Schema activation","Phonological processing","Syntactic parsing","Spelling"],"تنشيط المخطط الذهني."],["L03","m","The first stage in learning to read is:",["Decoding","Critical evaluation","Summarizing","Inferring"],"فك الترميز أول مرحلة."],["L03","m","Reading fluency instruction usually begins with:",["Direct instruction and modeling","Independent practice at home","Timed silent reading tests","Peer assessment of reading"],"تبدأ الطلاقة بالتعليم المباشر والنمذجة."],["L03","m","K-W-L charts help students mainly to:",["Connect prior knowledge with new learning","Memorize the spelling of new words","Practise the pronunciation of key words","Translate texts into their first language"],"ماذا أعرف / ماذا أريد / ماذا تعلمت."],["L03","m","A student reads a passage about China only to find its population figure. The student is:",["Scanning","Skimming","Visualizing","Connecting"],"البحث ing theory","contrastive theory"],"التفاعلية."],["L15","","According to the functional approach, humans develop language mainly because they need to:",["communicate","organize","criticize","assimilate"],"التواصل."],["L15","m","A main principle of behaviorism in training learners is to:",["achieve desired behavior through reinforcement","develop critical opinions through discussion","let learners discover rules on their own","avoid feedback so learners think freely"],"السلوك المرغوب."],["L16","","Compared with children acquiring L1, adults learning an L2 usually:",["do not reach native-like grammatical competence","always reach native-like competence","learn faster in every aspect","need no motivation"],"نادراً ما يصلون لمستوى المتحدث الأصلي."],["L16","","First language acquisition is ___, while second language acquisition usually requires ___.",["an instinct / motivation","a choice / instinct","slow / no effort","guided / nothing"],"غريزة / دافعية."],["L16","h","The ability to produce a cohesive and coherent text from a series of utterances is ___ competence.",["discourse","grammatical","sociolinguistic","strategic"],"خطابية."],["L16","m","Knowing what to say and how to say it appropriately based on the situation is ___ competence.",["communicative","phonetic","morphological","phonological"],"تواصلية."],["L17","","If all students come from an Arabic-speaking background, it is generally safe to assume that they:",["exhibit similar developmental sequences and errors","exhibit completely different errors","acquire L2 identically","make no transfer errors"],"تسلسلات متشابهة."],["L17","","When explaining a new aspect of a foreign culture, a good teacher starts with:",["familiar aspects of the local culture, then moves to unfamiliar foreign ones","unfamiliar foreign aspects only","translation of the culture","a test on the culture"],"من المألوف."],["L17","","Competent English teachers should:",["make students aware of different varieties of English","use only one variety
