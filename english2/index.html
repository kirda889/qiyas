<style>
/* Layout: an exam answer-sheet — ruled paper, OMR bubbles for every choice, one teal ink for actions, highlighter for key terms. RTL app with LTR exam items. */
:root{
  --paper:#F5F6F1; --sheet:#FFFFFF; --ink:#16202B; --muted:#45505B; --rule:#DCE1DF; --rule-strong:#C3CBC8;
  --accent:#0B6B66; --accent-ink:#FFFFFF; --accent-soft:#DDEEEC;
  --hl:#F6E27A; --hl-ink:#3A3100;
  --good:#1B7A4A; --good-soft:#DFF1E6; --bad:#B42318; --bad-soft:#FBE3E0; --warn:#9A5B00;
  --dP:#0B6B66; --dD:#A86A12; --dT:#7A4A93; --dL:#2C5BA6;
  --shadow:0 1px 0 rgba(22,32,43,.06), 0 6px 18px -10px rgba(22,32,43,.25);
  --f-ar:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-en:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-display:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1418; --sheet:#161D22; --ink:#E4E9EC; --muted:#B1BBC2; --rule:#26313A; --rule-strong:#34424C;
  --accent:#4FB8AF; --accent-ink:#06211F; --accent-soft:#16312F;
  --hl:#5C5220; --hl-ink:#FFF3B8;
  --good:#5CC48D; --good-soft:#15301F; --bad:#F2867A; --bad-soft:#3A1A17; --warn:#E3A84A;
  --dP:#4FB8AF; --dD:#E0A54C; --dT:#B98ED1; --dL:#7FA6E8;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F1418; --sheet:#161D22; --ink:#E4E9EC; --muted:#B1BBC2; --rule:#26313A; --rule-strong:#34424C;
  --accent:#4FB8AF; --accent-ink:#06211F; --accent-soft:#16312F;
  --hl:#5C5220; --hl-ink:#FFF3B8;
  --good:#5CC48D; --good-soft:#15301F; --bad:#F2867A; --bad-soft:#3A1A17; --warn:#E3A84A;
  --dP:#4FB8AF; --dD:#E0A54C; --dT:#B98ED1; --dL:#7FA6E8;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
#app{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.en{font-family:var(--f-en);unicode-bidi:isolate;direction:ltr}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
strong{font-weight:600}
mark.term{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 .1em}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);margin-inline:-16px;padding:10px 16px}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .seal{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;color:var(--accent);font-size:.8rem;flex:none}
.brand b{font-family:var(--f-display);font-weight:600;font-size:1.02rem;white-space:nowrap}
.brand span{display:block;font-size:.74rem;color:var(--muted);line-height:1.2;white-space:nowrap}
.count{margin-inline-start:auto;text-align:center;line-height:1.1}
.count .n{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;color:var(--accent)}
.count .l{font-size:.7rem;color:var(--muted)}
.nav{display:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:4px 0;border-radius:8px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
@media (min-width:760px){
  .tabbar{display:none}
  .nav{display:flex;gap:4px;margin-inline-start:18px}
  .nav button{background:none;border:0;padding:6px 12px;border-radius:999px;color:var(--muted);font-size:.92rem}
  .nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #app{padding-bottom:60px}
}

/* sheets & cards */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.ruled{background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px)}
.section-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.section-title h2{font-size:1.1rem}
.section-title .line{flex:1;height:1px;background:var(--rule-strong)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 20px;font-weight:600;font-size:.95rem;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--rule-strong);color:var(--ink);font-weight:500}
.btn.sm{padding:6px 14px;min-height:36px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.76rem;border:1px solid var(--rule-strong);color:var(--muted);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.done{border-color:var(--good);color:var(--good)}
.chip.hot{border-color:var(--warn);color:var(--warn)}
.code{font-size:.78rem;color:var(--muted);unicode-bidi:isolate;white-space:nowrap}

/* home */
.today{display:grid;gap:14px}
.today .kicker{font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.today h1{font-size:1.45rem}
.domains{display:grid;gap:10px}
.dom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.dom .name{display:flex;gap:8px;align-items:center;min-width:0}
.dom .name b{font-weight:600;font-size:.95rem}
.dom .w{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:10px;border-radius:999px;background:var(--rule);overflow:hidden;position:relative}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--f-mono);font-size:1.45rem;font-weight:600;line-height:1.2}
.stat .k{font-size:.8rem;color:var(--muted)}
.set-date{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.set-date input{border:1px solid var(--rule-strong);background:var(--paper);border-radius:8px;padding:8px 10px;min-height:44px}

/* plan */
.plan{display:grid;gap:8px}
.day{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.day .num{font-family:var(--f-mono);text-align:center;line-height:1.1}
.day .num b{display:block;font-size:1.15rem}
.day .num span{font-size:.68rem;color:var(--muted)}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day .what{min-width:0}
.day .what .t{font-weight:600}
.day .what .s{font-size:.82rem;color:var(--muted)}
.bub{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;flex:none}
.bub.on{background:var(--good);border-color:var(--good)}
.bub.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sheet)}

/* lessons list */
.lgroup{display:grid;gap:8px}
.lcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;text-align:start;width:100%}
.lcard .idx{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);width:34px;text-align:center}
.lcard .t{font-weight:600;line-height:1.4}
.lcard .s{font-size:.82rem;color:var(--muted)}
.dhead{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.dhead .sw{width:12px;height:12px;border-radius:3px}
.dhead h2{font-size:1.05rem}
@media (max-width:560px){.dhead .code{display:none}}
.dhead .w{margin-inline-start:auto;font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}

/* lesson view */
.lesson-head{display:grid;gap:8px;padding-top:18px}
.lesson-head .en{font-size:.95rem;color:var(--muted)}
.goal{border-inline-start:3px solid var(--accent);padding-inline-start:12px;color:var(--ink)}
.lsec{display:grid;gap:10px;padding:18px 0;border-bottom:1px dashed var(--rule-strong)}
.lsec:last-of-type{border-bottom:0}
.lsec p{max-width:68ch}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.term{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;min-width:0;direction:ltr;text-align:left}
.term .tdef{font-family:var(--f-en);font-size:.9rem;line-height:1.5;margin-top:2px}
.pa{font-family:var(--f-ar);font-size:.8rem;color:var(--muted);line-height:1.6;direction:rtl;text-align:left;unicode-bidi:plaintext}
.term .pa{margin-top:3px}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:10px;direction:ltr;text-align:left}
.pts li{border-left:3px solid var(--rule-strong);padding-left:10px}
.pts .pe{font-family:var(--f-en);font-size:1rem;line-height:1.6}
.off{display:inline-block;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.04em;border:1px solid var(--good);color:var(--good);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle}
.lesson-head h1.eh1{font-family:var(--f-en);font-size:1.5rem;text-align:left;unicode-bidi:isolate}
.lsec h2.eh{font-family:var(--f-en);direction:ltr;text-align:left}
.lsec .ha{font-size:.82rem;color:var(--muted);direction:rtl;text-align:left;margin-top:-6px}
.traps ul.bi{direction:ltr;text-align:left;padding-left:18px;padding-right:0}
.traps ul.bi li .pe{font-family:var(--f-en)}
.defbox{margin-top:10px;border-top:1px dashed var(--rule-strong);padding-top:8px;direction:ltr;text-align:left;font-family:var(--f-en);font-size:.92rem}
.defbox b{font-weight:600;display:inline;margin:0}
.term .tn{font-family:var(--f-en);font-weight:600;direction:ltr;text-align:left;unicode-bidi:isolate;font-size:.92rem;overflow-wrap:anywhere}
.term .td{font-size:.86rem;color:var(--muted);line-height:1.6}
.traps{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:var(--r);padding:14px 16px}
.traps h3{color:var(--bad);margin-bottom:6px}
.traps ul{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.vids{display:grid;gap:8px}
.vid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-decoration:none;color:inherit}
.vid .play{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.vid .vt{font-weight:500;line-height:1.45}
.vid .vc{font-size:.8rem;color:var(--muted)}
.lang{font-family:var(--f-mono);font-size:.7rem;border:1px solid var(--rule-strong);border-radius:4px;padding:0 5px;color:var(--muted)}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;padding:12px 0}
.progress{flex:1;height:6px;background:var(--rule);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;min-width:64px;text-align:center}
.timer.low{color:var(--bad)}
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qtext{font-family:var(--f-en);direction:ltr;text-align:left;font-size:1.06rem;line-height:1.6;font-weight:500}
.opts{display:grid;gap:8px;margin-top:14px;direction:ltr}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-family:var(--f-en);font-size:.98rem;line-height:1.45;min-height:48px;width:100%}
.opt .b{width:28px;height:28px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .b{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .b{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt:disabled{cursor:default}
.explain{margin-top:14px;border-radius:10px;padding:12px 14px;border:1px solid var(--rule)}
.explain.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.explain.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.explain b{display:block;margin-bottom:2px}
.qnav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.grid88{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;direction:ltr}
.gq{height:34px;border-radius:50%;border:1.5px solid var(--rule-strong);background:var(--sheet);font-family:var(--f-mono);font-size:.72rem;color:var(--muted);padding:0}
.gq.ans{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.gq.cur{outline:2px solid var(--accent);outline-offset:2px}
.gq.flag{border-color:var(--warn);border-width:3px}
.confirm{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px}

/* results */
.score{display:flex;align-items:baseline;gap:10px}
.score .big{font-family:var(--f-mono);font-size:3rem;font-weight:600;line-height:1}
.rlist{display:grid;gap:10px}
.ritem{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.ritem .qtext{font-size:.95rem}
.ans-line{font-family:var(--f-en);direction:ltr;text-align:left;font-size:.9rem}
.ans-line .y{color:var(--bad);text-decoration:line-through}
.ans-line .c{color:var(--good);font-weight:600}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.mode{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px;text-align:start;display:grid;gap:6px;align-content:start;width:100%}
.mode .mt{font-family:var(--f-display);font-weight:600;font-size:1.02rem}
.mode .md{font-size:.85rem;color:var(--muted);line-height:1.6}
.mode .mx{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:.85rem;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* flashcards */
.fc{perspective:1200px}
.fc-in{position:relative;min-height:220px;border-radius:14px;border:1px solid var(--rule);background:var(--sheet);box-shadow:var(--shadow);display:grid;place-items:center;padding:24px;text-align:center;cursor:pointer;width:100%}
.fc-front{font-family:var(--f-en);font-size:1.5rem;font-weight:600;direction:ltr;line-height:1.35}
.fc-back{font-size:1.12rem;line-height:1.8}
.fc-hint{position:absolute;bottom:10px;inset-inline:0;font-size:.75rem;color:var(--muted)}

/* sheet (night-before) */
.hy{display:grid;gap:14px}
.hy-l{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 16px}
.hy-l h3{font-size:.98rem;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.hy-l ul{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:.93rem}
.tips{display:grid;gap:8px;counter-reset:t}
.tip{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.tip::before{counter-increment:t;content:counter(t);font-family:var(--f-mono);font-weight:600;width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:.8rem}

.sync{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--rule-strong)}
.sync.on i{background:var(--good)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:50;box-shadow:var(--shadow)}
textarea.report{width:100%;min-height:180px;border:1px solid var(--rule-strong);border-radius:8px;padding:10px;background:var(--paper);font-family:var(--f-mono);font-size:.8rem;direction:rtl}
@media (prefers-reduced-motion:no-preference){
  .opt,.btn,.day,.lcard,.mode{transition:border-color .15s,background-color .15s,transform .15s}
  .lcard:active,.day:active,.mode:active{transform:scale(.99)}
}

/* credit card */
.credit{display:flex;align-items:center;gap:14px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 16px}
.credit .cm{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.credit .cm svg{width:22px;height:22px}
.credit .ck{font-size:.78rem;color:var(--muted);letter-spacing:.01em}
.credit .cn{font-family:var(--f-display);font-weight:600;font-size:1.06rem;line-height:1.5}
.credit .vcount{margin-inline-start:auto;display:flex;flex-direction:column;align-items:center;line-height:1.35;padding-inline-start:14px;border-inline-start:1px solid var(--rule)}
.credit .vcount[hidden]{display:none}
.credit .vcount-n{font-weight:700;font-size:1.06rem;font-variant-numeric:tabular-nums}

/* cover, start-here, exam map */
.cover{display:grid;gap:12px}
.cover .ck{font-size:.8rem;color:var(--accent);font-weight:600;letter-spacing:.01em}
.cover h1{font-size:1.5rem}
.cover p{max-width:62ch;color:var(--muted)}
.figs{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 0;border-block:1px solid var(--rule)}
.fig{display:flex;align-items:baseline;gap:6px}
.fig b{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;color:var(--ink)}
.fig span{font-size:.82rem;color:var(--muted)}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.topics span{font-size:.8rem;border:1px solid var(--rule-strong);border-radius:999px;padding:2px 10px;color:var(--ink);background:var(--paper)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.steps{grid-template-columns:1fr}}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.step .sn{width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem}
.step.done .sn{background:var(--good);border-color:var(--good);color:var(--sheet)}
.step .st{font-weight:600;line-height:1.4}
.step .ss{font-size:.78rem;color:var(--muted)}
.map{display:grid;gap:4px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:2px 12px;align-items:center;background:none;border:0;padding:7px 4px;border-radius:8px;text-align:start;width:100%}
.mrow:hover{background:var(--paper)}
.mrow .mn{font-size:.9rem;line-height:1.45;min-width:0}
.mrow .mn .code{margin:0 6px;display:inline-block}
.mrow .mq{font-size:.8rem;color:var(--muted);text-align:end;font-variant-numeric:tabular-nums}
.mrow .mb{grid-column:1/-1;height:8px;border-radius:999px;background:var(--rule);overflow:hidden}
.mrow .mb i{display:block;height:100%;border-radius:999px}

/* theme toggle, simpler home */
.themebtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);display:grid;place-items:center;flex:none;padding:0}
.themebtn svg{width:18px;height:18px}
.or{font-size:.88rem;color:var(--muted)}
.path{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.path b{color:var(--accent);font-weight:600}
details.prog{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:0 16px}
details.prog>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;font-family:var(--f-display);font-weight:600;font-size:1.02rem}
details.prog>summary::-webkit-details-marker{display:none}
details.prog>summary .hint{font-family:var(--f-ar);font-weight:400;font-size:.8rem;color:var(--muted);margin-inline-start:auto}
details.prog>summary svg{width:18px;height:18px;flex:none;transition:transform .2s}
details.prog[open]>summary svg{transform:rotate(180deg)}
details.prog .pin{display:grid;gap:14px;padding-bottom:16px}

@media (max-width:430px){.brand span{display:none}}
.count .btn{white-space:nowrap}

/* readability: larger base, heavier weight, stronger secondary text */

.small{font-size:.92rem}
.muted{color:var(--muted)}
.tfold{margin:10px 0 2px}.tfold>summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center;font-size:.86rem;font-weight:700;color:var(--accent);border:1px solid var(--rule);border-radius:999px;padding:4px 12px}.tfold>summary::-webkit-details-marker{display:none}.tfold>summary::after{content:"＋";font-weight:400}.tfold[open]>summary::after{content:"－"}.tfold[open] .terms{margin-top:10px}

iative**|en.lis.types]]; analyzing a message before accepting it → **critical**.","للمتعة تقديري، والحكم نقدي"],["Long speeches: teach **selective listening** — note main ideas and time references.","انتقائي: دوّن الأفكار والأوقات"],["Radio, TV, movies = **non-interactive**; phone calls and face-to-face talk = interactive.","الراديو غير تفاعلي"]],"t":[["Appreciative listening","Listening for enjoyment, e.g. music or stories.","تقديري: للمتعة"],["Comprehensive listening","Listening to understand the message (lectures, directions).","استيعابي"],["Critical listening","Listening to evaluate and judge a message.","نقدي"],["Therapeutic (empathic) listening","Listening to support the speaker and show empathy.","علاجي أو تعاطفي"],["Discriminative listening","Listening to distinguish between different sounds.","تمييزي"],["Selective listening","Listening only for specific information and ignoring the rest.","انتقائي"]]},{"h":["Listener strategies and difficulties","الاستراتيجيات والصعوبات"],"pts":[["Going on despite unclear parts = [[**tolerance of ambiguity**|en.lis.strat]]; inferring missing information from context = **compensation**.","تحمّل الغموض / التعويض"],["**Cornell method** = note-taking; repeating with the speaker simultaneously = **shadowing**.","كورنيل للتدوين، والمحاكاة المتزامنة"],["[[Brown's factors|en.lis.brown]] of difficulty include reduced forms, redundancy, performance variables and **rate of delivery**.","عوامل الصعوبة عند براون"]],"t":[["Tolerance of ambiguity","Accepting that some parts of the input are unclear without stopping.","تحمّل الغموض"],["Compensation strategy","Using context and clues to make up for missing understanding.","التعويض"],["Self-monitoring","Checking one's own comprehension while listening (metacognitive).","مراقبة الفهم"],["Cornell method","A note-taking system with a cue column, notes area and summary.","طريقة كورنيل"],["Shadowing","Repeating speech simultaneously as it is heard.","المحاكاة"],["Dictogloss","Students hear a shor lternative.","ملف إنجاز / يوميات"]],"t":[["Portfolio","A purposeful collection of a student's work over time showing progress.","ملف إنجاز"],["Journal writing","Regular personal writing; low-stress practice of fluency.","يوميات"],["Correction codes","Symbols (sp, gr, ww) marking error types.","رموز التصحيح"],["Writing to learn","Using writing to represent and deepen understanding.","الكتابة للتعلم"]]},{"h":["The written corrective feedback debate","جدل التصحيح الكتابي"],"pts":[["[[**Truscott (1996)**|en.wr.wcf]]: grammar correction is ineffective; Ferris (1999): clear, selective feedback helps.","تروسكوت ضد، وفيريس مع"],["**Direct** gives the correct form; indirect only marks it (underline, code).","مباشر / غير مباشر"],["**Focused** feedback (one or a few error types) is better supported than unfocused feedback.","المركّز أنفع"],["Early drafts: **content and organisation**; later drafts: language accuracy; learners must act on the feedback.","المحتوى أولاً ثم اللغة"]],"t":[["Written corrective feedback (WCF)","Teacher or peer responses to errors in learners' writing.","التصحيح الكتابي"],["Direct corrective feedback","Providing the correct form above or near the error.","تصحيح مباشر"],["Indirect corrective feedback","Indicating an error (underlining, codes) without giving the correction.","تصحيح غير مباشر"],["Focused feedback","Correcting only selected error types.","تصحيح مركّز"],["Unfocused feedback","Correcting all or most errors in a text.","تصحيح شامل"]],"intro":[],"ex":[]},{"h":["Current trends in teaching writing","اتجاهات حديثة في تدريس الكتابة"],"pts":[["[[**Process-genre approach**|en.wr.tlc]] (Badger & White): genre knowledge + writing stages.","يجمع النوع والعملية"],["Teaching-learning cycle: context → modelling and deconstructing → **joint construction** → independent construction.","نموذج ← مشتركة ← مستقلة"],["**Peer review** needs a checklist; a writing conference is a one-to-one talk about a draft.","الأقران والمناقشة الفردية"],["**Automated writing evaluation (AWE)** helps with language; teachers guide content and academic integrity.","مساعدة لا بديل"]],"t":[["Process-genre approach","A writing approach combining genre knowledge with process stages.","منهج العملية والجنس"],["Teaching-learning cycle","Genre-based sequence: context, modelling, joint construction, independent construction.","دورة التدريس والتعلم"],["Joint construction","Teacher and learners compose a text together before independent writing.","الكتابة المشتركة"],["Peer review","Learners read and comment on each other's drafts.","مراجعة الأقران"],["Writing conference","A short one-to-one discussion between teacher and student about a piece of writing.","مناقشة فردية حول المسودة"],["Automated writing evaluation (AWE)","Software that scores or gives feedback on writing automatically.","التقييم الآلي للكتابة"]],"intro":[]},{"h":["Text types and Arab writers","أنواع النصوص والكاتب العربي"],"pts":[["The **text type** sets tense, vocabulary and register; freewriting and outlining are pre-writing.","نوع النص يحدد الزمن والرسمية"],["[[**Contrastive rhetoric**|en.wr.kaplan]] (Kaplan): Arabic links ideas with 'wa'; Arab writers struggle with cohesion and organisation.","الصعوبة في التماسك"],["Fewer full stops in Arabic → English **run-on sentences**; teach punctuation.","علامات الترقيم"]],"t":[["Contrastive rhetoric","The study of how the organisation of writing differs across languages and cultures (Kaplan).","البلاغة التقابلية"]]},{"h":["Matching writing tasks to level and purpose","مواءمة مهام الكتابة للمستوى والهدف"],"pts":[["A **complaint letter** suits intermediate and advanced learners.","للمتوسط والمتقدم"],["**Reproduction** task: write down content seen, heard or read, as it was.","إعادة إنتاج المحتوى"]],"t":[["Transition words","Linking words such as moreover, hence, in addition that connect ideas smoothly.","كلمات الانتقال والربط"],["Reproduction task","A writing task in which learners record content they have seen or heard rather than create or evaluate it.","مهمة إعادة الإنتاج"]]}],"trap":[["Asking peers and the teacher for help = revising stage.","المراجعة"],["Dictation = controlled writing.","الإملاء مضبوطة"],["Thesis statement is broader than a topic sentence.","الأطروحة أعمّ"],["'Hi Anas' = incorrect register in a formal letter.","سجل خطأ"]],"vid":[["91HVPAlZ0UU","ar","مراحل عملية الكتابة","الدافورة",41],["q388D3zX0IQ","ar","أنواع الأنشطة الكتابية","الدافورة",30],["PAoez1yqx6w","en","Giving feedback on EFL writing","Jo Gakonga",33]],"n":5},{"id":"L06","d":"P","std":"6.9.1","en":"Teaching Grammar","ar":"تدريس القواعد","goal":["Distinguish deductive from inductive teaching; know form–meaning–use and the main lesson frameworks.","الاستنتاجي والاستقرائي وأطر الدروس"],"sec":[{"h":["Deductive vs inductive","استنتاجي واستقرائي"],"pts":[["[[**Deductive**|en.gr.dedind]]: the rule is presented first, then examples (rule → example).","القاعدة ثم الأمثلة"],["**Inductive**: examples first; learners discover the rule (example → rule), e.g. guided discovery.","الأمثلة ثم القاعدة"]],"t":[["Deductive approach","Presenting a rule first and then applying it in examples.","استنتاجي"],["Inductive approach","Learners work out the rule from examples.","استقرائي"],["Guided discovery","The teacher leads learners to discover rules through questions and examples.","اكتشاف موجه"],["Explicit vs implicit teaching","Stating rules openly vs learning them without explanation.","صريح / ضمني"]]},{"h":["Good grammar teaching","التدريس الجيد للقواعد"],"pts":[["[[Larsen-Freeman|en.gr.fmu]]: grammar = **form, meaning and use**.","شكل ومعنى واستخدام"],["Grammar in context, practice to internalize, accepting developmental grammar; **non-contextualized drills** are NOT good practice.","بلا سياق = ممارسة سيئة"],["[[**Focus on form**|en.gr.fonf]]: brief attention inside a communicative task; focus on forms: discrete structures.","على الشكل / على الأشكال"],["**Consciousness-raising** draws attention to language features; a gap-fill = controlled practice.","رفع الوعي"]],"t":[["Form – meaning – use","Larsen-Freeman's three dimensions of grammar.","الأبعاد الثلاثة"],["Focus on form (FonF)","Drawing attention to linguistic form during meaning-focused activity.","التركيز على الشكل"],["Focus on forms","Teaching discrete grammatical structures one by one.","التركيز على الأشكال"],["Consciousness-raising","Activities that make learners notice grammatical features.","رفع الوعي"],["Structure-based instruction","Instruction focused on the language itself (vocabulary and grammar).","تعليم قائم على البنية"]],"intro":[],"ex":[["Pairs planning a trip keep saying *We will going*; the teacher fixes it in one minute and the task goes on — **focus on form**.","وقفة دقيقة ثم يكمل النشاط"]]},{"h":["Lesson frameworks","أطر الدروس"],"pts":[["[[**PPP**|en.gr.frames]]: Presentation → Practice → Production (the effective order).","عرض ← ممارسة ← إنتاج"],["**TTT**: Test → Teach → Test; the first test finds out what students know.","اختبار يكشف ما يعرفونه"],["**ESA** (Harmer): Engage → Study → Activate.","شدّ، دراسة، تفعيل"],["[[**CCQs**|en.gr.ccq]] check meaning; ICQs check instructions; timelines teach tenses.","فحص المفهوم والتعليمات"]],"t":[["PPP","Presentation, Practice, Production.","عرض، ممارسة، إنتاج"],["TTT","Test, Teach, Test.","اختبار، تعليم، اختبار"],["ESA","Engage, Study, Activate (Harmer).","إطار هارمر"],["CCQs","Concept-checking questions that verify understanding of meaning.","أسئلة فحص المفهوم"],["ICQs","Instruction-checking questions that verify understanding of a task.","أسئلة فحص التعليمات"]],"intro":[],"ex":[]},{"h":["Grammar points that appear in the exam","نقاط قواعد تتكرر"],"pts":[["The **present perfect** is the hardest tense for beginners (no direct Arabic equivalent).","المضارع التام الأصعب"],["'I have broken it yesterday' ✗ — finished past time needs the **past simple**.","وقت محدد = ماضٍ بسيط"],["Present perfect continuous: 'I **have been working** on this book for ten months.'","مضارع تام مستمر"],["Comparing two pictures uses the **present** tense.","مقارنة الصور = مضارع"],["'The pupils you and me saw' → you and **I** (subject).","you and I"]],"t":[["Present perfect","have/has + past participle; links past to present, no specific past time.","مضارع تام"],["Present perfect continuous","have/has been + -ing; an action continuing up to now (for/since).","مضارع تام مستمر"]]},{"h":["Teaching conditionals","تدريس الجمل الشرطية"],"pts":[["[[**Zero**|en.gr.cond]]: If + present, present — general truths ('If you heat ice, it melts').","حقائق عامة"],["**First**: If + present, will + base — real or likely future.","مستقبل محتمل"],["**Second**: If + past, would + base — unreal present/future ('If I had a million riyals…').","خيالي في الحاضر"],["**Third**: If + past perfect, would have + past participle — unreal past, regret.","خيالي في الماضي"],["No **will in the if-clause**; CCQs: 'Did she study? (No) Did she pass? (No)'.","لا will بعد if"]],"t":[["Zero conditional","If + present, present: general truths and facts.","الشرط الصفري"],["First conditional","If + present, will + base form: real future possibility.","الشرط الأول"],["Second conditional","If + past simple, would + base form: unreal present or future.","الشرط الثاني"],["Third conditional","If + past perfect, would have + past participle: unreal past.","الشرط الثالث"],["Mixed conditional","Combines times, e.g. past condition with present result ('If I had studied medicine, I would be a doctor now').","شرط مختلط"]]},{"h":["Teaching reported speech","تدريس الكلام المنقول"],"pts":[["After a past reporting verb, tenses **shift back** (will → would; tomorrow → the next day).","الرجوع خطوة في الزمن"],["Backshift is **optional** when still true: 'He said the sun rises in the east.'","اختياري إذا بقي صحيحاً"],["**tell** needs a person object ('told me'); say does not.","tell تحتاج مفعولاً"],["[[Reported questions|en.gr.reported]]: **statement word order** ('He asked where I lived'); yes/no → if/whether.","ترتيب الخبر"]],"t":[["Backshift","Moving a verb one tense back in reported speech after a past reporting verb.","الإرجاع الزمني"],["Reporting verb","A verb that introduces reported speech: say, tell, ask, explain, suggest.","فعل النقل"],["Reported question","An indirect question with statement word order, introduced by a wh-word or if/whether.","سؤال منقول"]]},{"h":["Teaching articles and countable/uncountable nouns","تدريس أدوات التعريف والمعدود وغير المعدود"],"pts":[["[[**a/an**|en.gr.articles]] by sound: an hour, a university; **the** = known, unique or specific.","a/an حسب الصوت، وthe للمحدد"],["**Zero article** for general plural or uncountable nouns: 'Cats are clever.'","بلا أداة للتعميم"],["'The life is hard' = [[**negative transfer**|en.gr.transfer]] from Arabic 'al-'.","«ال» العامة من العربية"],["Uncountable: information, advice, news, homework — count with **partitives** (a piece of advice).","لا جمع لها"],["**many / a few** + countable; much / a little + uncountable.","many للمعدود"]],"t":[["Zero article","Using no article, e.g. with plural or uncountable nouns in general statements.","غياب الأداة"],["Generic reference","Referring to a whole class of things rather than specific ones ('Dogs are loyal').","إحالة عامة"],["Uncountable (mass) noun","A noun with no plural form that cannot take a/an (water, advice).","اسم غير معدود"],["Partitive","An expression that counts an uncountable noun (a piece of, a cup of, a slice of).","تعبير التجزئة"]]},{"h":["Teaching the passive and relative clauses","تدريس المبني للمجهول وجمل الصلة"],"pts":[["Passive = **be + past participle**, when the agent is unknown, unimportant or obvious.","be + التصريف الثالث"],["Only [[**transitive**|en.ling.transitivity]] verbs have a passive: '*The accident was happened' ✗.","لا مجهول للفعل اللازم"],["Teach the passive through **process descriptions** and news headlines.","وصف العمليات والأخبار"],["[[Relative clauses|en.gr.passrel]]: **defining** — no commas; non-defining — commas, no 'that'.","المحددة بلا فواصل"],["Arab learners add a **resumptive pronoun** ('the book that I read it').","الضمير العائد"]],"t":[["Agentless passive","A passive sentence without a by-phrase because the agent is unknown or unimportant.","مجهول بلا فاعل"],["Defining relative clause","A relative clause that identifies which person or thing is meant; no commas.","صلة محددة"],["Non-defining relative clause","A relative clause adding extra information, set off by commas; 'that' is not used.","صلة غير محددة"],["Resumptive pronoun","An extra pronoun repeating the antecedent inside a relative clause ('*the man whom I met him').","الضمير العائد"]]},{"h":["Current trends in grammar teaching","اتجاهات حديثة في تدريس القواعد"],"pts":[["[[**Processing Instruction**|en.gr.pi]] (VanPatten): structured input forces attention to form before production.","مدخلات مُهيكلة قبل الإنتاج"],["**Input enhancement** (Sharwood Smith): bold, colour or underlining; input flood: many examples.","إبراز الشكل والإغراق"],["**Dictogloss**: hear, note, reconstruct in groups — meaning plus form.","إعادة بناء النص"],["All apply [[**noticing**|en.sla-interaction]] (Schmidt).","فرضية الملاحظة"]],"t":[["Processing Instruction","VanPatten's input-based approach that pushes learners to make correct form–meaning connections.","تعليم المعالجة"],["Structured input","Input activities designed so that learners must process a target form to understand meaning.","مدخلات مُهيكلة"],["Input enhancement","Making target forms more salient in input, e.g. by highlighting or bolding.","تعزيز المدخلات"],["Input flood","Providing input containing many instances of a target form.","إغراق المدخلات"]],"intro":[],"ex":[]},{"h":["Inside PPP and checking meaning","داخل مراحل PPP والتحقق من المعنى"],"pts":[["**Presentation**: new form in context — the stage with the most teacher control.","العرض: أعلى تحكم"],["**Practice**: controlled activities (drills, gap-fills) for accuracy.","الممارسة: دقة"],["**Production**: free communicative use for fluency; delayed f , cognition, culture.","دمج المحتوى واللغة"],["Competency-based language teaching","Teaching organized around what learners can do in the language.","تدريس الكفايات"]],"intro":[],"ex":[]},{"h":["Cooperative learning and engagement","التعلم التعاوني والاندماج"],"pts":[["[[Cooperative learning|en.meth.coop]] builds **critical thinking and problem-solving** and **interpersonal** skills; it enhances negotiation of meaning.","تعاوني"],["Project work is **student-centred** (NOT teacher-centred).","المشروع للطالب"],["Engagement rises with **learning by doing**, more wait time and less teacher talk.","التعلم بالعمل"],["Think-Pair-Share promotes **discussion**; pair work fosters respect and friendship.","فكّر وزاوج وشارك"],["Anxiety is reduced when teachers act as **partners and mentors**.","شريك ومرشد","o"]],"t":[["Cooperative learning","Small-group learning with positive interdependence and individual accountability.","تعلم تعاوني"],["Think-Pair-Share","Think alone, discuss with a partner, share with the class.","فكّر، زاوج، شارك"],["Learner-centred instruction","Students are the main focus; the teacher acts as a guide.","متمحور حول الطالب"],["Two Stars and a Wish","Peer feedback: two strengths and one improvement.","نجمتان وأمنية"]],"intro":[],"ex":[]},{"h":["Modern approaches and trends","مداخل واتجاهات حديثة"],"pts":[["**Flipped classroom**: material studied before class; class time for discussion.","الصف المقلوب"],["[[**Eclectic method**|en.meth.postmethod]]: choosing the most suitable techniques from different methods.","الانتقائية: الأنسب"],["A rising trend in TESOL: the **gamification** of lessons.","التلعيب"],["Biggest shift: from the **teacher to the student**; the ideal teacher has linguistic and [[intercultural competence|en.l17-icc]].","من المعلم للطالب"],["**Socratic method** = teaching through questions; symposium = discussion; inquiry = question and answer.","سقراطية / ندوة"]],"t":[["Flipped classroom","Content is studied at home; class time is used for prac h",20],["TI4V2LS8ekY","en","Task-Based Learning explained simply","Jo Gakonga",8]],"map":{"title":["Teaching Methods II","⁧التواصلي والاتجاهات الحديثة⁩"],"groups":[{"n":"Communicative Language Teaching","short":"CLT","ar":"⁧التدريس التواصلي⁩","items":[{"n":"Competence","who":"Hymes","ar":"⁧معرفة المناسب للموقف⁩","d":"en.meth.clt"},{"n":"Functions","who":"Wilkins","ar":"⁧منهج المفاهيم والوظائف⁩","d":"en.meth.clt"},{"n":"4 parts","who":"Canale & Swain","ar":"⁧أربعة مكونات للكفاية⁩","d":"en.sla-cc"}]},{"n":"Task-Based","short":"TBLT","ar":"⁧التعلم بالمهام⁩","items":[{"n":"Origins","who":"Prabhu · Long","ar":"⁧مشروع بنغالور⁩","d":"en.meth.tblt"},{"n":"Task cycle","who":"Willis","ar":"⁧مهمة ثم تركيز لغوي⁩","d":"en.meth.tblt"}]},{"n":"Content & CLIL","short":"CBI / CLIL","ar":"⁧التعلم بالمحتوى⁩","items":[{"n":"CBI","who":"Brinton et al.","ar":"⁧موضوعي ومحمي ومساند⁩","d":"en.meth.cbi"},{"n":"CLIL 4Cs","who":"Coyle","ar":"⁧محتوى وتواصل وإدراك وثقافة⁩","d":"en.meth.cbi"}]},{"n":"Cooperative","ar":"⁧التعلم التعاوني⁩","items":[{"n":"Cooperative","who":"D&R Johnson","ar":"⁧اعتماد متبادل ومسؤولية فردية⁩","d":"en.meth.coop"},{"n":"Jigsaw","who":"Aronson","ar":"⁧كل عضو خبير في جزء⁩","d":"en.meth.coop"}]},{"n":"Modern trends","short":"Trends","ar":"⁧اتجاهات حديثة⁩","items":[{"n":"Post-method","who":"Kumaravadivelu","ar":"⁧خصوصية وعملية وإمكان⁩","d":"en.meth.postmethod"},{"n":"Eclectic","ar":"⁧الأنسب لا الأسهل⁩","d":"en.meth.postmethod"},{"n":"Flipped","who":"Bergmann·Sams","ar":"⁧الشرح في البيت والتطبيق صفياً⁩","d":"en.meth.postmethod"}]}]},"n":8},{"id":"L09","d":"P","std":"6.9.3","en":"Assessment I: Types & Principles","ar":"التقويم 1: الأنواع والمبادئ","goal":["Know test types by purpose, formative vs summative, and Brown's five principles — especially washback.","أنواع الاختبارات ومبادئها"],"sec":[{"h":["Testing, assessment, evaluation","القياس والتقويم والتقييم"],"pts":[["A **test** is a formal procedure; [[**assessment**|en.assess.terms]] is an ongoing process of gathering information.","اختبار / تقويم"],["**Evaluation** determines the merit and worth of a learning process or programme.","التقييم حكم على البرنامج"],["**Assessment information** is used to guide teaching and modify programmes according to students' needs.","معلومات التقويم توجّه التدريس","o"]],"t":[["Test","A formal procedure for measuring ability or knowledge.","اختبار"],["Assessment","The ongoing process of collecting information about learning.","تقويم"],["Evaluation","A systematic judgment of the merit, value and worth of a programme or process.","تقييم"]],"intro":[],"ex":[]},{"h":["Formative vs summative","تكويني وختامي"],"pts":[["[[Formative|en.assess.formative]]: during learning; ongoing feedback **without interrupting instruction** (discussions, pop quizzes, exit tickets).","تكويني أثناء التعلم","o"],["**Summative**: at the end of a unit, term or programme; usually formal tests.","ختامي في النهاية"],["**Pop quizzes** roughly monitor progress and keep students on their toes.","اختبارات مفاجئة","o"],["**Diagnostic** assessment is needed **prior to instruction**.","التشخيصي قبل التدريس"],["A teacher observing a role-play = **informal** assessment.","ملاحظة = غير رسمي"]],"t":[["Formative assessment","Ongoing assessment during learning to improve it.","تكويني"],["Summative assessment","Assessment at the end of instruction to measure achievement.","ختامي"],["Pop quiz","A short unannounced quiz to check progress.","اختبار مفاجئ"],["Informal assessment","Spontaneous, unplanned assessment such as observation.","غير رسمي"],["Assessment for / of / as learning","Formative / summative / self-assessment & metacognition.","من أجل / للتعلم / كتعلم"]],"intro":[],"ex":[]},{"h":["Test types by purpose","أنواع الاختبارات حسب الغرض"],"pts":[["[[Proficiency|en.assess.purpose]]: general ability, not based on a particular course.","كفاءة بلا مقرر"],["**Placement**: assigns suitable levels; creates **homogeneous** groups.","تصنيف: مجموعات متقاربة"],["**Diagnostic**: identifies strengths and weaknesses.","تشخيصي","o"],["**Achievement**: learning of a particular course; progress: recently taught material.","تحصيلي / مرحلي"],["**Aptitude**: predicts success in learning a language.","استعداد"],["Surveys and questionnaires = [[**needs** assessment|en.plan.needs]]; course evaluation is an **indirect** method.","احتياجات / غير مباشر"]],"t":[["Proficiency test","Measures general language ability regardless of any course.","كفاءة"],["Placement test","Places learners in the appropriate level or programme.","تصنيف"],["Diagnostic test","Identifies learners' strengths and weaknesses.","تشخيصي"],["Achievement test","Measures how well course objectives were achieved.","تحصيلي"],["Progress test","Measures learning of recently taught material.","تقدم"],["Aptitude test","Predicts a person's success in learning a foreign language.","استعداد"]],"intro":[],"ex":[]},{"h":["Test formats","صيغ الاختبارات"],"pts":[["[[Norm-referenced|en.assess.nrt]] compares test-takers with each other; **criterion-referenced** compares with set objectives.","مرجعي المعيار / المحك"],["[[Discrete-point|en.assess.discrete]] tests one element; **integrative** tests several skills — an essay best evaluates integrated skills.","نقطي / تكاملي"],["**Objective** items have one correct answer and are scored reliably and quickly (e.g. a gap-fill grammar test).","موضوعي"],["Deleting words from a paragraph for students to fill in = **cloze test**.","اختبار الإكمال"]],"t":[["Norm-referenced test","Interprets scores relative to other test-takers.","مرجعي المعيار"],["Criterion-referenced test","Interprets scores against fixed criteria or objectives.","مرجعي المحك"],["Discrete-point test","Tests one language element at a time.","نقطي"],["Integrative test","Tests several skills or components together.","تكاملي"],["Objective test","A test with one correct answer per item, scored without judgment.","موضوعي"],["Subjective test","A test scored by rater judgment (essays, interviews).","ذاتي"],["Cloze test","A text with deleted words that learners restore.","اختبار الإكمال"]],"intro":[],"ex":[]},{"h":["Principles of a good test","مبادئ الاختبار الجيد"],"pts":[["Brown's [[five principles|en.assess.principles]]: **practicality, reliability, validity, authenticity, washback**.","المبادئ الخمسة"],["The impact of testing on teaching and learning, negative or positive = [[**washback**|en.assess.washback]].","الأثر الرجعي"],["A well-prepared exam is **valid and reliable**; validity is the most important.","صادق وثابت، والصدق الأهم"],["Portfolios and projects = [[**alternative / performance-based**|en.assess.alt]] assessment; portfolios track progress over time.","تقويم بديل"]],"t":[["Practicality","Ease of administration in time, cost and scoring.","العملية"],["Reliability","Consistency of results.","الثبات"],["Validity","The degree to which a test measures what it is intended to measure.","الصدق"],["Authenticity","Correspondence of test tasks to real-world language use.","الأصالة"],["Washback (backwash)","The effect of testing on teaching and learning.","الأثر الرجعي"],["Alternative assessment","Portfolios, journals, conferences, self/peer assessment.","تقويم بديل"],["Self-assessment","Learners evaluate their own work.","تقويم ذاتي"]],"intro":[],"ex":[]},{"h":["The CEFR: levels and can-do descriptors","الإطار الأوروبي المرجعي: المستويات وعبارات can-do"],"pts":[["The [[CEFR|en.assess.cefr]] (Council of Europe, 2001; Companion Volume 2020) is a reference framework — **not a test**; six levels in three bands.","إطار مرجعي وليس اختباراً، بستة مستويات"],["Descriptors are positive **can-do statements** (action-oriented approach); the 2020 update added mediation.","عبارات «أستطيع» إيجابية"],["Uses: aligning curricula and tests, writing objectives, and learner **self-assessment**.","مواءمة المناهج والتقييم الذاتي"]],"t":[["CEFR","Common European Framework of Reference for Languages: six proficiency levels from A1 to C2.","الإطار الأوروبي المرجعي"],["Can-do statements","Positive descriptors of what learners can do in a language at a given level.","عبارات أستطيع أن"],["Basic / independent / proficient user","The three CEFR bands: A1–A2, B1–B2, C1–C2.","النطاقات الثلاثة"],["Action-oriented approach","The CEFR view of learners as social agents who use language to complete tasks.","منهج موجّه نحو الفعل"],["Mediation","Helping others understand a text or concept, or bridging between people — a CEFR mode of communication.","الوساطة"],["European Language Portfolio","A document in which learners record language experiences and self-assess against CEFR levels.","ملف اللغة الأوروبي"]],"intro":[],"ex":[],"map":{"type":"fan","title":["CEFR levels","⁧مستويات الإطار الأوروبي⁩"],"groups":[{"n":"A1–A2 basic user","ar":"⁧عبارات يومية بسيطة ← مواقف روتينية مألوفة⁩","d":"en.assess.cefr"},{"n":"B1–B2 independent user","ar":"⁧النقاط الرئيسية ومواقف السفر ← نصوص معقدة وطلاقة وعفوية⁩","d":"en.assess.cefr"},{"n":"C1–C2 proficient user","ar":"⁧نصوص طويلة ومعانٍ ضمنية ← فهم كل شيء تقريباً بسهولة⁩","d":"en.assess.cefr"}]}},{"h":["International standardized proficiency tests","الاختبارات الدولية المقننة"],"pts":[["A **standardized test** uses uniform conditions and scoring, so results compare across test-takers.","ظروف وتصحيح موحّد"],["[[**IELTS**|en.assess.intl]]: Academic and General Training; four skills; **band scale of 0–9**; speaking is a face-to-face interview.","آيلتس: 0–9 ومقابلة"],["**TOEFL iBT** (ETS): academic English; speaking is recorded, no live examiner; since 21 January 2026 a 1–6 CEFR-aligned scale.","توفل: محادثة مسجّلة ومقياس 1–6"],["Cambridge exams target one CEFR level each: **A2 Key (KET)**, **B1 Preliminary (PET)**, B2 First, C1 Advanced, C2 Proficiency.","KET = A2 وPET = B1"],["All are **high-stakes** proficiency tests, so they create strong washback.","اختبارات كفاءة عالية التأثير"]],"t":[["Standardized test","A test given and scored in a consistent, predetermined way so scores are comparable.","اختبار مقنن"],["IELTS","International English Language Testing System: Academic and General Training versions, band scores 0–9.","آيلتس"],["TOEFL iBT","ETS's internet-based Test of English as a Foreign Language for academic settings; since January 2026 scored on a 1–6 band scale.","توفل"],["A2 Key (KET)","Cambridge exam at CEFR A2 (Key English Test).","اختبار كامبريدج A2"],["B1 Preliminary (PET)","Cambridge exam at CEFR B1 (Preliminary English Test).","اختبار كامبريدج B1"],["High-stakes test","A test whose results have important consequences (admission, jobs, visas).","اختبار عالي المخاطر"]],"intro":[],"ex":[]},{"h":["Formal and informal formative assessment","التقويم التكويني الرسمي وغير الرسمي"],"pts":[["**Formal formative**: planned, recorded tasks (quizzes, worksheets) marked and returned with feedback.","رسمي: مهام مصححة أثناء التعلم"],["**Informal formative**: on-the-spot checks — observation, questioning, thumbs up/down — usually not graded.","غير رسمي: ملاحظة وأسئلة سريعة"]],"t":[["Formal formative assessment","Planned, marked tasks during a unit used to give feedback and guide learning.","تقويم تكويني رسمي"]],"intro":[],"ex":[]},{"h":["Peer assessment and beneficial washback","تقييم الأقران والأثر الرجعي الإيجابي"],"pts":[["**Peer assessment**: learners judge a classmate's work against the teacher's criteria; **self-assessment**: their own work.","الأقران / الذات"],["**Beneficial (positive) washback**: a good test encourages useful learning (a speaking test → more speaking practice).","الاختبار يوجه لتعلم مفيد"]],"t":[["Peer assessment","Learners evaluate each other's work using shared criteria.","تقييم الأقران"],["Beneficial washback","A positive effect of a test on classroom teaching and learning.","أثر رجعي إيجابي"]],"intro":[],"ex":[]}],"trap":[["Testing's positive or negative impact on teaching = washback (very frequent).","الأثر الرجعي"],["Proficiency tests are not based on a particular programme.","الكفاءة بلا مقرر"],["Placement creates homogeneous (similar-level) groups.","متقاربة"]],"vid":[["sBOwSFW1zI8" "items":[{"n":"Practicality","ar":"⁧الوقت والتكلفة والتصحيح⁩","d":"en.assess.principles"},{"n":"Reliability","ar":"⁧نتائج متسقة⁩","d":"en.assess.reliability"},{"n":"Validity","ar":"⁧الأهم: يقيس ما وُضع له⁩","kw":["most important"],"d":"en.assess.validity"},{"n":"Authenticity","ar":"⁧مهام تشبه الواقع⁩","d":"en.assess.principles"},{"n":"Washback","ar":"⁧أثر الاختبار على التدريس⁩","kw":["backwash"],"d":"en.assess.washback"}],"trap":"⁧أثر الاختبار الإيجابي أو السلبي = washback⁩"}]},"n":9},{"id":"L10","d":"P","std":"6.9.3","en":"Assessment II: Validity, Reliability, Rubrics & Feedback","ar":"التقويم 2: الصدق والثبات والسلالم والتغذية","goal":["Distinguish types of validity and reliability, analytic vs holistic rubrics, and principles of feedback.","أنواع الصدق والثبات والتغذية"],"sec":[{"h":["Validity","الصدق"],"pts":[["When an assessment fails to measure what it is set for, it lacks [[**validity**|en.assess.validity]].","يفتقد الصدق"],["Content validity is supported by a [[**table of specifications**|en.assess.tos]] linking items to objectives and content.","جدول المواصفات"],["Construct validity is threatened when scores depend on something else — memory in a long listening test, speed in a reading test.","قياس شيء غير المقصود"]],"t":[["Content validity","The test adequately samples course content and objectives.","صدق المحتوى"],["Construct validity","The test measures the theoretical construct it claims to measure.","صدق البناء"],["Face validity","The test appears valid to test-takers.","صدق ظاهري"],["Predictive validity","The test predicts future performance.","صدق تنبؤي"],["Concurrent validity","Results agree with another valid measure given at the same time.","صدق تلازمي"],["Table of specifications","A blueprint linking items to content and objectives.","جدول المواصفات"]],"intro":[],"ex":[],"map":{"type":"fan","title":["Types of validity","⁧أنواع الصدق⁩"],"groups":[{"n":"Content","ar":"⁧يمثّل محتوى المقرر وأهدافه⁩","items":[{"n":"table of specifications"}],"d":"en.assess.validity"},{"n":"Criterion-related","ar":"⁧يتفق مع مقياس آخر أو يتنبأ بالأداء⁩","items":[{"n":"concurrent"},{"n":"predictive"}],"d":"en.assess.validity"},{"n":"Construct","ar":"⁧يقيس المفهوم نفسه لا غيره⁩","items":[{"n":"reading speed ≠ reading"}],"d":"en.assess.validity"},{"n":"Face","ar":"⁧يبدو مناسباً للمختبَرين⁩","d":"en.assess.validity"}]}},{"h":["Reliability","الثبات"],"pts":[["[[**Reliability**|en.assess.reliability]]: the extent to which a task consistently yields the same results.","الثبات"],["**Inter-rater reliability** is checked by several teachers scoring the same work.","أكثر من معلم"],["A test can be reliable without being valid, but not valid without being reliable.","الثبات شرط للصدق"]],"t":[["Test–retest reliability","Giving the same test twice to the same learners.","إعادة الاختبار"],["Parallel-forms reliability","Comparing two equivalent versions of a test.","صور متكافئة"],["Internal consistency","Agreement among items (split-half, Cronbach's alpha).","اتساق داخلي"],["Inter-rater reliability","Consistency between different raters.","بين المصححين"],["Intra-rater reliability","Consistency of one rater over time.","المصحح نفسه"]],"intro":[],"ex":[]},{"h":["Rubrics and items","سلالم التقدير والأسئلة"],"pts":[["A [[**rubric**|en.assess.rubrics]] grades work against criteria; its main benefit is making criteria **clear** to students.","سلّم التقدير يوضح المعايير"],["**Analytic**: a score per criterion; **holistic**: one overall score (limitation: no specific feedback).","تحليلي / كلي"],["Co-constructing rubrics helps learners **view assessment as an effective educational tool**.","بناؤه مع الطلاب"],["An objective item has a **single correct answer**; wrong options are **distractors**.","إجابة واحدة ومشتتات"]],"t":[["Rubric","A scoring guide with criteria and performance levels.","سلّم تقدير"],["Analytic rubric","Gives a separate score for each criterion.","تحليلي"],["Holistic rubric","Gives one overall score for the whole performance.","كلي"],["Stem / key / distractors","Question text / correct answer / wrong options.","جذع / مفتاح / مشتتات"],["Item discrimination","An item's ability to distinguish high from low achievers.","معامل التمييز"],["Item facility","The proportion of test-takers answering correctly.","معامل السهولة"]],"intro":[],"ex":[]},{"h":["Feedback","التغذية الراجعة"],"pts":[["[[Feedback|en.assess.feedback]] informs **both students and teachers**.","للطالب والمعلم"],["Effective feedback is **timely, specific, clear, focused, balanced, helpful and impersonal**, linked to objectives.","مبادئ التغذية"],["**Content feedback** addresses ideas; **form feedback** addresses language accuracy.","محتوى / شكل"],["Effective teachers encourage long-term achievement through [[**self-evaluation**|en.assess.alt]].","التقويم الذاتي"]],"t":[["Feedback","Information given to learners about their performance to guide improvement.","تغذية راجعة"],["Content feedback","Comments on ideas and meaning.","على المحتوى"],["Form feedback","Comments on grammar, vocabulary and mechanics.","على الشكل"],["Constructive alignment","Objectives, activities and assessment aligned (Biggs).","مواءمة بنائية"]],"intro":[],"ex":[]},{"h":["How to test each skill","كيف نختبر كل مهارة"],"pts":[["[[**Direct**|en.assess.direct]] testing = performing the skill itself; **indirect** = underlying abilities (e.g. spotting errors to estimate writing).","المباشر أداء المهارة"],["Direct tests suit productive skills: they reflect the real skill and create positive [[washback|en.assess.washback]].","المباشر أفضل للإنتاجية"],["**Listening**: gap-fill, multiple choice, **information transfer** (map, table, form), dictation — not memory or reading.","تحويل المعلومات وتعبئة الفراغ"],["**Reading**: true/false/not given, matching headings, short answers; items need the text (**passage dependence**).","الأسئلة تعتمد على النص"],["Speaking and writing: scored with a **rubric**, ideally two raters; writing needs a clear prompt (purpose, audience, length).","معيار تصحيح ومصححان"],["**Grammar & vocabulary**: gap-fill, sentence transformation, word formation, [[**C-test**|en.assess.ctest]].","تحويل وتكوين كلمات وC-test"]],"t":[["Direct test","A test in which candidates perform the actual skill being measured.","اختبار مباشر"],["Indirect test","A test that measures the abilities underlying a skill rather than the skill itself.","اختبار غير مباشر"],["Information transfer","A task where learners move information from a text or recording into a chart, map or form.","تحويل المعلومات"],["Passage dependence","The extent to which reading items can only be answered by reading the passage.","الاعتماد على النص"],["C-test","A reduced-redundancy test in which the second half of every second word is deleted.","اختبار C"]],"intro":[],"ex":[]},{"h":["Analysing test results to improve teaching","تحليل النتائج لتحسين التدريس"],"pts":[["[[**Item facility (IF)**|en.assess.items]] = correct ÷ total. 15 of 20 → IF = 0.75; keep items between about 0.15 and 0.85.","السهولة = الصحيح ÷ العدد"],["**Item discrimination (ID)** = (high correct − low correct) ÷ (½ × both groups); e.g. (8−2) ÷ 10 = 0.6.","التمييز بين العليا والدنيا"],["ID ranges from −1 to +1; a **negative** ID signals a **faulty item** — revise or remove it.","التمييز السالب = سؤال معيب"],["**Distractor analysis**: a distractor nobody chooses isn't working; one attracting high scorers may be ambiguous.","مشتت لا يختاره أحد = غير فعال"],["[[Descriptive statistics|en.assess.stats]]: mean, median, mode, range and **standard deviation** (spread).","المتوسط والوسيط والمنوال والانحراف"],["If most of the class fails one objective, **reteach** it; keep records to plan remediation.","إعادة تدريس الهدف الضعيف"]],"t":[["Item analysis","Examining each test item's facility, discrimination and distractors after a test.","تحليل الفقرات"],["Distractor analysis","Checking how many test-takers chose each wrong option and who chose it.","تحليل المشتتات"],["Mean","The arithmetic average of a set of scores.", sessment","Teachings in Education",2]],"n":10},{"id":"L11","d":"D","std":"6.9.5","en":"Learning Objectives & Bloom's Taxonomy","ar":"الأهداف وتصنيف بلوم","goal":["Write measurable objectives, classify verbs on Bloom's levels and know the three domains.","هدف قابل للقياس وتصنيف بلوم"],"sec":[{"h":["Goals vs objectives","الغايات والأهداف"],"pts":[["[[Goals|en.obj.goals]] are **more general** (long-term); objectives are specific, observable and measurable.","الغاية أعمّ"],["'Students will understand the plot' belongs under **learning goals**.","تُكتب غاية"],["Key question: **What should my students have learned by the end of this lesson?**","ماذا يتعلمون؟"],["General outcome: 'write academically'; specific outcome: 'use the present tense in reports'.","عام / محدد"]],"t":[["Goal","A broad, long-term statement of intended learning.","غاية"],["Objective","A specific, observable and measurable statement of what learners will do.","هدف"],["Learning outcome","What learners are expected to be able to do after instruction.","ناتج التعلم"]],"intro":[],"ex":[]},{"h":["Writing good objectives","كتابة الهدف الجيد"],"pts":[["Objectives are [[**SMART**|en.obj.smart]] and begin with action verbs; conditions of good objectives — all EXCEPT **general/broad**.","ذكي وبفعل إجرائي"],["Measurable: 'Students will pronounce /p/ and /b/' — NOT 'be familiar with sounds'.","قابل للقياس"],["Good verbs: identify, list, **distinguish**, compare, write; avoid know, understand, appreciate.","أفعال تصلح / لا تصلح"],["A good elementary objective: 'listen **with the purpose of following directions**'.","اتباع التعليمات","o"],["Written by the **teacher**, shared **before and during** teaching; letting students personalize them raises motivation.","يكتبها المعلم ويشرحها"]],"t":[["SMART","Specific, Measurable, Achievable, Relevant, Time-bound.","ذكي"],["ABCD model","Audience, Behavior, Condition, Degree.","نموذج ABCD"],["Action verb","An observable verb such as identify, distinguish or write.","فعل إجرائي"],["Behavioral objective","An objective stated in terms of observable learner behavior.","هدف سلوكي"]],"ex":[],"intro":[]},{"h":["Bloom's taxonomy","تصنيف بلوم"],"pts":[["[[Bloom|en.obj.bloom]] 1956: top level **evaluation**; revised 2001 (Anderson & Krathwohl): top level **create**.","الأصلي: التقويم / المعدّل: الإبداع"],["Combining experience and new material into a new structure = **synthesis**; 'design an advertisement' = **creating**.","تركيب / إبداع"],["Using procedures to solve tasks = **application**; categorizing with criteria = **classifying**; 'name three manners of articulation' = knowledge.","تطبيق / تصنيف / معرفة"],["'List' is lower-order; plan, assess and design are [[higher-order|en.obj.verbs]].","يسرد أدنى"]],"t":[["Benjamin Bloom","Classified the cognitive domain of educational objectives.","بلوم"],["Knowledge (remember)","Recalling facts: list, name, define.","تذكّر"],["Comprehension (understand)","Explaining meaning: explain, summarize, paraphrase.","فهم"],["Application","Using information in new situations: use, solve.","تطبيق"],["Analysis","Breaking information into parts: compare, distinguish.","تحليل"],["Synthesis","Combining elements into a new whole.","تركيب"],["Evaluation","Judging value using criteria: judge, justify, critique.","تقويم"],["Create","Producing original work: design, compose (highest in revised Bloom).","إبداع"]],"intro":[],"ex":[]},{"h":["Three domains and other taxonomies","المجالات الثلاثة"],"pts":[["[[**SOLO**|en.obj.solo]] (Biggs & Collis): Structure of the Observed Learning Outcome — 5 levels.","سولو 5 مستويات"]],"t":[["Cognitive domain","Objectives about knowledge and intellectual skills.","معرفي"],["Affective domain","Objectives about attitudes, values and feelings (Krathwohl).","وجداني"],["Psychomotor domain","Objectives about physical and motor skills.","مهاري"],["Attitudinal objective","An objective targeting attitudes (e.g. developing a critical attitude).","هدف اتجاهي"],["SOLO taxonomy","Prestructural, unistruc ":"design","ar":"⁧يصمم يؤلف يبني⁩","kw":["compose","plan"],"d":"en.obj.verbs"}],"trap":"⁧قمة بلوم المعدّل (2001)⁩"}]},"n":11},{"id":"L12","d":"D","std":"6.9.2","en":"Lesson Planning & Sequencing","ar":"تخطيط الدرس وتسلسل الأنشطة","goal":["Know lesson plan components and stages, sequencing principles, curriculum/syllabus types and needs analysis.","مكونات الخطة والتسلسل والمنهج"],"sec":[{"h":["Lesson plan components","مكونات الخطة"],"pts":[["[[Written plans|en.plan.lessonplan]]: a guide, a record, evidence for observers — but they do **NOT show students' motivation and performance**.","لا تُظهر الدافعية"],["Information from students' reactions to a lesson = **feedback**.","تغذية راجعة"],["Least important when planning materials: **class control** (vs objectives, learning styles, cultural background).","ضبط الصف الأقل"],["Before planning, consider students' **educational and cultural background**; first ask 'What will I achieve?'.","خلفية الطلاب والهدف"]],"t":[["Lesson plan","A written outline of objectives, procedures, materials, timing and assessment.","خطة الدرس"],["Procedures","The tasks and activities for each stage of a lesson.","الإجراءات"],["Interaction patterns","T–S, S–S, pair and group work arrangements.","أنماط التفاعل"],["Skeleton plan","An outline plan containing general information.","خطة هيكل"]],"intro":[],"ex":[]},{"h":["Lesson stages","مراحل الدرس"],"pts":[["**Warm-up / lead-in**: introduces the topic and activates background knowledge.","التهيئة"],["Effective order: [[**presentation → practice → production**|en.plan.ppp]]; presentation comes first.","العرض أولاً","o"],["Correct order: lead-in → activity → feedback; the time for each activity is **estimated**.","تهيئة، نشاط، تغذية"],["**Consolidation**: reviewing and reinforcing new material, usually at the end.","التثبيت"],["The teacher moving around, listening and taking notes = **monitoring**.","المتابعة"]],"t":[["Warm-up / Lead-in","Opening stage that introduces the topic and activates prior knowledge.","التهيئة"],["Consolidation","A stage that reviews and reinforces learning.","التثبيت"],["Wrap-up / Closure","Summarizing the lesson and checking objectives.","الختام"],["Monitoring","Observing students as they work to support and assess them.","المتابعة"]],"intro":[],"ex":[]},{"h":["Sequencing principles","مبادئ التسلسل"],"pts":[["Simple → complex, known → unknown, receptive → productive, controlled → free.","مبادئ التدرج"],["Giving an overview before details = **whole-to-part** sequencing.","من الكل للجزء"],["[[Gradual release|en.plan.gradual]]: I do → we do → you do; **scaffolding** is temporary support removed gradually ([[ZPD|en.zpd]]).","نقل المسؤولية والسقالات"],["[[**Backward design**|en.plan.backward]]: desired results → evidence → learning plan.","التصميم العكسي"],["Activities should be **varied, flexible and coherent**.","متنوعة ومرنة"]],"t":[["Whole-to-part sequencing","Presenting an overview first, then details.","من الكل للجزء"],["Gradual release of responsibility","I do, we do, you do.","نقل المسؤولية التدريجي"],["Scaffolding","Temporary support withdrawn as learners become independent.","سقالات"],["Backward design","Planning from desired outcomes back to activities (Wiggins & McTighe).","التصميم العكسي"]],"intro":[],"ex":[]},{"h":["Curriculum, syllabus and needs analysis","المنهج والمقرر وتحليل الاحتياجات"],"pts":[["A **curriculum** is broader (goals, content, methods, evaluation); a **syllabus** is the content and its sequence.","منهج أوسع من مقرر"],["Selecting and organizing content = **syllabus design**; a curriculum built on predetermined outcomes is **product-oriented**.","تصميم المقرر / موجّه بالمنتج"],["To learn students' interests and abilities, conduct a [[**needs analysis**|en.plan.needs]] (design, conduct, analyze).","تحليل الاحتياجات","o"]],"t":[["Curriculum","The overall plan: goals, content, methods and evaluation.","منهج"],["Syllabus","The content of a course and its sequence.","مقرر"],["Syllabus design","Selecting and organizin
