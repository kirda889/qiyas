ching"},"en.chomsky":{"k":"Nativism","t":["Noam Chomsky — LAD and Universal Grammar","تشومسكي وجهاز اكتساب اللغة"],"body":[["Chomsky argued that every child has an innate **Language Acquisition Device (LAD)** containing **Universal Grammar** — principles shared by all human languages. Input only 'switches on' the settings (parameters) of the child's particular language.","لكل طفل جهاز فطري فيه مبادئ مشتركة بين اللغات، والمدخلات تضبط إعدادات لغته فقط."],["He also distinguished **competence** (the speaker's internal knowledge of the language) from **performance** (actual use, which includes slips and hesitations).","الكفاية: المعرفة الداخلية باللغة. الأداء: الاستخدام الفعلي بأخطائه."]],"traps":[["Hymes added **communicative competence** as a reaction to Chomsky's narrow 'competence'.","هايمز أضاف الكفاية التواصلية رداً على تشومسكي"],["Critical Period Hypothesis is **Lenneberg**, not Chomsky.","الفترة الحرجة لِلينبرغ"]],"src":"Brown, Principles of Language Learning and Teaching; Yule, The Study of Language","pts":[["**Poverty of the stimulus**: the input children hear is too limited to explain the rules they end up knowing, so language cannot be pure imitation.","المدخل أفقر من أن يفسر القواعد التي يعرفها الطفل"]],"ex":[["A four-year-old says 'I goed to the park'. No adult said 'goed' — the child is applying a rule, which is evidence against pure imitation.","الطفل يقول goed مع أن أحداً لم يقلها: يطبق قاعدة ولا يقلّد فقط."]]},"en.piaget":{"k":"Cognitivism","t":["Jean Piaget — Stages of Cognitive Development","بياجيه ومراحل النمو المعرفي"],"body":[["Piaget saw children as active thinkers who build understanding in stages. New experiences are either **assimilated** into an existing schema or force the schema to change (**accommodation**).","الطفل يبني فهمه على مراحل: يستوعب الجديد في مخططه (تمثّل) أو يعدّل مخططه (مواءمة)."]],"map":{"type":"cards","groups":[{"n":"Sensorimotor","ar":"⁧الحسية الحركية (0–2)⁩","items":[{"n":"Object permanence","ar":"⁧ثبات الشيء⁩"}]},{"n":"Preoperational","ar":"⁧ما قبل العمليات (2–7)⁩","items":[{"n":"Egocentrism","ar":"⁧التمركز حول الذات⁩"}]},{"n":"Concrete operational","ar":"⁧العمليات المحسوسة (7–11)⁩","items":[{"n":"Conservation","ar":"⁧الاحتفاظ والتصنيف⁩"}]},{"n":"Formal operational","ar":"⁧العمليات المجردة (11+)⁩","items":[{"n":"Abstract reasoning","ar":"⁧التفكير المجرد والفرضيات⁩"}]}]},"traps":[["'What if…?' hypothetical thinking belongs to the **formal operational** stage.","التفكير الافتراضي من المرحلة المجردة"]],"src":"Brown, Principles of Language Learning and Teaching"},"en.zpd":{"k":"Social Constructivism","t":["Vygotsky — Zone of Proximal Development","فيجوتسكي ومنطقة النمو القريبة"],"body":[["The **ZPD** is the distance between what a learner can do **alone** and what they can do **with help** from a more knowledgeable other (MKO) — a teacher or a stronger peer. Teaching is most effective inside this zone.","المسافة بين ما يفعله المتعلم وحده وما يفعله بمساعدة شخص أعلم منه، والتعليم أنجح داخلها."],["**Scaffolding** (a term introduced by Wood, Bruner and Ross, 1976) is the temporary support given within the ZPD and gradually removed as the learner becomes independent.","السقالات: دعم مؤقت يُسحب تدريجياً حتى يستقل المتعلم."]],"traps":[["ZPD is not what the learner already masters alone.","ليست ما يتقنه المتعلم وحده"],["Scaffolding is **temporary** — permanent help is not scaffolding.","السقالات مؤقتة"]],"src":"Brown, Principles of Language Learning and Teaching; Lightbown & Spada","ex":[["A stronger student guides a partner through writing a paragraph, then gradually lets the partner do more — peer **scaffolding** within the ZPD.","طالب متمكن يساعد زميله ثم يترك له المهمة تدريجياً."]]},"en.lenneberg":{"k":"Nativism","t":["Lenneberg — The Critical Period Hypothesis","لينبرغ وفرضية الفترة الحرجة"],"body":[["In *Biological Foundations of Language* (1967) Eric Lenneberg argued that language acquisition is **biologically linked to age**: there is a limited window, from early childhood to about **puberty**, when the brain is ready to acquire language naturally. He tied the end of this period to brain **lateralization**. The idea supports **nativism**, because it treats language as a biological capacity with its own timetable.","اكتساب اللغة مرتبط بيولوجياً بالعمر: هناك فترة محددة تنتهي تقريباً عند البلوغ يكون فيها الدماغ مهيأً للاكتساب الطبيعي. وهذا يدعم الفطرية."]],"pts":[["Evidence often cited: children deprived of language in early childhood (such as the case of 'Genie') never fully acquired grammar.","حالات أطفال حُرموا اللغة صغاراً ولم يكتمل نحوهم"],["In L2 learning, the age effect is clearest in **pronunciation**: late starters usually keep a foreign accent.","أثر العمر في اللغة الثانية أوضح في النطق"],["Older learners are not hopeless: they often learn faster at first, but rarely reach a native-like accent.","الكبار يتقدمون أسرع في البداية لكن نادراً ما يصلون لنطق أصلي"]],"traps":[["The Critical Period Hypothesis supports **nativism**, not behaviorism.","الفترة الحرجة تدعم الفطرية"],["It is linked to **Lenneberg**, not Chomsky or Krashen.","الفرضية لِلينبرغ"]],"src":"Lenneberg, Biological Foundations of Language; Lightbown & Spada, How Languages are Learned; Brown, Principles of Language Learning and Teaching"},"en.ausubel":{"k":"Cognitivism","t":["David Ausubel — Meaningful Learning","أوزوبل والتعلم ذو المعنى"],"body":[["Ausubel contrasted **meaningful learning**, where new material is linked to concepts already in the learner's mind (he called this **subsumption**), with **rote learning**, where items are memorized as isolated facts. Meaningful learning lasts; rote learning is quickly forgotten because nothing holds it in place. For Ausubel, the most important factor in learning is **what the learner already knows**.","التعلم ذو المعنى يربط الجديد بما في ذهن المتعلم فيبقى، والتعلم الآلي حفظ معلومات منفصلة فيُنسى سريعاً. وأهم عامل في التعلم ما يعرفه المتعلم مسبقاً."]],"pts":[["**Advance organizer**: a short introduction (a chart, a question, a summary) given **before** new material to connect it to existing knowledge.","المنظم المتقدم: تمهيد يسبق الدرس ويربطه بالمعرفة السابقة"],["Classroom link: pre-reading and pre-listening activities that activate background knowledge.","أنشطة ما قبل القراءة والاستماع"]],"traps":[["Rote learning is the **opposite** of meaningful learning.","الآلي عكس ذي المعنى"],["Ausubel is a **cognitivist**, not a behaviorist.","أوزوبل معرفي"]],"src":"Brown, Principles of Language Learning and Teaching","ex":[["Before a reading text about recycling, the teacher shows a short chart linking it to what students know about waste — an **advance organizer**.","مخطط قبل النص يربط الموضوع بما يعرفه الطلاب: منظم متقدم."]]},"en.bruner":{"k":"Social Constructivism","t":["Jerome Bruner — Discovery and the Spiral Curriculum","برونر والاكتشاف والمنهج الحلزوني"],"body":[["Bruner saw learners as active builders of knowledge. In **discovery learning** they work out principles for themselves from examples, with the teacher guiding rather than telling. In *The Process of Education* (1960) he proposed the **spiral curriculum**: key ideas are revisited again and again, each time at a deeper and more complex level.","المتعلم يكتشف القاعدة بنفسه بتوجيه من المعلم. والمنهج الحلزوني يعيد الموضوع نفسه مرات بعمق متزايد."],["He also described three modes of representation, **enactive** (action), **iconic** (images) and **symbolic** (language), and with Wood and Ross (1976) introduced the term **scaffolding**.","وصف ثلاثة أنماط للتمثيل: بالفعل، وبالصورة، وبالرمز. وهو مع زميليه صاحب مصطلح السقالات."]],"ex":[["Students meet the past simple in Grade 7 and return to it with more complex uses in Grades 8 and 9: a **spiral curriculum**.","العودة للزمن نفسه بعمق أكبر كل سنة منهج حلزوني."]],"traps":[["Bruner = discovery learning and the spiral curriculum; operant conditioning is Skinner.","برونر للاكتشاف والحلزوني"],["Discovery learning is guided; it does not mean leaving learners without help.","الاكتشاف موجَّه لا عشوائي"]],"src":"Bruner, The Process of Education; Brown, Principles of Language Learning and Teaching"},"en.maslow":{"k":"Humanism","t":["Abraham Maslow — Hierarchy of Needs","ماسلو وهرم الحاجات"],"body":[["Maslow arranged human needs in a pyramid: **physiological** needs (food, sleep), **safety**, **love and belonging**, **esteem**, and at the top **self-actualization**, reaching one's full potential. Lower needs must be reasonably met before higher ones can drive behaviour. A hungry, frightened or isolated student is not ready to focus on learning.","الحاجات بالترتيب: الجسدية، ثم الأمان، ثم الانتماء، ثم التقدير، ثم تحقيق الذات في القمة. ولا تحرّك الحاجة العليا السلوك قبل إشباع الدنيا، فالطالب الجائع أو الخائف لا يتعلم جيداً."]],"pts":[["Classroom link: a safe, welcoming class and respect for every student come before demanding tasks.","صف آمن ومحترم قبل المهام الصعبة"]],"traps":[["**Self-actualization** is at the top of the pyramid; physiological needs are at the base.","تحقيق الذات في القمة"]],"src":"Brown, Principles of Language Learning and Teaching"},"en.rogers":{"k":"Humanism","t":["Carl Rogers — Learner-Centred Learning","روجرز والتعلم المتمركز حول المتعلم"],"body":[["Rogers, a psychologist, carried his client-centred therapy into education (*Freedom to Learn*, 1969). Learning is most effective when it is **learner-centred**, personally meaningful and happens in a **non-threatening** climate. The teacher is a **facilitator** who creates that climate and trusts learners to direct much of their own learning, not a transmitter of facts.","نقل روجرز فكرة العلاج المتمركز حول العميل إلى التعليم: التعلم أنجح إذا تمركز حول المتعلم وكان ذا معنى له وفي جو آمن. والمعلم ميسّر لا ناقل معلومات."]],"pts":[["[[Community Language Learning|en.meth.humanistic]] (Curran) is built on Rogers' counselling model: the teacher acts as a 'counsellor'.","التعلم الجماعي للغة مبني على نموذج روجرز"]],"traps":[["Rogers = teacher as **facilitator**; this places him in **humanism**.","المعلم ميسّر: روجرز والإنسانية"],["Methods such as CLL and Suggestopedia are classed as **humanistic** methods.","CLL والإيحائية طرق إنسانية"]],"src":"Brown, Principles of Language Learning and Teaching; Richards & Rodgers, Approaches and Methods in Language Teaching"},"en.ling.phonbranches":{"k":"Phonetics","t":["Phonetics, Phonology and the Branches of Phonetics","علم الأصوات وفروعه"],"body":[["**Phonetics** describes speech sounds as physical events and can describe the sounds of any language. **Phonology** studies how one language organises its sounds into contrasts (phonemes) and patterns.","علم الأصوات يصف الأصوات كأحداث فيزيائية في أي لغة، وعلم وظائف الأصوات يدرس نظام لغة بعينها."]],"pts":[["**Articulatory**: how the speech organs (lips, tongue, teeth, palate, vocal cords) produce sounds — the basis of place, manner and voicing.","النطقي: كيف تنتج أعضاء النطق الصوت"],["**Acoustic**: the physical properties of sound waves (frequency, duration, intensity).","الفيزيائي: خصائص الموجات الصوتية"],["**Auditory**: how the ear and brain receive and perceive speech sounds.","السمعي: الاستقبال والإدراك"],["**Forensic**: applying phonetics to legal cases, e.g. identifying a speaker from a recording.","الجنائي: تحديد المتكلم من تسجيل"]],"traps":[["Sound waves = **acoustic**; perception = **auditory**; speech organs = **articulatory**.","موجات / إدراك / نطق"],["The actions of the speech organs in producing sounds = **articulation**.","النطق"]],"src":"Yule, The Study of Language; Roach, English Phonetics and Phonology","ex":[["Describing how /θ/ in 'think' is made (tongue tip between the teeth) is **phonetics**; noticing that 'sink' instead of 'think' changes the word is **phonology**.","وصف النطق صوتيات، وتغيّر الكلمة وظائف أصوات."]]},"en.ling.consonants":{"k":"Phonetics","t":["Describing English Consonants","وصف الصوامت الإنجليزية"],"body":[["A full description of a consonant gives **voicing + place + manner**: /k/ = voiceless velar stop; /z/ = voiced alveolar fricative; /m/ = voiced bilabial nasal. Exam distractors usually keep two of the three correct and change the third, so check each label separately.","الوصف الكامل: الجهر + المخرج + الطريقة. والخيارات الخاطئة غالباً تغيّر عنصراً واحداً فقط."]],"map":{"type":"cards","groups":[{"n":"Stops (plosives)","ar":"⁧انفجارية: قفل كامل ثم إطلاق⁩","items":[{"n":"/p b/","ar":"⁧شفوية ثنائية⁩"},{"n":"/t d/","ar":"⁧لثوية⁩"},{"n":"/k g/","ar":"⁧طبقية⁩"}]},{"n":"Fricatives","ar":"⁧احتكاكية: ممر ضيق⁩","items":[{"n":"/f v/","ar":"⁧شفوية سنية⁩"},{"n":"/θ ð/ /s z/","ar":"⁧سنية / لثوية⁩"},{"n":"/ʃ ʒ/ /h/","ar":"⁧لثوية غارية / حنجرية⁩"}]},{"n":"Affricates","ar":"⁧مركّبة: انفجار ثم احتكاك⁩","items":[{"n":"/tʃ dʒ/","ar":"church, judge"}]},{"n":"Nasals","ar":"⁧أنفية: الهواء من الأنف⁩","items":[{"n":"/m n ŋ/","ar":"⁧كلها مجهورة⁩"}]},{"n":"Liquids & glides","ar":"⁧سائلة وشبه حركات⁩","items":[{"n":"/l r/","ar":"⁧سائلة⁩"},{"n":"/j w/","ar":"⁧شبه حركات (approximants)⁩"}]}]},"pts":[["Voiceless consonants: /p t k f θ s ʃ tʃ h/. All the others are voiced.","المهموسة تسعة، والباقي مجهور"],["/ʃ ʒ tʃ dʒ/ are **post-alveolar**; Roach calls them **palato-alveolar** and Yule **palatal** (alveo-palatal) — the same sounds.","تسميات مختلفة لمخرج واحد: لثوية غارية"],["Nasals are [+nasal, −aspirated]: aspiration belongs to voiceless stops /p t k/.","الأنفية بلا نفخة"]],"traps":[["/t/ and /d/ are **alveolar**, not dental; /θ ð/ are the dental sounds.","/t d/ لثوية لا سنية"],["'bear' / 'dare' differ in **place** (bilabial vs alveolar); both are voiced stops.","يختلفان في المخرج فقط"],["The letter j in 'jam' is /dʒ/; the IPA symbol /j/ is the first sound in 'yes'.","/j/ هي الياء"]],"src":"Yule, The Study of Language; Roach, English Phonetics and Phonology"},"en.ling.connected":{"k":"Connected speech","t":["Assimilation, Elision and Linking","المماثلة والحذف والوصل"],"body":[["In natural speech, words run together and sounds adjust to their neighbours to make articulation easier. These changes are systematic, and learners need them mainly for **listening**: a learner who expects every word in its dictionary form will not recognise them in fast speech.","في الكلام الطبيعي تتأثر الأصوات بجيرانها، ويحتاجها الطالب للاستماع أكثر من النطق."]],"pts":[["**Assimilation**: a sound becomes more like a neighbour — 'ten boys' /tem bɔɪz/, 'handbag' /hæmbæg/, 'did you' /dɪdʒu/ (/d/ + /j/ merge into /dʒ/).","مماثلة: صوت يشبه جاره"],["**Elision**: a sound disappears — 'next day' /neks deɪ/, 'last night' /lɑːs naɪt/, 'you and me' /juː ən miː/.","حذف صوت"],["**Linking**: words join smoothly — linking /r/ in 'far away'; **intrusion**: a sound not in the spelling is added — 'law and order' /lɔːr ənd/, 'go on' /gəʊ wɒn/.","وصل وإقحام"],["**Weak forms**: function words reduce in unstressed position — can /kən/, to /tə/, and /ən/.","صيغ ضعيفة"]],"traps":[["A sound that *changes* = assimilation; a sound that *disappears* = elision; an extra sound = intrusion.","يتغير / يختفي / يُضاف"],["Stress, rhythm and intonation are **suprasegmental**, not connected-speech processes.","النبر والتنغيم فوق مقطعية"]],"src":"Roach, English Phonetics and Phonology; Field, Listening in the Language Classroom"},"en.ling.morpheme":{"k":"Morphology","t":["Morphemes: Free and Bound","المورفيمات: الحرة والمقيدة"],"body":[["A **morpheme** is the smallest unit of meaning or grammatical function. 'Tourists' contains three: *tour* (meaning), *-ist* (person who does) and *-s* (plural). Morphemes are classified in two steps: first free vs bound, then by job.","المورفيم أصغر وحدة معنى أو وظيفة نحوية، ونصنّفه أولاً حر/مقيد ثم حسب وظيفته."]],"map":{"type":"cards","groups":[{"n":"Free","ar":"⁧حرة: تقف وحدها⁩","items":[{"n":"Lexical","ar":"⁧محتوى: book, sad, open⁩"},{"n":"Functional","ar":"⁧نحوية: the, and, in, it⁩"}]},{"n":"Bound","ar":"⁧مقيدة: لا تقف وحدها⁩","items":[{"n":"Derivational","ar":"⁧تصنع كلمة: un-, -ness, -ment⁩"},{"n":"Inflectional","ar":"⁧تضيف نحواً: -s, -ed, -est⁩"}]}]},"pts":[["**Lexeme**: wolf/wolves = one lexeme; grill/grilling = one lexeme.","الوحدة المعجمية تجمع الصيغ"],["**Allomorph**: different forms of one morpheme — plural /s/ cats, /z/ dogs, /ɪz/ buses, and even -en in oxen.","صور مختلفة لمورفيم واحد"],["**Bound roots** carry meaning but cannot stand alone: -ceive (receive), -mit (transmit).","جذور مقيدة"]],"traps":[["Lexical morphemes = content words (verbs, nouns, adjectives); articles and prepositions are functional.","المعجمي محتوى"],["Functional morphemes are **free**, not bound.","الوظيفي حر"]],"src":"Yule, The Study of Language"},"en.ling.inflderiv":{"k":"Morphology","t":["Inflectional vs Derivational","التصريفي والاشتقاقي"],"body":[["**Inflectional** morphemes mark grammar inside the same word: number, possession, tense, aspect, comparison. **Derivational** morphemes create a new word with a new dictionary entry, often in a new word class.","التصريفي يبقي الكلمة نفسها ويضيف نحواً، والاشتقاقي يصنع مدخلاً معجمياً جديداً."]],"map":{"type":"cards","groups":[{"n":"The 8 inflections","ar":"⁧التصريفية الثمانية⁩","items":[{"n":"Noun: -s, -'s","ar":"⁧الجمع والملكية⁩"},{"n":"Verb: -s, -ed, -en, -ing","ar":"⁧الغائب والماضي والتام والمستمر⁩"},{"n":"Adj: -er, -est","ar":"⁧المقارنة والتفضيل⁩"}]},{"n":"Derivational","ar":"⁧الاشتقاقية⁩","items":[{"n":"Class-changing","ar":"teach → teacher, metal → metallic"},{"n":"Meaning-changing","ar":"happy → unhappy, write → rewrite"}]}]},"pts":[["Inflections are **always suffixes** in English; derivational affixes can be prefixes or suffixes.","التصريفية لواحق دائماً"],["Inflections come **last**: teach-er-s, care-less-ness (no inflection), modern-ize-d.","التصريفي يأتي آخراً"],["Derivational suffixes by class: nouns -ment, -ness, -tion, -er/-or; adjectives -ful, -less, -ic, -able; verbs -ate, -ify, -ize, -en.","لواحق حسب الصنف"]],"traps":[["-er in **taller** = inflectional; -er in **teacher** = derivational.","taller / teacher"],["-or in visitor, -less in hopeless, -ment in government are all derivational.","كلها اشتقاقية"],["Inflectional suffixes never change the word class — but some derivational ones don't either (child → childhood, friend → friendship), so also ask: is it a new word?","التصريفية لا تغيّر الصنف أبداً، وبعض الاشتقاقية كذلك"]],"src":"Yule, The Study of Language; Fromkin, Rodman & Hyams, An Introduction to Language"},"en.ling.wordclass":{"k":"Syntax","t":["Word Classes: Key Distinctions","أقسام الكلام: فروق مهمة"],"body":[["**Content (open) classes** — nouns, verbs, adjectives, adverbs — carry meaning and readily accept new words. **Function (closed) classes** — articles, pronouns, prepositions, conjunctions, auxiliaries — are small fixed sets that signal grammatical relations.","أقسام المحتوى تحمل المعنى ويدخلها الجديد، وأقسام الوظيفة مجموعات محدودة تربط الجملة."]],"pts":[["Adjectives: **attributive** before a noun (an expensive watch); **predicative** after a linking verb (the watch is expensive).","صفة قبلية / خبرية"],["Adverbs modify verbs (drives fast), adjectives (very tall) and other adverbs (too quickly); intensifiers such as very and too are adverbs.","الظرف يصف الفعل والصفة والظرف"],["Pronouns: reflexive (myself), reciprocal (each other, one another), demonstrative (this, that, these, those), relative (who, which, that).","أنواع الضمائر"],["Auxiliaries: primary (be, have, do) and modal (can, may, should, must, will). Interjections (Ouch!, Wow!) express emotion.","الأفعال المساعدة وأدوات التعجب"],["'charming', 'friendly' are **adjectives** (the -ing and -ly endings mislead).","charming و friendly صفتان"]],"traps":[["'friendly', 'lovely', 'lonely' end in -ly but are **adjectives**.","صفات رغم -ly"],["'each other' is **reciprocal**, not reflexive.","تبادلي"],["English has two indefinite articles (a, an) and one definite article (the).","أداتا تنكير وأداة تعريف"]],"src":"Swan, Practical English Usage; Crystal, The Cambridge Encyclopedia of the English Language"},"en.ling.transitivity":{"k":"Syntax","t":["Verb Patterns and Sentence Elements","أنماط الأفعال وعناصر الجملة"],"body":[["Clause elements are **Subject, Verb, Object, Complement, Adverbial**. The verb chooses which of them are needed: this is its **valency** or transitivity. An optional adverbial that can be removed without breaking the clause (nearly, yesterday, in the garden) is an **adjunct**.","عناصر الجملة: فاعل وفعل ومفعول وتكملة وظرف، والفعل يحدد ما يلزم منها. والعنصر الاختياري الذي يُحذف دون أن تنكسر الجملة هو adjunct."]],"map":{"type":"cards","groups":[{"n":"Intransitive","ar":"⁧لازم⁩","items":[{"n":"She arrived.","ar":"⁧بلا مفعول⁩"}]},{"n":"Transitive","ar":"⁧متعدٍّ⁩","items":[{"n":"He kicked the ball.","ar":"⁧مفعول مباشر⁩"}]},{"n":"Ditransitive","ar":"⁧متعدٍّ لمفعولين⁩","items":[{"n":"I gave Sami the photo.","ar":"⁧Sami غير مباشر، photo مباشر⁩"}]},{"n":"Linking","ar":"⁧فعل ربط⁩","items":[{"n":"She seems tired.","ar":"⁧تكملة تصف الفاعل⁩"}]}]},"pts":[["**Finite** verbs show tense and agree with the subject (she works); **non-finite** forms do not (to work, working, worked).","متصرف / غير متصرف"],["Linking verbs: be, seem, become, look, appear, feel — followed by an adjective or noun complement.","أفعال الربط"],["**Phrasal verbs** = verb + particle with one meaning (look after, give up); errors like 'look after of' or 'looking to my wallet' show the learner has not stored the verb + particle as one fixed unit.","الأفعال المركبة وحدة واحدة"]],"traps":[["In 'I gave Sami the photo', Sami (the receiver) is the **indirect** object.","المستلم غير مباشر"],["'My child is friendly': after a linking verb we need an adjective, not an adverb.","بعد فعل الربط صفة"]],"src":"Swan, Practical English Usage; Thornbury, How to Teach Grammar","ex":[["Rewrite 'I gave Sami the photo' as 'I gave the photo **to** Sami': the noun that can move after to/for is the indirect object.","ما ينتقل بعد to/for هو المفعول غير المباشر."]]},"en.ling.lexrel":{"k":"Semantics","t":["Lexical Relations","علاقات المعنى بين الكلمات"],"body":[["Speakers often explain a word by relating it to another: 'conceal' means 'hide' (synonymy), 'shallow' is the opposite of 'deep' (antonymy), a 'daffodil' is a kind of flower (hyponymy). These relations organise the mental lexicon and are a powerful way to teach vocabulary.","نشرح الكلمة غالباً بربطها بأخرى: مرادف، ضد، نوع من. وهذه العلاقات تنظّم المعجم الذهني."]],"map":{"type":"cards","groups":[{"n":"Synonymy","ar":"⁧ترادف⁩","items":[{"n":"big – large","ar":"declare – announce"}],"trap":"⁧الترادف التام نادر: big sister ≠ large sister⁩"},{"n":"Hyponymy","ar":"⁧اشتمال: نوع من⁩","items":[{"n":"banana → fruit","ar":"⁧fruit هي الكلمة الشاملة⁩"}],"trap":"⁧apple وbanana أنواع مشتركة (co-hyponyms)⁩"},{"n":"Meronymy","ar":"⁧جزء من كل⁩","items":[{"n":"branch → tree","ar":"wheel → car"}],"trap":"⁧ليس 'نوعاً من'⁩"},{"n":"Collocation","ar":"⁧تلازم لفظي⁩","items":[{"n":"heavy rain","ar":"make a mistake, strong coffee"}],"trap":"⁧تلازم عادة لا علاقة معنى منطقية⁩"}]},"pts":[["**Superordinate** = the general term (fruit); **hyponym** = the specific term (banana); same-level members are **co-hyponyms**.","الشامل والمشمول"],["**Metonymy**: naming a thing by something closely associated with it — 'The White House said…', 'drink a bottle'.","الكناية بالمجاورة"]],"traps":[["banana–fruit = hyponymy; branch–tree = meronymy.","اشتمال / جزء"],["see/sea are homophones, not synonyms.","متجانسان صوتياً"]],"src":"Yule, The Study of Language; Saeed, Semantics"},"en.ling.antonyms":{"k":"Semantics","t":["Types of Antonyms","أنواع التضاد"],"body":[["Not all opposites work the same way, and the exam asks you to name the type. The quickest tests: can you say 'very' or 'more'? Does 'not X' automatically mean Y? Does one word describe the same event from the other side?","اختبارات سريعة: هل تقبل very؟ هل نفي الأول يعني الثاني؟ هل يصفان الحدث نفسه من جهتين؟"]],"map":{"type":"cards","groups":[{"n":"Gradable","ar":"⁧متدرج⁩","items":[{"n":"hot / cold","ar":"⁧very hot, warmer — بينهما درجات⁩"}],"trap":"not hot ≠ cold"},{"n":"Complementary","ar":"⁧تكاملي (غير متدرج)⁩","items":[{"n":"alive / dead","ar":"male / female, pass / fail"}],"trap":"not alive = dead"},{"n":"Converse","ar":"⁧عكسي (علائقي)⁩","items":[{"n":"buy / sell","ar":"teacher / student, above / below"}],"trap":"A sells to B = B buys from A"}]},"pts":[["**Reversives** describe the reverse of an action: tie/untie, enter/exit, pack/unpack.","العكسي في الفعل"]],"traps":[["male/female and alive/dead are **complementary**, not gradable.","تكاملي"],["Saying the opposite of what you mean is **irony**, not antonymy.","التهكم ليس تضاداً"]],"src":"Yule, The Study of Language; Saeed, Semantics"},"en.ling.homonymy":{"k":"Semantics","t":["Homonyms, Homophones, Homographs, Polysemy","المشترك اللفظي والمتجانسات وتعدد المعنى"],"body":[["These terms describe words that share **form**. The key questions are: is it the sound, the spelling, or both that is shared — and are the meanings **related** or not?","السؤال: ما المشترك، النطق أم الكتابة أم كلاهما؟ وهل المعاني مترابطة أم لا؟"]],"map":{"type":"cards","groups":[{"n":"Homophones","ar":"⁧نطق واحد، كتابة مختلفة⁩","items":[{"n":"see / sea","ar":"stake / steak, meat / meet"}]},{"n":"Homographs","ar":"⁧كتابة واحدة، نطق أو معنى مختلف⁩","items":[{"n":"lead / lead","ar":"⁧الرصاص / يقود⁩"}]},{"n":"Homonyms","ar":"⁧شكل واحد ومعانٍ غير مترابطة⁩","items":[{"n":"bank","ar":"⁧ضفة النهر / المصرف⁩"}]},{"n":"Polysemy","ar":"⁧كلمة واحدة بمعانٍ مترابطة⁩","items":[{"n":"head","ar":"⁧رأس الجسم / رئيس الشركة⁩"}]}]},"pts":[["Test for polysemy: can you see a shared core meaning? head of body and head of company = 'top, controlling part'.","معنى مشترك = تعدد معنى"],["Lexical ambiguity often comes from homonyms or polysemous words: 'I'll give you a ring'.","مصدر الغموض المعجمي"]],"traps":[["bank (river / money) = **homonym**; head (body / company) = **polysemy**.","bank مشترك، head تعدد"],["stake/steak = homophones; lead (metal) / lead (guide) = homographs.","متجانس صوتي / كتابي"]],"src":"Yule, The Study of Language"},"en.ling.cohesion":{"k":"Discourse","t":["Cohesion vs Coherence","الترابط الشكلي والترابط المعنوي"],"body":[["**Cohesion** (Halliday & Hasan, 1976) is the network of visible ties between sentences — you can point to the words that create it. **Coherence** is in the reader's mind: the sense that the ideas belong together and make sense in context. Cohesion helps coherence but does not guarantee it.","الترابط الشكلي روابط تشير إليها بإصبعك، والمعنوي إحساس القارئ بأن الأفكار منطقية ومتصلة."]],"map":{"type":"cards","groups":[{"n":"Reference","ar":"⁧إحالة⁩","items":[{"n":"Anaphoric","ar":"⁧للخلف: Ali… He⁩"},{"n":"Cataphoric","ar":"⁧للأمام: When he arrived, Ali…⁩"}]},{"n":"Substitution & ellipsis","ar":"⁧استبدال وحذف⁩","items":[{"n":"do so, one","ar":"I'll take this one"},{"n":"Ellipsis","ar":"I can swim and Sara can too"}]},{"n":"Conjunction","ar":"⁧أدوات ربط⁩","items":[{"n":"however, so","ar":"⁧previously, meanwhile = زمنية⁩"}]},{"n":"Lexical cohesion","ar":"⁧ترابط معجمي⁩","items":[{"n":"repetition","ar":"⁧تكرار، مرادف، كلمات من حقل واحد⁩"}]}]},"pts":[["A text can be cohesive but incoherent (linked sentences about unrelated things), or coherent with few ties: 'That's the phone.' — 'I'm in the shower.' — 'OK.'","قد يوجد أحدهما دون الآخر"],["**Exophoric** reference points outside the text to the situation ('Look at *that*!'), so Halliday & Hasan do not count it as a cohesive tie.","إحالة خارجية لا تُعد ترابطاً شكلياً"]],"traps":[["Anaphoric and cataphoric reference = **cohesion**, not coherence.","الإحالة ترابط شكلي"],["'The degree to which a text makes sense' = **coherence**.","منطقية النص = ترابط معنوي"]],"src":"Halliday & Hasan, Cohesion in English; Yule, The Study of Language"},"en.meth.levels":{"k":"Methods","t":["Approach, Method, Technique","المدخل والطريقة والأسلوب"],"body":[["Edward Anthony (1963) proposed a three-level hierarchy. The **approach** is axiomatic: a set of assumptions about the nature of language and learning. The **method** is procedural: an overall plan for presenting language that rests on the approach. The **technique** is implementational: a specific classroom trick or activity that must be consistent with the method.","أنتوني (1963): المدخل افتراضات، والطريقة خطة، والأسلوب تطبيق داخل الصف."],["Richards and Rodgers reworked the model: **approach** (theory), **design** (objectives, syllabus, roles of teacher and learner, materials) and **procedure** (classroom techniques). In their model, 'method' is the umbrella that covers all three.","ريتشاردز ورودجرز: مدخل ← تصميم ← إجراء، والطريقة مظلة تجمعها."]],"pts":[["Approach = 'what we believe'; method = 'how we plan'; technique = 'what we do today'.","نعتقد ← نخطط ← ننفّذ"],["A **strategy** is broader than a technique: a set of techniques used to reach an aim.","الاستراتيجية أوسع من الأسلوب"]],"ex":[["A teacher believes language is learned through communication (approach), follows a task-based plan for the unit (method), and today runs an information-gap activity in pairs (technique).","معتقد تواصلي = مدخل، خطة بالمهام = طريقة، نشاط فجوة المعلومات = أسلوب."]],"traps":[["'Theoretical positions and beliefs about language and learning' = approach, not method.","المعتقدات النظرية = مدخل"],["A dictation or a drill is a technique — one activity, not a whole method.","الإملاء أسلوب لا طريقة"]],"src":"Richards & Rodgers, Approaches and Methods in Language Teaching; Brown, Teaching by Principles"},"en.meth.gtm":{"k":"Methods","t":["The Grammar-Translation Method","طريقة القواعد والترجمة"],"body":[["Grammar-Translation (sometimes called the Classical Method) treats a foreign language as a body of rules and words to be learned and then used for translation. Its aim is to read the literature of the language and to develop mental discipline.","تعامل اللغة كقواعد ومفردات تُحفظ ثم تُستخدم للترجمة، وهدفها قراءة الأدب."]],"pts":[["Medium of instruction: the **mother tongue**.","اللغة الأم وسيلة الشرح"],["Grammar taught **deductively**: rule first, then practice.","القاعدة أولاً (استنباطي)"],["Bilingual word lists, literary texts, translation in both directions.","قوائم مفردات ونصوص أدبية وترجمة"],["**Accuracy** is the standard; little or no attention to pronunciation or speaking.","الدقة أولاً ولا اهتمام بالنطق والكلام"],["Teacher-centred; the same treatment for all learners.","متمركزة حول المعلم"],["**No single founder**: it grew in 19th-century German (Prussian) schools — in the US it was first called the 'Prussian Method'. Its best-known textbook writers: **Seidenstücker, Plötz, Ollendorf, Meidinger**.","لا مؤسس واحد لها: نشأت في مدارس بروسيا، وأشهر مؤلفيها زايدنشتوكر وبلوتس وأولندورف وماينيغر"]],"traps":[["Grammar-Translation = deductive; the Direct Method and ALM = inductive.","الترجمة استنباطية، والمباشرة والسمعية استقرائية"],["'Ignores speaking' or 'focuses on reading and writing' points to GTM.","إهمال الكلام = القواعد والترجمة"]],"src":"Richards & Rodgers, Approaches and Methods; Larsen-Freeman & Anderson, Techniques and Principles in Language Teaching"},"en.meth.direct":{"k":"Methods","t":["The Direct Method","الطريقة المباشرة"],"body":[["Reformers at the end of the 19th century argued that learners should connect meaning **directly** to the new language, without passing through the mother tongue. Schools such as Berlitz made the approach popular. Because it imitates first-language learning, it is also called the **natural method**.","ربط المعنى باللغة الجديدة مباشرة دون المرور باللغة الأم، ولذلك تُسمّى الطريقة الطبيعية."]],"pts":[["Classes are conducted only in the target language.","اللغة الهدف فقط"],["Concrete words through objects, pictures and demonstration; abstract words through association of ideas.","المحسوس بالأشياء والمجرد بربط الأفكار"],["Grammar taught **inductively**; oral skills built through question-and-answer exchanges.","قاعدة استقرائية وسؤال وجواب"],["Correct pronunciation and everyday vocabulary are emphasised.","النطق الصحيح ومفردات الحياة اليومية"],["Who's who: **Gouin** (the earlier Series Method — sequences of related actions), **Sauveur** (natural, oral teaching in Boston from the late 1860s), **Berlitz** (spread it through his schools).","غوان (طريقة السلاسل)، وسوفور، وبيرليتز الذي نشرها بمدارسه"]],"traps":[["Direct Method ≠ Natural Approach: the first is a 19th-century method; the second is Krashen & Terrell (1983).","الطريقة الطبيعية غير المدخل الطبيعي"],["It emphasises listening and speaking — not reading and writing.","التركيز استماع وكلام"],["'Gouin and Berlitz' → the **Direct Method** family, not Audio-Lingual.","غوان وبيرليتز = المباشرة"]],"src":"Richards & Rodgers, Approaches and Methods; Brown, Teaching by Principles"},"en.meth.alm":{"k":"Methods","t":["The Audio-Lingual Method","الطريقة السمعية الشفهية"],"body":[["ALM developed in the United States in the 1950s, partly from intensive army language programmes. It combined **structural linguistics** (language as patterns of sounds and structures) with **behaviorist** psychology (learning as habit formation).","نشأت في أمريكا في الخمسينات من اللسانيات البنيوية والسلوكية."],["Its decline came when Chomsky's ideas showed that language is rule-governed and creative, not a set of imitated habits.","تراجعت حين بيّن تشومسكي أن اللغة إبداعية تحكمها قواعد"]],"pts":[["Dialogue memorisation (mim-mem) and **pattern drills**: repetition, substitution, transformation, chain, backward build-up.","حفظ الحوار وتدريبات الأنماط"],["Errors are avoided; correct responses get immediate **reinforcement**.","منع الخطأ والتعزيز الفوري"],["Grammar through examples — no explicit rules.","القاعدة من الأمثلة دون شرح"],["Minimal pairs for pronunciation; order L → S → R → W.","الثنائيات الصغرى وترتيب المهارات"],["Who's who: **Charles Fries** (University of Michigan, structural linguistics), **Robert Lado** (also Contrastive Analysis), **Nelson Brooks** (coined 'audiolingualism', 1964); learning theory from **Skinner**'s behaviorism.","فريز ولادو وبروكس، والنظرية من سلوكية سكنر"]],"traps":[["Behaviorism + habit formation + drills = ALM (not CLT).","سلوكية + عادات + تدريبات = السمعية الشفهية"],["In ALM the teacher is the model and controller; learners imitate.","المعلم نموذج ومتحكم"]],"src":"Richards & Rodgers, Approaches and Methods; Larsen-Freeman & Anderson, Techniques and Principles"},"en.meth.humanistic":{"k":"Methods","t":["Humanistic Methods: Silent Way, Suggestopedia, CLL","الطرق الإنسانية"],"body":[["The humanistic (designer) methods that spread in the 1960s–70s treat the learner as a whole person: feelings, confidence and relationships matter as much as the language itself. Each one attacks a different obstacle to learning.","تتعامل مع المتعلم كإنسان كامل، وكل طريقة تعالج عائقاً مختلفاً."]],"map":{"type":"cards","groups":[{"n":"Silent Way","ar":"⁧الطريقة الصامتة — Gattegno⁩","items":[{"n":"Teacher silence","ar":"⁧المعلم يصمت ليكتشف الطالب⁩","kw":["teaching subordinated to learning"]},{"n":"Tools","ar":"⁧قضبان كويزنير ولوحات الألوان⁩","kw":["Cuisenaire rods","Fidel charts"]}],"trap":"⁧الطلاب يتكلمون أكثر، لا أن المعلم ممنوع من الكلام⁩"},{"n":"Suggestopedia","ar":"⁧الإيحائية — Lozanov⁩","items":[{"n":"Desuggestion","ar":"⁧إزالة الحواجز النفسية⁩","kw":["relaxation"]},{"n":"Setting","ar":"⁧موسيقى باروك وكراسٍ مريحة وملصقات⁩","kw":["Baroque music","peripheral learning"]}],"trap":"⁧الموسيقى والراحة = الإيحائية⁩"},{"n":"Community Language Learning","ar":"⁧التعلم الجماعي — Curran⁩","items":[{"n":"Counselor","ar":"⁧المعلم مرشد والطالب عميل⁩","kw":["counseling-learning"]},{"n":"Procedure","ar":"⁧ترجمة وتسجيل محادثة ثم تحليلها⁩","kw":["recorded conversation"]}],"trap":"⁧دور المعلم في CLL = مرشد (counselor)⁩"}]},"pts":[["Silent Way: the teacher models very little; learners discover the language and correct each other.","الطالب يكتشف ويصحّح زميله"],["CLL: learners are 'clients'; the teacher translates what they want to say until they can manage alone.","المعلم يترجم حتى يستقل الطالب"]],"ex":[["Using coloured rods, a teacher silently points to a red rod and a blue rod; students try 'a red rod and a blue rod', and classmates correct each other while the teacher only gestures.","قضبان ملونة ومعلم صامت وتصحيح بين الطلاب: الطريقة الصامتة."]],"traps":[["Founders: **Gattegno** → Silent Way; **Georgi Lozanov** → Suggestopedia; **Charles Curran** → Community Language Learning.","غاتينو الصامتة، لوزانوف الإيحائية، كوران الجماعي"],["Cuisenaire rods and colour charts → the **Silent Way**.","القضبان الملونة = الصامتة"]],"src":"Richards & Rodgers, Approaches and Methods; Brown, Teaching by Principles; Larsen-Freeman & Anderson"},"en.meth.tpr":{"k":"Methods","t":["Total Physical Response (James Asher)","الاستجابة الجسدية الكاملة"],"body":[["TPR coordinates speech and action. Asher observed that children understand a great deal before they speak, and much of what they hear is commands. In TPR the teacher gives commands, models the action, and learners respond physically; speaking comes later, when learners feel ready.","ينسّق الكلام مع الحركة: المعلم يأمر ويمثّل، والطلاب يستجيبون بأجسادهم، والكلام يأتي لاحقاً."]],"pts":[["Comprehension before production; low anxiety.","الفهم قبل الإنتاج وقلق منخفض"],["Movement helps memory (the 'trace' idea).","الحركة تقوي التذكر"],["Best for beginners and young learners; weak for abstract language.","مناسبة للمبتدئين والصغار"]],"traps":[["'Simon Says' and 'listen and do' = TPR.","لعبة سايمون يقول = TPR"],["TPR is a listening-first method; learners are not forced to speak early.","لا يُجبر الطالب على الكلام مبكراً"]],"src":"Richards & Rodgers, Approaches and Methods; Larsen-Freeman & Anderson"},"en.meth.natural":{"k":"Methods","t":["The Natural Approach (Krashen & Terrell)","المدخل الطبيعي"],"body":[["Published by Krashen and Terrell in 1983, the Natural Approach turns Krashen's theory of acquisition into classroom practice. Class time is spent giving learners **comprehensible input** about things that interest them, in a low-anxiety atmosphere, so that acquisition happens naturally.","يحوّل نظرية كراشن إلى ممارسة: مدخلات مفهومة وجو منخفض القلق ليحدث الاكتساب طبيعياً."]],"pts":[["Acquisition (subconscious) matters more than learning (conscious rules).","الاكتساب أهم من التعلم الواعي"],["Input at **i+1**: slightly above the learner's current level.","مدخل أعلى قليلاً من المستوى"],["A **silent period** is respected; speech emerges in stages.","احترام فترة الصمت"],["Low **affective filter**: anxiety blocks input.","مصفاة وجدانية منخفضة"]],"traps":[["Natural Approach = Krashen & Terrell — not Chomsky, not Asher.","كراشن وتيريل"],["It is not the same as the Direct Method's nickname 'natural method'.","ليست الطريقة المباشرة"]],"src":"Richards & Rodgers, Approaches and Methods; Lightbown & Spada, How Languages are Learned"},"en.meth.sit":{"k":"Methods","t":["The Oral Approach and Situational Language Teaching","المدخل الشفهي والتدريس الموقفي"],"body":[["British applied linguists developed the Oral Approach from the 1930s to the 1960s; its best-known figures are **Harold Palmer** and **A. S. Hornby**. Vocabulary and structures were selected and graded, then presented and practised orally in **situations** — with objects, pictures and actions — before reading and writing.","طوّره لغويون بريطانيون بين الثلاثينات والستينات، وأشهرهم بالمر وهورنبي: تراكيب ومفردات متدرجة تُعرض وتُدرّب شفهياً في مواقف قبل القراءة والكتابة."]],"pts":[["Like ALM it rests on a structural view of language and habit-forming practice, but it is British, while ALM is American.","بنيوي مثل السمعية الشفهية، لكنه بريطاني وهي أمريكية"],["A typical lesson moves from presentation in a situation to controlled and then freer practice — the root of **PPP**.","عرض في موقف ثم تدريب موجّه ثم أحرّ: أصل PPP"]],"traps":[["Palmer and Hornby → Oral Approach / Situational Language Teaching; Fries and Lado → Audio-Lingual.","بالمر وهورنبي للموقفي، وفريز ولادو للسمعية الشفهية"]],"src":"Richards & Rodgers, Approaches and Methods in Language Teaching"},"en.meth.clt":{"k":"Communicative Approach","t":["CLT and Communicative Competence","التدريس التواصلي والكفاية التواصلية"],"body":[["Chomsky's 'competence' meant knowledge of grammar. **Dell Hymes** (1972) argued this was too narrow and proposed **communicative competence**: the knowledge and ability to use language appropriately in social contexts. Canale and Swain (1980) divided it into grammatical, sociolinguistic and strategic competence, and Canale (1983) added discourse competence.","هايمز وسّع مفهوم تشومسكي إلى الكفاية التواصلية، وقسّمها كانال وسوين (1980) إلى ثلاثة مكونات، ثم أضاف كانال (1983) الكفاية الخطابية."]],"map":{"type":"cards","groups":[{"n":"Grammatical","ar":"⁧النحوية⁩","items":[{"n":"Form","ar":"⁧قواعد ومفردات ونطق⁩","kw":["linguistic competence"]}]},{"n":"Sociolinguistic","ar":"⁧اللغوية الاجتماعية⁩","items":[{"n":"Appropriacy","ar":"⁧المناسب للموقف والمخاطَب⁩","kw":["register"]}]},{"n":"Discourse","ar":"⁧الخطابية⁩","items":[{"n":"Cohesion","ar":"⁧ربط الجمل في نص متماسك⁩","kw":["coherence"]}]},{"n":"Strategic","ar":"⁧الاستراتيجية⁩","items":[{"n":"Repair","ar":"⁧تعويض النقص وإصلاح التواصل⁩","kw":["paraphrase","gesture"]}]}]},"pts":[["Meaning is primary; language is learned through using it to communicate.","المعنى أولاً"],["Fluency and accuracy are complementary; errors are a natural part of learning.","الطلاقة والدقة معاً"],["Teacher = facilitator and co-communicator; learners = negotiators of meaning.","المعلم ميسّر والطالب مفاوض للمعنى"],["Wilkins' **notional-functional syllabus** was an early CLT syllabus.","منهج المفاهيم والوظائف"],["Who said what: **Hymes** (communicative competence), **Halliday** (functions of language), **Wilkins** (Notional Syllabuses, 1976), **Widdowson** (Teaching Language as Communication, 1978), **Canale & Swain** (components), **Brumfit & Johnson** (The Communicative Approach to Language Teaching, 1979).","هايمز، هاليداي، ويلكنز، ويدوسون، كانال وسوين، برومفيت وجونسون"]],"traps":[["Communicative competence = linguistic competence **plus** the ability to use it appropriately.","ليست القواعد وحدها"],["Communicative competence is Hymes; competence vs performance is Chomsky.","هايمز لا تشومسكي"]],"src":"Richards & Rodgers, Approaches and Methods; Brown, Principles of Language Learning and Teaching"},"en.meth.tblt":{"k":"Communicative Approach","t":["Task-Based Language Teaching","التعليم القائم على المهام"],"body":[["A **task** is an activity in which meaning is primary, there is some gap to close, learners use their own language resources, and there is a clear **non-linguistic outcome** (a plan, a list, a decision). An exercise, by contrast, practises a form for its own sake.","المهمة: المعنى أولاً، وفجوة، ولغة الطالب الخاصة، ونتيجة غير لغوية. أما التمرين فيتدرب على شكل لغوي."],["Jane Willis (1996) proposed a widely used lesson framework, which reverses PPP: learners use language first and study form last.","إطار ويليس يعكس ترتيب PPP: الاستخدام أولاً والقاعدة أخيراً."]],"pts":[["Who's who: **N. S. Prabhu** (the Bangalore project in India, 1979–84, a procedural syllabus of tasks), **Michael Long** (task-based syllabus, focus on form), **Jane Willis** (lesson framework), **David Nunan** and **Rod Ellis** (task design and research).","برابو (مشروع بنغالور)، لونغ، ويليس، نونان، إليس"]],"map":{"type":"cards","groups":[{"n":"Pre-task","ar":"⁧قبل المهمة⁩","items":[{"n":"Topic & task","ar":"⁧تقديم الموضوع والمفردات المفيدة⁩"}]},{"n":"Task cycle","ar":"⁧دورة المهمة⁩","items":[{"n":"Task → planning → report","ar":"⁧إنجاز ثم تحضير التقرير ثم عرضه⁩"}]},{"n":"Language focus","ar":"⁧التركيز اللغوي⁩","items":[{"n":"Analysis & practice","ar":"⁧تحليل اللغة المستخدمة وتدريبها⁩"}]}]},"ex":[["Grade 9 groups plan a two-day visit to AlUla: they read short web texts, agree on a schedule and present a brochure. After the presentations, the teacher focuses on 'going to' and 'will' that groups used.","مهمة بنتيجة حقيقية (كتيّب رحلة) ثم تركيز لغوي بعدها: نموذج ويليس."]],"traps":[["TBLT grew out of the communicative approach.","نشأ من التواصلي"],["Posters, brochures and pamphlet projects are described as task-based learning.","الملصقات والنشرات = بالمهام"],["Problem-based learning = small groups solving a real-world problem.","التعلم بحل المشكلات"]],"src":"Willis, A Framework for Task-Based Learning; Richards & Rodgers; Ellis, Task-based Language Learning and Teaching"},"en.meth.cbi":{"k":"Integrated teaching","t":["Content-Based Instruction and CLIL","التعلم بالمحتوى ودمج المحتوى واللغة"],"body":[["In **CBI**, learners acquire language while studying meaningful content. Common models (Brinton, Snow & Wesche, 1989) are **theme-based** (a language course organised around topics), **sheltered** (subject teaching adapted for language learners) and **adjunct** (a language course linked to a content course).","التعلم بالمحتوى: نماذج موضوعية، ومحمية، ومساندة."],["**CLIL** (Content and Language Integrated Learning) is the European term for teaching a subject through a foreign language with dual aims. Coyle's **4Cs** describe its planning: content, communication, cognition and culture.","CLIL: تدريس مادة بلغة أجنبية بهدفين، وتخطيطها بالعناصر الأربعة."]],"pts":[["Organising a course around family, work and weather = **theme-based** model.","موضوعات = نموذج موضوعي"],["Competency-based teaching focuses on what learners **can do** with the language.","القائم على الكفايات = ما يستطيع فعله"],["In CBI and CLIL lessons teachers write both content and language objectives.","هدف محتوى وهدف لغة"]],"traps":[["The fourth C of CLIL is **culture** (sometimes 'community') — not 'correction'.","الرابع ثقافة"]],"src":"Richards & Rodgers, Approaches and Methods; Brinton, Snow & Wesche; Coyle, Hood & Marsh, CLIL"},"en.meth.coop":{"k":"Learner-centred teaching","t":["Cooperative Learning","التعلم التعاوني"],"body":[["Cooperative learning organises small groups so that success depends on everyone. Johnson and Johnson identified the elements that turn group work into cooperative learning.","جونسون وجونسون حددا العناصر التي تجعل العمل الجماعي تعاونياً."]],"pts":[["**Positive interdependence**: the group succeeds only if every member does.","اعتماد متبادل إيجابي"],["**Individual accountability**: each member is responsible for a part.","مسؤولية فردية"],["**Face-to-face interaction**, **social skills** and **group processing** (reflecting on how the group worked).","تفاعل مباشر ومهارات اجتماعية ومراجعة أداء المجموعة"],["Names: **Jigsaw** was designed by Elliot **Aronson** (1971); **Think-Pair-Share** by Frank **Lyman** (1981).","جيكسو لأرونسون، وفكّر-زاوج-شارك لليمان"]],"ex":[["**Think-Pair-Share**: think alone (30 seconds) → discuss with a partner → share with the class.","فكّر، ناقش زميلك، شارك الصف"],["**Jigsaw**: home group → expert group on one part → back to teach the home group.","جيكسو: مجموعة أم ← مجموعة خبراء ← رجوع للتعليم"]],"traps":[["Group work in itself does not guarantee cooperation; roles and accountability make it work.","الأدوار والمسؤولية تصنع التعاون"],["Pair work best fosters respect and friendship; group activities enrich **interpersonal** skills.","مهارات بين شخصية لا ذاتية"]],"src":"Richards & Rodgers, Approaches and Methods; Brown, Teaching by Principles"},"en.meth.postmethod":{"k":"Modern trends","t":["Post-method Pedagogy and Eclecticism","ما بعد الطريقة والانتقائية"],"body":[["**B. Kumaravadivelu** argued that the search for the best method has ended. Instead of applying a ready-made method, teachers theorise from their practice using three parameters: **particularity** (fit the local context), **practicality** (theory from practice, not only from experts) and **possibility** (awareness of learners' social and political realities).","كومارافاديفيلو: الخصوصية والعملية والإمكان بدل طريقة جاهزة."],["He also proposed **macrostrategies**, such as maximising learning opportunities, facilitating negotiated interaction, promoting learner autonomy and raising cultural consciousness.","واستراتيجيات كبرى مثل تعظيم فرص التعلم وتعزيز الاستقلالية."]],"pts":[["**Eclecticism** = selecting the most suitable techniques from several methods for a purpose (principled, not random).","انتقائية مبدئية لا عشوائية"],["**Dogme** (Thornbury): materials-light, conversation-driven teaching.","دوغمي: محادثة بأقل مواد"],["**Flipped classroom**: input at home, active practice in class — popularised by Bergmann & Sams.","الفصل المقلوب: برغمان وسامز"]],"traps":[["Eclectic teachers pick the **most suitable**, not the easiest or newest, techniques.","الأنسب لا الأسهل"],["Particularity, practicality, possibility = post-method (Kumaravadivelu).","المعايير الثلاثة لما بعد الطريقة"]],"src":"Kumaravadivelu, Beyond Methods; Brown, Teaching by Principles; Richards & Rodgers"},"en.meth.critical":{"k":"Thinking skills","t":["Critical Thinking in the Language Class","التفكير الناقد في حصة اللغة"],"body":[["Critical thinking is reasoned judgment: analysing claims, weighing evidence and reaching a justified conclusion. It sits at the upper levels of Bloom's taxonomy (analyse, evaluate, create), so activities that only require recall or copying do not develop it.","حكم مبرر بالأدلة، ويقع في المستويات العليا من بلوم."]],"pts":[["**Socratic method**: a sequence of probing questions that leads learners to discover ideas.","الطريقة السقراطية: أسئلة متتابعة"],["Useful prompts: 'Why?', 'How do you know?', 'What is an alternative conclusion?', 'Which is better and why?'","أسئلة لماذا وكيف تعرف وما البديل"],["Debates, problem-solving tasks and comparing two texts on the same issue build it.","المناظرة وحل المشكلات ومقارنة النصوص"]],"traps":[["Memorising, translating and copying are not critical thinking.","الحفظ والترجمة والنسخ ليست تفكيراً ناقداً"],["Critical thinking = **evaluating propositions**.","تقييم القضايا"]],"src":"Brown, Teaching by Principles; Anderson & Krathwohl, A Taxonomy for Learning, Teaching and Assessing"},"en.assess.terms":{"k":"Assessment","t":["Test, Assessment, Evaluation","الاختبار والتقويم والتقييم"],"body":[["Think of three circles. The smallest is the **test**: a prepared instrument, given at a set time, that produces a score. Around it is **assessment**: every way a teacher gathers information about learning, formal or informal. The largest is **evaluation**: judging the value of a programme, course or process and making decisions about it.","ثلاث دوائر: الاختبار داخل التقويم، والتقويم داخل التقييم."]],"pts":[["Test = formal procedure; measurement = assigning numbers.","الاختبار إجراء رسمي"],["Assessment = ongoing; includes observation, portfolios, questioning.","التقويم مستمر"],["Evaluation = merit and worth of a programme; course-evaluation surveys are an **indirect** source.","التقييم حكم على البرنامج"]],"ex":[["During a term Mr. Fahad gives two quizzes (tests), observes speaking and checks notebooks (assessment). At the end, the department reviews results and student surveys to decide whether to keep the new reading course (evaluation).","اختبارات + ملاحظة = تقويم، والحكم على المقرر نفسه = تقييم."]],"traps":[["'Judges the value or worth of a programme' = evaluation.","قيمة البرنامج = تقييم"],["Not every assessment is a test.","ليس كل تقويم اختباراً"]],"src":"Brown & Abeywickrama, Language Assessment; Hughes, Testing for Language Teachers"},"en.assess.formative":{"k":"Assessment","t":["Formative, Summative and Diagnostic","التكويني والختامي والتشخيصي"],"body":[["Formative assessment is assessment **for** learning: evidence is gathered during instruction and used to adjust teaching and give feedback. Black and Wiliam's research showed that this everyday use of evidence raises achievement. Summative assessment is assessment **of** learning: it reports achievement at the end. A third label, assessment **as** learning, describes learners monitoring their own progress through self-assessment.","التكويني للتعلم، والختامي للحكم على التعلم، والتقويم كتعلم يعني أن الطالب يراقب تقدمه بنفسه."]],"pts":[["Formative examples: questioning, observation, exit tickets, pop quizzes, drafts with feedback.","أمثلة التكويني"],["Summative examples: end-of-unit test, final exam, end-of-term project grade.","أمثلة الختامي"],["Diagnostic: before instruction, to plan teaching and remedial work.","التشخيصي قبل التدريس"],["Informal assessment (e.g. watching a role-play) is unplanned and usually ungraded.","غير الرسمي: ملاحظة بلا درجة"]],"traps":[["The same quiz can be formative or summative — it depends on how the results are **used**.","العبرة باستخدام النتيجة"],["Assessment for learning = formative.","التقويم من أجل التعلم = تكويني"]],"src":"Brown & Abeywickrama, Language Assessment; Black & Wiliam, Inside the Black Box"},"en.assess.purpose":{"k":"Assessment","t":["Test Types by Purpose","أنواع الاختبارات حسب الغرض"],"body":[["Hughes and Brown classify tests by the information they provide. The key distinction: some tests are tied to a course (achievement, progress), others are not (proficiency, aptitude).","بعضها مرتبط بمقرر (التحصيلي والمرحلي) وبعضها لا (الكفاءة والاستعداد)."]],"map":{"type":"cards","groups":[{"n":"Not course-based","ar":"⁧غير مرتبطة بمقرر⁩","items":[{"n":"Proficiency","ar":"⁧قدرة عامة الآن⁩","kw":["admission"]},{"n":"Aptitude","ar":"⁧تنبؤ بالنجاح مستقبلاً⁩","kw":["MLAT"]}]},{"n":"Course-based","ar":"⁧مرتبطة بمقرر⁩","items":[{"n":"Achievement","ar":"⁧نهاية المقرر⁩","kw":["final"]},{"n":"Progress","ar":"⁧ما دُرّس مؤخراً⁩","kw":["during the course"]}]},{"n":"For decisions","ar":"⁧لاتخاذ قرار تعليمي⁩","items":[{"n":"Placement","ar":"⁧الصف المناسب⁩","kw":["homogeneous"]},{"n":"Diagnostic","ar":"⁧نقاط القوة والضعف⁩","kw":["remedial"]}]}]},"pts":[["Proficiency example: checking that a student's English is good enough for a university major.","مثال الكفاءة: القبول في تخصص جامعي"],["Achievement = a particular course; progress = recently taught material; aptitude = predicts success in learning a language.","تحصيلي ومرحلي واستعداد"]],"traps":[["Proficiency = present general ability; aptitude = potential to learn.","الكفاءة حاضر، والاستعداد إمكانية"],["Placement groups learners into **similar** (homogeneous) levels.","التحديد يصنع مجموعات متقاربة"]],"src":"Hughes, Testing for Language Teachers; Brown & Abeywickrama, Language Assessment"},"en.assess.nrt":{"k":"Assessment","t":["Norm-Referenced vs Criterion-Referenced","معياري المرجع ومحكّي المرجع"],"body":[["A **norm-referenced** test interprets each score in relation to the group: percentile ranks, the mean and the spread matter, and items are chosen to spread students out. A **criterion-referenced** test interprets each score against a fixed standard or objective: has the learner reached the required level or not?","المعياري يقارن بالمجموعة ويهتم بالترتيب، والمحكّي يقارن بمعيار ثابت ويهتم بالإتقان."]],"pts":[["NRT question: 'How does she compare with others?'","كيف يقارن بغيره؟"],["CRT question: 'Can she do X?' — most classroom tests linked to objectives are CRTs.","هل يستطيع؟ أغلب اختبارات الصف محكّية"]],"traps":[["A cut-off score or set objective = criterion-referenced.","درجة قطع أو هدف = محكّي"],["'Top 10% get the scholarship' = norm-referenced interpretation.","أعلى 10% = معياري"]],"src":"Brown & Abeywickrama, Language Assessment"},"en.assess.discrete":{"k":"Assessment","t":["Discrete-Point vs Integrative Testing","اختبار العناصر المنفصلة والاختبار التكاملي"],"body":[["**Discrete-point** testing (associated with Lado and structuralism) breaks language into separate elements — sounds, words, structures — and tests each one in isolation. **Integrative** testing (associated with Oller) argues that language ability is more than the sum of parts, so tasks should require several components at once.","المنفصل يجزّئ اللغة ويختبر كل عنصر وحده، والتكاملي يرى اللغة كلاً لا يتجزأ."]],"pts":[["Discrete-point: choose 'much/many', one tense per item, minimal pairs.","اختيار much أو many"],["Integrative: cloze, dictation, essay, oral interview.","الفراغات والإملاء والمقال والمقابلة"],["**Cloze**: words deleted at regular intervals (e.g. every 7th word) or selected words.","حذف منتظم للكلمات"]],"traps":[["A cloze test is integrative, even though it is scored objectively.","الفراغات تكاملي وموضوعي التصحيح"],["The best single task for integrated skills = an essay.","المقال للمهارات المتكاملة"]],"src":"Brown & Abeywickrama, Language Assessment; Hughes, Testing for Language Teachers"},"en.assess.principles":{"k":"Assessment","t":["Brown's Five Principles of Assessment","مبادئ براون الخمسة"],"body":[["Every test is a compromise between these principles. A one-to-one interview may be highly authentic and valid for speaking, but less practical and harder to make reliable; a multiple-choice test is practical and reliable but less authentic.","كل اختبار موازنة بين المبادئ: المقابلة أصيلة لكنها أقل عملية، والاختيار من متعدد عملي لكنه أقل أصالة."]],"pts":[["**Practicality**: time, cost, administration and scoring.","العملية"],["**Reliability**: consistent and dependable results.","الثبات"],["**Validity**: measures what it intends to measure — the most important.","الصدق — الأهم"],["**Authenticity**: tasks like real-world language use.","الأصالة"],["**Washback**: the effect on teaching and learning.","الأثر الرجعي"]],"traps":[["A school chooses a test because it is cheap and quick to score = practicality.","رخيص وسريع = العملية"],["Tasks resembling real-world use = authenticity.","تشبه الواقع = الأصالة"]],"src":"Brown & Abeywickrama, Language Assessment"},"en.assess.washback":{"k":"Assessment","t":["Washback (Backwash)","الأثر الرجعي"],"body":[["Washback is the influence a test has on what happens in the classroom: what teachers teach, how they teach, and how learners study. Hughes calls it **backwash**. It can be **positive** (beneficial) — a test of real communication encourages communicative teaching — or **negative** — a grammar-only exam pushes teachers to drill grammar and ignore speaking.","تأثير الاختبار على ما يحدث في الصف، وقد يكون إيجابياً أو سلبياً."]],"pts":[["To get positive washback: test the skills you want to encourage, use direct tests, base tests on objectives and make sure students know the criteria.","اختبر ما تريد تشجيعه وبطريقة مباشرة"],["High-stakes tests produce the strongest washback.","الاختبارات المصيرية أقوى أثراً"],["Feedback that helps learners improve is part of washback at classroom level.","التغذية الراجعة جزء من الأثر"]],"traps":[["'The impact of testing on teaching and learning, positive or negative' = washback — not validity or reliability.","أثر الاختبار على التدريس = الأثر الرجعي لا الصدق ولا الثبات"]],"src":"Hughes, Testing for Language Teachers; Brown & Abeywickrama, Language Assessment"},"en.assess.cefr":{"k":"Assessment","t":["The CEFR Levels","مستويات الإطار الأوروبي المرجعي"],"body":[["The Common European Framework of Reference for Languages (CEFR), published by the Council of Europe in 2001 and updated by the Companion Volume in 2020, describes proficiency in any language with six levels and can-do descriptors. It is a framework of reference: tests, courses and textbooks are **aligned** to it.","إطار مرجعي من مجلس أوروبا تُوائَم عليه الاختبارات والمقررات."]],"pts":[["**A1**: understands and uses very basic everyday phrases; introduces self; interacts simply if the partner speaks slowly. **A2**: simple, routine exchanges on familiar matters (family, shopping, local area).","A1 عبارات بسيطة، A2 مواقف روتينية"],["**B1**: main points of clear standard input on familiar topics; copes with most travel situations; simple connected text; brief reasons and opinions. **B2**: main ideas of complex texts; fluency and spontaneity; explains a viewpoint with advantages and disadvantages.","B1 النقاط الرئيسية، B2 طلاقة وتلقائية"],["**C1**: demanding, longer texts and implicit meaning; flexible use for social, academic and professional purposes. **C2**: understands virtually everything with ease; summarises from different sources; fine shades of meaning.","C1 مرونة، C2 إتقان شبه كامل"],["Descriptors are positive **can-do statements**, reflecting the **action-oriented approach** (learners as social agents).","عبارات إيجابية والمنهج الموجه للفعل"],["The Companion Volume added **mediation** descriptors and a Pre-A1 level, and dropped the 'native speaker' benchmark.","أضاف الوساطة وما قبل A1"],["Uses: aligning curricula and tests to common levels, writing objectives, learner self-assessment (e.g. the European Language Portfolio).","المواءمة والأهداف والتقييم الذاتي"]],"map":{"type":"cards","groups":[{"n":"Basic user","ar":"⁧مستخدم أساسي⁩","items":[{"n":"A1","ar":"⁧عبارات يومية بسيطة جداً⁩"},{"n":"A2","ar":"⁧تبادلات روتينية مألوفة⁩"}]},{"n":"Independent user","ar":"⁧مستخدم مستقل⁩","items":[{"n":"B1","ar":"⁧النقاط الرئيسية ومواقف السفر⁩"},{"n":"B2","ar":"⁧نصوص معقدة وطلاقة وعفوية⁩"}]},{"n":"Proficient user","ar":"⁧مستخدم متمكن⁩","items":[{"n":"C1","ar":"⁧نصوص طويلة ومعانٍ ضمنية⁩"},{"n":"C2","ar":"⁧يفهم كل شيء تقريباً بسهولة⁩"}]}]},"traps":[["The CEFR is not a test.","ليس اختباراً"],["B1–B2 = independent user; the 2020 update added **mediation** descriptors.","B = مستقل، والتحديث أضاف الوساطة"]],"src":"Council of Europe, CEFR (2001) and Companion Volume (2020)"},"en.assess.alt":{"k":"Assessment","t":["Alternative Assessment: Portfolios, Self and Peer","التقويم البديل: ملف الإنجاز والتقويم الذاتي والأقران"],"body":[["**Alternative** (performance-based) assessment collects evidence from real work over time instead of a single timed test: portfolios, journals, conferences, observation, projects, and self- and peer-assessment. It is strong on **authenticity** and **washback** and gives rich feedback; its weak points are **practicality** (time) and **reliability** of scoring, which clear criteria and rubrics improve.","يجمع أدلة من عمل حقيقي عبر الزمن بدل اختبار واحد: قوي في الأصالة والأثر الرجعي، وأضعف في العملية والثبات، والمعايير الواضحة تعالج ذلك."]],"pts":[["**Portfolio**: a purposeful collection of a learner's work showing **progress over time**, usually with the learner's own reflections.","ملف الإنجاز: عمل مختار يُظهر التقدم مع تأمل الطالب"],["**Self-assessment** builds autonomy and awareness of criteria (assessment **as** learning); **peer assessment** adds an audience and needs training and a checklist.","الذاتي يبني الاستقلالية، والأقران يحتاج تدريباً وقائمة معايير"],["**Conferences** and **journals**: one-to-one talks and written reflections that guide the next step.","المقابلات الفردية واليوميات"],["Portfolios suit programmes with flexible outcomes.","يناسب البرامج ذات النواتج المرنة"]],"traps":[["Portfolios and projects = alternative / performance-based assessment, not standardised testing.","ملف الإنجاز = تقويم بديل"],["Main limitation of self- and peer-assessment: subjectivity (lower reliability).","عيبه الذاتية"]],"src":"Brown & Abeywickrama, Language Assessment; Genesee & Upshur, Classroom-based Evaluation in Second Language Education"},"en.assess.validity":{"k":"Test quality","t":["Types of Validity","أنواع الصدق"],"body":[["Validity is about the meaning and use of scores. Modern testing (Messick) treats it as one unified idea — construct validity — supported by different kinds of evidence. Teacher-education texts still use the traditional labels below.","الصدق يتعلق بمعنى الدرجة واستخدامها، والتسميات التقليدية أدناه هي الشائعة في كتب إعداد المعلم."]],"map":{"type":"cards","groups":[{"n":"Content","ar":"⁧صدق المحتوى⁩","items":[{"n":"Sampling","ar":"⁧يمثّل محتوى المقرر وأهدافه⁩","kw":["table of specifications"]}]},{"n":"Criterion-related","ar":"⁧الصدق المرتبط بمحك⁩","items":[{"n":"Concurrent","ar":"⁧يتفق مع مقياس آخر في نفس الوقت⁩"},{"n":"Predictive","ar":"⁧يتنبأ بالأداء المستقبلي⁩"}]},{"n":"Construct","ar":"⁧صدق البناء⁩","items":[{"n":"The ability itself","ar":"⁧يقيس المفهوم النظري لا غيره⁩","kw":["reading speed ≠ reading"]}]},{"n":"Face","ar":"⁧الصدق الظاهري⁩","items":[{"n":"Looks right","ar":"⁧يبدو مناسباً للمختبَرين⁩"}]}]},"traps":[["Table of specifications → content validity.","جدول المواصفات = صدق المحتوى"],["A placement test that predicts later success → predictive validity.","يتنبأ = تنبؤي"],["A listening test that depends on memory → weak construct validity.","يعتمد على الذاكرة = ضعف صدق البناء"]],"src":"Brown & Abeywickrama, Language Assessment; Hughes, Testing for Language Teachers"},"en.assess.reliability":{"k":"Test quality","t":["Types of Reliability","أنواع الثبات"],"body":[["Reliability estimates differ in what source of inconsistency they check: time, test version, the items themselves, or the people scoring.","كل نوع يفحص مصدراً مختلفاً لعدم الاتساق: الزمن، أو النسخة، أو الأسئلة، أو المصحح."]],"pts":[["**Test–retest**: same test, same learners, two occasions.","إعادة الاختبار"],["**Parallel (alternate) forms**: two equivalent versions.","الصور المتكافئة"],["**Internal consistency**: split-half, Cronbach's alpha.","الاتساق الداخلي"],["**Inter-rater**: different raters agree; **intra-rater**: one rater is consistent over time.","بين المصححين وداخل المصحح"],["Sources of unreliability: the test (ambiguous or too few items), conditions (noise, timing), the student (illness, anxiety) and especially the **rater** — hence rubrics and two markers for writing and speaking.","الاختبار والظروف والطالب والمصحح"]],"ex":[["A bathroom scale that always shows 2 kg too much is reliable (consistent) but not valid (wrong).","ميزان يزيد دائماً 2 كجم: ثابت لكنه غير صادق"]],"traps":[["A test can be reliable without being valid, but cannot be valid without being reliable.","ثابت بلا صدق ممكن، والعكس لا"],["One teacher marking the same essay differently in October and December → intra-rater problem.","نفس المصحح في وقتين = داخل المصحح"]],"src":"Brown & Abeywickrama, Language Assessment; Hughes, Testing for Language Teachers"},"en.assess.rubrics":{"k":"Scoring","t":["Analytic vs Holistic Rubrics","السلم التحليلي والشمولي"],"body":[["Both types describe levels of performance, but they differ in what the learner gets back. **Holistic** scoring gives one impression score for the whole performance: quick, good for large numbers, but it hides strengths and weaknesses. **Analytic** scoring rates each criterion separately: slower, but diagnostic and more useful for teaching.","الشمولي سريع ويعطي درجة واحدة، والتحليلي أبطأ لكنه تشخيصي ومفيد للتعليم."]],"pts":[["Main benefit of sharing a rubric beforehand: it makes the **criteria clear** to students.","وضوح المعايير"],["Co-constructing rubrics helps learners see assessment as a learning tool.","بناؤه مع الطلاب"],["Checklist (present/absent) → rating scale (degree) → rubric (described levels).","من القائمة إلى الروبرك"]],"traps":[["Limitation of holistic scoring: no explicit feedback on specific areas.","عيب الشمولي"],["Co-constructing a rubric does not mean lowering standards.","ليس تسهيلاً للمعايير"]],"src":"Brown & Abeywickrama, Language Assessment; Weigle, Assessing Writing"},"en.assess.items":{"k":"Test analysis","t":["Item Facility, Discrimination and Distractors","السهولة والتمييز والبدائل"],"body":[["**Item facility (IF)** = number correct ÷ number of test-takers. 0.90 is very easy, 0.20 very hard; items roughly between 0.15 and 0.85 are usually kept.","السهولة = عدد الصحيح ÷ عدد المختبَرين."],["**Item discrimination (ID)** compares a high-scoring group with a low-scoring group: (high correct − low correct) ÷ (½ × total in both groups). It ranges from −1 to +1; higher positive values are better.","التمييز يقارن مجموعة عليا بدنيا، ويتراوح بين −1 و+1."]],"pts":[["Negative ID: low scorers do better → faulty item: revise or remove.","سالب = معيب"],["A distractor chosen by nobody is not working.","بديل لا يختاره أحد = لا يعمل"],["A distractor that attracts many high scorers may be ambiguous or a second key.","بديل يجذب الأقوياء = غامض"]],"ex":[["Item 7: 9 of 10 high scorers and 3 of 10 low scorers answered correctly. ID = (9 − 3) ÷ 10 = 0.6, and IF = 12 ÷ 20 = 0.6 — an item of medium difficulty that discriminates well.","التمييز 0.6 والسهولة 0.6 — سؤال متوسط الصعوبة ويميّز جيداً."]],"traps":[["IF is also called the difficulty index — but a higher IF means an **easier** item.","معامل أعلى = سؤال أسهل"]],"src":"Brown & Abeywickrama, Language Assessment; Hughes, Testing for Language Teachers"},"en.assess.feedback":{"k":"Feedback","t":["Effective Feedback","التغذية الراجعة الفعالة"],"body":[["Hattie and Timperley describe feedback as answering three questions: **Where am I going?** (the goal), **How am I going?** (progress) and **Where to next?** (feed forward). Feedback about the task, the process and self-regulation helps; praise directed at the person ('You're clever') does little for learning.","ثلاثة أسئلة: إلى أين أذهب؟ كيف أتقدم؟ ما الخطوة التالية؟ والمديح الشخصي قليل الفائدة."]],"pts":[["Effective: timely, specific, clear, focused, balanced, impersonal, linked to objectives.","صفات الفعالة"],["**Content** feedback (ideas) vs **form** feedback (accuracy).","المحتوى مقابل الشكل"],["Feedback informs both students and teachers.","يفيد الطالب والمعلم"],["Constructive alignment (Biggs): objectives, activities and assessment match.","المواءمة البنّاءة"]],"traps":[["'Correct every mistake' is not effective feedback and can demotivate.","تصحيح كل خطأ يُحبط"],["Long-term achievement is encouraged through **self-evaluation**.","التقييم الذاتي"]],"src":"Hattie & Timperley, The Power of Feedback; Brown & Abeywickrama, Language Assessment"},"en.assess.direct":{"k":"Testing skills","t":["Direct vs Indirect Testing","الاختبار المباشر وغير المباشر"],"body":[["Hughes recommends **direct** testing whenever possible for productive skills: if we want to know how well someone writes, we ask them to write. Indirect tests can be more reliable and practical, but their link to the real skill is weaker, and they can produce negative washback.","هيوز يفضّل المباشر للمهارات الإنتاجية: من أراد معرفة الكتابة طلب الكتابة."]],"pts":[["Writing: clear prompt (purpose, audience, length), rubric, more than one task.","الكتابة: تعليمات واضحة وروبرك"],["Speaking: interview, picture description, role-play, information gap; two raters; record.","الكلام: مقابلة ولعب أدوار ومصححان"],["Reading/listening: items that need the text — information transfer, matching, short answers.","القراءة والاستماع: أسئلة تتطلب النص"],["Listening: avoid items that test memory or reading more than listening; reading: items should not be answerable from general knowledge.","لا تختبر الذاكرة ولا المعرفة العامة"],["Grammar & vocabulary: gap-fill, multiple choice, sentence transformation, word formation, C-test.","القواعد والمفردات"]],"traps":[["Choosing the error in a sentence to judge writing = indirect.","اكتشاف الخطأ = غير مباشر"],["Writing an email invitation = direct.","كتابة رسالة = مباشر"]],"src":"Hughes, Testing for Language Teachers; Brown & Abeywickrama, Language Assessment"},"en.obj.goals":{"k":"Objectives","t":["Goals, Objectives and Outcomes","الغايات والأهداف والنواتج"],"body":[["The three terms move from general to specific. **Goals** express broad, long-term intentions for a course or programme. **Objectives** state, for a unit or lesson, exactly what learners will do. **Learning outcomes** state what learners should be able to do after the instruction.","من العام إلى الخاص: الغاية ← الهدف ← الناتج."]],"pts":[["Goals: general, long-term, not directly measurable.","عامة وطويلة المدى"],["Objectives: specific, observable, measurable, short-term.","محددة وقابلة للقياس"],["Setting clear objectives is the first planning step (fuller course-design models put needs analysis before it).","وضع الأهداف أول خطوة في التخطيط، ويسبقها تحليل الاحتياجات في النماذج الموسعة"]],"traps":[["'Students will understand the plot' = a goal (understand cannot be observed).","يفهم = غاية"],["Goals are **more general** than objectives.","الغايات أعم"]],"src":"Brown, Teaching by Principles; Richards, Curriculum Development in Language Teaching"},"en.obj.smart":{"k":"Objectives","t":["SMART, ABCD and Mager","صيغ كتابة الهدف"],"body":[["Three popular frameworks express the same idea — an objective must be precise enough to check.","ثلاث صيغ لفكرة واحدة: هدف دقيق يمكن التحقق منه."]],"map":{"type":"cards","groups":[{"n":"SMART","ar":"⁧خمس صفات⁩","items":[{"n":"S-M-A-R-T","ar":"⁧محدد، قابل للقياس، ممكن، ملائم، محدد بزمن⁩","kw":["time-bound"]}]},{"n":"ABCD","ar":"⁧أربعة عناصر⁩","items":[{"n":"A-B-C-D","ar":"⁧الجمهور، السلوك، الشرط، الدرجة⁩","kw":["degree"]}]},{"n":"Mager","ar":"⁧ثلاثة عناصر⁩","items":[{"n":"P-C-C","ar":"⁧الأداء، الشرط، المعيار⁩","kw":["criterion"]}]}]},"pts":[["Good verbs: identify, list, distinguish, compare, write, pronounce, use.","أفعال جيدة"],["Avoid: know, understand, appreciate, learn, be familiar with, be aware of.","أفعال تُتجنب"],["An objective describes the learner, not the teacher: NOT 'The teacher will teach…'.","الهدف عن الطالب لا المعلم"]],"ex":[["'Given a map (condition), students will describe the route to school (performance) with no more than two errors (criterion).'","الشرط والأداء والمعيار في جملة واحدة"]],"traps":[["'With at least four correct' = criterion (Mager) / degree (ABCD).","معيار أو درجة"],["Conditions of good objectives: all **except** general/broad.","ما عدا عام"]],"src":"Mager, Preparing Instructional Objectives; Brown, Teaching by Principles"},"en.obj.bloom":{"k":"Objectives","t":["Bloom's Taxonomy: Original vs Revised","تصنيف بلوم: الأصلي والمعدّل"],"body":[["Benjamin Bloom and colleagues published the cognitive taxonomy in 1956. In 2001 Lorin Anderson and David Krathwohl revised it: levels became verbs, the two top levels swapped places, and a second dimension — types of knowledge — was added.","بلوم 1956، ثم أندرسون وكراثول 2001: أفعال بدل الأسماء وتبديل القمة وإضافة بُعد المعرفة."]],"map":{"type":"cards","groups":[{"n":"Original 1956","ar":"⁧الأصلي⁩","items":[{"n":"6 nouns","ar":"⁧معرفة ← فهم ← تطبيق ← تحليل ← تركيب ← تقييم⁩","kw":["evaluation = top"]}]},{"n":"Revised 2001","ar":"⁧المعدّل⁩","items":[{"n":"6 verbs","ar":"⁧يتذكر ← يفهم ← يطبق ← يحلل ← يقيّم ← يبتكر⁩","kw":["create = top"]}]}]},"pts":[["Lower-order: remember, understand, apply. Higher-order (HOTS): analyze, evaluate, create.","دنيا وعليا"],["Knowledge dimension: factual, conceptual, procedural, metacognitive.","بُعد المعرفة الأربعة"],["Synthesis (1956) ≈ create (2001): combining parts into a new whole.","التركيب يقابل الابتكار"],["Order: original knowledge → comprehension → application → analysis → synthesis → evaluation; revised remember → understand → apply → analyze → evaluate → create.","ترتيب المستويات في النسختين"]],"ex":[["One text, three levels: 'List the places Ali visited' (remember) → 'Compare Ali's trip with yours' (analyze) → 'Design a one-day tour of Jeddah for a visitor' (create).","نفس النص بثلاثة مستويات: تذكر ← تحليل ← ابتكار."]],"traps":[["Highest level: **evaluation** (original) vs **create** (revised) — read which version is meant.","انتبه للنسخة"],["In the 2001 document, 'classifying' and 'comparing' are listed under *understand*; most teacher verb lists put compare/contrast under analysis. Judge by the options given.","التصنيف والمقارنة يختلف موضعهما حسب القائمة"]],"src":"Anderson & Krathwohl, A Taxonomy for Learning, Teaching and Assessing; Bloom et al., Taxonomy of Educational Objectives"},"en.obj.verbs":{"k":"Objectives","t":["Bloom's Levels: Typical Verbs and Tasks","أفعال مستويات بلوم ومهامها"],"body":[["To place an objective or question on a level, look at the **thinking the task demands**, not only the verb. The lists below follow the revised taxonomy (Anderson & Krathwohl, 2001); the names in brackets are the 1956 terms.","المستوى يُحدد بنوع التفكير الذي تتطلبه المهمة لا بالفعل وحده."]],"pts":[["**Remember** (knowledge): list, name, define, recall, match — 'Name three manners of articulation.'","يتذكر: يعدّد، يسمّي، يعرّف"],["**Understand** (comprehension): explain, summarize, paraphrase, retell, give examples — 'Explain why the character felt sad.'","يفهم: يشرح، يلخّص، يعيد الصياغة"],["**Apply** (application): use, solve, complete, demonstrate — 'Use the past simple to describe your weekend.'","يطبّق: يستخدم، يحل، ينفّذ"],["**Analyze** (analysis): distinguish, compare, contrast, categorize, outline — 'Distinguish facts from opinions in the advert.'","يحلّل: يميّز، يقارن، يصنّف"],["**Evaluate** (evaluation): judge, justify, critique, assess, recommend — 'Which ending is better? Justify your choice.'","يقيّم: يحكم، يبرّر، ينقد"],["**Create** (synthesis): design, compose, plan, produce, invent — 'Design an advertisement for a new app.'","يبتكر: يصمم، يؤلف، يخطط"]],"traps":[["'Explain a character's feelings' = understand, not evaluate.","يشرح = فهم"],["'List' is lower-order; 'plan', 'assess' and 'design' are higher-order.","يعدّد أدنى، ويخطط ويقيّم ويصمم أعلى"],["Combining ideas into a new whole = synthesis (1956) / create (2001).","دمج الأفكار في كلّ جديد = تركيب أو ابتكار"]],"src":"Anderson & Krathwohl, A Taxonomy for Learning, Teaching and Assessing; Brown, Teaching by Principles"},"en.obj.domains":{"k":"Objectives","t":["Three Domains of Objectives","مجالات الأهداف الثلاثة"],"body":[["Each domain has its own ladder of levels, from simple to complex.","لكل مجال سلّم مستويات من البسيط إلى المعقد."]],"map":{"type":"cards","groups":[{"n":"Cognitive","ar":"⁧المعرفي — Bloom⁩","items":[{"n":"Thinking","ar":"⁧من التذكر إلى الابتكار⁩","kw":["describe","analyze"]}]},{"n":"Affective","ar":"⁧الوجداني — Krathwohl⁩","items":[{"n":"Values","ar":"⁧استقبال، استجابة، تقدير القيمة، تنظيم، الاتّسام بالقيمة⁩","kw":["attitudes"]}]},{"n":"Psychomotor","ar":"⁧النفسحركي — Simpson / Dave⁩","items":[{"n":"Skills","ar":"⁧دايف: تقليد، معالجة، دقة، ترابط، تطبّع⁩","kw":["imitation","naturalisation"]}]}]},"pts":[["Simpson's levels: perception, set, guided response, mechanism, complex overt response, adaptation, origination.","مستويات سمبسون السبعة"],["An 'attitudinal' objective (develop a critical attitude) belongs to the affective domain.","هدف اتجاهات = وجداني"]],"traps":[["Affective domain = Krathwohl (not Bloom alone, not Dave).","الوجداني = كراثول"],["'Performs an experiment' = psychomotor; 'describes a topic' = cognitive.","يجري تجربة = نفسحركي"]],"src":"Krathwohl, Bloom & Masia, Taxonomy: Affective Domain; Anderson & Krathwohl; Simpson; Dave"},"en.obj.terminal":{"k":"Objectives","t":["Terminal and Enabling Objectives","الأهداف النهائية والتمكينية"],"body":[["Unit (module) objectives describe what learners will achieve by the end of a unit; lesson objectives break them into smaller steps for each lesson.","أهداف الوحدة تتفرع إلى أهداف دروس."],["A **terminal objective** describes the final performance expected at the end of a unit or course. **Enabling objectives** are the smaller, prerequisite skills and knowledge learners need to reach it, usually spread across lessons. Planning the enabling steps from the terminal objective is a form of backward design.","النهائي هو الأداء الختامي، والتمكينية خطوات لازمة للوصول إليه، وتخطيطها من النهائي تصميم عكسي."]],"ex":[["Terminal: 'write an 80-word email inviting a friend'. Enabling: use 'Would you like to…?'; write dates and times; open and close an email politely.","مثال الدعوة بالبريد"]],"traps":[["'By the end of the unit, students will…' usually signals a terminal (unit-level) objective.","بنهاية الوحدة = نهائي"]],"src":"Mager, Preparing Instructional Objectives; Brown, Teaching by Principles"},"en.obj.criteria":{"k":"Objectives","t":["Learning Intentions and Success Criteria","نوايا التعلم ومعايير النجاح"],"body":[["A **learning intention** tells students what they are learning; **success criteria** tell them how they and the teacher will know they have succeeded. Shared in simple language, they let learners monitor their own work, which is the heart of assessment for learning.","نية التعلم: ماذا نتعلم؟ ومعايير النجاح: كيف نعرف أننا نجحنا؟"]],"pts":[["WALT = We Are Learning To…; WILF = What I'm Looking For…","WALT وWILF"],["Can-do statements link lesson objectives to CEFR-style descriptors.","عبارات أستطيع"],["In CLIL/SIOP lessons: one **content** objective + one **language** objective.","هدف محتوى وهدف لغة"],["Share objectives on the board, explain them at the start, refer back during the lesson and check them at the end.","على السبورة وفي البداية والأثناء والنهاية"]],"ex":[["Success criterion: 'I can use *because* to give two reasons.'","معيار نجاح بصيغة «أستطيع»"
