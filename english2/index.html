|en.pavlov]]): it is linked to the **stimulus**.","إجرائي / كلاسيكي"]],"t":[["Behaviorism","Learning as habit formation through stimulus, response and reinforcement.","السلوكية"],["Tabula rasa (blank slate)","The behaviorist view that the mind starts empty.","صفحة بيضاء"],["Operant conditioning","Behavior shaped by consequences (reinforcement after a response) — Skinner.","إشراط إجرائي"],["Classical conditioning","Learning by associating stimuli — Pavlov.","إشراط كلاسيكي"]],"intro":[],"ex":[]},{"h":["Nativism (Chomsky)","الفطرية"],"pts":[["[[Chomsky|en.chomsky]]: humans are born with a **Language Acquisition Device (LAD)**; all languages share **Universal Grammar**.","جهاز الاكتساب والقواعد الكلية"],["Evidence: children say what they never heard ('I goed') — they apply rules, not just imitate.","goed دليل على القاعدة لا التقليد"],["**Competence** = underlying knowledge of language; **performance** = actual use.","كفاية / أداء"],["[[Lenneberg|en.lenneberg]]'s **Critical Period Hypothesis** (age-linked acquisition) supports nativism.","المرحلة الحرجة"],["Innatists: input alone stimulates acquisition; feedback does not change the sequence of development.","المدخل يكفي"]],"t":[["Nativism (innatism)","The view that humans are born with an innate capacity for language.","الفطرية"],["Language Acquisition Device (LAD)","Chomsky's proposed innate mental faculty for language.","جهاز اكتساب اللغة"],["Universal Grammar","Principles and properties shared by all languages.","القواعد الكلية"],["Competence","A speaker's underlying (subconscious) knowledge of the language system.","الكفاية"],["Performance","The actual production and use of language.","الأداء"],["Critical Period Hypothesis","The ability to acquire language is biologically linked to age.","فرضية المرحلة الحرجة"]],"intro":[],"ex":[]},{"h":["Cognitivism and Piaget","المعرفية وبياجيه"],"pts":[["Acquisition is **rule formation**; language development follows **cognitive development** (attention, memory, linking new to known).","تكوين قواعد مرتبط بالنمو المعرفي"],["[[Piaget|en.piaget]]: **assimilation** fits new information into a schema; **accommodation** changes the schema.","تمثّل / مواءمة"],["Piaget's preoperational stage (**2–7 years**): symbols, imagination, memorization.","2–7 سنوات"],["[[Ausubel|en.ausubel]]: **meaningful learning** links new material to existing knowledge (advance organizer).","التعلم ذو المعنى"]],"t":[["Cognitivism","Learning as active mental processing and rule formation.","المعرفية"],["Accommodation","Modifying a schema to fit new information.","مواءمة"],["Assimilation","Incorporating new information into an existing schema.","تمثّل"],["Schema","An organized mental structure of knowledge.","مخطط ذهني"],["Cognitive development","The emergence of mental abilities and skills that make up the human intellect.","النمو المعرفي"]],"intro":[],"ex":[]},{"h":["Constructivism and Vygotsky","البنائية وفيجوتسكي"],"pts":[["Learners **construct** knowledge; [[Bruner|en.bruner]]: discovery learning and the spiral curriculum.","بناء المعرفة"],["**Sociocultural theory** ([[Vygotsky|en.zpd]]): learning happens with a more knowledgeable other inside the **ZPD**.","التفاعل داخل منطقة النمو القريبة"],["**Scaffolding** supports learners until they work alone; it makes input more **comprehensible**.","السقالات"],["Interactionist view: meaningful conversation drives acquisition — hence collaborative writing and peer feedback.","التفاعل والتعاون"]],"t":[["Zone of Proximal Development (ZPD)","The gap between what a learner can do alone and with help.","منطقة النمو القريبة"],["More Knowledgeable Other (MKO)","A teacher or peer who supports learning.","الأكثر معرفة"],["Scaffolding","Temporary support gradually removed as competence grows.","سقالات"],["Sociocultural theory","Learning as a social process mediated by interaction.","النظرية الاجتماعية الثقافية"],["Discovery learning","Learners find principles for themselves (Bruner).","التعلم بالاكتشاف"]],"intro":[],"ex":[]},{"h":["First language acquisition and views of language","اكتساب اللغة الأولى"],"pts":[["Child stages: cooing/babbling → one word → two-word **pivot grammar** → **telegraphic speech** (no function words).","مراحل الطفل"],["Children imitate deep rather than surface structure ('Nobody don't like me').","تقليد البنية العميقة"],["Views of language: **structural** (system), **functional** (functions), **interactional** (relationships).","بنيوية / وظيفية / تفاعلية"],["Others: Gestalt (whole > parts), humanism ([[Maslow|en.maslow]], [[Rogers|en.rogers]]), social learning (Bandura).","نظريات أخرى"]],"t":[["Telegraphic speech","Speech using content words without function words ('Daddy go car').","كلام برقي"],["Pivot grammar","Early two-word combinations ('allgone shoe').","قواعد المحور"],["Structural view of language","Language as a system of structurally related elements for transmitting meaning.","النظرة البنيوية"],["Gestalt","The whole is greater than the sum of its parts.","الجشطالت"]],"intro":[],"ex":[]},{"h":["Theories of writing","نظريات الكتابة"],"pts":[["**Ecological theory** (Cooper): writing is shaped by **place, community and local context**.","البيئية ← المكان والسياق المحلي"],["Cognitive theory: the writer's mental processes (planning, translating, reviewing); sociocultural: collaboration and peer feedback.","المعرفية / الاجتماعية الثقافية"]],"t":[["Ecological theory of writing","A view that writing is shaped by the writer's place, community and local context.","النظرية البيئية في الكتابة"]],"intro":[],"ex":[]},{"h":["Generative grammar and innatism","القواعد التوليدية والفطرية"],"pts":[["Chomsky's **generative grammar** (rules that produce infinite sentences) is studied under **innatism (nativism)**.","التوليدية تابعة للفطرية"]],"t":[["Generative grammar","Chomsky's model of the finite set of rules that can generate all grammatical sentences of a language.","القواعد التوليدية"]],"intro":[],"ex":[]},{"h":["Piaget's four stages and peer scaffolding","مراحل بياجيه الأربع والدعم بين الأقران"],"pts":[["**Social constructivism**: a more capable peer scaffolds a weaker one within the ZPD — the basis for mixed-ability pairing.","زميل أقدر يدعم الأضعف"]],"t":[["Concrete operational stage","Piaget's stage (about 7–11) when children reason logically about concrete situations.","المرحلة الإجرائية المحسوسة"],["Formal operational stage","Piaget's stage (from about 11) when abstract and hypothetical reasoning develops.","المرحلة الإجرائية الشكلية"],["Social constructivism","The view that knowledge is built through social interaction with more capable others.","البنائية الاجتماعية"]],"intro":[],"ex":[],"map":{"type":"fan","title":["Piaget's Four Stages","⁧مراحل بياجيه الأربع⁩"],"groups":[{"n":"Sensorimotor · 0–2","ar":"⁧الحس الحركي: ثبات الأشياء⁩","d":"en.piaget"},{"n":"Preoperational · 2–7","ar":"⁧ما قبل العمليات: رموز وتخيّل وحفظ⁩","d":"en.piaget"},{"n":"Concrete operational · 7–11","ar":"⁧العمليات المحسوسة: منطق مع الأشياء والأحداث الملموسة⁩","d":"en.piaget"},{"n":"Formal operational · 11+","ar":"⁧العمليات المجردة: استدلال مجرد و«ماذا لو»⁩","d":"en.piaget"}]}}],"trap":[["Changing existing structures = accommodation; fitting in without change = assimilation.","مواءمة / تمثّل"],["The Critical Period Hypothesis supports nativism, not behaviorism.","الفطرية"],["Blank slate = behaviorism.","السلوكية"]],"vid":[["IhcgYgx7aAA","en","Piaget's Theory of Cognitive Development","Sprouts",7],["EYbCE1udazw","en","Piaget's Schema: Accommodation and Assimilation","Sprouts",6],["8I2hrSRbmHE","en","Vygotsky's Theory of Cognitive Development","Sprouts",5],["2e4GsZFgKQo","en","Behaviorism, Cognitivism, Constructivism","ETH Zurich",9]],"map":{"title":["Learning Theories","⁧نظريات التعلم⁩"],"groups":[{"n":"Behaviorism","ar":"⁧السلوكية⁩","idea":"⁧التعلم عادة تتكوّن بالمثير والاستجابة والتعزيز⁩","items":[{"n":"Classical","who":"Pavlov","ar":"⁧الاشتراط الكلاسيكي⁩","kw":["classical conditioning"],"d":"en.pavlov"},{"n":"Operant","who":"Skinner","ar":"⁧التعزيز بعد الاستجابة⁩","kw":["operant conditioning","reinforcement"],"d":"en.skinner"}],"trap":"⁧ترتبط بالطريقة السمعية الشفهية (ALM): تكرار وتقليد وتجنّب الخطأ⁩"},{"n":"Nativism","ar":"⁧الفطرية⁩","idea":"⁧الطفل يولد بقدرة لغوية فطرية⁩","items":[{"n":"LAD · UG","who":"Chomsky","ar":"⁧جهاز الاكتساب والقواعد الكلية⁩","kw":["LAD","Universal Grammar"],"d":"en.chomsky"},{"n":"Critical period","who":"Lenneberg","ar":"⁧الاكتساب مرتبط بالعمر⁩","kw":["Critical Period Hypothesis"],"d":"en.lenneberg"}],"trap":"⁧تشومسكي هو من انتقد سكنر (1959)، لا العكس⁩"},{"n":"Cognitivism","ar":"⁧المعرفية⁩","idea":"⁧المتعلم يعالج المعلومات ويبني معنى⁩","items":[{"n":"Schemas","who":"Piaget","ar":"⁧تمثّل ومواءمة⁩","kw":["assimilation","accommodation"],"d":"en.piaget"},{"n":"Meaningful","who":"Ausubel","ar":"⁧ربط الجديد بالمعروف⁩","kw":["meaningful learning","advance organizer"],"d":"en.ausubel"}],"trap":"⁧التعلم الآلي (rote) عكس التعلم ذي المعنى عند أوزوبل⁩"},{"n":"Social Constructivism","short":"Constructivism","ar":"⁧البنائية الاجتماعية⁩","idea":"⁧المعرفة تُبنى بالتفاعل مع الآخرين⁩","items":[{"n":"ZPD","who":"Vygotsky","ar":"⁧منطقة النمو القريبة⁩","kw":["ZPD","scaffolding","MKO"],"d":"en.zpd"},{"n":"Discovery","who":"Bruner","ar":"⁧الاكتشاف والمنهج الحلزوني⁩","kw":["discovery learning","spiral curriculum"],"d":"en.bruner"}],"trap":"⁧ZPD هي ما يستطيعه المتعلم بمساعدة، لا ما يفعله وحده⁩"},{"n":"Humanism","ar":"⁧الإنسانية⁩","idea":"⁧مشاعر المتعلم وحاجاته قبل المعلومة⁩","items":[{"n":"Needs","who":"Maslow","ar":"⁧هرم الحاجات⁩","kw":["hierarchy of needs"],"d":"en.maslow"},{"n":"Facilitator","who":"Rogers","ar":"⁧التعلم المتمركز حول المتعلم⁩","kw":["learner-centered","facilitator"],"d":"en.rogers"}],"trap":"⁧طرق مثل CLL والإيحائية (Suggestopedia) تُصنَّف طرقاً إنسانية⁩"}]},"n":15},{"id":"L16","d":"T","std":"6.9.8","en":"Second Language Acquisition Theories","ar":"نظريات اكتساب اللغة الثانية","goal":["Know Krashen's five hypotheses precisely, later SLA theories and the components of communicative competence.","فرضيات كراشن والكفاية التواصلية"],"sec":[{"h":["Krashen's Monitor Model","فرضيات كراشن الخمس"],"pts":[["[[Krashen|en.sla-krashen]]'s **Monitor Model**: five linked hypotheses; fluency comes from subconscious **acquisition**, not learned rules.","الطلاقة من الاكتساب لا من القواعد"],["Conscious error correction while speaking = the [[Monitor|en.sla-monitor]]; over-users speak hesitantly.","المراقب: محرر واعٍ"]],"t":[["Acquisition–Learning Hypothesis","Distinguishes subconscious acquisition from conscious learning.","الاكتساب والتعلم"],["Monitor Hypothesis","Learned knowledge edits output when there is time, focus on form and knowledge of the rule.","المراقب"],["Natural Order Hypothesis","Structures are acquired in a predictable sequence.","الترتيب الطبيعي"],["Input Hypothesis (i+1)","Acquisition results from comprehensible input slightly above current level.","المدخل المفهوم"],["Affective Filter Hypothesis","Emotional factors can block input from being acquired.","المرشح الوجداني"],["Comprehensible input","Input learners can understand, with a little beyond their level.","مدخل مفهوم"]],"intro":[],"ex":[],"map":{"type":"fan","title":["Krashen's Five Hypotheses","⁧فرضيات كراشن الخمس⁩"],"groups":[{"n":"Acquisition–Learning","ar":"⁧اكتساب لا واعٍ مثل الطفل / تعلّم واعٍ للقواعد⁩","items":[{"n":"subconscious"},{"n":"conscious, deliberate"}],"d":"en.sla-krashen"},{"n":"Monitor","ar":"⁧المعرفة المتعلَّمة محرر يصحح الكلام عند توفر الوقت والتركيز ومعرفة القاعدة⁩","items":[{"n":"conscious error correction"}],"d":"en.sla-monitor"},{"n":"Natural Order","ar":"⁧التراكيب تُكتسب بترتيب متوقع⁩","items":[{"n":"predictable order"}],"d":"en.sla-order"},{"n":"Input (i+1)","ar":"⁧مدخل مفهوم فوق المستوى بقليل؛ i هي الكفاية الحالية⁩","items":[{"n":"comprehensible input"},{"n":"i = competence"}],"d":"en.sla-input"},{"n":"Affective Filter","ar":"⁧القلق والخجل وضعف الدافعية ترفعه، والثقة تخفضه⁩","items":[{"n":"anxiety raises it"}],"d":"en.sla-filter"}]}},{"h":["Later SLA theories","نظريات بعد كراشن"],"pts":[["[[**Interaction Hypothesis**|en.sla-interaction]] (Long): negotiation of meaning makes input comprehensible.","التفاعل: التفاوض على المعنى"],["**Output Hypothesis** (Swain): producing language reveals gaps — noticed most when learners **talk to others**.","المخرج يكشف الفجوة"],["**Noticing** (Schmidt): input must be noticed to become intake.","الملاحظة"],["**Acculturation** ([[Schumann|en.sla-schumann]]): social and psychological distance from the target group.","التثاقف والمسافة"],["**Syntactic bootstrapping**: inferring a word's meaning from its position and sentence structure.","الإقلاع النحوي"]],"t":[["Interaction Hypothesis","Long: negotiation of meaning in interaction promotes acquisition.","فرضية التفاعل"],["Output Hypothesis","Swain: producing language pushes learners to notice gaps.","فرضية المخرج"],["Noticing Hypothesis","Schmidt: learners must consciously notice input features.","فرضية الملاحظة"],["Acculturation Model","Schumann: social and psychological distance affects acquisition.","نموذج التثاقف"],["Automaticity","Performing a skill without conscious effort.","الآلية"],["Syntactic bootstrapping","Using syntax to infer word meaning.","الإقلاع النحوي"]],"intro":[],"ex":[]},{"h":["Stages and L1 vs L2","المراحل والفرق بين الاكتسابين"],"pts":[["Early L2 learners show **limited production** (silent period).","إنتاج محدود"],["L1 and L2 acquisition are alike: both occur through **comprehensible input**.","المدخل المفهوم"],["L1 is instinctive, rapid and complete; adult L2 learners usually **do not reach native-like grammatical competence**.","الكبير نادراً يصل للأصلي"],["Cummins: [[BICS|en.sla-bics]] (≈2 years) vs CALP (5–7 years).","BICS / CALP"],["Knows the rule but says 'He run fast' → [[**has competence but lacks performance**|en.sla-compperf]]; slips are **performance** errors.","كفاية / أداء"]],"t":[["Silent period","An early stage with little or no L2 production.","فترة الصمت"],["BICS","Basic Interpersonal Communicative Skills.","مهارات التواصل الأساسية"],["CALP","Cognitive Academic Language Proficiency.","الكفاءة الأكاديمية"],["Performance error","A slip in use despite knowing the rule.","خطأ أداء"],["Metalinguistic awareness","Awareness of language as an object one can think about.","الوعي بما وراء اللغة"]],"intro":[],"ex":[]},{"h":["Communicative competence","الكفاية التواصلية"],"pts":[["[[**Dell Hymes**|en.sla-cc]] coined **communicative** competence: knowing what to say and how to say it appropriately.","هايمز: المناسبة للموقف"],["Canale & Swain: grammatical, sociolinguistic, discourse and strategic competence (**discourse** added by Canale, 1983).","المكونات الأربعة"],["Cohesive, coherent text (intersentential links) = **discourse**; 'an animal that lives in water' for 'fish' = **strategic**.","خطابية / استراتيجية"],["Understanding the function of a spoken utterance = **pragmatic** competence.","تداولية"]],"t":[["Communicative competence","Knowing how to use language appropriately in context (Hymes).","الكفاية التواصلية"],["Grammatical competence","Knowledge of vocabulary, grammar and pronunciation rules.","قواعدية"],["Sociolinguistic competence","Using language appropriately for the social context.","اجتماعية لغوية"],["Discourse competence","Producing and understanding cohesive, coherent texts.","خطابية"],["Strategic competence","Using strategies to compensate for gaps and repair breakdowns.","استراتيجية"],["Pragmatic competence","Understanding the function and intention of utterances.","تداولية"],["Circumlocution","Describing a word you don't know with other words.","الشرح بكلمات أخرى"]],"intro":[],"ex":[]},{"h":["Stages of second language acquisition","مراحل اكتساب اللغة الثانية"],"pts":[["Krashen & Terrell's [[**Natural Approach**|en.l16-stages]]: 3 early stages; teacher materials extend them to 5.","ثلاث مراحل في الأصل وتُمدّ إلى خمس"],["**Preproduction** (silent period): understands, answers by pointing or nodding → **TPR**, pictures, yes/no questions.","يفهم ولا يتكلم: TPR ونعم/لا"],["**Early production**: one- or two-word answers, chunks → **either/or** and who/what/where questions.","كلمة أو كلمتان: أسئلة اختيار"],["**Speech emergence**: simple sentences, frequent errors → how/why questions, short stories, dialogues.","جمل بسيطة: لماذا وكيف"],["**Intermediate fluency**: complex sentences, opinions → 'What would happen if…?'; **advanced fluency** ≈ Cummins' CALP.","جمل مركبة وآراء ثم طلاقة أكاديمية"]],"t":[["Preproduction stage","The first SLA stage: comprehension with little or no speech.","مرحلة ما قبل الإنتاج"],["Early production stage","Learners produce one- or two-word responses and memorised phrases.","الإنتاج المبكر"],["Speech emergence stage","Learners produce simple sentences and short exchanges.","ظهور الكلام"],["Intermediate fluency stage","Learners use more complex sentences and express opinions with fewer errors.","الطلاقة المتوسطة"],["Advanced fluency stage","Learners approach native-like proficiency in social and academic language.","الطلاقة المتقدمة"]],"ex":[],"intro":[]},{"h":["Learning strategies: Oxford (1990) and the good language learner","استراتيجيات التعلم عند أكسفورد والمتعلم الجيد"],"pts":[["[[Oxford|en.sla-oxford]]'s questionnaire is the **SILL**; O'Malley & Chamot use three groups: metacognitive, cognitive, social/affective.","استبانة SILL"],["[[**Good language learner**|en.l16-gll]] (Rubin, 1975): guesses willingly, wants to communicate, is not inhibited by mistakes.","صفات المتعلم الجيد"]],"t":[["Direct strategies","Oxford: memory, cognitive and compensation strategies that work directly with the language.","استراتيجيات مباشرة"],["Indirect strategies","Oxford: metacognitive, affective and social strategies that support learning.","استراتيجيات غير مباشرة"],["Memory strategies","Techniques for storing and retrieving new information (grouping, imagery, rhymes).","استراتيجيات الذاكرة"],["Cognitive strategies","Mental operations on the language: practising, analysing, summarising.","استراتيجيات معرفية"],["Compensation strategies","Strategies to overcome gaps in knowledge, such as guessing or using synonyms.","استراتيجيات تعويضية"],["Metacognitive strategies","Planning, monitoring and evaluating one's own learning.","استراتيجيات ما وراء المعرفة"],["Affective strategies","Managing emotions, anxiety and motivation.","استراتيجيات وجدانية"],["Social strategies","Learning with and through others: asking questions, cooperating.","استراتيجيات اجتماعية"],["SILL","Strategy Inventory for Language Learning: Oxford's strategy questionnaire.","استبانة أكسفورد"]],"intro":[],"ex":[],"map":{"type":"fan","title":["Oxford (1990): learning strategies","⁧استراتيجيات التعلم عند أكسفورد⁩"],"groups":[{"n":"Direct","ar":"⁧تتعامل مع اللغة نفسها: ذاكرة (تصنيف وصور)، معرفية (تدريب وتلخيص)، تعويضية (تخمين وإيماء وشرح بكلمات أخرى)⁩","items":[{"n":"memory"},{"n":"cognitive"},{"n":"compensation"}],"d":"en.sla-oxford"},{"n":"Indirect","ar":"⁧تدير التعلم: ما وراء معرفية (تخطيط وتقويم ذاتي)، وجدانية (خفض القلق)، اجتماعية (طلب التوضيح)⁩","items":[{"n":"metacognitive"},{"n":"affective"},{"n":"social"}],"d":"en.sla-oxford"}]}},{"h":["More SLA perspectives","منظورات أخرى في اكتساب اللغة الثانية"],"pts":[["[[**Skill Acquisition Theory**|en.sla-skill]] (DeKeyser): **declarative** → **procedural** knowledge → automaticity through practice.","من معرفة القاعدة إلى استعمالها تلقائياً"],["**Investment** ([[Norton|en.sla-norton]]): learners invest when a language promises symbolic and material resources; tied to **identity**.","الاستثمار والهوية"],["[[**Usage-based**|en.sla-usage]] views: patterns are extracted gradually from frequent exposure to real use.","التعلم من تكرار الاستعمال"]],"t":[["Skill Acquisition Theory","SLA as a skill moving from declarative to procedural knowledge and automaticity (DeKeyser).","نظرية اكتساب المهارة"],["Declarative knowledge","Knowing about something: facts and rules that can be stated.","معرفة تقريرية"],["Procedural knowledge","Knowing how to do something: the ability to use knowledge in performance.","معرفة إجرائية"],["Investment (Norton)","A learner's commitment to learning a language, tied to identity and expected returns.","الاستثمار"]],"intro":[],"ex":[]},{"h":["Self-repair","تصحيح المتعلم لنفسه"],"pts":[["Correcting your own slip while speaking ('I goed… went') shows **metalinguistic awareness**; the slip is a performance mistake.","التصحيح الذاتي = وعي ما وراء لغوي"]],"intro":[],"ex":[]}],"trap":[["Conscious error correction while speaking = Monitor Hypothesis.","المراقب"],["Anxiety raises the affective filter.","يرتفع"],["The Input Hypothesis focuses on acquisition, not teaching.","الاكتساب"]],"vid":[["NiTsduRreug","en","Stephen Krashen on Language Acquisition","Mark Rounds",15],["8qjLXjCqNyA","en","Krashen's Theory of SLA","Teacher Rafa",8],["45W5ucCLYqM","en","Unpacking terms: Communicative Competence","Unpacking language pedagogy",9]],"map":{"type":"cards","title":["SLA Theories","⁧نظريات اكتساب اللغة الثانية⁩"],"groups":[{"n":"Krashen","ar":"⁧الاكتساب بالمدخل المفهوم⁩","items":[{"n":"Monitor Model","who":"Krashen","ar":"⁧الطلاقة من الاكتساب لا من القواعد⁩","d":"en.sla-krashen"},{"n":"Natural Approach","who":"Krashen & Terrell","ar":"⁧الفهم أولاً ثم يظهر الكلام تدريجياً⁩","d":"en.l16-stages"}],"trap":"⁧فرضية المدخل تخص **الاكتساب** لا التدريس، و i هي الكفاية الحالية⁩"},{"n":"Interaction","ar":"⁧التفاعل والإنتاج⁩","items":[{"n":"Interaction","who":"Long","ar":"⁧التفاوض على المعنى⁩","d":"en.sla-interaction"},{"n":"Output","who":"Swain","ar":"⁧الإنتاج يكشف الفجوة⁩","d":"en.sla-interaction"},{"n":"Noticing","who":"Schmidt","ar":"⁧لا مأخوذ بلا ملاحظة⁩","d":"en.sla-interaction"}]},{"n":"Cognitive","ar":"⁧اللغة مهارة وكفاءة⁩","items":[{"n":"Skill Acquisition","who":"DeKeyser","ar":"⁧تقريرية ← إجرائية ← آلية⁩","d":"en.sla-skill"},{"n":"Usage-based","who":"N. Ellis · Tomasello","ar":"⁧الأنماط من تكرار الاستعمال⁩","d":"en.sla-usage"},{"n":"BICS / CALP","who":"Cummins","ar":"⁧سنتان للتواصل، 5–7 للأكاديمية⁩","d":"en.sla-bics"}]},{"n":"Social","ar":"⁧المجتمع والهوية⁩","items":[{"n":"Acculturation","who":"Schumann","ar":"⁧المسافة الاجتماعية والنفسية⁩","d":"en.sla-schumann"},{"n":"Investment","who":"Norton","ar":"⁧الاستثمار والهوية⁩","d":"en.sla-norton"}]},{"n":"Competence","ar":"⁧ماذا يكتسب المتعلم؟⁩","items":[{"n":"Communicative competence","who":"Hymes","ar":"⁧صاحب المصطلح⁩","d":"en.sla-cc"},{"n":"Four components","who":"Canale & Swain","ar":"⁧قواعدية، اجتماعية لغوية، خطابية، استراتيجية⁩","d":"en.sla-cc"},{"n":"Pragmatic competence","who":"Bachman","ar":"⁧فهم وظيفة العبارة وقصد المتكلم⁩","d":"en.sla-cc"}]}]},"n":16},{"id":"L17","d":"T","std":"6.9.9","en":"Learner Language, Individual Differences & TESOL","ar":"لغة المتعلم والفروق وتعليم الإنجليزية","goal":["Distinguish positive/negative transfer, interlingual/intralingual errors, interlanguage and fossilization; know TESOL terms.","النقل والأخطاء واللغة البينية"],"sec":[{"h":["Transfer and contrastive analysis","النقل والتحليل التقابلي"],"pts":[["[[**Contrastive Analysis**|en.l17-ca]] (Lado, 1957) compares L1 with the target language to predict difficulties; linked to **behaviorism**.","مقارنة اللغتين للتنبؤ بالصعوبة"],["Applying L1 knowledge to L2 = **transfer**; similar structures give correct output = **positive transfer**.","نقل إيجابي"],["**Negative transfer** = the negative influence of L1 on L2: 'five years before', 'pen blue', 'the man whom I met him'.","نقل سلبي","o"],["Teachers should analyze [[**errors**|en.spk.errors]] to find inappropriate L1 transfer, and expect learners to use their L1.","حلّل الأخطاء"]],"t":[["Contrastive Analysis","Comparing L1 and L2 to predict learning difficulties (Lado).","التحليل التقابلي"],["Transfer","Applying L1 knowledge to the L2.","النقل"],["Positive transfer","L1–L2 similarity leads to correct L2 production.","نقل إيجابي"],["Negative transfer (interference)","L1 patterns cause errors in L2.","نقل سلبي"]],"intro":[],"ex":[]},{"h":["Error analysis and interlanguage","تحليل الأخطاء واللغة البينية"],"pts":[["[[Error Analysis|en.l17-ea]] (Corder): **interlingual** errors come from L1; **intralingual** errors come from the target language.","من اللغة الأم / من اللغة الهدف"],["Errors such as 'rided' and 'goed' **mean the student is learning** (developmental pattern).","أخطاء النمو علامة تعلم","o"],["**Overgeneralization**: 'writed', 'tooths', 'childs', 'swimmed'.","تعميم زائد"],["The learner's developing system = [[**interlanguage**|en.l17-il]]; incorrect forms that become permanent = **fossilization**.","لغة بينية / تحجّر"],["Decrease in proficiency from disuse or L2 influence = **attrition**.","تآكل"]],"t":[["Error analysis","Studying learners' errors as evidence of learning (Corder).","تحليل الأخطاء"],["Interlingual error","An error caused by L1 interference.","خطأ من اللغة الأم"],["Intralingual (developmental) error","An error caused by the target language itself.","خطأ داخل اللغة الهدف"],["Overgeneralization","Applying a rule too widely ('goed', 'tooths').","تعميم زائد"],["Interlanguage","The learner's evolving language system between L1 and L2 (Selinker).","لغة بينية"],["Fossilization","Incorrect forms that become permanent and resist correction.","تحجّر"],["Language attrition","Loss of language proficiency over time.","تآكل اللغة"]],"intro":[],"ex":[]},{"h":["Individual differences","الفروق الفردية"],"pts":[["Age, personality, experience = **individual** factors; anxiety, self-restriction = [[**affective**|en.lrn.affect]] factors.","فردية / وجدانية"],["**Technological** factors are NOT a category of SLA factors.","التقنية ليست منها"],["Fluency, accuracy and complexity = **cognitive** factors.","معرفية"]],"t":[["Aptitude","A natural ability to learn languages (Carroll's MLAT).","استعداد"],["Learning strategies (Oxford)","Memory, cognitive, compensation, metacognitive, affective, social.","استراتيجيات التعلم"],["Affective factors","Emotional variables such as anxiety, self-esteem and inhibition.","عوامل وجدانية"]],"intro":[],"ex":[]},{"h":["Bilingualism and TESOL terms","الثنائية والمصطلحات" -speakerism"},{"n":"shared L1"}],"d":"en.l17-postmethod"}]},"intro":[],"ex":[]},{"h":["Reflective teaching and action research","التدريس التأملي والبحث الإجرائي"],"pts":[["[[**Reflective teaching**|en.l17-reflect]]: collect evidence about your own teaching (journals, recordings, peer observation) to improve it.","التأمل في الممارسة لتحسينها"],["Schön: **reflection-in-action** = adjusting during the lesson; reflection-on-action = thinking back afterwards.","التأمل أثناء الفعل وبعده"],["**Action research**: small-scale study of a problem in **their own classroom**; cycle plan → act → observe → reflect (Kemmis & McTaggart).","دورة: خطط، نفّذ، لاحظ، تأمّل"]],"t":[["Reflective teaching","Systematically examining one's own teaching to improve it.","التدريس التأملي"],["Reflection-in-action / on-action","Schön: thinking during an event vs thinking about it afterwards.","التأمل أثناء / بعد"],["Action research","Cyclical, classroom-based research by teachers to solve a local problem.","البحث الإجرائي"],["Peer observation","Teachers observing each other's lessons to give feedback and learn.","ملاحظة الزملاء"]],"intro":[],"ex":[]},{"h":["TESOL and related disciplines","علاقة تعليم الإنجليزية بالعلوم الأخرى"],"pts":[["[[**Psycholinguistics**|en.l17-disc]] = language in the mind; **sociolinguistics** = language in society; neurolinguistics = language and the brain.","علم اللغة النفسي والاجتماعي والعصبي"],["Educational psychology → motivation, assessment; anthropology → culture; **corpus linguistics** → word lists ([[corpora|en.voc.corpus]]); computer science → CALL.","علوم تغذي التدريس"],["[[**CLIL**|en.meth.cbi]] teaches content through English: **hard (strong) CLIL** = a subject in English; soft (weak) CLIL = topic-based English course.","التدريس عبر المحتوى"],["**Cross-curricular links** (science texts, maths word problems) give language a real purpose and build CALP.","روابط بين المواد"]],"t":[["Psycholinguistics","The study of the mental processes involved in language use an ":"⁧تشابه يعطي إنتاجاً صحيحاً⁩","kw":["positive transfer"],"d":"en.l17-ca"},{"n":"Negative","who":"Lado","ar":"⁧اختلاف يسبب تداخلاً⁩","kw":["interference","pen blue"],"d":"en.l17-ca"}],"trap":"⁧التحليل التقابلي مرتبط **بالسلوكية** (Lado)⁩"},{"n":"Error Analysis","ar":"⁧تحليل الأخطاء⁩","idea":"⁧الخطأ دليل تعلم لا فشل (Corder)⁩","items":[{"n":"Interlingual","who":"Corder","ar":"⁧سببه اللغة الأم⁩","kw":["five years before"],"d":"en.l17-ea"},{"n":"Intralingual","who":"Corder","ar":"⁧سببه اللغة الهدف⁩","kw":["goed","tooths","childs"],"d":"en.l17-ea"}],"trap":"⁧goed و tooths تعميم زائد، لا نقل من العربية⁩"},{"n":"Interlanguage","ar":"⁧اللغة البينية⁩","idea":"⁧نظام المتعلم المتطور بين اللغتين (Selinker)⁩","items":[{"n":"Interlanguage","who":"Selinker","ar":"⁧نظام له قواعده⁩","d":"en.l17-il"},{"n":"Fossilization","who":"Selinker","ar":"⁧خطأ يثبت ويقاوم التصحيح⁩","kw":["fossilized errors"],"d":"en.l17-il"}],"trap":"⁧النقل السلبي المتكرر بلا ملاحظة ولا تغذية راجعة قد ينتهي بالتحجر⁩"},{"n":"Learner Behaviour","short":"Behaviour","ar":"⁧سلوك المتعلم⁩","idea":"⁧ما يفعله المتعلم بين لغتيه⁩","items":[{"n":"Avoidance","who":"Schachter","ar":"⁧تجنب الصعب خوفاً من الخطأ⁩","kw":["avoidance"],"d":"en.l17-il"},{"n":"Code-switch","ar":"⁧التناوب بين اللغتين⁩","kw":["code-switching"],"d":"en.l17-bilingual"},{"n":"Attrition","ar":"⁧تآكل لغة بقلة الاستعمال⁩","kw":["language attrition"],"d":"en.l17-il"}],"trap":"⁧التجنب لا يظهر خطأً، بل غياباً للتركيب⁩"}]},"n":17},{"id":"L18","d":"L","std":"6.9.10","en":"Language as a System, History & Varieties","ar":"اللغة كنظام وتاريخها وتنوعاتها","goal":["Know design features and functions of language, the history and sources of English, and language varieties.","خصائص اللغة وتاريخ الإنجليزية والتنوعات"],"sec":[{"h":["What is language? What is linguistics?","اللغة واللسانيات"],"pts":[["Language = an **arbitrary** system of vocal symbols for communication; its scientific study = **linguistics**.","نظام رموز اعتباطية / اللسانيات"],["'Don't split infinitives' = a **prescriptive** rule; descriptive grammar describes actual use.","معياري / وصفي"],["Least accurate description: 'language is only verbal' — it can also be written or signed.","ليست لفظية فقط"]],"t":[["Linguistics","The scientific study of language and its structure.","اللسانيات"],["Prescriptive grammar","Rules for how people should use language.","قواعد معيارية"],["Descriptive grammar","A description of how people actually use language.","قواعد وصفية"],["Langue / Parole","Saussure: the language system / actual speech.","اللسان / الكلام"],["Applied linguistics","Linguistics applied to real problems such as language teaching.","لسانيات تطبيقية"],["Historical linguistics","The study of how language develops over time.","علم اللغة التاريخي"],["Neurolinguistics","The study of the relationship between language and the brain.","علم اللغة العصبي"]],"intro":[],"ex":[]},{"h":["Design features (Hockett)","خصائص اللغة البشرية"],"pts":[["The relationship between form and meaning is **arbitrary** ([[Hockett|en.l18-hockett]]).","اعتباطية","o"],["Referring to things not present = **displacement**.","الإزاحة","o"],["Endless new messages = **creativity / productivity**; meaningless sounds → meaningful units = **duality**.","الإبداعية / ازدواجية البنية"],["Main problem of origin-of-language theories: they **lack scientific evidence**.","بلا دليل علمي","o"],["Variation is an **inherent part of language**; all languages change (**mutability**).","التنوع أصيل والتغيّر"]],"t":[["Arbitrariness","No natural connection between a word's form and its meaning.","اعتباطية"],["Displacement","The ability to refer to things not present in time or space.","الإزاحة"],["Productivity (creativity)","The ability to produce and understand infinite new utterances.","الإبداعية"],["Duality of patterning","Language works at two levels: sounds and meaningful units.","ازدواجية البنية"],["Cultural transmission","Language is learned from the community, not inherited.","النقل الثقافي"],["Discreteness","Language is made of distinct units.","التمايز"],["Mutability","The grammars of all languages change over time.","قابلية التغيّر"]],"intro":[],"ex":[]},{"h":["Functions of language","وظائف اللغة"],"pts":[["Passing on information = [[**transactional**|en.l18-functions]] function; expressing social relations = **interactional**.","تبادلية / تفاعلية","o"],["'Nice weather, isn't it?' = phatic communication; functionalists: language developed to **communicate**.","اتصالية"]],"t":[["Transactional function","Language used to convey information/content.","تبادلية"],["Interactional function","Language used to establish and maintain social relationships.","تفاعلية"],["Phatic communication","Language used for social contact rather than information.","اتصالية"],["Utterance","A spoken word or sentence; a unit of verbal communication.","ملفوظ"]],"intro":[],"ex":[]},{"h":["History and sources of English","تاريخ الإنجليزية ومصادر كلماتها"],"pts":[["English is **Germanic** (Indo-European); Spanish, Portuguese, Italian = Romance; Arabic = Semitic.","جرمانية"],["[[Old English|en.l18-history]] → Middle English (after the **Norman Conquest 1066**) → Early Modern (Shakespeare, printing) → Modern.","مراحل الإنجليزية"],["café → French; scientific terms → **Greek and Latin**; alcohol, algebra, sugar → **Arabic** (borrowing).","مصادر الكلمات"],["Everyday words (the, be, have) are **Germanic**; most dictionary words come from Latin/French.","الأكثر استخداماً جرمانية"]],"t":[["Indo-European","The language family that includes the Germanic and Romance branches.","هندو-أوروبية"],["Germanic","The branch of Indo-European that includes English, German and Dutch.","جرمانية"],["Romance languages","Languages descended from Latin: Spanish, Portuguese, Italian, French.","رومانسية"],["Norman Conquest (1066)","Event that brought many French words into English.","الغزو النورماندي"],["Great Vowel Shift","A major change in English long-vowel pronunciation (1400–1700).","التحول الصوتي الكبير"]],"intro":[],"ex":[]},{"h":["Varieties of language","تنوعات اللغة"],"pts":[["[[**Dialect**|en.l18-varieties]] = grammar, vocabulary and pronunciation; **accent** = pronunciation only.","لهجة / لكنة"],["Simplified contact language with no native speakers = **pidgin**; a pidgin that became a first language = **creole**.","هجين / كريول"],["ELF focuses on **intelligibility**; Saudi Arabia is in Kachru's **expanding circle**.","الوضوح / الدائرة المتسعة"],["A map line separating areas with different language features = **isogloss**.","خط تساوي الظاهرة"],["British vs American: colour/color (Americans write **-or**), petrol/gasoline, lift/elevator.","بريطاني / أمريكي"]],"t":[["Dialect","A variety differing in grammar, vocabulary and pronunciation.","لهجة"],["Accent","A variety differing only in pronunciation.","لكنة"],["Idiolect","An individual's personal way of speaking.","لغة الفرد"],["Register","Language variety according to situation and formality.","مستوى الخطاب"],["Pidgin","A simplified contact language with no native speakers.","هجين"],["Creole","A pidgin that has become the first language of a community.","كريول"],["Lingua franca","A common language used between speakers of different L1s.","لغة مشتركة"],["Isogloss","A boundary line on a map between areas with different language features.","خط تساوي الظاهرة"],["Kachru's three circles","Inner (UK, US), outer (India, Nigeria), expanding (Saudi Arabia, China).","دوائر كاتشرو"]],"intro":[],"ex":[]},{"h":["Theories of the origin of language (Yule)","نظريات أصل اللغة عند يول"],"pts":[["Each [[theory|en.l18-origins]] picks one possible source; none can be proven — there is **no direct physical evidence** of the earliest speech.","كلها بلا دليل مباشر"]],"t":[["Divine source","The theory that language was given to humans by God.","المصدر الإلهي"],["Bow-wow theory","Natural sound source: words began as imitations of natural sounds.","نظرية محاكاة الأصوات"],["Onomatopoeia","Words that imitate the sounds associated with what they refer to (buzz, spl hole relation (branch–tree).","جزء من كل"],["Homophones","Same sound, different spelling and meaning (see/sea).","متجانس صوتياً"],["Homographs","Same spelling, different meaning (lead/lead).","متجانس كتابياً"],["Homonyms","Same form, unrelated meanings (bank).","مشترك لفظي"],["Polysemy","One word with several related meanings.","تعدد المعنى"],["Metonymy","Using an associated word for a thing ('The White House said').","كناية"],["Collocation","Words that habitually co-occur (heavy rain).","تلازم لفظي"]],"intro":[],"ex":[]}],"trap":[],"vid":[["tg0_dFb1Z1c","ar","علم الدلالة (سيمانتك)","الدافورة",28],["XMey3ei7aRE","ar","التداولية (براغماتيك)","الدافورة",25],["6geQjY8b7sA","en","Semantics (Crash Course #5)","CrashCourse",11],["MPwpk-YgvjQ","en","Pragmatics (Crash Course #6)","CrashCourse",10],["e_3h0fB8Rhg","en","Lexical Semantics","Evan Ashworth",13]],"n":22,"locked":true}];
window.QB = [["L01","h","Which of the following is a TOP-DOWN listening technique?",["Listening for the main idea","Recognizing individual words","Identifying word boundaries","Noticing grammatical endings"],"الفكرة الرئيسية تعتمد على الخلفية والسياق، وهذا من الأعلى. الباقي من الأسفل."],["L01","h","A listening activity in which students listen to a long audio passage for general understanding and pleasure is:",["Extensive listening","Intensive listening","Discriminative listening","Selective listening"],"الاستماع الموسّع: نص طويل للفهم العام والمتعة."],["L01","","The main aim of intensive listening activities is to:",["Develop bottom-up processing skills","Enjoy long stories","Practise turn-taking","Enable learners to listen to lengthy texts"],"الاستماع المكثف يركز على التفاصيل والشكل، فيطوّر المعالجة من الأسفل."],["L01","h","To improve students' listening comprehension, the input they receive should mainly be:",["Meaningful","Complex","General","Very fast"],"المدخل ذو المعنى والمفهوم هو أساس تحسين الاستماع."],["L01","","A learner keeps listening even though she does not understand some words, accepting the unclear parts. This strategy is called:",["Tolerance of ambiguity","Self-evaluation","Summarizing","Elaboration"],"قبول الغموض والاستمرار = تحمّل الغموض."],["L01","","The Cornell method is mainly a ______ technique.",["note-taking","previewing","pronunciation","skimming"],"طريقة كورنيل لتدوين الملاحظات."],["L01","","In the pre-listening stage, the teacher should mainly:",["Activate students' background knowledge","Ask detailed comprehension questions","Correct pronunciation errors","Assign a written summary"],"قبل الاستماع: تنشيط الخلفية وتحديد الهدف."],["L01","","When students listen to a recording for the first time, the teacher should usually ask them to listen for:",["The gist","Every single word","Spelling","Grammar errors"],"المرة الأولى للفكرة العامة، والثانية للتفاصيل."],["L01","m","A student listens to a long lecture and writes down only the main points on","Global correction"],"التصحيح الانتقائي."],["L02","","According to Corder, a mistake (unlike an error) is:",["A performance slip the learner can self-correct","A systematic gap in competence","Caused only by L1 interference","Impossible to correct"],"الزلّة سهو أداء يصححه الطالب إذا نُبّه."],["L02","m","Teaching students to generate an extended monologue such as a short talk is part of teaching:",["Speaking","Listening","Reading","Spelling"],"الحديث الفردي مهارة كلام."],["L02","m","Ship/sheep and pen/ben are examples of:",["Minimal pairs","Homographs","Collocations","Diphthongs"],"تختلف في صوت واحد = أزواج صغرى."],["L02","m","Physical-response activities in which learners follow commands such as 'Stand up' are known as:",["Imperative drills","Pair work","Conversational dialogues","Jigsaw reading"],"أوامر + حركة = تدريبات الأوامر."],["L02","m","L2 learners notice gaps in their language MOST clearly when they:",["Talk to others","Listen to music","Read a book","Watch TV"],"الإنتاج والتفاعل يكشفان الفجوة (فرضية المخرج)."],["L03","h","Reading a text quickly to get the main idea is called:",["Skimming","Scanning","Analyzing","Evaluating"],"الفكرة العامة = قراءة سريعة."],["L03","","Rewriting a sentence using different words while keeping the same meaning and similar length is:",["Paraphrasing","Summarizing","Outlining","Skimming"],"إعادة الصياغة."],["L03","","Which question best develops CRITICAL reading?",["Is the author's argument convincing? Why?","What is the name of the main character?","How many paragraphs are there?","What does the first word mean?"],"القراءة الناقدة تقيّم وتحكم."],["L03","m","Using what one already knows about a topic to understand a passage involves:",["Schema activation","Phonological processing","Syntactic parsing","Spelling"],"تنشيط المخطط الذهني."],["L03","m","The first stage in learning to read is:",["Decoding","Critical evaluation","Summarizing","Inferring"],"فك الترميز أول مرحلة."],["L03","m","Reading fluency instruction usually begins with:",["Direct instruction and modeling","Independent practice","Silent reading tests","Peer assessment"],"تبدأ الطلاقة بالتعليم المباشر والنمذجة."],["L03","m","K-W-L charts help students mainly to:",["Connect prior knowledge with new learning","Memorize spelling","Practise pronunciation","Translate texts"],"ماذا أعرف / ماذا أريد / ماذا تعلمت."],["L03","m","A student reads a passage about China only to find its population figure. The student is:",["Scanning","Skimming","Visualizing","Connecting"],"معلومة محددة = قراءة انتقائية."],["L04","h","'Odd one out' activities are typically used to teach:",["Vocabulary","Listening","Reading","Writing"],"الكلمة الشاذة نشاط مفردات."],["L04","","Words a learner can actively use in speaking and writing are:",["Productive vocabulary","Receptive vocabulary","Passive vocabulary","Recognition vocabulary"],"إنتاجية."],["L04","","'Make a decision' and 'heavy rain' are examples of:",["Collocations","Idioms","Homophones","Phrasal verbs"],"تلازم لفظي."],["L04","","According to Nation, knowing a word involves knowing its:",["Form, meaning and use","Spelling only","Translation only","Etymology only"],"الشكل والمعنى والاستخدام."],["L04","h","Which website is widely used to practise vocabulary with digital flashcards?",["Quizlet","Coursera","Grammarly","Zoom"],"Quizlet للبطاقات."],["L04","","The Lexical Approach (Michael Lewis) views language mainly as:",["Grammaticalized lexis made of chunks","A set of grammar rules","Habits formed by drills","A list of translations"],"المدخل المعجمي: اللغة كتل لغوية."],["L04","","Learning words incidentally means learning them:",["While focusing on the message, e.g. through reading","By memorizing lists","Through dictation","By translation tests"],"العرضي: أثناء التركيز على المعنى."],["L04","m","The BEST way to understand the culture of a language through vocabulary is by studying its:",["Idioms","Articles","Prepositions","Spelling rules"],"التعابير الاصطلاحية تعكس الثقافة."],["L04","m","Guessing the meaning of an unknown word from surrounding words is a strategy called:",["Guessing from context","Scanning","Back-chaining","Shadowing"],"التخمين من السياق."],["L04","m","Placing a word in the centre and linking related words around it is a:",["Semantic map","Timeline","Venn diagram","Cloze"],"خريطة دلالية."],["L05","h","Process-oriented writing places most emphasis on:",["The stages writers go through","The final product only","The time spent writing","Copying model texts"],"مدخل العمليات = المراحل."],["L05","h","Which order shows the recursive phases of the writing process?",["Pre-writing – drafting – revising","Drafting – pre-writing – revising","Revising – drafting – pre-writing","Pre-writing – revising – drafting"],"ما قبل الكتابة ← المسودة ← المراجعة."],["L05","h","Describing events in the order 'first, then, after that, finally' uses:",["Chronological order","Cause and effect order","Problem–solution order","Spatial order"],"ترتيب زمني."],["L05","","The sentence that restates the main idea at the end of a paragraph is the:",["Concluding sentence","Topic sentence","Supporting sentence","Hook"],"الجملة الختامية."],["L05","","Giving students a list of their common writing errors is most useful when they:",["Revise and rewrite","Brainstorm","Skim and scan","Choose a title"],"قائمة الأخطاء تفيد في المراجعة وإعادة الكتابة."],["L05","m","Writing feedback should be:",["Clear and simple","Long and complicated","Only a grade","Only negative"],"واضحة وبسيطة."],["L05","m","An essay's introduction should be:",["Engaging","Confusing","Irritating","Unrelated"],"جذابة."],["L05","m","The three main parts of an essay are:",["Introduction, body, conclusion","Title, list, references","Topic sentence, conclusion","Hook, thesis, title"],"مقدمة وعرض وخاتمة."],["L05","m","Metaphors and sensory details appear most often in ______ writing.",["descriptive","expository","technical","procedural"],"الوصفي."],["L05","m","In the product approach, students mainly:",["Imitate a model text","Write several drafts with peer feedback","Brainstorm freely","Keep journals"],"المنتج: تقليد نموذج."],["L05","m","Generating many ideas about a topic before writing is:",["Brainstorming","Proofreading","Publishing","Editing"],"العصف الذهني."],["L06","h","A teacher presents a grammar rule first and then gives examples. This is the ______ approach.",["deductive","inductive","communicative","discovery"],"القاعدة ثم الأمثلة = استنتاجي."],["L06","h","Harmer's three elements of a language lesson are:",["Engage, Study, Activate","Present, Practise, Produce","Test, Teach, Test","Plan, Do, Review"],"إطار ESA عند هارمر."],["L06","","In a Test–Teach–Test lesson, the first stage aims to:",["Find out what students already know","Present the rule explicitly","Assess final achievement","Review the previous unit"],"الاختبار الأول يكشف ما يعرفه الطلاب."],["L06","","'Did it happen in the past? Is it finished?' These questions are examples of:",["Concept-checking questions","Instruction-checking questions","Display questions about content","Rhetorical questions"],"أسئلة فحص المفهوم."],["L06","","Larsen-Freeman's three dimensions of grammar are:",["Form, meaning and use","Spelling, sound and meaning","Rules, drills and tests","Input, intake and output"],"الشكل والمعنى والاستخدام."],["L06","","Drawing learners' attention to grammar briefly during a communicative task is called:",["Focus on form","Focus on forms","Grammar-translation","Audio-lingual drilling"],"التركيز على الشكل داخل نشاط تواصلي."],["L06","m","A grammar lesson that focuses mainly on structures is focusing on:",["Forms","Pragmatics","Fluency","Discourse"],"تعليم القواعد يركز على الأشكال."],["L06","m","The instructional setting that focuses on the language itself, teaching vocabulary and grammar explicitly, is:",["Structure-based","Task-based","Content-based","Communicative"],"بيئة تركز على البنية."],["L06","m","A timeline is especially useful for teaching:",["Tenses","Phonemes","Collocations","Punctuation"],"الخط الزمني للأزمن essential for international intelligibility?",["The /θ/ and /ð/ sounds","Vowel length contrasts","Word-initial consonant clusters","Nuclear stress placement"],"/θ/ و/ð/ خارج النواة، أما طول الصائت والتجمعات والنبر النووي فمن النواة."],["L03","n","Which is NOT one of Day & Bamford's principles of extensive reading?",["Texts should be above learners' level to challenge them","Learners choose what they want to read","Learners read as much as possible","Reading is its own reward"],"القراءة الموسعة مادتها سهلة، لا أعلى من المستوى."],["L03","n","A young learner is taught the sounds of s, a, t and then blends /s/ /æ/ /t/ to read 'sat'. This is:",["synthetic phonics","analytic phonics","whole-language reading","skimming"],"صوت صوت ثم دمج = الصوتيات التركيبية."],["L03","n","To build reading fluency, students read the same short passage several times, aiming to read more quickly and smoothly each time. This technique is:",["repeated reading","intensive reading","reciprocal teaching","scanning"],"القراءة المتكررة تبني السرعة والدقة والتعبير."],["L04","n","According to Nation's four strands, a well-balanced vocabulary programme gives:",["roughly equal time to meaning-focused input, meaning-focused output, language-focused learning and fluency development","most time to memorizing word lists","most time to translation exercises","no time to deliberate learning"],"الخيوط الأربعة بنسب متقاربة."],["L04","n","Research suggests that for comfortable, unassisted reading a learner should know about ___ of the running words in a text.",["98%","50%","75%","80%"],"98% للفهم المريح (و95% حد أدنى)."],["L04","n","A student knows the meaning of 'commit' but not its collocations, pronunciation or derived forms. The student lacks vocabulary:",["depth","breadth","size","frequency"],"العمق: جودة معرفة الكلمة، والاتساع: عدد الكلمات."],["L04","n","A teacher shows learners 30 corpus lines containing 'make' and 'do' and asks them to discover the patterns. This approach is:",["data-driven learning","the Grammar-Translation Method","the Silent Way","Total Physical Response"],"اكتشاف الأنماط من بيانات المدونة = التعلم من البيانات."],["L04","n","Coxhead's Academic Word List contains:",["570 word families common across academic texts","the 2,000 most frequent English words","every word in a learner's dictionary","technical terms of one subject only"],"AWL = 570 عائلة أكاديمية؛ الألفان الأكثر تكراراً هي GSL."],["L05","n","A teacher underlines errors in an essay and writes codes such as 'sp' and 'vt', but does not write the correct forms. This is:",["indirect corrective feedback","direct corrective feedback","a recast","unfocused direct correction"],"الإشارة للخطأ دون إعطاء الصحيح = تصحيح غير مباشر."],["L05","n","Which researcher argued in 1996 that grammar correction in L2 writing classes is ineffective and should be abandoned?",["Truscott","Ferris","Swain","Halliday"],"تروسكوت 1996، وردّت عليه فيريس 1999."],["L05","n","This week a teacher corrects only article errors in students' essays and ignores other errors. This is:",["focused feedback","unfocused feedback","holistic scoring","peer review"],"تصحيح نوع واحد من الأخطاء = مركّز."],["L05","n","In the genre-based teaching-learning cycle, the teacher and class compose a text together on the board before students write alone. This stage is:",["joint construction","independent construction","deconstruction of a model","building the field"],"الكتابة المشتركة تسبق الكتابة المستقلة."],["L05","n","Combining knowledge of text types with the stages of drafting and revising is known as the:",["process-genre approach","product approach","controlled writing approach","Audio-Lingual approach"],"منهج Badger & White يجمع الجنس والعملية."],["L05","n","A short one-to-one meeting in which the teacher discusses a draft with a student is a:",["writing conference","peer review","portfolio","journal"],"المناقشة الفردية حول المسودة."],["L06","n","Which conditional sentence is correct?",["If it rains tomorrow, we will stay at home.","If it will rain tomorrow, we will stay at home.","If it rains tomorrow, we would stay at home.","If it would rain tomorrow, we stay at home."],"الشرط الأول: if + مضارع، will في الجواب؛ لا will بعد if."],["L06","n","'If I had a million riyals, I would buy a farm.' Which concept-checking question best checks the meaning?",["Do I have a million riyals now?","What is the past participle of 'buy'?","Is 'would' a modal verb?","How do you spell 'million'?"],"سؤال التحقق يفحص المعنى: الموقف خيالي (لا أملك المبلغ)."],["L06","n","'If she had studied, she would have passed.' What does this sentence tell us?",["She did not study and did not pass.","She studied and passed.","She will study and pass.","She studied but did not pass."],"الشرط الثالث ماضٍ غير واقعي: لم تذاكر ولم تنجح."],["L06","n","'If you heat ice, it melts' is an example of the:",["zero conditional","first conditional","second conditional","third conditional"],"حقيقة عامة = الشرط الصفري."],["L06","n","Which is the correct reported form of the question 'Where do you live?'",["She asked me where I lived.","She asked me where did I live.","She asked me where do I live.","She told me where I lived."],"السؤال المنقول بترتيب الخبر وبلا did."],["L06","n","Which sentence uses 'say' and 'tell' correctly?",["He told me that he was tired.","He said me that he was tired.","He told that he was tired.","He said to me tired."],"tell تحتاج مفعولاً بالشخص، وsay لا تأخذه مباشرة."],["L06","n","A Saudi student writes 'The honesty is very important in our life.' The error is most likely due to:",["negative transfer of the Arabic definite article used with generic and abstract nouns","overgeneralization of the -ed rule","a pronunciation slip","lack of phonological awareness"],"العربية تقول «الأمانة»، والإنجليزية بلا أداة للتعميم: Honesty is…"],["L06","n","Which sentence uses the noun 'advice' correctly?",["She gave me some useful advice.","She gave me some useful advices.","She gave me an useful advice.","She gave me many useful advice."],"advice غير معدود: لا جمع ولا a/an ولا many."],["L06","n","Which sentence is grammatically correct?",["The accident happened at night.","The accident was happened at night.","The accident is happened at night.","The accident was happen at night."],"happen فعل لازم فلا يُبنى للمجهول."],["L06","n","A teacher wants a meaningful context for practising the present simple passive. The best choice is:",["describing how dates are picked, packed and exported","telling a personal story about last weekend","giving directions to the school","talking about future plans"],"وصف العمليات سياق طبيعي للمبني للمجهول."],["L06","n","Which sentence contains a NON-defining relative clause?",["My father, who lives in Abha, is a doctor.","The man who lives next door is a doctor.","The book that I bought is interesting.","Students who study hard pass."],"غير المحددة معلومة إضافية بين فاصلتين."],["L06","n","A learner writes 'This is the book that I read it last week.' The best explanation is:",["L1 transfer of the Arabic resumptive pronoun in relative clauses","an error in subject–verb agreement","overuse of the zero article","a pronunciation slip"],"العربية: «الكتاب الذي قرأته» فيه ضمير عائد ينتقل للإنجليزية."],["L06","n","Printing the target verb forms in bold in a reading text so that learners notice them is called:",["input enhancement","structured output","a recast","backshift"],"إبراز الشكل بالخط العريض = تعزيز المدخلات (Sharwood Smith)."],["L06","n","In Processing Instruction (VanPatten), after brief explicit information learners mainly:",["work with structured input activities that require attention to form to get meaning","produce the target form in free writing first","memorize rules through choral drills","translate sentences into their L1"],"تعليم المعالجة يقوم على المدخلات المهيكلة قبل الإنتاج."],["L09","n","A learner can understand the main points of clear standard speech on familiar topics, deal with most travel situations and write simple connected text on familiar topics. According to the CEFR, this learner is at:",["B1","A1","C1","C2"],"هذا وصف B1 (المستخدم المستقل)."],["L09","n","In the CEFR, levels B1 and B2 describe the:",["independent user","basic user","proficient user","native user"],"A أساسي، B مستقل، C متمكن."],["L09","n","Which statement about the CEFR is correct?",["It is a framework of reference describing proficiency levels, not a test.","It is a standardized test produced by Cambridge.","It describes English grammar only.","It has four levels from beginner to advanced."],"الإطار مرجع للمستويات الست، وليس اختباراً."],["L09","n","CEFR descriptors are written as positive 'can-do' statements because the framework takes:",["an action-oriented approach that sees learners as social agents","a behaviourist approach based on habit formation","a grammar-translation approach","a norm-referenced approach to ranking learners"],"المنهج الموجه للفعل: ماذا يستطيع المتعلم أن يفعل باللغة."],["L09","n","The 2020 CEFR Companion Volume added new descriptor scales for:",["mediation","handwriting","spelling only","literary periods"],"أضاف الوساطة ومستوى Pre-A1."],["L09","n","Which Cambridge English exam targets CEFR level A2?",["A2 Key (KET)","B1 Preliminary (PET)","C1 Advanced","IELTS General Training"],"KET = A2، وPET = B1."],["L09","n","A student needs an English test for university admission abroad that has Academic and General Training versions and reports results on a 0–9 band scale. This test is:",["IELTS","TOEFL iBT","B1 Preliminary","A2 Key"],"آيلتس: نسختان ومقياس 0–9."],["L09","n","In which test is the speaking section a face-to-face interview with a live human examiner?",["IELTS","TOEFL iBT","a computer-scored C-test","a multiple-choice grammar test"],"محادثة آيلتس مقابلة حيّة مع ممتحن، وتوفل (حتى مهمة المقابلة المحاكاة منذ 2026) تُسجَّل إجاباتها."],["L10","n","A teacher assesses writing by asking students to find errors in multiple-choice sentences instead of writing a text. This is:",["an indirect test","a direct test","an integrative performance test","a portfolio assessment"],"قياس القدرات الكامنة بدل أداء المهارة = غير مباشر."],["L10","n","Students listen to a recording of directions and complete a map. This listening test technique is:",["information transfer","dictation","cloze","matching headings"],"نقل المعلومات من التسجيل إلى خريطة."],["L10","n","A reading item that most students can answer correctly without reading the passage, using only general knowledge, lacks:",["passage dependence","inter-rater reliability","practicality","washback"],"سؤال القراءة يجب ألا يُجاب إلا بقراءة النص."],["L10","n","Fifteen of 20 students answered an item correctly. The item facility is:",["0.75","0.15","0.25","1.5"],"15 ÷ 20 = 0.75 (سهل نسبياً)."],["L10","n","In a high-scoring group of 10 students, 8 answered an item correctly; in a low-scoring group of 10, 2 did. Using ID = (high correct − low correct) ÷ (½ × total in both groups), the discrimination index is:",["0.6","0.8","0.2","1.0"],"(8 − 2) ÷ 10 = 0.6."],["L10","n","An item is answered correctly by more low-achieving than high-achieving students. The teacher should:",["revise or remove the item, because it has negative discrimination","keep it, because it is very easy","place it first on the test","double its score"],"التمييز السالب علامة سؤال معيب."],["L10","n","In a multiple-choice item, distractor C was chosen by no student. This suggests that distractor C:",["is not functioning and should be revised","is the most effective distractor","is actually the correct answer","makes the item more reliable"],"المشتت الذي لا يختاره أحد غير فعال."],["L10","n","Item analysis shows that most of the class failed all the items linked to one objective. The best use of this information is to:",["reteach that objective and adjust instruction","delete the objective from the syllabus","give the same test again immediately","lower all students' grades"],"تحليل النتائج يوجّه إعادة التدريس."],["L11","n","'By the end of the unit, students will write an 80-word email inviting a friend to an event.' This is best described as a:",["terminal (unit-level) objective","enabling objective","yearly curriculum goal","warm-up activity"],"النتيجة النهائية للوحدة = هدف نهائي."],["L11","n","In the objective 'Students will write five past simple sentences with at least four correct', the phrase 'with at least four correct' is Mager's:",["criterion","performance","condition","audience"],"المعيار: إلى أي درجة."],["L11","n","In the objective 'Given a map, students will describe the route to the school with no more than two errors', the phrase 'Given a map' is the:",["condition","performance","criterion","goal"],"الشرط: الظروف التي يتم فيها الأداء."],["L11","n","A teacher writes 'WALT: give reasons using because' and 'WILF: two reasons with because' on the board. This practice mainly helps to:",["communicate the learning objective and success criteria to students","replace the lesson plan","assess students summatively","reduce wait time"],"WALT نية التعلم وWILF معيار النجاح."],["L11","n","At the end of a lesson, students write one sentence using the target structure on a card before leaving. This is an:",["exit ticket","anticipatory set","information gap","KWL chart"],"بطاقة الخروج تتحقق من بلوغ الهدف."],["L11","n","In SIOP lesson planning, teachers write two kinds of objectives for each lesson:",["content objectives and language objectives","cognitive and psychomotor objectives only","goals and aims","norm-referenced and criterion-referenced objectives"],"نموذج SIOP: هدف محتوى + هدف لغوي."],["L11","n","In the revised Bloom's taxonomy, the knowledge dimension consists of factual, conceptual, procedural and ___ knowledge.",["metacognitive","affective","declarative","psychomotor"],"البعد الرابع ما وراء المعرفي."],["L12","n","A long-term plan that distributes syllabus content across the weeks of a term is a:",["scheme of work","lesson plan","skeleton plan","contingency plan"],"توزيع المنهج على الأسابيع."],["L12","n","A syllabus organised around situations such as 'at the airport' and 'at the restaurant' is:",["situational","structural","lexical","skills-based"],"المواقف = منهج موقفي."],["L12","n","A syllabus organised around activities such as planning a trip and solving a timetable problem is:",["task-based","structural","notional-functional","lexical"],"المهام = منهج المهام."],["L12","n","A syllabus built around high-frequency words, collocations and lexical chunks is:",["lexical","situational","procedural","topic-based"],"المفردات والمتلازمات = منهج معجمي (Willis)."],["L12","n","According to Wilkins, a syllabus that presents grammar items one at a time for learners to gradually put together is:",["synthetic","analytic","procedural","process"],"تقديم اللغة قطعاً منفصلة = تركيبي."],["L12","n","Students meet the past simple in Grade 7 and revisit it with more complex uses in Grades 8 and 9. This follows the idea of a:",["spiral curriculum","product-oriented curriculum","lexical syllabus","hidden curriculum"],"العودة للموضوع بعمق متزايد = منهج حلزوني (Bruner)."],["L12","n","A teacher plans a unit by first deciding what students must do at the end (an oral presentation), then designing the rubric, and only then choosing activities. This is:",["backward design","forward design","PPP","the Silent Way"],"النتائج ← الأدلة ← الأنشطة."],["L12","n","Which sequence matches the 5E instructional model?",["Engage, Explore, Explain, Elaborate, Evaluate","Engage, Study, Activate","Presentation, Practice, Production","Explain, Engage, Evaluate, Explore, Elaborate"],"الترتيب الصحيح يبدأ بالتهيئة ثم الاستكشاف."],["L13","n","A coursebook unit has only four practice items on comparatives, so the teacher adds six more similar items. In McDonough & Shaw's terms, this is:",["extending","expanding","abridging","reordering"],"زيادة من نفس النوع = extending."],["L13","n","A coursebook lesson has no pronunciation work, so the teacher adds a stage on the stress of compound nouns. This is:",["expanding","extending","simplifying","subtracting"],"إضافة عنصر جديد = expanding."],["L13","n","A teacher rewrites a reading text with shorter sentences and more frequent words for a weaker class. This is:",["simplifying","expanding","reordering","replacing"],"تسهيل اللغة والتراكيب = تبسيط."],["L13","n","A teacher does the vocabulary exercise from the end of the unit before the reading text. This adaptation technique is:",["reordering","deleting","extending","replacing"],"تغيير التسلسل = إعادة ترتيب."],["L13","n","A teacher substitutes a coursebook text on a topic unsuitable for the class with a text about a family trip to AlUla. This is:",["replacing","extending","abridging","simplifying"],"وضع مادة أنسب مكان الأصلية = استبدال."],["L13","n","Evaluating a coursebook with a checklist before deciding to adopt it is:",["predictive evaluation","retrospective evaluation","summative assessment of students","item analysis"],"قبل الاستخدام = تنبؤي، وبعده = استرجاعي."],["L13","n","Which practice BEST helps students become independent learners?",["Training them to keep vocabulary notebooks, use dictionaries and set their own goals","Correcting every error for them","Giving the same worksheet to every student","Allowing only teacher-selected materials"],"تدريب المتعلم على أدوات التعلم يبني الاستقلالية."],["L13","n","A student and teacher sign an agreement on the student's goals, tasks and deadlines for extra reading. This is a:",["learning contract","rubric","lesson plan","placement test"],"عقد التعلم يحمّل الطالب المسؤولية."],["L13","n","The Saudi Ministry of Education's national e-learning platform used for virtual classes, assignments and tests is:",["Madrasati","Rosetta Stone","Prezi","OCR"],"منصة مدرستي هي المنصة الرسمية للوزارة."],["L14","n","In a mixed-ability class, all students work on the same objective, but some get a version with sentence starters and others an open version with no support. This is:",["tiered tasks","whole-class drilling","norm-referenced testing","the Silent Way"],"نفس الهدف بمستويات دعم مختلفة = مهام متدرجة."],["L14","n","A gifted student has already mastered the unit's grammar. The best response is to:",["replace the mastered content with enrichment or advanced project work","give the student twice as many of the same exercises","ask the student to wait quietly","move the student to a lower group"],"ضغط المنهج والإثراء، لا «مزيداً من نفس الشيء»."],["L14","n","Which strategy best supports a struggling learner before a reading task?",["Pre-teaching key vocabulary and giving a graphic organizer","Giving a longer text","Removing all visuals","Asking the learner to read aloud without preparation"],"دعم المتعثر: مفردات مسبقة ومنظِّم بصري."],["L14","n","A learner focuses on details, analyses rules well and prefers form-focused tasks. This learner is probably:",["field-independent","field-dependent","impulsive","kinesthetic"],"الاستقلال عن المجال: تفاصيل وتحليل."],["L14","n","At the start of the year a teacher gives a short questionnaire about students' hobbies and favourite topics to adapt lesson content. This is an:",["interest inventory","aptitude test","achievement test","exit ticket"],"استبيان الاهتمامات لتكييف المحتوى."],["L14","n","A student with dyslexia has persistent difficulty decoding words. A suitable support is:",["multisensory techniques, clear fonts and extra time","timed reading under pressure with no help","extra dictation with penalties","removing the student from all reading activities"],"عسر القراءة: طرق متعددة الحواس ووقت إضافي."],["L16","n","A newly arrived learner understands simple instructions and responds by pointing and nodding but rarely speaks. According to Krashen & Terrell, the learner is in the:",["preproduction stage","speech emergence stage","intermediate fluency stage","advanced fluency stage"],"يفهم ولا يتكلم = ما قبل الإنتاج (الفترة الصامتة)."],["L16","n","A learner answers mainly with one or two words such as 'red car' and memorized phrases. The most suitable teacher questions are:",["either/or and who/what/where questions","questions requiring long, justified opinions","questions about abstract hypothetical situations","none; the teacher should avoid all questions"],"الإنتاج المبكر: أسئلة اختيار وأسئلة قصيرة."],["L16","n","A learner now uses simple sentences in short conversations but still makes many errors. This is the ___ stage.",["speech emergence","preproduction","early production","advanced fluency"],"جمل بسيطة مع أخطاء = ظهور الكلام."],["L16","n","In Oxford's (1990) classification, memory, cognitive and compensation strategies are:",["direct strategies","indirect strategies","social strategies","metacognitive strategies"],"المباشرة تتعامل مع اللغة نفسها."],["L16","n","A learner plans study time, sets weekly goals and evaluates her progress. These are ___ strategies.",["metacognitive","compensation","memory","cognitive"],"التخطيط والتقويم ما وراء معرفية."],["L16","n","A learner who forgets the word 'scissors' says 'the thing you use to cut paper'. In Oxford's classification this is a ___ strategy.",["compensation","memory","affective","social"],"تعويض النقص بالوصف."],["L16","n","Oxford's questionnaire for measuring language learning strategy use is the:",["SILL","MLAT","TOEFL","SOLO"],"Strategy Inventory for Language Learning."],["L16","n","According to Skill Acquisition Theory, practice helps learners move from:",["declarative knowledge to procedural knowledge and automaticity","procedural knowledge to declarative knowledge","acquisition to learning","output to a silent period"],"من معرفة القاعدة إلى استعمالها التلقائي (DeKeyser)."],["L17","n","A teacher treats Indian and Nigerian English as legitimate varieties rather than as errors. This reflects the concept of:",["World Englishes","Contrastive Analysis","fossilization","the Audio-Lingual Method"],"تعدد الإنجليزيات المشروعة (Kachru)."],["L17","n","In English as a Lingua Franca (ELF) research, the main aim of communication between non-native speakers is:",["mutual intelligibility","native-like accuracy","British spelling","avoiding all L1 influence"],"الوضوح المتبادل لا معايير الناطق الأصلي."],["L17","n","According to Byram, the ideal outcome of intercultural language teaching is the:",["intercultural speaker","native speaker","monolingual speaker","professional translator"],"المتحدث بين الثقافات بدل تقليد الناطق الأصلي."],["L17","n","Students plan a presentation in Arabic in their groups and then deliver it in English, using all their languages as resources. This practice is known as:",["translanguaging","negative transfer","the Direct Method","fossilization"],"توظيف كامل المخزون اللغوي كمورد."],["L17","n","Kumaravadivelu suggested that teachers go beyond methods by using general principles such as 'maximize learning opportunities' and 'promote learner autonomy'. These are called:",["macrostrategies","microteaching steps","drills","design features"],"ما بعد الطريقة: الاستراتيجيات الكبرى."],["L17","n","The belief that native speakers are automatically the best English teachers is called:",["native-speakerism","linguistic relativity","Universal Grammar","eclecticism"],"مصطلح Holliday."],["L17","n","According to Medgyes, one advantage of non-native English-speaking teachers is that they:",["can anticipate learners' difficulties and serve as models of successful learners","always have native-like pronunciation","never use the learners' L1","do not need to study grammar"],"مر بنفس التجربة فيتوقع الصعوبات."],["L17","n","A teacher notices low participation, tries a new group technique for two weeks, collects data, reflects and plans again. This is:",["action research","a placement test","the Silent Way","an aptitude test"],"دورة: خطط، نفّذ، لاحظ، تأمّل."],["L17","n","A teacher changes an activity in the middle of a lesson after noticing students' confusion. Schön calls this:",["reflection-in-action","reflection-on-action","action research","peer observation"],"التأمل أثناء الفعل."],["L17","n","A science subject taught entirely in English to Grade 10 students is an example of:",["hard CLIL","soft CLIL","ESP for adults","Grammar-Translation"],"المادة نفسها بالإنجليزية = CLIL قوي."],["L17","n","Teaching about Shakespeare's plays is an example of ___ culture, while teaching how people greet each other is ___ culture.",["Big C / little c","little c / Big C","deep / surface","high-context / low-context"],"الإنجازات الكبرى Big C، والحياة اليومية little c."],["L17","n","A coursebook unit about Jeddah's historic district and Saudi customs mainly presents ___ culture (Cortazzi & Jin).",["source","target","international","Big C only"],"ثقافة المتعلم نفسه = ثقافة المصدر."],["L18","n","The theory that words originated from imitating natural sounds such as 'cuckoo' and 'splash' is called the:",["bow-wow theory","pooh-pooh theory","yo-heave-ho theory","divine source theory"],"محاكاة أصوات الطبيعة."],["L18","n","The theory that language began with instinctive emotional cries such as 'Ouch!' is the:",["pooh-pooh theory","bow-wow theory","yo-heave-ho theory","oral-gesture theory"],"صيحات الانفعال."],["L18","n","Upright teeth, flexible lips, a lowered larynx and a lateralized brain are evidence cited by the ___ view of language origin.",["physiological adaptation","divine source","bow-wow","pooh-pooh"],"التكيف الجسدي لأعضاء النطق والدماغ."],["L18","n","The view that humans are born with a special capacity for language is the:",["genetic source (innateness hypothesis)","natural sound source","social interaction source","oral-gesture source"],"المصدر الوراثي / الفطري."],["L18","n","In Saussure's terms, the sound-image /triː/ is the ___ and the concept 'tree' is the ___.",["signifier / signified","signified / signifier","langue / parole","syntagm / paradigm"],"الصورة الصوتية دال، والمفهوم مدلول."],["L18","n","Studying English as it is used today, without reference to its history, is ___ linguistics.",["synchronic","diachronic","historical","comparative"],"في نقطة زمنية واحدة = تزامني."],["L18","n","In 'The cat sat', the relation between 'cat' and words that could replace it ervation","they are not related to primates","they lack scientific evidence"],3,"نظريات نشأة اللغة تخمينية، وما يدعمها دليل علمي."],["L18","The relationship between linguistic form and meaning is ___.",["arbitrary","informative","non-directional","onomatopoeic"],0,"العلاقة اعتباطية، والمحاكاة الصوتية استثناء قليل."],["L18","The ability of human language to refer to things not present in the immediate environment is called ___.",["discreteness","diversity","duality","displacement"],3,"الإزاحة: الكلام عن الغائب، حتى عن أشياء ما نتأكد من وجودها."],["L21","'If you study hard' is ___.",["a simple sentence","an independent clause","a dependent clause","an example of ellipsis"],2,"جملة شرط تابعة، ما تقف وحدها."],["L21","Adverbs can modify all of the following EXCEPT ___.",["other adverbs","nouns","verbs","adjectives"],1,"الظرف يصف الفعل والصفة والظرف، ولا يصف الاسم أبداً."],["L21","In the sentence 'The teacher saw one of the students cheating in the exam', the word 'cheating' is a ___ verb.",["linking","finite","copulative","non-finite"],3,"cheating صيغة ‎-ing بلا زمن، فهي غير متصرفة."],["L19","The vowel in 'two' is ___.",["high front vowel","mid central vowel","high back vowel","low back vowel"],2,"/uː/ عالٍ خلفي مستدير."],["L20","The word 'reopened' consists of ___ morpheme(s).",["one","two","three","four"],2,"re + open + ed = 3."],["L21","The sentence 'Young boys and girls love the adventure playground' is ___.",["syntactically ambiguous","lexically ambiguous","unambiguous","ungrammatical"],0,"هل young تصف الأولاد فقط أم الاثنين؟ هذا غموض تركيبي."],["L22","What a speaker assumes is true or known by a listener can be described as ___.",["entailment","coherence","cohesion","presupposition"],3,"الافتراض المسبق."],["L17","The term 'negative transfer' is used to refer to ___.",["the effect of an unfavorable learning environment on the student","the negative influence of L1 on L2","the imitation of other students' mistakes","the imitation of teachers' mistakes"],1,"النقل السل ortfolio"],2,"تحليل الاحتياجات (المعيار 6٫9٫7)."],["L19","Which of the following is a liquid consonant?",["[i]","[l]","[m]","[g]"],1,"/l/ و/r/ أصوات سائلة."],["L08","Projects for producing posters, brochures, and pamphlets are examples of ___.",["the Natural Approach","task-based learning","community language learning","the Structural Approach"],1,"مهام لها ناتج حقيقي = تعلم بالمهمة."],["L08","In ___ setting, students in small groups acquire and apply knowledge and skills to solve real-world situations.",["the Silent Way","a problem-based learning","a grammar-translation","the Direct Method"],1,"التعلم بحل المشكلات."],["L09","To identify learners' strengths and weaknesses and find out what learning still needs to take place, the teacher needs to develop a ___ test.",["proficiency","norm-referenced","diagnostic","achievement"],2,"التشخيصي."],["L09","___ are designed to help teachers roughly monitor students' progress and keep students on their toes.",["Proficiency tests","Placement tests","Pop quizzes","Achievement tests"],2,"الاختبارات القصيرة المفاجئة."],["L09","By using ___, the teacher regularly monitors the students' performance without interrupting the instruction time.",["formative assessment","summative assessment","placement tests","diagnostic tests"],0,"التكويني."],["L09","___ is/are used to guide and inform teaching practice and modify language programs in response to students' needs and abilities.",["Lesson plans","Course description","Assessment information","Course syllabi"],2,"معلومات التقويم."]];

window.QX_LTR_FIX = function () {

  var AR = new RegExp("[" + C(0x0600) + "-" + C(0x06FF) + "]");

    if (typeof s !== "string" || !AR.test(s) || s.charAt(0) === RLI) return s;

  }
  function fix(m) {
    if (!m || !m.groups) return;
    if (m.title) m.title = m.title.map(w);
    m.groups.forEach(function (g) {
      ["n", "short", "ar", "idea", "trap", "who"].forEach(function (k) { if (g[k]) g[k] = w(g[k]); });
      (g.items || []).forEach(function (it) {

      });

};
window.DEEP = {"en.skinner":{"k":"Behaviorism","t":["B. F. Skinner — Operant Conditioning","سكنر والاشتراط الإجرائي"],"body":[["Skinner extended behaviorism with **operant conditioning**: behavior that is followed by a pleasant consequence (**reinforcement**) becomes more likely; behavior followed by an unpleasant consequence becomes less likely. In *Verbal Behavior* (1957) he described language itself as behavior shaped by reinforcement.","السلوك الذي يتبعه تعزيز يتكرر، والذي يتبعه عقاب يقل. وفي كتابه «السلوك اللفظي» عدّ اللغة سلوكاً يتشكّل بالتعزيز."]],"pts":[["**Positive reinforcement** = adding something pleasant (praise) to increase a behavior.","التعزيز الإيجابي: إضافة شيء محبوب"],["**Negative reinforcement** = removing something unpleasant to increase a behavior — it is NOT punishment.","التعزيز السلبي: إزالة شيء مزعج، وليس عقاباً"],["Classroom link: **Audio-Lingual Method** drills (repetition, substitution, chain drills).","الربط الصفي: تدريبات الطريقة السمعية الشفهية"]],"traps":[["Negative reinforcement ≠ punishment: both change behavior in opposite directions.","التعزيز السلبي ليس عقاباً"],["Chomsky's 1959 review criticized Skinner's *Verbal Behavior* — not the other way round.","تشومسكي انتقد سكنر لا العكس"]],"src":"Brown, Principles of Language Learning and Teaching; Lightbown & Spada, How Languages are Learned"},"en.pavlov":{"k":"Behaviorism","t":["Ivan Pavlov — Classical Conditioning","بافلوف والاشتراط الكلاسيكي"],"body":[["Pavlov showed that a neutral stimulus (a bell) paired repeatedly with food comes to trigger salivation by itself. Learning here is an **automatic association** between two stimuli — the learner does not choose the response.","ارتباط تلقائي بين مثيرين: الجرس مع الطعام حتى يكفي الجرس وحده."]],"traps":[["Classical conditioning = involuntary response to a stimulus; operant = voluntary behavior shaped by its consequences.","الكلاسيكي استجابة لا إرادية، والإجرائي سلوك تشكّله النتائج"]],"src":"Brown, Principles of Language Learning and Tea
