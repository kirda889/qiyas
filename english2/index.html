,"sec":[{"h":["Approaches to teaching writing","مداخل تدريس الكتابة"],"pts":[["Writing is often the hardest skill because it needs both the graphic form and organized thought, and [[approaches|en.wr.approaches]] differ in what they focus on: the final text, the writer's stages, or the text type and its purpose.","الكتابة أصعب المهارات غالباً، والمداخل تختلف: التركيز على الناتج أم المراحل أم نوع النص."],["The product approach imitates model texts and values the accuracy of the final product, while the process approach focuses on the recursive stages of producing a text.","مدخل المنتج يقلّد النماذج ويهتم بدقة الناتج، ومدخل العمليات يهتم بمراحل الكتابة المتكررة."],["Process classrooms build in responses between drafts: **peer review** works best with a checklist, and a writing conference is a short one-to-one talk between teacher and student about a draft.","في مدخل العمليات: مراجعة الأقران بقائمة تحقق، ومناقشة فردية قصيرة مع المعلم حول المسودة."],["The genre approach teaches writing through text types and their purposes, and the [[**process-genre approach**|en.wr.tlc]] (Badger & White) combines genre knowledge with the writing stages.","مدخل النوع يعلّم عبر أنواع النصوص وأغراضها، ومدخل بادجر ووايت يجمع النوع مع المراحل."],["Genre teaching often follows the teaching-learning cycle: building the context → modelling and deconstructing a model text → **joint construction** with the teacher → independent construction.","دورة التدريس والتعلم: بناء السياق، ثم نمذجة النص وتحليله، ثم كتابة مشتركة، ثم كتابة مستقلة."]],"t":[["Process approach","A writing approach focusing on the recursive stages of producing a text.","مدخل العمليات"],["Product approach","A writing approach based on imitating model texts and accuracy of the final product.","مدخل المنتج"],["Genre approach","Teaching writing through text types and their purposes.","مدخل النوع"],["Recursive","Writers move back and forth between stages.","دائري"],["Process-genre approach","A writing approach combining genre knowledge with process stages.","منهج العملية والجنس"],["Teaching-learning cycle","Genre-based sequence: context, modelling, joint construction, independent construction.","دورة التدريس والتعلم"],["Joint construction","Teacher and learners compose a text together before independent writing.","الكتابة المشتركة"],["Peer review","Learners read and comment on each other's drafts.","مراجعة الأقران"],["Writing conference","A short one-to-one discussion between teacher and student about a piece of writing.","مناقشة فردية حول المسودة"]],"map":{"title":["Approaches to teaching writing","⁧مداخل تدريس الكتابة⁩"],"type":"fan","groups":[{"n":"Product writing","ar":"⁧تقليد نص نموذجي، والتركيز على دقة الناتج⁩","items":[{"n":"model text"}],"d":"en.wr.approaches"},{"n":"Process writing","ar":"⁧مراحل متكررة: استكشاف وتأمل وإعادة صياغة المسودة⁩","items":[{"n":"recursive"},{"n":"drafts"}],"d":"en.wr.approaches"},{"n":"Genre approach","ar":"⁧أنواع النصوص وأغراضها الاجتماعية⁩","items":[{"n":"social purpose"}],"d":"en.wr.approaches"},{"n":"Process-genre","who":"Badger & White","ar":"⁧معرفة النوع + مراحل الكتابة⁩","d":"en.wr.tlc"}]}},{"h":["Stages of the writing process","مراحل الكتابة"],"pts":[["The writing process moves through pre-writing → drafting → revising → editing/proofreading → publishing, and it is recursive: writers go back to earlier stages when needed.","المراحل: ما قبل الكتابة، فالمسودة، فالمراجعة، فالتدقيق، فالنشر، والكاتب يرجع لأي مرحلة."],["Pre-writing generates and organizes ideas: brainstorming, clustering, freewriting (writing non-stop without worrying about errors) and outlining all belong to this stage.","ما قبل الكتابة توليد الأفكار وتنظيمها بالعصف الذهني والتجميع والكتابة الحرة والمخطط."],["When drafting, early-stage writers focus on **fluency more than accuracy**; among the options 'reviewing, editing, drafting, evaluation', the first stage is **drafting**.","في المسودة الطلاقة قبل الدقة، والمسودة هي المرحلة الأولى بين هذه الخيارات الأربعة.","o"],["Peers' and the teacher's suggestions on content and organization belong to [[**revising**|en.wr.stages]], while correcting grammar, spelling and punctuation is editing/proofreading.","اقتراحات الزملاء والمعلم على المحتوى مراجعة، وتصحيح القواعد والإملاء والترقيم تدقيق."]],"t":[["Pre-writing","Generating and organizing ideas before writing (brainstorming, clustering, outlining).","ما قبل الكتابة"],["Drafting","Writing a first version focusing on ideas rather than accuracy.","المسودة"],["Revising","Improving content and organization, often using peer/teacher feedback.","المراجعة"],["Editing / Proofreading","Correcting grammar, spelling and punctuation.","التدقيق"],["Publishing","Sharing the final version.","النشر"],["Brainstorming","Freely generating as many ideas as possible about a topic.","عصف ذهني"],["Freewriting","Writing non-stop without worrying about grammar or spelling.","كتابة حرة"],["Clustering / Concept mapping","Organizing related ideas visually around a central topic.","تجميع / خريطة مفاهيم"]],"map":{"type":"flow","title":["The writing process","⁧مراحل الكتابة⁩"],"back":[[1,0],[2,1],[2,0]],"loop":["Recursive: writers go back to earlier stages","⁧الكاتب يرجع لأي مرحلة سابقة⁩"],"groups":[{"n":"Pre-writing","ar":"⁧قبل الكتابة⁩","idea":"⁧توليد الأفكار وتنظيمها⁩","d":"en.wr.stages","items":[{"n":"brainstorming"},{"n":"freewriting"},{"n":"outlining"}]},{"n":"Drafting","ar":"⁧المسودة⁩","idea":"⁧الطلاقة قبل الدقة⁩","items":[{"n":"ideas down"}]},{"n":"Revising","ar":"⁧المراجعة⁩","idea":"⁧المحتوى والتنظيم⁩","items":[{"n":"peer & teacher suggestions"}],"trap":"⁧اقتراحات الزملاء والمعلم = مراجعة⁩"},{"n":"Editing / Proofreading","short":"Editing","ar":"⁧التدقيق⁩","idea":"⁧القواعد والإملاء والترقيم⁩","items":[{"n":"grammar & spelling"}],"trap":"⁧القواعد والإملاء = تدقيق لا مراجعة⁩"},{"n":"Publishing","ar":"⁧النشر⁩","idea":"⁧مشاركة النسخة النهائية⁩","items":[{"n":"final version"}]}]}},{"h":["Controlled, guided and free writing","الكتابة المضبوطة والموجهة والحرة"],"pts":[["Writing tasks move from controlled to guided to free as learners gain control of language and organization.","تتدرج مهام الكتابة من المضبوطة إلى الموجهة إلى الحرة كلما نمت قدرة الطالب."],["[[**Controlled writing**|en.wr.control]] fixes content and form: copying, dictation, substitution and rewriting a text in another tense; in a **reproduction** task, learners write down content they have seen, heard or read, as it was.","المضبوطة: نسخ وإملاء واستبدال وتغيير الزمن، ومهمة إعادة الإنتاج تدوين ما شوهد أو سُمع كما هو."],["In **guided writing** an outline, words and grammatical patterns are given, and learners supply the rest.","في الكتابة الموجهة يُعطى الطالب مخططاً وكلمات وتراكيب ويكمل الباقي."],["Young learners start with **modeled writing**, in which the teacher writes in front of them thinking aloud; analyzing a model essay with students is also modeling.","الصغار يبدؤون بالنمذجة: يكتب المعلم أمامهم ويفكر بصوت مسموع، وتحليل مقال نموذجي نمذجة أيضاً."],["Free writing tasks are matched to level and purpose: a **complaint letter**, for example, suits intermediate and advanced learners.","المهام الحرة تناسب المستوى والهدف، فرسالة الشكوى للمستوى المتوسط والمتقدم."]],"t":[["Controlled writing","Highly structured writing where content and form are fixed (e.g. dictation).","كتابة مضبوطة"],["Guided writing","Writing supported by an outline, model or prompts.","كتابة موجهة"],["Free writing","Independent writing with minimal guidance.","كتابة حرة"],["Modeled writing","The teacher writes in front of students, thinking aloud.","النمذجة"],["Reproduction task","A writing task in which learners record content they have seen or heard rather than create or evaluate it.","مهمة إعادة الإنتاج"]]},{"h":["Paragraphs, essays and organisation","الفقرة والمقال وتنظيم الأفكار"],"pts":[["A [[paragraph|en.wr.paragraph]] has a **topic sentence** stating the main idea, supporting sentences that develop it, and a concluding (closing) sentence.","الفقرة جملة موضوعية تذكر الفكرة، ثم جمل داعمة، ثم جملة ختامية."],["An essay has an engaging introduction, body paragraphs and a conclusion; the **thesis statement**, broader than a topic sentence, comes at the end of the introduction.","المقال مقدمة ثم فقرات ثم خاتمة، وجملة الأطروحة أعمّ من الموضوعية وتأتي آخر المقدمة."],["Transition words such as however and moreover link ideas and improve [[**coherence**|en.ling.cohesion]], the logical clarity of a text; a run-on sentence joins two independent clauses without correct punctuation.","كلمات الانتقال تحسّن ترابط المعنى، والجملة المتداخلة جملتان مستقلتان بلا ترقيم صحيح."],["[[**Contrastive rhetoric**|en.wr.kaplan]] (Kaplan) shows that the organisation of writing differs across cultures: Arabic links ideas with 'wa', so Arab writers often struggle with cohesion and organisation in English.","البلاغة التقابلية عند كابلان: العربية تربط الأفكار بالواو، فيصعب على العربي التماسك والتنظيم."],["Because Arabic uses fewer full stops, Arab learners often produce English **run-on sentences**, so punctuation needs to be taught explicitly.","قلة النقاط في العربية تنتج جملاً متداخلة بالإنجليزية، فعلّم علامات الترقيم صراحة."]],"t":[["Topic sentence","The sentence stating the main idea of a paragraph.","الجملة الموضوعية"],["Supporting sentences","Sentences that explain and develop the topic sentence.","الجمل الداعمة"],["Concluding (closing) sentence","The final sentence that restates the main idea.","الجملة الختامية"],["Thesis statement","The central claim of an essay; broader than a topic sentence.","جملة الأطروحة"],["Coherence","Logical connection and clarity of ideas in a text.","ترابط معنوي"],["Cohesion","Grammatical and lexical links between sentences.","ترابط شكلي"],["Run-on sentence","Two or more independent clauses joined without correct punctuation.","جملة متداخلة"],["Abstract","A brief summary of a research paper's methods and findings.","ملخص البحث"],["Contrastive rhetoric","The study of how the organisation of writing differs across languages and cultures (Kaplan).","البلاغة التقابلية"],["Transition words","Linking words such as moreover, hence, in addition that connect ideas smoothly.","كلمات الانتقال والربط"]]},{"h":["Types of writing","أنواع الكتابة"],"pts":[["The **text type** sets the tense, vocabulary and register a writer needs, so learners must know the main types.","نوع النص يحدد الزمن والمفردات ومستوى الرسمية التي يحتاجها الكاتب."],["[[**Narrative**|en.wr.types]] writing tells a story in chronological order; **descriptive** writing creates a picture through sensory details and metaphors.","السردي يحكي قصة بترتيب زمني، والوصفي يرسم صورة بتفاصيل حسية وتشبيهات."],["**Expository** writing explains or informs (how-to, cause–effect), while persuasive or argumentative writing takes a position and supports it with facts and statistics.","التفسيري يشرح ويُخبر، والإقناعي يتبنى موقفاً ويدعمه بالحقائق والإحصاءات."],["**Reflective** writing responds to personal experiences and feelings, as in journal responses; informative writing includes summaries, letters and reports.","التأملي استجابة لتجربة شخصية كاليوميات، والإخباري يشمل الملخصات والرسائل والتقارير."],["Register must fit the text: 'Hi Anas' in a formal letter is the wrong **register**, so use 'Dear Sir or Madam'.","عبارة Hi Anas في رسالة رسمية خطأ في مستوى الخطاب، والصحيح Dear Sir or Madam."]],"t":[["Narrative writing","Writing that tells a story, often for pleasure.","سردي"],["Descriptive writing","Writing that creates a picture through sensory details.","وصفي"],["Expository writing","Writing that explains or informs.","تفسيري"],["Persuasive / argumentative writing","Writing that takes a position and supports it with evidence.","إقناعي"],["Reflective writing","Writing that responds to personal experiences, feelings or ideas.","تأملي"],["Voice","The writer's personal expression of opinions in writing.","صوت الكاتب"]]},{"h":["Responding to students' writing","الرد على كتابة الطلاب"],"pts":[["When a text has many error areas, **mark one grammatical area** instead of everything, and a common-errors list then helps students revise and rewrite.","إذا كثرت الأخطاء صحّح مجالاً نحوياً واحداً، وقائمة الأخطاء الشائعة تعين على إعادة الكتابة."],["Correction codes such as sp, gr and ww mark the type of error and leave the correction to the student.","رموز التصحيح مثل (sp, gr) تحدد نوع الخطأ وتترك تصحيحه للطالب."],["Collecting a student's drafts over a semester creates a writing [[**portfolio**|en.assess.alt]] that shows progress; a journal is a less stressful alternative for fluency practice.","مسودات الفصل الدراسي تكوّن ملف إنجاز يُظهر التقدم، واليوميات بديل أقل توتراً."],["**Automated writing evaluation (AWE)** can help with language, but teachers still guide content and academic integrity.","التقييم الآلي للكتابة يساعد في اللغة، ويبقى المعلم موجّهاً للمحتوى والأمانة العلمية."]],"t":[["Portfolio","A purposeful collection of a student's work over time showing progress.","ملف إنجاز"],["Journal writing","Regular personal writing; low-stress practice of fluency.","يوميات"],["Correction codes","Symbols (sp, gr, ww) marking error types.","رموز التصحيح"],["Writing to learn","Using writing to represent and deepen understanding.","الكتابة للتعلم"],["Automated writing evaluation (AWE)","Software that scores or gives feedback on writing automatically.","التقييم الآلي للكتابة"]]},{"h":["The written corrective feedback debate","جدل التصحيح الكتابي"],"pts":[["[[**Truscott (1996)**|en.wr.wcf]] argued that grammar correction is ineffective; Ferris (1999) replied that clear, selective feedback helps.","تروسكوت 1996 رأى أن تصحيح القواعد غير مفيد، وردّ فيريس 1999 بأن التصحيح الواضح الانتقائي يفيد."],["**Direct** feedback gives the correct form, while indirect feedback only marks the error (underlining or a code) so that the learner corrects it.","التصحيح المباشر يعطي الصيغة الصحيحة، وغير المباشر يحدد الخطأ فقط ليصححه الطالب."],["**Focused** feedback on one or a few error types is better supported by research than unfocused feedback on all errors.","التصحيح المركّز على نوع أو نوعين من الأخطاء أنفع من تصحيح كل الأخطاء."],["On early drafts respond to **content and organisation**, and on later drafts to language accuracy; learners must then act on the feedback.","في المسودات الأولى المحتوى والتنظيم، ثم الدقة اللغوية، ويجب أن يعمل الطالب بالتصحيح."]],"t":[["Written corrective feedback (WCF)","Teacher or peer responses to errors in learners' writing.","التصحيح الكتابي"],["Direct corrective feedback","Providing the correct form above or near the error.","تصحيح مباشر"],["Indirect corrective feedback","Indicating an error (underlining, codes) without giving the correction.","تصحيح غير مباشر"],["Focused feedback","Correcting only selected error types.","تصحيح مركّز"],["Unfocused feedback","Correcting all or most errors in a text.","تصحيح شامل"]]}],"trap":[["Asking peers and the teacher for help = revising stage.","المراجعة"],["Dictation = controlled writing.","الإملاء مضبوطة"],["Thesis statement is broader than a topic sentence.","الأطروحة أعمّ"],["'Hi Anas' = incorrect register in a formal letter.","سجل خطأ"]],"vid":[["91HVPAlZ0UU","ar","مراحل عملية الكتابة","الدافورة",41],["q388D3zX0IQ","ar","أنواع الأنشطة الكتابية","الدافورة",30],["PAoez1yqx6w","en","Giving feedback on EFL writing","Jo Gakonga",33]],"n":5},{"id":"L06","d":"P","std":"6.9.1","en":"Teaching Grammar","ar":"تدريس القواعد","goal":["Distinguish deductive from inductive teaching; know form–meaning–use and the main lesson frameworks.","الاستنتاجي والاستقرائي وأطر الدروس"],"sec":[{"h":["Deductive and inductive grammar teaching","التدريس الاستنتاجي والاستقرائي للقواعد"],"pts":[["A grammar lesson can start from the rule or from examples, and this choice is what separates deductive from inductive teaching.","يبدأ درس القواعد بالقاعدة أو بالأمثلة، وهذا هو الفرق بين الاستنتاجي والاستقرائي."],["In a [[**deductive**|en.gr.dedind]] approach the rule is presented first and then applied in examples (rule → example).","في الطريقة الاستنتاجية تُشرح القاعدة أولاً ثم تُطبَّق في الأمثلة."],["In an **inductive** approach learners meet examples first and work out the rule themselves (example → rule), for instance through guided discovery led by the teacher's questions.","في الطريقة الاستقرائية تأتي الأمثلة أولاً ويكتشف الطالب القاعدة، كالاكتشاف الموجّه."],["Teaching also differs in explicitness: explicit teaching states the rule openly, while implicit teaching lets learners pick it up without explanation.","التدريس الصريح يذكر القاعدة علناً، والضمني يترك الطالب يكتسبها دون شرح."]],"t":[["Deductive approach","Presenting a rule first and then applying it in examples.","استنتاجي"],["Inductive approach","Learners work out the rule from examples.","استقرائي"],["Guided discovery","The teacher leads learners to discover rules through questions and examples.","اكتشاف موجه"],["Explicit vs implicit teaching","Stating rules openly vs learning them without explanation.","صريح / ضمني"]],"map":{"type":"grid","title":["Deductive vs inductive: the order changes","⁧الاستنتاجي والاستقرائي: الترتيب ينقلب⁩"],"colsTitle":["Order","الترتيب"],"rowsTitle":["Approach","الطريقة"],"cols":[{"n":"1st","ar":"⁧أولاً⁩"},{"n":"2nd","ar":"⁧ثانياً⁩"},{"n":"3rd","ar":"⁧ثالثاً⁩"}],"rows":[{"n":"Deductive","ar":"⁧استنتاجي⁩","cells":[{"n":"Rule","ar":"⁧المعلم يشرح القاعدة⁩"},{"n":"Examples","ar":"⁧أمثلة توضحها⁩"},{"n":"Practice","ar":"⁧تدريب⁩"}]},{"n":"Inductive","ar":"⁧استقرائي⁩","cells":[{"n":"Examples","ar":"⁧أمثلة في سياق⁩"},{"n":"Rule","ar":"⁧الطالب يكتشف القاعدة⁩"},{"n":"Practice","ar":"⁧تدريب⁩"}]}],"trap":"⁧الاكتشاف الموجّه (guided discovery) طريقة استقرائية⁩"}},{"h":["Form, meaning, use and attention to form","الشكل والمعنى والاستخدام والانتباه للشكل"],"pts":[["[[Larsen-Freeman|en.gr.fmu]] describes grammar in three dimensions — **form, meaning and use** — so knowing a structure means knowing how it is built, what it means and when it is used.","عند لارسن-فريمان للقاعدة ثلاثة أبعاد: شكل ومعنى واستخدام، ويجب تعليمها كلها."],["Good grammar teaching presents grammar in context, gives enough practice to internalize it and accepts learners' developmental grammar; **non-contextualized drills** are NOT good practice.","التدريس الجيد في سياق وبتدريب كافٍ ويتقبل الأخطاء المرحلية، والتدريبات بلا سياق ممارسة سيئة."],["[[**Focus on form**|en.gr.fonf]] is brief attention to a form inside a communicative task, unlike focus on forms, which teaches discrete structures one by one; **consciousness-raising** activities make learners notice language features.","التركيز على الشكل وقفة قصيرة داخل نشاط تواصلي، والتركيز على الأشكال قواعد منفصلة واحدة واحدة."],["Input-based options also direct attention to form: [[**Processing Instruction**|en.gr.pi]] (VanPatten) uses structured input before production, **input enhancement** (Sharwood Smith) highlights forms with bold, colour or underlining, and an input flood gives many examples.","خيارات المدخلات: تعليم المعالجة لفانباتن، وإبراز الشكل لشاروود سميث، وإغراق المدخلات بالأمثلة."],["In a **dictogloss** learners hear a text, take notes and reconstruct it in groups, joining meaning and form; all these techniques apply [[**noticing**|en.sla-interaction]] (Schmidt): a form must be noticed before it can be learned.","الدكتوغلوس يجمع المعنى والشكل، وكل هذه الأساليب تطبّق فرضية الملاحظة عند شميت."]],"t":[["Form – meaning – use","Larsen-Freeman's three dimensions of grammar.","الأبعاد الثلاثة"],["Focus on form (FonF)","Drawing attention to linguistic form during meaning-focused activity.","التركيز على الشكل"],["Focus on forms","Teaching discrete grammatical structures one by one.","التركيز على الأشكال"],["Consciousness-raising","Activities that make learners notice grammatical features.","رفع الوعي"],["Structure-based instruction","Instruction focused on the language itself (vocabulary and grammar).","تعليم قائم على البنية"],["Processing Instruction","VanPatten's input-based approach that pushes learners to make correct form–meaning connections.","تعليم المعالجة"],["Structured input","Input activities designed so that learners must process a target form to understand meaning.","مدخلات مُهيكلة"],["Input enhancement","Making target forms more salient in input, e.g. by highlighting or bolding.","تعزيز المدخلات"],["Input flood","Providing input containing many instances of a target form.","إغراق المدخلات"]],"ex":[["Pairs planning a trip keep saying *We will going*; the teacher fixes it in one minute and the task goes on — **focus on form**.","وقفة دقيقة ثم يكمل النشاط"]]},{"h":["Lesson frameworks: PPP, TTT and ESA","أطر درس القواعد: (PPP, TTT, ESA)"],"pts":[["Three frameworks organise a grammar lesson: [[**PPP**|en.gr.frames]] (Presentation → Practice → Production), **TTT** (Test → Teach → Test) and Harmer's **ESA** (Engage → Study → Activate).","ثلاثة أطر: عرض فممارسة فإنتاج، واختبار فتعليم فاختبار، وإطار هارمر: شدّ فدراسة فتفعيل."],["In PPP, **presentation** comes first — the new form in context, the stage with the most teacher control — and **practice** follows with controlled activities such as drills and gap-fills for accuracy.","في PPP العرض أولاً وفيه أعلى تحكم للمعلم، ثم الممارسة المضبوطة للدقة."],["**Production** comes last: learners use the new language freely in communicative tasks for fluency, and the teacher gives delayed feedback.","الإنتاج أخيراً: يستخدم الطالب اللغة بحرية للطلاقة، والتصحيح مؤجل."],["In TTT the first test finds out what students already know, so the teaching stage can target the gaps it reveals.","في TTT يكشف الاختبار الأول ما يعرفه الطلاب، فيركز التعليم على ما ينقصهم."],["[[**CCQs**|en.gr.ccq]] check meaning ('You mustn't use your phone' → 'Is it allowed?'), ICQs check instructions, and timelines help teach tenses.","أسئلة CCQ تفحص فهم المعنى، وأسئلة ICQ تفحص فهم التعليمات، والخط الزمني يشرح الأزمنة."]],"t":[["PPP","Presentation, Practice, Production.","عرض، ممارسة، إنتاج"],["TTT","Test, Teach, Test.","اختبار، تعليم، اختبار"],["ESA","Engage, Study, Activate (Harmer).","إطار هارمر"],["CCQs","Concept-checking questions that verify understanding of meaning.","أسئلة فحص المفهوم"],["ICQs","Instruction-checking questions that verify understanding of a task.","أسئلة فحص التعليمات"],["Controlled practice","Highly guided activities that focus on accurate use of the new form.","تدريب موجه للدقة"],["Free practice (production)","Open activities in which learners use the new language freely for fluency.","استخدام حر للطلاقة"]]},{"h":["Tenses and pronouns: common problem points","الأزمنة والضمائر: نقاط صعبة شائعة"],"pts":[["The **present perfect** is the hardest tense for beginners because Arabic has no direct equivalent; it links the past to the present without a specific past time.","المضارع التام أصعب زمن على المبتدئ لأنه بلا مقابل مباشر في العربية."],["So 'I have broken it yesterday' is wrong: a finished past time such as yesterday needs the **past simple** — 'I broke it yesterday'.","مع وقت ماضٍ محدد مثل yesterday نستخدم الماضي البسيط لا المضارع التام."],["The present perfect continuous shows an action continuing up to now, often with for or since: 'I **have been working** on this book for ten months.'","المضارع التام المستمر لحدث مستمر حتى الآن، وغالباً مع for أو since."],["When comparing two pictures, learners describe what they see in the **present** tense.","عند مقارنة صورتين يصف الطالب ما يراه بزمن المضارع."],["Pronoun case follows the pronoun's job in the clause: 'The pupils you and me saw' should be 'you and **I**', because the pronoun is the subject of 'saw'.","الضمير هنا فاعل للفعل saw، فالصحيح you and I لا you and me."]],"t":[["Present perfect","have/has + past participle; links past to present, no specific past time.","مضارع تام"],["Present perfect continuous","have/has been + -ing; an action continuing up to now (for/since).","مضارع تام مستمر"]]},{"h":["Conditionals","الجمل الشرطية"],"pts":[["The [[**zero**|en.gr.cond]] conditional uses If + present, present for general truths: 'If you heat ice, it melts.'","الشرط الصفري للحقائق العامة: مضارع في الشرط ومضارع في الجواب."],["The **first** conditional uses If + present, will + base form for a real or likely future.","الشرط الأول لمستقبل حقيقي محتمل: مضارع في الشرط، والفعل will في الجواب."],["The **second** conditional uses If + past, would + base form for an unreal present or future: 'If I had a million riyals…'","الشرط الثاني لحاضر أو مستقبل خيالي: ماضٍ في الشرط، والفعل would في الجواب."],["The **third** conditional uses If + past perfect, would have + past participle for an unreal past or regret; check it with CCQs such as 'Did she study? (No) Did she pass? (No)'.","الشرط الثالث لماضٍ لم يحدث أو للندم، ونتحقق من فهمه بأسئلة CCQ."],["Never put **will in the if-clause**; a mixed conditional combines times, e.g. 'If I had studied medicine, I would be a doctor now.'","لا تستخدم will بعد if، والشرط المختلط يمزج زمنين مختلفين."]],"t":[["Zero conditional","If + present, present: general truths and facts.","الشرط الصفري"],["First conditional","If + present, will + base form: real future possibility.","الشرط الأول"],["Second conditional","If + past simple, would + base form: unreal present or future.","الشرط الثاني"],["Third conditional","If + past perfect, would have + past participle: unreal past.","الشرط الثالث"],["Mixed conditional","Combines times, e.g. past condition with present result ('If I had studied medicine, I would be a doctor now').","شرط مختلط"]]},{"h":["Reported speech","الكلام المنقول"],"pts":[["After a past reporting verb, tenses **shift back** one step (will → would), and time words change too (tomorrow → the next day).","بعد فعل نقل ماضٍ يرجع الزمن خطوة للوراء، وتتغير كلمات الوقت أيضاً."],["Backshift is **optional** when the statement is still true: 'He said the sun rises in the east.'","الإرجاع الزمني اختياري إذا كان الكلام ما زال صحيحاً."],["**Tell** needs a person object ('He told me'), while say does not ('He said that…').","الفعل tell يحتاج مفعولاً بشخص، أما say فلا يحتاجه."],["[[Reported questions|en.gr.reported]] use **statement word order** ('He asked where I lived', not 'where did I live'), and yes/no questions are introduced by if or whether.","السؤال المنقول بترتيب الجملة الخبرية، وأسئلة نعم ولا تبدأ بـ if أو whether."]],"t":[["Backshift","Moving a verb one tense back in reported speech after a past reporting verb.","الإرجاع الزمني"],["Reporting verb","A verb that introduces reported speech: say, tell, ask, explain, suggest.","فعل النقل"],["Reported question","An indirect question with statement word order, introduced by a wh-word or if/whether.","سؤال منقول"]]},{"h":["Articles and countable/uncountable nouns","أدوات التعريف والمعدود وغير المعدود"],"pts":[["Choose [[**a/an**|en.gr.articles]] by sound, not spelling (an hour, a university), and use **the** for something known, unique or specific.","نختار a أو an حسب النطق لا الكتابة، والأداة the للمعروف أو الفريد أو المحدد."],["Use the **zero article** with plural or uncountable nouns in general statements: 'Cats are clever.'","لا نستخدم أداة مع الجمع أو غير المعدود عند التعميم."],["'The life is hard' is [[**negative transfer**|en.gr.transfer]] from Arabic 'al-', which marks general meanings where English uses no article.","جملة The life is hard نقل سلبي من «ال» العربية التي تُستخدم للتعميم."],["Uncountable nouns such as information, advice, news and homework have no plural and take no a/an; count them with **partitives** (a piece of advice).","غير المعدود مثل advice لا يُجمع، ويُعدّ بتعبير تجزئة مثل a piece of."],["Use **many / a few** with countable nouns and much / a little with uncountable nouns.","نستخدم (many, a few) مع المعدود، أما (much, a little) فمع غير المعدود."]],"t":[["Zero article","Using no article, e.g. with plural or uncountable nouns in general statements.","غياب الأداة"],["Generic reference","Referring to a whole class of things rather than specific ones ('Dogs are loyal').","إحالة عامة"],["Uncountable (mass) noun","A noun with no plural form that cannot take a/an (water, advice).","اسم غير معدود"],["Partitive","An expression that counts an uncountable noun (a piece of, a cup of, a slice of).","تعبير التجزئة"]]},{"h":["The passive and relative clauses","المبني للمجهول وجمل الصلة"],"pts":[["The passive is formed with **be + past participle** and is used when the agent is unknown, unimportant or obvious.","المبني للمجهول من be مع التصريف الثالث، ويُستخدم حين يكون الفاعل مجهولاً أو غير مهم."],["Only [[**transitive**|en.ling.transitivity]] verbs have a passive, so '*The accident was happened' is wrong: 'happen' takes no object.","الفعل المتعدي وحده له مجهول، فلا نقول The accident was happened."],["Teach the passive through **process descriptions** (how paper is made) and news headlines, where the action matters more than the doer.","علّم المجهول بوصف العمليات وعناوين الأخبار حيث الحدث أهم من الفاعل."],["[[Relative clauses|en.gr.passrel]] are either **defining**, identifying the noun with no commas, or non-defining, adding extra information between commas and never with 'that'.","جملة الصلة المحددة بلا فواصل، وغير المحددة بين فاصلتين ولا تأتي معها that."],["Arab learners often add a **resumptive pronoun** inside the relative clause ('the book that I read it'), because Arabic uses one.","المتعلم العربي يضيف ضميراً عائداً في جملة الصلة لأن العربية تستخدمه."]],"t":[["Agentless passive","A passive sentence without a by-phrase because the agent is unknown or unimportant.","مجهول بلا فاعل"],["Defining relative clause","A relative clause that identifies which person or thing is meant; no commas.","صلة محددة"],["Non-defining relative clause","A relative clause adding extra information, set off by commas; 'that' is not used.","صلة غير محددة"],["Resumptive pronoun","An extra pronoun repeating the antecedent inside a relative clause ('*the man whom I met him').","الضمير العائد"]]}],"trap":[["Rule first, then examples = deductive (even if options say 'declarative' or 'formal').","استنتاجي"],["Non-contextualized drills are NOT good grammar practice.","بلا سياق = سيئ"],["PPP order: presentation comes first, production last.","العرض أولاً"]],"vid":[["w4MRaF0mw8Y","ar","تدريس القواعد","الدافورة",22],["5r-DRmN42fE","en","Different approaches to teaching language – PPP to TBL","Jo Gakonga",35],["kCxyVkTTjng","en","Help with CCQs","Jo Gakonga",3]],"map":{"title":["Who's who in grammar teaching","⁧أسماء وأطر في تدريس القواعد⁩"],"type":"cards","groups":[{"n":"Lesson frameworks","ar":"⁧أطر الدرس⁩","items":[{"n":"PPP","ar":"⁧عرض ← ممارسة ← إنتاج⁩","d":"en.gr.frames"},{"n":"TTT","ar":"⁧اختبار يكشف ما يعرفونه أولاً⁩"},{"n":"ESA","who":"Harmer","ar":"⁧شدّ ← دراسة ← تفعيل⁩"}]},{"n":"What grammar is","ar":"⁧أبعاد القاعدة⁩","items":[{"n":"Form – meaning – use","who":"Larsen-Freeman","ar":"⁧كيف تُبنى، ماذا تعني، متى تُستخدم⁩","d":"en.gr.fmu"}]},{"n":"Attention to form","ar":"⁧الانتباه للشكل⁩","items":[{"n":"Focus on form","who":"Long","ar":"⁧التفات عابر داخل التواصل⁩","d":"en.gr.fonf"},{"n":"Noticing","who":"Schmidt","ar":"⁧لا اكتساب بلا ملاحظة⁩"}]},{"n":"Input-based","ar":"⁧المدخلات قبل الإنتاج⁩","items":[{"n":"Processing Instruction","who":"VanPatten","ar":"⁧مدخلات مُهيكلة⁩","d":"en.gr.pi"},{"n":"Input enhancement","who":"Sharwood Smith","ar":"⁧عريض ولون وخط⁩"}]}]},"n":6},{"id":"L07","d":"P","std":"6.9.4","en":"Methods I: Traditional & Humanistic Methods","ar":"طرق التدريس 1: التقليدية والإنسانية","goal":["Identify each method by its theory, teacher role, use of L1 and skill focus.","تعرف كل طريقة بسماتها"],"sec":[{"h":["Approach, method and technique","المدخل والطريقة والأسلوب"],"pts":[["[[Anthony (1963)|en.meth.levels]] orders three levels from theory to the classroom: the approach (beliefs about language and learning) contains the method (an overall plan), and the method contains techniques (single activities) — not the reverse.","عند أنتوني: المدخل معتقدات، والطريقة خطة داخله، والأسلوب نشاط داخل الطريقة، لا العكس."],["Richards & Rodgers later renamed the levels approach, design and procedure; each method in this lesson can be recognised by its theory, the teacher's role, its use of L1 and its skill focus.","ريتشاردز وروجرز سمّوها مدخلاً وتصميماً وإجراءً، وكل طريقة تُعرف بنظريتها ودور المعلم واللغة الأم والمهارة."],["A teaching **strategy** is wider than a technique: it is a general plan of action that can combine several techniques to reach one learning goal.","الاستراتيجية أوسع من الأسلوب، فهي خطة عامة تجمع أكثر من أسلوب لتحقيق هدف."]],"t":[["Approach","Theoretical beliefs about the nature of language and language learning.","المدخل"],["Method","An overall plan for presenting language based on an approach.","الطريقة"],["Technique","A specific classroom activity consistent with a method.","الأسلوب"]],"map":{"type":"nest","title":["Anthony (1963) · Richards & Rodgers","⁧كل مستوى داخل الذي قبله⁩"],"axis":["Theory: beliefs","Classroom: one activity"],"groups":[{"n":"Approach","tag":"axiomatic · R&R: approach","ar":"⁧معتقدات عن طبيعة اللغة وكيف تُتعلّم⁩","d":"en.meth.levels"},{"n":"Method","tag":"procedural · R&R: design","ar":"⁧خطة منظمة لعرض اللغة مبنية على المدخل⁩","d":"en.meth.levels"},{"n":"Technique","tag":"implementational · R&R: procedure","ar":"⁧نشاط واحد داخل الصف يتّسق مع الطريقة⁩","d":"en.meth.levels","trap":"⁧الأسلوب داخل الطريقة، والطريقة داخل المدخل — لا العكس⁩"}]},"ex":[["Communicative beliefs (approach) → task-based unit plan (method) → today's information-gap activity (technique).","معتقد ← خطة ← نشاط"]]},{"h":["Grammar-Translation Method (GTM)","طريقة القواعد والترجمة"],"pts":[["The [[Grammar-Translation Method|en.meth.gtm]] is rooted in 18th–19th century Latin teaching and dominated language teaching in Europe from about the 1840s to the 1940s.","نشأت من تدريس اللاتينية، وسادت التعليم في أوروبا تقريباً من 1840 إلى 1940."],["Lessons are taught in the **mother tongue**: learners memorize grammar rules and word lists, then translate literary texts into and out of the target language.","الشرح باللغة الأم، والطالب يحفظ القواعد وقوائم الكلمات ويترجم نصوصاً أدبية."],["Its focus is reading and writing, so it **overlooks speaking** and ignores learners' unique abilities — the gap that the next method reacted against.","تركّز على القراءة والكتابة فتهمل الكلام والفروق الفردية، وهذا ما ثارت عليه الطريقة التالية."]],"t":[["Grammar-Translation Method","Teaching through L1 explanation, translation and explicit grammar rules; focus on reading and writing.","القواعد والترجمة"]]},{"h":["Direct Method: the first reaction","الطريقة المباشرة: أول رد فعل"],"pts":[["The [[**Direct Method**|en.meth.direct]], also called the **natural method**, was a **reaction against Grammar-Translation**: it imitates the way children learn their first language (Berlitz; Gouin's earlier Series Method).","الطريقة المباشرة أو الطبيعية رد فعل على الترجمة، وتحاكي تعلّم الطفل للغته الأم."],["The classroom uses the **target language only**, with no translation — the same principle as immersion — and puts **speaking and listening** first.","اللغة الهدف وحدها بلا ترجمة كما في الانغماس، والكلام والاستماع يأتيان أولاً."],["Concrete words are taught through objects, pictures and demonstration, and grammar is taught **inductively**: learners work out the rule from examples instead of hearing it explained.","المفردات المحسوسة بالأشياء والصور، والقاعدة يستنتجها الطالب من الأمثلة ولا تُشرح له."],["Its weak points — it needed teachers with native-like fluency and lacked a firm theoretical base — opened the way for a more 'scientific' oral method.","احتاجت معلماً طليقاً وافتقرت لأساس نظري متين، فمهّدت لطريقة شفهية أكثر علمية."]],"t":[["Direct Method","Teaching exclusively in the target language through demonstration and oral interaction.","الطريقة المباشرة"],["Immersion","Learning in an environment operating solely in the target language.","الانغماس"]]},{"h":["Audio-Lingual Method (ALM)","الطريقة السمعية الشفهية"],"pts":[["The [[Audio-Lingual Method|en.meth.alm]] (Fries, Lado) kept the Direct Method's oral focus but based it on **behaviorism** ([[Skinner|en.skinner]]) and structural linguistics: learning is **habit formation** through stimulus, response and reinforcement.","أبقت التركيز الشفهي وبنته على السلوكية: التعلم عادات تتكون بالمثير والاستجابة والتعزيز."],["Typical techniques are dialogue memorization (mim-mem), [[pattern drills|en.spk.drills]], **choral drilling** and minimal pairs, and errors are prevented early so that bad habits do not form.","حفظ الحوارات والتدريبات النمطية والترديد الجماعي، ومنع الخطأ مبكراً حتى لا يصير عادة."],["Grammar is learned from examples — **explicit rules are not provided** — and the skills follow a fixed order: **listening → speaking → reading → writing**.","القواعد تُفهم من الأمثلة بلا شرح، والمهارات بترتيب: استماع ثم كلام ثم قراءة ثم كتابة."]],"t":[["Audio-Lingual Method","A behaviorist method using dialogues and pattern drills to form language habits.","السمعية الشفهية"],["Habit formation","Learning through stimulus, response and reinforcement.","تكوين العادات"],["Mim-mem","Mimicry-memorization of dialogues.","تقليد وحفظ"]]},{"h":["Humanistic methods","الطرق الإنسانية"],"pts":[["After Chomsky's critique of behaviorism weakened ALM, [[humanistic methods|en.meth.humanistic]] became popular in the 1970s: they care about the learner's feelings and thinking, not only habits.","بعد نقد تشومسكي للسلوكية انتشرت طرق إنسانية تهتم بمشاعر المتعلم وتفكيره لا بعاداته فقط."],["In the **Silent Way** (Gattegno) the teacher stays mostly silent — but is not forbidden to speak — so **students speak more**, discovering the language with Cuisenaire rods and colour charts: 'teaching is subordinated to learning'.","المعلم صامت غالباً لا ممنوعاً من الكلام، فيتكلم الطلاب أكثر ويكتشفون اللغة بالمكعبات واللوحات."],["**Suggestopedia** (Lozanov) creates a relaxed setting with Baroque music and posters to remove the psychological barriers to learning.","الإيحائية تستعمل الاسترخاء وموسيقى الباروك والملصقات لإزالة الحواجز النفسية أمام التعلم."],["In **Community Language Learning** (Curran) the teacher is a **counselor**: learners speak in their L1, the teacher translates, and the recorded conversations are analysed later.","في التعلم الجماعي المعلم مرشد ناصح يترجم كلام الطلاب، ثم تُحلَّل المحادثات المسجّلة."]],"t":[["Silent Way","Teacher silence and learner discovery; teaching is subordinated to learning.","الطريقة الصامتة"],["Cuisenaire rods","Coloured rods used in the Silent Way.","مكعبات كويزنير"],["Suggestopedia (Desuggestopedia)","Learning in a relaxed state with music to lower mental barriers.","الإيحائية"],["Community Language Learning","A humanistic method where the teacher acts as a counselor.","تعلم اللغة الجماعي"]]},{"h":["Comprehension first: TPR and the Natural Approach","الفهم أولاً: الاستجابة الجسدية والمدخل الطبيعي"],"pts":[["ALM and its British counterpart, Situational Language Teaching (structures presented in situations through PPP), made learners produce language from the first lessons; comprehension-based methods reversed this: understand first, speak later.","السمعية الشفهية والموقفية تطلبان الإنتاج من أول الدروس، وطرق الفهم تؤخّر الكلام حتى يفهم المتعلم."],["In [[Total Physical Response|en.meth.tpr]] (Asher) students **respond to commands** with physical action — 'Listen and do', 'Simon Says' — so they show understanding before they speak.","في الاستجابة الجسدية ينفّذ الطالب الأوامر بحركة، فيُظهر فهمه قبل أن يتكلم."],["The [[Natural Approach|en.meth.natural]] (Krashen & Terrell) provides [[comprehensible input|en.sla-input]], allows a silent period and keeps the [[affective filter|en.sla-filter]] low by reducing anxiety.","المدخل الطبيعي يقدم مدخلات مفهومة ويسمح بفترة صمت ويخفض القلق ليكتسب المتعلم."]],"t":[["Total Physical Response (TPR)","Learners respond physically to spoken commands.","الاستجابة الجسدية"],["Natural Approach","Acquisition through comprehensible input in a low-anxiety setting.","المدخل الطبيعي"],["Situational Language Teaching","British oral approach presenting structures in situations (PPP).","التدريس الموقفي"]]}],"trap":[["The method that overlooks speaking = Grammar-Translation.","تهمل الكلام"],["Method aligned with behaviorism = Audio-Lingual.","السمعية الشفهية"],["'Teaching is subordinated to learning' = Silent Way.","الصامتة"],["Silent Way: students speak more — not 'the teacher is not allowed to speak'.","الطلاب أكثر كلاماً"]],"vid":[["ovu412wy-QE","ar","طرق تقليدية في تدريس اللغة","الدافورة",38],["JM25oVFZZQA","ar","مقدمة في طرق تدريس اللغة","الدافورة",29],["Pz0TPDUz3FU","en","Language Teaching Methods: Audio-Lingual Method","American English",23],["xqLzbLCpack","en","Language Teaching Methods: Silent Way","American English",17],["YuS3ku-PSL8","en","Language Teaching Methods: Comprehension Approach/TPR","American English",15],["3rkrvRlty5M","en","Language Teaching Methods: Suggestopedia","American English",23],["tx_we_P3Pic","en","Language Teaching Methods: Community Language Learning","American English",21]],"map":{"type":"flow","title":["Teaching methods in historical order","⁧الطرق بالترتيب التاريخي⁩"],"groups":[{"n":"Grammar-Translation","short":"GTM","ar":"⁧القواعد والترجمة⁩","who":"Plötz et al.","idea":"⁧1840s–1940s · باللغة الأم: قواعد وترجمة وقراءة وكتابة⁩","items":[{"n":"L1 + rules","d":"en.meth.gtm"}]},{"n":"Direct Method","short":"Direct","ar":"⁧المباشرة⁩","who":"Gouin · Berlitz","idea":"⁧رد فعل على الترجمة: اللغة الهدف فقط والقاعدة استقرائية⁩","items":[{"n":"target language only","d":"en.meth.direct"}]},{"n":"Audio-Lingual","short":"ALM","ar":"⁧السمعية الشفهية⁩","who":"Fries · Lado (Skinner)","idea":"⁧سلوكية وبنيوية: عادات بالتكرار وتدريبات الأنماط⁩","items":[{"n":"pattern drills","d":"en.meth.alm"},{"n":"Situational: Palmer, Hornby"}]},{"n":"Humanistic","ar":"⁧الإنسانية⁩","who":"Gattegno · Lozanov · Curran","idea":"⁧مشاعر المتعلم أولاً⁩","items":[{"n":"Silent Way"},{"n":"Suggestopedia"},{"n":"CLL"}]},{"n":"Comprehension first","short":"Listen first","ar":"⁧الفهم قبل الإنتاج⁩","who":"Asher · Krashen & Terrell","idea":"⁧استماع وفهم ثم كلام⁩","items":[{"n":"TPR"},{"n":"Natural Approach"}]}]},"n":7},{"id":"L08","d":"P","std":"6.9.4","en":"Methods II: Communicative & Modern Strategies","ar":"طرق التدريس 2: التواصلية والحديثة","goal":["Know CLT, TBLT, CBI/CLIL, cooperative learning, eclecticism and strategies for engagement and critical thinking.","التواصلي والحديث"],"sec":[{"h":["Communicative Language Teaching (CLT)","التدريس التواصلي"],"pts":[["[[CLT|en.meth.clt]] aims at [[communicative competence|en.sla-cc]] (Hymes): **linguistic competence plus the ability to use language appropriately** in real situations.","هدفه الكفاءة التواصلية عند هايمز: معرفة القواعد مع استخدام اللغة بشكل مناسب للموقف."],["Meaning comes before form, the teacher acts as a facilitator rather than a lecturer, and CLT is the **current dominant approach** in TESOL.","المعنى قبل الشكل، والمعلم ميسّر لا محاضر، وهو المدخل السائد اليوم في تدريس الإنجليزية."],["Early CLT courses followed the **functional (notional-functional) approach**: teaching is organised around [[functions|en.plan.syllabus]] such as requesting, apologising and inviting, not grammar forms (Wilkins).","المحتوى يُرتب بالوظائف كالطلب والاعتذار والدعوة، لا بالتراكيب النحوية."],["Because it depends on constant pair and group interaction, CLT particularly suits **extroverted** students.","يعتمد على التفاعل المستمر في الأزواج والمجموعات، لذلك يناسب الطلاب المنبسطين أكثر."]],"t":[["Communicative Language Teaching","An approach aiming at communicative competence through meaningful interaction.","التدريس التواصلي"],["Facilitator","A teacher who guides and supports learning rather than lecturing.","ميسّر"],["Notional-functional syllabus","A syllabus organized by notions and functions (Wilkins).","منهج المفاهيم والوظائف"],["Functional approach","Teaching organised around communicative functions such as requesting or apologising.","تدريس قائم على الوظائف"]]},{"h":["Task-, problem- and content-based learning","التعلم بالمهمة وبالمشكلات وبالمحتوى"],"pts":[["[[TBLT|en.meth.tblt]] emerged from the communicative approach (Prabhu's Bangalore project); in Willis' framework a lesson moves pre-task → task cycle → **language focus**.","التعلم بالمهمة خرج من التواصلي، ودرسه عند ويليس: ما قبل المهمة ثم دورتها ثم التركيز اللغوي."],["Projects in which learners produce posters, brochures or pamphlets are classed as **task-based learning**.","المشاريع التي ينتج فيها الطلاب ملصقات أو مطويات تُعد تعلماً بالمهمة.","o"],["When small groups acquire and apply knowledge to solve real-world problems, the approach is **problem-based learning**.","حين تحل مجموعات صغيرة مشكلات واقعية بمعرفة تكتسبها فهو تعلم بحل المشكلات.","o"],["[[Content-based instruction|en.meth.cbi]] teaches language through subject matter, as CLIL does; a course built on topics such as family, work and weather follows the **theme-based** model.","التعليم بالمحتوى يعلّم اللغة عبر مادة دراسية، والمبني على موضوعات كالأسرة والطقس نموذج موضوعي."],["Task-, theme- and content-based teaching are all **integrative** (integrated-skills) models, whereas **competency-based** teaching is organised around what learners can do in the language.","المهمة والموضوع والمحتوى نماذج تكاملية، وتدريس الكفايات يُبنى على ما يستطيع المتعلم فعله."]],"t":[["Task-Based Language Teaching (TBLT)","Learning through meaningful tasks with real-world outcomes.","التعلم بالمهمة"],["Problem-based learning","Groups acquire and apply knowledge to solve real-world problems.","التعلم بحل المشكلات"],["Content-Based Instruction (CBI)","Teaching language through subject-matter content.","القائم على المحتوى"],["CLIL","Content and Language Integrated Learning: content, communication, cognition, culture.","دمج المحتوى واللغة"],["Competency-based language teaching","Teaching organized around what learners can do in the language.","تدريس الكفايات"]],"map":{"type":"flow","title":["Willis's task-based framework","⁧إطار التعلم بالمهام عند ويليس⁩"],"groups":[{"n":"Pre-task","ar":"⁧ما قبل المهمة⁩","idea":"⁧تقديم الموضوع والمهمة والكلمات المفيدة⁩","items":[{"n":"topic"},{"n":"instructions"}]},{"n":"Task","ar":"⁧المهمة⁩","idea":"⁧أزواج أو مجموعات ينجزون المهمة والمعلم يتابع⁩","items":[{"n":"meaning first"}]},{"n":"Planning","ar":"⁧التخطيط⁩","idea":"⁧يجهزون عرض ما توصلوا إليه بدقة أكبر⁩","items":[{"n":"accuracy"}]},{"n":"Report","ar":"⁧العرض⁩","idea":"⁧يعرضون نتائجهم على الصف⁩","items":[{"n":"public use"}]},{"n":"Language focus","ar":"⁧التركيز اللغوي⁩","idea":"⁧تحليل لغة المهمة ثم تدريب عليها⁩","items":[{"n":"analysis"},{"n":"practice"}],"trap":"⁧التركيز على الشكل يأتي آخراً في التعلم بالمهام⁩"}]}},{"h":["Cooperative learning and engagement","التعلم التعاوني واندماج الطلاب"],"pts":[["[[Cooperative learning|en.meth.coop]] organises small groups with positive interdependence and individual accountability; it builds **critical thinking and problem-solving** and **interpersonal** skills and enhances negotiation of meaning.","مجموعات يعتمد أفرادها على بعضهم، تنمّي التفكير الناقد وحل المشكلات ومهارات التعامل والتفاوض على المعنى."],["Project work is **student-centred**, NOT teacher-centred: learners plan and produce the work while the teacher guides them.","المشروع متمحور حول الطالب لا المعلم: الطلاب يخططون وينتجون والمعلم يوجّه."],["Engagement rises with **learning by doing**, longer wait time and less teacher talk; Think-Pair-Share promotes **discussion**, and pair work fosters respect and friendship.","الاندماج يزيد بالتعلم بالعمل وقلة كلام المعلم، و«فكّر وزاوج وشارك» يشجع النقاش."],["Learners' anxiety is reduced when teachers act as **partners and mentors** who support them through the work.","يقل قلق الطلاب حين يكون المعلم شريكاً ومرشداً يدعمهم أثناء العمل.","o"]],"t":[["Cooperative learning","Small-group learning with positive interdependence and individual accountability.","تعلم تعاوني"],["Think-Pair-Share","Think alone, discuss with a partner, share with the class.","فكّر، زاوج، شارك"],["Learner-centred instruction","Students are the main focus; the teacher acts as a guide.","متمحور حول الطالب"],["Two Stars and a Wish","Peer feedback: two strengths and one improvement.","نجمتان وأمنية"]]},{"h":["Critical thinking","التفكير الناقد"],"pts":[["[[Critical thinking|en.meth.critical]] means students **evaluate propositions** — they analyse and judge ideas and arguments — rather than memorizing, translating or copying.","التفكير الناقد أن يقيّم الطالب الأفكار والحجج، لا أن يحفظ أو يترجم أو ينسخ."],["Questions such as 'What is an alternative conclusion?' and real issues such as 'crisis management' build [[higher-order thinking|en.obj.verbs]]: analysis, evaluation and creation.","أسئلة مثل «ما الاستنتاج البديل؟» وموضوعات كإدارة الأزمات تنمّي مهارات التفكير العليا."],["Teaching that relates to students' own feelings and beliefs is **more effective**, because learners have a personal reason to think and respond.","التدريس المرتبط بمشاعر الطلاب ومعتقداتهم أكثر فاعلية لأنه يعطيهم دافعاً شخصياً للتفكير."]],"t":[["Critical thinking","Analyzing and evaluating ideas and arguments to form judgments.","تفكير ناقد"],["Higher-order thinking skills (HOTS)","Analysis, evaluation and creation.","مهارات عليا"]]},{"h":["Modern approaches and trends","مداخل واتجاهات حديثة"],"pts":[["The biggest shift in modern TESOL is from the **teacher to the student**, and the ideal teacher combines linguistic and [[intercultural competence|en.l17-icc]].","أكبر تحول حديث من المعلم إلى الطالب، والمعلم المثالي يجمع الكفاءة اللغوية والثقافية."],["Instead of following one method, the [[**Eclectic method**|en.meth.postmethod]] chooses the most suitable — not the easiest — techniques from different methods; Kumaravadivelu's post-method pedagogy goes further, with particularity, practicality and possibility.","الانتقائية تختار الأنسب لا الأسهل من طرق مختلفة، وما بعد الطريقة يستبدل الطرق بثلاثة مبادئ."],["In a **flipped classroom** material is studied before class and class time goes to discussion and practice, while the **gamification** of lessons is a rising trend in TESOL.","في الصف المقلوب يدرس الطالب المادة قبل الحصة، والتلعيب اتجاه متزايد في التدريس."],["The **Socratic method** teaches through questions; a symposium is a structured discussion, and inquiry learning proceeds through questions and answers.","الطريقة السقراطية تعلّم بالأسئلة، والندوة نقاش منظم، والاستقصاء يقوم على السؤال والجواب."]],"t":[["Flipped classroom","Content is studied at home; class time is used for practice and discussion.","الصف المقلوب"],["Eclecticism","Selecting the most suitable techniques from various methods.","الانتقائية"],["Post-method pedagogy","Kumaravadivelu: particularity, practicality, possibility.","ما بعد الطريقة"],["Gamification","Using game elements to increase engagement.","التلعيب"],["Dogme ELT","Materials-light, conversation-driven teaching (Thornbury).","تدريس بلا كتاب"],["Facilitator teaching style","Grasha's style that encourages self-directed learning.","أسلوب الميسّر"]]}],"trap":[["TBLT emerged from the communicative approach (not the cognitive approach).","نشأ من التواصلي"],["Eclecticism = choose the most suitable, not the easiest.","الأنسب"],["Posters/brochures projects = task-based learning (official handbook).","بالمهمة"]],"vid":[["NVhJbzs0k0I","ar","أساليب حديثة في تدريس اللغة","الدافورة",36],["3kRT-rsKxn4","en","Language Teaching Methods: Communicative Approach","American English",20],["TI4V2LS8ekY","en","Task-Based Learning explained simply","Jo Gakonga",8]],"map":{"title":["Teaching Methods II","⁧التواصلي والاتجاهات الحديثة⁩"],"groups":[{"n":"Communicative Language Teaching","short":"CLT","ar":"⁧التدريس التواصلي⁩","items":[{"n":"Communicative competence","who":"Hymes","ar":"⁧معرفة المناسب للموقف⁩","d":"en.meth.clt"},{"n":"Notional-functional","who":"Wilkins","ar":"⁧منهج المفاهيم والوظائف⁩","d":"en.meth.clt"},{"n":"Four components","who":"Canale & Swain","ar":"⁧أربعة مكونات للكفاية⁩","d":"en.sla-cc"}]},{"n":"Task-Based","short":"TBLT","ar":"⁧التعلم بالمهام⁩","items":[{"n":"Bangalore project","who":"Prabhu · Long","ar":"⁧مشروع بنغالور⁩","d":"en.meth.tblt"},{"n":"Task cycle","who":"Willis","ar":"⁧مهمة ثم تركيز لغوي⁩","d":"en.meth.tblt"}]},{"n":"Content & CLIL","short":"CBI / CLIL","ar":"⁧التعلم بالمحتوى⁩","items":[{"n":"CBI","who":"Brinton et al.","ar":"⁧موضوعي ومحمي ومساند⁩","d":"en.meth.cbi"},{"n":"CLIL 4Cs","who":"Coyle","ar":"⁧محتوى وتواصل وإدراك وثقافة⁩","d":"en.meth.cbi"}]},{"n":"Cooperative","ar":"⁧التعلم التعاوني⁩","items":[{"n":"Cooperative","who":"D&R Johnson","ar":"⁧اعتماد متبادل ومسؤولية فردية⁩","d":"en.meth.coop"},{"n":"Jigsaw","who":"Aronson","ar":"⁧كل عضو خبير في جزء⁩","d":"en.meth.coop"}]},{"n":"Modern trends","short":"Trends","ar":"⁧اتجاهات حديثة⁩","items":[{"n":"Post-method","who":"Kumaravadivelu","ar":"⁧خصوصية وعملية وإمكان⁩","d":"en.meth.postmethod"},{"n":"Eclectic","ar":"⁧الأنسب لا الأسهل⁩","d":"en.meth.postmethod"},{"n":"Flipped","who":"Bergmann·Sams","ar":"⁧الشرح في البيت والتطبيق صفياً⁩","d":"en.meth.postmethod"}]}]},"n":8},{"id":"L09","d":"P","std":"6.9.3","en":"Assessment I: Types & Principles","ar":"التقويم 1: الأنواع والمبادئ","goal":["Know test types by purpose, formative vs summative, and Brown's five principles — especially washback.","أنواع الاختبارات ومبادئها"],"sec":[{"h":["Test, assessment and evaluation","الاختبار والتقويم والتقييم"],"pts":[["A **test** is a formal procedure for measuring ability or knowledge; [[**assessment**|en.assess.terms]] is the wider, ongoing process of gathering information about learning, and tests are only one part of it.","الاختبار إجراء رسمي للقياس، والتقويم عملية مستمرة لجمع المعلومات والاختبار جزء منها."],["**Evaluation** is wider still: it is a systematic judgment of the merit and worth of a learning process or programme.","التقييم أوسع منهما: حكم منظم على قيمة البرنامج أو العملية التعليمية."],["**Assessment information** is used to guide teaching and to modify programmes according to students' needs.","معلومات التقويم توجّه التدريس وتعدّل البرامج حسب احتياجات الطلاب.","o"]],"t":[["Test","A formal procedure for measuring ability or knowledge.","اختبار"],["Assessment","The ongoing process of collecting information about learning.","تقويم"],["Evaluation","A systematic judgment of the merit, value and worth of a programme or process.","تقييم"]]},{"h":["Diagnostic, formative and summative assessment","التقويم التشخيصي والتكويني والختامي"],"pts":[["By timing, assessment has three kinds: **Diagnostic** assessment is needed **prior to instruction**, formative assessment happens during learning, and **Summative** assessment comes at the end of a unit, term or programme, usually as a formal test.","حسب التوقيت: التشخيصي قبل التدريس، والتكويني أثناء التعلم، والختامي في نهاية الوحدة أو الفصل."],["[[Formative|en.assess.formative]] assessment gives ongoing feedback during learning **without interrupting instruction** — discussions, pop quizzes, exit tickets — so it is assessment for learning.","التكويني يعطي تغذية راجعة مستمرة دون أن يقطع التدريس، فهو تقويم من أجل التعلم.","o"],["**Pop quizzes** are short unannounced checks that roughly monitor progress and keep students on their toes.","الاختبارات المفاجئة القصيرة تتابع التقدم تقريبياً وتُبقي الطلاب منتبهين.","o"],["**Formal formative** assessment uses planned, recorded tasks (quizzes, worksheets) that are marked and returned with feedback; **Informal formative** assessment is on-the-spot observation, questioning or thumbs up/down, usually not graded.","التكويني الرسمي مهام مخططة تُصحح وتعاد بملاحظات، وغير الرسمي ملاحظة وأسئلة سريعة بلا درجات."],["So a teacher observing a role-play is doing **informal** assessment; summative tests are assessment of learning, and self-assessment is assessment as learning.","ملاحظة المعلم لتمثيل الأدوار تقويم غير رسمي، والختامي تقويم للتعلم، والذاتي تقويم كتعلم."]],"t":[["Formative assessment","Ongoing assessment during learning to improve it.","تكويني"],["Summative assessment","Assessment at the end of instruction to measure achievement.","ختامي"],["Pop quiz","A short unannounced quiz to check progress.","اختبار مفاجئ"],["Informal assessment","Spontaneous, unplanned assessment such as observation.","غير رسمي"],["Assessment for / of / as learning","Formative / summative / self-assessment & metacognition.","من أجل / للتعلم / كتعلم"],["Formal formative assessment","Planned, marked tasks during a unit used to give feedback and guide learning.","تقويم تكويني رسمي"]]},{"h":["Test types by purpose","أنواع الاختبارات حسب الغرض"],"pts":[["By purpose, a [[proficiency|en.assess.purpose]] test measures general ability and is not based on a particular course, while an **aptitude** test predicts a person's success in learning a language.","اختبار الكفاءة يقيس القدرة العامة بلا مقرر محدد، واختبار الاستعداد يتنبأ بالنجاح في تعلم اللغة."],["A **placement** test assigns learners to suitable levels, so it creates **homogeneous** (similar-level) groups.","اختبار التصنيف يضع الطالب في المستوى المناسب، فتتكوّن مجموعات متقاربة المستوى."],["A **diagnostic** test identifies learners' strengths and weaknesses so that teaching can target them.","الاختبار التشخيصي يكشف نقاط القوة والضعف ليركز التدريس عليها.","o"],["An **achievement** test measures learning of a particular course, while a progress test checks recently taught material.","الاختبار التحصيلي يقيس تعلم مقرر محدد، واختبار التقدم يقيس ما دُرّس مؤخراً."],["Surveys and questionnaires serve [[**needs** assessment|en.plan.needs]], and course evaluation is an **indirect** method because it reports opinions instead of showing performance.","الاستبانات لتقويم الاحتياجات، وتقييم المقرر طريقة غير مباشرة لأنه يجمع آراء لا أداء."]],"t":[["Proficiency test","Measures general language ability regardless of any course.","كفاءة"],["Placement test","Places learners in the appropriate level or programme.","تصنيف"],["Diagnostic test","Identifies learners' strengths and weaknesses.","تشخيصي"],["Achievement test","Measures how well course objectives were achieved.","تحصيلي"],["Progress test","Measures learning of recently taught material.","تقدم"],["Aptitude test","Predicts a person's success in learning a foreign language.","استعداد"]]},{"h":["Test formats and score interpretation","صيغ الاختبارات وتفسير الدرجات"],"pts":[["A score can be read in two ways: a [[norm-referenced|en.assess.nrt]] test compares test-takers with each other, while a **criterion-referenced** test compares each one with set objectives.","مرجعي المعيار يقارن الطلاب ببعضهم، ومرجعي المحك يقارن كل طالب بأهداف محددة."],["A [[discrete-point|en.assess.discrete]] test checks one language element at a time; an integrative test combines several skills, and an essay best evaluates integrated skills.","النقطي يقيس عنصراً واحداً، والتكاملي يجمع مهارات، والمقال أفضل لقياس المهارات المتكاملة."],["**Objective** items have one correct answer and are scored reliably and quickly (e.g. a gap-fill grammar test), while subjective tasks such as essays and interviews depend on rater judgment.","الأسئلة الموضوعية لها إجابة واحدة وتُصحح بسرعة وثبات، والذاتية تعتمد على حكم المصحح."],["Deleting words from a paragraph for students to restore is a **cloze test**, a classic integrative format.","حذف كلمات من فقرة ليكملها الطالب اختبار إكمال، وهو صيغة تكاملية معروفة."]],"t":[["Norm-referenced test","Interprets scores relative to other test-takers.","مرجعي المعيار"],["Criterion-referenced test","Interprets scores against fixed criteria or objectives.","مرجعي المحك"],["Discrete-point test","Tests one language element at a time.","نقطي"],["Integrative test","Tests several skills or components together.","تكاملي"],["Objective test","A test with one correct answer per item, scored without judgment.","موضوعي"],["Subjective test","A test scored by rater judgment (essays, interviews).","ذاتي"],["Cloze test","A text with deleted words that learners restore.","اختبار الإكمال"]]},{"h":["Principles of a good test and washback","مبادئ الاختبار الجيد والأثر الرجعي"],"pts":[["Brown's [[five principles|en.assess.principles]] of a good test are **practicality, reliability, validity, authenticity, washback**; a well-prepared exam is **valid and reliable**, and validity is the most important.","مبادئ براون الخمسة: العملية والثبات والصدق والأصالة والأثر الرجعي، والصدق أهمها."],["[[**Washback**|en.assess.washback]] is the impact of testing on teaching and learning, and it can be negative or positive.","الأثر الرجعي تأثير الاختبار على التدريس والتعلم، وقد يكون سلبياً أو إيجابياً."],["**Beneficial (positive) washback** happens when a good test encourages useful learning: a speaking test leads to more speaking practice in class.","الأثر الإيجابي أن يدفع الاختبار لتعلم مفيد، فاختبار المحادثة يزيد التدريب على الكلام."],["Portfolios and projects are [[**alternative / performance-based**|en.assess.alt]] assessment: portfolios track progress over time and usually bring high authenticity and positive washback.","ملف الإنجاز والمشاريع تقويم بديل يتابع التقدم عبر الزمن، وأثره الرجعي إيجابي غالباً."],["In **Peer assessment** learners judge a classmate's work against the teacher's criteria; in **self-assessment** they judge their own work.","في تقييم الأقران يقيّم الطالب عمل زميله بمعايير المعلم، وفي الذاتي يقيّم عمله."]],"t":[["Practicality","Ease of administration in time, cost and scoring.","العملية"],["Reliability","Consistency of results.","الثبات"],["Validity","The degree to which a test measures what it is intended to measure.","الصدق"],["Authenticity","Correspondence of test tasks to real-world language use.","الأصالة"],["Washback (backwash)","The effect of testing on teaching and learning.","الأثر الرجعي"],["Alternative assessment","Portfolios, journals, conferences, self/peer assessment.","تقويم بديل"],["Self-assessment","Learners evaluate their own work.","تقويم ذاتي"],["Peer assessment","Learners evaluate each other's work using shared criteria.","تقييم الأقران"],["Beneficial washback","A positive effect of a test on classroom teaching and learning.","أثر رجعي إيجابي"]]},{"h":["The CEFR: levels and can-do descriptors","الإطار الأوروبي المرجعي: المستويات وعبارات «أستطيع»"],"pts":[["The [[CEFR|en.assess.cefr]] (Council of Europe, 2001; Companion Volume 2020) is a reference framework — **not a test** — with six levels in three bands: basic (A1–A2), independent (B1–B2) and proficient (C1–C2).","الإطار مرجع وليس اختباراً، وفيه ستة مستويات في ثلاثة نطاقات: أساسي ومستقل ومتمكن."],["Its descriptors are positive **can-do statements** in an action-oriented approach; the 2020 Companion Volume added descriptor scales for mediation.","أوصافه عبارات إيجابية «أستطيع أن…»، وتحديث 2020 أضاف مقاييس وصفية للوساطة."],["Teachers use it to align curricula and tests, to write objectives, and to support learner **self-assessment**, for example with the European Language Portfolio.","يُستعمل لمواءمة المناهج والاختبارات وكتابة الأهداف ودعم التقييم الذاتي للطلاب."]],"t":[["CEFR","Common European Framework of Reference for Languages: six proficiency levels from A1 to C2.","الإطار الأوروبي المرجعي"],["Can-do statements","Positive descriptors of what learners can do in a language at a given level.","عبارات أستطيع أن"],["Basic / independent / proficient user","The three CEFR bands: A1–A2, B1–B2, C1–C2.","النطاقات الثلاثة"],["Action-oriented approach","The CEFR view of learners as social agents who use language to complete tasks.","منهج موجّه نحو الفعل"],["Mediation","Helping others understand a text or concept, or bridging between people — a CEFR mode of communication.","الوساطة"],["European Language Portfolio","A document in which learners record language experiences and self-assess against CEFR levels.","ملف اللغة الأوروبي"]],"map":{"type":"steps","title":["CEFR levels","⁧مستويات الإطار الأوروبي⁩"],"brackets":[{"from":0,"to":1,"n":"Basic user","ar":"⁧أساسي⁩"},{"from":2,"to":3,"n":"Independent user","ar":"⁧مستقل⁩"},{"from":4,"to":5,"n":"Proficient user","ar":"⁧متمكن⁩"}],"groups":[{"n":"A1","ar":"⁧مبتدئ⁩","tag":"everyday phrases"},{"n":"A2","ar":"⁧أساسي⁩","tag":"routine tasks"},{"n":"B1","ar":"⁧متوسط⁩","tag":"main points, travel"},{"n":"B2","ar":"⁧فوق المتوسط⁩","tag":"complex texts, spontaneity"},{"n":"C1","ar":"⁧متقدم⁩","tag":"implicit meaning"},{"n":"C2","ar":"⁧متمكن⁩","tag":"understands almost everything"}]}},{"h":["International standardized proficiency tests","الاختبارات الدولية المقننة"],"pts":[["A **standardized test** uses uniform conditions and scoring so that results compare across test-takers; the tests below are all **high-stakes** proficiency tests, so they create strong washback.","الاختبار المقنن موحّد الظروف والتصحيح، وهذه الاختبارات عالية التأثير فأثرها الرجعي قوي."],["[[**IELTS**|en.assess.intl]] has Academic and General Training versions, tests all four skills on a **band scale of 0–9**, and its speaking part is a face-to-face interview.","آيلتس أكاديمي وعام، يقيس المهارات الأربع من 0 إلى 9، والمحادثة مقابلة مباشرة."],["**TOEFL iBT** (ETS) tests academic English; speaking is recorded with no live examiner, and since 21 January 2026 scores use a 1–6 CEFR-aligned scale.","توفل أكاديمي، محادثته مسجّلة بلا ممتحن، ومنذ يناير 2026 مقياسه من 1 إلى 6."],["Cambridge exams each target one CEFR level: **A2 Key (KET)**, **B1 Preliminary (PET)**, B2 First, C1 Advanced and C2 Proficiency.","لكل اختبار من كامبريدج مستوى واحد: اختبار KET للمستوى A2، واختبار PET للمستوى B1."]],"t":[["Standardized test","A test given and scored in a consistent, predetermined way so scores are comparable.","اختبار مقنن"],["IELTS","International English Language Testing System: Academic and General Training versions, band scores 0–9.","آيلتس"],["TOEFL iBT","ETS's internet-based Test of English as a Foreign Language for academic settings; since January 2026 scored on a 1–6 band scale.","توفل"],["A2 Key (KET)","Cambridge exam at CEFR A2 (Key English Test).","اختبار كامبريدج A2"],["B1 Preliminary (PET)","Cambridge exam at CEFR B1 (Preliminary English Test).","اختبار كامبريدج B1"],["High-stakes test","A test whose results have important consequences (admission, jobs, visas).","اختبار عالي المخاطر"]]}],"trap":[["Testing's positive or negative impact on teaching = washback (very frequent).","الأثر الرجعي"],["Proficiency tests are not based on a particular programme.","الكفاءة بلا مقرر"],["Placement creates homogeneous (similar-level) groups.","متقاربة"]],"vid":[["sBOwSFW1zI8","ar","أنواع الاختبار: دليل شامل","الدافورة",35],["N-6l8ngi-w8","ar","ما هو الاختبار الجيد","الدافورة",29],["NJdtAM0bnZw","ar","التقويم البديل","الدافورة",25],["3R3jNzRgrXA","en","Principles of Language Assessment","Uni English 101",8]],"map":{"type":"tree","title":["Assessment: types and principles","⁧التقويم: أنواعه ومبادئ الاختبار الجيد⁩"],"groups":[{"n":"Timing","ar":"⁧حسب التوقيت⁩","idea":"⁧قبل التعلم وأثناءه وبعده⁩","items":[{"n":"Diagnostic","ar":"⁧قبل التدريس⁩","kw":["strengths & weaknesses"],"d":"en.assess.formative"},{"n":"Formative","who":"Black & Wiliam","ar":"⁧أثناء التعلم لتحسينه⁩","kw":["assessment for learning"],"d":"en.assess.formative"},{"n":"Summative","ar":"⁧في النهاية للحكم⁩","kw":["assessment of learning"],"d":"en.assess.formative"}],"trap":"⁧الاختبار القصير المفاجئ والبطاقة الختامية = تكويني⁩"},{"n":"Purpose","ar":"⁧حسب الغرض⁩","idea":"⁧ماذا نريد أن نعرف عن الطالب؟⁩","items":[{"n":"Proficiency","ar":"⁧قدرة عامة بلا مقرر⁩","kw":["IELTS","TOEFL"],"d":"en.assess.purpose"},{"n":"Placement","ar":"⁧تحديد المستوى⁩","kw":["homogeneous groups"],"d":"en.assess.purpose"},{"n":"Achievement","ar":"⁧ما تعلّمه من المقرر⁩","kw":["progress","final"],"d":"en.assess.purpose"},{"n":"Aptitude","ar":"⁧تنبؤ بالنجاح في تعلم اللغة⁩","d":"en.assess.purpose"}],"trap":"⁧الكفاءة لا ترتبط بمقرر معيّن⁩"},{"n":"Reference","ar":"⁧حسب المرجع⁩","idea":"⁧نقارن بالزملاء أم بالمعيار؟⁩","items":[{"n":"Norm","ar":"⁧مقارنة بالآخرين⁩","kw":["ranking"],"d":"en.assess.nrt"},{"n":"Criterion","ar":"⁧مقارنة بهدف ثابت⁩","kw":["cut score"],"d":"en.assess.nrt"}],"trap":"⁧المعياري المرجع = ترتيب، والمحكّي = إتقان⁩"},{"n":"Format","ar":"⁧حسب الصيغة⁩","idea":"⁧عنصر واحد أم مهارات مجتمعة؟⁩","items":[{"n":"Discrete","who":"Lado","ar":"⁧عنصر لغوي واحد⁩","kw":["discrete-point"],"d":"en.assess.discrete"},{"n":"Integrative","who":"Oller","ar":"⁧مهارات معاً⁩","kw":["cloze","essay","dictation"],"d":"en.assess.discrete"}],"trap":"⁧المقال يقيس المهارات المتكاملة⁩"},{"n":"Principles","ar":"⁧مبادئ الاختبار الجيد⁩","idea":"⁧خمسة مبادئ عند براون⁩","items":[{"n":"Practicality","ar":"⁧الوقت والتكلفة والتصحيح⁩","d":"en.assess.principles"},{"n":"Reliability","ar":"⁧نتائج متسقة⁩","d":"en.assess.reliability"},{"n":"Validity","ar":"⁧الأهم: يقيس ما وُضع له⁩","kw":["most important"],"d":"en.assess.validity"},{"n":"Authenticity","ar":"⁧مهام تشبه الواقع⁩","d":"en.assess.principles"},{"n":"Washback","ar":"⁧أثر الاختبار على التدريس⁩","kw":["backwash"],"d":"en.assess.washback"}],"trap":"⁧أثر الاختبار الإيجابي أو السلبي = washback⁩"}]},"n":9},{"id":"L10","d":"P","std":"6.9.3","en":"Assessment II: Validity, Reliability, Rubrics & Feedback","ar":"التقويم 2: الصدق والثبات والسلالم والتغذية","goal":["Distinguish types of validity and reliability, analytic vs holistic rubrics, and principles of feedback.","أنواع الصدق والثبات والتغذية"],"sec":[{"h":["Validity","الصدق"],"pts":[["[[**Validity**|en.assess.validity]] is the degree to which a test measures what it is intended to measure; when an assessment fails to measure what it is set for, it lacks validity.","الصدق أن يقيس الاختبار ما وُضع لقياسه، وإن لم يفعل فهو يفتقد الصدق."],["Content validity asks whether the items sample the course fairly, and it is supported by a [[**table of specifications**|en.assess.tos]] that links each item to objectives and content.","صدق المحتوى يدعمه جدول المواصفات الذي يربط كل سؤال بالأهداف والمحتوى."],["Construct validity is threatened when scores depend on something else — memory in a long listening test, or speed in a reading test.","صدق البناء يضعف إذا قاس الاختبار شيئاً آخر، كالذاكرة في الاستماع أو السرعة في القراءة."],["Criterion-related validity compares results with another measure — later performance (predictive) or another valid test given at the same time (concurrent) — while face validity means the test looks valid to test-takers.","الصدق المرتبط بمحك يقارن بمقياس لاحق أو متزامن، والظاهري أن يبدو الاختبار صادقاً للطلاب."]],"t":[["Content validity","The test adequately samples course content and objectives.","صدق المحتوى"],["Construct validity","The test measures the theoretical construct it claims to measure.","صدق البناء"],["Face validity","The test appears valid to test-takers.","صدق ظاهري"],["Predictive validity","The test predicts future performance.","صدق تنبؤي"],["Concurrent validity","Results agree with another valid measure given at the same time.","صدق تلازمي"],["Table of specifications","A blueprint linking items to content and objectives.","جدول المواصفات"]],"map":{"type":"fan","title":["Types of validity","⁧أنواع الصدق⁩"],"groups":[{"n":"Content","ar":"⁧يمثّل محتوى المقرر وأهدافه⁩","items":[{"n":"table of specifications"}],"d":"en.assess.validity"},{"n":"Criterion-related","ar":"⁧يتفق مع مقياس آخر أو يتنبأ بالأداء⁩","items":[{"n":"concurrent"},{"n":"predictive"}],"d":"en.assess.validity"},{"n":"Construct","ar":"⁧يقيس المفهوم نفسه لا غيره⁩","items":[{"n":"reading speed ≠ reading"}],"d":"en.assess.validity"},{"n":"Face","ar":"⁧يبدو مناسباً للمختبَرين⁩","d":"en.assess.validity"}]}},{"h":["Reliability","الثبات"],"pts":[["[[**Reliability**|en.assess.reliability]] is the extent to which a task consistently yields the same results; it is checked by test–retest, parallel forms, internal consistency or agreement between raters.","الثبات أن يعطي الاختبار نتائج متسقة، ويُقاس بالإعادة والصور المتكافئة والاتساق الداخلي واتفاق المصححين."],["**Inter-rater reliability** is checked by several teachers scoring the same work — not by a student and a peer — while intra-rater reliability is one rater staying consistent over time.","الثبات بين المصححين بأكثر من معلم لنفس العمل، والثبات الذاتي اتساق المصحح نفسه عبر الوقت."],["A test can be reliable without being valid, but it cannot be valid without being reliable, so consistency is a precondition for validity.","قد يكون الاختبار ثابتاً غير صادق، لكنه لا يكون صادقاً دون أن يكون ثابتاً."]],"t":[["Test–retest reliability","Giving the same test twice to the same learners.","إعادة الاختبار"],["Parallel-forms reliability","Comparing two equivalent versions of a test.","صور متكافئة"],["Internal consistency","Agreement among items (split-half, Cronbach's alpha).","اتساق داخلي"],["Inter-rater reliability","Consistency between different raters.","بين المصححين"],["Intra-rater reliability","Consistency of one rater over time.","المصحح نفسه"]]},{"h":["Rubrics, scoring tools and item formats","سلالم التقدير وأدوات التصحيح وأشكال الأسئلة"],"pts":[["A [[**rubric**|en.assess.rubrics]] grades work against criteria and level descriptions, and its main benefit is making criteria **clear** to students; a **checklist** only marks yes/no (present or absent), and a **rating scale** judges degree (e.g. 1–5).","سلّم التقدير معايير ومستويات توضح المطلوب، وقائمة الرصد نعم أو لا، وسلم الدرجات يقيس الدرجة."],["An **analytic** rubric gives a separate score for each criterion; a **holistic** rubric gives one overall score, and its limitation is that it gives no specific feedback.","التحليلي يعطي درجة لكل معيار، والكلي درجة واحدة للأداء كله لكنه لا يعطي تغذية محددة."],["Co-constructing a rubric with learners does not make standards easier; it helps them **view assessment as an effective educational tool**.","بناء السلّم مع الطلاب لا يسهّل المعايير، بل يجعلهم يرون التقويم أداة تعلم فعالة."],["An objective item has a **single correct answer** (the key) and wrong options called **distractors**; **multiple-choice** items are quick and objective to score but allow guessing and don't show productive ability directly.","السؤال الموضوعي له إجابة واحدة ومشتتات، والاختيار من متعدد سريع التصحيح لكن فيه تخمين."],["A classic **cloze** deletes every nth word (e.g. every 7th), so it is called a **fixed-ratio** cloze.","اختبار الإكمال التقليدي يحذف كلمة بعد كل عدد ثابت كالسابعة، فيسمى ثابت النسبة."]],"t":[["Rubric","A scoring guide with criteria and performance levels.","سلّم تقدير"],["Analytic rubric","Gives a separate score for each criterion.","تحليلي"],["Holistic rubric","Gives one overall score for the whole performance.","كلي"],["Stem / key / distractors","Question text / correct answer / wrong options.","جذع / مفتاح / مشتتات"],["Checklist","A list of behaviours marked only as present or absent.","قائمة رصد نعم/لا"],["Rating scale","A scale for judging the degree or frequency of a behaviour (e.g., 1–5).","سلم تقدير بالدرجات"],["Fixed-ratio cloze","A cloze test that deletes every nth word of a passage.","حذف كل كلمة رقم n"]]},{"h":["How to test each skill","كيف نختبر كل مهارة"],"pts":[["[[**Direct**|en.assess.direct]] testing asks candidates to perform the skill itself, while **indirect** testing measures underlying abilities — for example spotting errors to estimate writing.","المباشر أداء المهارة نفسها، وغير المباشر يقيس قدرات خلفها كاكتشاف الأخطاء لتقدير الكتابة."],["Direct tests suit productive skills because they reflect the real skill and create positive [[washback|en.assess.washback]]; speaking and writing are scored with a **rubric**, ideally by two raters, and writing needs a clear prompt (purpose, audience, length).","المباشر أنسب للمهارات الإنتاجية، يُصحح بسلّم تقدير ومصححين، والكتابة تحتاج تعليمات واضحة."],["**Listening** is tested with gap-fill, multiple choice, **information transfer** (map, table, form) and dictation; good evidence is **retelling or summarising** a talk — not tasks that test memory, spelling or reading.","الاستماع بتعبئة الفراغ وتحويل المعلومات، وأفضل دليل تلخيص ما سُمع لا مهام الحفظ أو القراءة."],["**Reading** is tested with true/false/not given, matching headings and short answers, and every item should need the text to be answered (**passage dependence**).","القراءة بصح وخطأ ومطابقة العناوين، وكل سؤال يجب ألا يُجاب إلا بقراءة النص."],["**Grammar & vocabulary** are tested with gap-fill, sentence transformation, word formation and the [[**C-test**|en.assess.ctest]]; because learners must **read** the damaged text, a C-test draws mainly on reading and overall proficiency.","القواعد والمفردات بالتحويل وتكوين الكلمات واختبار C، وهو يعتمد على القراءة والكفاءة العامة."]],"t":[["Direct test","A test in which candidates perform the actual skill being measured.","اختبار مباشر"],["Indirect test","A test that measures the abilities underlying a skill rather than the skill itself.","اختبار غير مباشر"],["Information transfer","A task where learners move information from a text or recording into a chart, map or form.","تحويل المعلومات"],["Passage dependence","The extent to which reading items can only be answered by reading the passage.","الاعتماد على النص"],["C-test","A reduced-redundancy test in which the second half of every second word is deleted.","اختبار C"]]},{"h":["Analysing test results to improve teaching","تحليل النتائج لتحسين التدريس"],"pts":[["After a test, item analysis checks each item's facility, discrimination and distractors, and descriptive statistics describe the results of the whole class.","بعد الاختبار نحلل كل سؤال بسهولته وتمييزه ومشتتاته، ونصف نتائج الصف بالإحصاء الوصفي."],["[[**Item facility (IF)**|en.assess.items]] is the number correct ÷ the total: 15 of 20 correct gives IF 0.75, and good items fall between about 0.15 and 0.85.","معامل السهولة عدد الإجابات الصحيحة على العدد الكلي، والجيد بين 0.15 و0.85 تقريباً."],["**Item discrimination (ID)** is (high-group correct − low-group correct) ÷ (½ × both groups), e.g. (8−2) ÷ 10 = 0.6; it ranges from −1 to +1, and a **negative** ID signals a **faulty item** to revise or remove.","التمييز يقارن الفئة العليا بالدنيا، والتمييز السالب يعني سؤالاً معيباً يُعدّل أو يُحذف."],["**Distractor analysis** shows how each wrong option worked: a distractor nobody chooses isn't working, and one that attracts high scorers may be ambiguous.","المشتت الذي لا يختاره أحد غير فعال، والذي يجذب المتفوقين قد يكون غامضاً."],["[[Descriptive statistics|en.assess.stats]] — mean, median, mode, range and **standard deviation** (spread) — show the class picture; if most students fail one objective, **reteach** it and keep records to plan remediation.","المتوسط والوسيط والمنوال والانحراف المعياري تصف الصف، والهدف الضعيف يُعاد تدريسه."]],"t":[["Item analysis","Examining each test item's facility, discrimination and distractors after a test.","تحليل الفقرات"],["Distractor analysis","Checking how many test-takers chose each wrong option and who chose it.","تحليل المشتتات"],["Mean","The arithmetic average of a set of scores.","المتوسط الحسابي"],["Median","The middle score when scores are put in order.","الوسيط"],["Mode","The most frequent score.","المنوال"],["Standard deviation","A measure of how far scores spread out from the mean.","الانحراف المعياري"],["Item facility","The proportion of test-takers answering correctly.","معامل السهولة"],["Item discrimination","An item's ability to distinguish high from low achievers.","معامل التمييز"]]},{"h":["Feedback","التغذية الراجعة"],"pts":[["[[Feedback|en.assess.feedback]] is information about performance that guides improvement, and it informs **both students and teachers**: students see how to improve, and teachers see what to reteach.","التغذية الراجعة تفيد الطالب في التحسن، وتفيد المعلم في معرفة ما يعيد تدريسه."],["Effective feedback is **timely, specific, clear, focused, balanced, helpful and impersonal**, and it is linked to the objectives, as constructive alignment (Biggs) requires.","التغذية الفعالة في وقتها، محددة وواضحة ومتوازنة وغير شخصية، ومرتبطة بالأهداف."],["**Content feedback** comments on ideas and meaning, while **form feedback** comments on language accuracy: grammar, vocabulary and mechanics.","تغذية المحتوى على الأفكار والمعنى، وتغذية الشكل على دقة القواعد والمفردات والكتابة."],["Effective teachers encourage long-term achievement through [[**self-evaluation**|en.assess.alt]], so that learners gradually learn to judge their own work.","المعلم الفعال يبني الإنجاز طويل المدى بتعويد الطلاب على تقييم أعمالهم بأنفسهم."]],"t":[["Feedback","Information given to learners about their performance to guide improvement.","تغذية راجعة"],["Content feedback","Comments on ideas and meaning.","على المحتوى"],["Form feedback","Com
