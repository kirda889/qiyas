window.EXPLAIN_EN = {"1hep3tu":"Extensive listening means listening to long passages for general understanding and enjoyment rather than for detail.","1a9mq13":"Intensive listening focuses on details and linguistic form, so it develops bottom-up processing skills.","16rw1fq":"Listening comprehension improves when input is meaningful, that is, understandable and relevant to the listener.","7jmw4r":"Tolerance of ambiguity means accepting unclear parts and continuing to listen without stopping to understand every word.","1si9vrf":"The Cornell method is a note-taking technique that organizes notes into structured sections.","1pkrk9a":"Pre-listening prepares learners by activating background knowledge and setting a purpose for listening.","1dcq50n":"On a first listening, learners listen for the gist (general idea); later listenings focus on details.","ul39vh":"Selective listening means picking out only the information relevant to a purpose from a long text, here by taking notes on the main points.","1ptysqa":"Podcasts are audio materials, so they are the tool most directly related to developing listening.","dom5or":"Compensation strategies fill gaps in understanding, for example by guessing missing information from context.","bzd7sc":"Total Physical Response links language to physical action: learners listen to commands and respond with movement.","uji4p4":"In a substitution drill, one word in a fixed pattern is replaced by a cue word, such as apples with bananas.","10crtf3":"A recast is implicit feedback in which the teacher repeats the learner's utterance correctly without pointing out the error.","bi1mru":"Elicitation is when the teacher pauses and prompts the student to complete the sentence and supply the correct form.","xsdd42":"Metalinguistic feedback reminds learners of the rule without giving the correct form directly.","yio8r3":"Selective correction means correcting only a few errors, here those related to the lesson aim, rather than every mistake.","gq6mc4":"In Corder's distinction, a mistake is a performance slip that the learner can self-correct when it is pointed out, unlike a systematic error.","1po03e6":"Giving an extended monologue, such as a short talk, is a speaking skill (sustained individual speech).","1cv1m3h":"Minimal pairs are word pairs that differ in only one sound, such as ship/sheep and pen/ben.","72rcxx":"Imperative drills use commands such as 'Stand up' with physical response.","1s8j21k":"According to Swain's Output Hypothesis, producing language by talking to others makes learners notice gaps in their L2.","1f6jmww":"Paraphrasing restates a sentence in different words while keeping the same meaning and similar length.","zqz1dw":"Critical reading involves evaluating and judging the text, as in deciding whether the author's argument is convincing.","wpveu8":"Schema activation means using existing knowledge about a topic to understand and interpret a new text.","1encq66":"Decoding, turning written symbols into sounds and words, is the first stage in learning to read.","1stgqz8":"Reading fluency instruction begins with direct instruction and teacher modeling of fluent reading.","k6ylj0":"K-W-L (Know, Want to know, Learned) charts connect learners' prior knowledge with new learning.","1my5h0u":"Reading only to find one specific figure is scanning.","1nfbmxc":"Productive vocabulary is words a learner can actively use in speaking and writing.","fuy00e":"Collocations are words that commonly occur together, such as 'make a decision' and 'heavy rain'.","8m1h6m":"According to Nation, knowing a word involves knowing its form, meaning and use.","1obohio":"Quizlet is a widely used website for practising vocabulary with digital flashcards.","1lo69c8":"The Lexical Approach sees language as grammaticalized lexis, made up of multi-word chunks rather than isolated words and rules.","1otu8g":"Incidental learning happens as a by-product of focusing on meaning, for example while reading.","268j00":"Idioms reflect a community's culture, so studying them is the best vocabulary route to understanding that culture.","1okbs6k":"Guessing from context is inferring the meaning of an unknown word from the words around it.","j3qrwl":"A semantic map places a word in the centre and links related words around it.","tes2jh":"The writing process runs from pre-writing to drafting to revising, and its phases are recursive.","xi39q5":"Chronological order arranges events in time sequence, signalled by 'first, then, after that, finally'.","pppr7k":"The concluding sentence restates the main idea and closes the paragraph.","zrju8k":"A list of common errors helps most when students revise and rewrite, because they can apply it to their own text.","xknz4u":"Effective writing feedback is clear and simple so learners can understand and act on it.","1vlbbph":"An introduction should be engaging so that it attracts the reader's interest.","uo2grs":"An essay has three main parts: introduction, body and conclusion.","fb0jy7":"Descriptive writing uses metaphors and sensory details to create a vivid picture for the reader.","qc9u52":"In the product approach, learners study and imitate a model text, with attention on the finished product.","cfwob0":"Brainstorming is generating many ideas on a topic before writing.","zbur3n":"Harmer's ESA framework has three elements: Engage, Study and Activate.","1geaqj0":"In Test-Teach-Test, the first test shows what students already know so the teacher can focus on what they need.","1mrc7w8":"Concept-checking questions test whether learners have understood the meaning of a structure, such as the past simple.","ijn4y6":"Larsen-Freeman describes grammar as having three dimensions: form, meaning and use.","1v2a2dp":"Focus on form briefly draws attention to grammar within a communicative task, rather than teaching it in isolation.","11lv0ue":"A lesson centred on structures is focusing on forms, the shapes of grammatical patterns.","hw028f":"A structure-based setting focuses on the language itself, teaching vocabulary and grammar explicitly.","1eqgews":"A timeline shows when events happen relative to each other, so it is especially useful for teaching tenses.","1io3sd3":"In the Silent Way the teacher stays mostly silent so that students do most of the talking.","1pidybj":"Cuisenaire rods and colour charts are the characteristic materials of the Silent Way.","trumj7":"Suggestopedia uses relaxation, comfortable chairs, Baroque music and posters to lower anxiety and boost learning.","1y8lp0i":"In Community Language Learning, the teacher acts as a counselor who supports learners rather than a traditional instructor.","y39s12":"A technique is a specific classroom activity, such as a dictation.","1phdhq5":"The Grammar-Translation Method treats all learners alike and does not take individual differences into account.","jhqepn":"The Audio-Lingual Method teaches grammar through patterns and examples, without explaining the rules.","1kdswlk":"The Grammar-Translation Method focuses mainly on reading and writing.","lj62ub":"The Natural Approach was developed by Krashen and Terrell.","19pyn7":"The Audio-Lingual Method relies on imitation, memorization, repetition and reinforcement.","bz6kcc":"TPR uses simple commands and movement, so it suits beginners and young learners.","3ip78u":"Competency-Based Language Teaching defines outcomes in terms of what learners can do with the language.","1h8fhu0":"Willis's TBL framework has three phases: pre-task, task cycle and language focus.","1bbvs0r":"The 4Cs of CLIL, which integrates content and language, are content, communication, cognition and culture.","1o8dx8c":"A theme-based model organizes a course around topics such as family, work and weather.","f8w9ot":"Cooperative instruction lets writers discuss and clarify ideas with peers, which strengthens negotiation of meaning.","1xcnvfl":"Crisis management requires analysis and judgment, so it is the most suitable topic for developing critical thinking.","19sw3bz":"The Socratic method uses a sequence of probing questions to lead students to discover ideas themselves.","l5r71c":"Asking learners to judge whether a story is believable and to justify it develops critical thinking.","yjtkly":"Kumaravadivelu's post-method pedagogy is built on three parameters: particularity, practicality and possibility.","1faxybv":"Linking learning to learners' feelings and beliefs (the affective side) makes teaching more effective.","1fkonua":"Class discussions, exit tickets and pop quizzes give ongoing feedback during learning, so they are formative assessment.","15ea6hj":"Objective items have a single correct answer, so they can be scored reliably and quickly.","vkmnee":"A norm-referenced test compares a student's performance with that of other test-takers.","la572z":"A criterion-referenced test measures performance against fixed objectives or a cut-off score.","1g969rr":"A cloze test needs several skills at once to restore missing words, so it is an integrative test.","1cwz5cm":"Brown's fifth principle of language assessment, after practicality, reliability, validity and authenticity, is washback.","a40hrb":"Proficiency, placement and achievement tests are classified by their purpose.","1366r1b":"Pop quizzes check progress during the course and keep students alert, a formative use.","1h41abw":"Evaluation judges the value or worth of a programme, going beyond measuring individual learners.","i9ggfr":"A short essay requires several skills at once, so it best combines language skills.","zrq73l":"Assessment for learning is formative assessment, used during teaching to support learning.","152bq0o":"Authenticity means test tasks resemble real-world language use.","bde8la":"Content validity means the test adequately samples the content and objectives of the course.","1k8lamz":"Face validity is when a test looks appropriate and right to test-takers.","yeibnw":"Predictive validity is how accurately a test predicts later performance, such as future success.","lys6qf":"An analytic rubric scores separate criteria, such as content, organization, grammar and vocabulary.","1etk27g":"A holistic rubric gives one overall score for the whole piece of writing.","ibx895":"Distractors are the incorrect options in a multiple-choice item.","ihe4za":"Reliability is necessary but not sufficient for validity: a test can be consistent without measuring the right thing.","1e4388h":"A table of specifications links test items to course content and objectives, which supports content validity.","18r6ue2":"Item discrimination shows how well an item separates high achievers from low achievers.","s66y0v":"Feedback works best when it is timely, specific and linked to the learning objectives.","hq0wl":"Giving two different forms of the same test to the same group measures parallel-forms reliability.","1px9e9t":"Constructive alignment means objectives, learning activities and assessment are matched to one another.","9qkglx":"A well-prepared exam must above all be reliable and valid.","7lj0fu":"In the revised Bloom's taxonomy, Create replaces Evaluation as the highest level.","um6pf6":"Synthesis is combining elements and materials to produce a new structure.","ubqdj":"Naming or recalling facts is the Knowledge level, the lowest level of Bloom's taxonomy.","efcau3":"Comparing and contrasting means breaking ideas into parts and examining relationships, which is Analysis.","19rg03m":"Judging and justifying a choice is Evaluation.","1ppn61i":"Benjamin Bloom classified the cognitive domain of educational objectives.","1hn6lzo":"Describing a topic involves knowledge and thinking, which belongs to the cognitive domain.","17qyqdu":"Outcomes describe what students should learn, so that is the question that matters when deciding them.","cmzzpy":"'Understand the plot' is a broad, hard-to-measure statement, so it is a learning goal rather than a specific objective.","1qfedm1":"This outcome names a specific structure and a concrete product, so it is specific and measurable.","hjh0vw":"In the ABCD model (Audience, Behavior, Condition, Degree), D stands for Degree: the level of mastery required.","1cmzp85":"Objectives should be learner-centred, describing what the learner will be able to do.","pr6ksu":"The SOLO taxonomy has five levels, from prestructural to extended abstract.","1ub3oj9":"Explaining in one's own words shows understanding, which is the Comprehension level.","1ekm40h":"Sequencing from simple to complex lets learners build on what they already know.","18ncpxw":"'I do, we do, you do' is gradual release of responsibility, moving from teacher modeling to independent student work.","1m2n2t1":"Backward design starts by identifying the desired results, then plans assessment and activities to reach them.","12cala7":"A structural syllabus is organized around grammar structures.","gwxkaj":"A curriculum is broader than a syllabus because it covers goals, content, methods and evaluation.","16yjlyh":"Needs analysis investigates learners' necessities, lacks and wants.","kwwqy":"Wait time is the pause after a question before a student is called on, giving learners time to think.","y1immu":"Lesson activities should be varied, flexible and coherent so they hold interest and fit together.","nq2bth":"Pre-, while- and post- stages structure lessons in receptive skills, i.e. listening and reading.","1bls6ym":"The wrap-up closes the lesson by summarizing key points and checking whether the objectives were met.","18ybhqh":"Scaffolding is temporary support that is gradually withdrawn as learners become competent.","qwdzbo":"Instruction-checking questions (ICQs) confirm that students understood the task instructions.","bfxjd4":"Blackboard is a virtual learning environment, an online platform for managing courses.","1wttvcz":"A live Teams lesson where everyone joins at the same time is synchronous learning.","daj4kv":"CALL stands for Computer-Assisted Language Learning, using computers to support language learning.","sl156n":"Redefinition is the top SAMR level: technology makes possible new tasks that were previously inconceivable, rather than just replacing or improving old ones.","cmfqgk":"Blended learning combines online digital media with traditional face-to-face classroom teaching.","5rahy0":"CALL software is judged mainly by how well it serves the teaching and learning process, not by its use in other contexts or its design.","1lk6p9t":"Adding, deleting, modifying, simplifying and reordering are the standard techniques of materials adaptation, used to make coursebook content fit learners' needs.","1tegl6r":"A fishbone diagram (Ishikawa diagram) is the graphic organizer that maps causes leading to an effect.","zxcwmf":"A textbook dialogue written for learners is non-authentic because it was created for teaching; menus, news sites and songs are real-world texts made for native audiences.","1kv14ao":"Kinesthetic learners learn best through physical, hands-on activity and movement.","1tm4uv9":"Group work requires learners to interact, negotiate and cooperate, which builds interpersonal (social) skills.","sx4ass":"Gardner's theory of Multiple Intelligences holds that people have several relatively independent kinds of intelligence, not one general ability.","m7mrzw":"Differentiated instruction adapts four elements to learner differences: content, process, product and learning environment.","jclsx2":"Anxiety is an affective (emotional) factor that influences learning; the other options are linguistic areas, not affective ones.","11rpre8":"The communicative approach relies on interaction and speaking, so it tends to suit outgoing, extroverted students best.","d1xo55":"Designing lessons around students' proficiency levels and abilities is planning based on learner differences.","hb6w89":"An auditory learner learns best by listening and discussing.","1umohcm":"The Ideal L2 self, the learner's vision of themselves as a successful L2 user, is a core component of Dörnyei's L2 Motivational Self System; the other options belong to Krashen and Chomsky.","10mho2w":"Intrinsic motivation is doing an activity for its own enjoyment, with no external reward.","1p0j6tx":"Assimilation is fitting new information into an existing schema without changing it, unlike accommodation, which changes the schema.","1nsm6l8":"The Zone of Proximal Development (Vygotsky) is the gap between what a learner can do alone and what they can do with help.","z8fveo":"Bruner is associated with discovery learning and the spiral curriculum, in which topics are revisited at increasing depth.","930nyz":"'The whole is greater than the sum of its parts' is the core principle of Gestalt psychology.","13cu9nu":"Cognitive development is the emergence of mental abilities and thinking skills.","1rtpo7y":"Bandura's social learning theory holds that people learn by observing and imitating models.","dvj412":"Chomsky argued that children are born with an innate Language Acquisition Device that helps them acquire language.","fvdzsv":"Cognitive development is the relevant field for effective teaching; the other options have nothing to do with how learners think and learn.","1fibtui":"For Krashen, acquisition is a subconscious process like L1 development, whereas learning is conscious knowledge of rules.","kuqy5u":"Long's Interaction Hypothesis says language develops through conversational interaction, especially negotiation of meaning.","16596kw":"In Swain's Output Hypothesis, producing language makes learners notice gaps in their knowledge.","byxnu4":"Schmidt's Noticing Hypothesis states that input must be consciously noticed to become intake.","179gni4":"Canale and Swain's model has four components: grammatical, sociolinguistic, discourse and strategic competence.","1w97yph":"According to Cummins, CALP, the language proficiency needed for academic study, usually takes about 5 to 7 years to develop.","fk5lf6":"Krashen's i + 1 means input slightly beyond the learner's current level (i) that is still comprehensible.","12sq8ov":"Syntactic bootstrapping is working out a word's meaning from its position and the sentence structure around it.","9d19rt":"Shyness and anxiety raise the affective filter, which blocks input and hinders acquisition.","asmguy":"Schumann's Acculturation Model says L2 success depends on the social and psychological distance between the learner and the target culture.","rdzbym":"Automaticity is performing a skill without conscious effort, after enough practice.","1e5g6q9":"Using 'before' for 'ago' mirrors the Arabic structure and produces an error, which is negative transfer from L1.","103i4iz":"Positive transfer happens when a structure shared by L1 and L2 helps the learner produce it correctly.","44rqgr":"Interlanguage is the learner's developing system that lies between L1 and L2.","o0k93i":"Fossilization is when errors become permanent and stop developing despite further instruction or exposure.","1tiff2r":"A bilingual is a person who is fluent in two languages.","dc2acl":"Fluency, accuracy and complexity describe cognitive aspects of language performance, so they are classed as cognitive factors.","15uid7n":"English taught where it is not the community language, as in Saudi Arabia, is EFL (English as a Foreign Language).","lus9mx":"Switching between two languages within one conversation is code-switching.","181f9p0":"Teachers should accept that learners will sometimes use their native language, rather than banning it or never expecting it.","nb2rl1":"Intralingual errors come from the target language itself, for example overgeneralizing its rules, rather than from L1 interference.","aajxcy":"Contrastive analysis explains learners' difficulties by comparing L1 and L2.","qz6t0w":"EAP stands for English for Academic Purposes.","1frwo50":"Honeymoon, frustration, adjustment and adaptation are the stages of culture shock experienced when adapting to a new culture.","uijut6":"Displacement is the feature that lets language refer to things not present in the immediate environment, such as past or future events.","dt8opc":"Creativity (productivity) lets speakers produce and understand an unlimited number of new messages.","1etiyq5":"The link between a linguistic form and its meaning is generally arbitrary: there is no natural connection between the word and the thing.","chi8cw":"Duality means language combines meaningless sounds into meaningful units, giving two levels of structure.","1q3qtx5":"The main problem with theories of language origin is that they lack scientific evidence, since early language left no record.","14kxet3":"Language is defined as a set of signals and symbols used for communication.","16234k":"Linguistics is the scientific study of language.","af9974":"A prescriptive rule tells people how language should be used, such as 'Don't split infinitives'; descriptive rules only describe actual usage.","1orz9g3":"An accent refers only to differences in pronunciation, whereas a dialect also differs in grammar and vocabulary.","qdnvoa":"The Norman Conquest of 1066 brought many French words into English.","b1fcdv":"Shakespeare wrote in Early Modern English, which came after Middle English.","10noxkf":"In Kachru's model, countries like Saudi Arabia where English is a foreign language belong to the Expanding circle.","w9uouf":"Linguistics is the field that studies language and its application to language learning.","15u4xvm":"The transactional function of language is exchanging information, as opposed to the interactional function of maintaining social relations.","1mvhvvw":"Saussure distinguished 'langue', the abstract language system, from 'parole', actual individual language use.","1kpvhrg":"'Alcohol', 'algebra' and 'sugar' are words English borrowed from Arabic.","zy6p72":"Phatic communication is language used only to keep social contact, like small talk about the weather, rather than to exchange information.","1sgv626":"After a voiceless sound (/s/ in 'kissed', /k/ in 'asked'), the regular -ed ending is pronounced /t/.","1ywbnjh":"'Information' has four syllables: in-for-ma-tion.","qub0mg":"Kinesics is the study of gestures and body movements in communication.","64ewxs":"A branch is a part of a tree, a part-whole relationship called meronymy.","1s66dm":"Hearing is only receiving sound, while listening means understanding and interpreting the message.","1emfe8m":"Attending is the stage of the listening process in which the listener focuses attention on the message.","zqsohu":"Hesitations, false starts and fillers are performance variables (Brown), features of natural speech that make listening harder.","8x7qoo":"'Gonna', 'wanna' and 'whatcha' are reduced forms of fuller expressions, which challenge L2 listeners.","1swuxm3":"Retelling a familiar story makes the language easier to follow, so learners can concentrate on understanding the events and enjoy them.","13o7rft":"'Firstly', 'on the other hand' and 'to sum up' are signposts that show listeners the structure of a lecture.","1ocr5sr":"Critical listening means analyzing and evaluating a message before accepting or rejecting it.","bxwc38":"Referential questions are genuine, open-ended questions that seek new information and promote real communication.","cy27ne":"The teacher gives hints to draw out the word 'bus driver' from students, which is eliciting.","i1xjn4":"Speaking to a live audience that can react only a little is partially interactive speaking.","1jvxuvc":"Story retelling gives beginners repeated practice with familiar content, which makes speaking easier.","874lx7":"In a one-on-one oral interview, the teacher should focus on whether the content of the learner's answers is correct, not on accent, tone or body language.","1pwjzr":"Teenagers' difficulty with foreign sounds is most often due to self-consciousness, the embarrassment of sounding different, rather than physical or learning problems.","atlwoy":"Moving the stress in 'present' between noun and verb changes both the pronunciation and the meaning, but not the spelling.","58erzn":"Broca's area is the brain region mainly associated with speech production; Wernicke's area is linked to comprehension.","1u6h5no":"Games motivate learners mainly because they include competition.","yetk7a":"Learners with dyslexia mainly need to improve word recognition in order to understand a text.","1ih7iwy":"Skimming means reading quickly to get the general idea, as when overviewing a chapter.","bnnb14":"Maps, graphs and pictures that support a text are pictorial aids.","l1539a":"Matching headlines to stories before reading focuses students on the main idea of each text.","14171fa":"An English-English dictionary exposes learners to English definitions and examples, which best expands their vocabulary in English.","19v3yrs":"Blending is the phonics skill of combining individual sounds to form a word; segmenting is the opposite, splitting a word into its sounds.","12mmj58":"Words taught in isolation lack context; a sentence shows a word's meaning and function (how it is used), which is why context-based teaching is recommended.","1pelytd":"A flashcard is a simple memory tool with a prompt or question on one side and the answer on the other.","uwrgod":"A gap-fill sentence where the learner must supply a suitable word from the surrounding context tests vocabulary in context.","etdzw1":"Voice is the writer's own personality and opinions coming through in the writing, which is what emphasising learners' own opinions develops.","1j34hta":"Reflective writing, such as a journal, lets learners respond to their experiences, feelings or ideas.","1jz3a64":"'Writing to learn' uses writing as a tool for learners to represent and express their own understanding, not mainly to communicate with readers.","1dwsgqx":"The abstract is the brief summary of a research paper's methodology and main findings.","11rpd0g":"Controlled writing restricts what learners may write, as when they must rewrite a passage in a given tense; free writing leaves the choices open.","mnbzem":"Spelling, punctuation and grammar are micro (lower-level) writing skills, while organisation and purpose are macro (higher-level) skills.","7yabeh":"A cycle graph shows the ordered steps of a process, so it suits the outline stage of a process essay.","ti4g59":"An action that began six months ago and is still in progress uses the present perfect continuous with 'for': 'has been looking ... for six months'.","1luai9t":"'me' is wrong because it is the subject of 'saw' in the relative clause, so the subject form 'I' is needed.","5khzg3":"'Simon Says' links spoken commands to physical action, which is the core of Total Physical Response.","nx111g":"Gouin and Berlitz are associated with the Direct Method, which teaches the target language directly without translation.","1oapxpb":"The Grammar-Translation Method was dominant from the mid-18th to the late 19th century, long before modern communicative methods.","faf0d4":"English is now taught mainly as a medium of international communication, not to imitate native speakers.","bpvv77":"Think-Pair-Share has learners think alone, discuss with a partner, then share, so it promotes discussion.","1wcq4gq":"Pair work is a cooperative activity in which students interact closely, which builds respect and friendship.","ircob1":"'Two Stars and a Wish' is a peer feedback technique: two positive comments and one suggestion for improvement.","m08sjd":"The CALLA model's phases are preparation, presentation, practice, evaluation and expansion.","qztzka":"Teachers should use different teaching techniques to suit varied learners rather than one method, activity or resource for everyone.","18vmyq5":"Surveys and questionnaires given before a course gather learners' wants and lacks, so they are needs assessment.","xbve6r":"Course evaluation surveys collect opinions about the course rather than measuring performance directly, so they are an indirect method.","1lh5cxq":"Assessment means comparing a student's performance with a set standard and analysing it to judge its quality.","rlmle9":"Giving the same test twice to check consistency of results is test-retest, a way of measuring reliability.","lk8gzu":"Evaluation is a systematic process of judging the merit and worth of a learning process against criteria.","9h8azd":"Holistic scoring gives one overall score, so it does not give explicit feedback on specific areas such as grammar or organisation.","z7io8h":"Feedback on ideas and meaning is content feedback, while feedback on language errors is form feedback.","8xx1uq":"Carefully considering a course's objectives, procedures and content helps establish its validity, i.e. that it measures and teaches what it should.","8e3zaj":"Effective feedback should be clear, specific, well-timed and impersonal, not delayed, vague or just a grade.","1ors245":"Learning goals should be explained to learners before and during teaching so that they know what they are working towards.","1hma92u":"Objectives are explained to clarify expectations, motivate initiative and assure equal access, not to imply the curriculum is fixed and suggestions will be ignored.","y9oj4s":"The teacher writes learning objectives because he or she plans and knows the lesson and learners.","17lt0n1":"The learning outcome is what learners should be able to do after an activity.","48ixb1":"'Be aware of' is a vague outcome that cannot be observed or measured, so it is a weak outcome.","96m0q1":"A skeleton work plan is only an outline, so it contains general information, not detailed or specific information.","1xqe842":"Needs analysis is carried out by designing, conducting and analysing instruments such as questionnaires.","1nh7oa7":"The aim comes first in planning: asking 'What will I achieve?' guides all other lesson decisions.","1mx1iv6":"Teachers adapt the curriculum to learners' abilities by implementing various teaching strategies rather than replacing it.","1k5jip6":"Topics from social media connect to learners' real interests, which makes language learning more relevant to them.","1m34tue":"Posting random personal updates has no learning purpose, whereas searching, writing an assigned blog or a task-based chat serve instruction.","1wvn507":"Logical learners make lists, organise themselves and look for relationships between ideas.","482sym":"A text with culturally inappropriate content conflicts with Saudi students' culture, so they will not take it seriously; cultural appropriateness matters.","d460vn":"A visual learner learns better from pictures and images.","141fhi3":"Nativists (innatists) regard feedback as useful but unable to change the natural sequence of development, while behaviorists make reinforcement the basis of learning.","ypk9sx":"The interactionist theory says meaningful conversational input from teachers and peers leads to acquisition of grammar and vocabulary.","1wu9ras":"The functional approach holds that humans develop language mainly because they need to communicate.","m1g5j":"Behaviorism trains learners by reinforcement to achieve the desired behaviour, not by discovery or critical thinking.","14haw5w":"Adult L2 learners rarely reach native-like grammatical competence, unlike children acquiring their L1.","1hsykuj":"First language acquisition is an instinct, while second language learning usually needs motivation.","15ibjh":"Discourse competence is the ability to produce a cohesive and coherent text from a series of utterances.","19yorbb":"Communicative competence is knowing what to say and how to say it appropriately in each situation.","u7hf58":"Learners with the same L1 background generally show similar developmental sequences and errors.","1tik96m":"Good teachers move from the familiar to the unfamiliar, starting with aspects of learners' own culture before explaining foreign ones.","qz205y":"Competent English teachers raise students' awareness of different varieties of English instead of hiding them.","1wtgws9":"'Give me a piece of paper' is a blunt command that is too direct for speaking to a teacher, so it is a register error (wrong level of formality).","1t8s4vu":"An isogloss is a line on a map marking the boundary of an area where a particular language feature is used.","1ki4n1n":"The most frequent everyday words come from Old English, which is Germanic; Latin is the source of many words in the dictionary overall, not of the most used.","doddd7":"Neurolinguistics studies the relationship between language and the brain.","onvxlt":"A pidgin is a simplified language formed from existing languages for communication between people with no common language; a creole develops from it later.","1y93juh":"The suffix -ic derives adjectives, as 'metallic' comes from 'metal'.","hminc":"'Ouch' is an interjection, a word expressing sudden emotion or reaction.","jkpk5s":"'Male' and 'female' are opposites in a complementary way (one excludes the other), which is antonymy.","1agmclf":"Predicting, checking over repeated listenings and reflecting on strategies follows planning, monitoring and evaluation, which develops metacognitive awareness of listening (Vandergrift).","1to4zkk":"Field criticises the 'comprehension approach', in which playing a recording and checking answers only tests listening instead of teaching it.","1xz9r6y":"Checking whether one's prediction was correct is monitoring and evaluating one's own comprehension, a metacognitive strategy; the others are bottom-up processing.","1moc7nh":"'Decide' is stressed on the second syllable (de-CIDE), as many two-syllable verbs are.","1etfjmr":"The verb is stressed on the second syllable, reCORD, while the noun is REcord, so stress distinguishes word class.","1nzajtp":"A falling tag asks for confirmation of something the speaker already believes, while a rising tag is a real question.","1gqx5rn":"Yes/no questions typically have rising intonation, whereas wh-questions, commands and statements usually fall.","2wh13k":"Moving stress to 'YOUR' to contrast it with another person's pen is contrastive stress.","14ysu15":"Current research on pronunciation for international communication sets intelligibility, being understood, as the goal rather than a native-like accent.","15d7qgo":"The 4/3/2 technique repeats the same talk under shrinking time limits, which builds fluency.","fvgu43":"In the Lingua Franca Core, /θ/ and /ð/ are outside the core, while vowel length, initial clusters and nuclear stress are part of it.","3zb8dz":"Extensive reading uses easy texts that learners can read fluently, so texts above learners' level contradict Day & Bamford's principles.","107whqm":"Teaching individual sounds and then blending them to read a word is synthetic phonics.","1fgv2le":"Rereading the same short passage to read faster and more smoothly each time is repeated reading, which builds fluency.","oz1ciq":"Nation's four strands are given roughly equal time in a balanced programme: meaning-focused input, meaning-focused output, language-focused learning and fluency development.","1lj7b7b":"For comfortable, unassisted reading, learners should know about 98% of the running words, with 95% as a minimum.","17q1i5z":"Knowing a word's meaning but not its collocations, pronunciation or derived forms is a lack of depth, i.e. quality of knowledge, not breadth, the number of words known.","ecm6ef":"Learners discovering patterns in concordance lines from a corpus are using data-driven learning.","og8iib":"Coxhead's Academic Word List contains 570 word families common across academic texts; the 2,000 most frequent words are the GSL.","3c3pzt":"Marking the location or type of error with a code without supplying the correct form is indirect corrective feedback.","oqhh43":"Truscott argued in 1996 that grammar correction in L2 writing is ineffective and should be abandoned, and Ferris replied in 1999.","13w7pf":"Correcting only one error type, such as articles, is focused feedback.","11y7rcn":"In the teaching-learning cycle, writing a text together with the teacher precedes independent writing, and this stage is joint construction.","16gcwg4":"The process-genre approach (Badger & White) combines knowledge of text types (genre) with the drafting and revising stages of the writing process.","nkfii2":"A writing conference is a short individual meeting in which the teacher discusses a draft with the student.","1ugv0y6":"The first conditional uses if + present simple with 'will' in the main clause; 'will' is not used after 'if'.","1c6g0as":"A concept-checking question tests understanding of meaning, and the second conditional describes an imaginary situation, so asking whether I have the money now checks this.","1s6t6su":"The third conditional describes an unreal past situation, so she did not study and did not pass.","1orxr47":"The zero conditional (if + present, present) expresses general truths such as scientific facts.","3uudjq":"In reported questions the verb takes statement word order without 'did', and the tense shifts back: 'where I lived'.","1p837xs":"'Tell' needs a personal object ('told me'), whereas 'say' does not take the person directly.","avlztw":"Arabic uses the definite article with abstract and generic nouns, but English uses none, so 'The honesty' is negative transfer from Arabic.","9snvem":"'Advice' is uncountable, so it has no plural form, cannot take a/an and cannot be used with 'many'.","4e7bdt":"'Happen' is an intransitive verb, so it cannot be put into the passive; 'happened' is the correct active form.","1df7v2z":"Describing processes, such as how dates are picked, packed and exported, is a natural context for the present simple passive because the focus is on the action, not on who performs it.","nc7a69":"A non-defining relative clause adds extra information about an already identified noun and is separated by commas, as in 'who lives in Abha'. The other clauses are defining and need no commas.","1qe9vhg":"In Arabic relative clauses a resumptive pronoun is kept ('the book that I read it'), and the learner transfers it into English. This is L1 transfer, not an agreement or article error.","1eo1wl3":"Input enhancement (Sharwood Smith) makes target forms more noticeable in the input, for example by bolding them, so learners notice them.","1oyc0az":"Processing Instruction gives brief explicit information and then structured input activities, in which learners must attend to the form to get the meaning, before any production.","964cvz":"These abilities (main points of clear speech, most travel situations, simple connected text) describe B1, the first level of the independent user.","1w0k0fe":"In the CEFR, A levels are basic users, B levels (B1 and B2) are independent users, and C levels are proficient users.","vco8ae":"The CEFR is a framework of reference that describes six proficiency levels. It is not a test and not a Cambridge exam.","1ujytms":"CEFR can-do descriptors reflect an action-oriented approach: they describe what learners can do with the language as social agents.","14yjd99":"The 2020 Companion Volume added descriptor scales for mediation, as well as a Pre-A1 level.","1nebajz":"A2 Key (KET) is the Cambridge exam aimed at CEFR level A2, whereas PET (B1 Preliminary) targets B1.","1ubsfwv":"IELTS has Academic and General Training versions and reports results on a 0-9 band scale.","282f0q":"IELTS speaking is a live face-to-face interview with a human examiner, while TOEFL iBT responses are recorded and scored separately.","4kq6sp":"An indirect test measures underlying abilities, such as spotting errors in multiple-choice sentences, instead of asking learners to perform the skill itself by actually writing.","18cb02a":"Information transfer means moving information from the recording into another form, here completing a map while listening to directions.","1h8hbin":"Passage dependence means an item can be answered only by reading the passage. An item answerable from general knowledge lacks it.","1prcgvi":"Item facility is the number of correct answers divided by the number of test-takers: 15 / 20 = 0.75, a relatively easy item.","1fdty2i":"ID = (8 - 2) / 10 = 0.6, since half the total in both groups is 10. This is a good discrimination value.","1pf5u7y":"When more low-achieving than high-achieving students answer correctly, the item has negative discrimination, which signals a flawed item that should be revised or removed.","1u1m7xs":"A distractor that nobody chooses is not working, because it attracts no one, so it should be revised or replaced.","1blyioq":"Item analysis shows which objectives were not mastered, so the teacher should reteach that objective and adjust instruction.","1m0uhxi":"A terminal (unit-level) objective states the final outcome of the whole unit, here writing an 80-word invitation email.","fd5gip":"In Mager's model the criterion states how well the performance must be done, here 'at least four correct'.","9g93zo":"In Mager's model the condition states the circumstances under which the performance occurs, here 'Given a map'.","145mkk4":"WALT (learning intention) and WILF (success criteria) communicate to students what they will learn and how success will be judged.","y0fk4f":"An exit ticket is a short written response collected at the end of a lesson to check whether students reached the objective.","1dvmj44":"The SIOP model requires each lesson to have content objectives and language objectives.","10g96hg":"The revised Bloom's knowledge dimension has four types: factual, conceptual, procedural and metacognitive.","1ky10ar":"A scheme of work distributes the syllabus content across the weeks of a term. A lesson plan covers one lesson only.","50dbcf":"A situational syllabus is organised around real-life situations such as 'at the airport' or 'at the restaurant'.","euhc2p":"A task-based syllabus is organised around tasks and activities, such as planning a trip, rather than around language items.","5q5v15":"A lexical syllabus (Willis) is built on high-frequency words, collocations and lexical chunks.","ffshb4":"In Wilkins's terms a synthetic syllabus presents language in separate parts, one item at a time, which learners put together gradually.","o6iixo":"A spiral curriculum (Bruner) revisits the same topic at increasing levels of depth across grades.","1yykz5e":"Backward design starts with the desired end result, then decides the evidence (rubric), and only then chooses the activities.","1wb47ao":"The 5E model runs Engage, Explore, Explain, Elaborate, Evaluate, starting with engagement and then exploration.","1qz57me":"Extending means adding more material of the same kind, here six more comparative practice items.","1rtoqyq":"Expanding means adding a new element the coursebook lacks, here a pronunciation stage.","196o33u":"Simplifying means making the language or structure easier, here by using shorter sentences and more frequent words.","mh6jkq":"Reordering means changing the sequence of coursebook activities, here doing vocabulary before the reading text.","axwzg7":"Replacing means substituting more suitable material for the original, here a text about a family trip to AlUla.","1wh6jfl":"Predictive evaluation judges a coursebook before use, for example with a checklist. Retrospective evaluation happens after use.","wxcysb":"Training learners to keep vocabulary notebooks, use dictionaries and set goals gives them the tools for independent learning.","xz9ll":"A learning contract is an agreement setting out the student's own goals, tasks and deadlines, which makes the student responsible for learning.","1v12sh0":"Madrasati is the Ministry of Education's official national platform for virtual classes, assignments and tests.","h96mn6":"Tiered tasks keep one objective for everyone but offer different levels of support, such as sentence starters or an open version.","vq7i4a":"A gifted student needs curriculum compacting and enrichment or advanced projects in place of mastered content, not more of the same exercises.","n1nyyh":"Pre-teaching key vocabulary and giving a graphic organizer supports a struggling reader before the task.","lgjdpr":"Field-independent learners focus on details, analyse rules well and prefer form-focused tasks.","1bsbo70":"An interest inventory is a short questionnaire about learners' hobbies and topics, used to adapt lesson content.","qaxuxf":"Dyslexia involves persistent difficulty decoding words, so multisensory techniques, clear fonts and extra time are suitable supports.","1gc60pn":"In the preproduction stage (the silent period) the learner understands but rarely speaks, responding by pointing or nodding.","1l16keb":"At early production, learners answer in one or two words, so either/or and who/what/where questions are suitable.","t23fj6":"Speech emergence is the stage where learners use simple sentences in short conversations, still with many errors.","d9nu69":"In Oxford's classification, memory, cognitive and compensation strategies are direct strategies because they work with the language itself.","scfqkd":"Planning study time, setting goals and evaluating progress are metacognitive strategies.","4oblxh":"Describing a thing when the word is forgotten ('the thing you use to cut paper') is a compensation strategy that makes up for a gap in knowledge.","h82qvp":"SILL is Oxford's Strategy Inventory for Language Learning, a questionnaire measuring strategy use.","ae12cp":"In Skill Acquisition Theory (DeKeyser), practice moves learners from declarative knowledge (knowing the rule) to procedural knowledge and automatic use.","1i0jt1v":"World Englishes (Kachru) recognises varieties such as Indian and Nigerian English as legitimate rather than as errors.","15ljrfw":"In ELF communication between non-native speakers, the aim is mutual intelligibility, not native-like standards.","1twcepi":"Byram's ideal outcome is the intercultural speaker, who mediates between cultures, rather than an imitation of the native speaker.","8wu05v":"Translanguaging uses all of the learners' languages as resources, for example planning in Arabic and presenting in English.","1di1yzw":"Kumaravadivelu's post-method principles such as 'maximize learning opportunities' are called macrostrategies.","11iihzr":"Native-speakerism (Holliday) is the belief that native speakers are automatically the best English teachers.","pshu5i":"Medgyes argued that non-native teachers have been through the same learning experience, so they can anticipate difficulties and model successful learners.","1cuivdt":"Action research is a cycle of planning, acting, observing and reflecting, here applied to low participation.","13ub5q3":"Reflection-in-action (Schon) means adjusting the lesson while it is happening. Reflection-on-action comes afterwards.","yzr8vl":"Hard CLIL teaches the subject itself, such as science, entirely in the foreign language.","pkbhv3":"Big C culture covers major achievements such as Shakespeare's plays, while little c culture covers everyday life such as greetings.","l4b8fo":"In Cortazzi and Jin's terms, source culture is the learners' own culture, here Jeddah's historic district and Saudi customs.","aw860l":"The bow-wow theory says words began as imitations of natural sounds such as 'cuckoo' and 'splash'.","1s1aom1":"The pooh-pooh theory says language began with instinctive emotional cries such as 'Ouch!'.","1lih5y":"Upright teeth, flexible lips, a lowered larynx and a lateralized brain are physical features cited by the physiological adaptation view of language origin.","1lz3lv9":"The genetic source view (innateness hypothesis) holds that humans are born with a special capacity for language.","nar6pr":"In Saussure's terms the sound-image is the signifier and the concept it evokes is the signified.","pj31p6":"Synchronic linguistics studies a language at one point in time, such as today, without reference to its history.","z8vte2":"Words that can replace 'cat' in the same position (dog, bird) are in a paradigmatic (substitution) relation, unlike syntagmatic relations along the sentence.","i06bxu":"Reflexiveness is the ability to use language to talk about language itself.","1sy57es":"Prevarication is the design feature that lets humans lie or talk about imaginary things.","eccsg1":"A rhotic accent, such as General American, pronounces /r/ in 'car' and 'hard'. RP is non-rhotic.","yn7iz7":"Bottom-up processing builds meaning from sounds, words and grammar, so it draws on grammatical (linguistic) competence. Top-down processing relies on background knowledge and context.","1eafgrd":"Understanding spoken instructions and putting them in order before acting is primarily a listening skill.","acpelp":"Adjacency pairs and discourse markers organise turn-taking and link speech, so they mainly develop speaking and conversation management.","1lmrm7f":"Silent reading is faster and focuses on meaning, so it builds reading fluency (speed with comprehension). Reading aloud serves pronunciation accuracy.","1txnn2n":"Using clues inside the text, such as prefixes, roots, suffixes, grammar and discourse markers, is a bottom-up strategy.","1c3nwv5":"Each text type has typical tense, vocabulary and register, so knowing its features guides the writer's choices.","1pprivs":"Freewriting generates ideas before drafting, like brainstorming, so it belongs to the pre-writing stage.","13unm9y":"A persuasive essay takes a position and supports it with facts, logic and expert opinion. An expository essay only explains.","sxoqw5":"This contrast, described by Kaplan as contrastive rhetoric, concerns how ideas are linked and the text is organised, that is, cohesion.","1mnoof3":"Arabic joins long sentences with 'wa' and uses fewer full stops, and learners transfer this habit into English run-on sentences.","1yrjffl":"A topic about coming plans naturally requires the target form 'be going to' for the future, whereas past events or routines need other tenses.","1fdwlfa":"The Direct Method rejects translation and teaches through the target language only, imitating how children acquire their mother tongue, so it is called the 'natural method'.","1cnqly5":"The task has a real purpose, an information exchange and a checkable outcome, so it is a communicative activity rather than mechanical drilling.","17nuvff":"In a jigsaw each learner masters one part and then teaches it to the home group, so everyone depends on the others.","ieeyzc":"Retelling or summarising a talk shows that the student understood what was heard. The other options measure writing or reading.","1isyfn2":"A C-test is a damaged written text, so learners must read it and reconstruct the missing half-words, which tests reading and general proficiency.","1eqef3c":"A lesson objective should fit the lesson, be tied to its topic and use an observable, measurable verb such as 'use', not 'appreciate' or 'know'.","1xjm8d2":"Giving the syllabus at the start informs students of the content, schedule and expected learning outcomes.","rb9hg0":"Reflection is the phase after implementation in which the teacher judges what worked and adjusts later teaching.","1203l0k":"Real communication uses the skills together, so an integrated-skills programme develops the four skills together within lessons.","1fw5hzn":"Google Docs allows several students to write and edit the same document online at the same time, which suits collaborative assignments.","eh0awd":"Grammarly checks written text for grammar, spelling and style, so it mainly supports writing.","178zntg":"The spelling checker finds misspelled words and suggests corrections. The thesaurus gives synonyms and word count gives length.","m6u3h0":"In collectivist cultures students often avoid standing out alone, so they are reluctant to ask questions in front of the whole class.","mv898n":"Immediate criticism in front of peers raises anxiety and makes students avoid participating, unlike praise, wait time and building on answers.","1kl49cp":"In Chomsky's terms, performance is the actual use of language in real situations, including slips. Competence is the implicit knowledge of the system.","gbwsn9":"Ecological theory sees writing as shaped by the writer's place, community and local context, while cognitive theory focuses on mental processes.","19413f8":"Correcting his own error shows metalinguistic awareness: he knows the rule and monitors his language. The error was a performance slip, not lack of competence.","1ol6fn0":"Krashen's Affective Filter Hypothesis says anxiety and low motivation raise the filter and block input, while confidence and motivation lower it.","12ofyvy":"When L1 differences keep causing negative transfer and the errors are never noticed or corrected, they may become permanent, which is fossilization.","1n5picr":"The clearest differences between British and American English are in vocabulary (lift/elevator), followed by spelling and pronunciation. Grammar and word order are very similar.","rqgsmt":"The -en plural in 'oxen' and 'children' is a remnant of an Old English plural ending that survives in a few words.","gz8d2":"An interesting topic holds learners' attention so they follow and understand more. The other factors do not affect engagement as much.","184jehm":"Writing expected questions from the title before playing the recording is prediction and preparation, so it is a pre-listening activity.","swf6a5":"Acting out an extended conversation in assigned characters is role-play, which combines language practice with enjoyment.","dtw5c5":"During role-play the teacher acts as a facilitator, monitoring and supporting while delaying correction, not taking over or interrupting.","1frsil9":"Phrases that ask for repetition or help fix communication breakdowns are repair strategies, part of strategic competence.","6hin6a":"Starting from prior knowledge and interests and focusing on overall meaning before details is a top-down approach.","my7sy4":"Tracking linking words and reference such as 'however' and 'this' and what they connect develops recognition of text cohesion.","1uei695":"Repeated encounters (recycling) make a word easier to recall, whereas a single meeting is not enough.","111o43k":"Writing, studying, practising and reviewing each new word over the week is a routine for building vocabulary.","qir0yh":"Words that come to mind with the same topic, like 'sand', 'camel' and 'hot' for 'desert', are linked by association, not synonymy or antonymy.","3z7oyp":"Complete beginners need key words first, from which they build short simple sentences before moving to more demanding writing.","1azlu8v":"'Understand' cannot be observed or measured directly, while list, label and identify are behavioural verbs.","1hqpxij":"An introverted student usually feels most comfortable with quiet individual work such as an independent project.","4nxbnu":"Chomsky's generative grammar rests on an innate language capacity, which is the innatist (nativist) view.","1b4d5lq":"Krashen's Acquisition-Learning Hypothesis distinguishes subconscious acquisition, like a child's, from conscious learning.","1tdw3oa":"A course designed around the specific language needs of cabin crew at work is English for Specific Purposes (ESP).","1cnfye0":"In the 5 R's framework, Reasoning means explaining an event by linking it to theory or literature, such as Vygotsky's ZPD.","1dee8bd":"Arbitrariness, rapid fading and displacement are all Hockett's design features. Generalization, receptiveness and imitation are not on his list.","1nx079d":"Language is systematic because it follows rules and patterns at every level: sounds, words and sentences.","qpkbsp":"American English prefers the -ed past participle (learned), while British English sometimes uses -t (learnt).","183o95g":"Settlers from England took their language overseas to America and then Australia, where each variety developed locally.","owrrl95":"/b/ is bilabial and /d/ is alveolar, while both are voiced stops, so the difference is in place of articulation only.","o1khvfmm":"/t/ is a stop: the air is completely blocked and then released. /u/ is a vowel, /j/ a semivowel, and /s/ a fricative with only partial obstruction.","o8dpcjt":"Guessing meaning from context is a reading strategy learners should master. Memorization is not a reading strategy, and the other options relate to pronunciation or writing.","o1wq5im4":"A teacher who acts as a partner and mentor lowers anxiety by showing that mistakes are part of learning.","oe9hysw":"Errors like 'rided' and 'goed' are developmental: they follow a regular pattern and show the learner is forming rules, so the student is learning.","ogy9m3y":"The transactional function of language is passing on information. The interactional function is for social relationships.","o1jluvxm":"Theories of the origin of language are speculative and lack scientific evidence.","o83azca":"The relationship between linguistic form and meaning is arbitrary. Onomatopoeia is a small exception.","o15t9nfr":"Displacement is the ability to refer to things not present in the immediate environment, including things whose existence is uncertain.","o13zsc9q":"'If you study hard' is a conditional clause that cannot stand alone, so it is a dependent clause.","od5po0q":"Adverbs modify verbs, adjectives and other adverbs, but not nouns.","oeb2hap":"'Cheating' is an -ing form with no tense, so it is a non-finite verb.","omzieyh":"The vowel /uː/ in 'two' is produced high in the mouth, at the back, with rounded lips: a high back vowel.","ogeli6x":"'Reopened' has three morphemes: re- + open + -ed.","o16zhchp":"'Young' could modify only 'boys' or both 'boys and girls', so the sentence is syntactically ambiguous.","oyk7i8f":"Presupposition is what a speaker assumes to be true or known by the listener.","o14ga8t2":"Negative transfer is the negative influence of the L1 on the L2.","o1wsowwy":"Before listening, the teacher should set a listening objective. Verifying predictions and evaluating comprehension come after listening.","o1fvlbmh":"Reading word by word in order and stopping at every unknown word is bottom-up processing.","o1d3ttdw":"Among these options, drafting is the earliest stage of the writing process.","o1yrqohk":"Immersion is an environment in which only the target language is used.","o2a5z0l":"Drawing the object on the whiteboard is the easiest and clearest way to present 'snake', whereas a real snake is impractical and a definition is harder for learners.","o1mh6nyi":"A good objective is specific and observable and suits beginners, such as listening in order to follow directions.","oof3zfl":"In an effective lesson, presentation comes first, followed by practice, then expansion and evaluation.","o16dmpyw":"A needs analysis collects information about learners' interests and abilities to design a lesson.","o1tpospi":"/l/ is a liquid consonant, along with /r/.","ow68bm6":"Projects that produce a real outcome, such as posters and brochures, are examples of task-based learning.","o103zbdn":"In problem-based learning, small groups acquire and apply knowledge to solve real-world situations.","ocnceov":"A diagnostic test identifies learners' strengths and weaknesses and what still needs to be learned.","o1kup6ac":"Pop quizzes are short surprise tests that let teachers roughly monitor progress and keep students alert.","o1hb1gi9":"Formative assessment monitors performance regularly without interrupting instruction time.","ofnqi31":"Assessment information is used to guide teaching and to modify programmes in response to students' needs and abilities."};

  DORDER.forEach((d,i)=>{const want=i===DORDER.length-1?60-out.length:Math.round(60*(DOM[d].w||1)/tw); out=out.concat(shuffle(pool.filter(q=>q.d===d).map(q=>q.id),9100+i).slice(0,want))});
  if(out.length<60) out=out.concat(shuffle(pool.filter(q=>!out.includes(q.id)).map(q=>q.id),9199).slice(0,60-out.length)); return shuffle(out,9200)}

function save(){

async function pushRemote(){
  if(!dbRef) return;
  if(remoteBusy){remotePending=true;return}
  remoteBusy=true;
  try{await dbRef.set(JSON.parse(JSON.stringify(S))); syncOn=true}catch(e){if(e&&e.code==="invalid_argument"){dbRef=null;syncOn=false}}
  remoteBusy=false; renderSync();
  if(remotePending){remotePending=false;pushRemote()}
}
async function pullRemote(){
  if(!dbRef) return;
  try{
    const snap = await dbRef.get();
    if(snap.exists){const r=snap.data(); if(r&&r.v===1&&(r.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(freshState(),JSON.parse(JSON.stringify(r)));S.exam=EXAM_DEFAULT;try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){};render()}
      else if((S.updatedAt||0)>(r&&r.updatedAt||0)) pushRemote();}
    else if(S.updatedAt) pushRemote();
    syncOn=true; renderSync();
  }catch(e){}
}
async function initRemote(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    dbRef = db.doc("data/users/"+uid+"/progress");
    await pullRemote();
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pullRemote()});
  }catch(e){}
}

  st.a++; if(correct) st.c++; st.last = correct?1:0;
  if(!correct){st.b=0; st.due=todayStr()}
  else if(st.b!=null){st.b=Math.min(st.b+1,5); st.due=addDays(todayStr(),INT[st.b])}
}
function reviewDue(){const t=todayStr();return QS.filter(q=>{const s=S.q[q.id];return s&&s.b!=null&&s.b<5&&s.due<=t})}

function domainStats(d){
  const qs=QS.filter(q=>q.d===d); let att=0,cor=0,mast=0;
  qs.forEach(q=>{const s=S.q[q.id];if(s){att+=s.a;cor+=s.c;if(s.last===1)mast++}});
  return {total:qs.length,mast,acc:pct(cor,att),att};
}

function planTasks(){

    .concat([

      {id:"rev1",type:"review",t:"مراجعة أخطاء المحاكي 1",s:"مراجعة الأخطاء + إعادة قراءة فخاخ أضعف درسين"},
      {id:"mock2",type:"test",t:"الاختبار المحاكي 2",s:"88 سؤالاً جديداً"},
      {id:"rev2",type:"review",t:"مراجعة أخطاء المحاكي 2",s:"الأخطاء + البطاقات المستحقة"},
      {id:"mock3",type:"test",t:"الاختبار المحاكي 3",s:"آخر محاكاة قبل الاختبار"},
      {id:"final",type:"final",t:"خلاصة الفخاخ",s:"كل الفخاخ في صفحة واحدة + نصائح يوم الاختبار"}
    ]);
}
function taskDone(t){
  if(t.type==="lesson") return !!(S.lessons[t.id]&&S.lessons[t.id].done);
  if(t.type==="test") return !!S.tests[t.id];
  return !!S.tasks[t.id];
}
function buildPlan(){
  const tasks=planTasks();
  const span = S.exam ? Math.max(1, diffDays(S.start,S.exam)) : 29;
  const lessons=tasks.filter(t=>t.type==="lesson"), head=tasks.filter(t=>t.id==="diag"||t.id==="official"), tail=tasks.filter(t=>t.type!=="lesson"&&!head.includes(t));
  let days=[];
  if(span>=tasks.length){
    days = tasks.map(t=>[t]);
    const extra = span-tasks.length;
    for(let i=0;i<extra;i++) days.splice(days.length-6,0,[{id:"buf"+i,type:"review",t:"يوم مراجعة",s:"مراجعة الأخطاء + البطاقات المستحقة"}]);
  } else {
    let tailDays = span>=12 ? tail.map(t=>[t]) : [[tail[0]],[tail[2]],[tail[4],tail[5]]];
    if(span<6) tailDays=[[tail[0],tail[5]]];
    const lessonDays=Math.max(1, span-1-tailDays.length);
    const per=Math.ceil(lessons.length/lessonDays);
    const ld=[]; for(let i=0;i<lessons.length;i+=per) ld.push(lessons.slice(i,i+per));
    days=[head].concat(ld,tailDays);
  }
  return days.map((ts,i)=>({n:i+1,date:addDays(S.start,i),tasks:ts}));
}
function nextTask(){const t=planTasks().find(t=>!taskDone(t));return t||null}

async function mzGet(btn){const M=window.MZ; if(!M){toast("الملزمة غير متاحة الآن");return}
  try{if(btn)btn.disabled=true; toast("جاري تجهيز الملزمة…"); const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    const key=await crypto.subtle.importKey("raw",ub(M.k),"AES-GCM",false,["decrypt"]); const ct=await (await fetch(M.src)).arrayBuffer();
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(M.iv)},key,ct); const u=URL.createObjectURL(new Blob([pt],{type:"application/pdf"}));
    const a=document.createElement("a"); a.href=u; a.download=M.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000); if(window.QXEV)QXEV("mulzama")}
  catch(e){toast("تعذّر التحميل، جرّب مرة ثانية")} finally{if(btn)btn.disabled=false}}

const SHEET_N=60;
const SHEET=(function(){const ls=LESSONS.filter(l=>l.trap&&l.trap.length), w=l=>(STDW[l.std]||1)/LESSONS.filter(x=>x.std===l.std).length;
  const tw=ls.reduce((a,l)=>a+w(l),0); const q=ls.map(l=>Math.min(l.trap.length,Math.max(1,Math.floor(SHEET_N*w(l)/tw))));
  let left=SHEET_N-q.reduce((a,b)=>a+b,0); while(left<0){const i=q.indexOf(Math.max(...q)); q[i]--; left++}
  const ord=ls.map((l,i)=>i).sort((x,y)=>w(ls[y])-w(ls[x])); while(left>0){let moved=false; for(const i of ord){if(left>0&&q[i]<ls[i].trap.length){q[i]++;left--;moved=true}} if(!moved)break}
  return Object.fromEntries(ls.map((l,i)=>[l.id,l.trap.slice(0,q[i])]));})();

    case "cardYes": case "cardNo":{const id=fc.ids[fc.i]; const st=S.terms[id]||(S.terms[id]={b:0});
      if(a==="cardYes"){st.b=Math.min((st.b||0)+1,5); st.due=addDays(todayStr(),INT[st.b]); fc.known++} else {st.b=0; st.due=addDays(todayStr(),1)}
      fc.i++; fc.flip=false; save(); render(); break}
    case "quick":{let pool=quizPool(q=>(pr.dom==="all"||q.d===pr.dom)&&(!pr.hot||q.h));
      if(pr.dom==="all"&&!pr.hot){ /* weight by domain */ const out=[]; DORDER.forEach(d=>{const n=Math.round(pr.n*DOM[d].w/100); out.push(...shuffle(pool.filter(q=>q.d===d)).slice(0,n))}); pool=out }
      const ids=shuffle(pool).slice(0,pr.n).map(q=>q.id); if(!ids.length){toast("ما فيه أسئلة بهذا الفلتر");return}
      startSession({mode:"practice",kind:"quick",title:"تدريب سريع",ids}); break}
    case "review": startReview(); break;
    case "similar":{const ids=window.PW?PW.similar.filter(id=>QBY[id]):shuffle(QS.filter(q=>q.h&&!q.of&&hOK(q)).map(q=>q.id)).slice(0,20); if(!ids.length)break; startSession({mode:"practice",kind:"similar",title:"الأسئلة المشابهة",ids}); break}
    case "test": startTest(ds.id); break;
    case "bankDom": bankDom=ds.v; render(); break;
    case "bankLock": if(window.PW)PW.open("بقية "+BANK_LABEL); break;
    case "plusLock": if(window.PW)PW.open("كامل أسئلة الخمس سنوات الماضية"); break;
    case "plusUp": plusBox=!plusBox; render(); break;
    case "plusCode":{const c=String((document.getElementById("upc")||{}).value||"").toUpperCase().replace(/[^A-Z0-9]/g,""); if(c.length<8){toast("اكتب الكود كاملاً");break} try{localStorage.setItem("qx.code."+TIER_C.site,c);localStorage.setItem("qx.code.last",c)}catch(e){} location.reload(); break}
    case "mzLock": if(window.PW)PW.open("ملزمة أهم 100 سؤال"); break;
    case "mzGet": mzGet(b); break;
    case "bankStart":{const ids=bankIds(bankDom); if(!ids.length)break; QXEV("start_bank"); const bp=bankPos(); startSession({mode:"practice",kind:"bank",title:BANK_LABEL,ids,dom:bankDom}); if(bp&&bp.dom===bankDom&&bp.i>0&&bp.i<ids.length&&ds.v!=="restart"){session.i=bp.i; render()} break}
    case "next": s.i=Math.min(s.i+1,s.ids.length-1); s.confirm=false; bankSave(); render(); window.scrollTo(0,0); break;
    case "prev": s.i=Math.max(0,s.i-1); s.confirm=false; render(); break;
    case "flag":{const id=s.ids[s.i]; s.flags[id]=!s.flags[id]; render(); break}
    case "askSubmit": s.confirm=true; render(); break;
    case "cancelSubmit": s.confirm=false; render(); break;
    case "submit": case "finish": finishSession(); break;
    case "quitQuiz": bankSave(); if(s&&s.mode==="exam"&&!s.done){ if(!s.confirm){s.confirm=true;render();toast("سلّم الاختبار أو ارجع له");return} } stopTimer(); session=null; go({name:"practice"}); break;
    case "retryWrong":{const ids=s.ids.filter(id=>s.ans[id]!==QBY[id].a); startSession({mode:"practice",kind:"retry",title:"إعادة الأخطاء",ids:shuffle(ids)}); break}
    case "markFinal": S.tasks.final=true; save(); toast("ممتاز"); render(); break;
    case "copyReport":{const t=reportText(); const ta=document.getElementById("report");
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("نُسخ التقرير")).catch(()=>{ta.focus();ta.select();toast("حدّد النص وانسخه")}); break}
    case "resetAsk": resetAsk=true; render(); break;
    case "resetNo": resetAsk=false; render(); break;
    case "resetYes": resetAsk=false; S=freshState(); save(); toast("تم التصفير"); go({name:"home"}); break;
  }
});
document.addEventListener("keydown",e=>{
  if(route.name!=="quiz"||!session||session.done) return;
  const k=e.key.toUpperCase(); const map={A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3};
  if(k in map && !e.metaKey && !e.ctrlKey){const btn=document.querySelector(`[data-opt="${map[k]}"]`); if(btn&&!btn.disabled) btn.click()}
  if(e.key==="Enter"){const nb=document.querySelector('[data-act="next"],[data-act="finish"]'); if(nb) nb.click()}
});

/* ---------- boot ---------- */
function start(data){
  if(data&&data.session){session=data.session; if(data.route) route=data.route}
  else if(data&&data.route) route=data.route;
  if(data&&data.fc) fc=data.fc;
  render(); initRemote(); try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){} if(window.QXEV) QXEV(window.PW?"view_app":"view_app_full");
  addEventListener("qx-deep",()=>{if(route.name==="lesson")render()});   // الشروح الموسعة تصل بعد الفتح (deep.js)
  // رابط مباشر للتشخيصي من صفحة الاختبار السريع والمنشورات: ‎…/#diag
  if(location.hash==="#diag"){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} startTest("diag")}
  // روابط القروبات (2026-10-21): ‎#questions يفتح تبويب الأسئلة، ‎#bank يبدأ الأسئلة المشابهة مباشرة
  else if(location.hash==="#questions"){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} go({name:"practice"})}
  else if(location.hash==="#bank"){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} const ids=bankIds("all"); if(ids.length)startSession({mode:"practice",kind:"bank",title:BANK_LABEL,ids}); else go({name:"practice"})}
  // رابط مباشر لدرس من الاختبار السريع وصفحات الشرح: ‎…/#lesson-L07
  else{const m=/^#lesson-(L\d+)$/.exec(location.hash); if(m&&LBY[m[1]]){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} go({name:"lesson",id:m[1]})}}
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({route,session,fc}));
if(hot&&hot.ready) hot.ready(start); else start(hot&&hot.data||{});
})();
