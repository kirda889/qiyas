@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1418; --sheet:#161D22; --ink:#E4E9EC; --muted:#B1BBC2; --rule:#26313A; --rule-strong:#34424C;
  --accent:#4FB8AF; --accent-ink:#06211F; --accent-soft:#16312F; --accent-text:#4FB8AF;
  --hl:#5C5220; --hl-ink:#FFF3B8;
  --good:#5CC48D; --good-soft:#15301F; --bad:#F2867A; --bad-soft:#3A1A17; --warn:#E3A84A;
  --dP:#4FB8AF; --dD:#E0A54C; --dT:#B98ED1; --dL:#7FA6E8;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F1418; --sheet:#161D22; --ink:#E4E9EC; --muted:#B1BBC2; --rule:#26313A; --rule-strong:#34424C;
  --accent:#4FB8AF; --accent-ink:#06211F; --accent-soft:#16312F; --accent-text:#4FB8AF;
  --hl:#5C5220; --hl-ink:#FFF3B8;
  --good:#5CC48D; --good-soft:#15301F; --bad:#F2867A; --bad-soft:#3A1A17; --warn:#E3A84A;
  --dP:#4FB8AF; --dD:#E0A54C; --dT:#B98ED1; --dL:#7FA6E8;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
#app{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.en{font-family:var(--f-en);unicode-bidi:isolate;direction:ltr}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
strong{font-weight:600}
mark.term{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 .1em}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);margin-inline:-16px;padding:10px 16px}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .seal{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;color:var(--accent);font-size:.8rem;flex:none}
.brand b{font-family:var(--f-display);font-weight:600;font-size:1.02rem;white-space:nowrap}
.brand span{display:block;font-size:.74rem;color:var(--muted);line-height:1.2;white-space:nowrap}
.count{margin-inline-start:auto;text-align:center;line-height:1.1}
.count .n{font-family:var(--f-mono);font-size:1.25rem;font-weight:700;color:var(--accent-text,var(--accent))}
.count .l{font-size:.78rem;color:var(--muted)}
.nav{display:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:4px 0;border-radius:8px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
@media (min-width:760px){
  .tabbar{display:none}
  .nav{display:flex;gap:4px;margin-inline-start:18px}
  .nav button{background:none;border:0;padding:6px 12px;border-radius:999px;color:var(--muted);font-size:.92rem}
  .nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #app{padding-bottom:60px}
}

/* sheets & cards */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.ruled{background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px)}
.section-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.section-title h2{font-size:1.1rem}
.section-title .line{flex:1;height:1px;background:var(--rule-strong)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 20px;font-weight:600;font-size:.95rem;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--rule-strong);color:var(--ink);font-weight:500}
.btn.sm{padding:6px 14px;min-height:36px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.76rem;border:1px solid var(--rule-strong);color:var(--muted);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.done{border-color:var(--good);color:var(--good)}
.chip.hot{border-color:var(--warn);color:var(--warn)}
.code{font-size:.78rem;color:var(--muted);unicode-bidi:isolate;white-space:nowrap}

/* home */
.today{display:grid;gap:14px}
.today .kicker{font-size:.8rem;color:var(--muted)}
.today h1{font-size:1.45rem}
.domains{display:grid;gap:10px}
.dom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.dom .name{display:flex;gap:8px;align-items:center;min-width:0}
.dom .name b{font-weight:600;font-size:.95rem}
.dom .w{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:10px;border-radius:999px;background:var(--rule);overflow:hidden;position:relative}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--f-mono);font-size:1.45rem;font-weight:600;line-height:1.2}
.stat .k{font-size:.8rem;color:var(--muted)}
.set-date{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.set-date input{border:1px solid var(--rule-strong);background:var(--paper);border-radius:8px;padding:8px 10px;min-height:44px}

/* plan */
.plan{display:grid;gap:8px}
.day{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.day .num{font-family:var(--f-mono);text-align:center;line-height:1.1}
.day .num b{display:block;font-size:1.15rem}
.day .num span{font-size:.68rem;color:var(--muted)}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day .what{min-width:0}
.day .what .t{font-weight:600}
.day .what .s{font-size:.82rem;color:var(--muted)}
.bub{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;flex:none}
.bub.on{background:var(--good);border-color:var(--good)}
.bub.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sheet)}

/* lessons list */
.lgroup{display:grid;gap:8px}
.lcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;text-align:start;width:100%}
.lcard .idx{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);width:34px;text-align:center}
.lcard .t{font-weight:600;line-height:1.4}
.lcard .s{font-size:.82rem;color:var(--muted)}
.dhead{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.dhead .sw{width:12px;height:12px;border-radius:3px}
.dhead h2{font-size:1.05rem}
@media (max-width:560px){.dhead .code{display:none}}
.dhead .w{margin-inline-start:auto;font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}

/* lesson view */
.lesson-head{display:grid;gap:8px;padding-top:18px}
.lesson-head .en{font-size:.95rem;color:var(--muted)}
.goal{border-inline-start:3px solid var(--accent);padding-inline-start:12px;color:var(--ink)}
.lsec{display:grid;gap:10px;padding:18px 0;border-bottom:1px solid var(--rule)}
.lsec:last-of-type{border-bottom:0}
.lsec p{max-width:68ch}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.term{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;min-width:0;direction:ltr;text-align:left}
.term .tdef{font-family:var(--f-en);font-size:.9rem;line-height:1.5;margin-top:2px}
.pa{font-family:var(--f-ar);font-size:.8rem;color:var(--muted);line-height:1.6;direction:rtl;text-align:left;unicode-bidi:plaintext}
.term .pa{margin-top:3px}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:10px;direction:ltr;text-align:left}
.pts li{border-left:3px solid var(--rule-strong);padding-left:10px}
.pts .pe{font-family:var(--f-en);font-size:1rem;line-height:1.6}
.pts .pe strong{font-weight:700} /* الكلمة المفتاحية في الشرح أوضح للمراجعة السريعة (2026-10-25) */
.off{display:inline-block;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.04em;border:1px solid var(--good);color:var(--good);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle}
.lesson-head h1.eh1{font-family:var(--f-en);font-size:1.5rem;text-align:left;unicode-bidi:isolate}
.lsec h2.eh{font-family:var(--f-en);direction:ltr;text-align:left}
.lsec .ha{font-size:.82rem;color:var(--muted);direction:rtl;text-align:left;margin-top:-6px}
.traps ul.bi{direction:ltr;text-align:left;padding-left:18px;padding-right:0}
.traps ul.bi li .pe{font-family:var(--f-en)}
.defbox{margin-top:10px;border-top:1px solid var(--rule);padding-top:8px;direction:ltr;text-align:left;font-family:var(--f-en);font-size:.92rem}
.defbox b{font-weight:600;display:inline;margin:0}
.term .tn{font-family:var(--f-en);font-weight:600;direction:ltr;text-align:left;unicode-bidi:isolate;font-size:.92rem;overflow-wrap:anywhere}
.term .td{font-size:.86rem;color:var(--muted);line-height:1.6}
.traps{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:var(--r);padding:14px 16px}
.traps h3{color:var(--bad);margin-bottom:6px}
.traps ul{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.vids{display:grid;gap:8px}
.vid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-decoration:none;color:inherit}
.vid .play{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.vid .vt{font-weight:500;line-height:1.45}
.vid .vc{font-size:.8rem;color:var(--muted)}
.lang{font-family:var(--f-mono);font-size:.7rem;border:1px solid var(--rule-strong);border-radius:4px;padding:0 5px;color:var(--muted)}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;padding:12px 0}
.progress{flex:1;height:6px;background:var(--rule);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;min-width:64px;text-align:center}
.timer.low{color:var(--bad)}
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qtext{font-family:var(--f-en);direction:ltr;text-align:left;font-size:1.06rem;line-height:1.6;font-weight:500}
.opts{display:grid;gap:8px;margin-top:14px;direction:ltr}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-family:var(--f-en);font-size:.98rem;line-height:1.45;min-height:48px;width:100%}
.opt .b{width:28px;height:28px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .b{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .b{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt:disabled{cursor:default}
.explain{margin-top:14px;border-radius:10px;padding:12px 14px;border:1px solid var(--rule)}
.explain.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.explain.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.explain b{display:block;margin-bottom:2px}
.qreply{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);border-inline-start:3px solid var(--accent);font-size:.92em;line-height:1.7}
.qreply b{display:block;margin-bottom:2px}.qreply b span{font-weight:400;color:var(--muted)}
.qnav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.grid88{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;direction:ltr}
.gq{height:34px;border-radius:50%;border:1.5px solid var(--rule-strong);background:var(--sheet);font-family:var(--f-mono);font-size:.72rem;color:var(--muted);padding:0}
.gq.ans{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.gq.cur{outline:2px solid var(--accent);outline-offset:2px}
.gq.flag{border-color:var(--warn);border-width:3px}
.confirm{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px}

/* results */
.score{display:flex;align-items:baseline;gap:10px}
.score .big{font-family:var(--f-mono);font-size:3rem;font-weight:600;line-height:1}
.rlist{display:grid;gap:10px}
.ritem{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.ritem .qtext{font-size:.95rem}
.ans-line{font-family:var(--f-en);direction:ltr;text-align:left;font-size:.9rem}
.ans-line .y{color:var(--bad);text-decoration:line-through}
.ans-line .c{color:var(--good);font-weight:600}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.mode{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px;text-align:start;display:grid;gap:6px;align-content:start;width:100%}
.mode .mt{font-family:var(--f-display);font-weight:600;font-size:1.02rem}
.mode .md{font-size:.85rem;color:var(--muted);line-height:1.6}
.mode .mx{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:.85rem;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* flashcards */
.fc{perspective:1200px}
.fc-in{position:relative;min-height:220px;border-radius:14px;border:1px solid var(--rule);background:var(--sheet);box-shadow:var(--shadow);display:grid;place-items:center;padding:24px;text-align:center;cursor:pointer;width:100%}
.fc-front{font-family:var(--f-en);font-size:1.5rem;font-weight:600;direction:ltr;line-height:1.35}
.fc-back{font-size:1.12rem;line-height:1.8}
.fc-hint{position:absolute;bottom:10px;inset-inline:0;font-size:.75rem;color:var(--muted)}

/* sheet (night-before) */
.hy{display:grid;gap:14px}
.hy-l{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 16px}
.hy-l h3{font-size:.98rem;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.hy-l ul{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:.93rem}
.tips{display:grid;gap:8px;counter-reset:t}
.tip{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.tip::before{counter-increment:t;content:counter(t);font-family:var(--f-mono);font-weight:600;width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:.8rem}

.sync{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--rule-strong)}
.sync.on i{background:var(--good)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:50;box-shadow:var(--shadow)}
textarea.report{width:100%;min-height:180px;border:1px solid var(--rule-strong);border-radius:8px;padding:10px;background:var(--paper);font-family:var(--f-mono);font-size:.8rem;direction:rtl}
@media (prefers-reduced-motion:no-preference){
  .opt,.btn,.day,.lcard,.mode{transition:border-color .15s,background-color .15s,transform .15s}
  .lcard:active,.day:active,.mode:active{transform:scale(.99)}
}

/* credit card */
.credit{display:flex;align-items:center;gap:14px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 16px}
.credit .cm{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.credit .cm svg{width:22px;height:22px}
.credit .ck{font-size:.78rem;color:var(--muted)}
.credit .cn{font-family:var(--f-display);font-weight:600;font-size:1.06rem;line-height:1.5}
.credit .vcount{margin-inline-start:auto;display:flex;flex-direction:column;align-items:center;line-height:1.35;padding-inline-start:14px;border-inline-start:1px solid var(--rule)}
.credit .vcount[hidden]{display:none}
.credit .vcount-n{font-weight:700;font-size:1.06rem;font-variant-numeric:tabular-nums}

/* cover, start-here, exam map */
.cover{display:grid;gap:12px}
.cover .ck{font-size:.8rem;color:var(--accent-text,var(--accent));font-weight:600}
.cover h1{font-size:1.5rem}
.cover p{max-width:62ch;color:var(--muted)}
.figs{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 0;border-block:1px solid var(--rule)}
.fig{display:flex;align-items:baseline;gap:6px}
.fig b{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;color:var(--ink)}
.fig span{font-size:.82rem;color:var(--muted)}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.topics span{font-size:.8rem;border:1px solid var(--rule-strong);border-radius:999px;padding:2px 10px;color:var(--ink);background:var(--paper)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.steps{grid-template-columns:1fr}}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.step .sn{width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem}
.step.done .sn{background:var(--good);border-color:var(--good);color:var(--sheet)}
.step .st{font-weight:600;line-height:1.4}
.step .ss{font-size:.78rem;color:var(--muted)}
.map{display:grid;gap:4px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:2px 12px;align-items:center;background:none;border:0;padding:7px 4px;border-radius:8px;text-align:start;width:100%}
.mrow:hover{background:var(--paper)}
.mrow .mn{font-size:.9rem;line-height:1.45;min-width:0}
.mrow .mn .code{margin:0 6px;display:inline-block}
.mrow .mq{font-size:.8rem;color:var(--muted);text-align:end;font-variant-numeric:tabular-nums}
.mrow .mb{grid-column:1/-1;height:8px;border-radius:999px;background:var(--rule);overflow:hidden}
.mrow .mb i{display:block;height:100%;border-radius:999px}

/* theme toggle, simpler home */
.themebtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);display:grid;place-items:center;flex:none;padding:0}
.themebtn svg{width:18px;height:18px}
.or{font-size:.88rem;color:var(--muted)}
.path{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.path b{color:var(--accent);font-weight:600}
details.prog{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:0 16px}
details.prog>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;font-family:var(--f-display);font-weight:600;font-size:1.02rem}
details.prog>summary::-webkit-details-marker{display:none}
details.prog>summary .hint{font-family:var(--f-ar);font-weight:400;font-size:.8rem;color:var(--muted);margin-inline-start:auto}
details.prog>summary svg{width:18px;height:18px;flex:none;transition:transform .2s}
details.prog[open]>summary svg{transform:rotate(180deg)}
details.prog .pin{display:grid;gap:14px;padding-bottom:16px}

@media (max-width:430px){.brand span{display:none}}
.count .btn{white-space:nowrap}

/* readability: larger base, heavier weight, stronger secondary text */
html{font-size:112.5%}
@media (max-width:430px){html{font-size:106.25%}}
body{font-size:1rem;font-weight:500}
.small{font-size:.92rem}
.muted{color:var(--muted)}
.tfold{margin:10px 0 2px}.tfold>summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center;font-size:.86rem;font-weight:700;color:var(--accent);border:1px solid var(--rule);border-radius:999px;padding:4px 12px}.tfold>summary::-webkit-details-marker{display:none}.tfold>summary::after{content:"＋";font-weight:400}.tfold[open]>summary::after{content:"－"}.tfold[open] .terms{margin-top:10px}

/* الأسئلة (2026-10-20): بطاقتان كبيرتان + صفوف صغيرة + قائمة البنك */
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;position:relative;display:grid;gap:6px;box-shadow:var(--shadow)}
.tile .tag{position:absolute;top:14px;left:14px;font-size:.74rem;font-weight:700;color:var(--accent-text,var(--accent));background:var(--accent-soft);border-radius:999px;padding:2px 9px}
.tile .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}.tile .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile h2{font-size:1.15rem}.tile>p{color:var(--muted);font-size:.9rem;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}.meta b{color:var(--ink)}
.btn.wide{width:100%;margin-top:4px}.btn.q{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-text,var(--accent))}
.rows{display:grid;gap:6px;margin-top:8px}
.rowi{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:11px 14px;font:inherit;color:inherit;cursor:pointer}
.tile .rowi{background:var(--paper)}
.rowi .t{flex:1;min-width:0}.rowi .t b{display:block;font-size:.98rem;font-weight:600;line-height:1.4}.rowi .t span{display:block;font-size:.82rem;color:var(--muted);line-height:1.5}
.rowi[disabled]{opacity:.6;cursor:default}
.pdfl{display:block;font-size:.88rem;font-weight:600;color:var(--accent-text,var(--accent))}
.lvl{margin:0;font-size:.95rem}

.ex-en{font-family:var(--f-en);font-size:1rem;line-height:1.6;text-align:left;color:var(--ink)}.ex-ar{font-size:.82rem;line-height:1.7;color:var(--muted);margin-top:4px}
</style>

window.LESSONS = [{"id":"L01","d":"P","std":"6.9.1","en":"Teaching Listening","ar":"تدريس الاستماع","goal":["Distinguish top-down from bottom-up processing, and know the stages, types and strategies of listening.","تفرّق بين المعالجتين وتعرف مراحل الاستماع وأنواعه واستراتيجياته"],"sec":[{"h":["Listening as a receptive skill","الاستماع مهارة استقبال"],"pts":[["Listening and reading are [[**receptive skills**|en.lis.skills]] (input), while speaking and writing are productive skills (output).","الاستماع والقراءة مهارتا استقبال، والكلام والكتابة مهارتا إنتاج."],["Hearing is only the physical reception of sound; listening is an active process of attending to, understanding and interpreting a spoken message.","السماع استقبال الصوت فقط، أما الاستماع فعملية نشطة للانتباه والفهم والتفسير."],["Listening is often described as the **least understood** of the four skills, and part of its difficulty is that learners cannot control the speaker's speed.","يوصف الاستماع بأنه أقل المهارات فهماً، ومن صعوبته أن الطالب لا يتحكم في سرعة المتحدث."],["Listening input must be **meaningful** and [[comprehensible|en.sla-input]], because learners can only acquire language from input they can understand.","المدخل المسموع يجب أن يكون ذا معنى ومفهوماً، فالطالب لا يتعلم مما لا يفهمه."],["Listening is not only recordings: following the teacher's spoken classroom instructions is itself a listening task.","الاستماع ليس التسجيلات فقط، فاتباع تعليمات المعلم الشفهية مهمة استماع أيضاً."]],"t":[["Receptive skills","Skills in which learners receive and understand language: listening and reading.","استقبال: استماع وقراءة"],["Productive skills","Skills in which learners produce language: speaking and writing.","إنتاج: كلام وكتابة"],["Hearing","The physical act of receiving sound without necessarily interpreting it.","سماع الصوت فقط"],["Listening","An active process of receiving, attending to, understanding and interpreting spoken messages.","استماع: فهم وتفسير"]]},{"h":["Top-down and bottom-up processing","المعالجة من الأعلى ومن الأسفل"],"pts":[["Listeners build meaning in two directions: downward from what they already know, and upward from the sounds and words they hear.","يبني المستمع المعنى باتجاهين: من خبرته السابقة نزولاً، ومن الأصوات والكلمات صعوداً."],["[[**Top-down**|en.lis.process]] processing uses background knowledge (schema) and context: listening for the main idea, predicting, inferring and summarizing.","المعالجة من الأعلى تستخدم الخلفية والسياق لفهم الفكرة العامة والتوقع والاستنتاج والتلخيص."],["**Bottom-up** processing builds meaning from the smallest units — sounds, word boundaries, morphemes, discourse markers and grammatical cues — so it relies on **grammatical (linguistic) competence**, while top-down relies on background knowledge.","المعالجة من الأسفل تبدأ من الأصوات والكلمات والقواعد، فتعتمد على المعرفة اللغوية لا الخلفية."],["The **interactive model** combines both: recognizing words is bottom-up and listening for the main idea is top-down, and good listeners use the two together.","النموذج التفاعلي يجمعهما: تمييز الكلمات من الأسفل، والفكرة العامة من الأعلى، والمستمع الجيد يستخدمهما معاً."]],"t":[["Top-down processing","Using prior knowledge, context and expectations to understand the overall meaning of a text.","من الأعلى: خلفية وسياق"],["Bottom-up processing","Building meaning from the smallest units — sounds, words and grammar — upward.","من الأسفل: من الوحدات الصغرى"],["Schema (pl. schemata)","The background knowledge structures a learner brings to a text.","المخطط الذهني"],["Interactive model","A model in which top-down and bottom-up processing work together.","يدمج المعالجتين"]],"ex":[["Guessing *hot, humid* before a weather forecast = **top-down**; hearing *thirteen* or *thirty* = **bottom-up**.","التوقع من الأعلى، وتمييز الرقم من الأسفل"]],"map":{"type":"cards","title":["Two ways listeners build meaning","⁧طريقتا بناء المعنى عند المستمع⁩"],"groups":[{"n":"Top-down","ar":"⁧من الأعلى: من الخبرة إلى النص⁩","items":[{"n":"schema + context","ar":"⁧الخلفية والسياق⁩"},{"n":"main idea, predicting","ar":"⁧الفكرة العامة والتوقع⁩"},{"n":"inferring, summarizing","ar":"⁧الاستنتاج والتلخيص⁩"}]},{"n":"Bottom-up","ar":"⁧من الأسفل: من الأصوات إلى المعنى⁩","items":[{"n":"sounds, word boundaries","ar":"⁧الأصوات وحدود الكلمات⁩"},{"n":"grammar cues, markers","ar":"⁧القرائن النحوية وأدوات الربط⁩"},{"n":"thirteen or thirty?","ar":"⁧تمييز الرقم المسموع⁩"}]}]}},{"h":["Intensive and extensive listening","الاستماع المكثف والموسّع"],"pts":[["Listening practice also differs in scope: how long the text is, and whether learners attend to details or to the overall meaning.","يختلف الاستماع في حجمه: طول النص، والتركيز على التفاصيل أم على المعنى العام."],["[[**Intensive listening**|en.lis.scope]] is short, focused work on details, sounds and form, so it develops bottom-up processing.","الاستماع المكثف مقاطع قصيرة مركّزة على التفاصيل والأصوات، فينمّي المعالجة من الأسفل."],["**Extensive listening** means long passages heard for general meaning or pleasure, often outside class; podcasts are the resource most linked to this kind of listening.","الاستماع الموسّع نصوص طويلة للفهم العام أو المتعة، والبودكاست أشهر مصادره."]],"t":[["Intensive listening","Short, focused listening on specific language features, sounds or details.","استماع مكثف"],["Extensive listening","Listening to long texts for general meaning or enjoyment.","استماع موسّع"]]},{"h":["Types of listening by purpose","أنواع الاستماع حسب الغرض"],"pts":[["Listening types are named after the listener's purpose: to enjoy, to understand, to judge, to support the speaker, or to tell sounds apart.","تُسمّى أنواع الاستماع بغرض المستمع: متعة أو فهم أو حكم أو دعم للمتحدث أو تمييز أصوات."],["Listening to a feel-good story as a reward is [[**appreciative**|en.lis.types]] listening; analyzing a message before accepting it is **critical** listening.","سماع قصة ممتعة كمكافأة استماع تقديري، وتحليل الرسالة قبل قبولها استماع نقدي."],["For long speeches, teach **selective listening**: learners note only the main ideas and time references and ignore the rest.","مع الخطب الطويلة علّم الاستماع الانتقائي: يدوّن الطالب الأفكار الرئيسة والأوقات فقط."],["Listening can also be classified by interaction: radio, TV and movies are **non-interactive**, while phone calls and face-to-face talk are interactive.","الراديو والتلفاز والأفلام استماع غير تفاعلي، والمكالمة والحديث المباشر استماع تفاعلي."]],"t":[["Appreciative listening","Listening for enjoyment, e.g. music or stories.","تقديري: للمتعة"],["Comprehensive listening","Listening to understand the message (lectures, directions).","استيعابي"],["Critical listening","Listening to evaluate and judge a message.","نقدي"],["Therapeutic (empathic) listening","Listening to support the speaker and show empathy.","علاجي أو تعاطفي"],["Discriminative listening","Listening to distinguish between different sounds.","تمييزي"],["Selective listening","Listening only for specific information and ignoring the rest.","انتقائي"]]},{"h":["Stages of a listening lesson","مراحل درس الاستماع"],"pts":[["A listening lesson has three stages — before, while and after listening — and each stage has its own job.","درس الاستماع ثلاث مراحل: قبل الاستماع وأثناءه وبعده، ولكل مرحلة وظيفتها."],["[[Before listening|en.lis.stages]], the teacher must **set a listening objective**, activate schema and pre-teach key words; verifying predictions comes later, not here.","قبل الاستماع: حدد هدف الاستماع ونشّط الخلفية وقدّم الكلمات المفتاحية، والتحقق من التوقعات يأتي لاحقاً.","o"],["Typical **pre-listening** tasks are predicting from a title or picture and generating questions; learner **interest** in the topic is the factor most linked to an engaging [[listening text|en.lis.texts]].","مهام ما قبل الاستماع: التوقع من العنوان أو الصورة وتوليد الأسئلة، وأهم عامل موضوع ممتع."],["While listening, the first listen is for **gist** and the second for specific information; pausing the recording and asking what comes next trains **predicting content**.","أثناء الاستماع: المرة الأولى للفكرة العامة والثانية للتفاصيل، وإيقاف المقطع يدرّب على التوقع."],["After listening comes a discussion or follow-up task; listening to a paragraph and then summarizing it is a **semi-guided** task.","بعد الاستماع نقاش أو مهمة متابعة، والاستماع لفقرة ثم تلخيصها مهمة شبه موجهة."]],"t":[["Pre-listening","Stage that prepares learners: setting a purpose, activating schema, predicting.","قبل الاستماع"],["Listening for gist","Listening to understand the general idea, not every word.","الفكرة العامة"],["Listening for specific information","Listening to find particular details such as names, numbers or dates.","معلومة محددة"],["Signposts","Discourse markers that guide listeners through a talk (firstly, to sum up).","علامات الطريق"],["Question generation","A pre-listening task in which learners write questions they expect the text to answer, giving them a purpose for listening.","توليد أسئلة قبل الاستماع"]],"map":{"type":"flow","title":["Stages of a listening lesson","⁧مراحل درس الاستماع⁩"],"groups":[{"n":"Pre-listening","ar":"⁧قبل الاستماع⁩","idea":"⁧هدف الاستماع أولاً، ثم الخلفية والكلمات المفتاحية⁩","items":[{"n":"set an objective"},{"n":"activate schema"},{"n":"pre-teach words"}]},{"n":"While-listening","ar":"⁧أثناء الاستماع⁩","idea":"⁧الاستماع الأول للفكرة العامة، والثاني للتفاصيل⁩","items":[{"n":"gist"},{"n":"specific information"}]},{"n":"Post-listening","ar":"⁧بعد الاستماع⁩","idea":"⁧نقاش أو مهمة متابعة مثل التلخيص⁩","items":[{"n":"discussion"},{"n":"summarizing"}]}]}},{"h":["Listener strategies and sources of difficulty","استراتيجيات المستمع ومصادر الصعوبة"],"pts":[["Good listeners use strategies to keep going when understanding breaks down, and teachers need to know what makes natural speech hard.","المستمع الجيد يستخدم استراتيجيات تبقيه متابعاً، والمعلم يعرف ما يصعّب الكلام الطبيعي."],["Going on despite unclear parts is [[**tolerance of ambiguity**|en.lis.strat]]; inferring missing information from context is **compensation**.","الاستمرار رغم الأجزاء الغامضة تحمّل للغموض، واستنتاج الناقص من السياق تعويض."],["The **Cornell method** is a note-taking system with a cue column, notes area and summary, while **shadowing** means repeating speech simultaneously as it is heard.","طريقة كورنيل نظام لتدوين الملاحظات، والمحاكاة ترديد الكلام في لحظة سماعه نفسها."],["[[Brown's factors|en.lis.brown]] of listening difficulty include reduced forms ('gonna'), redundancy, performance variables (hesitations, false starts) and **rate of delivery**.","عوامل الصعوبة عند براون: الصيغ المختصرة والتكرار وتعثر الكلام الطبيعي وسرعة المتحدث."]],"t":[["Tolerance of ambiguity","Accepting that some parts of the input are unclear without stopping.","تحمّل الغموض"],["Compensation strategy","Using context and clues to make up for missing understanding.","التعويض"],["Self-monitoring","Checking one's own comprehension while listening (metacognitive).","مراقبة الفهم"],["Cornell method","A note-taking system with a cue column, notes area and summary.","طريقة كورنيل"],["Shadowing","Repeating speech simultaneously as it is heard.","المحاكاة"],["Dictogloss","Students hear a short text, take notes, then reconstruct it together.","إعادة بناء النص"],["Reduced forms","Contracted spoken forms such as 'gonna', 'wanna'.","صيغ مختصرة"],["Performance variables","Hesitations, false starts and fillers in natural speech.","متغيرات الأداء"],["Redundancy","Repetitions and rephrasing typical of spoken language.","التكرار والحشو"],["Rate of delivery","The speed at which a speaker talks.","سرعة الكلام"]]},{"h":["Teaching, not testing, listening","نعلّم الاستماع لا نختبره"],"pts":[["Field criticises the **comprehension approach** — play a recording, then ask questions — because it tests listening instead of teaching it.","ينتقد فيلد أسلوب «شغّل ثم اسأل» لأنه يختبر الاستماع ولا يعلّمه."],["A process approach instead trains the sub-skills behind comprehension, such as recognizing word boundaries in fast speech.","البديل تدريب المهارات الفرعية للفهم، مثل تمييز حدود الكلمات في الكلام السريع."],["[[**Metacognitive instruction**|en.lis.metacog]] (Vandergrift) teaches learners to plan and predict, then monitor their comprehension, then evaluate and reflect on how they listened.","التعليم ما وراء المعرفي عند فاندرغريفت: يخطط المتعلم ويتوقع، ثم يراقب فهمه، ثم يقوّم ويتأمل."],["Short bottom-up work after a meaning-focused listen — dictating chunks or noticing [[weak forms|en.ling.connected]] — helps learners cope with fast connected speech.","تدريب قصير من الأسفل بعد الاستماع للمعنى، كإملاء المقاطع والصيغ الضعيفة، يعين على الكلام السريع."]],"t":[["Comprehension approach","A listening lesson that relies on playing a recording and checking answers to questions, which tests rather than teaches listening (criticised by Field).","تشغيل ثم أسئلة: اختبار لا تعليم"],["Metacognitive instruction","Teaching learners to plan, monitor and evaluate their own listening so they become aware of how they listen.","تعليم التخطيط والمراقبة والتقويم"],["Planning / monitoring / evaluating","The three core metacognitive strategies: preparing for a task, checking comprehension during it, and judging success afterwards.","الاستراتيجيات ما وراء المعرفية الثلاث"]]}],"trap":[["Recognizing words = bottom-up; listening for the main idea = top-down.","لا تخلط بينهما"],["Intensive listening develops bottom-up processing; extensive = pleasure / general meaning.","المكثف من الأسفل"],["'Listen and do' activities = Total Physical Response (TPR), not a listening type.","اسمع ونفّذ = TPR"],["Before listening: set a listening objective (not 'verify predictions').","الهدف قبل الاستماع"]],"vid":[["rdC2dGvuFmo","ar","استراتيجيات الاستماع من الأعلى ومن الأسفل","الدافورة",15],["tboViWzpYlM","ar","أنواع الاستماع","الدافورة",11],["RLTCveq0RKo","en","Teaching Listening 1 – Top down processing","Jo Gakonga",7]],"map":{"title":["Teaching Listening","⁧تدريس الاستماع⁩"],"groups":[{"n":"Processing","ar":"⁧المعالجة⁩","idea":"⁧من أين يبدأ الفهم؟⁩","items":[{"n":"Top-down","ar":"⁧خلفية وتوقع⁩","kw":["schema","gist"],"d":"en.lis.process"},{"n":"Bottom-up","ar":"⁧أصوات وكلمات⁩","kw":["word boundaries"],"d":"en.lis.process"}],"trap":"⁧الفكرة الرئيسية من الأعلى، وتمييز الكلمات من الأسفل⁩"},{"n":"Lesson stages","short":"Stages","ar":"⁧مراحل الدرس⁩","idea":"⁧قبل ← أثناء ← بعد⁩","items":[{"n":"Pre","ar":"⁧هدف وخلفية⁩","kw":["set a purpose"],"d":"en.lis.stages"},{"n":"While","ar":"⁧العامة ثم التفاصيل⁩","kw":["gist","details"]},{"n":"Post","ar":"⁧نقاش وإنتاج⁩","kw":["follow-up"]}],"trap":"⁧قبل الاستماع: حدّد الهدف، لا «تحقّق من التوقعات»⁩"},{"n":"Scope","ar":"⁧مكثف وموسّع⁩","items":[{"n":"Intensive","ar":"⁧قصير مركّز⁩","kw":["bottom-up"],"d":"en.lis.scope"},{"n":"Extensive","ar":"⁧طويل للمتعة⁩","kw":["podcasts"]}]},{"n":"Purpose","ar":"⁧حسب الغرض⁩","items":[{"n":"Appreciative","ar":"⁧للمتعة⁩","d":"en.lis.types"},{"n":"Critical","ar":"⁧تحليل وحكم⁩"}],"trap":"⁧«اسمع ونفّذ» = TPR، لا نوع استماع⁩"},{"n":"Strategies","ar":"⁧الاستراتيجيات⁩","items":[{"n":"Metacognitive","who":"Vandergrift","ar":"⁧خطّط وراقب وقوّم⁩","d":"en.lis.metacog"},{"n":"Compensation","ar":"⁧تعويض من السياق⁩","d":"en.lis.strat"}]},{"n":"Difficulties","ar":"⁧الصعوبات⁩","items":[{"n":"Speech factors","who":"Brown","ar":"⁧8 عوامل كالسرعة⁩","d":"en.lis.brown"}]}]},"n":1},{"id":"L02","d":"P","std":"6.9.1","en":"Speaking, Pronunciation & Error Correction","ar":"الكلام والنطق وتصحيح الأخطاء","goal":["Know speaking activities, drill types, teacher questions and corrective feedback types.","أنشطة الكلام والتدريبات وأسئلة المعلم وأنواع التصحيح"],"sec":[{"h":["Speaking goals: accuracy, fluency and intelligibility","أهداف الكلام: الدقة والطلاقة والوضوح"],"pts":[["The main purpose of teaching speaking is efficient **communication**: exchanging information (the transactional function) and building relationships (the interactional function).","هدف تدريس الكلام تواصل فعّال: نقل المعلومات أو بناء العلاقات الاجتماعية."],["Accuracy is correct use of grammar, vocabulary and pronunciation, and fluency is speaking smoothly without undue hesitation; practice moves **controlled → guided → free**, and current approaches integrate the two.","الدقة صحة اللغة والطلاقة انسيابها، والتدريب من المضبوط إلى الموجّه إلى الحر."],["Beginners speak more easily through **story retelling** and familiar topics, which build confidence before freer talk.","المبتدئ يبدأ بإعادة سرد القصص والموضوعات المألوفة حتى يبني ثقته."],["Fluency grows through repetition: in the [[**4/3/2 technique**|en.spk.fluency]] a learner gives the same talk to three partners in 4 → 3 → 2 minutes, and **task repetition** with pre-task planning time improves fluency and complexity.","تقنية 4/3/2 وتكرار المهمة مع وقت للتخطيط المسبق يرفعان الطلاقة والتعقيد."],["In pronunciation the modern goal is [[**intelligibility**|en.l17-we]], not a **native-like accent**; Jenkins' [[Lingua Franca Core|en.spk.lfc]] keeps consonants, initial clusters, vowel length and nuclear stress, while /θ/–/ð/ are less essential.","الهدف أن يُفهم المتحدث لا أن يقلّد لكنة أهل اللغة، ونواة جنكنز تحدد الأساسي في النطق."]],"t":[["Accuracy","The ability to use language correctly (grammar, vocabulary, pronunciation).","الدقة"],["Fluency","The ability to speak smoothly and continuously without undue hesitation.","الطلاقة"],["Monologue","Extended speech by one speaker (e.g. a short talk).","حديث فردي"],["Transactional function","Using language to exchange information.","تبادلي: نقل معلومات"],["Interactional function","Using language to build and maintain social relationships.","تفاعلي: علاقات"],["Intelligibility","The degree to which a speaker's message is actually understood by listeners.","الوضوح والمفهومية"],["Lingua Franca Core","Jenkins' set of pronunciation features considered essential for intelligibility between non-native speakers.","نواة الإنجليزية المشتركة"],["4/3/2 technique","A fluency activity in which the same talk is repeated to new listeners in shrinking time limits.","تقنية 4/3/2"],["Task repetition","Doing the same or a similar task again so learners can focus more on fluency and accuracy.","تكرار المهمة"]]},{"h":["Oral drills","التدريبات الشفهية"],"pts":[["Oral drills are controlled practice that mainly improves **pronunciation and accuracy**, a technique rooted in the [[Audio-Lingual Method|en.meth.alm]].","التدريبات الشفهية تدريب مضبوط يحسّن النطق والدقة، وجذورها في الطريقة السمعية الشفهية."],["In [[**choral drilling**|en.spk.drills]] the whole class repeats the teacher's model together; in a repetition drill learners repeat exactly what they hear, and back-chaining drills a long sentence starting from the end.","في الترديد الجماعي يكرر الفصل النموذج معاً، والبناء العكسي يبدأ الجملة الطويلة من آخرها."],["A substitution drill replaces one word in a sentence pattern with a cue, while changing a sentence's form, such as passive → active, is a **transformation** drill, not substitution.","الاستبدال يغيّر كلمة واحدة في النمط، أما تحويل المجهول إلى معلوم فتدريب تحويل."],["Imperative drills use commands, such as 'Stand up' or 'Open your book', that learners answer with a physical action.","تدريبات الأوامر: يسمع الطالب أمراً فيستجيب له بحركة جسدية."]],"t":[["Choral drilling","The whole class repeats a model together.","ترديد جماعي"],["Repetition drill","Learners repeat exactly what they hear.","تكرار"],["Substitution drill","Learners replace one item in a sentence pattern with a cue.","استبدال"],["Transformation drill","Learners change a sentence's form (active ↔ passive, positive ↔ negative).","تحويل"],["Back-chaining","Drilling a long sentence starting from the end.","بناء عكسي"],["Imperative drills","Drills in which commands elicit physical responses.","تدريبات الأوامر"]]},{"h":["Speaking activities","أنشطة الكلام"],"pts":[["Speaking activities give learners a real reason to talk: information gaps, role plays, jigsaw tasks, discussions and games.","أنشطة الكلام تعطي الطالب سبباً حقيقياً للحديث، مثل فجوة المعلومات ولعب الأدوار والتجميع والألعاب."],["In an [[**information gap**|en.spk.activities]] each learner holds information the partner needs to finish the task, so it is a speaking activity, not a reading one.","في فجوة المعلومات يملك كل طالب ما يحتاجه زميله، فهي نشاط كلام لا قراءة."],["A role play with a friend and then with a minister practises **different registers**; during role play the teacher is a **facilitator** who monitors, supports and gives feedback afterwards.","لعب الدور مع صديق ثم وزير يدرّب على مستويات الخطاب، والمعلم فيه ميسّر."],["Shy students do better in **group-based** activities, and games add competition; in a one-on-one oral interview the focus is on **correct content**.","الطالب الخجول يرتاح في العمل الجماعي، والمقابلة الفردية تركّز على صحة المحتوى."],["Teach [[**repair strategies**|en.spk.peer]] — set phrases such as 'Sorry, could you say that again?' — so learners can fix breakdowns and keep the conversation going.","علّم عبارات إصلاح التواصل حتى يكمل الطالب الحديث إذا انقطع الفهم."]],"t":[["Information gap","A task where each learner holds information the other needs.","فجوة معلومات"],["Role play","Learners act out characters or situations using appropriate language.","لعب الأدوار"],["Register","A variety of language suited to a situation (formal vs informal).","مستوى الخطاب"],["Jigsaw","Each learner/group masters one part and teaches it to others.","التجميع"],["Turn-taking","The skill of knowing when to speak and when to give the floor.","تبادل الأدوار"],["Interactive / partially interactive / non-interactive speaking","Conversation or phone call / speech to a live audience / recording for radio.","تفاعلي / شبه / غير تفاعلي"],["Repair strategies","Phrases and moves used to fix communication breakdowns, e.g. asking for repetition or help.","استراتيجيات إصلاح التواصل"]]},{"h":["Teacher questions and eliciting","أسئلة المعلم والاستنباط"],"pts":[["Teacher questions differ in two ways: whether the teacher already knows the answer, and how open the possible answers are.","تختلف أسئلة المعلم: هل يعرف الجواب مسبقاً؟ وهل الإجابة مفتوحة أم محددة؟"],["With [[**display questions**|en.spk.questions]] the teacher knows the answer and checks knowledge; **referential questions** are genuine and open-ended, seeking new information or opinions.","سؤال العرض يعرف المعلم جوابه، والسؤال المرجعي حقيقي مفتوح يطلب رأياً أو معلومة جديدة."],["**Closed-ended questions** have a limited, fixed set of possible answers, so they ensure objectivity.","السؤال المغلق إجاباته محددة ومعدودة، ولذلك يضمن الموضوعية."],["**Eliciting** means giving clues so that students produce the answer or the language themselves instead of being told.","الاستنباط أن يعطي المعلم تلميحات حتى يصل الطالب للإجابة بنفسه."]],"t":[["Display question","A question whose answer the teacher already knows, used to check knowledge.","سؤال عرض"],["Referential question","A genuine question seeking new information or opinions.","سؤال مرجعي"],["Closed-ended question","A question with a limited, fixed set of possible answers.","سؤال مغلق"],["Eliciting","Techniques that draw language or ideas from learners rather than telling them.","الاستنباط"]]},{"h":["Errors and corrective feedback","الأخطاء والتغذية التصحيحية"],"pts":[["Corder distinguishes an [[**error**|en.spk.errors]], a systematic gap in competence, from a **mistake**, a performance slip the learner can self-correct.","عند كوردر: الخطأ نظامي سببه نقص المعرفة، والزلّة هفوة يصححها الطالب بنفسه."],["Lyster and Ranta describe six types of oral corrective feedback: either the teacher gives the correct form (explicit correction, recast) or pushes the learner to self-correct (clarification request, metalinguistic feedback, elicitation, repetition).","عند ليستر ورانتا ست صور للتصحيح: إما يعطي المعلم الصيغة أو يدفع الطالب لتصحيحها."],["An effective, gentle technique is to **praise the comment and repeat the utterance correctly** — a [[recast|en.spk.feedback]]; unlike explicit correction, a recast never says 'that's wrong'.","امدح الفكرة وأعد الجملة صحيحة، وهذه إعادة صياغة ضمنية لا تقول «هذا خطأ»."],["During **fluency** activities do not interrupt: note the errors, give **delayed** feedback afterwards and correct selectively, focusing on errors linked to the lesson aim.","في أنشطة الطلاقة لا تقاطع: دوّن الأخطاء وصحّحها لاحقاً وبانتقائية."],["**Peer correction** builds [[learner autonomy|en.mat.autonomy]] and cooperation, but the teacher still confirms the correct form.","تصحيح الأقران يبني الاستقلالية والتعاون، ويبقى المعلم مؤكداً للصيغة الصحيحة."]],"t":[["Error","A systematic deviation caused by lack of knowledge (competence).","خطأ نظامي"],["Mistake (slip)","A performance lapse the learner can self-correct.","زلّة"],["Recast","The teacher implicitly reformulates the learner's utterance correctly.","إعادة صياغة ضمنية"],["Explicit correction","The teacher clearly indicates the error and gives the correct form.","تصحيح صريح"],["Clarification request","The teacher signals misunderstanding, e.g. 'Pardon?'.","طلب توضيح"],["Metalinguistic feedback","Comments or questions about the rule without giving the correct form.","تعليق على القاعدة"],["Elicitation","The teacher pauses or asks so the learner completes the correct form.","استنباط"],["Repetition (feedback)","The teacher repeats the error with rising intonation.","تكرار الخطأ"],["Selective correction","Correcting only certain errors related to the lesson aim.","تصحيح انتقائي"],["Delayed correction","Correcting after a fluency activity rather than interrupting.","تصحيح مؤجل"],["Peer correction","Learners correct one another's errors, usually before the teacher intervenes.","تصحيح الطلاب لبعضهم"]],"map":{"title":["Oral corrective feedback — Lyster & Ranta","⁧أنواع التغذية التصحيحية الستة⁩"],"type":"cards","groups":[{"n":"Teacher gives the form","ar":"⁧المعلم يقدّم الصحيح⁩","items":[{"n":"Recast","who":"Lyster & Ranta","ar":"⁧يعيد الجملة صحيحة ضمناً⁩","kw":["You went?"],"d":"en.spk.feedback"},{"n":"Explicit correction","ar":"⁧يقول صراحة إنها خطأ⁩","kw":["No, say 'went'"]}],"trap":"⁧الإعادة الضمنية بلا «هذا خطأ»⁩"},{"n":"Learner self-corrects","ar":"⁧الطالب يصحّح نفسه · يثمر تصحيحاً ذاتياً أكثر⁩","items":[{"n":"Elicitation","ar":"⁧وقفة ليكمل الطالب⁩","kw":["She…?"]},{"n":"Metalinguistic","ar":"⁧تعليق على القاعدة⁩","kw":["We use the past with 'yesterday'."]},{"n":"Clarification request","ar":"⁧يطلب التوضيح⁩","kw":["Pardon?"]},{"n":"Repetition","ar":"⁧يكرر الخطأ بنغمة صاعدة⁩","kw":["He go?"]}]}]}},{"h":["Pronunciation: sounds and Arab learners","النطق: الأصوات والمتعلم العربي"],"pts":[["Pronunciation covers segmental features (individual consonants and vowels) and suprasegmental features (stress, intonation and rhythm across sounds).","النطق يشمل الأصوات المفردة، والملامح فوق المقطعية كالنبر والتنغيم والإيقاع."],["**/p/** is the [[hardest sound for Arab learners|en.spk.arab]] because Arabic has no /p/, so it is confused with /b/; /v/, /tʃ/, /ŋ/ and consonant clusters also cause problems.","صوت /p/ أصعب الأصوات على المتعلم العربي لغيابه عن العربية، فيخلطه بصوت /b/."],["Saying [b] for [p] in 'protocol' is **underdifferentiation**: two L2 phonemes are merged because the L1 lacks the contrast; inserting a vowel to break a cluster ('estreet') is epenthesis.","نطق b مكان p دمج لصوتين لا تفرّق بينهما العربية، أما estreet فمثال على إقحام صوت."],["Minimal pairs such as **fan/van** train new contrasts because the words differ in only one sound in the same position; lamb/lamp is not a minimal pair.","الزوج الصغير مثل fan/van يختلف في صوت واحد بالموضع نفسه، أما lamb/lamp فليس منه."],["Teenagers' trouble with new sounds often comes from **self-consciousness**; in the brain, **Broca's area** (left hemisphere) controls speech production, and pictures are good prompts for speaking and writing.","حرج المراهق يعيق نطقه للأصوات الجديدة، ومنطقة بروكا في النصف الأيسر مسؤولة عن إنتاج الكلام."]],"t":[["Minimal pair","Two words differing in only one sound in the same position (ship/sheep).","زوج صغير"],["Underdifferentiation","Merging two distinct L2 sounds into one because L1 lacks the contrast.","دمج فونيمين"],["Segmental features","Individual sounds: consonants and vowels.","الأصوات المفردة"],["Suprasegmental features","Stress, intonation and rhythm across sounds.","فوق المقطعية"],["Epenthesis","Inserting a vowel to break up a consonant cluster ('estreet').","إقحام صوت"]]},{"h":["Word stress","نبر الكلمة"],"pts":[["Every word of two or more syllables has one **primary stress**: that syllable is louder, longer and higher in pitch.","كل كلمة من مقطعين فأكثر لها نبر رئيسي واحد: أعلى صوتاً وأطول وأرفع نغمة."],["Stress follows [[tendencies|en.spk.stress]] rather than fixed rules: most two-syllable nouns stress the first syllable (**TA**ble) and most two-syllable verbs the second (de**CIDE**).","الاسم ذو المقطعين يُنبر أوله غالباً، والفعل ذو المقطعين يُنبر ثانيه."],["Stress can change word class, **meaning and pronunciation**: RE-cord is a noun, while re-CORD is a verb.","النبر قد يغيّر نوع الكلمة ومعناها ونطقها، مثل كلمة record اسماً وفعلاً."],["Words ending in **-tion, -sion, -ic, -ity** stress the syllable just before the suffix (infor-MA-tion), and compound nouns usually stress the **first** part (BLACKboard).","يقع النبر قبل هذه اللواحق مباشرة، والاسم المركّب يُنبر جزؤه الأول غالباً."],["Show the pattern with **circles (oOo)**, clapping or tapping, and teach the stress together with every new word.","اعرض نمط النبر بالدوائر أو التصفيق، وعلّمه مع كل كلمة جديدة."]],"t":[["Word stress","The relative prominence of one syllable within a word.","نبر الكلمة"],["Primary stress","The strongest stress in a word, marked ˈ in IPA before the syllable.","النبر الرئيسي"],["Stress pattern","The arrangement of stressed and unstressed syllables in a word, often shown as oO, Oo, oOo.","نمط النبر"]]},{"h":["Sentence stress and intonation","نبر الجملة والتنغيم"],"pts":[["In a sentence, **content words** carry the stress while function words usually take weak forms, and this pattern gives English its rhythm.","كلمات المحتوى تُنبر وكلمات الوظيفة تضعف، وهذا ما يصنع إيقاع الإنجليزية."],["The **tonic (nuclear) syllable** carries the main pitch movement, by default on the last content word; **contrastive stress** moves it to show contrast: 'I didn't take YOUR pen.'","المقطع النووي على آخر كلمة محتوى، والنبر التقابلي ينقله لإظهار المقابلة."],["[[**Falling** intonation|en.spk.intonation]] is used for statements, wh-questions and commands; **rising** intonation for yes/no questions, surprise and unfinished lists.","التنغيم الهابط للإخبار وأسئلة الاستفهام والأوامر، والصاعد لأسئلة نعم ولا والدهشة."],["**Question tags** follow the same logic: a falling tag means the speaker is sure and asks for agreement, while a rising tag is a real question.","الذيل الهابط طلب موافقة من متحدث متأكد، والذيل الصاعد سؤال حقيقي."],["Teach intonation through **meaning and attitude** — arrows, gestures and dialogues — rather than as abstract rules.","علّم التنغيم من خلال المعنى والموقف بالأسهم والإيماءات والحوارات، لا كقواعد مجردة."]],"t":[["Sentence stress","Stress on the key content words of an utterance, which gives English its rhythm.","نبر الجملة"],["Tonic (nuclear) syllable","The syllable in a tone unit that carries the main pitch movement.","المقطع النووي"],["Contrastive stress","Placing stress on a word to show contrast or correct information.","نبر تقابلي"],["Falling intonation","Pitch that goes down, typical of statements, wh-questions and commands.","تنغيم هابط"],["Rising intonation","Pitch that goes up, typical of yes/no questions and incomplete thoughts.","تنغيم صاعد"]]}],"trap":[["Information gap is a speaking activity, not reading.","فجوة المعلومات كلام"],["Passive → active = transformation drill (not substitution).","تحويل"],["A recast has no 'that's wrong'; explicit correction does.","الضمنية بلا خطأ صريح"],["During fluency activities, do not interrupt — correct later.","لا تقاطع في الطلاقة"]],"vid":[["kOB0DvmQnDo","ar","مقدمة في مهارة التحدث","الدافورة",18],["LX3biRF5TIo","ar","المهارات الفرعية في التحدث","الدافورة",30],["q2JCDrtC28M","en","Error correction – Part 3: How to correct","Jo Gakonga",6],["cmzHI9q5p_0","ar","مفهوم التغذية الراجعة وأنواعها","الدافورة",11]],"n":2},{"id":"L03","d":"P","std":"6.9.1","en":"Teaching Reading","ar":"تدريس القراءة","goal":["Distinguish skimming from scanning, the three reading models, comprehension levels and strategies.","القراءة السريعة والانتقائية والنماذج ومستويات الفهم"],"sec":[{"h":["How reading works: three models","كيف تتم القراءة: ثلاثة نماذج"],"pts":[["Models of reading explain how readers build meaning: upward from the text (bottom-up), downward from their own knowledge (top-down), or both together.","نماذج القراءة تشرح بناء المعنى: من النص صعوداً، أو من خبرة القارئ نزولاً، أو بالاثنين معاً."],["Reading word by word and looking up every unknown word is a [[**bottom-up**|en.rd.models]] strategy: meaning is built from letters and words in sequence.","القراءة كلمة كلمة والبحث عن كل كلمة مجهولة استراتيجية من الأسفل.","o"],["Top-down reading uses prior knowledge and context to predict and interpret, so activating the reader's schema before reading supports it.","القراءة من الأعلى تستخدم الخلفية والسياق للتوقع والتفسير، وتنشيط الخلفية يدعمها."],["In the interactive-compensatory model (Stanovich) readers use both processes and compensate for a weakness in one with strength in the other.","في النموذج التفاعلي التعويضي يستخدم القارئ الطريقتين، ويعوّض ضعف إحداهما بقوة الأخرى."],["**Decoding** — translating written symbols into sounds and words — is the first stage in learning to read.","فك الترميز، أي تحويل الحروف المكتوبة إلى أصوات وكلمات، أول مراحل تعلّم القراءة."]],"t":[["Bottom-up reading","Building meaning from letters and words in sequence.","من الأسفل"],["Top-down reading","Using prior knowledge and context to predict and interpret.","من الأعلى"],["Interactive-compensatory model","Readers use both processes and compensate for weaknesses in one with the other.","التفاعلي التعويضي"],["Decoding","Translating written symbols into sounds and words.","فك الترميز"],["Schema activation","Using background knowledge to understand a passage.","تنشيط الخلفية"]],"map":{"title":["Models of reading","⁧نماذج القراءة⁩"],"type":"fan","groups":[{"n":"Bottom-up","who":"Gough","ar":"⁧من الحروف إلى الكلمات بالترتيب؛ النص يقود الفهم⁩","items":[{"n":"word by word"},{"n":"decoding"},{"n":"un- + believe + -able"}],"d":"en.rd.models"},{"n":"Top-down","who":"Goodman","ar":"⁧الخلفية والتوقع يقودان الفهم: «لعبة تخمين نفسية لغوية»⁩","items":[{"n":"schema"},{"n":"predicting"}]},{"n":"Interactive-compensatory","who":"Stanovich","ar":"⁧يجمعهما، والقوي يعوّض الضعيف⁩","items":[{"n":"both at once"}]}]}},{"h":["Skimming and scanning","القراءة السريعة والانتقائية"],"pts":[["Skimming and scanning are both fast reading, but with different purposes: the general idea versus one specific piece of information.","كلتاهما قراءة سريعة، لكن الأولى للفكرة العامة والثانية لمعلومة محددة."],["[[**Skimming**|en.rd.skimscan]] is quick reading for the gist, for example choosing a title for a text or overviewing a chapter.","القراءة السريعة لأخذ الفكرة العامة، مثل اختيار عنوان للنص أو تصفّح فصل."],["**Scanning** is searching for specific information — a date, a name, or a word in a dictionary — so looking up a dictionary word is scanning.","القراءة الانتقائية بحث عن معلومة محددة كتاريخ أو اسم، والبحث في القاموس منها."],["After a fast first reading, learners often read for detail: careful reading to understand specific points.","بعد القراءة السريعة تأتي القراءة للتفاصيل: قراءة متأنية لفهم نقاط محددة."]],"t":[["Skimming","Reading quickly to get the general idea or gist of a text.","قراءة سريعة"],["Scanning","Reading quickly to locate specific information.","قراءة انتقائية"],["Reading for gist","Reading to understand the main idea only.","الفكرة العامة"],["Reading for detail","Careful reading to understand specific points.","التفاصيل"]]},{"h":["Intensive, extensive, silent and oral reading","القراءة المكثفة والموسعة والصامتة والجهرية"],"pts":[["**Intensive reading** studies a short text closely for its linguistic and semantic details; the text is short and detailed, not long.","القراءة المكثفة نص قصير يُدرس بتفصيل لغوي ومعنوي، لا نص طويل."],["[[**Extensive reading**|en.rd.er]] means reading lots of easy, enjoyable material, such as graded readers, for pleasure and fluency.","القراءة الموسعة قراءة كثيرة لمواد سهلة وممتعة، مثل القصص المتدرجة."],["Day & Bamford's principles for extensive reading: the material is **easy**, varied and chosen by learners; they read a lot, for pleasure, with few tests, and the teacher models reading.","مبادئ داي وبامفورد: مادة سهلة متنوعة يختارها الطالب، وقراءة كثيرة للمتعة بلا اختبارات كثيرة."],["**Silent reading** is faster and focused on meaning, so it builds reading fluency; **oral reading** is slower and mainly checks decoding and pronunciation.","الصامتة أسرع وتركّز على المعنى فتبني الطلاقة، والجهرية أبطأ وتفحص فك الترميز والنطق."]],"t":[["Extensive reading","Reading large quantities of easy material for pleasure and fluency.","موسّعة"],["Intensive reading","Close, detailed reading of a short text for language and meaning.","مكثفة"],["Graded readers","Books simplified to suit learners' levels.","قصص متدرجة"],["Silent reading","Reading without vocalising, focusing on meaning; it builds speed and comprehension.","القراءة الصامتة"],["Oral reading","Reading aloud; used mainly to check decoding and pronunciation.","القراءة الجهرية"],["Day & Bamford's principles","Ten principles for extensive reading programmes: easy, varied, self-selected, plentiful reading for pleasure.","مبادئ القراءة الموسعة"]]},{"h":["Comprehension: levels and strategies","الفهم: مستوياته واستراتيجياته"],"pts":[["Comprehension works at three levels — literal (what is stated), interpretive or inferential (what is implied) and critical or applied (judging the text) — and identifying the **purpose of reading** increases comprehension and retention.","للفهم ثلاثة مستويات: حرفي وتفسيري وناقد، وتحديد هدف القراءة يرفع الفهم والتذكر."],["Using prior knowledge and the title before reading is [[**predicting**|en.rd.strategies]]; combining background knowledge with text clues to reach an unstated meaning is **inferring**.","التوقع قبل القراءة من العنوان والخلفية، والاستنتاج يجمع الخلفية مع قرائن النص."],["Stating the main ideas briefly in one's own words is **summarizing**, while restating the same idea in different wording is paraphrasing; noticing and fixing problems with understanding is **monitoring**.","التلخيص ذكر الأفكار الرئيسة بإيجاز، وإعادة الصياغة الفكرة نفسها بألفاظ أخرى، والمراقبة إصلاح الفهم."],["Asking 'How plausible is the poor man's story?' after reading is **critical reading**, and linking texts by the same author or theme makes **text-to-text connections**.","الحكم على معقولية القصة قراءة ناقدة، وربط نصين بكاتب أو موضوع ربط نص بنص."],["Routines such as [[KWL|en.rd.tools]], SQ3R and reciprocal teaching organise these strategies; maps, graphs and pictures are **pictorial** aids, and an English–English dictionary best expands vocabulary.","روتينات مثل KWL والتدريس التبادلي تنظّم الاستراتيجيات، والقاموس الإنجليزي الأحادي أفضل لتوسيع المفردات."]],"t":[["Inferring","Using background knowledge and text clues to reach unstated meaning.","استنتاج"],["Predicting","Using clues and prior knowledge to anticipate content.","توقع"],["Summarizing","Stating the main ideas briefly in one's own words.","تلخيص"],["Paraphrasing","Restating the same idea with significantly different wording.","إعادة صياغة"],["Comprehension monitoring","Noticing and repairing breakdowns in understanding while reading.","مراقبة الفهم"],["Literal comprehension","Understanding what is explicitly stated.","فهم حرفي"],["Interpretive comprehension","Using logic to infer meaning beyond the text.","فهم تفسيري"],["Critical reading","Evaluating and judging a text's ideas, purpose and credibility.","قراءة ناقدة"],["Text-to-text connection","Linking a text to another text with a common author or theme.","ربط بين نصين"],["Visualizing","Forming mental images while reading.","تصوّر"],["KWL chart","Know – Want to know – Learned organizer.","جدول KWL"],["SQ3R","Survey, Question, Read, Recite, Review.","طريقة SQ3R"],["Reciprocal teaching","Predict, question, clarify, summarize in turns.","التدريس التبادلي"]],"map":{"type":"steps","title":["Levels of reading comprehension","⁧مستويات الفهم القرائي⁩"],"groups":[{"n":"Literal","ar":"⁧حرفي: قراءة السطور⁩","tag":"What did he find?"},{"n":"Inferential","ar":"⁧استنتاجي: ما بين السطور⁩","tag":"Why did he hide it?"},{"n":"Critical","ar":"⁧ناقد: ما وراء السطور⁩","tag":"Was his decision wise?"}]}},{"h":["Learning to read: cueing, phonics and fluency","تعلّم القراءة: التلميحات والصوتيات والطلاقة"],"pts":[["Readers identify words through three cueing systems: [[**semantic** cueing|en.rd.cueing]] uses meaning, pictures and context; syntactic cueing uses grammar fit; graphophonic cueing uses letter–sound links.","يتعرف القارئ على الكلمة بثلاثة تلميحات: دلالي بالمعنى والصورة، ونحوي بالتركيب، وصوتي بالحروف."],["Rhyming and syllable games build **phonological awareness**: segmenting breaks a word into its sounds, and blending joins sounds into a word.","ألعاب القافية والمقاطع تبني الوعي الصوتي: تجزئة الكلمة إلى أصوات ودمج الأصوات في كلمة."],["[[**Synthetic phonics**|en.rd.phonics]] teaches letter–sound links first and then blends them (/k/ /æ/ /t/ → cat); analytic phonics finds sound–spelling patterns in words learners already know.","الصوتيات التركيبية تبدأ بالأصوات ثم تدمجها، والتحليلية تستخرج الأنماط من كلمات معروفة."],["Fluency begins with [[direct instruction|en.rd.fluency]] and grows through **repeated reading** and timed reading (words per minute); for learners with **dyslexia**, the priority is improving word recognition.","الطلاقة تبدأ بالتعليم المباشر وتنمو بالقراءة المتكررة والمؤقتة، وعسر القراءة يحتاج تحسين تمييز الكلمات."],["Arab learners need extra work on **vowel letters** and left-to-right [[word recognition|en.rd.arab]], because Arabic is written right to left and usually without short vowels.","العربي يحتاج تدريباً على الحروف الصائتة والقراءة من اليسار، فالعربية تُكتب من اليمين بلا حركات غالباً."]],"t":[["Semantic cueing","Using meaning, context and pictures to identify words.","تلميح دلالي"],["Syntactic cueing","Using sentence structure to identify words.","تلميح نحوي"],["Graphophonic cueing","Using letter–sound relationships.","تلميح صوتي كتابي"],["Phonological awareness","Awareness of the sound structure of words (rhymes, syllables, phonemes).","وعي صوتي"],["Segmenting","Breaking a word into its individual sounds.","تجزئة"],["Blending","Combining individual sounds to form a word.","دمج"],["Authentic material","Texts produced for real-world purposes (web pages, newspapers, menus).","مادة أصيلة"],["Repeated reading","Reading the same short text several times to increase speed, accuracy and expression.","القراءة المتكررة"],["Timed reading","Reading a text against the clock and recording reading rate to build fluency.","القراءة المؤقتة"],["Synthetic phonics","Teaching individual letter–sound links first and then blending them into words.","الصوتيات التركيبية"],["Analytic phonics","Teaching sound–spelling patterns by analysing whole words learners already know.","الصوتيات التحليلية"]]}],"trap":[["Looking up a word in a dictionary = scanning.","القاموس = انتقائية"],["Choosing a title = skimming (reading for gist).","العنوان = سريعة"],["Background knowledge + text clues = inferring; prior knowledge + title before reading = predicting.","استنتاج / توقع"],["Intensive reading text = short and detailed, not long.","المكثفة قصيرة"]],"vid":[["TooxwNeeBdI","ar","استراتيجيات القراءة","الدافورة",41],["2MsNit5DNWQ","ar","أنواع القراءة","الدافورة",31],["F1wPYHa5nUg","en","Skimming and Scanning","Colleen Dafoe",6]],"n":3},{"id":"L04","d":"P","std":"6.9.1","en":"Teaching Vocabulary","ar":"تدريس المفردات","goal":["Know types of vocabulary, ways of presenting meaning, vocabulary activities and what makes words memorable.","أنواع المفردات وعرض المعنى والأنشطة"],"sec":[{"h":["What it means to know a word","معنى أن تعرف كلمة"],"pts":[["Words a learner understands when reading or listening are **receptive** vocabulary; words he can use in speaking and writing are productive vocabulary, and the receptive store is usually larger.","المفردات الاستقبالية يفهمها الطالب، والإنتاجية يستخدمها، والاستقبالية أكثر عادةً."],["According to [[Nation|en.voc.knowing]], knowing a word means knowing its **form, meaning and use**, not just its translation.","عند نيشن: معرفة الكلمة تعني معرفة شكلها ومعناها واستخدامها، لا ترجمتها فقط."],["Vocabulary **breadth** is how many words a learner knows; depth is how well he knows each one — spelling, pronunciation, collocations, register and word family.","الاتساع عدد الكلمات المعروفة، والعمق جودة معرفة كل كلمة: إملاؤها ونطقها وتلازمها وعائلتها."]],"t":[["Receptive vocabulary","Words a learner recognizes and understands in listening or reading.","مفردات استقبالية"],["Productive vocabulary","Words a learner can use in speaking and writing.","مفردات إنتاجية"],["Form – meaning – use","Nation's three aspects of knowing a word.","شكل ومعنى واستخدام"],["Vocabulary breadth / depth","Size of vocabulary vs quality of knowledge of each word.","اتساع / عمق المفردات"]]},{"h":["Presenting and checking meaning","عرض المعنى والتحقق منه"],"pts":[["Meaning can be shown with real objects, drawings, flashcards, semantic maps or context; bringing real objects into class is [[**realia**|en.voc.present]], and pictures or drawings are not realia.","يُعرض المعنى بأشياء حقيقية أو رسم أو بطاقات أو خرائط دلالية، والأشياء الحقيقية غير الصور والرسوم."],["The easiest way to present a word like 'snake' is **drawing it on the whiteboard**.","أسهل طريقة لعرض كلمة snake أن يرسمها المعلم على السبورة.","o"],["Don't teach words in isolation: the surrounding **context** clarifies meaning and shows how the word is used.","لا تعلّم الكلمة معزولة، فالسياق يوضح معناها ويبيّن طريقة استخدامها."],["While reading, the most effective strategy for dealing with a new word is **guessing** its meaning from context.","أنجح استراتيجية للكلمة الجديدة أثناء القراءة تخمين معناها من السياق.","o"],["Words from one topic are often taught together as a **lexical set** (sports: archery, fencing, rowing, scuba diving), and either/or [[**CCQs**|en.gr.ccq]] check the meaning: 'starving' → 'A little hungry or extremely hungry?'","كلمات الموضوع الواحد تُعلّم معاً، وأسئلة الاختيار الثنائي تتحقق من فهم المعنى."]],"t":[["Realia","Real objects brought into class to illustrate meaning.","أشياء حقيقية تُحضر للفصل"],["Flashcard","A card with a prompt on one side and the answer/information on the other.","بطاقة تعليمية"],["Semantic map","A diagram linking a word to related words and ideas.","خريطة دلالية"],["Guessing from context","Inferring an unknown word's meaning from surrounding words and clues.","التخمين من السياق"],["Lexical set","A group of words from the same topic or semantic field presented together.","مجموعة معجمية"]]},{"h":["Remembering words","تذكّر الكلمات"],"pts":[["A word is remembered faster the more [[**frequently**|en.voc.memory]] it is met, so teachers recycle vocabulary in later activities and use spaced repetition (reviews at increasing intervals).","كلما تكرر لقاء الكلمة ثبتت أسرع، لذلك نعيد تدويرها ونراجعها على فترات متباعدة."],["**Incidental** learning happens while reading or listening for meaning; intentional learning comes from deliberate study.","التعلم العرضي يحدث أثناء القراءة والاستماع للمعنى، والمقصود يأتي من الدراسة المتعمدة."],["Words linked around one topic (tree → apples, leaves) show [[**association**|en.voc.assoc]], not synonymy, and these mental links help learners store and recall words.","الكلمات المترابطة حول موضوع واحد تداعٍ لا ترادف، وهذا الترابط يساعد على الحفظ والتذكر."],["A simple review routine is to **write** the word, look at it, practise it and repeat over several days.","روتين المراجعة: اكتب الكلمة، انظر إليها، تدرّب عليها، ثم كرّرها عدة أيام."]],"t":[["Spaced repetition","Reviewing items at increasing intervals over time.","تكرار متباعد"],["Recycling","Re-using vocabulary in later activities and contexts.","إعادة تدوير"],["Incidental learning","Learning words unintentionally while focusing on meaning.","تعلم عرضي"],["Word association","The mental links between words that belong to the same topic or experience (desert – sand – camel).","تداعي الكلمات وترابطها"]]},{"h":["Vocabulary activities and assessment","أنشطة المفردات وتقويمها"],"pts":[["Odd one out, crosswords, matching and bingo are [[**vocabulary** activities|en.voc.activities]], not listening or reading activities, and crosswords build **lexical** knowledge.","الكلمة الشاذة والكلمات المتقاطعة والمطابقة أنشطة مفردات، والمتقاطعة تبني المعرفة المعجمية."],["Teaching [[**affixes**|en.ling.morpheme]] (prefixes and suffixes) increases both vocabulary and syntactic ability, because learners can build and recognise new word forms.","تعليم السوابق واللواحق يزيد المفردات والقدرة النحوية معاً، لأنه يكشف صيغ الكلمات."],["Vocabulary assessment checks more than **meaning**: it also covers pronunciation, spelling, part of speech and usage.","تقويم المفردات يقيس المعنى والنطق والإملاء ونوع الكلمة وطريقة استخدامها."]],"t":[["Odd one out","Learners identify the word that does not belong to a group.","الكلمة الشاذة"],["Lexical knowledge","Knowledge of words and their meanings.","معرفة معجمية"],["Affixes","Prefixes and suffixes added to roots.","سوابق ولواحق"]]},{"h":["Collocations, chunks and idioms","التلازم اللفظي والكتل والتعابير"],"pts":[["Vocabulary is more than single words: words that habitually go together, such as 'make a decision' or 'heavy rain', are [[**collocations**|en.voc.lexical]].","المفردات أكثر من كلمات مفردة، فالكلمات التي تأتي معاً عادةً تسمى تلازماً لفظياً."],["Michael Lewis's **Lexical Approach** sees language as grammaticalized lexis: learners acquire multi-word chunks and use them as wholes instead of building every sentence from rules.","المدخل المعجمي عند مايكل لويس: اللغة كتل جاهزة تُتعلم وتُستخدم كاملة، لا قواعد فقط."],["**Idioms**, whose meaning cannot be deduced from their individual words, are the best vocabulary route to a language's culture.","التعابير الاصطلاحية لا يُفهم معناها من كلماتها، وهي أفضل مدخل مفرداتي لثقافة اللغة."]],"t":[["Collocation","Words that habitually co-occur (heavy rain, make a mistake).","تلازم لفظي"],["Lexical chunks","Multi-word units learned and used as wholes.","كتل لغوية"],["Lexical Approach","Michael Lewis's approach centred on chunks rather than grammar rules.","المدخل المعجمي"],["Idiom","An expression whose meaning cannot be deduced from its individual words.","تعبير اصطلاحي"]]},{"h":["Research principles: coverage, frequency and corpora","مبادئ من البحث: التغطية والتكرار والمدونات"],"pts":[["Nation's four strands give a balanced vocabulary programme roughly equal time: meaning-focused input, meaning-focused output, language-focused learning and fluency development.","خيوط نيشن الأربعة بوقت متقارب: مدخل للمعنى، وإنتاج للمعنى، وتركيز على اللغة، وتنمية الطلاقة."],["[[**Lexical coverage**|en.voc.coverage]] matters: readers need to know about 95% of the words for adequate comprehension and about 98% for comfortable, unassisted reading.","يحتاج القارئ معرفة 95% من الكلمات للفهم المقبول، و98% للقراءة المريحة دون مساعدة."],["Teach frequent words first: West's **General Service List** has about 2,000 high-frequency words, and Coxhead's Academic Word List adds 570 word families for academic texts.","ابدأ بالكلمات الأكثر تكراراً: قائمة وست نحو 2,000 كلمة، وقائمة كوكسهيد الأكاديمية 570 عائلة."],["**Word cards** with retrieval (trying to recall the meaning) and spaced review are an efficient way of deliberate learning.","البطاقات مع محاولة الاسترجاع والمراجعة المتباعدة طريقة فعّالة للتعلم المقصود."],["A [[**concordance**|en.voc.corpus]] shows a word in many real contexts from a corpus; in data-driven learning (Johns), learners examine these lines and discover the patterns themselves.","الكونكوردانس يعرض الكلمة في سياقات حقيقية، وفي التعلم من البيانات يكتشف الطالب أنماطها بنفسه."]],"t":[["Four strands (Nation)","Meaning-focused input, meaning-focused output, language-focused learning and fluency development.","خيوط نيشن الأربعة"],["Lexical coverage","The percentage of running words in a text that a reader knows.","نسبة التغطية المعجمية"],["Word family","A base word with its inflected and derived forms (use, uses, used, useful, useless).","عائلة الكلمة"],["Academic Word List (AWL)","Coxhead's list of 570 word families frequent across academic texts.","قائمة الكلمات الأكاديمية"],["Concordance","A list of corpus lines showing a word in its contexts (key word in context).","قائمة سياقات الكلمة"],["Data-driven learning","Learners examine corpus data to discover language patterns themselves (Johns).","التعلم من البيانات"]],"map":{"title":["Nation's four strands — roughly equal time","⁧خيوط نيشن الأربعة⁩"],"type":"fan","groups":[{"n":"Meaning-focused input","ar":"⁧التعلم بالاستماع والقراءة⁩","items":[{"n":"extensive reading"}],"d":"en.voc.strands"},{"n":"Meaning-focused output","ar":"⁧التعلم بالكلام والكتابة⁩","items":[{"n":"speaking"},{"n":"writing"}]},{"n":"Language-focused learning","ar":"⁧دراسة مقصودة للكلمات والظواهر⁩","items":[{"n":"word cards"},{"n":"affixes"}]},{"n":"Fluency development","ar":"⁧استخدام المعروف بسرعة، بلا لغة جديدة⁩","items":[{"n":"4/3/2"},{"n":"speed reading"}]}]}}],"trap":[["Odd one out = vocabulary, not listening or reading.","الشاذة = مفردات"],["Easiest way to present 'snake' = drawing (official handbook).","الرسم"],["Realia = real objects; pictures/drawings are different.","الأشياء الحقيقية، لا الصور ولا الرسوم"]],"vid":[["GVcP3ZAIpqE","ar","طرق تدريس المفردات","الدافورة",29],["K9UmhEy9iZo","en","Three great ways to teach vocabulary","Jo Gakonga",4]],"n":4},{"id":"L05","d":"P","std":"6.9.1","en":"Teaching Writing","ar":"تدريس الكتابة","goal":["Distinguish product, process and genre approaches; know the writing stages, essay types and feedback.","مداخل الكتابة ومراحلها وأنواع المقال"]
