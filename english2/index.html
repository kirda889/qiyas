]],"traps":[["Explaining objectives at the start of a course is **not** meant to show that the curriculum is fixed and suggestions are ignored.","ليس لإغلاق باب الاقتراحات"],["Objectives are written by the teacher and shared before **and** during teaching.","قبل التدريس وأثناءه"]],"src":"Brown, Teaching by Principles; Echevarría, Vogt & Short, Making Content Comprehensible (SIOP)"},"en.obj.solo":{"k":"Objectives","t":["The SOLO Taxonomy (Biggs & Collis)","تصنيف SOLO"],"body":[["SOLO — **Structure of the Observed Learning Outcome** — classifies answers by how well their parts are connected, not by the verb used.","يصنّف الإجابات حسب ترابط أجزائها لا حسب الفعل."]],"map":{"type":"cards","groups":[{"n":"1","ar":"⁧ما قبل البنية⁩","items":[{"n":"Prestructural","ar":"⁧لا فهم أو إجابة خارج الموضوع⁩"}]},{"n":"2–3","ar":"⁧كمي⁩","items":[{"n":"Unistructural","ar":"⁧فكرة واحدة⁩"},{"n":"Multistructural","ar":"⁧أفكار متعددة غير مترابطة⁩"}]},{"n":"4–5","ar":"⁧نوعي⁩","items":[{"n":"Relational","ar":"⁧أفكار مترابطة في كلّ⁩"},{"n":"Extended abstract","ar":"⁧تعميم ونقل لسياق جديد⁩"}]}]},"traps":[["SOLO has **five** levels.","خمسة مستويات"]],"src":"Biggs & Collis, Evaluating the Quality of Learning: The SOLO Taxonomy"},"en.plan.lessonplan":{"k":"Planning","t":["Levels of Planning and the Lesson Plan","مستويات التخطيط وخطة الدرس"],"body":[["Planning moves from broad to detailed: **curriculum** (goals, content, methods, evaluation) → **syllabus** (course content and sequence) → **scheme of work** (the syllabus spread over a term or year) → **unit plan** → **lesson plan**. A lesson plan is a flexible map, not a script: the teacher adapts it when learners' responses show a need.","من العام إلى التفصيلي: منهج ← مقرر ← خطة فصلية ← خطة وحدة ← خطة درس، والخطة مرنة لا نص يُتلى."]],"pts":[["Components: aims/objectives, materials, stages and procedures, timing, interaction patterns, anticipated problems and solutions, assessment of the objective.","مكونات الخطة"],["Uses: a guide while teaching, a record of what was taught, evidence for an observer, a basis for reflection.","دليل وسجل ودليل للمشرف وأساس للتأمل"],["A **skeleton plan** gives only the general outline; a detailed plan scripts each stage.","الخطة الهيكلية عامة"]],"traps":[["A written plan does **not** show students' actual motivation and performance — that comes from feedback.","الخطة لا تُظهر الدافعية"],["Before planning: learners' level, needs and educational and cultural background; first question: 'What will students achieve?'","خلفية الطلاب والهدف أولاً"]],"src":"Harmer, The Practice of English Language Teaching; Scrivener, Learning Teaching; Richards, Curriculum Development in Language Teaching"},"en.plan.ppp":{"k":"Lesson shapes","t":["PPP and Other Lesson Shapes","PPP وأشكال الدرس الأخرى"],"body":[["**PPP** (Presentation → Practice → Production) moves from teacher-controlled input to learner-controlled use. It is clear and easy to plan, but critics note that it assumes language is learned in the same order it is presented.","PPP ينتقل من عرض يتحكم فيه المعلم إلى استخدام حر للطالب، وهو واضح لكنه يفترض أن اللغة تُتعلم بترتيب عرضها."],["Alternatives reorder the same elements: **TTT** (Test → Teach → Test) checks what learners know before teaching; Harmer's **ESA** (Engage, Study, Activate) allows flexible sequences; **TBL** puts the task first and the language focus last.","بدائل: اختبار ثم تعليم ثم اختبار، ونموذج ESA لهارمر، والتعلم بالمهام."]],"pts":[["Warm-up / lead-in: introduce the topic and activate prior knowledge.","التهيئة"],["Receptive-skills lessons: pre- → while- → post-.","قبل وأثناء وبعد"],["Wrap-up / closure: summarise and check objectives.","الختام"]],"traps":[["In an effective PPP lesson, presentation comes first and production last.","العرض أولاً"],["Correct order: lead-in → activity → feedback.","تهيئة ← نشاط ← تغذية راجعة"]],"src":"Harmer, The Practice of English Language Teaching; Scrivener, Learning Teaching"},"en.plan.gradual":{"k":"Sequencing","t":["Gradual Release and Scaffolding","النقل التدريجي والسقالات"],"body":[["Pearson and Gallagher's (1983) **gradual release of responsibility** shifts the load from teacher to learner in steps; Fisher and Frey later set it out as four phases: focused instruction (I do), guided instruction (we do), collaborative work (you do together) and independent work (you do alone). **Scaffolding** (Wood, Bruner & Ross, 1976) is the temporary support used along the way — models, sentence frames, prompts — withdrawn as competence grows.","انتقال المسؤولية من المعلم إلى الطالب على خطوات، مع دعم مؤقت يُسحب تدريجياً."]],"pts":[["Scaffolding connects to Vygotsky's Zone of Proximal Development.","مرتبط بمنطقة النمو القريبة"],["Sentence starters and graphic organisers are typical scaffolds.","بدايات الجمل والمنظمات"]],"traps":[["Scaffolding is **temporary**; permanent help is not scaffolding.","السقالات مؤقتة"]],"src":"Pearson & Gallagher (1983); Fisher & Frey, Better Learning Through Structured Teaching; Wood, Bruner & Ross (1976)"},"en.plan.backward":{"k":"Planning","t":["Backward Design (Wiggins & McTighe)","التصميم العكسي"],"body":[["In *Understanding by Design*, Wiggins and McTighe argue that teachers often plan activities first and hope they lead somewhere. Backward design reverses this into three stages.","بدل أن نبدأ بالأنشطة، نبدأ بالنتائج المرغوبة."]],"map":{"type":"cards","groups":[{"n":"Stage 1","ar":"⁧النتائج المرغوبة⁩","items":[{"n":"Desired results","ar":"⁧الأهداف والأسئلة الجوهرية⁩","kw":["essential questions"]}]},{"n":"Stage 2","ar":"⁧الأدلة المقبولة⁩","items":[{"n":"Evidence","ar":"⁧مهمة أداء واختبارات وروبرك⁩","kw":["performance task"]}]},{"n":"Stage 3","ar":"⁧خطة التعلم⁩","items":[{"n":"Learning plan","ar":"⁧الأنشطة والتدريس⁩","kw":["activities"]}]}]},"ex":[["A 'tourism' unit: the final task is a class brochure; the lessons recycle the language and skills it needs.","وحدة السياحة تنتهي بكتيّب يصممه الصف"]],"traps":[["Backward design starts with **desired results**, not with activities or materials.","يبدأ بالنتائج"],["Designing the rubric before choosing activities is a sign of backward design.","الروبرك قبل الأنشطة"]],"src":"Wiggins & McTighe, Understanding by Design"},"en.plan.syllabus":{"k":"Syllabus","t":["Synthetic vs Analytic Syllabuses","المنهج التركيبي والتحليلي"],"body":[["David Wilkins (1976) distinguished two broad strategies. In a **synthetic** syllabus, the parts of the language are taught separately and step by step, and the learner's job is to re-synthesise them for use. In an **analytic** syllabus, language is presented in whole, purposeful chunks organised by what learners need to do, and learners analyse the forms within them.","ويلكنز: التركيبي يعلّم الأجزاء منفصلة ليجمعها الطالب، والتحليلي يقدّم كتلاً هادفة ليحللها الطالب."]],"pts":[["**Structural (grammatical)**: grammar items, simple to complex. **Notional-functional**: notions (time, quantity) and functions (requesting, apologising).","قواعد / مفاهيم ووظائف"],["**Situational**: real-life situations (at the airport, at the bank). **Topic/theme-based**: topics (sport, health). **Content-based**: subject-matter content.","مواقف / موضوعات / محتوى"],["**Skills-based**: skills and sub-skills (skimming, listening for gist, writing a paragraph). **Task-based**: tasks learners perform (planning a trip). **Lexical** (Willis): high-frequency words, collocations and chunks.","مهارات / مهام / معجمي"],["Synthetic examples: structural, lexical. Analytic examples: task-based (Prabhu's procedural syllabus, Long), content-based. Wilkins himself proposed the **notional** syllabus as analytic, though later writers (Long & Crookes) argued it works synthetically in practice.","أمثلة التركيبي والتحليلي"],["Most modern coursebooks use a **multi-strand (integrated)** syllabus combining topics, grammar, vocabulary, functions and skills.","متعدد الخيوط"],["Curriculum (goals, content, methods, evaluation) is broader than syllabus (content + sequence).","المنهج أشمل من المقرر"]],"ex":[["A coursebook unit called 'At the airport' with dialogues for check-in and passport control follows a situational strand; its grammar box on 'can / can't' adds a structural strand — a multi-strand syllabus.","موقف المطار مع صندوق قواعد: منهج متعدد الخيوط."]],"traps":[["Grammar items one at a time, then combined = synthetic.","قواعد واحدة واحدة = تركيبي"],["Organised by situations like 'at the bank' = situational.","مواقف = موقفي"]],"src":"Wilkins, Notional Syllabuses; Nunan, Syllabus Design; Richards, Curriculum Development in Language Teaching"},"en.plan.needs":{"k":"Course design","t":["Needs Analysis","تحليل الاحتياجات"],"body":[["Needs analysis collects information about learners to decide what a course should contain. Hutchinson and Waters divide **target needs** into **necessities** (what the situation demands), **lacks** (the gap between what learners know and what they need) and **wants** (what learners themselves feel they need).","ما يتطلبه الموقف، وما ينقص الطالب، وما يريده هو."]],"pts":[["Tools: questionnaires, interviews, placement/diagnostic tests, observation.","أدوات: استبيانات ومقابلات واختبارات"],["Steps: design → conduct → analyse.","تصميم ← تنفيذ ← تحليل"],["Interest inventories are a small classroom version.","استبيان الاهتمامات"]],"traps":[["Surveys before a course = needs assessment, not achievement assessment.","الاستبيان قبل الدورة = احتياجات"]],"src":"Hutchinson & Waters, English for Specific Purposes; Richards, Curriculum Development in Language Teaching"},"en.plan.models":{"k":"Planning models","t":["Gagné, Hunter and 5E","نماذج جانييه وهنتر و5E"],"body":[["Each model answers 'what should happen, in what order?' from a different angle: Gagné from the psychology of learning, Hunter from direct instruction, and 5E from inquiry-based science teaching.","كل نموذج يرتب خطوات الدرس من زاوية مختلفة."]],"map":{"type":"cards","groups":[{"n":"Gagné — 9 events","ar":"⁧أحداث جانييه⁩","items":[{"n":"Attention → transfer","ar":"⁧انتباه، هدف، استدعاء، عرض، توجيه، أداء، تغذية، تقويم، نقل⁩","kw":["nine events"]}]},{"n":"Madeline Hunter","ar":"⁧نموذج هنتر⁩","items":[{"n":"Anticipatory set","ar":"⁧تهيئة، هدف، مدخل ونمذجة، فحص الفهم، تدريب موجّه، إغلاق، تدريب مستقل⁩","kw":["guided practice"]}]},{"n":"5E","ar":"⁧النموذج الاستقصائي⁩","items":[{"n":"Engage → Evaluate","ar":"⁧انخراط، استكشاف، شرح، توسّع، تقويم⁩","kw":["inquiry"]}]}]},"pts":[["**Gagné's nine events**: gain attention, inform learners of the objective, stimulate recall of prior learning, present content, provide guidance, elicit performance, give feedback, assess performance, enhance retention and transfer.","أحداث جانييه التسعة"],["**Madeline Hunter** model: anticipatory set → objective and purpose → input and modelling → checking for understanding → guided practice → closure → independent practice.","نموذج مادلين هنتر"],["**5E model**: Engage → Explore → Explain → Elaborate → Evaluate (inquiry-based).","النموذج الخماسي"]],"traps":[["'Anticipatory set' is Hunter's opening step.","التهيئة الحافزة = هنتر"],["In 5E, students **explore** before the teacher **explains**.","الاستكشاف قبل الشرح"]],"src":"Gagné, The Conditions of Learning; Hunter, Mastery Teaching; Bybee (BSCS 5E)"},"en.plan.icq":{"k":"Classroom language","t":["ICQs and CCQs","أسئلة فحص التعليمات وفهم المعنى"],"body":[["'Do you understand?' almost always gets 'yes', whatever the truth. Scrivener and others recommend short, specific checking questions instead.","سؤال «فاهمين؟» جوابه دائماً نعم، لذلك نسأل أسئلة محددة."]],"pts":[["**ICQs** (instruction-checking questions) check the task: 'Alone or in pairs?', 'Write or speak?', 'How many minutes?'","أسئلة فحص التعليمات"],["**CCQs** (concept-checking questions) check meaning: for 'used to play' → 'Does he play now?' — 'No.'","أسئلة فحص المفهوم"],["Most reliable check before a complex task: ask a student to explain or demonstrate the steps.","اطلب من طالب أن يشرح الخطوات"]],"ex":[["Before a group task: 'Read the text, then agree on three rules for a safe trip. Five minutes.' ICQs: 'Alone or in groups?' — 'Groups.' 'How many rules?' — 'Three.' 'How long?' — 'Five minutes.' Only then are texts handed out.","تعليمات ثم أسئلة فحص التعليمات ثم توزيع الأوراق."]],"traps":[["ICQ = instructions; CCQ = meaning of new language.","التعليمات مقابل المعنى"]],"src":"Scrivener, Learning Teaching; Harmer, The Practice of English Language Teaching"},"en.plan.manage":{"k":"Classroom management","t":["Seating, Proximity and Rules","الجلوس والاقتراب والقواعد"],"body":[["Good management is mostly preventive: an arrangement that suits the task, routines that students know, and calm responses that keep the lesson moving. Kounin called a teacher's awareness of everything happening in the room **withitness**.","الإدارة الجيدة وقائية: ترتيب مناسب وروتين معروف واستجابة هادئة."]],"map":{"type":"cards","groups":[{"n":"Rows","ar":"⁧صفوف⁩","items":[{"n":"Tests & input","ar":"⁧اختبار فردي أو شرح على السبورة⁩"}]},{"n":"Clusters","ar":"⁧مجموعات⁩","items":[{"n":"Group projects","ar":"⁧نقاش ومواد مشتركة⁩"}]},{"n":"Horseshoe / circle","ar":"⁧حدوة أو دائرة⁩","items":[{"n":"Discussion","ar":"⁧الكل يرى الكل: نقاش ومناظرة⁩"}]}]},"pts":[["Proximity control: move closer to off-task students without stopping the lesson.","الاقتراب دون إيقاف الدرس"],["Rules: few, clear, agreed with students, applied calmly and consistently.","قواعد قليلة واضحة متفق عليها"],["Routines are taught, modelled, practised and reinforced.","الروتين يُعلّم ويُنمذج ويُدرّب"],["**Wait time** (Rowe): pausing 3–5 seconds after a question raises the number and quality of answers.","وقت الانتظار 3–5 ثوانٍ يزيد الإجابات وجودتها"],["Harmer's teacher roles: controller, organiser, assessor, prompter, participant, resource, tutor, observer — chosen to suit the stage.","أدوار المعلم عند هارمر تتغير حسب المرحلة"]],"traps":[["Light, movable furniture suits classes that switch patterns often.","أثاث متحرك"],["Give instructions **before** students move into groups.","التعليمات قبل الحركة"]],"src":"Harmer, The Practice of English Language Teaching; Scrivener, Classroom Management Techniques; Kounin, Discipline and Group Management in Classrooms"},"en.mat.authentic":{"k":"Materials","t":["Authentic vs Pedagogic Materials","المواد الأصيلة والتعليمية"],"body":[["**Authentic** texts are produced by and for proficient users for real purposes. **Pedagogic** (non-authentic) materials are written for learners: coursebook dialogues, graded readers, worksheets. Both have a place: pedagogic texts control difficulty, authentic texts show real language and culture.","الأصيلة للاستخدام الحقيقي، والتعليمية مكتوبة للمتعلم، ولكلٍّ دوره."]],"pts":[["Advantages of authentic: real language, culture, motivation, prepares for real use.","مزايا الأصيلة"],["Challenges: difficult vocabulary, cultural content, may date quickly.","تحدياتها"],["Grade the task, not the text, for lower levels.","بسّط المهمة لا النص"]],"traps":[["Newspapers and web pages = authentic; textbook dialogue = non-authentic.","الصحيفة أصيلة والكتاب لا"],["Cultural customs (greetings, clothing, housing) are best shown with authentic materials.","الثقافة بالمواد الأصيلة"]],"src":"Harmer, The Practice of English Language Teaching; Nunan, Designing Tasks for the Communicative Classroom"},"en.mat.adapt":{"k":"Materials","t":["Adapting and Evaluating Materials","تكييف المواد وتقييمها"],"body":[["Adaptation keeps what is good in a coursebook and changes the rest to fit the learners and aims. McDonough and Shaw describe five main techniques; many teacher guides add **replacing**.","التكييف يحتفظ بالجيد ويغيّر الباقي."]],"map":{"type":"cards","groups":[{"n":"Adding","ar":"⁧الإضافة⁩","items":[{"n":"Extending","ar":"⁧المزيد من نفس النوع⁩"},{"n":"Expanding","ar":"⁧عنصر جديد غير موجود⁩"}]},{"n":"Deleting","ar":"⁧الحذف⁩","items":[{"n":"Subtracting","ar":"⁧تقليل الكمية⁩"},{"n":"Abridging","ar":"⁧حذف جزء كامل⁩"}]},{"n":"Modifying","ar":"⁧التعديل⁩","items":[{"n":"Rewriting","ar":"⁧تغيير المحتوى⁩"},{"n":"Restructuring","ar":"⁧تغيير تنظيم الصف⁩"}]},{"n":"Simplify / Reorder","ar":"⁧التبسيط وإعادة الترتيب⁩","items":[{"n":"Simplifying","ar":"⁧لغة أسهل وجمل أقصر⁩"},{"n":"Reordering","ar":"⁧تغيير تسلسل الأنشطة⁩"}]}]},"pts":[["**Replacing**: substituting a text, picture or activity with a more suitable one (e.g. a culturally appropriate Saudi context instead of an unsuitable topic).","الاستبدال بما يناسب"],["Evaluation stages: **pre-use** (predictive, often a checklist such as Cunningsworth's), **in-use** (observation in class) and **post-use** (retrospective, to decide whether to keep the book).","تقييم قبل الاستخدام وأثناءه وبعده"],["**Piloting** = trying the book with a real class before adopting it; the main criterion is whether it serves the **learning goals**.","التجريب في الصف، والمعيار تحقيق الأهداف"]],"traps":[["Six more items of the same type = extending; a new pronunciation stage = expanding.","تمديد مقابل توسيع"],["Doing the vocabulary task before the reading = reordering.","تقديم نشاط = إعادة ترتيب"]],"ex":[["The book's reading text is about a winter festival in a cold country. The teacher uses a text about a family visit to AlUla instead (replacing) and adds a short stress-practice stage before the reading (expanding).","استبدال النص بآخر مناسب ثقافياً وإضافة مرحلة نطق جديدة."]],"src":"McDonough, Shaw & Masuhara, Materials and Methods in ELT; Cunningsworth, Choosing Your Coursebook; Tomlinson, Materials Development in Language Teaching"},"en.mat.organizers":{"k":"Visual tools","t":["Graphic Organizers","المنظمات المرئية"],"body":[["A graphic organizer is a visual frame that shows how ideas relate. Used before reading, it activates schema; during reading, it guides note-taking; before writing, it organises ideas.","إطار مرئي يُظهر العلاقات، يُستخدم قبل القراءة وأثناءها وقبل الكتابة."]],"pts":[["Venn diagram → compare and contrast.","فن: مقارنة"],["Flow chart → steps of a process.","تدفق: خطوات"],["Fishbone (Ishikawa) → cause and effect.","عظم السمكة: سبب ونتيجة"],["Concept map / mind map → central idea and related ideas.","خريطة مفاهيم: فكرة مركزية"],["KWL → Know / Want to know / Learned; T-chart → two columns (pros and cons).","KWL وجدول T"]],"traps":[["Infographic = a one-page visual presentation of information, not a planning frame.","الإنفوجرافيك عرض لا إطار تخطيط"]],"src":"Brown, Teaching by Principles; Harmer, The Practice of English Language Teaching"},"en.mat.sync":{"k":"Technology","t":["Synchronous, Asynchronous, Blended","المتزامن وغير المتزامن والمدمج"],"body":[["Online learning is described by timing. **Synchronous** activities require everyone at the same time (live classes, video calls, chat). **Asynchronous** activities can be done at any time (recorded lessons, email, forums, blogs, wikis). **Blended learning** combines online and face-to-face teaching. A **VLE / LMS** (Blackboard, Moodle, Madrasati, Google Classroom) is the platform that organises content, tasks and communication.","المتزامن في الوقت نفسه، وغير المتزامن في أي وقت، والمدمج يجمع بينهما، والمنصة تنظّم كل ذلك."]],"pts":[["CALL = Computer-Assisted Language Learning; MALL = Mobile-Assisted.","CALL وMALL"],["Computers are best used as **teacher aids**, not teacher replacements.","الحاسب مساعد للمعلم"],["Downside of web resources: technical problems.","عيبها: المشكلات التقنية"],["Self-learning software helps independent learners; technology boosts teachers' creativity.","برامج التعلم الذاتي وإبداع المعلم"],["Tools: Prezi (slide-based presentations), OCR (print → editable text, e.g. Braille for blind students), Rosetta Stone (language learning), OneNote (real-time collaboration).","أدوات وما تفعله"]],"traps":[["Blackboard = VLE, not a social network.","بلاك بورد بيئة افتراضية"],["Email homework = asynchronous; Skype / live Teams lesson = synchronous.","البريد غير متزامن والبث المباشر متزامن"]],"src":"Harmer, The Practice of English Language Teaching; Dudeney & Hockly, How to Teach English with Technology"},"en.mat.samr":{"k":"Technology","t":["SAMR and TPACK","نموذجا SAMR وTPACK"],"body":[["**SAMR** (Ruben Puentedura) describes four levels of technology integration. The first two **enhance** a task; the last two **transform** it.","SAMR: مستويان يحسّنان المهمة ومستويان يحوّلانها."]],"map":{"type":"cards","groups":[{"n":"Enhancement","ar":"⁧تحسين⁩","items":[{"n":"Substitution","ar":"⁧بديل مباشر بلا تغيير وظيفي⁩","kw":["typing instead of writing"]},{"n":"Augmentation","ar":"⁧بديل مع تحسين وظيفي⁩","kw":["spell-check"]}]},{"n":"Transformation","ar":"⁧تحويل⁩","items":[{"n":"Modification","ar":"⁧إعادة تصميم كبيرة للمهمة⁩","kw":["shared doc with comments"]},{"n":"Redefinition","ar":"⁧مهمة لم تكن ممكنة من قبل⁩","kw":["video exchange with another school"]}]}]},"pts":[["**TPACK** (Mishra & Koehler): effective teaching with technology combines Technological, Pedagogical and Content Knowledge.","تكامل المعرفة التقنية والتربوية والمحتوى"]],"traps":[["Tasks previously inconceivable = Redefinition.","مهام لم تكن ممكنة = إعادة تعريف"]],"src":"Puentedura, SAMR model; Mishra & Koehler (2006)"},"en.mat.autonomy":{"k":"Independent learning","t":["Learner Autonomy","استقلال المتعلم"],"body":[["Henri Holec defined autonomy as 'the ability to take charge of one's own learning': deciding objectives, content, methods and pace, monitoring progress and evaluating results. Teachers foster it gradually, by handing over decisions and teaching the skills needed to make them.","هوليك: القدرة على تولي مسؤولية التعلم، وتنمو بنقل القرارات تدريجياً وتعليم مهارات اتخاذها."]],"pts":[["**Learner training**: dictionaries, vocabulary notebooks, goal-setting, self-evaluation.","تدريب المتعلم"],["**Self-access centre** (graded readers, audio, software, answer keys); **learning contracts** (learner and teacher agree goals, tasks and deadlines); **learning logs/diaries** and **portfolios**.","مركز ذاتي وعقود وسجلات"],["Design tasks with **choice** (e.g. one of three reading texts or output formats) and provide **answer keys** for self-correction.","الاختيار ومفاتيح التصحيح الذاتي"],["Self-learning software supports independent learners.","برامج التعلم الذاتي"]],"traps":[["Autonomy ≠ learning without a teacher.","ليس تعلماً بلا معلم"],["Best single way to encourage autonomy: train students to use reference resources.","التدريب على المراجع"]],"src":"Holec, Autonomy and Foreign Language Learning; Benson, Teaching and Researching Autonomy; Harmer"},"en.lrn.styles":{"k":"Learner differences","t":["Learning Styles: VAK and Kolb","أنماط التعلم"],"body":[["Sensory models (VAK; Fleming's VARK adds read/write) classify how learners prefer to receive information. **Kolb**'s experiential model describes learning as a cycle — concrete experience, reflective observation, abstract conceptualisation, active experimentation — and four styles that combine two stages each.","النماذج الحسية تصنف طريقة استقبال المعلومة، وكولب يصف دورة خبرة بأربعة أنماط."]],"map":{"type":"cards","groups":[{"n":"Diverging","ar":"⁧متشعب⁩","items":[{"n":"Feel + watch","ar":"⁧خبرة محسوسة وملاحظة تأملية⁩"}]},{"n":"Assimilating","ar":"⁧استيعابي⁩","items":[{"n":"Think + watch","ar":"⁧مفاهيم مجردة وملاحظة تأملية⁩"}]},{"n":"Converging","ar":"⁧تقاربي⁩","items":[{"n":"Think + do","ar":"⁧مفاهيم مجردة وتجريب نشط⁩"}]},{"n":"Accommodating","ar":"⁧تكيّفي⁩","items":[{"n":"Feel + do","ar":"⁧خبرة محسوسة وتجريب نشط⁩"}]}]},"pts":[["Visual: pictures, written words, charts. Auditory: listening, discussion. Kinesthetic: movement, hands-on.","بصري وسمعي وحركي"],["Logical/analytic learners make lists and look for relationships.","المنطقي يرتب ويبحث عن العلاقات"],["Research questions strict 'matching' of teaching to one style; the safe practice is varied, multi-sensory teaching.","التنويع أفضل من حصر الطالب في نمط"]],"traps":[["Arranging jumbled word cut-outs = kinesthetic.","ترتيب القصاصات = حركي"],["Remembers names by seeing them = visual.","يرى فيتذكر = بصري"]],"src":"Brown, Principles of Language Learning and Teaching; Kolb, Experiential Learning"},"en.lrn.mi":{"k":"Learner differences","t":["Gardner's Multiple Intelligences","الذكاءات المتعددة"],"body":[["In *Frames of Mind* (1983), **Howard Gardner** proposed that people have several distinct intelligences; a naturalist intelligence was added later. Each suggests classroom activities that open the same content to different learners.","هوارد غاردنر (1983): عدة ذكاءات مستقلة، ولكل منها أنشطة صفية."]],"map":{"type":"cards","groups":[{"n":"Word & logic","ar":"⁧اللغة والمنطق⁩","items":[{"n":"Linguistic","ar":"⁧قصص، ألغاز كلمات، كلمات متقاطعة⁩"},{"n":"Logical-math.","ar":"⁧أنماط، تصنيف، حل مشكلات⁩"}]},{"n":"Senses & body","ar":"⁧الحواس والجسد⁩","items":[{"n":"Spatial","ar":"⁧صور، خرائط، رسم⁩"},{"n":"Musical","ar":"⁧أناشيد وإيقاع⁩"},{"n":"Bodily-kinesthetic","ar":"⁧حركة، تمثيل، TPR⁩"}]},{"n":"People & self","ar":"⁧الآخرون والذات⁩","items":[{"n":"Interpersonal","ar":"⁧عمل جماعي وأقران⁩"},{"n":"Intrapersonal","ar":"⁧تأمل، يوميات، أهداف ذاتية⁩"},{"n":"Naturalist","ar":"⁧تصنيف من الطبيعة⁩"}]}]},"traps":[["**Howard** Gardner = multiple intelligences; **Robert** Gardner (with Lambert) = integrative/instrumental motivation.","غاردنران مختلفان"],["Group work develops **interpersonal** (not intrapersonal) intelligence.","الجماعي = بين شخصي"]],"src":"Gardner, Frames of Mind; Brown, Principles of Language Learning and Teaching"},"en.lrn.motivation":{"k":"Motivation","t":["Types of Motivation","أنواع الدافعية"],"body":[["Two classic distinctions are often confused. **Intrinsic vs extrinsic** (Deci & Ryan's self-determination theory) is about the **source** of the drive: the activity itself or an external reward. **Integrative vs instrumental** (Gardner & Lambert) is about the **purpose** of learning the language: connecting with its people and culture, or practical gain.","داخلية/خارجية = مصدر الدافع، وتكاملية/نفعية = غرض تعلم اللغة."]],"map":{"type":"cards","groups":[{"n":"Source","ar":"⁧المصدر⁩","items":[{"n":"Intrinsic","who":"Deci & Ryan","ar":"⁧متعة ورضا ذاتي، فضول⁩"},{"n":"Extrinsic","who":"Deci & Ryan","ar":"⁧درجات، جوائز، ترقية⁩"}]},{"n":"Purpose","ar":"⁧الغرض⁩","items":[{"n":"Integrative","who":"Gardner & Lambert","ar":"⁧حب الثقافة والتواصل مع أهلها⁩"},{"n":"Instrumental","who":"Gardner & Lambert","ar":"⁧وظيفة، بعثة، نجاح في اختبار⁩"}]}]},"pts":[["Motivating practices: realistic high expectations, curiosity, active involvement, choice, useful feedback.","ما يرفع الدافعية"],["Demotivating: correcting every mistake, public criticism, tasks far too hard or too easy.","ما يخفضها"]],"traps":[["A job or scholarship = instrumental; liking the culture = integrative.","وظيفة = نفعية"],["Arousal of curiosity = an **internal** (intrinsic) motivating factor.","الفضول دافع داخلي"]],"src":"Brown, Principles of Language Learning and Teaching; Lightbown & Spada, How Languages are Learned; Dörnyei, Teaching and Researching Motivation"},"en.lrn.dornyei":{"k":"Motivation","t":["Dörnyei's L2 Motivational Self System","نظام الذات الدافعي عند دورنيي"],"body":[["Zoltán Dörnyei proposed that L2 motivation comes from the gap between who learners are and who they imagine becoming. The system has three parts.","الدافعية تنشأ من الفجوة بين الذات الحالية والذات المتخيلة."]],"pts":[["**Ideal L2 self**: the English-speaking person the learner would like to become.","الذات المثالية"],["**Ought-to L2 self**: what the learner believes they should become to meet others' expectations or avoid failure.","الذات الواجبة"],["**L2 learning experience**: the motivating effect of the teacher, class, materials and success.","خبرة التعلم"]],"ex":[["A teacher asks students to imagine themselves five years from now using English at work and to describe that scene — strengthening the ideal L2 self.","تخيّل الذات المستقبلية يقوّي الذات المثالية"]],"traps":[["Ideal L2 self belongs to Dörnyei, not Gardner.","دورنيي لا غاردنر"]],"src":"Dörnyei, The Psychology of the Language Learner; Lightbown & Spada"},"en.lrn.affect":{"k":"Affective domain","t":["Anxiety and Willingness to Communicate","القلق والاستعداد للتواصل"],"body":[["**Foreign language anxiety** (Horwitz and colleagues) is tension specific to learning and using a new language, linked to communication apprehension, test anxiety and fear of negative evaluation. In Krashen's terms, it raises the **affective filter** and blocks input. Some mild tension can be facilitative, but debilitative anxiety lowers performance.","قلق اللغة الأجنبية يرفع المصفاة الوجدانية ويحجب المدخلات، وبعض التوتر الخفيف قد يكون مفيداً."],["**Willingness to communicate** (MacIntyre) is a learner's readiness to speak when given the chance; confidence and a supportive atmosphere increase it.","الاستعداد للتواصل يزيد بالثقة والجو الداعم."]],"pts":[["Other affective factors (Brown): self-esteem, inhibition, risk-taking, empathy, extroversion/introversion.","عوامل وجدانية أخرى"],["CLT tends to suit extroverted learners; introverts may prefer individual work first.","التواصلي يناسب المنفتحين"],["**Collectivist cultures** (group harmony, respect for the teacher's authority): learners may avoid asking questions or disagreeing in public — use small groups and anonymous question slips.","الثقافات الجماعية وتجنب السؤال العلني"],["Participation grows when teachers praise effort, give wait time and build on partly correct answers.","المديح على الجهد ووقت الانتظار والبناء على الإجابة الجزئية"]],"traps":[["Anxiety is an **affective** factor, not a cognitive style.","القلق وجداني"],["Modelling a performance first builds **confidence**.","النمذجة تبني الثقة"]],"src":"Brown, Principles of Language Learning and Teaching; Lightbown & Spada, How Languages are Learned"},"en.lrn.cogstyles":{"k":"Cognitive styles","t":["Field Independence and Reflectivity","الاستقلال عن المجال والتروي"],"body":[["Cognitive styles are consistent ways of perceiving and processing information. Witkin's **field independence** is the ability to pick out a detail from a confusing background; **field dependence** is perceiving the field as a whole. Brown notes that field independence helps with analytic, form-focused classroom learning, while field dependence helps with face-to-face communication.","المستقل عن المجال يلتقط التفاصيل، والمعتمد عليه يرى الكل ويتواصل اجتماعياً بسهولة."],["**Reflectivity vs impulsivity** (described by Jerome Kagan, 1965): reflective learners take longer and make fewer errors; impulsive learners answer quickly, guess and may be faster at fluent tasks.","المتروّي أبطأ وأدق، والمندفع أسرع ويخمّن أكثر."]],"traps":[["Detail-focused, analytic, likes grammar rules = field-independent.","تحليلي = مستقل عن المجال"],["A style is not a disability: dyslexia and ADHD are learning difficulties, not styles.","النمط ليس صعوبة تعلم"]],"src":"Brown, Principles of Language Learning and Teaching"},"en.lrn.diff":{"k":"Differentiation","t":["Differentiated Instruction","التعليم المتمايز"],"body":[["Carol Ann Tomlinson describes differentiation as planning in response to learners' **readiness**, **interests** and **learning profiles**. The teacher can differentiate four elements: **content** (what is learned), **process** (how), **product** (how learning is shown) and **learning environment**.","توملينسون: الاستجابة لاستعداد الطلاب واهتماماتهم وأنماطهم بتكييف المحتوى والعملية والناتج والبيئة."]],"pts":[["Tiered tasks: same objective, different levels of support or challenge.","مهام متدرجة"],["Open-ended tasks and extension tasks for fast finishers.","مهام مفتوحة وإضافية"],["**Gifted / high-proficiency**: enrichment (deeper, broader tasks), acceleration (moving faster), curriculum compacting (skip what is mastered) (Renzulli), projects and leadership roles.","إثراء وتسريع وضغط المنهج"],["**Struggling / limited-proficiency**: pre-teach vocabulary, chunk tasks, visuals and graphic organisers, model answers and sentence frames, extra time, frequent checks, remedial lessons based on diagnostic results.","دعم المتعثر"],["**Flexible grouping**: similar-level groups for targeted help, mixed-level groups for peer support and **peer tutoring**.","تجميع مرن"],["Interest inventories collect learners' interests to personalise topics.","استبيان الاهتمامات"]],"traps":[["Differentiation keeps the same core objective; it does not give weaker students a different, easier curriculum.","نفس الهدف بطرق مختلفة"],["Giving gifted students 'more of the same' is not enrichment.","المزيد من نفس الشيء ليس إثراء"]],"src":"Tomlinson, How to Differentiate Instruction in Mixed-Ability Classrooms; Harmer, The Practice of English Language Teaching"},"en.lis.process":{"k":"Listening","t":["Top-down, bottom-up and interactive processing","المعالجة من الأعلى ومن الأسفل والتفاعلية"],"body":[["**Bottom-up** processing builds meaning from the signal upward: recognizing sounds, separating words in connected speech, noticing endings, word order and grammatical cues. It depends mainly on the listener's **linguistic (grammatical) competence**.","من الأسفل: من الأصوات إلى الكلمات إلى الجملة، ويعتمد على المعرفة اللغوية."],["**Top-down** processing starts from the listener's head: background knowledge (**schema**), knowledge of the situation and the topic, and expectations. The listener predicts, infers and gets the main idea even with gaps.","من الأعلى: الخلفية والسياق والتوقع، ويوصل للفكرة العامة رغم الثغرات."]],"pts":[["Skilled listening is **interactive**: both run together; learners with weak decoding over-rely on guessing, those with little background over-rely on words.","الماهر يجمعهما، والضعف في أحدهما يجعله يعتمد على الآخر"],["Top-down tasks: predicting from a title, listening for gist, inferring the speaker's attitude, summarizing.","مهام من الأعلى: توقع، فكرة عامة، استنتاج، تلخيص"],["Bottom-up tasks: dictation of short chunks, distinguishing minimal pairs, counting words in a sentence, spotting weak forms.","مهام من الأسفل: إملاء مقاطع، أزواج صغرى، عدّ الكلمات، الصيغ الضعيفة"]],"traps":[["'Listening for the main idea' is top-down; 'recognizing words and sounds' is bottom-up.","الفكرة الرئيسية من الأعلى، والكلمات والأصوات من الأسفل"],["Intensive listening develops **bottom-up** skills.","المكثف يطوّر من الأسفل"]],"ex":[["Before a weather forecast for Jeddah, students guess the words they will hear (*hot, humid, wind*) — **top-down**. Then they listen again and decide whether the speaker said *thirteen* or *thirty* degrees — **bottom-up**.","توقع كلمات النشرة الجوية قبل الاستماع = من الأعلى، والتمييز بين thirteen وthirty = من الأسفل."]],"src":"Brown, Teaching by Principles; Richards, Teaching Listening and Speaking; Field, Listening in the Language Classroom"},"en.lis.scope":{"k":"Listening","t":["Intensive vs extensive listening","الاستماع المكثف والموسّع"],"body":[["**Intensive listening** uses short extracts and close attention to detail — exact words, sounds, grammatical forms — often replaying the same few seconds. It trains accurate perception (bottom-up).","المكثف: مقاطع قصيرة وانتباه للتفاصيل، ويدرّب الإدراك الدقيق."],["**Extensive listening** means large amounts of listening for general meaning or enjoyment, usually material learners choose: podcasts, stories, audiobooks, series. It builds fluency, stamina and familiarity with natural speech.","الموسّع: استماع كثير للفهم العام أو المتعة، ويبني الطلاقة والتعود على الكلام الطبيعي."]],"map":{"type":"cards","groups":[{"n":"Intensive","ar":"⁧مكثف⁩","items":[{"n":"Short","ar":"⁧دقائق قليلة⁩","kw":["details","form"]},{"n":"Teacher-led","ar":"⁧في الفصل غالباً⁩","kw":["replay"]}]},{"n":"Extensive","ar":"⁧موسّع⁩","items":[{"n":"Long","ar":"⁧كمية كبيرة⁩","kw":["gist","pleasure"]},{"n":"Learner-chosen","ar":"⁧يختاره الطالب⁩","kw":["podcasts"]}]}]},"traps":[["A long passage for general understanding and pleasure = extensive, not intensive.","نص طويل للمتعة = موسّع"]],"src":"Harmer, The Practice of English Language Teaching; Field, Listening in the Language Classroom"},"en.lis.stages":{"k":"Listening","t":["Pre-, while- and post-listening","مراحل درس الاستماع"],"body":[["The three-stage lesson gives listening a purpose and a structure. Each stage answers a question: *Why am I listening?* (pre), *What do I need to get?* (while), *What do I do with it?* (post).","كل مرحلة تجيب سؤالاً: لماذا أستمع؟ ماذا آخذ؟ ماذا أفعل به؟"]],"pts":[["**Pre**: set the listening objective, activate schema, predict from pictures or a title, pre-teach only the essential words, generate questions.","قبل: هدف، خلفية، توقع، كلمات أساسية فقط، توليد أسئلة"],["**While**: first listen for **gist**, second listen for **specific information**; note-taking; checking predictions.","أثناء: الفكرة العامة ثم التفاصيل، تدوين، تحقق من التوقعات"],["**Post**: discussion, role play, writing, reflection on strategies, short bottom-up work on difficult parts.","بعد: نقاش أو كتابة أو تأمل أو تدريب على الأجزاء الصعبة"]],"traps":[["'Verify predictions' happens **while** listening, not before.","التحقق من التوقعات أثناء الاستماع"],["The first listening is usually for gist, not details.","الاستماع الأول للفكرة العامة"]],"ex":[["Topic: a guide talking about AlUla. **Pre**: photos on the board, students predict what the guide will mention, the teacher pre-teaches *heritage site*. **First listen**: choose the best title. **Second listen**: complete a table of dates and opening times. **Post**: pairs plan a one-day visit.","صور العُلا وتوقع ← اختيار العنوان ← جدول التواريخ ← تخطيط زيارة في أزواج."]],"src":"Richards, Teaching Listening and Speaking; Harmer, The Practice of English Language Teaching"},"en.lis.types":{"k":"Listening","t":["Types of listening by purpose","أنواع الاستماع حسب الغرض"],"body":[["Listening types are named after the listener's **purpose**: find the purpose in the situation and the type follows.","اسم النوع يأتي من الغرض: ابحث عن الغرض في الموقف."]],"pts":[["**Appreciative** — for enjoyment (stories, music, a funny clip).","تقديري: للمتعة"],["**Comprehensive** — to understand and remember a message (lectures, directions).","استيعابي: لفهم الرسالة"],["**Critical** — to analyse and judge a message before accepting or rejecting it.","نقدي: تحليل وحكم"],["**Empathic / therapeutic** — to support the speaker emotionally.","تعاطفي: لدعم المتحدث"],["**Discriminative** — to distinguish sounds (minimal pairs, tone of voice).","تمييزي: للتفريق بين الأصوات"],["**Selective** — only for certain information, ignoring the rest (often with note-taking).","انتقائي: معلومة محددة فقط"]],"traps":[["'Listen and do' (respond physically to commands) = **Total Physical Response**, not a listening type.","اسمع ونفّذ = TPR"],["Radio, TV and films = **non-interactive**; phone calls = interactive.","الراديو غير تفاعلي"]],"src":"Brown, Teaching by Principles; Wolvin & Coakley, Listening"},"en.lis.brown":{"k":"Listening","t":["What makes listening difficult (Brown)","ما يجعل الاستماع صعباً عند براون"],"body":[["Brown lists characteristics of spoken language that make listening difficult for learners. Teachers use the list to choose texts and to plan bottom-up practice.","براون يعدد خصائص الكلام المنطوق التي تصعّب الاستماع، ونستفيد منها في اختيار النص والتدريب."]],"pts":[["**Clustering** — speech comes in phrases, not single words.","التجمّع: الكلام عبارات لا كلمات"],["**Redundancy** — repetitions, rephrasing, 'I mean' (can help or confuse).","الحشو والتكرار"],["**Reduced forms** — *gonna, wanna, whatcha*, contractions, elision.","الصيغ المختصرة"],["**Performance variables** — hesitations, false starts, fillers (*uh, you know*).","متغيرات الأداء: التردد والبدايات الخاطئة"],["**Colloquial language** — idioms, slang, cultural references.","العامية"],["**Rate of delivery** — the speed of speech.","سرعة الكلام"],["**Stress, rhythm and intonation** — they carry meaning.","النبر والإيقاع والتنغيم"],["**Interaction** — negotiating meaning in conversation.","التفاعل والتفاوض على المعنى"]],"traps":[["Fillers and false starts = performance variables, not reduced forms.","التردد = متغيرات الأداء"]],"src":"Brown, Teaching by Principles"},"en.lis.metacog":{"k":"Listening","t":["Metacognitive listening instruction","تعليم الاستماع بما وراء المعرفة"],"body":[["Field argued that the familiar **comprehension approach** (listen, answer questions, check) **tests** listening rather than teaching it, because it shows the result without training the process.","فيلد: «استمع وأجب» يختبر الاستماع ولا يعلّمه."],["Vandergrift and Goh proposed a **metacognitive** sequence: learners **plan** and predict before listening, **monitor** and verify predictions over several listens, and **evaluate** and reflect afterwards on which strategies helped. The aim is listeners who know *how* they listen.","فاندرغريفت وغوه: تخطيط وتوقع ← مراقبة وتحقق عبر عدة استماعات ← تقويم وتأمل."]],"pts":[["Planning: setting a goal, predicting content and vocabulary.","التخطيط: هدف وتوقع"],["Monitoring: checking comprehension while listening.","المراقبة: فحص الفهم أثناء الاستماع"],["Evaluating: judging what worked after the task.","التقويم: ماذا نجح بعد المهمة"],["A **process approach** trains the sub-skills behind comprehension, such as recognising word boundaries in connected speech, instead of only checking answers.","المدخل العملي: تدريب العمليات الفرعية للفهم"]],"traps":[["'Checking whether my prediction was correct' is a **metacognitive** (monitoring) strategy, not a cognitive one.","التحقق من التوقع = ما وراء معرفي"]],"src":"Field, Listening in the Language Classroom; Vandergrift & Goh, Teaching and Learning Second Language Listening"},"en.spk.drills":{"k":"Speaking","t":["Types of oral drills","أنواع التدريبات الشفهية"],"body":[["Drills come from the Audio-Lingual Method, which saw learning as habit formation. Today they are used briefly to improve **pronunciation and accuracy** of a new form before freer practice.","من الطريقة السمعية الشفهية، وتُستخدم اليوم باختصار للنطق والدقة."]],"pts":[["**Repetition / choral** — learners repeat the model, individually or together.","تكرار وترديد جماعي"],["**Substitution** — replace one word using a cue: *I like apples → (dates) → I like dates.*","استبدال كلمة بإشارة"],["**Transformation** — change the form: positive → negative, active ↔ passive, statement → question.","تحويل الصيغة"],["**Back-chaining** — build a long sentence from the end: *…yesterday → …to the mall yesterday → I went to the mall yesterday.*","بناء عكسي من آخر الجملة"],["**Chain drill** — each learner asks the next one in turn.","سلسلة بين الطلاب"],["**Imperative drills** — commands that elicit physical responses (*Stand up, open your book*).","أوامر وحركة"]],"traps":[["Passive → active is **transformation**, not substitution.","المجهول ← المعلوم = تحويل"],["Choral repetition is linked to the **Audio-Lingual Method**.","الترديد الجماعي من السمعية الشفهية"]],"ex":[["Teacher: *I like apples.* — cue: *dates* — class: *I like dates.* — cue: *mangoes* … This is a **substitution** drill. Then: *The window was broken by Ali.* → *Ali broke the window.* — a **transformation** drill.","تغيير كلمة واحدة = استبدال. تحويل المجهول إلى معلوم = تحويل."]],"src":"Richards & Rodgers, Approaches and Methods in Language Teaching; Harmer, The Practice of English Language Teaching"},"en.spk.questions":{"k":"Speaking","t":["Display vs referential questions","أسئلة العرض والأسئلة المرجعية"],"body":[["**Display questions** ask for information the teacher already has; they check knowledge and recall but usually produce one-word answers. **Referential questions** seek information or opinions the teacher does not know; they lead to longer and more natural answers and real communication.","سؤال العرض يعرف المعلم جوابه وجوابه قصير. المرجعي حقيقي ويولّد كلاماً أطول وتواصلاً."],["**Eliciting** draws language from learners with clues, examples, pictures or mime. It keeps learners active and shows the teacher what they already know.","الاستنباط: نستخرج اللغة من الطلاب بالتلميح والأمثلة."]],"ex":[["Display: *What's the capital of Saudi Arabia?* — Referential: *If you could live in any Saudi city, which would you choose and why?*","عرض مقابل مرجعي"]],"traps":[["Closed-ended questions are designed for **objectivity**.","المغلق للموضوعية"],["A question with a known answer is never referential, however long it is.","ما يعرف المعلم جوابه ليس مرجعياً"]],"pts":[["Eliciting example: *Who drives a vehicle carrying twenty people?* → *a bus driver*.","مثال الاستنباط بالتلميح"]],"src":"Brown, Teaching by Principles; Richards & Lockhart, Reflective Teaching in Second Language Classrooms"},"en.spk.errors":{"k":"Errors","t":["Corder: errors vs mistakes","كوردر: الخطأ والزلّة"],"body":[["Corder made a lasting distinction. An **error** is systematic: it reflects the learner's current knowledge (competence), so the learner cannot correct it alone. A **mistake** is a performance slip — tiredness, haste, nerves — which the learner can self-correct when it is pointed out.","الخطأ نظامي من نقص المعرفة ولا يصححه الطالب وحده. الزلّة هفوة أداء يصححها إذا نُبّه."],["Corder also argued that errors are **significant**: they show the teacher what the learner has learned, give researchers evidence of how language is acquired, and are a device the learner uses to test hypotheses.","والأخطاء مهمة: تكشف ما تعلّمه الطالب وكيف يكتسب اللغة."]],"pts":[["Practical test: can the learner fix it when prompted? Yes → mistake; No → error.","هل يصححه إذا نُبّه؟ نعم = زلّة، لا = خطأ"]],"traps":[["A mistake reflects **performance**, not competence.","الزلّة أداء لا كفاية"]],"src":"Corder, The Significance of Learners' Errors; Brown, Principles of Language Learning and Teaching"},"en.spk.feedback":{"k":"Errors","t":["Lyster & Ranta: six types of oral corrective feedback","لايستر ورانتا: ستة أنواع للتغذية التصحيحية"],"body":[["Lyster and Ranta observed classrooms and identified six feedback moves. They found **recasts** were the most common but least often led learners to repair their own error, while moves that make learners do the correcting (elicitation, metalinguistic clues, clarification requests, repetition) led to more learner repair.","إعادة الصياغة الأكثر استخداماً لكنها الأقل دفعاً للطالب لتصحيح نفسه، والأنواع التي تجعله يصحح تثمر أكثر."],["In **fluency** work, the teacher notes errors and gives **delayed**, **selective** feedback on one or two errors linked to the aim; in accuracy work, correction can be immediate.","في الطلاقة: تصحيح مؤجل وانتقائي، وفي الدقة فوري."]],"pts":[["**Recast** — the teacher reformulates correctly without saying it is wrong: *S: He go. T: Oh, he goes?*","إعادة صياغة ضمنية"],["**Explicit correction** — *No, not 'go' — you should say 'goes'.*","تصحيح صريح"],["**Clarification request** — *Pardon? / Sorry?*","طلب توضيح"],["**Metalinguistic feedback** — a comment about the rule: *We use the past with 'yesterday'.*","تعليق على القاعدة"],["**Elicitation** — *She…?* (pause), or *How do we say that?*","استنباط بوقفة"],["**Repetition** — the teacher repeats the error with rising intonation: *He go?*","تكرار الخطأ بنغمة صاعدة"]],"traps":[["A recast has **no** 'that's wrong'; explicit correction does.","الإعادة الضمنية بلا «خطأ»"],["Repeating the error with rising intonation = repetition, not recast.","تكرار الخطأ ≠ إعادة صياغة"]],"ex":[["Student: *Yesterday I go to the mall.* Teacher: *Oh, you went to the mall? Which one?* — a **recast**: the correct form is given implicitly and the conversation continues.","المعلم يعيد الجملة صحيحة ضمناً ويكمل الحديث: إعادة صياغة."]],"src":"Lyster & Ranta (1997); Lightbown & Spada, How Languages are Learned"},"en.spk.arab":{"k":"Pronunciation","t":["Pronunciation problems of Arab learners","صعوبات النطق عند المتعلم العربي"],"body":[["Most difficulties come from differences between the Arabic and English sound systems. Arabic has no /p/, so learners merge /p/ and /b/; /v/ is often replaced by /f/; /ŋ/ may become /ŋg/ or /n/; and long consonant clusters are broken by an added vowel.","معظم الصعوبات من اختلاف النظامين: لا /p/ في العربية، و/v/ تتحول /f/، والتجمعات الصامتة يُقحم بينها صائت."],["When two separate L2 sounds are merged because the L1 does not distinguish them, Weinreich called it **under-differentiation**. **Minimal pairs** (*pen/Ben, fan/van*) are the classic tool: first hear the difference, then produce it.","دمج صوتين منفصلين في الإنجليزية لأن العربية لا تفرّق بينهما = under-differentiation، وعلاجه الأزواج الصغرى."]],"pts":[["Segmental = individual sounds; suprasegmental = stress, rhythm, intonation.","مفردة / فوق مقطعية"],["Teenagers' resistance to new sounds is often **self-consciousness**, not inability.","المراهق: الحرج"]],"traps":[["*lamb/lamp* is not a minimal pair (the b in lamb is silent, so the words differ by an added sound).","lamb/lamp ليس زوجاً صغيراً"],["In Prator's hierarchy of difficulty (cited by Brown) one L1 sound becoming two L2 sounds is called a **split** — read the options carefully.","في هرم براتور يسمى هذا split"]],"src":"Swan & Smith, Learner English; Brown, Principles of Language Learning and Teaching; Kelly, How to Teach Pronunciation"},"en.spk.intonation":{"k":"Pronunciation","t":["Stress and intonation in sentences","نبر الجملة والتنغيم"],"body":[["English is stress-timed: stressed **content words** come at fairly regular intervals and unstressed **function words** are squeezed into weak forms (*can* → /kən/). The **tonic syllable** carries the main pitch movement, normally on the last content word, and moves to show contrast or new information.","كلمات المحتوى تُنبر وكلمات الوظيفة تضعف، والمقطع النووي يتحرك للتقابل."],["Intonation carries attitude: the same words can sound sure or unsure, polite or rude. Teach it through meaning, with arrows, hand gestures, back-chaining and short dialogues.","التنغيم يحمل الموقف، فيُعلَّم بالمعنى والحوارات."]],"pts":[["Falling ↘: statements, wh-questions, commands.","هابط: إخبار وwh وأوامر"],["Rising ↗: many yes/no questions, surprise, unfinished lists.","صاعد: نعم/لا والتعجب والقوائم غير المكتملة"],["Falling tag: the speaker is fairly sure and expects agreement. Rising tag: a real question.","الذيل الهابط تأكيد، والصاعد سؤال حقيقي"]],"traps":[["*I didn't take YOUR pen* = contrastive stress (I took someone else's).","نبر تقابلي"]],"ex":[["The teacher says *You're from Taif, aren't you?* twice — once falling, once rising — and students show a thumbs-up for *the speaker is sure* or a question mark for *the speaker is asking*.","نفس السؤال الذيلي بنغمتين، والطلاب يحددون: متأكد أم يسأل فعلاً."]],"src":"Kelly, How to Teach Pronunciation; Roach, English Phonetics and Phonology"},"en.spk.lfc":{"k":"Pronunciation","t":["Intelligibility and the Lingua Franca Core","الوضوح ونواة الإنجليزية المشتركة"],"body":[["Because English is now used mostly between non-native speakers, Jenkins studied which pronunciation features actually cause breakdowns. Her **Lingua Franca Core** lists the features that matter most for **intelligibility**; the rest can be left to learners' own accents.","جنكنز درست ما يسبب انقطاع الفهم بين غير الناطقين، وحددت النواة الضرورية للوضوح."]],"map":{"type":"cards","groups":[{"n":"Core","ar":"⁧أساسي⁩","items":[{"n":"Consonants","ar":"⁧معظم الصوامت⁩","kw":["/p/–/b/"]},{"n":"Clusters","ar":"⁧تجمعات أول الكلمة⁩","kw":["street"]},{"n":"Vowel length","ar":"⁧طول الصائت⁩","kw":["ship/sheep"]},{"n":"Nuclear stress","ar":"⁧النبر النووي⁩","kw":["contrast"]}]},{"n":"Non-core","ar":"⁧غير أساسي⁩","items":[{"n":"/θ/ /ð/","ar":"think / this","kw":["substitutes OK"]},{"n":"Weak forms","ar":"⁧الصيغ الضعيفة⁩","kw":["/ə/"]}]}]},"traps":[["/θ/ and /ð/ are among the **least** essential features in the LFC.","/θ/ و/ð/ غير أساسيين"],["The modern goal is intelligibility, not a native-like accent.","الهدف الوضوح لا اللكنة الأصلية"]],"src":"Jenkins, The Phonology of English as an International Language; Walker, Teaching the Pronunciation of English as a Lingua Franca"},"en.rd.skimscan":{"k":"Reading","t":["Skimming vs scanning","القراءة السريعة والانتقائية"],"body":[["Both are fast, selective reading — the difference is the **target**. Skimming looks for the general picture: topic, main idea, writer's purpose. Scanning looks for a single item and ignores the rest.","كلاهما سريع، والفرق في الهدف: الصورة العامة أم معلومة واحدة."]],"map":{"type":"cards","groups":[{"n":"Skimming","ar":"⁧للفكرة العامة⁩","items":[{"n":"Choose a title","ar":"⁧اختيار العنوان⁩","kw":["gist"]},{"n":"Match headlines","ar":"⁧مطابقة العناوين⁩","kw":["main idea"]},{"n":"Overview a chapter","ar":"⁧استعراض فصل⁩","kw":["survey"]}]},{"n":"Scanning","ar":"⁧لمعلومة محددة⁩","items":[{"n":"Find a date","ar":"⁧تاريخ أو رقم⁩","kw":["specific"]},{"n":"Dictionary","ar":"⁧البحث عن كلمة⁩","kw":["look up"]},{"n":"Timetable","ar":"⁧جدول مواعيد⁩","kw":["detail"]}]}]},"traps":[["Finding a country's population figure = scanning, even if the text is about the whole country.","رقم محدد = انتقائية"]],"src":"Grellet, Developing Reading Skills; Harmer, The Practice of English Language Teaching"},"en.rd.er":{"k":"Reading","t":["Extensive reading — Day & Bamford","القراءة الموسّعة: داي وبامفورد"],"body":[["Extensive reading means reading **a lot** of **easy** material for general understanding and enjoyment. Day and Bamford set out ten principles that describe a successful programme; the core idea is that fluency comes from quantity, and quantity comes only when reading is easy and enjoyable.","الفكرة: الطلاقة تأتي من الكمية، والكمية لا تأتي إلا إذا كانت القراءة سهلة وممتعة."]],"pts":[["The material is **easy** — at or below the learner's level.","سهلة: في مستواه أو أقل"],["A **variety** of material on many topics is available, and learners **choose** what to read.","متنوعة ويختارها الطالب"],["Learners read **as much as possible**, for pleasure and general understanding.","أكبر قدر ممكن للمتعة"],["Reading is its own reward — few or no comprehension tests.","القراءة مكافأة نفسها"],["Reading is individual, silent and usually faster.","فردية وصامتة وأسرع"],["The teacher orients and guides, and **models** being a reader.","المعلم يوجّه ويكون قدوة قارئة"]],"traps":[["'Texts should be above learners' level to challenge them' is NOT a principle of extensive reading.","النص الأعلى من المستوى ليس من مبادئها"]],"src":"Day & Bamford, Extensive Reading in the Second Language Classroom; Nation, Teaching ESL/EFL Reading and Writing"},"en.rd.models":{"k":"Reading","t":["Models of reading","نماذج القراءة"],"body":[["**Bottom-up** models see reading as decoding in sequence: letters → sounds → words → sentences → meaning. The text drives understanding, so word recognition is central.","من الأسفل: فك الترميز بالترتيب، والنص هو المحرك."],["**Top-down** models put the reader first. Goodman described reading as a *psycholinguistic guessing game*: readers sample the text, predict, and confirm or revise predictions using their knowledge.","من الأعلى: القارئ أولاً، يتوقع ويؤكد (لعبة التخمين النفسية اللغوية عند غودمان)."]],"pts":[["Names: **Gough** (1972) described a classic bottom-up model; **Goodman** (1967) the top-down 'psycholinguistic guessing game'; **Stanovich** (1980) the interactive-compensatory model.","غوف من الأسفل، وغودمان من الأعلى، وستانوفيتش التفاعلي التعويضي"],["Stanovich's **interactive-compensatory** model combines both: processes at all levels work together, and a deficit in one is compensated by greater reliance on the other.","التفاعلي التعويضي لستانوفيتش: العمليتان معاً، والضعف في واحدة تعوّضه الأخرى."]],"traps":[["Reading word by word, looking up every unknown word, or using prefix + root + suffix to decode = bottom-up.","كلمة كلمة أو تفكيك الكلمة = من الأسفل"],["Starting from what learners know and the overall meaning = top-down.","البدء من الخلفية والمعنى العام = من الأعلى"]],"ex":[["A student reading about camel racing does not know *jockey* but understands it from the picture and topic (**top-down** compensating). Another student works out *unbelievable* from *un- + believe + -able* (**bottom-up**).","فهم كلمة من الصورة والموضوع = من الأعلى، وتفكيكها إلى سابقة وجذر ولاحقة = من الأسفل."]],"src":"Brown, Teaching by Principles; Grabe & Stoller, Teaching and Researching Reading"},"en.rd.strategies":{"k":"Reading","t":["Comprehension strategies — the confusing pairs","استراتيجيات الفهم: الأزواج المتشابهة"],"body":[["Several strategies sound alike. The key is **when** they happen and **what** they use.","المفتاح: متى تحدث الاستراتيجية، وعلى ماذا تعتمد."]],"pts":[["**Predicting** — *before* reading: prior knowledge + title, headings, pictures → what the text will say.","التوقع: قبل القراءة من العنوان والصور"],["**Inferring** — *during/after*: background knowledge + clues in the text → meaning not stated.","الاستنتاج: أدلة النص + الخلفية ← معنى غير مذكور"],["**Summarizing** — main ideas only, shorter, own words.","التلخيص: الأفكار الرئيسية باختصار"],["**Paraphrasing** — same idea, similar length, different words.","إعادة الصياغة: نفس الفكرة بكلمات أخرى"],["**Monitoring** — noticing a breakdown in understanding and fixing it (re-read, slow down, ask).","المراقبة: اكتشاف الخلل وإصلاحه"],["**Visualizing** — forming mental images; **text-to-text** connections — linking texts by the same author or theme.","التصوّر، والربط بين النصوص"]],"traps":[["Prior knowledge + title BEFORE reading = predicting; background knowledge + text clues = inferring.","قبل القراءة توقع، ومن أدلة النص استنتاج"]],"src":"Grabe & Stoller, Teaching and Researching Reading; Anderson, Exploring Second Language Reading"},"en.rd.levels":{"k":"Reading","t":["Levels of comprehension","مستويات الفهم"],"body":[["Reading questions can be ordered from what is on the page to what the reader brings. Good lessons move through all three levels instead of stopping at the literal.","الأسئلة تتدرج من المكتوب إلى ما يضيفه القارئ، والدرس الجيد لا يقف عند الحرفي."]],"pts":[["**Literal** — *reading the lines*: facts that are explicitly stated (who, what, when).","حرفي: المذكور صراحة"],["**Interpretive / inferential** — *reading between the lines*: using logic and clues to infer meaning, causes, feelings.","تفسيري: بين السطور بالمنطق"],["**Critical / applied** — *reading beyond the lines*: evaluating credibility, purpose, argument; applying ideas.","ناقد: ما وراء السطور، تقويم وحكم"]],"traps":[["*Is the author's argument convincing? Why?* = critical, not interpretive.","هل الحجة مقنعة؟ = ناقد"]],"ex":[["After a story about a poor fisherman who finds a pearl: *What did he find?* (literal) — *Why did he hide it from his neighbours?* (interpretive) — *Was his decision wise? Why?* (critical).","ماذا وجد؟ حرفي. لماذا أخفاها؟ تفسيري. هل قراره حكيم؟ ناقد."]],"src":"Brown, Teaching by Principles; Day & Park, Developing Reading Comprehension Questions"},"en.rd.cueing":{"k":"Early reading","t":["Cueing systems and phonological awareness","أنظمة التلميح والوعي الصوتي"],"body":[["Beginning readers use three kinds of clues to identify words. Strong readers use all three together and check one against the others.","القارئ المبتدئ يستخدم ثلاثة أنواع من التلميحات، والقوي يجمعها."]],"pts":[["**Semantic** — meaning: context, pictures, background knowledge (*Does it make sense?*).","دلالي: المعنى والسياق والصورة"],["**Syntactic** — grammar: what kind of word fits here (*Does it sound right?*).","نحوي: ما الذي يناسب تركيب الجملة"],["**Graphophonic** — letter–sound relationships (*Does it look right?*).","صوتي كتابي: علاقة الحرف بالصوت"],["**Phonological awareness** — hearing and manipulating sound units: rhyme, syllables, onset–rime, phonemes. Developed through rhyming, syllabifying, **segmenting** (word → sounds) and **blending** (sounds → word).","الوعي الصوتي: قافية ومقاطع وتجزئة ودمج"]],"traps":[["Guessing a word from the picture and context = **semantic** cueing.","من الصورة والسياق = دلالي"],["Segmenting = breaking apart; blending = joining together.","التجزئة تفكيك والدمج تركيب"]],"src":"Cameron, Teaching Languages to Young Learners; Pinter, Teaching Young Language Learners"},"en.rd.phonics":{"k":"Early reading","t":["Synthetic vs analytic phonics","الصوتيات التركيبية والتحليلية"],"body":[["**Synthetic phonics** teaches letter–sound correspondences one by one and then trains learners to **blend** them to read words: /s/ /æ/ /t/ → *sat*. It works from the parts to the whole.","التركيبية: صوت كل حرف ثم الدمج لقراءة الكلمة، من الجزء إلى الكل."],["**Analytic phonics** starts from whole words learners already know and analyses the shared sound patterns: *cat, cap, can* all begin with /kæ/. It works from the whole to the parts.","التحليلية: من كلمات معروفة نحلل الأنماط المشتركة، من الكل إلى الجزء."]],"traps":[["Teaching s, a, t and then blending them = **synthetic**.","أصوات ثم دمج = تركيبية"],["Decoding is the first stage in learning to read.","فك الترميز أول مراحل القراءة"]],"src":"Cameron, Teaching Languages to Young Learners; Nation, Teaching ESL/EFL Reading and Writing"},"en.rd.tools":{"k":"Reading","t":["KWL, SQ3R and reciprocal teaching","جدول KWL وSQ3R والتدريس التبادلي"],"body":[["These are structured routines that make reading strategies visible and repeatable.","روتينات منظمة تجعل استراتيجيات القراءة ظاهرة ومتكررة."]],"pts":[["**KWL** (Ogle): *Know* — *Want to know* — *Learned*; connects prior knowledge with new learning and gives a purpose.","KWL: أعرف، أريد أن أعرف، تعلمت"],["**SQ3R** (Robinson): Survey, Question, Read, Recite, Review — a study-reading method.","SQ3R: استعرض، اسأل، اقرأ، سمّع، راجع"],["**Reciprocal teaching** (Palincsar & Brown): learners take turns leading four strategies — **predict, question, clarify, summarize**.","التدريس التبادلي: توقع، اسأل، وضّح، لخّص"]],"traps":[["KWL's main benefit = connecting prior knowledge with new learning.","KWL يربط السابق بالجديد"]],"src":"Grabe & Stoller, Teaching and Researching Reading; Anderson, Exploring Second Language Reading"},"en.voc.knowing":{"k":"Vocabulary","t":["What it means to know a word (Nation)","ماذا تعني معرفة الكلمة عند نيشن"],"body":[["Nation describes word knowledge in three areas — **form, meaning and use** — each with a receptive and a productive side. Knowing a word is therefore a matter of degree, not yes or no.","معرفة الكلمة ثلاثة مجالات: شكل ومعنى واستخدام، ولكل منها جانب استقبالي وإنتاجي، فهي درجات."]],"map":{"type":"cards","groups":[{"n":"Form","ar":"⁧الشكل⁩","items":[{"n":"Spoken","ar":"⁧النطق⁩","kw":["stress"]},{"n":"Written","ar":"⁧الإملاء⁩","kw":["spelling"]},{"n":"Word parts","ar":"⁧أجزاء الكلمة⁩","kw":["affixes"]}]},{"n":"Meaning","ar":"⁧المعنى⁩","items":[{"n":"Form-meaning","ar":"⁧ربط الشكل بالمعنى⁩","kw":["concept"]},{"n":"Associations","ar":"⁧الترابطات⁩","kw":["synonyms"]}]},{"n":"Use","ar":"⁧الاستخدام⁩","items":[{"n":"Grammar","ar":"⁧الوظيفة النحوية⁩","kw":["part of speech"]},{"n":"Collocations","ar":"⁧التلازم⁩","kw":["make a decision"]},{"n":"Constraints","ar":"⁧الرسمية والتكرار⁩","kw":["register"]}]}]},"pts":[["**Receptive** vocabulary is larger than **productive** vocabulary.","الاستقبالية أكبر من الإنتاجية"],["**Breadth** = how many words; **depth** = how well each word is known.","الاتساع كم، والعمق كيف"]],"traps":[["Knowing a word's meaning but not its collocations or derived forms = lack of **depth**.","يعرف المعنى فقط = نقص العمق"]],"src":"Nation, Learning Vocabulary in Another Language; Thornbury, How to Teach Vocabulary"},"en.voc.present":{"k":"Vocabulary","t":["Presenting and checking meaning","عرض المعنى والتحقق منه"],"body":[["Teachers choose the clearest, quickest way to convey meaning, then check it. Visual techniques suit concrete words; context, examples and definitions suit abstract words; translation can be efficient for a quick check.","نختار الأوضح والأسرع: المرئي للمحسوس، والسياق والتعريف للمجرد، والترجمة للتحقق السريع."]],"pts":[["**Realia** — real objects (a thermos, a ruler, dates).","Realia: الأشياء الحقيقية نفسها"],["**Visuals** — pictures, flashcards, quick drawings; mime and gesture.","صور وبطاقات ورسم وتمثيل"],["**Context and examples** — a sentence or short situation that makes meaning clear.","السياق والأمثلة"],["**CCQs** — short questions that test the core meaning: *starving → a little hungry or extremely hungry?*","أسئلة فحص المفهوم"]],"traps":[["Pictures and drawings are not realia.","الصور والرسوم ليست realia"],["*Do you understand?* is not a good check — learners usually say yes.","«فاهمين؟» ليس تحققاً"]],"src":"Thornbury, How to Teach Vocabulary; Gairns & Redman, Working with Words"},"en.voc.memory":{"k":"Vocabulary","t":["How words are remembered","كيف تُحفظ الكلمات"],"body":[["Vocabulary is learned gradually through **repeated encounters**. Each meeting adds a little knowledge, and meetings in different contexts make the word richer and easier to retrieve. Forgetting is fastest soon after learning, so early reviews matter most.","الكلمة تُتعلم تدريجياً بتكرار اللقاء في سياقات مختلفة، والنسيان أسرع بعد التعلم مباشرة فالمراجعة المبكرة أهم."]],"pts":[["**Spaced repetition** — review at increasing intervals (1 day, 3 days, 1 week…).","مراجعة على فترات متزايدة"],["**Retrieval** — trying to recall the meaning (word cards, quizzes) strengthens memory more than re-reading.","الاسترجاع أقوى من إعادة القراءة"],["**Incidental** learning — while focusing on meaning (reading, listening). **Intentional** learning — deliberate study.","عرضي ومقصود"],["**Recycling** — teachers reuse words in later lessons and activities.","إعادة التدوير في دروس لاحقة"]],"traps":[["The factor that helps memory most = meeting the word **many times** in different contexts.","التكرار في سياقات مختلفة"]],"src":"Nation, Learning Vocabulary in Another Language; Schmitt, Vocabulary in Language Teaching"},"en.voc.lexical":{"k":"Vocabulary","t":["Collocations, chunks and the Lexical Approach","التلازم والكتل والمدخل المعجمي"],"body":[["Michael Lewis argued that language is largely made of **lexical chunks** — prefabricated multi-word units — rather than single words slotted into grammar rules. Fluent speakers retrieve whole chunks, which is why they speak quickly and naturally.","لويس: اللغة كتل جاهزة متعددة الكلمات، والمتحدث الطليق يستدعيها كاملة."]],"pts":[["**Collocations** — words that habitually co-occur: *make a decision, heavy rain, strong coffee*.","التلازم: كلمات تأتي معاً"],["**Fixed and semi-fixed expressions** — *by the way; Would you mind…?; If I were you, I'd…*","عبارات ثابتة وشبه ثابتة"],["**Idioms** — meaning not deducible from the parts: *break the ice*; closely tied to culture.","التعابير الاصطلاحية مرتبطة بالثقافة"],["Teaching implication: help learners **notice** and record chunks, not just single words.","علّم الطالب ملاحظة الكتل وتدوينها"]],"traps":[["The Lexical Approach is Michael **Lewis**, not Nation.","المدخل المعجمي لمايكل لويس"]],"ex":[["*make a decision*, *heavy rain*, *do homework* are collocations; learners who translate word by word produce odd combinations like *do a mistake*.","الترجمة كلمة بكلمة تنتج تراكيب غريبة مثل do a mistake."]],"src":"Lewis, The Lexical Approach; Thornbury, How to Teach Vocabulary"},"en.voc.strands":{"k":"Vocabulary","t":["Nation's four strands","خيوط نيشن الأربعة"],"body":[["Nation proposes that a well-balanced course gives roughly **equal time** to four strands. If one strand is missing, learning becomes unbalanced — for example, lots of explicit study but no fluency work.","المقرر المتوازن يعطي الخيوط الأربعة وقتاً متساوياً تقريباً."]],"pts":[["**Meaning-focused input** — learning through listening and reading (e.g. extensive reading).","مدخلات تركز على المعنى"],["**Meaning-focused output** — learning through speaking and writing.","مخرجات تركز على المعنى"],["**Language-focused learning** — deliberate study of words and features (word cards, affixes).","تعلم يركز على اللغة"],["**Fluency development** — using what is already known faster (4/3/2, speed reading).","تطوير الطلاقة بالمعروف مسبقاً"]],"traps":[["Fluency work uses **easy, familiar** material — no new language.","الطلاقة بمادة سهلة مألوفة"]],"src":"Nation, Learning Vocabulary in Another Language; Nation, What Should Every EFL Teacher Know?"},"en.voc.coverage":{"k":"Vocabulary","t":["Lexical coverage and word lists","التغطية المعجمية وقوائم الكلمات"],"body":[["**Lexical coverage** is the percentage of running words in a text that a reader knows. Research suggests about **95%** for adequate comprehension and about **98%** for comfortable, unassisted reading — that is, roughly one unknown word in fifty.","التغطية: نسبة الكلمات المعروفة في النص. نحو 95% للفهم المقبول، و98% للقراءة المريحة."],["Because a small number of words cover most of any text, teachers prioritise **high-frequency** vocabulary: West's **General Service List** (about 2,000 headwords) and, for academic study, Coxhead's **Academic Word List** (570 word families).","عدد قليل من الكلمات يغطي معظم النصوص، فنبدأ بقائمة ويست ثم قائمة كوكسهيد الأكاديمية."]],"pts":[["A **word family** = base word + inflections + derivations: *use, uses, used, useful, useless*.","عائلة الكلمة: الأصل ومشتقاته"]],"traps":[["98% (not 95%) is the figure for comfortable unassisted reading.","98% للقراءة المريحة"],["AWL = 570 word families, by Coxhead.","570 عائلة لكوكسهيد"]],"src":"Nation, Learning Vocabulary in Another Language; Schmitt, Vocabulary in Language Teaching"},"en.voc.corpus":{"k":"Vocabulary","t":["Corpora, concordances and data-driven learning","المدونات اللغوية والتعلم من البيانات"],"body":[["A **corpus** is a large collection of real texts stored electronically. A **concordance** shows every line containing a search word, centred on the word (key word in context), so patterns of collocation and grammar become visible at a glance.","المدونة نصوص حقيقية ضخمة، والكونكوردانس يعرض الكلمة في سطورها فيظهر نمطها فوراً."],["In **data-driven learning** (Tim Johns), learners act like researchers: they examine concordance lines and discover rules and patterns themselves — an inductive approach to vocabulary and grammar.","التعلم من البيانات (جونز): الطالب كالباحث يكتشف النمط بنفسه، أسلوب استقرائي."]],"traps":[["Learners discovering *make/do* patterns from corpus lines = data-driven learning.","اكتشاف النمط من سطور المدونة = DDL"]],"pts":[["Learner's (monolingual) dictionaries use a controlled defining vocabulary and example sentences.","قواميس المتعلم الأحادية: مفردات تعريف محدودة وأمثلة"]],"ex":[["The teacher shows twenty corpus lines with *depend* and asks: *Which word always comes after it?* Students discover *depend on* themselves — **data-driven learning**.","عشرون سطراً من مدونة لغوية، والطلاب يكتشفون أن depend يتبعها on: تعلم من البيانات."]],"src":"Johns (1991); O'Keeffe, McCarthy & Carter, From Corpus to Classroom"},"en.wr.approaches":{"k":"Writing","t":["Product, process and genre approaches","مداخل المنتج والعمليات والنوع"],"body":[["The **product approach** is model-based: learners study a model text, practise its features in controlled exercises, then produce a similar text. The focus is the accuracy of the final product.","المنتج: نموذج ← تدريب مضبوط ← نص مشابه، والتركيز على دقة النتيجة."],["The **process approach** focuses on the writer's activities — planning, drafting, feedback, revising — and treats writing as **recursive**. The **genre approach** focuses on text types and their social purposes, making the conventions of each genre explicit.","العمليات: مراحل متكررة. النوع: أعراف كل نوع نصي وغرضه الاجتماعي."]],"map":{"type":"cards","groups":[{"n":"Product","ar":"⁧المنتج⁩","items":[{"n":"Imitate a model","ar":"⁧تقليد نموذج⁩","kw":["accuracy"]}]},{"n":"Process","ar":"⁧العمليات⁩","items":[{"n":"Drafts & feedback","ar":"⁧مسودات وتغذية راجعة⁩","kw":["recursive"]}]},{"n":"Genre","ar":"⁧النوع⁩","items":[{"n":"Text purpose","ar":"⁧غرض النص وأعرافه⁩","kw":["social context"]}]},{"n":"Process-genre","ar":"⁧العملي النوعي⁩","items":[{"n":"Both","who":"Badger & White","ar":"⁧النوع + المراحل⁩"}]}]},"traps":[["Imitating a model text = product approach.","تقليد النموذج = منتج"],["Analysing several real job-application letters and then writing one = genre approach.","تحليل رسائل حقيقية = نوع"]],"ex":[["Product: students copy the structure of a model email to a pen-friend. Process: they brainstorm, draft, exchange drafts and rewrite. Genre: they compare three real job-application letters, list the shared features, then write their own.","تقليد نموذج = منتج. عصف ومسودات وتبادل = عمليات. تحليل رسائل حقيقية ثم الكتابة = نوع."]],"src":"Hyland, Second Language Writing; Badger & White (2000); Harmer, How to Teach Writing"},"en.wr.stages":{"k":"Writing","t":["The writing process","مراحل عملية الكتابة"],"body":[["The stages are usually listed in order, but real writers move back and forth between them — the process is **recursive**.","المراحل تُذكر بالترتيب لكن الكاتب يتنقل بينها ذهاباً وإياباً."]],"pts":[["**Pre-writing** — brainstorming, freewriting, clustering/mind maps, outlining.","قبل الكتابة: عصف وكتابة حرة وخرائط ومخطط"],["**Drafting** — getting ideas down; fluency over accuracy.","المسودة: الأفكار قبل الدقة"],["**Revising** — improving content and organisation using peer and teacher feedback.","المراجعة: المحتوى والتنظيم بملاحظات الآخرين"],["**Editing / proofreading** — grammar, spelling, punctuation.","التدقيق: القواعد والإملاء والترقيم"],["**Publishing** — sharing the final version.","النشر"]],"traps":[["Incorporating peers' and teacher's suggestions = **revising**; correcting spelling and punctuation = **editing/proofreading**.","اقتراحات الآخرين = مراجعة، والإملاء = تدقيق"],["Freewriting is a **pre-writing** technique.","الكتابة الحرة من قبل الكتابة"]],"src":"Harmer, How to Teach Writing; Hedge, Writing"},"en.wr.control":{"k":"Writing","t":["Controlled, guided and free writing","الكتابة المضبوطة والموجهة والحرة"],"body":[["The three types sit on a continuum of support. As learners progress, the teacher gradually removes control over content and form.","الأنواع الثلاثة متدرجة في الدعم، والمعلم يسحب التحكم تدريجياً."]],"pts":[["**Controlled** — content and form fixed: copying, dictation, substitution tables, rewriting a passage in another tense.","مضبوطة: نسخ وإملاء وتغيير الزمن"],["**Guided** — support through an outline, key words, a model, sentence starters or pictures.","موجّهة: مخطط وكلمات ونموذج"],["**Free** — learners choose content and organisation.","حرة: الطالب يختار"],["**Modeled writing** — the teacher writes in front of learners and thinks aloud; the first step with young learners.","الكتابة النموذجية: أول خطوة مع الصغار"],["Give beginners words to build on, and do not comment on every error.","أعطِ المبتدئ كلمات ولا تعلّق على كل خطأ"]],"traps":[["*Rewrite the passage in the past simple* = controlled.","إعادة الكتابة بزمن آخر = مضبوطة"]],"src":"Raimes, Techniques in Teaching Writing; Hedge, Writing"},"en.wr.paragraph":{"k":"Writing","t":["Paragraph and essay structure; coherence vs cohesion","بناء الفقرة والمقال والترابط والتماسك"],"body":[["A paragraph develops **one** main idea: topic sentence → supporting sentences (explanations, examples, details) → concluding sentence. An essay develops one **thesis** through several paragraphs, so the thesis statement is broader than any single topic sentence.","الفقرة فكرة واحدة، والمقال أطروحة واحدة عبر فقرات، فالأطروحة أعمّ من الجملة الموضوعية."],["**Coherence** is about ideas: logical order and clear relevance to the main point. **Cohesion** is about language: the grammatical and lexical links between sentences — transitions, pronouns, repetition, synonyms.","الترابط في الأفكار ومنطقها، والتماسك في أدوات الربط اللغوية."]],"traps":[["In an argumentative essay the thesis usually comes at the **end of the introduction**.","الأطروحة آخر المقدمة"],["Transitional expressions improve coherence (and are cohesive devices).","أدوات الانتقال تحسّن الترابط"]],"src":"Oshima & Hogue, Writing Academic English; Halliday & Hasan, Cohesion in English"},"en.wr.types":{"k":"Writing","t":["Types of writing","أنواع الكتابة"],"body":[["Each type is defined by its **purpose**, so identify the purpose first. Narrative writing is often read for pleasure; expository writing is **subject-oriented**.","حدّد الغرض أولاً ثم النوع. السردي للمتعة غالباً، والتفسيري يدور حول الموضوع."]],"pts":[["**Narrative** — tells a story; chronological order (*first, then, finally*).","سردي: قصة بترتيب زمني"],["**Descriptive** — creates a picture; sensory details, metaphors.","وصفي: تفاصيل حسية واستعارات"],["**Expository** — explains or informs; process (*how to make a milkshake*), cause–effect, comparison.","تفسيري: يشرح ويخبر"],["**Persuasive / argumentative** — takes a position; facts, statistics, expert opinion.","إقناعي: موقف وأدلة"],["**Reflective** — responds to personal experience and feelings (journals).","تأملي: تجربة ومشاعر"],["**Informative** genres — summaries, letters, reports.","إخباري: ملخصات ورسائل وتقارير"]],"traps":[["A 'how to' process paragraph is expository.","كيف تصنع… = تفسيري"]],"src":"Oshima & Hogue, Writing Academic English; Harmer, How to Teach Writing"},"en.wr.wcf":{"k":"Writing","t":["Written corrective feedback","التغذية التصحيحية الكتابية"],"body":[["**Truscott (1996)** claimed grammar correction in L2 writing does not work and may harm, because it draws attention from content and creates anxiety. **Ferris (1999)** answered that the evidence was not enough to abandon it, and that feedback which is clear, selective and consistent can help.","تروسكوت: التصحيح لا يفيد وقد يضر. فيريس: الأدلة لا تكفي للتخلي عنه، والواضح الانتقائي يفيد."]],"pts":[["**Direct** — the teacher writes the correct form.","مباشر: يكتب الصحيح"],["**Indirect** — the error is shown (underline, circle, code) and the learner corrects it.","غير مباشر: يشير فقط"],["**Focused** — one or a few error types; **unfocused** — all errors.","مركّز وشامل"],["**Metalinguistic** — codes or brief rule explanations.","تعليق على القاعدة أو رموز"],["Respond to **content and organisation** on early drafts and to language accuracy on later drafts; require learners to **act on** the feedback (rewrite).","المحتوى أولاً ثم اللغة، والطالب يعيد الكتابة"]],"traps":[["Underlining + codes (*sp, vt*) without the correct form = **indirect**.","خط ورمز بلا تصحيح = غير مباشر"],["Correcting only article errors this week = **focused**.","أدوات التعريف فقط = مركّز"]],"ex":[["This week the teacher only underlines article errors (*a/an/the*) and writes *art* in the margin; students must correct them before resubmitting — **indirect, focused** feedback.","يضع خطاً تحت أخطاء أدوات التعريف فقط ويكتب رمزاً، والطالب يصحّح بنفسه: غير مباشر ومركّز."]],"src":"Truscott (1996); Ferris (1999); Ellis, A typology of written corrective feedback types (2009)"},"en.wr.tlc":{"k":"Writing","t":["Genre teaching and the teaching-learning cycle","مدخل النوع ودورة التعليم والتعلم"],"body":[["Genre-based teaching (from the Sydney School) makes the structure and language of each text type explicit. Its **teaching-learning cycle** gradually hands responsibility from teacher to learner.","مدخل النوع يكشف بنية كل نوع نصي ولغته، ودورته تنقل المسؤولية تدريجياً للطالب."],["Badger and White's **process-genre** approach combines this genre knowledge with the drafting and revising stages of process writing.","المدخل العملي النوعي يدمج معرفة النوع بمراحل المسودة والمراجعة."]],"pts":[["1 **Building the context** — the purpose and situation of the genre.","بناء السياق"],["2 **Modelling and deconstruction** — analysing a model text's stages and language.","النمذجة وتحليل النص"],["3 **Joint construction** — teacher and class write a text together.","الكتابة المشتركة"],["4 **Independent construction** — learners write alone.","الكتابة المستقلة"],["**Peer review** works best with training and a checklist; a **writing conference** is a short one-to-one talk with the teacher about a draft.","مراجعة الأقران بقائمة، ومناقشة فردية قصيرة"],["**Automated writing evaluation (AWE)** and AI tools give instant language feedback; teachers still guide content, check the suggestions and protect **academic integrity**.","الأدوات الآلية مساعدة لا بديل"]],"traps":[["Teacher and class composing a text together on the board = **joint construction**.","الكتابة معاً على السبورة = مشتركة"]],"src":"Hyland, Genre and Second Language Writing; Badger & White (2000); Feez, Text-Based Syllabus Design"},"en.wr.kaplan":{"k":"Writing","t":["Contrastive rhetoric and Arab writers","البلاغة التقابلية والكاتب العربي"],"body":[["Kaplan compared essays by writers from different l
