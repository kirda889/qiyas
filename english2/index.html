with decoding and spelling despite adequate teaching — use **multisensory** techniques, clear fonts, extra time and oral alternatives.","عسر القراءة: طرق متعددة الحواس ووقت إضافي"],["**ADHD**: difficulty sustaining attention and controlling impulses — short varied tasks, clear routines, movement breaks, seating near the teacher.","فرط الحركة: مهام قصيرة وروتين واستراحات حركة"]],"traps":[["Dyslexia and ADHD are learning difficulties, not cognitive styles.","صعوبات لا أساليب"]],"src":"Brown, Principles of Language Learning and Teaching; Kormos & Smith, Teaching Languages to Students with Specific Learning Differences"},"en.lis.skills":{"k":"Listening","t":["Receptive skills: hearing vs listening","مهارات الاستقبال: السماع والاستماع"],"body":[["Listening and reading are **receptive** skills (input); speaking and writing are **productive** (output). Receptive does not mean passive: **hearing** is only receiving sound, while **listening** means attending, decoding, linking to what we know and interpreting.","الاستقبال ليس سلبية: السماع التقاط صوت، والاستماع انتباه وفهم وتفسير."],["Listening is often called the **least understood** (most neglected) skill: unlike a reader, the listener cannot control the speed or go back. So input must be **meaningful** and comprehensible — roughly at the learners' level.","لا يتحكم المستمع في السرعة ولا يرجع، فيكون المدخل ذا معنى ومفهوماً."]],"ex":[["A class hears a short airport announcement and only needs the **flight number and the gate** — understanding a real message, not just hearing sounds.","المطلوب رقم الرحلة والبوابة فقط: فهم رسالة لا مجرد سماع."]],"traps":[["Hearing ≠ listening: hearing is physical; listening is active understanding.","السماع غير الاستماع"]],"src":"Brown, Teaching by Principles; Rost, Teaching and Researching Listening"},"en.lis.strat":{"k":"Listening","t":["Listener strategies","استراتيجيات المستمع"],"body":[["Strategies are what a listener does when understanding is incomplete. Questions usually describe a behaviour and ask for its name.","الاستراتيجية ما يفعله المستمع حين لا يكتمل الفهم، والسؤال يصف سلوكاً ويطلب اسمه."]],"pts":[["**Tolerance of ambiguity** — accepting that some information is unclear and continuing.","تحمّل الغموض: يكمل رغم عدم وضوح بعض المعلومات"],["**Compensation** — inferring missing information from context.","التعويض: استنتاج الناقص من السياق"],["**Self-monitoring** — checking one's own understanding while listening.","المراقبة الذاتية للفهم"],["**Cornell method** — a note-taking technique (notes, cue words, summary).","طريقة كورنيل لتدوين الملاحظات"],["**Shadowing** — repeating after the speaker at the same time.","المحاكاة المتزامنة للمتحدث"],["**Dictogloss** — hear a short text, note key words, reconstruct it in groups.","إعادة بناء النص بعد سماعه"]],"ex":[["A student misses one word in a dialogue about a hospital but continues, then guesses from *doctor* and *appointment* that it was *clinic* — **compensation** plus **tolerance of ambiguity**.","فاتته كلمة فأكمل وخمّنها من السياق: تعويض وتحمّل غموض."]],"traps":[["Going on despite unclear words = tolerance of ambiguity; guessing the missing word from context = compensation.","الاستمرار = تحمّل غموض، والتخمين = تعويض"]],"src":"Field, Listening in the Language Classroom; Vandergrift & Goh, Teaching and Learning Second Language Listening"},"en.lis.texts":{"k":"Listening","t":["Choosing listening texts and tasks","اختيار نص الاستماع ومهامه"],"body":[["Learner **interest** in the topic is the factor most linked to how engaging and followable a listening text is. Speed, length and accent matter too, but an interesting topic keeps attention.","الموضوع الممتع أهم عامل، والسرعة والطول واللهجة مهمة أيضاً."]],"pts":[["**Pre**: predicting from a title or picture, **generating questions** the text might answer, pre-teaching key words.","قبل: توقع وتوليد أسئلة وكلمات أساسية"],["**While**: note-taking, checking predictions.","أثناء: تدوين وتحقق من التوقعات"],["**Post**: summarizing, discussing.","بعد: تلخيص ونقاش"],["Following spoken classroom instructions is itself a listening task; 'listen and do' activities belong to [[TPR|en.meth.tpr]].","اتباع التعليمات استماع، و«اسمع ونفّذ» من TPR"]],"traps":[["Checking predictions happens **while** listening, not before.","التحقق من التوقعات أثناء الاستماع"]],"src":"Richards, Teaching Listening and Speaking; Field, Listening in the Language Classroom"},"en.spk.activities":{"k":"Speaking","t":["Speaking activities","أنشطة الكلام"],"body":[["Good speaking activities create a real **need** to talk: one learner has what another needs, or a role demands a certain way of speaking.","النشاط الجيد يخلق حاجة حقيقية للكلام."]],"pts":[["**Information gap** — a learner needs a partner's information to complete a task.","فجوة المعلومات: ما ينقصك عند زميلك"],["**Jigsaw** — each learner holds one part; the group shares to complete the whole.","كل طالب جزء والمجموعة تكمل"],["**Role play** — acting out characters with suitable dialogue; changing the partner (friend → minister) practises **register**.","لعب الأدوار ومستويات الخطاب"],["Shy learners: **group-based** activities; **games** add competition.","الخجول: جماعي، والألعاب منافسة"],["One-on-one oral interview: focus primarily on **correct content**.","المقابلة: المحتوى أولاً"]],"traps":[["Information gap is a speaking activity, not reading.","فجوة المعلومات كلام"]],"src":"Harmer, The Practice of English Language Teaching; Brown, Teaching by Principles"},"en.spk.stress":{"k":"Pronunciation","t":["Word stress: tendencies and techniques","نبر الكلمة: قواعد تقريبية وتقنيات"],"body":[["Every English word of two or more syllables has one **primary stress**. A stressed syllable is louder, longer and higher in pitch, and its vowel is full; unstressed vowels often reduce to /ə/.","المقطع المنبور أعلى وأطول وصائته كامل، وغير المنبور يضعف إلى /ə/."]],"pts":[["Many two-syllable **nouns/adjectives** stress the first syllable (**TA**ble, **HAP**py); many two-syllable **verbs** the second (de**CIDE**, be**GIN**) — tendencies, not absolute rules.","ميول لا قواعد مطلقة"],["Word class: **RE**cord (noun) vs re**CORD** (verb), **PRE**sent vs pre**SENT**.","النبر يفرّق الاسم عن الفعل"],["**-tion, -sion, -ic, -ity**: stress just before the suffix — infor**MA**tion, eco**NOM**ic, a**BIL**ity.","قبل اللاحقة مباشرة"],["Compound nouns: **GREEN**house (a building for plants) vs green **HOUSE** (a house painted green).","المركّب على الجزء الأول"],["Techniques: circles (oOo) or underlining, clapping or tapping, sorting words into stress-pattern columns, humming the rhythm.","دوائر وتصفيق وتصنيف ودندنة"]],"traps":[["Teach stress **with every new word**, not as a separate rule list.","علّم النبر مع كل كلمة جديدة"]],"src":"Kelly, How to Teach Pronunciation; Roach, English Phonetics and Phonology"},"en.spk.fluency":{"k":"Speaking","t":["Building speaking fluency","بناء طلاقة الكلام"],"body":[["Fluency research gives simple classroom techniques. Repeating a task and planning before it free the learner's attention, so speech becomes faster, smoother and more complex.","تكرار المهمة والتخطيط لها يحرران الانتباه فيصبح الكلام أسرع وأسلس."]],"pts":[["**4/3/2** — the same talk to three different partners in 4, then 3, then 2 minutes: repetition under time pressure.","نفس الحديث بوقت يقصر"],["**Task repetition** — doing the same or a similar task again.","تكرار المهمة"],["**Pre-task planning time** — a few minutes to prepare improves fluency and complexity (task-based research).","وقت التخطيط قبل المهمة"]],"traps":[["Fluency work uses familiar language — no new items.","الطلاقة بلغة مألوفة"]],"src":"Nation & Newton, Teaching ESL/EFL Listening and Speaking; Ellis, Task-based Language Learning and Teaching"},"en.spk.peer":{"k":"Speaking","t":["Repair strategies, role-play and peer correction","استراتيجيات الإصلاح وتصحيح الأقران"],"pts":[["**Repair strategies** — formulaic phrases to fix breakdowns: asking for repetition ('Sorry, could you say that again?'), asking for help or clarification, paraphrasing a missing word.","عبارات جاهزة لإصلاح انقطاع التواصل"],["**Role-play** — two or three learners act out an extended dialogue; the teacher is a **facilitator**: sets up roles, monitors, supports and gives feedback afterwards instead of taking over.","المعلم ميسّر يراقب ويؤجل التصحيح"],["**Peer correction** — learners point out and fix each other's errors before the teacher steps in; it builds **learner autonomy**, cooperation and awareness of errors.","يبني الاستقلالية والتعاون والوعي بالأخطاء"],["Peer correction works best in controlled practice, with clear guidance and a supportive atmosphere; the teacher still confirms the correct form.","مع توجيه وجو داعم"]],"src":"Harmer, The Practice of English Language Teaching; Scrivener, Learning Teaching"},"en.rd.fluency":{"k":"Reading","t":["Reading fluency, silent and oral reading","طلاقة القراءة والقراءة الصامتة والجهرية"],"body":[["Reading fluency means **accuracy, rate and prosody** together, and it begins with **direct instruction**. Learners with **dyslexia** mainly need to improve **word recognition**.","الطلاقة دقة وسرعة وتنغيم، وتبدأ بالتعليم المباشر، وعسر القراءة يحتاج تمييز الكلمات."]],"pts":[["**Repeated reading** — reading the same text several times.","قراءة النص نفسه مرات"],["**Timed reading** — tracking words per minute.","قياس الكلمات في الدقيقة"],["**Silent reading** — faster, focused on meaning, builds fluency (speed with comprehension).","الصامتة أسرع وتبني الطلاقة"],["**Oral reading** — checks decoding and pronunciation; slower, splits attention between sound and meaning.","الجهرية للدقة، وأبطأ"]],"src":"Grabe & Stoller, Teaching and Researching Reading; Nation, Teaching ESL/EFL Reading and Writing"},"en.rd.arab":{"k":"Reading","t":["Arab learners reading English","المتعلم العربي وقراءة الإنجليزية"],"body":[["Written Arabic usually omits short vowels and runs right to left, so Arab learners often need explicit work on English **vowel letters** and on left-to-right **word recognition**.","العربية تحذف الحركات وتُكتب من اليمين، فيحتاج الطالب تدريباً صريحاً على الحروف الصائتة واتجاه القراءة."]],"src":"Swan & Smith, Learner English (Arabic speakers chapter)"},"en.voc.activities":{"k":"Vocabulary","t":["Vocabulary activities and assessment","أنشطة المفردات وتقويمها"],"pts":[["'Odd one out', crosswords, puzzles, matching and bingo are **vocabulary** activities; a crossword develops **lexical** knowledge.","الشاذة والمتقاطعة والمطابقة = مفردات"],["Teaching **affixes** increases both vocabulary and syntactic ability.","السوابق واللواحق"],["Vocabulary assessment checks meaning, pronunciation, spelling, part of speech and usage.","ماذا نقيس في المفردات"],["Digital flashcard tools such as **Quizlet** are widely used for vocabulary practice.","بطاقات رقمية للتدريب"]],"traps":[["Odd one out = vocabulary, not listening or reading.","الشاذة = مفردات"]],"src":"Thornbury, How to Teach Vocabulary; Nation, Learning Vocabulary in Another Language"},"en.voc.assoc":{"k":"Vocabulary","t":["Word association, lexical sets and review","ترابط الكلمات والمجموعات المعجمية والمراجعة"],"pts":[["**Association** — words linked in memory around one topic (tree → apples, leaves, green); not synonymy or antonymy. Brainstorming associations helps recall.","كلمات مترابطة حول موضوع"],["**Lexical set** — words from one topic or semantic field taught together (sports: archery, fencing, rowing, scuba diving).","كلمات موضوع واحد معاً"],["Review routine: **write** the word, **look** at it, **practise** using it, **repeat** the review over days.","اكتب، انظر، تدرّب، كرّر"],["**CCQs** test the core meaning, often as either/or questions: 'furious' → 'A bit angry or very angry?'","أسئلة ثنائية لفحص المعنى"]],"ex":[["The teacher writes *Ramadan* in the middle of the board and students add *fasting, iftar, dates, family, charity* — a word-association map that later becomes a writing plan.","خريطة ترابط حول رمضان تتحول لخطة كتابة."],["After teaching *furious*: *Is he a bit angry or very angry? (Very.) Would he smile? (No.)* — two quick CCQs.","سؤالان سريعان يكشفان فهم المعنى."]],"src":"Thornbury, How to Teach Vocabulary; Gairns & Redman, Working with Words"},"en.gr.reported":{"k":"Grammar","t":["Teaching reported speech","تدريس الكلام المنقول"],"pts":[["After a past reporting verb, tenses usually **shift back**: present → past, will → would, past simple → past perfect; tomorrow → the next day, here → there.","الرجوع خطوة في الزمن والظرف"],["Backshift is **optional** when the statement is still true: 'He said the sun **rises** in the east.'","اختياري إذا بقي صحيحاً"],["**say** vs **tell**: tell needs a person object ('She told **me**…'); say does not ('She said that…').","tell تحتاج مفعولاً"],["Reported questions: statement word order, no do/does/did ('He asked where I **lived**', not 'where did I live'); yes/no → **if/whether**.","ترتيب الخبر، وif/whether لنعم/لا"],["Practice: messenger/relay games, reporting a classmate's interview or survey answers.","ألعاب نقل الرسائل"]],"src":"Swan, Practical English Usage; Thornbury, How to Teach Grammar"},"en.gr.articles":{"k":"Grammar","t":["Articles and countable/uncountable nouns","أدوات التعريف والمعدود وغير المعدود"],"pts":[["**a/an**: first mention of a singular countable noun; choice by **sound**: an hour, a university.","a/an حسب الصوت"],["**the**: already known or mentioned, unique (the sun), or made specific ('the book on the desk').","the للمعروف والمحدد"],["**Zero article**: general statements with plural or uncountable nouns.","بلا أداة للتعميم"],["Uncountable in English: information, advice, furniture, news, equipment, homework — no 'informations/advices'; use **partitives**: a piece of advice, a loaf of bread.","لا جمع لها، ونعدّها بالكميات"],["Quantifiers: many / a few + countable; much / a little + uncountable. Practise with shopping lists, recipes, 'How much / How many' role plays.","قوائم تسوق ووصفات"]],"traps":[["Arab learners overuse 'the' for general meaning ('The honesty…') because Arabic uses 'al-' for generic and abstract nouns.","«ال» العامة من العربية"]],"src":"Swan, Practical English Usage; Swan & Smith, Learner English"},"en.gr.passrel":{"k":"Grammar","t":["The passive and relative clauses","المبني للمجهول وجمل الصلة"],"pts":[["Passive = **be + past participle**; use it when the agent is unknown, unimportant or obvious, or to focus on the action/result — common in processes, news and science.","متى نستخدم المجهول"],["Only transitive verbs have a passive: '*The accident **was happened**' is wrong (happen is intransitive).","لا مجهول للازم"],["Relative pronouns: **who** (people), **which** (things), **that** (people/things in defining clauses), **whose** (possession), **where** (place), **when** (time).","ضمائر الوصل"],["**Defining** clauses identify the noun: no commas, 'that' allowed, object pronoun can be omitted ('the book (that) I bought'). **Non-defining** add extra information: commas, no 'that'.","المحددة وغير المحددة"],["Resumptive pronoun ('the book that I read **it**') comes from Arabic's returning pronoun; practise with sentence combining and definition games ('It's a person who…').","الضمير العائد من العربية"]],"src":"Swan, Practical English Usage; Thornbury, How to Teach Grammar; Swan & Smith, Learner English"},"en.l15-behav":{"k":"شرح موسّع","t":["Behaviorism","السلوكية"],"body":[["Behaviorists see learning as **habit formation**: a stimulus produces a response, and reinforcement makes the response stronger. The mind is treated as a 'black box' — only observable behavior counts.","التعلم عادة تتكوّن: مثير ← استجابة ← تعزيز، والمهم السلوك الظاهر فقط."],["In language teaching this led to [[Skinner|en.skinner]]'s view of language as verbal behavior and to the **Audio-Lingual Method**: repetition drills, imitation and avoiding errors so bad habits do not form.","ومنها جاءت الطريقة السمعية الشفهية: تكرار وتقليد وتجنّب الخطأ."]],"traps":[["Blank slate (tabula rasa) = behaviorism, not nativism.","الصفحة البيضاء = السلوكية"]]},"en.l16-stages":{"k":"شرح موسّع","t":["Stages of Second Language Acquisition","مراحل اكتساب اللغة الثانية"],"body":[["Krashen & Terrell's **Natural Approach** describes three early stages — **preproduction**, **early production** and **speech emergence**. Teacher-education materials commonly add **intermediate fluency** and **advanced fluency**, giving five.","ثلاث مراحل في الأصل، وتضيف مواد إعداد المعلمين مرحلتين فتصير خمساً."]],"pts":[["**Preproduction**: learners understand more than they say; they point, gesture, nod or draw. Teacher: TPR, pictures, yes/no questions; do not force speech.","يفهم ولا يتكلم؛ لا تجبره على الكلام"],["**Early production**: one- or two-word answers and memorised chunks. Teacher: either/or and who/what/where questions, labelling, lists.","كلمة أو كلمتان: أسئلة اختيار وتسمية"],["**Speech emergence**: simple sentences and short conversations with frequent errors. Teacher: how/why questions, short stories, dialogues.","جمل بسيطة وأخطاء كثيرة"],["**Intermediate fluency**: complex sentences, opinions, fewer errors. Teacher: 'What would happen if…?', compare and explain, writing tasks.","جمل مركبة وآراء"],["**Advanced fluency**: near-native performance in academic contexts — the level linked to Cummins' **CALP**, which takes years.","قرب الطلاقة الأكاديمية"]],"ex":[["Teacher: 'Is this a mosque or a school?' Student: 'Mosque.' An either/or question suits early production; 'What would happen if there were no traffic lights?' waits for intermediate fluency.","سؤال الاختيار يناسب الإنتاج المبكر، وسؤال «ماذا لو» يُؤجَّل للطلاقة المتوسطة."]],"traps":[["Pointing and nodding without speaking = **preproduction** (silent period).","الإشارة بلا كلام = ما قبل الإنتاج"]]},"en.l16-gll":{"k":"شرح موسّع","t":["The Good Language Learner","المتعلم الجيد للغة"],"body":[["'Good language learner' studies (e.g. Rubin, 1975) asked what successful learners do differently. The findings fed directly into strategy research such as Oxford's.","دراسات المتعلم الجيد بحثت ما يفعله الناجحون، ومنها انطلقت أبحاث الاستراتيجيات."]],"pts":[["Guesses willingly and accurately.","يخمّن بلا تردد"],["Wants to communicate and is not inhibited by mistakes.","يحب التواصل ولا يخاف الخطأ"],["Attends to both form and meaning.","ينتبه للشكل والمعنى"],["Practises and monitors his own speech and that of others.","يتدرب ويراقب كلامه"]]},"en.l17-disc":{"k":"شرح موسّع","t":["TESOL and Related Disciplines","علاقة تعليم الإنجليزية بالعلوم الأخرى"],"pts":[["**Psycholinguistics**: how language is processed and acquired in the mind (memory, input processing). **Sociolinguistics**: language in society (register, varieties, attitudes). **Neurolinguistics**: language and the brain.","النفسي والاجتماعي والعصبي"],["**Educational psychology** informs motivation, learning theories and assessment; **anthropology** informs culture teaching; **corpus linguistics** informs word lists and coursebooks; **computer science** informs CALL and AI tools.","علوم تغذي التدريس"],["**CLIL**: hard (strong) CLIL = a subject taught in English; soft (weak) CLIL = an English course that uses subject topics.","التدريس عبر المحتوى"],["**Cross-curricular links**: reading science texts, solving maths word problems in English, writing about history or geography — content gives language a real purpose and supports academic language (CALP).","روابط بين المواد"]],"traps":[["Corpus linguistics feeds word-frequency lists and coursebooks.","المدونات ← قوائم الكلمات"]]},"en.l18-defs":{"k":"شرح موسّع","t":["Classic Definitions of Language","تعريفات اللغة الكلاسيكية"],"pts":[["**Sapir**: a purely human and non-instinctive method of communicating ideas, emotions and desires by means of voluntarily produced symbols.","سابير: بشرية غير غريزية، برموز إرادية"],["**Hall**: the institution whereby humans communicate and interact with each other by means of habitually used oral-auditory arbitrary symbols.","هول: مؤسسة تواصل برموز صوتية سمعية اعتباطية"],["**Chomsky**: a set (finite or infinite) of sentences, each finite in length and constructed out of a finite set of elements.","تشومسكي: مجموعة جمل من عناصر محدودة"]],"traps":[["'Non-instinctive' and 'voluntarily produced symbols' point to **Sapir**.","غير غريزية = سابير"]]},"en.l18-hockett2":{"k":"شرح موسّع","t":["More of Hockett's Design Features","المزيد من سمات هوكيت"],"pts":[["**Interchangeability**: any speaker can be both sender and receiver.","تبادل الأدوار"],["**Total feedback**: speakers hear and can monitor their own messages.","التغذية الراجعة الكاملة"],["**Specialisation**: speech signals serve communication, not another biological function. **Semanticity**: signals have fixed associations with meanings.","التخصص والدلالية"],["**Vocal-auditory channel**: produced by the vocal tract, received by the ear. **Rapid fading**: spoken signals disappear quickly.","القناة والزوال"],["Later additions: **prevarication** (lying, talking about the false or imaginary), **reflexiveness** (using language to talk about language), **learnability** (any human language can be learned).","إضافات لاحقة"]],"traps":[["Using language to talk about language = **reflexiveness**.","الانعكاسية"]]},"en.l18-brame":{"k":"شرح موسّع","t":["British and American English","البريطانية والأمريكية"],"pts":[["The main differences lie in **vocabulary** (lift/elevator, petrol/gasoline), **spelling** (colour/color) and **pronunciation**; grammar differs very little.","مفردات وإملاء ونطق"],["British English uses past forms in **-t** more often (learnt, burnt, spilt, dreamt); American English prefers **-ed** (learned, burned, spilled).","-t / -ed"],["Plurals such as **oxen** and **children** keep the Old English plural ending **-en**.","جمع -en قديم"]],"traps":[["'colour' is British; Americans write **-or**.","colour بريطانية"]]}};

}).concat((window.OFFICIAL||[]).map(([l,q,o,a,e])=>({id:"o"+hash(q).toString(36),l,d:LBY[l].d,h:true,m:false,of:true,q,o,a,e})));

function defFor(opt){const k=normT(opt); if(DEFIDX.has(k)) return DEFIDX.get(k); const k2=k.replace(/\s+(method|approach|hypothesis|theory|test|learning|assessment)$/,""); for(const [key,t] of DEFIDX){ if(key===k2 || key.replace(/\s+(method|approach|hypothesis|theory|test|learning|assessment)$/,"")===k2) return t } return null}
function defBox(q){const t=defFor(q.o[q.a]); return t&&t.def?`<div class="defbox"><b>${esc(t.en)}</b>: ${esc(t.def)}<div class="pa">${esc(t.ar)}</div></div>`:""}

const STD_N = (function(){const keys=Object.keys(STDW); const raw=keys.map(k=>88*STDW[k]/100); const fl=raw.map(Math.floor); const left=88-fl.reduce((a,b)=>a+b,0); raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(([_,i])=>fl[i]++); return Object.fromEntries(keys.map((k,i)=>[k,fl[i]]));})();

function taskDone(t){
  if(t.type==="lesson") return !!(S.lessons[t.id]&&S.lessons[t.id].done);
  if(t.type==="test") return !!S.tests[t.id];
  return !!S.tasks[t.id];
}
function buildPlan(){
  const tasks=planTasks();
  const span = S.exam ? Math.max(1, diffDays(S.start,S.exam)) : 29;
  const lessons=tasks.filter(t=>t.type==="lesson"), head=tasks.filter(t=>t.id==="diag"||t.id==="official"), tail=tasks.filter(t=>t.type!=="lesson"&&!head.includes(t));
  let days=[];
  if(span>=tasks.length){
    days = tasks.map(t=>[t]);
    const extra = span-tasks.length;
    for(let i=0;i<extra;i++) days.splice(days.length-6,0,[{id:"buf"+i,type:"review",t:"يوم مراجعة",s:"مراجعة الأخطاء + البطاقات المستحقة"}]);
  } else {
    let tailDays = span>=12 ? tail.map(t=>[t]) : [[tail[0]],[tail[2]],[tail[4],tail[5]]];
    if(span<6) tailDays=[[tail[0],tail[5]]];
    const lessonDays=Math.max(1, span-1-tailDays.length);
    const per=Math.ceil(lessons.length/lessonDays);
    const ld=[]; for(let i=0;i<lessons.length;i+=per) ld.push(lessons.slice(i,i+per));
    days=[head].concat(ld,tailDays);
  }
  return days.map((ts,i)=>({n:i+1,date:addDays(S.start,i),tasks:ts}));
}

let timerId=null;

function startSession(o){

function quizPool(filter){

}
function viewQuiz(){

   </div>

     <div class="grid88">${s.ids.map((id,i)=>`<button class="gq ${s.ans[id]!=null?"ans":""} ${i===s.i?"cur":""} ${s.flags[id]?"flag":""}" data-jump="${i}" aria-label="سؤال ${i+1}">${i+1}</button>`).join("")}</div>

function tickTimer(){
  const el=document.getElementById("timer"); if(!session||session.mode!=="exam"||session.done){stopTimer();return}
  const left=Math.max(0,session.end-Date.now()); const m=Math.floor(left/60000), sec=Math.floor(left%60000/1000);
  if(el){el.textContent=String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"); el.classList.toggle("low",left<5*60000)}
  if(left<=0){finishSession()}
}
function finishSession(){
  const s=session; if(!s||s.done) return;
  stopTimer(); s.done=true;
  let cor=0; const byD={};
  s.ids.forEach(id=>{const q=QBY[id], a=s.ans[id], ok=a===q.a; if(ok)cor++;
    byD[q.d]=byD[q.d]||{c:0,n:0}; byD[q.d].n++; if(ok)byD[q.d].c++;
    if(s.mode==="exam") recordAnswer(id, ok);});
  s.score=pct(cor,s.ids.length); s.cor=cor; s.byD=byD;
  if(s.kind==="test"){ S.tests[s.ref]={score:s.score,at:todayStr(),byD} }
  if(s.kind==="lesson"){ const st=S.lessons[s.ref]||(S.lessons[s.ref]={}); st.done=true; st.best=Math.max(st.best||0,s.score); st.at=todayStr() }
  save(); render(); window.scrollTo(0,0);
}

  fc={lesson:lessonId||null, ids:shuffle((due.length?due:deck).map(x=>x.id)).slice(0,30), i:0, flip:false, known:0};

   "موعد الاختبار: "+(S.exam||"غير محدد"),

   "الإجابات: "+att+" · الدقة: "+pct(cor,att)+"%",
   "الاختبارات: "+Object.entries(S.tests).map(([k,v])=>k+"="+v.score+"%").join(" ، "),
   "المجالات:"].concat(DORDER.map(d=>{const s=domainStats(d);return "  "+DOM[d].en+": إتقان "+pct(s.mast,s.total)+"% · دقة "+s.acc+"%"}));
  const weak=LESSONS.map(l=>({l,s:lessonStats(l.id)})).filter(x=>x.s.att>=5).sort((a,b)=>a.s.acc-b.s.acc).slice(0,5);

  return `<section class="stack" style="padding-top:18px"><h1>الإعدادات والتقرير</h1>
   <div class="sheet stack"><h3>موعد الاختبار</h3><p class="small muted">موعد الاختبار التخصصي: ${fmtDate(EXAM_DEFAULT)} (فترة الاختبار ${fmtDate(EXAM_START)} – ${fmtDate(EXAM_END)} حسب إعلان هيئة تقويم التعليم والتدريب).</p>
     <p class="small muted">بداية الخطة: ${fmtDate(S.start)}. <button class="btn sm quiet" data-act="restartPlan">ابدأ الخطة من اليوم</button></p></div>
   <div class="sheet stack"><h3>تقريرك</h3><p class="small muted">انسخه واحتفظ به لتتابع تقدمك من أسبوع لأسبوع.</p>
     <textarea class="report" id="report" readonly>${esc(reportText())}</textarea><div><button class="btn sm" data-act="copyReport">انسخ التقرير</button></div></div>
   <div class="sheet stack"><h3>تصفير التقدم</h3><p class="small muted">يمسح كل الإجابات والدروس والاختبارات من هذا الجهاز.</p>
     ${resetAsk?`<div class="confirm row"><span>متأكد؟ ما تقدر ترجعه.</span><button class="btn sm" data-act="resetYes" style="background:var(--bad);border-color:var(--bad)">نعم، صفّر</button><button class="btn sm quiet" data-act="resetNo">لا</button></div>`:`<div><button class="btn sm quiet" data-act="resetAsk">تصفير…</button></div>`}</div>
   <p class="small muted">المصادر: معايير معلمي اللغة الإنجليزية ومؤشراتها وأوزانها النسبية كما في الأدلة الرسمية المنشورة، ومراجع تعليم اللغة واللسانيات المعتمدة. أسئلة البنك تدريبية محاكية لأسلوب الاختبار ومكتوبة من جديد، ونماذج الأسئلة الرسمية منقولة كما نُشرت مع ذكر مصدرها: دليل المختبَر لتخصص اللغة الإنجليزية 2 (1441هـ)، مع تصحيح مفتاح سؤال واحد.</p>
  </section>`;
}
let resetAsk=false;

/* ---------- render ---------- */
function render(){
  renderNav();
  const v=document.getElementById("view");
  const r=route.name;
  v.innerHTML = r==="plan"?viewPlan(): r==="lessons"?viewLessons(): r==="lesson"?viewLesson(route.id): r==="practice"?viewPractice():
    r==="quiz"?viewQuiz(): r==="cards"?viewCards(): r==="sheet"?viewSheet(): r==="settings"?viewSettings(): viewHome();
  renderSync();
  if(r==="quiz"&&session&&session.mode==="exam"&&!session.done){ if(!timerId) timerId=setInterval(tickTimer,1000); tickTimer(); }
}
/* ---------- report a question (sent to GoatCounter as an event; hidden until configured) ---------- */
const GC_CODE = (window.SITE_CFG && window.SITE_CFG.gc) || "";
let reportOpen = null;
function reportUI(q){
  if(!GC_CODE) return "";
  if(reportOpen!==q.id) return `<button class="btn sm quiet" data-act="reportOpen" data-id="${q.id}" style="margin-top:6px">بلّغ عن خطأ في السؤال</button>`;
  return `<div class="row" style="margin-top:8px"><span class="small muted">وش المشكلة؟</span>${[["key","الإجابة غلط"],["unclear","السؤال غير واضح"],["typo","خطأ إملائي"]].map(([k,l])=>`<button class="chip" data-act="reportSend" data-id="${q.id}" data-v="${k}" style="background:none;cursor:pointer">${l}</button>`).join("")}</div>`;
}
const SITE_ID = "en2";
let toastT=null;
function toast(m){let el=document.getElementById("toast"); if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)} el.textContent=m; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true},2200)}

/* ---------- events ---------- */
function openTask(id){
  const t=planTasks().find(x=>x.id===id); if(!t) return;
  if(t.type==="lesson") return go({name:"lesson",id});
  if(t.type==="test") return startTest(id);
  if(t.type==="final") return go({name:"sheet"});
  if(t.type==="review"){ S.tasks[id]=true; save(); if(reviewDue().length) return startReview(); toast("ما عندك أخطاء مستحقة. راجع البطاقات"); return startCards(null) }
}
function startTest(k){if(window.PW&&PW.gate("test:"+k))return;const T=TESTS[k]; startSession({mode:T.practice?"practice":"exam",kind:"test",ref:k,title:T.title,ids:T.ids.slice(),min:T.min})}
function startReview(){const due=shuffle(reviewDue()).slice(0,30); if(!due.length){toast("ما فيه أخطاء مستحقة اليوم");return} startSession({mode:"practice",kind:"review",title:"مراجعة الأخطاء",ids:due.map(q=>q.id)})}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,a"); if(!b) return;
  const ds=b.dataset;
  if(ds.go){ if(ds.go==="cards") fc=null; return go({name:ds.go}) }
  if(ds.lesson) return go({name:"lesson",id:ds.lesson});
  if(ds.openTask) return openTask(ds.openTask);
  if(ds.pr){ if(ds.pr==="hot") pr.hot=!pr.hot; else pr[ds.pr]= ds.pr==="n"?+ds.v:ds.v; return render() }
  if(ds.jump!=null){ session.i=+ds.jump; session.confirm=false; return render() }
  if(ds.opt!=null && session && !session.done){
    const q=QBY[session.ids[session.i]], i=+ds.opt;
    if(session.mode==="practice"){ if(session.ans[q.id]!=null) return; session.ans[q.id]=i; recordAnswer(q.id,i===q.a); save(); }
    else { session.ans[q.id]=i; }
    return render();
  }
  const a=ds.act; if(!a) return;
  const s=session;
  switch(a){
    case "reportOpen": reportOpen=ds.id; render(); break;
    case "reportSend":{const q=QBY[ds.id]; let ok=false; try{ if(window.goatcounter&&window.goatcounter.count){ window.goatcounter.count({path:"report/"+SITE_ID+"/"+q.l+"/"+q.id+"/"+ds.v, title:String(q.q).slice(0,140), event:true}); ok=true } }catch(e){}
      toast(ok?"شكراً، وصل البلاغ":"تعذّر إرسال البلاغ الآن"); reportOpen=null; render(); break}
    case "theme":{const n=isDark()?"light":"dark"; document.documentElement.dataset.theme=n; try{localStorage.setItem(THEME_KEY,n)}catch(e){}; renderTheme(); break}
    case "setExam":{const v=document.getElementById("examDate").value; if(!v){toast("اختر التاريخ أولاً");return} S.exam=v; if(diffDays(S.start,v)<1) S.start=todayStr(); save(); toast("حُفظ الموعد"); render(); break}
    case "restartPlan": S.start=todayStr(); save(); toast("بدأت الخطة من اليوم"); render(); break;
    case "lessonQuiz":{if(window.PW&&PW.gate("lesson:"+ds.id))break;const ids=shuffle(QS.filter(q=>q.l===ds.id&&!q.m).map(q=>q.id)); startSession({mode:"practice",kind:"lesson",ref:ds.id,title:LBY[ds.id].ar,ids}); break}
    case "lessonCards": if(window.PW&&PW.gate("lesson:"+ds.id))break; startCards(ds.id); break;
    case "cardsAll": startCards(null); break;
    case "cardsAgain": startCards(fc&&fc.lesson); break;
    case "cardsHome": fc=null; render(); break;
    case "flip": fc.flip=!fc.flip; render(); break;
    case "cardYes": case "cardNo":{const id=fc.ids[fc.i]; const st=S.terms[id]||(S.terms[id]={b:0});
      if(a==="cardYes"){st.b=Math.min((st.b||0)+1,5); st.due=addDays(todayStr(),INT[st.b]); fc.known++} else {st.b=0; st.due=addDays(todayStr(),1)}
      fc.i++; fc.flip=false; save(); render(); break}
    case "quick":{let pool=quizPool(q=>(pr.dom==="all"||q.d===pr.dom)&&(!pr.hot||q.h));
      if(pr.dom==="all"&&!pr.hot){ /* weight by domain */ const out=[]; DORDER.forEach(d=>{const n=Math.round(pr.n*DOM[d].w/100); out.push(...shuffle(pool.filter(q=>q.d===d)).slice(0,n))}); pool=out }
      const ids=shuffle(pool).slice(0,pr.n).map(q=>q.id); if(!ids.length){toast("ما فيه أسئلة بهذا الفلتر");return}
      startSession({mode:"practice",kind:"quick",title:"تدريب سريع",ids}); break}
    case "review": startReview(); break;
    case "similar":{const ids=window.PW?PW.similar.filter(id=>QBY[id]):shuffle(QS.filter(q=>q.h&&!q.of).map(q=>q.id)).slice(0,20); if(!ids.length)break; startSession({mode:"practice",kind:"similar",title:"الأسئلة المشابهة",ids}); break}
    case "test": startTest(ds.id); break;
    case "next": s.i=Math.min(s.i+1,s.ids.length-1); s.confirm=false; render(); window.scrollTo(0,0); break;
    case "prev": s.i=Math.max(0,s.i-1); s.confirm=false; render(); break;
    case "flag":{const id=s.ids[s.i]; s.flags[id]=!s.flags[id]; render(); break}
    case "askSubmit": s.confirm=true; render(); break;
    case "cancelSubmit": s.confirm=false; render(); break;
    case "submit": case "finish": finishSession(); break;
    case "quitQuiz": if(s&&s.mode==="exam"&&!s.done){ if(!s.confirm){s.confirm=true;render();toast("سلّم الاختبار أو ارجع له");return} } stopTimer(); session=null; go({name:"practice"}); break;
    case "retryWrong":{const ids=s.ids.filter(id=>s.ans[id]!==QBY[id].a); startSession({mode:"practice",kind:"retry",title:"إعادة الأخطاء",ids:shuffle(ids)}); break}
    case "markFinal": S.tasks.final=true; save(); toast("ممتاز"); render(); break;
    case "copyReport":{const t=reportText(); const ta=document.getElementById("report");
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("نُسخ التقرير")).catch(()=>{ta.focus();ta.select();toast("حدّد النص وانسخه")}); break}
    case "resetAsk": resetAsk=true; render(); break;
    case "resetNo": resetAsk=false; render(); break;
    case "resetYes": resetAsk=false; S=freshState(); save(); toast("تم التصفير"); go({name:"home"}); break;
  }
});
document.addEventListener("keydown",e=>{
  if(route.name!=="quiz"||!session||session.done) return;
  const k=e.key.toUpperCase(); const map={A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3};
  if(k in map && !e.metaKey && !e.ctrlKey){const btn=document.querySelector(`[data-opt="${map[k]}"]`); if(btn&&!btn.disabled) btn.click()}
  if(e.key==="Enter"){const nb=document.querySelector('[data-act="next"],[data-act="finish"]'); if(nb) nb.click()}
});

/* ---------- boot ---------- */
function start(data){
  if(data&&data.session){session=data.session; if(data.route) route=data.route}
  else if(data&&data.route) route=data.route;
  if(data&&data.fc) fc=data.fc;
  render(); initRemote(); try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  // رابط مباشر للتشخيصي من صفحة الاختبار السريع والمنشورات: ‎…/#diag
  if(location.hash==="#diag"){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} startTest("diag")}
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({route,session,fc}));
if(hot&&hot.ready) hot.ready(start); else start(hot&&hot.data||{});
})();
