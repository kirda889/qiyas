<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: an exam answer-sheet — ruled paper, OMR bubbles for every choice, one teal ink for actions, highlighter for key terms. RTL app with LTR exam items. */
:root{
  --paper:#F5F6F1; --sheet:#FFFFFF; --ink:#16202B; --muted:#5B6672; --rule:#DCE1DF; --rule-strong:#C3CBC8;
  --accent:#0B6B66; --accent-ink:#FFFFFF; --accent-soft:#DDEEEC;
  --hl:#F6E27A; --hl-ink:#3A3100;
  --good:#1B7A4A; --good-soft:#DFF1E6; --bad:#B42318; --bad-soft:#FBE3E0; --warn:#9A5B00;
  --dP:#0B6B66; --dD:#A86A12; --dT:#7A4A93; --dL:#2C5BA6;
  --shadow:0 1px 0 rgba(22,32,43,.06), 0 6px 18px -10px rgba(22,32,43,.25);
  --f-ar:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-en:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-display:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1418; --sheet:#161D22; --ink:#E4E9EC; --muted:#9AA6AE; --rule:#26313A; --rule-strong:#34424C;
  --accent:#4FB8AF; --accent-ink:#06211F; --accent-soft:#16312F;
  --hl:#5C5220; --hl-ink:#FFF3B8;
  --good:#5CC48D; --good-soft:#15301F; --bad:#F2867A; --bad-soft:#3A1A17; --warn:#E3A84A;
  --dP:#4FB8AF; --dD:#E0A54C; --dT:#B98ED1; --dL:#7FA6E8;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F1418; --sheet:#161D22; --ink:#E4E9EC; --muted:#9AA6AE; --rule:#26313A; --rule-strong:#34424C;
  --accent:#4FB8AF; --accent-ink:#06211F; --accent-soft:#16312F;
  --hl:#5C5220; --hl-ink:#FFF3B8;
  --good:#5CC48D; --good-soft:#15301F; --bad:#F2867A; --bad-soft:#3A1A17; --warn:#E3A84A;
  --dP:#4FB8AF; --dD:#E0A54C; --dT:#B98ED1; --dL:#7FA6E8;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
#app{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.en{font-family:var(--f-en);unicode-bidi:isolate;direction:ltr}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
strong{font-weight:600}
mark.term{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 .1em}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);margin-inline:-16px;padding:10px 16px}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .seal{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;color:var(--accent);font-size:.8rem;flex:none}
.brand b{font-family:var(--f-display);font-weight:600;font-size:1.02rem;white-space:nowrap}
.brand span{display:block;font-size:.74rem;color:var(--muted);line-height:1.2;white-space:nowrap}
.count{margin-inline-start:auto;text-align:center;line-height:1.1}
.count .n{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;color:var(--accent)}
.count .l{font-size:.7rem;color:var(--muted)}
.nav{display:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:4px 0;border-radius:8px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
@media (min-width:760px){
  .tabbar{display:none}
  .nav{display:flex;gap:4px;margin-inline-start:18px}
  .nav button{background:none;border:0;padding:6px 12px;border-radius:999px;color:var(--muted);font-size:.92rem}
  .nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #app{padding-bottom:60px}
}

/* sheets & cards */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.ruled{background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px)}
.section-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.section-title h2{font-size:1.1rem}
.section-title .line{flex:1;height:1px;background:var(--rule-strong)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 20px;font-weight:600;font-size:.95rem;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--rule-strong);color:var(--ink);font-weight:500}
.btn.sm{padding:6px 14px;min-height:36px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.76rem;border:1px solid var(--rule-strong);color:var(--muted);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.done{border-color:var(--good);color:var(--good)}
.chip.hot{border-color:var(--warn);color:var(--warn)}
.code{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);direction:ltr;unicode-bidi:isolate}

/* home */
.today{display:grid;gap:14px}
.today .kicker{font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.today h1{font-size:1.45rem}
.domains{display:grid;gap:10px}
.dom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.dom .name{display:flex;gap:8px;align-items:center;min-width:0}
.dom .name b{font-weight:600;font-size:.95rem}
.dom .w{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:10px;border-radius:999px;background:var(--rule);overflow:hidden;position:relative}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--f-mono);font-size:1.45rem;font-weight:600;line-height:1.2}
.stat .k{font-size:.8rem;color:var(--muted)}
.set-date{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.set-date input{border:1px solid var(--rule-strong);background:var(--paper);border-radius:8px;padding:8px 10px;min-height:44px}

/* plan */
.plan{display:grid;gap:8px}
.day{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.day .num{font-family:var(--f-mono);text-align:center;line-height:1.1}
.day .num b{display:block;font-size:1.15rem}
.day .num span{font-size:.68rem;color:var(--muted)}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day .what{min-width:0}
.day .what .t{font-weight:600}
.day .what .s{font-size:.82rem;color:var(--muted)}
.bub{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;flex:none}
.bub.on{background:var(--good);border-color:var(--good)}
.bub.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sheet)}

/* lessons list */
.lgroup{display:grid;gap:8px}
.lcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;text-align:start;width:100%}
.lcard .idx{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);width:34px;text-align:center}
.lcard .t{font-weight:600;line-height:1.4}
.lcard .s{font-size:.82rem;color:var(--muted)}
.dhead{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.dhead .sw{width:12px;height:12px;border-radius:3px}
.dhead h2{font-size:1.05rem}
@media (max-width:560px){.dhead .code{display:none}}
.dhead .w{margin-inline-start:auto;font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}

/* lesson view */
.lesson-head{display:grid;gap:8px;padding-top:18px}
.lesson-head .en{font-size:.95rem;color:var(--muted)}
.goal{border-inline-start:3px solid var(--accent);padding-inline-start:12px;color:var(--ink)}
.lsec{display:grid;gap:10px;padding:18px 0;border-bottom:1px dashed var(--rule-strong)}
.lsec:last-of-type{border-bottom:0}
.lsec p{max-width:68ch}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.term{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;min-width:0;direction:ltr;text-align:left}
.term .tdef{font-family:var(--f-en);font-size:.9rem;line-height:1.5;margin-top:2px}
.pa{font-family:var(--f-ar);font-size:.8rem;color:var(--muted);line-height:1.6;direction:rtl;text-align:left;unicode-bidi:plaintext}
.term .pa{margin-top:3px}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:10px;direction:ltr;text-align:left}
.pts li{border-left:3px solid var(--rule-strong);padding-left:10px}
.pts .pe{font-family:var(--f-en);font-size:1rem;line-height:1.6}
.off{display:inline-block;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.04em;border:1px solid var(--good);color:var(--good);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle}
.lesson-head h1.eh1{font-family:var(--f-en);font-size:1.5rem;text-align:left;unicode-bidi:isolate}
.lsec h2.eh{font-family:var(--f-en);direction:ltr;text-align:left}
.lsec .ha{font-size:.82rem;color:var(--muted);direction:rtl;text-align:left;margin-top:-6px}
.traps ul.bi{direction:ltr;text-align:left;padding-left:18px;padding-right:0}
.traps ul.bi li .pe{font-family:var(--f-en)}
.defbox{margin-top:10px;border-top:1px dashed var(--rule-strong);padding-top:8px;direction:ltr;text-align:left;font-family:var(--f-en);font-size:.92rem}
.defbox b{font-weight:600;display:inline;margin:0}
.term .tn{font-family:var(--f-en);font-weight:600;direction:ltr;text-align:left;unicode-bidi:isolate;font-size:.92rem;overflow-wrap:anywhere}
.term .td{font-size:.86rem;color:var(--muted);line-height:1.6}
.traps{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:var(--r);padding:14px 16px}
.traps h3{color:var(--bad);margin-bottom:6px}
.traps ul{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.vids{display:grid;gap:8px}
.vid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-decoration:none;color:inherit}
.vid .play{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.vid .vt{font-weight:500;line-height:1.45}
.vid .vc{font-size:.8rem;color:var(--muted)}
.lang{font-family:var(--f-mono);font-size:.7rem;border:1px solid var(--rule-strong);border-radius:4px;padding:0 5px;color:var(--muted)}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;padding:12px 0}
.progress{flex:1;height:6px;background:var(--rule);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;min-width:64px;text-align:center}
.timer.low{color:var(--bad)}
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qtext{font-family:var(--f-en);direction:ltr;text-align:left;font-size:1.06rem;line-height:1.6;font-weight:500}
.opts{display:grid;gap:8px;margin-top:14px;direction:ltr}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-family:var(--f-en);font-size:.98rem;line-height:1.45;min-height:48px;width:100%}
.opt .b{width:28px;height:28px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .b{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .b{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt:disabled{cursor:default}
.explain{margin-top:14px;border-radius:10px;padding:12px 14px;border:1px solid var(--rule)}
.explain.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.explain.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.explain b{display:block;margin-bottom:2px}
.qnav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.grid88{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;direction:ltr}
.gq{height:34px;border-radius:50%;border:1.5px solid var(--rule-strong);background:var(--sheet);font-family:var(--f-mono);font-size:.72rem;color:var(--muted);padding:0}
.gq.ans{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.gq.cur{outline:2px solid var(--accent);outline-offset:2px}
.gq.flag{border-color:var(--warn);border-width:3px}
.confirm{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px}

/* results */
.score{display:flex;align-items:baseline;gap:10px}
.score .big{font-family:var(--f-mono);font-size:3rem;font-weight:600;line-height:1}
.rlist{display:grid;gap:10px}
.ritem{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.ritem .qtext{font-size:.95rem}
.ans-line{font-family:var(--f-en);direction:ltr;text-align:left;font-size:.9rem}
.ans-line .y{color:var(--bad);text-decoration:line-through}
.ans-line .c{color:var(--good);font-weight:600}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.mode{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px;text-align:start;display:grid;gap:6px;align-content:start;width:100%}
.mode .mt{font-family:var(--f-display);font-weight:600;font-size:1.02rem}
.mode .md{font-size:.85rem;color:var(--muted);line-height:1.6}
.mode .mx{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:.85rem;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* flashcards */
.fc{perspective:1200px}
.fc-in{position:relative;min-height:220px;border-radius:14px;border:1px solid var(--rule);background:var(--sheet);box-shadow:var(--shadow);display:grid;place-items:center;padding:24px;text-align:center;cursor:pointer;width:100%}
.fc-front{font-family:var(--f-en);font-size:1.5rem;font-weight:600;direction:ltr;line-height:1.35}
.fc-back{font-size:1.12rem;line-height:1.8}
.fc-hint{position:absolute;bottom:10px;inset-inline:0;font-size:.75rem;color:var(--muted)}

/* sheet (night-before) */
.hy{display:grid;gap:14px}
.hy-l{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 16px}
.hy-l h3{font-size:.98rem;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.hy-l ul{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:.93rem}
.tips{display:grid;gap:8px;counter-reset:t}
.tip{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.tip::before{counter-increment:t;content:counter(t, arabic-indic);font-family:var(--f-mono);font-weight:600;width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:.8rem}

.sync{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--rule-strong)}
.sync.on i{background:var(--good)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:50;box-shadow:var(--shadow)}
textarea.report{width:100%;min-height:180px;border:1px solid var(--rule-strong);border-radius:8px;padding:10px;background:var(--paper);font-family:var(--f-mono);font-size:.8rem;direction:rtl}
@media (prefers-reduced-motion:no-preference){
  .opt,.btn,.day,.lcard,.mode{transition:border-color .15s,background-color .15s,transform .15s}
  .lcard:active,.day:active,.mode:active{transform:scale(.99)}
}

/* credit card */
.credit{display:flex;align-items:center;gap:14px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 16px}
.credit .cm{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.credit .cm svg{width:22px;height:22px}
.credit .ck{font-size:.78rem;color:var(--muted);letter-spacing:.01em}
.credit .cn{font-family:var(--f-display);font-weight:600;font-size:1.06rem;line-height:1.5}

/* cover, start-here, exam map */
.cover{display:grid;gap:12px}
.cover .ck{font-size:.8rem;color:var(--accent);font-weight:600;letter-spacing:.01em}
.cover h1{font-size:1.5rem}
.cover p{max-width:62ch;color:var(--muted)}
.figs{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 0;border-block:1px solid var(--rule)}
.fig{display:flex;align-items:baseline;gap:6px}
.fig b{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;color:var(--ink)}
.fig span{font-size:.82rem;color:var(--muted)}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.topics span{font-size:.8rem;border:1px solid var(--rule-strong);border-radius:999px;padding:2px 10px;color:var(--ink);background:var(--paper)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.steps{grid-template-columns:1fr}}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.step .sn{width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem}
.step.done .sn{background:var(--good);border-color:var(--good);color:var(--sheet)}
.step .st{font-weight:600;line-height:1.4}
.step .ss{font-size:.78rem;color:var(--muted)}
.map{display:grid;gap:4px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:2px 12px;align-items:center;background:none;border:0;padding:7px 4px;border-radius:8px;text-align:start;width:100%}
.mrow:hover{background:var(--paper)}
.mrow .mn{font-size:.9rem;line-height:1.45;min-width:0}
.mrow .mn .code{margin:0 6px;display:inline-block}
.mrow .mq{font-size:.8rem;color:var(--muted);text-align:end;font-variant-numeric:tabular-nums}
.mrow .mb{grid-column:1/-1;height:8px;border-radius:999px;background:var(--rule);overflow:hidden}
.mrow .mb i{display:block;height:100%;border-radius:999px}

/* theme toggle, simpler home */
.themebtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);display:grid;place-items:center;flex:none;padding:0}
.themebtn svg{width:18px;height:18px}
.or{font-size:.88rem;color:var(--muted)}
.path{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.path b{color:var(--accent);font-weight:600}
details.prog{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:0 16px}
details.prog>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;font-family:var(--f-display);font-weight:600;font-size:1.02rem}
details.prog>summary::-webkit-details-marker{display:none}
details.prog>summary .hint{font-family:var(--f-ar);font-weight:400;font-size:.8rem;color:var(--muted);margin-inline-start:auto}
details.prog>summary svg{width:18px;height:18px;flex:none;transition:transform .2s}
details.prog[open]>summary svg{transform:rotate(180deg)}
details.prog .pin{display:grid;gap:14px;padding-bottom:16px}

@media (max-width:430px){.brand span{display:none}}
.count .btn{white-space:nowrap}

<script>
(function(){
"use strict";

const THEME_KEY = "site.theme";
try{const t=localStorage.getItem(THEME_KEY); if(t==="dark"||t==="light") document.documentElement.dataset.theme=t;}catch(e){}
function isDark(){const t=document.documentElement.dataset.theme; return t? t==="dark" : !!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)}
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
function renderTheme(){const b=document.getElementById("themeBtn"); if(!b) return; const d=isDark(); b.innerHTML=d?SUN:MOON; b.setAttribute("aria-label",d?"الوضع النهاري":"الوضع الليلي"); b.title=d?"الوضع النهاري":"الوضع الليلي"}
document.documentElement.lang = "ar";

/* ---------- constants ---------- */
const DOM = {
  P:{ar:"أصول تدريس اللغة", en:"Language Pedagogy", w:45, n:40, std:"6.9.1–6.9.4"},
  D:{ar:"التصميم التعليمي", en:"Instructional Design", w:19, n:17, std:"6.9.5–6.9.7"},
  T:{ar:"المعرفة النظرية وتطبيقها", en:"Theoretical Knowledge & Application", w:15, n:13, std:"6.9.8–6.9.9"},
  L:{ar:"المعرفة اللغوية", en:"Linguistic Knowledge", w:21, n:18, std:"6.9.10–6.9.11"}
};
const DORDER = ["P","D","T","L"];
const LESSONS = window.LESSONS;
const LBY = Object.fromEntries(LESSONS.map((l,i)=>[l.id, Object.assign(l,{n:i+1})]));
const STDW = window.STD_WEIGHTS || {};
if(window.EXTRA) Object.entries(window.EXTRA).forEach(([id,x])=>{const l=LBY[id]; if(!l) return; (x.sec||[]).forEach(sec=>l.sec.push(Object.assign({x:true},sec))); l.trap=l.trap.concat(x.trap||[]);});
const INT = [0,1,3,7,14,30];
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

/* ---------- utils ---------- */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0)}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,seed){const r=seed==null?Math.random:rng(seed);const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function esc(s){return String(s).replace(/[<>"]/g,c=>({"<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const LAT = /((?:[(\[\-\/‎]+)?[A-Za-zɐ-˿](?:[A-Za-z0-9À-ɏɐ-˿ː\s\-\/'’.,()+:;!?\[\]=&‎]*[A-Za-z0-9ɐ-˿ː)\]\/'’!?+])?)/g;
function fmt(s){
  let t = esc(s);
  t = t.replace(LAT, m => /[A-Za-zɐ-˿]/.test(m) ? '<bdi class="en">'+m+'</bdi>' : m);
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return t;
}
function todayStr(d){d=d||new Date();const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return todayStr(d)}
function diffDays(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000)}
function fmtDate(s){try{return new Date(s+"T12:00:00").toLocaleDateString("ar-SA-u-ca-gregory-nu-arab",{day:"numeric",month:"short"})}catch(e){return s}}
function pct(a,b){return b?Math.round(a*100/b):0}

/* ---------- question bank ---------- */
const QS = window.QB.map(([l,f,q,o,e])=>{
  const id = hash(q).toString(36);
  const order = shuffle([0,1,2,3], hash(id));
  return {id,l,d:LBY[l].d,h:f.includes("h"),m:f.includes("m"),q,o:order.map(i=>o[i]),a:order.indexOf(0),e};
}).concat((window.OFFICIAL||[]).map(([l,q,o,a,e])=>({id:"o"+hash(q).toString(36),l,d:LBY[l].d,h:true,m:false,of:true,q,o,a,e})));
const QBY = Object.fromEntries(QS.map(q=>[q.id,q]));
const TERMS = [];
LESSONS.forEach(l=>l.sec.forEach(s=>(s.t||[]).forEach(t=>TERMS.push({id:l.id+":"+t[0],l:l.id,en:t[0],def:t.length>2?t[1]:"",ar:t.length>2?t[2]:t[1]}))));
const normT=x=>String(x).toLowerCase().replace(/^(the|a|an)\s+/,"").replace(/[’']/g,"'").replace(/\s+/g," ").trim();
const DEFIDX=new Map();
TERMS.forEach(t=>{const keys=new Set([t.en]); const m=t.en.match(/^(.*?)\s*\((.*?)\)\s*$/); if(m){keys.add(m[1]);m[2].split(/[,/]/).forEach(k=>keys.add(k))} t.en.split(/\s*\/\s*/).forEach(k=>keys.add(k)); keys.forEach(k=>{k=normT(k); if(k.length>=3&&!DEFIDX.has(k)) DEFIDX.set(k,t)})});
function defFor(opt){const k=normT(opt); if(DEFIDX.has(k)) return DEFIDX.get(k); const k2=k.replace(/\s+(method|approach|hypothesis|theory|test|learning|assessment)$/,""); for(const [key,t] of DEFIDX){ if(key===k2 || key.replace(/\s+(method|approach|hypothesis|theory|test|learning|assessment)$/,"")===k2) return t } return null}
function defBox(q){const t=defFor(q.o[q.a]); return t&&t.def?`<div class="defbox"><b>${esc(t.en)}</b>: ${esc(t.def)}<div class="pa">${esc(t.ar)}</div></div>`:""}
const fmtEn=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");

/* fixed tests */
const STD_N = (function(){const keys=Object.keys(STDW); const raw=keys.map(k=>88*STDW[k]/100); const fl=raw.map(Math.floor); const left=88-fl.reduce((a,b)=>a+b,0); raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(([_,i])=>fl[i]++); return Object.fromEntries(keys.map((k,i)=>[k,fl[i]]));})();
function buildMocks(){
  const mocks=[[],[],[]];
  Object.keys(STD_N).forEach((sd,si)=>{
    const inStd=q=>LBY[q.l].std===sd && !q.of;
    const pool = shuffle(QS.filter(q=>inStd(q)&&q.m),101+si).concat(shuffle(QS.filter(q=>inStd(q)&&!q.m),201+si));
    pool.slice(0,STD_N[sd]*3).forEach((q,i)=>mocks[i%3].push(q.id));
  });
  return mocks.map((m,i)=>shuffle(m,301+i));
}
const MOCKS = buildMocks();
const DIAG = (function(){
  const n={P:18,D:8,T:6,L:8}; let ids=[];
  DORDER.forEach((d,di)=>{
    const pool = shuffle(QS.filter(q=>q.d===d&&!q.m&&q.h),401+di).concat(shuffle(QS.filter(q=>q.d===d&&!q.m&&!q.h),501+di));
    ids = ids.concat(pool.slice(0,n[d]).map(q=>q.id));
  });
  return shuffle(ids,601);
})();
const TESTS = {
  diag:{title:"الاختبار التشخيصي", ids:DIAG, min:40},
  official:{title:"أسئلة الدليل الرسمي", ids:QS.filter(q=>q.of).map(q=>q.id), min:0, practice:true},
  mock1:{title:"الاختبار المحاكي ١", ids:MOCKS[0], min:90},
  mock2:{title:"الاختبار المحاكي ٢", ids:MOCKS[1], min:90},
  mock3:{title:"الاختبار المحاكي ٣", ids:MOCKS[2], min:90}
};

/* ---------- state & persistence ---------- */
const LS_KEY = "rakhsa-en2.v1";
function freshState(){return {v:1,start:todayStr(),exam:null,lessons:{},q:{},terms:{},tests:{},tasks:{},updatedAt:0}}
let S = freshState();
try{const raw=localStorage.getItem(LS_KEY); if(raw){const p=JSON.parse(raw); if(p&&p.v===1) S=Object.assign(freshState(),p);}}catch(e){}
let dbRef=null, remoteBusy=false, remotePending=false, syncOn=false, saveTimer=null;
function save(){
  S.updatedAt = Date.now();
  try{localStorage.setItem(LS_KEY, JSON.stringify(S))}catch(e){}
  clearTimeout(saveTimer); saveTimer=setTimeout(pushRemote, 1200);
}
async function pushRemote(){
  if(!dbRef) return;
  if(remoteBusy){remotePending=true;return}
  remoteBusy=true;
  try{await dbRef.set(JSON.parse(JSON.stringify(S))); syncOn=true}catch(e){if(e&&e.code==="invalid_argument"){dbRef=null;syncOn=false}}
  remoteBusy=false; renderSync();
  if(remotePending){remotePending=false;pushRemote()}
}
async function pullRemote(){
  if(!dbRef) return;
  try{
    const snap = await dbRef.get();
    if(snap.exists){const r=snap.data(); if(r&&r.v===1&&(r.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(freshState(),JSON.parse(JSON.stringify(r)));try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){};render()}
      else if((S.updatedAt||0)>(r&&r.updatedAt||0)) pushRemote();}
    else if(S.updatedAt) pushRemote();
    syncOn=true; renderSync();
  }catch(e){}
}
async function initRemote(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    dbRef = db.doc("data/users/"+uid+"/progress");
    await pullRemote();
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pullRemote()});
  }catch(e){}
}

/* question stats */
function recordAnswer(id, correct){
  const st = S.q[id] || (S.q[id]={a:0,c:0});
  st.a++; if(correct) st.c++; st.last = correct?1:0;
  if(!correct){st.b=0; st.due=todayStr()}
  else if(st.b!=null){st.b=Math.min(st.b+1,5); st.due=addDays(todayStr(),INT[st.b])}
}
function reviewDue(){const t=todayStr();return QS.filter(q=>{const s=S.q[q.id];return s&&s.b!=null&&s.b<5&&s.due<=t})}
function reviewAll(){return QS.filter(q=>{const s=S.q[q.id];return s&&s.b!=null&&s.b<5})}
function mocksDone(){return ["mock1","mock2","mock3"].every(k=>S.tests[k])}
function domainStats(d){
  const qs=QS.filter(q=>q.d===d); let att=0,cor=0,mast=0;
  qs.forEach(q=>{const s=S.q[q.id];if(s){att+=s.a;cor+=s.c;if(s.last===1)mast++}});
  return {total:qs.length,mast,acc:pct(cor,att),att};
}
function lessonStats(id){
  const qs=QS.filter(q=>q.l===id); let att=0,cor=0;
  qs.forEach(q=>{const s=S.q[q.id];if(s){att+=s.a;cor+=s.c}}); return {att,cor,acc:pct(cor,att)};
}

/* ---------- plan ---------- */
function planTasks(){
  return [{id:"diag",type:"test",t:"الاختبار التشخيصي",s:"٤٠ سؤالاً من كل المجالات لقياس مستواك قبل البداية"},
          {id:"official",type:"test",t:"أسئلة الدليل الرسمي",s:"٣٢ سؤالاً من دليل الهيئة لإنجليزي ٢ بإجاباتها وشرحها"}]
    .concat(LESSONS.map(l=>({id:l.id,type:"lesson",t:l.ar,s:DOM[l.d].ar+" · "+l.std,d:l.d})))
    .concat([

      {id:"rev1",type:"review",t:"مراجعة أخطاء المحاكي ١",s:"مراجعة الأخطاء + إعادة قراءة فخاخ أضعف درسين"},
      {id:"mock2",type:"test",t:"الاختبار المحاكي ٢",s:"٨٨ سؤالاً جديداً"},
      {id:"rev2",type:"review",t:"مراجعة أخطاء المحاكي ٢",s:"الأخطاء + البطاقات المستحقة"},
      {id:"mock3",type:"test",t:"الاختبار المحاكي ٣",s:"آخر محاكاة قبل الاختبار"},
      {id:"final",type:"final",t:"ورقة الليلة الأخيرة",s:"كل الفخاخ في صفحة واحدة + نصائح يوم الاختبار"}

function taskDone(t){
  if(t.type==="lesson") return !!(S.lessons[t.id]&&S.lessons[t.id].done);
  if(t.type==="test") return !!S.tests[t.id];
  return !!S.tasks[t.id];
}
function buildPlan(){
  const tasks=planTasks();
  const span = S.exam ? Math.max(1, diffDays(S.start,S.exam)) : 29;
  const lessons=tasks.filter(t=>t.type==="lesson"), head=tasks.filter(t=>t.id==="diag"||t.id==="official"), tail=tasks.filter(t=>t.type!=="lesson"&&!head.includes(t));
  let days=[];
  if(span>=tasks.length){
    days = tasks.map(t=>[t]);
    const extra = span-tasks.length;
    for(let i=0;i<extra;i++) days.splice(days.length-6,0,[{id:"buf"+i,type:"review",t:"يوم مراجعة",s:"مراجعة الأخطاء + البطاقات المستحقة"}]);
  } else {
    let tailDays = span>=12 ? tail.map(t=>[t]) : [[tail[0]],[tail[2]],[tail[4],tail[5]]];
    if(span<6) tailDays=[[tail[0],tail[5]]];
    const lessonDays=Math.max(1, span-1-tailDays.length);
    const per=Math.ceil(lessons.length/lessonDays);
    const ld=[]; for(let i=0;i<lessons.length;i+=per) ld.push(lessons.slice(i,i+per));
    days=[head].concat(ld,tailDays);
  }
  return days.map((ts,i)=>({n:i+1,date:addDays(S.start,i),tasks:ts}));
}
function nextTask(){const t=planTasks().find(t=>!taskDone(t));return t||null}

/* ---------- quiz engine ---------- */
let timerId=null;
function stopTimer(){clearInterval(timerId);timerId=null}
function startSession(o){
  session = Object.assign({i:0, ans:{}, flags:{}, done:false, confirm:false}, o);
  if(session.mode==="exam"){session.end = Date.now()+session.min*60000}
  go({name:"quiz"});
}
function quizPool(filter){
  let pool=QS.filter(filter); if(!mocksDone()) pool=pool.filter(q=>!q.m); return pool;
}
function viewQuiz(){
  const s=session; if(!s) return viewPractice();
  if(s.done) return viewResults();
  const q=QBY[s.ids[s.i]], n=s.ids.length, chosen=s.ans[q.id];
  const shown = s.mode==="practice" && chosen!=null;
  const L=["A","B","C","D"];
  const opts=q.o.map((o,i)=>{let c="opt";
    if(shown){ if(i===q.a)c+=" right"; else if(i===chosen)c+=" wrong" } else if(i===chosen)c+=" sel";
    return `<button class="${c}" data-opt="${i}" ${shown?"disabled":""}><span class="b">${L[i]}</span><span>${esc(o)}</span></button>`}).join("");
  const answered=Object.keys(s.ans).length;
  return `<section style="padding-top:6px">
   <div class="qbar"><button class="btn sm quiet" data-act="quitQuiz">إنهاء</button>
     <div class="progress" aria-hidden="true"><i style="width:${pct(s.i+1,n)}%"></i></div>

   <div class="qcard">
     <div class="qmeta"><span class="chip"><span class="dot" style="background:var(--d${q.d})"></span>${DOM[q.d].ar}</span><span class="code">${LBY[q.l].std}</span>${q.of?`<span class="chip done">الدليل الرسمي</span>`:q.h?`<span class="chip hot">متكرر</span>`:""}${s.title?`<span class="small muted">${esc(s.title)}</span>`:""}</div>
     <div class="qtext">${esc(q.q)}</div>
     <div class="opts">${opts}</div>
     ${shown?`<div class="explain ${chosen===q.a?"ok":"no"}"><b>${chosen===q.a?"صحيح":"الإجابة الصحيحة: "+L[q.a]}</b>${fmt(q.e)}${defBox(q)} <button class="btn sm quiet" data-lesson="${q.l}" style="margin-top:6px">افتح الدرس</button>${reportUI(q)}</div>`:""}
   </div>
   <div class="qnav">
     ${s.mode==="exam"?`<button class="btn sm quiet" data-act="prev" ${s.i===0?"disabled":""}>السابق</button><button class="btn sm quiet" data-act="flag">${s.flags[q.id]?"إلغاء العلامة":"علّم للمراجعة"}</button>`:"<span></span>"}
     ${s.mode==="exam"?(s.i<n-1?`<button class="btn sm" data-act="next">التالي</button>`:`<button class="btn sm" data-act="askSubmit">تسليم</button>`)
       :(shown?(s.i<n-1?`<button class="btn" data-act="next">التالي</button>`:`<button class="btn" data-act="finish">النتيجة</button>`):`<span class="small muted">اختر إجابة</span>`)}
   </div>
   ${s.mode==="exam"?`
   ${s.confirm?`<div class="confirm stack" style="margin-top:14px"><p>${n-answered?`باقي <strong>${AR(n-answered)}</strong> سؤالاً بدون إجابة.`:"أجبت على كل الأسئلة."} تسلّم الحين؟</p><div class="row"><button class="btn sm" data-act="submit">نعم، سلّم</button><button class="btn sm quiet" data-act="cancelSubmit">رجوع</button></div></div>`:""}
   <div class="sheet" style="margin-top:14px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3>ورقة الإجابة</h3><span class="small muted">${AR(answered)} من ${AR(n)}</span></div>
     <div class="grid88">${s.ids.map((id,i)=>`<button class="gq ${s.ans[id]!=null?"ans":""} ${i===s.i?"cur":""} ${s.flags[id]?"flag":""}" data-jump="${i}" aria-label="سؤال ${i+1}">${i+1}</button>`).join("")}</div>
     <div style="margin-top:12px"><button class="btn sm ghost" data-act="askSubmit">تسليم الاختبار</button></div></div>`:""}
  </section>`;
}
function tickTimer(){
  const el=document.getElementById("timer"); if(!session||session.mode!=="exam"||session.done){stopTimer();return}
  const left=Math.max(0,session.end-Date.now()); const m=Math.floor(left/60000), sec=Math.floor(left%60000/1000);
  if(el){el.textContent=String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"); el.classList.toggle("low",left<5*60000)}
  if(left<=0){finishSession()}
}
function finishSession(){
  const s=session; if(!s||s.done) return;
  stopTimer(); s.done=true;
  let cor=0; const byD={};
  s.ids.forEach(id=>{const q=QBY[id], a=s.ans[id], ok=a===q.a; if(ok)cor++;
    byD[q.d]=byD[q.d]||{c:0,n:0}; byD[q.d].n++; if(ok)byD[q.d].c++;
    if(s.mode==="exam") recordAnswer(id, ok);});
  s.score=pct(cor,s.ids.length); s.cor=cor; s.byD=byD;
  if(s.kind==="test"){ S.tests[s.ref]={score:s.score,at:todayStr(),byD} }
  if(s.kind==="lesson"){ const st=S.lessons[s.ref]||(S.lessons[s.ref]={}); st.done=true; st.best=Math.max(st.best||0,s.score); st.at=todayStr() }
  save(); render(); window.scrollTo(0,0);
}
function viewResults(){
  const s=session, L=["A","B","C","D"];

  return `<section class="stack" style="padding-top:18px">

     ${s.mode==="exam"?`<div class="domains">${DORDER.filter(d=>s.byD[d]).map(d=>{const p=pct(s.byD[d].c,s.byD[d].n);return `<div class="dom"><div class="name"><span class="chip"><span class="dot" style="background:var(--d${d})"></span>${AR(DOM[d].w)}٪</span><b>${DOM[d].ar}</b></div><div class="w">${AR(s.byD[d].c)}/${AR(s.byD[d].n)}</div><div class="bar"><i style="width:${p}%;background:var(--d${d})"></i></div></div>`}).join("")}</div>`:""}
     <div class="row"><button class="btn" data-go="home">الرئيسية</button>${wrong.length?`<button class="btn quiet" data-act="retryWrong">أعد الأسئلة الخاطئة الآن</button>`:""}${s.kind==="lesson"&&LBY[s.ref].n<LESSONS.length?`<button class="btn quiet" data-lesson="${LESSONS[LBY[s.ref].n].id}">الدرس التالي</button>`:""}</div>

   <div class="rlist">${wrong.map(id=>{const q=QBY[id],a=s.ans[id];return `<div class="ritem"><div class="qmeta"><span class="code">${LBY[q.l].std}</span><button class="chip" data-lesson="${q.l}" style="background:none">${esc(LBY[q.l].ar)}</button></div>

/* ---------- flashcards ---------- */
let fc=null;
function startCards(lessonId){
  const t=todayStr();
  let deck = TERMS.filter(x=>lessonId?x.l===lessonId:true);
  if(!lessonId){ const read=new Set(LESSONS.filter(l=>S.lessons[l.id]&&S.lessons[l.id].done).map(l=>l.id)); if(read.size) deck=deck.filter(x=>read.has(x.l)); }
  const due=deck.filter(x=>{const s=S.terms[x.id];return !s||s.due<=t});
  fc={lesson:lessonId||null, ids:shuffle((due.length?due:deck).map(x=>x.id)).slice(0,30), i:0, flip:false, known:0};
  go({name:"cards"});
}

  if(!fc) {
    const t=todayStr(); const dueAll=TERMS.filter(x=>{const s=S.terms[x.id];return s&&s.due<=t}).length; const seen=Object.keys(S.terms).length;
    return `<section class="stack" style="padding-top:18px"><h1>بطاقات المصطلحات</h1>
      <p class="muted">${AR(TERMS.length)} مصطلحاً من الدروس الـ٢٢. وجه البطاقة بالإنجليزي كما في الاختبار، وخلفها الشرح بالعربي.</p>

   "الاختبارات: "+Object.entries(S.tests).map(([k,v])=>k+"="+v.score+"%").join(" ، "),
   "المجالات:"].concat(DORDER.map(d=>{const s=domainStats(d);return "  "+DOM[d].en+": إتقان "+pct(s.mast,s.total)+"% · دقة "+s.acc+"%"}));

   <div class="sheet stack"><h3>تصفير التقدم</h3><p class="small muted">يمسح كل الإجابات والدروس والاختبارات من هذا الجهاز.</p>
     ${resetAsk?`<div class="confirm row"><span>متأكد؟ ما تقدر ترجعه.</span><button class="btn sm" data-act="resetYes" style="background:var(--bad);border-color:var(--bad)">نعم، صفّر</button><button class="btn sm quiet" data-act="resetNo">لا</button></div>`:`<div><button class="btn sm quiet" data-act="resetAsk">تصفير…</button></div>`}</div>
   <p class="small muted">المصادر: وثيقة معايير معلمي اللغة الإنجليزية ٢ ودليل المختبَر الرسمي لإنجليزي ٢ من هيئة تقويم التعليم والتدريب (١٤٤١هـ)، ومنه أسئلة الدليل وأوزان المعايير. وأنماط الأسئلة المتداولة في تجميعات ١٤٣٤–١٤٤٧هـ ومراجعة همّة المكثفة. أسئلة البنك مكتوبة من جديد، وأسئلة الدليل منقولة كما هي مع تصحيح مفتاح سؤال واحد.</p>
  </section>`;
}
let resetAsk=false;

/* ---------- render ---------- */
function render(){
  renderNav();
  const v=document.getElementById("view");
  const r=route.name;
  v.innerHTML = r==="plan"?viewPlan(): r==="lessons"?viewLessons(): r==="lesson"?viewLesson(route.id): r==="practice"?viewPractice():
    r==="quiz"?viewQuiz(): r==="cards"?viewCards(): r==="sheet"?viewSheet(): r==="settings"?viewSettings(): viewHome();
  renderSync();
  if(r==="quiz"&&session&&session.mode==="exam"&&!session.done){ if(!timerId) timerId=setInterval(tickTimer,1000); tickTimer(); }
}
/* ---------- report a question (sent to GoatCounter as an event; hidden until configured) ---------- */
const GC_CODE = (window.SITE_CFG && window.SITE_CFG.gc) || "";
let reportOpen = null;
function reportUI(q){
  if(!GC_CODE) return "";
  if(reportOpen!==q.id) return `<button class="btn sm quiet" data-act="reportOpen" data-id="${q.id}" style="margin-top:6px">بلّغ عن خطأ في السؤال</button>`;
  return `<div class="row" style="margin-top:8px"><span class="small muted">وش المشكلة؟</span>${[["key","الإجابة غلط"],["unclear","السؤال غير واضح"],["typo","خطأ إملائي"]].map(([k,l])=>`<button class="chip" data-act="reportSend" data-id="${q.id}" data-v="${k}" style="background:none;cursor:pointer">${l}</button>`).join("")}</div>`;
}
const SITE_ID = "en2";
let toastT=null;
function toast(m){let el=document.getElementById("toast"); if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)} el.textContent=m; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true},2200)}

/* ---------- events ---------- */
function openTask(id){
  const t=planTasks().find(x=>x.id===id); if(!t) return;
  if(t.type==="lesson") return go({name:"lesson",id});
  if(t.type==="test") return startTest(id);
  if(t.type==="final") return go({name:"sheet"});
  if(t.type==="review"){ S.tasks[id]=true; save(); if(reviewDue().length) return startReview(); toast("ما عندك أخطاء مستحقة. راجع البطاقات"); return startCards(null) }
}
function startTest(k){const T=TESTS[k]; startSession({mode:T.practice?"practice":"exam",kind:"test",ref:k,title:T.title,ids:T.ids.slice(),min:T.min})}
function startReview(){const due=shuffle(reviewDue()).slice(0,30); if(!due.length){toast("ما فيه أخطاء مستحقة اليوم");return} startSession({mode:"practice",kind:"review",title:"مراجعة الأخطاء",ids:due.map(q=>q.id)})}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,a"); if(!b) return;
  const ds=b.dataset;
  if(ds.go){ if(ds.go==="cards") fc=null; return go({name:ds.go}) }
  if(ds.lesson) return go({name:"lesson",id:ds.lesson});
  if(ds.openTask) return openTask(ds.openTask);
  if(ds.pr){ if(ds.pr==="hot") pr.hot=!pr.hot; else pr[ds.pr]= ds.pr==="n"?+ds.v:ds.v; return render() }
  if(ds.jump!=null){ session.i=+ds.jump; session.confirm=false; return render() }
  if(ds.opt!=null && session && !session.done){
    const q=QBY[session.ids[session.i]], i=+ds.opt;
    if(session.mode==="practice"){ if(session.ans[q.id]!=null) return; session.ans[q.id]=i; recordAnswer(q.id,i===q.a); save(); }
    else { session.ans[q.id]=i; }
    return render();
  }
  const a=ds.act; if(!a) return;
  const s=session;
  switch(a){
    case "reportOpen": reportOpen=ds.id; render(); break;
    case "reportSend":{const q=QBY[ds.id]; let ok=false; try{ if(window.goatcounter&&window.goatcounter.count){ window.goatcounter.count({path:"report/"+SITE_ID+"/"+q.l+"/"+q.id+"/"+ds.v, title:String(q.q).slice(0,140), event:true}); ok=true } }catch(e){}
      toast(ok?"شكراً، وصل البلاغ":"تعذّر إرسال البلاغ الآن"); reportOpen=null; render(); break}
    case "theme":{const n=isDark()?"light":"dark"; document.documentElement.dataset.theme=n; try{localStorage.setItem(THEME_KEY,n)}catch(e){}; renderTheme(); break}
    case "setExam":{const v=document.getElementById("examDate").value; if(!v){toast("اختر التاريخ أولاً");return} S.exam=v; if(diffDays(S.start,v)<1) S.start=todayStr(); save(); toast("حُفظ الموعد"); render(); break}
    case "restartPlan": S.start=todayStr(); save(); toast("بدأت الخطة من اليوم"); render(); break;
    case "lessonQuiz":{const ids=shuffle(QS.filter(q=>q.l===ds.id&&!q.m).map(q=>q.id)); startSession({mode:"practice",kind:"lesson",ref:ds.id,title:LBY[ds.id].ar,ids}); break}
    case "lessonCards": startCards(ds.id); break;
    case "cardsAll": startCards(null); break;
    case "cardsAgain": startCards(fc&&fc.lesson); break;
    case "cardsHome": fc=null; render(); break;
    case "flip": fc.flip=!fc.flip; render(); break;
    case "cardYes": case "cardNo":{const id=fc.ids[fc.i]; const st=S.terms[id]||(S.terms[id]={b:0});
      if(a==="cardYes"){st.b=Math.min((st.b||0)+1,5); st.due=addDays(todayStr(),INT[st.b]); fc.known++} else {st.b=0; st.due=addDays(todayStr(),1)}
      fc.i++; fc.flip=false; save(); render(); break}
    case "quick":{let pool=quizPool(q=>(pr.dom==="all"||q.d===pr.dom)&&(!pr.hot||q.h));
      if(pr.dom==="all"&&!pr.hot){ /* weight by domain */ const out=[]; DORDER.forEach(d=>{const n=Math.round(pr.n*DOM[d].w/100); out.push(...shuffle(pool.filter(q=>q.d===d)).slice(0,n))}); pool=out }
      const ids=shuffle(pool).slice(0,pr.n).map(q=>q.id); if(!ids.length){toast("ما فيه أسئلة بهذا الفلتر");return}
      startSession({mode:"practice",kind:"quick",title:"تدريب سريع",ids}); break}
    case "review": startReview(); break;
    case "test": startTest(ds.id); break;
    case "next": s.i=Math.min(s.i+1,s.ids.length-1); s.confirm=false; render(); window.scrollTo(0,0); break;
    case "prev": s.i=Math.max(0,s.i-1); s.confirm=false; render(); break;
    case "flag":{const id=s.ids[s.i]; s.flags[id]=!s.flags[id]; render(); break}
    case "askSubmit": s.confirm=true; render(); break;
    case "cancelSubmit": s.confirm=false; render(); break;
    case "submit": case "finish": finishSession(); break;
    case "quitQuiz": if(s&&s.mode==="exam"&&!s.done){ if(!s.confirm){s.confirm=true;render();toast("سلّم الاختبار أو ارجع له");return} } stopTimer(); session=null; go({name:"practice"}); break;
    case "retryWrong":{const ids=s.ids.filter(id=>s.ans[id]!==QBY[id].a); startSession({mode:"practice",kind:"retry",title:"إعادة الأخطاء",ids:shuffle(ids)}); break}
    case "markFinal": S.tasks.final=true; save(); toast("ممتاز"); render(); break;
    case "copyReport":{const t=reportText(); const ta=document.getElementById("report");
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("نُسخ التقرير")).catch(()=>{ta.focus();ta.select();toast("حدّد النص وانسخه")}); break}
    case "resetAsk": resetAsk=true; render(); break;
    case "resetNo": resetAsk=false; render(); break;
    case "resetYes": resetAsk=false; S=freshState(); save(); toast("تم التصفير"); go({name:"home"}); break;
  }
});
document.addEventListener("keydown",e=>{
  if(route.name!=="quiz"||!session||session.done) return;
  const k=e.key.toUpperCase(); const map={A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3};
  if(k in map && !e.metaKey && !e.ctrlKey){const btn=document.querySelector(`[data-opt="${map[k]}"]`); if(btn&&!btn.disabled) btn.click()}
  if(e.key==="Enter"){const nb=document.querySelector('[data-act="next"],[data-act="finish"]'); if(nb) nb.click()}
});

/* ---------- boot ---------- */
function start(data){
  if(data&&data.session){session=data.session; if(data.route) route=data.route}
  else if(data&&data.route) route=data.route;
  if(data&&data.fc) fc=data.fc;
  render(); initRemote(); try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({route,session,fc}));
if(hot&&hot.ready) hot.ready(start); else start(hot&&hot.data||{});
})();
</script>
</body></html>
