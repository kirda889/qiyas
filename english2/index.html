|en.pavlov]]): it is linked to the **stimulus**.","إجرائي / كلاسيكي"]],"t":[["Behaviorism","Learning as habit formation through stimulus, response and reinforcement.","السلوكية"],["Tabula rasa (blank slate)","The behaviorist view that the mind starts empty.","صفحة بيضاء"],["Operant conditioning","Behavior shaped by consequences (reinforcement after a response) — Skinner.","إشراط إجرائي"],["Classical conditioning","Learning by associating stimuli — Pavlov.","إشراط كلاسيكي"]],"intro":[],"ex":[]},{"h":["Nativism (Chomsky)","الفطرية"],"pts":[["[[Chomsky|en.chomsky]]: humans are born with a **Language Acquisition Device (LAD)**; all languages share **Universal Grammar**.","جهاز الاكتساب والقواعد الكلية"],["Evidence: children say what they never heard ('I goed') — they apply rules, not just imitate.","goed دليل على القاعدة لا التقليد"],["**Competence** = underlying knowledge of language; **performance** = actual use.","كفاية / أداء"],["[[Lenneberg|en.lenneberg]]'s **Critical Period Hypothesis** (age-linked acquisition) supports nativism.","المرحلة الحرجة"],["Innatists: input alone stimulates acquisition; feedback does not change the sequence of development.","المدخل يكفي"]],"t":[["Nativism (innatism)","The view that humans are born with an innate capacity for language.","الفطرية"],["Language Acquisition Device (LAD)","Chomsky's proposed innate mental faculty for language.","جهاز اكتساب اللغة"],["Universal Grammar","Principles and properties shared by all languages.","القواعد الكلية"],["Competence","A speaker's underlying (subconscious) knowledge of the language system.","الكفاية"],["Performance","The actual production and use of language.","الأداء"],["Critical Period Hypothesis","The ability to acquire language is biologically linked to age.","فرضية المرحلة الحرجة"]],"intro":[],"ex":[]},{"h":["Cognitivism and Piaget","المعرفية وبياجيه"],"pts":[["Acquisition is **rule formation**; language development follows **cognitive development** (attention, memory, linking new to known).","تكوين قواعد مرتبط بالنمو المعرفي"],["[[Piaget|en.piaget]]: **assimilation** fits new information into a schema; **accommodation** changes the schema.","تمثّل / مواءمة"],["Piaget's preoperational stage (**2–7 years**): symbols, imagination, memorization.","2–7 سنوات"],["[[Ausubel|en.ausubel]]: **meaningful learning** links new material to existing knowledge (advance organizer).","التعلم ذو المعنى"]],"t":[["Cognitivism","Learning as active mental processing and rule formation.","المعرفية"],["Accommodation","Modifying a schema to fit new information.","مواءمة"],["Assimilation","Incorporating new information into an existing schema.","تمثّل"],["Schema","An organized mental structure of knowledge.","مخطط ذهني"],["Cognitive development","The emergence of mental abilities and skills that make up the human intellect.","النمو المعرفي"]],"intro":[],"ex":[]},{"h":["Constructivism and Vygotsky","البنائية وفيجوتسكي"],"pts":[["Learners **construct** knowledge; [[Bruner|en.bruner]]: discovery learning and the spiral curriculum.","بناء المعرفة"],["**Sociocultural theory** ([[Vygotsky|en.zpd]]): learning happens with a more knowledgeable other inside the **ZPD**.","التفاعل داخل منطقة النمو القريبة"],["**Scaffolding** supports learners until they work alone; it makes input more **comprehensible**.","السقالات"],["Interactionist view: meaningful conversation drives acquisition — hence collaborative writing and peer feedback.","التفاعل والتعاون"]],"t":[["Zone of Proximal Development (ZPD)","The gap between what a learner can do alone and with help.","منطقة النمو القريبة"],["More Knowledgeable Other (MKO)","A teacher or peer who supports learning.","الأكثر معرفة"],["Scaffolding","Temporary support gradually removed as competence grows.","سقالات"],["Sociocultural theory","Learning as a social process mediated by interaction.","النظرية الاجتماعية الثقافية"],["Discovery learning","Learners find principles for themselves (Bruner).","التعلم بالاكتشاف"]],"intro":[],"ex":[]},{"h":["First language acquisition and views of language","اكتساب اللغة الأولى"],"pts":[["Child stages: cooing/babbling → one word → two-word **pivot grammar** → **telegraphic speech** (no function words).","مراحل الطفل"],["Children imitate deep rather than surface structure ('Nobody don't like me').","تقليد البنية العميقة"],["Views of language: **structural** (system), **functional** (functions), **interactional** (relationships).","بنيوية / وظيفية / تفاعلية"],["Others: Gestalt (whole > parts), humanism ([[Maslow|en.maslow]], [[Rogers|en.rogers]]), social learning (Bandura).","نظريات أخرى"]],"t":[["Telegraphic speech","Speech using content words without function words ('Daddy go car').","كلام برقي"],["Pivot grammar","Early two-word combinations ('allgone shoe').","قواعد المحور"],["Structural view of language","Language as a system of structurally related elements for transmitting meaning.","النظرة البنيوية"],["Gestalt","The whole is greater than the sum of its parts.","الجشطالت"]],"intro":[],"ex":[]},{"h":["Theories of writing","نظريات الكتابة"],"pts":[["**Ecological theory** (Cooper): writing is shaped by **place, community and local context**.","البيئية ← المكان والسياق المحلي"],["Cognitive theory: the writer's mental processes (planning, translating, reviewing); sociocultural: collaboration and peer feedback.","المعرفية / الاجتماعية الثقافية"]],"t":[["Ecological theory of writing","A view that writing is shaped by the writer's place, community and local context.","النظرية البيئية في الكتابة"]],"intro":[],"ex":[]},{"h":["Generative grammar and innatism","القواعد التوليدية والفطرية"],"pts":[["Chomsky's **generative grammar** (rules that produce infinite sentences) is studied under **innatism (nativism)**.","التوليدية تابعة للفطرية"]],"t":[["Generative grammar","Chomsky's model of the finite set of rules that can generate all grammatical sentences of a language.","القواعد التوليدية"]],"intro":[],"ex":[]},{"h":["Piaget's four stages and peer scaffolding","مراحل بياجيه الأربع والدعم بين الأقران"],"pts":[["**Social constructivism**: a more capable peer scaffolds a weaker one within the ZPD — the basis for mixed-ability pairing.","زميل أقدر يدعم الأضعف"]],"t":[["Concrete operational stage","Piaget's stage (about 7–11) when children reason logically about concrete situations.","المرحلة الإجرائية المحسوسة"],["Formal operational stage","Piaget's stage (from about 11) when abstract and hypothetical reasoning develops.","المرحلة الإجرائية الشكلية"],["Social constructivism","The view that knowledge is built through social interaction with more capable others.","البنائية الاجتماعية"]],"intro":[],"ex":[],"map":{"type":"fan","title":["Piaget's Four Stages","⁧مراحل بياجيه الأربع⁩"],"groups":[{"n":"Sensorimotor · 0–2","ar":"⁧الحس الحركي: ثبات الأشياء⁩","d":"en.piaget"},{"n":"Preoperational · 2–7","ar":"⁧ما قبل العمليات: رموز وتخيّل وحفظ⁩","d":"en.piaget"},{"n":"Concrete operational · 7–11","ar":"⁧العمليات المحسوسة: منطق مع الأشياء والأحداث الملموسة⁩","d":"en.piaget"},{"n":"Formal operational · 11+","ar":"⁧العمليات المجردة: استدلال مجرد و«ماذا لو»⁩","d":"en.piaget"}]}}],"trap":[["Changing existing structures = accommodation; fitting in without change = assimilation.","مواءمة / تمثّل"],["The Critical Period Hypothesis supports nativism, not behaviorism.","الفطرية"],["Blank slate = behaviorism.","السلوكية"]],"vid":[["IhcgYgx7aAA","en","Piaget's Theory of Cognitive Development","Sprouts",7],["EYbCE1udazw","en","Piaget's Schema: Accommodation and Assimilation","Sprouts",6],["8I2hrSRbmHE","en","Vygotsky's Theory of Cognitive Development","Sprouts",5],["2e4GsZFgKQo","en","Behaviorism, Cognitivism, Constructivism","ETH Zurich",9]],"map":{"title":["Learning Theories","⁧نظريات التعلم⁩"],"groups":[{"n":"Behaviorism","ar":"⁧السلوكية⁩","idea":"⁧التعلم عادة تتكوّن بالمثير والاستجابة والتعزيز⁩","items":[{"n":"Classical","who":"Pavlov","ar":"⁧الاشتراط الكلاسيكي⁩","kw":["classical conditioning"],"d":"en.pavlov"},{"n":"Operant","who":"Skinner","ar":"⁧التعزيز بعد الاستجابة⁩","kw":["operant conditioning","reinforcement"],"d":"en.skinner"}],"trap":"⁧ترتبط بالطريقة السمعية الشفهية (ALM): تكرار وتقليد وتجنّب الخطأ⁩"},{"n":"Nativism","ar":"⁧الفطرية⁩","idea":"⁧الطفل يولد بقدرة لغوية فطرية⁩","items":[{"n":"LAD · UG","who":"Chomsky","ar":"⁧جهاز الاكتساب والقواعد الكلية⁩","kw":["LAD","Universal Grammar"],"d":"en.chomsky"},{"n":"Critical period","who":"Lenneberg","ar":"⁧الاكتساب مرتبط بالعمر⁩","kw":["Critical Period Hypothesis"],"d":"en.lenneberg"}],"trap":"⁧تشومسكي هو من انتقد سكنر (1959)، لا العكس⁩"},{"n":"Cognitivism","ar":"⁧المعرفية⁩","idea":"⁧المتعلم يعالج المعلومات ويبني معنى⁩","items":[{"n":"Schemas","who":"Piaget","ar":"⁧تمثّل ومواءمة⁩","kw":["assimilation","accommodation"],"d":"en.piaget"},{"n":"Meaningful","who":"Ausubel","ar":"⁧ربط الجديد بالمعروف⁩","kw":["meaningful learning","advance organizer"],"d":"en.ausubel"}],"trap":"⁧التعلم الآلي (rote) عكس التعلم ذي المعنى عند أوزوبل⁩"},{"n":"Social Constructivism","short":"Constructivism","ar":"⁧البنائية الاجتماعية⁩","idea":"⁧المعرفة تُبنى بالتفاعل مع الآخرين⁩","items":[{"n":"ZPD","who":"Vygotsky","ar":"⁧منطقة النمو القريبة⁩","kw":["ZPD","scaffolding","MKO"],"d":"en.zpd"},{"n":"Discovery","who":"Bruner","ar":"⁧الاكتشاف والمنهج الحلزوني⁩","kw":["discovery learning","spiral curriculum"],"d":"en.bruner"}],"trap":"⁧ZPD هي ما يستطيعه المتعلم بمساعدة، لا ما يفعله وحده⁩"},{"n":"Humanism","ar":"⁧الإنسانية⁩","idea":"⁧مشاعر المتعلم وحاجاته قبل المعلومة⁩","items":[{"n":"Needs","who":"Maslow","ar":"⁧هرم الحاجات⁩","kw":["hierarchy of needs"],"d":"en.maslow"},{"n":"Facilitator","who":"Rogers","ar":"⁧التعلم المتمركز حول المتعلم⁩","kw":["learner-centered","facilitator"],"d":"en.rogers"}],"trap":"⁧طرق مثل CLL والإيحائية (Suggestopedia) تُصنَّف طرقاً إنسانية⁩"}]},"n":15},{"id":"L16","d":"T","std":"6.9.8","en":"Second Language Acquisition Theories","ar":"نظريات اكتساب اللغة الثانية","goal":["Know Krashen's five hypotheses precisely, later SLA theories and the components of communicative competence.","فرضيات كراشن والكفاية التواصلية"],"sec":[{"h":["Krashen's Monitor Model","فرضيات كراشن الخمس"],"pts":[["[[Krashen|en.sla-krashen]]'s **Monitor Model**: five linked hypotheses; fluency comes from subconscious **acquisition**, not learned rules.","الطلاقة من الاكتساب لا من القواعد"],["Conscious error correction while speaking = the [[Monitor|en.sla-monitor]]; over-users speak hesitantly.","المراقب: محرر واعٍ"]],"t":[["Acquisition–Learning Hypothesis","Distinguishes subconscious acquisition from conscious learning.","الاكتساب والتعلم"],["Monitor Hypothesis","Learned knowledge edits output when there is time, focus on form and knowledge of the rule.","المراقب"],["Natural Order Hypothesis","Structures are acquired in a predictable sequence.","الترتيب الطبيعي"],["Input Hypothesis (i+1)","Acquisition results from comprehensible input slightly above current level.","المدخل المفهوم"],["Affective Filter Hypothesis","Emotional factors can block input from being acquired.","المرشح الوجداني"],["Comprehensible input","Input learners can understand, with a little beyond their level.","مدخل مفهوم"]],"intro":[],"ex":[],"map":{"type":"fan","title":["Krashen's Five Hypotheses","⁧فرضيات كراشن الخمس⁩"],"groups":[{"n":"Acquisition–Learning","ar":"⁧اكتساب لا واعٍ مثل الطفل / تعلّم واعٍ للقواعد⁩","items":[{"n":"subconscious"},{"n":"conscious, deliberate"}],"d":"en.sla-krashen"},{"n":"Monitor","ar":"⁧المعرفة المتعلَّمة محرر يصحح الكلام عند توفر الوقت والتركيز ومعرفة القاعدة⁩","items":[{"n":"conscious error correction"}],"d":"en.sla-monitor"},{"n":"Natural Order","ar":"⁧التراكيب تُكتسب بترتيب متوقع⁩","items":[{"n":"predictable order"}],"d":"en.sla-order"},{"n":"Input (i+1)","ar":"⁧مدخل مفهوم فوق المستوى بقليل؛ i هي الكفاية الحالية⁩","items":[{"n":"comprehensible input"},{"n":"i = competence"}],"d":"en.sla-input"},{"n":"Affective Filter","ar":"⁧القلق والخجل وضعف الدافعية ترفعه، والثقة تخفضه⁩","items":[{"n":"anxiety raises it"}],"d":"en.sla-filter"}]}},{"h":["Later SLA theories","نظريات بعد كراشن"],"pts":[["[[**Interaction Hypothesis**|en.sla-interaction]] (Long): negotiation of meaning makes input comprehensible.","التفاعل: التفاوض على المعنى"],["**Output Hypothesis** (Swain): producing language reveals gaps — noticed most when learners **talk to others**.","المخرج يكشف الفجوة"],["**Noticing** (Schmidt): input must be noticed to become intake.","الملاحظة"],["**Acculturation** ([[Schumann|en.sla-schumann]]): social and psychological distance from the target group.","التثاقف والمسافة"],["**Syntactic bootstrapping**: inferring a word's meaning from its position and sentence structure.","الإقلاع النحوي"]],"t":[["Interaction Hypothesis","Long: negotiation of meaning in interaction promotes acquisition.","فرضية التفاعل"],["Output Hypothesis","Swain: producing language pushes learners to notice gaps.","فرضية المخرج"],["Noticing Hypothesis","Schmidt: learners must consciously notice input features.","فرضية الملاحظة"],["Acculturation Model","Schumann: social and psychological distance affects acquisition.","نموذج التثاقف"],["Automaticity","Performing a skill without conscious effort.","الآلية"],["Syntactic bootstrapping","Using syntax to infer word meaning.","الإقلاع النحوي"]],"intro":[],"ex":[]},{"h":["Stages and L1 vs L2","المراحل والفرق بين الاكتسابين"],"pts":[["Early L2 learners show **limited production** (silent period).","إنتاج محدود"],["L1 and L2 acquisition are alike: both occur through **comprehensible input**.","المدخل المفهوم"],["L1 is instinctive, rapid and complete; adult L2 learners usually **do not reach native-like grammatical competence**.","الكبير نادراً يصل للأصلي"],["Cummins: [[BICS|en.sla-bics]] (≈2 years) vs CALP (5–7 years).","BICS / CALP"],["Knows the rule but says 'He run fast' → [[**has competence but lacks performance**|en.sla-compperf]]; slips are **performance** errors.","كفاية / أداء"]],"t":[["Silent period","An early stage with little or no L2 production.","فترة الصمت"],["BICS","Basic Interpersonal Communicative Skills.","مهارات التواصل الأساسية"],["CALP","Cognitive Academic Language Proficiency.","الكفاءة الأكاديمية"],["Performance error","A slip in use despite knowing the rule.","خطأ أداء"],["Metalinguistic awareness","Awareness of language as an object one can think about.","الوعي بما وراء اللغة"]],"intro":[],"ex":[]},{"h":["Communicative competence","الكفاية التواصلية"],"pts":[["[[**Dell Hymes**|en.sla-cc]] coined **communicative** competence: knowing what to say and how to say it appropriately.","هايمز: المناسبة للموقف"],["Canale & Swain: grammatical, sociolinguistic, discourse and strategic competence (**discourse** added by Canale, 1983).","المكونات الأربعة"],["Cohesive, coherent text (intersentential links) = **discourse**; 'an animal that lives in water' for 'fish' = **strategic**.","خطابية / استراتيجية"],["Understanding the function of a spoken utterance = **pragmatic** competence.","تداولية"]],"t":[["Communicative competence","Knowing how to use language appropriately in context (Hymes).","الكفاية التواصلية"],["Grammatical competence","Knowledge of vocabulary, grammar and pronunciation rules.","قواعدية"],["Sociolinguistic competence","Using language appropriately for the social context.","اجتماعية لغوية"],["Discourse competence","Producing and understanding cohesive, coherent texts.","خطابية"],["Strategic competence","Using strategies to compensate for gaps and repair breakdowns.","استراتيجية"],["Pragmatic competence","Understanding the function and intention of utterances.","تداولية"],["Circumlocution","Describing a word you don't know with other words.","الشرح بكلمات أخرى"]],"intro":[],"ex":[]},{"h":["Stages of second language acquisition","مراحل اكتساب اللغة الثانية"],"pts":[["Krashen & Terrell's [[**Natural Approach**|en.l16-stages]]: 3 early stages; teacher materials extend them to 5.","ثلاث مراحل في الأصل وتُمدّ إلى خمس"],["**Preproduction** (silent period): understands, answers by pointing or nodding → **TPR**, pictures, yes/no questions.","يفهم ولا يتكلم: TPR ونعم/لا"],["**Early production**: one- or two-word answers, chunks → **either/or** and who/what/where questions.","كلمة أو كلمتان: أسئلة اختيار"],["**Speech emergence**: simple sentences, frequent errors → how/why questions, short stories, dialogues.","جمل بسيطة: لماذا وكيف"],["**Intermediate fluency**: complex sentences, opinions → 'What would happen if…?'; **advanced fluency** ≈ Cummins' CALP.","جمل مركبة وآراء ثم طلاقة أكاديمية"]],"t":[["Preproduction stage","The first SLA stage: comprehension with little or no speech.","مرحلة ما قبل الإنتاج"],["Early production stage","Learners produce one- or two-word responses and memorised phrases.","الإنتاج المبكر"],["Speech emergence stage","Learners produce simple sentences and short exchanges.","ظهور الكلام"],["Intermediate fluency stage","Learners use more complex sentences and express opinions with fewer errors.","الطلاقة المتوسطة"],["Advanced fluency stage","Learners approach native-like proficiency in social and academic language.","الطلاقة المتقدمة"]],"ex":[],"intro":[]},{"h":["Learning strategies: Oxford (1990) and the good language learner","استراتيجيات التعلم عند أكسفورد والمتعلم الجيد"],"pts":[["[[Oxford|en.sla-oxford]]'s questionnaire is the **SILL**; O'Malley & Chamot use three groups: metacognitive, cognitive, social/affective.","استبانة SILL"],["[[**Good language learner**|en.l16-gll]] (Rubin, 1975): guesses willingly, wants to communicate, is not inhibited by mistakes.","صفات المتعلم الجيد"]],"t":[["Direct strategies","Oxford: memory, cognitive and compensation strategies that work directly with the language.","استراتيجيات مباشرة"],["Indirect strategies","Oxford: metacognitive, affective and social strategies that support learning.","استراتيجيات غير مباشرة"],["Memory strategies","Techniques for storing and retrieving new information (grouping, imagery, rhymes).","استراتيجيات الذاكرة"],["Cognitive strategies","Mental operations on the language: practising, analysing, summarising.","استراتيجيات معرفية"],["Compensation strategies","Strategies to overcome gaps in knowledge, such as guessing or using synonyms.","استراتيجيات تعويضية"],["Metacognitive strategies","Planning, monitoring and evaluating one's own learning.","استراتيجيات ما وراء المعرفة"],["Affective strategies","Managing emotions, anxiety and motivation.","استراتيجيات وجدانية"],["Social strategies","Learning with and through others: asking questions, cooperating.","استراتيجيات اجتماعية"],["SILL","Strategy Inventory for Language Learning: Oxford's strategy questionnaire.","استبانة أكسفورد"]],"intro":[],"ex":[],"map":{"type":"fan","title":["Oxford (1990): learning strategies","⁧استراتيجيات التعلم عند أكسفورد⁩"],"groups":[{"n":"Direct","ar":"⁧تتعامل مع اللغة نفسها: ذاكرة (تصنيف وصور)، معرفية (تدريب وتلخيص)، تعويضية (تخمين وإيماء وشرح بكلمات أخرى)⁩","items":[{"n":"memory"},{"n":"cognitive"},{"n":"compensation"}],"d":"en.sla-oxford"},{"n":"Indirect","ar":"⁧تدير التعلم: ما وراء معرفية (تخطيط وتقويم ذاتي)، وجدانية (خفض القلق)، اجتماعية (طلب التوضيح)⁩","items":[{"n":"metacognitive"},{"n":"affective"},{"n":"social"}],"d":"en.sla-oxford"}]}},{"h":["More SLA perspectives","منظورات أخرى في اكتساب اللغة الثانية"],"pts":[["[[**Skill Acquisition Theory**|en.sla-skill]] (DeKeyser): **declarative** → **procedural** knowledge → automaticity through practice.","من معرفة القاعدة إلى استعمالها تلقائياً"],["**Investment** ([[Norton|en.sla-norton]]): learners invest when a language promises symbolic and material resources; tied to **identity**.","الاستثمار والهوية"],["[[**Usage-based**|en.sla-usage]] views: patterns are extracted gradually from frequent exposure to real use.","التعلم من تكرار الاستعمال"]],"t":[["Skill Acquisition Theory","SLA as a skill moving from declarative to procedural knowledge and automaticity (DeKeyser).","نظرية اكتساب المهارة"],["Declarative knowledge","Knowing about something: facts and rules that can be stated.","معرفة تقريرية"],["Procedural knowledge","Knowing how to do something: the ability to use knowledge in performance.","معرفة إجرائية"],["Investment (Norton)","A learner's commitment to learning a language, tied to identity and expected returns.","الاستثمار"]],"intro":[],"ex":[]},{"h":["Self-repair","تصحيح المتعلم لنفسه"],"pts":[["Correcting your own slip while speaking ('I goed… went') shows **metalinguistic awareness**; the slip is a performance mistake.","التصحيح الذاتي = وعي ما وراء لغوي"]],"intro":[],"ex":[]}],"trap":[["Conscious error correction while speaking = Monitor Hypothesis.","المراقب"],["Anxiety raises the affective filter.","يرتفع"],["The Input Hypothesis focuses on acquisition, not teaching.","الاكتساب"]],"vid":[["NiTsduRreug","en","Stephen Krashen on Language Acquisition","Mark Rounds",15],["8qjLXjCqNyA","en","Krashen's Theory of SLA","Teacher Rafa",8],["45W5ucCLYqM","en","Unpacking terms: Communicative Competence","Unpacking language pedagogy",9]],"map":{"type":"cards","title":["SLA Theories","⁧نظريات اكتساب اللغة الثانية⁩"],"groups":[{"n":"Krashen","ar":"⁧الاكتساب بالمدخل المفهوم⁩","items":[{"n":"Monitor Model","who":"Krashen","ar":"⁧الطلاقة من الاكتساب لا من القواعد⁩","d":"en.sla-krashen"},{"n":"Natural Approach","who":"Krashen & Terrell","ar":"⁧الفهم أولاً ثم يظهر الكلام تدريجياً⁩","d":"en.l16-stages"}],"trap":"⁧فرضية المدخل تخص **الاكتساب** لا التدريس، و i هي الكفاية الحالية⁩"},{"n":"Interaction","ar":"⁧التفاعل والإنتاج⁩","items":[{"n":"Interaction","who":"Long","ar":"⁧التفاوض على المعنى⁩","d":"en.sla-interaction"},{"n":"Output","who":"Swain","ar":"⁧الإنتاج يكشف الفجوة⁩","d":"en.sla-interaction"},{"n":"Noticing","who":"Schmidt","ar":"⁧لا مأخوذ بلا ملاحظة⁩","d":"en.sla-interaction"}]},{"n":"Cognitive","ar":"⁧اللغة مهارة وكفاءة⁩","items":[{"n":"Skill Acquisition","who":"DeKeyser","ar":"⁧تقريرية ← إجرائية ← آلية⁩","d":"en.sla-skill"},{"n":"Usage-based","who":"N. Ellis · Tomasello","ar":"⁧الأنماط من تكرار الاستعمال⁩","d":"en.sla-usage"},{"n":"BICS / CALP","who":"Cummins","ar":"⁧سنتان للتواصل، 5–7 للأكاديمية⁩","d":"en.sla-bics"}]},{"n":"Social","ar":"⁧المجتمع والهوية⁩","items":[{"n":"Acculturation","who":"Schumann","ar":"⁧المسافة الاجتماعية والنفسية⁩","d":"en.sla-schumann"},{"n":"Investment","who":"Norton","ar":"⁧الاستثمار والهوية⁩","d":"en.sla-norton"}]},{"n":"Competence","ar":"⁧ماذا يكتسب المتعلم؟⁩","items":[{"n":"Communicative competence","who":"Hymes","ar":"⁧صاحب المصطلح⁩","d":"en.sla-cc"},{"n":"Four components","who":"Canale & Swain","ar":"⁧قواعدية، اجتماعية لغوية، خطابية، استراتيجية⁩","d":"en.sla-cc"},{"n":"Pragmatic competence","who":"Bachman","ar":"⁧فهم وظيفة العبارة وقصد المتكلم⁩","d":"en.sla-cc"}]}]},"n":16},{"id":"L17","d":"T","std":"6.9.9","en":"Learner Language, Individual Differences & TESOL","ar":"لغة المتعلم والفروق وتعليم الإنجليزية","goal":["Distinguish positive/negative transfer, interlingual/intralingual errors, interlanguage and fossilization; know TESOL terms.","النقل والأخطاء واللغة البينية"],"sec":[{"h":["Transfer and contrastive analysis","النقل والتحليل التقابلي"],"pts":[["[[**Contrastive Analysis**|en.l17-ca]] (Lado, 1957) compares L1 with the target language to predict difficulties; linked to **behaviorism**.","مقارنة اللغتين للتنبؤ بالصعوبة"],["Applying L1 knowledge to L2 = **transfer**; similar structures give correct output = **positive transfer**.","نقل إيجابي"],["**Negative transfer** = the negative influence of L1 on L2: 'five years before', 'pen blue', 'the man whom I met him'.","نقل سلبي","o"],["Teachers should analyze [[**errors**|en.spk.errors]] to find inappropriate L1 transfer, and expect learners to use their L1.","حلّل الأخطاء"]],"t":[["Contrastive Analysis","Comparing L1 and L2 to predict learning difficulties (Lado).","التحليل التقابلي"],["Transfer","Applying L1 knowledge to the L2.","النقل"],["Positive transfer","L1–L2 similarity leads to correct L2 production.","نقل إيجابي"],["Negative transfer (interference)","L1 patterns cause errors in L2.","نقل سلبي"]],"intro":[],"ex":[]},{"h":["Error analysis and interlanguage","تحليل الأخطاء واللغة البينية"],"pts":[["[[Error Analysis|en.l17-ea]] (Corder): **interlingual** errors come from L1; **intralingual** errors come from the target language.","من اللغة الأم / من اللغة الهدف"],["Errors such as 'rided' and 'goed' **mean the student is learning** (developmental pattern).","أخطاء النمو علامة تعلم","o"],["**Overgeneralization**: 'writed', 'tooths', 'childs', 'swimmed'.","تعميم زائد"],["The learner's developing system = [[**interlanguage**|en.l17-il]]; incorrect forms that become permanent = **fossilization**.","لغة بينية / تحجّر"],["Decrease in proficiency from disuse or L2 influence = **attrition**.","تآكل"]],"t":[["Error analysis","Studying learners' errors as evidence of learning (Corder).","تحليل الأخطاء"],["Interlingual error","An error caused by L1 interference.","خطأ من اللغة الأم"],["Intralingual (developmental) error","An error caused by the target language itself.","خطأ داخل اللغة الهدف"],["Overgeneralization","Applying a rule too widely ('goed', 'tooths').","تعميم زائد"],["Interlanguage","The learner's evolving language system between L1 and L2 (Selinker).","لغة بينية"],["Fossilization","Incorrect forms that become permanent and resist correction.","تحجّر"],["Language attrition","Loss of language proficiency over time.","تآكل اللغة"]],"intro":[],"ex":[]},{"h":["Individual differences","الفروق الفردية"],"pts":[["Age, personality, experience = **individual** factors; anxiety, self-restriction = [[**affective**|en.lrn.affect]] factors.","فردية / وجدانية"],["**Technological** factors are NOT a category of SLA factors.","التقنية ليست منها"],["Fluency, accuracy and complexity = **cognitive** factors.","معرفية"]],"t":[["Aptitude","A natural ability to learn languages (Carroll's MLAT).","استعداد"],["Learning strategies (Oxford)","Memory, cognitive, compensation, metacognitive, affective, social.","استراتيجيات التعلم"],["Affective factors","Emotional variables such as anxiety, self-esteem and inhibition.","عوامل وجدانية"]],"intro":[],"ex":[]},{"h":["Bilingualism and TESOL terms","الثنائية والمصطلحات"],"pts":[["Fluent in two languages = **bilingual**; alternating between them = [[**code-switching**|en.l17-bilingual]].","ثنائي / تناوب"],["**TESOL** = Teaching English to Speakers of Other Languages; **TEFL** = … as a Foreign Language; ESP = for Specific Purposes.","الاختصارات"],["TESOL draws on theories of **cognitive development** to plan effective teaching.","النمو المعرفي"],["Some see **culture** as the fifth skill; teach it starting from familiar local aspects.","الثقافة المهارة الخامسة"]],"t":[["Bilingual","Fluent in two languages.","ثنائي اللغة"],["Code-switching","Alternating between two languages in conversation.","تناوب لغوي"],["Diglossia","Two varieties of one language used for different functions.","ازدواجية"],["TESOL","Teaching English to Speakers of Other Languages.","تيسول"],["TEFL","Teaching English as a Foreign Language.","إنجليزية لغة أجنبية"],["ESL","English as a Second Language (used in the surrounding community).","لغة ثانية"],["ESP","English for Specific Purposes (medicine, aviation, business).","لأغراض خاصة"],["EAP","English for Academic Purposes.","لأغراض أكاديمية"],["Culture shock","Honeymoon, frustration, adjustment, adaptation.","صدمة ثقافية"]],"intro":[],"ex":[]},{"h":["Recent trends in TESOL","الاتجاهات الحديثة في تعليم الإنجليزية"],"pts":[["Shared direction: from [[**native-speaker norms**|en.l17-we]] to intelligibility, intercultural skill and the learner's whole repertoire.","من معيار الناطق الأصلي إلى الوضوح والتواصل"],["[[**Native-speakerism**|en.l17-postmethod]] (Holliday) = belief that native speakers teach better; Medgyes lists strengths of non-native teachers.","قضية المعلم الناطق وغير الناطق"]],"t":[["World Englishes","The view that English has many legitimate national and regional varieties.","الإنجليزيات العالمية"],["English as a Lingua Franca (ELF)","English used as a common language between speakers of different first languages.","الإنجليزية كلغة مشتركة"],["Intercultural communicative competence (ICC)","Byram's model of the ability to communicate and mediate across cultures.","الكفاءة التواصلية بين الثقافات"],["Intercultural speaker","A learner who mediates between cultures, as opposed to imitating a native speaker.","المتحدث بين الثقافات"],["Translanguaging","Using one's full linguistic repertoire, across languages, to make meaning and learn.","التنقّل بين اللغات (توظيف المخزون اللغوي كاملاً)"],["Macrostrategies (Kumaravadivelu)","General post-method principles from which teachers derive classroom techniques.","الاستراتيجيات الكبرى"],["Native-speakerism","An ideology that native speakers represent the best models and teachers (Holliday).","تفضيل الناطق الأصلي"],["NNEST","Non-Native English-Speaking Teacher.","معلم غير ناطق بالإنجليزية"]],"map":{"type":"fan","title":["Recent Trends in TESOL","⁧الاتجاهات الحديثة⁩"],"groups":[{"n":"World Englishes","who":"Kachru","ar":"⁧الإنجليزية أنواع مشروعة كثيرة، لا البريطانية والأمريكية فقط⁩","items":[{"n":"Indian · Nigerian · Singaporean"}],"d":"en.l17-we"},{"n":"English as a Lingua Franca (ELF)","who":"Jenkins · Seidlhofer","ar":"⁧أغلب الاستعمال بين غير الناطقين: الوضوح قبل معيار الناطق⁩","items":[{"n":"intelligibility"},{"n":"accommodation"}],"d":"en.l17-we"},{"n":"Intercultural communicative competence","who":"Byram","ar":"⁧متحدث بين الثقافات لا ناطق مقلَّد⁩","items":[{"n":"attitudes"},{"n":"knowledge"},{"n":"interpreting and relating"},{"n":"discovery and interaction"},{"n":"critical cultural awareness"}],"d":"en.l17-icc"},{"n":"Translanguaging","who":"García","ar":"⁧كل اللغات مورد للتعلم: خطط بالعربية واعرض بالإنجليزية⁩","items":[{"n":"whole linguistic repertoire"}],"d":"en.l17-translang"},{"n":"Post-method pedagogy","who":"Kumaravadivelu","ar":"⁧لا طريقة واحدة، بل استراتيجيات كبرى⁩","items":[{"n":"macrostrategies"},{"n":"learner autonomy"},{"n":"contextualising input"}],"d":"en.l17-postmethod"},{"n":"Native/non-native teacher","who":"Holliday · Medgyes","ar":"⁧للمعلم غير الناطق مزايا: نموذج متعلم ناجح ويتوقع الصعوبات⁩","items":[{"n":"native-speakerism"},{"n":"shared L1"}],"d":"en.l17-postmethod"}]},"intro":[],"ex":[]},{"h":["Reflective teaching and action research","التدريس التأملي والبحث الإجرائي"],"pts":[["[[**Reflective teaching**|en.l17-reflect]]: collect evidence about your own teaching (journals, recordings, peer observation) to improve it.","التأمل في الممارسة لتحسينها"],["Schön: **reflection-in-action** = adjusting during the lesson; reflection-on-action = thinking back afterwards.","التأمل أثناء الفعل وبعده"],["**Action research**: small-scale study of a problem in **their own classroom**; cycle plan → act → observe → reflect (Kemmis & McTaggart).","دورة: خطط، نفّذ، لاحظ، تأمّل"]],"t":[["Reflective teaching","Systematically examining one's own teaching to improve it.","التدريس التأملي"],["Reflection-in-action / on-action","Schön: thinking during an event vs thinking about it afterwards.","التأمل أثناء / بعد"],["Action research","Cyclical, classroom-based research by teachers to solve a local problem.","البحث الإجرائي"],["Peer observation","Teachers observing each other's lessons to give feedback and learn.","ملاحظة الزملاء"]],"intro":[],"ex":[]},{"h":["TESOL and related disciplines","علاقة تعليم الإنجليزية بالعلوم الأخرى"],"pts":[["[[**Psycholinguistics**|en.l17-disc]] = language in the mind; **sociolinguistics** = language in society; neurolinguistics = language and the brain.","علم اللغة النفسي والاجتماعي والعصبي"],["Educational psychology → motivation, assessment; anthropology → culture; **corpus linguistics** → word lists ([[corpora|en.voc.corpus]]); computer science → CALL.","علوم تغذي التدريس"],["[[**CLIL**|en.meth.cbi]] teaches content through English: **hard (strong) CLIL** = a subject in English; soft (weak) CLIL = topic-based English course.","التدريس عبر المحتوى"],["**Cross-curricular links** (science texts, maths word problems) give language a real purpose and build CALP.","روابط بين المواد"]],"t":[["Psycholinguistics","The study of the mental processes involved in language use an ' = a **prescriptive** rule; descriptive grammar describes actual use.","معياري / وصفي"],["Least accurate description: 'language is only verbal' — it can also be written or signed.","ليست لفظية فقط"]],"t":[["Linguistics","The scientific study of language and its structure.","اللسانيات"],["Prescriptive grammar","Rules for how people should use language.","قواعد معيارية"],["Descriptive grammar","A description of how people actually use language.","قواعد وصفية"],["Langue / Parole","Saussure: the language system / actual speech.","اللسان / الكلام"],["Applied linguistics","Linguistics applied to real problems such as language teaching.","لسانيات تطبيقية"],["Historical linguistics","The study of how language develops over time.","علم اللغة التاريخي"],["Neurolinguistics","The study of the relationship between language and the brain.","علم اللغة العصبي"]],"intro":[],"ex":[]},{"h":["Design features (Hockett)","خصائص اللغة البشرية"],"pts":[["The relationship between form and meaning is **arbitrary** ([[Hockett|en.l18-hockett]]).","اعتباطية","o"],["Referring to things not present = **displacement**.","الإزاحة","o"],["Endless new messages = **creativity / productivity**; meaningless sounds → meaningful units = **duality**.","الإبداعية / ازدواجية البنية"],["Main problem of origin-of-language theories: they **lack scientific evidence**.","بلا دليل علمي","o"],["Variation is an **inherent part of language**; all languages change (**mutability**).","التنوع أصيل والتغيّر"]],"t":[["Arbitrariness","No natural connection between a word's form and its meaning.","اعتباطية"],["Displacement","The ability to refer to things not present in time or space.","الإزاحة"],["Productivity (creativity)","The ability to produce and understand infinite new utterances.","الإبداعية"],["Duality of patterning","Language works at two levels: sounds and meaningful units.","ازدواجية البنية"],["Cultural transmission","Language is learned from the community, not inherited.","النقل الثقافي"],["Discreteness","Language is made of distinct units.","التمايز"],["Mutability","The grammars of all languages change over time.","قابلية التغيّر"]],"intro":[],"ex":[]},{"h":["Functions of language","وظائف اللغة"],"pts":[["Passing on information = [[**transactional**|en.l18-functions]] function; expressing social relations = **interactional**.","تبادلية / تفاعلية","o"],["'Nice weather, isn't it?' = phatic communication; functionalists: language developed to **communicate**.","اتصالية"]],"t":[["Transactional function","Language used to convey information/content.","تبادلية"],["Interactional function","Language used to establish and maintain social relationships.","تفاعلية"],["Phatic communication","Language used for social contact rather than information.","اتصالية"],["Utterance","A spoken word or sentence; a unit of verbal communication.","ملفوظ"]],"intro":[],"ex":[]},{"h":["History and sources of English","تاريخ الإنجليزية ومصادر كلماتها"],"pts":[["English is **Germanic** (Indo-European); Spanish, Portuguese, Italian = Romance; Arabic = Semitic.","جرمانية"],["[[Old English|en.l18-history]] → Middle English (after the **Norman Conquest 1066**) → Early Modern (Shakespeare, printing) → Modern.","مراحل الإنجليزية"],["café → French; scientific terms → **Greek and Latin**; alcohol, algebra, sugar → **Arabic** (borrowing).","مصادر الكلمات"],["Everyday words (the, be, have) are **Germanic**; most dictionary words come from Latin/French.","الأكثر استخداماً جرمانية"]],"t":[["Indo-European","The language family that includes the Germanic and Romance branches.","هندو-أوروبية"],["Germanic","The branch of Indo-European that includes English, German and Dutch.","جرمانية"],["Romance languages","Languages descended from Latin: Spanish, Portuguese, Italian, French.","رومانسية"],["Norman Conquest (1066)","Event that brought many French words into English.","الغزو النورماندي"],["Great Vowel Shift","A major change in English long-vowel pronunciation (1400–1700).","التحول الصوتي الكبير"]],"intro":[],"ex":[]},{"h":["Varieties of language","تنوعات اللغة"],"pts":[["[[**Dialect**|en.l18-varieties]] = grammar, vocabulary and pronunciation; **accent** = pronunciation only.","لهجة / لكنة"],["Simplified contact language with no native speakers = **pidgin**; a pidgin that became a first language = **creole**.","هجين / كريول"],["ELF focuses on **intelligibility**; Saudi Arabia is in Kachru's **expanding circle**.","الوضوح / الدائرة المتسعة"],["A map line separating areas with different language features = **isogloss**.","خط تساوي الظاهرة"],["British vs American: colour/color (Americans write **-or**), petrol/gasoline, lift/elevator.","بريطاني / أمريكي"]],"t":[["Dialect","A variety differing in grammar, vocabulary and pronunciation.","لهجة"],["Accent","A variety differing only in pronunciation.","لكنة"],["Idiolect","An individual's personal way of speaking.","لغة الفرد"],["Register","Language variety according to situation and formality.","مستوى الخطاب"],["Pidgin","A simplified contact language with no native speakers.","هجين"],["Creole","A pidgin that has become the first language of a community.","كريول"],["Lingua franca","A common language used between speakers of different L1s.","لغة مشتركة"],["Isogloss","A boundary line on a map between areas with different language features.","خط تساوي الظاهرة"],["Kachru's three circles","Inner (UK, US), outer (India, Nigeria), expanding (Saudi Arabia, China).","دوائر كاتشرو"]],"intro":[],"ex":[]},{"h":["Theories of the origin of language (Yule)","نظريات أصل اللغة عند يول"],"pts":[["Each [[theory|en.l18-origins]] picks one possible source; none can be proven — there is **no direct physical evidence** of the earliest speech.","كلها بلا دليل مباشر"]],"t":[["Divine source","The theory that language was given to humans by God.","المصدر الإلهي"],["Bow-wow theory","Natural sound source: words began as imitations of natural sounds.","نظرية محاكاة الأصوات"],["Onomatopoeia","Words that imitate the sounds associated with what they refer to (buzz, splash).","محاكاة صوتية"],["Pooh-pooh theory","Language began from instinctive emotional cries.","نظرية صيحات الانفعال"],["Yo-heave-ho theory","Language began from sounds made during collective physical work.","نظرية العمل الجماعي"],["Oral-gesture theory","Language developed from a link between hand gestures and mouth movements.","نظرية الإيماءة الفموية"],["Physiological adaptation","The evolution of human speech organs and brain features that make speech possible.","التكيف الفسيولوجي"],["Innateness hypothesis","The genetic-source view that humans are born with a capacity for language.","فرضية الفطرية"]],"ex":[],"map":{"type":"tree","title":["Origin of Language (Yule)","⁧نظريات نشأة اللغة⁩"],"groups":[{"n":"Divine source","ar":"⁧المصدر الإلهي⁩","idea":"⁧اللغة هبة من الله⁩","items":[{"n":"Isolation experiments","ar":"⁧تجارب عزل الأطفال لم تعطِ دليلاً موثوقاً⁩"}]},{"n":"Bow-wow","ar":"⁧محاكاة الطبيعة⁩","idea":"⁧الكلمات الأولى قلّدت أصوات الطبيعة⁩","items":[{"n":"cuckoo · splash · bang","ar":"onomatopoeia"},{"n":"Problem","ar":"⁧كلمات المحاكاة قليلة، والمجرد لا صوت له⁩"}]},{"n":"Pooh-pooh","ar":"⁧صيحات الانفعال⁩","idea":"⁧صيحات غريزية: Ouch! Ah! Wow!⁩","items":[{"n":"Problem","ar":"⁧تُنطق بأصوات تختلف عن أصوات الكلام العادي⁩"}]},{"n":"Yo-heave-ho","ar":"⁧العمل الجماعي⁩","idea":"⁧people working together: أصوات العمل المشترك صارت لغة⁩","items":[{"n":"Problem","ar":"⁧يفسر السياق الاجتماعي لا أصل الأصوات⁩"}]},{"n":"Oral-gesture","ar":"⁧الإيماءة الفموية⁩","idea":"⁧اللسان والفم يحاكيان إيماءات اليد⁩","items":[{"n":"Gesture → mouth","who":"Paget","ar":"⁧ربط الإيماءة بحركة الفم⁩"}]},{"n":"Physical (physiological) adaptation","ar":"⁧التكيف الجسدي⁩","idea":"⁧أسنان قائمة، شفاه مرنة، لسان رشيق، حنجرة منخفضة⁩","items":[{"n":"Lateralised brain","ar":"⁧اللغة غالباً في النصف الأيسر⁩"},{"n":"Tool-making","ar":"⁧وظائف الدماغ نفسها⁩"}]},{"n":"Genetic source","ar":"⁧المصدر الوراثي⁩","idea":"⁧قدرة فطرية موروثة⁩","items":[{"n":"Innateness hypothesis","who":"Chomsky","ar":"⁧تفسر سرعة اكتساب الطفل⁩"}]}]},"intro":[]},{"h":["Saussure and definitions of language","سوسير وتعريفات اللغة"],"pts":[["[[Ferdinand de Saussure|en.l18-saussure]], founder of modern **structural linguistics** (Course in General Linguistics, 1916, published after his death).","مؤسس اللسانيات البنيوية"],["Classic [[definitions|en.l18-defs]]: **Sapir** (purely human, non-instinctive symbols), Hall (habitual oral-auditory symbols), Chomsky (a set of sentences).","تعريفات سابير وهول وتشومسكي"]],"t":[["Linguistic sign","Saussure's unit combining a signifier (form) and a signified (concept).","العلامة اللغوية"],["Signifier","The form of a sign: its sound-image or written form.","الدال"],["Signified","The concept or meaning a sign refers to.","المدلول"],["Synchronic linguistics","Studying a language as a system at a particular point in time.","اللسانيات التزامنية"],["Diachronic linguistics","Studying how a language changes over time.","اللسانيات التعاقبية"],["Syntagmatic relations","Relations between linguistic units that combine in sequence.","علاقات تركيبية"],["Paradigmatic relations","Relations between units that can substitute for each other in the same position.","علاقات استبدالية"]],"intro":[],"ex":[],"map":{"type":"fan","title":["Saussure's Key Pairs","⁧ثنائيات سوسير⁩"],"groups":[{"n":"Linguistic sign","ar":"⁧دال (الصورة الصوتية ⁦/triː/⁩) + مدلول (المفهوم)، والعلاقة **اعتباطية**⁩","items":[{"n":"signifier"},{"n":"signified"}],"d":"en.l18-saussure"},{"n":"Synchronic / Diachronic","ar":"⁧اللغة في لحظة واحدة / تغيّرها عبر الزمن⁩","d":"en.l18-saussure"},{"n":"Syntagmatic / Paradigmatic","ar":"⁧أفقية: تتابع (the + cat + sat) / رأسية: استبدال في الموضع (cat / dog / bird)⁩","d":"en.l18-saussure"},{"n":"Langue / Parole","ar":"⁧النظام المشترك / الاستعمال الفعلي⁩","d":"en.l18-saussure"}]}},{"h":["More of Hockett's design features","المزيد من سمات هوكيت"],"pts":[["[[**Interchangeability**|en.l18-hockett2]]: anyone can send and receive; **total feedback**: speakers monitor their own messages.","تبادل الأدوار والتغذية الراجعة"],["Specialisation: speech serves communication only; **semanticity**: signals have fixed meanings.","التخصص والدلالية"],["Vocal-auditory channel; **rapid fading**: spoken signals disappear quickly.","القناة الصوتية والزوال السريع"],["Later additions: **prevarication** (lying, imagining), **reflexiveness** (language about language), learnability.","الكذب والانعكاسية وقابلية التعلم"]],"t":[["Interchangeability","Any user of a language can both send and receive messages.","التبادلية"],["Total feedback","Speakers can hear and monitor what they themselves say.","التغذية الراجعة الكاملة"],["Specialisation","Linguistic signals have communication as their only function.","التخصص"],["Semanticity","Linguistic signals have specific, fixed meanings.","الدلالية"],["Rapid fading","Spoken signals are transitory and quickly disappear.","الزوال السريع"],["Prevarication","The ability to say things that are false, misleading or imaginary.","القدرة على الكذب"],["Reflexiveness","The ability to use language to talk about language itself.","الانعكاسية"]],"intro":[],"ex":[]},{"h":["Standard varieties and social variation","الأنماط المعيارية والتنوع الاجتماعي"],"pts":[["**Standard English** (education, publishing, media) is defined by grammar and vocabulary; any accent can carry it.","المعيارية تخص القواعد والمفردات"],["**RP** = the prestige non-regional British accent; General American (GA) = the broad US standard accent.","البريطاني المعياري والأمريكي العام"],["RP is [[**non-rhotic**|en.l18-rpga]] (car /kɑː/); GA is **rhotic** (car /kɑr/) and often flaps the t in 'water'.","نطق الراء بعد الصائت"],["Sociolect = a social group's variety; slang = informal group words; jargon = professional vocabulary; **speech community** = shared norms.","لهجة اجتماعية، عامية، مصطلحات مهنية"]],"t":[["Standard English","The prestige variety of English used in formal writing, education and media.","الإنجليزية المعيارية"],["Received Pronunciation (RP)","The prestige, non-regional ac
