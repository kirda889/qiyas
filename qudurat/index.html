   <div class="sheet stack"><h3>تقريرك</h3><p class="small muted">انسخه واحتفظ به لتتابع تقدمك من أسبوع لأسبوع.</p>
     <textarea class="report" id="report" readonly>${esc(reportText())}</textarea><div><button class="btn sm" data-act="copyReport">انسخ التقرير</button></div></div>
   <div class="sheet stack"><h3>تصفير التقدم</h3><p class="small muted">يمسح كل الإجابات والدروس والاختبارات من هذا الجهاز.</p>
     ${resetAsk?`<div class="confirm row"><span>متأكد؟ ما تقدر ترجعه.</span><button class="btn sm" data-act="resetYes" style="background:var(--bad);border-color:var(--bad)">نعم، صفّر</button><button class="btn sm quiet" data-act="resetNo">لا</button></div>`:`<div><button class="btn sm quiet" data-act="resetAsk">تصفير…</button></div>`}</div>
   <p class="small muted">أسئلة البنك تدريبية محاكية لأسلوب الاختبار، والدروس مبنية على المهارات التي يقيسها اختبار القدرة المعرفية للجامعيين. توزيع المحاكيات على المجالات تقريبي، لأن الأوزان الرسمية غير منشورة.</p>
  </section>`;
}
let resetAsk=false;

/* ---------- render ---------- */
/* الاختبار الشغّال يُحفظ في الجهاز (يوسف 2026-11-03، و24 ساعة + البنك + الإنجليزي 2 في 2026-11-05): كان في ذاكرة الصفحة بس، فلو انعادت تحميلها (الجوال يقفل الصفحة الثقيلة لما
   يطلع العميل لتطبيق ثاني، أو المتصفح الداخلي) يرجع للرئيسية ويضيع الحل. الحين يرجع لنفس السؤال بنفس الإجابات خلال 24 ساعة من آخر نشاط.
   المؤقت يوقف والعميل برّا الصفحة، وإلا الـ24 ساعة ما لها معنى في الاختبار الموقوت (التشخيصي 40 دقيقة كان ينحذف بعد 40 دقيقة). */
const SES_TTL=24*3600e3;
function saveSes(){try{if(session&&!session.done&&session.ids&&session.ids.length>1)localStorage.setItem(LS_KEY+".ses",JSON.stringify({s:session,at:Date.now()}));else localStorage.removeItem(LS_KEY+".ses")}catch(e){}}
function loadSes(){try{const x=JSON.parse(localStorage.getItem(LS_KEY+".ses")||"null"); if(!x||!x.s||x.s.done||Date.now()-x.at>SES_TTL||!x.s.ids.every(id=>QBY[id])||(x.s.kind==="bank"&&x.s.ids.length!==bankIds(x.s.dom||"all").length)){localStorage.removeItem(LS_KEY+".ses");return false}
  session=x.s; session.confirm=false; if(session.mode==="exam")session.end=Date.now()+Math.max(0,session.end-x.at); route={name:"quiz"}; setTimeout(()=>toast("رجّعناك لمكانك: السؤال "+AR(session.i+1)+" من "+AR(session.ids.length)),600); return true}catch(e){return false}}
let hidAt=0;
document.addEventListener("visibilitychange",()=>{if(document.hidden){hidAt=Date.now();saveSes()}else if(hidAt){if(session&&session.mode==="exam"&&!session.done){session.end+=Date.now()-hidAt;saveSes()}hidAt=0}});
addEventListener("pagehide",saveSes);
function render(){
  renderNav();
  const v=document.getElementById("view");
  const r=route.name;
  v.innerHTML = r==="plan"?viewPlan(): r==="lessons"?viewLessons(): r==="lesson"?viewLesson(route.id): r==="practice"?viewPractice():
    r==="quiz"?viewQuiz(): r==="cards"?viewCards(): r==="sheet"?viewSheet(): r==="settings"?viewSettings(): viewHome();
  renderSync();
  document.body.dataset.route=r; if(window.QX&&QX.dock){ QX.undock(); /* قدرات الجامعيين: بلا فقاعة الدروس، فللعرض بالشرائح أزرار تنقل وقائمة دروس، والفقاعة كانت تغطيها في الجوال */ fitLF(); if(QX.qdock){ if(r==="quiz"&&session&&!session.done&&session.ids.length>1) QX.qdock(qdockData()); else QX.unqdock(); } }
  const bq=document.getElementById("backq"); if(bq) bq.hidden=!(r==="lesson"&&backQ&&session);
  if(r==="quiz"&&session&&session.mode==="exam"&&!session.done){ if(!timerId) timerId=setInterval(tickTimer,1000); tickTimer(); }
  saveSes();
}
/* ---------- report a question (sent to GoatCounter as an event; hidden until configured) ---------- */
const GC_CODE = (window.SITE_CFG && window.SITE_CFG.gc) || "";
let reportOpen = null;
/* ردّنا على البلاغات (2026-10-24): البلاغ يصل بلا اسم، فالرد يظهر تحت الشرح لكل من يرى السؤال. window.QREPLY[id] = [التاريخ، النص] في src/q_replies.js */
function replyUI(q){const r=(window.QREPLY||{})[q.id];return r?`<div class="qreply"><b>ردّنا على البلاغات <span>· ${esc(r[0])}</span></b>${String(r[1]).split("\n").map(s=>`<div dir="auto">${esc(s)}</div>`).join("")}</div>`:""}
function reportUI(q){
  if(reportOpen!==q.id) return replyUI(q)+`<button class="btn sm quiet" data-act="reportOpen" data-id="${q.id}" style="margin-top:6px">بلّغ عن خطأ في السؤال</button>`;
  return replyUI(q)+`<div class="row" style="margin-top:8px"><span class="small muted">وش المشكلة؟</span>${[["key","الإجابة غلط"],["unclear","السؤال غير واضح"],["typo","خطأ إملائي"]].map(([k,l])=>`<button class="chip" data-act="reportSend" data-id="${q.id}" data-v="${k}" style="background:none;cursor:pointer">${l}</button>`).join("")}</div>`;
}
const SITE_ID = "qudurat";
let toastT=null;
function toast(m){let el=document.getElementById("toast"); if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)} el.textContent=m; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true},2200)}

/* ---------- events ---------- */
function openTask(id){
  const t=planTasks().find(x=>x.id===id); if(!t) return;
  if(t.type==="lesson") return go({name:"lesson",id});
  if(t.type==="test") return startTest(id);
  if(t.type==="final") return go({name:"sheet"});
  if(t.type==="review"){ S.tasks[id]=true; save(); if(reviewDue().length) return startReview(); toast("ما عندك أخطاء مستحقة، كمّل الخطة"); return render() }
}
window.QXEV=function(n,t){try{if(/localhost|127\.0\.0\.1/.test(location.hostname))return; if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:n+"/"+SITE_ID,event:true});const u="https://api.yousefalshamrani.com/v1/ev",b=t?JSON.stringify({n:n+"/"+SITE_ID,t:t}):n+"/"+SITE_ID; if(navigator.sendBeacon)navigator.sendBeacon(u,b); else fetch(u,{method:"POST",body:b,keepalive:true})}catch(e){}};
/* 2026-11-07 (التسويق): نسخة «مرة لكل جهاز» لفتح التطبيق وبدء البنك، مثل finish_bank_u؛ العدّ القديم باقٍ */
(function(){const f=window.QXEV;window.QXEV=function(n,t){f(n,t);if(n==="view_app"||n==="start_bank"){try{const k="qx.u."+n+"_u/"+SITE_ID;if(!localStorage.getItem(k)){localStorage.setItem(k,"1");f(n+"_u")}}catch(e){}}}})();
function startTest(k){if(window.PW&&PW.gate("test:"+k))return; if(k==="diag")QXEV("start_diag"); if(k==="free60")QXEV("start_free60");const T=TESTS[k]; if(!T.ids.length){toast("لا توجد أسئلة بعد");return} startSession({mode:T.practice?"practice":"exam",kind:"test",ref:k,title:T.title,ids:T.ids.slice(),min:T.min})}
function startReview(){const due=shuffle(reviewDue()).slice(0,30); if(!due.length){toast("ما فيه أخطاء مستحقة اليوم");return} startSession({mode:"practice",kind:"review",title:"مراجعة الأخطاء",ids:due.map(q=>q.id)})}
function startDaily(){
  const seed=hash(todayStr()); const out=[];
  SORDER.forEach((sd,i)=>{const pool=quizPool(q=>q.std===sd&&!q.of); const k=Math.max(1,Math.round(10*STDW[sd]/100)); out.push(...shuffle(pool,seed+i).slice(0,k))});
  const ids=shuffle(out,seed).slice(0,10).map(q=>q.id); if(!ids.length){toast("لا توجد أسئلة بعد");return}
  startSession({mode:"practice",kind:"daily",title:"سؤال اليوم ×10 · "+fmtDate(todayStr()),ids});
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,a"); if(!b) return;
  const ds=b.dataset;
  if(ds.go){ if(ds.go==="cards") fc=null; return go({name:ds.go}) }
  if(ds.lesson){ if(route.name==="quiz"&&session&&b.closest(".explain,.ritem")) backQ={y:window.scrollY};
    /* قدرات الجامعيين (يوسف 2026-11-14 آخر الليل): الدرس المفتوح صفحة تمرير مستقلة بملء الشاشة (l/<الدرس>.html)؛ المقفل يبقى بطاقة القفل.
       مفتاح الدروس المقفلة QDK يُحفظ للصفحة (نفس النطاق) لأنها لم تعد إطاراً داخل التطبيق، والمسار يُحفظ «الدروس» فالرجوع لا يعيد التحويل */
    const L=LBY[ds.lesson]; if(L&&!(window.PW&&PW.locked(L.id))){ try{ if(window.QDK) localStorage.setItem("qx.qdk.qudurat",window.QDK); localStorage.setItem(LS_KEY+".route",JSON.stringify({name:"lessons"})) }catch(e){} location.href="l/"+L.deck+".html"+(window.QD_V?"?v="+window.QD_V:""); return }
    return go({name:"lesson",id:ds.lesson}) }
  if(ds.std){ const l=LESSONS.find(x=>x.std===ds.std); if(l) return go({name:"lesson",id:l.id}); return }
  if(ds.openTask) return openTask(ds.openTask);
  if(ds.pr){ if(ds.pr==="hot") pr.hot=!pr.hot; else pr[ds.pr]= ds.pr==="n"?+ds.v:ds.v; return render() }
  if(ds.jump!=null){ if(!session||session.done) return; const fromDock=!!b.closest(".qx-dk"); /* قبل render: الفقاعة تُعاد رسمها فيخرج الزر من الصفحة */ session.i=+ds.jump; session.confirm=false; bankSave(); render(); if(fromDock) window.scrollTo(0,0); return }
  if(ds.opt!=null && session && !session.done){
    const q=QBY[session.ids[session.i]], i=+ds.opt;
    if(session.mode==="practice"){ if(session.ans[q.id]!=null) return; session.ans[q.id]=i; recordAnswer(q.id,i===q.a); save(); }
    else { session.ans[q.id]=i; }
    render(); if(session.mode==="practice") revealNext(); return;
  }
  const a=ds.act; if(!a) return;
  const s=session;
  switch(a){
    case "lmode": LMODE=ds.v==="full"?"full":"quick"; try{localStorage.setItem("qx.lmode",LMODE)}catch(e){} render(); break;
    case "backQuiz":{const y=backQ?backQ.y:0; go({name:"quiz"}); requestAnimationFrame(()=>window.scrollTo(0,y)); break}
    case "reportOpen": reportOpen=ds.id; render(); break;
    case "reportSend":{const q=QBY[ds.id]; let ok=false; try{ fetch("https://api.yousefalshamrani.com/v1/ev",{method:"POST",body:JSON.stringify({n:"report/"+SITE_ID+"/"+q.l+"/"+q.id+"/"+ds.v,t:String(q.q).slice(0,180)}),keepalive:true}); ok=true }catch(e){}
      toast(ok?"شكراً، وصل البلاغ":"تعذّر إرسال البلاغ الآن"); reportOpen=null; render(); break}
    case "theme":{const n=isDark()?"light":"dark"; document.documentElement.dataset.theme=n; try{localStorage.setItem(THEME_KEY,n)}catch(e){}; renderTheme(); break}
    case "setExam":{const v=document.getElementById("examDate").value; if(!v){toast("اختر التاريخ أولاً");return} S.exam=v; if(diffDays(S.start,v)<1) S.start=todayStr(); save(); toast("حُفظ الموعد"); render(); break}
    case "planPick":{const pn=document.getElementById("pdPanel"); if(pn){pn.hidden=!pn.hidden; b.setAttribute("aria-expanded",String(!pn.hidden)); if(!pn.hidden){const r=document.getElementById("pdRange"); if(r) r.focus({preventScroll:true})}} break;}
    case "planStep": setPlanDays(planDays()+(+b.dataset.d||0)); break;
    case "planSet": setPlanDays(+b.dataset.n); break;
    case "restartPlan": S.start=todayStr(); save(); toast("بدأت الخطة من اليوم"); render(); break;
    case "lessonQuiz":{if(window.PW&&PW.gate("lesson:"+ds.id))break;const ids=shuffle(QS.filter(q=>q.l===ds.id&&!q.m&&!q.h).map(q=>q.id)); if(!ids.length){toast("لا توجد أسئلة لهذا الدرس بعد");return} startSession({mode:"practice",kind:"lesson",ref:ds.id,title:LBY[ds.id].ar,ids}); break}
    case "lessonCards": if(window.PW&&PW.gate("lesson:"+ds.id))break; startCards(ds.id); break;
    case "cardsAll": startCards(null); break;
    case "cardsAgain": startCards(fc&&fc.lesson); break;
    case "cardsHome": fc=null; render(); break;
    case "flip": fc.flip=!fc.flip; render(); break;
    case "cardYes": case "cardNo":{const id=fc.ids[fc.i]; const st=S.terms[id]||(S.terms[id]={b:0});
      if(a==="cardYes"){st.b=Math.min((st.b||0)+1,5); st.due=addDays(todayStr(),INT[st.b]); fc.known++} else {st.b=0; st.due=addDays(todayStr(),1)}
      fc.i++; fc.flip=false; save(); render(); break}
    case "quick":{
      const isStd=pr.dom.startsWith("s");
      let pool=quizPool(q=>!q.of&&(pr.dom==="all"||(isStd?q.std===pr.dom.slice(1):q.d===pr.dom))&&(!pr.hot||q.h));
      if(pr.dom==="all"&&!pr.hot){ const out=[]; SORDER.forEach(sd=>{const n=Math.max(1,Math.round(pr.n*STDW[sd]/100)); out.push(...shuffle(pool.filter(q=>q.std===sd)).slice(0,n))}); pool=out }
      const ids=shuffle(pool).slice(0,pr.n).map(q=>q.id); if(!ids.length){toast("ما فيه أسئلة بهذا الفلتر");return}
      startSession({mode:"practice",kind:"quick",title:"تدريب سريع",ids}); break}
    case "daily": startDaily(); break;
    case "similar":{const ids=window.PW?PW.similar.filter(id=>QBY[id]):shuffle(QS.filter(q=>q.h&&!q.of&&hOK(q)).map(q=>q.id)).slice(0,20); if(!ids.length)break; startSession({mode:"practice",kind:"similar",title:"أسئلة من الاختبارات الماضية (مماثلة)",ids}); break}
    case "review": startReview(); break;
    case "test": startTest(ds.id); break;
    case "bankDom": bankDom=ds.v; render(); break;
    case "bankLock": if(window.PW)PW.open("بقية "+BANK_LABEL,"single"); break;
    case "plusLock": if(window.PW)PW.open("كامل أسئلة الخمس سنوات الماضية (مماثلة)","plus"); break;
    case "plusUp": plusBox=!plusBox; render(); break;
    case "plusCode":{const c=String((document.getElementById("upc")||{}).value||"").toUpperCase().replace(/[^A-Z0-9]/g,""); if(c.length<8){toast("اكتب الكود كاملاً");break} try{localStorage.setItem("qx.code."+TIER_C.site,c);localStorage.setItem("qx.code.last",c)}catch(e){} location.reload(); break}
    case "mzLock": if(window.PW)PW.open("ملزمة أهم 120 سؤالاً"); break;
    case "mzGet": mzGet(b); break;
    case "sumGet": bookView(b, window.SUM, "summary"); break;
    case "sumLock": if(TIER_C){plusBox=true; go({name:"practice"})} else if(window.PW)PW.open("ملزمة الشرح المفصّلة"); break;
    case "sumlGet": bookView(b, window.SUML, "summary_light"); break;
    case "sumlLock": if(window.PW)PW.open("ملزمة الشرح المختصرة"); break;
    case "qlist":{const p=document.querySelector(".qx-dkq .qx-dkp"); if(p) p.click(); break;}   // عدّاد السؤال يفتح قائمة الأسئلة (الفاحص ج4: الفقاعة العائمة كانت تغطي نصاً)
    case "bankStart":{const ids=bankIds(bankDom); if(!ids.length)break; QXEV("start_bank"); const bp=bankPos(); startSession({mode:"practice",kind:"bank",title:BANK_LABEL,ids,dom:bankDom}); if(bp&&bp.dom===bankDom&&bp.i>0&&bp.i<ids.length&&ds.v!=="restart"){session.i=bp.i; render()} break}
    case "next": s.i=Math.min(s.i+1,s.ids.length-1); s.confirm=false; bankSave(); render(); window.scrollTo(0,0); break;
    case "prev": s.i=Math.max(0,s.i-1); s.confirm=false; bankSave(); render(); window.scrollTo(0,0); break;
    case "flag":{const id=s.ids[s.i]; s.flags[id]=!s.flags[id]; render(); break}
    case "askSubmit": s.confirm=true; render(); break;
    case "cancelSubmit": s.confirm=false; render(); break;
    case "submit": case "finish": finishSession(); break;
    case "quitQuiz": bankSave(); if(s&&s.mode==="exam"&&!s.done){ if(!s.confirm){s.confirm=true;render();toast("سلّم الاختبار أو ارجع له");return} } stopTimer(); session=null; go({name:"practice"}); break;
    case "retryWrong":{const ids=s.ids.filter(id=>s.ans[id]!==QBY[id].a); startSession({mode:"practice",kind:"retry",title:"إعادة الأخطاء",ids:shuffle(ids)}); break}
    case "markFinal": S.tasks.final=true; save(); toast("ممتاز"); render(); break;
    case "copyReport":{const t=reportText(); const ta=document.getElementById("report");
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("نُسخ التقرير")).catch(()=>{ta.focus();ta.select();toast("حدّد النص وانسخه")}); break}
    case "resetAsk": resetAsk=true; render(); break;
    case "resetNo": resetAsk=false; render(); break;
    case "resetYes": resetAsk=false; S=freshState(); save(); toast("تم التصفير"); go({name:"home"}); break;
  }
});
document.addEventListener("keydown",e=>{
  if(route.name!=="quiz"||!session||session.done) return;
  const k=e.key.toUpperCase(); const map={A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3,"1":0,"2":1,"3":2,"4":3};
  if(k in map && !e.metaKey && !e.ctrlKey){const btn=document.querySelector(`[data-opt="${map[k]}"]`); if(btn&&!btn.disabled) btn.click()}
  if(e.key==="Enter"){const nb=document.querySelector('[data-act="next"],[data-act="finish"]'); if(nb) nb.click()}
});

/* ---------- boot ---------- */
function start(data){
  if(data&&data.session){session=data.session; if(data.route) route=data.route}
  else if(data&&data.route) route=data.route;
  if(data&&data.fc) fc=data.fc;
  const resumed=loadSes();
  render(); initRemote(); try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){} if(window.QXEV) QXEV(window.PW?"view_app":"view_app_full");
  addEventListener("qx-deep",()=>{if(route.name==="lesson")render()});
  addEventListener("qx-data",e=>{if(e.detail==="lesson"){applyLesson(); if(route.name==="lesson")render(); return} applyLazy(); if(e.detail==="quick"?route.name==="lesson":(session&&!session.done)||route.name!=="home")render()});
  if(session) needWhy();   // الشروح الموسعة تصل بعد الفتح (deep.js)
  // رابط مباشر للتشخيصي من صفحة الاختبار السريع والمنشورات: ‎…/#diag
  if(resumed&&/^#(diag|bank|questions)$/.test(location.hash)){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}   // فتح نفس الرابط مرة ثانية ما يبدأ من الصفر
  else if(location.hash==="#diag"){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} startTest("diag")}
  // روابط القروبات (2026-10-21): ‎#questions يفتح تبويب الأسئلة، ‎#bank يبدأ الأسئلة المشابهة مباشرة
  else if(["#home","#plan","#lessons"].includes(location.hash)){const r=location.hash.slice(1); try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} go({name:r})}
  else if(location.hash==="#questions"){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} go({name:"practice"})}
  else if(location.hash==="#bank"){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} const ids=bankIds("all"); if(ids.length){QXEV("start_bank");startSession({mode:"practice",kind:"bank",title:BANK_LABEL,ids})} else go({name:"practice"})}
  // رابط مباشر لدرس من الاختبار السريع وصفحات الشرح: ‎…/#lesson-L07
  else{const m=/^#lesson-(L\d+)$/.exec(location.hash); if(m&&LBY[m[1]]){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} go({name:"lesson",id:m[1]})}}
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({route,session,fc}));
if(hot&&hot.ready) hot.ready(start); else start(hot&&hot.data||{});
