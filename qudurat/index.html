/* Layout: a teacher's planning register — chalk-green ink on cool off-white, a brass highlight for key terms, bubble answer sheet for exams. Fully RTL. */
:root{

}

  --paper:#0F1512; --sheet:#171F1B; --ink:#E6ECE8; --muted:#B3C0BA; --rule:#27332D; --rule-strong:#36453E;
  --accent:#5BC093; --accent-ink:#062116; --accent-soft:#17312A; --accent-text:#5BC093;
  --hl:#5A4A1C; --hl-ink:#FFF0C2;
  --good:#5CC48D; --good-soft:#15301F; --bad:#F2867A; --bad-soft:#3A1A17; --warn:#E3A84A;
  --dV:#E0A54C; --dQ:#5BC093; --dR:#7FA6E8; --dF:#E08AB4; --dZ:#A7ABA3;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F1512; --sheet:#171F1B; --ink:#E6ECE8; --muted:#B3C0BA; --rule:#27332D; --rule-strong:#36453E;
  --accent:#5BC093; --accent-ink:#062116; --accent-soft:#17312A; --accent-text:#5BC093;
  --hl:#5A4A1C; --hl-ink:#FFF0C2;
  --good:#5CC48D; --good-soft:#15301F; --bad:#F2867A; --bad-soft:#3A1A17; --warn:#E3A84A;
  --dV:#E0A54C; --dQ:#5BC093; --dR:#7FA6E8; --dF:#E08AB4; --dZ:#A7ABA3;

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
#app{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
strong{font-weight:600;background:linear-gradient(transparent 60%,var(--hl) 60%);padding:0 .08em}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.5;text-wrap:balance;margin:0}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);margin-inline:-16px;padding:10px 16px}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .seal{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.95rem;flex:none}
.brand b{font-family:var(--f-display);font-weight:600;font-size:1rem;white-space:nowrap}
.brand span{display:block;font-size:.74rem;color:var(--muted);line-height:1.3;white-space:nowrap}
.count{margin-inline-start:auto;text-align:center;line-height:1.1}
.count .n{font-family:var(--f-mono);font-size:1.25rem;font-weight:700;color:var(--accent-text,var(--accent))}
.count .l{font-size:.78rem;color:var(--muted)}
.nav{display:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar:empty{min-height:calc(67px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:4px 0;border-radius:8px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
@media (min-width:760px){
  .tabbar{display:none}
  .nav{display:flex;gap:4px;margin-inline-start:18px}
  .nav button{background:none;border:0;padding:6px 12px;border-radius:999px;color:var(--muted);font-size:.92rem}
  .nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #app{padding-bottom:60px}
}

/* sheets & cards */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.section-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.section-title h2{font-size:1.08rem}
.section-title .line{flex:1;height:1px;background:var(--rule-strong)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 20px;font-weight:600;font-size:.95rem;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--rule-strong);color:var(--ink);font-weight:500}
.btn.sm{padding:6px 14px;min-height:36px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.76rem;border:1px solid var(--rule-strong);color:var(--muted);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.done{border-color:var(--good);color:var(--good)}
.chip.hot{border-color:var(--warn);color:var(--warn)}
.code{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);direction:ltr;unicode-bidi:isolate}

/* home */
.today{display:grid;gap:14px}
.today .kicker{font-size:.8rem;color:var(--muted)}
.today h1{font-size:1.4rem}
.domains{display:grid;gap:10px}
.dom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.dom .name{display:flex;gap:8px;align-items:center;min-width:0}
.dom .name b{font-weight:600;font-size:.95rem}
.dom .w{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:10px;border-radius:999px;background:var(--rule);overflow:hidden;position:relative}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--f-mono);font-size:1.45rem;font-weight:600;line-height:1.2}
.stat .k{font-size:.8rem;color:var(--muted)}
.set-date{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.set-date input{border:1px solid var(--rule-strong);background:var(--paper);border-radius:8px;padding:8px 10px;min-height:44px}
.stdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stdc{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;display:grid;gap:4px;text-align:start}
.stdc .sn{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between}
.stdc .st{font-weight:600;font-size:.86rem;line-height:1.5}
.stdc .bar{height:6px}

.tfold{margin:10px 0 2px}.tfold>summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center;font-size:.86rem;font-weight:700;color:var(--accent);border:1px solid var(--rule);border-radius:999px;padding:4px 12px}.tfold>summary::-webkit-details-marker{display:none}.tfold>summary::after{content:"＋";font-weight:400}.tfold[open]>summary::after{content:"－"}.tfold[open] .terms{margin-top:10px}
/* plan */
.plan{display:grid;gap:8px}
.day{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.day .dn{font-family:var(--f-mono);text-align:center;line-height:1.1}
.day .dn b{display:block;font-size:1.15rem}
.day .dn span{font-size:.68rem;color:var(--muted)}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day .what{min-width:0}
.day .what .t{font-weight:600}
.day .what .s{font-size:.82rem;color:var(--muted)}
.day.light{opacity:.85}
.bub{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;flex:none}
.bub.on{background:var(--good);border-color:var(--good)}
.bub.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sheet)}

/* lessons list */
.lgroup{display:grid;gap:8px}
.lcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;text-align:start;width:100%}
.lcard .idx{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);width:34px;text-align:center}
.lcard .t{font-weight:600;line-height:1.5}
.lcard .s{font-size:.82rem;color:var(--muted)}
.dhead{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.dhead .sw{width:12px;height:12px;border-radius:3px}
.dhead h2{font-size:1.05rem}
.dhead .w{margin-inline-start:auto;font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}

/* lesson view */
.lesson-head{display:grid;gap:8px;padding-top:18px}
.goal{border-inline-start:3px solid var(--accent);padding-inline-start:12px}
.qv-tog{display:flex;gap:4px;border-radius:999px;padding:4px;margin:12px 0 2px;background:color-mix(in srgb,var(--accent) 9%,transparent)}.qv-tog button{flex:1;border:0;background:none;border-radius:999px;padding:8px 0;font:inherit;font-size:.9rem;color:var(--muted);cursor:pointer}.qv-tog button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}.qv-more{display:block;width:100%;margin:6px 0 0;padding:11px;border:1px dashed var(--rule);border-radius:14px;background:none;font:inherit;color:var(--accent-text);font-weight:700;cursor:pointer}
.lsec{display:grid;gap:10px;padding:18px 0;border-bottom:1px solid var(--rule)}
.lsec:last-of-type{border-bottom:0}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pts li{border-inline-start:3px solid var(--rule-strong);padding-inline-start:10px;line-height:1.8}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.term{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;min-width:0}
.term .tn{font-weight:600;font-size:.95rem}
.term .td{font-size:.86rem;color:var(--muted);line-height:1.7}
.traps{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:var(--r);padding:14px 16px}
.traps h3{color:var(--bad);margin-bottom:6px}
.traps ul{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.vids{display:grid;gap:8px}
.vid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-decoration:none;color:inherit}
.vid .play{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.vid .vt{font-weight:500;line-height:1.5}
.vid .vc{font-size:.8rem;color:var(--muted)}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;padding:12px 0}
.progress{flex:1;height:6px;background:var(--rule);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;min-width:64px;text-align:center;direction:ltr}
.timer.low{color:var(--bad)}
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qtext{font-size:1.06rem;line-height:1.9;font-weight:500;white-space:pre-line}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:start;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:.98rem;line-height:1.6;min-height:48px;width:100%}
.opt .b{width:28px;height:28px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;font-family:var(--f-display);font-size:.85rem;font-weight:600;color:var(--muted);flex:none}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .b{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .b{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt:disabled{cursor:default}
.opt .why{display:block;margin-top:5px;font-size:.84rem;line-height:1.6;color:var(--muted)}
.opt.wrong .why{color:var(--ink)}
.why-r{margin:4px 0 2px;color:var(--ink)}.why-r b{color:var(--bad);display:inline}
.explain{margin-top:14px;border-radius:10px;padding:12px 14px;border:1px solid var(--rule)}
.explain.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.explain.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.explain b{display:block;margin-bottom:2px}
.mm{font-weight:400;font-size:.8em;opacity:.85}
.qreply{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);border-inline-start:3px solid var(--accent);font-size:.92em;line-height:1.7}
.qreply b{display:block;margin-bottom:2px}.qreply b span{font-weight:400;color:var(--muted)}
.qnav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.grid88{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.gq{height:34px;border-radius:50%;border:1.5px solid var(--rule-strong);background:var(--sheet);font-family:var(--f-mono);font-size:.72rem;color:var(--muted);padding:0}
.gq.ans{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.gq.cur{outline:2px solid var(--accent);outline-offset:2px}
.gq.flag{border-color:var(--warn);border-width:3px}
.confirm{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px}

/* results */
.score{display:flex;align-items:baseline;gap:10px}
.score .big{font-family:var(--f-mono);font-size:3rem;font-weight:600;line-height:1}
.rlist{display:grid;gap:10px}
.ritem{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.ritem .qtext{font-size:.95rem}
.ans-line{font-size:.9rem}
.ans-line .y{color:var(--bad);text-decoration:line-through}
.ans-line .c{color:var(--good);font-weight:600}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.mode{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px;text-align:start;display:grid;gap:6px;align-content:start;width:100%}
.mode .mt{font-family:var(--f-display);font-weight:600;font-size:1rem}
.mode .md{font-size:.85rem;color:var(--muted);line-height:1.7}
.mode .mx{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:.85rem;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* flashcards */
.fc{perspective:1200px}
.fc-in{position:relative;min-height:220px;border-radius:14px;border:1px solid var(--rule);background:var(--sheet);box-shadow:var(--shadow);display:grid;place-items:center;padding:24px;text-align:center;cursor:pointer;width:100%}
.fc-front{font-family:var(--f-display);font-size:1.45rem;font-weight:600;line-height:1.5}
.fc-back{font-size:1.08rem;line-height:1.9}
.fc-hint{position:absolute;bottom:10px;inset-inline:0;font-size:.75rem;color:var(--muted)}

/* sheet (night-before) */
.hy{display:grid;gap:14px}
.hy-l{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 16px}
.hy-l h3{font-size:.98rem;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.hy-l ul{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:.93rem}
.tips{display:grid;gap:8px;counter-reset:t}
.tip{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.tip::before{counter-increment:t;content:counter(t);font-family:var(--f-mono);font-weight:600;width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:.8rem}

.sync{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--rule-strong)}

ربعة الأخرى»."],["C01","","في دراسة «إضاءة الفصل»: المتغيّر التابع في الدراسة:",["درجات الطلاب في اختبار الانتباه","لون إضاءة الفصل","عدد الفصول في الدراسة","مدة الأسبوعين قبل الاختبار"],"التابع ما قاسته الباحثة في النهاية: درجات اختبار الانتباه."],["C01","","في دراسة «إضاءة الفصل»: لتعرف المتغيّر المستقل في أي دراسة، تسأل:",["ما الذي غيّره الباحث بين المجموعتين؟","ما الذي قاسه الباحث في نهاية الدراسة؟","ما النتيجة التي وصل إليها الباحث؟","كم عدد أفراد العيّنة في الدراسة؟"],"المستقل يُغيَّر بين المجموعتين، والتابع يُقاس في النهاية."],["C01","","في دراسة «إضاءة الفصل»: أدقّ تلخيص لسطر «فكانت درجات فصول الإضاءة البيضاء أعلى قليلاً»:",["نتيجة الدراسة: فرق صغير لصالح الإضاءة البيضاء","الإضاءة البيضاء تضاعف تركيز الطلاب في الفصل","فرضية الباحثة قبل إجراء الدراسة","المتغيّر الذي قاسته الباحثة"],"السطر يعطي قيمة المقيس بعد الدراسة، فهو نتيجتها، و«قليلاً» تعني أن الفرق صغير."],["F01","","أي الأشكال يملأ الخانة الناقصة في السلسلة؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"العدد: الخطوط تزيد واحداً في كل إطار: 1، ثم 2، ثم 3، ثم الناقص، ثم 5. فالناقص 4 خطوط."],["F01","","النقطة تتحرك في السلسلة. أي الأشكال هو التالي؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"الموضع: النقطة تنتقل زاوية واحدة عكس عقارب الساعة. بعد أسفل اليمين تأتي أعلى اليمين، ثم أعلى اليسار، وهي الخانة الناقصة."],["F01","","الراية تدور في السلسلة. ما الشكل الخامس؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"الدوران: الراية تدور ثُمن دورة (45 درجة) مع عقارب الساعة في كل إطار. فالخامس بعد 135 درجة: 180 درجة، أي مقلوبة رأساً على عقب."],["F01","","أي الأشكال يأتي في الخانة الناقصة من سلسلة المثلثات؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"التظليل: النمط يتكرر كل ثلاثة: مفرغ، ثم مصمت، ثم مصمت. والسادس ثالث الدورة الثانية، فهو مصمت، والسابع بعده مفرغ يبدأ الدورة الثالثة."],["F01","","في السلسلة عنصران يتغيران معاً. أي الأشكال يملأ الخانة الناقصة؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"عنصران: الراية تدور ثُمن دورة عكس عقارب الساعة، والخطوط تنقص واحداً. فالرابع: الراية بعد ثلاثة أثمان عكس العقارب، وخطّان."],["F01","","أي الأشكال يكمل السلسلة في وسطها؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"الانعكاس: الراية تنعكس في كل إطار، فتتناوب بين العلم يميناً والعلم يساراً. والثالث مثل الأول."],["F01","","علامتان تتبادلان موضعيهما، والشكل الأوسط يتغيّر. ما الشكل التالي؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"التبديل: النقطة والحلقة تتبادلان الزاويتين السفليين في كل إطار، والشكل الأوسط يدور: دائرة، ثم مربع، ثم مثلث. فالخامس: النقطة أسفل اليمين، والحلقة أسفل اليسار، والشكل مربع."],["F01","","ما الشكل الخامس في سلسلة الخطوط والحلقة؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"عنصران: الخطوط تزيد واحداً (2، 3، 4، 5)، والحلقة تنتقل زاوية عكس عقارب الساعة. فالخامس: ستة خطوط، والحلقة أعلى اليسار."],["F01","","الطريقة الصحيحة في سلسلة أشكال يتغيّر فيها أكثر من عنصر:",["أفحص كل عنصر وحده بقائمة الفحص، ثم أجمع ما وجدت","أتتبّع العنصر الأوضح وحده وأهمل الباقي","أختار الخيار الأقرب شبهاً بالإطار الأخير","أعدّ العناصر في كل إطار وأختار بالعدد"],"لكل عنصر قاعدته: العدد أو الموضع أو الدوران أو الانعكاس أو التظليل أو التبديل. فتتبّع كل عنصر وحده، ثم اجمع الحكمين في شكل واحد."],["F01","","الراية تدور والحلقة تتحرك. أي الأشكال يملأ الخانة الثانية؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"عنصران: الراية تدور ربع دورة عكس عقارب الساعة، والحلقة تنتقل زاوية مع عقارب الساعة. فالثاني: الراية إلى اليسار بعد ربع دورة عكس العقارب، والحلقة أعلى اليمين."],["L01","","ثلاث سيارات في سباق: الحمراء أسرع من البيضاء، والسوداء أبطأ من البيضاء. أي العبارات صحيحة حتماً؟",["الحمراء أسرع من السوداء","السوداء أسرع من الحمراء","البيضاء أسرع من الحمراء","السوداء أسرع من البيضاء"],"نرتّب من الأسرع: الحمراء ثم البيضاء ثم السوداء. فالحمراء أسرع من السوداء حتماً."],["L01","","نايف أطول من بدر، وماجد أقصر من نايف. أي العبارات صحيحة حتماً؟",["لا يمكن معرفة الأطول بين بدر وماجد","بدر أطول من ماجد","ماجد أطول من بدر","بدر وماجد متساويان في الطول"],"نايف أطول من الاثنين، ولا معلومة تقارن بدراً بماجد. فقد يكون أحدهما أطول، وقد يتساويان، والجواب: لا يمكن معرفته."],["L01","","أول خطوة في حل سؤال الترتيب أو الجلوس:",["البدء بالمعلومة التي تحدد موقعاً بعينه","تجربة الخيارات واحداً بعد الآخر","رسم الأسماء بترتيب ذكرها في السؤال","البدء بأطول معلومة في السؤال"],"المعلومة الثابتة (أقصى اليمين، الطابق الأعلى، الثالث من اليسار) تثبّت مكاناً تُبنى عليه بقية المعلومات."],["L01","","خمسة عدّائين: وصل سلطان بعد عمر وقبل فارس، ووصل زياد قبل عمر، ووصل مشاري بعد فارس. من وصل رابعاً؟",["فارس","عمر","سلطان","مشاري"],"الترتيب من الأول: زياد ثم عمر ثم سلطان ثم فارس ثم مشاري. فالرابع فارس."],["L01","","يجلس خمسة طلاب في صف واحد، ونعدّ من اليمين: هاني في أقصى اليمين، ونادر في أقصى اليسار، وسامي بجوار هاني مباشرة، وفيصل بجوار نادر مباشرة، وخالد بين هاني ونادر. من يجلس في الوسط؟",["خالد","سامي","فيصل","لا يمكن معرفته"],"من اليمين: هاني ثم سامي، ومن اليسار: نادر ثم فيصل. يبقى المقعد الثالث لخالد، وهو «بين» هاني ونادر دون أن يجاورهما."],["L01","","أربعة أصدقاء حول طاولة مستديرة ووجوههم إلى وسطها: أحمد يقابل بدراً، وجاسم على يمين أحمد، وداود هو الرابع. من يجلس على يمين بدر؟",["داود","جاسم","أحمد","لا يمكن معرفته"],"جاسم بجوار أحمد من يمينه، فداود بجوار أحمد من يساره. وبدر يقابل أحمد، فيمين بدر هو الجهة التي فيها يسار أحمد، أي داود."],["L01","","سارة أكبر من هند، وليلى أكبر من هند. أي العبارات صحيحة حتماً؟",["هند أصغر الثلاث","سارة أكبر من ليلى","ليلى أكبر من سارة","سارة وليلى مختلفتان في العمر"],"هند أصغر من سارة ومن ليلى، فهي الصغرى حتماً. أما سارة وليلى فلا معلومة تقارن بينهما، وقد تتساويان."],["L01","","ستة أشخاص حول طاولة مستديرة بمسافات متساوية ووجوههم إلى وسطها: سعد يقابل نواف، وفهد على يمين سعد مباشرة، وعلي على يمين نواف مباشرة، وماجد على يسار نواف مباشرة، ويزيد هو السادس. من يجاور سعداً وعلياً معاً؟",["يزيد","فهد","ماجد","لا يمكن معرفته"],"نثبّت سعداً ونواف متقابلين. فهد يمين سعد، وعلي يمين نواف وماجد يساره. يبقى مقعد واحد: يسار سعد، وهو أيضاً بجوار علي، وفيه يزيد."],["L01","","خمسة كتب على رف مرتبة من اليسار إلى اليمين، و«قبل» تعني إلى اليسار: الفقه قبل التاريخ، والتاريخ قبل النحو، والأدب بعد النحو، وكتاب العلوم ليس في أقصى اليمين. أي العبارات صحيحة حتماً؟",["الأدب في أقصى اليمين","العلوم في أقصى اليسار","التاريخ في المنتصف","الفقه بجوار التاريخ"],"الفقه ثم التاريخ ثم النحو ثم الأدب بهذا الترتيب، والعلوم يدخل في أي مكان قبل الأدب. فالأخير هو الأدب حتماً، والبقية ممكنة لا حتمية."],["L01","","مبنى من ستة طوابق، في كل طابق ساكن واحد: ناصر في الطابق الأعلى، ورائد تحت ناصر بثلاثة طوابق، وطلال فوق رائد مباشرة، وبندر في الطابق الأول، وكريم فوق بندر مباشرة، وهشام هو الساكن السادس. في أي طابق يسكن هشام؟",["الخامس","الثاني","الرابع","الثالث"],"نعدّ من الأسفل: بندر في الأول، وكريم في الثاني، ورائد في ⁦6 − 3 = 3⁩ الثالث، وطلال في الرابع، وناصر في السادس. يبقى الخامس لهشام."],["Q01","","⁦64 × 5⁩ = ؟",["320","640","32","3,200"],"اضرب في 10 ثم اقسم على 2: ⁦64 × 10 = 640⁩، ثم ⁦640 ÷ 2 = 320⁩."],["Q01","","⁦57 × 11⁩ = ؟",["627","527","5,127","617"],"ضع مجموع الرقمين بينهما: ⁦5 + 7 = 12⁩، فنضع 2 في الوسط، ونضيف 1 إلى الرقم الأول فيصير 6: الناتج 627."],["Q01","","⁦23 × 17⁩ = ؟",["391","409","397","381"],"الوسط 20، والبعد 3: ⁦20 × 20 − 3 × 3 = 400 − 9 = 391⁩."],["Q01","","⁦1,260 ÷ 35⁩ = ؟",["36","360","42","34"],"بسّط بالقسمة على 5: ⁦1260 ÷ 5 = 252⁩، ثم ⁦35 ÷ 5 = 7⁩، ثم ⁦252 ÷ 7 = 36⁩."],["Q01","","أي الأعداد التالية يقبل القسمة على 9؟",["5,814","2,814","4,512","7,345"],"مجموع أرقامه ⁦5 + 8 + 1 + 4 = 18⁩، والعدد 18 يقبل القسمة على 9."],["Q01","","⁦−6 − (−9)⁩ = ؟",["3","⁦−15⁩","15","⁦−3⁩"],"طرح السالب جمع: ⁦−6 − (−9) = −6 + 9 = 3⁩."],["Q01","","⁦(−2) × (−5) × (−3) × 2⁩ = ؟",["⁦−60⁩","60","⁦−30⁩","30"],"عدّ السوالب: ثلاثة، والعدد فردي، فالناتج سالب. والقيمة ⁦2 × 5 × 3 × 2 = 60⁩."],["Q01","","⁦|4 − 11| − |−3| × 2⁩ = ؟",["1","8","9","13"],"داخل الأولى أولاً: ⁦4 − 11 = −7⁩، فالقيمة المطلقة 7. والثانية 3. ثم الضرب قبل الطرح: ⁦7 − 3 × 2 = 7 − 6 = 1⁩."],["Q01","","الطريقة الصحيحة في سؤال ضرب خياراته متقاربة، مثل: 2,184، 2,186، 2,188:",["أحسب آخر رقم في الناتج، فهو يحسم بينها","أقرّب العددين إلى العشرات وأختار الأقرب","أختار الخيار الأوسط بين الخيارات","أطرح أصغر خيار من أكبرها ثم أقرّر"],"الخيارات المتقاربة لا يفرّق بينها التقريب، لكن آخر رقم يختلف في كل خيار، وحسابه أسرع خطوة."],["Q01","","أي الأعداد التالية أصغر؟",["⁦−|−14|⁩","⁦−(−20)⁩","⁦−11⁩","⁦|−17|⁩"],"القيم على الترتيب: ⁦−14⁩، ⁦20⁩، ⁦−11⁩، ⁦17⁩. وأصغرها الأبعد عن الصفر من جهة السالب: ⁦−14⁩، لأن الإشارة خارج القيمة المطلقة تبقى."],["V01","","جَمَل : صحراء",["سمكة : بحر","ماء : عطش","شبكة : صيّاد","ملح : طعام"],"جملة الربط: «الجمل حيوان يعيش في الصحراء»، وتصحّ بالترتيب نفسه مع «السمكة حيوان يعيش في البحر»."],["V01","","عسل : حلاوة",["ليمون : حموضة","حرارة : نار","صيف : شتاء","سكر : قهوة"],"جملة الربط: «العسل صفته اللازمة الحلاوة»، وتصحّ بالترتيب نفسه مع «الليمون صفته اللازمة الحموضة»."],["V01","","كتاب : فصل",["قصيدة : بيت","مكتبة : قارئ","صفحة : مجلّد","مؤلّف : رواية"],"جملة الربط: «الكتاب يتكوّن من فصول»، وتصحّ بالترتيب نفسه مع «القصيدة تتكوّن من أبيات»."],["V01","","نحّال : عسل",["خبّاز : خبز","نحلة : زهرة","طبيب : مريض","عسل : شمع"],"جملة الربط: «النحّال صاحب مهنة، والعسل ناتج مهنته»، وتصحّ بالترتيب نفسه مع «الخبّاز صاحب مهنة، والخبز ناتج مهنته». (والنحل يصنع العسل، لكنه ناتج مهنة النحّال.)"],["V01","","مزارع : حقل",["بحّار : سفينة","حقل : قمح","طبيب : دواء","مزرعة : مزارع"],"جملة الربط: «المزارع يعمل في الحقل»، وتصحّ بالترتيب نفسه مع «البحّار يعمل في السفينة»."],["V01","","غيمة : مطر",["ينبوع : ماء","ثمرة : شجرة","سماء : نجم","قطرة : بحر"],"جملة الربط: «الغيمة مصدر يخرج منه المطر»، وتصحّ بالترتيب نفسه مع «الينبوع مصدر يخرج منه الماء»."],["V01","","إبرة : خِياطة",["منشار : نِجارة","مقصّ : ورق","خيط : ثوب","خيّاط : إبرة"],"جملة الربط الأضيق: «الإبرة أداة تُؤدّى بها حرفة الخِياطة»، وتصحّ مع «المنشار أداة تُؤدّى بها حرفة النِّجارة»."],["V01","","حرف : كلمة",["لَبِنة : جدار","جملة : كلمة","قلم : حرف","حبر : ورقة"],"جملة الربط: «الحرف وحدة تُبنى منها الكلمة»، وتصحّ بالترتيب نفسه مع «اللبنة وحدة يُبنى منها الجدار»."],["V01","","في سؤال «مِشرط : جرّاح»، لماذا أضفنا «في مهنته» إلى جملة الربط؟",["لأن خيارين صلحا مع الجملة الأولى","لأن الجملة الأولى كانت مقلوبة الاتجاه","لأن الجملة القصيرة لا تصلح في التناظر","لأن الخيارات كلها من موضوع الطب"],"نضيّق الجملة فقط حين يصلح لها أكثر من خيار؛ هنا صلح «ملعقة : طفل» و«فرشاة : رسّام»."],["V01","","أول خطوة في حل سؤال التناظر:",["كتابة جملة ربط تبدأ بالكلمة الأولى","قراءة الخيارات الأربعة بسرعة","البحث عن خيار من نفس الموضوع","استبعاد الخيار الأطول"],"الجملة قبل الخيارات، لأن الخيارات توحي بعلاقات غير موجودة في السؤال."],["Z01","","سمعت من زميل أن القسم الأول لفظي في كل مرة، وأن لكل قسم عشرين دقيقة. ما الموقف الصحيح؟",["لا أبني خطتي عليه، لأن صفحة الهيئة لا تعلنه","أوزّع وقتي على عشرين دقيقة لكل قسم","أراجع اللفظي وحده في الأسبوع الأخير","أصدّقه لأنه اختبر قبلي"],"صفحة الهيئة تعلن 120 سؤالاً، ومدة ساعتين وخمس دقائق. ولا تحسم عدد أسئلة القسم ولا زمنه ولا ترتيب المكوّنات، فما يُتناقل عنها ليس رسمياً."],["Z01","","افترض أن للقسم 30 دقيقة، وفيه 20 سؤالاً. كم ثانية في المتوسط للسؤال الواحد؟",["90","60","1.5","600"],"حوّل إلى ثوانٍ: ⁦30 × 60 = 1800⁩ ثانية، ثم اقسم على الأسئلة: ⁦1800 ÷ 20 = 90⁩ ثانية، أي دقيقة ونصف."],["Z01","","في الجولة الأولى من القسم، وصلت إلى سؤال صعب لا تعرف طريق حله. ما التصرف الأنسب؟",["أعلّمه وأكمل ما بعده، ثم أرجع إليه","أبقى عنده حتى أصل إلى الحل","أرجع إلى أول القسم وأراجع ما أجبته","أنهي القسم وأنتقل إلى الذي بعده"],"الجولة الأولى للأسئلة التي تعرفها، والسؤال السهل في آخر القسم له الدرجة نفسها. فعلّم الصعب وتجاوزه، ثم ارجع إليه في الجولة الثانية بالوقت الباقي."],["Z01","","افترض أن القسم 20 سؤالاً، وله 30 دقيقة. مضت 20 دقيقة، وأجبت عن 12 سؤالاً، وعلّمت سؤالين صعبين عليك. ما الخطة الأنسب للدقائق العشر الباقية؟",["أقرأ الأسئلة الستة التي لم أصلها، ثم أرجع إلى المعلّمَين","أرجع إلى السؤالين المعلّمَين أولاً حتى أحلّهما","أراجع الأسئلة الاثني عشر التي أجبتها","أختار إجابة واحدة لكل ما بقي دون قراءته"],"بقي ⁦20 − 12 − 2 = 6⁩ أسئلة لم تقرأها، وفيها أسئلة قد تعرفها بسرعة. فأكمل الجولة الأولى عليها، ثم ارجع إلى المعلّمين بما بقي من وقت."],["Z01","","في سؤال، استبعدت خيارين خطأين قطعاً، وبقي خياران ولم تعرف أيهما الصحيح. والتعليمات على الشاشة لا تذكر خصماً للإجابة الخاطئة. ماذا تفعل؟",["أختار أحد الخيارين الباقيين","أترك السؤال بلا إجابة حتى لا أخطئ","أختار عشوائياً من الخيارات الأربعة كلها","أقضي ما بقي من وقت القسم عليه حتى أتأكد"],"الاستبعاد جعل فرصتك واحداً من اثنين بدل واحد من أربعة. وإذا لم تنصّ التعليمات على خصم، فالسؤال المتروك لا يكسب شيئاً، فاختر من الباقيين."],["Z01","","في سؤال تناظر، الزوج المعطى «بوصلة : بحّار». أي الخيارات تستبعده أولاً بقاعدة الاتجاه؟",["فلّاح : مِحراث","مِجداف : ملّاح","مقصّ : حلّاق","ريشة : خطّاط"],"جملة الربط: «البوصلة أداة البحّار»، الأداة أولاً ثم صاحبها. و«فلّاح : مِحراث» صاحب الأداة أولاً، فاتجاهه معكوس، فتستبعده قبل أن تقارن الباقي."],["Z01","","سؤال ضرب، وخياراته الأربعة متقاربة جداً، وكل منها ينتهي برقم آحاد مختلف. ما أسرع طريقة لحسمه؟",["أحسب رقم الآحاد في الناتج، وأقارنه بالخيارات","أضرب العددين كاملين على الورق","أقرّب العددين، وأختار الأقرب للناتج","أجرّب الخيار الأوسط أولاً، ثم أقارن"],"آحاد الناتج يأتي من ضرب آحاد العددين وحده، وهو حساب ثانية. وما دامت الآحاد مختلفة في الخيارات، فهو يحسم وحده."],["Z01","","في سؤال «أي العبارات يلزم صدقها؟» بقي خياران بعد الاستبعاد: الأول يصح في أغلب الحالات، والثاني يصح في كل حالة تسمح بها المعطيات. أيهما تختار؟",["الذي يصح في كل حالة تسمح بها المعطيات","الذي يصح في أغلب الحالات","الأطول منهما، لأنه أكثر تفصيلاً","أترك السؤال، لأن الخيارين ممكنان"],"«يلزم» يعني أنه يصح في كل حالة، لا في أغلبها. فالخيار الذي تنقضه حالة واحدة تسمح بها المعطيات ليس لازماً، وهو «قد يكون»."],["Z01","","الطريقة الصحيحة لإدارة الوقت داخل القسم:",["جولة للسهل مع تعليم الصعب، ثم جولة لما علّمته","أحل الأسئلة بترتيبها ولا أتجاوز سؤالاً","أبدأ بأصعب الأسئلة وأنا في كامل تركيزي","أعطي كل سؤال الوقت نفسه، ولا أرجع إليه"],"في الجولة الأولى تكسب كل سؤال تعرفه بسرعة، وتعلّم الصعب. وفي الثانية ترجع إلى ما علّمته بما بقي من وقت."],["Z01","","افترض أن القسم 20 سؤالاً، وله 30 دقيقة. في الجولة الأولى أجبت عن 16 سؤالاً في 18 دقيقة، وعلّمت الباقي. كم دقيقة من الوقت الباقي لكل سؤال علّمته في المتوسط؟",["3","7.5","0.6","4.5"],"بقي ⁦30 − 18 = 12⁩ دقيقة، والمعلّم ⁦20 − 16 = 4⁩ أسئلة، فلكل سؤال ⁦12 ÷ 4 = 3⁩ دقائق."],["L01","h","منزل أحمد هو الثالث من طرف الشارع، ومنزل خالد هو الخامس من الطرف الآخر، وبين منزل أحمد وخالد ستة منازل، كم مجموع المنازل؟",["14","12","9","8"],"عدد المنازل = 3 (حتى أحمد) + 6 (بينهما) + 5 (من خالد) = 14 منزلاً."],["V01","h","جنين : ولادة",["سهم : رمي","رجم : حجر","عصا : ضرب","مسدس : قتل"],"الجنين يخرج من مستقره بالولادة، والسهم يخرج من مستقره بالرمي: شيء ثم الفعل الذي يُخرجه."],["L01","h","10 صناديق 4 منها يوجد بها قلم رصاص و 5 منها يوجد بها أقلام حبر واثنين منها يوجد بهما أقلام رصاص وحبر معًا، كم عدد الصناديق الفارغة؟",["3","2","4","5"],"رصاص فقط 4-2=2، وحبر فقط 5-2=3، ومعاً 2: المشغولة 2+3+2=7، فالفارغة 10-7=3."],["Q01","h","فقارن بين القيمتين: القيمة الأولى: 4,004 ÷ 0,04 ، القيمة الثانية: 100",["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"4.004 ÷ 0.04 = 100.1، وهو أكبر من 100، فالقيمة الأولى أكبر."],["L01","pm1","عدد العوامل المؤثرة في البدانة كما جاءت في النص:",["ثلاثة","اثنان","أربعة","ستة"],"النص حدد العوامل: بيئية أو اقتصادية أو بيولوجية، أي ثلاثة."],["V01","h","مبنى : قاعة",["مسجد : مئذنة","ملعب : كرسي","كتاب : منهج","دكان : شارع"],"القاعة جزء معماري من المبنى، والمئذنة جزء معماري من المسجد: بناء ثم جزء من عمارته لا من أثاثه."],["L01","h","من أصغر واحدة؟",["أمل","سمر","نوره","ابتسام"],"ابتسام أكبر من أمل بـ 3: ابتسام 26 وأمل 23، وبقية الأعمار 26 و29 و32، فأمل أصغرهن."],["Q01","p","قارن بين القيمتين: القيمة الأولى: 1/(7 + 1/2) ، القيمة الثانية: 2/15",["القيمتان متساويتان","القيمة الأولى أكبر","القيمة الثانية أكبر","المعطيات غير كافية"],"7 + 1/2 = 15/2، فـ 1/(15/2) = 2/15، فالقيمتان متساويتان."],["L01","h","أحمد يكذب الثلاثاء والأربعاء والخميس، ويصدق باقي أيام الأسبوع، ومحمد يكذب في الإثنين والأحد والسبت، ويصدق باقي أيام الأسبوع، في أي يوم يقول كلاهما سنكذب غداً؟",["الإثنين","الثلاثاء","الجمعة","الخميس"],"يوم الإثنين أحمد صادق وغداً (الثلاثاء) يكذب فقوله صحيح، ومحمد كاذب وغداً صادق فقوله خاطئ كما يلزم؛ ولا يتحقق ذلك في غيره."],["L01","h","حدثت عملية سرقة لبنك، وشهود عيان أكدوا أنهم رأوا السارق يركض وهو خارج من البنك. أي من التالي لا يمكن أن يكون السارق؟",["المشلول","الأعمى","الأصم","السليم"],"الشهود رأوا السارق يركض، والركض يحتاج سلامة الساقين، والمشلول لا يقدر عليه، فلا يمكن أن يكون السارق."],["Q01","pm1","قارن بين القيمتين: القيمة الأولى: 60^2 ، القيمة الثانية: (60 × 24) + (60 × 36)",["القيمتان متساويتان","القيمة الأولى أكبر","القيمة الثانية أكبر","المعطيات غير كافية"],"60^2 = 3,600، والثانية = 60 × (24 + 36) = 60 × 60 = 3,600، فالقيمتان متساويتان."],["L01","h","إذا كان بعد غد هو اليوم التاسع بعد الأربعاء الماضي، فما هذا اليوم الذي نحن فيه؟",["الأربعاء","الخميس","الجمعة","الثلاثاء"],"الأربعاء الماضي + 9 أيام = الجمعة (9 باقي 7 = 2)، وهو بعد غد، فاليوم هو الأربعاء."],["V01","h","شاعر : قصيدة⁣",["طباخ : طعام","مهندس : بناء","معلم : طالب","قلب : دم"],"الشاعر ينتج القصيدة بنفسه، كما أن الطباخ ينتج الطعام بنفسه: صانع ومنتَج ملموس هو ناتج عمله."],["V01","pm1","أبوة : عمومة",["أمومة : خؤولة","قرابة : نسب","مصاهرة : قوة","جد : جدة"],"الأبوة والعمومة قرابة من جهة الأب، والأمومة والخؤولة قرابة من جهة الأم: صلتان من جهة واحدة."],["L01","pm1","المقصود بكلمة (يذهب) في عبارة (ويذهب الباحثون إلى أن السمنة ...):",["يرى","يقصد","غير متوفر","غير متوفر"],"«يذهب الباحثون إلى أن…» تعني «يرون أن…»، أي يعتقدون ويقررون رأياً."],["L01","h","وفقًا للنص: فإن كمية الملح في البحر الميت مقارنة بالبحار الأخرى:",["أكثر","أقل","متساوية","غير معروفة"],"النص يقول إن ملوحة البحر الميت عشرة أضعاف نسبة الأملاح في البحار الأخرى، فكمية الملح فيه أكثر."],["L01","h","محمد لديه 3 أخوات (منى وسارة وفاطمة) و5 إخوة. ما حاصل ضرب عدد إخوة سارة الذكور في عدد أخواتها؟",["12","8","10","14"],"إخوة سارة الذكور: 5 + محمد = 6، وأخواتها: منى وفاطمة = 2؛ 6 × 2 = 12."],["V01","pm1","الإسكندرية : الرياض",["عدن : الخرطوم","نيويورك : الدوحة","جدة : جاكرتا","المنامة : الكويت"],"الإسكندرية مدينة عربية ساحلية وليست عاصمة بلدها، والرياض عاصمة عربية بعيدة عن البحر؛ وكذلك عدن ساحلية وعاصمة اليمن صنعاء، والخرطوم عاصمة داخلية."],["V12","h","العلاقة بين \"الشاردة\" و\"النادرة\" من حيث المعنى:",["متقاربتان","لا علاقة بينهما","متعارضتان","متضادتين"],"وصف العياشي الكتاب بأنه لم يدع «شاردة ولا نادرة»، والكلمتان تدلان على ما ندر وشذّ عن المألوف، فهما متقاربتان."],["Q01","h","أوجد قيمة المقدار: 1/4 - 0,5/2 .",["صفر","1/4","1/2","2"],"0.5/2 = 0.25 = 1/4، فالمقدار 1/4 - 1/4 = صفر."],["F04","h","إذا طُويت الشبكة الآتية مكعباً، فأي المكعبات الآتية يمكن أن ينتج؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"عند الطي يلتقي في ركن واحد وجه النقطة ووجه الحلقة وحدها ووجه الخط الرأسي، فإذا كانت النقطة أماماً والحلقة أعلى جاء الخط الرأسي يميناً ويبقى رأسياً."],["Q01","h","ما هو الرقم الذي يقع بين 3 1/5 و 3 1/2 ؟",["3,216","3,59","3","3,19"],"3 1/5 = 3,2 و3 1/2 = 3,5، والعدد 3,216 يقع بينهما (أكبر من 3,2 وأصغر من 3,5)."],["V01","pm1","بناء : طوب",["قطار : عربة","اجتهاد : نجاح","تعليم : وعي","طالب : فصل"],"الطوب وحدة متكررة يتألف منها البناء، والعربة وحدة متكررة يتألف منها القطار: كل ثم وحدته المتكررة."],["L01","pm1","هدف المجلة من هذه العناوين:",["تلميع وتحسين صورة المجرمين","توعية المجتمع من خطر السرقات","توعية المجتمع دينيًا من الجريمة","إظهار أن السجناء صالحين"],"العناوين تُظهر السارق معجباً بالمغامرة ويسرق للفقراء بشوشاً جميل المظهر، فغايتها تلميع صورة المجرمين."],["V01","p","صهيل : الخيل",["صرير : الباب","بكاء : الفتاة","شدو : الغراب","نهيق : الكلب"],"الصهيل اسم خاص بصوت الخيل، كما الصرير اسم خاص بصوت الباب: الصوت المميز وصاحبه."],["V01","p","سم : ثعبان",["مسك : غزال","حوت : عنبر","خروف : صوف","خروف : نعجة"],"السم مادة تفرزها غدد الثعابين السامة، والمسك مادة يفرزها غزال المسك: مادة ثم الحيوان الذي يفرزها."],["Q01","h","كم طريقة يمكن أن يكون عددين صحيحين موجبين حاصل ضربهم 30 ؟",["4","2","3","6"],"الأزواج الممكنة دون اعتبار الترتيب: (1، 30) و(2، 15) و(3، 10) و(5، 6)، أي 4 طرق."],["Q01","h","قارن بين القيمتين: القيمة الأولى: 30 × 10/15 ، القيمة الثانية: 30 × 10/6",["القيمة الثانية أكبر","القيمة الأولى أكبر","القيمتان متساويتان","المعطيات غير كافية"],"الأولى = 300/15 = 20، والثانية = 300/6 = 50، فالقيمة الثانية أكبر."],["L01","h","سلمان ونواف وفهد يجلسون في غرفة صفية واحدة سلمان يدون الملاحظات وتقتضي التعليمات أن من يدون الملاحظات يجلس في المقاعد الأمامية نواف لا يدون الملاحظات فأي من التالي صحيح؟",["سلمان يجلس في مقدمة الصف","سلمان يجلس خلف نواف","فهد يجلس خلف نواف","نواف يجلس في مؤخرة الصف"],"من يدون الملاحظات يجلس في المقاعد الأمامية، وسلمان يدون الملاحظات، فيجلس في مقدمة الصف."],["Q05","h","محمد يذهب يوميا إلى النادي الرياضي ، إذا كان يحرق 55 سعرة حرارية في 5 دقائق وأراد ان يحرق 110 سعرة حرارية ، فكم دقيقة يحتاج :",["10","12","14","16"],"110 = 2 × 55 سعرة، فالزمن = 2 × 5 = 10 دقائق."],["L01","h","ما نظرتك للمدرسة التي يكثر فيها غياب الطلاب وتأخرهم عن الحصص والصلاة؟",["سلبية","متأخرة","إيجابية","عادية"],"كثرة الغياب والتأخر عن الحصص والصلاة تدل على ضعف الانضباط والإدارة، فالنظرة إلى المدرسة سلبية."],["V01","p","لبن : أبيض",["خيار : أخضر","تفاح : أحمر","إنسان : أسود","حجر : صلب"],"لون واحد ثابت يُعرف به الشيء: اللبن أبيض، و«تفاح : أحمر»خضر."],["F01","h","في الجدول المائل علاقة ثابتة بين كل خانة والخانتين فوقها. ما قيمة س؟",["18","17","19","20"],"كل خانة مجموع الخانتين فوقها: 2 + 5 = 7، و5 + 6 = 11، فقيمة س = 7 + 11 = 18، وتتحقق: 18 + 25 = 43."],["V01","p","حمار : حصان",["جحش : مهر","شجرة : تفاح","رجل : امرأة","غباء : ذكاء"],"الجحش ولد الحمار والمهر ولد الحصان، فالعلاقة بين الصغيرين هي نفسها بين الكبيرين: نوعان متقاربان من الدواب."],["Q01","pm1","العدد 3643 له علاقة بالعدد 30 ، والعدد 7354 يكون له علاقة بأحد الأعداد التالية، فما هو العدد؟",["41","27","31","33"],"القاعدة: ضرب الرقمين الأولين + ضرب الرقمين الأخيرين؛ 3643: 3×6 + 4×3 = 30، و7354: 7×3 + 5×4 = 41."],["V01","p","عرى : روابط",["ترامى : تباعد","تهالك : تقارب","سرى : ليل","تقادم : تماسك"],"ترامى وتباعد بمعنى واحد، كما عرى وروابط: مترادفان."],["V01","h","العطر من الزهرة كما أن الحكمة من ______",["التجربة","الشيخ","الكتاب","المعلم"],"العطر يُستخلص من الزهرة، والحكمة تُستخلص من التجربة التي يمر بها الإنسان بنفسه."],["V01","p","الطالب المجتهد كالزارع الذي ______",["يحصد ثمار زرعه","يترك أرضه بورًا","ينسى سقي زرعه","يبيع أرضه"],"المجتهد يجني ثمرة جهده، كما أن الزارع يحصد ثمرة زرعه: جهد يعقبه جزاؤه."],["L01","pm1","أي من الآتي غير صحيح؟",["كلما تمت ممارسة الألعاب الهوائية زاد الضغط النفسي","يتم إصدار نظام على الألعاب الهوائية لتقليل الضغوط النفسية","كلما زدنا من ممارسة الألعاب الهوائية كلما قل الضغط النفسي","غير متوفر"],"نتيجة الدراسة أن الضغوط قلّت بعد ممارسة الألعاب الهوائية، فزيادة الضغط مع ممارستها تناقض ذلك."],["V01","h","كتاب : مؤلف",["لوحة : رسام","سيف : حرب","مطرقة : طرق","قلب : دم"],"المؤلف صاحب الكتاب، كما أن الرسام صاحب اللوحة: عمل وصانعه."],["Q08","h","مع محمد 1800 ريال من فئة 500 و 100 و 50 ، ومجموع ما لديه من أوراق هو 14 ، فكم عدد الأوراق من فئة 50 ريال :",["8","2","4","6"],"بتجربة عدد أوراق 500: ورقتان (1,000)، يبقى 800 في 12 ورقة: 4 من فئة 100 (400) و8 من فئة 50 (400). المجموع 14 ورقة."],["L01","pm1","إذا كان هناك شخصان يتناولان نفس الطعام، ويمارسان نفس النشاط، ولكن أحدهما زاد وزنه عن الآخر فإن السبب يرجع إلى عامل:",["بيولوجي","بيئي","اقتصادي","نفسي"],"تشابه الطعام والنشاط يستبعد العوامل البيئية والاقتصادية، فالفرق في الوزن سببه عامل داخلي في الجسم: بيولوجي."],["V01","p","بث : استقبال",["رفض : قبول","وقود : سيارة","موجة : تلفاز","رضا : ابتسامة"],"البث نقيض الاستقبال، كما الرفض نقيض القبول: ضدان."],["V01","h","بطارية : ساعة",["شراع : سفينة","ذيل : طائرة","دقيقة : ثانية","سيارة : باب"],"البطارية تمد الساعة بالطاقة التي تحركها، والشراع يمد السفينة بالقوة التي تحركها: ما يمد الشيء بقوة تحركه."],["V01","pm1","ينطق : يصمت",["تكبر : تواضع","جلالة : مهابة","كذب : وفاء","يهرول : يجري"],"الكلام ضد الصمت، والتكبر ضد التواضع: ضدان."],["F04","h","كم مكعباً صغيراً ينقص المجسم الآتي ليصير مكعباً كبيراً 4 × 4 × 4؟ (كل مكعب مسنود بما تحته)",["24","8","16","40"],"الدرج ارتفاعاته 1 و2 و3 و4 بعرض 4، ففيه 4 × (1 + 2 + 3 + 4) = 40 مكعباً، والمكعب الكبير 4 × 4 × 4 = 64، فالناقص 64 − 40 = 24."],["L01","pm1","وفقًا للنص: فإن الأيونات السالبة مفيدة للجهاز:",["التنفسي","الهضمي","العصبي","العظمي"],"النص: الشحنات السالبة في هواء البحر الميت تساعد في التنفس وعلاج الربو وضيق التنفس، أي الجهاز التنفسي."],["F01","h","الساعات تُقرأ من اليمين. ما الوقت في الساعة الأخيرة؟",["9:55","12:00","12:30","1:40"],"كل ساعة تسبق التي قبلها بساعة و50 دقيقة: 3:25 ثم 1:35 ثم 11:45، فالأخيرة 11:45 − 1:50 = 9:55."],["Q01","p","قارن بين القيمتين: القيمة الأولى: (30 × 40) + (30 × 40) ، القيمة الثانية: 60^2",["القيمة الثانية أكبر","القيمة الأولى أكبر","القيمتان متساويتان","المعطيات غير كافية"],"الأولى = 1,200 + 1,200 = 2,400، والثانية = 60^2 = 3,600، فالقيمة الثانية أكبر."],["Q01","p","أقل عدد نطرحه من 569 ليقبل القسمة على خمسة بدون باقي؟",["4","2","3","5"],"569 = 5 × 113 + 4، فنطرح الباقي 4 ليقبل القسمة على 5."],["Q01","pm1","قارن بين القيمتين: القيمة الأولى: 0,66 ، القيمة الثانية: 2/3",["القيمة الثانية أكبر","القيمة الأولى أكبر","القيمتان متساويتان","المعطيات غير كافية"],"2/3 = 0.666...، وهو أكبر من 0.66، فالقيمة الثانية أكبر."],["F01","h","في الجدول علاقة ثابتة بين الأعداد. ما قيمة س؟",["0","2","5","3"],"مجموع كل عمود في الجدول 13 (مثل 8 + 2 + 2 + 1 = 13)، فعمود س: 6 + س + 4 + 3 = 13، أي س = 0."],["Q01","p","قارن بين القيمتين: القيمة الأولى: √99 ، القيمة الثانية: 9,5",["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"99 أكبر من 9.5^2 = 90.25، فـ √99 ≈ 9.95 أكبر من 9.5، فالقيمة الأولى أكبر."],["V01","p","حاسر : رأس",["حافي : قدم","غليظ : ساعد","أشعث : شعر","جسم : عاري"],"الحاسر من كشف رأسه، والحافي من كشف قدمه: صفة من لم يستر العضو."],["F03","h","أوجد العدد الناقص.",["3","4","5","6"],"في الوجه الضاحك الرأس مجموع الأذنين (6 + 4 = 10، 8 + 10 = 18)، وفي العابس الفرق بينهما (28 − 4 = 24)؛ فالناقص = 16 − 13 = 3."],["V01","pm1","النجاة : الهلاك",["الإقلال : الإكثار","الأصدقاء : الوشاة","الانتظار : الذهاب","الغنى : الثراء"],"النجاة ضد الهلاك، كما أن الإقلال ضد الإكثار: تضاد بين معنيين متقابلين تمامًا."],["L01","h","أعلن مدير عام المؤسسة في الاجتماع الثانوي لموظفي المؤسسة أنه سعيد بأن يعلن أن المؤسسة في هذا العام حققت ربحًا أعلى من متوسط ربح الشركات المنافسة وأن الأرباح هذا العام أعلى بنسبة 20٪ مما كانت عليه في العام الماضي فأي من التالي صحيح؟",["في العام الماضي كان ربح المؤسسة أقل منه في هذا العام","في الأعوام السابقة كانت ربح المؤسسة اقل من المتوسط","كان متوسط ربح الشركات المنافسة في العام الماضي أقل من هذا العام","أداء المؤسسة كان أفضل في العام الماضي"],"الأرباح هذا العام أعلى بـ 20% (مثلاً 120 مقابل 100)، فربح العام الماضي أقل من ربح هذا العام."],["V12","h","ما سبب زيادة التلوث حسب النص؟",["الأنشطة العمرانية والصناعية السريعة","التغير المناخي","الكوارث الطبيعية","الزراعة التقليدية"],"قال النص: «نتيجة التوسع العمراني والصناعي السريع... أدت هذه الأنشطة إلى زيادة التلوث»."],["V01","pm1","مقص : قماش",["فأس : حطب","قلم : كتابة","سكين : قطع","منجل : حصاد"],"المقص أداة تقطع القماش، والفأس أداة تقطع الحطب: أداة ثم المادة التي تقطعها."],["V01","p","قلب : أُذين",["أسرة : ابن","سماء : أرض","لسان : أسنان","أنف : فم"],"الأذين جزء من القلب في داخله، والابن فرد من الأسرة: كل ثم جزء منه."],["L01","pm1","أولوية العلاج تكون لـ:",["الغياب","التأخر الصباحي","التأخر بعد الصلاة","التأخر بعد الفسحة"],"الغياب يمنع حضور الطالب أصلاً، ولا تُعالج بقية المشكلات (التأخر والصلاة) إلا بحضوره، فهو الأولى بالعلاج."],["V01","pm1","مركز : نفوذ",["حسب : جاه","صيت : شهرة","هروب : تثبيت","إدبار : رجوع"],"المركز يمنح صاحبه النفوذ، والحسب يمنح صاحبه الجاه: مكانة ثم ما تمنحه لصاحبها من سلطة وتقدير."],["V01","p","القمر يستمد نوره من الشمس كما أن التلميذ يستمد علمه من ______",["المعلم","الكتاب","التجربة","الزمن"],"التلميذ يأخذ علمه من المعلم الذي يعطيه، كما أن القمر يأخذ نوره من الشمس التي تمدّه: متلقٍّ ومعطٍ فاعل."],["Q12","h","إذا كان عدد المقاعد في المدرج الأول 13 مقعد وعددها في المدرج الثاني 18 مقعد والمدرج الثالث 23 مقعد ، فكم عدد مقاعد المدرج الثامن :",["48","45","52","53"],"المتتابعة تزيد 5 كل مرة؛ الحد الثامن = 13 + 7 × 5 = 48."],["V01","p","حرير : رقة",["عروس : أناقة","سند : أخ","صوف : نسيج","زواج : خطوبة"],"الحرير يتصف بالرقة، والعروس تتصف بالأناقة: موصوف ثم صفته الملازمة."],["Q13","hx","عددان موجبان حاصل ضربهما 36، والعدد الأول أصغر من 6. قارن بين القيمتين: القيمة الأولى: العدد الثاني. القيمة الثانية: 6.",["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"العدد الثاني = 36 ÷ العدد الأول، والقسمة على عدد أصغر من 6 تعطي أكبر من 36 ÷ 6 = 6، فالقيمة الأولى أكبر."],["V01","p","لدغة : موت",["صبر : فرج","جوع : فقر","أكل : غنى","نهاية : موت"],"اللدغة قد تنتهي بالموت، والصبر ينتهي بالفرج: أمر ثم العاقبة التي ينتهي إليها."],["Q01","p","مجموع سبعة أعداد صحيحة موجبة متتالية هو ..",["63","57","58","61"],"مجموع سبعة أعداد متتالية = 7 × الوسطي، فهو من مضاعفات 7؛ 63 = 7 × 9 (من 6 إلى 12)."],["V01","p","أسهم : اقتصاد",["صحف : إعلام","مدرسة : طلاب","وزارة : تجارة","سماء : نجوم"],"الأسهم جزء من الاقتصاد، والصحف جزء من الإعلام: جزء ثم المجال الذي ينتمي إليه."],["V01","p","الذهب غالٍ بقيمته كما أن الوقت غالٍ ______",["بندرته","بكثرته","بسرعته","بجماله"],"الذهب غالٍ لقلة وجوده، والوقت غالٍ لأنه محدود لا يعوَّض: الغلاء بسبب الندرة."],["V01","p","صقر : هواء",["حوت : ماء","ضفدع : حيوان","اقتباس : مقال","صيد : شبكة"],"الصقر يطير في الهواء، والحوت يسبح في الماء: كائن ثم الوسط الذي يتحرك فيه."],["V01","p","مكة : كعبة",["القاهرة : الأهرام","علم : راية","الدولة : العاصمة","فلسطين : غزة"],"تُعرف مكة بالكعبة، وتُعرف القاهرة بالأهرام القريبة منها في الجيزة: مدينة ثم أشهر معلم يقترن اسمه بها."],["V01","pm1","مفكر : فكرة",["شاعر : قصيدة","قصة : رواية","قاضي : قضية","نجار : خشب"],"المفكر يبدع فكرة، كما يبدع الشاعر قصيدة: مبدع ونتاجه الذي يخرج من عقله."],["V01","p","الجذر : النبات",["الأساس : البناء","المحرك : السيارة","القلب : الإنسان","الساق : الجسم"],"الجذر قاعدة النبات المدفونة التي يقوم عليها، كما أن الأساس قاعدة البناء المدفونة التي يقوم عليها."],["Q01","p","ما قيمة المقدار (4/5) / (1/5) ؟",["4","4/25","16/25","1"],"(4/5) ÷ (1/5) = 4/5 × 5 = 4."],["V01","p","قلم : كتابة",["مطرقة : طرق","معلم : طالب","كتاب : علم","نار : دخان"],"المطرقة أداة يُنجَز بها فعل الطرق، كما أن القلم أداة يُنجَز بها فعل الكتابة: أداة وفعلها الخاص."],["V01","pm1","عاصمة : دولة",["قلب : جسم","قمة : جبل","محور : دائرة","جذر : شجرة"],"العاصمة مركز الدولة الذي تُدار منه، كما القلب مركز الجسم الذي يمدّه بالحياة: مركز يقوم عليه الكل."],["V01","pm1","المطر يروي الأرض كما أن الكلمة الطيبة تروي ______",["القلب","العقل","العين","الذاكرة"],"الكلمة الطيبة تروي القلب فيطمئن، كما يروي المطر الأرض فتحيا: ري معنوي للقلب."],["Q05","h","إذا كان سعر 8 آلات طباعة 48000 ريال، فما تكلفة 3 آلات؟",["18000","15000","20000","12000"],"سعر الآلة الواحدة = 48,000 ÷ 8 = 6,000، وثلاث آلات = 18,000 ريال."],["V01","p","حرف : كلمة",["خروف : قطيع","دولاب : أرفف","معادلة : رقم","مصنع : ملابس"],"الحرف جزء من الكلمة، والخروف جزء من القطيع: فرد ثم المجموعة التي ينتمي إليها."],["V01","pm1","الري : الماء",["الشفاء : الدواء","الغنى : الشهرة","الزرع : الهواء","الصبر : الفرج"],"الري يحصل بالماء، والشفاء يحصل بالدواء: نتيجة ثم الوسيلة التي تحققها."],["V01","pm1","انتصار : عراك",["شراء : تفاوض","تعاون : تكاتف","حوار : إقناع","تربية : تنشئة"],"الانتصار تسبقه المعركة، والشراء يسبقه التفاوض: نتيجة ثم ما يسبقها ويؤدي إليها."],["V01","p","حدود : دولة",["إطار : لوحة","منزل : جدران","كتاب : غلاف","جذع : لحاء"],"الحدود تحيط بالدولة، والإطار يحيط باللوحة: الأول يحيط بالثاني من الخارج."],["V01","pm1","خياطة : إبرة",["كتابة : قلم","ذهب : صانع","ألوان : رسام","حطب : خشب"],"الخياطة تُنجز بالإبرة، كما أن الكتابة تُنجز بالقلم: عمل وأداته."],["V01","p","ليل : نهار",["صيف : شتاء","كتاب : مكتبة","ورقة : شجرة","جوع : أكل"],"الليل ضد النهار، كما أن الصيف ضد الشتاء: علاقة تضاد."],["V01","p","المرأة : عقمت",["البركة : نضبت","الشاة : نفقت","السحابة : أمطرت","القوة : هوت"],"المرأة تبقى لكنها تعقم فلا تلد، والبركة تبقى لكنها تنضب فلا تعطي ماءً: الشيء باقٍ وقد انقطع عطاؤه."],["V01","p","صحراء : عطش",["بحر : رطوبة","مطر : نمو","ليل : نهار","طعام : شبع"],"الصحراء مكان يسبب العطش لمن فيه، والبحر مكان يسبب الرطوبة فيما حوله؛ العلاقة مكان وأثره."],["V01","pm1","أُذن : سمع",["شفرة : حلاقة","عين : جفن","قلب : محبة","جلد : شعر"],"الأذن أداة السمع، والشفرة أداة الحلاقة: أداة ثم وظيفتها الحقيقية."],["V01","p","مصنَّع : طبيعي",["مخالف : نظامي","وهمي : موثوق","شباب : نضارة","شر : ضر"],"المصنَّع ضد الطبيعي، والمخالف ضد النظامي: ضدان مباشران، كل منهما ينفي الآخر."],["V01","pm1","العلم نور كما أن الجهل ______",["ظلام","معرفة","راحة","أمل"],"ضد النور الظلام، كما أن ضد العلم الجهل، فالجهل ظلام."],["V01","p","ثوب : نسيج",["باب : خشب","قلم : حبر","بحر : حبر","جلد : قربة"],"الثوب يُصنع من النسيج، والباب يُصنع من الخشب: شيء ثم مادته التي يُصنع منها."],["Q01","p","كم عدد صحيح بين 17/5 و 77/4 ؟",["16","14","15","17"],"17/5 = 3,4 و77/4 = 19,25، والأعداد الصحيحة من 4 إلى 19 عددها 19 − 4 + 1 = 16."],["V01","p","نهار : ليل",["كلام : سكوت","أسود : أبيض","صيام : قيام","متوسط : ثانوي"],"النهار زمن الحركة والليل زمن السكون، والكلام حركة اللسان والسكوت سكونه: ضدان، الأول حركة والثاني سكون."],["V01","p","سنام : بعير",["صلاة : عبادة","شعر : رمش","ساق : ركبة","فرس : حدوة"],"السنام جزء من البعير، كما الصلاة جزء من العبادة: جزء ثم كله."],["Q01","p","أوجد قيمة المقدار: 0,5/2 × 50/100 × 16 .",["2","4","6","8"],"0,5/2 = 1/4 و50/100 = 1/2، فالناتج = 1/4 × 1/2 × 16 = 2."],["V01","pm1","سلسلة : حلقة",["سلم : دَرَج","مستطيل : دائرة","مسمار : حديد","كتاب : كتب"],"الحلقة جزء متكرر تتألف منه السلسلة، والدرج جزء متكرر يتألف منه السلم: كل ثم جزء متكرر فيه."],["Q01","p","2^5 ÷ 2^-5 يساوي ..",["1024","105","1","512"],"القسمة تطرح الأسس: 2^(5 − (−5)) = 2^10 = 1,024."],["V01","p","جبل : طود",["سحب : غيم","طائرة : سيارة","دينار : درهم","رمل : صخر"],"الجبل والطود بمعنى واحد، والسحب والغيم بمعنى واحد: مترادفان."],["V01","p","قوة : نصر",["مشي : تعب","معرفة : قراءة","نجاة : صدق","ممحاة : إخفاء"],"القوة تؤدي إلى النصر، والمشي يؤدي إلى التعب: سبب ثم نتيجته."],["V01","p","حصون : قلاع",["سنا : ضوء","لحاء : شجرة","جبال : قمة","بحار : أنهار"],"الحصون والقلاع بمعنى واحد، والسنا والضوء بمعنى واحد: مترادفان."],["V12","h","القطعة تتكلم عن؟",["جيولوجيا","جغرافيا","الأرض","البحار"],"القطعة عن الهزة الأرضية والصدع في القشرة الأرضية وآراء علماء الجيولوجيا، فموضوعها الجيولوجيا."],["V01","p","قراءة : وعي",["اجتهاد : إنجاز","ثقافة : اطلاع","دراسة : مذاكرة","كتابة : تأليف"],"القراءة تثمر الوعي، والاجتهاد يثمر الإنجاز: جهد ثم ثمرته الناتجة عنه، لا نوعه."],["V01","pm1","قهوة : بُن",["علم : معلومات","خبز : مخبز","تعليم : تنمية","دولة : خريطة"],"القهوة تُصنع من البن، والعلم يتكون من المعلومات: شيء ثم مادته الأولية التي يتألف منها."],["V12","h","كلمة \"الطفرة\" في عبارة \"هذه الطفرة التكنولوجية\" تعني:",["التغيير المفاجئ والسريع.","النمو البطيء.","التراجع والانحدار.","الاستقرار الطويل."],"«الطفرة» وصف لثورة تكنولوجية غيّرت الحياة بسرعة، فمعناها التغيّر المفاجئ السريع."],["Q01","p","عدد ما سبع أمثاله = 609 فما العدد؟",["87","86","88","89"],"سبع أمثال العدد = 609 فـ 7س = 609 وس = 87."],["V01","p","فم : كلام",["يد : مصافحة","شمس : ضوء","طبيب : دواء","بحر : سمك"],"الفم عضو يُنتج الكلام، كما أن اليد عضو يؤدي المصافحة: عضو من أعضاء الإنسان والفعل الذي يختص به."],["Q05","h","من 60 طالبًا، نسبة من يقرأ كتابين 15%، ونسبة من يقرأ كتاب واحد 50%، كم عدد الطلاب الذين لا يقرؤون أي كتاب؟",["21","12","18","15"],"من يقرؤون = 15% + 50% = 65% من 60 = 39، فالذين لا يقرؤون = 60 − 39 = 21."],["V01","p","زرع : حصاد",["حمل : ولادة","طبيب : دواء","كتاب : معرفة","نار : دفء"],"الزرع مرحلة أولى يعقبها الحصاد بعد مدة، والحمل مرحلة يعقبها الولادة: بداية ونهاية لدورة واحدة."],["Q01","p","أوجد قيمة المقدار: 5050505/101 ÷ 5",["10001","10010","10011","10100"],"5,050,505 ÷ 101 = 50,005، ثم 50,005 ÷ 5 = 10,001."],["Q01","p","قارن بين القيمتين: القيمة الأولى: 7/8 - 3/4 ، القيمة الثانية: 7/8 - 5/8",["القيمة الثانية أكبر","القيمة الأولى أكبر","القيمتان متساويتان","المعطيات غير كافية"],"الأولى = 7/8 - 6/8 = 1/8، والثانية = 7/8 - 5/8 = 2/8، فالقيمة الثانية أكبر."],["Q12","h","أوجد الحد الناقص: 5 ، 17 ، ... ، 41 ، 53 .",["29","19","21","31"],"الفرق ثابت 12 (5 ثم 17 ثم 29 ثم 41 ثم 53)، فالحد الناقص = 17 + 12 = 29."],["V01","p","طبيب : مستشفى",["معلم : مدرسة","بحّار : سفينة","لاعب : كرة","طيار : حقيبة"],"الطبيب يعمل في مستشفى، كما يعمل المعلم في مدرسة: صاحب مهنة والمؤسسة الثابتة التي يخدم الناس فيها."],["V01","p","قطع : قطف",["فصل : فصم","نام : قام","خير : شر","قصف : قصد"],"كلمتان تتفقان في أول حرفين وتختلفان في الثالث، ومعناهما متقارب (القطع): قطع وقطف، وفصل وفصم."],["V01","p","يرقة : فراشة",["بيضة : دجاجة","دودة : جرادة","نملة : حشرة","عصفور : حمامة"],"اليرقة مرحلة مبكرة من حياة الفراشة، والبيضة مرحلة مبكرة من حياة الدجاجة: مرحلة أولى من حياة الكائن ثم صورته المكتملة."],["Q01","p","حاصل قسمة عدد أولي على عدد أولي آخر يساوى:",["عدد نسبي","عدد صحيح","صفر","الواحد الصحيح"],"ناتج قسمة عدد صحيح على عدد صحيح (غير الصفر) عدد نسبي، وقد لا يكون صحيحاً مثل 2 ÷ 3."],["V12","h","ما التحديات المرتبطة بالتكنولوجيا المذكورة في النص؟",["الاعتماد المفرط على الأجهزة، البطالة، مخاطر الأمن السيبراني","زيادة التواصل الاجتماعي","تحسين الإنتاجية فقط","التطورات الصناعية"],"ذكر النص: «الاعتماد المفرط على الأجهزة، وارتفاع معدلات البطالة، والمخاطر المرتبطة بالأمن السيبراني»."],["Q12","h","أوجد الحد الناقص: -5 ، 7 ، ... ، 31 ، 43 .",["19","20","21","22"],"الفرق ثابت 12 (-5 ثم 7 ثم 19 ثم 31 ثم 43)، فالحد الناقص = 7 + 12 = 19."],["V01","p","طائر : عش",["غنم : حظيرة","سيارة : شارع","جمل : صحراء","أسد : اسطبل"],"الطائر يأوي إلى العش، والغنم تأوي إلى الحظيرة: حيوان ثم مأواه المخصص له."],["V01","p","نعل : حافٍ",["ثوب : عارٍ","عقال : رأس","جورب : حاسر","زينة : امرأة"],"من فقد النعل وُصف بحافٍ، كما أن من فقد الثوب وُصف بعارٍ: الشيء الساتر وصفة من فقده."],["Q09","h","إذا كان متوسط الأعداد: 4 ، 9 ، 8 ، 7 ، 6 ، س يساوي 7 فما هي قيمة س ؟",["8","7","9","10"],"المجموع الكلي = 7 × 6 = 42، ومجموع الأعداد الخمسة = 34، فـ س = 42 − 34 = 8."],["V01","pm2","سريع : خاطف",["سعيد : مسرور","كبير : صغير","قريب : بعيد","طويل : قصير"],"السريع والخاطف بمعنى متقارب، كما أن السعيد والمسرور بمعنى متقارب: ترادف."],["V01","p","هندسة : جبر",["فيزياء : كيمياء","فلسفة : منطق","جيولوجيا : أدب","مكتبة : كتاب"],"الهندسة والجبر فرعان من الرياضيات، والفيزياء والكيمياء فرعان من العلوم الطبيعية: علمان شقيقان من مجال واحد."],["V01","p","تراب : طين",["طحين : عجين","زبيب : عنب","ماء : بناء","خبز : قمح"],"التراب يصير طيناً بالماء، والطحين يصير عجيناً بالماء: مادة جافة تصير بإضافة الماء مادة أخرى."],["V01","p","فرشاة : رسام",["سماعة : طبيب","سيارة : طريق","كتاب : قارئ","هاتف : اتصال"],"الفرشاة أداة الرسام في عمله، كما أن السماعة أداة الطبيب في عمله: أداة ملازمة لصاحب مهنة."],["V01","pm2","قوس : انحناء",["رمح : استقامة","قارب : نهر","خيل : تمر","ضب : حوت"],"القوس يتصف بالانحناء، والرمح يتصف بالاستقامة: شيء ثم صفته المميزة."],["V01","p","قراءة : ثقافة",["اجتهاد : إنجاز","ثقافة : اطلاع","دراسة : مذاكرة","كتابة : تأليف"],"القراءة تثمر الثقافة، والاجتهاد يثمر الإنجاز: جهد ثم ثمرته الناتجة عنه، لا نوعه."],["Q01","p","عدد صحيح ثلثه يساوي 6/9 ..",["2","3","4","5"],"س/3 = 6/9 = 2/3، فـ س = 3 × 2/3 = 2."],["V01","p","اجتباء : اصطفاء",["إعانة : مساعدة","إدخال : تقريب","صلاة : عبادة","ذنب : مغفرة"],"اجتباء واصطفاء مترادفان، كما أن إعانة ومساعدة مترادفتان."],["V01","p","فروسية : ميدان",["سباحة : مسبح","بحر : صيد","تربية : تعليم","حراسة : شرطة"],"الفروسية تُمارس في الميدان، والسباحة في المسبح: رياضة ثم مكان ممارستها."],["Q09","h","إذا كان متوسط قراءة أحمد في 4 أيام 6 صفحات ومتوسط القراءة في 3 أيام 5 صفحات، أوجد عدد صفحات التي يقرؤها في اليوم الرابع؟",["9","3","6","11"],"مجموع 4 أيام = 4 × 6 = 24، ومجموع 3 أيام = 3 × 5 = 15، فاليوم الرابع = 24 − 15 = 9 صفحات."],["V07","h","الأفضل أن ...... مبكرًا ثلاث ساعات، من أن ...... دقيقة واحدة.",["تصل . تتأخر","تصحو . تنام","تأتي . تبكر","تنام . تتأخر"],"المقابلة بين الوصول مبكرًا ثلاث ساعات والتأخر دقيقة واحدة، والوصول المبكر أفضل."],["V01","p","سعادة : ابتسامة",["خوف : ارتجاف","جوع : أكل","شمس : حرارة","بحر : سمك"],"الابتسامة علامة تظهر على الجسد من شعور السعادة، والارتجاف علامة تظهر على الجسد من شعور الخوف."],["V01","p","سواك : أسنان",["ماء : يد","صابون : أوساخ","ممحاة : خطأ","علاج : عين"],"السواك وسيلة تنظيف الأسنان، والماء وسيلة تنظيف اليد: وسيلة تنظيف ثم العضو الذي تنظفه."],["V12","h","يفهم من النص أن الحلول التقنية مثل الري بالتنقيط والأصناف المحسّنة:",["يمكن أن تحد من المشكلة لكن تتطلب موارد مالية وجهود مشتركة.","غير قادرة إطلاقًا على مواجهة آثار التغير المناخي.","متوفرة وسهلة التطبيق بلا أي عوائق.","لا تفيد إلا الدول المتقدمة."],"النص: هذه التقنيات «قد تخفف من الآثار» لكن تتطلب «استثمارات مالية ضخمة وتعاوناً دولياً»."],["V01","p","الليل يستر كما أن النهار ______",["يكشف","يظلم","يغطي","يسكن"],"الليل يستر الأشياء بظلامه، كما أن النهار يكشفها بضيائه: علاقة تضاد."],["V12","h","عدد أسباب عزوف الروس عن الإنجاب في النص:",["5 أسباب","3 أسباب","4 أسباب","6 أسباب"],"النص يعدّد أسباب العزوف: الطلاق، وسوء التخطيط العائلي، وانخفاض مستوى المعيشة، والفقر، والخوف من المستقبل؛ فمجموعها 5."],["V01","p","جبال : رواسي",["نجوم : مضيئة","محطة : فندق","روضة : أزهار","أودية : أشجار"],"الجبال راسية، والنجوم مضيئة: موصوف ثم صفة تلازمه."],["V01","pm2","هرم : جبل",["حية : حبل","شمس : نجم","نهر : مطر","هلال : كرة"],"الهرم يشبه الجبل في هيئته وليس منه، والحية تشبه الحبل وليست منه: شيء يشبه الآخر شكلاً."],["V01","p","المفتاح يفتح الباب كما أن الكتاب يفتح ______",["العقل","السوق","القلب","الزمن"],"المفتاح يفتح الباب المغلق، كما أن الكتاب يفتح أمام العقل أبواب المعرفة."],["V01","h","رصاصة : مسدس",["كلمة : فم","نواة : خلية","شجرة : غصن","دم : وريد"],"الرصاصة تُطلق من المسدس، والكلمة تُطلق من الفم: شيء يُطلق ثم ما يُطلق منه."],["V01","p","سوق : تجارة",["محكمة : قضاء","مدرسة : طلاب","ميدان : فرسان","مسرحية : ممثلون"],"السوق مكان التجارة، والمحكمة مكان القضاء: مكان ثم النشاط الذي يجري فيه."],["V01","p","الصبر مفتاح الفرج كما أن الجد مفتاح ______",["النجاح","القوة","السعادة","الثروة"],"الصبر يوصل إلى الفرج، والجد يوصل إلى النجاح، والقولان مشهوران: «الصبر مفتاح الفرج» و«الجد مفتاح النجاح»."],["V01","p","متعرج : ممر",["معقد : تعبير","نهر : مجرى","طعام : لذيذ","عمل : صعب"],"المتعرج وصف للممر، والمعقد وصف للتعبير: صفة ثم الموصوف بها."],["V01","p","ماء : صافي",["شباب : نضارة","آلة : طباعة","حداثة : قديم","شيخوخة : فتوة"],"الصافي صفة الماء الجيد، والنضارة صفة الشباب: موصوف ثم صفته المميزة."],["V01","p","كرسي : قعود",["جامعة : تعليم","مبيت : بيت","خزانة : غرفة","تبريد : ثلاجة"],"الكرسي مخصص للقعود، والجامعة مخصصة للتعليم: شيء ثم وظيفته."],["V01","p","ملعقة : قدر",["دلو : بئر","شوكة : طعام","سكين : لحم","سكر : سمك"],"الملعقة تغرف ما في القدر، والدلو يغرف ما في البئر: أداة غرف ثم ما تغرف منه."],["V01","pm2","عطس : حمد",["ذنب : استغفار","أكل : شبع","صدق : قول","سمى : أكل"],"العطاس يُتبع بالحمد، والذنب يُتبع بالاستغفار: حدث ثم الذكر الذي يُشرع بعده."],["V01","p","شبل : أسد",["فرخ : عصفور","حصان : حمار","إبل : بعير","خروف : تيس"],"الشبل صغير الأسد، والفرخ صغير العصفور: صغير ثم أصله من النوع نفسه."],["V01","pm2","شرق : غرب",["مطلق : مقيد","فجر : ليل","غامق : أسود","ظلام : ليل"],"الشرق ضد الغرب، والمطلق ضد المقيد: ضدان متقابلان."],["V01","p","أذن : سماعة",["عين : نظارة","ليل : نهار","ملاكم : قفاز","قدم : حذاء"],"السماعة تعين الأذن على السمع، والنظارة تعين العين على البصر: عضو ثم أداة تعينه على وظيفته الحسية."],["V01","p","ورق : مكتبة",["يوم : قرن","سنة : شهر","مدرسة : صف","رطل : وزن"],"اليوم جزء صغير يتألف منه القرن، والورقة جزء يتألف منه ما في المكتبة: جزء أصغر ثم الكل الذي يتألف منه."],["V01","p","موز : فاكهة",["عرب : بشر","غذاء : دواء","ضعيف : قوي","حرب : جنود"],"الموز نوع من الفاكهة، والعرب جماعة من البشر: قسم ثم الجنس الأعم الذي يندرج فيه."],["V01","pm2","العين ترى الأشياء كما أن الأذن ______",["تسمع الأصوات","تذوق الطعام","تشم الروائح","تلمس الأشياء"],"كل حاسة تؤدي وظيفتها الخاصة، وظيفة العين الرؤية ووظيفة الأذن سماع الأصوات."],["V01","pm2","فسيلة : نخلة",["شتلة : شجرة","جذع : غصن","ثمار : أوراق","عنب : حصرم"],"الفسيلة غرس صغير يصير نخلة، والشتلة غرس صغير يصير شجرة: غرس صغير ثم ما يكبر إليه."],["V01","p","سيف : صارم",["عسل : نقي","طفل : شاب","نفَّس : نفَس","صافي : ماء"],"الصارم صفة مدح للسيف القاطع، والنقي صفة مدح للعسل الخالص: موصوف ثم صفة جودته."],["V01","h","مِكر : مِفر",["مقبل : مدبر","تقهقر : تراجع","سلام : حرب","شهيق : زفير"],"«مِكَرّ» للإقبال على العدو و«مِفَرّ» للإدبار عنه، كما مقبل ومدبر: ضدان في الإقبال والإدبار."],["V01","p","طاردة : جاذبة",["عسر : يسر","حزينة : كئيبة","سعيدة : مبتسمة","عجيب : مدهش"],"الطاردة ضد الجاذبة، والعسر ضد اليسر: ضدان."],["V01","p","روح : جسد",["معنى : لفظ","كلمة : قول","حبر : قلم","غابة : جبال"],"الروح أمر معنوي يحل في الجسد المحسوس، والمعنى يحل في اللفظ: معنوي يحل في محسوس."],["V01","p","النحل ينتج العسل كما أن الشجر ينتج ______",["الثمار","المطر","الرياح","الزهور"],"النحل ينتج العسل الذي يؤكل، كما أن الشجر ينتج الثمار التي تؤكل: منتَج غذائي."],["V01","pm2","حافر : خيل",["ظلف : ماعز","أسد : خف","ذئب : مخلب","إنسان : ساق"],"الحافر قدم الخيل، والظلف قدم الماعز: نوع القدم ثم الحيوان الذي يمشي عليه."],["V01","pm2","الكتاب صديق وفي كما أن القمر ______",["جمال في الليل","ضوء في النهار","دفء في الشتاء","نجم في السماء"],"القمر زينة الليل وأنيسه، كما أن الكتاب أنيس الوحدة: كل منهما رفيق جميل في وقته المناسب."],["V01","p","صدق : حقيقة",["تأمل : إبداع","غضب : غرور","فقر : كراهية","غني : كرم"],"الصدق طريق يؤدي إلى الحقيقة، والتأمل طريق يؤدي إلى الإبداع: طريق ثم غايته."],["V01","pm2","صحراء : فلاة",["يأس : قنوط","حياة : شقاء","سيف : معركة","جفاف : رطوبة"],"الصحراء والفلاة بمعنى واحد، كما اليأس والقنوط: مترادفان."],["V01","p","صدق : حقيقة",["خوف : إحجام","غنى : كرم","فقر : كراهية","غضب : غرور"],"الصدق يؤدي إلى الحقيقة، والخوف يؤدي إلى الإحجام: سبب ثم أثره الملازم."],["V01","p","الكتب تحفظ العلوم كما أن المتاحف تحفظ ______",["الآثار","الأموال","الأفكار","الأشجار"],"الكتب تحفظ العلوم، كما أن المتاحف تحفظ الآثار: مكان وما يحفظه من تراث الماضي."],["V01","p","جوع : أكل",["عطش : ماء","خوف : ارتجاف","شمس : ضوء","عين : دمع"],"الأكل يزيل الجوع، كما أن الماء يزيل العطش: حاجة وما يسدّها."],["V01","p","جمع : تصنيف",["تشاور : اختيار","حصد : زراعة","استرجاع : تذكر","تأليف : بحث"],"الجمع تحضير يسبق التصنيف ويُبنى عليه، كما التشاور يسبق الاختيار: الأول خطوة تمهيدية للثاني."],["V12","h","أي من الفوائد التالية للقراءة ذكرها النص؟",["تحسين مهارات حل المشكلات واتخاذ القرارات","تقليل الوقت أمام الشاشات فقط","زيادة الاعتماد على الأجهزة الإلكترونية","قلة التركيز والانتباه"],"قال النص: يمتلك القارئون «مهارات أفضل في حل المشكلات واتخاذ القرارات»."],["V01","pm2","نار : دخان",["مطر : بلل","يد : أصابع","بيت : جدران","كتاب : مكتبة"],"النار يخرج منها الدخان، كما أن المطر يحدث البلل: سبب ونتيجة."],["V01","p","جدب : مجاعة",["طوفان : غرق","كذب : إفك","فقر : صحة","انفجار : ضغط"],"الجدب يسبب المجاعة، والطوفان يسبب الغرق: سبب ثم نتيجته."],["V10","h","قررت المؤسسة الاستغناء عن ربع موظفيها؛ نظرًا لزيادة مدخولاتها.",["زيادة","الاستغناء","ربع","نظرًا"],"سبب الاستغناء عن الموظفين نقص المدخولات لا زيادتها؛ الصواب: نقص."],["V01","p","أقدم : أحجم",["اتفق : اختلف","كفَّ : رجع","أنصف : نصر","كافأ : قدَّر"],"الإقدام ضد الإحجام، والاتفاق ضد الاختلاف: ضدان."],["V01","p","اليد تعمل كما أن العقل ______",["يفكر","يسمع","يتكلم","يتنفس"],"اليد وظيفتها العمل، كما أن العقل وظيفته التفكير."],["V01","p","ورقة : كتاب",["يوم : سنة","قرن : يوم","سلسلة : حلقة","وزن : رطل"],"اليوم جزء من السنة، والورقة جزء من الكتاب: جزء أصغر ثم الكل الذي يتألف منه."],["V01","p","حقيبة : حفظ",["سكين : قطع","ممحاة : إخفاء","كأس : عصير","دواء : صيدلية"],"الحقيبة أداة تؤدي وظيفة الحفظ، والسكين أداة تؤدي وظيفة القطع: أداة ثم وظيفتها الحقيقية."],["V01","pm3","نطفة : علقة",["دقيق : عجين","شرنقة : يرقة","نهر : رافد","تمر : رطب"],"النطفة تتحول إلى علقة، والدقيق يتحول إلى عجين: مرحلة أولى ثم المرحلة التي تليها."],["V01","pm3","دجاج : شعير",["صقور : لحم","عشب : حصان","حمام : بيض","خروف : لحم"],"الدجاج يأكل الشعير، والصقور تأكل اللحم: حيوان ثم غذاؤه."],["L01","pom1","مكتبة تعطي خصماً 20% لكل من يشتري بـ 250 ريالاً أو أكثر. أي العبارات الآتية غير صحيحة؟",["يلزم الشراء بـ 300 ريال للحصول على الخصم","الشراء بـ 400 ريال يعطي خصماً قدره 80 ريالاً","الشراء بـ 200 ريال لا يعطي أي خصم","الشراء بـ 250 ريالاً يعطي خصماً قدره 50 ريالاً"],"الحد الأدنى للخصم 250 ريالاً لا 300، فهذه العبارة غير صحيحة؛ والباقي صحيح."],["L01","pom1","مستشفى يريد اختيار أطباء من كل قسم للتحدث عن قسمهم ، وطريقة اختيارهم ستكون عشوائية ما هي العينة الأفضل لاستخدامها ؟",["عينة عشوائية طبقية ( إجابة مختبر )","عينة عشوائية بسيطة","عينة عشوائية منتظمة","عينة عشوائية عنقودية"],"الأطباء مقسمون إلى أقسام، والعينة الطبقية تمثل كل قسم (طبقة) بعدد من أطبائه عشوائياً."],["F01","pom1","في كل صف (من اليمين) يُركَّب الشكل الثالث من الشكلين الأولين بقاعدة واحدة. ما الشكل الناقص؟",["شكل 4","شكل 1","شكل 2","شكل 3"],"عند تركيب الشكلين يبقى كل قطر ظهر في أحدهما فقط، ويختفي القطر المشترك بينهما. في الصف الأول اختفى القطر الرأسي لأنه في الشكلين. وفي الصف الثاني القطر المائل إلى اليسار مشترك فيختفي، ويبقى الأفقي من الأول والمائل إلى اليمين من الثاني."],["L01","pom1","خمس أخوات: ريم، ليان، جود، تالا، دانة. جود أكبر من ليان وأصغر من دانة، وليان أكبر من ريم، وتالا أصغر من ريم. من الأخت التي في الوسط عمراً؟",["ليان","جود","تالا","ريم"],"الترتيب من الأصغر: تالا، ريم، ليان، جود، دانة. الثالثة في الترتيب ليان."],["L01","po","خمسة طلاب أوائل، كل واحد من فصل: 2/1، 2/2، 2/3، 2/4، 2/5، ورُتّبوا من 1 إلى 5. صاحبا المركزين 4 و 5 من الفصلين 2/4 و 2/5، وصاحبا المركزين 1 و 2 من الفصلين 2/2 و 2/3، والفرق بين مركز طالب 2/3 ومركز طالب 2/5 مركزان. ما مركز طالب الفصل 2/2؟",["الأول","الرابع","الثاني","الثالث"],"طالب 2/3 في 1 أو 2، وطالب 2/5 في 4 أو 5، والفرق 2، فلا يصح إلا 2/3 ثانياً و 2/5 رابعاً. إذن 2/2 الأول."],["L01","pom1","كم الوقت الصحيح الآن؟",["7:55","4:35","7:25","8:55"],"الوقت الحقيقي في الساعة = 12:00 − 4:20 = 7:40، والساعة متأخرة فنضيف 15 دقيقة: 7:55."],["F01","pom2","بين الأشكال الآتية علاقة منطقية إلا شكلاً واحداً. أيها؟",["شكل 2","شكل 1","شكل 3","شكل 4"],"كل شكل خط يلتف إلى الداخل. تتبّعه من طرفه الخارجي إلى المركز: في ثلاثة أشكال يلتف في اتجاه واحد، وهي الشكل نفسه بعد تدويره. وفي المختلف يلتف في الاتجاه المعاكس، فهو صورته في المرآة."],["L01","pom1","تكثر حوادث دهس الأطفال قرب مدرسة ابتدائية في أحد الأحياء بسبب سرعة السيارات. ما أنسب حل؟",["مطبات صناعية عند المدرسة مع توعية الطلاب","نقل المدرسة إلى أطراف المدينة بعيداً عن الحي","تأخير بداية الدوام المدرسي ساعة كاملة","منع السيارات من دخول الحي طوال اليوم"],"السبب سرعة السيارات قرب المدرسة، فالحل المباشر مطبات تجبر السائقين على التخفيف عندها، مع توعية الطلاب."],["L01","pom1","رتّب سلمان سبعة كتب على رف في مواضع مرقّمة من 1 إلى 7 من اليمين: كتابا تاريخ، وكتابا علوم، وروايتان، ومعجم. كتابا التاريخ في الطرفين، والروايتان متجاورتان وإحداهما في الموضع 5، وكتابا العلوم غير متجاورين، والمعجم لا يجاور رواية ولا كتاب تاريخ. ما موضعا كتابي العلوم؟",["2 و 4","4 و 6","3 و 6","2 و 6"],"التاريخ في 1 و 7. لو كانت الروايتان في 4 و 5 لجاور المعجمُ رواية أو تاريخاً حيثما وُضع، فهما في 5 و 6. يبقى 2 و 3 و 4: المعجم في 3، والعلوم في 2 و 4."],["F05","ho","كم مثلثاً في الشكل الآتي: مثلث تخرج من رأسه خطوط إلى قاعدته، ويقطعه خطان أفقيان؟",["18","9","12","6"],"كل مثلث هنا رأسه الرأس العلوي، وضلعاه خطان من الخطوط الخارجة منه، وقاعدته على أحد الخطوط الأفقية. من الرأس 4 خطوط تكوّن 6 أزواج، فكل خط أفقي يعطي 6 مثلثات. والخطوط الأفقية 3 (القاعدة والخطان)، فالمجموع 6 × 3 = 18."],["L01","ho","مديرة مدرسة مكتبها عند المدخل في الدور الأرضي، وتريد متابعة حضور الإداريات صباحاً بنفسها، ومكتب الإداريات في الدور الرابع. ما الإجراء الأنسب؟",["نقل مكتب الإداريات إلى جوار مكتبها","تخصيص مصعد يصعد بالإداريات مباشرة إلى الرابع","نقل مكتبها هي إلى الدور الثاني","نقل مكتب الإداريات إلى الدور الثالث"],"تريد أن ترى الحضور بنفسها، فأقرب حل أن يكون مكتب الإداريات بجوارها عند المدخل."],["L01","po","كم قيمة الهلال؟",["5","9","4","7"],"من المعادلة الثالثة: نجمة + هلال = 9. نطرح الأولى من الثانية: سهم − هلال = 2. نعوّض في الأولى: 9 + هلال + 2 + هلال = 21، فالهلال 5، والنجمة 4، والسهم 7."],["L01","pom1","أحمد - خالد - وليد - حمد ذهبوا إلى رحلة كل منهم لديه شنطة وكانت أوزانها 5 و 10 و 11 و 13 على التوالي، شنطة خالد أثقل من وليد وأخف من حمد، شنطة أحمد أثقل من حمد، شنطة وليد هي الأخف، فكم وزن شنطة حمد؟",["11","5","10","13"],"الشروط ترتب الأوزان: وليد (الأخف) < خالد < حمد < أحمد، فتتوزع 5 و10 و11 و13 بالترتيب، فشنطة حمد 11."],["L01","pom1","متجر عطور يعطي خصماً 10% لمن يشتري بـ 500 ريال أو أكثر. أي العبارات الآتية صحيحة؟",["الشراء بـ 600 ريال يعطي خصماً قدره 60 ريالاً","الشراء بـ 450 ريالاً يعطي خصماً قدره 45 ريالاً","الشراء بـ 500 ريال يعطي خصماً قدره 10 ريالات","الشراء بـ 700 ريال يعطي خصماً قدره 50 ريالاً"],"600 فوق الحد، و 10% × 600 = 60 ريالاً."],["F01","pom1","في كل خيار زوج من إطارين يُقرأ من اليمين. في أي زوج يكون الإطار الثاني هو الأول بعد دورانه ربع دورة مع عقارب الساعة؟",["شكل 3","شكل 1","شكل 2","شكل 4"],"عند الدوران ربع دورة مع عقارب الساعة ينتقل أعلى الراية إلى اليمين، ويبقى العلم في جهته من السارية (امشِ على السارية من أسفلها إلى رأسها: العلم يبقى على يمينك). وهذا يتحقق في زوج واحد فقط."],["F01","po","تُركَّب البطاقتان خانةً بخانة بهذه القواعد: نقطة مع نقطة = حلقة، ونقطة مع حلقة = فراغ، وحلقة مع حلقة = نقطة، والفراغ مع أي شيء = الشيء نفسه. ما البطاقة الناتجة من تركيب البطاقتين؟",["شكل 3","شكل 1","شكل 2","شكل 4"],"نركّب كل خانة مع نظيرتها. الصف الأعلى (من اليمين): نقطة مع نقطة = حلقة، وحلقة مع نقطة = فراغ. الأوسط: فراغ مع حلقة = حلقة، ونقطة مع فراغ = نقطة. الأسفل: حلقة مع فراغ = حلقة، وحلقة مع حلقة = نقطة."],["L01","pom1","في سباق جري: مازن في المقدمة وخلفه هشام مباشرة، وخلف هشام كلٌّ من ياسر وعادل، وكلاهما أمام صالح. ثم انسحب هشام، وتقدّم عادل على مازن، ثم تجاوز صالح ياسر. من يلي مازن مباشرة الآن؟",["صالح","عادل","هشام","ياسر"],"بعد انسحاب هشام وتقدّم عادل: عادل، مازن، ياسر، صالح. ثم تجاوز صالح ياسر: عادل، مازن، صالح، ياسر."],["F01","ho","تأمل السلسلة الآتية من اليمين، وانتبه إلى الشكل الداخلي في كل إطار. ما الإطار الخامس؟",["شكل 3","شكل 1","شكل 2","شكل 4"],"الشكل الداخلي في كل إطار يصير هو الخارجي في الإطار الذي يليه، والداخلي الجديد يأتي بالدور: مثلث ثم مربع ثم دائرة. وتصميت الداخلي يتناوب: مصمت ثم مفرغ. فالخامس مربع بداخله دائرة مصمتة."],["L01","po","مركز بحوث قام بتقديم نوعين مختلفة من الطعام لفئتين من الطيور ، وانتظر تأثيرها ليتم النظر إلى ردود أفعالها ، ثم يقوم بتحليل النتائج . ما هو نوع الدراسة التي قام بها المركز؟",["تجربة","دراسة قائمة على الملاحظة","دراسة مسحية","محاولة وخطأ"],"قدّم نوعين من الطعام لفئتين وراقب الأثر وحلله، وهذا تدخل وقياس للنتيجة: تجربة."],["L01","pom1","أظهر مسح صحي في قرية أن 15% من أطفالها دون الخامسة مصابون بفقر الدم، بينما لا تكاد تُسجَّل حالات بين البالغين. ما الإجراء الذي تدعمه هذه النتيجة؟",["فحص الأطفال والحوامل وتوعية الأسر بتغذية الطفل","نقل سكان القرية إلى مدينة قريبة","تكثيف فحص كبار السن والبالغين في القرية","إغلاق دور حضانة الأطفال في القرية مؤقتاً"],"المشكلة متركزة في صغار الأطفال، فالإجراء المناسب يستهدفهم ويستهدف تغذيتهم من الحمل."],["L01","pom1","كم قيمة المفتاح؟",["5","7","3","6"],"نطرح الثانية من الأولى: نجمة − قمر = 3، فالقمر = نجمة − 3. نعوّض في الأولى: 3 × نجمة + مفتاح = 23، ومع الثالثة (نجمة + 3 × مفتاح = 21) تكون النجمة 6 والمفتاح 5 والقمر 3. تحقق: 6 + 5 + 5 + 5 = 21."],["L01","pom1","إذا كان اليوم هو الأثنين بعد 213 ما هو اليوم؟",["الخميس","الأحد","ناقص","ناقص"],"213 ÷ 7 = 30 والباقي 3، فنتقدم 3 أيام من الاثنين: الثلاثاء، الأربعاء، الخميس."],["F01","ho","في السلسلة الآتية (من اليمين) عمود من ثلاث خانات وخانة جانبية. ما الإطار الرابع؟",["شكل 4","شكل 1","شكل 2","شكل 3"],"الخانة السوداء تنزل في العمود خانة في كل خطوة، فإذا بلغت الأسفل رجعت إلى الأعلى. والخانة الجانبية تتبادل الجهتين: يمين ثم يسار ثم يمين. فالرابع: السوداء في أعلى العمود، والخانة الجانبية في اليسار."],["L01","pom1","محل أحذية يعطي خصماً 25% لمن يشتري بـ 200 ريال أو أكثر. أي العبارات الآتية غير صحيحة؟",["الشراء بـ 400 ريال يُدفع بعده 100 ريال","الشراء بـ 180 ريالاً لا يعطي أي خصم","الشراء بـ 320 ريالاً يعطي خصماً قدره 80 ريالاً","الشراء بـ 200 ريال يُدفع بعده 150 ريالاً"],"خصم 400 هو 25% × 400 = 100، فالمدفوع 300 لا 100؛ العبارة خلطت الخصم بالمدفوع."],["L01","po","كم مربعاً نحتاج لتوازن 3 نجوم؟",["4","12","6","3"],"بالتعويض يكون المربع = 3 دوائر والنجمة = 4 دوائر (تحقّق: 8 + 1 = 9، 4 + 2 = 6)؛ فالنجوم الثلاث = 12 دائرة = 4 مربعات."],["F01","po","في كل صف (من اليمين) خمسة أشكال، وكل صف ينتج من الذي فوقه بإعادة الترتيب نفسها. ما الصف الرابع؟",["شكل 3","شكل 1","شكل 2","شكل 4"],"نتتبع المواضع بين الصف الأول والثاني: الموضع الأول في الثاني أخذ شكل الموضع الثالث، والثاني أخذ الأول، والثالث أخذ الخامس، والرابع أخذ الثاني، والخامس أخذ الرابع. والقاعدة نفسها تنقل الصف الثاني إلى الثالث. نطبّقها على الثالث فنحصل على الرابع."],["L01","pom1","أي العبارات تتفق مع نتائج الدراسة؟",["الأعلى ثقة بنفسه أقل اعتماداً على غيره","الأعلى ثقة بنفسه أكثر اعتماداً على غيره","الصفتان ترتفعان معاً عند الطلاب","لا علاقة بين الصفتين في هذه العينة"],"الثقة تنزل من 82 إلى 44 بينما الاعتماد يصعد من 18 إلى 58، فالعلاقة عكسية."],["L01","pom1","أراد أستاذ تنظيم ورشة عمل في أحد المستشفيات ، فاستعان ببعض الأطباء والاستشاريين من أجل أن يتحدثوا عن أقسامهم، ويكونوا عينة لدراسته. ما هي أفضل طريقة لإختيار العينة؟",["أن تكون عينة عشوائية طبقية","أن تكون عينة عشوائية منتظمة","أن تكون عينة عشوائية بسيطة","أن تكون عينة عشوائية عنقودية"],"الأطباء والاستشاريون موزعون على أقسام، فالعينة الطبقية تضمن تمثيل كل قسم بعدد من أطبائه عشوائياً."],["L01","pom1","رجل أرمل له أطفال تزوج أرملة لها أطفال، وبعد سنوات صار مجموع الأطفال كلهم 14، ولكل واحد من الزوجين 11 طفلاً. كم طفلاً أنجبا معاً؟",["8","6","3","11"],"أطفاله السابقون أ، وأطفالها السابقون ب، والمشترك م: أ + م = 11، ب + م = 11، أ + ب + م = 14. نجمع الأوليين: 22 − 14 = 8."],["L01","po","عمر سلمان قبل 8 سنوات كان يساوي 7 أمثال عمر ابنته الآن، وابنته سيصبح عمرها بعد 3 سنوات 8 سنوات. كم عمر سلمان الآن؟",["43","64","27","35"],"عمر البنت الآن 8 − 3 = 5. عمر سلمان قبل 8 سنوات = 7 × 5 = 35، فعمره الآن 35 + 8 = 43."],["L01","pom2","شاحنة اصطدمت بسور مدرسة وغادرت. سبعة شهود وصفوا لوحتها: خمسة قالوا إن الحرف الأول (د) واثنان قالا (ذ)، وأربعة قالوا إن الحرف الثاني (ك) وثلاثة قالوا (ل)، وستة قالوا إن الحرف الثالث (هـ)، وأربعة قالوا إن الأرقام تبدأ بـ 38 وثلاثة قالوا 83، واتفقوا أن آخر رقم 6. ما اللوحة الأرجح؟",["د ك هـ 386","ذ ل هـ 836","د ل هـ 386","د ك هـ 836"],"نأخذ في كل خانة ما قاله أكثر الشهود: د (5 مقابل 2)، ك (4 مقابل 3)، هـ، 38، ثم 6."],["L01","pom2","ما رقم الشهر في التاريخ الذي يسبق 15/4/1446 هـ بسنتين وسبعة أشهر؟",["9","3","11","8"],"لا تكفي 4 أشهر لطرح 7، فنستلف سنة: 4 + 12 − 7 = 9، والسنة 1446 − 2 − 1 = 1443. التاريخ 15/9/1443."],["F01","pom2","في المصفوفة الآتية دوائر فيها أسهم، والصفوف تُقرأ من اليمين. ما الدائرة الناقصة؟",["شكل 2","شكل 1","شكل 3","شكل 4"],"في كل صف يدور السهم ثُمن دورة مع عقارب الساعة من خانة إلى التي بعدها، وأول كل صف يدور ربع دورة عن أول الصف الذي فوقه. فأول الصف الثالث إلى الأسفل، وبعده إلى أسفل اليسار، ثم إلى اليسار."],["L01","pom2","حدثت عملية سرقة لإحدى البنوك ، وعندما جاءت الشرطة هرب السارق ولحقت به الشرطة وأمسكت بأربعة متهمين : (أعمى وأصم ومشلول شلل نصفي وآخر سليم) أي منهم لا يمكن أن يكون السارق؟",["المشلول","الأعمى","الأصم","السليم"],"الشهود رأوا السارق يهرب ويركض، والمشلول شللاً نصفياً لا يقدر على الركض، فلا يمكن أن يكون هو."],["V12","ho","أي الآراء الآتية يدعمه موقف الموظفة بشأن تدريس الإنجليزية في التعليم العام؟",["مفيد في مواقف كالدراسة في الخارج","نفعه مقصور على التخصصات الأدبية","أثره محايد لا ينفع ولا يضر","غير ضروري لأن الدورات تغني عنه"],"الموظفة وجدت أن أساسها من التعليم العام اختصر عليها الاستعداد، فهذا يدعم فائدته في مثل موقفها."],["L01","pom2","ما التقييم الأدق لهذه الدراسة؟",["تُظهر ارتباطاً في العينة ولا تثبت أن الغذاء هو السبب","تثبت أن الأطعمة المقلية هي سبب ارتفاع الكوليسترول","لا فائدة منها لأن عدد من ارتفع لديهم قليل","تثبت أن الخضار والفواكه تمنع ارتفاع الكوليسترول"],"الدراسة رصدت ما حدث في مجموعات لم تُضبط فيها عوامل أخرى كالعمر والوراثة، فتصلح لإظهار ارتباط لا لإثبات سبب."],["L01","po","الأشكال الأربعة في الأعلى رموزها من اليمين: «ط س»، «ط ع»، «ق ع»، «ق ن». أي الأشكال الآتية رمزه «ط ن»؟",["شكل 4","شكل 1","شكل 2","شكل 3"],"الشكلان الأول والثاني مربعان ورمزاهما يبدآن بـ«ط»، والثالث والرابع معيّنان ويبدآن بـ«ق»، فالحرف الأول للشكل الخارجي. والثاني والثالث فيهما علامة + ويشتركان في «ع»، فالحرف الثاني للعلامة، و«ن» للنقطة. فـ«ط ن» مربع فيه نقطة."],["F01","pom1","عجلة على أرض مستوية وعلى أعلى محيطها نقطة. تتدحرج العجلة إلى اليمين دورة كاملة حتى تصل إلى الموضع المتقطع. أي المسارات الآتية ترسمه النقطة؟",["شكل 3","شكل 1","شكل 2","شكل 4"],"النقطة تدور حول مركز العجلة والمركز يتقدم معاً: في البداية تتقدم بسرعة إلى الأمام وتنزل، وفي منتصف الدورة تلمس الأرض فتقف لحظة، فيظهر في المسار رأس مدبب على الأرض، ثم تصعد حتى تعود إلى أعلى العجلة في موضعها الجديد. فالمسار قوسان ملتقيان عند الأرض في رأس مدبب."],["L01","pom2","ما علاقة الكم والكيف في المجال الوظيفي :",["الكيف يأتي أولا وعلى أساسه يتم تحديد الكم .","الكم أهم من الكيف .","الكم يأتي أولاً وعلى أساسه يتحدد الكيف","الكم والكيف لهما نفس الأهمية."],"في العمل تُحدَّد الجودة المطلوبة (الكيف) أولاً، ثم يُقدَّر العدد اللازم (الكم) لتحقيقها."],["L01","pom2","حدث حريق في إحدى البقالات الموجودة في المحطة، و عند وصول الدفاع المدني قامت باستدعاء صاحب البقالة، ما هو الشيء الذي لن يتم محاسبة صاحب البقالة عليه؟",["عدم التواصل مع شركة الكهرباء","عدم اجراء فحص دوري","عدم وجود طفايات حريق","عدم صيانة الامدادات الكهربائية"],"فحص الأمان والطفايات وصيانة الكهرباء من مسؤوليات صاحب البقالة، أما التواصل مع شركة الكهرباء فليس من واجباته."],["L01","pom2","أربعة إخوة: طلال، نبيل، أيمن، هشام، أعمارهم 30 و 28 و 26 و 24. قال طلال: عمري أكثر من 29، وقال نبيل: عمري 28، وقال أيمن: لست الأصغر. اثنان من الثلاثة صادقان وواحد كاذب. وإذا رُتّبوا من الأكبر جاء نبيل بعد طلال مباشرة وقبل هشام مباشرة. من عمره 24؟",["أيمن","طلال","نبيل","هشام"],"طلال ونبيل وهشام متتالون، فأيمن أول أو أخير. لو كان أول لصار طلال 28 ونبيل 26 فيكذب اثنان. إذن أيمن الأخير بعمر 24، وهو الكاذب."],["L01","po","لكل صندوق رمز من حرفين. الصناديق الأربعة في الأعلى رموزها من اليمين: «ف ك»، «ر ل»، «ن م»، «ر م». ما رمز الصندوق المرسوم في الأسفل؟",["ن ك","ن ل","ك ن","ر ك"],"الصندوقان الثاني والرابع يشتركان في «ر» وفي الدائرتين الطرفيتين المصمتتين، فالحرف الأول للطرفيتين. والثالث والرابع يشتركان في «م» وفي الوسطى المخططة، فالحرف الثاني للوسطى. فالطرفيتان الفارغتان «ن»، والوسطى المصمتة «ك»، والرمز «ن ك»."],["L01","pom2","ما مهمة طارق؟",["شراء المقاضي","غسل السيارة","ترتيب المجلس","ري الحديقة"],"مشاري للمجلس، وطارق يعمل السبت أو الثلاثاء. فهد قبل مشاري ولا يغسل السيارة، فيأخذ ري الحديقة. المجلس لا يكون الأحد ولا الثلاثاء، والسبت يجعل فهد بلا يوم قبله، فالمجلس الاثنين. الحل: فهد ري الحديقة السبت، ونايف غسل السيارة الأحد، ومشاري المجلس الاثنين، وطارق المقاضي الثلاثاء."],["L01","pom2","إذا كان اليوم الذي بعد غدٍ هو اليوم الثالث بعد الأحد، فما اليوم الذي كان قبل أمس؟",["السبت","الأحد","الجمعة","الاثنين"],"الثالث بعد الأحد هو الأربعاء، فاليوم الاثنين، وقبل أمس السبت."],["L01","pom2","ست أخوات: مها، شهد، أروى، بشرى، منار، رهف، كل واحدة في صف مختلف من الأول المتوسط إلى الثالث الثانوي. شهد أكبر من أروى ومنار لكنها أصغر من بشرى، وبشرى أكبر من رهف لكنها أصغر من مها. من تدرس في الصف الثاني الثانوي؟",["بشرى","شهد","مها","منار"],"مها أكبر من بشرى، وبشرى أكبر من شهد ورهف، وشهد أكبر من أروى ومنار. فمها في الثالث الثانوي، وبشرى بعدها في الثاني الثانوي."],["L01","po","درجة مصعب أعلى من خالد ولكنه دون عبدالله، ودرجة ياسر أعلى من وليد ولكنه دون مصعب، من الأعلى درجة؟",["عبدالله","مصعب","وليد","ياسر"],"الترتيب: عبدالله > مصعب > ياسر > وليد، ومصعب > خالد أيضاً، فالأعلى درجة عبدالله."],["F01","pom2","الشكل الأول بالنسبة إلى الثاني مثل الثالث بالنسبة إلى أي شكل؟ قارن الحجم وسُمك
