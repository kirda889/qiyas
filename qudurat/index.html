الخطوط.",["شكل 2","شكل 1","شكل 3","شكل 4"],"في الزوج الأول صغُر المثلث وبقيت النقطة التي فيه كما هي، وأحاط به مثلث رفيع الخط بحجمه الأصلي. فالمربع الذي فيه حلقة يصغر وتبقى حلقته، ويحيط به مربع رفيع."],["L01","pom2","أي العبارات الآتية صحيحة بالضرورة؟",["ص أصغر من 5","س − ص = 1","س عدد زوجي","س أكبر من 6"],"الأزواج الممكنة (س، ص): (5، 4) و(6، 3) و(7، 2) و(8، 1)، وفيها كلها ص أصغر من 5."],["L01","pom2","سبع أخوات بين كل واحدة والتي تليها سنتان، كبراهن 22 سنة وصغراهن 10. هيا أكبر من سلمى بـ 4 سنوات، وأكبر من لين بـ 8 سنوات، وريما أكبر من سلمى وأصغر من نوف، ووعد هي الكبرى. كم عمر جنى؟",["12","14","16","10"],"الأعمار 10 إلى 22 بخطوة 2. وعد 22، ثم هيا 18 ولين 10 وسلمى 14 وريما 16 ونوف 20، فتبقى 12 لجنى."],["L01","pom2","قال أحد الباحثين: «نسبة من ارتفع لديهم الكوليسترول بين آكلي الأطعمة المقلية في هذه العينة أعلى منها بين آكلي الخضار والفواكه». ما الحكم على قوله؟",["موافق للمنهج؛ وصف الفرق دون ادعاء سبب","مخالف؛ لأن المجموعات غير متساوية العدد","لا يمكن الحكم إلا بمعرفة أعمار المتطوعين","مخالف للمنهج؛ لأنه أثبت سبباً من مقارنة"],"القول مقارنة لنسبتين في العينة نفسها (45% مقابل 10%)، ولم يدّعِ أن الطعام سبب الارتفاع."],["Q01","pom2","ما قيمة المقدار: 7/40 + (1/2 × 2/5 × 3/4 × 1/3)؟",["9/40","13/40","2/15","1/5"],"الضرب: (1 × 2 × 3 × 1)/(2 × 5 × 4 × 3) = 6/120 = 1/20 = 2/40، ثم 7/40 + 2/40 = 9/40."],["L01","pom2","خمسة أصدقاء: بندر، سلمان، فهد، ثامر، عادل. ثامر أقصر من بندر وفهد وأطول من عادل، وفهد يأتي بعده اثنان في الترتيب من الأطول، ويأتي بعد سلمان مباشرة. من الأطول؟",["بندر","ثامر","سلمان","فهد"],"فهد ثالث وسلمان ثانٍ. ثامر أقصر من فهد وأطول من عادل، فثامر رابع وعادل خامس، ويبقى الأول لبندر."],["L01","po","خمس أخوات: هيا أكبر من سارة، ونورة أصغر من سارة، وريم أكبر من هيا، ولمى أصغر من سارة وأكبر من نورة. من الثانية في الترتيب من الأصغر؟",["لمى","سارة","هيا","نورة"],"الترتيب من الأكبر: ريم، هيا، سارة، لمى، نورة؛ فالثانية من الأصغر لمى."],["Q01","po","كم كتاباً طبعتها المطبعة في الأشهر الستة، بالمئات؟",["180","165","30","160"],"المجموع = 15 + 40 + 35 + 25 + 45 + 20 = 180 مئة كتاب."],["L01","pom2","أي المقترحات الآتية احتياط فردي لا يعالج المشكلة من أساسها؟",["أن يُدخل كل ساكن دراجته إلى منزله","تشجيع السكان على الإبلاغ عن المشتبه بهم","تعيين حارس للمواقف في ساعات الليل","تركيب كاميرات وإنارة في مواقف الحي"],"إدخال الدراجة يحمي صاحبها وحده، ويبقى السارق والموقف كما هما؛ أما بقية المقترحات فتردع السرقة في الحي كله."],["F01","pom2","في كل إطار عقرب طويل وعقرب قصير ينتهي بنقطة، والسلسلة تُقرأ من اليمين. ما الإطار الخامس؟",["شكل 4","شكل 1","شكل 2","شكل 3"],"العقرب الطويل يدور ثُمن دورة (45 درجة) مع عقارب الساعة في كل خطوة: أعلى، ثم أعلى اليمين، ثم يمين، ثم أسفل اليمين، فيصير إلى الأسفل. والقصير يدور ربع دورة عكس عقارب الساعة: يمين، ثم أعلى، ثم يسار، ثم أسفل، فيصير إلى اليمين."],["L01","pom2","طلاب ارتكبوا مخالفة مدرسية بالمدرسة استداعهم المدير علماً ان 3 منهم صادقين و2 منهم كاذبين. بندر ، تميم ، شادي، فهد ، رامي. - بندر قال: رامي هو المذنب (✅) - شادي قال: رامي ليس المذنب (❌) - فهد قال: كلام بندر صحيح (✅) - تميم قال: انا لست مذنباً (✅) - رامي قال: انا لم افعلها كلام شادي صحيح (❌) . من المذنب؟",["رامي","بندر","شادي","تميم"],"لو كان رامي المذنب: بندر وفهد وتميم صادقون (3)، وشادي ورامي كاذبان (2)، وهذا يطابق الشرط."],["L01","pom2","صاحب محطة لديه 10 طفايات حريق يريد أن يأخذ تصريح من الأمن والسلامة بأن يضعها في محطته فقام بتعليقها بجانب خزان تعبئة الوقود ومع ذلك رفض الدفاع المدني من إعطاءه تصريح لإستكمال اجراءاته. ماهو سبب الرفض؟",["من المفترض أن يضعها في مكان آخر أو ( أن يضعها في مكان بارز بعيداً عن خزان الوقود).","من المفترض أن يضعها في الأرض لأنه لا توجد حوائط.","من المفترض أن تُوزع بشكل أفضل.","من المفترض أن يضع لوحة تنبه بوجود طفاية حريق."],"الطفاية بجانب خزان الوقود في موضع الخطر نفسه، فلا يمكن الوصول إليها عند الحريق؛ يجب وضعها في مكان بارز بعيد عن الخزان."],["F01","pom2","الشكل الأول بالنسبة إلى الثاني مثل الثالث بالنسبة إلى أي شكل؟ انتبه إلى النصف المظلل وإلى الذراع القصيرة.",["شكل 3","شكل 1","شكل 2","شكل 4"],"من الأول إلى الثاني انتقلت الذراع القصيرة إلى الجهة المقابلة، وبقي النصف المظلل في مكانه (الأيسر). لو انقلب الشكل كله لانتقل التظليل إلى اليمين. فالمربع يبقى نصفه العلوي مظللاً، وتنتقل ذراعه من اليمين إلى اليسار."],["L01","po","بعض المؤسسات الصغيرة تبذل كل ما بوسعها، وتلحق موظفيها بدورات، حتى يكتسبوا مستوى عالي من مهارة العمل والحرف باليد، إلا أن المحفزات ضعيفة، ومستوى الموظفين لم يتحسن، ولا بد من التدريب وأن يكون رسمي. ماهي الطريقة الرسمية التي يمكن أن تستعملها المؤسسة؟ أو سيكون السؤال س/ ماهو نوع التدريب الرسمي؟",["إلحاقهم بأخصائيين (أو إقامة دورات من متخصصين)","مشاركة شخص محترف مع شخص عادي في العمل.","إذا غاب شخص يحل مكانه شخص أخر.","يجربون ويخطأون حتى يتعلموا من خطأهم (او طريقة تجربة الخطأ)"],"التدريب الرسمي منظم يقدمه متخصصون ضمن دورات، بخلاف التعلم من زميل أو بالتجربة والخطأ."],["L01","pom3","ستة إخوة: حمد، راكان، خليل، مازن، صقر، سعد. خليل أقصر من راكان وسعد لكنه أطول من صقر، وحمد أطول من خليل، وبين حمد وراكان شخصان في الترتيب، ومازن الثالث طولاً. من الثاني طولاً؟",["سعد","خليل","مازن","صقر"],"حمد وراكان بينهما شخصان ومازن ثالث، فهما في 1 و 4 (بأي ترتيب). سعد أطول من خليل، وخليل أطول من صقر، فسعد الثاني وخليل الخامس وصقر السادس."],["L01","pom3","خمسة أصدقاء في طابور أمام موظف (الموضع 1 الأقرب للموظف): أنس، زياد، حسام، مروان، إياد، ووظائفهم: محاسب، مهندس، طبيب، معلم، طيار (ليست بالترتيب). حسام ومروان ليسا الأول ولا الأخير. المحاسب قبل المعلم، والمعلم قبل الطيار، ومروان بين المحاسب والمعلم. حسام خلف المهندس مباشرة. زياد ليس محاسباً، وإياد ليس محاسباً ولا مهندساً. إياد أمام المحاسب مباشرة، والطيار هو الأخير. ما وظيفة مروان؟",["مهندس","طبيب","محاسب","معلم"],"الطيار في 5، وإياد أمام المحاسب مباشرة. مروان بين المحاسب والمعلم، وحسام خلف المهندس، فالترتيب: إياد طبيب، أنس محاسب، مروان مهندس، حسام معلم، زياد طيار."],["L01","pom2","أي الاستنتاجات الآتية غير صحيح؟",["نصف آكلي الأطعمة المقلية ارتفع لديهم","مجموع من ارتفع لديهم في الدراسة 17","نسبة الارتفاع في مجموعة الخضار 10%","لم يرتفع لدى 14 من مجموعة الوجبات السريعة"],"في المقلية ارتفع لدى 9 من 20 أي 45%، وليس النصف (10)."],["L01","pom3","سبعة إخوة أعمارهم بين 5 و 23 سنة، وبين كل أخ والذي يليه 3 سنوات. فيصل أصغرهم، وعمره أقل من عمر بدر بـ 12 سنة، وبدر ليس الأكبر. كم عمر بدر؟",["17","14","12","23"],"الأعمار: 5، 8، 11، 14، 17، 20، 23. فيصل 5، فبدر 5 + 12 = 17."],["L01","ho","يريد مدير مستشفى ترشيح ممرض واحد لدورة متقدمة في الخارج. على أي أساس يكون الاختيار الأنسب؟",["تقويم الأداء الوظيفي للمرشحين","الأقرب سكناً من المستشفى","الأقدم في الخدمة","الأكبر سناً بين الممرضين"],"الدورة استثمار في الكفاءة، والتقويم الوظيفي يجمع جودة العمل والإنجاز والانضباط."],["L01","po","السلحفاة أسرع من النمر ( هي عبارة صحيحة ) والسمك يعيش في الماء ( هي عبارة خاطئة ) ما هي العبارة الصحيحة؟",["السلحفاة أسرع من النمر أو السمك يعيش بالماء .","النمر أسرع من السلحفاة أو السمك يعيش في الماء.","السلحفاة ليست أسرع من النمر والسمك يعيش في الماء.","إذا كانت السلحفاة أسرع من النمر فإن السمك يعيش في الماء ."],"الجملة الأولى صحيحة والثانية خاطئة؛ ولا تصح إلا عبارة «أو» لأن أحد طرفيها صحيح."],["L01","pom3","الخريج الناجح ليس الذي يمتلك أكبر كم من المعلومات، بل يستطيع إيجاز المعلومة ويحسن توظيفها. يتضح من النص أن؟",["توفر المعلومة و حسن توظيفها","الحصول على المعلومات أمر سهل","الخريج الناجح هو الذي يمتلك أكبر كم من المعلومات","الخريج ليس له حقوق"],"النص ينفي أن النجاح بكثرة المعلومات، ويجعله في إيجازها وحسن توظيفها، أي توفر المعلومة مع حسن توظيفها."],["F01","po","في حجر النرد مجموع كل وجهين متقابلين 7. كم مجموع النقاط على الأوجه التي لا تظهر في الأحجار الثلاثة الآتية؟",["33","21","30","63"],"كل حجر مجموع أوجهه الستة 21، يظهر منها ثلاثة ويختفي ثلاثة. الظاهر في الأحجار الثلاثة: (1 + 3 + 2) + (1 + 4 + 5) + (6 + 5 + 3) = 30. فالمخفي 3 × 21 − 30 = 33. (أو: كل وجه مخفي يقابل وجهاً ظاهراً، فقيمته 7 ناقص الظاهر.)"],["L01","pom3","أب خطط للذهاب إلى رحلة ترفيهية مع عائلته، وعندما وصل إلى المدينة فوجئ بزحمة شديدة فيها، وأن السكن مكتظ بالناس. ما هو الخطأ الذي وقع فيها الأب؟",["وقت الرحلة كان خطأ( أو توقيت الرحلة خطأ لأن السكن مزدحم )","لم يأخذ معه مالاً كافياً","لم يشرك عائلته بالقرار ( يعني قراره كان فردي )","السياحة الخارجية مكلفة بالنسبة له"],"الزحمة واكتظاظ السكن يدلان على أنه اختار وقتاً مزدحماً، فالخطأ في توقيت الرحلة."],["L01","pom3","إذا كان PLD = 5368 و PWL = 5236، فما رمز DLP؟",["8365","835","8635","5368"],"من المقارنة: P = 5، و W = 2، و L = 36 (حرف برقمين)، و D = 8. إذن DLP = 8 ثم 36 ثم 5 = 8365."],["L01","po","أخذ أحد أربعة طلاب كتاباً. قال خالد: «سامي أخذه». وقال سامي: «ماجد أخذه». وقال ماجد: «سامي يكذب». وقال عمر: «لم آخذه». إذا كان واحد منهم فقط صادقاً، فمن أخذ الكتاب؟",["عمر","ماجد","سامي","خالد"],"لو أخذه عمر: كلام خالد وسامي وعمر كذب، وكلام ماجد صدق، فالصادق واحد؛ وأي اختيار آخر يجعل الصادقين اثنين أو أكثر."],["L01","pom3","ما القرار الأنسب لسكنه في الدمام؟",["استئجار سكن مناسب لراتبه قرب عمله","شراء أرض في الدمام وبناؤها","شراء شقة في الدمام بقرض طويل","استئجار فيلا واسعة في حي راقٍ"],"المدة قصيرة والراتب محدود، فالإيجار المعتدل يناسب الحالتين."],["L01","pom3","حمد قال: معدلي 4,45 من 5 ، وفهد اقل من معدلي ومعدله 3,30 من 4 ، وقال فهد: معدلي اقل من معدل حمد، محمد قال: معدلي 88٪ وأنا أعلى من حمد، وقال خالد: معدلي ممتاز وأفضل من الجميع، من الذي كلامه غير صحيح؟",["محمد","فهد","خالد","حمد"],"حمد: 4,45 ÷ 5 = 89%، وفهد: 3,30 ÷ 4 = 82,5%، فكلامهما صحيح. محمد ادّعى 88% وأنه أعلى من حمد، لكن 88% < 89%، فكلامه غير صحيح."],["L01","pom3","في كل مربع أربعة أعداد، ومجاميع المربعات تسير بنمط ثابت. ما قيمة س؟",["2","1","17","7"],"المجاميع: 24 ثم 19 ثم 24، فالرابع 19. 8 + 3 + 6 = 17، إذن س = 19 − 17 = 2."],["F01","pom2","الخط المتقطع على يمين الشكل مرآة رأسية. ما صورة الراية والنقطة في المرآة؟",["شكل 2","شكل 1","شكل 3","شكل 4"],"المرآة الرأسية تقلب اليمين واليسار وتُبقي الارتفاع: السارية الأفقية تبقى أفقية، والعلم الذي يتدلى منها إلى الأسفل يبقى إلى الأسفل لكن في الطرف الآخر، والنقطة تنتقل من أسفل اليسار إلى أسفل اليمين."],["L01","po","لنفترض أن: س : البنزين خلال السنوات الماضية زاد سعره بالسوق المحلي . ص : النفط خلال السنوات الماضية زاد سعره بالسوق الخارجي.",["ص سبب و س نتيجة","س سبب و ص نتيجة","ليس لهما علاقة ببعض","العبارتان هي نتائج لأسباب لم تذكر"],"النفط هو المادة الخام للبنزين، فارتفاع سعره عالمياً هو السبب، وارتفاع سعر البنزين محلياً هو النتيجة."],["F01","pom2","في كل مثلث ثلاثة أعداد عند رؤوسه وعدد في وسطه، والقاعدة واحدة في المثلثات الثلاثة. الأعداد بالترتيب (أعلى، يسار، يمين ← الوسط): المثلث الأول 4، 3، 5 ← 17، والثاني 6، 2، 4 ← 22، والثالث 5، 4، 6 ← ؟. ما العدد الناقص؟",["26","29","15","14"],"نجرّب العلاقات على المثلثين الكاملين: الأعلى × الأيمن − الأيسر تصح فيهما: 4 × 5 − 3 = 17، ثم 6 × 4 − 2 = 22. فالثالث 5 × 6 − 4 = 26."],["L01","ho","أستاذ يعمل في مكان وأراد عمل دورة (أو ورشة عمل) ثم قام بعمل دعوات لجمع عدد من المستشارين، وبعد أن حدد وقت ومكان المحاضرة تفاجئ بقلة الحضور. ماذا يفعل الأستاذ لتحسين مستواه ؟",["البحث عن السبب ويعمل على تطوير نفسه من خلال الدورات","يلغي الدورات القادمة","توسيع نطاق معارفه","تكوين علاقات مع مدربين عالميين"],"أنسب تصرف أن يبحث عن سبب قلة الحضور ويعالجه وينمي مهاراته بالدورات."],["L01","pom3","أي العبارات الآتية صحيحة بالضرورة؟",["الطائر «ن» لا يعيش في الكهوف","بعض الطيور الزرقاء تعيش في الكهوف","الطيور التي تأكل البذور زرقاء اللون","الطائر «ن» يعيش في الكهوف"],"«ن» أزرق فيأكل البذور، وآكل البذور لا يعيش في الكهوف، إذن «ن» لا يعيش في الكهوف."],["L01","pom3","لكل رمز حرف. الأزواج الأربعة في الأعلى رموزها من اليمين: «س ب»، «ب ج»، «ج س»، «س د»، والحرف الأول للإطار الأيمن من كل زوج. ما رمز الزوج المرسوم في الأسفل؟",["د ب","ب د","د ج","س ب"],"الخطوط المائلة تظهر في الزوج الأول والثالث والرابع، والحرف المشترك بينها «س». والنقطة في الأول والثاني فرمزها «ب»، والحلقة «ج»، والإطار الفارغ «د». والزوج في الأسفل إطار فارغ ثم نقطة، فرمزه «د ب»."],["L01","pom3","أي العبارات الآتية لا يلزم أن تكون صحيحة؟",["أغلب اجتماعات الشركة طويلة","للشركة اجتماعات تُعقد يوم الأحد","بعض الاجتماعات الطويلة من اجتماعات الشركة","بعض اجتماعات الشركة طويلة"],"المعطى يثبت أن «بعض» اجتماعات الشركة طويلة، ولا يخبرنا عن أغلبها."],["F01","po","في كل إطار شكلان يصل بينهما خط، والسلسلة تُقرأ من اليمين. ما الإطار الرابع؟",["شكل 2","شكل 1","شكل 3","شكل 4"],"الشكل الأيسر في كل إطار يصير الأيمن في الإطار التالي، ويدخل في اليسار الشكل الذي يليه في الدور: دائرة ثم مثلث ثم مربع. والتصميت يتبادل بين اليمين واليسار. فالرابع دائرة في اليمين ومثلث في اليسار، والمصمت هو الأيسر."],["L01","po","عبدالرحمن وبسام ووليد وكريم كفلوا أيتاماً بحسب أعمارهم: الأكبر كفل 4 أيتام، والذي يليه 3، ثم 2، والأصغر يتيماً واحداً. وليد أكبر من كريم وأصغر من بسام، وكريم يأتي مباشرة قبل عبدالرحمن في الترتيب من الأكبر. من كفل يتيمين؟",["كريم","عبدالرحمن","بسام","وليد"],"الترتيب من الأكبر: بسام، وليد، كريم، عبدالرحمن. فالثالث كريم يكفل يتيمين."],["V12","ho","أي مما يلي يؤخذ على صياغة شروط الرحلة؟",["غموض بعض عباراتها","عدم توقيع الآباء عليها","تكرار بعض الشروط بألفاظ مختلفة","خلوّها من شرط سترة النجاة"],"شرط «الالتزام بالتعليمات المناسبة» غامض؛ لا يحدد أي تعليمات ولا من يقدّرها."],["L01","pom3","أي المجموعات كانت أكثر ارتباطاً بارتفاع الكوليسترول في هذه العينة؟",["الأطعمة المقلية","الوجبات السريعة","لا يمكن المقارنة بينها","الخضار والفواكه"],"المجموعات متساوية العدد (20)، وأعلى عدد ارتفع لديهم في المقلية (9 من 20 = 45%)."],["L01","pom3","ما العدد الذي شفرته 864؟",["246","6810","642","468"],"القاعدة: أضف 2 لكل رقم ثم اعكس ترتيب الأرقام. للعكس: 864 ← نعكس 468 ← نطرح 2 من كل رقم = 246."],["F01","pom2","الشكل الأول بالنسبة إلى الثاني مثل الثالث بالنسبة إلى أي شكل؟ عُدّ الأضلاع والنقاط.",["شكل 1","شكل 2","شكل 3","شكل 4"],"من الأول إلى الثاني نقص عدد الأضلاع اثنين (المسدس صار مربعاً)، وزادت النقاط واحدة (من نقطة إلى نقطتين). فالمخمس بنقطتين يصير شكلاً من 3 أضلاع، أي مثلثاً، فيه 3 نقاط."],["L01","ho","في سباق دراجات بين خمسة: نواف، ريان، زياد، ماجد، طلال. كان نواف في المقدمة وخلفه ريان مباشرة، وخلف ريان كلٌّ من زياد وماجد، وكلاهما أمام طلال. ثم انسحب ريان، وتقدّم زياد على نواف. من صار خلف نواف مباشرة؟",["ماجد","ريان","زياد","طلال"],"بعد انسحاب ريان وتقدّم زياد صار الترتيب: زياد، نواف، ماجد، طلال. إذن ماجد خلف نواف مباشرة."],["L01","pom3","ما نوع العلاقة بين ساعات القراءة ودرجة الطلاقة؟",["طردية","عكسية","لا توجد علاقة","المعطيات غير كافية"],"كلما زادت الساعات (2 ← 10) زادت الطلاقة (48 ← 85)، فالعلاقة طردية."],["Q01","po","يمر منحنى في الشبكة الآتية من ركنها الأيسر السفلي إلى ركنها الأيمن العلوي. كم خانة لا يمر بها المنحنى؟",["24","11","10","14"],"في الشبكة 7 × 5 = 35 خانة. نتتبع المنحنى ونعدّ الخانات التي يدخلها: 11 خانة (وطريق مختصر: المنحنى يصعد باستمرار، فيدخل خانة جديدة كلما عبر خطاً من الخطوط الداخلية: 1 + 6 + 4). فالتي لا يمر بها 35 − 11 = 24."],["L01","pom3","في الشبكة: كل صف حاصل ضرب خانته اليمنى في الوسطى يساوي اليسرى، وكل عمود حاصل ضرب أوله في ثانيه يساوي ثالثه. ما العددان الناقصان في العمود الأوسط (من الأعلى)؟",["5 و 10","4 و 8","20 و 40","5 و 7"],"الصف الثاني: 4 × ؟ = 20، فالناقص 5. والعمود الأوسط: 2 × 5 = 10. وللتحقق: 12 × 10 = 120."],["L01","po","أستاذ يعمل في مكان وأراد عمل دورة (أو ورشة عمل) ثم قام بعمل دعوات لجمع عدد من المستشارين، وبعد أن حدد وقت ومكان المحاضرة تفاجئ بقلة الحضور. ما هو السبب في قلة الحضور ؟",["عدم استشارة الحضور في الوقت المناسب لهم","الإعلان عن الدورة لم يكن كافياً","المستشارين لم يكونوا متخصصين","ارتفاع رسوم الدورة"],"حدد الوقت والمكان دون أن يستشير المدعوين في الوقت المناسب لهم، فقلّ الحضور."],["F01","pom3","في الزوج الأول (من اليمين) تحوّل الشكل بقاعدتين معاً. طبّق القاعدتين على الشكل الثالث: ما الشكل الناقص؟",["شكل 4","شكل 1","شكل 2","شكل 3"],"الشكل الأول دار ربع دورة عكس عقارب الساعة: السهم كان إلى الأعلى فصار إلى اليسار، وانتقلت العلامتان زاوية واحدة عكس العقارب. ومعه انقلب التصميت: النقطة صارت حلقة، والمربع المفرغ صار مصمتاً. فالسهم في الثالث (إلى الأسفل) يصير إلى اليمين، والنقطة تصير حلقة أسفل اليمين، والمربع المصمت يصير مفرغاً أعلى اليمين."],["F01","pom3","في السلسلة الآتية (من اليمين) دائرة مقسومة ثمانية قطاعات، وبعضها مظلل. ما الشكل الرابع؟",["شكل 4","شكل 1","شكل 2","شكل 3"],"يزيد عدد القطاعات المظللة واحداً في كل خطوة (1 ثم 2 ثم 3 ثم 4)، وبداية التظليل تتقدم قطاعاً واحداً مع عقارب الساعة. فالشكل الرابع أربعة قطاعات متتالية تبدأ بعد بداية الثالث بقطاع."],["F01","po","أُعطي كل شكل في الصف الأعلى عدداً، والأعداد من اليمين: 6، 5، 7، 2، 3 بالترتيب. ثم أُعيد ترتيب الأشكال في الصف الأسفل، وكل شكل يحمل عدده معه. ما أعداد الصف الأسفل من اليمين؟",["7، 5، 3، 2، 6","7، 5، 2، 3، 6","6، 5، 7، 2، 3","6، 2، 3، 5، 7"],"نعطي كل شكل عدده: المربع 6، والمثلث 5، والدائرة 7، والمعيّن 2، والمسدس 3. والصف الأسفل من اليمين: دائرة، مثلث، مسدس، معيّن، مربع، فالأعداد 7، 5، 3، 2، 6."],["F01","pom3","الشكل الأول بالنسبة إلى الثاني مثل الثالث بالنسبة إلى أي شكل؟ (الأزواج تُقرأ من اليمين)",["شكل 2","شكل 1","شكل 3","شكل 4"],"من الأول إلى الثاني بقي الشكل الخارجي وعدد النقاط كما هما، وتحوّلت النقاط من عمود رأسي إلى صف أفقي. فالمخمس بثلاث نقاط في عمود يصير مخمساً بثلاث نقاط في صف."],["Q01","pom3","أي الأعداد الآتية هو جمع عددين زوجين متتاليين؟",["250","236","240","260"],"مجموع عددين زوجيين متتاليين = 4س + 2 (الباقي 2 عند القسمة على 4): 250 = 124 + 126."],["F01","pom3","في المصفوفة الآتية (الصفوف من اليمين) يتكرر كل شكل خارجي وكل علامة داخلية بنظام. ما الشكل الناقص؟",["شكل 4","شكل 1","شكل 2","شكل 3"],"في كل صف وكل عمود ثلاثة أشكال خارجية مختلفة (دائرة ومربع ومعيّن)، وثلاث علامات داخلية مختلفة (× ونقطة و+). الصف الثالث ينقصه مربع، والعمود الثالث كذلك، والعلامة الناقصة فيهما علامة ×."],["F03","ho","أي الأشكال الآتية لا ينتمي إلى المجموعة؟ تتبّع نهايات الخطوط.",["شكل 4","شكل 1","شكل 2","شكل 3"],"في ثلاثة أشكال كل خط ينتهي طرفاه عند حدّ الإطار أو عند خط آخر. وفي الشكل المختلف خط أفقي يتوقف في وسط الإطار دون أن يلمس شيئاً."],["F01","pom3","الشكل الأول بالنسبة إلى الثاني مثل الثالث بالنسبة إلى أي شكل؟ في الزوج الأول صار الشكل الداخلي خارجياً، ودخل شكل جديد يرتبط عدد أضلاعه بعدد أضلاع الخارجي القديم.",["شكل 2","شكل 1","شكل 3","شكل 4"],"في الزوج الأول خرج الشكل الداخلي (الدائرة) ليصير خارجياً، ودخل شكل عدد أضلاعه أقل بواحد من الخارجي القديم: المربع له 4 أضلاع، فدخل مثلث له 3 أضلاع. فالمسدس الذي بداخله مربع يصير مربعاً بداخله شكل له 5 أضلاع، أي مخمس."],["Q01","po","ما قيمة: 33/11 × 7/14 × 44/11؟",["6","3/2","12","24"],"33/11 = 3، ثم 7/14 = 1/2، ثم 44/11 = 4، فالناتج 3 × 1/2 × 4 = 6."],["Q01","po","في الشبكة الآتية ثلاثة منحنيات تبدأ من الركن الأيسر السفلي وتنتهي في الركن الأيمن العلوي: متصل، ومتقطع بشرطات، ومنقّط. كم خانة لا يمر بها المنحنى المتقطع بشرطات؟",["30","12","31","29"],"في الشبكة 42 خانة. المنحنى المتقطع (الأوسط) يصعد باستمرار، فكلما عبر خطاً رأسياً أو أفقياً دخل خانة جديدة: يبدأ بخانة، ويعبر 6 خطوط رأسية، ثم 5 خطوط أفقية، فيمر بـ 1 + 6 + 5 = 12 خانة. فالتي لا يمر بها 42 − 12 = 30. (ولهذا يتساوى الجواب للمنحنيات الثلاثة.)"],["Q01","po","كم عوداً يلزم لتكوين صف من 9 مربعات؟",["28","27","36","31"],"المربع الأول 4 أعواد، وكل مربع بعده يضيف 3: 4 + 8 × 3 = 28 (أي 3 × 9 + 1)."]];
window.QPSG = {"albandri:P029":"تواجه البشرية اليوم تحديات بيئية غير مسبوقة، نتيجة التوسع العمراني والصناعي السريع. أدت هذه الأنشطة إلى زيادة التلوث في الهواء والماء والتربة، مما أثر على صحة الإنسان والكائنات الحية الاخرى. علاوة على ذلك، فقد تسبب التغير المناخي في ارتفاع درجات الحرارة، وزيادة تواتر الكوارث الطبيعية مثل الفيضانات والجفاف. من هنا، أصبح الاهتمام بالاستدامة البيئية ضرورة ملحة، وتشمل الاستدامة اتباع سياسات استخدام الموارد الطبيعية بشكل رشيد، وتقليل الانبعاثات الضارة، وتشجيع الممارسات الزراعية والصناعية الصديقة للبيئة.","albandri:P031":"شهد العالم خلال القرن الأخير تغييرات هائلة في مجال التكنولوجيا، أثرت على حياة البشر بشكل جذري. فقد ساعدت التقنيات الحديثة في تسهيل التواصل بين الأفراد عبر المسافات البعيدة، وتحسين العمليات الصناعية، وزيادة إنتاجية العمل. ومع ذلك، رافق هذه التطورات بعض التحديات، مثل الاعتماد المفرط على الأجهزة الإلكترونية، وارتفاع معدلات البطالة في بعض القطاعات نتيجة الأتمتة، إضافة إلى المخاطر المرتبطة بالأمن السيبراني. لذلك، أصبح من الضروري وضع استراتيجيات متوازنة للاستفادة من التكنولوجيا، مع الحد من آثارها السلبية على المجتمع.","albandri:P033":"تُعد القراءة من أهم العوامل التي تساعد على تطوير التفكير النقدي وزيادة الثقافة العامة لدى الأفراد. فهي لا تمنح المعرفة فقط، بل تعزز القدرة على التحليل والتفسير والتقييم للأفكار المختلفة. تشير الدراسات إلى أن الاشخاص الذين يقرأون بانتظام يمتلكون مهارات أفضل في حل المشكلات واتخاذ القرارات، بالإضافة إلى قدرة أعلى على التركيز والانتباه. ومع ذلك، تواجه بعض المجتمعات تحديات في تعزيز ثقافة القراءة، مثل انتشار الأجهزة الإلكترونية ووسائل التواصل الاجتماعي التي تستهلك وقت الأفراد، بالإضافة إلى قلة الموارد والمكتبات العامة في بعض المناطق.","albandri:P037":"يشكل التغير المناخي أحد أخطر التحديات التي تواجه العالم اليوم، حيث يؤثر بشكل مباشر في إنتاج الغذاء وتوزيعه. فقد باتت موجات الجفاف الطويلة، والفيضانات المفاجئة، وارتفاع درجات الحرارة عوامل تهدد خصوبة التربة وإنتاجية المحاصيل. ويزداد الأمر تعقيدًا حين نعلم أن الدول النامية، التي تعتمد بشكل رئيسي على الزراعة التقليدية، هي الأكثر عرضة لهذه التغيرات، في الوقت الذي تمتلك فيه قدرات محدودة على التكيف.\n\nلكن الصورة ليست قاتمة بالكامل؛ إذ يشير خبراء إلى أن تبني تقنيات الزراعة الحديثة، مثل الري بالتنقيط، والزراعة المحمية، واستخدام أصناف محسنّة مقاومة للجفاف، قد يخفف من هذه الآثار. ومع ذلك، فإن تطبيق هذه الحلول يتطلب استثمارات مالية ضخمة، وتعاونًا دوليًا لدعم الدول الأضعف، إضافة إلى وعي مجتمعي واسع بقيمة الاستدامة البيئية.\n\nمن هنا، يظهر أن معالجة أزمة التغير المناخي لا تنفصل عن الأمن الغذائي العالمي، وأن الحلول لا يمكن أن تكون محلية فحسب، بل تحتاج إلى تنسيق على المستويات كافة، لضمان بقاء الغذاء متاحًا للأجيال القادمة.","albandri:P039":"شهد العالم خلال العقود الأخيرة ثورة تكنولوجية غيرت شكل الحياة الإنسانية على مستويات متعددة. فمع انتشار الإنترنت والهواتف الذكية، أصبح الوصول إلى المعلومات أسرع من أي وقت مضى، كما تغيرت أنماط التواصل الاجتماعي بشكل جذري. لم تعد المسافات عائقا أمام التفاعل بين الأفراد، بل صار بالإمكان إدارة الأعمال، وتبادل الخبرات، وحتى تكوين صداقات عبر منصات رقمية.\n\nلكن هذه الطفرة التكنولوجية لم تخلُ من آثار سلبية. إذ تشير الدراسات إلى أن الاستخدام المفرط للأجهزة الذكية قد يؤدي إلى عزلة اجتماعية حقيقية، وضعف في مهارات التواصل الواقعي، فضلا عن تراجع مستوى التركيز والقدرة على إدارة الوقت. وتزداد خطورة الأمر حين يصبح الاعتماد على التكنولوجيا بديلا عن النشاطات اليومية التقليدية، مثل القراءة المباشرة، أو الحوار الوجاهي، أو ممارسة الرياضة.\n\nمع ذلك، يرى بعض الباحثين أن الحل لا يكمن في رفض التكنولوجيا، بل في إيجاد توازن بين استخدامها والاستفادة منها، وبين الحفاظ على المهارات والعادات الإنسانية الأصيلة. ومن هذا المنطلق، فإن مستقبل المجتمعات لن يتحدد بمدى تقدم التكنولوجيا فحسب، بل بقدرتها على دمجها في الحياة اليومية دون أن تفقد إنسانيتها.","albandri:P233":"تاريخ الإسلام أشهر مؤلفات الإمام الذهبي وأجلها، يضم زهاء أربعين ألف ترجمة، وقد كتبه في 19 مجلد ووصلنا أجزاء منه بخطه، وقد انتهى من كتابته سنة 714هـ وفي عام 726هـ كتبه في 21 مجلد تناول فيه تاريخ الإسلام من بدء الهجرة حتى 700هـ وبناء على سبعين طبقة، والتزم فيه ثلاث خطط : من بدء الكتاب حتى سنة 40 هجرية، وفيها دمج كلامه عن الطبقات الأربع، وخلط فيها ذكر الوفيات بالحوادث، من سنة 41 حتى 300 هـ وفيها ساق تراجمه حسب الطبقات، من سنة 300هـ حتى 700هـ وفيها ساق تراجمه حسب وفيات كل سنة، مرتبة على حروف المعجم باعتماد اسم الشهرة، ومن كتابه هذا استخرج معظم كتبه التاريخية، وقال العياشي في كتابه: \" وهو كتاب حافل، لم يدع شاردة ولا نادرة مما تتشوق إليه النفس من علم التاريخ إلا أودعها كتابه مع الاختصار والإتقان فكأنها جمعت له الدنيا وأهلها في صعيد واحد.\"","albandri:P244":"كشفت تقارير لعلماء الهزات الأرضية أن الهزة الضخمة التي حصلت في سومطرة -اندامان في 26 ديسمبر/كانون الأول عام 2004 وأدت إلى كارثة المد البحري تسونامي، استمرت لأطول فترة تمّ تسجيلها في التاريخ الحديث.\n\nوأضافت التقارير أن ذاك الارتجاج العنيف أدى إلى حصول صدع هو أطول فلق في القشرة الأرضية حتى الآن. ويقول البروفسور شارل أمون، الخبير في علم الجيولوجيا بجامعة بين \"عادة تكون مدة الهزة الأرضية الخفيفة، أقل من ثانية، أما المتوسطة فقد تستمر ل300 ثانية. أو( 600 ثانية)\n\nووفق المعلومات التي أوردها التقرير، فإن قوة الطاقة التي فجرتها هذه الهزة العنيفة، بلغت ما يعادل طاقة قنبلة بقوة مائة جيجاتون .\"gigaton\" وبجانب قوتها، تضاف المدة الطويلة التي لم تسجل من قبل لهزة أرضية في التاريخ الحديث.\n\nما حصل في آسيا ديسمبر الماضي أصاب حتى كبار العلماء والخبراء بالحيرة وأشعرهم بالعجز، وعن هذا يقول أستاذ علوم الأرض في جامعة كاليفورنيا ثورن لاي \"كنا نجلس في مختبراتنا كل النهار نحاول فهم وتحليل ما حصل، من وجهة النظر العلمية، ونشاهد خلال الليل، على شاشات التلفاز، ارتفاع عدد القتلى يرتفع كل يوم\" . وكانت سجلت في حينه مراكز رصد حركة الأرض في سريلانكا، وعلى بعد ألف ميل من مركز الهزة، تحرك القشرة الأرضية، صعودا\" وهبوطا\"، بقرابة تسع سنتيمترات على الأقل.\n\nالمقطع الثاني\n\nحيث أنها كانت القوة المتوسطة للزلازل تستمر من ثانية إلى 600 ثانية، وكانت شدته ....... ريختر.\n\nالمقطع الثالث عن أجهزة رصد الزلازل , تتكلم أن الجيولوجيون يعملون على رصد التحركات 24 ساعة .","amer:AP010":"أكدت وسائل إعلام روسية أن تواجه مشكلة في انخفاض عدد السكان حيث إنها تعاني أزمة سكانية حادة، تتمثل في الانخفاض الحاد في عدد السكان وانتشار الأمراض الصحية والاجتماعية والنفسية في المجتمع الروسي، فوفقًا لبعض الإحصاءات فإنهم ينقصون بمقدار 750 ألف نسمة كل عام، ويرجع ذلك إلى: تدني الرعاية الصحية؛ إذ انخفض متوسط أعمار الرجال إلى 59 سنة، والإناث إلى 71 سنة، وارتفاع معدلات الوفيات 18٪ ، كما أن هناك عزوفًا عن الإنجاب لدى الشعب الروسي لأسباب كثيرة تجعل النساء الروسيات يعزفن عن الإنجاب، مثل: الانتشار الواسع للطلاق (75 % من حالات الزواج)، وسوء التخطيط العائلي، وانخفاض مستوى المعيشة، وانتشار الفقر والخوف من المستقبل في ظل الأوضاع الاقتصادية والاجتماعية التي تمر بها روسيا حاليًا، ويمكن أن نلمس خوفهم في: صحيفة موسكو التي ما زالت تنشر مقالات بعنوان (روسيا 2025 . 2050)، ناهيك عن بعض المفاهيم التي غدت تتصدر تلك المقالات من نوعية أن الروس سيصبحون أقلية، وهاجس انقراض الروس، وفي ظل هذه الظروف إلى أن عدد مسلمي روسيا والذين يربو عددهم عن 20 مليون نسمة يشهد تزايدًا مستمرًا بسبب إقبالهم على التعدد ورغبتهم في الإنجاب، الذي حث عليه الدين الإسلامي، ولو لم يتفكك الاتحاد السوفيتي لأصبح المسلمون أغلبية فيه بحلول القرن المقبل.","amer:AP104b":"يتميز البحر الميت بكثبان حوله يأتي الناس ليستمتعوا بأشكالها، ولا تعيش فيه الأسماك، ولا المخلوقات الحية نظرًا لارتفاع نسبة ملوحته التي تبلغ عشرة أضعاف نسبة الأملاح في البحار الأخرى والتي لا تتحملها المخلوقات الحية، ويحتوي هواء البحر الميت على شحنات سالبة ومن الجدير بالذكر أن الشحنات السالبة المنتشرة في الجو تساعد في التنفس وعلاج حالات الربو وضيق التنفس، إن للبحر الميت فوائد كثيرة وأهمية كبيرة لما له من فائدة شفائية، والمناظر الجميلة التي يأتي الناس لزيارته ليستمتعوا بها.","amer:AP108a":"(إذا كان هناك طلاب كثيرو الغياب، ويتأخرون في الصباح عن المدرسة، ويتأخرون عن الحصص، وعن أداء الصلاة).","amer:AP109a":"(ملاحظة المؤلف: النص غير متوفر كما جاء في الاختبار، ولكنه مروي بالمعنى) جاء في النص أن البدانة في تزايد ملحوظ، وتعاني منها طبقة كبيرة في المجتمع، ويشعر البدناء بصعوبة في خفض وتقليل أوزانهم؛ مما جعل البعض يقدم نصائح حول البدانة، فقامت وسائل الإعلام بالترويج لها من خلال ما تأكله وما تشربه، ويذهب الباحثون إلى أن سبب السمنة ...، كما يعاني من تلك المشكلة الكثير من الناس. ولم يستطع الناس خفض أوزانهم بسبب كثرة النصائح التي تقدم لهم عن طريق وسائل الإعلام، وكثرة الإعلانات التي تطلب من الناس خفض أوزانهم لا تعود بالفائدة على الشخص السمين. وقد بين النص أن هناك عوامل متعددة تؤثر في السمنة، وقد تكون هذه العوامل: بيئية أو اقتصادية أو بيولوجية.","amer:FP113":"* النص غير متوفر كما جاء في الاختبار، ولكنه مروي بالمعنى: يدور معني الدراسة حول ما يلي: (هناك جامعة في الأردن ترتفع الضغوط لدى طلابها لعدة أسباب، منها: الاختبارات والواجبات، فقامت بإجراء دراسة على (15) طالبًا، بحيث استطاعوا أن يجعلوا الطلاب يمارسون الألعاب الهوائية، وخلصت الدراسة إلى أن نسبة الضغوط قلت لدى أفراد جميع العينة التي تمت الدراسة عليها).","amer:FP114":"أجرت صحيفة حوارًا مع صاحب سوابق وأفردت له صفحتين، وجاءت العناوين كالتالي: 1. علي بابا والأربعين حرامي، يثير إعجابه أو (أنا أقلد علي بابا والأربعين حرامي). 2. يحب المغامرة ومعجب بها أو (أحب المغامرة). 3. حرامي يسرق من أجل الفقراء. أو (أنا أسرق من أجل الفقراء). 4. الحرامي كان لبقًا وجميل المظهر وتبدوا عليه بشاشة الوجه. وكان تعليق الصحيفة بعد هذه العناوين. (يغلب على وجوههم البشاشة وحسن المظهر).","amer:FP119":"6 أخوات أمل ونورة ومنال وابتسام وسمر أعمارهم 23 و 26 و 26 و 29 و 32 ، وأشغالهم مهندسة ومعلمة ودكتورة وممرضة ومحاسبة وواحدة صاحبة محل تجاري. 1. المعلمة والممرضة مجموع عمرهم 55. 2. الطبيبة عمرها عدد فردي. 3. ابتسام وسمر توأم. 4. ابتسام لا تدرس ولا تعمل في الصحة وليس لها محل تجاري. 5- نورة أكبر من أمل وسمر وابتسام. 6- منال أكبر من نورة. 7. ابتسام اكبر من امل بـ 3 سنوات. 8. المحاسبة توأم سمر.","sahli_written:sw-sahli-f1-p153-t01":"استقبل مشرف نادٍ للرحلات البحرية عائلتين جاءتا مع أطفالهما، وقدّم لهما وثيقة تعهد مكتوبة افتتحها بعبارة: «أغلب من يسقط من القوارب في عرض البحر لا ينجو». ثم ذكر شروط الرحلة: ارتداء سترة النجاة طوال الرحلة، وعدم الانتقال بين القوارب، وعدم الوقوف على حافة القارب، وارتداء زيّ النادي الموحد، والالتزام بالتعليمات المناسبة. وأكد أن على القارب منقذاً مدرَّباً وجهاز اتصال بخفر السواحل. ثم وقّع الآباء الوثيقة وانطلقت الرحلة.","sahli_written:sw-sahli-f1-p155-t01":"رُشّحت موظفة في جهة حكومية لدراسة دبلوم مهني في إحدى جامعات أستراليا، ومن شروط القبول اجتياز اختبار معتمد في اللغة الإنجليزية بدرجة محددة. وتشترط الجامعة أن يؤدّى الاختبار في مركز اللغة التابع لها قبل بدء الدراسة بشهر. وكانت الموظفة قد درست الإنجليزية في التعليم العام، فوجدت أن أساسها فيها اختصر عليها كثيراً من الاستعداد.","sahli_written:sw-solo-sahli-f1-p044-q01":"المربع 1: 6، 3، 8، 7\nالمربع 2: 5، 9، 1، 4\nالمربع 3: 4، 7، 10، 3\nالمربع 4: 8، 3، 6، س","sahli_written:sw-solo-sahli-f1-p045-q03":"أربعة إخوة: فهد، ونايف، ومشاري، وطارق، تقاسموا أربع مهام في أربعة أيام (السبت، الأحد، الاثنين، الثلاثاء)، لكل واحد مهمة في يوم. المهام: ري الحديقة، وغسل السيارة، وترتيب المجلس، وشراء المقاضي.\n- غسل السيارة يوم الأحد، وشراء المقاضي يوم الثلاثاء.\n- طارق لا يعمل يوم الأحد ولا يوم الاثنين.\n- نايف مسافر يوم الثلاثاء.\n- مشاري يرتّب المجلس.\n- فهد يعمل قبل مشاري، ولا يغسل السيارة.","sahli_written:sw-solo-sahli-f1-p045-q08":"العمود الأيمن (من الأعلى): 3، 4، 12\nالعمود الأوسط: 2، ؟، ؟\nالعمود الأيسر: 6، 20، 120","sahli_written:sw-solo-sahli-f1-p046-q03":"نجمة + هلال + سهم + هلال = 21\nنجمة + سهم + سهم + هلال = 23\nنجمة + نجمة + هلال + هلال = 18","sahli_written:sw-solo-sahli-f1-p046-q04":"قمر + نجمة + نجمة + مفتاح = 20\nقمر + قمر + مفتاح + نجمة = 17\nنجمة + مفتاح + مفتاح + مفتاح = 21","sahli_written:sw-solo-sahli-f1-p111-q03":"ميزانان متوازنان:\nالميزان الأول: في كفة نجمتان ودائرة، وفي الأخرى 3 مربعات\nالميزان الثاني: في كفة نجمة ودائرتان، وفي الأخرى مربعان","sahli_written:sw-solo-sahli-f3-p050-q01":"دراسة تابعت 60 متطوعاً مدة سنة، قُسموا إلى ثلاث مجموعات متساوية حسب غذائهم الغالب، وسُجّل عدد من ارتفع لديهم الكوليسترول:\nالمجموعة | العدد | ارتفع لديهم | لم يرتفع\nأطعمة مقلية | 20 | 9 | 11\nوجبات سريعة | 20 | 6 | 14\nخضار وفواكه | 20 | 2 | 18","sahli_written:sw-solo-sahli-f3-p050-q03":"دراسة تابعت 60 متطوعاً مدة سنة، قُسموا إلى ثلاث مجموعات متساوية حسب غذائهم الغالب، وسُجّل عدد من ارتفع لديهم الكوليسترول:\nالمجموعة | العدد | ارتفع لديهم | لم يرتفع\nأطعمة مقلية | 20 | 9 | 11\nوجبات سريعة | 20 | 6 | 14\nخضار وفواكه | 20 | 2 | 18","sahli_written:sw-solo-sahli-f3-p050-q04":"دراسة تابعت 60 متطوعاً مدة سنة، قُسموا إلى ثلاث مجموعات متساوية حسب غذائهم الغالب، وسُجّل عدد من ارتفع لديهم الكوليسترول:\nالمجموعة | العدد | ارتفع لديهم | لم يرتفع\nأطعمة مقلية | 20 | 9 | 11\nوجبات سريعة | 20 | 6 | 14\nخضار وفواكه | 20 | 2 | 18","sahli_written:sw-solo-sahli-f3-p050-q05":"دراسة تابعت 60 متطوعاً مدة سنة، قُسموا إلى ثلاث مجموعات متساوية حسب غذائهم الغالب، وسُجّل عدد من ارتفع لديهم الكوليسترول:\nالمجموعة | العدد | ارتفع لديهم | لم يرتفع\nأطعمة مقلية | 20 | 9 | 11\nوجبات سريعة | 20 | 6 | 14\nخضار وفواكه | 20 | 2 | 18","sahli_written:sw-solo-sahli-f3-p031-q01":"رسم أعمدة بعنوان «عدد الكتب التي طبعتها مطبعة (بالمئات) خلال 6 أشهر»:\nمحرم: 15\nصفر: 40\nربيع الأول: 35\nربيع الآخر: 25\nجمادى الأولى: 45\nجمادى الآخرة: 20","sahli_written:sw-solo-sahli-f1-p041-q02":"بعض اجتماعات الشركة تُعقد يوم الأحد، وكل اجتماعات يوم الأحد طويلة.","sahli_written:sw-solo-sahli-f1-p042-q01":"يرمّز نظام كل عدد بشفرة على هذا النحو:\nالعدد 47: الشفرة 96\nالعدد 135: الشفرة 753\nالعدد 21: الشفرة 34","sahli_written:sw-solo-sahli-f1-p042-q02":"تكررت سرقة الدراجات الهوائية من مواقف حي سكني، واقتُرحت عدة حلول.","sahli_written:sw-solo-sahli-f1-p045-q09":"س و ص عددان صحيحان موجبان، مجموعهما 9، و س أكبر من ص.","sahli_written:sw-solo-sahli-f1-p053-q06":"موظف يسكن في أبها، نُقل للعمل في الدمام لمدة سنتين ثم يعود إلى أبها، وراتبه محدود.","sahli_written:sw-solo-sahli-f1-p081-q01":"نظرتَ إلى ساعة حائط بعقارب (بلا أرقام) في المرآة، فبدت تشير إلى 4:20. وأنت تعلم أن هذه الساعة تتأخر 15 دقيقة عن الوقت الصحيح.","sahli_written:sw-solo-sahli-f3-p048-q01":"أجرى باحث دراسة على طلاب لمعرفة علاقة ساعات القراءة الأسبوعية بدرجة الطلاقة في الكتابة.","sahli_written:sw-solo-sahli-f3-p048-q03":"قاس باحث درجة الثقة بالنفس ودرجة الاعتماد على الآخرين في اتخاذ القرار لدى مجموعة من الطلاب.","sahli_written:sw-solo-sahli-f1-p070-q03":"تُصف مربعات متلاصقة في صف واحد مصنوعة من أعواد متساوية، والمربعات المتجاورة تشترك في ضلع."};
window.QCTX = {"في دراسة «القراءة بصوت مرتفع»: عيّنة الدراسة:":{"t":"الدراسة","x":"أراد باحث أن يعرف: هل تساعد القراءة بصوت مرتفع على تذكّر الكلمات الجديدة؟ فاختار 60 طالباً من الصف الأول المتوسط، وقسمهم مجموعتين متساويتين. قرأت المجموعة الأولى قائمة كلمات بصوت مرتفع، وقرأتها الثانية بصمت. وبعد يوم اختبرهم في عدد الكلمات التي يتذكّرونها، فتذكّرت المجموعة الأولى كلمات أكثر."},"في دراسة «القراءة بصوت مرتفع»: المجموعة الضابطة في الدراسة:":{"t":"الدراسة","x":"أراد باحث أن يعرف: هل تساعد القراءة بصوت مرتفع على تذكّر الكلمات الجديدة؟ فاختار 60 طالباً من الصف الأول المتوسط، وقسمهم مجموعتين متساويتين. قرأت المجموعة الأولى قائمة كلمات بصوت مرتفع، وقرأتها الثانية بصمت. وبعد يوم اختبرهم في عدد الكلمات التي يتذكّرونها، فتذكّرت المجموعة الأولى كلمات أكثر."},"في دراسة «القراءة بصوت مرتفع»: ماذا قاس الباحث؟":{"t":"الدراسة","x":"أراد باحث أن يعرف: هل تساعد القراءة بصوت مرتفع على تذكّر الكلمات الجديدة؟ فاختار 60 طالباً من الصف الأول المتوسط، وقسمهم مجموعتين متساويتين. قرأت المجموعة الأولى قائمة كلمات بصوت مرتفع، وقرأتها الثانية بصمت. وبعد يوم اختبرهم في عدد الكلمات التي يتذكّرونها، فتذكّرت المجموعة الأولى كلمات أكثر."},"في دراسة «القراءة بصوت مرتفع»: المتغيّر المستقل في الدراسة:":{"t":"الدراسة","x":"أراد باحث أن يعرف: هل تساعد القراءة بصوت مرتفع على تذكّر الكلمات الجديدة؟ فاختار 60 طالباً من الصف الأول المتوسط، وقسمهم مجموعتين متساويتين. قرأت المجموعة الأولى قائمة كلمات بصوت مرتفع، وقرأتها الثانية بصمت. وبعد يوم اختبرهم في عدد الكلمات التي يتذكّرونها، فتذكّرت المجموعة الأولى كلمات أكثر."},"في دراسة «القراءة بصوت مرتفع»: الفرضية المناسبة قبل إجراء الدراسة:":{"t":"الدراسة","x":"أراد باحث أن يعرف: هل تساعد القراءة بصوت مرتفع على تذكّر الكلمات الجديدة؟ فاختار 60 طالباً من الصف الأول المتوسط، وقسمهم مجموعتين متساويتين. قرأت المجموعة الأولى قائمة كلمات بصوت مرتفع، وقرأتها الثانية بصمت. وبعد يوم اختبرهم في عدد الكلمات التي يتذكّرونها، فتذكّرت المجموعة الأولى كلمات أكثر."},"في دراسة «إضاءة الفصل»: سؤال الباحثة في الدراسة:":{"t":"الدراسة","x":"تساءلت باحثة: هل يؤثّر لون إضاءة الفصل في تركيز قيط والأصناف المحسّنة:":{"t":"التغير المناخي والأمن الغذائي","p":"albandri:P037"},"كلمة \"الطفرة\" في عبارة \"هذه الطفرة التكنولوجية\" تعني:":{"t":"التكنولوجيا وتغير أنماط الحياة","p":"albandri:P039"},"العلاقة بين \"الشاردة\" و\"النادرة\" من حيث المعنى:":{"t":"القطعة الثامنة: الذهبي","p":"albandri:P233"},"القطعة تتكلم عن؟":{"t":"قطعة زلزال تسونامي","p":"albandri:P244"},"عدد أسباب عزوف الروس عن الإنجاب في النص:":{"t":"قطعة (المشكلة السكانية في روسيا)","p":"amer:AP010"},"وفقًا للنص: فإن كمية الملح في البحر الميت مقارنة بالبحار الأخرى:":{"t":"دراسة البحر الميت","p":"amer:AP104b"},"وفقًا للنص: فإن الأيونات السالبة مفيدة للجهاز:":{"t":"دراسة البحر الميت","p":"amer:AP104b"},"أولوية العلاج تكون لـ:":{"t":"دراسة الطلاب كثيري الغياب","p":"amer:AP108a"},"ما نظرتك للمدرسة التي يكثر فيها غياب الطلاب وتأخرهم عن الحصص والصلاة؟":{"t":"دراسة الطلاب كثيري الغياب","p":"amer:AP108a"},"إذا كان هناك شخصان يتناولان نفس الطعام، ويمارسان نفس النشاط، ولكن أحدهما زاد وزنه عن الآخر فإن السبب يرجع إلى عامل:":{"t":"دراسة عن السمنة والبدانة","p":"amer:AP109a"},"عدد العوامل المؤثرة في البدانة كما جاءت في النص:":{"t":"دراسة عن السمنة والبدانة","p":"amer:AP109a"},"المقصود بكلمة (يذهب) في عبارة (ويذهب الباحثون إلى أن السمنة ...):":{"t":"دراسة عن السمنة والبدانة","p":"amer:AP109a"},"أي من الآتي غير صحيح؟":{"t":"دراسة الألعاب الهوائية لطلاب الأردن","p":"amer:FP113"},"هدف المجلة من هذه العناوين:":{"t":"دراسة الحرامي","p":"amer:FP114"},"من أصغر واحدة؟":{"t":"أخوات أمل ونورة ومنال وابتسام وسمر (أسئلة 9-12)","p":"amer:FP119"},"أي مما يلي يؤخذ على صياغة شروط الرحلة؟":{"t":"تعهد الرحلة البحرية","p":"sahli_written:sw-sahli-f1-p153-t01"},"أي الآراء الآتية يدعمه موقف الموظفة بشأن تدريس الإنجليزية في التعليم العام؟":{"t":"موظفة مرشحة لدبلوم في الخارج","p":"sahli_written:sw-sahli-f1-p155-t01"},"في كل مربع أربعة أعداد، ومجاميع المربعات تسير بنمط ثابت. ما قيمة س؟":{"t":"شبكات الأعداد","p":"sahli_written:sw-solo-sahli-f1-p044-q01"},"ما مهمة طارق؟":{"t":"مهام الإخوة","p":"sahli_written:sw-solo-sahli-f1-p045-q03"},"ف window.WHY_BY_TEXT = {"جَمَل : صحراء":{"ماء : عطش":"الماء يسدّ العطش، فعلاقتهما «حاجة وما يسدّها». جملة الربط «يعيش في» لا تصحّ: الماء لا يعيش في العطش.","شبكة : صيّاد":"الشبكة أداة يستعملها الصيّاد، فعلاقتهما «أداة ومستعملها». لا كائن هنا ولا موطن يعيش فيه.","ملح : طعام":"الملح يُضاف إلى الطعام ليُصلحه، والطعام ليس موطناً يعيش فيه الملح. جملة «يعيش في» لا تصحّ معه."},"عسل : حلاوة":{"حرارة : نار":"العلاقة نفسها لكنها مقلوبة: الحرارة صفة لازمة للنار، والسؤال يبدأ بالشيء ثم صفته. هذا فخ الاتجاه.","صيف : شتاء":"الصيف والشتاء فصلان متقابلان، فعلاقتهما «تضاد». جملة «صفته اللازمة» لا تصحّ معهما.","سكر : قهوة":"السكر يُضاف إلى القهوة، والقهوة ليست صفة لازمة للسكر. جملة «صفته اللازمة» لا تصحّ معه."},"كتاب : فصل":{"مكتبة : قارئ":"المكتبة مكان يرتاده القارئ، فعلاقتهما «مكان وما فيه». الخيار من عالم الكتب، لكن علاقته مختلفة: فخ الموضوع.","صفحة : مجلّد":"الصفحة جزء من المجلّد، أي «جزء ثم كل». السؤال «كل ثم جزء»، فهذا مقلوب: فخ الاتجاه.","مؤلّف : رواية":"المؤلّف يكتب الرواية، فعلاقتهما «صاحب مهنة ومنتَجه»، بترتيب يخالف السؤال. والرواية لا تتكوّن من مؤلّفين."},"نحّال : عسل":{"نحلة : زهرة":"النحلة تتغذى من الزهرة، والنحلة ليست صاحبة مهنة، والزهرة ليست ناتج مهنة. الخيار من عالم النحل، لكن علاقته مختلفة: فخ الموضوع.","طبيب : مريض":"الطبيب يعالج المريض، والمريض ليس ناتج مهنته. جملة «ناتج مهنته» لا تصحّ معه.","عسل : شمع":"العسل والشمع كلاهما من النحل، ولا صاحب مهنة في الخيار. جملة «صاحب مهنة، و… ناتج مهنته» لا تصحّ معه."},"مزارع : حقل":{"حقل : قمح":"القمح ينبت في الحقل، فعلاقتهما «مكان وما فيه». الحقل ليس صاحب مهنة.","طبيب : دواء":"الطبيب يصف الدواء، والدواء ليس مكاناً يعمل فيه. جملة «يعمل في» لا تصحّ: الطبيب لا يعمل في الدواء.","مزرعة : مزارع":"المكان أولاً ثم صاحب المهنة، أي مقلوب: فخ الاتجاه."},"غيمة : مطر":{"ثمرة : شجرة":"الثمرة تخرج من الشجرة، فالمصدر هو الكلمة الثانية والسؤال يبدأ بالمصدر. العلاقة نفسها مقلوبة: فخ الاتجاه.","سماء : نجم":"النجم يظهر في السماء، فعلاقتهما «مكان وما فيه». النجم لا يخرج من السماء كما يخرج المطر من الغيمة.","قطرة : بحر":"القطرة جزء من البحر، فعلاقتهما «جزء وكل»، لا «مصدر وما يخرج منه»."},"إبرة : خِياطة":{"مقصّ : ورق":"المقص أداة تُستعمل على الورق، والورق مادة لا حرفة. الجملة الأولى «أداة لـ» تصحّ معه، فنضيّق إلى «أداة تُؤدّى بها حرفة».","خيط : ثوب":"الثوب يُصنع من الخيط، فعلاقتهما «مادة وما يُصنع منها». الخيط ليس أداة.","خيّاط : إبرة":"الخيّاط يستعمل الإبرة، فعلاقتهما «أداة ومستعملها» مقلوبة، لا «أداة وعمل». والخيّاط شخص لا حرفة."},"حرف : كلمة":{"جملة : كلمة":"الجملة تتكوّن من كلمات، فهذا «كل ثم جزء»، والسؤال «جزء ثم كل». مقلوب: فخ الاتجاه.","قلم : حرف":"القلم يُكتب به الحرف، والقلم ليس وحدة تُبنى منها الحروف. جملة «وحدة تُبنى منها» لا تصحّ معه.","حبر : ورقة":"الحبر يُكتب به على الورقة، والورقة لا تُبنى من الحبر. جملة «وحدة يُبنى منها» لا تصحّ معه."},"في سؤال «مِشرط : جرّاح»، لماذا أضفنا «في مهنته» إلى جملة الربط؟":{"لأن الجملة الأولى كانت مقلوبة الاتجاه":"الجملة الأولى بدأت بالكلمة الأولى «المشرط»، فاتجاهها صحيح. المشكلة أنها صحّت مع خيارين.","لأن الخيارات كلها من موضوع الطب":"الخيارات من مواضيع مختلفة: ملعقة، ومطرقة، وفرشاة. والموضوع لا يحدد الجواب أصلاً.","لأن الجملة القصيرة لا تصلح في التناظر":"الجملة القصيرة هي الأصل. نطيلها بقيد واحد فقط حين يصحّ معها أكثر من خيار."},"أول خطوة في حل سؤال التناظر:":{"قراءة الخيارات الأربعة بسرعة":"إذا قرأت الخيارات أولاً بدأت بعلاقة الخيار لا بعلاقة السؤال، فيوحي لك بعلاقة غير موجودة. وهذا فخ قراءة الخيارات أولاً.","البحث عن خيار من نفس الموضوع":"الموضوع لا يحدد الجواب، والخيار من الموضوع نفسه كثيراً ما يكون هو الفخ.","استبعاد الخيار الأطول":"طول الخيار لا علاقة له بالعلاقة بين كلمتيه، فلا يُستبعد به خيار."},"سمعت من زميل أن القسم الأول لفظي في كل مرة، وأن لكل قسم عشرين دقيقة. ما الموقف الصحيح؟":{"أوزّع وقتي على عشرين دقيقة لكل قسم":"زمن القسم غير معلن، فالخطة المبنية عليه قد تنهار يوم الاختبار.","أراجع اللفظي وحده في الأسبوع الأخير":"الاختبار خمسة مكوّنات، وترتيبها غير معلن، فالمراجعة المختلطة أنفع.","أصدّقه لأنه اختبر قبلي":"تجربة شخص واحد ليست إعلاناً رسمياً، وقد تختلف من اختبار لآخر."},"افترض أن للقسم 30 دقيقة، وفيه 20 سؤالاً. كم ثانية في المتوسط للسؤال الواحد؟":{"60":"أخذ تقدير «دقيقة للسؤال» من الاختبار كله، والقسم هنا زمنه مفترض أطول.","600":"ضرب الدقائق في عدد الأسئلة بدل أن يقسم.","1.5":"قسم 30 على 20، ونسي أن الناتج دقائق لا ثوانٍ."},"في الجولة الأولى من القسم، وصلت إلى سؤال صعب لا تعرف طريق حله. ما التصرف الأنسب؟":{"أبقى عنده حتى أصل إلى الحل":"يحبسك عند سؤال واحد، وقد يضيع وقت أسئلة سهلة بعده.","أرجع إلى أول القسم وأراجع ما أجبته":"المراجعة قبل أن تصل إلى آخر القسم تضيّع وقت أسئلة لم تقرأها.","أنهي القسم وأنتقل إلى الذي بعده":"تترك أسئلة القسم الباقية، ولا تفترض أنك ترجع إلى قسم أنهيته."},"افترض أن القسم 20 سؤالاً، وله 30 دقيقة. مضت 20 دقيقة، وأجبت عن 12 سؤالاً، وعلّمت سؤالين صعبين عليك. ما الخطة الأنسب للدقائق العشر الباقية؟":{"أرجع إلى السؤالين المعلّمَين أولاً حتى أحلّهما":"الصعب قد يأكل الدقائق العشر، وتضيع الأسئلة الستة التي لم تقرأها.","أراجع الأسئلة الاثني عشر التي أجبتها":"مراجعة ما أجبته قبل أن تقرأ ما بقي تضيّع أسئلة لم تحاولها.","أختار إجابة واحدة لكل ما بقي دون قراءته":"الوقت يكفي لقراءتها، ومنها ما تعرفه، فلا تخمّن قبل أن تقرأ."},"في سؤال، استبعدت خيارين خطأين قطعاً، وبقي خياران ولم تعرف أيهما الصحيح. والتعليمات على الشاشة لا تذكر خصماً للإجابة الخاطئة. ماذا تفعل؟":{"أترك السؤال بلا إجابة حتى لا أخطئ":"التعليمات لا تذكر خصماً، فالترك يضيّع فرصة قائمة بلا مقابل.","أختار عشوائياً من الخيارات الأربعة كلها":"يرجع إلى الخيارين المستبعدين، فيضيّع ما كسبه بالاستبعاد.","أقضي ما بقي من وقت القسم عليه حتى أتأكد":"يحبسك عند سؤال واحد، والاختيار من الاثنين يكفي هنا."},"في سؤال تناظر، الزوج المعطى «بوصلة : بحّار». أي الخيارات تستبعده أولاً بقاعدة الاتجاه؟":{"ريشة : خطّاط":"الأداة أولاً ثم صاحبها، بالاتجاه نفسه، فلا تستبعده قاعدة الاتجاه.","مقصّ : حلّاق":"المقصّ أداة الحلّاق، والأداة أولاً كالزوج المعطى.","مِجداف : ملّاح":"المجداف أداة الملّاح، فالاتجاه نفسه، ويُحسم بغير هذه القاعدة."},"سؤال ضرب، وخياراته الأربعة متقاربة جداً، وكل منها ينتهي برقم آحاد مختلف. ما أسرع طريقة لحسمه؟":{"أضرب العددين كاملين على الورق":"يصل إلى الجواب، لكنه أبطأ بكثير من حساب الآحاد.","أقرّب العددين، وأختار الأقرب للناتج":"التقريب لا يفرّق بين خيارات متقاربة جداً.","أجرّب الخيار الأوسط أولاً، ثم أقارن":"تجربة الخيارات في الضرب تحتاج قسمة طويلة، فلا توفّر وقتاً."},"في سؤال «أي العبارات يلزم صدقها؟» بقي خياران بعد الاستبعاد: الأول يصح في أغلب الحالات، والثاني يصح في كل حالة تسمح بها المعطيات. أيهما تختار؟":{"الذي يصح في أغلب الحالات":"حالة واحدة تنقضه تكفي لإسقاطه، فهو «قد يكون» لا «يلزم».","الأطول منهما، لأنه أكثر تفصيلاً":"الطول ليس دليلاً، والتفصيل الزائد قد يضيف ما لا يلزم.","أترك السؤال، لأن الخيارين ممكنان":"قاعدة «يلزم» تحسم بينهما، فلا داعي للترك."},"الطريقة الصحيحة لإدارة الوقت داخل القسم:":{"أحل الأسئلة بترتيبها ولا أتجاوز سؤالاً":"سؤال صعب واحد قد يحبسك ويضيّع أسئلة سهلة بعده.","أبدأ بأصعب الأسئلة وأنا في كامل تركيزي":"الصعب يأكل الوقت أولاً، والسهل له الدرجة نفسها.","أعطي كل سؤال الوقت نفسه، ولا أرجع إليه":"الأسئلة تختلف في وقتها، والرجوع إلى المعلّم يكسب درجات."},"افترض أن القسم 20 سؤالاً، وله 30 دقيقة. في الجولة الأولى أجبت عن 16 سؤالاً في 18 دقيقة، وعلّمت الباقي. كم دقيقة من الوقت الباقي لكل سؤال علّمته في المتوسط؟":{"7.5":"قسم زمن القسم كله على الأربعة، ونسي الدقائق التي مضت.","0.6":"قسم الوقت الباقي على أسئلة القسم كلها، والمطلوب الأسئلة المعلّمة فقط.","4.5":"قسم الدقائق التي مضت بدل الباقية."},"أي مما يلي يؤخذ على صياغة شروط الرحلة؟":{"عدم توقيع الآباء عليها":"الآباء وقّعوا الوثيقة.","تكرار بعض الشروط بألفاظ مختلفة":"لكل شرط من الشروط الخمسة موضوع مستقل، فلا تكرار بينها.","خلوّها من شرط سترة النجاة":"سترة النجاة أول الشروط."},"أي الآراء الآتية يدعمه موقف الموظفة بشأن تدريس الإنجليزية في التعليم العام؟":{"نفعه مقصور على التخصصات الأدبية":"الموظفة تدرس دبلوماً مهنياً، ولا شيء يحصر النفع في الأدبي.","أثره محايد لا ينفع ولا يضر":"تجربتها تدل على أثر نافع لا محايد.","غير ضروري لأن الدورات تغني عنه":"الموقف لم يذكر الدورات، وتجربتها تدل على نفع التعليم العام."},"في سباق دراجات بين خمسة: نواف، ريان، زياد، ماجد، طلال. كان نواف في المقدمة وخلفه ريان مباشرة، وخلف ريان كلٌّ من زياد وماجد، وكلاهما أمام طلال. ثم انسحب ريان، وتقدّم زياد على نواف. من صار خلف نواف مباشرة؟":{"ريان":"ريان انسحب من السباق فلم يعد في الترتيب.","زياد":"زياد تقدّم على نواف فصار أمامه لا خلفه.","طلال":"طلال خلف زياد وماجد معاً، فبينه وبين نواف ماجد."},"عمر سلمان قبل 8 سنوات كان يساوي 7 أمثال عمر ابنته الآن، وابنته سيصبح عمرها بعد 3 سنوات 8 سنوات. كم عمر سلمان الآن؟":{"27":"27 من طرح 8 بدل جمعها.","35":"35 عمره قبل 8 سنوات، ونُسيت إضافة الـ8.","64":"64 من ضرب 7 في 8 (عمرها بعد 3 سنوات) بدل عمرها الآن."},"إذا كان PLD = 5368 و PWL = 5236، فما رمز DLP؟":{"835":"835 من اعتبار L رقماً واحداً (3) ونسيان أن رمزها رقمان.","5368":"5368 رمز PLD نفسه دون إعادة ترتيب الحروف.","8635":"8635 قلب للأرقام كلها، مع أن L رمزها 36 كتلة واحدة لا تنقلب."},"مديرة مدرسة مكتبها عند المدخل في الدور الأرضي، وتريد متابعة حضور الإداريات صباحاً بنفسها، ومكتب الإداريات في الدور الرابع. ما الإجراء الأنسب؟":{"تخصيص مصعد يصعد بالإداريات مباشرة إلى الرابع":"المصعد الخاص يبعدهن عن نظرها أكثر.","نقل مكتبها هي إلى الدور الثاني":"نقل مكتبها يبعدها عن المدخل وعن مكتب الإداريات معاً.","نقل مكتب الإداريات إلى الدور الثالث":"الدور الثالث يبقى بعيداً عن نظرها، فلا يحل المشكلة."},"رتّب سلمان سبعة كتب على رف في مواضع مرقّمة من 1 إلى 7 من اليمين: كتابا تاريخ، وكتابا علوم، وروايتان، ومعجم. كتابا التاريخ في الطرفين، والروايتان متجاورتان وإحداهما في الموضع 5، وكتابا العلوم غير متجاورين، والمعجم لا يجاور رواية ولا كتاب تاريخ. ما موضعا كتابي العلوم؟":{"4 و 6":"الموضع 6 فيه رواية، والمعجم حينها يجاور رواية.","3 و 6":"3 و 6 ترتيب يضع المعجم في 2 بجوار كتاب التاريخ، وهذا ممنوع.","2 و 6":"الموضع 6 فيه رواية، لأن الروايتين في 5 و 6."},"خمس أخوات: ريم، ليان، جود، تالا، دانة. جود أكبر من ليان وأصغر من دانة، وليان أكبر من ريم، وتالا أصغر من ريم. من الأخت التي في الوسط عمراً؟":{"جود":"جود في الوسط بين ليان ودانة في الشرط الأول فقط، أما بين الخمس فهي الثانية من الأكبر.","تالا":"تالا الصغرى لأنها أصغر من ريم.","ريم":"ريم الثانية من الأصغر، فقبلها تالا وحدها."},"سبعة إخوة أعمارهم بين 5 و 23 سنة، وبين كل أخ والذي يليه 3 سنوات. فيصل أصغرهم، وعمره أقل من عمر بدر بـ 12 سنة، وبدر ليس الأكبر. كم عمر بدر؟":{"12":"12 هو الفرق نفسه لا عمر بدر.","14":"14 من عدّ الفرق 3 خطوات بدل 4 (12 ÷ 3 = 4).","23":"23 عمر الأكبر، وبدر ليس الأكبر."},"شاحنة اصطدمت بسور مدرسة وغادرت. سبعة شهود وصفوا لوحتها: خمسة قالوا إن الحرف الأول (د) واثنان قالا (ذ)، وأربعة قالوا إن الحرف الثاني (ك) وثلاثة قالوا (ل)، وستة قالوا إن الحرف الثالث (هـ)، وأربعة قالوا إن الأرقام تبدأ بـ 38 وثلاثة قالوا 83، واتفقوا أن آخر رقم 6. ما اللوحة الأرجح؟":{"ذ ل هـ 836":"هذه أقوال الأقلية في الحرفين الأولين والأرقام.","د ل هـ 386":"اختار (ل) وقالها 3 مقابل 4 قالوا (ك).","د ك هـ 836":"اختار 83 وقالها 3 مقابل 4 قالوا 38."},"سبع أخوات بين كل واحدة والتي تليها سنتان، كبراهن 22 سنة وصغراهن 10. هيا أكبر من سلمى بـ 4 سنوات، وأكبر من لين بـ 8 سنوات، وريما أكبر من سلمى وأصغر من نوف، ووعد هي الكبرى. كم عمر جنى؟":{"10":"10 عمر لين لأنها أصغر من هيا بـ 8.","14":"14 عمر سلمى لأنها أصغر من هيا بـ 4.","16":"16 عمر ريما، فهي بين سلمى (14) ونوف (20)."},"ست أخوات: مها، شهد، أروى، بشرى، منار، رهف، كل واحدة في صف مختلف من الأول المتوسط إلى الثالث الثانوي. شهد أكبر من أروى ومنار لكنها أصغر من بشرى، وبشرى أكبر من رهف لكنها أصغر من مها. من تدرس في الصف الثاني الثانوي؟":{"شهد":"شهد أصغر من بشرى، فلا تكون الثانية.","مها":"مها الكبرى، فهي في الثالث الثانوي لا الثاني.","منار":"منار أصغر من شهد، وشهد أصغر من بشرى."},"في كل مربع أربعة أعداد، ومجاميع المربعات تسير بنمط ثابت. ما قيمة س؟":{"1":"1 من خطأ في الجمع (8 + 3 + 6 = 18).","7":"7 من افتراض أن المجموع 24 في كل المربعات.","17":"17 مجموع الأعداد المعروفة لا قيمة س."},"ما مهمة طارق؟":{"غسل السيارة":"غسل السيارة يوم الأحد، وطارق لا يعمل الأحد.","ترتيب المجلس":"ترتيب المجلس لمشاري بنص المعطيات.","ري الحديقة":"ري الحديقة السبت لفهد، وطارق يعمل الثلاثاء."},"تكثر حوادث دهس الأطفال قرب مدرسة ابتدائية في أحد الأحياء بسبب سرعة السيارات. ما أنسب حل؟":{"نقل المدرسة إلى أطراف المدينة بعيداً عن الحي":"نقل المدرسة مكلف ويبعدها عن طلابها، ولا يعالج السرعة.","تأخير بداية الدوام المدرسي ساعة كاملة":"تغيير وقت الدوام لا يخفف سرعة السيارات.","منع السيارات من دخول الحي طوال اليوم":"منع السيارات من الحي كله يعطل السكان، وهو أكبر من المشكلة."},"خمسة أصدقاء في طابور أمام موظف (الموضع 1 الأقرب للموظف): أنس، زياد، حسام، مروان، إياد، ووظائفهم: محاسب، مهندس، طبيب، معلم، طيار (ليست بالترتيب). حسام ومروان ليسا الأول ولا الأخير. المحاسب قبل المعلم، والمعلم قبل الطيار، ومروان بين المحاسب والمعلم. حسام خلف المهندس مباشرة. زياد ليس محاسباً، وإياد ليس محاسباً ولا مهندساً. إياد أمام المحاسب مباشرة، والطيار هو الأخير. ما وظيفة مروان؟":{"طبيب":"الطبيب إياد، لأنه ليس محاسباً ولا مهندساً ويقف أولاً.","محاسب":"مروان يقف بين المحاسب والمعلم، فليس أحدهما.","معلم":"المعلم حسام، لأنه خلف المهندس مباشرة."},"في الشبكة: كل صف حاصل ضرب خانته اليمنى في الوسطى يساوي اليسرى، وكل عمود حاصل ضرب أوله في ثانيه يساوي ثالثه. ما العددان الناقصان في العمود الأوسط (من الأعلى)؟":{"4 و 8":"4 و 8 نقلٌ لنمط العمود الأيمن دون الرجوع إلى الصفوف، و 4 × 4 لا تساوي 20.","20 و 40":"20 هو حاصل الصف لا العامل الناقص فيه.","5 و 7":"7 من جمع 2 + 5 بدل ضربهما."},"كم قيمة الهلال؟":{"4":"4 قيمة النجمة.","7":"7 قيمة السهم.","9":"9 مجموع النجمة والهلال (18 ÷ 2)، لا قيمة الهلال."},"كم قيمة المفتاح؟":{"3":"3 قيمة القمر.","6":"6 قيمة النجمة.","7":"7 من قسمة 21 على 3 ونسيان أن النجمة جزء من المعادلة الثالثة."},"خمسة أصدقاء: بندر، سلمان، فهد، ثامر، عادل. ثامر أقصر من بندر وفهد وأطول من عادل، وفهد يأتي بعده اثنان في الترتيب من الأطول، ويأتي بعد سلمان مباشرة. من الأطول؟":{"ثامر":"ثامر رابع، أقصر من فهد وبندر.","سلمان":"سلمان ثانٍ لأن فهد يأتي بعده مباشرة في الموضع الثالث.","فهد":"فهد ثالث لأن بعده اثنين."},"ما رقم الشهر في التاريخ الذي يسبق 15/4/1446 هـ بسنتين وسبعة أشهر؟":{"3":"3 من طرح 4 من 7 دون الاستلاف من السنة.","8":"8 من الاستلاف ثم إنقاص شهر زائد.","11":"11 من جمع 4 و 7 بدل الطرح."},"رجل أرمل له أطفال تزوج أرملة لها أطفال، وبعد سنوات صار مجموع الأطفال كلهم 14، ولكل واحد من الزوجين 11 طفلاً. كم طفلاً أنجبا معاً؟":{"3":"3 عدد أطفال أحدهما السابقين (11 − 8)، لا المشترك.","6":"6 مجموع أطفالهما السابقين (3 + 3).","11":"11 عدد أطفال كل واحد منهما بما فيهم المشترك."},"إذا كان اليوم الذي بعد غدٍ هو اليوم الثالث بعد الأحد، فما اليوم الذي كان قبل أمس؟":{"الأحد":"الأحد هو أمس لا قبل أمس.","الجمعة":"الجمعة قبل أمس بيوم زائد.","الاثنين":"الاثنين هو اليوم نفسه."},"يريد مدير مستشفى ترشيح ممرض واحد لدورة متقدمة في الخارج. على أي أساس يكون الاختيار الأنسب؟":{"الأقرب سكناً من المستشفى":"مكان السكن لا علاقة له بالاستفادة من الدورة.","الأقدم في الخدمة":"الأقدمية لا تعني الأفضل أداءً.","الأكبر سناً بين الممرضين":"العمر لا يدل على الكفاءة."},"أربعة إخوة: طلال، نبيل، أيمن، هشام، أعمارهم 30 و 28 و 26 و 24. قال طلال: عمري أكثر من 29، وقال نبيل: عمري 28، وقال أيمن: لست الأصغر. اثنان من الثلاثة صادقان وواحد كاذب. وإذا رُتّبوا من الأكبر جاء نبيل بعد طلال مباشرة وقبل هشام مباشرة. من عمره 24؟":{"طلال":"طلال 30 وكلامه صادق.","نبيل":"نبيل 28 وكلامه صادق.","هشام":"هشام 26 لأنه بعد نبيل مباشرة وقبل أيمن."},"خمسة طلاب أوائل، كل واحد من فصل: 2/1، 2/2، 2/3، 2/4، 2/5، ورُتّبوا من 1 إلى 5. صاحبا المركزين 4 و 5 من الفصلين 2/4 و 2/5، وصاحبا المركزين 1 و 2 من الفصلين 2/2 و 2/3، والفرق بين مركز طالب 2/3 ومركز طالب 2/5 مركزان. ما مركز طالب الفصل 2/2؟":{"الرابع":"الرابع مركز طالب 2/5.","الثاني":"الثاني مركز طالب 2/3.","الثالث":"الثالث مركز طالب 2/1، الفصل الوحيد الباقي."},"عبدالرحمن وبسام ووليد وكريم كفلوا أيتاماً بحسب أعمارهم: الأكبر كفل 4 أيتام، والذي يليه 3، ثم 2، والأصغر يتيماً واحداً. وليد أكبر من كريم وأصغر من بسام، وكريم يأتي مباشرة قبل عبدالرحمن في الترتيب من الأكبر. من كفل يتيمين؟":{"عبدالرحمن":"عبدالرحمن الأصغر فيكفل يتيماً واحداً.","بسام":"بسام الأكبر فيكفل 4.","وليد":"وليد الثاني فيكفل 3."},"في سباق جري: مازن في المقدمة وخلفه هشام مباشرة، وخلف هشام كلٌّ من ياسر وعادل، وكلاهما أمام صالح. ثم انسحب هشام، وتقدّم عادل على مازن، ثم تجاوز صالح ياسر. من يلي مازن مباشرة الآن؟":{"عادل":"عادل تقدّم على مازن فصار أمامه.","هشام":"هشام انسحب من السباق.","ياسر":"ياسر كان خلف مازن، لكن صالح تجاوزه."},"ستة إخوة: حمد، راكان، خليل، مازن، صقر، سعد. خليل أقصر من راكان وسعد لكنه أطول من صقر، وحمد أطول من خليل، وبين حمد وراكان شخصان في الترتيب، ومازن الثالث طولاً. من الثاني طولاً؟":{"خليل":"خليل الخامس، أقصر من راكان وسعد وحمد.","مازن":"مازن الثالث بنص المعطيات.","صقر":"صقر الأقصر لأنه أقصر من خليل."},"أظهر مسح صحي في قرية أن 15% من أطفالها دون الخامسة مصابون بفقر الدم، بينما لا تكاد تُسجَّل حالات بين البالغين. ما الإجراء الذي تدعمه هذه النتيجة؟":{"نقل سكان القرية إلى مدينة قريبة":"النقل لا يعالج سبب فقر الدم، وهو أكبر من المشكلة.","تكثيف فحص كبار السن والبالغين في القرية":"البالغون لا تكاد تُسجَّل فيهم حالات، فليسوا محل المشكلة.","إغلاق دور حضانة الأطفال في القرية مؤقتاً":"إغلاق الحضانات لا يعالج فقر الدم، فسببه التغذية لا المكان."},"كم مربعاً نحتاج لتوازن 3 نجوم؟":{"3":"3 تفترض أن الأشكال متساوية الوزن.","6":"6 تهمل الدائرتين في الميزان الثاني فتجعل النجمة مربعين.","12":"12 وزن النجوم بالدوائر لا بالمربعات."},"مكتبة تعطي خصماً 20% لكل من يشتري بـ 250 ريالاً أو أكثر. أي العبارات الآتية غير صحيحة؟":{"الشراء بـ 400 ريال يعطي خصماً قدره 80 ريالاً":"صحيحة: 20% × 400 = 80 ريالاً.","الشراء بـ 200 ريال لا يعطي أي خصم":"صحيحة: 200 أقل من 250 فلا خصم.","الشراء بـ 250 ريالاً يعطي خصماً قدره 50 ريالاً":"صحيحة: 20% × 250 = 50 ريالاً."},"متجر عطور يعطي خصماً 10% لمن يشتري بـ 500 ريال أو أكثر. أي العبارات الآتية صحيحة؟":{"الشراء بـ 450 ريالاً يعطي خصماً قدره 45 ريالاً":"450 أقل من 500 فلا خصم أصلاً.","الشراء بـ 500 ريال يعطي خصماً قدره 10 ريالات":"أخذ النسبة 10% كأنها 10 ريالات؛ والصحيح 50 ريالاً.","الشراء بـ 700 ريال يعطي خصماً قدره 50 ريالاً":"حسب الخصم على 500 فقط؛ والصحيح 70 ريالاً."},"محل أحذية يعطي خصماً 25% لمن يشتري بـ 200 ريال أو أكثر. أي العبارات الآتية غير صحيحة؟":{"الشراء بـ 180 ريالاً لا يعطي أي خصم":"صحيحة: 180 أقل من 200 فلا خصم.","الشراء بـ 320 ريالاً يعطي خصماً قدره 80 ريالاً":"صحيحة: 25% × 320 = 80 ريالاً.","الشراء بـ 200 ريال يُدفع بعده 150 ريالاً":"صحيحة: 200 − 50 = 150 ريالاً."},"خمس أخوات: هيا أكبر من سارة، ونورة أصغر من سارة، وريم أكبر من هيا، ولمى أصغر من سارة وأكبر من نورة. من الثانية في الترتيب من الأصغر؟":{"سارة":"سارة في المنتصف (الثالثة من الطرفين).","هيا":"هيا الثانية من الأكبر لا من الأصغر.","نورة":"نورة هي الأصغر، أي الأولى من الأصغر."},"أخذ أحد أربعة طلاب كتاباً. قال خالد: «سامي أخذه». وقال سامي: «ماجد أخذه». وقال ماجد: «سامي يكذب». وقال عمر: «لم آخذه». إذا كان واحد منهم فقط صادقاً، فمن أخذ الكتاب؟":{"ماجد":"لو أخذه ماجد لصدق سامي وعمر معاً، فيصير الصادقون اثنين.","سامي":"لو أخذه سامي لصدق خالد وماجد وعمر، أي ثلاثة.","خالد":"لو أخذه خالد لصدق ماجد وعمر معاً."},"أي المجموعات كانت أكثر ارتباطاً بارتفاع الكوليسترول في هذه العينة؟":{"الوجبات السريعة":"الوجبات السريعة 6 من 20 (30%)، أقل من المقلية.","لا يمكن المقارنة بينها":"المقارنة ممكنة لأن المجموعات متساوية العدد.","الخضار والفواكه":"الخضار والفواكه هي الأقل (2 من 20)، وهذا عكس المطلوب."},"قال أحد الباحثين: «نسبة من ارتفع لديهم الكوليسترول بين آكلي الأطعمة المقلية في هذه العينة أعلى منها بين آكلي الخضار والفواكه». ما الحكم على قوله؟":{"مخالف؛ لأن المجموعات غير متساوية العدد":"المجموعات متساوية (20 في كل منها) كما في الجدول.","لا يمكن الحكم إلا بمعرفة أعمار المتطوعين":"الأعمار تهم لو ادّعى سبباً؛ أما وصف العينة فيصح بدونها.","مخالف للمنهج؛ لأنه أثبت سبباً من مقارنة":"القول لم يذكر سبباً، بل وصف فرقاً في العينة."},"أي الاستنتاجات الآتية غير صحيح؟":{"مجموع من ارتفع لديهم في الدراسة 17":"صحيح: 9 + 6 + 2 = 17.","نسبة الارتفاع في مجموعة الخضار 10%":"صحيح: 2 ÷ 20 = 10%.","لم يرتفع لدى 14 من مجموعة الوجبات السريعة":"صحيح كما في الجدول."},"ما التقييم الأدق لهذه الدراسة؟":{"تثبت أن الأطعمة المقلية هي سبب ارتفاع الكوليسترول":"إثبات السبب يحتاج ضبط العوامل الأخرى، والدراسة لم تفعل.","لا فائدة منها لأن عدد من ارتفع لديهم قليل":"قلة الأعداد تضعف التعميم، لكنها لا تلغي قيمة الملاحظة.","تثبت أن الخضار والفواكه تمنع ارتفاع الكوليسترول":"قلة الارتفاع في مجموعة لا تعني أن غذاءها يمنعه."},"ما قيمة المقدار: 7/40 + (1/2 × 2/5 × 3/4 × 1/3)؟":{"13/40":"نسي ضرب الكسر الأخير 1/3، فصار الحاصل 6/40.","2/15":"جمع البسطين معاً والمقامين معاً: 8/60.","1/5":"جمع البسطين على المقام 40 دون توحيد: 8/40."},"كم كتاباً طبعتها المطبعة في الأشهر الستة، بالمئات؟":{"30":"حسب المتوسط الشهري بدل المجموع: 180 ÷ 6.","160":"أسقط الشهر الأخير (جمادى الآخرة) من الجمع.","165":"أسقط الشهر الأول (محرم) من الجمع."},"ما قيمة: 33/11 × 7/14 × 44/11؟":{"12":"أهمل الكسر 7/14 فلم يضرب في 1/2.","24":"قلب الكسر 7/14 فضرب في 2 بدل 1/2.","3/2":"أهمل الكسر 44/11 فلم يضرب في 4."},"أي العبارات الآتية صحيحة بالضرورة؟":{"س − ص = 1":"صحيحة عند (5، 4) وحده.","س عدد زوجي":"تسقط عند (5، 4) و(7، 2).","س أكبر من 6":"تسقط عند (5، 4) و(6، 3)."},"أي العبارات الآتية لا يلزم أن تكون صحيحة؟":{"للشركة اجتماعات تُعقد يوم الأحد":"تلزم مباشرة من الجملة الأولى.","بعض الاجتماعات الطويلة من اجتماعات الشركة":"تلزم: اجتماعات الشركة يوم الأحد طويلة، فهي من الاجتماعات الطويلة.","بعض اجتماعات الشركة طويلة":"تلزم: اجتماعات الأحد من اجتماعات الشركة، وكلها طويلة."},"ما العدد الذي شفرته 864؟":{"468":"عكس الترتيب ونسي طرح 2.","642":"طرح 2 من كل رقم ونسي عكس الترتيب.","6810":"أضاف 2 لكل رقم بدل طرحها."},"أي المقترحات الآتية احتياط فردي لا يعالج المشكلة من أساسها؟":{"تشجيع السكان على الإبلاغ عن المشتبه بهم":"الإبلاغ يساعد على ضبط السارق نفسه.","تعيين حارس للمواقف في ساعات الليل":"الحراسة تمنع السرقة في المواقف لكل السكان.","تركيب كاميرات وإنارة في مواقف الحي":"الكاميرات والإنارة تردع السارق وتكشفه، فهي تعالج السبب."},"ما القرار الأنسب لسكنه في الدمام؟":{"شراء أرض في الدمام وبناؤها":"البناء يأخذ وقتاً ومالاً، ويغادر بعد سنتين.","شراء شقة في الدمام بقرض طويل":"قرض طويل لسكن سيتركه بعد سنتين.","استئجار فيلا واسعة في حي راقٍ":"لا يتناسب مع راتب محدود."},"كم الوقت الصحيح الآن؟":{"4:35":"تجاهل انعكاس المرآة: 4:20 + 0:15.","7:25":"طرح 15 دقيقة مع أن الساعة متأخرة.","8:55":"أخطأ في الطرح فجعل 12:00 − 4:20 = 8:40."},"ما نوع العلاقة بين ساعات القراءة ودرجة الطلاقة؟":{"عكسية":"العكسية أن يزيد أحدهما وينقص الآخر، وهنا يزيدان معاً.","لا توجد علاقة":"القيمتان تتغيران معاً بانتظام واضح.","المعطيات غير كافية":"الجدول يكفي لرؤية الاتجاه في الطلاب الستة."},"أي العبارات تتفق مع نتائج الدراسة؟":{"الأعلى ثقة بنفسه أكثر اعتماداً على غيره":"عكس ما في الجدول.","الصفتان ترتفعان معاً عند الطلاب":"وصف علاقة طردية، والعلاقة هنا عكسية.","لا علاقة بين الصفتين في هذه العينة":"الجدول يُظهر نمطاً عكسياً منتظماً."},"كم عوداً يلزم لتكوين صف من 9 مربعات؟":{"27":"نسي العود الأول الذي يغلق الصف: 3 × 9 = 27.","31":"بدأ بأربعة أعواد ثم أضاف 3 لكل المربعات التسعة: 4 + 9 × 3 = 31.","36":"حسب كل مربع منفصلاً بأربعة أعواد: 4 × 9 = 36."},"تأمل السلسلة الآتية من اليمين، وانتبه إلى الشكل الداخلي في كل إطار. ما الإطار الخامس؟":{"شكل 1":"الشكلان صحيحان، لكن التناوب يجعل الداخلي في الإطار الخامس مصمتاً لا مفرغاً.","شكل 2":"الداخلي بعد المربع في الدورة هو الدائرة لا المثلث.","شكل 4":"قلب ترتيب الشكلين، والصحيح أن داخلي الرابع (المربع) يصير الخارجي."},"الشكل الأول بالنسبة إلى الثاني مثل الثالث بالنسبة إلى أي شكل؟ (الأزواج تُقرأ من اليمين)":{"شكل 1":"هذا الشكل الثالث نفسه، ولم تتحوّل نقاطه إلى صف.","شكل 3":"النقاط صارت صفاً، لكن الشكل الخارجي تغيّر، والقاعدة تبقيه كما هو.","شكل 4":"الشكل والصف صحيحان، لكن عدد النقاط نقص، والقاعدة لا تغيّر العدد."},"في كل صف (من اليمين) يُركَّب الشكل الثالث من الشكلين الأولين بقاعدة واحدة. ما الشكل الناقص؟":{"شكل 1":"هذا جمع الخطوط كلها، لكن الصف الأول يبيّن أن الخط المشترك يختفي.","شكل 2":"هذا الشكل الأول من الصف الثاني بلا تغيير.","شكل 3":"هذا الخط المشترك وحده، والقاعدة تحذفه وتُبقي غيره."},"الشكل الأول بالنسبة إلى الثاني مثل الثالث بالنسبة إلى أي شكل؟ في الزوج الأول صار الشكل الداخلي خارجياً، ودخل شكل جديد يرتبط عدد أضلاعه بعدد أضلاع الخارجي القديم.":{"شكل 1":"أدخل المسدس نفسه، والقاعدة تُدخل شكلاً أقل منه بضلع واحد.","شكل 3":"نقص الخارجي ضلعاً، لكن القاعدة تجعل المربع الداخلي هو الخارجي.","شكل 4":"نقل المثلث من الزوج الأول كما هو، والشكل الداخل يتبع الخارجي القديم: المسدس 6 أضلاع، فالداخل له 5."},"في الزوج الأول (من اليمين) تحوّل الشكل بقاعدتين معاً. طبّق القاعدتين على الشكل الثالث: ما الشكل الناقص؟":{"شكل 1":"دار الشكل هنا مع عقارب الساعة، والزوج الأول دار عكسها.","شكل 2":"الدوران صحيح، لكن التصميت لم ينقلب: بقيت النقطة نقطة والمربع مصمتاً.","شكل 3":"انقلب التصميت فقط، ولم يدُر الشكل؛ فالسهم ما زال إلى الأسفل."},"الشكل الأول بالنسبة إلى الثاني مثل الثالث بالنسبة إلى أي شكل؟ قارن الحجم وسُمك الخطوط.":{"شكل 1":"الإطار الرفيع هنا دائرة، والقاعدة تحيط الشكل بإطار من نوعه.","شكل 3":"الحلقة تحوّلت إلى نقطة مصمتة، والقاعدة لا تغيّر ما في الداخل.","شكل 4":"صغُر المربع، لكن الإطار الرفيع المحيط به غاب."},"في السلسلة الآتية (من اليمين) دائرة مقسومة ثمانية قطاعات، وبعضها مظلل. ما الشكل الرابع؟":{"شكل 1":"تقدمت البداية قطاعين لا قطاعاً واحداً.","شكل 2":"العدد صحيح، لكن بداية التظليل لم تتقدم وبقيت كما في الشكل الثالث.","شكل 3":"تقدمت البداية، لكن العدد بقي ثلاثة، والصحيح أن يزيد إلى أربعة."},"في كل إطار عقرب طويل وعقرب قصير ينتهي بنقطة، والسلسلة تُقرأ من اليمين. ما الإطار الخامس؟":{"شكل 1":"الطويل هنا دار ربع دورة، وخطوته في السلسلة ثُمن دورة.","شكل 2":"بدّل العقربين: الطويل مكانه الأسفل والقصير مكانه اليمين.","شكل 3":"القصير هنا دار مع عقارب الساعة، وهو في السلسلة يدور عكسها."},"الشكل الأول بالنسبة إلى الثاني مثل الثالث بالنسبة إلى أي شكل؟ عُدّ الأضلاع والنقاط.":{"شكل 2":"زادت النقاط، لكن الأضلاع بقيت خمسة، والقاعدة تُنقصها اثنين.","شكل 3":"نقصت الأضلاع صحيحاً، لكن النقاط بقيت اثنتين، والقاعدة تزيدها واحدة.","شكل 4":"زادت النقاط صحيحاً، لكن الأضلاع نقصت واحداً فقط، والقاعدة تُنقصها اثنين."},"الخط المتقطع على يمين الشكل مرآة رأسية. ما صورة الراية والنقطة في المرآة؟":{"شكل 1":"هذا انعكاس في مرآة أفقية قلب الأعلى أسفل.","شكل 3":"هذا الشكل بعد نصف دورة، فصعد العلم إلى الأعلى، والمرآة الرأسية لا تقلب الأعلى والأسفل.","شكل 4":"هذا الشكل بعد ربع دورة، فصارت السارية رأسية."},"الشكل الأول بالنسبة إلى الثاني مثل الثالث بالنسبة إلى أي شكل؟ انتبه إلى النصف المظلل وإلى الذراع القصيرة.":{"شكل 1":"هذا الشكل الثالث نفسه، ولم تنتقل الذراع.","شكل 2":"تحرّك التظليل وبقيت الذراع في مكانها، وهذا عكس القاعدة.","شكل 4":"الذراع انتقلت صحيحاً، لكن التظليل نزل إلى الأسفل، والقاعدة تُبقيه في مكانه."},"كم مثلثاً في الشكل الآتي: مثلث تخرج من رأسه خطوط إلى قاعدته، ويقطعه خطان أفقيان؟":{"6":"هذه مثلثات القاعدة وحدها، ولكل خط أفقي مثلثاته أيضاً.","9":"عدّ الأجزاء التسعة التي يقسم إليها الخطوطُ الشكلَ (3 × 3)، وأجزاء الطبقتين السفليين أشباه منحرفات لا مثلثات، وكل مثلث هنا رأسه الرأس العلوي.","12":"عدّ مثلثات خطين أفقيين فقط، ونسي الخط الثالث."},"أي الأشكال الآتية لا ينتمي إلى المجموعة؟ تتبّع نهايات الخطوط.":{"شكل 1":"كل خط هنا ينتهي عند الحدّ أو عند خط آخر، والتقاطع في وسطه لا يميّزه؛ فالمخت ي حجر النرد مجموع كل وجهين متقابلين 7. كم مجموع النقاط على الأوجه التي لا تظهر في الأحجار الثلاثة الآتية؟":{"21":"هذا مجموع أوجه حجر واحد كامل، والمطلوب المخفي في ثلاثة أحجار.","30":"هذا مجموع النقاط الظاهرة (30)، والمطلوب المخفية.","63":"هذا مجموع كل الأوجه في الأحجار الثلاثة، ظاهرها ومخفيها."},"في كل صف (من اليمين) خمسة أشكال، وكل صف ينتج من الذي فوقه بإعادة الترتيب نفسها. ما الصف الرابع؟":{"شكل 1":"هذا الصف الأول مكرراً، والقاعدة لا تعود إليه بعد ثلاث خطوات.","شكل 2":"طبّق القاعدة مرتين على الصف الثالث، والمطلوب مرة واحدة.","شكل 4":"طبّق الترتيب بالعكس على الصف الثالث فرجع إلى الصف الثاني نفسه، والمطلوب التقدم خطوة لا الرجوع."},"في المصفوفة الآتية دوائر فيها أسهم، والصفوف تُقرأ من اليمين. ما الدائرة الناقصة؟":{"شكل 1":"هذا عكس الاتجاه الصحيح تماماً، أي نصف دورة عنه.","شكل 3":"هذا سهم الخانة الوسطى في الصف الثالث، ولم يدُر الثُّمن الأخير.","شكل 4":"دار السهم ثُمنين بدل ثُمن واحد."},"أُعطي كل شكل في الصف الأعلى عدداً، والأعداد من اليمين: 6، 5، 7، 2، 3 بالترتيب. ثم أُعيد ترتيب الأشكال في الصف الأسفل، وكل شكل يحمل عدده معه. ما أعداد الصف الأسفل من اليمين؟":{"7، 5، 2، 3، 6":"بدّل عددي المسدس والمعيّن، والمسدس عدده 3 والمعيّن 2.","6، 5، 7، 2، 3":"هذه أعداد الصف الأعلى بترتيبها، ولم تنتقل مع أشكالها.","6، 2، 3، 5، 7":"هذه الأعداد الصحيحة مقروءة من اليسار لا من اليمين."},"في المصفوفة الآتية (الصفوف من اليمين) يتكرر كل شكل خارجي وكل علامة داخلية بنظام. ما الشكل الناقص؟":{"شكل 1":"الشكل الخارجي صحيح، لكن نقطة موجودة في الصف الثالث أو العمود الثالث.","شكل 2":"العلامة صحيحة، لكن الدائرة موجودة في الصف الثالث والعمود الثالث.","شكل 3":"الشكل الخارجي صحيح، لكن علامة + موجودة في الصف الثالث أو العمود الثالث."},"تُركَّب البطاقتان خانةً بخانة بهذه القواعد: نقطة مع نقطة = حلقة، ونقطة مع حلقة = فراغ، وحلقة مع حلقة = نقطة، والفراغ مع أي شيء = الشيء نفسه. ما البطاقة الناتجة من تركيب البطاقتين؟":{"شكل 1":"هذه البطاقة الأولى وقد مُلئ فراغها من الثانية، دون تطبيق قواعد التركيب.","شكل 2":"الخانات صحيحة لكن العمودين تبادلا، فالخانة اليمنى مكانها يسار.","شكل 4":"استعمل قواعد غير المعطاة: جع // اختبار كامل مجاني (2026-10-21): أسئلة غير أسئلة البنك المجاني وغير التشخيصي، موزعة بأوزان المجالات — حتى تكون الدرجة حقيقية
function free60Ids(){const ds=new Set(DIAG), pool=QS.filter(q=>!q.h&&!q.m&&!q.of&&!q.z&&!ds.has(q.id)); /* z = أُضيف بعد تثبيت الاختبار المصغّر (2026-10-31)، فلا يغيّر أسئلته */ const tw=DORDER.reduce((a,d)=>a+(DOM[d].w||1),0); let out=[];
  DORDER.forEach((d,i)=>{const want=i===DORDER.length-1?FREE_N-out.length:Math.round(FREE_N*(DOM[d].w||1)/tw); out=out.concat(shuffle(pool.filter(q=>q.d===d).map(q=>q.id),9100+i).slice(0,want))});
  if(out.length<FREE_N) out=out.concat(shuffle(pool.filter(q=>!out.includes(q.id)).map(q=>q.id),9199).slice(0,FREE_N-out.length)); return shuffle(out,9200)}
const BANK_LABEL=(window.__PWCFG&&__PWCFG.bank&&__PWCFG.bank.label)||"أسئلة من الاختبارات الماضية (مماثلة)"; /* النسخة المدفوعة بلا __PWCFG فكانت تعرض الاسم القديم «مشابهة» (أُصلح 2026-10-28) */

async function pushRemote(){

async function pullRemote(){

      else if((S.updatedAt||0)>(r&&r.updatedAt||0)) pushRemote();}

/* ترتيب الدروس في الخطة: حسب الوزن والصعوبة، لا حسب رقم المعيار */
/* قدرات الجامعيين: الدروس بترتيب الخريطة المعتمدة (لفظي ← كمي ← ناقد ← منطق ← أشكال ← يوم الاختبار) */ const PLAN_ORDER = LORDER;
function planTasks(){
  return [{id:"diag",type:"test",t:"الاختبار التشخيصي",s:"40 سؤالاً من كل المجالات، يبيّن لك أين تحتاج المذاكرة، ويحيلك إلى الدروس"}]
    .concat(PLAN_ORDER.filter(id=>LBY[id]).map(id=>{const l=LBY[id];return {id:l.id,type:"lesson",t:l.ar,s:DOM[l.d].ar,d:l.d}}))
    .concat([
      ...MOCK_KEYS.flatMap((k,i)=>[{id:k,type:"test",t:"الاختبار المحاكي "+(i+1),s:i===0?"120 سؤالاً · ساعتان وخمس دقائق":i===NMOCK-1?"آخر محاكاة قبل الاختبار، وأسئلته من المصادر الأقدم":"120 سؤالاً جديداً"}]
        .concat(i<NMOCK-1?[{id:"rev"+(i+1),type:"review",t:"مراجعة أخطاء المحاكي "+(i+1),s:"الأخطاء + أضعف مجالين"}]:[]))
    ]);   /* قدرات الجامعيين: عدد المحاكيات من البيانات، وبلا «خلاصة الفخاخ» (لا فخاخ مكتوبة في الدروس؛ خطة يوم الاختبار درس Z01) */
}
function taskDone(t){
  if(t.type==="lesson") return !!(S.lessons[t.id]&&S.lessons[t.id].done);
  if(t.type==="test") return !!S.tests[t.id];
  return !!S.tasks[t.id];
}
/* الخطة بالأيام (يوسف 2026-11-08ج): بلا تواريخ ولا ربط بموعد الاختبار. عدد الأيام يختاره الزائر 1–60 (الافتراضي 21) ويُحفظ في جهازه S.planDays.
   المهام بنفس ترتيبها دائماً، فتقدم المشترك (الدروس والاختبارات المنجزة) يتحول لأيام بنفس الترتيب بلا ضياع. «اليوم الحالي» = يوم أول مهمة غير منجزة */
const PLAN_DEF = 21;
function planDays(){let n=Math.round(+S.planDays); if(!(n>=1&&n<=60)){n=PLAN_DEF; if(S.exam){const sp=diffDays(S.start,S.exam); if(sp>=7&&sp<=60&&diffDays(todayStr(),S.exam)>0) n=sp} S.planDays=n} return n}
const daysTxt=n=>n===1?"يوم واحد":n===2?"يومين":`${AR(n)} ${n<=10?"أيام":"يوماً"}`;
function buildPlan(){
  const tasks=planTasks(), N=planDays(); let days=[];
  if(N>=tasks.length){
    days = tasks.map(t=>[t]);
    for(let i=0;i<N-tasks.length;i++) days.splice(days.length-6,0,[{id:"buf"+i,type:"review",t:"يوم مراجعة",s:"مراجعة الأخطاء + البطاقات المستحقة + 20 سؤالاً سريعاً"}]);
  } else {
    // تقسيم متوازن بالترتيب: الدرس والاختبار وزن 1، والمراجعة والخلاصة والدليل نصف
    const w=t=>t.type==="review"||t.type==="final"||t.id==="official"?0.5:1; let rest=tasks.slice();
    for(let d=0;d<N;d++){const left=N-d; if(left===1){days.push(rest);break}
      const tgt=rest.reduce((a,t)=>a+w(t),0)/left, day=[]; let sum=0;
      while(rest.length>left-1&&(!day.length||sum+w(rest[0])/2<=tgt)){sum+=w(rest[0]);day.push(rest.shift())}
      days.push(day)}
  }
  return days.filter(d=>d.length).map((ts,i)=>({n:i+1,tasks:ts}));
}
function planDayOf(plan){const nt=nextTask(); if(!nt) return plan.length-1; const i=plan.findIndex(d=>d.tasks.some(t=>t.id===nt.id)); return i<0?0:i}
function planIntro(plan){
  const maxL=Math.max(...plan.map(d=>d.tasks.filter(t=>t.type==="lesson").length)), hrs=Math.max(1,Math.round(maxL*2));
  return maxL>1?`في بعض أيامها ${maxL===2?"درسان":AR(maxL)+" "+(maxL<=10?"دروس":"درساً")}، يعني قرابة ${hrs===2?"ساعتين":AR(hrs)+" "+(hrs<=10?"ساعات":"ساعة")} يومياً. تقدر تزيد عدد الأيام ليخف اليوم.`
    :"ساعتان يومياً تقريباً: الدرس (40–50 دقيقة) + فيديو + اختبار الدرس + 20 سؤالاً من مراجعة الأخطاء. الدروس مرتبة بالوزن والصعوبة: التقويم ثم المتعلم ثم التخطيط، والكمي واللغوي في الأخير لأنهما مهارة لا حفظ.";
}
function planRows(plan){const pd=planDayOf(plan);
  return plan.map((d,i)=>{const all=d.tasks.every(taskDone);
      return `<button class="day ${i===pd?"is-today":""}" data-open-task="${d.tasks.find(t=>!taskDone(t))?.id||d.tasks[0].id}">
        <div class="dn"><span>اليوم</span><b>${AR(d.n)}</b></div>
        <div class="what">${d.tasks.map(t=>`<div class="t">${esc(t.t)}${window.PW&&((t.type==="lesson"&&PW.locked(t.id))||/^(mock|rev)\d|^final$/.test(t.id))?PW.lockIcon:""}${t.d?` <span class="chip"><span class="dot" style="background:var(--d${t.d})"></span>${DOM[t.d].ar}</span>`:""}</div><div class="s">${esc(t.s)}</div>`).join("")}</div>
        <span class="bub ${all?"on":""}" aria-label="${all?"منجز":"غير منجز"}"></span></button>`}).join("")
    +`<button class="day" data-go="sheet"><div class="dn"><span>بعدها</span></div><div class="what"><div class="t">يوم الاختبار</div><div class="s">نصائح الدخول وإدارة الوقت في خلاصة الفخاخ</div></div><span class="bub"></span></button>`;
}
function setPlanDays(n){n=Math.max(1,Math.min(60,Math.round(+n)||PLAN_DEF)); if(n===S.planDays&&document.getElementById("pdOut")) return; S.planDays=n; save();

function tickTimer(){

function finishSession(){
  const s=session; if(!s||s.done) return; if(s.kind==="bank"){try{localStorage.removeItem("bankpos."+SITE_ID)}catch(e){}}
  stopTimer(); s.done=true; if(s.ref==="diag"&&window.QXEV)QXEV("finish_diag"); if(s.ref==="free60")QXEV("finish_free60"); if(s.kind==="bank"){QXEV("finish_bank"); try{if(!localStorage.getItem("qx.fin60."+SITE_ID)){localStorage.setItem("qx.fin60."+SITE_ID,"1");QXEV("finish_bank_u")}}catch(e){}}  /* finish_bank_u: مرة لكل جهاز، للعدّاد الحقيقي */
  let cor=0; const byD={}, byS={};
  s.ids.forEach(id=>{const q=QBY[id], a=s.ans[id], ok=a===q.a; if(ok)cor++;
    byD[q.d]=byD[q.d]||{c:0,n:0}; byD[q.d].n++; if(ok)byD[q.d].c++;
    byS[q.std]=byS[q.std]||{c:0,n:0}; byS[q.std].n++; if(ok)byS[q.std].c++;

/* خلاصة الفخاخ (طلب يوسف 2026-10-22): 60 فخاً لا كل الفخاخ — حصة كل درس بوزن معياره (فخ واحد على الأقل)، من أول فخاخه */
const SHEET_N=60;
const SHEET=(function(){const ls=LESSONS.filter(l=>l.trap&&l.trap.length), w=l=>(STDW[l.std]||1)/LESSONS.filter(x=>x.std===l.std).length;
  const tw=ls.reduce((a,l)=>a+w(l),0); const q=ls.map(l=>Math.min(l.trap.length,Math.max(1,Math.floor(SHEET_N*w(l)/tw))));
  let left=SHEET_N-q.reduce((a,b)=>a+b,0); while(left<0){const i=q.indexOf(Math.max(...q)); q[i]--; left++}
  const ord=ls.map((l,i)=>i).sort((x,y)=>w(ls[y])-w(ls[x])); while(left>0){let moved=false; for(const i of ord){if(left>0&&q[i]<ls[i].trap.length){q[i]++;left--;moved=true}} if(!moved)break}
  return Object.fromEntries(ls.map((l,i)=>[l.id,l.trap.slice(0,q[i])]));})();

  const lines=["تقرير مذاكرة قدرات الجامعيين — "+todayStr(),
   "الدروس المنجزة: "+LESSONS.filter(l=>S.lessons[l.id]&&S.lessons[l.id].done).length+"/"+LESSONS.length,
   "الإجابات: "+att+" · الدقة: "+pct(cor,att)+"%",
   "الاختبارات: "+Object.entries(S.tests).map(([k,v])=>k+"="+v.score+"%").join(" ، "),
   "المجالات:"].concat(SORDER.map(sd=>{const s=stdStats(sd);return "  "+STDS[sd]+": إتقان "+pct(s.mast,s.total)+"% · دقة "+s.acc+"% · محاولات "+s.att}));

}
