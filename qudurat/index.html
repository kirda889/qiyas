/* Layout: a teacher's planning register — chalk-green ink on cool off-white, a brass highlight for key terms, bubble answer sheet for exams. Fully RTL. */
:root{

}

  --paper:#0F1512; --sheet:#171F1B; --ink:#E6ECE8; --muted:#B3C0BA; --rule:#27332D; --rule-strong:#36453E;
  --accent:#5BC093; --accent-ink:#062116; --accent-soft:#17312A; --accent-text:#5BC093;
  --hl:#5A4A1C; --hl-ink:#FFF0C2;
  --good:#5CC48D; --good-soft:#15301F; --bad:#F2867A; --bad-soft:#3A1A17; --warn:#E3A84A;
  --dV:#E0A54C; --dQ:#5BC093; --dR:#7FA6E8; --dF:#E08AB4; --dZ:#A7ABA3;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F1512; --sheet:#171F1B; --ink:#E6ECE8; --muted:#B3C0BA; --rule:#27332D; --rule-strong:#36453E;
  --accent:#5BC093; --accent-ink:#062116; --accent-soft:#17312A; --accent-text:#5BC093;
  --hl:#5A4A1C; --hl-ink:#FFF0C2;
  --good:#5CC48D; --good-soft:#15301F; --bad:#F2867A; --bad-soft:#3A1A17; --warn:#E3A84A;
  --dV:#E0A54C; --dQ:#5BC093; --dR:#7FA6E8; --dF:#E08AB4; --dZ:#A7ABA3;

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
#app{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
strong{font-weight:600;background:linear-gradient(transparent 60%,var(--hl) 60%);padding:0 .08em}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.5;text-wrap:balance;margin:0}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);margin-inline:-16px;padding:10px 16px}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .seal{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.95rem;flex:none}
.brand b{font-family:var(--f-display);font-weight:600;font-size:1rem;white-space:nowrap}
.brand span{display:block;font-size:.74rem;color:var(--muted);line-height:1.3;white-space:nowrap}
.count{margin-inline-start:auto;text-align:center;line-height:1.1}
.count .n{font-family:var(--f-mono);font-size:1.25rem;font-weight:700;color:var(--accent-text,var(--accent))}
.count .l{font-size:.78rem;color:var(--muted)}
.nav{display:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar:empty{min-height:calc(67px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:4px 0;border-radius:8px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
@media (min-width:760px){
  .tabbar{display:none}
  .nav{display:flex;gap:4px;margin-inline-start:18px}
  .nav button{background:none;border:0;padding:6px 12px;border-radius:999px;color:var(--muted);font-size:.92rem}
  .nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #app{padding-bottom:60px}
}

/* sheets & cards */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.section-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.section-title h2{font-size:1.08rem}
.section-title .line{flex:1;height:1px;background:var(--rule-strong)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 20px;font-weight:600;font-size:.95rem;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--rule-strong);color:var(--ink);font-weight:500}
.btn.sm{padding:6px 14px;min-height:36px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.76rem;border:1px solid var(--rule-strong);color:var(--muted);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.done{border-color:var(--good);color:var(--good)}
.chip.hot{border-color:var(--warn);color:var(--warn)}
.code{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);direction:ltr;unicode-bidi:isolate}

/* home */
.today{display:grid;gap:14px}
.today .kicker{font-size:.8rem;color:var(--muted)}
.today h1{font-size:1.4rem}
.domains{display:grid;gap:10px}
.dom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.dom .name{display:flex;gap:8px;align-items:center;min-width:0}
.dom .name b{font-weight:600;font-size:.95rem}
.dom .w{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:10px;border-radius:999px;background:var(--rule);overflow:hidden;position:relative}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--f-mono);font-size:1.45rem;font-weight:600;line-height:1.2}
.stat .k{font-size:.8rem;color:var(--muted)}
.set-date{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.set-date input{border:1px solid var(--rule-strong);background:var(--paper);border-radius:8px;padding:8px 10px;min-height:44px}
.stdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stdc{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;display:grid;gap:4px;text-align:start}
.stdc .sn{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between}
.stdc .st{font-weight:600;font-size:.86rem;line-height:1.5}
.stdc .bar{height:6px}

.tfold{margin:10px 0 2px}.tfold>summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center;font-size:.86rem;font-weight:700;color:var(--accent);border:1px solid var(--rule);border-radius:999px;padding:4px 12px}.tfold>summary::-webkit-details-marker{display:none}.tfold>summary::after{content:"＋";font-weight:400}.tfold[open]>summary::after{content:"－"}.tfold[open] .terms{margin-top:10px}
/* plan */
.plan{display:grid;gap:8px}
.day{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.day .dn{font-family:var(--f-mono);text-align:center;line-height:1.1}
.day .dn b{display:block;font-size:1.15rem}
.day .dn span{font-size:.68rem;color:var(--muted)}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day .what{min-width:0}
.day .what .t{font-weight:600}
.day .what .s{font-size:.82rem;color:var(--muted)}
.day.light{opacity:.85}
.bub{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;flex:none}
.bub.on{background:var(--good);border-color:var(--good)}
.bub.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sheet)}

/* lessons list */
.lgroup{display:grid;gap:8px}
.lcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;text-align:start;width:100%}
.lcard .idx{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);width:34px;text-align:center}
.lcard .t{font-weight:600;line-height:1.5}
.lcard .s{font-size:.82rem;color:var(--muted)}
.dhead{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.dhead .sw{width:12px;height:12px;border-radius:3px}
.dhead h2{font-size:1.05rem}
.dhead .w{margin-inline-start:auto;font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}

/* lesson view */
.lesson-head{display:grid;gap:8px;padding-top:18px}
.goal{border-inline-start:3px solid var(--accent);padding-inline-start:12px}
.qv-tog{display:flex;gap:4px;border-radius:999px;padding:4px;margin:12px 0 2px;background:color-mix(in srgb,var(--accent) 9%,transparent)}.qv-tog button{flex:1;border:0;background:none;border-radius:999px;padding:8px 0;font:inherit;font-size:.9rem;color:var(--muted);cursor:pointer}.qv-tog button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}.qv-more{display:block;width:100%;margin:6px 0 0;padding:11px;border:1px dashed var(--rule);border-radius:14px;background:none;font:inherit;color:var(--accent-text);font-weight:700;cursor:pointer}
.lsec{display:grid;gap:10px;padding:18px 0;border-bottom:1px solid var(--rule)}
.lsec:last-of-type{border-bottom:0}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pts li{border-inline-start:3px solid var(--rule-strong);padding-inline-start:10px;line-height:1.8}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.term{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;min-width:0}
.term .tn{font-weight:600;font-size:.95rem}
.term .td{font-size:.86rem;color:var(--muted);line-height:1.7}
.traps{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:var(--r);padding:14px 16px}
.traps h3{color:var(--bad);margin-bottom:6px}
.traps ul{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.vids{display:grid;gap:8px}
.vid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-decoration:none;color:inherit}
.vid .play{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.vid .vt{font-weight:500;line-height:1.5}
.vid .vc{font-size:.8rem;color:var(--muted)}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;padding:12px 0}
.progress{flex:1;height:6px;background:var(--rule);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;min-width:64px;text-align:center;direction:ltr}
.timer.low{color:var(--bad)}
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qtext{font-size:1.06rem;line-height:1.9;font-weight:500;white-space:pre-line}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:start;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:.98rem;line-height:1.6;min-height:48px;width:100%}
.opt .b{width:28px;height:28px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;font-family:var(--f-display);font-size:.85rem;font-weight:600;color:var(--muted);flex:none}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .b{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .b{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt:disabled{cursor:default}
.opt .why{display:block;margin-top:5px;font-size:.84rem;line-height:1.6;color:var(--muted)}
.opt.wrong .why{color:var(--ink)}
.why-r{margin:4px 0 2px;color:var(--ink)}.why-r b{color:var(--bad);display:inline}
.explain{margin-top:14px;border-radius:10px;padding:12px 14px;border:1px solid var(--rule)}
.explain.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.explain.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.explain b{display:block;margin-bottom:2px}
.mm{font-weight:400;font-size:.8em;opacity:.85}
.qreply{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);border-inline-start:3px solid var(--accent);font-size:.92em;line-height:1.7}
.qreply b{display:block;margin-bottom:2px}.qreply b span{font-weight:400;color:var(--muted)}
.qnav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.grid88{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.gq{height:34px;border-radius:50%;border:1.5px solid var(--rule-strong);background:var(--sheet);font-family:var(--f-mono);font-size:.72rem;color:var(--muted);padding:0}
.gq.ans{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.gq.cur{outline:2px solid var(--accent);outline-offset:2px}
.gq.flag{border-color:var(--warn);border-width:3px}
.confirm{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px}

/* results */
.score{display:flex;align-items:baseline;gap:10px}
.score .big{font-family:var(--f-mono);font-size:3rem;font-weight:600;line-height:1}
.rlist{display:grid;gap:10px}
.ritem{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.ritem .qtext{font-size:.95rem}
.ans-line{font-size:.9rem}
.ans-line .y{color:var(--bad);text-decoration:line-through}
.ans-line .c{color:var(--good);font-weight:600}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.mode{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px;text-align:start;display:grid;gap:6px;align-content:start;width:100%}
.mode .mt{font-family:var(--f-display);font-weight:600;font-size:1rem}
.mode .md{font-size:.85rem;color:var(--muted);line-height:1.7}
.mode .mx{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:.85rem;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* flashcards */
.fc{perspective:1200px}
.fc-in{position:relative;min-height:220px;border-radius:14px;border:1px solid var(--rule);background:var(--sheet);box-shadow:var(--shadow);display:grid;place-items:center;padding:24px;text-align:center;cursor:pointer;width:100%}
.fc-front{font-family:var(--f-display);font-size:1.45rem;font-weight:600;line-height:1.5}
.fc-back{font-size:1.08rem;line-height:1.9}
.fc-hint{position:absolute;bottom:10px;inset-inline:0;font-size:.75rem;color:var(--muted)}

/* sheet (night-before) */
.hy{display:grid;gap:14px}
.hy-l{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 16px}
.hy-l h3{font-size:.98rem;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.hy-l ul{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:.93rem}
.tips{display:grid;gap:8px;counter-reset:t}
.tip{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.tip::before{counter-increment:t;content:counter(t);font-family:var(--f-mono);font-weight:600;width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:.8rem}

.sync{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--rule-strong)}

ربعة الأخرى»."],["C01","","في دراسة «إضاءة الفصل»: المتغيّر التابع في الدراسة:",["درجات الطلاب في اختبار الانتباه","لون إضاءة الفصل","عدد الفصول في الدراسة","مدة الأسبوعين قبل الاختبار"],"التابع ما قاسته الباحثة في النهاية: درجات اختبار الانتباه."],["C01","","في دراسة «إضاءة الفصل»: لتعرف المتغيّر المستقل في أي دراسة، تسأل:",["ما الذي غيّره الباحث بين المجموعتين؟","ما الذي قاسه الباحث في نهاية الدراسة؟","ما النتيجة التي وصل إليها الباحث؟","كم عدد أفراد العيّنة في الدراسة؟"],"المستقل يُغيَّر بين المجموعتين، والتابع يُقاس في النهاية."],["C01","","في دراسة «إضاءة الفصل»: أدقّ تلخيص لسطر «فكانت درجات فصول الإضاءة البيضاء أعلى قليلاً»:",["نتيجة الدراسة: فرق صغير لصالح الإضاءة البيضاء","الإضاءة البيضاء تضاعف تركيز الطلاب في الفصل","فرضية الباحثة قبل إجراء الدراسة","المتغيّر الذي قاسته الباحثة"],"السطر يعطي قيمة المقيس بعد الدراسة، فهو نتيجتها، و«قليلاً» تعني أن الفرق صغير."],["F01","","أي الأشكال يملأ الخانة الناقصة في السلسلة؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"العدد: الخطوط تزيد واحداً في كل إطار: 1، ثم 2، ثم 3، ثم الناقص، ثم 5. فالناقص 4 خطوط."],["F01","","النقطة تتحرك في السلسلة. أي الأشكال هو التالي؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"الموضع: النقطة تنتقل زاوية واحدة عكس عقارب الساعة. بعد أسفل اليمين تأتي أعلى اليمين، ثم أعلى اليسار، وهي الخانة الناقصة."],["F01","","الراية تدور في السلسلة. ما الشكل الخامس؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"الدوران: الراية تدور ثُمن دورة (45 درجة) مع عقارب الساعة في كل إطار. فالخامس بعد 135 درجة: 180 درجة، أي مقلوبة رأساً على عقب."],["F01","","أي الأشكال يأتي في الخانة الناقصة من سلسلة المثلثات؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"التظليل: النمط يتكرر كل ثلاثة: مفرغ، ثم مصمت، ثم مصمت. والسادس ثالث الدورة الثانية، فهو مصمت، والسابع بعده مفرغ يبدأ الدورة الثالثة."],["F01","","في السلسلة عنصران يتغيران معاً. أي الأشكال يملأ الخانة الناقصة؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"عنصران: الراية تدور ثُمن دورة عكس عقارب الساعة، والخطوط تنقص واحداً. فالرابع: الراية بعد ثلاثة أثمان عكس العقارب، وخطّان."],["F01","","أي الأشكال يكمل السلسلة في وسطها؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"الانعكاس: الراية تنعكس في كل إطار، فتتناوب بين العلم يميناً والعلم يساراً. والثالث مثل الأول."],["F01","","علامتان تتبادلان موضعيهما، والشكل الأوسط يتغيّر. ما الشكل التالي؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"التبديل: النقطة والحلقة تتبادلان الزاويتين السفليين في كل إطار، والشكل الأوسط يدور: دائرة، ثم مربع، ثم مثلث. فالخامس: النقطة أسفل اليمين، والحلقة أسفل اليسار، والشكل مربع."],["F01","","ما الشكل الخامس في سلسلة الخطوط والحلقة؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"عنصران: الخطوط تزيد واحداً (2، 3، 4، 5)، والحلقة تنتقل زاوية عكس عقارب الساعة. فالخامس: ستة خطوط، والحلقة أعلى اليسار."],["F01","","الطريقة الصحيحة في سلسلة أشكال يتغيّر فيها أكثر من عنصر:",["أفحص كل عنصر وحده بقائمة الفحص، ثم أجمع ما وجدت","أتتبّع العنصر الأوضح وحده وأهمل الباقي","أختار الخيار الأقرب شبهاً بالإطار الأخير","أعدّ العناصر في كل إطار وأختار بالعدد"],"لكل عنصر قاعدته: العدد أو الموضع أو الدوران أو الانعكاس أو التظليل أو التبديل. فتتبّع كل عنصر وحده، ثم اجمع الحكمين في شكل واحد."],["F01","","الراية تدور والحلقة تتحرك. أي الأشكال يملأ الخانة الثانية؟",["شكل 1","شكل 2","شكل 3","شكل 4"],"عنصران: الراية تدور ربع دورة عكس عقارب الساعة، والحلقة تنتقل زاوية مع عقارب الساعة. فالثاني: الراية إلى اليسار بعد ربع دورة عكس العقارب، والحلقة أعلى اليمين."],["L01","","ثلاث سيارات في سباق: الحمراء أسرع من البيضاء، والسوداء أبطأ من البيضاء. أي العبارات صحيحة حتماً؟",["الحمراء أسرع من السوداء","السوداء أسرع من الحمراء","البيضاء أسرع من الحمراء","السوداء أسرع من البيضاء"],"نرتّب من الأسرع: الحمراء ثم البيضاء ثم السوداء. فالحمراء أسرع من السوداء حتماً."],["L01","","نايف أطول من بدر، وماجد أقصر من نايف. أي العبارات صحيحة حتماً؟",["لا يمكن معرفة الأطول بين بدر وماجد","بدر أطول من ماجد","ماجد أطول من بدر","بدر وماجد متساويان في الطول"],"نايف أطول من الاثنين، ولا معلومة تقارن بدراً بماجد. فقد يكون أحدهما أطول، وقد يتساويان، والجواب: لا يمكن معرفته."],["L01","","أول خطوة في حل سؤال الترتيب أو الجلوس:",["البدء بالمعلومة التي تحدد موقعاً بعينه","تجربة الخيارات واحداً بعد الآخر","رسم الأسماء بترتيب ذكرها في السؤال","البدء بأطول معلومة في السؤال"],"المعلومة الثابتة (أقصى اليمين، الطابق الأعلى، الثالث من اليسار) تثبّت مكاناً تُبنى عليه بقية المعلومات."],["L01","","خمسة عدّائين: وصل سلطان بعد عمر وقبل فارس، ووصل زياد قبل عمر، ووصل مشاري بعد فارس. من وصل رابعاً؟",["فارس","عمر","سلطان","مشاري"],"الترتيب من الأول: زياد ثم عمر ثم سلطان ثم فارس ثم مشاري. فالرابع فارس."],["L01","","يجلس خمسة طلاب في صف واحد، ونعدّ من اليمين: هاني في أقصى اليمين، ونادر في أقصى اليسار، وسامي بجوار هاني مباشرة، وفيصل بجوار نادر مباشرة، وخالد بين هاني ونادر. من يجلس في الوسط؟",["خالد","سامي","فيصل","لا يمكن معرفته"],"من اليمين: هاني ثم سامي، ومن اليسار: نادر ثم فيصل. يبقى المقعد الثالث لخالد، وهو «بين» هاني ونادر دون أن يجاورهما."],["L01","","أربعة أصدقاء حول طاولة مستديرة ووجوههم إلى وسطها: أحمد يقابل بدراً، وجاسم على يمين أحمد، وداود هو الرابع. من يجلس على يمين بدر؟",["داود","جاسم","أحمد","لا يمكن معرفته"],"جاسم بجوار أحمد من يمينه، فداود بجوار أحمد من يساره. وبدر يقابل أحمد، فيمين بدر هو الجهة التي فيها يسار أحمد، أي داود."],["L01","","سارة أكبر من هند، وليلى أكبر من هند. أي العبارات صحيحة حتماً؟",["هند أصغر الثلاث","سارة أكبر من ليلى","ليلى أكبر من سارة","سارة وليلى مختلفتان في العمر"],"هند أصغر من سارة ومن ليلى، فهي الصغرى حتماً. أما سارة وليلى فلا معلومة تقارن بينهما، وقد تتساويان."],["L01","","ستة أشخاص حول طاولة مستديرة بمسافات متساوية ووجوههم إلى وسطها: سعد يقابل نواف، وفهد على يمين سعد مباشرة، وعلي على يمين نواف مباشرة، وماجد على يسار نواف مباشرة، ويزيد هو السادس. من يجاور سعداً وعلياً معاً؟",["يزيد","فهد","ماجد","لا يمكن معرفته"],"نثبّت سعداً ونواف متقابلين. فهد يمين سعد، وعلي يمين نواف وماجد يساره. يبقى مقعد واحد: يسار سعد، وهو أيضاً بجوار علي، وفيه يزيد."],["L01","","خمسة كتب على رف مرتبة من اليسار إلى اليمين، و«قبل» تعني إلى اليسار: الفقه قبل التاريخ، والتاريخ قبل النحو، والأدب بعد النحو، وكتاب العلوم ليس في أقصى اليمين. أي العبارات صحيحة حتماً؟",["الأدب في أقصى اليمين","العلوم في أقصى اليسار","التاريخ في المنتصف","الفقه بجوار التاريخ"],"الفقه ثم التاريخ ثم النحو ثم الأدب بهذا الترتيب، والعلوم يدخل في أي مكان قبل الأدب. فالأخير هو الأدب حتماً، والبقية ممكنة لا حتمية."],["L01","","مبنى من ستة طوابق، في كل طابق ساكن واحد: ناصر في الطابق الأعلى، ورائد تحت ناصر بثلاثة طوابق، وطلال فوق رائد مباشرة، وبندر في الطابق الأول، وكريم فوق بندر مباشرة، وهشام هو الساكن السادس. في أي طابق يسكن هشام؟",["الخامس","الثاني","الرابع","الثالث"],"نعدّ من الأسفل: بندر في الأول، وكريم في الثاني، ورائد في ⁦6 − 3 = 3⁩ الثالث، وطلال في الرابع، وناصر في السادس. يبقى الخامس لهشام."],["L04","","الأعداد بترتيب أعلى ثم يسار ثم يمين: 3، 5، 6 والوسط 14. ثم 7، 2، 4 والوسط 13. ما وسط 9، 4، 8؟",["21","288","28","41"],"العملية: المجموع. ⁦3 + 5 + 6 = 14⁩، ثم ⁦7 + 2 + 4 = 13⁩، فالناقص ⁦9 + 4 + 8 = 21⁩."],["L04","","الأعداد بترتيب أعلى ثم يسار ثم يمين: 9، 4، 3 والوسط 15. ثم 7، 5، 6 والوسط 12. ما وسط 10، 3، 2؟",["14","15","11","28"],"العملية: (أعلى − يسار) × يمين. ⁦(9 − 4) × 3 = 15⁩، ثم ⁦(7 − 5) × 6 = 12⁩، فالناقص ⁦(10 − 3) × 2 = 14⁩."],["L06","","الطريقة الصحيحة لتعرف أن الخيار لا يلزم من المقدمتين:",["أرسم حالة تصحّ فيها المقدمتان ويخطأ الخيار","أسأل: هل الخيار صحيح في الواقع؟","أقلب «كل» في المقدمة ثم أحكم على الخيار","أختار الخيار الذي فيه كلمة «بعض»"],"«يلزم» يعني يصحّ في كل حالة تسمح بها المقدمتان. فإن وجدت حالة واحدة تخالفه، فلا يلزم."],["Q01","","⁦64 × 5⁩ = ؟",["320","640","32","3,200"],"اضرب في 10 ثم اقسم على 2: ⁦64 × 10 = 640⁩، ثم ⁦640 ÷ 2 = 320⁩."],["Q01","","⁦57 × 11⁩ = ؟",["627","527","5,127","617"],"ضع مجموع الرقمين بينهما: ⁦5 + 7 = 12⁩، فنضع 2 في الوسط، ونضيف 1 إلى الرقم الأول فيصير 6: الناتج 627."],["Q01","","⁦23 × 17⁩ = ؟",["391","409","397","381"],"الوسط 20، والبعد 3: ⁦20 × 20 − 3 × 3 = 400 − 9 = 391⁩."],["Q01","","⁦1,260 ÷ 35⁩ = ؟",["36","360","42","34"],"بسّط بالقسمة على 5: ⁦1260 ÷ 5 = 252⁩، ثم ⁦35 ÷ 5 = 7⁩، ثم ⁦252 ÷ 7 = 36⁩."],["Q01","","أي الأعداد التالية يقبل القسمة على 9؟",["5,814","2,814","4,512","7,345"],"مجموع أرقامه ⁦5 + 8 + 1 + 4 = 18⁩، والعدد 18 يقبل القسمة على 9."],["Q01","","⁦−6 − (−9)⁩ = ؟",["3","⁦−15⁩","15","⁦−3⁩"],"طرح السالب جمع: ⁦−6 − (−9) = −6 + 9 = 3⁩."],["Q01","","⁦(−2) × (−5) × (−3) × 2⁩ = ؟",["⁦−60⁩","60","⁦−30⁩","30"],"عدّ السوالب: ثلاثة، والعدد فردي، فالناتج سالب. والقيمة ⁦2 × 5 × 3 × 2 = 60⁩."],["Q01","","⁦|4 − 11| − |−3| × 2⁩ = ؟",["1","8","9","13"],"داخل الأولى أولاً: ⁦4 − 11 = −7⁩، فالقيمة المطلقة 7. والثانية 3. ثم الضرب قبل الطرح: ⁦7 − 3 × 2 = 7 − 6 = 1⁩."],["Q01","","الطريقة الصحيحة في سؤال ضرب خياراته متقاربة، مثل: 2,184، 2,186، 2,188:",["أحسب آخر رقم في الناتج، فهو يحسم بينها","أقرّب العددين إلى العشرات وأختار الأقرب","أختار الخيار الأوسط بين الخيارات","أطرح أصغر خيار من أكبرها ثم أقرّر"],"الخيارات المتقاربة لا يفرّق بينها التقريب، لكن آخر رقم يختلف في كل خيار، وحسابه أسرع خطوة."],["Q01","","أي الأعداد التالية أصغر؟",["⁦−|−14|⁩","⁦−(−20)⁩","⁦−11⁩","⁦|−17|⁩"],"القيم على الترتيب: ⁦−14⁩، ⁦20⁩، ⁦−11⁩، ⁦17⁩. وأصغرها الأبعد عن الصفر من جهة السالب: ⁦−14⁩، لأن الإشارة خارج القيمة المطلقة تبقى."],["V01","","جَمَل : صحراء",["سمكة : بحر","ماء : عطش","شبكة : صيّاد","ملح : طعام"],"جملة الربط: «الجمل حيوان يعيش في الصحراء»، وتصحّ بالترتيب نفسه مع «السمكة حيوان يعيش في البحر»."],["V01","","عسل : حلاوة",["ليمون : حموضة","حرارة : نار","صيف : شتاء","سكر : قهوة"],"جملة الربط: «العسل صفته اللازمة الحلاوة»، وتصحّ بالترتيب نفسه مع «الليمون صفته اللازمة الحموضة»."],["V01","","كتاب : فصل",["قصيدة : بيت","مكتبة : قارئ","صفحة : مجلّد","مؤلّف : رواية"],"جملة الربط: «الكتاب يتكوّن من فصول»، وتصحّ بالترتيب نفسه مع «القصيدة تتكوّن من أبيات»."],["V01","","نحّال : عسل",["خبّاز : خبز","نحلة : زهرة","طبيب : مريض","عسل : شمع"],"جملة الربط: «النحّال صاحب مهنة، والعسل ناتج مهنته»، وتصحّ بالترتيب نفسه مع «الخبّاز صاحب مهنة، والخبز ناتج مهنته». (والنحل يصنع العسل، لكنه ناتج مهنة النحّال.)"],["V01","","مزارع : حقل",["بحّار : سفينة","حقل : قمح","طبيب : دواء","مزرعة : مزارع"],"جملة الربط: «المزارع يعمل في الحقل»، وتصحّ بالترتيب نفسه مع «البحّار يعمل في السفينة»."],["V01","","غيمة : مطر",["ينبوع : ماء","ثمرة : شجرة","سماء : نجم","قطرة : بحر"],"جملة الربط: «الغيمة مصدر يخرج منه المطر»، وتصحّ بالترتيب نفسه مع «الينبوع مصدر يخرج منه الماء»."],["V01","","إبرة : خِياطة",["منشار : نِجارة","مقصّ : ورق","خيط : ثوب","خيّاط : إبرة"],"جملة الربط الأضيق: «الإبرة أداة تُؤدّى بها حرفة الخِياطة»، وتصحّ مع «المنشار أداة تُؤدّى بها حرفة النِّجارة»."],["V01","","حرف : كلمة",["لَبِنة : جدار","جملة : كلمة","قلم : حرف","حبر : ورقة"],"جملة الربط: «الحرف وحدة تُبنى منها الكلمة»، وتصحّ بالترتيب نفسه مع «اللبنة وحدة يُبنى منها الجدار»."],["V01","","في سؤال «مِشرط : جرّاح»، لماذا أضفنا «في مهنته» إلى جملة الربط؟",["لأن خيارين صلحا مع الجملة الأولى","لأن الجملة الأولى كانت مقلوبة الاتجاه","لأن الجملة القصيرة لا تصلح في التناظر","لأن الخيارات كلها من موضوع الطب"],"نضيّق الجملة فقط حين يصلح لها أكثر من خيار؛ هنا صلح «ملعقة : طفل» و«فرشاة : رسّام»."],["V01","","أول خطوة في حل سؤال التناظر:",["كتابة جملة ربط تبدأ بالكلمة الأولى","قراءة الخيارات الأربعة بسرعة","البحث عن خيار من نفس الموضوع","استبعاد الخيار الأطول"],"الجملة قبل الخيارات، لأن الخيارات توحي بعلاقات غير موجودة في السؤال."],["Z01","","سمعت من زميل أن القسم الأول لفظي في كل مرة، وأن لكل قسم عشرين دقيقة. ما الموقف الصحيح؟",["لا أبني خطتي عليه، لأن صفحة الهيئة لا تعلنه","أوزّع وقتي على عشرين دقيقة لكل قسم","أراجع اللفظي وحده في الأسبوع الأخير","أصدّقه لأنه اختبر قبلي"],"صفحة الهيئة تعلن 120 سؤالاً، ومدة ساعتين وخمس دقائق. ولا تحسم عدد أسئلة القسم ولا زمنه ولا ترتيب المكوّنات، فما يُتناقل عنها ليس رسمياً."],["Z01","","افترض أن للقسم 30 دقيقة، وفيه 20 سؤالاً. كم ثانية في المتوسط للسؤال الواحد؟",["90","60","1.5","600"],"حوّل إلى ثوانٍ: ⁦30 × 60 = 1800⁩ ثانية، ثم اقسم على الأسئلة: ⁦1800 ÷ 20 = 90⁩ ثانية، أي دقيقة ونصف."],["Z01","","في الجولة الأولى من القسم، وصلت إلى سؤال صعب لا تعرف طريق حله. ما التصرف الأنسب؟",["أعلّمه وأكمل ما بعده، ثم أرجع إليه","أبقى عنده حتى أصل إلى الحل","أرجع إلى أول القسم وأراجع ما أجبته","أنهي القسم وأنتقل إلى الذي بعده"],"الجولة الأولى للأسئلة التي تعرفها، والسؤال السهل في آخر القسم له الدرجة نفسها. فعلّم الصعب وتجاوزه، ثم ارجع إليه في الجولة الثانية بالوقت الباقي."],["Z01","","افترض أن القسم 20 سؤالاً، وله 30 دقيقة. مضت 20 دقيقة، وأجبت عن 12 سؤالاً، وعلّمت سؤالين صعبين عليك. ما الخطة الأنسب للدقائق العشر الباقية؟",["أقرأ الأسئلة الستة التي لم أصلها، ثم أرجع إلى المعلّمَين","أرجع إلى السؤالين المعلّمَين أولاً حتى أحلّهما","أراجع الأسئلة الاثني عشر التي أجبتها","أختار إجابة واحدة لكل ما بقي دون قراءته"],"بقي ⁦20 − 12 − 2 = 6⁩ أسئلة لم تقرأها، وفيها أسئلة قد تعرفها بسرعة. فأكمل الجولة الأولى عليها، ثم ارجع إلى المعلّمين بما بقي من وقت."],["Z01","","في سؤال، استبعدت خيارين خطأين قطعاً، وبقي خياران ولم تعرف أيهما الصحيح. والتعليمات على الشاشة لا تذكر خصماً للإجابة الخاطئة. ماذا تفعل؟",["أختار أحد الخيارين الباقيين","أترك السؤال بلا إجابة حتى لا أخطئ","أختار عشوائياً من الخيارات الأربعة كلها","أقضي ما بقي من وقت القسم عليه حتى أتأكد"],"الاستبعاد جعل فرصتك واحداً من اثنين بدل واحد من أربعة. وإذا لم تنصّ التعليمات على خصم، فالسؤال المتروك لا يكسب شيئاً، فاختر من الباقيين."],["Z01","","في سؤال تناظر، الزوج المعطى «بوصلة : بحّار». أي الخيارات تستبعده أولاً بقاعدة الاتجاه؟",["فلّاح : مِحراث","مِجداف : ملّاح","مقصّ : حلّاق","ريشة : خطّاط"],"جملة الربط: «البوصلة أداة البحّار»، الأداة أولاً ثم صاحبها. و«فلّاح : مِحراث» صاحب الأداة أولاً، فاتجاهه معكوس، فتستبعده قبل أن تقارن الباقي."],["Z01","","سؤال ضرب، وخياراته الأربعة متقاربة جداً، وكل منها ينتهي برقم آحاد مختلف. ما أسرع طريقة لحسمه؟",["أحسب رقم الآحاد في الناتج، وأقارنه بالخيارات","أضرب العددين كاملين على الورق","أقرّب العددين، وأختار الأقرب للناتج","أجرّب الخيار الأوسط أولاً، ثم أقارن"],"آحاد الناتج يأتي من ضرب آحاد العددين وحده، وهو حساب ثانية. وما دامت الآحاد مختلفة في الخيارات، فهو يحسم وحده."],["Z01","","في سؤال «أي العبارات يلزم صدقها؟» بقي خياران بعد الاستبعاد: الأول يصح في أغلب الحالات، والثاني يصح في كل حالة تسمح بها المعطيات. أيهما تختار؟",["الذي يصح في كل حالة تسمح بها المعطيات","الذي يصح في أغلب الحالات","الأطول منهما، لأنه أكثر تفصيلاً","أترك السؤال، لأن الخيارين ممكنان"],"«يلزم» يعني أنه يصح في كل حالة، لا في أغلبها. فالخيار الذي تنقضه حالة واحدة تسمح بها المعطيات ليس لازماً، وهو «قد يكون»."],["Z01","","الطريقة الصحيحة لإدارة الوقت داخل القسم:",["جولة للسهل مع تعليم الصعب، ثم جولة لما علّمته","أحل الأسئلة بترتيبها ولا أتجاوز سؤالاً","أبدأ بأصعب الأسئلة وأنا في كامل تركيزي","أعطي كل سؤال الوقت نفسه، ولا أرجع إليه"],"في الجولة الأولى تكسب كل سؤال تعرفه بسرعة، وتعلّم الصعب. وفي الثانية ترجع إلى ما علّمته بما بقي من وقت."],["Z01","","افترض أن القسم 20 سؤالاً، وله 30 دقيقة. في الجولة الأولى أجبت عن 16 سؤالاً في 18 دقيقة، وعلّمت الباقي. كم دقيقة من الوقت الباقي لكل سؤال علّمته في المتوسط؟",["3","7.5","0.6","4.5"],"بقي ⁦30 − 18 = 12⁩ دقيقة، والمعلّم ⁦20 − 16 = 4⁩ أسئلة، فلكل سؤال ⁦12 ÷ 4 = 3⁩ دقائق."],["V01","h","جنين : ولادة",["سهم : رمي","رجم : حجر","عصا : ضرب","مسدس : قتل"],"الجنين يخرج من مستقره بالولادة، والسهم يخرج من مستقره بالرمي: شيء ثم الفعل الذي يُخرجه."],["V01","h","مبنى : قاعة",["مسجد : مئذنة","ملعب : كرسي","كتاب : منهج","دكان : شارع"],"القاعة جزء معماري من المبنى، والمئذنة جزء معماري من المسجد: بناء ثم جزء من عمارته لا من أثاثه."],["Q01","h","قارن بين القيمتين: القيمة الأولى: 1/(7 + 1/2) ، القيمة الثانية: 2/15",["القيمتان متساويتان","القيمة الأولى أكبر","القيمة الثانية أكبر","المعطيات غير كافية"],"7 + 1/2 = 15/2، فـ 1/(15/2) = 2/15، فالقيمتان متساويتان."],["V12","h","الحجامة تعالج؟",["حالات الخدور","آلام المفاصل","تنظيف الدم من الشوائب","آلام المعدة"],"الفقرة الثانية: «تستخدم الحجامة في علاج آلام العضلات والرأس وخدور الأطراف»."],["Q01","h","قارن بين القيمتين: القيمة الأولى: 60^2 ، القيمة الثانية: (60 × 24) + (60 × 36)",["القيمتان متساويتان","القيمة الأولى أكبر","القيمة الثانية أكبر","المعطيات غير كافية"],"60^2 = 3,600، والثانية = 60 × (24 + 36) = 60 × 60 = 3,600، فالقيمتان متساويتان."],["V01","h","أبوة : عمومة",["أمومة : خؤولة","قرابة : نسب","مصاهرة : قوة","جد : جدة"],"الأبوة والعمومة قرابة من جهة الأب، والأمومة والخؤولة قرابة من جهة الأم: صلتان من جهة واحدة."],["V01","h","الإسكندرية : الرياض",["عدن : الخرطوم","نيويورك : الدوحة","جدة : جاكرتا","المنامة : الكويت"],"الإسكندرية مدينة عربية ساحلية وليست عاصمة بلدها، والرياض عاصمة عربية بعيدة عن البحر؛ وكذلك عدن ساحلية وعاصمة اليمن صنعاء، والخرطوم عاصمة داخلية."],["Q09","h","رجل لديه قطعة أرض مربعة الشكل طولها 20 م، وقيمة المتر المربع 600 ريال، فإذا استبدلها بأرض مستطيلة الشكل مساحتها 800 متر مربع وقيمة المتر فيها 300 ريال، فهل خسر الرجل أم ربح؟",["لم يخسر ولم يربح","خسر","ربح","ربح 24000"],"قيمة الأرض الأولى = 20 × 20 × 600 = 240,000، والثانية = 800 × 300 = 240,000، فالقيمتان متساويتان ولا خسارة ولا ربح."],["Q01","h","ما هو الرقم الذي يقع بين 3 1/5 و 3 1/2 ؟",["3,216","3,59","3","3,19"],"3 1/5 = 3,2 و3 1/2 = 3,5، والعدد 3,216 يقع بينهما (أكبر من 3,2 وأصغر من 3,5)."],["V01","h","صهيل : الخيل",["صرير : الباب","بكاء : الفتاة","شدو : الغراب","نهيق : الكلب"],"الصهيل اسم خاص بصوت الخيل، كما الصرير اسم خاص بصوت الباب: الصوت المميز وصاحبه."],["Q01","h","كم طريقة يمكن أن يكون عددين صحيحين موجبين حاصل ضربهم 30 ؟",["4","2","3","6"],"الأزواج الممكنة دون اعتبار الترتيب: (1، 30) و(2، 15) و(3، 10) و(5، 6)، أي 4 طرق."],["F03","h","ما العجلة التي تكمل السلسلة؟",["شكل 4","شكل 1","شكل 2","شكل 3"],""],["V01","h","لبن : أبيض",["خيار : أخضر","تفاح : أحمر","إنسان : أسود","حجر : صلب"],"لون واحد ثابت يُعرف به الشيء: اللبن أبيض، و«تفاح : أحمر»خضر."],["V01","h","حمار : حصان",["جحش : مهر","شجرة : تفاح","رجل : امرأة","غباء : ذكاء"],"الجحش ولد الحمار والمهر ولد الحصان، فالعلاقة بين الصغيرين هي نفسها بين الكبيرين: نوعان متقاربان من الدواب."],["Q01","h","العدد 3643 له علاقة بالعدد 30 ، والعدد 7354 يكون له علاقة بأحد الأعداد التالية، فما هو العدد؟",["41","27","31","33"],"القاعدة: ضرب الرقمين الأولين + ضرب الرقمين الأخيرين؛ 3643: 3×6 + 4×3 = 30، و7354: 7×3 + 5×4 = 41."],["L01","h","إذا كان لدينا فريق أحمد، وفريق خالد، وفريق ماجد، وفريق يوسف، فريق خالد فاز على فريق أحمد، وفاز على فريق ماجد، ويوسف فاز على فريق خالد، فكم مرة فاز فيها فريق خالد؟",["مرتان","مرة واحدة","ثلاث مرات","أربع مرات"],"خالد فاز على أحمد وعلى ماجد، أي مرتين؛ فوز يوسف عليه لا يُحسب له."],["V01","h","عرى : روابط",["ترامى : تباعد","تهالك : تقارب","سرى : ليل","تقادم : تماسك"],"ترامى وتباعد بمعنى واحد، كما عرى وروابط: مترادفان."],["V01","h","العطر من الزهرة كما أن الحكمة من ______",["التجربة","الشيخ","الكتاب","المعلم"],"العطر يُستخلص من الزهرة، والحكمة تُستخلص من التجربة التي يمر بها الإنسان بنفسه."],["V07","h","الطبيب الناجح يعتمد على…",["الخبرة","الحظ","الجهل","الصدفة"],"نجاح الطبيب يقوم على علمه وتجربته، أي الخبرة."],["V12","h","يفهم من النص أن أهم الوسائل للحفاظ على السكان:",["الرعاية الصحية الجيدة","كثرة الوظائف","الهجرة","تنمية التواصل بين البشر"],"النص يربط النقص بتدني الرعاية الصحية (انخفاض أعمار الرجال والإناث وارتفاع الوفيات)، فأهم وسيلة للحفاظ على السكان هي الرعاية الصحية الجيدة."],["Q01","h","أقل عدد نطرحه من 569 ليقبل القسمة على خمسة بدون باقي؟",["4","2","3","5"],"569 = 5 × 113 + 4، فنطرح الباقي 4 ليقبل القسمة على 5."],["L01","h","أي الخيارات التالية يدعم نتائج الدراسة؟",["التفكير الناقد ليس له علاقة بتخصص معين","يجب ألّا تتضمن المناهج مادة عن التفكير الناقد","وضحت الدراسة نتائجها في الذكور أكثر من الإناث","نوع الجنس لا يؤثر في الدراسة"],"الدراسة لم تجد فروقاً دالة تعزى للتخصص (علمي، أدبي)، أي أن التفكير الناقد لا علاقة له بتخصص معين."],["Q01","h","قارن بين القيمتين: القيمة الأولى: √99 ، القيمة الثانية: 9,5",["القيمة الأولى أكبر","القيمة الثانية أكبر","القيمتان متساويتان","المعطيات غير كافية"],"99 أكبر من 9.5^2 = 90.25، فـ √99 ≈ 9.95 أكبر من 9.5، فالقيمة الأولى أكبر."],["V12","h","النص يصنف ضمن الموضوعات:",["الاجتماعية","الاقتصادية","السياسية","النفسية"],"النص يعالج انخفاض السكان والطلاق والفقر والإنجاب، وهي قضايا اجتماعية."],["V07","h","كيف ...... للمرء أن يقضي حياته دون هدف يسعى إلى ......",["يمكن . تحقيقه","ينتحي . بنائه","يتيسر . إشباعه","يهيئ . توفيره"],"الهدف يُسعى إلى تحقيقه، والسؤال يستنكر أن يمكن للمرء العيش بلا هدف."],["F03","h","أوجد الشكل الناقص؟",["شكل 1","شكل 2","شكل 3","شكل 4"],""],["V12","h","يمكن استنتاج أن الدول النامية أكثر عرضة للخطر لأنها:",["تعتمد على الزراعة التقليدية وتفتقر إلى إمكانات التكيف.","تملك مساحات زراعية أكبر من الدول المتقدمة.","تهتم بالاستثمار في التكنولوجيا الزراعية.","لديها فائض غذائي يغطي احتياجاتها."],"النص: الدول النامية «تعتمد على الزراعة التقليدية» وتمتلك «قدرات محدودة على التكيف»."],["Q01","h","مجموع سبعة أعداد صحيحة موجبة متتالية هو ..",["63","57","58","61"],"مجموع سبعة أعداد متتالية = 7 × الوسطي، فهو من مضاعفات 7؛ 63 = 7 × 9 (من 6 إلى 12)."],["V01","h","القلم لسان الكاتب كما أن الريشة لسان ______",["الرسام","الشاعر","المعلم","العالم"],"القلم أداة الكاتب يعبّر بها، والريشة أداة الرسام يعبّر بها عن فنّه، ويقال: «ريشة الرسام»."],["Q08","h","قبل 6 سنوات كان عمر الأب = ثلاثة أضعاف عمر ابنه ، وبعد 6 سنوات سيصبح عمر الأب ضعف عمر ابنه ، كم عمر الابن الآن :",["18 سنة","10 سنوات","16 سنة","20 سنة"],"نفرض عمر الابن س: عمر الأب الآن 3(س - 6) + 6، وبعد 6 سنوات 3(س - 6) + 12 = 2(س + 6)، فس = 18."],["Q13","hx","عددان مجموعهما 60، والفرق بينهما 6. قارن بين القيمتين: القيمة الأولى: ثلاثة أمثال العدد الأكبر. القيمة الثانية: أربعة أمثال العدد الأصغر.",["القيمة الثانية أكبر","القيمة الأولى أكبر","القيمتان متساويتان","المعطيات غير كافية"],""],["V12","h","من الفقرة (1) كلمة الاستغراب والتعجب بينهما؟",["ترادف","تضاد","تفسير","متمم"],"النص جمع «الدهشة والتعجب والاستغراب» بمعنى واحد تقريباً، فبينهما ترادف."],["V01","h","هندسة : جبر",["فيزياء : كيمياء","فلسفة : منطق","جيولوجيا : أدب","مكتبة : كتاب"],"الهندسة والجبر فرعان من الرياضيات، والفيزياء والكيمياء فرعان من العلوم الطبيعية: علمان شقيقان من مجال واحد."],["Q09","h","ما الوقت المنقضي بين 9:30 صباحًا و 10:50 صباحًا؟",["80 دقيقة","5/3 ساعة","2/3 ساعة","1/3 ساعة"],"من 9:30 إلى 10:50 = ساعة و20 دقيقة = 80 دقيقة."],["Q01","h","عدد صحيح ثلثه يساوي 6/9 ..",["2","3","4","5"],"س/3 = 6/9 = 2/3، فـ س = 3 × 2/3 = 2."],["V13","h","المراد بسوء التخطيط؟",["ضعف المراقبة والتنظيم وظهور العشوائية","سوء حل المشكلات","الاستعمالات المختلفة","التلوث البيئي"],"سوء التخطيط في الحي يعني غياب التنظيم والمراقبة، فتظهر العشوائية في استعمال الأراضي والخدمات."],["V01","h","مطر : مظلة",["برد : معطف","نار : دخان","قمر : ضوء","عين : ماء"],"المظلة تحمي من المطر، كما أن المعطف يحمي من البرد: ما يُتّقى به الظاهرة."],["V12","h","نستنتج من النص أن اللقاح بعد التجريب كان:",["خطره معدوم","مضر","يمرض","أساسي"],"النص: «اتضح أن اللقاح لا خطر منه»، فخطره معدوم."],["V12","h","معنى (ينزع):",["يتوقف","يرفع","يأخذ","يترك"],"«لا ينزع محسن عن إحسانه» أي لا يكفّ عنه ولا يتوقف، ويقابله في السياق «ولا يستمر مسيء في إساءته»."],["V01","h","ذهب : خاتم",["قطن : ثوب","ماء : بحر","نار : دخان","ليل : نهار"],"الذهب مادة يُصنع منها الخاتم، كما أن القطن مادة يُصنع منها الثوب: مادة ومنتَج مصنوع منها."],["F01","ho","في كل صف (من اليمين) يُركَّب الشكل الثالث من الشكلين الأولين بقاعدة واحدة. ما الشكل الناقص؟",["شكل 4","شكل 1","شكل 2","شكل 3"],"عند تركيب الشكلين يبقى كل قطر ظهر في أحدهما فقط، ويختفي القطر المشترك بينهما. في الصف الأول اختفى القطر الرأسي لأنه في الشكلين. وفي الصف الثاني القطر المائل إلى اليسار مشترك فيختفي، ويبقى الأفقي من الأول والمائل إلى اليمين من الثاني."],["L01","ho","ست أخوات: مها، شهد، أروى، بشرى، منار، رهف، كل واحدة في صف مختلف من الأول المتوسط إلى الثالث الثانوي. شهد أكبر من أروى ومنار لكنها أصغر من بشرى، وبشرى أكبر من رهف لكنها أصغر من مها. من تدرس في الصف الثاني الثانوي؟",["بشرى","شهد","مها","منار"],"مها أكبر من بشرى، وبشرى أكبر من شهد ورهف، وشهد أكبر من أروى ومنار. فمها في الثالث الثانوي، وبشرى بعدها في الثاني الثانوي."],["Q18","ho","ما السبب الأرجح لإطفاء المطعم (ج) في وقت قصير؟",["عمل نظام الرش الآلي مبكراً","خلوّه من الزبائن وقت الحريق","قربه من مركز الدفاع المدني","تجمّع المارة حوله للمساعدة"],"المطعم مزوّد بنظام رش يعمل تلقائياً عند ارتفاع الحرارة، فيبدأ الإطفاء مبكراً."],["L01","ho","أحمد - خالد - وليد - حمد ذهبوا إلى رحلة كل منهم لديه شنطة وكانت أوزانها 5 و 10 و 11 و 13 على التوالي، شنطة خالد أثقل من وليد وأخف من حمد، شنطة أحمد أثقل من حمد، شنطة وليد هي الأخف، فكم وزن شنطة حمد؟",["11","5","10","13"],"الشروط ترتب الأوزان: وليد (الأخف) < خالد < حمد < أحمد، فتتوزع 5 و10 و11 و13 بالترتيب، فشنطة حمد 11."],["F01","ho","عجلة على أرض مستوية وعلى أعلى محيطها نقطة. تتدحرج العجلة إلى اليمين دورة كاملة حتى تصل إلى الموضع المتقطع. أي المسارات الآتية ترسمه النقطة؟",["شكل 3","شكل 1","شكل 2","شكل 4"],"النقطة تدور حول مركز العجلة والمركز يتقدم معاً: في البداية تتقدم بسرعة إلى الأمام وتنزل، وفي منتصف الدورة تلمس الأرض فتقف لحظة، فيظهر في المسار رأس مدبب على الأرض، ثم تصعد حتى تعود إلى أعلى العجلة في موضعها الجديد. فالمسار قوسان ملتقيان عند الأرض في رأس مدبب."],["Q13","hox","قارن بين: القيمة الأولى: ثلث 2 1/3 | القيمة الثانية: خمس 4 1/2",["القيمة الثانية أكبر","القيمة الأولى أكبر","القيمتان متساويتان","المعطيات غير كافية"],"ثلث 7/3 = 7/9 ≈ 0.78، وخمس 9/2 = 9/10 = 0.9، فالقيمة الثانية أكبر."],["Q18","ho","يمثل الشكل توزيع مصروف أسرة في شهر. القطاع المصمت (الملابس) زاويته 108 درجات ويمثل 1860 ريالاً، والقطاع المخطط زاويته 72 درجة. كم ريالاً يمثل القطاع المخطط؟",["1240","1550","1488","2790"],"القيمة تتناسب مع الزاوية: 1860 ÷ 108 × 72 = 1240 ريالاً. (أو: المصروف كله 1860 ÷ 0.3 = 6200، والمخطط 72 ÷ 360 = 20% منه = 1240)."],["L01","ho","(دع الكذاب يستمر في قصّ أكاذيبه عليك إلى أن يقول الصدق) يتضح من العبارة أن الكاذب سيقول الحقيقة وذلك؟",["يفضح نفسه بنفسه","خشية الفضيحة","خوفه من الآخرين","شعوره بالذنب"],"حين يطيل الكاذب أكاذيبه يقع في التناقض ويكشف الحقيقة بلسانه، أي يفضح نفسه بنفسه."],["L01","ho","مركز بحوث قام بتقديم نوعين مختلفة من الطعام لفئتين من الطيور ، وانتظر تأثيرها ليتم النظر إلى ردود أفعالها ، ثم يقوم بتحليل النتائج . ما هو نوع الدراسة التي قام بها المركز؟",["تجربة","دراسة قائمة على الملاحظة","دراسة مسحية","محاولة وخطأ"],"قدّم نوعين من الطعام لفئتين وراقب الأثر وحلله، وهذا تدخل وقياس للنتيجة: تجربة."],["F01","ho","في كل إطار شكلان يصل بينهما خط، والسلسلة تُقرأ من اليمين. ما الإطار الرابع؟",["شكل 2","شكل 1","شكل 3","شكل 4"],"الشكل الأيسر في كل إطار يصير الأيمن في الإطار التالي، ويدخل في اليسار الشكل الذي يليه في الدور: دائرة ثم مثلث ثم مربع. والتصميت يتبادل بين اليمين واليسار. فالرابع دائرة في اليمين ومثلث في اليسار، والمصمت هو الأيسر."],["Q05","ho","قطعة أرض في خريطة 5 سم تمثل 60 كم اذا كان لدينا 7 سم فانها تساوي ؟",["84 كم","30 كم","60 كم","74 كم"],"كل 5 سم تمثل 60 كم، فكل 1 سم = 12 كم، و7 سم = 7 × 12 = 84 كم."],["V12","ho","لو أعيدت الدراسة على الطلاب أنفسهم بعد تعريفهم بالأجهزة، وجاءت النتائج متدنية مرة أخرى، فما السبب الأرجح؟",["توقعات الطلاب السلبية من التجربة","عدم تعريف الطلاب بالأجهزة","عدم تدريب المعلمين على البرنامج","قصر مدة تهيئة الأسر والفصول"],"بعد زوال سبب الجولة الأولى (عدم تعريف الطلاب)، يبقى ما ذكره النص من توقع كثير منهم للفشل، والتوقع السلبي يضعف الأداء."],["F05","ho","كم مثلثاً في الشكل المثلثي الآتي؟",["13","10","12","9"],"نعدّ بالمقاس: المثلثات الصغيرة 9 (منها 3 مقلوبة)، والمثلثات المكوّنة من أربعة صغيرة 3، والمثلث الكبير 1، فالمجموع 13."],["L01","ho","ما العدد الذي شفرته 864؟",["246","6810","642","468"],"القاعدة: أضف 2 لكل رقم ثم اعكس ترتيب الأرقام. للعكس: 864 ← نعكس 468 ← نطرح 2 من كل رقم = 246."],["Q13","hox","قارن بين: القيمة الأولى: الجذر العاشر للعدد 32 (10√32) | القيمة الثانية: √2",["القيمتان متساويتان","القيمة الأولى أكبر","القيمة الثانية أكبر","المعطيات غير كافية"],"الجذر العاشر لـ 32 = 2^(5/10) = √2، فالقيمتان متساويتان."],["F01","ho","الشكل الأول بالنسبة إلى الثاني مثل الثالث بالنسبة إلى أي شكل؟ (الأزواج تُقرأ من اليمين)",["شكل 2","شكل 1","شكل 3","شكل 4"],"من الأول إلى الثاني بقي الشكل الخارجي وعدد النقاط كما هما، وتحوّلت النقاط من عمود رأسي إلى صف أفقي. فالمخمس بثلاث نقاط في عمود يصير مخمساً بثلاث نقاط في صف."],["F01","ho","الشكل الأول بالنسبة إلى الثاني مثل الثالث بالنسبة إلى أي شكل؟ في الزوج الأول صار الشكل الداخلي خارجياً، ودخل شكل جديد يرتبط عدد أضلاعه بعدد أضلاع الخارجي القديم.",["شكل 2","شكل 1","شكل 3","شكل 4"],"في الزوج الأول خرج الشكل الداخلي (الدائرة) ليصير خارجياً، ودخل شكل عدد أضلاعه أقل بواحد من الخارجي القديم: المربع له 4 أضلاع، فدخل مثلث له 3 أضلاع. فالمسدس الذي بداخله مربع يصير مربعاً بداخله شكل له 5 أضلاع، أي مخمس."]];
window.QPSG = {"albandri:P037":"يشكل التغير المناخي أحد أخطر التحديات التي تواجه العالم اليوم، حيث يؤثر بشكل مباشر في إنتاج الغذاء وتوزيعه. فقد باتت موجات الجفاف الطويلة، والفيضانات المفاجئة، وارتفاع درجات الحرارة عوامل تهدد خصوبة التربة وإنتاجية المحاصيل. ويزداد الأمر تعقيدًا حين نعلم أن الدول النامية، التي تعتمد بشكل رئيسي على الزراعة التقليدية، هي الأكثر عرضة لهذه التغيرات، في الوقت الذي تمتلك فيه قدرات محدودة على التكيف.\n\nلكن الصورة ليست قاتمة بالكامل؛ إذ يشير خبراء إلى أن تبني تقنيات الزراعة الحديثة، مثل الري بالتنقيط، والزراعة المحمية، واستخدام أصناف محسنّة مقاومة للجفاف، قد يخفف من هذه الآثار. ومع ذلك، فإن تطبيق هذه الحلول يتطلب استثمارات مالية ضخمة، وتعاونًا دوليًا لدعم الدول الأضعف، إضافة إلى وعي مجتمعي واسع بقيمة الاستدامة البيئية.\n\nمن هنا، يظهر أن معالجة أزمة التغير المناخي لا تنفصل عن الأمن الغذائي العالمي، وأن الحلول لا يمكن أن تكون محلية فحسب، بل تحتاج إلى تنسيق على المستويات كافة، لضمان بقاء الغذاء متاحًا للأجيال القادمة.","albandri:P202":"في مُستهَلّ عام 1953م أعلن سالك عن اكتشافه للقاح تحت التجريب. وكانت الفيروسات التي احتوى عليها اللقاح قد تمّ قتلها بالفورملدهيد، كان سالك وزوجته وثلاثة من أبنائه من بين أوائل من تطعموا باللقاح، اتضح أن اللقاح لا خطر منه، ولقد برهن تطعيم نفسه وأولاده وزوجته على جدية هذا اللقاح ودوره في سلامة الإنسان، وتمت تجربة اللقاح فيما بعد في مرحلة التجريب الجماعي على 1830000من طلبة المدارس وذلك في عام 1954م، ثم أعلن عن سلامة اللقاح وقدرته الفعالة، في نهاية الثلث الاول 1955م تلقى سالك أشكالاً\" عديدة من التكريم بما في ذلك إشادة من الرئيس دوايت ايزنهاور والميدالية الذهبية للكونجرس على إنجازه الكبير في حقل الطب، رفض سالك كل الجوائز النقدية ورجع إلى معمله ليعمل على تحسين اللقاح، ولقد منح سالك عام 1977م ميدالية الرئيس للحرية .","albandri:P209":"(1) نشر مؤخراً\" تقرير حول البحث العلمي في القطاع الخاص. وخلص التقرير إلى أن الأنشطة البحثية تعاني من الضعف والإهمال، ويلقي التقرير باللوم على القطاع الخاص لإهماله البحث العلمي وعدم قيامه بالدور الذي يجب أن يقوم به فيما يتصل بالتطوير والتحديث القائم على الدراسات والبحوث العلمية مذكراً\" بما يفعله القطاع الخاص في الدول المتقدمة من دعم لا محدود للبحث العلمي. وقد بدا على التقرير علامات الدهشة والتعجب والاستغراب من إهمال القطاع الخاص للبحث العلمي، وإذا كان معدو التقرير مندهشين من نتيجة التقرير فإن دهشتي ليست مما جاء في التقرير، بل من دهشة معدي التقرير وكأن نتيجة الدراسة كانت مفاجأة لهم.\n(2) يبدو لي أنه لا يوجد أمة على وجه الأرض تتفوق علينا في القدرة على إفراد الخطب البليغة وتخصيص المقالات الطويلة للحديث عن أهمية البحث العلمي ودوره في نهضة الأمم والشعوب، وفي الوقت نفسه لا أظن أنه يوجد أمة في هذا الكون الفسيح يمكن أن تجاربنا في إهمال البحث العلمي عملياً\"، وعليه يجب أن نفتخر بأننا أقوى أمة في امتلاك هاتين الميزتين المتناقضتين. إن من يسمع كلامنا ويقرأ لوائحنا ويطلع على خططنا يظن أننا أمة همها الأول البحث العلمي ودعم الباحثين وتشجيعهم وحفزهم بالمكافآت والجوائز المجزية وإنزالهم المنزلة التي يستحقونها، ولكن من يغوص بيننا قليلاً\" يدرك بسرعة اننا لا نؤمن بالبحث العلمي كقيمة ولا بوظيفة في النهوض بالأمم ولا نحترم الباحثين ولا ندعمهم ولا نأخذ بالنتائج التي يتوصلون إليها، بل يعرف أننا والبحث العلمي عدوان لدودان بينهما حرب مستمرة لا يمكن أن تهدأ .\n(3) إذا كنا نلقي باللوم على القطاع الخاص على إهماله للبحث العلمي فيجب أيضاً\" ان نلقي باللوم على الجامعات التي لا تقل إهمالاً\" للبحث العلمي، وهي البيئة التي يفترض أن ينطلق منها البحث العلمي يكاد فيها البحث العلمي غير موجود في الخدمة ليس مؤقتاً\" بل على الدوام. وإذا كان لدى بعضكم شك في ذلك فليقم بزيارة خاطفة إلى الجامعات وعمادات البحث العلمي فيها، أو يقوم بإجراء استفتاء حول الموضوع بين أساتذة الجامعات وسيسمع العجب العجاب من الحال الذي وصلت إليه الجامعات في اهمالها للبحث العلمي. أخيراً\" أحب أن أذكركم أن أحد محاور خطة التنمية الثامنة للدولة دعم البحث العلمي ويبدو لي أن هذا المحور سيكون حبراً\" على ورق ولن يجد طريقه إلى أرض الواقع.","albandri:P218":"تعاني معظم المدن من ظاهرة (شيخوخة الأحياء السكنية) حيث يكتسب الحي السكني أهمية اقتصادية، ورعاية إدارية، ورغبة سكانية في البقاء فيه، وبمرور الوقت تضمحل هذه القيم فتنخفض القيمة الاقتصادية للعقار السكني في الحي، وتغزو الحي الاستعمالات المختلطة المتواضعة في القيمة الاقتصادية، والمعنوية، وتتدهور المرافق والخدمات في الحي، وتظهر مشاكل التلوث، وسوء التخطيط، وقد تستفحل الامور، وتطفو على السطح اشكالات سلوكية ترتبط بالحي فيفقد الحي ازدهاره ويبدأ ساكنوه في البحث عن بيئة سكنية أفضل في أحياء أخرى جديدة.\nإن هذه المدن تعاني من موجة هجرة سكانية داخلية تنطلق من مركزها وأحيائها القديمة التي تفقد جودتها الاسكانية، الى أحياء سكنية جديدة، ستفقد قيمتها هي الاخرى بمرور الوقت، وهذا الوضع يجعل جميع سكان المدينة في بحث متواصل عن سكن.\nالازدهار السكاني المتواصل، الذي يزداد بمرور الوقت ويعكس جودة في التخطيط وتفاعلا من السكان، وكفاءة في التجهيز، واعتبار البيئة يعد أهم مؤشرات كفاءة قطاع الاسكان في المدينة.\nالمخطط الاستراتيجي الشامل يضع جملة من السياسات، المحققة لعدد من الغايات، والاهداف للنهوض بقطاع الاسكان في المدينة، والمؤهلة لمستقبل المدينة، وما ينتظرها من احتياجات اسكانية.\nركزت هذه السياسات على تطوير المناطق السكنية القائمة، وتطوير تصميم المجاورات السكنية، وتفعيل الاداء الاجتماعي للسكان، وتحسين البيئة السكنية، وتيسير الاسكان وتمويله.\nتُشكّل المناطق السكنية القائمة عماد النسيج العمراني للمدينة، والعناية بها من حيث استكمال احتياَجاتها، ومعالجة أوجه القصور التي تعاني منها سيسهم في تطوير قطاع الاسكان، ويعيد تأهيل اعداد كبيرة من المنازل التي هجرت ولم تعد تُرضي السكان.\nكما تُعاني معظم الخدمات من مشكلة التوزيع غير المتوازن على مستوى الاحياء كما ان العديد من هذه الخدمات مقامة في مبانٍ مستأجرة (42%) منها, وهي غير مناسبة من حيث المواقع، والتصاميم، والمساحات، كما بدًأت مشكلة تغيُّر استعمالات الاراضي السكنية في تحويل الاحياء السكنية الى أحياء مختلطة الاستعمالات، كما تحولَّت أراضي الخدمات العامة الى استعمالات أخرى، وهذه الاحياء بحاجة الى مزيد من المناطق المفتوحة، والمناطق الترفيهية، وتطوير البيئة السكنية التي تحفز الانشطة الاجتماعية التفاعلية بين السكان.\nطبيعة الاتصال والعلاقات العمرانية التخطيطية بين الوحدات السكنية في الحي فيما بينها وبين هذه الوحدات والفراغ شبه العام المحيط بها وبين مجموعات الوحدات السكنية، والفراغات العامة في الحي، ومراكز الحي، ومناطق الاستعمالات المتعددة، هذه العلاقات، ومستوى كفاءتها التخطيطية تعكس المستوى الحضري الذي يتمتع به الحي، فليست جودة الوحدات السكنية، وحسن تصميمها، ومستوى تنفيذها كافية لوحدها لرفع المستوى الحضري للحي، وإنما بجودة الاتصال والعلاقات العمرانية بين عناصر الحي تتحقق جودة الاداء الحضري للحي وهي ما ينعكس ايجابا\" على التفاعل الاجتماعي بين سكان الحي، ويتحقق من خلالها الافادة القصوى من مرافق الحي، ومنشآته الخدمية.\nالعلاقات الاتصالية بعناصر الحي تكون ضمن مستويات متدرجة، فكلما زادت درجة التقارب بين العناصر وتجاورت زادت الحاجة الى زيادة القواسم المشتركة بين هذه العناصر، واضفاء طابع الخصوصية ضمن هذا المستوى من العلاقة وإذا تباعدت المجاورات عن بعضها ظهرت أولويات أخرى لتنظيم الاتصال فيما بينها كتيسير الاتصال، وعزل الاستعمالات عن بعضها، والتركيز على المرونة، والقدرة على استيعاب الانشطة المكثفة، فعلى مستوى الوحدة السكنية هناك دائرة المجاورات السكنية لهذه الوحدة مع بقية الوحدات السكنية، التي تُشكّل مجموعة سكنية من هذه المساكن، وما يتبعها من فراغ شبه عام، كالممر الموصل بينها والمناطق المفتوحة الخاصة بها، وبعض المنشآت الخدمية الخاصة بها كالمسجد الصغير، فيجب في هذا المستوى ظهور قاسم مشترك من الخصوصية، وان تتمتع بالامن، والعزل عن المنشآت العامة، وأعصاب الحركة الرئيسية في الحي، وهذه البيئة ستشجع اقامة العلاقات الاجتماعية بين سكان هذه المجموعة السكنية، ويزداد تفاعلهم في الفراغ شبه العام، وتزداد إفادتهم مما يحتويه من مرافق وخدمات، وهذا ينعكس ايجابا على شعور السكان بالمسؤولية عن منطقتهم، واهتمامهم بها.\nفي المقابل يظهر مستوى آخر من العلاقة والاتصال بين المجموعات المجاورة كالاتصال بين مجموعات الوحدات السكنية ومركز الحي، الذي يشتمل عادة على المنشآت الخدمية العامة لكل سكان الحي، والعلاقة بين هذه العناصر وشبكة الطرق الرئيسة في الحي، ضمن هذا المستوى تبرز أولويات أخرى، كالمرونة، وسهولة الاتصال، وتوفير الامن، وحماية المشاة من حركة المركبات، وعزل الحركة العامة عن الخصوصية والسكينة التي تتمتع بها المجموعات السكنية، والقابلية لاحتضان تفاعل اجتماعي عام بين سكان الحي في المناسبات، وهو يختلف عن طبيعة التفاعل اليومي على مستوى مجموعات المساكن.\nإن تصميم المجاورات السكنية يجب ان يعتبر مبدأ تبادل المنافع بين المجاورات، فيما يحقق فيه التبادل مزيدا\" من الفعالية والخدمة، كالدمج بين المناطق المفتوحة للمدارس، ورياض الاطفال، والمناطق المفتوحة وحدائق الحي، وينبغي ألا يؤدي هذا الدمج وتبادل المنافع الى اهمال الاحتياجات، والوظائف الخاصة، وما تحتاجه من خصوصية، كالعزل بين النشاط الكثيف الذي تشهده الشوارع الرئيسة في الحي، وما يجاورها من وحدات سكنية. يتأثر السلوك الإنساني والأداء الاجتماعي بالمعتقدات والقيم والأفكار، ومستوى الانضباط السلوكي بمقتضياتها، والظروف المحيطة، معنوية كانت أم حسية، وهناك مؤثر الا يقل أهمية عما سبق يكمن في المستوى الحضري، وجودة التخطيط العمراني، والتصميم المعماري للبيئة التي يعمل فيها الإنسان، أو يسكنها، فإذا كان الانسان في حيه السكني يقضي جل وقته في منزله، الذي حدد طبيعته وفق احتياجاته الخاصة، فإنه لا يستغني عن الافادة خارج منزله، من أسواق، ومساجد وأماكن عامة، كما لا يستغني عن التفاعل مع الآخرين.\nإن كثيرا\" من ضعف الترابط الاجتماعي الذي تعاني منه الاحياء يرجع الى عدم ملاءمة البيئة خارج الوحدات السكنية للمناشط الاجتماعية، كما أن جودة التخطيط الحضري لهذه الاحياء، وكفاءة تصميم مجاوراتها السكنية، وتوافر مرافقها العامة، يُشكِّل بيئة محفزة للنشاط الاجتماعي.\nالتفاعل الاجتماعي بين سكان الحي ينحو في الجملة نحو الايجابية، خصوصا\" في ظل سيادة المعتقدات الإسلامية، وسلامة الذوق العام، وهذا التفاعل يعود بالفائدة على الفرد والمجتمع، فالأحياء التي تزداد فيها أواصر التعارف والتفاعل الاجتماعي سجلت معدلات أقل في الجرائم، والحوادث الأمنية، وتفشي المظاهر السلوكية السلبية. زيادة التفاعل بين السكان، ورعايته، وترشيده يحد من السلوكيات الشاذة في أوساط المجتمع، وينمي حس المسؤولية بين أفراد المجتمع، وهذا الشعور يؤول الى أنماط مختلفة من الاداء الجماعي التعاوني في مجالات البر والمعروف، كرعاية الضعيف، وخدمة المحتاج، وصيانة الحي، وحفظ مرافقه، وزيادة درجة الأمن.\nالأداء الاجتماعي للسكان، وسلوكهم الحضاري المنضبط هو الضمان الاساسي لازدهار الحي، ودوام جودته السكنية وعدم تعرضه للتدهور، واستفحال المشاكل، ونزوح ساكنيه، ومن ثم اندثاره.\nتعاني كثير من الأحياء السكنية من ضعف الهوية السكنية، ويتمثَّل ذلك في انتشار الاستعمالات المختلطة، وتغلغلها داخل النسيج العمراني السكني، الى درجة نزوح السكان من الحي، مع بقاء المساكن وتحويلها الى أنشطة تجارية مختلطة، كما يُسهم في غياب الهوية السكنية من الأحياء السكنية ضعف الانشطة الاجتماعية، حتى ضمن النسيج العمراني السكني الذي لم يتغيَّر استخدامه.\nعدة عوامل أدت الى غياب الهوية السكنية، منها النظام الشبكي للاحياء السكنية، فالشوارع الرئيسة في الحي اجتذبت الانشطة المختلطة، وبمرور الوقت وازدهار النشاط التجاري في الحي زادت كثافة الانشطة التجارية، حتى تغلغلت الى الشوارع الفرعية، كما ساعد تعدد استعمالات الأراضي وعدم فرض ضوابط دقيقة لاستعمالات الأراضي – خصوصا\" السكنية – في تحول المباني السكنية الى مبانٍ تجارية.\nلنجاح الحي السكني في خدمة سكانه، واستيعاب احتياجاتهم داخل الوحدات السكنية، وفي البيئة السكانية يلزم توفر قدر كبير من الخصوصية، والسكينة، ومستوى عال من ضبط استعمالات الأراضي، وتجهيز المرافق والخدمات العامة، ونظرا\" لكثرة الاشتراطات اللازمة لتحقيق البيئة السكنية الملائمة، فإن النسيج العمراني السكني وبيئته السكنية يتسم بقدر كبير من الحساسية، وسرعة التأثر بالعوامل الخارجية، وخصوصا الأنشطة التجارية المختلطة، كما أن تعرض البيئة السكنية للاختراق من قبل الانشطة الاخرى، يؤدي الى مضاعفة المشكلة بمرور الوقت، ويدخل الحي السكني في عملية تدهور مستمر، تنتهي بهجرة ساكنيه الى أحياء جديدة.\nقدرة قطاع الاسكان على توفير احتياجات المدينة من الوحدات السكنية لمقابلة الزيادة المطردة في عدد سكان المدينة، وخصوصا عدد الأسر الحديثة، يمثِّل دعامة مهمة للازدهار الحضري للمدينة، واستقرارها الاجتماعي، وضعف هذا القطاع عن توفير احتياجات المدينة الاسكانية يؤدي الى أزمات حادة في الاسكان.","amer:AP010":"أكدت وسائل إعلام روسية أن تواجه مشكلة في انخفاض عدد السكان حيث إنها تعاني أزمة سكانية حادة، تتمثل في الانخفاض الحاد في عدد السكان وانتشار الأمراض الصحية والاجتماعية والنفسية في المجتمع الروسي، فوفقًا لبعض الإحصاءات فإنهم ينقصون بمقدار 750 ألف نسمة كل عام، ويرجع ذلك إلى: تدني الرعاية الصحية؛ إذ انخفض متوسط أعمار الرجال إلى 59 سنة، والإناث إلى 71 سنة، وارتفاع معدلات الوفيات 18٪ ، كما أن هناك عزوفًا عن الإنجاب لدى الشعب الروسي لأسباب كثيرة تجعل النساء الروسيات يعزفن عن الإنجاب، مثل: الانتشار الواسع للطلاق (75 % من حالات الزواج)، وسوء التخطيط العائلي، وانخفاض مستوى المعيشة، وانتشار الفقر والخوف من المستقبل في ظل الأوضاع الاقتصادية والاجتماعية التي تمر بها روسيا حاليًا، ويمكن أن نلمس خوفهم في: صحيفة موسكو التي ما زالت تنشر مقالات بعنوان (روسيا 2025 . 2050)، ناهيك عن بعض المفاهيم التي غدت تتصدر تلك المقالات من نوعية أن الروس سيصبحون أقلية، وهاجس انقراض الروس، وفي ظل هذه الظروف إلى أن عدد مسلمي روسيا والذين يربو عددهم عن 20 مليون نسمة يشهد تزايدًا مستمرًا بسبب إقبالهم على التعدد ورغبتهم في الإنجاب، الذي حث عليه الدين الإسلامي، ولو لم يتفكك الاتحاد السوفيتي لأصبح المسلمون أغلبية فيه بحلول القرن المقبل.","amer:AP025":"لو كان لي أن أكتب لمحو الفساد من المجتمع الإنساني والقضاء على شروره وآثامه لما حركت يدًا، ولا جردت قلمًا؛ لأن هذا مسألة صعبة؛ لأنني أعلم أن طلب المحال عثرة من عثرات النفوس وضلالة من ضلالات العقول.\nولكنني أطلب مطلبًا واحدًا لا أرى في عقول الناس وأفهامهم ما يحول بينهم وبين تصوره، وإدراكه هو أن يهذبوا قليلا من هذه المصطلحات التي أنسوا بها، والعناوين التي جمدوا عليها، فلا يسمون المنافق تقيًا، ولا المتمجد ماجدًا، ولا البخيل غنيًا، ولا الفقير مجرمًا، ولا المتوحش متمدينًا؛ حتى لا ينزع محسن عن إحسانه، ولا يستمر مسيء في إساءته.","amer:AP037":"(1) عرفت الحجامة منذ القدم كممارسة طبية تقليدية، عرفها المصريون منذ ألفين ومئتي سنة قبل الميلاد، وقبلهم الآشوريون، وهي من أبرز ركائز الطب الصيني إلى جانب الإبر الصينية، وأثنى عليها رسول الله صلى الله عليه وسلم حيث قال: (خير ما تداويتم به الحجامة)، صحيح البخاري.\n(2) لكن في أيامنا هذه تراجعت شهرة الحجامة واستخدامها، بسبب انتشار شركات الأدوية والأجهزة الطبية، فقد اقتنع الناس بأن التطور واستخدام الأجهزة والأدوية أفضل من الحجامة، بالرغم من أن الحجامة أثبتت فائدتها علميًا، وتستخدم الحجامة في علاج آلام العضلات والرأس وخدور الأطراف\n(3) وقد كانت الحجامة تستخدم في الطب البديل وهي علاج قديم جدا وأن الصينيين لايزالون يستخدمونها، ولو علم الناس فوائدها لقل شرائهم للأدوية.","amer:AP101a":"تهدف الدراسة إلى التعرف على مستويات مهارات التفكير الناقد لدى طلاب وطالبات المرحلة الثانوية العامة في إحدى العواصم العربية، كما تهدف إلى تحديد الفروق بين متوسطات تقديرات الطلبة لمهارات التفكير الناقد لديهم بحسب متغير الجنس (ذكر، أنثى) والتخصص (علمي، أدبي) وأظهرت نتائج الدراسة أن درجة امتلاك مهارات التفكير الناقد لدى الطلاب والطالبات دون المستوى المقبول تربويا والذي حدد بـ (80 %)، كما كشفت النتائج أيضا عن فروق في مستوى مهارات التفكير الناقد وفقًا لمتغير الجنس لصالح الإناث، ولم تكشف النتائج عن فروق دالة إحصائيًا في مستوى امتلاك مهارات التفكير الناقد كل تعزى لمتغير التخصص، وخلصت الدراسة إلى ضرورة تنمية مهارات التفكير الناقد لدى طلاب وطالبات المرحلة الثانوية العامة من خلال دمجها بالمواد الدراسية.","sahli_written:sw-sahli-f1-p183-t02":"طبّقت إدارة تعليمية دراسة على 400 طالب من المرحلة المتوسطة، هدفها رفع مستواهم في الكتابة الإملائية بإضافة تمارين على الأجهزة اللوحية. وهُيّئت الأسر والفصول طوال عام كامل، وتلقى المعلمون دورة مكثفة في البرنامج. لكن الطلاب بدؤوا استعمال الأجهزة دون أي تعريف بطريقة عملها أو بنظام التمارين. وجاءت النتائج أدنى من المتوقع، فتراجع مستوى الطلاب بدلاً من أن يرتفع، وصار كثير منهم يتوقع الفشل إذا أعيدت التجربة.","sahli_written:sw-sahli-f1-p154-t01":"رصد الدفاع المدني ثلاثة حرائق في يوم واحد. المبنى (أ) مستودع كبير مزوّد بأجهزة إنذار مبكر، وأخلى العاملون فيه المكان فور انطلاق الإنذار. والمبنى (ب) مبنى مكاتب كان خالياً لأن الحريق وقع يوم إجازة، وتجمّع حوله عدد كبير من المارة للمشاهدة والتصوير، فتأخر وصول فرق الإطفاء إلى مداخله. والمبنى (ج) مطعم صغير مزوّد بنظام رشّ آلي يعمل عند ارتفاع الحرارة.","sahli_written:sw-solo-sahli-f1-p042-q01":"يرمّز نظام كل عدد بشفرة على هذا النحو:\nالعدد 47: الشفرة 96\nالعدد 135: الشفرة 753\nالعدد 21: الشفرة 34"};

window.WHY_BY_TEXT = {"جَمَل : صحراء":{"ماء : عطش":"الماء يسدّ العطش، فعلاقتهما «حاجة وما يسدّها». جملة الربط «يعيش في» لا تصحّ: الماء لا يعيش في العطش.","شبكة : صيّاد":"الشبكة أداة يستعملها الصيّاد، فعلاقتهما «أداة ومستعملها». لا كائن هنا ولا موطن يعيش فيه.","ملح : طعام":"الملح يُضاف إلى الطعام ليُصلحه، والطعام ليس موطناً يعيش فيه الملح. جملة «يعيش في» لا تصحّ معه."},"عسل : حلاوة":{"حرارة : نار":"العلاقة نفسها لكنها مقلوبة: الحرارة صفة لازمة للنار، والسؤال يبدأ بالشيء ثم صفته. هذا فخ الاتجاه.","صيف : شتاء":"الصيف والشتاء فصلان متقابلان، فعلاقتهما «تضاد». جملة «صفته اللازمة» لا تصحّ معهما.","سكر : قهوة":"السكر يُضاف إلى القهوة، والقهوة ليست صفة لازمة للسكر. جملة «صفته اللازمة» لا تصحّ معه."},"كتاب : فصل":{"مكتبة : قارئ":"المكتبة مكان يرتاده القارئ، فعلاقتهما «مكان وما فيه». الخيار من عالم الكتب، لكن علاقته مختلفة: فخ الموضوع.","صفحة : مجلّد":"الصفحة جزء من المجلّد، أي «جزء ثم كل». السؤال «كل ثم جزء»، فهذا مقلوب: فخ الاتجاه.","مؤلّف : رواية":"المؤلّف يكتب الرواية، فعلاقتهما «صاحب مهنة ومنتَجه»، بترتيب يخالف السؤال. والرواية لا تتكوّن من مؤلّفين."},"نحّال : عسل":{"نحلة : زهرة":"النحلة تتغذى من الزهرة، والنحلة ليست صاحبة مهنة، والزهرة ليست ناتج مهنة. الخيار من عالم النحل، لكن علاقته مختلفة: فخ الموضوع.","طبيب : مريض":"الطبيب يعالج المريض، والمريض ليس ناتج مهنته. جملة «ناتج مهنته» لا تصحّ معه.","عسل : شمع":"العسل والشمع كلاهما من النحل، ولا صاحب مهنة في الخيار. جملة «صاحب مهنة، و… ناتج مهنته» لا تصحّ معه."},"مزارع : حقل":{"حقل : قمح":"القمح ينبت في الحقل، فعلاقتهما «مكان وما فيه». الحقل ليس صاحب مهنة.","طبيب : دواء":"الطبيب يصف الدواء، والدواء ليس مكاناً يعمل فيه. جملة «يعمل في» لا تصحّ: الطبيب لا يعمل في الدواء.","مزرعة : مزارع":"المكان أولاً ثم صاحب المهنة، أي مقلوب: فخ الاتجاه."},"غيمة : مطر":{"ثمرة : شجرة":"الثمرة تخرج من الشجرة، فالمصدر هو الكلمة الثانية والسؤال يبدأ بالمصدر. العلاقة نفسها مقلوبة: فخ الاتجاه.","سماء : نجم":"النجم يظهر في السماء، فعلاقتهما «مكان وما فيه». النجم لا يخرج من السماء كما يخرج المطر من الغيمة.","قطرة : بحر":"القطرة جزء من البحر، فعلاقتهما «جزء وكل»، لا «مصدر وما يخرج منه»."},"إبرة : خِياطة":{"مقصّ : ورق":"المقص أداة تُستعمل على الورق، والورق مادة لا حرفة. الجملة الأولى «أداة لـ» تصحّ معه، فنضيّق إلى «أداة تُؤدّى بها حرفة».","خيط : ثوب":"الثوب يُصنع من الخيط، فعلاقتهما «مادة وما يُصنع منها». الخيط ليس أداة.","خيّاط : إبرة":"الخيّاط يستعمل الإبرة، فعلاقتهما «أداة ومستعملها» مقلوبة، لا «أداة وعمل». والخيّاط شخص لا حرفة."},"حرف : كلمة":{"جملة : كلمة":"الجملة تتكوّن من كلمات، فهذا «كل ثم جزء»، والسؤال «جزء ثم كل». مقلوب: فخ الاتجاه.","قلم : حرف":"القلم يُكتب به الحرف، والقلم ليس وحدة تُبنى منها الحروف. جملة «وحدة تُبنى منها» لا تصحّ معه.","حبر : ورقة":"الحبر يُكتب به على الورقة، والورقة لا تُبنى من الحبر. جملة «وحدة يُبنى منها» لا تصحّ معه."},"في سؤال «مِشرط : جرّاح»، لماذا أضفنا «في مهنته» إلى جملة الربط؟":{"لأن الجملة الأولى كانت مقلوبة الاتجاه":"الجملة الأولى بدأت بالكلمة الأولى «المشرط»، فاتجاهها صحيح. المشكلة أنها صحّت مع خيارين.","لأن الخيارات كلها من موضوع الطب":"الخيارات من مواضيع مختلفة: ملعقة، ومطرقة، وفرشاة. والموضوع لا يحدد الجواب أصلاً.","لأن الجملة القصيرة لا تصلح في التناظر":"الجملة القصيرة هي الأصل. نطيلها بقيد واحد فقط حين يصحّ معها أكثر من خيار."},"أول خطوة في حل سؤال التناظر:":{"قراءة الخيارات الأربعة بسرعة":"إذا قرأت الخيارات أولاً بدأت بعلاقة الخيار لا بعلاقة السؤال، فيوحي لك بعلاقة غير موجودة. وهذا فخ قراءة الخيارات أولاً.","البحث عن خيار من نفس الموضوع":"الموضوع لا يحدد الجواب، والخيار من الموضوع نفسه كثيراً ما يكون هو الفخ.","استبعاد الخيار الأطول":"طول الخيار لا علاقة له بالعلاقة بين كلمتيه، فلا يُستبعد به خيار."},"سمعت من زميل أن القسم الأول لفظي في كل مرة، وأن لكل قسم عشرين دقيقة. ما الموقف الصحيح؟":{"أوزّع وقتي على عشرين دقيقة لكل قسم":"زمن القسم غير معلن، فالخطة المبنية عليه قد تنهار يوم الاختبار.","أراجع اللفظي وحده في الأسبوع الأخير":"الاختبار خمسة مكوّنات، وترتيبها غير معلن، فالمراجعة المختلطة أنفع.","أصدّقه لأنه اختبر قبلي":"تجربة شخص واحد ليست إعلاناً رسمياً، وقد تختلف من اختبار لآخر."},"افترض أن للقسم 30 دقيقة، وفيه 20 سؤالاً. كم ثانية في المتوسط للسؤال الواحد؟":{"60":"أخذ تقدير «دقيقة للسؤال» من الاختبار كله، والقسم هنا زمنه مفترض أطول.","600":"ضرب الدقائق في عدد الأسئلة بدل أن يقسم.","1.5":"قسم 30 على 20، ونسي أن الناتج دقائق لا ثوانٍ."},"في الجولة الأولى من القسم، وصلت إلى سؤال صعب لا تعرف طريق حله. ما التصرف الأنسب؟":{"أبقى عنده حتى أصل إلى الحل":"يحبسك عند سؤال واحد، وقد يضيع وقت أسئلة سهلة بعده.","أرجع إلى أول القسم وأراجع ما أجبته":"المراجعة قبل أن تصل إلى آخر القسم تضيّع وقت أسئلة لم تقرأها.","أنهي القسم وأنتقل إلى الذي بعده":"تترك أسئلة القسم الباقية، ولا تفترض أنك ترجع إلى قسم أنهيته."},"افترض أن القسم 20 سؤالاً، وله 30 دقيقة. مضت 20 دقيقة، وأجبت عن 12 سؤالاً، وعلّمت سؤالين صعبين عليك. ما الخطة الأنسب للدقائق العشر الباقية؟":{"أرجع إلى السؤالين المعلّمَين أولاً حتى أحلّهما":"الصعب قد يأكل الدقائق العشر، وتضيع الأسئلة الستة التي لم تقرأها.","أراجع الأسئلة الاثني عشر التي أجبتها":"مراجعة ما أجبته قبل أن تقرأ ما بقي تضيّع أسئلة لم تحاولها.","أختار إجابة واحدة لكل ما بقي دون قراءته":"الوقت يكفي لقراءتها، ومنها ما تعرفه، فلا تخمّن قبل أن تقرأ."},"في سؤال، استبعدت خيارين خطأين قطعاً، وبقي خياران ولم تعرف أيهما الصحيح. والتعليمات على الشاشة لا تذكر خصماً للإجابة الخاطئة. ماذا تفعل؟":{"أترك السؤال بلا إجابة حتى لا أخطئ":"التعليمات لا تذكر خصماً، فالترك يضيّع فرصة قائمة بلا مقابل.","أختار عشوائياً من الخيارات الأربعة كلها":"يرجع إلى الخيارين المستبعدين، فيضيّع ما كسبه بالاستبعاد.","أقضي ما بقي من وقت القسم عليه حتى أتأكد":"يحبسك عند سؤال واحد، والاختيار من الاثنين يكفي هنا."},"في سؤال تناظر، الزوج المعطى «بوصلة : بحّار». أي الخيارات تستبعده أولاً بقاعدة الاتجاه؟":{"ريشة : خطّاط":"الأداة أولاً ثم صاحبها، بالاتجاه نفسه، فلا تستبعده قاعدة الاتجاه.","مقصّ : حلّاق":"المقصّ أداة الحلّاق، والأداة أولاً كالزوج المعطى.","مِجداف : ملّاح":"المجداف أداة الملّاح، فالاتجاه نفسه، ويُحسم بغير هذه القاعدة."},"سؤال ضرب، وخياراته الأربعة متقاربة جداً، وكل منها ينتهي برقم آحاد مختلف. ما أسرع طريقة لحسمه؟":{"أضرب العددين كاملين على الورق":"يصل إلى الجواب، لكنه أبطأ بكثير من حساب الآحاد.","أقرّب العددين، وأختار الأقرب للناتج":"التقريب لا يفرّق بين خيارات متقاربة جداً.","أجرّب الخيار الأوسط أولاً، ثم أقارن":"تجربة الخيارات في الضرب تحتاج قسمة طويلة، فلا توفّر وقتاً."},"في سؤال «أي العبارات يلزم صدقها؟» بقي خياران بعد الاستبعاد: الأول يصح في أغلب الحالات، والثاني يصح في كل حالة تسمح بها المعطيات. أيهما تختار؟":{"الذي يصح في أغلب الحالات":"حالة واحدة تنقضه تكفي لإسقاطه، فهو «قد يكون» لا «يلزم».","الأطول منهما، لأنه أكثر تفصيلاً":"الطول ليس دليلاً، والتفصيل الزائد قد يضيف ما لا يلزم.","أترك السؤال، لأن الخيارين ممكنان":"قاعدة «يلزم» تحسم بينهما، فلا داعي للترك."},"الطريقة الصحيحة لإدارة الوقت داخل القسم:":{"أحل الأسئلة بترتيبها ولا أتجاوز سؤالاً":"سؤال صعب واحد قد يحبسك ويضيّع أسئلة سهلة بعده.","أبدأ بأصعب الأسئلة وأنا في كامل تركيزي":"الصعب يأكل الوقت أولاً، والسهل له الدرجة نفسها.","أعطي كل سؤال الوقت نفسه، ولا أرجع إليه":"الأسئلة تختلف في وقتها، والرجوع إلى المعلّم يكسب درجات."},"افترض أن القسم 20 سؤالاً، وله 30 دقيقة. في الجولة الأولى أجبت عن 16 سؤالاً في 18 دقيقة، وعلّمت الباقي. كم دقيقة من الوقت الباقي لكل سؤال علّمته في المتوسط؟":{"7.5":"قسم زمن القسم كله على الأربعة، ونسي الدقائق التي مضت.","0.6":"قسم الوقت الباقي على أسئلة القسم كلها، والمطلوب الأسئلة المعلّمة فقط.","4.5":"قسم الدقائق التي مضت بدل الباقية."},"لو أعيدت الدراسة على الطلاب أنفسهم بعد تعريفهم بالأجهزة، وجاءت النتائج متدنية مرة أخرى، فما السبب الأرجح؟":{"عدم تعريف الطلاب بالأجهزة":"الموقف افترض أن الطلاب عُرّفوا بالأجهزة قبل الإعادة.","عدم تدريب المعلمين على البرنامج":"المعلمون تلقوا دورة مكثفة كما في النص.","قصر مدة تهيئة الأسر والفصول":"التهيئة استمرت عاماً كاملاً، فلا يصح وصفها بالقصر."},"ست أخوات: مها، شهد، أروى، بشرى، منار، رهف، كل واحدة في صف مختلف من الأول المتوسط إلى الثالث الثانوي. شهد أكبر من أروى ومنار لكنها أصغر من بشرى، وبشرى أكبر من رهف لكنها أصغر من مها. من تدرس في الصف الثاني الثانوي؟":{"شهد":"شهد أصغر من بشرى، فلا تكون الثانية.","مها":"مها الكبرى، فهي في الثالث الثانوي لا الثاني.","منار":"منار أصغر من شهد، وشهد أصغر من بشرى."},"ما السبب الأرجح لإطفاء المطعم (ج) في وقت قصير؟":{"خلوّه من الزبائن وقت الحريق":"وجود الزبائن أو غيابهم لا يغيّر سرعة الإطفاء.","قربه من مركز الدفاع المدني":"النص لم يذكر موقع مركز الدفاع المدني.","تجمّع المارة حوله للمساعدة":"التجمهر كان عند المبنى (ب)، وهو يؤخّر الإطفاء لا يسرّعه."},"ما العدد الذي شفرته 864؟":{"468":"عكس الترتيب ونسي طرح 2.","642":"طرح 2 من كل رقم ونسي عكس الترتيب.","6810":"أضاف 2 لكل رقم بدل طرحها."},"الشكل الأول بالنسبة إلى الثاني مثل الثالث بالنسبة إلى أي شكل؟ (الأزواج تُقرأ من اليمين)":{"شكل 1":"هذا الشكل الثالث نفسه، ولم تتحوّل نقاطه إلى صف.","شكل 3":"النقاط صارت صفاً، لكن الشكل الخارجي تغيّر، والقاعدة تبقيه كما هو.","شكل 4":"الشكل والصف صحيحان، لكن عدد النقاط نقص، والقاعدة لا تغيّر العدد."},"في كل صف (من اليمين) يُركَّب الشكل الثالث من الشكلين الأولين بقاعدة واحدة. ما الشكل الناقص؟":{"شكل 1":"هذا جمع الخطوط كلها، لكن الصف الأول يبيّن أن الخط المشترك يختفي.","شكل 2":"هذا الشكل الأول من الصف الثاني بلا تغيير.","شكل 3":"هذا الخط المشترك وحده، والقاعدة تحذفه وتُبقي غيره."},"الشكل الأول بالنسبة إلى الثاني مثل الثالث بالنسبة إلى أي شكل؟ في الزوج الأول صار الشكل الداخلي خارجياً، ودخل شكل جديد يرتبط عدد أضلاعه بعدد أضلاع الخارجي القديم.":{"شكل 1":"أدخل المسدس نفسه، والقاعدة تُدخل شكلاً أقل منه بضلع واحد.","شكل 3":"نقص الخارجي ضلعاً، لكن القاعدة تجعل المربع الداخلي هو الخارجي.","شكل 4":"نقل المثلث من الزوج الأول كما هو، والشكل الداخل يتبع الخارجي القديم: المسدس 6 أضلاع، فالداخل له 5."},"كم مثلثاً في الشكل المثلثي الآتي؟":{"9":"هذه المثلثات الصغيرة فقط، ولم يُعدّ ما تكوّن من أكثر من مثلث.","10":"زاد المثلث الكبير على الصغيرة، وأغفل المثلثات المتوسطة الثلاثة.","12":"عدّ الصغيرة والمتوسطة، ونسي المثلث الكبير الخارجي."},"عجلة على أرض مستوية وعلى أعلى محيطها نقطة. تتدحرج العجلة إلى اليمين دورة كاملة حتى تصل إلى الموضع المتقطع. أي المسارات الآتية ترسمه النقطة؟":{"شكل 1":"هذا منحنى ناعم في أسفله، والنقطة تقف لحظة عند ملامسة الأرض فيصير أسفل المسار رأساً مدبباً.","شكل 2":"هذا قوس فوق العجلة لا ينزل أبداً، والنقطة تنزل حتى تلمس الأرض في منتصف الدورة.","شكل 4":"هذا خط مستقيم يصح لمركز العجلة لا لنقطة على محيطها."},"يمثل الشكل توزيع مصروف أسرة في شهر. القطاع الم /* 120 سؤالاً، ساعتان وخمس دقائق (المعتمد 2026-11-14) */ const MOCK_Q=120, MOCK_MIN=125;
const STD_N = (function(){const keys=SORDER; const raw=keys.map(k=>MOCK_Q*STDW[k]/120); const fl=raw.map(Math.floor); const left=MOCK_Q-fl.reduce((a,b)=>a+b,0); raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(([_,i])=>fl[i]++); return Object.fromEntries(keys.map((k,i)=>[k,fl[i]]));})();
/* المحاكيات (2026-11-14): الاختيار في أداة البيانات (qudurat_extract.py) بأوزان يوسف النهائية، وعددها يحدده أقل مجال بلا تكرار (QD_STATS.nmock).

const NMOCK = (window.QD_STATS&&QD_STATS.nmock)||Math.max(0,...QS.map(q=>q.mi||0));
const MOCK_KEYS = Array.from({length:NMOCK},(_,i)=>"mock"+(i+1));
function buildMocks(){ return MOCK_KEYS.map((_,i)=>shuffle(QS.filter(q=>q.mi===i+1).map(q=>q.id),301+i)) }
const MOCKS = buildMocks();
const QS_D = QS;
const DIAG = (window.PW&&PW.diag) ? PW.diag.filter(id=>QBY[id]) : (function(){
  const n={V:15,Q:10,R:10,F:5}; let ids=[];
  DORDER.forEach((d,di)=>{

    ids = ids.concat(pool.slice(0,n[d]).map(q=>q.id));

})();

  // اختبار مصغّر بأسلوب الهيئة (2026-10-23، قرار يوسف): 20 سؤالاً و20 دقيقة — لا اختبار مجاني تفاعلي فوق 20 (التشخيصي 40 مستثنى)

// اختبار كامل مجاني (2026-10-21): أسئلة غير أسئلة البنك المجاني وغير التشخيصي، موزعة بأوزان المجالات — حتى تكون الدرجة حقيقية
function free60Ids(){const ds=new Set(DIAG), pool=QS.filter(q=>!q.h&&!q.m&&!q.of&&!q.z&&!ds.has(q.id)); /* z = أُضيف بعد تثبيت الاختبار المصغّر (2026-10-31)، فلا يغيّر أسئلته */ const tw=DORDER.reduce((a,d)=>a+(DOM[d].w||1),0); let out=[];
  DORDER.forEach((d,i)=>{const want=i===DORDER.length-1?FREE_N-out.length:Math.round(FREE_N*(DOM[d].w||1)/tw); out=out.concat(shuffle(pool.filter(q=>q.d===d).map(q=>q.id),9100+i).slice(0,want))});
  if(out.length<FREE_N) out=out.concat(shuffle(pool.filter(q=>!out.includes(q.id)).map(q=>q.id),9199).slice(0,FREE_N-out.length)); return shuffle(out,9200)}

const LS_KEY = "rakhsa-qudurat.v1";
function freshState(){return {v:1,start:todayStr(),exam:EXAM_DEFAULT,lessons:{},q:{},terms:{},tests:{},tasks:{},updatedAt:0}}

let dbRef=null, remoteBusy=false, remotePending=false, syncOn=false, saveTimer=null;
function save(){
  S.updatedAt = Date.now();
  try{localStorage.setItem(LS_KEY, JSON.stringify(S))}catch(e){}
  clearTimeout(saveTimer); saveTimer=setTimeout(pushRemote, 1200);
}
async function pushRemote(){
  if(!dbRef) return;
  if(remoteBusy){remotePending=true;return}
  remoteBusy=true;
  try{await dbRef.set(JSON.parse(JSON.stringify(S))); syncOn=true}catch(e){if(e&&e.code==="invalid_argument"){dbRef=null;syncOn=false}}
  remoteBusy=false; renderSync();
  if(remotePending){remotePending=false;pushRemote()}
}
async function pullRemote(){
  if(!dbRef) return;
  try{
    const snap = await dbRef.get();
    if(snap.exists){const r=snap.data(); if(r&&r.v===1&&(r.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(freshState(),JSON.parse(JSON.stringify(r)));try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){};render()}
      else if((S.updatedAt||0)>(r&&r.updatedAt||0)) pushRemote();}
    else if(S.updatedAt) pushRemote();
    syncOn=true; renderSync();
  }catch(e){}
}
async function initRemote(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    dbRef = db.doc("data/users/"+uid+"/progress");
    await pullRemote();
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pullRemote()});
  }catch(e){}
}

/* question stats */
function recordAnswer(id, correct){
  const st = S.q[id] || (S.q[id]={a:0,c:0});
  st.a++; if(correct) st.c++; st.last = correct?1:0;
  if(!correct){st.b=0; st.due=todayStr()}
  else if(st.b!=null){st.b=Math.min(st.b+1,5); st.due=addDays(todayStr(),INT[st.b])}
}
function reviewDue(){const t=todayStr();return QS.filter(q=>{const s=S.q[q.id];return s&&s.b!=null&&s.b<5&&s.due<=t})}
function reviewAll(){return QS.filter(q=>{const s=S.q[q.id];return s&&s.b!=null&&s.b<5})}
function mocksDone(){return MOCK_KEYS.every(k=>S.tests[k])}
function groupStats(filter){
  const qs=QS.filter(filter); let att=0,cor=0,mast=0;
  qs.forEach(q=>{const s=S.q[q.id];if(s){att+=s.a;cor+=s.c;if(s.last===1)mast++}});
  return {total:qs.length,mast,acc:pct(cor,att),att};
}
const domainStats=d=>groupStats(q=>q.d===d);
const stdStats=sd=>groupStats(q=>q.std===sd);
function lessonStats(id){
  const qs=QS.filter(q=>q.l===id); let att=0,cor=0;
  qs.forEach(q=>{const s=S.q[q.id];if(s){att+=s.a;cor+=s.c}}); return {att,cor,acc:pct(cor,att)};
}

/* ترتيب الدروس في الخطة: حسب الوزن والصعوبة، لا حسب رقم المعيار */
/* قدرات الجامعيين: الدروس بترتيب الخريطة المعتمدة (لفظي ← كمي ← ناقد ← منطق ← أشكال ← يوم الاختبار) */ const PLAN_ORDER = LORDER;
function planTasks(){
  return [{id:"diag",type:"test",t:"الاختبار التشخيصي",s:"40 سؤالاً من كل المجالات، يبيّن لك أين تحتاج المذاكرة، ويحيلك إلى الدروس"}]
    .concat(PLAN_ORDER.filter(id=>LBY[id]).map(id=>{const l=LBY[id];return {id:l.id,type:"lesson",t:l.ar,s:DOM[l.d].ar,d:l.d}}))
    .concat([
      ...MOCK_KEYS.flatMap((k,i)=>[{id:k,type:"test",t:"الاختبار المحاكي "+(i+1),s:i===0?"120 سؤالاً · ساعتان وخمس دقائق":i===NMOCK-1?"آخر محاكاة قبل الاختبار، وأسئلته من المصادر الأقدم":"120 سؤالاً جديداً"}]
        .concat(i<NMOCK-1?[{id:"rev"+(i+1),type:"review",t:"مراجعة أخطاء المحاكي "+(i+1),s:"الأخطاء + أضعف مجالين"}]:[]))
    ]);   /* قدرات الجامعيين: عدد المحاكيات من البيانات، وبلا «خلاصة الفخاخ» (لا فخاخ مكتوبة في الدروس؛ خطة يوم الاختبار درس Z01) */
}
function taskDone(t){
  if(t.type==="lesson") return !!(S.lessons[t.id]&&S.lessons[t.id].done);
  if(t.type==="test") return !!S.tests[t.id];
  return !!S.tasks[t.id];
}
/* الخطة بالأيام (يوسف 2026-11-08ج): بلا تواريخ ولا ربط بموعد الاختبار. عدد الأيام يختاره الزائر 1–60 (الافتراضي 21) ويُحفظ في جهازه S.planDays.
   المهام بنفس ترتيبها دائماً، فتقدم المشترك (الدروس والاختبارات المنجزة) يتحول لأيام بنفس الترتيب بلا ضياع. «اليوم الحالي» = يوم أول مهمة غير منجزة */
const PLAN_DEF = 21;
function planDays(){let n=Math.round(+S.planDays); if(!(n>=1&&n<=60)){n=PLAN_DEF; if(S.exam){const sp=diffDays(S.start,S.exam); if(sp>=7&&sp<=60&&diffDays(todayStr(),S.exam)>0) n=sp} S.planDays=n} return n}
const daysTxt=n=>n===1?"يوم واحد":n===2?"يومين":`${AR(n)} ${n<=10?"أيام":"يوماً"}`;
function buildPlan(){
  const tasks=planTasks(), N=planDays(); let days=[];
  if(N>=tasks.length){
    days = tasks.map(t=>[t]);
    for(let i=0;i<N-tasks.length;i++) days.splice(days.length-6,0,[{id:"buf"+i,type:"review",t:"يوم مراجعة",s:"مراجعة الأخطاء + البطاقات المستحقة + 20 سؤالاً سريعاً"}]);
  } else {
    // تقسيم متوازن بالترتيب: الدرس والاختبار وزن 1، والمراجعة والخلاصة والدليل نصف
    const w=t=>t.type==="review"||t.type==="final"||t.id==="official"?0.5:1; let rest=tasks.slice();
    for(let d=0;d<N;d++){const left=N-d; if(left===1){days.push(rest);break}
      const tgt=rest.reduce((a,t)=>a+w(t),0)/left, day=[]; let sum=0;
      while(rest.length>left-1&&(!day.length||sum+w(rest[0])/2<=tgt)){sum+=w(rest[0]);day.push(rest.shift())}
      days.push(day)}
  }
  return days.filter(d=>d.length).map((ts,i)=>({n:i+1,tasks:ts}));
}
function planDayOf(plan){const nt=nextTask(); if(!nt) return plan.length-1; const i=plan.findIndex(d=>d.tasks.some(t=>t.id===nt.id)); return i<0?0:i}
function planIntro(plan){
  const maxL=Math.max(...plan.map(d=>d.tasks.filter(t=>t.type==="lesson").length)), hrs=Math.max(1,Math.round(maxL*2));
  return maxL>1?`في بعض أيامها ${maxL===2?"درسان":AR(maxL)+" "+(maxL<=10?"دروس":"درساً")}، يعني قرابة ${hrs===2?"ساعتين":AR(hrs)+" "+(hrs<=10?"ساعات":"ساعة")} يومياً. تقدر تزيد عدد الأيام ليخف اليوم.`
    :"ساعتان يومياً تقريباً: الدرس (40–50 دقيقة) + فيديو + اختبار الدرس + 20 سؤالاً من مراجعة الأخطاء. الدروس مرتبة بالوزن والصعوبة: التقويم ثم المتعلم ثم التخطيط، والكمي واللغوي في الأخير لأنهما مهارة لا حفظ.";
}
function planRows(plan){const pd=planDayOf(plan);
  return plan.map((d,i)=>{const all=d.tasks.every(taskDone);
      return `<button class="day ${i===pd?"is-today":""}" data-open-task="${d.tasks.find(t=>!taskDone(t))?.id||d.tasks[0].id}">
        <div class="dn"><span>اليوم</span><b>${AR(d.n)}</b></div>
        <div class="what">${d.tasks.map(t=>`<div class="t">${esc(t.t)}${window.PW&&((t.type==="lesson"&&PW.locked(t.id))||/^(mock|rev)\d|^final$/.test(t.id))?PW.lockIcon:""}${t.d?` <span class="chip"><span class="dot" style="background:var(--d${t.d})"></span>${DOM[t.d].ar}</span>`:""}</div><div class="s">${esc(t.s)}</div>`).join("")}</div>
        <span class="bub ${all?"on":""}" aria-label="${all?"منجز":"غير منجز"}"></span></button>`}).join("")
    +`<button class="day" data-go="sheet"><div class="dn"><span>بعدها</span></div><div class="what"><div class="t">يوم الاختبار</div><div class="s">نصائح الدخول وإدارة الوقت في خلاصة الفخاخ</div></div><span class="bub"></span></button>`;
}
function setPlanDays(n){n=Math.max(1,Math.min(60,Math.round(+n)||PLAN_DEF)); if(n===S.planDays&&document.getElementById("pdOut")) return; S.planDays=n; save();
  const plan=buildPlan(), q=id=>document.getElementById(id);
  if(q("pdOut")){q("pdOut").textContent=AR(n); q("pdRange").value=n; q("pdTitle").textContent="خطة "+daysTxt(n); q("pdIntro").textContent=planIntro(plan); q("pdPlan").innerHTML=planRows(plan); q("pdBtnN").textContent=daysTxt(n)}}
document.addEventListener("input",e=>{if(e.target&&e.target.id==="pdRange") setPlanDays(e.target.value)});
function nextTask(){const t=planTasks().find(t=>!taskDone(t));return t||null}

function reportText(){
  let att=0,cor=0; Object.values(S.q).forEach(s=>{att+=s.a;cor+=s.c});
  const lines=["تقرير مذاكرة قدرات الجامعيين — "+todayStr(),
   "الدروس المنجزة: "+LESSONS.filter(l=>S.lessons[l.id]&&S.lessons[l.id].done).length+"/"+LESSONS.length,
   "الإجابات: "+att+" · الدقة: "+pct(cor,att)+"%",
   "الاختبارات: "+Object.entries(S.tests).map(([k,v])=>k+"="+v.score+"%").join(" ، "),
   "المجالات:"].concat(SORDER.map(sd=>{const s=stdStats(sd);return "  "+STDS[sd]+": إتقان "+pct(s.mast,s.total)+"% · دقة "+s.acc+"% · محاولات "+s.att}));
  const weak=LESSONS.map(l=>({l,s:lessonStats(l.id)})).filter(x=>x.s.att>=5).sort((a,b)=>a.s.acc-b.s.acc).slice(0,5);
  lines.push("أضعف الدروس: "+(weak.map(x=>x.l.id+" "+x.l.ar+" ("+x.s.acc+"%)").join(" ، ")||"لا يوجد بعد"));
  lines.push("أخطاء في دورة المراجعة: "+reviewAll().length);
  return lines.join("\n");
}

function openTask(id){
  const t=planTasks().find(x=>x.id===id); if(!t) return;
  if(t.type==="lesson") return go({name:"lesson",id});
  if(t.type==="test") return startTest(id);

  if(t.type==="review"){ S.tasks[id]=true; save(); if(reviewDue().length) return startReview(); toast("ما عندك أخطاء مستحقة، كمّل الخطة"); return render() }
}

function startDaily(){
  const seed=hash(todayStr()); const out=[];
  SORDER.forEach((sd,i)=>{const pool=quizPool(q=>q.std===sd&&!q.of); const k=Math.max(1,Math.round(10*STDW[sd]/100)); out.push(...shuffle(pool,seed+i).slice(0,k))});
  const ids=shuffle(out,seed).slice(0,10).map(q=>q.id); if(!ids.length){toast("لا توجد أسئلة بعد");return}
  startSession({mode:"practice",kind:"daily",title:"سؤال اليوم ×10 · "+fmtDate(todayStr()),ids});
}
