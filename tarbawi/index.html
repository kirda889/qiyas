["L10","hm","أثناء جلسة عصف ذهني، أي القواعد التالية خاطئة؟",["فحص الأفكار ونقدها قبل طرحها","الكم قبل الكيف","إرجاء الحكم على الأفكار","البناء على أفكار الآخرين"],"النقد المبكر يقتل الأفكار؛ التقويم يأتي في مرحلة لاحقة. الباقي من قواعد أوزبورن."],
["L10","hm","قبل الاختبار طلب المعلم من كل طالب أن يحدد الموضوعات التي يشعر أنه لم يتقنها بعد، وأن يضع خطة لمراجعتها ويقيّم في نهايتها ما تحقق. المعلم ينمي لدى الطلاب:",["ما وراء المعرفة","التفكير التقاربي","الطلاقة اللفظية","الذاكرة الحسية"],"الوعي بما يعرفه الطالب وما لا يعرفه، والتخطيط والمراقبة والتقويم الذاتي للتعلم هي مكونات ما وراء المعرفة (فلافل). التقاربي الوصول إلى حل واحد، والطلاقة توليد أفكار كثيرة."],
["L10","","أي الأنشطة يُعد نشاطاً ما وراء معرفي؟",["يراجع الطالب خطته لحل المسألة ويسأل نفسه هل هذه أفضل طريقة","يقرأ الطالب النص قراءة صامتة","يحفظ الطالب القصيدة","ينسخ الطالب الدرس في دفتره"],"مراقبة الخطة وتقويمها تفكير في التفكير. القراءة والحفظ والنسخ مهارات معرفية."],
["L10","m","قال طالب في نقاش: «هذه الفكرة ستفشل لأن التكلفة مرتفعة والوقت قصير». وفق القبعات الست، يفكر بالقبعة:",["السوداء","الحمراء","الصفراء","الخضراء"],"الحذر والسلبيات والمخاطر قبعة سوداء. الحمراء مشاعر، الصفراء فوائد، الخضراء إبداع."],
["L10","","طلب قائد المجموعة: «لنعرض الأرقام والحقائق المتوفرة أولاً». القبعة المستخدمة:",["البيضاء","الزرقاء","الحمراء","السوداء"],"البيضاء للحقائق والمعلومات المحايدة. الزرقاء تنظم عملية التفكير."],
["L10","m","قالت طالبة: «لا أعرف السبب لكنني أشعر أن هذا الحل لا يريحني». القبعة:",["الحمراء","البيضاء","الصفراء","الزرقاء"],"المشاعر والحدس دون تبرير قبعة حمراء."],
["L10","","في نهاية النقاش قال المعلم: «لنلخص ما توصلنا إليه ونحدد الخطوة التالية». القبعة:",["الزرقاء","الخضراء","الصفراء","البيضاء"],"الزرقاء تضبط عملية التفكير وتنظمها وتلخص وتتخذ القرار."],
["L10","","القبعة الخضراء في نموذج ديبونو تمثل:",["الإبداع والبدائل والأفكار الجديدة","الحقائق والمعلومات","السلبيات والمخاطر","الإيجابيات والفوائد"],"الخضراء لون النمو: الإبداع والاقتراحات. البيضاء حقائق، السوداء مخاطر، الصفراء فوائد."],
["L10","","برنامج ديبونو لتعليم مهارات التفكير تعليماً مباشراً في وحدات (توسعة الإدراك، التنظيم، التفاعل، الإبداع…) يُسمى:",["كورت","4MAT","سكامبر","VARK"],"كورت برنامج ديبونو. 4MAT لمكارثي، سكامبر لتوليد الأفكار، VARK أنماط التعلم."],
["L10","","مهارات التفكير العليا في تصنيف بلوم المعدل هي:",["التحليل والتقويم والإبداع","التذكر والفهم والتطبيق","الفهم والتطبيق والتحليل","التذكر والتقويم والإبداع"],"المستويات العليا الثلاثة: تحليل، تقويم، إبداع. الدنيا: تذكر، فهم، تطبيق."],
["L10","m","طلب معلم من طلابه اختيار أفضل ثلاثة حلول من قائمة عشرين حلاً وتبرير الاختيار بمعايير. نوع التفكير:",["ناقد","إبداعي","تباعدي","حدسي"],"الفرز والمفاضلة والتقويم بمعايير تفكير ناقد (تقاربي). توليد العشرين كان إبداعياً تباعدياً."],
["L10","","التفكير الذي يُنتج إجابات متعددة لمشكلة واحدة، ويُعد أساس الإبداع عند جيلفورد:",["التباعدي","التقاربي","الناقد","الاستنباطي"],"التباعدي ينطلق إلى حلول متعددة، والتقاربي يصل إلى الحل الواحد الصحيح."],
["L10","m","أي أسئلة المعلم التالية أكثر تنمية للتفكير الإبداعي لدى طلاب الصف الخامس بعد قراءة قصة؟",["ماذا لو تغيرت نهاية القصة؟ اكتب نهاية أخرى","من بطل القصة؟","في أي زمن وقعت أحداث القصة؟","ما معنى الكلمة الواردة في السطر الثالث؟"],"السؤال المفتوح متعدد الإجابات (ماذا لو) يستدعي الطلاقة والأصالة. الأسئلة الأخرى استدعاء معلومات."],
["L10","","أي مما يلي ليس من معوقات التفكير الإبداعي؟",["تقبل الأفكار غير المألوفة","الخوف من الخطأ","النقد المبكر للأفكار","الجمود الذهني"],"تقبل الغريب من محفزات الإبداع. الخوف والنقد المبكر والجمود معوقات."],
["L10","","أي مما يلي لا يُعد من مكونات الذكاء الوجداني عند جولمان؟",["الاستدلال العددي","الوعي بالذات","التعاطف","تنظيم الانفعالات"],"الاستدلال العددي قدرة عقلية أولية عند ثيرستون. مكونات جولمان: الوعي بالذات، تنظيم الانفعالات، الدافعية، التعاطف، المهارات الاجتماعية."],
["L10","","يلاحظ المعلم أن طالباً يتوتر ويغضب بسرعة عند أي تعليق من زملائه ويصعب عليه فهم مشاعرهم. الجانب الذي يحتاج تنميته:",["الذكاء الوجداني","الذكاء المنطقي الرياضي","الطلاقة اللفظية","الذكاء المكاني"],"ضبط الانفعال والتعاطف من مكونات الذكاء الوجداني (جولمان)."]
]);

// ===================== L05: المهارات اللغوية =====================
// --- قطع الاستيعاب (6 قطع) ---
["L05","m","اقرأ النص ثم أجب: «تُعدّ المكتبة المدرسية قلب المدرسة النابض؛ فهي لا تقدّم الكتب فحسب، بل تفتح للطالب نافذة يطلّ منها على عوالم لم يعرفها. والطالب الذي يعتاد ارتيادها يكتسب حصيلة لغوية تظهر في كتابته وحديثه، ويتعلّم أن يبحث عن المعلومة بنفسه بدل أن ينتظرها جاهزة. ومن هنا كان تشجيع المعلم طلابه على زيارتها استثماراً لا تظهر ثماره في يوم واحد.» الفكرة الرئيسة في النص هي:",["أثر المكتبة المدرسية في بناء شخصية الطالب ولغته","طريقة تنظيم الكتب في المكتبة المدرسية","واجب المعلم في الإشراف على المكتبة","صعوبة البحث عن المعلومة في الكتب"],"النص كله يدور حول ما تمنحه المكتبة للطالب (اطلاع، لغة، بحث مستقل). تنظيم الكتب لم يُذكر، وتشجيع المعلم جزئية في الجملة الأخيرة لا فكرة النص كله."],
["L05","","في النص السابق عن المكتبة المدرسية، معنى كلمة «ارتيادها» كما وردت في السياق:",["التردد عليها","تنظيمها","شراء كتبها","قراءة فهارسها"],"ارتاد المكان: تردد عليه وقصده مراراً، ويؤيده السياق «الطالب الذي يعتاد». البدائل الأخرى لا يستقيم بها قوله «يعتاد ارتيادها»."],
["L05","m","يُستنتج من قول الكاتب «استثماراً لا تظهر ثماره في يوم واحد» أن أثر القراءة:",["يظهر على المدى البعيد بعد مواظبة","يظهر فور زيارة المكتبة","يقتصر على الحصيلة اللغوية","يعتمد على عدد الكتب في المكتبة"],"الاستثمار الذي لا تظهر ثماره في يوم واحد معناه أن أثره تراكمي بعيد المدى. البديل الثالث يناقض النص الذي ذكر أثراً في البحث أيضاً، والأخير لم يُذكر."],
["L05","m","اقرأ التعميم ثم أجب: «لاحظنا أن بعض الفصول تُترك مصابيحها مضاءة بعد انتهاء اليوم الدراسي، وهو هدر يسهل تلافيه. نرجو من كل معلم أن يتأكد قبل مغادرة الفصل من إطفاء الإنارة والتكييف، فالمحافظة على موارد المدرسة مسؤولية مشتركة، وما يُوفَّر اليوم يُنفَق غداً على ما ينفع الطلاب.» الغرض الرئيس من هذا التعميم:",["حث المعلمين على ترشيد استهلاك الكهرباء في الفصول","معاقبة المعلمين الذين يتركون المصابيح مضاءة","الإعلان عن مشروع جديد لتوفير موارد المدرسة","شرح طريقة إطفاء أجهزة التكييف"],"صيغة الرجاء «نرجو من كل معلم» وتعليل الفائدة تدل على الحث والتوجيه لا العقاب. ولم يُذكر مشروع ولا شرح لطريقة الإطفاء."],
["L05","","في التعميم السابق، معنى كلمة «تلافيه»:",["تجنّبه","تكراره","قياسه","تأجيله"],"تلافى الأمر: تداركه وتجنّبه، والسياق «هدر يسهل تلافيه» يقتضي معنى التجنب. التكرار عكس المراد."],
["L05","","في التعميم السابق، الضمير في كلمة «مصابيحها» يعود على:",["الفصول","المدرسة","الإنارة","المعلمين"],"الكلام عن «بعض الفصول تُترك مصابيحها» فالضمير يعود على الفصول، أقرب اسم يستقيم به المعنى. المدرسة لم تُذكر قبل الضمير."],
["L05","m","اقرأ النص ثم أجب: «حين تواجه خلية النحل خطراً لا تتصرف كل نحلة وحدها، بل تتوزع الأدوار في لحظات: فريق يحرس المدخل، وفريق يحيط بالملكة، وفريق يواصل العمل كأن شيئاً لم يكن. ولعل في هذا درساً للإنسان؛ فالجماعة التي يعرف كل فرد فيها دوره تتجاوز الأزمات بأقل الخسائر.» الفكرة الرئيسة في النص:",["توزيع الأدوار سرّ تجاوز الجماعة للأزمات","حراسة النحل لمدخل الخلية","أهمية ملكة النحل في الخلية","كثرة الأخطار التي تواجه النحل"],"النص يبدأ بالنحل مثالاً وينتهي بالعبرة للإنسان: الجماعة التي تتوزع أدوارها تتجاوز الأزمات. حراسة المدخل والملكة تفاصيل فرعية."],
["L05","","غرض الكاتب من ذكر خلية النحل في النص السابق:",["ضرب مثال يُستفاد منه في حياة الإنسان","وصف حياة النحل وصفاً علمياً دقيقاً","التحذير من خطر النحل على الإنسان","المقارنة بين النحل والنمل"],"قوله «ولعل في هذا درساً للإنسان» يكشف أن النحل مثال للعبرة (التمثيل). الوصف العلمي ليس غاية النص، والتحذير والمقارنة لم يردا."],
["L05","","في النص السابق، معنى «يواصل» في قوله «فريق يواصل العمل»:",["يستمر في","يتوقف عن","يؤجل","يراقب"],"واصل العمل: استمر فيه دون انقطاع، ويؤيده «كأن شيئاً لم يكن». التوقف ضده."],
["L05","m","اقرأ النص ثم أجب: «لم تعد الشاشة في الصف أداة عرض فحسب؛ فقد صارت وسيلة يستقصي بها الطالب ويقارن ويناقش. غير أن التقنية وحدها لا تصنع تعلّماً؛ فالمعلم الذي يعرض مقطعاً ثم ينتقل إلى الدرس التالي دون سؤال أو نقاش لم يستفد منها شيئاً. القيمة ليست في الجهاز، بل فيما يصنعه المعلم به.» الفكرة الرئيسة في النص:",["قيمة التقنية في طريقة توظيف المعلم لها","الشاشة أفضل وسيلة تعليمية","عرض المقاطع يغني عن شرح المعلم","التقنية تضر بالتعلم"],"الجملة الأخيرة تلخص النص: القيمة فيما يصنعه المعلم بالجهاز. البديل الثالث يناقض النص، والرابع مبالغة لم يقلها الكاتب."],
["L05","","يُفهم من النص السابق أن المعلم الذي يعرض المقطع ثم ينتقل إلى الدرس التالي مباشرة:",["لم يوظف التقنية توظيفاً صحيحاً","وفّر وقت الحصة بذكاء","أتاح للطلاب الاستقصاء والمقارنة","اعتمد التعلم الذاتي"],"النص يقول عنه صراحة «لم يستفد منها شيئاً» لأنه عرض بلا سؤال ولا نقاش. البديل الثالث هو ما كان ينبغي أن يحدث ولم يحدث."],
["L05","","معنى «يستقصي» في النص السابق:",["يبحث ويتتبع","يلهو ويلعب","يحفظ ويكرر","يستمع بصمت"],"استقصى الأمر: بلغ أقصاه بحثاً وتتبعاً، ويناسبه ما بعده «ويقارن ويناقش». الحفظ والاستماع الصامت لا يناسبان سياق البحث النشط."],
["L05","m","اقرأ النص ثم أجب: «يُروى أن رجلاً شكا إلى حكيم قلة ما يحفظ، فسأله الحكيم: أتراجع ما تقرأ؟ قال: لا. قال: فكيف تطلب من الذاكرة أن تحتفظ بما لم تُعِدْه إليها؟ إن الحفظ كالزرع، لا يكفي أن تبذر، بل لا بد أن تسقي وتتعهّد؛ وإلا ذبل ما غرست.» الفكرة الرئيسة في النص:",["المراجعة شرط لثبات الحفظ","الحكماء أقدر الناس على الحفظ","الزراعة تحتاج إلى سقي","ضعف الذاكرة مرض لا علاج له"],"الحكيم أرجع ضعف الحفظ إلى ترك المراجعة، وشبّه الحفظ بالزرع ليوضح ذلك. السقي تفصيل في التشبيه لا فكرة النص."],
["L05","","في النص السابق، معنى «تتعهّد» في قوله «لا بد أن تسقي وتتعهّد»:",["ترعى وتتابع","تقطع وتحصد","تبيع وتشتري","تترك وتهمل"],"تعهّد الزرع: تفقده ورعاه مرة بعد مرة، وهو المناسب لسياق السقي. الترك والإهمال نقيضه."],
["L05","","الأسلوب الذي استخدمه الحكيم لتقريب فكرته في قوله «إن الحفظ كالزرع»:",["التشبيه","الاستفهام","القسم","النداء"],"شبّه الحفظ بالزرع بأداة التشبيه الكاف، ثم فصّل وجه الشبه. الاستفهام ورد قبل ذلك في «أتراجع ما تقرأ؟» لا في هذه الجملة."],
["L05","m","اقرأ النص ثم أجب: «قرأ أحد الطلاب في كتاب أن النوم أقل من ست ساعات يضعف التركيز، فقرر أن ينام مبكراً أسبوعاً كاملاً ليختبر الأمر. وفي نهاية الأسبوع لاحظ أنه يحل المسائل أسرع ويخطئ أقل. لم يكتفِ الطالب بقراءة المعلومة، بل جرّبها، وهذا ما يفرّق بين من يعرف ومن يتعلّم.» الفكرة الرئيسة في النص:",["التجربة تحوّل المعرفة إلى تعلّم حقيقي","النوم المبكر يحسن التركيز","قراءة الكتب أهم من التجربة","حل المسائل يحتاج إلى سرعة"],"الجملة الختامية «وهذا ما يفرّق بين من يعرف ومن يتعلّم» تحدد الفكرة: التجربة لا مجرد المعرفة. النوم والتركيز مثال تفصيلي، والبديل الثالث يناقض النص."],
["L05","","يدل قول الكاتب «وهذا ما يفرّق بين من يعرف ومن يتعلّم» على أن المتعلم الحقيقي هو من:",["يطبّق ما يعرفه ويختبره","يحفظ المعلومات ويكررها","يقرأ أكثر من كتاب","ينام ست ساعات يومياً"],"الفرق الذي قصده الكاتب أن الطالب لم يكتفِ بالمعرفة بل جرّبها، فالتعلم عنده تطبيق واختبار. الحفظ وكثرة القراءة من باب المعرفة لا التعلّم بمفهوم النص."],

// --- الإملاء: الضاد والظاء، الهمزات، التاء، الألف اللينة، الأخطاء الشائعة ---
["L05","hm","الكلمة التي كُتبت خطأً فيما يأتي:",["الانظباط","الظلم","النظام","الظاهرة"],"الصواب «الانضباط» بالضاد؛ أما الظلم والنظام والظاهرة فبالظاء. سؤال متكرر في الملخصات المتداولة، ومفتاحه الانظباط."],
["L05","h","الجملة التي كُتبت فيها الضاد والظاء كتابة صحيحة:",["في الظلام تضيق الرؤية وتتسع الأفكار.","خير الوعظ ما كان ضاهره العتاب.","أضعف الناس من أفشى سره وأظاع أمره.","الظابط يحافظ على النظام في الملعب."],"الظلام وتضيق صحيحتان. أخطاء البدائل: ضاهره (الصواب ظاهره)، أظاع (الصواب أضاع)، الظابط (الصواب الضابط)."],
["L05","m","لاحظ معلم أن طالباً كتب «أنا استغفر الله» فصحح له الهمزة؛ سبب التصحيح أن الفعل «أستغفر»:",["مضارع للمتكلم فهمزته همزة قطع","أمر من السداسي فهمزته همزة وصل","مصدر سداسي فهمزته همزة وصل","ماضٍ سداسي فهمزته همزة وصل"],"المضارع المسند إلى المتكلم (أستغفر، أكتب) همزته قطع تُرسم فوق الألف. أما الماضي والأمر والمصدر من السداسي (استغفر، استغفِر، استغفار) فهمزتها وصل."],
["L05","h","الكلمة التي رُسمت همزتها رسماً خاطئاً فيما يأتي:",["إهتم","أُعطِي","انطلق","استخدم"],"«اهتم» ماضٍ خماسي فهمزته وصل لا تُرسم تحت الألف. أما «أُعطي» فماضٍ رباعي مبني للمجهول همزته قطع رُسمت صحيحة، و«انطلق» و«استخدم» همزتاهما وصل كُتبتا صحيحاً."],
["L05","h","«أذهب إلى مكة لأداء العمرة»، الكلمات التي اشتملت على همزة قطع:",["أذهب، إلى، أداء","أذهب، أداء، العمرة","أذهب، إلى، العمرة","إلى، أداء، العمرة"],"أذهب مضارع للمتكلم، وإلى حرف، وأداء مصدر الرباعي (أدّى) — كلها قطع. «العمرة» همزتها همزة «ال» وهي وصل."],
["L05","h","«أترغب في السفر مع ابن عمك إلى المدينة؟»، الكلمة التي بدأت بهمزة قطع:",["أترغب","ابن","السفر","المدينة"],"همزة الاستفهام في «أترغب» قطع تُنطق دائماً. «ابن» من الأسماء العشرة همزتها وصل، والسفر والمدينة همزتهما همزة «ال» وهي وصل."],
["L05","","أراد معلم أن يعلّم طلابه طريقة سريعة للتمييز بين همزتي الوصل والقطع؛ الطريقة الأنسب:",["إدخال الواو أو الفاء قبل الكلمة ونطقها؛ فإن بقيت الهمزة فهي قطع","عدّ حروف الكلمة؛ فالثلاثي قطع وغيره وصل","النظر إلى آخر الكلمة؛ فإن كان منوّناً فهي قطع","النظر إلى نوع الكلمة؛ فالأسماء كلها قطع والأفعال كلها وصل"],"الاختبار المعتمد: الواو أو الفاء (وَأكرم تبقى الهمزة = قطع، فانطلق تسقط = وصل). عدّ الحروف غير دقيق لأن الرباعي قطع والخماسي وصل، والأسماء العشرة وصل."],
["L05","hm","«المؤمن القوي خير من المؤمن الضعيف»، رُسمت الهمزة في «المؤمن» على الواو لأنها:",["ساكنة وما قبلها مضموم","مضمومة وما قبلها ساكن","مفتوحة وما قبلها مضموم","مكسورة وما قبلها مضموم"],"في «مُؤْمن» الهمزة ساكنة والميم قبلها مضمومة، وأقوى الحركتين الضمة فتُرسم على واو. ونفس القاعدة في «مسؤول»: مضمومة وما قبلها ساكن."],
["L05","h","رُسمت الهمزة في كلمة «بائس» على الياء لأنها:",["مكسورة وما قبلها ساكن","ساكنة وما قبلها مكسور","مفتوحة وما قبلها مكسور","مكسورة وما قبلها مفتوح"],"في «بائِس» الهمزة مكسورة وقبلها ألف ساكنة؛ الكسرة أقوى الحركات فتُرسم الهمزة على ياء. وكذلك «عائد» و«قائل»."],
["L05","h","الكلمة الصحيحة إملائياً:",["القارئون","القارؤون","القارءون","القارأون"],"الهمزة في «القارئون» مكسورة وما قبلها ألف ساكنة فتُرسم على ياء. ولا تُرسم على الواو لأن الهمزة ليست مضمومة ولا ما قبلها مضموم."],
["L05","","الكلمة التي رُسمت همزتها المتطرفة رسماً صحيحاً:",["شاطئ","يقرؤ","يصدؤ","ضوأ"],"المتطرفة تتبع حركة ما قبلها: شاطِئ (مكسور → ياء). الصواب في الأخرى: يقرأ ويصدأ (ما قبلها مفتوح → ألف)، ضوء (ما قبلها ساكن → على السطر)."],
["L05","hm","الكتابة الصحيحة للجملة:",["شربتُ ماءً بارداً.","شربتُ ماءاً بارداً.","شربتُ مائاً بارداً.","شربتُ ماءً باردن."],"الهمزة المتطرفة المسبوقة بألف لا تُزاد بعدها ألف التنوين (ماءً، سماءً، جزاءً). و«باردن» رسم للتنوين نوناً وهو خطأ شائع."],
["L05","h","أي الجمل الآتية كُتبت كتابة صحيحة؟",["ذهبت سميرة إلى السوق مع أحمد وأخته.","ذهبت سميره إلى السوق مع أحمد وأختة.","ذهبت سميره إلى السوق مع أحمد وأخته.","ذهبت سميرة إلى السوق مع أحمد وأختة."],"«سميرة» تاء مربوطة تُنطق تاءً عند الوصل، و«أخته» هاء ضمير تُنطق هاءً دائماً. الخطأ الشائع قلب التاء المربوطة هاءً والعكس."],
["L05","h","الكتابة الصحيحة للتاء في الكلمتين:",["فتاةٌ، شتاتٌ","فتاتٌ، شتاتٌ","فتاتٌ، شتاةٌ","فتاةٌ، شتاةٌ"],"فتاة اسم مفرد مؤنث يُوقف عليه بالهاء فتاؤه مربوطة، وشتات تُنطق تاؤه في الوقف والوصل فهي مفتوحة."],
["L05","hm","الجملة التي كُتبت فيها الألف اللينة كتابة صحيحة:",["يسعى الحاج بين الصفا والمروة.","يسعا الحاج بين الصفا والمروة.","يسعى الحاج بين الصفى والمروة.","يسعي الحاج بين الصفا والمروه."],"يسعى: ألفه عن ياء (سعى / يسعى) فتُكتب ياءً غير منقوطة؛ الصفا: ألفه عن واو (صفوان) فقائمة؛ المروة بتاء مربوطة."],
["L05","h","الكتابة الصحيحة للفعل الماضي من «يدعو» و«يهدي»:",["دعا، هدى","دعى، هدى","دعا، هدا","دعى، هدا"],"ألف الثلاثي تتبع أصلها: دعا أصلها واو (يدعو) فتُكتب قائمة، وهدى أصلها ياء (يهدي) فتُكتب على صورة الياء."],
["L05","h","أصل الألف في الفعل «دنا»:",["الواو","الياء","الألف","الهمزة"],"مضارعه «يدنو» فالألف منقلبة عن واو ولذلك كُتبت قائمة. لو كان أصلها ياء لكُتبت «دنى» كما في «رمى / يرمي»."],
["L05","hm","تقول لمن دعاك إلى زيارته:",["آتيك إن شاء الله.","آتيك إنشاء الله.","آتيك إن شاءالله.","أتيك إن شاء الله."],"«إن شاء الله» ثلاث كلمات: إن الشرطية وفعلها شاء ولفظ الجلالة؛ وكتابتها «إنشاء» تقلب المعنى إلى الخلق والإيجاد. و«آتيك» بالمد لأنها مضارع (أأتي)."],
["L05","h","«القهوة نافعةٌ ...... الإكثار منها ضارٌّ»، الكلمة الصحيحة في الفراغ:",["لكنَّ","لاكنَّ","لاكن","لكين"],"تُكتب «لكن» بلا ألف بعد اللام وإن نُطقت ممدودة، مثل «هذا» و«هؤلاء» و«ذلك»؛ زيادة الألف من الأخطاء الشائعة."],
["L05","h","«بما تأمل أن أساعدك يا صديقي؟»، في الجملة خطأ إملائي صوابه:",["بِمَ","أن أساعدك","يا صديقي","تأمل"],"«ما» الاستفهامية تُحذف ألفها إذا سبقها حرف جر: بِمَ، فيمَ، عمَّ، لِمَ. أما «بما» فللموصولة (بما تحب)."],
["L05","h","«...... المدرسة متعاونون»، الكلمة الصحيحة في الفراغ:",["معلمو","معلموا","معلمون","معلمين"],"جمع المذكر السالم المضاف تُحذف نونه ولا تُزاد بعد واوه ألف (معلمو المدرسة). الألف بعد الواو تُثبت في الأفعال فقط (ذهبوا)."],
["L05","h","الكتابة الصحيحة للجملة:",["الحسن والحسين ابنا عليّ.","الحسن والحسين بنا عليّ.","الحسن والحسين إبنا عليّ.","الحسن والحسين أبنا عليّ."],"ألف «ابن» تثبت في المثنى (ابنا) وتُحذف فقط إذا وقع المفرد بين علمين أولهما مضاف للثاني (الحسن بن علي). وهمزتها وصل لا قطع."],
["L05","h","«...... زيدٌ السهمَ رمياً سليماً فأخطأ الهدف»، الفعل الصحيح في الفراغ:",["لم يرمِ","لم يرمي","لم يرمى","لم يرمِي"],"المضارع المعتل الآخر بالياء يُجزم بحذف حرف العلة بعد «لم» ويُكتفى بالكسرة: لم يرمِ، لم يقضِ، لم يدعُ، لم يسعَ."],

// --- علامات الترقيم ---
["L05","h","«أيها الطالب ...... اجتهد»، علامة الترقيم المناسبة مكان النقاط:",["،","؛",":","!"],"الفاصلة توضع بعد المنادى (يا خالد، اجتهد). الفاصلة المنقوطة للسبب والنتيجة، والنقطتان بعد القول والتقسيم."],
["L05","hm","«جاهدتُ في سبيل الله ...... لأنال الأجر»، علامة الترقيم المناسبة:",["؛","،",":","."],"الجملة الثانية سبب أو غاية للأولى، وهذا موضع الفاصلة المنقوطة (اجتهدتُ؛ لأتفوق). الفاصلة العادية بين الجمل القصيرة المتعاطفة."],
["L05","h","«الكلمة ثلاثة أقسام ...... اسم، وفعل، وحرف»، علامة الترقيم المناسبة:",[":","؛","-","!"],"النقطتان الرأسيتان توضعان بين الشيء وأقسامه، وبعد القول، وقبل التمثيل والتعريف."],
["L05","h","«ما أجمل سماء وطننا في الليل ......»، علامة الترقيم المناسبة:",["!","؟",".","،"],"الجملة تعجبية (ما أفعلَه) فتُختم بعلامة التأثر (!). علامة الاستفهام للسؤال، وهذه ليست سؤالاً وإن بدأت بـ«ما»."],
["L05","hm","«أرسل رسول الله ﷺ رسالة إلى كسرى ...... ملك الفرس ...... يدعوه إلى الإسلام»، علامتا الترقيم المناسبتان:",["- -","، ،","( )","« »"],"«ملك الفرس» جملة اعتراضية تُحصر بين شرطتين. القوسان لشرح كلمة أو رقم، وعلامتا التنصيص للكلام المنقول بنصه."],
["L05","h","«هل جاء محمد ...... ما أروع قدومه ......»، علامتا الترقيم المناسبتان على الترتيب:",["؟ !","! ؟","؟ .",". !"],"الأولى جملة استفهامية تُختم بعلامة الاستفهام، والثانية تعجبية تُختم بعلامة التأثر."],
["L05","","«قال المعلم لطلابه ...... من جدّ وجد»، علامة الترقيم المناسبة بعد كلمة «لطلابه»:",[":","؛","،","-"],"النقطتان توضعان بعد القول ومشتقاته (قال، يقول، قائلاً) قبل المقول. الفاصلة المنقوطة للسبب، والشرطة بين العدد والمعدود."],

// --- النحو: الكلمة والجملة والأركان ---
["L05","h","(هو، كتب، عن)، تُصنّف هذه الكلمات حسب نوعها على الترتيب:",["اسم، فعل، حرف","فعل، اسم، حرف","حرف، اسم، فعل","اسم، حرف، فعل"],"«هو» ضمير وهو اسم، و«كتب» فعل ماضٍ يدل على حدث وزمن، و«عن» حرف جر لا يظهر معناه إلا مع غيره."],
["L05","h","الكلمات الآتية أسماء ما عدا:",["ثم","نحن","الذي","هذا"],"«ثم» حرف عطف. أما نحن (ضمير) والذي (اسم موصول) وهذا (اسم إشارة) فأسماء مبنية."],
["L05","hm","المجموعة التي كل مفرداتها مصادر:",["هروب، نشاط","سباق، اندفع","تقع، رجوع","استفاق، استعمال"],"هروب ونشاط اسمان يدلان على الحدث بلا زمن. أما اندفع وتقع واستفاق فأفعال، والمجموعات الأخرى خُلط فيها فعل بمصدر."],
["L05","","مصدر الفعل «استغفر»:",["استغفار","غفران","مغفرة","استغفر"],"مصدر السداسي (استفعل) على وزن استفعال: استغفر → استغفار، استخرج → استخراج. غفران ومغفرة مصدران للثلاثي «غفر»."],
["L05","h","الجملة الاسمية فيما يأتي:",["الظلم مرتعه وخيم.","ينعم المحسنون في الجنة.","خالق الناس بخلق حسن.","اتق الله حيثما كنت."],"الجملة الاسمية ما بدأت باسم: «الظلم» مبتدأ. والبدائل تبدأ بأفعال: ينعم مضارع، وخالق واتق فعلا أمر."],
["L05","h","«الرأي الواحد خطؤه محتمل»، الخبر في الجملة:",["خطؤه محتمل","الواحد","خطؤه","محتمل"],"المبتدأ «الرأي» وخبره الجملة الاسمية «خطؤه محتمل» التي فيها ضمير يعود عليه. و«الواحد» نعت، و«خطؤه» مبتدأ ثانٍ، و«محتمل» خبره."],
["L05","h","«الطالب المخلص في دروسه محبوب»، نوع خبر المبتدأ:",["مفرد","جملة فعلية","جملة اسمية","شبه جملة"],"الخبر «محبوب» كلمة واحدة ليست جملة ولا شبه جملة فهو خبر مفرد. أما «في دروسه» فمتعلق بالنعت «المخلص» لا خبر."],
["L05","hm","«النجم ساطعٌ»، عند إدخال «كان» على الجملة تصبح:",["كان النجمُ ساطعاً","كان النجمُ ساطعٌ","كان النجمَ ساطعاً","كان النجمَ ساطعٌ"],"كان ترفع المبتدأ اسماً لها وتنصب الخبر: النجمُ اسمها مرفوع، ساطعاً خبرها منصوب."],
["L05","h","«إنَّ الأمطارَ غزيرةٌ»، عند دخول «ما» الزائدة على «إنَّ» تصبح الجملة:",["إنما الأمطارُ غزيرةٌ","إنما الأمطارَ غزيرةٌ","إنما الأمطارُ غزيرةً","إنما الأمطارَ غزيرةً"],"«ما» الزائدة تكفّ «إنّ» عن العمل فيعود المبتدأ والخبر مرفوعين. وتبقى «ليت» وحدها يجوز إعمالها مع «ما»."],
["L05","h","«الكذب مهلك»، عند وضع «وجدتُ» في أول الجملة يصبح الضبط الصحيح:",["وجدتُ الكذبَ مهلكاً.","وجدتُ الكذبُ مهلكاً.","وجدتُ الكذبَ مهلكٌ.","وجدتُ الكذبُ مهلكٌ."],"«وجد» من أفعال اليقين (ظن وأخواتها) تنصب مفعولين أصلهما المبتدأ والخبر: الكذبَ مفعول أول، مهلكاً مفعول ثانٍ."],
["L05","h","قال تعالى: «إنا سنلقي عليك قولاً ثقيلاً»، كُسرت همزة «إنّ» لأنها وقعت:",["في بداية الجملة","جواباً للقسم","مصدراً مؤولاً وقع مبتدأ","جواباً للشرط"],"من مواضع كسر همزة إنّ: أول الكلام، وبعد القول، وبعد حيث وإذ. وتُفتح إذا صح تأويلها بمصدر (علمتُ أنك ناجح)."],
["L05","h","«عسى اللهُ أن يأتي بالفتح»، الفعل «عسى» يفيد:",["الرجاء","الشروع","المقاربة","اليقين"],"عسى وحرى واخلولق أفعال رجاء؛ كاد وأوشك للمقاربة؛ أخذ وشرع وطفق للشروع."],
["L05","h","(يترك، قرّر، اسجدي)، الأفعال السابقة من حيث الزمن على الترتيب:",["مضارع، ماضٍ، أمر","ماضٍ، أمر، مضارع","أمر، ماضٍ، مضارع","مضارع، أمر، ماضٍ"],"يترك يبدأ بحرف المضارعة، وقرّر دل على حدث مضى، واسجدي طلب موجه للمخاطبة."],
["L05","hm","«انكسر الزجاجُ أمام الجميع»، الفاعل في الجملة:",["الزجاج","ضمير مستتر","أمام","الجميع"],"الفاعل اسم مرفوع يدل على من قام بالفعل أو اتصف به؛ والزجاج هو الذي اتصف بالانكسار. وجود ضمير مستتر خطأ لأن الفاعل ظاهر، و«الجميع» مضاف إليه."],
["L05","h","«حُفظَ القرآنُ من التحريف»، إعراب كلمة «القرآن»:",["نائب فاعل مرفوع","فاعل مرفوع","مفعول به منصوب","مضاف إليه مجرور"],"الفعل «حُفظ» مبني للمجهول فحُذف فاعله وحلّ المفعول به محله نائب فاعل مرفوع بالضمة."],
["L05","h","«يفهم الطالبُ الدرسَ»، عند بناء الجملة للمجهول يصبح الضبط الصحيح:",["يُفهَمُ الدرسُ.","يَفهَمُ الدرسُ.","يُفهَمُ الدرسَ.","الطالبُ يُفهَمُ الدرسَ."],"المضارع يُبنى للمجهول بضم أوله وفتح ما قبل آخره (يُفهَم)، ويُحذف الفاعل ويصير المفعول به نائب فاعل مرفوعاً (الدرسُ)."],
["L05","h","قال تعالى: «كُتب عليكم القتالُ وهو كره لكم»، نائب الفاعل في الآية:",["القتال","عليكم","هو","كره"],"«كُتب» مبني للمجهول ونائب فاعله «القتال» مرفوع بالضمة. «عليكم» جار ومجرور، و«هو» مبتدأ، و«كره» خبره."],
["L05","h","قال تعالى: «لم يلد ولم يولد»، الضبط الصحيح للفعل «يلد»:",["يلدْ","يلدُ","يلدَ","يلدِ"],"«لم» حرف جزم فالمضارع بعدها مجزوم بالسكون. الضم للرفع، والفتح للنصب بعد أن ولن وكي."],
["L05","hm","قال تعالى: «ولن تستطيعوا أن تعدلوا بين النساء»، الفعل «تستطيعوا» مضارع:",["منصوب بحذف النون","مجزوم بحذف النون","مرفوع بثبوت النون","منصوب بالفتحة"],"«لن» حرف نصب، والفعل من الأفعال الخمسة (اتصلت به واو الجماعة) فعلامة نصبه حذف النون. لو كان بعد «لم» لكان مجزوماً بحذف النون."],
["L05","h","قال تعالى: «واتقوا يوماً تُرجعون فيه إلى الله»، الفعل «ترجعون» مرفوع بـ:",["ثبوت النون","الضمة","الواو","الألف"],"ترجعون من الأفعال الخمسة لأنه مضارع اتصلت به واو الجماعة، ولم يسبقه ناصب ولا جازم فهو مرفوع بثبوت النون."],

// --- المنصوبات والتوابع والعدد ---
["L05","h","«اجتهد الطالب رغبةً في النجاح»، المفعول لأجله في الجملة:",["رغبةً","الطالب","النجاح","في النجاح"],"«رغبةً» مصدر منصوب يبين سبب الاجتهاد فهو مفعول لأجله. الطالب فاعل، والنجاح اسم مجرور."],
["L05","h","«ابتهجت روحي برؤية البحر ابتهاجاً»، إعراب كلمة «ابتهاجاً»:",["مفعول مطلق منصوب","مفعول به منصوب","مفعول لأجله منصوب","مفعول معه منصوب"],"«ابتهاجاً» مصدر من لفظ الفعل «ابتهجت» جاء لتوكيده فهو مفعول مطلق. المفعول لأجله يبين السبب وليس من لفظ الفعل."],
["L05","hm","الجملة الصحيحة فيما يأتي:",["انطلق المتسابقون مسرعين.","انطلق المتسابقون مسرعون.","انطلق المتسابقين مسرعون.","انطلق المتسابقين مسرعين."],"المتسابقون فاعل مرفوع بالواو (جمع مذكر سالم)، ومسرعين حال منصوبة بالياء تبين هيئة الفاعل."],
["L05","h","«حضر المعلمون جميعاً»، إعراب كلمة «جميعاً»:",["حال منصوبة","توكيد معنوي","مفعول به","نعت"],"«جميعاً» من الكلمات التي تُعرب حالاً دائماً (معاً، وحده، عمداً). ولو قيل «جميعُهم» بالإضافة إلى الضمير لكانت توكيداً معنوياً."],
["L05","h","قال تعالى: «فسجد الملائكة كلهم»، نوع التوكيد في الآية:",["معنوي","لفظي","سببي","حقيقي"],"التوكيد المعنوي يكون بألفاظ مخصوصة (نفس، عين، كل، جميع، كلا، كلتا) مضافة إلى ضمير يطابق المؤكَّد. اللفظي تكرار اللفظ نفسه."],
["L05","h","«قرأتُ السورةَ نصفَها»، نوع البدل في الجملة:",["بدل بعض من كل","بدل مطابق","بدل اشتمال","بدل كل من كل"],"النصف جزء حقيقي من السورة فهو بدل بعض من كل. المطابق يكون البدل فيه عين المبدل منه (الفاروق عمر)، والاشتمال معنى في المبدل منه (أعجبتني القصةُ فكرتُها)."],
["L05","","أي الموضوعات الآتية لا يُعد من التوابع؟",["التمييز","النعت","البدل","التوكيد"],"التوابع أربعة: النعت والتوكيد والبدل والعطف، تتبع ما قبلها في الإعراب. أما التمييز فاسم نكرة منصوب يفسر مبهماً وليس تابعاً."],
["L05","h","«في الفصل ثلاثون ......»، الكلمة الصحيحة في الفراغ:",["طالباً","طالبٌ","طلاباً","طلابٍ"],"تمييز ألفاظ العقود والأعداد من 11 إلى 99 مفرد منصوب (ثلاثون طالباً). الجمع المجرور تمييز الأعداد من 3 إلى 10 (ثلاثة طلابٍ)."],
["L05","hm","«في المدرسة ...... قاعةً، يقوم بالتدريس فيها ...... معلماً»، العددان الصحيحان على الترتيب:",["ثلاث عشرة - ثلاثة عشر","ثلاثة عشر - ثلاث عشرة","ثلاثة عشرة - ثلاث عشر","ثلاث عشر - ثلاثة عشرة"],"في العدد المركب (13–19) الجزء الأول يخالف المعدود والثاني يطابقه: قاعة مؤنث → ثلاث عشرة، معلم مذكر → ثلاثة عشر."],
["L05","h","«حفظ أحمد من القصيدة عشرين ......»، الكلمة الصحيحة في الفراغ:",["بيتاً","أبياتاً","بيتٍ","أبياتٍ"],"ألفاظ العقود (عشرون، ثلاثون…) تمييزها مفرد منصوب: عشرين بيتاً. والجمع المجرور لتمييز 3–10 (ثلاثة أبياتٍ)."],
["L05","h","«جاء ...... العلمِ»، الكلمة الصحيحة في الفراغ:",["طالبا","طالبان","طالبين","طالبي"],"الفاعل مثنى مرفوع بالألف، ونون المثنى تُحذف عند الإضافة: طالبا العلم. و«طالبان» تصح لو لم يُضف."],
["L05","hm","«حكم القاضي على ......»، الكلمة الصحيحة في الفراغ:",["المجرمينَ","المجرمونَ","المجرمانِ","المجرمينُ"],"الاسم بعد حرف الجر «على» مجرور، وجمع المذكر السالم يُجر بالياء: المجرمينَ. «المجرمون» للرفع فقط."],
["L05","h","«كرّمت المديرةُ المجتهداتِ»، علامة نصب كلمة «المجتهدات»:",["الكسرة","الفتحة","الضمة","الياء"],"جمع المؤنث السالم يُنصب بالكسرة نيابة عن الفتحة؛ فهو مفعول به منصوب وعلامة نصبه الكسرة."],
["L05","","«سلّمتُ على ...... قبل سفره»، الكلمة الصحيحة في الفراغ:",["أبيك","أبوك","أباك","أبك"],"«أب» من الأسماء الخمسة، وهو هنا مجرور بـ«على» ومضاف إلى الكاف فيُجر بالياء: أبيك. أبوك للرفع وأباك للنصب."],
["L05","m","«صلّيتُ في مساجدَ كثيرةٍ»، جُرّت كلمة «مساجد» بالفتحة لأنها:",["ممنوعة من الصرف (صيغة منتهى الجموع)","جمع مؤنث سالم","جمع مذكر سالم","اسم مقصور"],"مساجد على صيغة منتهى الجموع (مفاعل) فهي ممنوعة من الصرف: لا تُنوّن وتُجر بالفتحة ما لم تُضف أو تدخلها أل (في المساجدِ)."],
["L05","hm","«الأمهات ...... يربّين أولادهن على الفضيلة محترمات»، الاسم الموصول المناسب في الفراغ:",["اللائي","الذين","اللذان","اللتان"],"الموصول يطابق ما قبله في النوع والعدد: الأمهات جمع إناث فيناسبه «اللائي» أو «اللاتي». الذين لجمع الذكور، واللذان واللتان للمثنى."],
["L05","","«مَن يذاكرْ ينجحْ»، سبب جزم الفعلين «يذاكر» و«ينجح»:",["لأن «من» اسم شرط جازم جزم فعل الشرط وجوابه","لأن «من» اسم استفهام","لأنهما سُبقا بـ«لم» محذوفة","لأنهما فعلا أمر"],"«من» هنا اسم شرط جازم (مثل إنْ ومهما ومتى) يجزم فعل الشرط «يذاكر» وجوابه «ينجح». ولو كانت للاستفهام لرُفع الفعل بعدها."],
["L05","h","«هيا خالد، أطع والديك»، نوع الأسلوب:",["نداء","تعجب","استفهام","شرط"],"«هيا» من حروف النداء (يا، أيا، هيا، أي، الهمزة) و«خالد» منادى. التعجب بصيغة ما أفعله، والاستفهام بأداة استفهام."],
["L05","h","«ما أروعَ كتابَ الله!»، نوع الأسلوب:",["تعجب","استفهام","نفي","استثناء"],"«ما أفعلَ» صيغة التعجب القياسية الأولى (والثانية أفعِلْ به)، وتُختم بعلامة التأثر. «ما» هنا تعجبية لا استفهامية ولا نافية."],
["L05","h","«ألم تسافر إلى مكة؟»، الإجابة الصحيحة في حالة الإثبات:",["بلى، سافرتُ إلى مكة","نعم، سافرتُ إلى مكة","نعم، لم أسافر إلى مكة","لا، سافرتُ إلى مكة"],"الاستفهام المنفي يُجاب عنه في الإثبات بـ«بلى» مع حذف النفي، وفي النفي بـ«نعم» مع إثباته (نعم، لم أسافر)."],
["L05","h","درج الناس على قولهم «ضرب أخماساً بأسداس» ويقصدون أنه:",["احتار في أمر وأعمل فكره فيه","أراد الأمر كله","اختلف مع غيره","ناضل من أجل شيء"],"المثل يُقال لمن يفكر ويدبّر ويحتار في أمر؛ ورد في الملخصات المتداولة بهذا المفتاح."],
["L05","h","قال تعالى: «قل أرأيتم إن أصبح ماؤكم غوراً فمن يأتيكم بماء معين»، معنى «غوراً»:",["ذاهباً في أعماق الأرض","قليلاً جارياً على السطح","مالحاً لا يُشرب","راكداً في الحوض"],"غار الماء: ذهب في الأرض وغاب، فـ«غوراً» أي غائراً ذاهباً في أعماقها. ويقابله «معين» أي ظاهر جارٍ."],
["L05","m","طُلب من معلم كتابة خطاب إلى مدير المدرسة لطلب إجازة؛ الترتيب الصحيح لعناصر الخطاب الإداري:",["المرسَل إليه بصفته، التحية، الموضوع باختصار، الخاتمة، الاسم والتوقيع","الموضوع، الاسم والتوقيع، المرسَل إليه، التحية","التحية، الاسم والتوقيع، الموضوع، المرسَل إليه","الموضوع مفصلاً، التحية، الاسم، المرسَل إليه"],"الخطاب الإداري كتابة وظيفية تبدأ بالبسملة والمرسل إليه بصفته (سعادة مدير المدرسة)، ثم التحية (وبعد:)، ثم الموضوع موجزاً مباشراً، ثم الخاتمة (وتقبلوا فائق التقدير)، ثم الاسم والتوقيع والتاريخ."],
["L05","m","الجملة الأسلم تعبيراً فيما يأتي:",["شرح المعلمُ الدرسَ بوضوح.","قام المعلم بعملية شرح الدرس بشكل واضح.","المعلم قام بالشرح للدرس بوضوح.","تم من قبل المعلم شرح الدرس بوضوح."],"التعبير السليم يبدأ بالفعل مباشرة ويتجنب الحشو («قام بعملية»، «بشكل»، «تم من قبل») وهي تراكيب ركيكة شائعة في الكتابة الإدارية."],
["L05","","الجملة التي خلت من الحشو والتكرار:",["صعد الطالب الدرج.","صعد الطالب الدرج إلى أعلى.","نزل الطالب الدرج إلى أسفل.","رجع الطالب عائداً إلى الخلف."],"الصعود لا يكون إلا إلى أعلى، والنزول إلى أسفل، والرجوع إلى الخلف؛ فذكرها حشو لا يضيف معنى."],
["L05","","القراءة السليمة بالضبط الصحيح للجملة:",["إنَّ العلمَ نورٌ.","إنَّ العلمُ نورٌ.","إنَّ العلمَ نوراً.","إنَّ العلمُ نوراً."],"«إنّ» تنصب الاسم (العلمَ) وترفع الخبر (نورٌ)؛ وقراءة الاسم مرفوعاً أو الخبر منصوباً لحن شائع في القراءة الجهرية."],

// ===================== L06: المهارات الكمية =====================
// --- النسبة المئوية ---
["L06","hm","سلعة سعرها 120 ريالاً، أعلن المعرض خصماً مقداره 25%؛ سعرها بعد الخصم:",["90 ريالاً","95 ريالاً","100 ريالاً","30 ريالاً"],"الخصم = 120 × 25 ÷ 100 = 30 ريالاً، فالسعر = 120 − 30 = 90. مقدار الخصم (30) مشتت لمن ينسى الطرح."],
["L06","h","حصل طالب في اختبار اللغة العربية على 17 درجة من 20؛ النسبة المئوية لدرجته:",["85%","82%","87%","91%"],"النسبة = (الجزء ÷ الكل) × 100 = 17 ÷ 20 × 100 = 85%."],

["L06","m","فصل (أ) فيه 20 طالباً متوسط درجاتهم 60، وفصل (ب) فيه 30 طالباً متوسط درجاتهم 70؛ متوسط درجات الفصلين معاً:",["66","65","67.5","130"],"المجموع = 20 × 60 + 30 × 70 = 1200 + 2100 = 3300، ÷ 50 = 66. متوسط المتوسطين (65) خطأ لأن العددين غير متساويين."],
["L06","","إذا كان الانحراف المعياري لدرجات مجموعة يساوي صفراً فهذا يعني أن:",["الدرجات كلها متساوية","الدرجات كلها أصفار","المتوسط يساوي صفراً","البيانات غير صحيحة"],"الانحراف المعياري يقيس بُعد القيم عن متوسطها؛ فإذا كان صفراً فلا قيمة تبعد عن المتوسط، أي أن القيم كلها متساوية."],
["L06","m","متوسط فصلين متساوٍ (70)، لكن الانحراف المعياري في فصل (أ) يساوي 3 وفي فصل (ب) يساوي 8؛ يُستنتج أن:",["درجات فصل (ب) أكثر تشتتاً وتبايناً","درجات فصل (أ) أكثر تشتتاً","فصل (ب) أعلى تحصيلاً","الفصلين متماثلان في توزيع الدرجات"],"كلما كبر الانحراف المعياري زاد تباعد الدرجات عن المتوسط؛ فالفصل (ب) درجاته أكثر تشتتاً مع أن المتوسط واحد، ولا يدل ذلك على تحصيل أعلى."],

["L06","hm","أراد معلم تمثيل توزيع طلابه حسب تخصصاتهم (بيانات وصفية نوعية)؛ الرسم البياني الأنسب:",["القطاعات الدائرية","المدرج التكراري","المضلع التكراري","المنحنى التكراري"],"القطاعات الدائرية تناسب البيانات الوصفية والنسب. المدرج والمضلع والمنحنى التكراري لتوزيع البيانات الكمية."],
["L06","","لتمثيل تغير درجة الحرارة في مدينة خلال أيام الأسبوع، الرسم الأنسب:",["الخط البياني","القطاعات الدائرية","المدرج التكراري","جدول تكراري فقط"],"الخط البياني يُظهر التغير عبر الزمن. القطاعات للنسب، والمدرج لتوزيع فئات كمية."],
["L06","h","في قطاع دائري يمثل تفضيلات 600 شخص للخضراوات، مثّل الجزر 45%؛ عدد من يفضلون الجزر:",["270","240","300","180"],"600 × 45 ÷ 100 = 270."],

["L06","m","في قطاع دائري: الجزر 45%، والبازلاء 17%، والفاصولياء 15%، والباقي خضراوات أخرى، والعينة 600 شخص؛ عدد من يفضلون خضراوات أخرى:",["138","102","90","23"],"نسبة الباقي = 100 − (45 + 17 + 15) = 23%، و600 × 23 ÷ 100 = 138. و23 هي النسبة لا العدد."],
["L06","m","جدول تكراري لتقديرات 40 طالباً: ممتاز 12، جيد جداً 18، جيد 6، مقبول 4؛ النسبة المئوية للحاصلين على جيد جداً:",["45%","18%","30%","55%"],"18 ÷ 40 × 100 = 45%. و30% نسبة ممتاز."],

["L06","hm","مجموعة أقلام: 10 بيضاء و5 زرقاء و5 حمراء، سُحب منها قلم عشوائياً؛ احتمال أن يكون أزرق:",["1/4","1/3","1/2","5"],"الاحتمال = عدد الأقلام الزرقاء ÷ عدد الأقلام كلها = 5 ÷ 20 = 1/4. المقام عدد كل الأقلام (20) لا عدد الألوان (3)."],
["L06","","عند رمي مكعب أرقام أوجهه من 1 إلى 6 مرة واحدة، احتمال ظهور عدد فردي:",["1/2","1/3","1/6","3"],"الأعداد الفردية 1، 3، 5 أي 3 نواتج من 6: 3 ÷ 6 = 1/2."],
["L06","h","حادثتان مستقلتان، احتمال الأولى 1/2 واحتمال الثانية 1/4؛ احتمال وقوعهما معاً:",["1/8","3/4","1/6","1/2"],"احتمال وقوع حادثتين مستقلتين معاً = حاصل ضرب احتماليهما: 1/2 × 1/4 = 1/8. والجمع (3/4) للحوادث المتنافية عند طلب إحداهما."],

["L06","","كل البيانات الآتية وصفية ما عدا:",["عدد أفراد الأسرة","الحالة الاجتماعية","الجنسية","لون العيون"],"عدد أفراد الأسرة بيانات كمية تُجرى عليها العمليات الحسابية، أما الحالة الاجتماعية والجنسية واللون فبيانات وصفية نوعية."],

["L06","h","إذا مشى خالد حول ملعب مستطيل طوله 12 م وعرضه 8 م دورتين كاملتين، فالمسافة التي قطعها:",["80 م","40 م","96 م","192 م"],"محيط المستطيل = 2 × (12 + 8) = 40 م، ودورتان = 80 م. و96 مساحته لا محيطه."],
["L06","hm","حديقة مستطيلة بعداها 10 م و20 م يُراد إحاطتها بسياج ثمن المتر الواحد منه 40 ريالاً؛ التكلفة الكلية:",["2400 ريال","8000 ريال","2000 ريال","1200 ريال"],"السياج يحتاج المحيط = 2 × (10 + 20) = 60 م، و60 × 40 = 2400. و8000 ناتج استخدام المساحة (200 م²) وهو خطأ."],

["L06","m","مثلث طول قاعدته 12 سم وارتفاعه 8 سم؛ مساحته:",["48 سم²","96 سم²","20 سم²","24 سم²"],"مساحة المثلث = (القاعدة × الارتفاع) ÷ 2 = 12 × 8 ÷ 2 = 48. و96 ناتج نسيان القسمة على 2."],

["L06","m","قطعت سيارة 180 كم في ساعتين ونصف؛ سرعتها المتوسطة:",["72 كم/س","90 كم/س","60 كم/س","450 كم/س"],"السرعة = المسافة ÷ الزمن = 180 ÷ 2.5 = 72 كم/س. و90 ناتج القسمة على ساعتين فقط."],

["L06","h","أعدّ معلم اختباراً من أسئلة متساوية الدرجات، درجته الكلية 30 وخصص لكل سؤال 6 درجات؛ عدد الأسئلة:",["5 أسئلة","6 أسئلة","4 أسئلة","3 أسئلة"],"30 ÷ 6 = 5 أسئلة."],
["L06","m","الدرجة الكلية لمادة 100: الاختبار النهائي 40 درجة، والباقي أعمال فصلية موزعة بالتساوي على 4 عناصر؛ درجة كل عنصر من أعمال الفصل:",["15 درجة","25 درجة","20 درجة","10 درجات"],"أعمال الفصل = 100 − 40 = 60، و60 ÷ 4 = 15 درجة. و25 ناتج قسمة 100 على 4 دون طرح النهائي."],

["L15","hm","رصد معلم العلوم لطالب درجة 85 من 100 في اختبار الوحدة دون أن يصدر أي حكم على مستواه. ما قام به المعلم يُسمى:",["قياساً","تقويماً","تقييماً","تشخيصاً"],"القياس وصف كمّي بالأرقام بلا حكم. التقييم يستلزم حكماً على القيمة (جيد، ممتاز)، والتقويم يستلزم حكماً يتبعه علاج وتعديل."],
["L15","h","أعمّ المصطلحات الآتية وأشملها، لأنه يتضمن إصدار الحكم ثم التعديل والعلاج:",["التقويم","القياس","التقييم","الاختبار"],"التقويم يشمل القياس والتقييم ويضيف إليهما قرار التحسين والعلاج. القياس مجرد رقم، والتقييم مجرد حكم، والاختبار أداة."],
["L15","","كتب المعلم بجانب درجة الطالب عبارة «مستوى جيد جداً» مستنداً إلى محك محدد، دون وضع خطة لتحسين أدائه. هذا الإجراء يمثل:",["تقييماً","قياساً","تقويماً","تغذية راجعة"],"إصدار حكم على قيمة الأداء في ضوء محك هو التقييم. القياس لا يتضمن حكماً، والتقويم يضيف العلاج والتعديل، والتغذية الراجعة تصف الأداء وتوجه."],
["L15","m","الترتيب المنطقي الصحيح لعمليات الحكم على تعلم الطالب هو:",["قياس ثم تقييم ثم تقويم","تقويم ثم قياس ثم تقييم","تقييم ثم قياس ثم تقويم","قياس ثم تقويم ثم تقييم"],"يبدأ بالقياس (جمع أرقام)، ثم التقييم (حكم في ضوء محك)، ثم التقويم (قرار التعديل والعلاج). لا يمكن الحكم قبل القياس ولا العلاج قبل الحكم."],
["L15","","العلاقة بين الاختبار والقياس هي أن الاختبار:",["أداة من أدوات القياس","مرادف للتقويم","أحد أنواع التقويم الختامي","الغاية التي يسعى إليها القياس"],"الاختبار وسيلة لجمع البيانات الكمية، أي أداة قياس. ليس مرادفاً للتقويم لأن التقويم أشمل، وليس نوعاً من التقويم بل أداة قد تستخدم في أي نوع."],
["L15","m","أراد معلم أن يعرف ما اكتسبه طلابه فعلاً من معارف ومهارات بعد تدريس وحدة كاملة، لا ما يمكن أن يتعلموه مستقبلاً. الاختبار المناسب هو اختبار:",["تحصيلي","استعداد","ذكاء","قدرات عامة"],"الاختبار التحصيلي يقيس نواتج التعلم الفعلية. اختبار الاستعداد يتنبأ بإمكانية التعلم مستقبلاً، والذكاء والقدرات يقيسان قدرة عامة لا محتوى درسه الطالب."],
["L15","","اختبار يُطبَّق على طلاب الثالث الثانوي للتنبؤ بمدى نجاحهم في تخصص هندسي مستقبلاً هو اختبار:",["استعداد","تحصيل","تشخيصي","ختامي"],"اختبارات الاستعداد تقيس إمكانية التعلم أو النجاح مستقبلاً. التحصيلي يقيس ما تعلمه الطالب فعلاً، والتشخيصي يبحث عن مواطن الضعف، والختامي يصدر حكم النهاية."],
["L15","m","أي الآتي لا يُعد من خصائص الاختبارات المقننة؟",["يعدّه المعلم لطلابه وفق ما درّسه في فصله","تطبَّق في ظروف وتعليمات موحدة لجميع المختبرين","يعدّها فريق من المتخصصين بإشراف مراكز القياس","لها معايير تُفسَّر الدرجات في ضوئها"],"الاختبار المقنن يعدّه متخصصون ويطبَّق بظروف موحدة وله معايير؛ أما الاختبار الذي يعدّه المعلم لصفه فهو اختبار معلم غير مقنن مهما كانت جودته."],
["L15","","أي الآتي لا يُعد من خصائص التقويم الجيد؟",["أن يكون نشاطاً ختامياً في نهاية العام فقط","أن يكون مستمراً يواكب التعلم","أن يكون شاملاً لجوانب المتعلم المعرفية والمهارية والوجدانية","أن يكون تعاونياً يشارك فيه المعلم والطالب وولي الأمر"],"التقويم الجيد مستمر وشامل وتعاوني وعلمي واقتصادي، وليس غاية بحد ذاته ولا نشاطاً ختامياً فقط؛ فاقتصاره على نهاية العام يفقده وظيفة التحسين."],
// --- أنواع التقويم بالزمن والغرض ---
["L15","hm","قبل البدء بوحدة الكسور طبّق معلم الرياضيات اختباراً قصيراً ليعرف ما يمتلكه طلابه من المتطلبات السابقة. هذا التقويم:",["قبلي","تكويني","ختامي","معياري المرجع"],"التقويم القبلي يسبق التعلم ليكشف الاستعداد والمتطلبات السابقة فيبني المعلم عليها. التكويني أثناء التدريس، والختامي في نهايته، ومعياري المرجع طريقة تفسير لا توقيت."],
["L15","h","يطرح معلم أسئلة شفهية قصيرة أثناء الشرح ويعدّل سرعة الدرس وطريقته في ضوء إجابات الطلاب. نوع التقويم الذي يمارسه:",["تكويني","تشخيصي","ختامي","قبلي"],"التقويم التكويني (البنائي) يجري أثناء التدريس لتحسينه وتعديله دون حكم نهائي. التشخيصي يبحث عن أسباب صعوبة محددة، والختامي يصدر الحكم في النهاية."],
["L15","hm","في نهاية الفصل الدراسي طبّق المعلم اختباراً أصدر في ضوئه حكماً بنجاح الطلاب أو رسوبهم. هذا النوع من التقويم:",["ختامي","تكويني","تشخيصي","ذاتي"],"إصدار أحكام النجاح والرسوب والانتقال ورصد الدرجات وظيفة التقويم الختامي (التجميعي). التكويني لا يصدر حكماً نهائياً، والتشخيصي يبحث عن مواطن الضعف."],
["L15","h","لاحظ معلم أن طالباً يخطئ باستمرار في مسائل القسمة رغم فهمه لمسائل الضرب. الإجراء الأنسب أولاً:",["تطبيق اختبار تشخيصي يحدد موطن الخطأ بدقة","إعادة شرح وحدة القسمة للصف كاملاً","تطبيق اختبار ختامي لتحديد درجته","زيادة الواجبات المنزلية في القسمة"],"الخطأ المتكرر في مهارة محددة يستدعي تشخيصاً يحدد أين تكمن الصعوبة قبل أي علاج. إعادة الشرح للجميع أو زيادة الواجبات علاج قبل التشخيص، والختامي لا يعالج."],
["L15","hm","الهدف الأساسي الذي يسعى إليه المعلم حين يبني اختباراً تشخيصياً لطلابه هو:",["تحديد نقاط القوة والضعف وحاجاتهم التعليمية","ترتيب الطلاب حسب مستوى تحصيلهم","التنبؤ بإمكاناتهم المستقبلية","إصدار حكم نهائي على تعلمهم"],"التشخيص يكشف مواطن القوة والضعف والصعوبات ليُبنى عليه العلاج. الترتيب وظيفة التقويم معياري المرجع، والتنبؤ وظيفة اختبارات الاستعداد، والحكم النهائي وظيفة الختامي."],
["L15","hm","يستخدم معلم طرقاً رسمية وغير رسمية متنوعة لتقويم فهم طلابه أثناء تدريس كل وحدة. الفائدة الأساسية لهذه الممارسة أنها:",["تتيح له مراقبة تقدم الطلاب وفاعلية تدريسه وتعديله عند الحاجة","تقلل قلق الطلاب من الاختبار الختامي","تدرّب الطلاب على التقويم الذاتي","توفر له بيانات أكثر لرصد الدرجات النهائية"],"التقويم أثناء التدريس (التكويني) يفيد أولاً في تعديل التدريس وتعزيز التعلم. تقليل القلق أو التدريب على التقويم الذاتي فوائد جانبية، ورصد الدرجات وظيفة الختامي."],
["L15","m","الفرق الجوهري بين التقويم التكويني والتقويم الختامي يكمن في:",["التوقيت والغرض: تحسين التعلم أثناءه مقابل إصدار الحكم في نهايته","نوع الأسئلة: موضوعية مقابل مقالية","من يقوم بالتصحيح: الطالب مقابل المعلم","عدد الأسئلة: قليلة مقابل كثيرة"],"التكويني أثناء التدريس وغايته التحسين والتغذية الراجعة، والختامي في النهاية وغايته الحكم. أما نوع الأسئلة وعددها ومن يصحح فلا يميز بينهما."],
["L15","","يُطلق على التقويم التكويني أحياناً اسم التقويم:",["المستمر","النهائي","المقنن","المعياري"],"لأنه يواكب التعلم ويستمر معه طوال التدريس. النهائي هو الختامي، والمقنن وصف للاختبار لا لنوع التقويم، والمعياري طريقة تفسير."],
["L15","hm","صمّم معلم خطة تقويم تُطبَّق باستمرار أثناء التدريس، تهدف إلى الكشف عن الصعوبات التي تواجه الطلاب أثناء التعلم وتقديم تغذية راجعة لهم وتعديل التدريس في ضوئها. نوع التقويم المتبع في هذه الخطة:",["تكويني","تشخيصي","ختامي","معياري"],"الكشف عن الصعوبات أثناء التعلم مع التغذية الراجعة وتعديل التدريس هو جوهر التقويم التكويني. بعض مفاتيح الملخصات المتداولة تختار التشخيصي، لكن التشخيصي يسبق العلاج ويركز على تحديد الأسباب، بينما الموقف يصف تقويماً مستمراً أثناء التعلم."],
["L15","","طبّق معلم اختباراً في بداية العام ثم صنّف الطلاب في مجموعات متجانسة في مستوى المهارة ليخطط لتعليم يناسب كل مجموعة. التقويم المستخدم:",["قبلي","ختامي","تكويني","ذاتي"],"توزيع الطلاب في مستويات وتصنيفهم قبل التعلم من أغراض التقويم القبلي. الختامي يحكم بعد التعلم، والتكويني أثناءه، والذاتي يقوم به الطالب."],
["L15","m","أي أنواع التقويم الآتية يفيد في الحكم على مدى فاعلية طرق التدريس التي استُخدمت خلال الفصل الدراسي كاملاً؟",["الختامي","القبلي","التشخيصي","الذاتي"],"من أغراض التقويم الختامي الحكم على فاعلية جهود المعلم وطرق تدريسه ومقارنة الشعب. القبلي والتشخيصي يسبقان التعلم أو يبحثان عن الصعوبات."],
// --- محكي ومعياري المرجع ---
["L15","hm","انتقل طالب من مدرسة أخرى، وأراد المعلم معرفة ترتيبه بين زملائه في الصف الجديد. التقويم المناسب:",["معياري المرجع","محكي المرجع","ذاتي المرجع","تشخيصي"],"معرفة ترتيب الطالب بالنسبة لأقرانه تفسير معياري المرجع. المحكي يقارن بمستوى إتقان ثابت، والذاتي يقارن الطالب بنفسه، والتشخيصي يبحث عن الصعوبات."],
["L15","h","يحدد اختبار رخصة القيادة اجتياز المتقدم بوصوله إلى مستوى أداء محدد سلفاً بغض النظر عن أداء المتقدمين الآخرين. هذا الاختبار:",["محكي المرجع","معياري المرجع","ذاتي المرجع","تنبؤي"],"المقارنة بمحك إتقان ثابت (أتقن / لم يتقن) هي التقويم محكي المرجع. المعياري يقارن بالآخرين، والذاتي بالأداء السابق للفرد نفسه."],
["L15","hm","شرح معلم لطلابه طريقة إعداد تقارير أدائهم، محدداً مستوى كل طالب بناءً على أداء زملائه. نوع المرجع الذي اعتمده:",["معياري المرجع","محكي المرجع","ذاتي المرجع","قياسي المرجع"],"تحديد المستوى بالمقارنة مع أداء الزملاء يعني مرجعاً معيارياً (الجماعة). المحكي يقارن بمعيار إتقان محدد، والذاتي يقارن الطالب بأدائه السابق."],
["L15","","تظهر نتائج الاختبار محكي المرجع عادة في صورة:",["قائمة وصفية بالأهداف التي تحققت والتي لم تتحقق","ترتيب الطلاب من الأعلى إلى الأدنى","رتب مئينية ودرجات معيارية","منحنى اعتدالي لدرجات الصف"],"المحكي يخبرنا ما يستطيع الطالب عمله (أتقن / لم يتقن) فنتائجه قائمة أهداف. الترتيب والرتب المئينية والمنحنى الاعتدالي كلها أدوات التفسير معياري المرجع."],
["L15","m","في استراتيجية التعلم للإتقان لا ينتقل الطالب إلى المهارة التالية حتى يصل إلى 80% في اختبار المهارة الحالية. نوع التقويم المعتمد:",["محكي المرجع","معياري المرجع","ذاتي المرجع","قبلي"],"نسبة الإتقان المحددة مسبقاً (80%) محك ثابت يقارن به أداء الطالب، فهو محكي المرجع. لا علاقة له بأداء الآخرين فليس معيارياً."],
["L15","","يكون التقويم معياري المرجع هو الأنسب عندما يكون الغرض:",["الانتقاء والتصفية للقبول في برنامج بمقاعد محدودة","التأكد من إتقان الطالب لمهارات وحدة معينة","منح شهادة إتقان لمهارة مهنية","تشخيص أسباب تدني أداء طالب"],"الانتقاء والمفاضلة يحتاجان ترتيب المتقدمين بعضهم بالنسبة لبعض، وهذا جوهر المعياري. الإتقان والشهادات والتشخيص تحتاج مقارنة بمحك محدد."],
["L15","m","قارن معلم درجة الطالب في اختبار الشهر الثاني بدرجته هو نفسه في الشهر الأول ليحكم على تقدمه. هذا التفسير:",["ذاتي المرجع","معياري المرجع","محكي المرجع","مقنن"],"مقارنة الطالب بأدائه السابق تفسير ذاتي المرجع يركز على النمو الفردي. المعياري يقارن بالأقران، والمحكي بمستوى إتقان محدد."],
// --- من أجل التعلم / كتعلم / الذاتي والأقران ---
["L15","hm","يشارك الطلاب في وضع محكات الحكم على أعمالهم، ويراقب كل طالب تعلمه ويحكم على مدى تحقيقه لهذه المحكات بنفسه. هذا يمثل:",["التقويم كتعلم","تقويم التعلم","التقويم الختامي","التقويم معياري المرجع"],"حين يقود الطالب تقويم تعلمه ومراقبته بنفسه يصبح التقويم ذاته عملية تعلم (التقويم كتعلم). تقويم التعلم هو الختامي الذي يقوم به المعلم للحكم."],
["L15","","أي الآتي يصف «التقويم من أجل التعلم» وصفاً صحيحاً؟",["بحث عن أدلة التعلم وتفسيرها من المعلم والمتعلم لتوجيه الخطوة التالية","إصدار حكم نهائي على مستوى الطالب في نهاية الوحدة","ترتيب الطلاب لاختيار المتفوقين منهم","قياس قدرات الطالب العقلية العامة"],"التقويم من أجل التعلم تقويم تكويني يستخدم الأدلة لتوجيه التعلم والتدريس. الحكم النهائي هو تقويم التعلم، والترتيب معياري، وقياس القدرات ليس تقويماً صفياً."],
["L15","m","تبادل طالبان مسودتي موضوع التعبير وصحّح كل منهما عمل الآخر وفق قائمة محكات أعدّها المعلم. هذا الأسلوب:",["تقويم الأقران","التقويم الذاتي","التقويم الختامي","تقويم الأداء"],"حكم الطالب على عمل زميله وفق محكات هو تقويم الأقران. الذاتي حكم الطالب على عمله هو، والأداء يتعلق بإنجاز مهمة فعلية، والختامي حكم المعلم في النهاية."],
["L15","h","لكي يكون تقويم الأقران متسقاً وأحكامه عادلة، فإن الشرط الأهم هو:",["وجود محكات واضحة ومعدة مسبقاً يتدرب عليها الطلاب","أن يكون الطلاب في مستوى تحصيلي واحد","أن يُجرى في نهاية الفصل الدراسي فقط","أن يُحتسب ضمن درجة أعمال السنة"],"بلا محكات واضحة تتحول الأحكام إلى انطباعات شخصية. تساوي المستويات ليس شرطاً، والتوقيت والاحتساب في الدرجات لا يضمنان الاتساق."],
["L15","","أهم ميزة للتقويم الذاتي بالنسبة للطالب أنه:",["يساعده على اكتشاف أخطائه وتعديل مساره بنفسه","يوفر على المعلم وقت التصحيح","يرفع درجاته في الاختبار الختامي","يغني عن تقويم المعلم"],"التقويم الذاتي ينمي وعي الطالب بأخطائه ودوافعه فيعدل سلوكه ويزيد ثقته. توفير الوقت نظرة تركز على المعلم، ولا يغني عن تقويم المعلم ولا يرفع الدرجات بالضرورة."],
["L15","m","في نهاية كل حصة يطلب المعلم من طلابه كتابة ثلاث جمل عن أهم ما تعلموه وما بقي غامضاً لديهم. هذا الأسلوب يخدم أساساً:",["التقويم التكويني والتغذية الراجعة للمعلم","رصد درجات أعمال السنة","التقويم الختامي للوحدة","تصنيف الطلاب إلى مستويات"],"تذكرة الخروج تكشف ما تعلمه الطلاب وما غمض عليهم فيعدل المعلم الحصة التالية؛ وهذا تقويم تكويني. ليست أداة رصد درجات ولا تصنيف ولا حكم ختامي."],
// --- التقويم البديل وأدواته ---
["L15","hm","طلب معلم من طلاب الثالث الثانوي، ضمن تقويم أدائهم، أن يكتب كل طالب سيرته الذاتية ويعبئ نموذج طلب توظيف حقيقياً على موقع إلكتروني. هذا النوع من التقويم يسمى:",["تقويماً أصيلاً (واقعياً)","تقويماً ختامياً","تقويماً معياري المرجع","اختباراً مقنناً"],"المهمة حقيقية مرتبطة بالحياة وتسمح للطالب بتطبيق ما تعلمه نظرياً على الواقع، وهذا جوهر التقويم الأصيل. ليست حكماً ختامياً ولا مقارنة بالأقران ولا اختباراً مقنناً."],
["L15","h","طلب المعلم من كل طالب جمع أعماله بانتظام في حقيبة، وفي كل أسبوع يراجع أعماله السابقة ويكتب ملاحظاته عن تقدمه. الأداة التي يستخدمها المعلم:",["ملف الإنجاز","السجل القصصي","قائمة الشطب","سلم التقدير العددي"],"جمع الأعمال بانتظام ومراجعتها بهدف التأمل في التقدم هو ملف الإنجاز (البورتفوليو). السجل القصصي يكتبه المعلم عن سلوك الطالب، والشطب والسلم أدوات رصد أداء."],
["L15","hm","كلّف معلم طلابه بإعداد عمل حر عن القضايا التي درسوها بالطريقة التي يريدونها، مكتوبة أو مرسومة أو كليهما، مع توثيق ما أنجزوه على مدار الفصل. الأداة المناسبة لهذه المهمة:",["ملف الإنجاز","قائمة الرصد","السجل القصصي","الاختبار المقالي"],"العمل الممتد المتنوع الموثق على مدار الفصل يُجمع في ملف إنجاز يعكس نمو الطالب. قائمة الرصد تؤشر وجود السلوك فقط، والسجل القصصي وصف المعلم لسلوك، والمقالي اختبار كتابي."],
["L15","hm","يحتاج المعلم أداة يصف فيها بدقة وبتاريخ محدد سلوكاً لافتاً صدر من طالب في موقف صفي كما حدث فعلاً. الأداة:",["السجل القصصي","سلم التقدير","قائمة الشطب","ملف الإنجاز"],"السجل القصصي وصف سردي مؤرخ لحدث سلوكي محدد كما وقع. سلم التقدير وقائمة الشطب أدوات تأشير على مستوى أو وجود سلوك محدد مسبقاً، وملف الإنجاز يجمع أعمال الطالب."],
["L15","h","أراد المعلم التحقق من أن كل طالب نفّذ خطوات التجربة (ارتدى النظارة، جهّز الأدوات، سجّل القراءات) دون تحديد مستوى الإتقان. الأداة الأنسب:",["قائمة الشطب","سلم التقدير العددي","الروبرك التحليلي","السجل القصصي"],"قائمة الشطب تسجل وجود السلوك أو غيابه (نعم / لا) دون تدريج، وهذا ما يريده المعلم. سلم التقدير والروبرك يحددان درجة الإتقان، والسجل القصصي يصف."],
["L15","hm","أراد المعلم الحكم على درجة إتقان كل طالب لمهارة القراءة الجهرية على مقياس من 1 إلى 5. الأداة الأنسب:",["سلم التقدير العددي","قائمة الشطب","السجل القصصي","الاختبار الموضوعي"],"التدريج الرقمي لمستوى الإتقان هو سلم التقدير العددي. قائمة الشطب لا تدرّج، والسجل القصصي وصف، والاختبار الموضوعي لا يقيس القراءة الجهرية."],
["L15","","أداة تقويم تتضمن عبارات مثل «دائماً، غالباً، أحياناً، نادراً» لتقدير تكرار سلوك الطالب هي:",["سلم التقدير اللفظي","قائمة الشطب","سلم التقدير العددي","الروبرك"],"التدريج بكلمات وصفية للتكرار هو سلم التقدير اللفظي. العددي يستخدم أرقاماً، والشطب نعم / لا، والروبرك يصف مستويات الجودة لكل معيار."],
["L15","hm","أعدّ معلم أداة تقويم لمشروع يحدد فيها لكل معيار (الدقة، التنظيم، العرض) أربعة مستويات، لكل مستوى وصف تفصيلي ودرجة. هذه الأداة:",["الروبرك (سلم التقدير الوصفي)","قائمة الشطب","السجل القصصي","سجل سير التعلم"],"وصف مستويات الأداء لكل معيار مع درجة لكل مستوى هو الروبرك. الشطب يؤشر الوجود فقط، والسجل القصصي يصف حدثاً، وسجل سير التعلم يكتبه الطالب عن تعلمه."],
["L15","","الميزة الأساسية للروبرك التحليلي مقارنة بالروبرك الكلي أنه:",["يقدم تغذية راجعة تفصيلية عن كل معيار على حدة","أسرع في التصحيح","لا يحتاج إلى محكات مسبقة","يعطي حكماً عاماً واحداً على العمل"],"الروبرك التحليلي يفصّل الدرجة لكل معيار فيعرف الطالب موضع قوته وضعفه. الكلي أسرع لكنه يعطي حكماً عاماً واحداً، وكلاهما يحتاج محكات مسبقة."],
["L15","m","أراد معلم الكيمياء تقويم مهارة طلابه في إجراء تجربة معايرة. الأداة الأنسب:",["بطاقة ملاحظة بسلم تقدير للأداء","اختبار اختيار من متعدد عن خطوات التجربة","اختبار مقالي يصف فيه الطالب التجربة","قائمة بالمصطلحات العلمية للحفظ"],"المهارة العملية تُقوَّم بملاحظة الأداء الفعلي بأداة مدرجة. الاختبارات الكتابية تقيس المعرفة بالخطوات لا القدرة على تنفيذها."],
["L15","h","أراد معلم التربية الإسلامية تقويم مهارة الوضوء عند طلاب الصف الثاني الابتدائي. الأسلوب الأنسب:",["ملاحظة أداء كل طالب بقائمة شطب لخطوات الوضوء","اختبار كتابي يذكر فيه الطالب فروض الوضوء","سؤال شفهي عن تعريف الوضوء","واجب منزلي يكتب فيه الطالب خطوات الوضوء"],"الاختبار الكتابي والشفهي يقيسان المعرفة لا المهارة؛ المهارة الأدائية تُقاس بالملاحظة. قائمة الشطب تناسب التحقق من أداء كل خطوة في الصفوف الدنيا."],
["L15","","من عيوب السجل القصصي كأداة تقويم أنه:",["يحتاج وقتاً طويلاً وقد يتأثر بذاتية الملاحِظ","لا يصلح إلا للمهارات العملية","يقتصر على تسجيل الدرجات الرقمية","لا يمكن استخدامه في الصفوف الدنيا"],"الوصف السردي لكل طالب يستهلك وقتاً ويعتمد على ما يلاحظه المعلم ويفسره. السجل القصصي يناسب السلوك والجوانب الوجدانية في جميع الصفوف ولا يسجل درجات."],
["L15","m","عقد المعلم جلسة قصيرة مع كل طالب حول أعماله في ملف الإنجاز، يسأله فيها عن اختياراته وما تعلمه وكيف يطورها. هذا الأسلوب من التقويم يسمى:",["التقويم بالتواصل (المقابلة / المؤتمر)","التقويم الختامي","الاختبار الشفهي المقنن","تقويم الأقران"],"الحوار وجهاً لوجه مع الطالب حول أعماله وتفكيره هو التقويم بالتواصل. ليس اختباراً مقنناً ولا حكماً ختامياً ولا يشارك فيه أقران."],
["L15","","حين يطلب المعلم من الطلاب رسم خريطة مفاهيم لوحدة كاملة كأداة تقويم، فإنه يكشف أساساً عن:",["بنيتهم المعرفية والعلاقات التي يدركونها بين المفاهيم","سرعتهم في الكتابة","قدرتهم على حفظ التعريفات حرفياً","مهاراتهم اليدوية في الرسم"],"خريطة المفاهيم تُظهر كيف ينظم الطالب المفاهيم ويربطها، وهذا مؤشر على الفهم العميق. الحفظ الحرفي يُقاس بأسئلة التذكر، والرسم والسرعة ليسا المقصود."],
["L15","hm","أراد المعلم تقويم مدى نجاح كل مجموعة في تنفيذ مهمة تعليمية تعاونية بتحديد مستوى أدائها في عدة جوانب (التخطيط، التعاون، جودة المنتج). الأداة الأنسب:",["سلم التقدير","الاختبار التحصيلي","قائمة الشطب","الاختبار الشفهي"],"تحديد مستوى الأداء في جوانب متعددة يحتاج تدريجاً، وهذا سلم التقدير. قائمة الشطب تؤشر الوجود فقط، والاختبارات التحصيلية والشفهية تقيس المعرفة لا أداء المجموعة."],
["L15","","أي الآتي من خصائص التقويم الأصيل (الواقعي)؟",["مهام حقيقية مرتبطة بالحياة بمعايير معلنة مسبقاً","الاعتماد على أسئلة الاختيار من متعدد فقط","إخفاء معايير التقويم عن الطلاب حتى نهاية المهمة","التركيز على التذكر الحرفي للمعلومات"],"التقويم الأصيل يقيس الأداء في مواقف واقعية ذات معنى مع معايير يعرفها الطالب مسبقاً. إخفاء المعايير والاقتصار على التذكر أو الاختيار من متعدد سمات التقويم التقليدي."],
["L15","m","أي الآتي ليس من أدوات التقويم البديل؟",["اختبار الاختيار من متعدد","ملف الإنجاز","سلم التقدير الوصفي","السجل القصصي"],"التقويم البديل يعتمد الأداء والملاحظة والملفات وسلالم التقدير بديلاً عن الاختبارات الورقية التقليدية؛ والاختيار من متعدد اختبار تقليدي."],
["L15","","سجل يكتب فيه الطالب بنفسه تأملاته حول ما تعلمه وما قرأه وما واجهه من صعوبات يسمى:",["سجل سير التعلم (يوميات الطالب)","السجل القصصي","قائمة الشطب","بطاقة الملاحظة"],"سجل سير التعلم يكتبه الطالب عن تعلمه. السجل القصصي يكتبه المعلم عن سلوك الطالب، وقائمة الشطب وبطاقة الملاحظة أدوات يستخدمها المعلم لرصد الأداء."],
// --- أنواع الأسئلة وقواعد الصياغة ---
["L15","hm","ورد في اختبار علوم السؤال: «جميع أنواع البكتيريا تسبب الأمراض (صح / خطأ)». الخلل في صياغة هذا السؤال:",["استخدام كلمات التعميم والجزم التي تدل على الإجابة","طول العبارة","احتواؤه على فكرتين","استخدام النفي المزدوج"],"كلمة «جميع» تعميم مطلق يوحي للطالب بأن العبارة خاطئة فيجيب بلا معرفة. العبارة قصيرة وفيها فكرة واحدة ولا نفي فيها."],
["L15","h","جميع الآتي من الأسئلة الموضوعية ما عدا:",["المقالي المقيد","الاختيار من متعدد","المطابقة","الصواب والخطأ"],"الأسئلة الموضوعية هي الاختيار من متعدد والصواب والخطأ والمطابقة (ويلحق بها الإكمال عند بعض المراجع)؛ أما المقالي المقيد فمقالي يكتب فيه الطالب إجابته بنفسه وإن كانت محددة النطاق."],
["L15","hm","أراد معلم قياس قدرة طلابه على تنظيم الأفكار والربط بينها والتعبير عنها بأسلوبهم. نوع الأسئلة الأنسب:",["المقالية","الاختيار من متعدد","الصواب والخطأ","المطابقة"],"المقالية تتيح للطالب تنظيم أفكاره والتعبير عنها، وهذا ما لا تقيسه الأسئلة الموضوعية التي تقدم الإجابة جاهزة للاختيار أو التأشير."],
["L15","h","من أبرز عيوب الأسئلة المقالية:",["ذاتية التصحيح وانخفاض الثبات","سهولة التخمين","صعوبة إعدادها","عدم قياسها لمستويات التفكير العليا"],"تصحيح المقالي يتأثر بشخصية المصحح فتختلف الدرجة بين مصحح وآخر فينخفض الثبات. التخمين وصعوبة الإعداد من عيوب الموضوعية، والمقالية تقيس التفكير العليا جيداً."],
["L15","h","من عيوب الأسئلة الموضوعية:",["إمكانية التخمين وعدم قياس القدرة على التعبير","تأثر تصحيحها بذاتية المصحح","ضعف تغطيتها للمحتوى","صعوبة تصحيحها"],"الموضوعية تقدم البدائل جاهزة فيمكن التخمين، ولا تقيس التعبير والتنظيم؛ لكنها تغطي المحتوى وتصحح بسهولة وموضوعية."],
["L15","hm","أي الآتي قاعدة صحيحة في صياغة أسئلة الاختيار من متعدد؟",["أن تكون المشتتات متجانسة ومعقولة وبطول متقارب مع الإجابة الصحيحة","استخدام بديل «جميع ما سبق» لزيادة الصعوبة","وضع الإجابة الصحيحة في الموضع نفسه لتسهيل التصحيح","جعل الإجابة الصحيحة أطول البدائل دائماً"],"المشتتات المتجانسة المعقولة تجذب من لم يتقن المحتوى. أما «جميع ما سبق» وثبات موضع الإجابة وطولها الزائد فكلها تلميحات تكشف الإجابة."],
["L15","","في أسئلة المطابقة (المزاوجة) يُفضَّل أن:",["يكون عدد الاستجابات أكبر من عدد المقدمات وأن تكون القائمة متجانسة","يتساوى عدد المقدمات والاستجابات تماماً","تجمع القائمة عناصر من موضوعات مختلفة","تُرتَّب الاستجابات بترتيب الإجابات الصحيحة"],"زيادة الاستجابات تقلل التخمين بالاستبعاد، والتجانس يمنع كشف الإجابة من نوع العنصر. التساوي والخلط وترتيب الإجابات تسهّل التخمين."],
["L15","m","أي الآتي الصياغة الأفضل لسؤال إكمال؟",["وضع فراغ واحد في موضع مهم قرب نهاية الجملة","نقل الجملة حرفياً من الكتاب مع حذف كلمة","ترك عدة فراغات في الجملة الواحدة","وضع الفراغ في بداية الجملة"],"الفراغ الواحد في موضع مهم قرب النهاية يجعل المطلوب واضحاً بعد قراءة السياق. النقل الحرفي يشجع الحفظ، وكثرة الفراغات تجعل الجملة مبهمة، والفراغ في البداية يقطع السياق."],
["L15","","في صياغة عبارات الصواب والخطأ ينبغي:",["أن تحمل كل عبارة فكرة واحدة وتخلو من النفي المزدوج","أن تحتوي كل عبارة على فكرتين لزيادة الدقة","أن تكون أغلب العبارات صحيحة","أن تُستخدم كلمات مثل دائماً وأبداً لتوضيح المعنى"],"الفكرة الواحدة تجعل الحكم واضحاً، والنفي المزدوج يربك الطالب. ينبغي توازن الصواب والخطأ، وكلمات الجزم تكشف الإجابة."],
["L15","hm","الفرق بين السؤال المقالي ذي الإجابة المقيدة والسؤال المقالي الحر أن المقيد:",["يحدد المطلوب ونطاق الإجابة فترتفع موضوعية تصحيحه","يترك للطالب حرية اختيار الموضوع","لا يمكن تصحيحه بنموذج إجابة","يقيس التذكر فقط"],"التقييد يحدد حدود الإجابة فيسهل وضع نموذج ومحكات. الحر يترك حرية أوسع فتزداد ذاتية التصحيح، والمقيد يمكن أن يقيس الفهم والتحليل."],
["L15","","لتقليل أثر التخمين في أسئلة الاختيار من متعدد يُنصح بـ:",["زيادة عدد البدائل الفعالة إلى أربعة وتحسين جودة المشتتات","تقليل البدائل إلى اثنين","وضع الإجابة الصحيحة دائماً في البديل الأول","حذف المشتتات الصعبة"],"كلما زادت البدائل الفعالة انخفض احتمال التخمين الصحيح (25% مع أربعة بدائل). تقليل البدائل أو تثبيت موضع الإجابة أو إضعاف المشتتات يرفع التخمين."],
["L15","m","كتب معلم سؤالاً: «سقطت الدولة العثمانية لعدة أسباب، وضح ذلك». المشكلة في هذا السؤال أنه:",["مفتوح لا يحدد المطلوب فيصعب تصحيحه بموضوعية","موضوعي لا يقيس التفكير","قصير جداً","يحتوي على كلمات جزم"],"السؤال لا يحدد عدد الأسباب ولا نطاق الإجابة فيختلف المصححون في تقدير الإجابة؛ والأفضل تقييده مثل: اذكر ثلاثة أسباب. ليس موضوعياً ولا فيه كلمات جزم."],
["L15","","لقياس عدد كبير من الحقائق والمفاهيم بتغطية واسعة للمحتوى في زمن محدود، الأنسب:",["الأسئلة الموضوعية","الأسئلة المقالية الحرة","المقابلة الشخصية","ملف الإنجاز"],"الموضوعية قصيرة الإجابة فتغطي محتوى واسعاً بعدد كبير من الفقرات في وقت قصير. المقالية تغطي محتوى محدوداً، والمقابلة وملف الإنجاز لا يناسبان هذا الغرض."],
["L15","","في بناء اختبار الاختيار من متعدد، موقع الإجابة الصحيحة بين البدائل ينبغي أن:",["يتغير عشوائياً من فقرة إلى أخرى","يثبت في البديل الأول لتسهيل التصحيح","يكون دائماً في البديل الأخير","يتبع نمطاً ثابتاً يسهل حفظه"],"تغيير الموقع عشوائياً يمنع الطالب من اكتشاف نمط يجيب به دون معرفة. أي نمط ثابت يكشف الإجابة ويضعف الصدق."],
["L15","m","معلم يريد قياس قدرة طلابه على الحكم على صحة الأحكام وتبريرها (مستوى التقويم في بلوم). نوع الأسئلة الأقل مناسبة لهذا الغرض:",["الصواب والخطأ","المقالية المقيدة","المقالية الحرة","الاختيار من متعدد المبني على موقف"],"الصواب والخطأ يقيس غالباً التذكر ولا يتيح تبرير الحكم. المقالية بنوعيها والاختيار من متعدد المبني على موقف يمكن أن تقيس مستويات عليا."],
// --- بناء الاختبار التحصيلي ---
["L15","h","بدأ معلم بناء اختبار نهاية الفصل بكتابة الأسئلة مباشرة من الكتاب. الخطوة التي كان ينبغي أن يبدأ بها أولاً:",["تحديد الأهداف التعليمية المراد قياسها","إعداد تعليمات الاختبار","تحليل محتوى المادة","تحديد زمن الاختبار"],"الخطوة الأولى في بناء الاختبار التحصيلي تحديد الأهداف، ثم تحليل المحتوى، ثم جدول المواصفات، ثم الصياغة. التعليمات والزمن خطوات لاحقة."],
["L15","hm","الفائدة الأساسية لإعداد جدول المواصفات قبل كتابة فقرات الاختبار أنه يحقق للاختبار:",["صدق المحتوى","الثبات","الموضوعية","سهولة التصحيح"],"جدول المواصفات يضمن تمثيل الفقرات لكل موضوع ومستوى بوزنه، وهذا هو صدق المحتوى. الثبات والموضوعية وسهولة التصحيح تتعلق بنوع الأسئلة وطريقة التصحيح."],
["L15","h","البعدان اللذان يتكون منهما جدول المواصفات هما:",["موضوعات المحتوى ومستويات الأهداف","عدد الطلاب وزمن الاختبار","نوع الأسئلة وصعوبتها","الدرجة الكلية وتوزيع الدرجات"],"جدول المواصفات مصفوفة صفوفها الموضوعات وأعمدتها مستويات الأهداف (المعرفية)، وتوزع الأسئلة في خلاياه بأوزانها."],
["L15","m","وحدة دراسية استغرقت 6 حصص من أصل 30 حصة في الفصل، والاختبار من 40 سؤالاً. عدد الأسئلة التي تستحقها هذه الوحدة في جدول المواصفات:",["8 أسئلة","6 أسئلة","12 سؤالاً","10 أسئلة"],"وزن الوحدة = 6 ÷ 30 = 0.20 أي 20%. عدد أسئلتها = 40 × 0.20 = 8 أسئلة. الخطأ الشائع أخذ عدد الحصص (6) كأنه عدد الأسئلة."],
["L15","","اختبار من 50 سؤالاً، وزن موضوع «الكسور» فيه 30%، ووزن مستوى الفهم 40% من الأهداف. عدد أسئلة الكسور في مستوى الفهم:",["6 أسئلة","15 سؤالاً","20 سؤالاً","12 سؤالاً"],"أسئلة الخلية = العدد الكلي × وزن الموضوع × وزن المستوى = 50 × 0.30 × 0.40 = 6. الرقم 15 هو كل أسئلة الكسور، و20 كل أسئلة الفهم."],
["L15","m","الأساس الذي يُحدَّد به وزن كل موضوع في جدول المواصفات هو:",["عدد الحصص أو الأهداف المخصصة له وأهميته النسبية","صعوبة الموضوع على الطلاب","ترتيب الموضوع في الكتاب","رغبة الطلاب في الموضوع"],"الوزن النسبي يُشتق من حجم الموضوع في التدريس (حصصه أو أهدافه) وأهميته. الصعوبة والترتيب والرغبة ليست أسساً لتوزيع الأسئلة."],
["L15","hm","أفضل ترتيب لفقرات الاختبار لتشجيع متدني التحصيل على الاستمرار في الإجابة هو الترتيب حسب:",["صعوبة الفقرات من السهل إلى الصعب","نوع الفقرة أو شكلها فقط","المستوى المعرفي من الأعلى إلى الأدنى","ترتيب الموضوعات في الكتاب"],"البدء بالسهل يبني ثقة الطالب ويقلل قلقه فيكمل الاختبار. البدء بالصعب أو بالمستويات العليا يحبط الضعاف مبكراً."],
["L15","","ينبغي أن تتضمن تعليمات الاختبار:",["زمن الإجابة وطريقتها ودرجة كل سؤال","أسماء الطلاب المتوقع نجاحهم","الإجابات النموذجية للأسئلة","ملخصاً للمحتوى الدراسي"],"التعليمات تخبر الطالب بما هو متوقع منه: الزمن وأسلوب الإجابة ومكانها وتوزيع الدرجات. الإجابات والملخص لا مكان لهما في ورقة الاختبار."],
["L15","hm","لكي يكون تصحيح الأسئلة المقالية دقيقاً وموضوعياً، فإن أهم إجراء يقوم به المعلم:",["إعداد نموذج إجابة ومحكات تصحيح واضحة قبل التصحيح","قراءة كل ورقة مرتين","تصحيح الأوراق بترتيب أسماء الطلاب","الاكتفاء بالانطباع العام عن الإجابة"],"محكات التصحيح ونموذج الإجابة يوحدان الحكم بين الأوراق والمصححين. القراءة مرتين لا تمنع الذاتية، والانطباع العام هو مصدر الذاتية نفسه."],
["L15","h","أثناء التصحيح علم المعلم أن طالباً يمر بظرف أسري صعب. التصرف الصحيح:",["تصحيح ورقته وفق معيار التصحيح نفسه المطبق على الجميع ثم دعمه بطرق أخرى","إضافة درجات لورقته مراعاةً لظرفه","إعفاؤه من السؤال الذي أخطأ فيه","تصحيح ورقته بمعيار أسهل"],"العدالة والموضوعية تقتضي معياراً واحداً للجميع؛ أما الظرف فيُعالج بالدعم والإرشاد وفرص بديلة نظامية، لا بتغيير معيار التصحيح."],
["L15","","لتقليل أثر الهالة عند تصحيح الأسئلة المقالية يُنصح بأن:",["يصحح المعلم السؤال الواحد لجميع الطلاب قبل الانتقال إلى السؤال التالي مع إخفاء الأسماء","يصحح ورقة كل طالب كاملة قبل الانتقال لورقة أخرى","يبدأ بأوراق الطلاب المتفوقين","يصحح الأوراق حسب ترتيب الحضور"],"تصحيح السؤال نفسه عبر كل الأوراق يثبت المعيار ويمنع تأثر الدرجة بالانطباع عن الطالب أو عن إجاباته السابقة. تصحيح الورقة كاملة يقوّي أثر الهالة."],
["L15","hm","أي الآتي أسلوب التقويم الأكثر مناسبة لقياس مدى تمكن طلاب الثاني الثانوي من محتوى الرياضيات الذي درسوه في الشهر الثاني؟",["اختبار يعده المعلم لطلابه في المدرسة","اختبار إنجاز مقنن توفره الوزارة","اختبار تشخيصي تقدمه إدارة التعليم","اختبارات يومية قصيرة في كتاب الطالب"],"محتوى محدد درّسه المعلم خلال فترة محددة يقيسه اختبار يبنيه المعلم على أهدافه. المقنن لا يطابق ما دُرّس بالضبط، والتشخيصي لغرض آخر، واليومي لا يغطي شهراً."],
["L15","","الترتيب الصحيح لخطوات بناء الاختبار التحصيلي:",["تحديد الأهداف، تحليل المحتوى، جدول المواصفات، صياغة الفقرات، التعليمات","صياغة الفقرات، تحديد الأهداف، جدول المواصفات، التعليمات","جدول المواصفات، تحديد الأهداف، تحليل المحتوى، صياغة الفقرات","تحليل المحتوى، صياغة الفقرات، تحديد الأهداف، التعليمات"],"يبدأ البناء بالأهداف ثم المحتوى، ثم يجمعهما جدول المواصفات، ثم تُكتب الفقرات في ضوئه، ثم التعليمات، ثم التجريب والتحليل."],
["L15","m","أي الآتي الأفضل عند تصميم الاختبار لرفع موضوعيته؟",["الاعتماد على أسئلة موضوعية ذات إجابة واحدة محددة مع نموذج إجابة","الاعتماد على أسئلة مقالية حرة","ترك تقدير الدرجة لانطباع المصحح","عدم تحديد درجة لكل سؤال"],"الموضوعية هي استقلال الدرجة عن المصحح، وتتحقق بالأسئلة محددة الإجابة ونموذج تصحيح. المقالية الحرة والانطباع وعدم تحديد الدرجات ترفع الذاتية."],
// --- الاختبارات الوطنية والدولية ولائحة التقويم ---
["L15","hm","اختبار دولي يستهدف طلاب الصف الرابع الابتدائي لقياس مهارات القراءة والاستيعاب ويُعقد كل 5 سنوات:",["PIRLS","PISA","TIMSS","TALIS"],"بيرلز خاص بالقراءة للصف الرابع كل 5 سنوات. بيزا لعمر 15 كل 3 سنوات في ثلاثة مجالات، وتيمس للرياضيات والعلوم كل 4 سنوات، وتاليس مسح للمعلمين."],
["L15","h","اختبار دولي يركز على الرياضيات والعلوم للصفين الرابع الابتدائي والثاني المتوسط ويُعقد كل 4 سنوات:",["TIMSS","PISA","PIRLS","نافس"],"تيمس يقيس الرياضيات والعلوم في الصفين الرابع والثامن كل 4 سنوات. بيزا لعمر 15 ويشمل القراءة، وبيرلز للقراءة فقط، ونافس اختبار وطني سعودي."],
["L15","hm","اختبار دولي يقيس قدرة الطلاب في عمر 15 سنة على تطبيق المعرفة في القراءة والرياضيات والعلوم في مواقف حياتية، ويُعقد كل 3 سنوات:",["PISA","TIMSS","PIRLS","نافس"],"بيزا من منظمة التعاون الاقتصادي يستهدف عمر 15 (الثالث المتوسط تقريباً) كل 3 سنوات ويركز على التطبيق الحياتي لا المنهج. تيمس للصفين الرابع والثامن كل 4 سنوات."],
["L15","h","الاختبارات الوطنية التي تنفذها هيئة تقويم التعليم والتدريب في المملكة لقياس مخرجات التعلم في القراءة والرياضيات والعلوم لصفوف محددة تُعرف باسم:",["نافس","قياس","تيمس","بيزا"],"نافس برنامج الاختبارات الوطنية السعودي للصفوف 3 و6 و9. قياس هو المركز الوطني للقياس سابقاً، وتيمس وبيزا اختبارات دولية."],
["L15","","الغرض الرئيس من الاختبارات الوطنية (نافس) هو:",["تشخيص مستوى تحصيل الطلاب على مستوى الوطن لتحسين التعليم","تحديد نجاح الطالب أو رسوبه في نهاية العام","ترتيب الطلاب داخل الصف الواحد","منح الطالب شهادة إتمام المرحلة"],"نافس تقويم نظامي يقدم مؤشرات عن جودة التعليم وليس اختباراً يترتب عليه نجاح الطالب أو ترتيبه أو شهادته."],
["L15","m","«TALIS» يختلف عن الاختبارات الدولية الأخرى في أنه:",["مسح دولي عن المعلمين وبيئات التدريس وليس اختباراً للطلاب","اختبار للرياضيات فقط","اختبار يُعقد سنوياً للصف الأول","اختبار وطني خاص بالمملكة"],"تاليس استطلاع للمعلمين وقادة المدارس عن ظروف التدريس والتطوير المهني. الاختبارات الأخرى (بيزا، تيمس، بيرلز) تُطبَّق على الطلاب."],
["L15","","يتميز اختبار PISA عن الاختبارات التحصيلية المدرسية في أنه يقيس:",["قدرة الطالب على توظيف المعرفة في مواقف حياتية حقيقية","حفظ الطالب لمحتوى المنهج الوطني","سرعة الطالب في الإجابة عن أسئلة الكتاب","سلوك الطالب داخل الفصل"],"بيزا يقيس الثقافة القرائية والرياضية والعلمية بمعنى القدرة على استخدام المعرفة في الحياة لا استظهار المنهج."],
["L15","hm","وفق لائحة تقويم الطالب في التعليم العام، يُقوَّم طلاب الصفين الأول والثاني الابتدائي من خلال:",["التقويم المستمر بمستويات أداء وصفية للمهارات","اختبار نهائي تحريري بالدرجات","اختبار وطني موحد في نهاية العام","مقابلة شفهية واحدة في نهاية الفصل"],"الصفان الأول والثاني الابتدائي يُقوَّمان تقويماً مستمراً على مهارات محددة بمستويات أداء لا بدرجات واختبار نهائي؛ أما الدرجات فمن الثالث الابتدائي فما فوق."],
["L15","","في لائحة تقويم الطالب، الغرض من مستويات الأداء في التقويم المستمر للصفوف الأولية هو:",["تحديد درجة إتقان الطالب لكل مهارة لبناء خطة علاجية عند الحاجة","ترتيب الطلاب داخل الفصل","تحديد الطلاب الراسبين فقط","مقارنة المدرسة بغيرها"],"المستويات تدرّج إتقان المهارة من الأدنى إلى الإتقان الكامل لتوجيه الدعم والعلاج، وليست أداة ترتيب أو مقارنة بين الطلاب أو المدارس."],

/* ===================== L16: القياس — الصدق والثبات وتحليل الفقرات وتوظيف النتائج ===================== */
// --- الصدق ---
["L16","hm","اختبار عن وحدة «النبات» تضمن أسئلة عن تصنيف الثدييات. هذا خلل في:",["الصدق","الثبات","الموضوعية","التمييز"],"الاختبار قاس محتوى غير الذي وُضع لقياسه، وهذا جوهر الصدق (صدق المحتوى). الثبات اتساق النتائج، والموضوعية استقلال الدرجة عن المصحح، والتمييز خاصية الفقرة."],
["L16","h","يُقصد بصدق الاختبار أنه:",["يقيس ما وُضع لقياسه فعلاً","يعطي النتائج نفسها عند إعادة تطبيقه","لا تتأثر درجاته بذاتية المصحح","يميز بين الطلاب المتفوقين والضعاف"],"الصدق هو الخاصية الأهم: قياس السمة المستهدفة. اتساق النتائج هو الثبات، واستقلال الدرجة عن المصحح هو الموضوعية، والتفريق بين الطلاب هو التمييز."],
["L16","hm","أراد معلم التأكد من أن اختباره يمثل محتوى الوحدة وأهدافها تمثيلاً متوازناً. الإجراء الأنسب:",["بناء الاختبار وفق جدول مواصفات وعرضه على محكمين","تطبيق الاختبار مرتين وحساب الارتباط","حساب كرونباخ ألفا","تقسيم الاختبار إلى نصفين"],"تمثيل المحتوى والأهداف هو صدق المحتوى، ويُضمن بجدول المواصفات وتحكيم المختصين. التطبيق مرتين والنصفان وألفا كلها طرق لتقدير الثبات."],
["L16","","الصدق الظاهري للاختبار يعني أن:",["مظهر الاختبار وعنوانه وتعليماته توحي بأنه يقيس ما وُضع له","فقراته تمثل المحتوى تمثيلاً كاملاً","درجاته ترتبط بمحك مستقبلي","فقراته تنسجم مع الإطار النظري للسمة"],"الصدق الظاهري يتعلق بالشكل العام وهو أضعف الأنواع. التمثيل الكامل صدق محتوى، والمحك المستقبلي تنبؤي، والإطار النظري صدق بناء."],
["L16","hm","حسب باحث معامل الارتباط بين درجات اختبار القبول الجامعي ومعدلات الطلاب في نهاية السنة الأولى في الجامعة. نوع الصدق الذي يتحقق منه:",["التنبؤي","التلازمي","الظاهري","المحتوى"],"المحك (المعدل الجامعي) يُجمع في المستقبل بعد الاختبار، فهذا صدق تنبؤي. التلازمي يكون المحك فيه في الوقت نفسه."],
["L16","h","بنى معلم اختباراً جديداً في القراءة وطبّقه مع اختبار مقنن في القراءة في الأسبوع نفسه، ثم حسب الارتباط بين الدرجتين. نوع الصدق:",["التلازمي","التنبؤي","البناء","الذاتي"],"المحك (الاختبار المقنن) طُبّق في الوقت نفسه تقريباً، فهذا صدق المحك التلازمي. التنبؤي يحتاج محكاً لاحقاً، والبناء يتعلق بالنظرية، والذاتي جذر الثبات."],
["L16","m","أعد باحث مقياساً لـ«التفكير الناقد» وتحقق عبر التحليل العاملي من أن فقراته تنتظم في الأبعاد التي تفترضها النظرية. نوع الصدق:",["البناء (المفهوم)","المحتوى","التلازمي","الظاهري"],"مطابقة الاختبار للإطار النظري للسمة وأبعادها هو صدق البناء (التكوين الفرضي)، ومن أساليبه التحليل العاملي والمقارنة بين المجموعات المتباينة."],
["L16","","معامل ثبات اختبار 0.81، فإن صدقه الذاتي يساوي:",["0.90","0.81","0.66","0.19"],"الصدق الذاتي = الجذر التربيعي لمعامل الثبات = جذر 0.81 = 0.9. الخطأ الشائع إعادة كتابة الثبات نفسه أو تربيعه (0.66)."],
["L16","hm","لاحظ المشرف أن أسئلة اختبار المعلم لا ترتبط بأهداف الوحدة التي درّسها. هذا يؤثر سلباً أولاً في:",["صدق الاختبار","ثبات الاختبار","موضوعية الاختبار","سهولة التصحيح"],"الأسئلة البعيدة عن الأهداف تجعل الاختبار يقيس غير ما وضع له فيضعف صدقه (المحتوى). قد يبقى الاختبار ثابتاً وموضوعياً مع ذلك."],
["L16","","صيغت فقرات اختبار بلغة فوق مستوى الطلاب فعجز كثير منهم عن فهم المطلوب. أثر ذلك أن الاختبار صار يقيس:",["فهم اللغة بدل المحتوى المستهدف فينخفض صدقه","المحتوى بدقة أكبر","مستويات التفكير العليا","المحتوى دون أي تأثر"],"إذا حالت اللغة دون إظهار الطالب ما يعرفه فالدرجة لا تمثل تحصيله الحقيقي، وهذا خلل في الصدق."],
["L16","m","استخدم معلم اختبار قواعد النحو ليحكم على القدرة اللغوية الشاملة لطلابه (قراءة وكتابة وتحدث). الخلل في هذا الاستخدام يتعلق بـ:",["الصدق، لأن الاختبار استُخدم في غير ما وُضع له","الثبات، لأن الاختبار طُبّق مرة واحدة","الموضوعية، لأن أسئلة القواعد مقالية","التمييز، لأن القواعد سهلة"],"الاختبار قد يكون صادقاً لقياس القواعد، لكنه غير صادق لقياس القدرة اللغوية الشاملة؛ فالصدق يرتبط بالغرض الذي يُستخدم له."],
["L16","hm","العبارة الصحيحة عن العلاقة بين الصدق والثبات:",["الاختبار الصادق ثابت بالضرورة، والثابت ليس بالضرورة صادقاً","الاختبار الثابت صادق بالضرورة","لا علاقة بين الصدق والثبات","الصدق والثبات مصطلحان لمفهوم واحد"],"لا يقيس الاختبار السمة بدقة إلا إذا كانت نتائجه متسقة، فالصدق يتضمن الثبات. لكن الاتساق وحده لا يضمن أنه يقيس السمة المقصودة."],
["L16","h","ميزان يعطي الوزن نفسه في كل مرة لكنه يزيد كيلوجرامين دائماً عن الوزن الحقيقي. هذا الميزان:",["ثابت وغير صادق","صادق وغير ثابت","صادق وثابت","غير صادق وغير ثابت"],"الاتساق في النتائج ثبات، لكن الانحراف المنتظم عن القيمة الحقيقية يعني أنه لا يقيس الوزن الصحيح فهو غير صادق. مثال كلاسيكي على أن الثبات لا يضمن الصدق."],
["L16","","أي أنواع الصدق الآتية يُقدَّر بحساب معامل ارتباط بين درجات الاختبار ودرجات اختبار آخر؟",["صدق المحك","صدق المحتوى","الصدق الظاهري","الصدق المنطقي"],"صدق المحك بنوعيه (التلازمي والتنبؤي) يُحسب بمعامل ارتباط مع محك خارجي. المحتوى والظاهري والمنطقي تُقدَّر بالحكم والتحليل لا بالارتباط."],
["L16","m","عرض معلم فقرات اختباره على خمسة من المتخصصين للحكم على مدى تمثيلها للمحتوى وملاءمتها للأهداف. الإجراء يتحقق من:",["صدق المحتوى","الثبات","الصدق التنبؤي","معامل التمييز"],"حكم المحكمين على تمثيل الفقرات للمحتوى والأهداف أسلوب لتقدير صدق المحتوى. الثبات والتمييز يُحسبان من درجات الطلاب، والتنبؤي يحتاج محكاً لاحقاً."],
["L16","","أي العوامل الآتية لا يُضعف صدق الاختبار؟",["تنويع مستويات الأسئلة بين التذكر والفهم والتطبيق","غموض صياغة الأسئلة","تطبيق الاختبار على فئة غير التي أُعد لها","وجود تلميحات في الصياغة تكشف الإجابة"],"تنويع المستويات يزيد تمثيل الأهداف فيرفع الصدق. أما الغموض والتطبيق على فئة مختلفة والتلميحات فتجعل الدرجة لا تمثل القدرة الحقيقية."],
// --- الثبات ---
["L16","h","طبّق معلم اختباراً على طلابه ثم أعاد تطبيق الاختبار نفسه عليهم بعد أسبوعين وحسب معامل الارتباط بين درجات التطبيقين. طريقة الثبات:",["إعادة التطبيق","الصور المتكافئة","التجزئة النصفية","ثبات المصححين"],"الاختبار نفسه على الطلاب أنفسهم بفاصل زمني هو إعادة التطبيق (معامل الاستقرار). الصور المتكافئة تحتاج نسختين، والتجزئة تطبيقاً واحداً مقسوماً نصفين."],
["L16","h","أعدّ معلم نسختين من اختبار بالمواصفات نفسها وطبقهما على المجموعة نفسها ليقدر الثبات. الخاصية التي يستهدفها:",["التكافؤ","الاستقرار","الاتساق الداخلي","التلازم"],"الارتباط بين صورتين متكافئتين يعطي معامل التكافؤ. الاستقرار لإعادة التطبيق، والاتساق الداخلي للتجزئة وألفا، والتلازم نوع من الصدق."],
["L16","hm","طبّق معلم اختباره مرة واحدة، ثم قسم فقراته إلى فردية وزوجية وحسب الارتباط بين نصفي الاختبار. طريقة الثبات:",["التجزئة النصفية","إعادة التطبيق","الصور المتكافئة","ثبات المصححين"],"تقسيم الاختبار الواحد إلى نصفين (فردي / زوجي) من تطبيق واحد هو التجزئة النصفية، ويُصحح ناتجها بمعادلة سبيرمان براون لأنها تمثل ثبات نصف الاختبار."],
["L16","h","يُستخدم معامل كرونباخ ألفا لمعرفة:",["ثبات الأداة","صدق الأداة","العلاقة النسبية بين متغيرين","معامل تمييز الفقرة"],"كرونباخ ألفا معامل اتساق داخلي يقدّر ثبات المقاييس متعددة التدريج. لا يقيس الصدق ولا التمييز ولا علاقة بين متغيرين."],
["L16","m","أراد معلم حساب ثبات اختبار كل فقراته تُصحح بـ 1 للصحيح و0 للخطأ من تطبيق واحد. المعادلة الأنسب:",["كودر ريتشاردسون","كرونباخ ألفا للمقاييس المتدرجة","معادلة التنبؤ","معامل سبيرمان للرتب"],"كودر ريتشاردسون (20 و21) مخصصة للفقرات ثنائية التصحيح. ألفا أعم وتناسب المتدرج (ليكرت)، والمعادلات الأخرى لا تقيس الثبات."],
["L16","","لحساب ثبات مقياس اتجاهات بتدريج ليكرت الخماسي (موافق بشدة إلى غير موافق بشدة)، الأنسب:",["كرونباخ ألفا","كودر ريتشاردسون","الصدق الذاتي","معامل الصعوبة"],"الفقرات متعددة التدريج تحتاج كرونباخ ألفا. كودر ريتشاردسون للفقرات الثنائية فقط، والصدق الذاتي والصعوبة ليسا طرقاً لحساب الثبات."],
["L16","hm","صحّح معلمان الأوراق نفسها لسؤال مقالي، فاختلفت درجاتهما اختلافاً كبيراً. الخاصية التي يكشف عنها هذا الاختلاف:",["ضعف ثبات المصححين (الموضوعية)","ضعف صدق المحتوى","ضعف الصدق التنبؤي","ارتفاع معامل الصعوبة"],"اختلاف المصححين على الورقة نفسها يعني أن الدرجة تتأثر بالمصحح، أي انخفاض ثبات المصححين الذي يعكس الموضوعية. لا علاقة بالمحتوى ولا بالتنبؤ ولا بالصعوبة."],
["L16","m","كان معامل الارتباط بين نصفي اختبار 0.60. معامل ثبات الاختبار كاملاً بعد تصحيحه بمعادلة سبيرمان براون:",["0.75","0.60","0.30","0.80"],"سبيرمان براون: الثبات = (2 × 0.60) ÷ (1 + 0.60) = 1.20 ÷ 1.60 = 0.75. التصحيح يرفع المعامل لأن ارتباط النصفين يمثل ثبات نصف الاختبار فقط."],
["L16","","اختبار انحرافه المعياري 10 ومعامل ثباته 0.84. الخطأ المعياري للقياس يساوي:",["4","8.4","1.6","6"],"الخطأ المعياري = الانحراف × الجذر التربيعي لـ(1 − الثبات) = 10 × جذر(1 − 0.84) = 10 × جذر(0.16) = 10 × 0.4 = 4."],
["L16","h","أي الإجراءات الآتية يرفع معامل ثبات الاختبار؟",["زيادة عدد الفقرات الجيدة في الاختبار","تطبيق الاختبار على عينة شديدة التجانس","جعل جميع الفقرات شديدة السهولة","تقليل زمن الاختبار إلى النصف"],"طول الاختبار (بفقرات جيدة) يقلل أثر الصدفة فيرفع الثبات. التجانس الشديد يقلل التباين فيخفض الثبات، والسهولة المفرطة تقلل التمييز، وتقليل الزمن يزيد العشوائية."],
["L16","hm","أجاب طالب عن سؤال إجابة صحيحة، وعند إعادة تطبيق الاختبار نفسه بعد أيام أجاب عن السؤال نفسه إجابة خاطئة دون تعلم جديد. هذا مؤشر على:",["انخفاض ثبات السؤال","ارتفاع قدرة السؤال على التمييز","ارتفاع صدق السؤال","مناسبة صعوبة السؤال"],"تذبذب الاستجابة عن الفقرة نفسها عند التكرار يعني عدم اتساق، أي ضعف ثبات. بعض مفاتيح الملخصات المتداولة تقول إن السؤال يميز الفروق الفردية، لكن التمييز يُحكم عليه بالفرق بين الفئة العليا والدنيا لا بتذبذب الطالب الواحد."],
["L16","","كلما كبر الخطأ المعياري للقياس في اختبار، فإن معامل ثباته:",["ينخفض","يرتفع","لا يتأثر","يساوي الصفر دائماً"],"الخطأ المعياري يعبر عن تذبذب الدرجة الملاحظة حول الحقيقية؛ وكبره يعني اتساقاً أقل، أي ثباتاً أقل. العلاقة عكسية بينهما."],
["L16","m","طبّق باحث اختباراً على مجموعة متقاربة جداً في قدراتها فحصل على معامل ثبات منخفض رغم جودة الفقرات. السبب الأرجح:",["تجانس العينة قلل التباين بين الدرجات","طول الاختبار الزائد","صعوبة الفقرات المتوسطة","وضوح التعليمات"],"معامل الثبات ارتباط، والارتباط ينخفض حين يقل التباين؛ فالعينة المتجانسة تعطي ثباتاً أقل. الطول والصعوبة المتوسطة والوضوح عوامل ترفع الثبات."],
["L16","","أعاد معلم تطبيق الاختبار نفسه في اليوم التالي مباشرة. الأثر المتوقع على معامل الثبات:",["يرتفع زيفاً بسبب تذكر الطلاب لإجاباتهم","ينخفض بسبب نسيان الطلاب","لا يتأثر بالفاصل الزمني","يصبح سالباً"],"قصر الفترة بين التطبيقين يجعل الذاكرة ترفع الاتفاق بين الدرجتين فيبدو الثبات أعلى من حقيقته؛ لذلك يُفضَّل فاصل مناسب (نحو أسبوعين)."],
["L16","h","تعني الموضوعية في الاختبار:",["عدم تأثر درجة الطالب بذاتية المصحح وأحكامه الشخصية","قياس الاختبار لما وُضع لقياسه","استقرار النتائج عند إعادة التطبيق","قدرة الاختبار على التفريق بين الطلاب"],"الموضوعية هي استقلال الدرجة عن المصحح. قياس ما وُضع له هو الصدق، والاستقرار هو الثبات، والتفريق هو التمييز."],
["L16","hm","طُبّق اختبار على عينة، ثم أُعيد تطبيقه بعد شهرين على العينة نفسها، وحُسب معامل الارتباط بين التطبيقين. المعامل الناتج يسمى معامل:",["الاستقرار","التكافؤ","الاتساق الداخلي","الصدق التلازمي"],"الارتباط بين تطبيقين للاختبار نفسه عبر الزمن هو معامل الاستقرار. التكافؤ بين صورتين، والاتساق الداخلي من تطبيق واحد، والتلازمي صدق."],
["L16","","الخاصية التي تُعد شرطاً ضرورياً لصدق الاختبار لكنها غير كافية له:",["الثبات","الشمول","سهولة التطبيق","طول الاختبار"],"بلا ثبات لا صدق، لكن الثبات وحده لا يضمن الصدق. الشمول والسهولة والطول خصائص مساعدة لا تُعد شرطاً منطقياً للصدق."],
["L16","m","ترتيب الخصائص من حيث العلاقة الشرطية بينها:",["الموضوعية شرط للثبات، والثبات شرط للصدق","الصدق شرط للثبات، والثبات شرط للموضوعية","الثبات شرط للموضوعية، والموضوعية شرط للصدق","لا توجد علاقة شرطية بين الثلاث"],"إذا تأثرت الدرجة بالمصحح اختل اتساقها (الثبات)، وإذا اختل الاتساق لم يقس الاختبار السمة بدقة (الصدق). فالموضوعية في القاعدة والصدق في القمة."],
["L16","","أي الآتي يُعد من عوامل انخفاض ثبات الاختبار؟",["غموض التعليمات واختلاف ظروف التطبيق بين الطلاب","زيادة عدد الفقرات","تباين قدرات العينة","صعوبة الفقرات المتوسطة"],"الغموض وتفاوت الظروف يدخلان أخطاء عشوائية في الدرجات فيقل الاتساق. الطول وتباين العينة والصعوبة المتوسطة ترفع الثبات."],
// --- تحليل الفقرات ---
["L16","hm","أجاب 30 طالباً من 40 إجابة صحيحة عن فقرة. معامل صعوبة الفقرة وتفسيره:",["0.75 وهي فقرة سهلة نسبياً","0.25 وهي فقرة صعبة","0.75 وهي فقرة صعبة","1.33 وهي فقرة متوسطة"],"معامل الصعوبة = 30 ÷ 40 = 0.75. كلما ارتفع المعامل كانت الفقرة أسهل؛ 0.75 فوق المتوسط (0.50) فهي سهلة نسبياً لكنها ضمن المدى المقبول."],
["L16","h","أجاب 10 طلاب من 50 إجابة صحيحة عن فقرة. الحكم على الفقرة:",["معامل صعوبتها 0.20 وهي صعبة","معامل صعوبتها 0.80 وهي سهلة","معامل صعوبتها 0.50 وهي متوسطة","معامل صعوبتها 5 وهي غير صالحة"],"المعامل = 10 ÷ 50 = 0.20، أي أجاب عنها 20% فقط فهي صعبة وعلى حدود المدى المقبول الأدنى. الرقم 0.80 هو نسبة المخطئين."],
["L16","hm","قُسّم الطلاب إلى مجموعتين عليا ودنيا في كل منهما 25 طالباً. أجاب عن الفقرة 18 من العليا و8 من الدنيا. معامل التمييز:",["0.40","0.52","0.26","0.72"],"معامل التمييز = (18 − 8) ÷ 25 = 10 ÷ 25 = 0.40، وهو تمييز ممتاز. الرقم 0.52 هو معامل الصعوبة بطريقة المجموعتين (26 ÷ 50)."],
["L16","","في اختبار على 100 طالب أُخذت المجموعة العليا (27 طالباً) والدنيا (27 طالباً). أجاب عن الفقرة 20 من العليا و5 من الدنيا. معامل التمييز تقريباً:",["0.56","0.25","0.46","0.15"],"التمييز = (20 − 5) ÷ 27 = 15 ÷ 27 ≈ 0.56، أي ممتاز. القسمة تكون على عدد أفراد إحدى المجموعتين (27) لا على العدد الكلي."],
["L16","m","في مجموعتين قوام كل منهما 20 طالباً، أجاب عن الفقرة 6 من العليا و14 من الدنيا. القرار المناسب:",["حذف الفقرة فوراً لأن تمييزها سالب (−0.40)","الإبقاء عليها لأن صعوبتها متوسطة","تعديلها قليلاً لأن تمييزها 0.40","استبدال أحد مشتتاتها فقط"],"التمييز = (6 − 14) ÷ 20 = −0.40؛ الإشارة السالبة تعني أن الضعاف أجابوا أفضل من المتفوقين، وهذا خلل جوهري يستوجب الحذف وإن كانت الصعوبة (20 ÷ 40 = 0.50) متوسطة."],
["L16","h","المشتت الجيد في سؤال الاختيار من متعدد هو الذي:",["يجذب عدداً من الفئة الدنيا أكبر مما يجذب من الفئة العليا","يجذب عدداً من الفئة العليا أكبر مما يجذب من الفئة الدنيا","لا يختاره أي طالب","يختاره جميع الطلاب بالتساوي"],"المشتت يؤدي وظيفته حين يخدع من لم يتقن المحتوى (الدنيا) ولا يخدع المتقنين. إن جذب العليا أكثر فقد يكون غامضاً أو صحيحاً جزئياً، وإن لم يختره أحد فهو غير فعال."],
["L16","hm","عند تحليل فقرة اختيار من متعدد تبين أن أحد المشتتات لم يختره أي طالب. التصرف المناسب:",["استبداله بمشتت معقول لأنه غير فعال","الإبقاء عليه لأنه لا يضر","حذف الفقرة كاملة","اعتباره الإجابة الصحيحة"],"المشتت الذي لا يجذب أحداً يقلل عدد البدائل الفعالة ويزيد التخمين، فيُستبدل بمشتت معقول. الفقرة نفسها قد تكون جيدة فلا تُحذف."],
