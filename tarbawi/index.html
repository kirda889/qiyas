نقد","تشجيعه على تكرار المحاولات دون تفسير"],"نظرية العزو (واينر): عزو الفشل إلى الجهد (متغير قابل للضبط) يدفع للمحاولة، وعزوه إلى القدرة يُحبط. التعزيز المادي سلوكي لا معرفي."],["L10","","كان طالب يرسم في البيت لمتعته، ثم بدأ المعلم يعطيه درجات على كل رسمة، فلما توقفت الدرجات توقف عن الرسم. يفسر ذلك:",["المكافآت الخارجية المفرطة أضعفت الدافعية الداخلية","الانطفاء في الإشراط الكلاسيكي","تدني الذكاء المكاني","العجز المتعلم"],"أثر التبرير الزائد: المكافأة الخارجية على نشاط محبب داخلياً تُحوّل الدافع إلى خارجي فيزول بزوالها."],["L10","m","يقول طالب بعد نجاحه: «نجحت لأن الاختبار كان سهلاً». وفق واينر، عزا نجاحه إلى سبب:",["خارجي ثابت","داخلي ثابت","داخلي متغير","خارجي متغير"],"صعوبة المهمة سبب خارجي ثابت. الحظ خارجي متغير، والجهد داخلي متغير، والقدرة داخلية ثابتة."],["L10","","يأتي طالب إلى المدرسة دون إفطار ويبدو خائفاً من زملاء يتنمرون عليه، ولا تنفع معه المكافآت لرفع تحصيله. وفق ماسلو، الخطوة الأولى:",["إشباع حاجاته الفسيولوجية وحاجة الأمن أولاً","زيادة المكافآت والدرجات","تكليفه بمهام تحقق ذاته","تجاهل الأمر لأنه خارج الصف"],"الحاجات الدنيا (طعام، أمن) تسبق الحاجات العليا؛ لا تعلم مع جوع أو خوف."],["L10","","وفق قانون يركس–دودسون، العلاقة بين مستوى القلق (الاستثارة) والأداء:",["منحنى مقلوب: الأداء الأفضل عند الاستثارة المتوسطة","خطية موجبة: كلما زاد القلق تحسن الأداء","خطية سالبة: كلما زاد القلق ساء الأداء","لا علاقة بينهما"],"الاستثارة المتوسطة تُحسّن الأداء، أما المنخفضة جداً أو المرتفعة جداً فتضعفه."],["L10","m","طالب لا يبالي بالاختبار إطلاقاً فيؤدي ضعيفاً، وآخر يرتعش من شدة القلق فينسى ما حفظ. ما ينصح به المعلم لكليهما وفق يركس–دودسون:",["رفع قلق الأول قليلاً وتهدئة الثاني للوصول إلى مستوى متوسط","إزالة القلق تماماً عند الاثنين","زيادة القلق عند الاثنين","تجاهل عامل القلق"],"الأداء الأمثل عند الاستثارة المتوسطة، فالمنخفض يُرفع والمرتفع يُخفض."],["L10","","يختار طالب ذو دافع إنجاز مرتفع المهام التي:",["متوسطة الصعوبة وتتحدى قدراته","سهلة جداً لضمان النجاح","مستحيلة ليُعذر عند الفشل","يختارها له الآخرون"],"وفق ماكليلاند وأتكنسون، ذو دافع الإنجاز المرتفع يفضل المهام متوسطة الصعوبة، ومنخفضه يختار السهل جداً أو الصعب جداً."],["L10","m","طالب هدفه من المذاكرة أن يحصل على أعلى درجة ليُظهر تفوقه، وآخر هدفه أن يفهم ويتحسن حتى لو أخطأ. وفق دويك، الأول توجهه:",["أداء، والثاني توجهه إتقان","إتقان، والثاني توجهه أداء","داخلي، والثاني خارجي","تجنب، والثاني اقتراب"],"توجه الأداء يسعى لإثبات القدرة والظهور، وتوجه الإتقان يسعى للتعلم ويرى الخطأ فرصة."],["L10","m","أي الممارسات أكثر دعماً لدافعية الطلاب في الصف؟",["تغذية راجعة فورية وصفية وأهداف قريبة قابلة للتحقيق","مقارنة درجات الطلاب علناً","مكافآت مادية لكل إجابة","تأجيل التغذية الراجعة إلى نهاية الفصل"],"التغذية الفورية الوصفية والأهداف القريبة ترفع الكفاءة الذاتية. المقارنة تُحبط، والمكافآت المفرطة تضعف الداخلية، والتأجيل يفقد الأثر."],["L10","","مصادر الكفاءة الذاتية عند باندورا هي خبرات الإتقان والخبرات البديلة والإقناع اللفظي و:",["الحالة الفسيولوجية والانفعالية","الذكاء الموروث","المستوى الاقتصادي","جداول التعزيز"],"المصدر الرابع هو الحالة الفسيولوجية والانفعالية (القلق، التعب) التي يفسرها الفرد كمؤشر على قدرته."],["L10","","واضع أول اختبار للذكاء وصاحب مفهوم العمر العقلي:",["بينيه","سبيرمان","وكسلر","جاردنر"],"بينيه (1905) وضع أول مقياس للذكاء مع سيمون. وكسلر لاحق، وسبيرمان نظرية العاملين."],["L10","","نسبة الذكاء تُحسب بالعلاقة:",["العمر العقلي ÷ العمر الزمني × 100","العمر الزمني ÷ العمر العقلي × 100","العمر العقلي − العمر الزمني","العمر العقلي + العمر الزمني ÷ 2"],"معادلة ستيرن/تيرمان: ن.ذ = ع.ع ÷ ع.ز × 100؛ فطفل عمره العقلي 12 وزمنه 10 نسبته 120."],["L10","","طفل عمره الزمني 8 سنوات وعمره العقلي 10 سنوات. نسبة ذكائه:",["125","80","100","180"],"10 ÷ 8 × 100 = 125. القسمة العكسية تعطي 80 خطأً."],["L10","m","حصل طالب على 68 في اختبار ذكاء مقنن ولديه قصور واضح في مهارات الحياة اليومية. التصنيف الأقرب:",["إعاقة فكرية","بطء تعلم","صعوبات تعلم","موهبة"],"أقل من 70 مع قصور في السلوك التكيفي = إعاقة فكرية. بطء التعلم 70–85، وصعوبات التعلم ذكاء عادي."],["L10","","نظرية الذكاء التي تفترض عاملاً عاماً (g) يشترك في جميع القدرات وعوامل خاصة (s):",["سبيرمان","ثيرستون","جاردنر","ستيرنبرغ"],"سبيرمان صاحب نظرية العاملين. ثيرستون قدرات أولية، جاردنر متعددة، ستيرنبرغ ثلاثي."],["L10","","طالب يحل مسائل جديدة غير مألوفة بسرعة لكنه ضعيف في المعلومات العامة والمفردات. وفق كاتل، يبرز لديه الذكاء:",["السائل","المتبلور","الوجداني","العملي"],"السائل قدرة فطرية على حل المشكلات الجديدة، والمتبلور معارف مكتسبة (مفردات ومعلومات)."],["L10","","نظرية بنية العقل التي صنفت القدرات في أبعاد (العمليات × المحتوى × النواتج) وفرقت بين التفكير التقاربي والتباعدي لـ:",["جيلفورد","جاردنر","ثيرستون","بينيه"],"جيلفورد صاحب نموذج بنية العقل (120–180 قدرة) والتفكير التباعدي أساس الإبداع."],["L10","","طلب المعلم من طلابه اقتراح أكبر عدد ممكن من استخدامات علبة الكرتون في دقيقتين. المهارة الإبداعية المستهدفة:",["الطلاقة","المرونة","الأصالة","التوسع"],"الطلاقة كمية الأفكار في زمن محدد. المرونة تنوعها، والأصالة ندرتها، والتوسع التفاصيل."],["L10","m","قدم طالب أفكاراً لاستخدام علبة الكرتون تنوعت بين التخزين والديكور واللعب والزراعة، بينما اقتصر زميله على أفكار التخزين. يتفوق الأول في:",["المرونة","الطلاقة","الأصالة","الحساسية للمشكلات"],"تنوع فئات الأفكار وتغيير الزاوية هو المرونة، بغض النظر عن عددها."],["L10","","قدمت طالبة فكرة لم يذكرها أحد في الصف ولم تخطر على بال المعلم. المهارة الإبداعية التي تبرز لديها:",["الأصالة","الطلاقة","المرونة","الإفاضة"],"الأصالة ندرة الفكرة وجدّتها."],["L10","m","بعد أن طرح طالب فكرة مشروع، أضاف إليها تفاصيل الخطوات والأدوات والرسوم التوضيحية. المهارة:",["الإفاضة (التوسع)","الطلاقة","المرونة","الأصالة"],"إضافة التفاصيل والتوضيحات إلى الفكرة هي الإفاضة."],["L10","","مراحل العملية الإبداعية بالترتيب:",["الإعداد ← الاحتضان ← الإلهام ← التحقق","الإلهام ← الإعداد ← الاحتضان ← التحقق","الاحتضان ← الإعداد ← التحقق ← الإلهام","الإعداد ← الإلهام ← الاحتضان ← التحقق"],"والاس: جمع المعلومات (إعداد)، ثم تركها تختمر (احتضان)، ثم ومضة الفكرة (إلهام)، ثم اختبارها (تحقق)."],["L10","","توقف باحث عن التفكير في مشكلة عالقة وذهب للمشي، ثم خطر له الحل فجأة. المرحلة التي كان فيها قبل خطور الحل:",["الاحتضان","الإعداد","التحقق","الإلهام"],"ترك المشكلة تختمر لا شعورياً هو الاحتضان الذي يسبق الإلهام."],["L10","","أي الأنشطة يُعد نشاطاً ما وراء معرفي؟",["يراجع الطالب خطته لحل المسألة ويسأل نفسه هل هذه أفضل طريقة","يقرأ الطالب النص قراءة صامتة","يحفظ الطالب القصيدة","ينسخ الطالب الدرس في دفتره"],"مراقبة الخطة وتقويمها تفكير في التفكير. القراءة والحفظ والنسخ مهارات معرفية."],["L10","m","قال طالب في نقاش: «هذه الفكرة ستفشل لأن التكلفة مرتفعة والوقت قصير». وفق القبعات الست، يفكر بالقبعة:",["السوداء","الحمراء","الصفراء","الخضراء"],"الحذر والسلبيات والمخاطر قبعة سوداء. الحمراء مشاعر، الصفراء فوائد، الخضراء إبداع."],["L10","","طلب قائد المجموعة: «لنعرض الأرقام والحقائق المتوفرة أولاً». القبعة المستخدمة:",["البيضاء","الزرقاء","الحمراء","السوداء"],"البيضاء للحقائق والمعلومات المحايدة. الزرقاء تنظم عملية التفكير."],["L10","m","قالت طالبة: «لا أعرف السبب لكنني أشعر أن هذا الحل لا يريحني». القبعة:",["الحمراء","البيضاء","الصفراء","الزرقاء"],"المشاعر والحدس دون تبرير قبعة حمراء."],["L10","","في نهاية النقاش قال المعلم: «لنلخص ما توصلنا إليه ونحدد الخطوة التالية». القبعة:",["الزرقاء","الخضراء","الصفراء","البيضاء"],"الزرقاء تضبط عملية التفكير وتنظمها وتلخص وتتخذ القرار."],["L10","","القبعة الخضراء في نموذج ديبونو تمثل:",["الإبداع والبدائل والأفكار الجديدة","الحقائق والمعلومات","السلبيات والمخاطر","الإيجابيات والفوائد"],"الخضراء لون النمو: الإبداع والاقتراحات. البيضاء حقائق، السوداء مخاطر، الصفراء فوائد."],["L10","","برنامج ديبونو لتعليم مهارات التفكير تعليماً مباشراً في وحدات (توسعة الإدراك، التنظيم، التفاعل، الإبداع…) يُسمى:",["كورت","4MAT","سكامبر","VARK"],"كورت برنامج ديبونو. 4MAT لمكارثي، سكامبر لتوليد الأفكار، VARK أنماط التعلم."],["L10","","مهارات التفكير العليا في تصنيف بلوم المعدل هي:",["التحليل والتقويم والإبداع","التذكر والفهم والتطبيق","الفهم والتطبيق والتحليل","التذكر والتقويم والإبداع"],"المستويات العليا الثلاثة: تحليل، تقويم، إبداع. الدنيا: تذكر، فهم، تطبيق."],["L10","m","طلب معلم من طلابه اختيار أفضل ثلاثة حلول من قائمة عشرين حلاً وتبرير الاختيار بمعايير. نوع التفكير:",["ناقد","إبداعي","تباعدي","حدسي"],"الفرز والمفاضلة والتقويم بمعايير تفكير ناقد (تقاربي). توليد العشرين كان إبداعياً تباعدياً."],["L10","","التفكير الذي يُنتج إجابات متعددة لمشكلة واحدة، ويُعد أساس الإبداع عند جيلفورد:",["التباعدي","التقاربي","الناقد","الاستنباطي"],"التباعدي ينطلق إلى حلول متعددة، والتقاربي يصل إلى الحل الواحد الصحيح."],["L10","m","أي أسئلة المعلم التالية أكثر تنمية للتفكير الإبداعي لدى طلاب الصف الخامس بعد قراءة قصة؟",["ماذا لو تغيرت نهاية القصة؟ اكتب نهاية أخرى","من بطل القصة؟","في أي زمن وقعت أحداث القصة؟","ما معنى الكلمة الواردة في السطر الثالث؟"],"السؤال المفتوح متعدد الإجابات (ماذا لو) يستدعي الطلاقة والأصالة. الأسئلة الأخرى استدعاء معلومات."],["L10","","أي مما يلي ليس من معوقات التفكير الإبداعي؟",["تقبل الأفكار غير المألوفة","الخوف من الخطأ","النقد المبكر للأفكار","الجمود الذهني"],"تقبل الغريب من محفزات الإبداع. الخوف والنقد المبكر والجمود معوقات."],["L10","","أي مما يلي لا يُعد من مكونات الذكاء الوجداني عند جولمان؟",["الاستدلال العددي","الوعي بالذات","التعاطف","تنظيم الانفعالات"],"الاستدلال العددي قدرة عقلية أولية عند ثيرستون. مكونات جولمان: الوعي بالذات، تنظيم الانفعالات، الدافعية، التعاطف، المهارات الاجتماعية."],["L10","","يلاحظ المعلم أن طالباً يتوتر ويغضب بسرعة عند أي تعليق من زملائه ويصعب عليه فهم مشاعرهم. الجانب الذي يحتاج تنميته:",["الذكاء الوجداني","الذكاء المنطقي الرياضي","الطلاقة اللفظية","الذكاء المكاني"],"ضبط الانفعال والتعاطف من مكونات الذكاء الوجداني (جولمان)."],["L05","h","قال تعالى: «واتقوا يوماً تُرجعون فيه إلى الله»، الفعل «ترجعون» مرفوع بـ:",["ثبوت النون","الضمة","الواو","الألف"],"ترجعون من الأفعال الخمسة لأنه مضارع اتصلت به واو الجماعة، ولم يسبقه ناصب ولا جازم فهو مرفوع بثبوت النون."],["L05","h","«ابتهجت روحي برؤية البحر ابتهاجاً»، إعراب كلمة «ابتهاجاً»:",["مفعول مطلق منصوب","مفعول به منصوب","مفعول لأجله منصوب","مفعول معه منصوب"],"«ابتهاجاً» مصدر من لفظ الفعل «ابتهجت» جاء لتوكيده فهو مفعول مطلق. المفعول لأجله يبين السبب وليس من لفظ الفعل."],["L05","h","«حضر المعلمون جميعاً»، إعراب كلمة «جميعاً»:",["حال منصوبة","توكيد معنوي","مفعول به","نعت"],"«جميعاً» من الكلمات التي تُعرب حالاً دائماً (معاً، وحده، عمداً). ولو قيل «جميعُهم» بالإضافة إلى الضمير لكانت توكيداً معنوياً."],["L05","h","«جاء ...... العلمِ»، الكلمة الصحيحة في الفراغ:",["طالبا","طالبان","طالبين","طالبي"],"الفاعل مثنى مرفوع بالألف، ونون المثنى تُحذف عند الإضافة: طالبا العلم. و«طالبان» تصح لو لم يُضف."],["L06","h","دفع رجل 5000 ريال زكاةً لماله؛ مقدار ماله قبل دفع الزكاة:",["200000 ريال","100000 ريال","300000 ريال","400000 ريال"],"المال = الزكاة × 40 = 5000 × 40 = 200000؛ لأن الزكاة ربع العشر (2.5%)."],["L06","h","في العدد 2571315، الرقم 5 الواقع على يسار الرقم 7 في منزلة:",["مئات الألوف","عشرات الألوف","آحاد الملايين","آحاد الألوف"],"من اليمين: 5 آحاد، 1 عشرات، 3 مئات، 1 آحاد الألوف، 7 عشرات الألوف، 5 مئات الألوف، 2 آحاد الملايين."],["L06","h","إذا مشى خالد حول ملعب مستطيل طوله 12 م وعرضه 8 م دورتين كاملتين، فالمسافة التي قطعها:",["80 م","40 م","96 م","192 م"],"محيط المستطيل = 2 × (12 + 8) = 40 م، ودورتان = 80 م. و96 مساحته لا محيطه."],["L15","","كتب المعلم بجانب درجة الطالب عبارة «مستوى جيد جداً» مستنداً إلى محك محدد، دون وضع خطة لتحسين أدائه. هذا الإجراء يمثل:",["تقييماً","قياساً","تقويماً","تغذية راجعة"],"إصدار حكم على قيمة الأداء في ضوء محك هو التقييم. القياس لا يتضمن حكماً، والتقويم يضيف العلاج والتعديل، والتغذية الراجعة تصف الأداء وتوجه."],["L15","m","الترتيب المنطقي الصحيح لعمليات الحكم على تعلم الطالب هو:",["قياس ثم تقييم ثم تقويم","تقويم ثم قياس ثم تقييم","تقييم ثم قياس ثم تقويم","قياس ثم تقويم ثم تقييم"],"يبدأ بالقياس (جمع أرقام)، ثم التقييم (حكم في ضوء محك)، ثم التقويم (قرار التعديل والعلاج). لا يمكن الحكم قبل القياس ولا العلاج قبل الحكم."],["L15","","العلاقة بين الاختبار والقياس هي أن الاختبار:",["أداة من أدوات القياس","مرادف للتقويم","أحد أنواع التقويم الختامي","الغاية التي يسعى إليها القياس"],"الاختبار وسيلة لجمع البيانات الكمية، أي أداة قياس. ليس مرادفاً للتقويم لأن التقويم أشمل، وليس نوعاً من التقويم بل أداة قد تستخدم في أي نوع."],["L15","m","أراد معلم أن يعرف ما اكتسبه طلابه فعلاً من معارف ومهارات بعد تدريس وحدة كاملة، لا ما يمكن أن يتعلموه مستقبلاً. الاختبار المناسب هو اختبار:",["تحصيلي","استعداد","ذكاء","قدرات عامة"],"الاختبار التحصيلي يقيس نواتج التعلم الفعلية. اختبار الاستعداد يتنبأ بإمكانية التعلم مستقبلاً، والذكاء والقدرات يقيسان قدرة عامة لا محتوى درسه الطالب."],["L15","","اختبار يُطبَّق على طلاب الثالث الثانوي للتنبؤ بمدى نجاحهم في تخصص هندسي مستقبلاً هو اختبار:",["استعداد","تحصيل","تشخيصي","ختامي"],"اختبارات الاستعداد تقيس إمكانية التعلم أو النجاح مستقبلاً. التحصيلي يقيس ما تعلمه الطالب فعلاً، والتشخيصي يبحث عن مواطن الضعف، والختامي يصدر حكم النهاية."],["L15","m","أي الآتي لا يُعد من خصائص الاختبارات المقننة؟",["يعدّه المعلم لطلابه وفق ما درّسه في فصله","تطبَّق في ظروف وتعليمات موحدة لجميع المختبرين","يعدّها فريق من المتخصصين بإشراف مراكز القياس","لها معايير تُفسَّر الدرجات في ضوئها"],"الاختبار المقنن يعدّه متخصصون ويطبَّق بظروف موحدة وله معايير؛ أما الاختبار الذي يعدّه المعلم لصفه فهو اختبار معلم غير مقنن مهما كانت جودته."],["L15","","أي الآتي لا يُعد من خصائص التقويم الجيد؟",["أن يكون نشاطاً ختامياً في نهاية العام فقط","أن يكون مستمراً يواكب التعلم","أن يكون شاملاً لجوانب المتعلم المعرفية والمهارية والوجدانية","أن يكون تعاونياً يشارك فيه المعلم والطالب وولي الأمر"],"التقويم الجيد مستمر وشامل وتعاوني وعلمي واقتصادي، وليس غاية بحد ذاته ولا نشاطاً ختامياً فقط؛ فاقتصاره على نهاية العام يفقده وظيفة التحسين."],["L15","m","الفرق الجوهري بين التقويم التكويني والتقويم الختامي يكمن في:",["التوقيت والغرض: تحسين التعلم أثناءه مقابل إصدار الحكم في نهايته","نوع الأسئلة: موضوعية مقابل مقالية","من يقوم بالتصحيح: الطالب مقابل المعلم","عدد الأسئلة: قليلة مقابل كثيرة"],"التكويني أثناء التدريس وغايته التحسين والتغذية الراجعة، والختامي في النهاية وغايته الحكم. أما نوع الأسئلة وعددها ومن يصحح فلا يميز بينهما."],["L15","","يُطلق على التقويم التكويني أحياناً اسم التقويم:",["المستمر","النهائي","المقنن","المعياري"],"لأنه يواكب التعلم ويستمر معه طوال التدريس. النهائي هو الختامي، والمقنن وصف للاختبار لا لنوع التقويم، والمعياري طريقة تفسير."],["L15","","طبّق معلم اختباراً في بداية العام ثم صنّف الطلاب في مجموعات متجانسة في مستوى المهارة ليخطط لتعليم يناسب كل مجموعة. التقويم المستخدم:",["قبلي","ختامي","تكويني","ذاتي"],"توزيع الطلاب في مستويات وتصنيفهم قبل التعلم من أغراض التقويم القبلي. الختامي يحكم بعد التعلم، والتكويني أثناءه، والذاتي يقوم به الطالب."],["L15","m","أي أنواع التقويم الآتية يفيد في الحكم على مدى فاعلية طرق التدريس التي استُخدمت خلال الفصل الدراسي كاملاً؟",["الختامي","القبلي","التشخيصي","الذاتي"],"من أغراض التقويم الختامي الحكم على فاعلية جهود المعلم وطرق تدريسه ومقارنة الشعب. القبلي والتشخيصي يسبقان التعلم أو يبحثان عن الصعوبات."],["L15","","تظهر نتائج الاختبار محكي المرجع عادة في صورة:",["قائمة وصفية بالأهداف التي تحققت والتي لم تتحقق","ترتيب الطلاب من الأعلى إلى الأدنى","رتب مئينية ودرجات معيارية","منحنى اعتدالي لدرجات الصف"],"المحكي يخبرنا ما يستطيع الطالب عمله (أتقن / لم يتقن) فنتائجه قائمة أهداف. الترتيب والرتب المئينية والمنحنى الاعتدالي كلها أدوات التفسير معياري المرجع."],["L15","m","في استراتيجية التعلم للإتقان لا ينتقل الطالب إلى المهارة التالية حتى يصل إلى 80% في اختبار المهارة الحالية. نوع التقويم المعتمد:",["محكي المرجع","معياري المرجع","ذاتي المرجع","قبلي"],"نسبة الإتقان المحددة مسبقاً (80%) محك ثابت يقارن به أداء الطالب، فهو محكي المرجع. لا علاقة له بأداء الآخرين فليس معيارياً."],["L15","","يكون التقويم معياري المرجع هو الأنسب عندما يكون الغرض:",["الانتقاء والتصفية للقبول في برنامج بمقاعد محدودة","التأكد من إتقان الطالب لمهارات وحدة معينة","منح شهادة إتقان لمهارة مهنية","تشخيص أسباب تدني أداء طالب"],"الانتقاء والمفاضلة يحتاجان ترتيب المتقدمين بعضهم بالنسبة لبعض، وهذا جوهر المعياري. الإتقان والشهادات والتشخيص تحتاج مقارنة بمحك محدد."],["L15","m","قارن معلم درجة الطالب في اختبار الشهر الثاني بدرجته هو نفسه في الشهر الأول ليحكم على تقدمه. هذا التفسير:",["ذاتي المرجع","معياري المرجع","محكي المرجع","مقنن"],"مقارنة الطالب بأدائه السابق تفسير ذاتي المرجع يركز على النمو الفردي. المعياري يقارن بالأقران، والمحكي بمستوى إتقان محدد."],["L15","","أي الآتي يصف «التقويم من أجل التعلم» وصفاً صحيحاً؟",["بحث عن أدلة التعلم وتفسيرها من المعلم والمتعلم لتوجيه الخطوة التالية","إصدار حكم نهائي على مستوى الطالب في نهاية الوحدة","ترتيب الطلاب لاختيار المتفوقين منهم","قياس قدرات الطالب العقلية العامة"],"التقويم من أجل التعلم تقويم تكويني يستخدم الأدلة لتوجيه التعلم والتدريس. الحكم النهائي هو تقويم التعلم، والترتيب معياري، وقياس القدرات ليس تقويماً صفياً."],["L15","m","تبادل طالبان مسودتي موضوع التعبير وصحّح كل منهما عمل الآخر وفق قائمة محكات أعدّها المعلم. هذا الأسلوب:",["تقويم الأقران","التقويم الذاتي","التقويم الختامي","تقويم الأداء"],"حكم الطالب على عمل زميله وفق محكات هو تقويم الأقران. الذاتي حكم الطالب على عمله هو، والأداء يتعلق بإنجاز مهمة فعلية، والختامي حكم المعلم في النهاية."],["L15","","أهم ميزة للتقويم الذاتي بالنسبة للطالب أنه:",["يساعده على اكتشاف أخطائه وتعديل مساره بنفسه","يوفر على المعلم وقت التصحيح","يرفع درجاته في الاختبار الختامي","يغني عن تقويم المعلم"],"التقويم الذاتي ينمي وعي الطالب بأخطائه ودوافعه فيعدل سلوكه ويزيد ثقته. توفير الوقت نظرة تركز على المعلم، ولا يغني عن تقويم المعلم ولا يرفع الدرجات بالضرورة."],["L15","m","في نهاية كل حصة يطلب المعلم من طلابه كتابة ثلاث جمل عن أهم ما تعلموه وما بقي غامضاً لديهم. هذا الأسلوب يخدم أساساً:",["التقويم التكويني والتغذية الراجعة للمعلم","رصد درجات أعمال السنة","التقويم الختامي للوحدة","تصنيف الطلاب إلى مستويات"],"تذكرة الخروج تكشف ما تعلمه الطلاب وما غمض عليهم فيعدل المعلم الحصة التالية؛ وهذا تقويم تكويني. ليست أداة رصد درجات ولا تصنيف ولا حكم ختامي."],["L15","h","طلب المعلم من كل طالب جمع أعماله بانتظام في حقيبة، وفي كل أسبوع يراجع أعماله السابقة ويكتب ملاحظاته عن تقدمه. الأداة التي يستخدمها المعلم:",["ملف الإنجاز","السجل القصصي","قائمة الشطب","سلم التقدير العددي"],"جمع الأعمال بانتظام ومراجعتها بهدف التأمل في التقدم هو ملف الإنجاز (البورتفوليو). السجل القصصي يكتبه المعلم عن سلوك الطالب، والشطب والسلم أدوات رصد أداء."],["L15","","أداة تقويم تتضمن عبارات مثل «دائماً، غالباً، أحياناً، نادراً» لتقدير تكرار سلوك الطالب هي:",["سلم التقدير اللفظي","قائمة الشطب","سلم التقدير العددي","الروبرك"],"التدريج بكلمات وصفية للتكرار هو سلم التقدير اللفظي. العددي يستخدم أرقاماً، والشطب نعم / لا، والروبرك يصف مستويات الجودة لكل معيار."],["L15","","الميزة الأساسية للروبرك التحليلي مقارنة بالروبرك الكلي أنه:",["يقدم تغذية راجعة تفصيلية عن كل معيار على حدة","أسرع في التصحيح","لا يحتاج إلى محكات مسبقة","يعطي حكماً عاماً واحداً على العمل"],"الروبرك التحليلي يفصّل الدرجة لكل معيار فيعرف الطالب موضع قوته وضعفه. الكلي أسرع لكنه يعطي حكماً عاماً واحداً، وكلاهما يحتاج محكات مسبقة."],["L15","m","أراد معلم الكيمياء تقويم مهارة طلابه في إجراء تجربة معايرة. الأداة الأنسب:",["بطاقة ملاحظة بسلم تقدير للأداء","اختبار اختيار من متعدد عن خطوات التجربة","اختبار مقالي يصف فيه الطالب التجربة","قائمة بالمصطلحات العلمية للحفظ"],"المهارة العملية تُقوَّم بملاحظة الأداء الفعلي بأداة مدرجة. الاختبارات الكتابية تقيس المعرفة بالخطوات لا القدرة على تنفيذها."],["L15","","من عيوب السجل القصصي كأداة تقويم أنه:",["يحتاج وقتاً طويلاً وقد يتأثر بذاتية الملاحِظ","لا يصلح إلا للمهارات العملية","يقتصر على تسجيل الدرجات الرقمية","لا يمكن استخدامه في الصفوف الدنيا"],"الوصف السردي لكل طالب يستهلك وقتاً ويعتمد على ما يلاحظه المعلم ويفسره. السجل القصصي يناسب السلوك والجوانب الوجدانية في جميع الصفوف ولا يسجل درجات."],["L15","m","عقد المعلم جلسة قصيرة مع كل طالب حول أعماله في ملف الإنجاز، يسأله فيها عن اختياراته وما تعلمه وكيف يطورها. هذا الأسلوب من التقويم يسمى:",["التقويم بالتواصل (المقابلة / المؤتمر)","التقويم الختامي","الاختبار الشفهي المقنن","تقويم الأقران"],"الحوار وجهاً لوجه مع الطالب حول أعماله وتفكيره هو التقويم بالتواصل. ليس اختباراً مقنناً ولا حكماً ختامياً ولا يشارك فيه أقران."],["L15","","حين يطلب المعلم من الطلاب رسم خريطة مفاهيم لوحدة كاملة كأداة تقويم، فإنه يكشف أساساً عن:",["بنيتهم المعرفية والعلاقات التي يدركونها بين المفاهيم","سرعتهم في الكتابة","قدرتهم على حفظ التعريفات حرفياً","مهاراتهم اليدوية في الرسم"],"خريطة المفاهيم تُظهر كيف ينظم الطالب المفاهيم ويربطها، وهذا مؤشر على الفهم العميق. الحفظ الحرفي يُقاس بأسئلة التذكر، والرسم والسرعة ليسا المقصود."],["L15","","أي الآتي من خصائص التقويم الأصيل (الواقعي)؟",["مهام حقيقية مرتبطة بالحياة بمعايير معلنة مسبقاً","الاعتماد على أسئلة الاختيار من متعدد فقط","إخفاء معايير التقويم عن الطلاب حتى نهاية المهمة","التركيز على التذكر الحرفي للمعلومات"],"التقويم الأصيل يقيس الأداء في مواقف واقعية ذات معنى مع معايير يعرفها الطالب مسبقاً. إخفاء المعايير والاقتصار على التذكر أو الاختيار من متعدد سمات التقويم التقليدي."],["L15","m","أي الآتي ليس من أدوات التقويم البديل؟",["اختبار الاختيار من متعدد","ملف الإنجاز","سلم التقدير الوصفي","السجل القصصي"],"التقويم البديل يعتمد الأداء والملاحظة والملفات وسلالم التقدير بديلاً عن الاختبارات الورقية التقليدية؛ والاختيار من متعدد اختبار تقليدي."],["L15","","سجل يكتب فيه الطالب بنفسه تأملاته حول ما تعلمه وما قرأه وما واجهه من صعوبات يسمى:",["سجل سير التعلم (يوميات الطالب)","السجل القصصي","قائمة الشطب","بطاقة الملاحظة"],"سجل سير التعلم يكتبه الطالب عن تعلمه. السجل القصصي يكتبه المعلم عن سلوك الطالب، وقائمة الشطب وبطاقة الملاحظة أدوات يستخدمها المعلم لرصد الأداء."],["L15","","في أسئلة المطابقة (المزاوجة) يُفضَّل أن:",["يكون عدد الاستجابات أكبر من عدد المقدمات وأن تكون القائمة متجانسة","يتساوى عدد المقدمات والاستجابات تماماً","تجمع القائمة عناصر من موضوعات مختلفة","تُرتَّب الاستجابات بترتيب الإجابات الصحيحة"],"زيادة الاستجابات تقلل التخمين بالاستبعاد، والتجانس يمنع كشف الإجابة من نوع العنصر. التساوي والخلط وترتيب الإجابات تسهّل التخمين."],["L15","m","أي الآتي الصياغة الأفضل لسؤال إكمال؟",["وضع فراغ واحد في موضع مهم قرب نهاية الجملة","نقل الجملة حرفياً من الكتاب مع حذف كلمة","ترك عدة فراغات في الجملة الواحدة","وضع الفراغ في بداية الجملة"],"الفراغ الواحد في موضع مهم قرب النهاية يجعل المطلوب واضحاً بعد قراءة السياق. النقل الحرفي يشجع الحفظ، وكثرة الفراغات تجعل الجملة مبهمة، والفراغ في البداية يقطع السياق."],["L15","","في صياغة عبارات الصواب والخطأ ينبغي:",["أن تحمل كل عبارة فكرة واحدة وتخلو من النفي المزدوج","أن تحتوي كل عبارة على فكرتين لزيادة الدقة","أن تكون أغلب العبارات صحيحة","أن تُستخدم كلمات مثل دائماً وأبداً لتوضيح المعنى"],"الفكرة الواحدة تجعل الحكم واضحاً، والنفي المزدوج يربك الطالب. ينبغي توازن الصواب والخطأ، وكلمات الجزم تكشف الإجابة."],["L15","","لتقليل أثر التخمين في أسئلة الاختيار من متعدد يُنصح بـ:",["زيادة عدد البدائل الفعالة إلى أربعة وتحسين جودة المشتتات","تقليل البدائل إلى اثنين","وضع الإجابة الصحيحة دائماً في البديل الأول","حذف المشتتات الصعبة"],"كلما زادت البدائل الفعالة انخفض احتمال التخمين الصحيح (25% مع أربعة بدائل). تقليل البدائل أو تثبيت موضع الإجابة أو إضعاف المشتتات يرفع التخمين."],["L15","m","كتب معلم سؤالاً: «سقطت الدولة العثمانية لعدة أسباب، وضح ذلك». المشكلة في هذا السؤال أنه:",["مفتوح لا يحدد المطلوب فيصعب تصحيحه بموضوعية","موضوعي لا يقيس التفكير","قصير جداً","يحتوي على كلمات جزم"],"السؤال لا يحدد عدد الأسباب ولا نطاق الإجابة فيختلف المصححون في تقدير الإجابة؛ والأفضل تقييده مثل: اذكر ثلاثة أسباب. ليس موضوعياً ولا فيه كلمات جزم."],["L15","","لقياس عدد كبير من الحقائق والمفاهيم بتغطية واسعة للمحتوى في زمن محدود، الأنسب:",["الأسئلة الموضوعية","الأسئلة المقالية الحرة","المقابلة الشخصية","ملف الإنجاز"],"الموضوعية قصيرة الإجابة فتغطي محتوى واسعاً بعدد كبير من الفقرات في وقت قصير. المقالية تغطي محتوى محدوداً، والمقابلة وملف الإنجاز لا يناسبان هذا الغرض."],["L15","","في بناء اختبار الاختيار من متعدد، موقع الإجابة الصحيحة بين البدائل ينبغي أن:",["يتغير عشوائياً من فقرة إلى أخرى","يثبت في البديل الأول لتسهيل التصحيح","يكون دائماً في البديل الأخير","يتبع نمطاً ثابتاً يسهل حفظه"],"تغيير الموقع عشوائياً يمنع الطالب من اكتشاف نمط يجيب به دون معرفة. أي نمط ثابت يكشف الإجابة ويضعف الصدق."],["L15","m","معلم يريد قياس قدرة طلابه على الحكم على صحة الأحكام وتبريرها (مستوى التقويم في بلوم). نوع الأسئلة الأقل مناسبة لهذا الغرض:",["الصواب والخطأ","المقالية المقيدة","المقالية الحرة","الاختيار من متعدد المبني على موقف"],"الصواب والخطأ يقيس غالباً التذكر ولا يتيح تبرير الحكم. المقالية بنوعيها والاختيار من متعدد المبني على موقف يمكن أن تقيس مستويات عليا."],["L15","m","وحدة دراسية استغرقت 6 حصص من أصل 30 حصة في الفصل، والاختبار من 40 سؤالاً. عدد الأسئلة التي تستحقها هذه الوحدة في جدول المواصفات:",["8 أسئلة","6 أسئلة","12 سؤالاً","10 أسئلة"],"وزن الوحدة = 6 ÷ 30 = 0.20 أي 20%. عدد أسئلتها = 40 × 0.20 = 8 أسئلة. الخطأ الشائع أخذ عدد الحصص (6) كأنه عدد الأسئلة."],["L15","","اختبار من 50 سؤالاً، وزن موضوع «الكسور» فيه 30%، ووزن مستوى الفهم 40% من الأهداف. عدد أسئلة الكسور في مستوى الفهم:",["6 أسئلة","15 سؤالاً","20 سؤالاً","12 سؤالاً"],"أسئلة الخلية = العدد الكلي × وزن الموضوع × وزن المستوى = 50 × 0.30 × 0.40 = 6. الرقم 15 هو كل أسئلة الكسور، و20 كل أسئلة الفهم."],["L15","m","الأساس الذي يُحدَّد به وزن كل موضوع في جدول المواصفات هو:",["عدد الحصص أو الأهداف المخصصة له وأهميته النسبية","صعوبة الموضوع على الطلاب","ترتيب الموضوع في الكتاب","رغبة الطلاب في الموضوع"],"الوزن النسبي يُشتق من حجم الموضوع في التدريس (حصصه أو أهدافه) وأهميته. الصعوبة والترتيب والرغبة ليست أسساً لتوزيع الأسئلة."],["L15","","ينبغي أن تتضمن تعليمات الاختبار:",["زمن الإجابة وطريقتها ودرجة كل سؤال","أسماء الطلاب المتوقع نجاحهم","الإجابات النموذجية للأسئلة","ملخصاً للمحتوى الدراسي"],"التعليمات تخبر الطالب بما هو متوقع منه: الزمن وأسلوب الإجابة ومكانها وتوزيع الدرجات. الإجابات والملخص لا مكان لهما في ورقة الاختبار."],["L15","","لتقليل أثر الهالة عند تصحيح الأسئلة المقالية يُنصح بأن:",["يصحح المعلم السؤال الواحد لجميع الطلاب قبل الانتقال إلى السؤال التالي مع إخفاء الأسماء","يصحح ورقة كل طالب كاملة قبل الانتقال لورقة أخرى","يبدأ بأوراق الطلاب المتفوقين","يصحح الأوراق حسب ترتيب الحضور"],"تصحيح السؤال نفسه عبر كل الأوراق يثبت المعيار ويمنع تأثر الدرجة بالانطباع عن الطالب أو عن إجاباته السابقة. تصحيح الورقة كاملة يقوّي أثر الهالة."],["L15","","الترتيب الصحيح لخطوات بناء الاختبار التحصيلي:",["تحديد الأهداف، تحليل المحتوى، جدول المواصفات، صياغة الفقرات، التعليمات","صياغة الفقرات، تحديد الأهداف، جدول المواصفات، التعليمات","جدول المواصفات، تحديد الأهداف، تحليل المحتوى، صياغة الفقرات","تحليل المحتوى، صياغة الفقرات، تحديد الأهداف، التعليمات"],"يبدأ البناء بالأهداف ثم المحتوى، ثم يجمعهما جدول المواصفات، ثم تُكتب الفقرات في ضوئه، ثم التعليمات، ثم التجريب والتحليل."],["L15","m","أي الآتي الأفضل عند تصميم الاختبار لرفع موضوعيته؟",["الاعتماد على أسئلة موضوعية ذات إجابة واحدة محددة مع نموذج إجابة","الاعتماد على أسئلة مقالية حرة","ترك تقدير الدرجة لانطباع المصحح","عدم تحديد درجة لكل سؤال"],"الموضوعية هي استقلال الدرجة عن المصحح، وتتحقق بالأسئلة محددة الإجابة ونموذج تصحيح. المقالية الحرة والانطباع وعدم تحديد الدرجات ترفع الذاتية."],["L15","","الغرض الرئيس من الاختبارات الوطنية (نافس) هو:",["تشخيص مستوى تحصيل الطلاب على مستوى الوطن لتحسين التعليم","تحديد نجاح الطالب أو رسوبه في نهاية العام","ترتيب الطلاب داخل الصف الواحد","منح الطالب شهادة إتمام المرحلة"],"نافس تقويم نظامي يقدم مؤشرات عن جودة التعليم وليس اختباراً يترتب عليه نجاح الطالب أو ترتيبه أو شهادته."],["L15","m","«TALIS» يختلف عن الاختبارات الدولية الأخرى في أنه:",["مسح دولي عن المعلمين وبيئات التدريس وليس اختباراً للطلاب","اختبار للرياضيات فقط","اختبار يُعقد سنوياً للصف الأول","اختبار وطني خاص بالمملكة"],"تاليس استطلاع للمعلمين وقادة المدارس عن ظروف التدريس والتطوير المهني. الاختبارات الأخرى (بيزا، تيمس، بيرلز) تُطبَّق على الطلاب."],["L15","","يتميز اختبار PISA عن الاختبارات التحصيلية المدرسية في أنه يقيس:",["قدرة الطالب على توظيف المعرفة في مواقف حياتية حقيقية","حفظ الطالب لمحتوى المنهج الوطني","سرعة الطالب في الإجابة عن أسئلة الكتاب","سلوك الطالب داخل الفصل"],"بيزا يقيس الثقافة القرائية والرياضية والعلمية بمعنى القدرة على استخدام المعرفة في الحياة لا استظهار المنهج."],["L15","","في لائحة تقويم الطالب، الغرض من مستويات الأداء في التقويم المستمر للصفوف الأولية هو:",["تحديد درجة إتقان الطالب لكل مهارة لبناء خطة علاجية عند الحاجة","ترتيب الطلاب داخل الفصل","تحديد الطلاب الراسبين فقط","مقارنة المدرسة بغيرها"],"المستويات تدرّج إتقان المهارة من الأدنى إلى الإتقان الكامل لتوجيه الدعم والعلاج، وليست أداة ترتيب أو مقارنة بين الطلاب أو المدارس."],["L16","","الصدق الظاهري للاختبار يعني أن:",["مظهر الاختبار وعنوانه وتعليماته توحي بأنه يقيس ما وُضع له","فقراته تمثل المحتوى تمثيلاً كاملاً","درجاته ترتبط بمحك مستقبلي","فقراته تنسجم مع الإطار النظري للسمة"],"الصدق الظاهري يتعلق بالشكل العام وهو أضعف الأنواع. التمثيل الكامل صدق محتوى، والمحك المستقبلي تنبؤي، والإطار النظري صدق بناء."],["L16","m","أعد باحث مقياساً لـ«التفكير الناقد» وتحقق عبر التحليل العاملي من أن فقراته تنتظم في الأبعاد التي تفترضها النظرية. نوع الصدق:",["البناء (المفهوم)","المحتوى","التلازمي","الظاهري"],"مطابقة الاختبار للإطار النظري للسمة وأبعادها هو صدق البناء (التكوين الفرضي)، ومن أساليبه التحليل العاملي والمقارنة بين المجموعات المتباينة."],["L16","","معامل ثبات اختبار 0.81، فإن صدقه الذاتي يساوي:",["0.90","0.81","0.66","0.19"],"الصدق الذاتي = الجذر التربيعي لمعامل الثبات = جذر 0.81 = 0.9. الخطأ الشائع إعادة كتابة الثبات نفسه أو تربيعه (0.66)."],["L16","","صيغت فقرات اختبار بلغة فوق مستوى الطلاب فعجز كثير منهم عن فهم المطلوب. أثر ذلك أن الاختبار صار يقيس:",["فهم اللغة بدل المحتوى المستهدف فينخفض صدقه","المحتوى بدقة أكبر","مستويات التفكير العليا","المحتوى دون أي تأثر"],"إذا حالت اللغة دون إظهار الطالب ما يعرفه فالدرجة لا تمثل تحصيله الحقيقي، وهذا خلل في الصدق."],["L16","m","استخدم معلم اختبار قواعد النحو ليحكم على القدرة اللغوية الشاملة لطلابه (قراءة وكتابة وتحدث). الخلل في هذا الاستخدام يتعلق بـ:",["الصدق، لأن الاختبار استُخدم في غير ما وُضع له","الثبات، لأن الاختبار طُبّق مرة واحدة","الموضوعية، لأن أسئلة القواعد مقالية","التمييز، لأن القواعد سهلة"],"الاختبار قد يكون صادقاً لقياس القواعد، لكنه غير صادق لقياس القدرة اللغوية الشاملة؛ فالصدق يرتبط بالغرض الذي يُستخدم له."],["L16","","أي أنواع الصدق الآتية يُقدَّر بحساب معامل ارتباط بين درجات الاختبار ودرجات اختبار آخر؟",["صدق المحك","صدق المحتوى","الصدق الظاهري","الصدق المنطقي"],"صدق المحك بنوعيه (التلازمي والتنبؤي) يُحسب بمعامل ارتباط مع محك خارجي. المحتوى والظاهري والمنطقي تُقدَّر بالحكم والتحليل لا بالارتباط."],["L16","m","عرض معلم فقرات اختباره على خمسة من المتخصصين للحكم على مدى تمثيلها للمحتوى وملاءمتها للأهداف. الإجراء يتحقق من:",["صدق المحتوى","الثبات","الصدق التنبؤي","معامل التمييز"],"حكم المحكمين على تمثيل الفقرات للمحتوى والأهداف أسلوب لتقدير صدق المحتوى. الثبات والتمييز يُحسبان من درجات الطلاب، والتنبؤي يحتاج محكاً لاحقاً."],["L16","","أي العوامل الآتية لا يُضعف صدق الاختبار؟",["تنويع مستويات الأسئلة بين التذكر والفهم والتطبيق","غموض صياغة الأسئلة","تطبيق الاختبار على فئة غير التي أُعد لها","وجود تلميحات في الصياغة تكشف الإجابة"],"تنويع المستويات يزيد تمثيل الأهداف فيرفع الصدق. أما الغموض والتطبيق على فئة مختلفة والتلميحات فتجعل الدرجة لا تمثل القدرة الحقيقية."],["L16","m","أراد معلم حساب ثبات اختبار كل فقراته تُصحح بـ 1 للصحيح و0 للخطأ من تطبيق واحد. المعادلة الأنسب:",["كودر ريتشاردسون","كرونباخ ألفا للمقاييس المتدرجة","معادلة التنبؤ","معامل سبيرمان للرتب"],"كودر ريتشاردسون (20 و21) مخصصة للفقرات ثنائية التصحيح. ألفا أعم وتناسب المتدرج (ليكرت)، والمعادلات الأخرى لا تقيس الثبات."],["L16","","لحساب ثبات مقياس اتجاهات بتدريج ليكرت الخماسي (موافق بشدة إلى غير موافق بشدة)، الأنسب:",["كرونباخ ألفا","كودر ريتشاردسون","الصدق الذاتي","معامل الصعوبة"],"الفقرات متعددة التدريج تحتاج كرونباخ ألفا. كودر ريتشاردسون للفقرات الثنائية فقط، والصدق الذاتي والصعوبة ليسا طرقاً لحساب الثبات."],["L16","m","كان معامل الارتباط بين نصفي اختبار 0.60. معامل ثبات الاختبار كاملاً بعد تصحيحه بمعادلة سبيرمان براون:",["0.75","0.60","0.30","0.80"],"سبيرمان براون: الثبات = (2 × 0.60) ÷ (1 + 0.60) = 1.20 ÷ 1.60 = 0.75. التصحيح يرفع المعامل لأن ارتباط النصفين يمثل ثبات نصف الاختبار فقط."],["L16","","اختبار انحرافه المعياري 10 ومعامل ثباته 0.84. الخطأ المعياري للقياس يساوي:",["4","8.4","1.6","6"],"الخطأ المعياري = الانحراف × الجذر التربيعي لـ(1 − الثبات) = 10 × جذر(1 − 0.84) = 10 × جذر(0.16) = 10 × 0.4 = 4."],["L16","","كلما كبر الخطأ المعياري للقياس في اختبار، فإن معامل ثباته:",["ينخفض","يرتفع","لا يتأثر","يساوي الصفر دائماً"],"الخطأ المعياري يعبر عن تذبذب الدرجة الملاحظة حول الحقيقية؛ وكبره يعني اتساقاً أقل، أي ثباتاً أقل. العلاقة عكسية بينهما."],["L16","m","طبّق باحث اختباراً على مجموعة متقاربة جداً في قدراتها فحصل على معامل ثبات منخفض رغم جودة الفقرات. السبب الأرجح:",["تجانس العينة قلل التباين بين الدرجات","طول الاختبار الزائد","صعوبة الفقرات المتوسطة","وضوح التعليمات"],"معامل الثبات ارتباط، والارتباط ينخفض حين يقل التباين؛ فالعينة المتجانسة تعطي ثباتاً أقل. الطول والصعوبة المتوسطة والوضوح عوامل ترفع الثبات."],["L16","","أعاد معلم تطبيق الاختبار نفسه في اليوم التالي مباشرة. الأثر المتوقع على معامل الثبات:",["يرتفع زيفاً بسبب تذكر الطلاب لإجاباتهم","ينخفض بسبب نسيان الطلاب","لا يتأثر بالفاصل الزمني","يصبح سالباً"],"قصر الفترة بين التطبيقين يجعل الذاكرة ترفع الاتفاق بين الدرجتين فيبدو الثبات أعلى من حقيقته؛ لذلك يُفضَّل فاصل مناسب (نحو أسبوعين)."],["L16","","الخاصية التي تُعد شرطاً ضرورياً لصدق الاختبار لكنها غير كافية له:",["الثبات","الشمول","سهولة التطبيق","طول الاختبار"],"بلا ثبات لا صدق، لكن الثبات وحده لا يضمن الصدق. الشمول والسهولة والطول خصائص مساعدة لا تُعد شرطاً منطقياً للصدق."],["L16","m","ترتيب الخصائص من حيث العلاقة الشرطية بينها:",["الموضوعية شرط للثبات، والثبات شرط للصدق","الصدق شرط للثبات، والثبات شرط للموضوعية","الثبات شرط للموضوعية، والموضوعية شرط للصدق","لا توجد علاقة شرطية بين الثلاث"],"إذا تأثرت الدرجة بالمصحح اختل اتساقها (الثبات)، وإذا اختل الاتساق لم يقس الاختبار السمة بدقة (الصدق). فالموضوعية في القاعدة والصدق في القمة."],["L16","","أي الآتي يُعد من عوامل انخفاض ثبات الاختبار؟",["غموض التعليمات واختلاف ظروف التطبيق بين الطلاب","زيادة عدد الفقرات","تباين قدرات العينة","صعوبة الفقرات المتوسطة"],"الغموض وتفاوت الظروف يدخلان أخطاء عشوائية في الدرجات فيقل الاتساق. الطول وتباين العينة والصعوبة المتوسطة ترفع الثبات."],["L16","","في اختبار على 100 طالب أُخذت المجموعة العليا (27 طالباً) والدنيا (27 طالباً). أجاب عن الفقرة 20 من العليا و5 من الدنيا. معامل التمييز تقريباً:",["0.56","0.25","0.46","0.15"],"التمييز = (20 − 5) ÷ 27 = 15 ÷ 27 ≈ 0.56، أي ممتاز. القسمة تكون على عدد أفراد إحدى المجموعتين (27) لا على العدد الكلي."],["L16","m","في مجموعتين قوام كل منهما 20 طالباً، أجاب عن الفقرة 6 من العليا و14 من الدنيا. القرار المناسب:",["حذف الفقرة فوراً لأن تمييزها سالب (−0.40)","الإبقاء عليها لأن صعوبتها متوسطة","تعديلها قليلاً لأن تمييزها 0.40","استبدال أحد مشتتاتها فقط"],"التمييز = (6 − 14) ÷ 20 = −0.40؛ الإشارة السالبة تعني أن الضعاف أجابوا أفضل من المتفوقين، وهذا خلل جوهري يستوجب الحذف وإن كانت الصعوبة (20 ÷ 40 = 0.50) متوسطة."],["L16","","عند تحليل فقرة تبين أن مشتتاً اختاره طلاب الفئة العليا أكثر من الدنيا. التفسير الأرجح:",["المشتت غامض أو يحتمل أن يكون إجابة صحيحة ثانية فيجب مراجعته","المشتت ممتاز ويؤدي وظيفته","الفقرة سهلة جداً","الفئة العليا لم تذاكر"],"إذا انجذب المتفوقون إلى بديل خاطئ فغالباً أن في البديل أو المقدمة غموضاً أو إجابة صحيحة جزئياً، فتُراجع الفقرة."],["L16","m","فقرة أجاب عنها جميع طلاب الصف إجابة صحيحة. معامل صعوبتها ومعامل تمييزها على الترتيب:",["1 وصفر","صفر و1","0.5 و0.5","1 و1"],"الصعوبة = الكل ÷ الكل = 1 (سهلة جداً)، والتمييز = (العليا − الدنيا) ÷ العدد = صفر لأن الفئتين أجابتا بالتساوي. الفقرات شديدة السهولة لا تميز."],["L16","","المدى المقبول لمعامل الصعوبة في الفقرات الجيدة عادة:",["من 0.20 إلى 0.80 والمثالي قرب 0.50","من 0.90 إلى 1.00","من صفر إلى 0.10","من 0.95 فأعلى"],"الفقرات شديدة السهولة (فوق 0.80) أو شديدة الصعوبة (دون 0.20) لا تميز جيداً، والمعامل الأمثل للتمييز الأقصى حول 0.50."],["L16","","في مجموعتين قوام كل منهما 25 طالباً، أجاب عن الفقرة 18 من العليا و8 من الدنيا. معامل الصعوبة بطريقة المجموعتين:",["0.52","0.40","0.72","0.32"],"الصعوبة = (18 + 8) ÷ (25 + 25) = 26 ÷ 50 = 0.52، فقرة متوسطة. الرقم 0.40 هو معامل التمييز للفقرة نفسها."],["L16","m","العلاقة بين معامل الصعوبة ومعامل التمييز توصف بأن:",["الفقرات متوسطة الصعوبة تتيح أعلى تمييز ممكن","الفقرات شديدة الصعوبة أعلى تمييزاً دائماً","الفقرات شديدة السهولة أعلى تمييزاً دائماً","لا علاقة بينهما إطلاقاً"],"حين تكون الصعوبة قرب 0.50 يمكن أن يكون الفرق بين الفئتين أكبر ما يمكن. أما الفقرات التي يجيب عنها الجميع أو لا يجيب عنها أحد فتمييزها يقترب من الصفر."],["L16","","إذا كان معامل السهولة لفقرة 0.65، فإن نسبة الطلاب الذين أخطؤوا فيها:",["35%","65%","0.65 من طالب","50%"],"معامل السهولة هو نسبة المصيبين (65%)، ومجموع نسبة المصيبين والمخطئين = 1، فالمخطئون = 1 − 0.65 = 0.35 أي 35%."],["L16","","عند تحليل فقرات الاختبار بطريقة المجموعتين الطرفيتين في صف كبير، تُؤخذ:",["أعلى 27% وأدنى 27% من الأوراق بعد ترتيبها","أعلى 50% وأدنى 50%","أول 10 أوراق وآخر 10 أوراق بترتيب التسليم","الأوراق كلها دون ترتيب"],"النسبة المعتمدة للمجموعتين الطرفيتين 27% من كل طرف بعد الترتيب التنازلي بالدرجة؛ وفي الصفوف الصغيرة يُقسم الصف نصفين."],["L16","","إذا كان الانحراف المعياري لدرجات صف 4 فإن التباين يساوي:",["16","2","4","8"],"التباين = مربع الانحراف المعياري = 4 × 4 = 16. الجذر (2) والضعف (8) إجابات خاطئة شائعة."],["L16","m","أضاف المعلم 5 درجات لكل طالب في الصف. أثر ذلك على المتوسط والانحراف المعياري:",["يزيد المتوسط 5 درجات ولا يتغير الانحراف المعياري","يزيد كل منهما 5 درجات","لا يتغير المتوسط ويزيد الانحراف 5","يتغير كل منهما بنسبة 5%"],"إضافة ثابت تنقل كل الدرجات بالمقدار نفسه فيزيد المتوسط بالثابت، لكن المسافات بين الدرجات لا تتغير فيبقى الانحراف المعياري كما هو."],["L16","","أفضل مقياس نزعة مركزية لوصف بيانات نوعية (اسمية) مثل الأنماط التعليمية المفضلة لدى الطلاب:",["المنوال","المتوسط الحسابي","الوسيط","التباين"],"البيانات الاسمية لا تُجمع ولا تُرتب فلا يمكن حساب متوسط أو وسيط، ويبقى المنوال (الفئة الأكثر تكراراً) هو المناسب."],["L16","m","صفان لهما المتوسط نفسه (70)، الانحراف المعياري للصف الأول 3 وللثاني 12. الاستنتاج الصحيح:",["الصف الأول أكثر تجانساً في مستوى طلابه","الصف الثاني أكثر تجانساً","الصفان متساويان في التجانس","الصف الثاني أعلى تحصيلاً"],"الانحراف المعياري يقيس التشتت حول المتوسط؛ وصغره يعني تقارب الدرجات (تجانس). المتوسط المتساوي يعني تحصيلاً متقارباً لا تفوق أحدهما."],["L16","","إذا كان الانحراف المعياري لدرجات مجموعة يساوي صفراً فهذا يعني أن:",["جميع الدرجات متساوية","المتوسط يساوي صفراً","نصف الدرجات فوق المتوسط","التوزيع ملتوٍ التواءً موجباً"],"الانحراف صفر يعني أن كل الدرجات تساوي المتوسط فلا تشتت. لا علاقة بقيمة المتوسط ولا بالالتواء."],["L16","","الرسم البياني الأنسب لعرض توزيع درجات الطلاب على فئات متتالية هو:",["المدرج التكراري","الرسم الدائري","الخط البياني الزمني","الرسم الشجري"],"المدرج التكراري يعرض تكرار كل فئة من الدرجات ويبين شكل التوزيع. الدائري للنسب من كل، والخطي للتغير عبر الزمن."],["L16","m","في جدول تكراري لدرجات 40 طالباً: 10 طلاب في الفئة 50 إلى 59، و12 في 60 إلى 69، و11 في 70 إلى 79، و7 في 80 إلى 89. عدد الطلاب الذين حصلوا على 70 فأكثر:",["18","11","22","7"],"الطلاب في 70 إلى 79 عددهم 11، وفي 80 إلى 89 عددهم 7؛ المجموع = 18. الرقم 22 هو من حصلوا على أقل من 70."],["L16","","الوسيط للدرجات: 3، 9، 7، 12، 5 يساوي:",["7","9","12","7.2"],"نرتب: 3، 5، 7، 9، 12؛ العدد فردي (5 قيم) فالوسيط القيمة الوسطى الثالثة = 7. الرقم 7.2 هو المتوسط الحسابي."],["L16","","أي مقاييس التشتت الآتية أكثر تأثراً بالقيم المتطرفة؟",["المدى","الانحراف المعياري","التباين","الانحراف الربيعي"],"المدى يعتمد على قيمتين فقط هما الطرفان، فأي قيمة متطرفة واحدة تغيره كلياً؛ بينما الانحراف المعياري والتباين يعتمدان على كل القيم."],["L16","","في توزيع اعتدالي متوسطه 60 وانحرافه 5، نسبة الطلاب الذين تزيد درجاتهم عن 70 تقريباً:",["2.5%","5%","16%","34%"],"70 تبعد انحرافين فوق المتوسط. 95% من الدرجات ضمن انحرافين، فالباقي 5% موزعة على الطرفين، أي 2.5% فوق 70."],["L16","m","في توزيع اعتدالي متوسطه 50 وانحرافه 10، نسبة الطلاب الذين تقع درجاتهم بين 50 و60 تقريباً:",["34%","68%","16%","50%"],"الفترة من المتوسط إلى انحراف واحد فوقه تضم نصف الـ68% أي 34%. 16% هي نسبة من تزيد درجاتهم عن 60."],["L16","","في اختبار كان المتوسط 45 والوسيط 35 والمنوال 30. الاستنتاج:",["التوزيع ملتوٍ التواءً موجباً والاختبار صعب","التوزيع ملتوٍ التواءً سالباً والاختبار سهل","التوزيع اعتدالي","الاختبار متوسط الصعوبة تماماً"],"المتوسط أكبر من الوسيط أكبر من المنوال: الذيل نحو اليمين والتكدس عند الدرجات المنخفضة؛ التواء موجب يدل على اختبار صعب."],["L16","","طالب درجته المعيارية ز = −1. درجته التائية (ت):",["40","60","49","−10"],"ت = 50 + 10 × ز = 50 + 10 × (−1) = 50 − 10 = 40. الدرجة التائية تتخلص من الإشارة السالبة وتبقي المعنى (دون المتوسط بانحراف واحد)."],["L16","m","حصل طالب على 80 في العربي (المتوسط 70 والانحراف 10) وعلى 65 في الرياضيات (المتوسط 50 والانحراف 5). أداؤه الأفضل مقارنة بزملائه في:",["الرياضيات لأن ز = 3 مقابل ز = 1","العربي لأن درجته الخام أعلى","المادتين بالتساوي","لا يمكن الحكم دون الدرجة الكلية"],"العربي: ز = (80 − 70) ÷ 10 = 1. الرياضيات: ز = (65 − 50) ÷ 5 = 3. الدرجة الخام الأعلى لا تعني أداءً نسبياً أفضل؛ المقارنة الصحيحة بالدرجة المعيارية."],["L16","","الدرجة المعيارية (ز) لها متوسط وانحراف معياري يساويان على الترتيب:",["صفر و1","50 و10","100 و15","1 وصفر"],"ز توزيع متوسطه صفر وانحرافه 1. المتوسط 50 والانحراف 10 للدرجة التائية، و100 و15 لنسبة الذكاء الانحرافية."],["L16","h","معامل الارتباط بين درجات الطلاب في اختبارين 0.2. الاستنتاج:",["العلاقة بين الاختبارين ضعيفة","العلاقة قوية بين المادتين","الاختبارات تمتاز بالصدق والثبات","الاختباران شديدا السهولة"],"0.2 قيمة منخفضة تدل على ارتباط ضعيف. لا يمكن استنتاج الصدق أو الثبات أو السهولة من ارتباط درجات اختبارين مختلفين."],["L16","","وجد معلم ارتباطاً قوياً (0.85) بين درجات القراءة ودرجات العلوم لدى طلابه. الاستنتاج غير الصحيح:",["تحسين القراءة هو سبب تفوق الطلاب في العلوم","الطلاب المتفوقون في القراءة يميلون للتفوق في العلوم","العلاقة بين المتغيرين طردية قوية","يمكن التنبؤ بدرجة العلوم من درجة القراءة بدرجة جيدة"],"الارتباط يصف العلاقة ولا يثبت السببية؛ قد يكون وراء الاثنين عامل ثالث كالقدرة العامة أو الدافعية. أما الاتجاه والقوة والتنبؤ فاستنتاجات مشروعة."],["L16","m","يتراوح معامل الارتباط بين:",["−1 و+1","صفر و1","صفر و100","−100 و+100"],"معامل الارتباط قيمة بين −1 (عكسي تام) و+1 (طردي تام)، والصفر يعني انعدام العلاقة الخطية."],["L16","","حصل طالب على درجة معيارية ز = 1.5 في اختبار متوسطه 50 وانحرافه 8. درجته الخام:",["62","58","51.5","65"],"الدرجة الخام = المتوسط + ز × الانحراف = 50 + 1.5 × 8 = 50 + 12 = 62."],["L16","","اختباران طُبقا على الصف نفسه وكان معامل الارتباط بين درجاتهما 0.95. الاستنتاج الصحيح:",["وجود علاقة قوية بين أداء الطلاب في الاختبارين","أن 95% من الطلاب نجحوا في الاختبارين","أن معامل صعوبة الاختبارين 0.95","أن الاختبارين متطابقان في الأسئلة"],"الارتباط 0.95 يعني أن ترتيب الطلاب في الاختبارين متقارب جداً. لا يخبرنا عن نسبة النجاح ولا الصعوبة ولا تطابق الأسئلة."],["L16","m","طالب درجته التائية 65. موقعه بالنسبة لمجموعته:",["أعلى من المتوسط بانحراف ونصف","أدنى من المتوسط بانحراف ونصف","عند المتوسط تماماً","أعلى من المتوسط بـ 65 درجة"],"ت = 50 + 10ز، فإذا كانت ت = 65 فإن ز = (65 − 50) ÷ 10 = 1.5، أي فوق المتوسط بانحراف ونصف."],["L16","","بعد اطلاع معلم الأول الثانوي على النتائج المتدنية لطلابه في اختبار الشهر الأول، الإجراء الأول الذي ينبغي أن يقوم به:",["تحليل النتائج لتحديد مواطن الضعف ثم تعديل التدريس","إعادة الاختبار في الأسبوع التالي","توبيخ الطلاب على إهمالهم","تخفيض مستوى الاختبار القادم"],"التدني العام يستدعي تشخيص الأسباب أولاً (الفقرات، المهارات، طريقة التدريس) ثم التعديل. إعادة الاختبار أو التوبيخ أو التسهيل لا تعالج السبب."],["L16","m","الهدف الأساسي من تقرير نتائج الطالب الذي يُرسل إلى ولي الأمر:",["توضيح مستوى الطالب وتقدمه وما يحتاجه من دعم","إبراز جهود المعلم والمدرسة","تحقيق مبدأ الثواب والعقاب","مقارنة الطالب بالمتفوقين في صفه"],"التقرير وسيلة شراكة مع الأسرة لدعم تعلم الطالب، فيركز على مستواه وتقدمه وحاجاته. إبراز جهود المعلم يركز على المعلم، والعقاب والمقارنة لا يخدمان التعلم."],["L16","","الغرض الأساسي لتحليل المعلم نتائج اختباره:",["تحسين التدريس وتعديل الخطة في ضوء مواطن الضعف والقوة","رصد الدرجات في النظام فقط","ترتيب الطلاب لإعلان المتفوقين","تبرير الدرجات أمام الإدارة"],"التحليل يكشف الفقرات الضعيفة والمهارات غير المتقنة فيوجه قرارات التدريس. الرصد والترتيب والتبرير نواتج ثانوية لا تمثل الغرض الأساسي."],["L16","","عند كتابة تغذية راجعة مكتوبة على ورقة الطالب ينبغي أن:",["تكون بلغة بسيطة وموجزة ومحددة","تتضمن عبارات ثناء عامة فقط","تقتصر على نقاط الضعف","تكون مطولة تغطي كل جوانب الإجابة"],"الوضوح والإيجاز والتحديد يجعل الطالب يفهم ما يحتاج تحسينه ويطبقه. الثناء العام لا يفيد، والاقتصار على الضعف يحبط، والإطالة تضيع الرسالة."],["L16","m","جميع الآتي من الاستخدامات المشروعة لنتائج التقويم ما عدا:",["معاقبة الطلاب ضعاف التحصيل بالحرمان من الأنشطة","تعديل خطة التدريس وأساليبه","تصنيف الطلاب لبرامج علاجية وإثرائية","إعداد تقارير لأولياء الأمور"],"نتائج التقويم أداة تحسين وتوجيه لا أداة عقاب؛ فالحرمان لا يعالج الضعف بل يزيد النفور. التعديل والتصنيف للدعم والتقارير كلها توظيف سليم."],["L16","","يستخدم المعلم جدولاً إلكترونياً لحساب معاملات الصعوبة والتمييز لفقرات اختباره. الفائدة الأساسية من ذلك:",["تحديد الفقرات الضعيفة بسرعة لتحسين الاختبارات القادمة","رفع درجات الطلاب الضعاف","إلغاء الحاجة إلى جدول المواصفات","تقليل عدد الأسئلة في الاختبار"],"تحليل الفقرات بالتقنية يكشف الفقرات التي تحتاج تعديلاً أو حذفاً فتتحسن جودة الاختبار. لا يغير درجات الطلاب ولا يغني عن التخطيط."],["L16","","طالب حصل على درجة أقل من زملائه في اختبار العلوم، وأراد المعلم أن يخبره بنتيجته بطريقة تدعم دافعيته. الأسلوب الأنسب:",["بيان ما أتقنه ثم المهارات المحددة التي يحتاج تحسينها وكيف","إعلان درجته أمام الصف لحثه على الاجتهاد","مقارنة درجته بدرجة المتفوق الأول","الاكتفاء بإبلاغه الدرجة دون تعليق"],"التغذية الراجعة الداعمة تبدأ بنقاط القوة ثم توجه إلى خطوات تحسين محددة. الإعلان والمقارنة يحرجان ويحبطان، والدرجة وحدها لا توجه."],["L11","","الإطار الفكري أو الفلسفة العامة التي تنبثق منها طرق التدريس، كالقول «أدرّس وفق المدخل البنائي»، يسمى:",["مدخل التدريس","أسلوب التدريس","تقنية التدريس","طريقة التدريس"],"المدخل هو التصور النظري الذي تقوم عليه الطريقة. الطريقة إجراءات تنفيذية، والأسلوب طابع شخصي، والتقنية أداة."],["L11","","الترتيب الصحيح لمفاهيم التدريس من الأعم إلى الأخص هو:",["مدخل ← استراتيجية ← طريقة ← أسلوب","استراتيجية ← مدخل ← أسلوب ← طريقة","طريقة ← استراتيجية ← مدخل ← أسلوب","أسلوب ← طريقة ← استراتيجية ← مدخل"],"المدخل فلسفة عامة تضم استراتيجيات، والاستراتيجية خطة تضم طرقاً، والطريقة تُنفذ بأساليب شخصية. البدائل الأخرى تقلب العلاقة."],["L11","m","أراد معلم استخدام نموذج تدريس يعتمد على التفاعل بين الطلاب في جو اجتماعي، مثل التعلم التعاوني والتقصي الجماعي. هذا النموذج ينتمي عند جويس وويل إلى العائلة:",["الاجتماعية","السلوكية","الشخصية","معالجة المعلومات"],"العائلة الاجتماعية تركز على التعلم من التفاعل مع الآخرين. الشخصية تركز على الفرد وتطوره الذاتي، ومعالجة المعلومات على العمليات العقلية كالاستقراء والمنظم المتقدم."],["L11","","أدى معلم التربية الإسلامية الوضوء أمام طلابه خطوة خطوة مع الشرح، ثم طلب من كل طالب تطبيقه. الطريقة المستخدمة هي:",["العرض العملي (البيان)","المحاضرة","لعب الأدوار","الاستقصاء"],"العرض العملي يؤدي فيه المعلم المهارة أمام الطلاب ثم يطبقونها، ويناسب المهارات الأدائية. لعب الأدوار تمثيل لموقف اجتماعي، والمحاضرة لا تتضمن أداء المهارة."],["L11","m","تريد معلمة الصف الأول الابتدائي تقديم قيمة الصدق لطالبات في السادسة بأقل قدر من التجريد وبما يثير خيالهن. الطريقة الأنسب هي:",["القصة","المحاضرة","المناظرة","التعليم المبرمج"],"القصة تناسب الصغار وتقدم القيم في موقف حي يثير الخيال. المحاضرة مجردة، والمناظرة تحتاج نضجاً جدلياً، والمبرمج فردي ولا يناسب الأهداف الوجدانية."],["L11","","بعد أن حدد الطلاب مشكلة ذبول النبات، اقترحوا تفسيرات محتملة: قلة الماء، أو نقص الضوء، أو مرض في التربة. هذه الخطوة تمثل:",["وضع الفروض","اختبار الفروض","الشعور بالمشكلة","التعميم"],"الفروض تفسيرات مؤقتة محتملة للمشكلة. اختبارها يكون بجمع الأدلة والتجريب، والتعميم في الخطوة الأخيرة بعد التحقق."],["L11","m","يريد معلم تنفيذ مشروع «حديقة المدرسة» مع طلاب الصف السادس. الخطوة الأولى في طريقة المشروعات هي:",["اختيار المشروع بمشاركة الطلاب","وضع خطة التنفيذ","تنفيذ المشروع ميدانياً","تقويم المشروع"],"خطوات المشروع: اختيار المشروع، ثم التخطيط، ثم التنفيذ، ثم التقويم. اختيار المشروع يكون بمشاركة الطلاب ليرتبط بميولهم."],["L11","","ما الذي يميز طريقة المشروعات عن طريقة حل المشكلات؟",["أنها عمل ممتد ينتهي بمنتج ملموس","أنها تبدأ بالشعور بالمشكلة","أنها تعتمد على وضع الفروض","أنها تُنفذ داخل الصف فقط"],"المشروع عمل هادف ممتد ينتهي بمنتج (حديقة، مجسم، معرض). الشعور بالمشكلة والفروض من خطوات حل المشكلات، والمشروعات غالباً ميدانية خارج الصف."],["L11","","في برنامج تعليمي محوسب، عندما يخطئ الطالب في إطار معين يُحوَّل إلى إطار علاجي يشرح الخطأ ثم يعود إلى المسار الأصلي. نوع البرمجة هنا هو:",["البرمجة المتشعبة","البرمجة الخطية","البرمجة التعاونية","البرمجة الاستقرائية"],"البرمجة المتشعبة (كراودر) تتفرع حسب استجابة الطالب وتقدم إطارات علاجية. الخطية (سكنر) مسار واحد مستقيم لا يتفرع."],["L11","","جميع ما يأتي من خصائص التعليم المبرمج ما عدا:",["تنمية التفاعل الاجتماعي بين المتعلمين","تقسيم المادة إلى خطوات صغيرة","التعزيز الفوري للاستجابة الصحيحة","التقدم بسرعة المتعلم الخاصة"],"التعليم المبرمج فردي ولا ينمي التفاعل الاجتماعي، وهذا من عيوبه. الخطوات الصغيرة والتعزيز الفوري والخطو الذاتي خصائصه الأساسية."],["L11","m","أعد معلم وحدة تعلم ذاتي متكاملة تتضمن أهدافاً واختباراً قبلياً وأنشطة بدائل متعددة الوسائط واختباراً بعدياً يدرسها الطالب بنفسه. هذه الوحدة تسمى:",["الحقيبة التعليمية","المحاضرة المسجلة","الرحلة المعرفية","خريطة المفاهيم"],"الحقيبة التعليمية وحدة تعلم ذاتي متكاملة بهذه المكونات. الرحلة المعرفية بحث موجه عبر الإنترنت، والمحاضرة المسجلة مصدر واحد بلا أنشطة بدائل."],["L11","","وحدة تعليمية صغيرة مستقلة من برنامج أكبر، يدرسها الطالب ذاتياً ويُقوَّم بعدها قبل الانتقال إلى التالية، تسمى:",["الموديول","المشروع","الاستقصاء","التدريس المصغر"],"الموديول (الوحدة النسقية) وحدة صغيرة مستقلة للتعلم الذاتي. التدريس المصغر تدريب للمعلم، والمشروع عمل ممتد، والاستقصاء طريقة بحث."],["L11","m","أنجزت مجموعة تعاونية مهمتها بدرجة ممتازة، لكن المعلم اكتشف أن طالباً واحداً أنجز كل العمل بينما اكتفى الآخرون بالمشاهدة. العنصر المفقود في هذه المجموعة هو:",["المسؤولية الفردية","التفاعل وجهاً لوجه","الاعتماد الإيجابي المتبادل","المهارات الاجتماعية"],"المسؤولية الفردية تعني أن كل عضو مسؤول عن تعلمه وإسهامه، ويضمنها المعلم بتوزيع الأدوار والاختبار الفردي. التفاعل والاعتماد قد يكونان موجودين شكلاً مع غياب المحاسبة الفردية."],["L11","","عند تشكيل مجموعات التعلم التعاوني، الأفضل أن تكون المجموعة:",["غير متجانسة في مستوى التحصيل من 4 إلى 6 طلاب","متجانسة من المتفوقين فقط","كبيرة تضم نصف الصف","مكونة من الأصدقاء الذين يختارون بعضهم"],"المجموعات غير المتجانسة الصغيرة تتيح تعليم الأقران ومساعدة الضعفاء. المجموعات المتجانسة أو الكبيرة أو مجموعات الأصدقاء تضعف التفاعل والمسؤولية."],["L11","","أثناء عمل المجموعات التعاونية على مهمة، الدور الأنسب للمعلم هو:",["المتابعة والتدخل بالدعم عند الحاجة فقط","الشرح الكامل للمهمة لكل مجموعة على حدة","الجلوس في مكتبه حتى تنتهي المجموعات","حل المهمة أمام الصف ليقلدها الطلاب"],"المعلم في التعاوني ميسر يلاحظ ويقدم الدعم عند الحاجة. الشرح الكامل أو حل المهمة يلغي دور المجموعة، والانسحاب التام يفقدها التوجيه."],["L11","","أثناء تمثيل الطلاب لمشهد في استراتيجية لعب الأدوار، لاحظ المعلم أن أحدهم أدى دوره بطريقة لا تتفق مع الموقف المقصود (دون إساءة لأحد). الإجراء الأنسب هو:",["ترك المشهد يكتمل ثم مناقشة الأداء مع الصف في مرحلة التقويم","إيقاف التمثيل فوراً وتصحيح الأداء أمام الجميع","استبدال الطالب بآخر في منتصف المشهد","إنهاء النشاط وتحويله إلى محاضرة"],"في لعب الأدوار لا يُقاطع المشهد ما دام آمناً؛ فالمناقشة والتقويم مرحلة تلي التمثيل، وقد يُعاد المشهد بعدها. المقاطعة أو الاستبدال يكسران الموقف ويحرجان الطالب."],["L11","m","قسّم معلم اللغة العربية الطلاب إلى مُحاوِر ومسؤول توظيف، وطلب منهم تمثيل مقابلة عمل أمام الصف ثم مناقشة ما حدث. الاستراتيجية المستخدمة هي:",["لعب الأدوار","العصف الذهني","التدريس التبادلي","الاستقراء"],"لعب الأدوار محاكاة لموقف واقعي يتقمص فيه الطلاب أدواراً ثم يناقشونها. العصف توليد أفكار، والتبادلي حوار حول نص مقروء."],["L11","m","أثناء جلسة عصف ذهني سخر طالب من فكرة زميله قائلاً إنها غير منطقية. الإجراء الأنسب من المعلم هو:",["تذكير الصف بقاعدة إرجاء الحكم ومواصلة جمع الأفكار","حذف الفكرة التي سُخر منها لأنها غير منطقية","إيقاف الجلسة ومعاقبة الطالب الساخر","الطلب من صاحب الفكرة الدفاع عنها الآن"],"إرجاء الحكم قاعدة أساسية، والمعلم يعيد تثبيتها دون قطع الجلسة. حذف الفكرة أو الدفاع عنها الآن يُدخل التقويم في مرحلة التوليد، والعقاب يوقف تدفق الأفكار."],["L11","","كلّف المعلم طالباً متفوقاً بشرح درس الكسور لزميل يواجه صعوبة فيه. المستفيد من هذا الإجراء هو:",["الطالبان معاً؛ فالقرين المعلّم يرسخ فهمه والمتعلم يتلقى شرحاً بلغة قريبة منه","الطالب الضعيف وحده","الطالب المتفوق وحده","المعلم فقط لأنه وفر وقته"],"من مزايا تدريس الأقران أن الشرح يعمق فهم القرين المعلّم، وأن المتعلم يستفيد من لغة قريبة منه. حصر الفائدة في طرف واحد يغفل هذه الميزة."],["L11","m","يريد معلم جديد التدرب على مهارة طرح الأسئلة الصفية فقط، دون الدخول في درس كامل، والحصول على تغذية راجعة من مدرب وزملاء. الأسلوب الأنسب له هو:",["التدريس المصغر","حضور دورة نظرية عن الأسئلة","قراءة كتاب في طرق التدريس","تدريس حصة كاملة أمام المشرف"],"التدريس المصغر مصمم لهذا الغرض: مهارة واحدة، وقت قصير، تغذية راجعة، وإعادة أداء. الدورة النظرية والقراءة لا تتيحان الممارسة، والحصة الكاملة تشتت التركيز عن المهارة الواحدة."],["L11","m","طلبت معلمة العلوم من الطالبات زراعة بذور في أوعية ومتابعة نموها يومياً وتسجيل الملاحظات. نوع الخبرة وفق مخروط ديل:",["خبرة مباشرة هادفة","خبرة ممثلة","رموز بصرية","خبرة بديلة عبر الفيديو"],"الطالبة تمارس النشاط الحقيقي بنفسها، وهذه الخبرة المباشرة الهادفة في قاعدة المخروط. الخبرة الممثلة دراما، والفيديو والرموز أكثر تجريداً."],["L11","m","يريد معلم الكيمياء تعريف طلابه بتفاعل خطر لا يمكن إجراؤه في معمل المدرسة. الوسيلة الأنسب هي:",["المحاكاة الحاسوبية للتجربة","إجراء التجربة بحذر مع تقليل الكميات","الاكتفاء بوصف التجربة شفهياً","تكليف الطلاب بإجرائها في المنزل"],"المحاكاة خبرة بديلة آمنة تقرب التجارب الخطرة أو المكلفة. إجراؤها بحذر أو في المنزل خطر، والوصف الشفهي رمز لفظي ضعيف الأثر."],["L11","m","يقود معلم الفلسفة طلابه بسلسلة أسئلة متتابعة حتى يكتشف كل طالب التناقض في رأيه ويصل بنفسه إلى الرأي الصواب. الطريقة المستخدمة هي:",["الطريقة الحوارية (السقراطية)","المحاضرة","التعليم المبرمج","لعب الأدوار"],"الحوار السقراطي يقوم على أسئلة متتابعة تقود المتعلم إلى اكتشاف الحقيقة. المحاضرة تقدم الرأي جاهزاً، والمبرمج خطوات مكتوبة، ولعب الأدوار تمثيل."],["L11","","أي الطرق الآتية لا تُعد من الطرق المتمركزة حول المتعلم؟",["المحاضرة","التعلم التعاوني","الاكتشاف الموجه","المشروعات"],"المحاضرة تتمركز حول المعلم بوصفه مصدر المعرفة. التعاوني والاكتشاف والمشروعات تنقل النشاط إلى المتعلم."],["L11","","دعا المعلم ثلاثة متخصصين ليعرض كل منهم جانباً من موضوع «ترشيد المياه» أمام الطلاب، ثم فتح باب النقاش والأسئلة. هذا الأسلوب يسمى:",["الندوة","المناظرة","لعب الأدوار","العصف الذهني"],"الندوة عرض عدة متخصصين لجوانب موضوع واحد يعقبه نقاش. المناظرة مجموعتان مؤيدة ومعارضة، والعصف توليد أفكار من الطلاب أنفسهم."],["L11","m","يدرّس معلم صفاً فيه 45 طالباً محتوى نظرياً كثيفاً في حصة واحدة قبل الاختبار. الطريقة الأنسب لهذا الموقف هي:",["المحاضرة المدعومة بالعرض والأسئلة القصيرة","الاكتشاف الحر","المشروعات الجماعية","لعب الأدوار"],"المحاضرة اقتصادية في الوقت وتناسب الأعداد الكبيرة والمحتوى الكثيف، ويُحسّنها دعمها بالعرض والأسئلة. الاكتشاف الحر والمشروعات تحتاج وقتاً طويلاً، ولعب الأدوار لا يناسب المحتوى النظري الكثيف."],["L11","m","الطريقة الاستقرائية أنسب ما تكون لتعليم:",["المفاهيم والتعميمات","الحقائق المنفصلة كالتواريخ","المهارات الحركية","القراءة الجهرية"],"الاستقراء يبني المفهوم أو القاعدة من الأمثلة، فيناسب المفاهيم والتعميمات. الحقائق المنفصلة تُحفظ مباشرة، والمهارات الحركية تحتاج العرض والممارسة."],["L12","","كتب معلم الهدف: «أن يقرأ الطالب الدرس الثالث من الكتاب». الخلل في هذا الهدف أنه:",["يصف نشاطاً تعليمياً لا ناتج تعلم","يصف سلوك المعلم","يتضمن أكثر من ناتج","غير قابل للملاحظة"],"الهدف السلوكي يصف الناتج الذي يكتسبه الطالب (كأن يستخرج الفكرة الرئيسة)، أما قراءة الدرس فنشاط يؤدى للوصول إلى الناتج. الفعل هنا ملاحظ وفاعله الطالب وناتجه واحد."],["L12","m","كتب معلم الهدف: «أن يذكر الطالب أركان الإسلام ويشرح كل ركن منها». الخلل في صياغته أنه:",["يتضمن أكثر من ناتج تعلم في هدف واحد","يصف سلوك المعلم","يستخدم فعلاً غير قابل للقياس","يفتقر إلى المحتوى"],"القاعدة أن يتضمن الهدف ناتج تعلم واحداً؛ وهنا «يذكر» و«يشرح» ناتجان من مستويين مختلفين. الفعلان قابلان للقياس والفاعل هو الطالب."],["L12","m","في الهدف: «أن يحل الطالب 8 مسائل من 10 على الجمع خلال خمس دقائق دون آلة حاسبة»، عبارة «8 مسائل من 10» تمثل:",["معيار الأداء (الإتقان)","شرط الأداء","الفعل السلوكي","المحتوى"],"المعيار هو الحد الأدنى المقبول للأداء. «دون آلة حاسبة» شرط الأداء، و«يحل» الفعل السلوكي، و«مسائل الجمع» المحتوى."],["L12","","في الهدف: «أن يرسم الطالب خريطة المملكة باستخدام الأطلس في 10 دقائق»، عبارة «باستخدام الأطلس» تمثل:",["شرط الأداء","معيار الأداء","الفعل السلوكي","ناتج التعلم"],"الشرط هو الظرف أو الأدوات التي يُؤدى فيها السلوك. «في 10 دقائق» معيار زمني، و«يرسم» الفعل السلوكي."],["L12","","الهدف: «أن يكتسب الطالب مهارات القراءة الناقدة خلال الفصل الدراسي» يمثل:",["هدفاً عاماً للمقرر","هدفاً سلوكياً","غاية تربوية","هدف حصة واحدة"],"الهدف يمتد على فصل كامل ولا يقاس مباشرة في حصة، فهو هدف عام. الغاية أوسع وترتبط بالمجتمع، والسلوكي محدد بحصة."],["L12","","طلب المعلم من الطالب: «لخص الفقرة بأسلوبك الخاص». هذا الطلب يقيس مستوى:",["الفهم","التذكر","التحليل","الإبداع"],"التلخيص وإعادة الصياغة بأسلوب خاص من أفعال الفهم. التذكر يستدعي النص نفسه، والتحليل يفكك، والإبداع يبني جديداً."],["L12","","طلب المعلم من طلابه الحكم على صحة حل زميلهم للمسألة مع تبرير الحكم بمعايير واضحة. هذا الطلب يقيس مستوى:",["التقويم","التطبيق","الفهم","التذكر"],"إصدار الحكم المبرر وفق معايير هو التقويم. التطبيق حل المسألة، والفهم شرح الخطوات."],["L12","","أضاف التصنيف المعدل لبلوم بُعداً جديداً هو:",["بُعد المعرفة: حقائقية ومفاهيمية وإجرائية وما وراء معرفية","بُعد الدافعية","بُعد المهارات الحركية","بُعد القيم"],"التصنيف المعدل ثنائي الأبعاد: العمليات المعرفية (تذكر…إبداع) وأنواع المعرفة الأربعة. البدائل الأخرى مجالات مستقلة لا أبعاداً للمعرفي."],["L12","","الهدف: «أن يصف الطالب خطوات إجراء تجربة قياس الكثافة» يتناول من بُعد المعرفة في التصنيف المعدل المعرفة:",["الإجرائية","الحقائقية","المفاهيمية","ما وراء المعرفية"],"الخطوات والطرائق معرفة إجرائية. الحقائقية مصطلحات وتفاصيل، والمفاهيمية علاقات ونظريات، وما وراء المعرفية وعي الطالب بتفكيره."],["L12","m","راجع المشرف أسئلة اختبار معلم فوجد أن معظمها بصيغة «عدد، اذكر، عرّف». التوجيه الأنسب للمعلم هو:",["إضافة أسئلة تتطلب المقارنة والتعليل والحكم لتغطية المستويات العليا","زيادة عدد أسئلة التذكر لتكون أشمل","حذف كل أسئلة التذكر من الاختبار","تحويل الأسئلة كلها إلى مقالية"],"الأسئلة الحالية تقيس التذكر فقط، والاختبار الجيد يغطي المستويات العليا وفق جدول المواصفات دون إلغاء التذكر كلياً. تحويل النوع لا يغير المستوى بالضرورة."],["L12","h","الترتيب الصحيح لمستويات المجال الوجداني عند كراثوول تصاعدياً هو:",["الاستقبال، الاستجابة، التقييم، التنظيم، التميز بالقيمة","الاستجابة، الاستقبال، التنظيم، التقييم، التميز بالقيمة","الاستقبال، التقييم، الاستجابة، التميز بالقيمة، التنظيم","التنظيم، الاستقبال، الاستجابة، التقييم، التميز بالقيمة"],"يبدأ المجال الوجداني بالانتباه (الاستقبال) ثم المشاركة (الاستجابة) ثم تبني القيمة (التقييم) ثم ترتيب القيم (التنظيم) وينتهي بأن تصبح القيمة سمة ثابتة (التميز بالقيمة)."],["L12","m","لاحظ المعلم أن طالباً يصغي باهتمام لدرس عن النظافة دون أن يشارك أو يبادر. هذا الطالب في المستوى الوجداني:",["الاستقبال","الاستجابة","التقييم","التنظيم"],"الاستقبال هو الانتباه والإصغاء للمثير، وهو أدنى المستويات. الاستجابة تتطلب مشاركة فعلية، والتقييم تبني القيمة."],["L12","m","صار طالب ينظف مكانه ويحافظ على نظافة الصف من تلقاء نفسه في كل موقف حتى أصبح ذلك سمة معروفة عنه بين زملائه. هذا يدل على بلوغه المستوى الوجداني:",["التميز بالقيمة (الوسم)","الاستقبال","الاستجابة","التقييم"],"التميز بالقيمة أعلى المستويات: تصبح القيمة جزءاً ثابتاً من الشخصية يوجه السلوك باستمرار. الاستجابة مشاركة عند الطلب، والتقييم تبني القيمة دون أن تصير سمة ثابتة بعد."],["L12","","تطوع طالب للمشاركة في حملة نظافة الحي بعد درس عن النظافة. سلوكه يمثل المستوى الوجداني:",["الاستجابة","الاستقبال","التنظيم","التميز بالقيمة"],"الاستجابة هي المشاركة الفعلية والتطوع والتفاعل مع الموقف. الاستقبال اهتمام دون فعل، والتنظيم ترتيب منظومة القيم."],["L12","h","صاحب تصنيف الأهداف في المجال النفس‑حركي (المهاري) هو:",["سمبسون","كراثوول","بلوم","ماجر"],"سمبسون صاحب التصنيف السباعي للمجال النفس‑حركي (ومعه هارو وديف). كراثوول للوجداني، وبلوم للمعرفي، وماجر لصياغة الهدف السلوكي."],["L12","m","يؤدي طالب مهارة الخط العربي بتقليد حركة يد المعلم خطوة بخطوة تحت إشرافه. هذا الطالب في مستوى سمبسون:",["الاستجابة الموجهة","الآلية","الاستجابة المعقدة","الإبداع"],"الاستجابة الموجهة أداء المهارة بالتقليد والمحاولة تحت توجيه. الآلية أداء بثقة دون توجيه، والمعقدة أداء سلس لمهارة مركبة."],["L12","m","لاعب كرة سلة يعدّل حركة التصويب التي أتقنها لتناسب موقع المدافع المتغير في كل مرة. هذا الأداء يمثل مستوى سمبسون:",["التكيف","الاستجابة الموجهة","الإدراك الحسي","الاستعداد"],"التكيف تعديل المهارة المتقنة لمواجهة مواقف جديدة. الإدراك والاستعداد والاستجابة الموجهة مستويات دنيا سابقة للإتقان."],["L12","","بعد أن أنهى المعلم الجزء الأول من الدرس، قدم ربطاً قصيراً يمهد للجزء الثاني ويوضح علاقته بما سبق. نوع التهيئة هنا:",["الانتقالية","التوجيهية","الحافزة","التقويمية"],"التهيئة الانتقالية تُستخدم للانتقال السلس بين أجزاء الدرس. التوجيهية في بداية الدرس، والتقويمية تتحقق من الإتقان، والحافزة تثير الاهتمام."],["L12","","قبل الانتقال إلى الجزء الجديد من الدرس، طرح المعلم أسئلة سريعة ليتأكد من إتقان الطلاب للجزء السابق. نوع التهيئة هنا:",["التقويمية","التوجيهية","الحافزة","الانتقالية"],"التهيئة التقويمية تتحقق من مدى تمكن الطلاب مما سبق قبل البناء عليه. الانتقالية ربط لا تحقق، والتوجيهية ربط بالخبرات السابقة في البداية."],["L12","m","في الدقائق الأخيرة من الحصة، طلب المعلم من الطلاب تلخيص الأفكار الرئيسة للدرس وربطها بعضها ببعض. هذه الخطوة تسمى:",["الغلق","التهيئة","التقويم القبلي","التمهيد"],"الغلق خطوة ختامية لتلخيص الدرس وتثبيته. التهيئة والتمهيد في البداية، والتقويم القبلي قبل التدريس."],["L12","m","أعاد معلم أوراق الاختبار الشهري إلى طلابه بعد ثلاثة أسابيع من تطبيقه. أبرز مشكلة في هذا الإجراء أن:",["تأخر التغذية الراجعة يقلل أثرها في تصحيح التعلم","الطلاب سينسون أنهم اختُبروا","الدرجات ستكون أقل","المعلم سيحتاج إلى إعادة الاختبار"],"التغذية الراجعة الفورية أعلى أثراً، وتأخيرها يفصل بين الأداء ومعرفة النتيجة فيضعف التصحيح. البدائل الأخرى لا تصف أثر التأخير على التعلم."],["L12","h","جميع ما يأتي من خصائص التغذية الراجعة الفعالة ما عدا:",["أن تكون عامة مثل «أحسنت» دون تفصيل","أن تكون فورية","أن تكون محددة ووصفية","أن تركز على المهمة لا على شخص الطالب"],"التغذية الراجعة العامة لا تخبر الطالب ماذا أحسن وماذا يحسّن. الفورية والتحديد والتركيز على المهمة من خصائصها الجوهرية."],["L12","m","كتب معلمان تعليقين على مقال طالب؛ الأول: «ممتاز»، والثاني: «الفكرة واضحة لكن الدليل الثاني لا يدعمها، أضف مثالاً من النص». التعليق الأكثر فائدة للطالب هو:",["الثاني لأنه وصفي ومحدد ويوجه التحسين","الأول لأنه يرفع معنويات الطالب","الأول لأنه أقصر وأسرع","كلاهما بالقدر نفسه"],"التغذية الراجعة الوصفية المحددة توضح جوانب القوة والضعف وخطوة التحسين. «ممتاز» وحدها لا تعلّم شيئاً وإن كانت مشجعة."],["L12","m","عند تحليل محتوى درس في العلوم، تُصنف عبارة «يغلي الماء النقي عند 100 درجة مئوية عند مستوى سطح البحر» على أنها:",["حقيقة","مفهوم","تعميم","مهارة"],"الحقيقة معلومة محددة ثابتة قابلة للتحقق. المفهوم تصور مجرد لفئة (الغليان)، والتعميم علاقة بين مفهومين، والمهارة أداء."],["L12","","عبارة «كلما زاد الضغط الجوي ارتفعت درجة غليان السائل» تمثل في تحليل المحتوى:",["تعميماً (مبدأ)","حقيقة","مفهوماً","قيمة"],"التعميم علاقة بين مفهومين أو أكثر تنطبق على حالات كثيرة. الحقيقة معلومة جزئية محددة، والمفهوم كلمة أو تصور مفرد."],["L12","m","خُصص لوحدة «الكسور» 6 حصص من أصل 20 حصة للمقرر. إذا كان الاختبار يتكون من 40 سؤالاً، فعدد الأسئلة التي تستحقها الوحدة في جدول المواصفات هو:",["12 سؤالاً","6 أسئلة","20 سؤالاً","8 أسئلة"],"الوزن النسبي = 6 ÷ 20 = 30%، و30% من 40 = 12 سؤالاً. البديل 6 يخلط عدد الحصص بعدد الأسئلة."],["L12","","اشتكى طلاب من صعوبة الواجب وعدم فهم المطلوب منه. الإجراء الأنسب من المعلم عند تكليفهم بالواجب التالي هو:",["تقديم توجيهات محددة ونموذج للحل قبل التكليف","إلغاء الواجبات نهائياً","مضاعفة الواجب ليتدربوا أكثر","تكليف أولياء الأمور بحله معهم"],"التوجيهات الواضحة ونمذجة الحل من شروط الواجب الفعال. الإلغاء والمضاعفة لا يعالجان سبب الشكوى، ونقل الحل للأسرة يفقد الواجب غرضه."],["L12","m","كلف معلم الطلاب المشاغبين بواجب إضافي مضاعف عقاباً لهم. هذا الإجراء غير سليم لأنه:",["يكوّن اتجاهاً سلبياً نحو الواجب والمادة","يزيد تحصيل الطلاب أكثر من اللازم","يستغرق وقتاً في التصحيح","يخالف رغبة أولياء الأمور"],"الواجب أداة تعلم لا عقاب؛ ربطه بالعقاب يجعله منفراً ويقتل دافعيته. البدائل الأخرى لا تمس الأثر التربوي للإجراء."],["L12","m","يخطط معلم لدرس «جمع الكسور العشرية». أول ما ينبغي أن يتأكد منه قبل تنفيذ الدرس هو:",["إتقان الطلاب لمتطلب الدرس السابق وهو الكسور الاعتيادية والمنازل العشرية","توافر جهاز العرض في الفصل","موعد اختبار الوحدة","عدد الطلاب الغائبين"],"المتطلبات السابقة شرط لبناء التعلم الجديد، والتأكد منها جزء من التخطيط. الجهاز والموعد والغياب أمور تنظيمية لا تحدد إمكانية التعلم."],["L12","m","اكتشف المعلم أثناء التخطيط أن أنشطة الدرس تحتاج 70 دقيقة بينما الحصة 45 دقيقة. الإجراء الأنسب هو:",["إعادة ترتيب الأنشطة حسب أولويتها للأهداف وتأجيل الأقل أهمية","الاكتفاء بالشرح وتحويل كل الأنشطة إلى واجبات منزلية","أخذ حصة إضافية من زميل","تنفيذ الأنشطة كلها بسرعة دون تقويم"],"التخطيط يقوم على الأولوية للأهداف؛ فيُنفذ الأهم ويؤجل الباقي. تحويل الأنشطة كلها واجبات يفرغ الحصة من التطبيق، والحصة الإضافية والتسريع حلول غير منهجية."],["L12","","جميع ما يأتي من عناصر خطة الدرس اليومية ما عدا:",["توزيع المقرر على أسابيع الفصل","الأهداف السلوكية","التقويم","الوسائل التعليمية"],"توزيع المقرر على الأسابيع من التخطيط طويل المدى لا من الخطة اليومية. الأهداف والتقويم والوسائل عناصر أساسية في خطة الدرس."],["L12","m","يخطط معلم العلوم لدرس عن «الذرة» لطلاب الصف الأول المتوسط، ويعلم أن بعضهم لم يصل بعد إلى قدرة عالية على التجريد. الإجراء الأنسب في التخطيط هو:",["البدء بنماذج ومحسوسات وتمثيلات بصرية قبل الشرح المجرد","الاعتماد على التعريفات اللفظية المجردة لأنها أدق","تأجيل الدرس حتى ينضج الطلاب","تكليف الطلاب بقراءة الدرس من الكتاب فقط"],"التخطيط يراعي مستوى النمو المعرفي؛ فالمحسوسات والنماذج جسر إلى المجرد. التعريفات اللفظية والقراءة وحدها رموز مجردة، والتأجيل يهمل دور التعليم."],["L12","","الأفعال «يحكم، ينقد، يبرر، يفاضل» تنتمي إلى مستوى:",["التقويم","التطبيق","الفهم","التذكر"],"إصدار الأحكام المبررة وفق معايير هو التقويم. التطبيق استخدام، والفهم تفسير، والتذكر استرجاع."],["L12","m","أي الأهداف الآتية في مستوى الفهم وفق تصنيف بلوم؟",["أن يعطي الطالب مثالاً من عنده على الفعل المضارع","أن يعدد الطالب علامات رفع الفعل المضارع","أن يصمم الطالب لوحة تلخص أزمنة الفعل","أن يحكم الطالب على صحة إعراب زميله"],"إعطاء مثال من عند الطالب يدل على إدراك المعنى، وهو فهم. التعداد تذكر، والتصميم إبداع، والحكم تقويم."],["L12","","الهدف: «أن يصمم الطالب نموذجاً لمدينة مستدامة يوظف فيه مفاهيم الطاقة المتجددة» في مستوى:",["الإبداع (التركيب)","التطبيق","التحليل","الفهم"],"التصميم إنتاج بناء جديد يجمع عناصر متعددة، وهو الإبداع في التصنيف المعدل. التطبيق استخدام قاعدة في مسألة، والتحليل تفكيك."],["L12","m","الأهمية الأساسية للتخطيط للتدريس أنه:",["يوجه التنفيذ نحو الأهداف ويجنب العشوائية ويحدد الزمن والوسائل","يُرضي المشرف التربوي عند الزيارة","يقلل عدد الحصص المطلوبة","يغني عن التقويم في نهاية الدرس"],"التخطيط خريطة التنفيذ. إرضاء المشرف غاية شكلية، والتخطيط لا يقلل الحصص ولا يغني عن التقويم بل يتضمنه."],["L12","m","بدأ المعلم الحصة بسؤال: «لماذا تطفو السفينة الحديدية بينما يغرق مسمار صغير؟» ثم انتظر إجابات الطلاب قبل أن يبدأ الدرس. نوع التهيئة هنا:",["الحافزة","التقويمية","الانتقالية","الغلق"],"السؤال المحير يثير الاهتمام وحب الاستطلاع، وهذه التهيئة الحافزة. التقويمية تتحقق من إتقان السابق، والانتقالية بين أجزاء الدرس."],["L13","m","في صف مقلوب، اكتشف المعلم في بداية الحصة أن ثلث الطلاب لم يشاهدوا فيديو الدرس. الإجراء الأنسب هو:",["تطبيق نشاط تحقق قصير وتخصيص زاوية مشاهدة سريعة لمن لم يشاهد ثم مواصلة الأنشطة","إعادة شرح الدرس كاملاً للجميع","منع من لم يشاهد من المشاركة في الأنشطة","إلغاء الصف المقلوب نهائياً"],"الاستراتيجية تتطلب آلية تحقق ومعالجة سريعة دون إضاعة وقت الحصة. إعادة الشرح الكامل يعيد الصف التقليدي، والمنع عقاب لا يعالج، والإلغاء حل متسرع."],["L13","m","عمل الطلاب أسابيع عدة على إنتاج فيلم وثائقي عن تراث المنطقة ثم عرضوه أمام أولياء الأمور. الاستراتيجية المستخدمة هي:",["التعلم القائم على المشروعات","التعلم القائم على المشكلات","الاستقصاء العادل","الكرسي الساخن"],"العمل الممتد الذي ينتهي بمنتج يُعرض هو التعلم القائم على المشروعات. القائم على المشكلات ينطلق من مشكلة مفتوحة، والاستقصاء العادل مناظرة."],["L13","m","في درس عن المغناطيس، وزع المعلم مغناطيسات وأجساماً متنوعة وترك الطلاب يجربون ويسجلون ملاحظاتهم قبل أن يقدم أي شرح. هذه المرحلة في دورة التعلم الخماسية هي:",["الاستكشاف","التفسير","التوسع","التقويم"],"الاستكشاف مرحلة يعالج فيها الطلاب المواد بأنفسهم قبل الشرح. التفسير يقدم فيه المعلم المفهوم بعد الاستكشاف، والتوسع تطبيق في موقف جديد."],["L13","","بعد أن فهم الطلاب مفهوم الكثافة، طلب المعلم منهم تفسير سبب طفو السفن الضخمة. هذه المرحلة في دورة التعلم الخماسية هي:",["التوسع (الإثراء)","الانشغال","الاستكشاف","التفسير"],"التوسع تطبيق المفهوم في موقف جديد يعمق الفهم. الانشغال إثارة في البداية، والاستكشاف تجريب قبل الشرح، والتفسير تقديم المفهوم."],["L13","","قدم المعلم المفهوم نفسه لثلاث مجموعات بأنشطة مختلفة: مجموعة بالتجربة، وأخرى بالقراءة، وثالثة بمقطع مرئي. عنصر التمايز هنا هو:",["العملية","المنتج","المحتوى","التقويم"],"تنويع الأنشطة للوصول إلى المفهوم نفسه هو تمايز العملية. تمايز المحتوى يغير ما يُقدم، والمنتج يغير طريقة إظهار التعلم."],["L13","m","يريد المعلم أن يقارن الطلاب بين الخلية النباتية والحيوانية مبينين أوجه الشبه والاختلاف في شكل واحد. المنظم البصري الأنسب هو:",["أشكال فن (دائرتان متقاطعتان)","الخريطة الذهنية","الخط الزمني","الخريطة الجغرافية"],"أشكال فن مصممة للمقارنة: الشبه في التقاطع والاختلاف في الجانبين. الذهنية لفكرة واحدة، والخط الزمني للأحداث."],["L13","h","أجاب طالب إجابة خاطئة، فبدلاً من تصحيحها مباشرة طرح المعلم سلسلة أسئلة متدرجة قادته إلى الإجابة الصحيحة بنفسه. هذا الأسلوب يسمى:",["السبر المشجع","التغذية الراجعة المؤجلة","العقاب السالب","إعادة الصياغة"],"السبر المشجع سلسلة أسئلة بعد إجابة خاطئة تقود الطالب إلى الصواب. إعادة الصياغة تُستخدم عند عدم الإجابة، والتغذية المؤجلة تأتي لاحقاً."],["L13","m","لاحظ المشرف أن المعلم يطرح السؤال ثم يجيب عنه بنفسه بعد نحو ثانية واحدة إذا لم يرفع أحد يده. التوجيه الأنسب للمعلم هو:",["زيادة زمن الانتظار إلى 3–5 ثوانٍ قبل التدخل","طرح أسئلة أسهل فقط","الاكتفاء بسؤال المتفوقين","إلغاء الأسئلة الشفهية"],"قِصر زمن الانتظار يمنع الطلاب من التفكير فيجيب المعلم بنفسه. الأسئلة الأسهل والاقتصار على المتفوقين يقللان المشاركة، والإلغاء يفقد أداة مهمة."],["L13","","عند طرح الأسئلة الصفية، يُفضل أن يطرح المعلم السؤال أولاً ثم يختار المجيب، وذلك لـ:",["إبقاء جميع الطلاب منتبهين ومفكرين في السؤال","توفير وقت الحصة","ضمان إجابة الطالب المتفوق","تجنب إحراج الطالب الضعيف"],"اختيار المجيب قبل السؤال يجعل بقية الطلاب يتوقفون عن التفكير. البدائل الأخرى لا تعبر عن الغرض التربوي من الترتيب."],["L13","m","أجاب طالب إجابة ناقصة، فقال المعلم لطالب آخر: «ما رأيك في إجابة زميلك؟ هل تضيف إليها؟». هذا الأسلوب يسمى:",["إعادة توجيه السؤال (السبر المحوّل)","السبر التبريري","إعادة الصياغة","التلقين"],"إعادة التوجيه تحويل السؤال إلى طالب آخر للبناء على الإجابة. التبريري يطلب «لماذا» من المجيب نفسه، وإعادة الصياغة تغيير صياغة السؤال عند عدم الإجابة."],["L13","","ما يميز استراتيجية التعلم للإتقان عن التدريس التقليدي أن:",["زمن التعلم متغير ومعيار التحصيل ثابت","زمن التعلم ثابت ومعيار التحصيل متغير","التقويم فيها ختامي فقط","الطلاب فيها متجانسون"],"في الإتقان يُمنح كل طالب الوقت الذي يحتاجه لبلوغ المعيار نفسه، عكس التقليدي الذي يثبت الزمن فتتفاوت النتائج. التقويم فيها تكويني مستمر."],["L13","h","تخزين الملفات والتطبيقات على خوادم عبر الإنترنت بحيث يمكن الوصول إليها ومشاركتها من أي جهاز وفي أي وقت يسمى:",["الحوسبة السحابية","التعلم المتنقل","الواقع المعزز","التعليم المبرمج"],"الحوسبة السحابية تقدم التخزين والتطبيقات كخدمة عبر الإنترنت (قوقل درايف، ون درايف). الواقع المعزز يدمج عناصر رقمية بالواقع."],["L13","m","وضع معلم في عرضه التقديمي شرحاً نصياً لجهاز التنفس في شريحة، والرسم التوضيحي في شريحة أخرى منفصلة. وفق مبادئ ماير للوسائط المتعددة، هذا يخالف مبدأ:",["التقارب المكاني","التكرار الزائد","الشخصنة","التجزئة"],"مبدأ التقارب المكاني يقضي بوضع النص قرب الصورة التي يشرحها. التكرار الزائد يتعلق بتقديم النص المكتوب مع الصوت نفسه، والتجزئة بتقسيم العرض إلى أجزاء."],["L13","","وفق مبدأ الصيغة عند ماير، عند عرض رسم متحرك لعملية البناء الضوئي يكون التعلم أفضل إذا صاحبه:",["تعليق صوتي منطوق","نص مكتوب مطول على الشاشة","نص مكتوب وصوت يقرأه حرفياً معاً","لا شيء؛ الرسم وحده كافٍ"],"الصوت المنطوق مع الرسوم يوزع الحمل على القناتين السمعية والبصرية. النص المكتوب يزاحم الرسم في القناة البصرية، وتكرار النص مع الصوت نفسه يخالف مبدأ التكرار الزائد."],["L13","m","أضاف معلم إلى عرضه التقديمي موسيقى خلفية وصوراً تزيينية لا علاقة لها بالدرس بهدف التشويق، فلاحظ تشتت الطلاب. المبدأ الذي أخلّ به وفق ماير هو:",["الاتساق (حذف المواد غير المرتبطة)","التقارب الزماني","الشخصنة","الإشارة"],"مبدأ الاتساق يقضي بحذف الكلمات والصور والأصوات غير المرتبطة لأنها تستهلك الذاكرة العاملة. الزماني يتعلق بتزامن الصوت والصورة، والشخصنة بالأسلوب الحواري."],["L13","m","استبدل معلم السبورة التقليدية بعرض تقديمي يحتوي النص نفسه دون أي إضافة وظيفية. هذا المستوى في نموذج SAMR هو:",["الاستبدال","التعزيز","التعديل","إعادة التعريف"],"الاستبدال استخدام التقنية بديلاً مباشراً بلا تغيير وظيفي. التعزيز يضيف تحسيناً، والتعديل يعيد تصميم المهمة، وإعادة التعريف تخلق مهمة مستحيلة سابقاً."],["L13","m","تعاون طلاب مع طلاب من دولة أخرى عبر الإنترنت لإنتاج بحث مشترك بلغتين ونشره عالمياً، وهي مهمة ما كانت ممكنة دون التقنية. هذا المستوى في نموذج SAMR هو:",["إعادة التعريف","الاستبدال","التعزيز","التعديل"],"إعادة التعريف أعلى مستويات SAMR: مهمة جديدة كلياً غير ممكنة بلا تقنية. الاستبدال والتعزيز لا يغيران المهمة، والتعديل يعيد تصميمها دون أن تكون مستحيلة سابقاً."],["L13","m","نشر طالب صورة زميله على مجموعة الصف دون إذنه فتسبب في إحراجه. البعد الذي ينبغي للمعلم تعزيزه لدى الطلاب لمنع تكرار ذلك هو:",["المواطنة الرقمية وأخلاقيات الاستخدام","مهارة الكتابة على لوحة المفاتيح","التعلم المتنقل","الحوسبة السحابية"],"الموقف يتعلق بالخصوصية والاحترام في الفضاء الرقمي، وهو جوهر المواطنة الرقمية. البدائل الأخرى مهارات أو أنماط تقنية لا تعالج السلوك."],["L13","","قررت لجنة المناهج عدم تضمين موضوع معين في الكتاب عمداً، فلم يتعلمه الطلاب. هذا الموضوع ينتمي إلى:",["المنهج الفارغ (المحذوف)","المنهج الخفي","المنهج الرسمي","منهج النشاط"],"المنهج الفارغ عند آيزنر هو ما لم يُدرج عمداً فيتعلم الطالب بغيابه. الخفي يُتعلم ضمنياً، والرسمي مكتوب ومدرَّس."],["L13","","الوثيقة المكتوبة المعتمدة من الوزارة التي تحدد الأهداف والمحتوى والتقويم لكل مادة تمثل:",["المنهج الرسمي (المعلن)","المنهج الخفي","المنهج الفارغ","المنهج المُختبَر"],"المنهج الرسمي هو المخطط المكتوب المعتمد. الخفي غير مكتوب، والفارغ محذوف، والمختبَر ما يعيشه الطالب فعلاً."],["L13","h","تنظيم المنهج الذي يقوم على اهتمامات الطلاب وميولهم ويبنى على أساس حل المشكلات ويرتبط بجون ديوي هو:",["منهج النشاط","منهج المواد المنفصلة","المنهج المحوري","منهج المجالات الواسعة"],"منهج النشاط لديوي ينطلق من ميول الطلاب ومشكلاتهم. المواد المنفصلة تنظيم تقليدي، والمحوري محور مشترك ومواد اختيارية، والمجالات الواسعة دمج مواد متقاربة."],["L13","m","يعود مفهوم «الطاقة» في الصفوف الرابع والسابع والعاشر في كل مرة بعمق أوسع ومستوى تجريد أعلى. هذا التنظيم للمنهج يسمى:",["المنهج الحلزوني","منهج الوحدات","المنهج المحوري","منهج النشاط"],"المنهج الحلزوني (برونر) يعيد المفاهيم الأساسية بتعمق متزايد عبر الصفوف. الوحدات تنظيم حول موضوعات، والمحوري محور مشترك."],["L13","m","نسق معلم التاريخ مع معلم الجغرافيا لتدريس موضوع «الهجرة النبوية» في الأسبوع نفسه مع بقاء كل مادة مستقلة بحصصها. هذا التنظيم يسمى:",["المواد المترابطة","المواد المندمجة","المواد المنفصلة","المنهج المحوري"],"الترابط تنسيق بين مادتين مع بقائهما منفصلتين. الاندماج يصهرهما في مادة واحدة كالاجتماعيات، والمنفصلة لا تنسيق فيها."],["L13","","تنظيم منهجي يدرس فيه جميع الطلاب محوراً مشتركاً من الخبرات العامة ثم يختار كل منهم مواد تخصصية حسب ميوله. هذا هو:",["المنهج المحوري","منهج النشاط","المواد المنفصلة","المنهج الحلزوني"],"المنهج المحوري يجمع بين جزء مشترك إلزامي وجزء اختياري. النشاط ينطلق من الميول كلياً، والحلزوني يعيد المفاهيم بتعمق."],["L13","m","نموذج بناء المنهج الذي يبدأ من المعلم استقرائياً بتشخيص حاجات الطلاب ثم صياغة الأهداف واختيار المحتوى وتنظيمه هو نموذج:",["تابا","تايلر","برونر","بوسنر"],"هيلدا تابا ترى أن المنهج يُبنى من الأسفل بيد المعلم بدءاً بتشخيص الحاجات. تايلر يبدأ بالأهداف من الأعلى، وبرونر الحلزوني، وبوسنر التغير المفاهيمي."],["L13","m","أدرج معلم الرياضيات نشاطاً يحسب فيه الطلاب ميزانية أسرة شهرية ويقارنون بين خيارات الادخار. البعد المشترك الذي ينميه هذا النشاط هو:",["المهارات الحياتية","الهوية الوطنية","الثقافة الرقمية","مهارات اللغة"],"إدارة الميزانية والادخار من المهارات الحياتية التي تُنمى عبر المواد. الهوية ترتبط بالانتماء، والرقمية بالتقنية، واللغة بالتواصل."],["L13","m","ربط معلم اللغة الإنجليزية درس «الاحتفالات» بتراث المملكة واليوم الوطني، وطلب من الطلاب وصفه بالإنجليزية. البعد المشترك الذي يعززه هو:",["الهوية الوطنية","الثقافة الرقمية","المهارات الحياتية","التفكير الرياضي"],"ربط المحتوى بتراث الوطن ومناسباته يعزز الهوية الوطنية عبر مادة غير مخصصة لها. البدائل الأخرى أبعاد لا يستهدفها النشاط."],["L13","","المعلم الذي يختار استراتيجياته التدريسية وفق مؤشر المعيار 8.3 يراعي في المقام الأول:",["حاجات المتعلمين وخصائصهم وطبيعة أهداف التعلم","التجهيزات التقنية المتاحة في المدرسة فقط","الاستراتيجيات التي يفضلها شخصياً","ما يطلبه أولياء الأمور"],"المؤشر ينص على استراتيجيات تلبي حاجات المتعلمين وخصائصهم وتراعي طبيعة الأهداف. التجهيزات والتفضيل الشخصي وطلبات الأسر عوامل ثانوية."],["L14","h","عندما يخطئ الطالب في الإجابة عن سؤال، فالممارسة التي تعكس توقعات المعلم أداءً عالياً من المتعلم هي:",["إعادة صياغة السؤال بطريقة أخرى","الاكتفاء بإخبار الطالب بأنه مخطئ","تقديم الإجابة النموذجية عن السؤال","طلب الإجابة الصحيحة من طالب آخر"],"إعادة الصياغة تبقي الطالب في الموقف وتؤكد أنه قادر على الوصول للإجابة. نقل السؤال لطالب آخر يوحي بأن المعلم تخلى عنه."],["L14","","رسب طالب في اختبار فقال: «أنا غبي في الرياضيات ولن أنجح مهما فعلت». العزو هنا وفق نظرية واينر:",["داخلي ثابت غير قابل للضبط (القدرة)","داخلي متغير قابل للضبط (الجهد)","خارجي متغير (الحظ)","خارجي ثابت (صعوبة المادة)"],"الغباء سبب داخلي يراه الطالب ثابتاً وخارج سيطرته، وهذا أخطر أنواع العزو لأنه يقود إلى العجز المتعلم. عزو الفشل للجهد كان سيبقي الأمل."],["L14","","عند الثناء على نجاح طالب أمام زملائه، الأنسب أن يعزو المعلم النجاح إلى:",["الجهد الذي بذله الطالب","ذكائه الفطري","سهولة الاختبار","حظه في الأسئلة"],"عزو النجاح للجهد يرسخ أن النتيجة تحت سيطرة الطالب فيثابر. عزوه للذكاء يجعله يخاف من المهام الصعبة التي قد تكشف عكس ذلك."],["L14","m","لاحظت معلمة أن طالبة تقول قبل كل مهمة: «لن أحاول لأنني سأفشل كالعادة». الإجراء الأول الأنسب:",["تكليفها بمهمة قصيرة مضمونة النجاح ثم تعزيز جهدها","إعفاؤها من المهام الصعبة مراعاة لحالتها","مقارنتها بزميلتها المتفوقة لتحفيزها","إبلاغ ولي الأمر بضعف ثقتها بنفسها"],"كسر دائرة الفشل يبدأ بخبرة إتقان صغيرة (أقوى مصدر للكفاءة الذاتية) مع تعزيز الجهد. الإعفاء يثبت عجزها، والمقارنة تزيد الإحباط."],["L14","","أفضل طريقة لصياغة أهداف تعلم ترفع دافعية طالب متوسط المستوى:",["أهداف قصيرة المدى واضحة فيها تحدٍّ مناسب لقدراته","أهداف بعيدة المدى عامة الصياغة","أهداف سهلة جداً يضمن تحقيقها دون جهد","أهداف يحددها المعلم دون إطلاع الطالب عليها"],"الأهداف القصيرة الواضحة تمنح نجاحات متتابعة محسوسة، والتحدي المناسب يحفظ الاهتمام. السهلة جداً تُملّ، والبعيدة العامة لا تُشعر بالتقدم."],["L14","m","يمنح معلم جائزة مادية عن كل إجابة صحيحة مهما كانت بسيطة. الأثر المتوقع لهذا الأسلوب على المدى البعيد:",["إضعاف الدافعية الداخلية للتعلم","زيادة الدافعية الداخلية","ارتفاع تقدير الذات","تعلم أعمق وأكثر استمراراً"],"الإفراط في المكافآت الخارجية يجعل الطالب يتعلم من أجل الجائزة لا من أجل المعرفة، فتضعف الدافعية الداخلية. التعزيز المادي مفيد مؤقتاً مع الطلاب الذين لا يُحفَّزون داخلياً."],["L14","","أثر بجماليون في الصف يعني أن:",["توقعات المعلم عن الطالب تتحول إلى نبوءة تحقق ذاتها","الطلاب يقلدون سلوك المعلم بالملاحظة","الدافعية تزداد بزيادة المكافآت","التعلم يحدث بتعزيز التقريبات المتتابعة"],"بجماليون (روزنثال وجاكوبسون): من توقع المعلم تفوقه تفوق فعلاً. التقليد نمذجة، والتقريبات تشكيل."],["L14","","وفق باندورا، المصدر الأقوى للكفاءة الذاتية لدى الطالب هو:",["خبرات الإتقان الشخصية الناجحة","الإقناع اللفظي من المعلم","ملاحظة نجاح الأقران","الحالة الانفعالية والجسمية"],"النجاح الفعلي في مهمة سابقة أقوى دليل للطالب على قدرته. ملاحظة الأقران والإقناع اللفظي مصادر أضعف."],["L14","m","حصلت طالبة على درجة متدنية في مهمة كتابية. أي التعليقات يعكس توقعات عالية وتغذية راجعة وصفية معاً؟",["«مقدمتك واضحة ومرتبة، وتحتاجين إلى دليل يدعم الفقرة الثانية، أعيدي كتابتها وسأراجعها»","«ضعيف، راجعي الدرس»","«حاولي أكثر في المرة القادمة»","«زميلتك كتبت أفضل منك، انظري إلى ورقتها»"],"التعليق الأول يسمي نقطة القوة ونقطة التحسين وكيفيتها ويطلب محاولة أخرى. البدائل الأخرى إما حكم عام أو مقارنة بالأقران."],["L14","m","أي الأوصاف الآتية يدل على طالب ذي دافعية داخلية للتعلم؟",["يعمل بجد حتى عندما لا تُرصد له درجات","لا يبدأ العمل إلا بوعد بمكافأة","يختار دائماً أسهل المهام المتاحة","يتوقف عن العمل عند غياب المعلم"],"الدافعية الداخلية تظهر في المثابرة بلا مقابل خارجي واختيار المهام المتحدية. انتظار المكافأة دافعية خارجية."],["L14","","جميع ما يلي من مؤشرات التوقعات العالية في ممارسات المعلم ما عدا:",["إعطاء الطلاب الضعاف أسئلة أسهل دائماً وزمن انتظار أقصر","توزيع الأسئلة التي تتطلب تفكيراً على جميع الطلاب","انتظار إجابة الطالب المتردد وتشجيعه","الإصرار على إكمال المهمة مع تقديم الدعم"],"حصر الضعاف في الأسئلة السهلة واستعجالهم رسالة ضمنية بأنهم غير قادرين، وهو عكس التوقعات العالية."],["L14","m","يبدأ معلم كل حصة بسؤال طلابه عما يريدون إتقانه فيها، ويعلّق في نهاية الأسبوع تقدم كل طالب مقارنة بأدائه السابق لا بزملائه. يرسخ هذا:",["ثقافة توقعات عالية وتقديراً للجهد","التنافس بين الطلاب","الدافعية الخارجية فقط","الضبط الصفي الصارم"],"المقارنة بالذات وتحديد أهداف شخصية تؤكد أن كل طالب قادر على التقدم وأن الجهد هو المعيار."],["L14","","يريد معلم أن يرفع ثقة طالب متدني التحصيل بنفسه. الأنسب أن:",["يشركه ف
