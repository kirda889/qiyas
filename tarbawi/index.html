ئي حتى الثانوية): **60** تقويمات تكوينية و**40** اختبار نهاية الفترة.","النجاح: **النهاية الصغرى 50%**، و**النسبة الشرطية 20%** من درجة الاختبار التحريري (نهاية العام في الابتدائية والمتوسطة، ونهاية كل فترة في الثانوية)، ويُشترط في الابتدائية والمتوسطة أداء الاختبار الختامي.","اختبارات تحريرية قصيرة من **20 درجة مرتين على الأقل** في الفترة (دليل التوزيع 2025).","**لا تُطبق النسبة الشرطية على الدور الثاني**؛ وفيه يحتفظ الطالب بـ40 درجة ويُختبر من 60.","يستمر تحسين درجات الأدوات التكوينية حتى بدء اختبارات نهاية الفترة؛ وللسلوك 100 درجة وللمواظبة 100."],"ex":["طالب في الثاني متوسط مجموعه 58، لكن درجته في اختبار نهاية العام التحريري 6 من 40 (أقل من 8 = 20%): لم يحقق النسبة الشرطية فيدخل الدور الثاني، ولا تُطبق عليه النسبة الشرطية هناك."],"traps":["60 تكويني و40 ختامي، لا العكس."],"src":"لائحة تقويم الطالب في التعليم العام 2025 (المواد 1 و5 و6)؛ الإجراءات التنفيذية للائحة تقويم الطالب، القاعدتان 3 و4؛ دليل توزيع درجات المواد الدراسية 2025","aka":["لائحة تقويم الطالب","النسبة الشرطية","النهاية الصغرى"]},"ar.l15.levels":{"k":"تنظيم رسمي","t":["Performance Levels — Grades 1–2","مستويات الأداء للصفين الأول والثاني"],"body":["مستويات الأداء خاصة **بالصفين الأول والثاني الابتدائي** (والصف الأول للتعليم المستمر): يُقوَّم الطالب تكوينياً بمستوى إتقانه لكل معيار من معايير المادة، عدا **الرياضيات واللغة العربية** فتُقوَّمان قبلياً وتكوينياً وختامياً بالدرجات. ومن الصف الثالث فما فوق التقويم بالدرجات."],"pts":["**متفوق** 95% فأكثر من المعايير، و**متقدم** من 85% إلى أقل من 95%، و**متمكن** من 75% إلى أقل من 85% (وكلها بما فيها معايير الحد الأدنى).","**غير مجتاز**: أقل من 75%، أو لم يجتز معياراً أو أكثر من معايير الحد الأدنى.","يدوّن المعلم تقويمه **يومياً** في سجل متابعة تقويم الطالب، ويرصد الخلاصة في النظام الرقمي نهاية الفترة موثقة بشواهد في ملف إنجاز الطالب.","من لم يتقن معياراً من **معايير الحد الأدنى** يُحال إلى لجنة التوجيه الطلابي، ويستمر تقويمه فيه حتى نهاية العام."],"traps":["مستويات الأداء **للصفين الأول والثاني فقط**، وتُستثنى منها الرياضيات واللغة العربية.","أتقن 90% لكنه لم يتقن معياراً من الحد الأدنى = **غير مجتاز**."],"src":"لائحة تقويم الطالب في التعليم العام 2025، المادة 5؛ الإجراءات التنفيذية للائحة تقويم الطالب، القاعدة الثانية","aka":["مستويات الأداء"]},"ar.l16.validity":{"k":"خصائص الاختبار","t":["Validity","الصدق وأنواعه"],"body":["الصدق أن يقيس الاختبار ما وُضع لقياسه فعلاً؛ ويصفه دليل الاختبارات 2025 بأن «يتوافق التقويم مع الأهداف، ويقيس ما هو مخصص لقياسه». وهو أهم خصائص الاختبار، ولا يكون مطلقاً بل لغرض معين وفئة معينة."],"pts":["**المحتوى**: تمثيل الفقرات للمحتوى والأهداف؛ بجدول المواصفات وتحكيم المختصين.","**الظاهري**: مظهر الاختبار يوحي بأنه يقيس ما وُضع له؛ أضعفها.","**المحك**: ارتباط بمحك يُجمع **في الوقت نفسه** (تلازمي) أو **في المستقبل** (تنبؤي).","**البناء**: اتساق الاختبار مع النظرية المفسرة للسمة؛ بالتحليل العاملي.","**الصدق الذاتي** = √معامل الثبات؛ ثبات 0.64 ← صدق ذاتي 0.8.","**الصدق العيني**: كفاية **عدد الأسئلة** لتمثيل المادة، ويقابله **الصدق المنطقي**: تمثيل الموضوعات؛ وثبات 0.81 ← صدق ذاتي 0.9."],"traps":["«بعد سنة» أو «سينجح» = **تنبؤي**؛ «في الوقت نفسه» = **تلازمي**.","صدق المحتوى **بجدول المواصفات**، وصدق البناء **بالتحليل العاملي**."],"src":"دليل الاختبارات 2025 (خصائص التقويم الصفي الفعال)؛ مراجع القياس والتقويم التربوي","aka":["الصدق","صدق المحتوى","صدق المحك","صدق البناء","الصدق الذاتي"]},"ar.l16.reliab":{"k":"خصائص الاختبار","t":["Reliability & Objectivity","الثبات والموضوعية"],"body":["الثبات اتساق النتائج واستقرارها عند تكرار القياس، ويصفه دليل الاختبارات 2025 بأن نتائج التقويم «ثابتة نسبياً عند تكرار العملية في نفس الظروف». و**الموضوعية** عدم تأثر النتائج بذاتية المصحح، وهي شرط للثبات، والثبات شرط ضروري غير كافٍ للصدق."],"pts":["**إعادة التطبيق** (معامل الاستقرار): الاختبار نفسه مرتين؛ عيبه أثر التذكر إذا قصرت المدة.","**الصور المتكافئة** (معامل التكافؤ): نسختان بمواصفات واحدة.","**الاتساق الداخلي**: التجزئة النصفية وكودر ريتشاردسون وكرونباخ من تطبيق واحد.","**ثبات المصححين**: ارتباط درجات مصححين مستقلين؛ مؤشر على الموضوعية في المقالي.","يرتفع بزيادة عدد الفقرات وتباين العينة والصعوبة المتوسطة، وينخفض بالتخمين والغموض.","إجابة صحيحة ثم خاطئة عند الإعادة دون تعلم جديد = **انخفاض ثبات** الفقرة، لا ضعف تمييزها."],"traps":["الميزان الذي يزيد كيلوين دائماً **ثابت غير صادق**.","إجابة صحيحة ثم خاطئة عند الإعادة دون تعلم جديد = ضعف **ثبات** لا تمييز."],"src":"دليل الاختبارات 2025 (خصائص التقويم الصفي الفعال)؛ مراجع القياس والتقويم التربوي","aka":["الثبات","الموضوعية","إعادة التطبيق"]},"ar.l16.coef":{"k":"معاملات الثبات","t":["Reliability Coefficients & SEM","معاملات الثبات والخطأ المعياري"],"body":["معاملات الاتساق الداخلي تُحسب من تطبيق واحد، ولكل منها موضع. والخطأ المعياري للقياس يترجم الثبات إلى وحدات الدرجة: كم تتذبذب درجة الطالب حول درجته الحقيقية."],"pts":["**سبيرمان براون**: ر الكلي = 2ر ÷ (1 + ر). مثال: ارتباط النصفين 0.60 ← 1.20 ÷ 1.60 = **0.75**.","**كودر ريتشاردسون (KR-20)** للفقرات الثنائية: [ك ÷ (ك − 1)] × [1 − (مجموع ص×خ ÷ التباين الكلي)]. مثال: ك = 10، ومجموع ص×خ = 1.8، والتباين 6 ← (10 ÷ 9) × 0.7 ≈ **0.78**.","**كرونباخ ألفا**: الصيغة نفسها بمجموع تباينات الفقرات؛ للمقاييس المتدرجة والمقالية.","**الخطأ المعياري** = الانحراف المعياري × √(1 − الثبات). مثال: انحراف 10 وثبات 0.84 ← 10 × 0.4 = **4**، فدرجة 70 تعني أن الحقيقية غالباً بين 66 و74."],"traps":["**كرونباخ** للمتدرج و**كودر ريتشاردسون** للثنائي، وكلاهما للثبات لا الصدق.","كلما **كبر** الخطأ المعياري **قلّ** الثبات."],"src":"مراجع القياس والتقويم التربوي (معادلات الثبات)","aka":["سبيرمان براون","كودر ريتشاردسون","كرونباخ ألفا","الخطأ المعياري للقياس"]},"ar.l16.difficulty":{"k":"تحليل الفقرات","t":["Item Difficulty Index","معامل الصعوبة"],"body":["في الاستعمال الشائع: نسبة من أجاب صحيحاً إلى عدد المجيبين، ولذلك يسميه بعضهم **معامل السهولة**؛ كلما ارتفع كانت الفقرة أسهل. ودليل الاختبارات 2025 يحسبه بالصيغة نفسها (× 100)، ويعد 100% سهلاً جداً والصفر صعباً جداً، وينصح **بالاحتفاظ بالفقرة إذا وقع معاملها بين 30% و70%**."],"pts":["**الموضوعي**: المصيبون ÷ المجيبين. مثال: 18 من 30 ← **0.60**.","**بالمجموعتين**: (صحيح العليا + صحيح الدنيا) ÷ أفراد المجموعتين. مثال: (7 + 3) ÷ 16 ≈ **0.63**.","**المقالي**: مجموع درجات السؤال ÷ (عدد الطلاب × درجته). مثال: 20 طالباً، والسؤال من 5، والمجموع 60 ← 60 ÷ 100 = **0.60**.","المدى المقبول الشائع في المراجع 0.20–0.80، و0.50 مثالي.","0.90 سهلة جداً، و0.50 متوسطة ومثالية، و0.20 صعبة.","بعض المراجع تسمي نسبة المخطئين «معامل الصعوبة» ونسبة المصيبين «معامل السهولة» ومجموعهما = 1؛ انتبه لتسمية السؤال."],"traps":["المعامل **المرتفع** يعني فقرة **سهلة**، ما لم يُعرَّف بنسبة المخطئين.","فقرة 0.85 خارج المدى الشائع وخارج توصية الدليل: سهلة جداً تُراجع."],"src":"دليل الاختبارات: الأسس الفنية والعمليات الإجرائية 2025 (تحليل فقرات الاختبار: معامل الصعوبة)","aka":["معامل الصعوبة","معامل السهولة"],"ex":["فصل من 25 طالباً أجاب 14 منهم صحيحاً: 14 ÷ 25 = **0.56** (فقرة متوسطة)."]},"ar.l16.discrim":{"k":"تحليل الفقرات","t":["Item Discrimination Index","معامل التمييز"],"body":["يقيس قدرة الفقرة على التفريق بين المتمكنين والأقل تمكناً: نرتب الأوراق تنازلياً، ونأخذ أعلى 27% وأدنى 27%، ونقارن أداء الفئتين. ويحسبه دليل الاختبارات 2025 بالدرجات فيصلح للمقالي، **ويقبله ضمن المدى 0.40 – 1.00**."],"pts":["**الموضوعي**: (صحيح العليا − صحيح الدنيا) ÷ عدد إحدى الفئتين. مثال: 30 طالباً ← 8 في كل فئة؛ 7 و3 ← 4 ÷ 8 = **0.50**.","**صيغة الدليل**: (مجموع درجات العليا − مجموع الدنيا) ÷ (عدد إحدى الفئتين × درجة السؤال). مثال مقالي من 4: (26 − 14) ÷ 32 ≈ **0.38**.","**سالب**: 2 من العليا و5 من الدنيا ← −3 ÷ 8 ≈ **−0.38**؛ تُحذف الفقرة أو تُراجع.","التفسير الشائع: 0.40 فأعلى ممتاز، و0.30–0.39 جيد، و0.20–0.29 يحتاج تعديلاً، وأقل من 0.20 ضعيف."],"traps":["التمييز السالب يعني أن **الأقل تمكناً أجابوا أفضل**؛ غالباً خطأ في المفتاح أو غموض.","فقرة يجيبها الجميع تمييزها **صفر**."],"src":"دليل الاختبارات: الأسس الفنية والعمليات الإجرائية 2025 (معامل تمييز الفقرة)","aka":["معامل التمييز","التمييز السالب"],"ex":["فقرة أجاب عنها 7 من الفئة العليا (8 طلاب) و3 من الدنيا (8 طلاب): الصعوبة (7 + 3) ÷ 16 ≈ 0.63، والتمييز (7 − 3) ÷ 8 = 0.50؛ فقرة متوسطة ممتازة التمييز."]},"ar.l16.distract":{"k":"تحليل الفقرات","t":["Distractor Analysis","تحليل فعالية المشتتات"],"body":["البدائل الخاطئة في الاختيار من متعدد وظيفتها أن تجذب من لم يتقن. فالمشتت الفعال يختاره من الفئة **الدنيا** أكثر من الفئة **العليا**."],"pts":["مثال: المفتاح (ب)، و8 طلاب في كل فئة.","(أ): عليا 0، دنيا 4 ← **فعال**.","(ب) المفتاح: عليا 6، دنيا 2 ← صعوبة 8 ÷ 16 = 0.50، وتمييز 4 ÷ 8 = 0.50.","(ج): عليا 2، دنيا 2 ← **غير مميز** يُراجع؛ (د): لم يختره أحد ← **غير فعال** يُستبدل.","المشتت الذي تختاره العليا أكثر يُراجع؛ قد يكون غامضاً أو إجابة صحيحة ثانية."],"traps":["المشتت الذي **لا يختاره أحد** فاشل لا «سهل»."],"src":"مراجع القياس والتقويم التربوي (تحليل الفقرات)","aka":["المشتت الفعال","فعالية المشتتات"]},"ar.l16.central":{"k":"الإحصاء الوصفي","t":["Measures of Central Tendency","النزعة المركزية"],"body":["تبرز الدرجة التي تتمركز حولها درجات الأفراد (دليل الاختبارات 2025)، ولكل مقياس موضع يكون فيه الأنسب."],"pts":["**المتوسط** = مجموع القيم ÷ عددها؛ يتأثر بالقيم المتطرفة.","**الوسيط**: القيمة الوسطى بعد الترتيب، وفي العدد الزوجي متوسط القيمتين الوسطيين؛ الأنسب للبيانات الملتوية.","**المنوال**: الأكثر تكراراً؛ للبيانات النوعية، وقد يتعدد.","مثال: 4، 6، 6، 7، 9، 10، 14 ← المتوسط 56 ÷ 7 = **8**، والوسيط **7**، والمنوال **6**؛ ولو صارت 14 = 49 لصار المتوسط 91 ÷ 7 = **13** وبقي الوسيط **7**."],"traps":["الوسيط **للملتوي والمتطرف**، والمتوسط **للاعتدالي**، والمنوال **للنوعي**."],"src":"دليل الاختبارات 2025 (مقاييس النزعة المركزية)","aka":["المتوسط الحسابي","الوسيط","المنوال"]},"ar.l16.spread":{"k":"الإحصاء الوصفي","t":["Measures of Dispersion","مقاييس التشتت"],"body":["التشتت انحراف القيم عن المتوسط (دليل الاختبارات 2025): هل الطلاب متقاربون أم متباعدون؟ والصف ذو الانحراف المعياري الأصغر أكثر **تجانساً**."],"pts":["**المدى** = أكبر قيمة − أصغر قيمة؛ أبسطها وأكثرها تأثراً بالمتطرفات.","**التباين** = متوسط مربعات الانحرافات عن المتوسط، و**الانحراف المعياري** جذره.","مثال: 2، 4، 4، 4، 5، 5، 7، 9 ← المتوسط 5، ومربعات الانحرافات 9، 1، 1، 1، 0، 0، 4، 16 (مجموعها 32) ← التباين 32 ÷ 8 = **4** ← الانحراف **2**.","إضافة ثابت لكل الدرجات ترفع المتوسط ولا تغير الانحراف؛ والضرب في ثابت يضرب الاثنين.","الانحراف المعياري **صفر** يعني أن الدرجات كلها متساوية؛ و**الجدول التكراري** يعرض الفئات وتكراراتها والتكرار المتجمع."],"traps":["تباين 81 ← انحراف **9**.","الصف الأكثر تجانساً صاحب الانحراف **الأصغر**."],"src":"دليل الاختبارات 2025 (مقاييس التشتت)","aka":["المدى","التباين","الانحراف المعياري"]},"ar.l16.normal":{"k":"التوزيع","t":["Normal Distribution & Skewness","المنحنى الاعتدالي والالتواء"],"body":["منحنى متماثل جرسي يتساوى فيه المتوسط والوسيط والمنوال. وتطلب لائحة تقويم الطالب 2025 في التقويم التكويني «توزيعاً منطقياً للدرجات»: منحنى يرتفع عند الوسط وينخفض تدريجياً عند الطرفين، لمعالجة تضخم الدرجات."],"pts":["نحو **68%** من الدرجات بين المتوسط ± انحراف، و**95%** ± انحرافين، و**99.7%** ± ثلاثة.","مثال: متوسط 60 وانحراف 8 ← نحو 68% بين 52 و68، ونحو 95% بين 44 و76.","**الالتواء الموجب**: الذيل نحو اليمين، ومعظم الدرجات منخفضة، والمتوسط أكبر من الوسيط ← اختبار **صعب**.","**الالتواء السالب**: الذيل نحو اليسار، ومعظم الدرجات مرتفعة ← اختبار **سهل**.","نحو **34%** بين المتوسط وانحراف واحد فوقه، ونحو **2.5%** فوق انحرافين؛ وفي الالتواء السالب معظم الدرجات مرتفعة (اختبار سهل أو تدريس فعّال)."],"traps":["اسم الالتواء يتبع **اتجاه الذيل** لا مكان التكدس."],"src":"لائحة تقويم الطالب في التعليم العام 2025، المادة 1 (توزيع منطقي للدرجات)؛ مراجع الإحصاء التربوي","aka":["التوزيع الاعتدالي","الالتواء الموجب","الالتواء السالب"]},"ar.l16.z":{"k":"الدرجات المعيارية","t":["Standard Scores (z, T) & Percentile Rank","الدرجات المعيارية والرتبة المئينية"],"body":["الدرجة الخام لا تُقارن عبر اختبارين مختلفين؛ فنحوّلها إلى درجة معيارية تقول: كم انحرافاً معيارياً تبعد عن متوسط مجموعتها؟ أما الرتبة المئينية فتقول: كم في المئة من المجموعة دونها؟"],"pts":["**ز** = (الدرجة − المتوسط) ÷ الانحراف؛ متوسطها 0 وانحرافها 1.","**ت** = 50 + 10 × ز؛ متوسطها 50 وانحرافها 10.","مثال: 80 (متوسط 70، انحراف 5) ← ز = 2 ← ت = 70؛ و54 (متوسط 60، انحراف 4) ← ز = −1.5 ← ت = 35.","**الرتبة المئينية** ≈ (عدد من درجاتهم أقل ÷ العدد الكلي) × 100؛ مثال: 30 من 40 دونه ← **75**."],"traps":["الأفضل نسبياً صاحب **ز الأكبر** لا الدرجة الخام الأكبر.","الرتبة المئينية 90 **ليست** 90% إجابات صحيحة."],"src":"مراجع القياس والتقويم التربوي (الدرجات المعيارية والمئينية)","aka":["الدرجة المعيارية","الدرجة التائية","الرتبة المئينية"],"ex":["طالب حصل على 80 في الرياضيات (المتوسط 70، الانحراف 5) و85 في العلوم (المتوسط 80، الانحراف 10): ز الرياضيات = 2، وز العلوم = 0.5؛ فأداؤه النسبي في الرياضيات أفضل رغم أن درجته الخام أقل."]},"ar.l01.wasat":{"k":"قيمة","t":["Moderation (Wasatiyyah)","الوسطية والاعتدال"],"aka":["الوسطية","الاعتدال","الغلو","التطرف الفكري"],"body":["الوسطية هي الاعتدال والتوازن: لا زيادة تصل إلى الغلو والتشدد، ولا تقصير يصل إلى التفريط والتهاون. وهي ميزان في الفكر والقول والحكم والتعامل.","المعايير المهنية تطلب أن يكون المعلم نموذجاً في الامتثال **بالقيم الإسلامية الوسطية السمحة**، وأن يصمم أنشطة تعزز قيم الوسطية والتسامح والاعتدال ونبذ التطرف. وفي مدونة 1447 تأتي القيم نفسها واجبات: **التحلي بالنزاهة والصدق والأمانة والتسامح والرفق والعدالة**، ويُحظر **اعتناق الأفكار المتطرفة أو نشرها**."],"pts":["**الغلو**: تجاوز الحد المشروع حتى التشدد والتطرف؛ **التفريط**: التهاون والتقصير.","الوسطية تظهر في **أحكام المعلم** (عدل في التقويم والتعامل) لا في كلامه فقط.","قواعد السلوك 1447 تجعل من دور المعلم: **تعزيز التنوع الثقافي والوسطية والاعتدال الفكري، والتأكد من سلامة البيئة التعليمية من الفكر المتطرف**.","من حالات الإبعاد عن التدريس في لائحة الوظائف: **تبني اتجاهات فكرية منحرفة** أثناء أداء الواجب التعليمي بما يؤثر سلباً في الطلاب (المادة 14).","ندوة أو برنامج عن **التطرف الفكري** يُصنَّف قضية مجتمعية يزوّد المعلم طلابه بخبرات عنها."],"ex":["طالب في الثاني المتوسط يصف زميله بالتقصير لأنه لا يلتزم بنافلة معينة. المعلم لا يوبخ ولا يجاري، بل يوضح بهدوء الفرق بين الواجب والمستحب ويذكّر بأدب النصيحة. لا غلو في الحكم على الآخرين، ولا تهوين من القيم."],"traps":["الوسطية ليست «منطقة رمادية» بلا مواقف؛ الثوابت تُعلَّم بوضوح، والاعتدال في الأسلوب والحكم.","خيار «أتجنب الحديث عن القيم حتى لا أُتهم بالتشدد» تفريط لا وسطية."],"src":"المعايير المهنية للمعلمين، هيئة تقويم التعليم والتدريب (المجال الأول: القيم والمسؤوليات المهنية) (1.1)؛ مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ (المادتان 6 و14)؛ قواعد السلوك والمواظبة لطلبة التعليم العام، الإصدار الخامس 1447هـ (دور المعلم)؛ لائحة الوظائف التعليمية بتعديلات 1446هـ (المادة 14)"},"ar.l01.neutral":{"k":"موقف صفي","t":["Professional Neutrality","الحياد في القضايا الخلافية"],"aka":["الحياد المهني","الخلافية","القضايا الخلافية"],"body":["القضايا الخلافية مسائل يختلف فيها أهل العلم أو الناس: فتاوى فقهية مختلف فيها، تيارات دينية، شؤون سياسية. وواجب المعلم ألا يحوّل الحصة إلى منبر لرأيه الشخصي، وأن يحيل الطالب إلى المصادر الموثوقة والجهات المختصة.","مدونة 1447 نصت على ذلك في واجبات المعلم مع طلابه: **تجنب الدخول في نقاشات حول القضايا ذات الحساسية، مثل التيارات الدينية والقضايا الفقهية الخلافية والشؤون السياسية** (المادة 8)، وفي الواجبات العامة: **توخي الموضوعية والعمل بحيادية دون تمييز** (المادة 6)."],"pts":["الحياد في **الخلافيات** لا في **الثوابت** (العقيدة، الولاء للوطن وقيادته، القيم).","الحياد **لا يعني إسكات الطالب**: يستمع إليه باحترام، ويبيّن أن المسألة محل خلاف، ويوجهه إلى المرجع المختص.","تحظر المدونة **معارضة القرارات الصادرة من الجهات العليا والتشكيك في مصداقيتها وإثارة الرأي العام** (المادة 14)."],"ex":["طالب في الثانوية يسأل معلم الرياضيات عن حكم مسألة فقهية مختلف فيها ويطلب رأيه. يجيب المعلم: «هذه مسألة فيها أقوال لأهل العلم، وأحسن من يجيبك عنها معلم العلوم الشرعية أو أهل الفتوى المعتمدون»، ثم يعود إلى هدف الدرس."],"traps":["خيار «يعرض رأيه الشخصي بوضوح ليقنع الطلاب» خاطئ حتى لو كان واثقاً من رأيه.","خيار «يرفض السؤال ويوبخ الطالب» خاطئ أيضاً؛ الصحيح الإحالة الهادئة."],"src":"مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ (المواد 6 و8 و14)"},"ar.l01.dialogue":{"k":"موقف صفي","t":["Culture of Dialogue","ثقافة الحوار مع الطالب المختلف"],"aka":["ثقافة الحوار","الأدلة المنطقية والقدوة العملية"],"body":["المؤشر 1.1 للممارس يطلب أن **يناقش الأفكار المختلفة، ويتقبل اختلاف وجهات نظر الآخرين، ويوظف المواقف الصفية في تنمية ثقافة الحوار**. فالطالب الذي يجادل أو يشكك فرصة تعليمية لا تهديد.","الطريقة: إنصات كامل، ثم سؤال يوضح مقصده، ثم أدلة منطقية وشواهد تناسب عمره، مع قدوة عملية تجعل كلام المعلم مصدَّقاً. والحوار الهادئ يحمي الطالب من البحث عن إجابات في مصادر غير موثوقة."],"pts":["خطوات الحوار: **إنصات ← توضيح ← أدلة وشواهد ← اتفاق على المشترك**.","لا يُغلق باب الحوار، ولا يُحال الطالب إلى «موقع إلكتروني» ليتخلص المعلم من السؤال.","سؤال «الأمة أم الوطن؟» يجاب بحوار يجمع: حب الوطن والانتماء للأمة لا يتعارضان.","مدونة 1447: **احترام التنوع في وجهات النظر** (المادة 10)."],"ex":["طالب يقول في درس التاريخ: «ما فائدة دراسة الماضي؟». يعيد المعلم السؤال للصف، ويجمع إجابات الطلاب، ثم يعرض مثالاً من تأسيس الدولة السعودية يبيّن كيف تشرح الأحداث حاضرنا، فيتحول الاعتراض إلى نقاش يحقق الهدف."],"traps":["«قفل باب الجدال» قمع، و«الإحالة لموقع» تنصّل؛ الصحيح **أدلة منطقية + قدوة**.","الحوار لا يعني التسوية بين الثوابت والآراء؛ الثوابت تُبيَّن بأدلتها."],"src":"المعايير المهنية للمعلمين، هيئة تقويم التعليم والتدريب (المجال الأول: القيم والمسؤوليات المهنية) (1.1، مؤشر الممارس 3)؛ مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ (المادة 10)"},"ar.l01.krathwohl":{"k":"نظرية","t":["Krathwohl's Affective Taxonomy","تصنيف كراثول للمجال الوجداني"],"aka":["كراثول","تمثّل القيمة"],"body":["صنّف ديفيد كراثول (David Krathwohl) مع زملائه أهداف المجال الوجداني (المشاعر والقيم والاتجاهات) في خمسة مستويات متدرجة، كل مستوى يبني على ما قبله، من مجرد الانتباه للقيمة حتى تصبح جزءاً من شخصية المتعلم.","ويفيد المعلم في صياغة أهداف القيم: بدل «أن يحب الطالب وطنه» (لا يُقاس) يكتب سلوكاً يدل على المستوى: يصغي، يشارك، يدافع، يوازن، يتمثّل."],"pts":["1. **الاستقبال (التقبل)**: ينتبه ويصغي باهتمام.","2. **الاستجابة**: يشارك ويتفاعل (يشارك في ندوة).","3. **التقييم (التقدير)**: يقدّر القيمة ويتبناها ويدافع عنها.","4. **التنظيم**: يرتب القيم في منظومة ويوازن بينها عند التعارض.","5. **التمييز بالقيمة (التمثّل)**: تصبح القيمة سمة ثابتة في سلوكه، فيكون قدوة لغيره."],"ex":["في قيمة المحافظة على المرافق: يصغي الطالب للشرح (استقبال)، ثم يشارك في حملة الصف (استجابة)، ثم يدافع عن القيمة أمام زملائه (تقدير)، ثم يوازن بين رغبته في اللعب ونظافة الملعب (تنظيم)، ثم يحافظ على المرافق تلقائياً حتى خارج المدرسة (تمثّل)."],"traps":["الأعلى دائماً **التمثّل** (يكون قدوة لأسرته)، والأدنى **الاستقبال** (يصغي).","لا تخلط كراثول (وجداني) بتصنيف بلوم (معرفي) أو تصنيفات المجال المهاري."],"src":"تصنيف الأهداف التربوية في المجال الوجداني (كراثول وزملاؤه)"},"ar.l01.diversity":{"k":"قيمة","t":["Cultural Diversity & Coexistence","التنوع الثقافي والتعايش"],"aka":["التنوع الثقافي","التعايش","التسامح","التفاعل الإيجابي مع الثقافات الأخرى"],"body":["التنوع الثقافي حقيقة في كثير من الفصول: طلاب من مناطق مختلفة في المملكة، أو من جنسيات وعادات ولغات أخرى. والمعلم يحوّل هذا التنوع إلى مصدر تعلم بالاحترام المتبادل.","مدونة 1447 تجمع الأمرين في فقرة واحدة: ينمي لدى الطلاب الاعتزاز بدينهم والولاء لمليكهم والانتماء لوطنهم، **كما يعزز لديهم أهمية التفاعل الإيجابي مع الثقافات الأخرى** (المادة 8). وتطلب **احترام التنوع في وجهات النظر** (المادة 10)، و**العدالة والإنصاف في معاملة جميع الطلاب دون تمييز** (المادة 8)."],"pts":["الاستشهاد بمثال إيجابي من ثقافة أخرى = **تعزيز احترام الآخرين**، لا تهديد للهوية.","أفضل استراتيجية: **نشاط عملي** يعيشه الطالب (مقابلة، مشروع مشترك، عرض من زميل)، لا ملصقات وقوائم أعياد.","**التسامح**: قبول المخالف والتعامل معه بالحسنى من غير تنازل عن الثوابت؛ و**التعصب** نقيضه.","التعامل مع زميل عمل غير مسلم يكون **وفق مقتضيات مهام العمل** وباحترام؛ والمدونة تطلب التعامل مع الزملاء **دون تمييز** (المادة 13)."],"ex":["في فصل ابتدائي فيه طلاب من خمس جنسيات، تطلب المعلمة من كل طالب أن يحكي كيف يُكرم الضيف في بيته، ثم تجمع القواسم المشتركة على السبورة: الترحيب، والطعام، والبشاشة. نشاط واحد عزز الاحترام وربطه بقيمة الكرم في ثقافتنا."],"traps":["جمع الطلاب المتشابهين ثقافياً وعزلهم خطأ؛ الصحيح إتاحة الحديث والمشاركة للجميع.","احترام الثقافات **لا يعني** التنازل عن الثوابت."],"src":"مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ (المواد 8 و10 و13)؛ المعايير المهنية للمعلمين، هيئة تقويم التعليم والتدريب (المجال الأول: القيم والمسؤوليات المهنية) (1.2)؛ قواعد السلوك والمواظبة لطلبة التعليم العام، الإصدار الخامس 1447هـ (دور المعلم)"},"ar.l01.techcode":{"k":"مدونة 1447","t":["Technology Duties in the 1447 Code","واجبات المعلم التقنية في مدونة 1447"],"aka":["حقوق النشر","نظام مكافحة الجرائم المعلوماتية"],"body":["الباب الرابع من مدونة 1447 خاص بالتقنية: الأجهزة، والإنترنت، والبريد الإلكتروني، ومواقع التواصل الاجتماعي. والفكرة الجامعة أن المعلم يمثل التعليم في كل ما ينشره ويستخدمه.","وتطلب المدونة من المعلم في مواقع التواصل أن يستخدمها بما يعكس السلوك المهني، **مع الاطلاع والتقيد بنظام مكافحة الجرائم المعلوماتية** (المادة 21)."],"pts":["**نظام مكافحة الجرائم المعلوماتية** (1428هـ) يجرّم التنصت والابتزاز والتهديد والتشهير وتغيير معلومات المواقع والدخول غير المشروع؛ وليس من أخلاقيات المراسلة إخفاء الهوية أو التصرف بحرية في وثيقة وصلت بالخطأ أو إرسال رسائل متكررة للتنبيه.","**الإنترنت** (المادة 19): الالتزام **بحقوق الملكية الفكرية** وشروط الترخيص، و**التأكد من سلامة المحتوى المعروض أمام الطلاب**، وإبلاغ الإدارة فوراً عن أي أمر غير معتاد.","**الذكاء الاصطناعي** (المادة 19): الالتزام بسياسات الاستخدام المعتمدة، واحترام خصوصية البيانات، وتجنب الاعتماد الكلي عليه في القرارات الحساسة.","**البريد** (المادة 20): الحكومي للمراسلات الرسمية فقط، ولا يُستخدم البريد الشخصي في المراسلات الرسمية.","**التواصل الاجتماعي** (المادة 21): يتجنب **التصوير أو نشر أي محتوى يتعلق بالمدرسة أو الطلاب أو الزملاء**، ولا يسرّب القرارات والتعاميم، ولا يدير حساباً باسم جهته ما لم يُعيَّن متحدثاً رسمياً.","**الأجهزة** (المادة 18): لا يحمّل برامج أو يستخدم وحدات تخزين خارجية إلا بعد مراجعة الإدارة المختصة، ويحافظ على **كلمة السر**."],"ex":["معلم أعجبه نشاط طلابه فأراد تصويرهم ونشر المقطع في حسابه الشخصي. وفق المادة 21 يمتنع عن ذلك، ويرفع النشاط لإدارة المدرسة لتتولى النشر عبر قنواتها وفق ضوابط الوزارة."],"traps":["«الحساب شخصي فلا شأن للوزارة» خطأ؛ المدونة تنظم سلوك المعلم في حساباته الشخصية.","الذكاء الاصطناعي **مسموح بضوابط**، لا ممنوع مطلقاً ولا مطلق بلا قيود."],"src":"مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ، الباب الرابع (المواد 18–21)"},"ar.l01.privacy":{"k":"مدونة 1447","t":["Student Privacy & Data","خصوصية الطالب ونشر الصور والمعلومات"],"aka":["خصوصية الطالب","مراجعة لوائح الوزارة"],"body":["معلومات الطالب ووثائقه وصوره أمانة. مدونة 1447 تطلب **التعامل مع الوثائق والمعلومات الشخصية للطلاب بسرية تامة وفقاً للأنظمة والتعليمات** (المادة 8)، و**الالتزام بنظام حماية البيانات الشخصية** ولائحته (المادة 6)، وتحظر **إفشاء المعلومات السرية حتى بعد انتهاء الخدمة** (المادة 15).","لذلك فأي طلب للمعلومات من جهة خارجية، أو أي رغبة في نشر صور، تمر بإدارة المدرسة ولوائح الوزارة أولاً."],"pts":["نشر صور الطلاب: **مراجعة لوائح الوزارة أولاً**، ثم إذن ولي الأمر، والنشر عبر القنوات الرسمية.","طلب جهة خارجية (أخصائي، جهة بحثية) معلومات عن طالب: **إدارة المدرسة أولاً** واتباع تعليماتها.","المدونة تطلب **تجنب التصوير أو نشر أي محتوى يتعلق بالمدرسة أو الطلاب** في مواقع التواصل (المادة 21).","لا تُعرض كشوف الدرجات أو ترتيب الطلاب علناً."],"ex":["اتصل شخص يعرّف نفسه بأنه أخصائي ويطلب ملف طالب في الصف السادس. المعلمة تعتذر بلطف وتحيله إلى قائدة المدرسة، ولا ترسل شيئاً حتى لو أكد أن الطالب موافق."],"traps":["**إذن الطالب وحده** لا يكفي لإرسال معلوماته.","الترتيب الصحيح: **لوائح الوزارة** ← إذن ولي الأمر ← النشر الرسمي."],"src":"مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ (المواد 6 و8 و15 و21)"},"ar.l02.mithaq":{"k":"أخلاقيات المهنة","t":["Teaching Ethics Charter","ميثاق أخلاقيات مهنة التعليم"],"aka":["ميثاق أخلاقيات مهنة التعليم","الميثاق","أخلاقيات المهنة","أهداف الميثاق"],"body":["الميثاق وثيقة قيم أصدرتها الوزارة لتعرّف المعلم بالسجايا الحميدة والسلوكيات الفاضلة التي تليق بمهنته، في علاقته بطلابه وزملائه وأسر الطلاب ومجتمعه.","ومكانته ثابتة في ثلاث وثائق رسمية حديثة: المعيار الفرعي 1.3 يطلب أن **يربط المعلم بين ما نصت عليه مواد ميثاق أخلاقيات مهنة التعليم وأدائه المهني مع طلابه وزملائه وأولياء الأمور ومجتمع المدرسة**؛ ولائحة الوظائف التعليمية تجعل **عدم النزاهة أو الإخلال بأمانة التعليم وعدم الالتزام بميثاقها** من حالات الإبعاد (المادة 14/8)؛ ونظام التعليم العام 1448 ينص على [[الالتزام بميثاق أخلاقيات مهنة التعليم|ar.law.ethics]] ضمن واجبات المعلم."],"pts":["الميثاق **وثيقة قيم** (ماذا يليق بالمعلم)، و[[مدونة 1447|ar.l02.code1447]] **قواعد سلوك ملزمة** بواجبات ومحظورات ومساءلة.","الخلاف المهني بين معلمين مرجعه **الميثاق السعودي**، لا المواثيق العالمية ولا الاجتهاد الشخصي.","علاقات المعلم في الميثاق (الطلاب، الزملاء، الأسرة، المجتمع) هي نفسها أبواب الواجبات في مدونة 1447.","**أهداف الميثاق**: تعزيز انتماء المعلم لرسالته ومهنته والارتقاء بها، توعيته بأهميته المهنية، **الإسهام في تعزيز مكانة المعلم العلمية والاجتماعية**، وحفزه على تمثّل قيم مهنته.","**مواده**: التعريفات ← الأهداف ← رسالة التعليم ← المعلم وأداؤه المهني ← المعلم وطلابه ← المعلم والمجتمع ← المعلم والمجتمع المدرسي ← المعلم والأسرة؛ و«المعلم» فيه يشمل المشرفين والمديرين والمرشدين، و«الطالب» طلاب التعليم العام وما في مستواه.","**المجتمع المدرسي**: الثقة المتبادلة والعمل **بروح الفريق** مع الزملاء والإدارة، واحترام [[قواعد السلوك الوظيفي|ar.l02.civilcode]]؛ والالتزام بالأنظمة والمشاركة في نشاطات المدرسة **أركان أساسية** في تحقيق أهدافها."],"ex":["معلمان اختلفا: هل يجوز ذكر أسماء الطلاب الضعاف أمام الصف لتحفيزهم؟ يرجعان إلى الميثاق (صون كرامة الطالب) ومدونة 1447 (السرية والعدالة)، فيتفقان على التغذية الراجعة الفردية."],"traps":["لا تقل «ألغت مدونة 1447 الميثاق»: نص المدونة لم يذكر ذلك، والمعايير ونظام 1448 ولائحة الوظائف ما زالت تسمّي الميثاق.","مرجع الخلاف المهني **الميثاق السعودي** لا «المواثيق العالمية»."],"src":"المعايير المهنية للمعلمين، هيئة تقويم التعليم والتدريب (المجال الأول: القيم والمسؤوليات المهنية) (المعيار 1.3)؛ لائحة الوظائف التعليمية بتعديلات 1446هـ (المادة 14/8)؛ نظام التعليم العام 1448 (المادة 49/3)"},"ar.l02.code1447":{"k":"الأحدث","t":["Code of Conduct for Education Job Holders 1447","مدونة السلوك الوظيفي لشاغلي الوظائف التعليمية 1447"],"aka":["مدونة السلوك الوظيفي","مدونة 1447","المدونة"],"body":["أحدث وثيقة تنظم سلوك المعلم: **مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية**، صدرت عن وزارة التعليم بتاريخ **1447/2/3هـ**، استناداً إلى المادة 32 من لائحة الوظائف التعليمية التي كلفت الوزارة بإصدارها بالاتفاق مع الجهات المختصة.","تتكون من **26 مادة** في ستة أبواب وأحكام ختامية: أحكام تعريفية، ثم واجبات شاغل الوظيفة التعليمية، ثم المحظورات، ثم واجبات استخدام التقنية، ثم تعارض المصالح ومكافحة الفساد، ثم التزامات الوزارة تجاه المعلم."],"pts":["**المنبع الأساس** لسلوك المعلم: الآداب والأخلاق الإسلامية وفق توجيهات ولاة الأمر والأنظمة (المادة 2).","كل معلم **مسؤول عما يصدر عنه**، والمخالفة تعرّضه **للمساءلة والإجراءات التأديبية والجزائية** (المادتان 4 و5).","مع الطلاب (المادة 8): العدالة دون تمييز، دعم ذوي الإعاقة، السرية، **عدم تكليفهم بطلبات مادية** للأنشطة أو الوسائل، الالتزام بلائحة تقويم الطلاب، و**الاطلاع والتقيد بنظام حماية الطفل ونظام الحماية من الإيذاء**.","مع الرؤساء (المادة 11): ينفذ المهام، وإذا كانت مخلة بالأنظمة **يُعلم رئيسه خطياً**.","تسري على جميع شاغلي الوظائف التعليمية بمختلف التصنيفات التعاقدية، وفي **المدارس الأهلية والعالمية** والمدارس والأكاديميات السعودية في الخارج (المادة 25)."],"ex":["طلب مسؤول من معلم تعديل درجات طالب دون سند. المعلم وفق المادة 11 يُعلم رئيسه **كتابياً** أن الطلب مخالف للأنظمة، ولا ينفذه، ولا ينشر الأمر خارج القنوات الرسمية."],"traps":["مدونة 1447 تسري على **المعلم في المدرسة الأهلية** أيضاً.","عند الأمر المخالف: لا تنفيذ صامت ولا رفض شفهي، بل **إعلام الرئيس خطياً**."],"src":"مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ (المواد 1–26)"},"ar.l02.prohibited":{"k":"مدونة 1447","t":["Prohibitions in the 1447 Code","محظورات المعلم وتعارض المصالح"],"aka":["المحظورات","تعارض المصالح","السرية المهنية"],"body":["الباب الثالث من مدونة 1447 يحدد ما لا يجوز للمعلم مطلقاً، ويكمله الباب الخامس عن تعارض المصالح ومكافحة الفساد. هذه «الخطوط الحمراء» المهنية."],"pts":["**عام** (المادة 14): الاستهزاء بشعائر الإسلام أو اعتناق الأفكار المتطرفة أو نشرها؛ إساءة استعمال السلطة؛ استغلال النفوذ؛ الرشوة؛ التزوير؛ **تسريب أسئلة الاختبار ونماذج الإجابة**؛ الاشتغال بالتجارة؛ الجمع بين الوظيفة ومهنة أخرى دون ترخيص؛ الإضراب أو التحريض عليه؛ الشكاوى الجماعية أو الكيدية؛ و**جمع الأموال لأي غرض من الطلبة والموظفين**.","**المعلومات** (المادة 15): إفشاء المعلومات السرية **حتى بعد انتهاء الخدمة**؛ والتصريح للإعلام أو وسائل التواصل في موضوعات تحت الدراسة أو التحقيق دون موافقة خطية مسبقة.","**الهدايا** (المادة 17): قبول هدية أو ميزة تؤثر في نزاهته أو قراراته.","**تعارض المصالح** (المادة 22): الإفصاح خطياً عن أي تعارض قبل اتخاذ القرار، وعدم المشاركة في قرار عقد يكون أحد أقاربه طرفاً فيه.","**مكافحة الفساد** (المادة 23): إبلاغ الرئيس المباشر خطياً عن أي تجاوز، وإبلاغ الجهات المختصة عن الفساد، وإعلام الرئيس فوراً إذا عُرضت عليه رشوة."],"ex":["ولي أمر يقدّم لمعلمة هدية ثمينة قبل اختبارات نهاية الفصل. تعتذر المعلمة بلطف؛ لأن المادة 17 تحظر قبول هدية من شأنها التأثير في نزاهتها أو قراراتها، والتوقيت يجعل التأثير محتملاً."],"traps":["جمع مبلغ من الطلاب «لحفلة الصف» أو «لوسائل تعليمية» **محظور** ولو كان يسيراً (المادتان 8 و14).","سرية المعلومات **لا تنتهي** بانتهاء الخدمة."],"src":"مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ (المواد 14–17 و22–23)"},"ar.l02.civilcode":{"k":"للتمييز","t":["Civil Service Code of Conduct","مدونة السلوك الوظيفي للوظيفة العامة"],"aka":["قواعد السلوك الوظيفي","مدونة الوظيفة العامة"],"body":["قبل مدونة المعلمين توجد **مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة العامة**: إطار عام يجب على **كل موظف عام** التقيد به، تلقي الضوء على المعايير والأخلاق والقيم التي يتحلى بها الموظف أثناء أداء واجباته، وتُعد مخالفتها مخالفة لمقتضى الواجب الوظيفي يترتب عليها إجراءات تأديبية وجزائية.","ونصت مقدمتها على أنها تضمنت المبادئ العامة الشاملة، فقد لا تحيط بمعايير كل جهة، وقد يتطلب الأمر **إضافة معايير وقواعد تتناسب مع الجهات ذات الطابع الوظيفي أو المهني الخاص**. وهذا دور [[مدونة المعلمين 1447|ar.l02.code1447]]: تفصيل خاص بمهنة التعليم."],"pts":["**مدونة الوظيفة العامة**: لكل موظفي الخدمة المدنية، مبادئ عامة.","**مدونة 1447**: لشاغلي الوظائف التعليمية في الحكومي والأهلي والعالمي والمدارس السعودية في الخارج، وفيها ما يخص الطلاب وأولياء الأمور والاختبارات.","**الميثاق**: وثيقة قيم وأخلاقيات لمهنة التعليم.","العلاقة تكاملية: المعلم موظف عام، وصاحب مهنة لها قواعدها الخاصة."],"ex":["معلم يسأل عن استعمال جهاز حاسب المدرسة في عمل خاص خارج الدوام. المبدأ العام في مدونة الوظيفة العامة، ومنصوص أيضاً لشاغلي الوظائف التعليمية في مدونة 1447: يُحظر استخدام ممتلكات الدولة لمنفعة شخصية (المادة 16)، ولا يُستخدم الجهاز إلا لأغراض العمل (المادة 18)."],"traps":["إذا ذُكر في السؤال «طلاب» أو «أولياء أمور» أو «تسريب أسئلة» فالمرجع الأدق **مدونة 1447** الخاصة بالتعليم.","لا تخلط «المدونة» (قواعد ملزمة) بـ«الميثاق» (أخلاقيات المهنة)."],"src":"مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة العامة (المقدمة)؛ مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ"},"ar.l02.jobsreg":{"k":"لائحة","t":["Education Jobs Regulation","لائحة الوظائف التعليمية (بتعديلات 1446)"],"aka":["لائحة الوظائف التعليمية","الرتب الخمس","تحت التجربة سنتين"],"body":["اللائحة تنظم المسار الوظيفي للمعلم: الرتب، والتعيين، والتجربة، والنصاب، والترقية، والنقل، والتكليف، والرواتب، وانتهاء الخدمة. وتقع في **11 باباً و38 مادة**، وحلّت محل لائحة الوظائف التعليمية السابقة الصادرة عام 1401هـ. والنسخة المعتمدة هنا **المتضمنة تعديلات 1446هـ**.","وتذكر مقدمة مدونة 1447 أن اللائحة صادرة بقرار وزير الخدمة المدنية (سابقاً) رقم 2481 وتاريخ 1440/10/9هـ."],"pts":["**الرتب** (المادة 3): معلم خبير، معلم متقدم، معلم ممارس، معلم/مساعد معلم.","**التعيين ابتداءً** على **معلم ممارس** (شهادة جامعية في التخصص مع تحقيق المعايير المهنية) أو **مساعد معلم** (ثانوية ودبلوم لا يقل عن سنة) (المادة 5).","**التجربة سنتان** للمعين ابتداءً، وإن لم تثبت صلاحيته يصدر الوزير قراراً بإنهاء خدمته (المادة 8).","**الإبعاد** عن التدريس (المادة 14) في حالات منها: الإساءة للدين، تبني اتجاهات فكرية منحرفة، الإيذاء الجسدي أو التحرش، المخدرات، و**عدم النزاهة أو الإخلال بأمانة التعليم وعدم الالتزام بميثاقها**.","**التكليف** (المادة 19): القائد والوكيل من رتبة ممارس فأعلى، والمشرف التربوي من متقدم أو خبير؛ ومدة التكليف لا تزيد على أربع سنوات قابلة للتمديد."],"ex":["خريجة بكالوريوس تربوي عُيّنت معلمة ممارسة: تبدأ على الدرجة الثانية من المستوى الأول، وتقضي سنتين تحت التجربة، ثم تحتاج 6 سنوات في الرتبة مع بقية الشروط لتُرقّى إلى معلمة متقدمة."],"traps":["«معلم» رتبة لمن كان يزاول التعليم عند نفاذ اللائحة بمؤهل **دون الجامعي**؛ والتعيين الجديد يبدأ من **ممارس**.","قائد المدرسة يُختار من المكلفين بعمل **وكيل** مضى على تكليفهم 3 سنوات على الأقل (المادة 19/3)."],"src":"لائحة الوظائف التعليمية بتعديلات 1446هـ (المواد 1–38)؛ مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ (المقدمة)"},"ar.l02.license":{"k":"الرخصة","t":["Professional License","الرخصة المهنية"],"aka":["الرخصة المهنية","درجات الاجتياز","صلاحية الرخصة","إلزامية لمزاولة التعليم"],"body":["الرخصة المهنية **وثيقة تصدرها هيئة تقويم التعليم والتدريب** وفق معايير وإجراءات محددة، يكون حاملها مؤهلاً لمزاولة مهنة التعليم بحسب مستويات محددة ومدة زمنية محددة. والوزارة تلتزم بنتائج اختبارات الكفاية المهنية والرخص الصادرة من الهيئة (لائحة الوظائف، المادة 32).","مستوى الرخصة يتحدد بشرطين معاً: **الدرجة الأدنى في كلا الاختبارين** (التربوي العام والتخصصي) و**سنوات الخبرة** المناسبة للمؤهل."],"pts":["**المستويات**: رخصة معلم، معلم ممارس، معلم متقدم، معلم خبير.","**الدرجات** في **كلا** الاختبارين: من 50 إلى 69 ممارس، من 70 إلى 79 متقدم، 80 فأكثر خبير، بشرط سنوات الخبرة.","**خبرة مستوى خبير**: 11 سنة فأكثر للبكالوريوس، و9 للماجستير، و7 للدكتوراه؛ و**متقدم**: من 6 للبكالوريوس، ومن 5 للماجستير، ومن 4 للدكتوراه.","**السريان**: إذا صدرت الرخصة خلال سنة ميلادية من اجتياز الاختبار الأحدث فمدتها **5 سنوات من تاريخ إصدارها**؛ وإن صدرت بعد ذلك تنتهي بعد 5 سنوات من نهاية تلك السنة.","**تعديل 1446** (المادة 34 من اللائحة): الرخصة **شرط للممارسة المهنية**، ويجب الحصول عليها قبل **2026/02/01م**، ويُستثنى من بلغ **الخمسين** قبل هذا التاريخ مع إلحاقه ببرامج تطوير مهني."],"ex":["معلم بكالوريوس خبرته 8 سنوات حصل على 82 في التربوي و85 في التخصصي. درجاته تؤهل لخبير، لكن خبرته (من 6 إلى أقل من 11) تجعل رخصته **متقدم**، ويرقّيها حين يكمل 11 سنة."],"traps":["الرخصة تصدرها **الهيئة** لا الوزارة.","الدرجة وحدها لا تكفي؛ **سنوات الخبرة** جزء من الشرط."],"src":"ضوابط الرخص المهنية للوظائف التعليمية، هيئة تقويم التعليم والتدريب (1445هـ، المواد 1–9)؛ لائحة الوظائف التعليمية بتعديلات 1446هـ (المواد 1 و32 و34)"},"ar.l02.behavior":{"k":"قواعد 1447","t":["Behavior & Attendance Rules 1447","قواعد السلوك والمواظبة (الإصدار الخامس)"],"aka":["قواعد السلوك والمواظبة","لائحة السلوك والمواظبة"],"body":["قواعد السلوك والمواظبة لطلبة التعليم العام في **إصدارها الخامس (1447هـ - 2025م)** هي المرجع الحالي لضبط سلوك الطلاب وحضورهم، وتلغي ما سبقها. هدفها العام: **ضبط السلوك والمواظبة بما يتوافق مع المبادئ الإسلامية والقيم الأخلاقية وثقافة المجتمع**.","وتحدد أدوار كل طرف: قسم التوجيه الطلابي بإدارة التعليم، وإدارة المدرسة، والمعلم، ولجنة التوجيه الطلابي، والموجه الطلابي، والأسرة، والطالب."],"pts":["**النطاق** (المادة 28/2): ما يحدث داخل المدرسة، وفي التعليم الإلكتروني، والبرامج والأنشطة خارج المدرسة، والجهات التي يُرشَّح لها الطالب، وحافلات النقل، و**حدود المدرسة (الشوارع المحاذية لها)** إذا رصدها منسوبو المدرسة أو الجهات المنظمة أو أجهزة التصوير الخاصة بالمدرسة.","تُطبق في مدارس التعليم العام **الحكومي والخاص** ومدارس التعليم المستمر والمدارس السعودية في الخارج (المادة 28/1).","**التدرج**: الإجراء الأول عند أول مخالفة، والتالي عند **تكرار المشكلة نفسها**؛ وإذا ارتكب الطالب أكثر من مشكلة في وقت واحد تُتخذ إجراءات **الأعلى درجة**.","**دور المعلم**: تنفيذ الإجراءات الثلاثة الأولى لمشكلات **الدرجة الأولى** مباشرة وإحالة من لم يتجاوب لإدارة المدرسة، ورصد مشكلات **الدرجة الثانية فأعلى** وتسليمها للإدارة، وتمكين الطالب من **الفرص التعويضية**.","مثال من الدرجة الثالثة (المتوسطة والثانوية): **الشجار أو الاشتراك في مضاربة جماعية**؛ الإجراء الأول دعوة ولي الأمر وتعهد خطي وحسم 3 درجات وتحويل الطالب للموجه الطلابي، والثاني عند التكرار يشمل **نقل الطالب إلى فصل آخر** بقرار لجنة التوجيه الطلابي (المادة 12)."],"ex":["طالب في الثاني المتوسط اشترك في مضاربة جماعية للمرة الأولى. يرصد المعلم المشكلة ويسلمها للإدارة، فتُدعى أسرته، ويوقّع الطالب تعهداً، وتُحسم 3 درجات مع إتاحة فرصة التعويض، ويُحوَّل للموجه الطلابي لدراسة حالته. لا عقاب أمام الزملاء ولا تشهير."],"traps":["القواعد لا تقف عند سور المدرسة: تشمل الحافلة والتعليم الإلكتروني و**الشوارع المحاذية** إذا رُصدت.","قواعد الضبط التي يتفق عليها المعلم مع طلابه يجب أن **تتسق مع قواعد الوزارة**."],"src":"قواعد السلوك والمواظبة لطلبة التعليم العام، الإصدار الخامس 1447هـ (المواد 2 و3 و12 و28)"},"ar.l02.committee":{"k":"قواعد 1447","t":["Student Guidance Committee & Counselor","لجنة التوجيه الطلابي والموجه الطلابي"],"aka":["لجنة التوجيه الطلابي","الموجه الطلابي","المرشد الطلابي","لجنة التوجيه والإرشاد"],"body":["في قواعد 1447 الاسمان المعتمدان: **لجنة التوجيه الطلابي** و**الموجه الطلابي** (يقابلان في المراجع الأقدم «لجنة التوجيه والإرشاد» و«المرشد الطلابي»). اللجنة تدرس المشكلات الأكبر وتوصي وتقرر في حدود صلاحياتها، والموجه يدرس الحالة ويعالجها."],"pts":["من مهام اللجنة: إعداد خطة لتفعيل القواعد، **عقد مجلس أولياء الأمور** للتأكيد على دور الأسرة، استلام شواهد السلوك المتميز وتقدير الدرجة، توفير فرص التعويض، **تصنيف المشكلات التي لم ترد في القواعد** بما لا يتجاوز الدرجة الثالثة، دراسة **الحالات عالية الخطورة** ورفع التوصيات لمدير المدرسة، وإحالة الحالات للجهات المختصة.","**الموجه الطلابي لا يشارك** في رصد درجات السلوك ولا في تنفيذ الإجراءات على المخالف؛ دوره **دراسة الحالة وعلاجها** بعد التنفيذ (المادة 28).","المعلم يحدد أبرز مشكلات الطلبة ويطلب **الدعم والمشورة من لجنة التوجيه الطلابي** عند الحاجة، ويشارك في متابعة الحالات داخل الفصل وتنفيذ توصياتها."],"ex":["معلم لاحظ أن طالباً يتأخر صباحاً ويبدو منهكاً. لا يكتفي بالحسم، بل يحيل الحالة للموجه الطلابي ليدرس السبب مع الأسرة، فيتبين أن الطالب يرعى أخاه المريض ليلاً، فتُبنى له خطة دعم."],"traps":["خيار «الموجه الطلابي يحسم الدرجة» خاطئ؛ الحسم من **إدارة المدرسة**.","الحالات **عالية الخطورة** تتطلب تدخلاً مباشراً وسريعاً من إدارة المدرسة."],"src":"قواعد السلوك والمواظبة لطلبة التعليم العام، الإصدار الخامس 1447هـ (التعريفات، دور لجنة التوجيه الطلابي، دور المعلم، المادتان 5 و28)"},"ar.l02.childprot":{"k":"نظام","t":["Child Protection Law","نظام حماية الطفل ولائحته"],"aka":["نظام حماية الطفل","الإيذاء","الإهمال","1919"],"body":["نظام حماية الطفل صدر بالمرسوم الملكي **م/14 وتاريخ 1436/2/3هـ**، وعُدّل بالمرسوم **م/72 وتاريخ 1443/8/6هـ**، وصدرت له **لائحة تنفيذية جديدة** بديلة عن لائحة 1436. يعرّف **الطفل** بأنه كل إنسان **لم يتجاوز الثامنة عشرة**، ويحميه من **الإيذاء** (كل شكل من أشكال الإساءة للطفل أو استغلاله أو التهديد بذلك: جسدية أو نفسية أو جنسية) ومن **الإهمال** (عدم توفير حاجاته الأساسية أو التقصير فيها: الجسدية والصحية والعاطفية والنفسية والتربوية والتعليمية وغيرها).","ومدونة 1447 تلزم المعلم **بالاطلاع على اللائحة التنفيذية لنظام حماية الطفل ونظام الحماية من الإيذاء والتقيد بهما** في ممارساته التربوية (المادة 8)."],"pts":["**واجب الإبلاغ**: على كل من يطّلع على حالة إيذاء أو إهمال تبليغ الجهات المختصة **فوراً** (النظام، المادة 22).","اللائحة التنفيذية الجديدة (المادة 21): الإبلاغ إلى **مركز البلاغات على الرقم الموحد** مع **المحافظة على سرية هوية المبلّغ**؛ وعلى إدارة المدرسة إذا تعذر حل الحالة أن تبلّغ مركز البلاغات مع تقرير، وتسهّل دخول فريق متعدد التخصصات، وتبلّغ الجهات الأمنية في الحالات الخطيرة.","قواعد السلوك 1447 (المادة 29): الإجراءات **لا تتطلب التدرج**؛ يُبلَّغ مدير المدرسة فوراً وبسرية، وتُحال الحالة للجنة التوجيه الطلابي، ويُدوَّن محضر، ويُبلَّغ مركز بلاغات وزارة الموارد البشرية **(1919)** فوراً إذا تطلبت تدخلاً عاجلاً، وتُرفع لإدارة التعليم إذا كان مصدر الإيذاء أحد منسوبي المدرسة.","من صور الإيذاء أو الإهمال في النظام (المادة 3): **التسبب في انقطاع الطفل عن التعليم**، و**استخدام الكلمات المسيئة التي تحط من كرامته**، و**التمييز ضده**.","ونظام التعليم العام 1448 يضيف [[واجب الإبلاغ على إدارة المؤسسة التعليمية|ar.law.report]]."],"ex":["لاحظت معلمة كدمات متكررة على ذراع طالبة في الصف الرابع، وتهربت الطالبة من السؤال. المعلمة لا تحقق بنفسها ولا تتصل بالأسرة، بل تبلغ قائدة المدرسة فوراً وبسرية، والمدرسة تتولى الإجراءات والإبلاغ وفق المادة 29 من قواعد السلوك."],"traps":["حالات الإيذاء **لا تنتظر التدرج** ولا الصلح الداخلي.","الكلمات المسيئة التي تحط من كرامة الطفل **إيذاء** في نص النظام، لا «أسلوب حازم»."],"src":"نظام حماية الطفل (م/14 لعام 1436، وتعديلات م/72 لعام 1443)؛ اللائحة التنفيذية الجديدة لنظام حماية الطفل (المادة 21)؛ قواعد السلوك والمواظبة لطلبة التعليم العام، الإصدار الخامس 1447هـ (المادة 29)؛ مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ (المادة 8)"},"ar.l02.rifq":{"k":"برنامج وزاري","t":["Rifq Program","برنامج رفق لخفض العنف (1445)"],"aka":["رفق","التنمر","العنف"],"body":["«رفق» برنامج إرشادي وقائي وعلاجي أعدته وزارة التعليم (التوجيه الطلابي) عام 1445هـ لخفض العنف المدرسي بكل أشكاله، طوال العام الدراسي وفي جميع المراحل، بنين وبنات. واسمه مأخوذ من الحديث: «إن الرفق لا يكون في شيء إلا زانه، ولا يُنزع من شيء إلا شانه»، و«الرفق» في البرنامج ضد العنف ومعناه لين الجانب.","يعمل على ثلاثة مستويات: **المدرسة** و**الأسرة** و**الطلبة**، ويرتب العمل في: وقاية، ثم كشف وتعرّف على المؤشرات (المشاهدة الواعية، الملاحظة العلمية، قائمة المؤشرات)، ثم تدخل مبكر، ثم أساليب علاجية للمعتدي والمعتدى عليه، مع نماذج للحصر والمتابعة والإبلاغ لمركز البلاغات."],"pts":["**العنف**: كل سلوك متعمد ينتج عنه أضرار جسدية أو نفسية للآخرين أو تخريب للممتلكات.","**التنمر** خمسة محددات: شكل من أشكال العنف، **متعمد**، بين **أقران** من الفئة العمرية نفسها، مع **اختلاف ميزان القوة**، و**متكرر**.","**المشاجرة الطارئة ليست تنمراً**، لغياب شرط التكرار والاستمرار.","النظريات المفسرة للعنف في البرنامج: البيولوجية، والسلوكية (التعزيز)، و**التعلم بالمشاهدة (النمذجة)**، و**الإحباط - العدوان**، والاجتماعية.","من استراتيجيات الخفض **ضبط المثيرات**: الحد من أسباب العنف في المحيط التربوي والأسري."],"ex":["طالبان في الخامس الابتدائي تشاجرا مرة واحدة على الكرة: مشاجرة طارئة تُعالج بإجراءات السلوك. أما طالب يسخر يومياً من زميل أصغر جسماً ويعزله عن المجموعة منذ أسابيع، فهذا **تنمر** لاكتمال محدداته، ويستدعي خطة علاجية مع الموجه الطلابي وإشراك الأسرة."],"traps":["لا يكفي **التكرار** وحده؛ التنمر يحتاج **تعمداً واختلال قوة بين أقران**.","ولي الأمر الذي يشكو تنمراً: **استماع ثم متابعة مع الموجه الطلابي**، لا تهوين ولا تنصّل."],"src":"برنامج رفق لخفض العنف في مدارس التعليم العام، وزارة التعليم 1445هـ (الملخص، الأهداف، المصطلحات، النظريات المفسرة، أسباب العنف)"},"ar.l03.pd":{"k":"مفهوم","t":["Professional Development","التنمية المهنية للمعلم"],"aka":["التنمية المهنية","التطوير المهني","النمو المهني"],"body":["التنمية المهنية جهد منظم مستمر يرتقي بمعارف المعلم ومهاراته وقيمه حتى ينعكس على تعلم طلابه. وتعرّف لائحة الوظائف التعليمية **التطوير المهني** بأنه **عملية منظمة لتنمية المعارف والمهارات العلمية والتربوية وفق المعايير المهنية**.","وهو اليوم حق وواجب ومعيار ترقية: مدونة 1447 تطلب أن **يحرص المعلم على التطوير المهني المستمر واستخدام أساليب التدريس الفعالة والمبتكرة** (المادة 7)، ونظام التعليم 1448 يجعله [[حقاً وواجباً|ar.law.teacher]]، ولائحة الوظائف تشترط **الحد الأدنى من نقاط التطوير المهني** للترقية والتكليف."],"pts":["مكوناتها في الأدب التربوي: **التدريب المهني** (مهارات) + **التربية المهنية** (معتقدات وقيم) + **المساندة المهنية** (استقرار وظيفي ومناخ داعم).","مبادئها: **عملية مستمرة** لا نتيجة تنتهي بدورة، تُخطط جماعياً، في بيئة مشجعة، ويُقاس **أثرها في تعلم الطلاب**.","أهدافها: مواكبة المستجدات، التعلم مدى الحياة، ترسيخ أخلاقيات المهنة، تحسين تعلم الطلاب.","المعلم يتحمل **مسؤولية نموه الذاتي**، ويدرس مناسبة أي دورة له قبل التسجيل."],"ex":["عُرضت على معلم دورة في تصميم الفيديو التعليمي. قبل التسجيل سأل: هل تعالج احتياجاً في خطتي؟ هل ستغير ممارستي مع طلابي؟ فوجد أن احتياجه الأكبر في التقويم التكويني، فقدّمه في خطته."],"traps":["**تطوير البيئة المادية للصف** ليس هدفاً للتنمية المهنية.","**المساندة** ليست تدريباً؛ هي الاستقرار الوظيفي والمناخ الداعم."],"src":"لائحة الوظائف التعليمية بتعديلات 1446هـ (المادتان 1 و10)؛ مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ (المادة 7)؛ نظام التعليم العام 1448 (المادتان 48 و49)"},"ar.l03.reflect":{"k":"التأمل","t":["Reflective Practice","التأمل الذاتي في التدريس"],"aka":["التأمل الذاتي","التأمل في التدريس","التأمل الناقد","التأمل الذاتي وتقويم الزملاء والخبراء"],"body":["التأمل الذاتي استقصاء منظم وواعٍ في الممارسة: يعود المعلم إلى ما فعله، ويسأل لماذا حدث، وما البديل، ثم يجرب. وارتبط المفهوم بأعمال دونالد شون (Donald Schön) عن «الممارس المتأمل» الذي يتأمل **أثناء الفعل** و**بعد الفعل**.","مؤشر الممارس 2.2 يطلب أن **يحلل ممارساته المهنية تحليلاً نقدياً في ضوء التقويم والتأمل الذاتي ومستوى أداء طلابه**، ومؤشر 3.1 يطلب أن **يمارس التأمل الذاتي للواقع التدريسي لاستكشاف القضايا التربوية التي تمثل مجالاً للبحوث الإجرائية**."],"pts":["**المستويات** كما تُدرَّس للاختبار: **وصفي** (ماذا حدث؟) ← **تفسيري** (تبرير بحل واحد) ← **حواري** (حوار داخلي يختبر عدة حلول وفروض) ← **ناقد** (تأمل جماعي مع الزملاء).","**أدوات فردية**: [[نافذة جوهاري|ar.l03.johari]]، أداة سوات SWOT، بطاقة التأمل، ملف الإنجاز، تصوير الدرس بالفيديو، صحائف التأمل، سلالم التقدير وقوائم الشطب.","**أدوات جماعية**: البحث الإجرائي، ملف الإنجاز الجماعي، مؤتمرات التأمل، مجموعات التركيز، التدريب المعرفي.","يحدث في **التخطيط والتنفيذ والتقويم**، ويعتمد على **الوقت والخبرة**.","مثال التأمل الذاتي في الاختبار: **تصوير جزء من أدائه التدريسي ومراجعته** لاحقاً؛ أما طلب التغذية الراجعة من زميل فتقويم أقران.","أسئلة توجّه تأمل الطالب في تعلمه: ماذا تعلمت؟ كيف أحسّن؟ وليس «كيف أتفوق على زملائي؟» (مقارنة لا تأمل)."],"ex":["بعد حصة مضطربة كتبت المعلمة: «الطالبات تكلمن أثناء العمل الجماعي» (وصفي). ثم: «لأن التعليمات لم تكن واضحة» (تفسيري). ثم سألت نفسها: أهي التعليمات، أم حجم المجموعة، أم نوع المهمة؟ (حواري). ثم عرضت الموقف على زميلاتها في مجتمع التعلم (ناقد)."],"traps":["تصوير الدرس ومراجعته = **تأمل ذاتي**؛ طلب رأي زميل = **تقويم أقران**.","التفسيري **حل واحد**، والحواري **عدة حلول**، والناقد **جماعي**."],"src":"المعايير المهنية للمعلمين، هيئة تقويم التعليم والتدريب (المجال الأول: القيم والمسؤوليات المهنية) (2.2 و3.1)؛ أدبيات الممارس المتأمل (دونالد شون)"},"ar.l03.johari":{"k":"أداة تأمل","t":["Johari Window","نافذة جوهاري"],"aka":["نافذة جوهاري"],"body":["أداة لفهم الذات وعلاقتها بالآخرين، وضعها عالما النفس جوزيف لفت وهارينغتون إنغام (Joseph Luft & Harrington Ingham)، واسمها مركب من اسميهما. تقسم ما يُعرف عن الشخص إلى أربع مناطق بحسب سؤالين: هل أعرفه أنا؟ وهل يعرفه الآخرون؟"],"pts":["**المنطقة العامة (المفتوحة)**: أعرفها ويعرفها غيري.","**المنطقة العمياء**: يعرفها غيري ولا أعرفها، وتُضيَّق **بطلب التغذية الراجعة**.","**المنطقة الخاصة (المخفية)**: أعرفها وأخفيها، وتضيق **بالإفصاح**.","**المنطقة المجهولة**: لا أعرفها ولا يعرفها غيري، وتُكتشف بالتجربة والتأمل.","الهدف المهني: **توسيع المنطقة العامة**."],"ex":["معلم يظن أنه يوزع الأسئلة على الجميع، وبعد زيارة زميل اكتشف أنه يوجه أغلبها للصفوف الأمامية. هذه معلومة كانت في **المنطقة العمياء**، وكشفتها التغذية الراجعة."],"traps":["ما يراه الآخرون ولا تراه = **العمياء** لا الخاصة.","علاج العمياء **التغذية الراجعة**، وعلاج الخاصة **الإفصاح**."],"src":"نافذة جوهاري (لفت وإنغام)"},"ar.l04.plc":{"k":"مجتمعات التعلم","t":["Professional Learning Community","مجتمع التعلم المهني"],"aka":["مجتمع التعلم المهني","مجتمعات التعلم المهنية","مجتمعات التعلم","ثقافة التعاون","الأسئلة والفصول"],"body":["مجتمع التعلم المهني مجموعة من المعلمين داخل المدرسة يعملون معاً بشكل **مخطط ومستمر** لتحسين تعلم الطلاب، فيتعلمون هم أنفسهم أثناء ذلك. وارتبط المفهوم في الأدب التربوي بأعمال ريتشارد دوفور (Richard DuFour) الذي لخّصه في ثلاث أفكار كبرى: ضمان تعلم الطلاب، وثقافة التعاون، والتركيز على النتائج.","وفي الميدان السعودي ينص النموذج الإشرافي في ضوء تمكين المدرسة 1446 من أهدافه على **توفير متطلبات التطوير المهني المستمر الذاتي والتعاوني، وتفعيل مجتمعات التعلم المهنية بأساليب وأدوات وأوعية متنوعة**، ويظهر في نموذج تقييم أداء المعلم ضمن عنصر «التفاعل مع المجتمع المهني»."],"pts":["**المبادئ**: تشارك الرؤية والقيم والأهداف، وثقافة التعاون، والتركيز على تعلم الطلاب، والتركيز على النتائج.","**عملي لا نظري**: يحلل بيانات الطلاب ويقرر ماذا يغير في التدريس.","**التشكيل** حسب **الصف أو التخصص** المشترك.","**أسئلة التحليل** عن **الأسئلة والفصول** (أين أخطأ الطلاب؟ لماذا اختلفت الفصول؟) لا عن الأفراد المتفوقين.","**عوامل النجاح**: قيادة داعمة، وبنية تنظيمية ووقت مخصص، ونظام فاعل للتطبيق.","تحليل نتائج الاختبارات الوطنية لثلاث سنوات يُوظَّف في **تعديل خطط التدريس والأنشطة في ضوء النتائج**؛ ومراجعة الزملاء لأعمال بعضهم تساعد على **حل مشكلات التدريس**."],"ex":["معلمو العلوم في الصف الثاني المتوسط يجتمعون كل أسبوعين. حللوا سؤالاً أخفق فيه أكثر من نصف الطلاب في الفصول الأربعة، فاكتشفوا أن المفهوم يُدرّس بمثال واحد، فاتفقوا على نشاط عملي موحد، وسيقيسون أثره في الاختبار القصير القادم."],"traps":["هدفه تعاون **المعلمين** لتحسين تعلم **الطلاب**، لا تعاون الطلاب ولا تقويم المعلمين.","«يُعنى بالجوانب النظرية» مفهوم خاطئ عنه."],"src":"المعايير المهنية للمعلمين، هيئة تقويم التعليم والتدريب (المجال الأول: القيم والمسؤوليات المهنية) (3.1)؛ النموذج الإشرافي في ضوء تمكين المدرسة 1446 (الأهداف التفصيلية)؛ الدليل الإرشادي لإدارة الأداء الوظيفي 2026؛ أدبيات مجتمعات التعلم المهنية (دوفور)"},"ar.l04.plcforms":{"k":"مجتمعات التعلم","t":["Forms of Collaborative Learning","أوعية مجتمعات التعلم المهنية"],"aka":["أوعية مجتمعات التعلم","أوعية مجتمعات التعلم المهنية","التوأمة المهنية","الشبكات المهنية","التدريب بالأقران"],"body":["«الأوعية» هي القوالب التي يجري فيها تعلم المعلمين معاً. واختيار الوعاء يتبع الهدف: مهارة جديدة؟ مشكلة صفية مشتركة؟ تبادل بين مدرستين؟","وتجمعها قائمة واحدة: التدريب المباشر، ورش العمل وحلقات النقاش، المؤتمرات والندوات، البرامج الأكاديمية، البحوث الإجرائية، التدريب بالأقران، التوأمة المهنية، الشبكات المهنية، مجموعات التخصص."],"pts":["**التدريب المباشر**، و**ورش العمل وحلقات النقاش**، و**المؤتمرات والندوات**، و**البرامج الأكاديمية**.","**البحوث الإجرائية**: وعاء لحل مشكلة مشتركة بمنهجية.","**التدريب بالأقران**: زميل يدرب زميله على مهارة ويتابعه في الصف.","**التوأمة المهنية**: شراكة بين معلمين أو مدرستين لتبادل الخبرات.","**الشبكات المهنية**: روابط معلمين متميزين في مهارة، ينسق المشرف عملهم لدعم أقرانهم."],"ex":["مدرستان متجاورتان: الأولى متميزة في التعلم التعاوني والثانية في توظيف التقنية. اتفقتا على توأمة: زيارات متبادلة شهرية، وورشة مشتركة كل فصل."],"traps":["التوأمة **بين طرفين** (معلمين أو مدرستين)؛ والشبكة **مجموعة أوسع** ينسقها مشرف.","البحوث الإجرائية من أوعية مجتمعات التعلم ومن أدوات التأمل الجماعي معاً."],"src":"أدبيات مجتمعات التعلم المهنية؛ النموذج الإشرافي في ضوء تمكين المدرسة 1446"},"ar.l04.parentcomm":{"k":"أولياء الأمور","t":["Communicating with Parents","التواصل مع أولياء الأمور"],"aka":["التواصل مع أولياء الأمور","شريك الوالدين","اجتماع الأهداف المشتركة"],"body":["العلاقة مع ولي الأمر شراكة في مصلحة الطالب. ومدونة 1447 تحدد قواعدها في المادة 9: **تعزيز التواصل الإيجابي** والاستماع إلى ملاحظاتهم والإجابة عن استفساراتهم في الزيارات المدرسية أو **عبر المنصات الرسمية المعتمدة للتواصل مع ولي الأمر**، والتعامل **باحترام وتقدير** وتقديم المعلومات عن المستوى الأكاديمي والسلوكي **بأسلوب واضح وموضوعي ودون تمييز**، وتجنب ما يثير سوء الفهم أو النزاع، والتعاون في إيجاد الحلول وإرشاد الأسرة إلى الأساليب التربوية."],"pts":["لمناقشة التقدم: **اجتماع للأهداف المشتركة** أفضل من التواقيع ودفاتر المتابعة.","التواصل لا يقتصر على المشكلات: **رسائل إيجابية** ودعوات للفعاليات والتكريم.","مع أسر الطلاب **ذوي الإعاقة**: توجيه وتوعية لتعديل الاتجاهات السلوكية الخاطئة وتوثيق الروابط بين البيت والمدرسة (المادة 9/3).","**السرية**: معلومات الطالب تخصه وأسرته؛ ولا يُتحدث عن طالب أمام غيره.","نموذج تقييم أداء المعلم يخصص **10%** لعنصر **التفاعل مع أولياء الأمور**."],"ex":["معلمة ترسل كل أسبوعين رسالة قصيرة عبر المنصة المعتمدة: إنجاز إيجابي للطالبة، ومهارة تعمل عليها، ونشاط منزلي من خمس دقائق. وحين احتاجت لاحقاً إلى لقاء بسبب تراجع مفاجئ، كانت الثقة قائمة."],"traps":["القناة **الرسمية المعتمدة** مقدمة على الحسابات الشخصية.","مزايا اجتماعات أولياء الأمور **لا تشمل** إشراكهم في **تقويم المعلمين**."],"src":"مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ (المادة 9)؛ الدليل الإرشادي لإدارة الأداء الوظيفي 2026؛ المعايير المهنية للمعلمين، هيئة تقويم التعليم والتدريب (المجال الأول: القيم والمسؤوليات المهنية) (3.2)"},"ar.l04.angry":{"k":"موقف صفي","t":["The Upset Parent","ولي الأمر الغاضب والإنصات الفعّال"],"aka":["الإنصات الفعّال","الإنصات أولاً"],"body":["موقف أساسي في هذا المعيار: ولي أمر يدخل غاضباً. والقاعدة الذهبية: **الإنصات أولاً**. الغاضب لا يسمع حتى يُسمع، فإذا عبّر عن رأيه ومشاعره وفهمه لما حدث، صار مستعداً للنقاش."],"pts":["**الترتيب**: إنصات ← تلخيص ما فهمته منه ← عرض الحقائق بهدوء وموضوعية ← حل مشترك ← متابعة.","غاضب من **مستوى ابنه**: هدوء ومنطق وحياد بالأدلة (أعمال، نتائج)، دون رفع درجات ولا تحويل فوري.","يريد **أخذ ابنه أثناء الحصة**: الاستئذان إجراء إداري ← **إدارة المدرسة**.","يشكو **تنمراً**: **الاستماع له ثم إخباره بمتابعة الأمر مع المرشد الطلابي** (الموجه الطلابي في قواعد 1447) وفق برنامج [[رفق|ar.l02.rifq]]؛ لا تهوين ولا تنصّل.","يسأل عن **صعوبات تعلم**: موعد مع **المختص** في المدرسة؛ التشخيص ليس من صلاحية المعلم."],"ex":["ولي أمر يقول بحدة: «ابني يقول إنك تظلمه في الدرجات!». يدعوه المعلم للجلوس ويقول: «أفهم قلقك، أخبرني ماذا قال لك بالتفصيل»، وبعد أن ينتهي يعرض أوراق الطالب ومعايير التصحيح، ثم يتفقان على خطة مراجعة أسبوعية."],"traps":["شرح وجهة نظرك ومراجعة اللوائح خطوات **صحيحة في توقيت خاطئ** إذا سبقت الإنصات.","رفع الدرجة لإرضاء ولي الأمر إخلال بالعدالة."],"src":"مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ (المادة 9)؛ المعايير المهنية للمعلمين، هيئة تقويم التعليم والتدريب (المجال الأول: القيم والمسؤوليات المهنية) (3.2)"},"ar.l04.family":{"k":"قواعد 1447","t":["The Family's Role","دور الأسرة ومجلس أولياء الأمور"],"aka":["دور الأسرة","مجلس أولياء الأمور","مجالس أولياء الأمور"],"body":["قواعد السلوك والمواظبة 1447 تجعل الأسرة شريكاً بأدوار مكتوبة، لا متلقياً للاستدعاءات. ومن مهام **لجنة التوجيه الطلابي** في المدرسة **عقد مجلس أولياء الأمور للتأكيد على دور الأسرة في تعزيز القيم والسلوك الإيجابي لدى الأبناء**."],"pts":["من أدوار الأسرة: **الاطلاع على جميع أنظمة المدرسة وقواعدها وتعليماتها ومناقشتها مع الأبناء**.","**حضور الاجتماعات ومجالس أولياء الأمور** والفعاليات التثقيفية والتوعوية التي تنفذها المدرسة.","**التواصل الفوري مع المدرسة عند تغيّب الابن** مع توضيح سبب الغياب.","**إخطار المدرسة باحتياجات الابن** والتعاون معها لحل مشكلاته، و**إبلاغ الموجه الطلابي أو الوكيل** عند تعرضه لمشكلات سلوكية.","التزام ولي الأمر بمسؤوليته الكاملة تجاه ابنه وفق القواعد ونظامي **الحماية من الإيذاء وحماية الطفل**."],"ex":["طالب يكرر مخالفة استخدام الجوال. المعلم لا يسرد مخالفاته على والده، بل يعطيه نسخة من قواعد استخدام الأجهزة في المدرسة، ويتفقان على متابعة مشتركة في البيت والمدرسة لأسبوعين."],"traps":["لزيادة تعاون والد الطالب المخالف: **تزويده بالقواعد السلوكية** للمتابعة في البيت، لا المقارنة بإخوته.","النتائج المتدنية **لصف كامل** ← **مجلس أولياء الأمور** (لقاء جماعي)."],"src":"قواعد السلوك والمواظبة لطلبة التعليم العام، الإصدار الخامس 1447هـ (دور الأسرة، دور لجنة التوجيه الطلابي)"},"ar.l04.partnership":{"k":"المجتمع المحلي","t":["Community Partnership","الشراكة المجتمعية"],"aka":["الشراكة المجتمعية","المشاركة المجتمعية","مقومات الشراكة"],"body":["الشراكة المجتمعية إتاحة الفرصة لأولياء الأمور ومؤسسات المجتمع للإسهام **بالفكر والمشورة والموارد** في تطوير التعليم، في علاقة **تبادلية**: المدرسة تأخذ من مجتمعها وتعطيه.","ومن الأطر المشهورة في هذا الباب نموذج جويس إبستين (Joyce Epstein) لأنماط مشاركة الأسرة والمجتمع الستة: الوالدية، والتواصل، والتطوع، والتعلم في المنزل، والمشاركة في اتخاذ القرار، والتعاون مع المجتمع."],"pts":["**المقومات**: احترام متبادل، وتقدير جهود المعلمين، ومسؤولية مشتركة بين المدرسة والأسرة والقطاعين العام والخاص والجامعات.","**النتائج**: اتجاهات أفضل نحو المدرسة، وتحصيل أعلى، وتسرب أقل، ودعم أكبر من الأسر، ومعنويات أعلى للمعلمين.","**المجتمع المحيط بالمدرسة**: جهات حكومية وأهلية وأفراد يقدمون دعماً مادياً أو عينياً أو بشرياً.","مؤشر الممارس 3.3: **يوضح جوانب علاقة المدرسة مع المجتمع المحلي وأهميتها، ويشارك بإيجابية في المناسبات والفعاليات الاجتماعية التي تعززها**.","من صور التفاعل مع المؤسسات: تنمية الوعي بخدمة البيئة، التدريب في مراكز محو الأمية، دعم نادي الحي، دروس التقوية.","معلم يتتبع الفعاليات المحلية والدولية ويحث أولياء الأمور على المشاركة بمنجزات أبنائهم: يعكس **رغبته في دعم طلابه للافتخار بمنجزاتهم**."],"ex":["مركز صحي قريب يقدم للمدرسة محاضرة عن التغذية، والمدرسة تفتح ساحتها لحملة توعوية للحي. علاقة تبادلية واضحة، وكلاهما يخدم الصحة المدرسية."],"traps":["الشراكة **تبادلية**؛ الخيار الذي «يأخذ دعماً فقط» ناقص.","**المشاركة** جهود تطوعية في التخطيط والتنفيذ والتقويم؛ و**الشراكة** علاقة منظمة أوسع بمسؤولية مشتركة."],"src":"المعايير المهنية للمعلمين، هيئة تقويم التعليم والتدريب (المجال الأول: القيم والمسؤوليات المهنية) (3.3)؛ رؤية المملكة 2030 (الشراكة المجتمعية)؛ أدبيات الشراكة بين المدرسة والأسرة والمجتمع (إبستين)"},"ar.l04.local":{"k":"مؤشر 3.3","t":["Local Issues & Functional Knowledge","القضايا المحلية ووظيفة المعرفة"],"aka":["القضايا المحلية","وظيفة المعرفة","القضية المحلية"],"body":["مؤشر الممارس 3.3 يطلب أن **يتقصى القضايا المحلية ويوظفها في التدريس بصورة تعزز وظيفة المعرفة**. و«وظيفة المعرفة» أن يستعمل الطالب ما تعلمه ليفهم مشكلة في بيئته ويقترح لها حلاً، فتصير المعرفة أداة لا محفوظاً."],"pts":["**التقصي**: الأخبار المحلية، والإحصاءات الرسمية، وسؤال الأسر والطلاب، والمؤسسات القريبة.","**التوظيف** مربوط بهدف الدرس: بيانات حقيقية في الرياضيات، نص في اللغة، تجربة في العلوم، مشروع خدمة.","**الضوابط**: مناسبة للعمر، بلا تشهير بأشخاص أو جهات، متسقة مع القيم والأنظمة، ولا تتحول الحصة إلى موعظة.","مدونة 1447: **مراعاة القيم المجتمعية في تقديم المحتوى التعليمي والتوعوي الهادف، مع تجنب المعلومات المضللة** (المادة 10).","مؤشر المتقدم: **يحلل القضايا المحلية التي ينبغي تناولها في المنهج ويبين لزملائه كيفية عرضها**.","**أمثلة قضايا محلية**: ترشيد المياه والكهرباء، السلامة المرورية، النظافة والتشجير، التصحر، التغذية والسمنة، التنمر الإلكتروني، الحفاظ على التراث، الإسراف في المناسبات."],"ex":["في درس التمثيل البياني يجمع طلاب الأول المتوسط استهلاك أسرهم من الكهرباء لشهرين من الفواتير، ويمثلونه بيانياً، ويقترحون ثلاث عادات للترشيد. قضية محلية خدمت هدف الدرس."],"traps":["طرح القضية دون ربطها **بهدف الدرس** ليس توظيفاً.","ذكر اسم جهة أو شخص بعينه في سياق سلبي **تشهير** يخالف الضوابط."],"src":"المعايير المهنية للمعلمين، هيئة تقويم التعليم والتدريب (المجال الأول: القيم والمسؤوليات المهنية) (3.3)؛ مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ (المادة 10)"},"ar.l05.rel":{"k":"استيعاب المقروء","t":["Purpose & Relations","الغرض والعلاقات بين الجمل"],"body":["**الغرض من النص** يُعرف من نوع الجمل: أمر ورجاء = حث، وأدلة وحجج = إقناع. والعلاقة بين الجملتين تُعرف من أداة الربط."],"pts":["**طردية**: كلما زاد س زاد ص؛ و**عكسية**: زاد س نقص ص.","**سبب ونتيجة**: لأن، بسبب، فـ، لذلك؛ و**تمثيل**: مثل، كـ؛ و**تفصيل بعد إجمال**.","**عود الضمير**: على أقرب اسم يستقيم به المعنى، لا أقرب اسم في اللفظ.","**الاستفهام المنفي** (ألم تسافر؟): «بلى» للإثبات و«نعم» للنفي.","البديل الذي **يعارض** النص أو يضيف ما لم يُذكر فيه مرفوض.","**العنوان المناسب** يجمع فكرة النص كاملة؛ وعنوان شخصية أو حدث واحد في نص متعدد الأحداث مشتت."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 4.1: استيعاب المقروء"},"ar.l06.place":{"k":"الأعداد","t":["Place Value & Rounding","القيمة المنزلية والتقريب"],"pts":["**منازل العدد** من اليمين: آحاد، عشرات، مئات، آحاد الألوف، عشرات الألوف، مئات الألوف، آحاد الملايين؛ في 2571315 الرقم 5 الأيسر في **مئات الألوف**.","**القيمة المنزلية**: الرقم 9 في 59831 قيمته **9000**.","**التقريب**: **5 فأكثر** زد واحداً، و**أقل من 5** احذف: 24.372 ≈ 24، 156.984 ≈ 157، 1.8723 ≈ 1.9 لأقرب عُشر، 28.0153 ≈ 28.02 لأقرب جزء من مئة.","**الترتيب** التصاعدي من الأصغر: قارن العشرية منزلة منزلة (0.405 < 0.45 < 0.5 < 0.6).","**التقدير**: قرّب ثم احسب (0.4 جرام × 1000 دبوس ≈ 400 جرام)."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 4.4"},"ar.l06.div":{"k":"الأعداد","t":["Divisibility, Primes, GCD & LCM","قابلية القسمة والأولية والقاسم والمضاعف"],"pts":["**قابلية القسمة**: على 2 إذا كان الآحاد زوجياً، على 3 إذا قبل **مجموع الأرقام** القسمة على 3، على 5 إذا انتهى بـ0 أو 5، على 6 إذا قبل 2 و3، على 10 إذا انتهى بـ0.","**العدد الأولي**: 2، 3، 5، 7، 11، 13…؛ والعدد 1 **ليس أولياً**، و2 الأولي الزوجي الوحيد.","فردي + فردي = **زوجي**، وفردي + زوجي = فردي.","**القاسم المشترك الأكبر**: أكبر عدد يقسمهما (16 و28 → 4)؛ و**المضاعف المشترك الأصغر**: أصغر عدد يقبل القسمة عليهما (4 و6 → 12)."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 4.4"},"ar.l06.frac":{"k":"الأعداد","t":["Fractions, Decimals & Equations","الكسور والعشرية والمعادلة"],"pts":["**مقارنة الكسور**: 2/3 ≈ 0.67، 3/5 = 0.6، 7/10 = 0.7؛ وعند تساوي البسط ذو **المقام الأصغر** أكبر.","**الكسور الشائعة**: 1/2 = 50%، 1/4 = 25%، 3/4 = 75%، 1/5 = 20%، 1/8 = 12.5%، 1/3 ≈ 33.3%، 1/10 = 10%.","**ضرب العشري**: اضرب بلا فاصلة ثم ضعها بعدد المنازل في العددين (1.5 × 2.3 = 3.45)؛ و**القسمة** على عشري: انقل الفاصلة في الطرفين حتى يصير المقسوم عليه صحيحاً.","**المعادلة الخطية البسيطة**: 3س + 7 = 22 → 3س = 15 → س = 5."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 4.4"},"ar.l07.principles":{"k":"مبادئ النمو","t":["Principles of Development","خصائص النمو ومبادئه"],"body":["النمو **تغيّر تقدمي منظّم** يشمل الجوانب الجسمية والعقلية والانفعالية واللغوية والاجتماعية والأخلاقية، وهي **متكاملة**. وعلم نفس النمو يدرس **السلوك وتطوره** ويفيد في **ملاءمة التدريس للمرحلة**."],"pts":["**خصائص النمو**: **مستمر**، **متتابع**، **تراكمي**، **متغير السرعة**، **قابل للتنبؤ** لكن **بفروق فردية**.","**بمعدلات مختلفة**: سريع في الطفولة المبكرة والمراهقة، بطيء في الطفولة المتوسطة.","اتجاهه **رأسي–ذيلي** و**مركزي–طرفي** (الذراع قبل الأصابع)، و**من العام إلى الخاص** (القبض بالكف قبل الأصابع).","عوامله: **تفاعل الوراثة والبيئة**، و**النضج** والتعلم والغدد والتغذية والأسرة.","**التكويني** (البنائي) زيادة في الحجم والشكل، و**الوظيفي** تحسّن أداء الأعضاء والقدرات.","مسك القلم نمو **جسمي (حركي دقيق)**، وتكوين المفاهيم **عقلي**، والتحكم بالغضب **انفعالي**."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.1"},"ar.l07.stages":{"k":"المراحل الدراسية","t":["School-Age Characteristics","خصائص المراحل الدراسية"],"pts":["**الطفولة المتوسطة (6–9، الصفوف الأولية)**: نمو جسمي **بطيء منتظم**، مرحلة **الفضول والسؤال**، ولا يُطلب فيها الجلوس الطويل.","**الطفولة المتأخرة (9–12، الصفوف العليا)**: **سن الجماعة/العصابة**، تطبيع اجتماعي، زيادة المفردات، بطء جسمي قبل طفرة المراهقة.","**المراهقة المبكرة (12–15، المتوسطة)**: **طفرة نمو جسمي** وبلوغ، البحث عن القدوة، و**أحلام اليقظة**.","**المراهقة المتوسطة (15–18، الثانوية)**: الاستقلال عن الأسرة، الاهتمام بالمهنة، المثالية والمجادلة، الشعور بالذات ومقاومة السلطة.","البنات يسبقن الأولاد في البلوغ بنحو **سنة إلى سنتين**.","الطفل الذي **يرمي الأشياء ويجربها** يمارس **الاستكشاف**؛ و**التعليم يجب أن يناسب مرحلة النمو**."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.1"},"ar.l07.stress":{"k":"الأحداث الضاغطة","t":["Stressful Events & Growth Problems","الأحداث الضاغطة ومشكلات النمو"],"body":["مؤشر 5.1 للممارس: **يبين تأثير مشكلات النمو والأحداث اليومية الضاغطة على تعلم المتعلم وكيفية التعامل معها**."],"pts":["**أحداث ضاغطة**: طلاق الوالدين أو خلافهما، وفاة قريب، الانتقال، ولادة أخ، المرض، ضغط الاختبارات، التنمر؛ وأثرها: تشتت وتراجع وانسحاب أو عدوان وشكاوى جسمية وغياب.","**مشكلات نمو شائعة**: **القلق**، **العدوان**، **الغيرة**، **الكذب** (خيالي أو هروب من العقاب)، **الخجل والانطواء**، **مخاوف المدرسة**.","**العلامة التحذيرية**: **التغير المفاجئ** في السلوك أو التحصيل أو المظهر.","التعامل: **ملاحظة** ← **حوار فردي هادئ** بلا لوم ← **مرونة مؤقتة** ← **إحالة** للموجه الطلابي والأسرة ← متابعة؛ ويوفّر **روتيناً ثابتاً** ويحفظ **السرية**.","**الطالب المنتقل حديثاً**: تعريفه بالفصل، و**زميل مرافق**، وإشراك تدريجي.","**قلق الاختبار**: توضيح التقويم مبكراً، وتدريب على أسئلة مشابهة، وتنويع أدوات التقويم، وإدارة الوقت."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.1"},"ar.l07.emo":{"k":"الحماية","t":["Emotional Disorders, Abuse & Neglect","الاضطراب الانفعالي والإيذاء والإهمال"],"body":["مؤشر 5.1 للممارس: **يوضح مؤشرات الاضطرابات الانفعالية وحالات الاعتداء والإهمال**؛ والمعلم أقرب من يلاحظها يومياً."],"pts":["**مؤشرات اضطراب انفعالي**: حزن مستمر، انسحاب، نوبات غضب أو عدوان، خوف مفرط، شكاوى جسمية بلا سبب طبي، تغير حاد في النوم أو الأكل أو التحصيل.","**الإيذاء** (قواعد 1447): كل استغلال أو إساءة **الجسدية أو النفسية أو الجنسية** أو التهديد بها، ومنه التقصير في الحاجات الأساسية؛ و**الإهمال**: عدم توفير الحاجات الجسدية والصحية والعاطفية والتربوية أو التقصير فيها.","علامات محتملة: **جسدي** (كدمات أو حروق غير مفسرة، خوف من العودة إلى المنزل)، **نفسي** (خوف شديد، تدنٍّ حاد في تقدير الذات)، **إهمال** (جوع مستمر، رداءة النظافة، غياب، حاجات صحية مهملة).","تعد القواعد **انقطاع الطالب عن التعليم** نوعاً من الإيذاء أو الإهمال، وتستثني المتعرض للإيذاء من إجراءات تهدد سلامته.","**ليست دليلاً قاطعاً**: المعلم **يلاحظ ويوثق ويبلغ** ولا يعد الطالب بإخفاء الأمر.","إذا كان المصدر **أحد منسوبي المدرسة** تُرفع الحالة إلى **إدارة التعليم**، ولمن لاحظ **تراخياً من الإدارة** الإبلاغ مباشرة إلى 1919."],"src":"قواعد السلوك والمواظبة لطلبة التعليم العام، الإصدار الخامس 1447هـ، المادة 29"},"ar.l08.indiv":{"k":"الفروق الفردية","t":["Individual Differences","الفروق الفردية"],"body":["**انحراف الفرد عن متوسط الجماعة** في سمة ما؛ وهي **كمية** (في الدرجة لا في النوع) وتتوزع **توزيعاً اعتدالياً**."],"pts":["**فروق بين الأفراد** و**فروق داخل الفرد**.","أسبابها **الوراثة** و**البيئة** و**العمر** و**الجنس**: عوامل **طبيعية** وأخرى **مكتسبة**.","**أكبر مدى** في **الانفعالية والشخصية** ثم العقلية، و**أقل مدى** في **الجسمية**؛ و**العقلية أكثر ثباتاً**، والانفعالية **أكثر تغيراً**.","تظهر في **القدرات** و**التحصيل** و**الاستعداد** و**الاتجاهات** و**الميول**؛ والاستجابة على «موافق بشدة… غير موافق بشدة» تقيس **الاتجاهات**.","تراعيها: التعليم المتمايز، الموديولات والحقائب، التعليم المبرمج، التعاوني، الصف المقلوب؛ مع **تنويع** و**عدم** المقارنة العلنية.","**زمن الرجع**: الزمن بين ظهور المثير وبداية الاستجابة، من مظاهر الفروق التي تُقاس كمياً."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.2"},"ar.l08.styles":{"k":"أنماط التعلم","t":["Learning Styles & Models","أنماط التعلم ونماذجها"],"pts":["أنماط التعلم (VARK): **البصري** صور ورسوم وخرائط، **السمعي** شرح ومناقشة، **الحسي الحركي** تجربة وحركة، **القرائي الكتابي** نصوص وملاحظات.","تقسيم (بصري/سمعي/حسي) يعتمد على **أنماط التعلم**، لا على الذكاءات المتعددة.","**نموذج كولب**: خبرة محسوسة ← ملاحظة تأملية ← تصور مجرد ← تجريب نشط.","**مكارثي (4MAT)**: لماذا؟ ماذا؟ كيف؟ ماذا لو؟","**هيرمان** يصنف التفكير في أربعة أرباع: تحليلي، منظم، شعوري اجتماعي، تخيّلي.","التطبيق: **تنويع** العرض والأنشطة لا تصنيف الطلاب."],"ex":["تتأمل قضايا الحياة ونفسها = ذاتي؛ تحب الألغاز = **منطقي**؛ يقود زملاءه ويفهم مشاعرهم = **اجتماعي**؛ يصنف النباتات = **طبيعي**."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.2"},"ar.l08.ld2":{"k":"صعوبات التعلم","t":["Diagnosing & Teaching LD","تشخيص صعوبات التعلم وتدريسها"],"pts":["**محك التباين**: فجوة بين **القدرة (الذكاء)** والتحصيل؛ وسبب التدني **اضطراب في العمليات الذهنية**، ويُعدّ للطالب **خطة تربوية فردية**. و**الصعوبات الأولية** خلل في العمليات النفسية نفسها، و**الثانوية** تنتج عن عوامل خارجية كسوء التعليم.","من **مؤشراتها** استمرار المشكلات بعد **الصف الثاني الابتدائي** رغم سلامة الذكاء والحواس، فيُحال للتشخيص.","أدوات التشخيص: الملاحظة، المقابلة، دراسة الحالة، الاختبارات محكية المرجع، و**الاختبارات التحصيلية والتشخيصية** مقارنةً بالقدرة، ومقياس **مايكل بست**.","**استراتيجيات تدريس ذوي الصعوبات**: التدريس المباشر، **تعدد الحواس (VAKT)**، استراتيجية **التجميع**، واستراتيجية **الموقع**.","تفريق سريع: ضعيف في **كل المواد** مع ذكاء حدّي = بطء تعلم؛ في **مادة أو مادتين** مع ذكاء عادي = صعوبات؛ بسبب **إهمال وغياب** = تأخر دراسي (يُعالج بمعالجة السبب)."],"ex":["طالب ذكي في النقاش يقلب الحروف ويتعثر في القراءة: المعلم لا يصفه بالكسل، بل يوثق ملاحظاته ويحيله إلى معلم صعوبات التعلم."],"src":"الدليل التنظيمي للتربية الخاصة (وزارة التعليم)"},"ar.l08.sensory":{"k":"الفئات الخاصة","t":["Sensory & Physical Disabilities, ADHD","الإعاقات الحسية والجسمية وفرط الحركة"],"pts":["**الإعاقة السمعية**: لغة الإشارة وقراءة الشفاه، مواجهة الطالب، الجلوس في المقدمة، الوسائل البصرية.","**الإعاقة البصرية**: **برايل** والمواد المسموعة والمجسمات، والوصف اللفظي لما على السبورة.","**الإعاقة الجسمية**: قصور حركي أو حسي قد يصحبه قلق وعدم اتزان انفعالي؛ و**متلازمة داون** سببها كروموسومي.","**فرط الحركة وتشتت الانتباه (ADHD)**: بعيداً عن المشتتات، مهام قصيرة، فواصل حركية، تعليمات واضحة، تعزيز فوري.","**التوحد** يظهر قبل سن الثالثة؛ وبيئته **التعلم المنظم** (TEACCH).","مع أي فئة: **اعتراف بالإنجاز** ومهام في حدود القدرة وتعزيز فوري و**عدم** الإحراج أمام الأقران؛ ولا يُبلَّغ ولي الأمر بتشخيص غير مؤكد."],"src":"الدليل التنظيمي للتربية الخاصة (وزارة التعليم)"},"ar.l08.giftchar":{"k":"الموهوبون","t":["Gifted Traits & Provision","خصائص الموهوب ورعايته"],"pts":["خصائصه: نمو لغوي مبكر، فضول غير عادي، ذاكرة قوية، طلاقة لفظية، **حس الدعابة**، **قيادية**، نضج أخلاقي مبكر، **حساسية مفرطة** و**الكمالية**.","قد يشعر بالملل والاضطراب إذا لم يُتحدَّ.","**التعجيل (التسريع)**: القبول **المبكر**، **تخطي الصفوف**، **ضغط المنهج**، مقررات متقدمة.","**التجميع**: فصول أو مجموعات خاصة؛ ويُفضّل في المملكة الإثراء داخل المدرسة مع برامج موهبة.","الخطأ: مزيد من **التمارين نفسها** أو جعله مساعداً للمعلم دائماً؛ والصحيح مهام أعمق.","الكشف بـ**محكات متعددة**: ذكاء وقدرات، تحصيل، إبداع، **ترشيح المعلم**، ملاحظة الأداء."],"ex":["طالبة أنهت تمارين الكسور في دقائق: لا تُعطى عشرين مثلها، بل مشكلة مفتوحة (تحويل وصفة من 4 أشخاص إلى 30)."],"src":"القواعد التنظيمية لفصول ومدارس الموهوبين 1447هـ؛ المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.4"},"ar.l08.bg":{"k":"الخلفيات","t":["Social, Economic & Cultural Backgrounds","الخلفيات الاجتماعية والاقتصادية والثقافية"],"body":["مؤشر 5.2 للممارس: **يميز الاختلافات بين المتعلمين التي تعزى للخلفيات الاجتماعية والاقتصادية والثقافية واحتياجاتها التعليمية التي ينبغي تلبيتها**."],"pts":["**الخلفية الاقتصادية المحدودة**: نقص الأدوات والإنترنت؛ فمصادر المدرسة، و**عدم اشتراط مواد مكلفة**، ووقت للإنجاز في المدرسة.","**الخلفية الاجتماعية** (تعليم الوالدين، حجم الأسرة واستقرارها) تؤثر في الدعم المنزلي والخبرات السابقة.","**الخلفية الثقافية واللغوية** (طالب وافد، لغة أم غير العربية): أمثلة متنوعة وشرح للمفردات واحترام للعادات.","**التدريس المستجيب ثقافياً**: **توقعات عالية للجميع** وتجنب **القوالب النمطية**.","الإطار الوطني لمعايير المناهج: **تكافؤ فرص التعلم** يراعي الفروق و**الخلفيات الثقافية والاجتماعية** لكل الفئات؛ و**العدالة** **تقديم ما يحتاجه كل طالب**.","التعرف على الخلفيات بالحوار وبطاقة الطالب والأسرة والموجه، مع حفظ **خصوصية** الظروف."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.2"},"ar.l08.iepteam":{"k":"التربية الخاصة","t":["IEP Team, Family & Placement","فريق الخطة ودور الأسرة والمكان التربوي"],"body":["مؤشر 5.4 للممارس: **يبين الإجراءات التي ينبغي التقيد بها في التعامل مع الفئات الخاصة، ويعرف الجهات التي يجب إشراكها في متابعة حالاتها**. والخطة في لائحة تقويم الطالب: وصف للخدمات التربوية والمساندة يعدها **فريق متعدد التخصصات**."],"pts":["المسار ينتهي بتحديد **الأهلية والمكان التربوي** ثم الخطة؛ والتشخيص **لا يُكتفى بنتيجة مقياس واحد**. و**لجنة الخطط التعليمية**: قائد المدرسة (رئيساً)، وكيل الشؤون التعليمية، **معلم التربية الخاصة**، **معلم التعليم العام**، المرشد أو الأخصائي الاجتماعي، **المختصون**، **ولي الأمر**، و**الطالب** قدر الإمكان.","عناصر الخطة: **مستوى الأداء الحالي** ← **أهداف طويلة المدى** ← **أهداف قصيرة المدى** ← **أهداف تدريسية** ← **الخدمات** ← **مواعيد** ← **التقويم** ← **المشاركون**؛ وهي **وثيقة متجددة** تُراجع **سنوياً أو نصف سنوي**.","**دور الأسرة**: الموافقة والمشاركة والتنفيذ في المنزل؛ و**على المدرسة** الشرح بلغة مفهومة والإشعار خطياً قبل أي تحويل.","**دور معلم التعليم العام بعد الإحالة**: تكييف التدريس والمشاركة في الخطة والتقويم **بالتعاون مع معلم التربية الخاصة**.","**الخدمات المساندة**: **العلاج الطبيعي والوظيفي وتصحيح عيوب النطق والكلام والإرشاد النفسي**.","**المكان التربوي**: فصل عام مع معلم مستشار ← معلم متجول ← **غرفة المصادر** ← فصل خاص ← معهد."],"src":"الدليل التنظيمي للتربية الخاصة (وزارة التعليم)؛ لائحة تقويم الطالب وإجراءاتها"},"ar.l09.thorndike":{"k":"السلوكية","t":["Thorndike, Watson & Guthrie","ثورندايك وواطسون وجاثري"],"body":["**ثورندايك – المحاولة والخطأ** (القط في الصندوق): التعلم اختيار الاستجابة الناجحة وتثبيتها بعد محاولات عشوائية. وهو صاحب نظرية **العناصر المتطابقة** في انتقال الأثر."],"pts":["قوانينه: **الأثر** (المتبوعة بارتياح تقوى)، **التدريب/التكرار** (الاستعمال يقوي)، **الاستعداد** (التهيؤ).","**واطسون** مؤسس المدرسة السلوكية (الطفل ألبرت): الانفعالات تُتعلم بالإشراط، والبيئة تصنع الفرد.","**جاثري** نظرية **الاقتران**: اقتران واحد كافٍ للتعلم.","**قانون المرة الواحدة**: ارتباط من خبرة واحدة شديدة (الخوف من النار بعد لسعة).","الاشتراط الإجرائي يُسمى **الاشتراط الوسيلي**؛ لأن الاستجابة وسيلة للمعزز.","عند بافلوف أيضاً **الإشراط من الدرجة الثانية**."],"traps":["المحاولة والخطأ تدريجي، والاستبصار مفاجئ."],"src":"Thorndike, Animal Intelligence؛ Watson (1913)؛ Guthrie (1935)"},"ar.l09.terms":{"k":"مفاهيم","t":["Learning, Instruction, Teaching, Education","التعلم والتعليم والتدريس والتربية"],"pts":["**التعلم** نشاط ذاتي يكتسب به المتعلم السلوك من الخبرة والممارسة؛ تغير شبه دائم.","**التعليم** تصميم منظم للخبرة يساعد المتعلم على تغيير سلوكه.","**التدريس** إجراء قصير المدى يقوم به المعلم لأهداف محددة.","**التربية** عملية شاملة تستهدف نمو الفرد وإعداده للحياة."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.3"},"ar.l09.reinf":{"k":"السلوكية","t":["Reinforcers & Applications","المعززات وتطبيقات سكنر"],"pts":["**أنواع المعززات**: **مادية** (هدية)، **اجتماعية** (ابتسامة، مدح)، **رمزية** (نجوم تُستبدل = **الاقتصاد الرمزي**)، **نشاطية** (وقت لعب).","**التسلسل**: ربط خطوات سلوك مركب؛ و**التلاشي**: سحب المساعدات تدريجياً.","**التعليم المبرمج**: خطوات صغيرة + استجابة نشطة + تغذية راجعة فورية + سير ذاتي؛ الخطي لسكنر والمتشعب لكراودر.","تطبيقات أخرى: **تعديل السلوك**، و**العقود السلوكية**، والتعلم للإتقان.","التعزيز **فوري** و**متنوع** و**متناسب**، للسلوك لا للشخص، ويتحول من مادي إلى اجتماعي إلى ذاتي.","**العقاب السالب**: الحرمان من الفسحة = **تكلفة الاستجابة**، و**الإقصاء** إبعاد عن مصدر التعزيز."],"ex":["طالب خجول: مدح حين يرفع يده، ثم حين يجيب بكلمة، ثم بجملة؛ تشكيل بالتقريبات، ثم تعزيز متقطع حتى لا ينطفئ."],"src":"Skinner, The Technology of Teaching"},"ar.l09.moraldis":{"k":"التعلم الاجتماعي","t":["Bandura — Moral Disengagement","الانفصال الأخلاقي والنمذجة في الصف"],"pts":["آليات **الانفصال الأخلاقي**: **التبرير الأخلاقي**، **التهذيب اللفظي** (الاعتداء «مزاح»)، **المقارنة المريحة**، **إزاحة المسؤولية**، **تشويه العواقب**، **لوم الضحية**.","النظرية **حلقة وصل** بين السلوكية والمعرفية، وتقوم على **الحتمية التبادلية**.","**التعزيز الذاتي** يأتي من رضا الفرد عن نفسه، و**العقاب البديل** يقلل السلوك عند الملاحظ.","تطبيقات: المعلم **قدوة** (يؤدي الوضوء أمام الطلاب)، فيديو ثم تطبيق، نماذج حية ورمزية.","النمذجة الأنسب لتعلم **الاتجاهات والقيم والمهارات الاجتماعية**.","مصادر الكفاءة الذاتية: **خبرات الإتقان**، **الخبرات البديلة**، **الإقناع اللفظي**، **الحالة الفسيولوجية**."],"src":"Bandura, Moral Disengagement (2016)؛ Social Foundations of Thought and Action"},"ar.l09.tolman":{"k":"المعرفية","t":["Tolman & the Cognitive View","تولمان والمدخل المعرفي"],"body":["النظريات المعرفية تهتم بـ**العمليات العقلية الداخلية** (الإدراك، الفهم، التنظيم، المعنى)، والمتعلم **نشط** يعالج المعلومات."],"pts":["**تولمان** (الفئران في المتاهة): **التعلم الكامن** يحدث دون تعزيز ويظهر عند الحاجة، ويكوّن المتعلم **خرائط معرفية**؛ والتعلم **هادف**.","**فرتهايمر** مؤسس الجشطلت، و**كوهلر** صاحب القرد والعصا، و**كوفكا** ثالثهم.","**أوزوبل – التعلم ذو المعنى بالاستقبال**: **الاندماج/الاحتواء** في البنية المعرفية؛ وأنماطه من (**استقبال/اكتشاف**) × (**ذو معنى/صمّ-استظهار**)، ولا يوجد «استقبال قائم على الاكتشاف».","**التمايز التقدمي**: الأفكار الشاملة أولاً؛ و**التوفيق التكاملي**: ربط الجديد بالسابق؛ وخرائط المفاهيم (نوفاك) من تطبيقاته.","تطبيق: **فيلم تمهيدي** عن تجاذب الأجسام قبل درس الشحنات = **منظم متقدم**.","**برونر – التعلم بالاكتشاف**: **بنية المادة**، والاستعداد، والدافعية الداخلية، و**الاكتشاف الموجه** الأنسب صفياً؛ و**العملي/الحركي** ← **الأيقوني/التصويري** ← **الرمزي**."],"src":"Tolman, Purposive Behavior in Animals and Men؛ Ausubel؛ Bruner"},"ar.l09.memtypes":{"k":"معالجة المعلومات","t":["Memory Types & Forgetting","أنواع الذاكرة والنسيان"],"pts":["**الذاكرة الحسية** (ثوانٍ، سعة كبيرة) ← **قصيرة المدى/العاملة** (**7±2**، 15–30 ثانية) ← **طويلة المدى** (سعة غير محدودة)؛ وما لا يُنتبه له يُفقد.","الطويلة: **تقريرية** (دلالية: معانٍ؛ عرضية: أحداث شخصية) و**إجرائية** (مهارات كالسباحة).","**نظريات النسيان**: **الاضمحلال**، **التداخل** (**قبلي** و**بعدي**)، **الكبت**، فشل الاسترجاع.","**الترميز المزدوج** (بايفيو/**بافيو**): التخزين **لفظياً وبصرياً** معاً؛ و**الحمل المعرفي** (سويلر).","النموذج (نورمان وأتكنسون وشفرن) يشبّه العقل بالحاسوب: مدخلات ← معالجة ← مخرجات؛ وعدم الاسترجاع نسيان.","**التدريب الموزع** (جلسات متباعدة) أفضل من **التدريب المكثف**؛ والنقل للطويلة: **التسميع (الإعادة)**، **التجميع/التقطيع**، **التفصيل/الإتقان**، التنظيم، الوسائل التذكرية."],"src":"Atkinson & Shiffrin (1968)؛ Tulving (1972)؛ Paivio"},"ar.l09.transfer":{"k":"البنائية","t":["Transfer of Learning","انتقال أثر التعلم"],"body":["استخدام خبرة سابقة في موقف جديد. ويحققه التدريس للفهم لا للحفظ، وتنويع الأمثلة والسياقات، وربط التعلم بالحياة."],"pts":["**موجب** (القراءة تسهّل أي جملة)، **سالب** (عادة قديمة تعيق الجديد)، **صفري**.","**أفقي** (المستوى نفسه في سياق آخر) و**رأسي** (مهمة أعلى تبنى على السابقة)؛ و**قريب/بعيد**.","تفسيره: **العناصر المتطابقة** (ثورندايك) و**التعميم** (جد).","البنائية: المعلم **ميسّر**، والخطأ فرصة، والتقويم بديل (مشاريع، حل مشكلات)."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.3"},"ar.l09.brain":{"k":"الدماغ","t":["Brain-Based Learning","التعلم المستند إلى الدماغ"],"body":["مؤشرا 5.3 للممارس: **يعرف نظريات التعلم ونتائج الأبحاث العلمية المعاصرة في عمليات التعلم وكيفية توظيفها**، و**يعرف أساليب التعلم الفردي ويبين مدى اعتمادها على العوامل المعرفية والانفعالية والبيئية**."],"pts":["مبادئ (كين وكين): الدماغ **اجتماعي**، و**البحث عن المعنى** فطري بتكوين **الأنماط**، و**الانفعالات** أساسية، و**يتعزز بالتحدي ويُكبح بالتهديد**، وكل دماغ **فريد**، ويعالج **الأجزاء والكل معاً**.","**الاسترخاء اليقظ**: أمان نفسي مع تحدٍّ مرتفع؛ **الانغماس المنظم** في خبرات حقيقية؛ **المعالجة النشطة** بالتأمل والتلخيص والتطبيق.","في الصف: تقليل التهديد، ربط بخبرة الطالب، تنويع الحواس، فواصل وحركة، تعاون، تغذية راجعة فورية."],"src":"Caine & Caine, Making Connections؛ المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.3"},"ar.l09.styles":{"k":"الأساليب المعرفية","t":["Cognitive Styles","الأساليب المعرفية"],"body":["**الأسلوب المعرفي** طريقة مفضلة **ثابتة نسبياً** في الإدراك والتفكير وتنظيم المعلومات؛ يصف **كيف** يتعلم الفرد لا **مقدار** ذكائه."],"pts":["**الاعتماد على المجال مقابل الاستقلال عنه** (ويتكن): **المعتمد** يدرك الكل ويتأثر بالسياق ويفضل العمل الجماعي، و**المستقل** يحلل ويفضل الفردي؛ ويُقاس بـ**الأشكال المتضمنة**.","**الاندفاع مقابل التروي** (كاجان): **المندفع** سريع كثير الخطأ، و**المتروي** يفحص البدائل؛ ويُعالج الاندفاع بـ**التوقف والتفكير** وتمديد وقت الانتظار.","**نموذج دن ودن**: عناصر **بيئية** (الصوت، الإضاءة، الحرارة) و**انفعالية** (الدافعية، المثابرة) و**اجتماعية** و**جسمية** و**نفسية**.","لا أسلوب أفضل مطلقاً: المعلم **ينوع**، ويساعد الطالب على **الوعي بأسلوبه**."],"src":"Witkin (1977)؛ Kagan (1965)؛ Dunn & Dunn"},"ar.l10.motiv":{"k":"الدافعية","t":["Motivation — Basics & Classroom","الدافعية: خصائصها وإجراءاتها"],"body":["الدافعية **حالة داخلية** تحرّك السلوك؛ **الدافع** داخلي و**الحافز** خارجي و**الباعث** هدف يجذب. والإفراط في المكافآت الخارجية **يُضعف** الداخلية (أثر التبرير الزائد)."],"pts":["**خصائص الدافعية**: الغرضية، النشاط، الاستمرار، التنوع، التحسين والتكيف؛ و**وظائفها**: توليد السلوك وتوجيهه وتحديد شدته وديمومته.","**أنواع الدوافع**: **بيولوجية** (جوع، عطش) و**اجتماعية** مكتسبة (الأمن، الانتماء، الإنجاز)؛ و**موراي** و**أتكنسون** من رواد دافعية الإنجاز.","**نظرية التوقع والقيمة**: الدافعية = توقع النجاح × قيمة المهمة.","إجراءات صفية: تغذية راجعة **فورية وصفية**، توقعات عالية، تنويع، **عدم المقارنة**، إشراك الطالب في مجموعة متميزة، مهام في حدود القدرة مع تحدٍّ.","**دويك**: **توجه الإتقان** أفضل من **توجه الأداء**، و**العقلية النامية** مقابل **الثابتة**؛ و**ماكليلاند/أتكنسون – دافع الإنجاز**: مهام **متوسطة الصعوبة**."],"ex":["طالب رسب ويقول «أنا غبي في الرياضيات»: ينقل المعلم العزو إلى الجهد والاستراتيجية: «أخطأت في خطوتين لم نتدرب عليهما».","هرم
