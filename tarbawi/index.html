  --accent:#5BC093; --accent-ink:#062116; --accent-soft:#17312A; --accent-text:#5BC093;
  --hl:#5A4A1C; --hl-ink:#FFF0C2;
  --good:#5CC48D; --good-soft:#15301F; --bad:#F2867A; --bad-soft:#3A1A17; --warn:#E3A84A;
  --dV:#E0A54C; --dK:#5BC093; --dP:#7FA6E8;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F1512; --sheet:#171F1B; --ink:#E6ECE8; --muted:#B3C0BA; --rule:#27332D; --rule-strong:#36453E;
  --accent:#5BC093; --accent-ink:#062116; --accent-soft:#17312A; --accent-text:#5BC093;
  --hl:#5A4A1C; --hl-ink:#FFF0C2;
  --good:#5CC48D; --good-soft:#15301F; --bad:#F2867A; --bad-soft:#3A1A17; --warn:#E3A84A;
  --dV:#E0A54C; --dK:#5BC093; --dP:#7FA6E8;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
#app{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
strong{font-weight:600;background:linear-gradient(transparent 60%,var(--hl) 60%);padding:0 .08em}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.5;text-wrap:balance;margin:0}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);margin-inline:-16px;padding:10px 16px}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .seal{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.95rem;flex:none}
.brand b{font-family:var(--f-display);font-weight:600;font-size:1rem;white-space:nowrap}
.brand span{display:block;font-size:.74rem;color:var(--muted);line-height:1.3;white-space:nowrap}
.count{margin-inline-start:auto;text-align:center;line-height:1.1}
.count .n{font-family:var(--f-mono);font-size:1.25rem;font-weight:700;color:var(--accent-text,var(--accent))}
.count .l{font-size:.78rem;color:var(--muted)}
.nav{display:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:4px 0;border-radius:8px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
@media (min-width:760px){
  .tabbar{display:none}
  .nav{display:flex;gap:4px;margin-inline-start:18px}
  .nav button{background:none;border:0;padding:6px 12px;border-radius:999px;color:var(--muted);font-size:.92rem}
  .nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #app{padding-bottom:60px}
}

/* sheets & cards */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.section-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.section-title h2{font-size:1.08rem}
.section-title .line{flex:1;height:1px;background:var(--rule-strong)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 20px;font-weight:600;font-size:.95rem;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--rule-strong);color:var(--ink);font-weight:500}
.btn.sm{padding:6px 14px;min-height:36px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.76rem;border:1px solid var(--rule-strong);color:var(--muted);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.done{border-color:var(--good);color:var(--good)}
.chip.hot{border-color:var(--warn);color:var(--warn)}
.code{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);direction:ltr;unicode-bidi:isolate}

/* home */
.today{display:grid;gap:14px}
.today .kicker{font-size:.8rem;color:var(--muted)}
.today h1{font-size:1.4rem}
.domains{display:grid;gap:10px}
.dom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.dom .name{display:flex;gap:8px;align-items:center;min-width:0}
.dom .name b{font-weight:600;font-size:.95rem}
.dom .w{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:10px;border-radius:999px;background:var(--rule);overflow:hidden;position:relative}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--f-mono);font-size:1.45rem;font-weight:600;line-height:1.2}
.stat .k{font-size:.8rem;color:var(--muted)}
.set-date{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.set-date input{border:1px solid var(--rule-strong);background:var(--paper);border-radius:8px;padding:8px 10px;min-height:44px}
.stdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stdc{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;display:grid;gap:4px;text-align:start}
.stdc .sn{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between}
.stdc .st{font-weight:600;font-size:.86rem;line-height:1.5}
.stdc .bar{height:6px}

.tfold{margin:10px 0 2px}.tfold>summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center;font-size:.86rem;font-weight:700;color:var(--accent);border:1px solid var(--rule);border-radius:999px;padding:4px 12px}.tfold>summary::-webkit-details-marker{display:none}.tfold>summary::after{content:"＋";font-weight:400}.tfold[open]>summary::after{content:"－"}.tfold[open] .terms{margin-top:10px}
/* plan */
.plan{display:grid;gap:8px}
.day{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.day .dn{font-family:var(--f-mono);text-align:center;line-height:1.1}
.day .dn b{display:block;font-size:1.15rem}
.day .dn span{font-size:.68rem;color:var(--muted)}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day .what{min-width:0}
.day .what .t{font-weight:600}
.day .what .s{font-size:.82rem;color:var(--muted)}
.day.light{opacity:.85}
.bub{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;flex:none}
.bub.on{background:var(--good);border-color:var(--good)}
.bub.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sheet)}

/* lessons list */
.lgroup{display:grid;gap:8px}
.lcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;text-align:start;width:100%}
.lcard .idx{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);width:34px;text-align:center}
.lcard .t{font-weight:600;line-height:1.5}
.lcard .s{font-size:.82rem;color:var(--muted)}
.dhead{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.dhead .sw{width:12px;height:12px;border-radius:3px}
.dhead h2{font-size:1.05rem}
.dhead .w{margin-inline-start:auto;font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}

/* lesson view */
.lesson-head{display:grid;gap:8px;padding-top:18px}
.goal{border-inline-start:3px solid var(--accent);padding-inline-start:12px}
.lsec{display:grid;gap:10px;padding:18px 0;border-bottom:1px solid var(--rule)}
.lsec:last-of-type{border-bottom:0}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pts li{border-inline-start:3px solid var(--rule-strong);padding-inline-start:10px;line-height:1.8}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.term{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;min-width:0}
.term .tn{font-weight:600;font-size:.95rem}
.term .td{font-size:.86rem;color:var(--muted);line-height:1.7}
.traps{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:var(--r);padding:14px 16px}
.traps h3{color:var(--bad);margin-bottom:6px}
.traps ul{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.vids{display:grid;gap:8px}
.vid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-decoration:none;color:inherit}
.vid .play{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.vid .vt{font-weight:500;line-height:1.5}
.vid .vc{font-size:.8rem;color:var(--muted)}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;padding:12px 0}
.progress{flex:1;height:6px;background:var(--rule);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;min-width:64px;text-align:center;direction:ltr}
.timer.low{color:var(--bad)}
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qtext{font-size:1.06rem;line-height:1.9;font-weight:500;white-space:pre-line}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:start;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:.98rem;line-height:1.6;min-height:48px;width:100%}
.opt .b{width:28px;height:28px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;font-family:var(--f-display);font-size:.85rem;font-weight:600;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .b{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .b{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt:disabled{cursor:default}
.explain{margin-top:14px;border-radius:10px;padding:12px 14px;border:1px solid var(--rule)}
.explain.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.explain.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.explain b{display:block;margin-bottom:2px}
.qreply{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);border-inline-start:3px solid var(--accent);font-size:.92em;line-height:1.7}
.qreply b{display:block;margin-bottom:2px}.qreply b span{font-weight:400;color:var(--muted)}
.qnav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.grid88{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.gq{height:34px;border-radius:50%;border:1.5px solid var(--rule-strong);background:var(--sheet);font-family:var(--f-mono);font-size:.72rem;color:var(--muted);padding:0}
.gq.ans{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.gq.cur{outline:2px solid var(--accent);outline-offset:2px}
.gq.flag{border-color:var(--warn);border-width:3px}
.confirm{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px}

/* results */
.score{display:flex;align-items:baseline;gap:10px}
.score .big{font-family:var(--f-mono);font-size:3rem;font-weight:600;line-height:1}
.rlist{display:grid;gap:10px}
.ritem{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.ritem .qtext{font-size:.95rem}
.ans-line{font-size:.9rem}
.ans-line .y{color:var(--bad);text-decoration:line-through}
.ans-line .c{color:var(--good);font-weight:600}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.mode{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px;text-align:start;display:grid;gap:6px;align-content:start;width:100%}
.mode .mt{font-family:var(--f-display);font-weight:600;font-size:1rem}
.mode .md{font-size:.85rem;color:var(--muted);line-height:1.7}
.mode .mx{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:.85rem;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* flashcards */
.fc{perspective:1200px}
.fc-in{position:relative;min-height:220px;border-radius:14px;border:1px solid var(--rule);background:var(--sheet);box-shadow:var(--shadow);display:grid;place-items:center;padding:24px;text-align:center;cursor:pointer;width:100%}
.fc-front{font-family:var(--f-display);font-size:1.45rem;font-weight:600;line-height:1.5}
.fc-back{font-size:1.08rem;line-height:1.9}
.fc-hint{position:absolute;bottom:10px;inset-inline:0;font-size:.75rem;color:var(--muted)}

/* sheet (night-before) */
.hy{display:grid;gap:14px}
.hy-l{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 16px}
.hy-l h3{font-size:.98rem;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.hy-l ul{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:.93rem}
.tips{display:grid;gap:8px;counter-reset:t}
.tip{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.tip::before{counter-increment:t;content:counter(t);font-family:var(--f-mono);font-weight:600;width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:.8rem}

.sync{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--rule-strong)}
.sync.on i{background:var(--good)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:50;box-shadow:var(--shadow)}
textarea.report{width:100%;min-height:180px;border:1px solid var(--rule-strong);border-radius:8px;padding:10px;background:var(--paper);font-family:var(--f-mono);font-size:.8rem}
@media (prefers-reduced-motion:no-preference){
  .opt,.btn,.day,.lcard,.mode{transition:border-color .15s,background-color .15s,transform .15s}
  .lcard:active,.day:active,.mode:active{transform:scale(.99)}
}

/* credit card */
.credit{display:flex;align-items:center;gap:14px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 16px}
.credit .cm{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.credit .cm svg{width:22px;height:22px}
.credit .ck{font-size:.78rem;color:var(--muted)}
.credit .cn{font-family:var(--f-display);font-weight:600;font-size:1.06rem;line-height:1.5}
.credit .vcount{margin-inline-start:auto;display:flex;flex-direction:column;align-items:center;line-height:1.35;padding-inline-start:14px;border-inline-start:1px solid var(--rule)}
.credit .vcount[hidden]{display:none}
.credit .vcount-n{font-weight:700;font-size:1.06rem;font-variant-numeric:tabular-nums}

/* theme toggle, simpler home */
.themebtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);display:grid;place-items:center;flex:none;padding:0}
.themebtn svg{width:18px;height:18px}
.or{font-size:.88rem;color:var(--muted)}
.path{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.path b{color:var(--accent);font-weight:600}
details.prog{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:0 16px}
details.prog>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;font-family:var(--f-display);font-weight:600;font-size:1.02rem}
details.prog>summary::-webkit-details-marker{display:none}
details.prog>summary .hint{font-family:var(--f-ar);font-weight:400;font-size:.8rem;color:var(--muted);margin-inline-start:auto}
details.prog>summary svg{width:18px;height:18px;flex:none;transition:transform .2s}
details.prog[open]>summary svg{transform:rotate(180deg)}
details.prog .pin{display:grid;gap:14px;padding-bottom:16px}

@media (max-width:430px){.brand span{display:none}}
.count .btn{white-space:nowrap}

/* readability: larger base, heavier weight, stronger secondary text */
html{font-size:112.5%}
@media (max-width:430px){html{font-size:106.25%}}
body{font-size:1rem;font-weight:500}
.small{font-size:.92rem}
.muted{color:var(--muted)}

/* الأسئلة (2026-10-20): بطاقتان كبيرتان + صفوف صغيرة + قائمة البنك */
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;position:relative;display:grid;gap:6px;box-shadow:var(--shadow)}
.tile .tag{position:absolute;top:14px;left:14px;font-size:.74rem;font-weight:700;color:var(--accent-text,var(--accent));background:var(--accent-soft);border-radius:999px;padding:2px 9px}
.tile .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}.tile .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile h2{font-size:1.15rem}.tile>p{color:var(--muted);font-size:.9rem;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}.meta b{color:var(--ink)}
.btn.wide{width:100%;margin-top:4px}.btn.q{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-text,var(--accent))}
.rows{display:grid;gap:6px;margin-top:8px}

<script>

/* طبقة الإثراء المشتركة لموقعَي التربوي والإنجليزي:

(function () {
  "use strict";

  function pol(cx, cy, r, a) { return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }

      out += '<g class="qx-seg" style="--i:' + i + '">';

      out += '<text x="' + t[0] + '" y="' + (t[1] - 6) + '" text-anchor="middle" fill="#fff" font-size="' + fs + '" font-weight="800" class="qx-lat">' + esc(nm) + "</text>";
      if (g.ar) out += '<text x="' + t[0] + '" y="' + (t[1] + 18) + '" text-anchor="middle" fill="#fff" font-size="' + (compact ? 14 : 15) + '" font-weight="600">' + esc(g.ar) + "</text>";
      if (g.d) out += "</g>";
      out += "</g>";
      // تباعد العناصر حسب عرض القطاع حتى لا تتداخل دوائر المجموعات المتجاورة

        if (it.d) out += '<g class="qx-go" data-deep="' + it.d + '" role="button" tabindex="0" aria-label="' + esc(it.n) + '">';

        out += '<text x="' + p[0] + '" y="' + ty + '" text-anchor="middle" fill="' + col + '" font-size="' + fit(it.n, nr * 1.72, nr < 40 ? 12.5 : 15, 0.6) + '" font-weight="700" class="qx-lat">' + esc(it.n) + "</text>";
        if (it.who) out += '<text x="' + p[0] + '" y="' + (ty + 14) + '" text-anchor="middle" fill="' + col + '" font-size="' + fit(it.who, nr * 1.62, nr < 40 ? 9 : 10.5, 0.6) + '" font-weight="800" class="qx-whot">' + esc(it.who) + "</text>";

    var cw = (r0 - 16) * 2, ct = String(tt[1] || tt[0]), cl = ct.length > 16 ? words(ct, 2) : [ct], cf = Math.min.apply(null, cl.map(function (x) { return +fit(x, cw, compact ? 18 : 22, 0.52); }));
    cl.forEach(function (x, k) { out += '<text x="' + cx + '" y="' + (cy - 6 - (cl.length - 1 - k) * (cf + 4)) + '" text-anchor="middle" class="qx-ink" font-size="' + cf + '" font-weight="800">' + esc(x) + "</text>"; });
    if (tt[1]) out += '<text x="' + cx + '" y="' + (cy + 20) + '" text-anchor="middle" class="qx-gold qx-lat" font-size="' + fit(tt[0], cw, compact ? 13 : 16, 0.55) + '" font-weight="700">' + esc(tt[0]) + "</text>";
    return out + "</svg>";
  }
  function cards(m) {
    return '<div class="qx-cols">' + m.groups.map(function (g, i) {
      var col = g.c || PAL[i % PAL.length];

        (g.items || []).map(function (it) {
          var init = (it.n || "?").replace(/[^A-Za-z؀-ۿ]/g, "").slice(0, 2);

  // توزيع الفروع على صفوف متوازنة يربطها جذع واحد

      rows(m.groups.map(function (g, i) {
        var col = g.c || PAL[i % PAL.length];
        return '<div class="qx-br" style="--c:' + col + ";--i:" + i + '"><div class="qx-bh' + (g.d ? ' qx-go" data-deep="' + g.d + '" role="button" tabindex="0' : "") + '"><span' + (/[A-Za-z]/.test(g.n || "") ? ' class="qx-lat" dir="ltr"' : "") + ">" + esc(g.n || "") + "</span>" + (g.ar ? "<small>" + esc(g.ar) + "</small>" : "") + "</div>" + (g.idea ? '<div class="qx-bidea">' + rich(g.idea) + "</div>" : "") + "<ul>" +
          (g.items || []).map(function (it) {

          '<div class="qx-fkh"><b>' + esc(g.n || "") + "</b>" + (g.d ? '<span class="qx-fplus">＋</span>' : "") + "</div>" +

        (g.items || []).map(function (it) { var t = esc(it.n) + (it.who ? ' <em>· ' + esc(it.who) + "</em>" : ""); return it.d ? '<button type="button" class="qx-dl" data-deep="' + it.d + '">' + t + "</button>" : "<i>" + t + "</i>"; }).join("") + "</span></div>";

  // كل خريطة بشكل واحد فقط: عجلة، أو خطوط، أو شجرة، أو بطاقات (طلب يوسف: لا تتكرر الخريطة بشكلين)

  // ---------- أجزاء القسم ----------

  // مقارنة قبل/بعد: {title, cols:[a,b], rows:[{k, a, b, tag}]}

window.LESSONS = [{"id":"L07","d":"K","std":"5","sub":"5.1","ar":"خصائص النمو ومراحله وأثرها في التعلم","goal":"تميّز مراحل النمو عند بياجيه وإريكسون وكولبرج وفرويد وهافجهرست، وتربط خصائص كل مرحلة دراسية بالإجراء التدريسي الذي يقيسه الاختبار.","sec":[{"h":"مبادئ النمو وعوامله","pts":["النمو **تغيّر تقدمي منظّم** في جوانب متكاملة: جسمية وعقلية وانفعالية ولغوية واجتماعية وأخلاقية.","**[[خصائصه|ar.l07.principles]]**: مستمر ومتتابع وتراكمي وقابل للتنبؤ، مع فروق فردية في سرعته.","**معدلاته مختلفة**: سريع في الطفولة المبكرة والمراهقة، بطيء في الطفولة المتوسطة.","**اتجاهه** رأسي–ذيلي ومركزي–طرفي (الذراع قبل الأصابع)، ومن العام إلى الخاص.","محصلة **تفاعل الوراثة والبيئة**؛ و**[[النضج|ar.l07.maturation]] شرط للتعلم** لا العكس، والتعليم قبل الاستعداد يضيع الجهد.","**[[مطالب النمو|ar.l07.havighurst]]** (هافجهرست): مهام كل مرحلة، وإنجازها يمهد لما بعدها.","**التكويني** زيادة في الحجم والشكل، و**الوظيفي** تحسّن أداء الأعضاء والقدرات."],"t":[["النضج","تغيّر داخلي بيولوجي يحدث تلقائياً دون تدريب، ويحدد استعداد الطفل للتعلم."],["الاستعداد","بلوغ الطفل مستوى النضج والخبرة الذي يجعله قادراً على تعلم مهارة معينة."],["مطالب النمو","مهام ينبغي إنجازها في مرحلة عمرية محددة (هافجهرست) ويرتبط نجاحها بنجاح المهام التالية."],["الفترة الحرجة","فترة يكون فيها الكائن أكثر حساسية لاكتساب خبرة معينة، وما يفوت فيها يصعب تعويضه."],["الاتجاه الرأسي–الذيلي","تقدّم النمو من الرأس نحو القدمين."],["الاتجاه المركزي–الطرفي","تقدّم النمو من محور الجسم نحو الأطراف."],["النمو التكويني","النمو في الحجم والشكل والوزن والطول."],["النمو الوظيفي","النمو في وظائف الأعضاء والقدرات العقلية والاجتماعية."]],"intro":[],"ex":[]},{"h":"بياجيه: النمو المعرفي","pts":["**[[بياجيه|ar.l07.piaget]]**: الطفل **يبني معرفته بنفسه**، وعوامل نموه النضج والخبرة والتفاعل الاجتماعي و[[الموازنة|ar.l09.adapt]].","المراحل **ثابتة الترتيب** ويختلف فيها التفكير نوعاً لا كماً.","طالب **الابتدائية** في المحسوسات: وسائل وتجارب لا تجريد لفظي؛ وطالب المتوسطة والثانوية يبدأ المجرد.","**[[الاحتفاظ|ar.l07.conservation]]** يظهر في العمليات المحسوسة، و**دوام الشيء** في نهاية الحس-حركية.","**التمركز حول الذات** عجز عن رؤية منظور الآخر، لا أنانية."],"t":[["دوام الشيء","إدراك أن الشيء يظل موجوداً وإن غاب عن الحواس؛ يكتمل في نهاية الحس-حركية."],["التمركز حول الذات","عجز الطفل عن رؤية الأمور من منظور غيره (ما قبل العمليات)."],["الإحيائية","إضفاء الحياة والمشاعر على الجمادات."],["الاحتفاظ","إدراك أن الكمية تبقى ثابتة رغم تغيّر الشكل أو الترتيب؛ يظهر في العمليات المحسوسة."],["المعكوسية","القدرة على إرجاع العملية العقلية إلى حالتها الأولى (4+2=6 إذن 6−2=4)."],["المخطط (السكيما)","البنية العقلية التي ينظّم بها الفرد خبراته ويفسّر بها العالم."],["التفكير الافتراضي الاستنباطي","تصور احتمالات وفروض واستنتاج النتائج منها؛ سمة المرحلة المجردة."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Piaget — Cognitive Stages","مراحل النمو المعرفي عند بياجيه"],"groups":[{"n":"الحس-حركية (0–2)","ar":"يعرف العالم بالحواس والحركة.","items":[{"n":"دوام الشيء"}],"d":"ar.l07.piaget"},{"n":"ما قبل العمليات (2–7)","ar":"لغة ورموز ولعب إيهامي.","items":[{"n":"التمركز حول الذات"},{"n":"الإحيائية"},{"n":"غياب الاحتفاظ"}],"d":"ar.l07.piaget"},{"n":"العمليات المحسوسة (7–11)","ar":"منطق على أشياء **محسوسة** فقط.","items":[{"n":"الاحتفاظ"},{"n":"المعكوسية"},{"n":"التصنيف والترتيب"}],"d":"ar.l07.conservation"},{"n":"العمليات المجردة (11+)","ar":"تفكير **افتراضي استنباطي**.","items":[{"n":"اختبار الفروض"},{"n":"التعميم"}],"d":"ar.l07.piaget"}]}},{"h":"إريكسون: النمو النفسي الاجتماعي","pts":["**[[إريكسون|ar.l07.erikson]]**: ثماني أزمات نفسية اجتماعية من المهد إلى الشيخوخة، وحلّ كل أزمة يمهد للتالية.","أزمة الابتدائية تسمى أيضاً **الكفاية مقابل الشعور بالنقص**: التشجيع يبني الكفاية، والنقد المتكرر يولّد الدونية.","التطبيق: في الابتدائية مهام ممكنة وتقدير للجهد، وفي المراهقة أدوار ومسؤوليات واحترام للاستقلالية.","**[[مارسيا|ar.l07.marcia]]** فصّل أزمة الهوية في أربع حالات: التشتت، والانغلاق (هوية يفرضها الوالدان)، والتعليق، والتحقيق."],"t":[["الأزمة النفسية الاجتماعية","نقطة تحول في كل مرحلة بين قطبين إيجابي وسلبي، وحلّها الإيجابي يبني فضيلة."],["الاجتهاد مقابل الدونية","أزمة سن المدرسة الابتدائية (6–12): الإنجاز والتقدير مقابل الشعور بالنقص."],["الهوية مقابل تشتت الهوية","أزمة المراهقة (12–18): تكوين إجابة عن «من أنا؟»."],["الهوية المنغلقة (التبني المبكر)","حالة عند مارسيا: المراهق يتبنى هوية فرضها عليه والداه دون استكشاف."],["تعليق الهوية","حالة استكشاف نشط دون التزام بعد."],["الكفاية مقابل النقص","تسمية أخرى لأزمة الاجتهاد مقابل الدونية (6–12 سنة) عند إريكسون."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Erikson — Psychosocial Crises","أزمات إريكسون الثماني"],"groups":[{"n":"قبل المدرسة (0–6)","ar":"ثلاث أزمات متتالية.","items":[{"n":"الثقة/عدم الثقة"},{"n":"الاستقلال/الخجل"},{"n":"المبادرة/الذنب"}],"d":"ar.l07.erikson"},{"n":"الابتدائية (6–12)","ar":"**الاجتهاد مقابل الدونية**: إنجاز يُقدَّر.","d":"ar.l07.erikson"},{"n":"المراهقة (12–18)","ar":"**الهوية مقابل تشتت الهوية**: «من أنا؟».","d":"ar.l07.marcia"},{"n":"الرشد والشيخوخة","ar":"ثلاث أزمات أخيرة.","items":[{"n":"الألفة/العزلة"},{"n":"الإنتاجية/الركود"},{"n":"التكامل/اليأس"}],"d":"ar.l07.erikson"}]}},{"h":"كولبرج وفرويد وهافجهرست","pts":["**[[كولبرج|ar.l07.kohlberg]]** يقيس **التبرير** لا الحكم بمعضلات أخلاقية (هاينز): ثلاثة مستويات في كل منها مرحلتان.","يلتزم بالنظام خوفاً من الخصم = 1، وليُرضي معلمه = 3، ولأنه «قانون المدرسة» = 4.","**[[فرويد|ar.l07.freud]]**: فمية ← شرجية ← قضيبية ← **الكمون** (6–12 = الابتدائية) ← تناسلية؛ والشخصية هو وأنا وأنا أعلى.","**هافجهرست** في الطفولة المتوسطة: القراءة والكتابة والحساب واللعب الجماعي والضمير؛ وفي المراهقة: الاستقلال واختيار المهنة.","الفرق الحاسم: بياجيه **معرفي**، إريكسون نفسي اجتماعي، كولبرج أخلاقي، فرويد نفسي جنسي، هافجهرست مطالب نمو."],"t":[["المعضلة الأخلاقية","موقف تتعارض فيه قيمتان، يستخدمه كولبرج لمعرفة طريقة التبرير لا الاختيار نفسه."],["مرحلة الكمون","مرحلة فرويد في سن المدرسة (6–12): تهدأ الدوافع ويتجه الطفل للتعلم والأقران."],["الأنا الأعلى","الضمير والمثل العليا المكتسبة من الوالدين والمجتمع."],["المستوى التقليدي","مستوى كولبرج الثاني: الحكم الأخلاقي وفق توقعات الآخرين والقانون."],["المبادئ الأخلاقية العالمية","أعلى مرحلة عند كولبرج: الالتزام بمبادئ العدل والكرامة حتى لو خالفت القانون."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Kohlberg — Moral Reasoning","مستويات الحكم الأخلاقي عند كولبرج"],"groups":[{"n":"ما قبل التقليدي","ar":"التبرير بالعقاب أو المنفعة؛ مستوى الطفولة.","items":[{"n":"1 تجنب العقاب"},{"n":"2 المصلحة المتبادلة"}],"d":"ar.l07.kohlberg"},{"n":"التقليدي","ar":"التبرير برضا الآخرين والنظام.","items":[{"n":"3 الولد الطيب"},{"n":"4 القانون والنظام"}],"d":"ar.l07.kohlberg"},{"n":"ما بعد التقليدي","ar":"التبرير بالمبادئ.","items":[{"n":"5 العقد الاجتماعي"},{"n":"6 المبادئ العالمية"}],"d":"ar.l07.kohlberg"}]}},{"h":"خصائص المراحل الدراسية (ابتدائي/متوسط/ثانوي)","pts":["**[[الطفولة المتوسطة|ar.l07.stages]] (6–9)**: فضول وتفكير محسوس وانتباه قصير؛ فأنشطة قصيرة ولعب ووسائل محسوسة.","**الطفولة المتأخرة (9–12)**: سن الجماعة وروح العمل الجماعي وزيادة المفردات.","**المراهقة المبكرة (12–15)**: طفرة نمو وبلوغ، وتقلب انفعالي، وأحلام يقظة؛ فالحوار والاحتواء لا الصدام.","**المراهقة المتوسطة (15–18)**: اكتمال التفكير المجرد وتكوين الهوية والمثالية؛ فمشاريع ومسؤوليات وأدوار قيادية.","المراهق **أكثر المراحل حساسية للنقد القاسي**، فيُناقش انفراداً.","البنات يسبقن الأولاد في البلوغ بنحو سنة إلى سنتين."],"t":[["الطفولة المتأخرة","9–12 سنة: سن الجماعة والعمل الجماعي والتطبيع الاجتماعي."],["المراهقة","مرحلة الانتقال من الطفولة إلى الرشد وتبدأ بالبلوغ؛ تتسم بالتقلب الانفعالي والبحث عن الهوية."],["البلوغ","النضج الجنسي البيولوجي وبداية المراهقة، يسبق فيه البنات الأولاد."],["طفرة النمو","تسارع مفاجئ في الطول والوزن في بداية المراهقة."],["المثالية","ميل المراهق إلى تصور عالم مثالي ونقد الواقع والكبار."],["أحلام اليقظة","تخيلات يومية تكثر في المرحلة المتوسطة وتشغل المراهق عن التركيز."]],"intro":[],"ex":[]},{"h":"مشكلات النمو والأحداث اليومية الضاغطة","pts":["**[[الأحداث الضاغطة|ar.l07.stress]]** (طلاق، وفاة، انتقال، ولادة أخ، تنمر) تظهر تشتتاً وتراجعاً وانسحاباً أو عدواناً.","**مشكلات شائعة**: القلق، والعدوان، والغيرة، والكذب، والخجل، ومخاوف المدرسة.","**العلامة التحذيرية** هي التغير المفاجئ عن حال الطالب السابقة، لا السلوك الطبيعي لمرحلته.","**تعامل المعلم**: ملاحظة وتوثيق ← حوار فردي هادئ ← مرونة مؤقتة ← إحالة للموجه الطلابي ← متابعة.","روتين ثابت وبيئة آمنة، مع **السرية** وعدم المقارنة.","الطالب المنتقل حديثاً يُعطى **زميلاً مرافقاً**؛ وقلق الاختبار يخففه توضيح التقويم مبكراً وتنويع أدواته."],"t":[["الحدث الضاغط","موقف أو تغير في حياة الطالب يفوق قدرته المعتادة على التكيف فيؤثر في تعلمه وسلوكه."],["قلق الاختبار","توتر وخوف مبالغ فيه قبل الاختبار أو أثناءه يضعف أداء الطالب."],["العلامة التحذيرية","تغير مفاجئ في سلوك الطالب أو تحصيله أو مظهره يستدعي المتابعة."]],"intro":[],"ex":[]},{"h":"مؤشرات الاضطرابات الانفعالية والإيذاء والإهمال وإجراء الإبلاغ","pts":["**[[مؤشرات الاضطراب الانفعالي|ar.l07.emo]]**: حزن مستمر، انسحاب، غضب غير مبرر، شكاوى جسمية بلا سبب طبي.","[[**الإيذاء**|ar.l02.childprot]]: إساءة جسدية أو نفسية أو جنسية أو التهديد بها؛ و**الإهمال**: عدم توفير الحاجات الأساسية.","العلامة الواحدة ليست دليلاً قاطعاً؛ المعلم **يلاحظ ويوثق ويبلغ**، ولا يحقق ولا يواجه الأسرة.","**[[المادة 29|ar.l07.abuse]]**: إبلاغ مدير المدرسة فوراً وبسرية ← لجنة التوجيه الطلابي ← محضر رسمي ← ولي الأمر.","الحالة العاجلة تُبلَّغ إلى **1919** فوراً؛ والإجراءات عاجلة سرية لا تتدرج كالمخالفات السلوكية.","إذا كان المصدر من **منسوبي المدرسة** فإلى إدارة التعليم؛ وانقطاع الطالب عن التعليم يُعد إيذاءً أو إهمالاً."],"t":[["الإيذاء","استغلال أو إساءة معاملة جسدية أو نفسية أو جنسية أو التهديد بها، ومنه التقصير في الحاجات الأساسية."],["الإهمال","عدم توفير حاجات الطالب الأساسية الجسدية والصحية والعاطفية والتعليمية أو التقصير فيها."],["مركز البلاغات","وحدة تابعة لوزارة الموارد البشرية والتنمية الاجتماعية تتلقى بلاغات الإيذاء والإهمال (1919)."],["الحالة عالية الخطورة","حدث أو ظرف غير متوقع يهدد سلامة الطلبة تهديداً مباشراً أو محتملاً ويتطلب تدخلاً سريعاً، مثل محاولة إيذاء الذات."]],"intro":[],"ex":[]}],"trap":["**[[النضج|ar.l07.maturation]]** داخلي بلا تدريب، و**التعلم** بالخبرة؛ تعليم مهارة قبل نضجها يضيع الجهد.","**[[دوام الشيء|ar.l07.conservation]]** نهاية الحس-حركية، و**الاحتفاظ** بداية العمليات المحسوسة؛ لا تخلط بينهما.","**التمركز حول الذات** (بياجيه) ليس أنانية، بل عجز عن رؤية منظور الآخر.","**العمليات المحسوسة** منطق على أشياء محسوسة فقط؛ **المجردة** منطق على فروض وافتراضات.","الصف الرابع الابتدائي = **العمليات المحسوسة**، لا المجردة وإن ظهر فيه ذكاء.","أزمة الابتدائية عند [[إريكسون|ar.l07.erikson]] **الاجتهاد مقابل الدونية**، وأزمة المراهقة **الهوية مقابل التشتت**؛ لا تنسب الهوية للابتدائية.","**[[مرحلة الكمون|ar.l07.freud]]** (فرويد) هي سن الابتدائية، وليست «مرحلة نوم» للتعلم بل أنشط مراحل التعلم.","[[كولبرج|ar.l07.kohlberg]] يقيس **سبب الحكم** (التبرير) لا الحكم نفسه؛ اثنان يختاران الشيء نفسه قد يكونان في مرحلتين مختلفتين.","«الولد الطيب» مرحلة **3** (إرضاء الآخرين)، و«القانون والنظام» مرحلة **4**؛ كلاهما في المستوى التقليدي.","**[[هافجهرست|ar.l07.havighurst]]** = مطالب النمو، و**إريكسون** = أزمات؛ السؤال الذي يذكر «مهام ينبغي إنجازها في مرحلة» يقصد هافجهرست.","**روح العمل الجماعي** و«سن الجماعة» = الطفولة المتأخرة (9–12)، لا المراهقة.","التقلب الانفعالي والحساسية للنقد = **المراهقة المبكرة**؛ وعلاج تمرد المراهق الاحتواء والحوار لا التحدي العلني."],"vid":[["Pu9zuvc0CXY","شرح المعيار الخامس: المعرفة بالمتعلم وكيفية تعلمه 7","سهام الزهراني",32],["8sgLeGd2EFk","حل تطبيقات المعيار الخامس المعرفة بالمتعلم وكيفية تعلمه","سهام الزهراني",37],["XH4dSmRi5KI","نظرية بياجيه في النمو المعرفي","المدرب علي القرشي",11],["RPlexUVodHY","نظرية النمو العقلي المعرفي لجان بياجيه","سلوى البحيري",33],["vBkq1ucCj50","نظرية النمو النفسي الاجتماعي لإريكسون","سلوى البحيري",20],["ZLSMCT8yaKc","مراجعة نظريات النمو","د. حمدي العياضي",36]],"map":null,"n":7},{"id":"L08","d":"K","std":"5","sub":"5.2، 5.4","ar":"الفروق الفردية وذوو الاحتياجات الخاصة والموهوبون","goal":"تحدد طبيعة الفروق الفردية وأنماط التعلم، وتميّز فئات ذوي الاحتياجات الخاصة (صعوبات التعلم، بطء التعلم، التأخر الدراسي، التوحد، فرط الحركة، الإعاقات، الموهوبون) وتختار الإجراء الصفي الأنسب لكل فئة.","sec":[{"h":"الفروق الفردية","pts":["**[[الفروق الفردية|ar.l08.indiv]]** انحراف الفرد عن متوسط الجماعة؛ فروق كمية تتوزع توزيعاً اعتدالياً.","نوعان: **بين الأفراد**، و**داخل الفرد** (قوي في اللغة ضعيف في الرياضيات).","**أكبر مدى** للفروق في السمات الانفعالية والشخصية، وأقله في الجسمية؛ والعقلية أكثر ثباتاً.","أسبابها الوراثة والبيئة والعمر والجنس؛ وتظهر في القدرات والتحصيل والاستعداد والاتجاهات والميول.","مقياس «موافق بشدة… غير موافق بشدة» يقيس **الاتجاهات**.","مراعاتها بالتنويع و[[التعليم المتمايز|ar.l08.diff]] والتعلم التعاوني والتعليم المبرمج؛ و**المحاضرة لا تراعيها**."],"t":[["الفروق الفردية","اختلافات كمية بين الأفراد (أو داخل الفرد) في السمات الجسمية والعقلية والانفعالية والاجتماعية."],["الفروق داخل الفرد","تفاوت قدرات الطالب نفسه بين مجال وآخر."],["التوزيع الاعتدالي","تجمّع معظم الأفراد حول المتوسط وقلّتهم في الطرفين."],["الاستعداد","قابلية الفرد للتعلم في مجال معين قبل التدريب عليه."],["الاتجاه","استعداد وجداني مكتسب للاستجابة بالقبول أو الرفض نحو موضوع ما."],["تفريد التعليم","تكييف التعليم ليسير كل متعلم بسرعته وطريقته."],["زمن الرجع","الفترة بين تقديم المثير وبدء استجابة الفرد له."]],"intro":[],"ex":[]},{"h":"أنماط التعلم والذكاءات في الصف","pts":["**[[أنماط التعلم|ar.l08.styles]]** (VARK): بصري، سمعي، حسي حركي، قرائي كتابي.","تقسيم الطلاب إلى بصري/سمعي/حسي = **أنماط تعلم** لا ذكاءات.","**[[ذكاءات جاردنر الثمانية|ar.l08.gardner]]**: لغوي، منطقي، مكاني، جسمي، موسيقي، اجتماعي، ذاتي، طبيعي.","تتأمل نفسها = **ذاتي**، ويقود زملاءه ويفهم مشاعرهم = اجتماعي، ويصنف النباتات = طبيعي.","**كولب**: خبرة ← تأمل ← تجريد ← تجريب؛ و**مكارثي (4MAT)**: لماذا؟ ماذا؟ كيف؟ ماذا لو؟","التطبيق: **تنويع** المداخل، لا حصر الطالب في نمط واحد."],"t":[["نمط التعلم","الطريقة المفضلة لدى المتعلم في استقبال المعلومات ومعالجتها."],["الذكاءات المتعددة","نظرية جاردنر: الذكاء أنواع مستقلة نسبياً لا قدرة واحدة عامة."],["الذكاء الذاتي","فهم الفرد لذاته ومشاعره ودوافعه (التأمل الذاتي)."],["الذكاء الاجتماعي","فهم الآخرين والتعامل معهم بفاعلية."],["نموذج 4MAT","نموذج مكارثي لتقديم الدرس وفق أربعة أسئلة تناسب جميع الأنماط."]],"intro":[],"ex":[]},{"h":"صعوبات التعلم وبطء التعلم والتأخر الدراسي","pts":["**[[صعوبات التعلم|ar.l08.ld]]**: اضطراب في العمليات النفسية الأساسية مع ذكاء عادي أو فوق العادي.","تشخيصها بـ**محك التباين** بين القدرة والتحصيل، ومعه محك الاستبعاد للإعاقات والظروف البيئية.","**أكاديمية**: الديسلكسيا قراءة، والديسغرافيا كتابة، والديسكالكوليا حساب؛ و**نمائية**: انتباه وإدراك وذاكرة.","سبب تدني ذي الصعوبات **اضطراب العمليات**، لا انخفاض الذكاء ولا ضعف الدافعية.","**بطء التعلم**: ذكاء حدّي (70–85) وتدنٍّ في كل المواد؛ و**التأخر الدراسي**: ذكاء عادي وسبب خارجي.","ذو الصعوبات يبقى في الفصل العادي مع [[غرفة المصادر|ar.l08.inclusion]] و[[خطة فردية|ar.l08.iep]]، ومن طرق تدريسه تعدد الحواس.","[[تشخيصه وتدريسه|ar.l08.ld2]]: يُحال إذا استمرت المشكلة بعد الصف الثاني الابتدائي رغم سلامة الذكاء والحواس."],"t":[["صعوبات التعلم","اضطراب في العمليات النفسية الأساسية يظهر تبايناً بين القدرة والتحصيل مع ذكاء عادي."],["محك التباين","الفجوة بين القدرة العقلية والتحصيل الفعلي؛ المحك الأساسي لصعوبات التعلم."],["محك الاستبعاد","استبعاد الإعاقة الحسية والعقلية والحرمان البيئي كسبب للتدني."],["الديسلكسيا","عسر القراءة: قلب الحروف وصعوبة فك الرموز."],["الديسغرافيا","عسر الكتابة: رداءة الخط وصعوبة تنظيم الكتابة."],["الديسكالكوليا","عسر الحساب: صعوبة الأعداد والعمليات."],["بطء التعلم","ذكاء حدّي 70–85 وتدنٍ عام في جميع المواد."],["التأخر الدراسي","تحصيل أقل من القدرة بسبب عوامل بيئية أو دافعية مع ذكاء عادي."],["غرفة المصادر","غرفة في المدرسة العادية يتلقى فيها ذو الصعوبات تدريساً فردياً جزءاً من اليوم."],["VAKT","تدريس متعدد الحواس (بصري، سمعي، حركي، لمسي) لذوي صعوبات التعلم."],["مايكل بست","مقياس تقدير سلوكي يستخدمه المعلم للكشف الأولي عن صعوبات التعلم."]],"intro":[],"ex":[]},{"h":"التوحد وفرط الحركة والإعاقات","pts":["**[[التوحد|ar.l08.autism]]**: قصور التواصل والتفاعل، وسلوك نمطي متكرر، ومقاومة للتغيير؛ وبيئته **التعلم المنظم** الثابت.","**فرط الحركة**: ضعف انتباه ونشاط زائد واندفاعية؛ فالجلوس قرب المعلم ومهام قصيرة وتعزيز فوري، لا العزل.","**[[الإعاقة الفكرية|ar.l08.id]]**: ذكاء أقل من 70 مع قصور في السلوك التكيفي قبل 18.","**[[السمعية والبصرية|ar.l08.sensory]]**: مواجهة الطالب ولغة الإشارة، وبرايل والوصف اللفظي.","**الدمج** مع العاديين: مكاني أو اجتماعي أو أكاديمي (جزئي أو كلي) أو شامل.","ذوو الاحتياجات الخاصة **يشملون الموهوبين**؛ والمعلم يلاحظ ويحيل ولا يشخص."],"t":[["التعلم المنظم","أسلوب لبيئة التوحد يعتمد الروتين والجداول البصرية والحدود الواضحة."],["الاندفاعية","الاستجابة قبل التفكير وصعوبة انتظار الدور؛ من أعراض فرط الحركة."],["السلوك التكيفي","المهارات اليومية والاجتماعية التي يقصر فيها ذو الإعاقة الفكرية."],["الدمج","تعليم ذوي الاحتياجات الخاصة في المدرسة العادية جزئياً أو كلياً."],["الخطة التربوية الفردية","خطة مكتوبة بأهداف وخدمات لطالب من ذوي الاحتياجات الخاصة."],["الإحالة","تحويل الطالب إلى المختص لتشخيصه بعد ملاحظة المعلم."],["الإعاقة العقلية","أداء عقلي دون المتوسط بانحرافين معياريين مع قصور في السلوك التكيفي."]],"intro":[],"ex":[]},{"h":"الموهوبون والتعليم المتمايز","pts":["**[[رنزولي|ar.l08.renzulli]]**: الموهبة قدرة فوق المتوسط + إبداع + التزام بالمهمة.","**جانييه**: الموهبة فطرية والتفوق مكتسب؛ فكل متفوق موهوب، لا العكس.","**الكشف** بمحكات متعددة (ذكاء، إبداع، ترشيح المعلم) لا بالتحصيل وحده.","**[[الإثراء|ar.l08.gifted]]** يعمّق (رأسي) أو يوسّع (أفقي) في الصف نفسه، و**[[التسريع|ar.l08.accel]]** قبول مبكر أو تخطي صف أو ضغط منهج، لا حذف مواد.","خطأ شائع: مزيد من التمارين نفسها؛ والصحيح [[مهام أعمق|ar.l08.giftchar]]، فالموهوب قد يمل ويقلق بلا تحدٍّ.","**التعليم المتمايز** (توملينسون): يُمايَز المحتوى أو العملية أو المنتج أو البيئة، والهدف واحد.","التمايز **مجموعات مرنة** تتغير بحسب المهمة، لا تقسيم دائم حسب الذكاء."],"t":[["الموهبة","أداء أو استعداد متميز عن الأقران يحتاج برامج خاصة."],["الإثراء","تعميق أو توسيع خبرات الموهوب داخل صفه دون تغيير مستواه الدراسي."],["التعجيل","تسريع تقدم الموهوب: قبول مبكر، تخطي صف، ضغط المنهج."],["ضغط المنهج","دراسة المادة في زمن أقل بحذف ما أتقنه الطالب فعلاً."],["التجميع","وضع الموهوبين في مجموعات أو فصول خاصة."],["التعليم المتمايز","تنويع المحتوى والعملية والمنتج والبيئة وفق استعداد الطلاب واهتماماتهم وأنماطهم."],["المجموعات المرنة","مجموعات تتغير بحسب المهمة والاستعداد بدل التصنيف الدائم."],["التفوق","أداء متميز مكتسب في مجال محدد نتيجة التدريب والبيئة (جانييه)."]],"intro":[],"ex":[]},{"h":"الخلفيات الاجتماعية والاقتصادية والثقافية وحاجاتها التعليمية","pts":["**[[الخلفية الاقتصادية|ar.l08.bg]]** المحدودة: إتاحة مصادر المدرسة، وعدم اشتراط مواد مكلفة.","**الخلفية الاجتماعية** (تعليم الوالدين، استقرار الأسرة) تؤثر في الدعم المنزلي؛ فلا تفترض خبرات واحدة للجميع.","**الخلفية الثقافية واللغوية**: أمثلة من بيئات متنوعة، وشرح المفردات، ودعم لغوي.","**التدريس المستجيب ثقافياً**: ثقافة الطالب جسر للتعلم، بتوقعات عالية للجميع ودون قوالب نمطية.","**العدالة** تقديم ما يحتاجه كل طالب، لا الشيء نفسه للجميع؛ مع حفظ خصوصية ظروفه."],"t":[["التدريس المستجيب ثقافياً","تدريس يوظف ثقافة الطالب وخبراته في التعلم مع توقعات عالية للجميع."],["تكافؤ فرص التعلم","إتاحة فرص متكافئة ومتنوعة تراعي الفروق والخلفيات لجميع المتعلمين."],["القالب النمطي","حكم مسبق على قدرة الطالب بسبب خلفيته أو فئته لا بسبب أدائه."]],"intro":[],"ex":[]},{"h":"الخطة التربوية الفردية وفريقها ودور الأسرة والأخصائيين","pts":["**المسار**: ملاحظة ← إحالة ← موافقة ولي الأمر الخطية ← تشخيص بفريق متعدد التخصصات ← خطة فردية.","التشخيص من مصادر متعددة، و**لا يُكتفى بمقياس واحد**؛ وللأسرة طلب إعادة التشخيص.","**عناصر الخطة**: مستوى الأداء الحالي ← أهداف طويلة وقصيرة قابلة للقياس ← الخدمات ← التقويم.","**[[لجنة الخطط|ar.l08.iepteam]]**: قائد المدرسة رئيساً، ومعلما التربية الخاصة والتعليم العام، والمرشد، وولي الأمر، والطالب.","الخطة **وثيقة متجددة** تُراجع سنوياً أو نصف سنوي، أو عند تعثر التقدم.","**معلم التعليم العام** يكيّف التدريس ويشارك في الخطة والتقويم مع معلم التربية الخاصة.","**الخدمات المساندة** (علاج طبيعي، نطق) و**المكان التربوي** في البيئة الأقل تقييداً: فصل عام ← غرفة مصادر ← فصل خاص ← معهد."],"t":[["فريق الخطة الفردية","فريق متعدد التخصصات يضم الإدارة ومعلمي التربية الخاصة والعام والمرشد والمختصين وولي الأمر والطالب."],["مستوى الأداء الحالي","وصف لنقاط قوة الطالب واحتياجاته تُشتق منه أهداف الخطة الفردية."],["الخدمات المساندة","برامج ضرورية لنمو الطالب ذي الإعاقة كالعلاج الطبيعي والوظيفي والنطق والإرشاد النفسي."],["البيئة الأقل تقييداً","أقرب مكان تربوي إلى الفصل العام يحقق احتياجات الطالب ذي الإعاقة."]],"intro":[],"ex":[]}],"trap":["**[[صعوبات التعلم|ar.l08.ld]]** ذكاء عادي + تباين في مادة أو أكثر؛ **بطء التعلم** ذكاء حدّي + ضعف عام؛ **التأخر الدراسي** ذكاء عادي + سبب خارجي.","سبب تدني ذي الصعوبات **اضطراب العمليات الذهنية**، لا انخفاض الذكاء (ذاك بطء التعلم) ولا ضعف الدافعية (ذاك التأخر).","الديسلكسيا **قراءة**، الديسغرافيا **كتابة**، الديسكالكوليا **حساب**؛ وكلها **أكاديمية**، أما الانتباه والإدراك والذاكرة **نمائية**.","ذوو الاحتياجات الخاصة **[[يشملون الموهوبين|ar.l08.gifted]]**؛ «الموهوب ليس من ذوي الاحتياجات الخاصة» خطأ.","**[[التعجيل|ar.l08.accel]]** ليس حذف المواد؛ هو قبول مبكر أو تخطي صف أو ضغط منهج.","**الإثراء** يبقي الطالب في صفه؛ **التعجيل** يغيّر مستواه أو زمنه.","تقسيم الطلاب (بصري/سمعي/حسي) = **أنماط التعلم**؛ (لغوي/منطقي/مكاني…) = **الذكاءات المتعددة**.","**أكبر مدى** للفروق في الصفات **الانفعالية/الشخصية**، و**أقل مدى** في **الجسمية**؛ لا تعكسها.","**[[التمايز|ar.l08.diff]]** ليس تجميعاً دائماً حسب الذكاء؛ هو مجموعات مرنة وهدف واحد بمسارات متعددة.","دور معلم الصف مع اشتباه إعاقة **الملاحظة والإحالة** للمختص، لا التشخيص ولا إخبار الأهل بحكم جازم.","[[بيئة التوحد|ar.l08.autism]] **منظمة ثابتة الروتين**، لا «غنية بالمثيرات المتغيرة».","طالب فرط الحركة **قرب المعلم** ومهام قصيرة؛ لا عزله في آخر الصف ولا معاقبته على الحركة.","**[[الموهبة|ar.l08.renzulli]]** استعداد وراثي و**التفوق** أداء مكتسب؛ ليس كل موهوب متفوقاً، وكل متفوق موهوب."],"vid":[["Pu9zuvc0CXY","شرح المعيار الخامس: المعرفة بالمتعلم وكيفية تعلمه 7","سهام الزهراني",32],["8sgLeGd2EFk","حل تطبيقات المعيار الخامس المعرفة بالمتعلم وكيفية تعلمه","سهام الزهراني",37],["y_bqyYPUVpg","صعوبات التعلم","سلوى البحيري",29],["IbSUchZTQgg","الطلاب الموهوبون","سلوى البحيري",9],["LuifyNEdzz0","الذكاء وأنماط المتعلمين","حسين علي الفرج",82]],"map":{"type":"tree","title":["Special Learners","الفروق والفئات الخاصة"],"groups":[{"n":"تدنٍّ في التحصيل","short":"التحصيل","ar":"ثلاث حالات","idea":"الذكاء والسبب يحسمان التشخيص","d":"ar.l08.ld","items":[{"n":"صعوبات التعلم","ar":"ذكاء عادي + تباين","d":"ar.l08.ld"},{"n":"بطء التعلم","ar":"ذكاء حدّي 70–85"},{"n":"التأخر الدراسي","ar":"ذكاء عادي + سبب خارجي"}],"trap":"بطء التعلم ليس صعوبات تعلم"},{"n":"الإعاقات والاضطرابات","short":"الإعاقات","ar":"5.4","idea":"لكل فئة إجراء صفي","d":"ar.l08.id","items":[{"n":"الإعاقة الفكرية","ar":"ذكاء منخفض + قصور تكيفي","d":"ar.l08.id"},{"n":"التوحد","ar":"تواصل ونمطية وروتين","d":"ar.l08.autism"},{"n":"فرط الحركة","ar":"انتباه ونشاط واندفاع"}],"trap":"بيئة التوحد منظمة ثابتة"},{"n":"الخدمات","short":"الخدمات","ar":"مسار نظامي","idea":"ملاحظة ← إحالة ← موافقة ← تشخيص ← خطة","d":"ar.l08.iep","items":[{"n":"الخطة الفردية","ar":"فريق متعدد التخصصات","d":"ar.l08.iep"},{"n":"الدمج والمواءمات","ar":"البيئة الأقل تقييداً","d":"ar.l08.inclusion"}],"trap":"المعلم يلاحظ ويحيل ولا يشخص"},{"n":"الموهوبون","short":"الموهوبون","ar":"القواعد 1447","idea":"كشف بأكثر من أداة، ورعاية بالإثراء والتسريع","d":"ar.l08.gifted","items":[{"n":"الحلقات الثلاث","who":"Renzulli رنزولي","ar":"قدرة وإبداع والتزام","d":"ar.l08.renzulli"},{"n":"الموهبة والتفوق","who":"Gagné جانييه","ar":"فطري ومكتسب","d":"ar.l08.renzulli"},{"n":"التسريع","ar":"نظام التسريع","d":"ar.l08.accel"}],"trap":"التسريع ليس حذف مواد"},{"n":"مراعاة الفروق","short":"الفروق","ar":"5.2","idea":"هدف واحد ومداخل متعددة","d":"ar.l08.diff","items":[{"n":"التعليم المتمايز","who":"Tomlinson توملينسون","ar":"محتوى وعملية ومنتج","d":"ar.l08.diff"},{"n":"الذكاءات المتعددة","who":"Gardner جاردنر","ar":"ثمانية ذكاءات","d":"ar.l08.gardner"}],"trap":"بصري/سمعي/حسي أنماط تعلم لا ذكاءات"}]},"n":8},{"id":"L09","d":"K","std":"5","sub":"5.3","ar":"نظريات التعلم: السلوكية والاجتماعية والمعرفية والبنائية","goal":"تربط كل نظرية برائدها ومفاهيمها وتجربتها والإجراء الصفي الذي يقيسه الاختبار، وتميّز التعزيز من العقاب والتمثل من المواءمة والنمذجة من التشكيل.","sec":[{"h":"السلوكية: بافلوف وثورندايك وواطسون","pts":["**السلوكية**: التعلم ارتباط بين مثير واستجابة، والمتعلم متلقٍ سلبي والمعلم ملقّن ومعزِّز.","**[[بافلوف|ar.l09.pavlov]]**: مثير محايد (الجرس) يقترن بغير شرطي (الطعام) فيصير **مثيراً شرطياً** يستدعي استجابة شرطية (اللعاب).","**الانطفاء**: تكرار الشرطي دون غير الشرطي؛ و**الاسترجاع التلقائي**: عودة الاستجابة بعد راحة.","**التعميم** استجابة لمثيرات مشابهة، و**التمييز** استجابة للمثير الأصلي فقط؛ وقلق قاعة الاختبار استجابة مكتسبة.","**[[ثورندايك|ar.l09.thorndike]]**: المحاولة والخطأ؛ وقانون **الأثر**: الاستجابة المتبوعة بارتياح تقوى، ومعه التدريب والاستعداد.","**واطسون** مؤسس السلوكية (الطفل ألبرت)، و**جاثري** صاحب الاقتران من مرة واحدة.","**[[التعلم والتعليم والتدريس|ar.l09.terms]]**: التعلم نشاط المتعلم، والتعليم تصميم الخبرة، والتدريس إجراء قصير، والتربية أشمل."],"t":[["المثير الشرطي","مثير كان محايداً فاكتسب قدرة استدعاء الاستجابة باقترانه بالمثير غير الشرطي."],["الانطفاء","تلاشي الاستجابة تدريجياً عند توقف التعزيز أو تكرار المثير الشرطي وحده."],["الاسترجاع التلقائي","عودة الاستجابة المنطفئة فجأة بعد فترة راحة."],["التعميم","إصدار الاستجابة نفسها لمثيرات تشبه المثير الأصلي."],["التمييز","الاستجابة للمثير الأصلي دون المثيرات المشابهة."],["قانون الأثر","الاستجابة التي تتبعها حالة إشباع تقوى وتتكرر."],["قانون الاستعداد","التهيؤ والدافعية شرط لحدوث التعلم."],["قانون المرة الواحدة","تكوّن الارتباط الشرطي من خبرة واحدة قوية دون تكرار."],["الاشتراط الوسيلي","اسم آخر للاشتراط الإجرائي عند سكنر."]],"intro":[],"cmp":{"title":"الكلاسيكي أم الإجرائي؟","cols":["الكلاسيكي (بافلوف)","الإجرائي (سكنر)"],"rows":[{"k":"الترتيب","a":"المثير قبل الاستجابة","b":"النتيجة (التعزيز) بعد الاستجابة"},{"k":"نوع الاستجابة","a":"لا إرادية انفعالية (لعاب، خوف)","b":"إرادية يصدرها المتعلم"},{"k":"الانطفاء","a":"تكرار المثير الشرطي دون غير الشرطي","b":"إيقاف التعزيز عن السلوك"},{"k":"مثال صفي","a":"قلق مكتسب من قاعة الاختبار","b":"زيادة المشاركة بعد المدح"}]},"ex":[]},{"h":"سكنر: الإشراط الإجرائي","pts":["**[[سكنر|ar.l09.skinner]]**: السلوك الإجرائي تتحكم فيه نتائجه؛ والتعزيز بعد الاستجابة مفتاح التعلم.","**الانطفاء**: وقف التعزيز فيتلاشى السلوك؛ فإجابات صحيحة بلا تعزيز ثم تراجع المشاركة = انطفاء إجرائي.","**[[جداول التعزيز|ar.l09.schedules]]**: المستمر أسرع تعلماً وانطفاءً، و**النسبة المتغيرة** الأقوى وأكثر مقاومة للانطفاء.","**الفترة الثابتة** (اختبار كل أسبوع) يرتفع فيها الأداء قبيل الموعد، والاختبار المفاجئ فترة متغيرة.","**التشكيل** تعزيز التقريبات المتتابعة، و**مبدأ بريماك**: المحبب يعزز غير المحبب («أنهِ الواجب ثم العب»).","**[[المعززات وتطبيقاتها|ar.l09.reinf]]**: مادية واجتماعية ورمزية (الاقتصاد الرمزي) ونشاطية؛ والتعليم المبرمج وتعديل السلوك."],"t":[["التعزيز السالب","إزالة مثير منفّر بعد السلوك فيزداد السلوك (ليس عقاباً)."],["العقاب السالب","سحب معزّز بعد السلوك غير المرغوب فيقل."],["تكلفة الاستجابة","خسارة شيء مكتسب (درجات، امتياز) نتيجة سلوك غير مرغوب."],["الإقصاء (الوقت المستقطع)","إبعاد الطالب مؤقتاً عن مصدر التعزيز بعد سلوك غير مرغوب."],["التشكيل","تعزيز التقريبات المتتابعة للسلوك المستهدف."],["جدول النسبة المتغيرة","تعزيز بعد عدد غير منتظم من الاستجابات؛ الأقوى والأكثر مقاومة للانطفاء."],["الاقتصاد الرمزي","منح رموز (نجوم، نقاط) تُستبدل لاحقاً بمعززات."],["مبدأ بريماك","استخدام نشاط محبب لتعزيز نشاط أقل تفضيلاً."],["التعليم المبرمج","تجزئة المادة إلى خطوات صغيرة مع استجابة وتغذية راجعة فورية (سكنر)."]],"ex":[],"intro":[],"map":{"type":"fan","title":["Skinner — Consequences","التعزيز والعقاب عند سكنر"],"groups":[{"n":"تعزيز موجب","ar":"**إضافة** سارّ ← يزيد السلوك.","items":[{"n":"مدح"},{"n":"درجات"},{"n":"نجمة"}],"d":"ar.l09.skinner"},{"n":"تعزيز سالب","ar":"**إزالة** منفّر ← يزيد السلوك.","items":[{"n":"إلغاء الإنذار لمن شارك"}],"d":"ar.l09.skinner"},{"n":"عقاب موجب","ar":"**إضافة** منفّر ← يقل السلوك.","items":[{"n":"توبيخ"}],"d":"ar.l09.skinner"},{"n":"عقاب سالب","ar":"**سحب** معزّز ← يقل السلوك.","items":[{"n":"تكلفة الاستجابة"},{"n":"الإقصاء"}],"d":"ar.l09.skinner"}]}},{"h":"باندورا: التعلم الاجتماعي بالملاحظة","pts":["**[[باندورا|ar.l09.bandura]]**: نتعلم بملاحظة نموذج (**النمذجة**) دون تعزيز مباشر؛ تجربة دمية بوبو.","نظريته جسر بين السلوكية والمعرفية، وتقوم على **الحتمية التبادلية** بين الفرد والسلوك والبيئة.","مراحل التعلم بالملاحظة: الانتباه ← الاحتفاظ ← الإنتاج (الأداء الحركي) ← الدافعية.","**التعزيز البديل** يزيد السلوك عند الملاحظ، والعقاب البديل يقلله، والتعزيز الذاتي رضا الفرد عن نفسه.","النمذجة الأنسب لتعلم **الاتجاهات والقيم** والمهارات الاجتماعية؛ والمعلم قدوة.","**[[الكفاءة الذاتية|ar.l10.selfeff]]**: اعتقاد القدرة على مهمة، وأقوى مصادرها خبرات الإتقان.","**[[الانفصال الأخلاقي|ar.l09.moraldis]]**: تبرير السلوك السيئ، كتسمية الاعتداء «مزاحاً»."],"t":[["النمذجة","تعلم سلوك بملاحظة نموذج وتقليده."],["التعزيز البديل","زيادة سلوك الملاحظ بعد رؤية النموذج يُعزَّز عليه."],["الحتمية التبادلية","التأثير المتبادل بين الفرد والسلوك والبيئة."],["الكفاءة الذاتية","اعتقاد الفرد بقدرته على أداء مهمة بنجاح."],["التهذيب اللفظي","آلية انفصال أخلاقي: تسمية السلوك المؤذي باسم لطيف."]],"intro":[],"ex":[]},{"h":"المعرفية: الجشطلت وتولمان وأوزوبل وبرونر","pts":["**المعرفية**: التعلم فهم وتنظيم بعمليات عقلية داخلية، والمتعلم نشط.","**[[الجشطلت|ar.l09.gestalt]]**: الكل أكبر من مجموع أجزائه، والتعلم **استبصار** مفاجئ (قرد كوهلر)، ومن قوانين الإدراك الإغلاق والتشابه.","**[[تولمان|ar.l09.tolman]]**: التعلم الكامن بلا تعزيز، ويكوّن المتعلم خرائط معرفية.","**[[أوزوبل|ar.l09.ausubel]]**: التعلم ذو المعنى بربط الجديد بالبنية المعرفية، و**المنظم المتقدم** يُعرض قبل الدرس (شارح أو مقارن).","مبدآ أوزوبل: **التمايز التدريجي** من العام إلى الخاص، و**التوفيق التكاملي** بربط المفاهيم وإزالة التناقض.","**[[برونر|ar.l09.bruner]]**: **الاكتشاف** الموجه، وتمثيل عملي ← أيقوني ← رمزي، والمنهج الحلزوني."],"t":[["الاستبصار","إدراك مفاجئ للعلاقات بين عناصر الموقف يؤدي إلى الحل (كوهلر)."],["قانون الإغلاق","ميل الإدراك إلى إكمال الأشكال الناقصة وإدراكها ككل."],["التعلم الكامن","تعلم يحدث بلا تعزيز ظاهر ويظهر عند وجود دافع (تولمان)."],["الخريطة المعرفية","تمثيل عقلي للعلاقات المكانية أو المفاهيمية (تولمان)."],["التعلم ذو المعنى","ربط المعرفة الجديدة بالبنية المعرفية القائمة بدل الحفظ الصم (أوزوبل)."],["المنظم المتقدم","مادة تمهيدية عامة تُقدَّم قبل الدرس لربط الجديد بالسابق."],["التمثيل الأيقوني","مرحلة برونر الثانية: التعلم بالصور والرسوم والخرائط."],["المنهج الحلزوني","تنظيم برونر: تكرار المفاهيم الأساسية بعمق متزايد عبر الصفوف."],["التمايز التقدمي","عرض الأفكار العامة أولاً ثم التفاصيل تدريجياً (أوزوبل)."],["التوفيق التكاملي","ربط المفاهيم الجديدة بالقديمة وإزالة التعارض بينها (أوزوبل)."]],"intro":[],"ex":[]},{"h":"معالجة المعلومات والذاكرة وما وراء المعرفة","pts":["**[[الذاكرة|ar.l09.memory]]**: حسية ← عاملة (**7±2** وحدات، 15–30 ثانية) ← طويلة المدى غير محدودة؛ والانتباه بوابة المعالجة.","عملياتها: الترميز ← التخزين ← الاسترجاع؛ والنقل للطويلة بالتسميع والتجميع والتفصيل والتنظيم.","**التداخل**: قبلي (القديم يعيق الجديد) وبعدي (الجديد يعيق القديم)؛ و[[أنواع الذاكرة والنسيان|ar.l09.memtypes]] في الدرج.","**الترميز المزدوج** (بايفيو): لفظي + بصري أقوى؛ و**الحمل المعرفي** (سويلر): لا تُثقل الذاكرة العاملة.","**[[ما وراء المعرفة|ar.l10.meta]]** (فلافل): التفكير في التفكير بالتخطيط والمراقبة والتقويم.","**التدريب الموزع** أفضل للاحتفاظ من المكثف."],"t":[["الذاكرة العاملة","ذاكرة قصيرة المدى نشطة تعالج 7±2 وحدات لثوانٍ."],["التجميع (التقطيع)","ضم عناصر متفرقة في وحدات أكبر لتوسيع سعة الذاكرة العاملة."],["التسميع","إعادة المعلومة لتثبيتها في الذاكرة."],["التداخل البعدي","التعلم الجديد يعيق تذكر القديم."],["الترميز المزدوج","تخزين المعلومة في نظامين لفظي وبصري (بايفيو)."],["ما وراء المعرفة","وعي الفرد بعملياته المعرفية والتحكم فيها: تخطيط ومراقبة وتقويم."],["الحمل المعرفي","عبء المعالجة على الذاكرة العاملة؛ زيادته تعيق التعلم."],["التدريب الموزع","توزيع المراجعة على جلسات قصيرة متباعدة؛ أفضل للتذكر طويل المدى."]],"intro":[],"ex":[]},{"h":"البنائية: بياجيه وفيجوتسكي، وانتقال أثر التعلم","pts":["**البنائية**: المتعلم يبني معرفته على خبراته السابقة، والمعلم ميسّر، والخطأ فرصة للتعلم.","[[بياجيه|ar.l09.adapt]]: **تمثل** (إدخال الجديد في مخطط قائم) و**مواءمة** (تعديل المخطط)، تحركهما الموازنة.","يسمي الطفل الحمار الوحشي «حصاناً» = تمثل، ثم يكوّن له مفهوماً جديداً = مواءمة.","**[[فيجوتسكي|ar.l09.vygotsky]]**: التعلم اجتماعي أولاً، واللغة أداة التفكير، و**منطقة النمو القريب** ما ينجزه الطالب بمساعدة لا وحده.","**السقالات** دعم مؤقت (تلميح، نموذج، سؤال) يُسحب تدريجياً.","**[[انتقال أثر التعلم|ar.l09.transfer]]**: موجب أو سالب أو صفري، وأفقي أو رأسي؛ ويفسره ثورندايك بالعناصر المتطابقة."],"t":[["التمثل","إدخال الخبرة الجديدة في مخطط عقلي قائم دون تغييره."],["المواءمة","تعديل المخطط القائم أو إنشاء مخطط جديد ليناسب الخبرة الجديدة."],["الموازنة","السعي لاستعادة التوازن بين التمثل والمواءمة عند مواجهة خبرة محيّرة."],["منطقة النمو القريب","المدى بين الأداء المستقل والأداء بمساعدة الأكثر خبرة (فيجوتسكي)."],["السقالات","دعم مؤقت متدرج يُسحب مع تقدم المتعلم."],["الحديث الذاتي","كلام الطفل مع نفسه أثناء المهمة؛ يراه فيجوتسكي أداة لتنظيم التفكير."],["انتقال أثر التعلم","أثر تعلم سابق في تعلم أو أداء لاحق، إيجاباً أو سلباً."],["الانتقال الرأسي","تعلم مهارة أعلى مستوى تبنى على مهارة سابقة."]],"intro":[],"ex":[],"cmp":{"title":"بياجيه أم فيجوتسكي؟","cols":["بياجيه","فيجوتسكي"],"rows":[{"k":"مصدر البناء","a":"فردي: تفاعل الطفل مع الأشياء","b":"اجتماعي أولاً ثم فردي"},{"k":"النمو والتعلم","a":"النمو يسبق التعلم (الاستعداد)","b":"التعلم يقود النمو"},{"k":"الحديث الذاتي","a":"علامة تمركز حول الذات","b":"أداة لتنظيم التفكير"},{"k":"دور المعلم","a":"يهيئ بيئة للاكتشاف والحيرة المعرفية","b":"يدعم داخل منطقة النمو القريب ثم يسحب الدعم"}]}},{"h":"التعلم المستند إلى الدماغ والأساليب المعرفية","pts":["**[[التعلم المستند إلى الدماغ|ar.l09.brain]]**: الدماغ اجتماعي يبحث عن المعنى، ويتعزز التعلم بالتحدي ويُكبح بالتهديد.","عناصره: **الاسترخاء اليقظ**، والانغماس المنظم، والمعالجة النشطة.","**[[الأسلوب المعرفي|ar.l09.styles]]** طريقة ثابتة نسبياً تصف كيف يتعلم الفرد لا مقدار ذكائه.","**ويتكن**: المعتمد على المجال يدرك الكل ويفضل الجماعة، والمستقل يحلل الأجزاء ويفضل الفردي.","**كاجان**: المندفع سريع كثير الخطأ، والمتروي متأنٍّ أقل خطأً؛ ويُعالج الاندفاع بالتوقف والتفكير.","**دن ودن** يربطان أسلوب التعلم بعناصر بيئية وانفعالية واجتماعية وجسمية ونفسية."],"t":[["التعلم المستند إلى الدماغ","تصميم التعليم وفق مبادئ مستخلصة من أبحاث عمل الدماغ."],["الاسترخاء اليقظ","حالة يجتمع فيها الأمان النفسي مع التحدي المرتفع فتعزز التعلم."],["الأسلوب المعرفي","طريقة الفرد المفضلة الثابتة نسبياً في الإدراك والتفكير ومعالجة المعلومات."],["الاعتماد على المجال","أسلوب معرفي يدرك الموقف كلياً ويتأثر بالسياق والمحيط الاجتماعي (ويتكن)."],["الاندفاع والتروي","بُعد معرفي (كاجان): سرعة الاستجابة مع أخطاء أكثر مقابل التأني مع أخطاء أقل."]],"intro":[],"ex":[]}],"trap":["**[[التعزيز السالب|ar.l09.skinner]]** يزيد السلوك بإزالة منفّر؛ **العقاب** بنوعيه يقلله؛ السالب ليس «سيئاً».","**العقاب السالب** = سحب معزّز؛ **تكلفة الاستجابة** خسارة مكتسب، و**الإقصاء** عزل عن التعزيز؛ كلها تقلل السلوك.","**الانطفاء** = وقف التعزيز فيتلاشى السلوك؛ إجابات صحيحة بلا تعزيز ثم تراجع المشاركة = **انطفاء** في الإجرائي (لا «إشراط كلاسيكي» كما في بعض مفاتيح الملخصات المتداولة).","في **[[الكلاسيكي|ar.l09.pavlov]]** المثير يسبق الاستجابة اللاإرادية؛ في **الإجرائي** التعزيز يلي الاستجابة الإرادية.","**التعميم** استجابة واحدة لمثيرات متشابهة؛ **التمييز** استجابات مختلفة لمثيرات متشابهة.","**[[النمذجة|ar.l09.bandura]]** تعلم بالملاحظة (باندورا)؛ **التشكيل** تعزيز التقريبات (سكنر)؛ **التلقين** إعطاء الاستجابة جاهزة.","**[[النسبة المتغيرة|ar.l09.schedules]]** أقوى الجداول وأكثرها مقاومة للانطفاء؛ **المستمر** أسرع تعلماً وأسرع انطفاءً.","**[[الاستبصار|ar.l09.gestalt]]** (الجشطلت/كوهلر) حل مفاجئ بالفهم؛ **المحاولة والخطأ** (ثورندايك) تدريجي عشوائي.","**[[المنظم المتقدم|ar.l09.ausubel]]** (أوزوبل) يربط الجديد بالبنية المعرفية **قبل** الدرس؛ **التهيئة الحافزة** تثير الاهتمام فقط.","**[[التمثل|ar.l09.adapt]]** يبقي المخطط ويضيف؛ **المواءمة** تعدّل المخطط.","**[[منطقة النمو القريب|ar.l09.vygotsky]]** (فيجوتسكي) ما يمكن بالمساعدة؛ **الاستعداد** (بياجيه) ما يسمح به النضج.","[[برونر|ar.l09.bruner]] **اكتشاف** وتمثيلات ثلاث؛ أوزوبل **استقبال ذو معنى**؛ لا تعكسهما.","**التعلم** تغير شبه دائم من الخبرة (خاص بالطالب)؛ **التعليم** تصميم الخبرة (خاص بالمعلم)؛ **التدريس** إجراء قصير المدى؛ **التربية** الأشمل.","الانطفاء في **الإجرائي** = إيقاف التعزيز بعد الاستجابة الإرادية؛ في **الكلاسيكي** = تقديم المثير الشرطي بلا غير شرطي. إجابات صحيحة بلا تعزيز فقلّت المشاركة = انطفاء إجرائي لا اشتراط كلاسيكي."],"vid":[["Pu9zuvc0CXY","شرح المعيار الخامس: المعرفة بالمتعلم وكيفية تعلمه 7","سهام الزهراني",32],["8sgLeGd2EFk","حل تطبيقات المعيار الخامس المعرفة بالمتعلم وكيفية تعلمه","سهام الزهراني",37],["Czu6zrDH-Ow","نظريات التعلم في الرخصة المهنية","منصة البراعة · د. فيصل العوفي",60],["S9jVcKr-zGw","مراجعة عامة على نظريات التعلم","المدرب محمد رجب",69],["J22LlX1GdjI","نظريات التعلم: النظرية السلوكية","المدرب علي القرشي",17],["0iA7KoYVF_o","النظرية البنائية لبياجيه وفيجوتسكي","سلوى البحيري",17]],"map":{"title":["Learning Theories","نظريات التعلم"],"groups":[{"n":"السلوكية","short":"السلوكية","ar":"مثير ← استجابة","idea":"التعلم ارتباط يقويه الاقتران أو النتيجة","d":"ar.l09.skinner","items":[{"n":"الإشراط الكلاسيكي","who":"Pavlov بافلوف","ar":"المثير يسبق","d":"ar.l09.pavlov"},{"n":"المحاولة والخطأ","who":"Thorndike ثورندايك","ar":"قانون الأثر","d":"ar.l09.thorndike"},{"n":"الإشراط الإجرائي","who":"Skinner سكنر","ar":"التعزيز يلي","d":"ar.l09.skinner"}],"trap":"التعزيز السالب يزيد السلوك"},{"n":"التعلم الاجتماعي","short":"الاجتماعية","ar":"الملاحظة","idea":"نتعلم بملاحظة النموذج ونتائج سلوكه","d":"ar.l09.bandura","items":[{"n":"النمذجة","who":"Bandura باندورا","ar":"تعلم بالملاحظة بلا تعزيز مباشر","d":"ar.l09.bandura"},{"n":"الكفاءة الذاتية","who":"Bandura باندورا","ar":"أقوى مصادرها خبرات الإتقان","d":"ar.l10.selfeff"}],"trap":"النمذجة ملاحظة، والتشكيل تعزيز"},{"n":"المعرفية","short":"المعرفية","ar":"الفهم والمعنى","idea":"المتعلم نشط ينظم ما يدركه","d":"ar.l09.ausubel","items":[{"n":"الاستبصار","who":"Köhler كوهلر","ar":"حل مفاجئ بالفهم (الجشطلت)","d":"ar.l09.gestalt"},{"n":"المنظم المتقدم","who":"Ausubel أوزوبل","ar":"استقبال ذو معنى","d":"ar.l09.ausubel"},{"n":"الاكتشاف","who":"Bruner برونر","ar":"عملي ← أيقوني ← رمزي","d":"ar.l09.bruner"}],"trap":"أوزوبل استقبال وبرونر اكتشاف"},{"n":"معالجة المعلومات","short":"المعالجة","ar":"ترميز وتخزين","idea":"انتباه ← ترميز ← تخزين ← استرجاع","d":"ar.l09.memory","items":[{"n":"مخازن الذاكرة","who":"أتكنسون وشيفرين","ar":"حسية ← عاملة (7±2) ← طويلة","d":"ar.l09.memory"},{"n":"ما وراء المعرفة","who":"Flavell فلافل","ar":"خطط وراقب وقوّم","d":"ar.l10.meta"}],"trap":"الذاكرة العاملة 7±2"},{"n":"البنائية","short":"البنائية","ar":"المتعلم يبني","idea":"بناء فردي عند بياجيه واجتماعي عند فيجوتسكي","d":"ar.l09.adapt","items":[{"n":"التمثل والمواءمة","who":"Piaget بياجيه","ar":"المواءمة تعدّل المخطط","d":"ar.l09.adapt"},{"n":"النمو القريب","who":"Vygotsky فيجوتسكي","ar":"ما ينجزه بالمساعدة والسقالات","d":"ar.l09.vygotsky"}],"trap":"المواءمة تعدّل المخطط"}]},"n":9},{"id":"L10","d":"K","std":"5","sub":"5.3","ar":"الدافعية والذكاء والتفكير والإبداع","goal":"تفسر دافعية الطالب بنظريات ماسلو والعزو والكفاءة الذاتية، وتميّز نظريات الذكاء، وتصنّف مهارات التفكير الناقد والإبداعي وما وراء المعرفة وبرامج التفكير.","sec":[{"h":"الدافعية ونظرياتها","pts":["**[[الدافعية|ar.l10.motiv]]** حالة داخلية تحرك السلوك نحو هدف وتحافظ عليه؛ والدافع داخلي، والحافز خارجي، والباعث هدف يجذب.","**داخلية** من المهمة نفسها و**خارجية** من المكافأة؛ والإفراط في المكافآت يضعف الداخلية.","**[[ماسلو|ar.l10.maslow]]**: فسيولوجية ← أمن ← انتماء وحب ← تقدير ← تحقيق الذات؛ والحاجة الدنيا تُشبع أولاً.","**[[واينر|ar.l10.weiner]]**: القدرة داخلية ثابتة، والجهد داخلي متغير قابل للضبط؛ فعزو الفشل إلى الجهد يحفّز وإلى القدرة يحبط.","**العجز المتعلم** (سليجمان): توقف عن المحاولة رغم القدرة بعد فشل متكرر؛ والإحباط انفعال مؤقت.","**[[الكفاءة الذاتية|ar.l10.selfeff]]** تُبنى بخبرات نجاح متدرجة؛ و**دويك**: توجه الإتقان والعقلية النامية أفضل.","**[[يركس–دودسون|ar.l10.achieve]]**: أفضل أداء عند **استثارة متوسطة**؛ وذو دافع الإنجاز يختار مهاماً متوسطة الصعوبة."],"t":[["الدافعية الداخلية","ميل للقيام بالنشاط لذاته وللمتعة أو الإتقان الذي فيه."],["الدافعية الخارجية","القيام بالنشاط من أجل مكافأة أو تجنب عقاب."],["تحقيق الذات","قمة هرم ماسلو: تحقيق الفرد أقصى إمكاناته."],["نظرية العزو","تفسير الفرد لأسباب نجاحه وفشله على أبعاد الموقع والثبات والضبط (واينر)."],["العجز المتعلم","توقف الفرد عن المحاولة بعد فشل متكرر لاعتقاده أن جهده لا يجدي (سليجمان)."],["الكفاءة الذاتية","اعتقاد الفرد بقدرته على أداء مهمة بنجاح (باندورا)."],["قانون يركس–دودسون","الأداء أفضل عند مستوى متوسط من الاستثارة."],["توجه الإتقان","هدف الطالب التعلم والتحسن لا إثبات التفوق على الآخرين."],["دافع الإنجاز","رغبة الفرد في النجاح والتفوق في المهام (ماكليلاند)."],["الغرضية","خاصية الدافعية: توجيه السلوك نحو هدف محدد."]],"intro":[],"ex":[]},{"h":"الذكاء ونظرياته وقياسه","pts":["**بينيه** وضع أول اختبار ذكاء (1905) ومفهوم العمر العقلي.","**[[نسبة الذكاء|ar.l10.iq]]** = العمر العقلي ÷ الزمني × 100، متوسطها 100 وانحرافها 15.","**التصنيف**: 90–109 متوسط، 70–85 بطيء التعلم، أقل من 70 إعاقة فكرية، 130 فأكثر موهوب.","نسبة الذكاء **ثابتة نسبياً**، ولا تُستخدم وحدها للتصنيف ولا تُعلن للطلاب.","**كاتل**: السائل فطري يتراجع مع العمر، والمتبلور مكتسب يزداد بالخبرة.","**جالتون** أكد الوراثة وابتكر معامل الارتباط، و**رافن** مصفوفات غير لفظية."],"t":[["العمر العقلي","مستوى الأداء العقلي مقارنة بمتوسط الأعمار الزمنية (بينيه)."],["نسبة الذكاء","العمر العقلي ÷ العمر الزمني × 100."],["العامل العام g","قدرة عقلية عامة تشترك فيها جميع الأنشطة العقلية (سبيرمان)."],["الذكاء السائل","قدرة فطرية على حل المشكلات الجديدة (كاتل)."],["الذكاء المتبلور","معارف ومهارات مكتسبة تزداد بالخبرة (كاتل)."],["الذكاء الثلاثي","تحليلي وإبداعي وعملي (ستيرنبرغ)."],["الذكاء الوجداني","القدرة على فهم الانفعالات وإدارتها لدى الذات والآخرين (جولمان)."],["التفكير التباعدي","توليد حلول متعددة لمشكلة واحدة؛ أساس الإبداع (جيلفورد)."],["مصفوفات رافن","اختبار ذكاء غير لفظي بالأشكال يقيس العامل العام."]],"intro":[],"ex":[],"map":{"type":"cards","title":["Theories of Intelligence","نظريات الذكاء"],"groups":[{"n":"النظريات العاملية","ar":"ذكاء عام وقدرات","items":[{"n":"سبيرمان","who":"Spearman · العاملان","ar":"عامل عام g وعوامل خاصة s","d":"ar.l10.factor"},{"n":"ثيرستون","who":"Thurstone · القدرات الأولية","ar":"سبع قدرات"},{"n":"جيلفورد","who":"Guilford · بنية العقل","ar":"التفكير التقاربي والتباعدي"},{"n":"كاتل","who":"Cattell · السائل والمتبلور","ar":"السائل يتراجع والمتبلور يزداد"}]},{"n":"ذكاءات متعددة الأنواع","ar":"أوسع من الاختبار","items":[{"n":"جاردنر","who":"Gardner · الذكاءات المتعددة","ar":"ثمانية ذكاءات","d":"ar.l08.gardner"},{"n":"ستيرنبرغ","who":"Sternberg · الذكاء الثلاثي","ar":"تحليلي وإبداعي وعملي","d":"ar.l10.sternberg"},{"n":"جولمان","who":"Goleman · الذكاء الوجداني","ar":"خمسة مكونات","d":"ar.l10.goleman"}]}]}},{"h":"التفكير الناقد وما وراء المعرفة","pts":["**[[التفكير الناقد|ar.l10.critical]]**: فحص المعلومات والحجج وتقويمها بمعايير؛ منطلقه الشك المنهجي لا الرفض.","مهاراته (واطسون–جليسر): الاستنتاج، والتعرف على **الافتراضات**، والاستنباط، والتفسير، وتقويم الحجج.","تقييم مواقع الإنترنت من حيث الدقة والمصداقية، أو تقديم تفسيرات منطقية للنتائج = **تفكير ناقد**.","**الناقد** يفرز ويقوّم (أفضل 5 أفكار من 20)، و**الإبداعي** يولّد (العشرين).","**[[ما وراء المعرفة|ar.l10.meta]]**: التخطيط والمراقبة والتقويم؛ وتنميها KWL وسؤال «كيف توصلت؟»، أما القراءة الصامتة فمهارة معرفية.","**حل المشكلات** (ديوي): الشعور بالمشكلة ← تحديدها ← فروض ← اختبار ← تعميم.","مهارات التفكير **العليا** (بلوم المعدل): التحليل والتقويم والإبداع؛ وبعد السؤال المفتوح انتظر 3–5 ثوانٍ."],"t":[["التفكير الناقد","تقويم المعلومات والحجج بمعايير للحكم عليها بموضوعية."],["الاستنباط","الانتقال من قاعدة عامة إلى نتيجة خاصة."],["الاستقراء","الانتقال من أمثلة خاصة إلى تعميم."],["الافتراض","فكرة مسلّم بها ضمناً تقوم عليها الحجة؛ كشفها مهارة ناقدة."],["ما وراء المعرفة","التفكير في التفكير: تخطيط ومراقبة وتقويم العمليات المعرفية."],["التفكير التأملي","مراجعة الخبرة والتفكير فيما جرى لتحسين الأداء."],["مهارات التفكير العليا","التحليل والتقويم والإبداع في تصنيف بلوم المعدل."],["التفكير العلمي","تفكير منظم يتبع خطوات الطريقة العلمية للوصول إلى نتائج قابلة للتحقق."],["الاستدلال","استخلاص نتيجة من أدلة وحقائق كافية مرتبطة بالمعرفة السابقة."]],"intro":[],"ex":[]},{"h":"التفكير الإبداعي ومراحله","pts":["**[[التفكير الإبداعي|ar.l10.creative]]** ينتج حلولاً جديدة أصيلة، وأساسه **التفكير التباعدي** (جيلفورد).","«استخدامات القلم»: عدد الإجابات طلاقة، وتنوع فئاتها مرونة، والنادرة أصالة، والتفاصيل إفاضة.","مراحل **والاس**: الإعداد ← الاحتضان ← الإلهام ← التحقق؛ فالإلهام بعد الاحتضان لا قبله.","**العصف الذهني** (أوزبورن): الكم قبل الكيف وإرجاء الحكم؛ فلا نقد للأفكار أثناء طرحها.","**معوقاته**: الخوف من الخطأ، والنقد المبكر، والجمود الذهني.","**[[أدوات توليد الأفكار|ar.l10.creatools]]**: الأسئلة المفتوحة («ماذا لو؟»)، وسكامبر، والتفكير الجانبي، والإثارة العشوائية."],"t":[["الطلاقة","القدرة على توليد أكبر عدد من الأفكار في زمن محدد."],["المرونة","تنويع الأفكار وتغيير الزاوية؛ عكس الجمود الذهني."],["الأصالة","إنتاج أفكار نادرة غير مألوفة."],["الإفاضة (التوسع)","إضافة تفاصيل وتوضيحات إلى الفكرة."],["الحساسية للمشكلات","الوعي بوجود مشكلات أو نواقص لا يلاحظها الآخرون."],["الاحتضان","مرحلة ترك المشكلة تختمر لا شعورياً قبل الإلهام."],["العصف الذهني","توليد أكبر عدد من الأفكار جماعياً مع إرجاء الحكم (أوزبورن)."],["الجمود الذهني","التمسك بطريقة واحدة في النظر إلى المشكلة."],["المرونة التكيفية","تغيير زاوية التفكير لتناسب تغيّر الموقف."],["الإثارة العشوائية","ربط مفهومين لا علاقة بينهما لتوليد أفكار إبداعية."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Torrance — Components of Creativity","مكونات الإبداع (جيلفورد وتورانس)"],"groups":[{"n":"الطلاقة","ar":"**عدد** الأفكار.","items":[{"n":"لفظية"},{"n":"فكرية"},{"n":"أشكال"},{"n":"تداعي"}],"d":"ar.l10.creatools"},{"n":"المرونة","ar":"**تنوع** فئات الأفكار وتغيير الزاوية.","items":[{"n":"تكيفية"},{"n":"تلقائية"}],"d":"ar.l10.creatools"},{"n":"الأصالة","ar":"**ندرة** الفكرة وجدّتها.","d":"ar.l10.creative"},{"n":"الإفاضة","ar":"إضافة **التفاصيل**.","d":"ar.l10.creative"},{"n":"الحساسية للمشكلات","ar":"رؤية ما لا يراه الآخرون.","d":"ar.l10.creative"}]}},{"h":"برامج التفكير: ديبونو وهيرمان وغيرهما","pts":["**[[القبعات الست|ar.l10.debono]]** تعلّم النظر من زوايا متعددة وتفصل الأنا عن الفكرة.","«أشعر أنها لا تعجبني» بلا تبرير = **الحمراء**، و«ستفشل لأن…» = السوداء.","**برنامج كورت** (ديبونو): تعليم مباشر للتفكير في ست وحدات، ومن أدواته PMI (إيجابيات، سلبيات، مثير للاهتمام).","**[[هيرمان|ar.l10.progs]]**: أربعة أنماط تفكير: A تحليلي، B منظم، C عاطفي اجتماعي، D تخيّلي.","**التقاربي** إجابة واحدة صحيحة، و**التباعدي** إجابات متعددة؛ والاختبارات الموضوعية تقيس التقاربي غالباً.","استراتيجيات صفية للتفكير: **الأسئلة السابرة**، والخرائط الذهنية (بوزان) والمفاهيمية (نوفاك)، والمناظرة، ولعب الأدوار."],"t":[["القبعة السوداء","التفكير الناقد الحذر: المخاطر والسلبيات."],["القبعة الخضراء","التفكير الإبداعي: البدائل والأفكار الجديدة."],["القبعة الزرقاء","ضبط عملية التفكير وتنظيمها والخلاصة."],["برنامج كورت","برنامج ديبونو لتعليم مهارات التفكير تعليماً مباشراً."],["مقياس هيرمان","نموذج أنماط التفكير الأربعة وفق السيطرة الدماغية."],["التفكير التقاربي","التوصل إلى الحل الصحيح الوحيد."],["الأسئلة السابرة","أسئلة متتابعة تعمّق إجابة الطالب وتوضحها."]],"intro":[],"ex":[],"map":{"type":"fan","title":["de Bono — Six Thinking Hats","قبعات ديبونو الست"],"groups":[{"n":"البيضاء","ar":"حقائق ومعلومات: «ما الأرقام؟»","c":"#64748B","d":"ar.l10.debono"},{"n":"الحمراء","ar":"مشاعر وحدس.","c":"#B42318","d":"ar.l10.debono"},{"n":"السوداء","ar":"حذر وسلبيات ومخاطر.","c":"#475467","d":"ar.l10.debono"},{"n":"الصفراء","ar":"إيجابيات وفوائد.","c":"#A15C07","d":"ar.l10.debono"},{"n":"الخضراء","ar":"إبداع وبدائل.","c":"#1F6B4C","d":"ar.l10.debono"},{"n":"الزرقاء","ar":"ضبط التفكير والخلاصة: «لنلخص».","c":"#2F6690","d":"ar.l10.debono"}]}},{"h":"عادات العقل وأثر الاتجاهات والقيم في التعلم","pts":["**[[عادات العقل|ar.l10.habits]]** (كوستا وكاليك): سلوكيات ذكية عند مشكلة لا يُعرف حلها فوراً؛ ميل يُتعلم ويُنمّى (16 عادة).","لا يستسلم = المثابرة، ويراجع حله = الكفاح من أجل الدقة، ويقرأ السؤال كاملاً = **التحكم بالتهور**.","يعيد صياغة كلام زميله = الإصغاء بتفهم، ويصف كيف وصل = التفكير حول التفكير.","تنميتها بتسميتها للطلاب، والنمذجة بالتفكير بصوت مسموع، وتعزيز ظهورها.","**[[الاتجاه|ar.l10.attitude]]** استعداد مكتسب مكوناته معرفي ووجداني وسلوكي؛ والسلبي («لست جيداً») نبوءة تحقق ذاتها.","يُعدَّل الاتجاه بخبرات النجاح وربط المادة بحياة الطالب والقدوة، لا بالوعظ ولا بالإجبار.","**القيم**: إذا رأى الطالب المحتوى متصلاً بقيمه زاد اندماجه."],"t":[["عادات العقل","أنماط من السلوك الذكي يوظفها المتعلم عند مواجهة مشكلات لا يعرف حلها فوراً (كوستا وكاليك)."],["التحكم بالتهور","عادة عقل: التأني والتفكير وفهم المهمة قبل البدء."],["الكفاح من أجل الدقة","عادة عقل: مراجعة العمل وتجويده حتى يخلو من الأخطاء."],["مكونات الاتجاه","معرفي (معتقدات)، ووجداني (مشاعر)، وسلوكي (ميل للفعل)."]],"intro":[],"ex":[]}],"trap":["**الدافعية الداخلية** من المهمة نفسها؛ **الخارجية** من المكافأة؛ والإغراق بالمكافآت يضعف الداخلية.","[[عزو الفشل|ar.l10.weiner]] إلى **الجهد** (متغير قابل للضبط) يحفّز؛ إلى **القدرة** (ثابت) يحبط؛ وجّه الطالب للأول.","**العجز المتعلم** تعميم الفشل والتوقف عن المحاولة رغم القدرة؛ **الإحباط** انفعال مؤقت عند إعاقة هدف.","الأداء الأفضل عند قلق **متوسط** ([[يركس–دودسون|ar.l10.achieve]])، لا عند انعدامه.","**[[سبيرمان|ar.l10.factor]]** عامل عام، **ثيرستون** قدرات أولية، **جيلفورد** بنية العقل، **جاردنر** ذكاءات متعددة، **ستيرنبرغ** ثلاثي، **جولمان** وجداني.","70–85 **بطيء التعلم**، أقل من 70 **إعاقة فكرية**، 130+ **موهوب**؛ ونسبة الذكاء ثابتة نسبياً.","**الناقد** يقوّم ويفرز؛ **الإبداعي** يولّد؛ «اختر أفضل الأفكار» ناقد، «اقترح أفكاراً» إبداعي.","**[[الطلاقة|ar.l10.creative]]** كم، **المرونة** تنوع، **الأصالة** ندرة، **الإفاضة** تفاصيل.","**[[ما وراء المعرفة|ar.l10.meta]]** التفكير في التفكير؛ القراءة أو الحفظ مهارة معرفية لا ما وراء معرفية.","مراحل الإبداع: إعداد ← **احتضان** ← **إلهام** ← تحقق؛ الإلهام بعد الاحتضان لا قبله.","في العصف الذهني **لا نقد أثناء التوليد**؛ النقد المبكر أكبر معوّق.","[[القبعة|ar.l10.debono]] **السوداء** حذر وسلبيات، **الصفراء** فوائد، **الحمراء** مشاعر، **البيضاء** حقائق، **الخضراء** إبداع، **الزرقاء** ضبط."],"vid":[["8sgLeGd2EFk","حل تطبيقات المعيار الخامس المعرفة بالمتعلم وكيفية تعلمه","سهام الزهراني",37],["6lHnqCARoOE","10 دقائق مع اختبار الرخصة: شرح التفكير وأهم مهاراته","أكاديمية همة",11],["2lWZb3hU-vk","الذكاء والذكاءات المتعددة","سلوى البحيري",10],["KSZmIyjOWbY","10 أسرار لاختبار الرخصة المهنية (طريقة التفكير في الأسئلة)","منصة البراعة",103]],"map":null,"n":10},{"id":"L05","d":"K","std":"4","sub":"4.1–4.3","ar":"المهارات اللغوية: الاستيعاب والإملاء والتعبير","goal":"تجيب بثقة عن أسئلة القطعة القصيرة (الفكرة الرئيسة، معنى الكلمة من السياق، الغرض، الاستنتاج)، وتميّز الكتابة الإملائية الصحيحة (الهمزات، التاء، الألف اللينة، الضاد والظاء، الترقيم)، وتضبط التراكيب النحوية الأساسية التي يسألها الاختبار.","sec":[{"h":"استيعاب المقروء (4.1)","pts":["القاعدة الحاكمة: الحكم **من النص** لا من معلوماتك؛ البديل الذي يعارض النص أو يزيد عليه مرفوض ولو صح واقعياً.","**[[الفكرة الرئيسة|ar.l05.mainidea]]** يدور حولها النص كله؛ والبديل الذي يذكر جزئية صحيحة منه مشتت، والعنوان المناسب يجمعها بأقل كلمات.","**[[معنى الكلمة من السياق|ar.l05.context]]**: جرّب كل بديل مكانها في جملتها؛ وما يستقيم به المعنى هو الصحيح.","**الاستنتاج** معنى لم يُصرَّح به تدل عليه القرائن؛ فما ورد نصاً ليس استنتاجاً.","[[الغرض والعلاقات بين الجمل|ar.l05.rel]]: إخبار أو إقناع أو حث أو تحذير؛ والعلاقة طردية أو عكسية أو **سبب ونتيجة** أو تمثيل.","**عود الضمير** على أقرب اسم يستقيم به المعنى، لا على أقرب اسم في اللفظ.","**الاستفهام المنفي** «ألم تسافر؟»: جوابه في الإثبات «بلى»، وفي النفي «نعم»."],"t":[["الفكرة الرئيسة","المعنى العام الذي تدور حوله جُمل النص كلها، وتخدمه الأفكار الفرعية."],["الفكرة الفرعية","تفصيل أو دليل أو مثال يدعم الفكرة الرئيسة ويرد في جزء من النص."],["الاستنتاج","معنى غير مصرّح به يُفهم من مجموع المعطيات في النص."],["الغرض","ما يريده الكاتب من القارئ: الإخبار أو الإقناع أو الحث أو التحذير."],["الترادف","اتفاق كلمتين أو جملتين في المعنى."],["التضاد","كلمتان أو جملتان إحداهما عكس الأخرى في المعنى."],["علاقة طردية","زيادة الأول تصحبها زيادة الثاني (زاد التلوث فساء الوضع الصحي)."]],"intro":[],"ex":[]}],"trap":[],"vid":[["HmBm4ZF8R-U","حل أسئلة تطبيقات المعيار الرابع من الرخصة المهنية","سهام الزهراني",47]],"n":5,"locked":true},{"id":"L06","d":"K","std":"4","sub":"4.4–4.5","ar":"المهارات الكمية: الأعداد والنسب والإحصاء وقراءة البيانات","goal":"تحل بدقة وسرعة مسائل النسبة المئوية والتناسب والتقريب والقياس والسرعة والتقويم، وتحسب المتوسط والوسيط والمنوال والمدى والدرجة المعيارية، وتقرأ الجداول والأعمدة والقطاعات الدائرية قراءة صحيحة.","sec":[{"h":"الأعداد والعمليات والتقريب (4.4)","pts":["**[[القيمة المنزلية|ar.l06.place]]** = الرقم وبعده أصفار بعدد المنازل على يمينه (9 في 59831 = 9000).","**التقريب**: انظر إلى الرقم التالي فقط؛ 5 فأكثر زد واحداً وأقل من 5 احذف (28.0153 ≈ 28.02 لأقرب جزء من مئة).","**[[قابلية القسمة|ar.l06.div]]**: على 3 إذا قبل مجموع الأرقام القسمة على 3، وعلى 6 إذا قبل 2 و3 معاً.","**العدد الأولي** لا يقبل القسمة إلا على نفسه و1؛ والعدد 1 ليس أولياً، و2 الأولي الزوجي الوحيد.","**القاسم المشترك الأكبر** لـ16 و28 = 4، و**المضاعف المشترك الأصغر** لـ4 و6 = 12.","**[[مقارنة الكسور|ar.l06.frac]]**: حوّلها إلى عشري (2/3 ≈ 0.67، 3/5 = 0.6)؛ وعند تساوي البسط فذو المقام الأصغر أكبر.","**المعادلة البسيطة**: اعزل المجهول بعمليات عكسية (3س + 7 = 22 ← س = 5) ثم تحقق بالتعويض."],"t":[["القيمة المنزلية","قيمة الرقم بحسب موقعه في العدد (الرقم 3 في 6305 قيمته 300)."],["العدد الأولي","عدد أكبر من 1 لا يقبل القسمة إلا على نفسه وعلى الواحد."],["القاسم المشترك الأكبر","أكبر عدد يقسم عددين أو أكثر دون باقٍ."],["المضاعف المشترك الأصغر","أصغر عدد موجب يقبل القسمة على عددين أو أكثر."],["الكسر غير الفعلي","كسر بسطه أكبر من مقامه أو يساويه (7/4)."],["التقريب لأقرب عُشر","إبقاء منزلة عشرية واحدة مع النظر إلى المنزلة التالية (1.87 ≈ 1.9)."]],"intro":[],"ex":[]}],"trap":[],"vid":[["HmBm4ZF8R-U","حل أسئلة تطبيقات المعيار الرابع من الرخصة المهنية","سهام الزهراني",47],["eZbNJ4p68zE","الكمي في الرخصة المهنية (مقاييس النزعة المركزية والتشتت)","منصة ميم التعليمية",39],["AeM5oC30eik","مقاييس النزعة المركزية (المنوال - المتوسط - الوسيط)","سلوى البحيري",16]],"n":6,"locked":true},{"id":"L15","d":"P","std":"10","sub":"10.1، 10.2","ar":"التقويم: مفاهيمه وأنواعه وأدواته وبناء الاختبار","goal":"تميّز بين القياس والتقييم والتقويم، وتصنّف أي موقف تقويمي بزمنه ومرجعه وأداته، وتعرف قواعد صياغة كل نوع من الأسئلة وخطوات بناء الاختبار التحصيلي كما يسألها الاختبار.","sec":[{"h":"المفاهيم الأساسية: القياس والتقييم والتقويم والاختبار","pts":["الاختبار **التحصيلي** يقيس ما تعلمه فعلاً، و**الاستعداد** يتنبأ بالتعلم مستقبلاً، والذكاء للقدرة العقلية العامة.","الاختبار **المقنن** يعده متخصصون بتعليمات موحدة ومعايير، بخلاف اختبار المعلم.","التقويم الجيد مستمر، شامل لجوانب المتعلم، تعاوني، **علمي** (صادق وثابت وموضوعي)، واقتصادي.","[[مواصفات الاختبار الجيد|ar.l15.eval]]: الصدق، والثبات، والموضوعية، و**التمييز**، و**الشمول** للمحتوى."],"t":[["القياس","تقدير كمّي للسمة بالأرقام وفق قاعدة، دون إصدار حكم."],["التقييم","إصدار حكم على قيمة الأداء في ضوء محك أو معيار."],["التقويم","عملية منظمة تصدر حكماً ثم تتخذ قرار التعديل والعلاج؛ أعم من القياس والتقييم."],["الاختبار","أداة قياس مكوّنة من مجموعة فقرات تستثير استجابات الطالب."],["الاختبار التحصيلي","اختبار يقيس ما اكتسبه الطالب من معارف ومهارات بعد التعلم."],["اختبار الاستعداد","اختبار يتنبأ بقدرة الفرد على التعلم أو النجاح مستقبلاً."],["الاختبار المقنن","اختبار معدّ من متخصصين بتعليمات وظروف موحدة وله معايير لتفسير الدرجات."],["الشمول","تغطية الاختبار لجوانب المحتوى والأهداف كلها بأوزانها."],["التقويم التربوي","إصدار حكم على التعلم في ضوء معيار يتبعه تعديل وعلاج."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Measurement, Assessment, Evaluation","القياس ← التقييم ← التقويم"],"groups":[{"n":"القياس","ar":"**رقم** بلا حكم.","items":[{"n":"«حصل خالد على 18 من 25»"}],"d":"ar.l15.terms"},{"n":"التقييم","ar":"**حكم** بمعيار.","items":[{"n":"«مستواه جيد جداً»"}],"d":"ar.l15.terms"},{"n":"التقويم","ar":"حكم يتبعه **تعديل وعلاج**؛ وهو الأشمل.","items":[{"n":"«يحتاج تدريباً على الكسور وسأعطيه ورقة علاجية»"}],"d":"ar.l15.terms"},{"n":"الاختبار","ar":"**أداة** قياس، لا نوع من التقويم.","d":"ar.l15.terms"}]}},{"h":"أنواع التقويم بالزمن والغرض وبالمرجع","pts":["[[**القبلي**|ar.l15.types]] (التشخيصي) قبل التعلم: المتطلبات السابقة والاستعداد ونقاط القوة والضعف.","**التكويني (البنائي)** أثناء التدريس لتحسين التعلم وتعديل التدريس، لا لحكم نهائي؛ ويُسمى التقويم المستمر.
