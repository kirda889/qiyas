<style>
/* Layout: a teacher's planning register — chalk-green ink on cool off-white, a brass highlight for key terms, bubble answer sheet for exams. Fully RTL. */
:root{
  --paper:#F2F5F3; --sheet:#FFFFFF; --ink:#172420; --muted:#44534D; --rule:#D9E1DD; --rule-strong:#BFCCC6;
  --accent:#1F6B4C; --accent-ink:#FFFFFF; --accent-soft:#DDEFE5;
  --hl:#F3DFA0; --hl-ink:#3D2E00;
  --good:#1B7A4A; --good-soft:#DFF1E6; --bad:#B4231C; --bad-soft:#FBE3E0; --warn:#9A5B00;
  --dV:#8A5A14; --dK:#1F6B4C; --dP:#2C4FA6;
  --shadow:0 1px 0 rgba(23,36,32,.06), 0 6px 18px -10px rgba(23,36,32,.25);
  --f-ar:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-display:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1512; --sheet:#171F1B; --ink:#E6ECE8; --muted:#B3C0BA; --rule:#27332D; --rule-strong:#36453E;
  --accent:#5BC093; --accent-ink:#062116; --accent-soft:#17312A;
  --hl:#5A4A1C; --hl-ink:#FFF0C2;
  --good:#5CC48D; --good-soft:#15301F; --bad:#F2867A; --bad-soft:#3A1A17; --warn:#E3A84A;
  --dV:#E0A54C; --dK:#5BC093; --dP:#7FA6E8;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F1512; --sheet:#171F1B; --ink:#E6ECE8; --muted:#B3C0BA; --rule:#27332D; --rule-strong:#36453E;
  --accent:#5BC093; --accent-ink:#062116; --accent-soft:#17312A;
  --hl:#5A4A1C; --hl-ink:#FFF0C2;
  --good:#5CC48D; --good-soft:#15301F; --bad:#F2867A; --bad-soft:#3A1A17; --warn:#E3A84A;
  --dV:#E0A54C; --dK:#5BC093; --dP:#7FA6E8;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
#app{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
strong{font-weight:600;background:linear-gradient(transparent 60%,var(--hl) 60%);padding:0 .08em}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.5;text-wrap:balance;margin:0}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);margin-inline:-16px;padding:10px 16px}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .seal{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.95rem;flex:none}
.brand b{font-family:var(--f-display);font-weight:600;font-size:1rem;white-space:nowrap}
.brand span{display:block;font-size:.74rem;color:var(--muted);line-height:1.3;white-space:nowrap}
.count{margin-inline-start:auto;text-align:center;line-height:1.1}
.count .n{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;color:var(--accent)}
.count .l{font-size:.7rem;color:var(--muted)}
.nav{display:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:4px 0;border-radius:8px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
@media (min-width:760px){
  .tabbar{display:none}
  .nav{display:flex;gap:4px;margin-inline-start:18px}
  .nav button{background:none;border:0;padding:6px 12px;border-radius:999px;color:var(--muted);font-size:.92rem}
  .nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #app{padding-bottom:60px}
}

/* sheets & cards */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.section-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.section-title h2{font-size:1.08rem}
.section-title .line{flex:1;height:1px;background:var(--rule-strong)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 20px;font-weight:600;font-size:.95rem;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--rule-strong);color:var(--ink);font-weight:500}
.btn.sm{padding:6px 14px;min-height:36px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.76rem;border:1px solid var(--rule-strong);color:var(--muted);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.done{border-color:var(--good);color:var(--good)}
.chip.hot{border-color:var(--warn);color:var(--warn)}
.code{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);direction:ltr;unicode-bidi:isolate}

/* home */
.today{display:grid;gap:14px}
.today .kicker{font-size:.8rem;color:var(--muted)}
.today h1{font-size:1.4rem}
.domains{display:grid;gap:10px}
.dom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.dom .name{display:flex;gap:8px;align-items:center;min-width:0}
.dom .name b{font-weight:600;font-size:.95rem}
.dom .w{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:10px;border-radius:999px;background:var(--rule);overflow:hidden;position:relative}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--f-mono);font-size:1.45rem;font-weight:600;line-height:1.2}
.stat .k{font-size:.8rem;color:var(--muted)}
.set-date{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.set-date input{border:1px solid var(--rule-strong);background:var(--paper);border-radius:8px;padding:8px 10px;min-height:44px}
.stdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stdc{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;display:grid;gap:4px;text-align:start}
.stdc .sn{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between}
.stdc .st{font-weight:600;font-size:.86rem;line-height:1.5}
.stdc .bar{height:6px}

/* plan */
.plan{display:grid;gap:8px}
.day{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.day .dn{font-family:var(--f-mono);text-align:center;line-height:1.1}
.day .dn b{display:block;font-size:1.15rem}
.day .dn span{font-size:.68rem;color:var(--muted)}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day .what{min-width:0}
.day .what .t{font-weight:600}
.day .what .s{font-size:.82rem;color:var(--muted)}
.day.light{opacity:.85}
.bub{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;flex:none}
.bub.on{background:var(--good);border-color:var(--good)}
.bub.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sheet)}

/* lessons list */
.lgroup{display:grid;gap:8px}
.lcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;text-align:start;width:100%}
.lcard .idx{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);width:34px;text-align:center}
.lcard .t{font-weight:600;line-height:1.5}
.lcard .s{font-size:.82rem;color:var(--muted)}
.dhead{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.dhead .sw{width:12px;height:12px;border-radius:3px}
.dhead h2{font-size:1.05rem}
.dhead .w{margin-inline-start:auto;font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}

/* lesson view */
.lesson-head{display:grid;gap:8px;padding-top:18px}
.goal{border-inline-start:3px solid var(--accent);padding-inline-start:12px}
.lsec{display:grid;gap:10px;padding:18px 0;border-bottom:1px dashed var(--rule-strong)}
.lsec:last-of-type{border-bottom:0}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pts li{border-inline-start:3px solid var(--rule-strong);padding-inline-start:10px;line-height:1.8}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.term{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;min-width:0}
.term .tn{font-weight:600;font-size:.95rem}
.term .td{font-size:.86rem;color:var(--muted);line-height:1.7}
.traps{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:var(--r);padding:14px 16px}
.traps h3{color:var(--bad);margin-bottom:6px}
.traps ul{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.vids{display:grid;gap:8px}
.vid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;text-decoration:none;color:inherit}
.vid .play{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.vid .vt{font-weight:500;line-height:1.5}
.vid .vc{font-size:.8rem;color:var(--muted)}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;padding:12px 0}
.progress{flex:1;height:6px;background:var(--rule);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;min-width:64px;text-align:center;direction:ltr}
.timer.low{color:var(--bad)}
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qtext{font-size:1.06rem;line-height:1.9;font-weight:500;white-space:pre-line}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:start;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:.98rem;line-height:1.6;min-height:48px;width:100%}
.opt .b{width:28px;height:28px;border-radius:50%;border:2px solid var(--rule-strong);display:grid;place-items:center;font-family:var(--f-display);font-size:.85rem;font-weight:600;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .b{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .b{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt:disabled{cursor:default}
.explain{margin-top:14px;border-radius:10px;padding:12px 14px;border:1px solid var(--rule)}
.explain.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.explain.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.explain b{display:block;margin-bottom:2px}
.qnav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.grid88{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.gq{height:34px;border-radius:50%;border:1.5px solid var(--rule-strong);background:var(--sheet);font-family:var(--f-mono);font-size:.72rem;color:var(--muted);padding:0}
.gq.ans{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.gq.cur{outline:2px solid var(--accent);outline-offset:2px}
.gq.flag{border-color:var(--warn);border-width:3px}
.confirm{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px}

/* results */
.score{display:flex;align-items:baseline;gap:10px}
.score .big{font-family:var(--f-mono);font-size:3rem;font-weight:600;line-height:1}
.rlist{display:grid;gap:10px}
.ritem{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.ritem .qtext{font-size:.95rem}
.ans-line{font-size:.9rem}
.ans-line .y{color:var(--bad);text-decoration:line-through}
.ans-line .c{color:var(--good);font-weight:600}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.mode{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px;text-align:start;display:grid;gap:6px;align-content:start;width:100%}
.mode .mt{font-family:var(--f-display);font-weight:600;font-size:1rem}
.mode .md{font-size:.85rem;color:var(--muted);line-height:1.7}
.mode .mx{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:.85rem;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* flashcards */
.fc{perspective:1200px}
.fc-in{position:relative;min-height:220px;border-radius:14px;border:1px solid var(--rule);background:var(--sheet);box-shadow:var(--shadow);display:grid;place-items:center;padding:24px;text-align:center;cursor:pointer;width:100%}
.fc-front{font-family:var(--f-display);font-size:1.45rem;font-weight:600;line-height:1.5}
.fc-back{font-size:1.08rem;line-height:1.9}
.fc-hint{position:absolute;bottom:10px;inset-inline:0;font-size:.75rem;color:var(--muted)}

/* sheet (night-before) */
.hy{display:grid;gap:14px}
.hy-l{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 16px}
.hy-l h3{font-size:.98rem;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.hy-l ul{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:.93rem}
.tips{display:grid;gap:8px;counter-reset:t}
.tip{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.tip::before{counter-increment:t;content:counter(t);font-family:var(--f-mono);font-weight:600;width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:.8rem}

.sync{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--rule-strong)}
.sync.on i{background:var(--good)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:50;box-shadow:var(--shadow)}
textarea.report{width:100%;min-height:180px;border:1px solid var(--rule-strong);border-radius:8px;padding:10px;background:var(--paper);font-family:var(--f-mono);font-size:.8rem}
@media (prefers-reduced-motion:no-preference){
  .opt,.btn,.day,.lcard,.mode{transition:border-color .15s,background-color .15s,transform .15s}
  .lcard:active,.day:active,.mode:active{transform:scale(.99)}
}

/* credit card */
.credit{display:flex;align-items:center;gap:14px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 16px}
.credit .cm{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.credit .cm svg{width:22px;height:22px}
.credit .ck{font-size:.78rem;color:var(--muted);letter-spacing:.01em}
.credit .cn{font-family:var(--f-display);font-weight:600;font-size:1.06rem;line-height:1.5}
.credit .vcount{margin-inline-start:auto;display:flex;flex-direction:column;align-items:center;line-height:1.35;padding-inline-start:14px;border-inline-start:1px solid var(--rule)}
.credit .vcount[hidden]{display:none}
.credit .vcount-n{font-weight:700;font-size:1.06rem;font-variant-numeric:tabular-nums}

/* theme toggle, simpler home */
.themebtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);display:grid;place-items:center;flex:none;padding:0}
.themebtn svg{width:18px;height:18px}
.or{font-size:.88rem;color:var(--muted)}
.path{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.path b{color:var(--accent);font-weight:600}
details.prog{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:0 16px}
details.prog>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;font-family:var(--f-display);font-weight:600;font-size:1.02rem}
details.prog>summary::-webkit-details-marker{display:none}
details.prog>summary .hint{font-family:var(--f-ar);font-weight:400;font-size:.8rem;color:var(--muted);margin-inline-start:auto}
details.prog>summary svg{width:18px;height:18px;flex:none;transition:transform .2s}
details.prog[open]>summary svg{transform:rotate(180deg)}
details.prog .pin{display:grid;gap:14px;padding-bottom:16px}

@media (max-width:430px){.brand span{display:none}}
.count .btn{white-space:nowrap}

/* readability: larger base, heavier weight, stronger secondary text */
html{font-size:112.5%}
@media (max-width:430px){html{font-size:106.25%}}
body{font-size:1rem;font-weight:500}
.small{font-size:.92rem}
.muted{color:var(--muted)}

    { h: "9.3 (أ) تعديل السلوك: التعزيز والعقاب وأساليبهما",

    { h: "9.3 (ب) بيئة آمنة: التعامل مع المشكلات السلوكية والفئات والسلامة",

      "الفقرة **فكرة واحدة**: **جملة رئيسة** تعلن الفكرة ← **جمل داعمة** تشرح وتدلل ← **جملة ختامية** تلخص أو تمهد لما بعدها.",
      "**الشواهد**: آية أو حديث، إحصاء موثق، مثال واقعي، قول مختص، تجربة شخصية؛ والشاهد يجب أن **يخدم الفكرة مباشرة** وأن يُذكر مصدره.",
      "**وحدة الفقرة**: كل جملة تخدم الفكرة الرئيسة؛ الجملة الخارجة عنها تُحذف ولو كانت صحيحة.",
      "**أدوات الربط** بحسب العلاقة: إضافة (كذلك، علاوة على ذلك)، تعليل (لأن، إذ)، نتيجة (لذا، لذلك، ومن ثَم)، استدراك وتقابل (لكن، في المقابل، غير أن)، تمثيل (مثل، على سبيل المثال)، ترتيب (أولاً، ثم، أخيراً).",
      "**الترابط**: تتابع منطقي للأفكار (من العام إلى الخاص، أو بحسب الزمن أو الأهمية) دون قفز أو تكرار.",
      "خطوات الكتابة: تخطيط (الفكرة والشواهد) ← مسودة ← مراجعة المحتوى والتنظيم ← تحرير لغوي وإملائي وترقيم ← نسخة نهائية.",
      "أخطاء شائعة: معلومات متفرقة بلا جملة رئيسة، رأي بلا دليل، أداة ربط لا تناسب العلاقة بين الجملتين."
    ],
    t: [
      ["الجملة الرئيسة", "جملة تعلن فكرة الفقرة وتأتي غالباً في أولها."],
      ["الجمل الداعمة", "جمل تشرح الفكرة الرئيسة وتدعمها بالأمثلة والشواهد."],
      ["وحدة الفقرة", "أن تخدم جميع جمل الفقرة فكرة واحدة."],
      ["أدوات الربط", "كلمات تربط الجمل وتوضح العلاقة بينها: تعليل، نتيجة، استدراك، تمثيل، ترتيب."]
    ] },
  { h: "الكتابة الوظيفية: المحضر والتقرير (4.2)",
    pts: [
      "مؤشر 4.2 للممارس: **يحدد الهيكل التنظيمي لأنواع الكتابة الوظيفية، ويطبق أنواعها المتصلة بمهنته ككتابة التقارير والمحاضر**.",
      "سمات الكتابة الوظيفية: **الوضوح، الإيجاز، الدقة، الموضوعية، الالتزام بالشكل المعتمد**، بعيداً عن الأسلوب الأدبي.",
      "**المحضر** وثيقة رسمية **تسجل ما دار في اجتماع**؛ هيكله: الجهة وعنوان الاجتماع ← **التاريخ والوقت والمكان** ← **الحاضرون والغائبون** ← **جدول الأعمال** ← ملخص المناقشات ← **القرارات والتوصيات** مع المكلف والموعد ← **التوقيعات**.",
      "يكتب المحضر **المقرر (أمين السر)** بصيغة الماضي ودون رأي شخصي، ويعتمده الحاضرون بالتوقيع، ويُحفظ مرجعاً لمتابعة التنفيذ.",
      "**التقرير** عرض مكتوب منظم **لواقع أو مهمة أو نشاط أو نتائج** يُرفع لجهة مختصة؛ هيكله: العنوان ← المقدمة (الهدف والمجال) ← العرض (الإجراءات والوقائع والبيانات) ← **النتائج** ← **التوصيات** ← اسم المعد وتاريخه وتوقيعه.",
      "الفرق: **المحضر** يوثق **اجتماعاً**، و**التقرير** يصف **عملاً أو حالة** وينتهي بنتائج وتوصيات، و**الخطاب** مراسلة بين طرفين، و**التعميم** خطاب واحد موجّه إلى جهات متعددة.",
      "من كتابات المعلم المهنية: تقرير نتائج الطلاب لولي الأمر، تقرير نشاط أو رحلة، تقرير حالة طالب، محضر اجتماع لجنة أو مجتمع تعلم، و**محضر ضبط واقعة** سلوكية من نماذج قواعد السلوك والمواظبة."
    ],
    t: [
      ["المحضر", "وثيقة رسمية تسجل وقائع اجتماع: الحضور وجدول الأعمال والمناقشات والقرارات والتوقيعات."],
      ["التقرير", "عرض مكتوب منظم لعمل أو حالة ينتهي بالنتائج والتوصيات."],
      ["المقرر (أمين السر)", "عضو الاجتماع المكلف بتدوين المحضر."],
      ["جدول الأعمال", "قائمة الموضوعات المقرر مناقشتها في الاجتماع بترتيبها."]
    ] },
  { h: "التحدث ولغة الجسد والقراءة الجهرية والصامتة (4.3)",
    pts: [
      "مؤشرا 4.3 للممارس: **يتحدث بثقة وطلاقة وبلغة صحيحة ويراعي توظيف لغة الجسد**، و**يقرأ النصوص قراءة صحيحة معبرة عن المعنى موظفاً مهارات القراءة الجهرية والصامتة**.",
      "**التحدث الجيد**: فصحى ميسرة سليمة، أفكار مرتبة، صوت مسموع لآخر الصف، **تنويع النبرة والسرعة**، **وقفات** مقصودة، وتجنب الحشو والكلمات المكررة.",
      "**لغة الجسد المناسبة**: **تواصل بصري** مع جميع الطلاب، إشارات **متسقة مع الكلام**، حركة هادفة في الصف، تعبيرات وجه تناسب المعنى؛ والتعارض بين اللفظ والإشارة يضعف الرسالة.",
      "عادات تضعف الحديث: النظر إلى الورقة أو السقف طوال الوقت، العبث بالقلم، إدارة الظهر للطلاب أثناء الشرح، الوقوف في مكان واحد، الإفراط في الحركة.",
      "**القراءة الجهرية**: إخراج الحروف من مخارجها، ضبط أواخر الكلمات، **تمثيل المعنى بالتنغيم**، **الوقف عند علامات الترقيم**؛ تكشف أخطاء النطق وتنمي الطلاقة والجرأة.",
      "**القراءة الصامتة**: فهم النص بالعين دون صوت أو تحريك شفاه؛ **أسرع** و**أعمق فهماً** وأكثر استعمالاً في الحياة والبحث.",
      "في درس القراءة للصفوف العليا يتقدم الفهم على الأداء غالباً: قراءة صامتة للمعنى العام ← **قراءة نموذجية** من المعلم ← قراءات جهرية للطلاب ← مناقشة.",
      "خطأ الطالب أثناء القراءة الجهرية: **لا يُقاطَع عند كل خطأ**؛ يُترك ليكمل الجملة ثم يُصوَّب بلطف يحفظ ثقته."
    ],
    t: [
      ["القراءة الجهرية", "نطق المقروء بصوت مع سلامة المخارج والضبط وتمثيل المعنى."],
      ["القراءة الصامتة", "إدراك المعنى بالعين دون صوت؛ أسرع وأعمق فهماً."],
      ["القراءة النموذجية", "قراءة جهرية متقنة يقدمها المعلم ليحاكيها الطلاب."],
      ["التواصل البصري", "توجيه النظر إلى المستمعين جميعاً أثناء الحديث."]
    ] }
],

"L06": [
  { h: "تصميم الاستبانة وضبطها علمياً (4.5)",
    pts: [
      "مؤشر 4.5 للممارس: **يحدد معايير تصميم أدوات جمع البيانات في البحوث المسحية كالاستبانة، وأساليب ضبطها علمياً، ويطبقها في جمع البيانات**.",
      "**الاستبانة** عبارات أو أسئلة مكتوبة يجيب عنها المستجيب بنفسه؛ تناسب جمع **الآراء والاتجاهات** من عدد كبير في وقت قصير.",
      "مكوناتها: **خطاب تمهيدي** (الهدف وسرية البيانات) ← **بيانات أولية** (متغيرات الدراسة) ← **محاور** تعكس أسئلة البحث ← عبارات كل محور ← طريقة الاستجابة.",
      "صياغة العبارات: **فكرة واحدة في كل عبارة**، لغة بسيطة مباشرة، تجنب **النفي ونفي النفي**، تجنب **الأسئلة الإيحائية** التي توجه إلى إجابة، تجنب الألفاظ الغامضة، وعدم السؤال عما لا يعرفه المستجيب.",
      "**الأسئلة المغلقة** (اختيار، مقياس متدرج) سهلة التفريغ والتحليل، و**المفتوحة** أعمق لكنها أصعب تحليلاً؛ وتغلب المغلقة عادة مع سؤال مفتوح ختامي.",
      "**مقياس ليكرت**: تدرج للموافقة، غالباً خماسي (موافق بشدة ← غير موافق بشدة) أو ثلاثي؛ ويكشف **الاتجاهات**.",
      "**الضبط العلمي**: **الصدق** (تقيس ما وُضعت لقياسه) ويُتحقق منه **بصدق المحكمين** وبالاتساق الداخلي، و**الثبات** (اتساق النتائج) ويُحسب **بألفا كرونباخ** أو **إعادة التطبيق**.",
      "**العينة الاستطلاعية**: مجموعة صغيرة من **مجتمع الدراسة ومن خارج عينتها الأساسية**، تُطبق عليها الأداة قبل التطبيق النهائي لكشف الغموض وحساب الزمن والثبات.",
      "الطول المناسب يغطي المحاور دون إرهاق المستجيب، وتُرتب العبارات من العام إلى الخاص ومن السهل إلى الحساس."
    ],
    t: [
      ["الاستبانة", "أداة مكتوبة لجمع البيانات في البحوث المسحية يجيب عنها المستجيب بنفسه."],
      ["صدق المحكمين", "عرض الأداة على مختصين للحكم على ملاءمة عباراتها لما وُضعت لقياسه."],
      ["العينة الاستطلاعية", "عينة صغيرة من مجتمع الدراسة وخارج عينتها تُجرَّب عليها الأداة قبل التطبيق."],
      ["العبارة المزدوجة", "عبارة تجمع فكرتين فتربك المستجيب؛ من أخطاء صياغة الاستبانة."],
      ["ألفا كرونباخ", "معامل إحصائي لقياس الثبات بالاتساق الداخلي لعبارات الأداة."]
    ] }
],

"L07": [
  { h: "مشكلات النمو والأحداث اليومية الضاغطة",
    pts: [
      "مؤشر 5.1 للممارس: **يبين تأثير مشكلات النمو والأحداث اليومية الضاغطة على تعلم المتعلم وكيفية التعامل معها**.",
      "**أحداث ضاغطة**: طلاق الوالدين أو خلافهما، وفاة قريب، الانتقال إلى مدرسة أو مدينة جديدة، ولادة أخ، مرض الطالب أو أحد أفراد أسرته، ضغط الاختبارات، التنمر.",
      "أثرها في التعلم: تشتت الانتباه، تراجع التحصيل، انسحاب أو عدوان، شكاوى جسمية، غياب متكرر.",
      "مشكلات نمو شائعة: **القلق**، **العدوان** اللفظي أو البدني، **الغيرة** (خاصة مع ولادة أخ أو المقارنة)، **الكذب** (خيالي عند الصغار أو هروباً من العقاب)، **الخجل والانطواء**، **مخاوف المدرسة** في بداية الالتحاق.",
      "**العلامة التحذيرية** هي **التغير المفاجئ** في سلوك الطالب أو تحصيله أو مظهره مقارنة بحاله السابقة، لا السلوك الطبيعي لمرحلته.",
      "تعامل المعلم: **ملاحظة** التغير وتوثيقه ← **حوار فردي هادئ** وإنصات دون لوم أو تحقيق ← **مرونة مؤقتة** في المهام ← **إحالة** إلى الموجه الطلابي والتنسيق مع الأسرة ← متابعة.",
      "يوفّر المعلم **روتيناً ثابتاً** وبيئة آمنة، ويحفظ **السرية**، ولا يناقش ظروف الطالب أمام زملائه، ولا يقارنه بغيره.",
      "**الطالب المنتقل حديثاً**: تعريفه بالفصل وقواعده، و**زميل مرافق**، وإشراك تدريجي، ومتابعة الاندماج.",
      "**قلق الاختبار**: توضيح طريقة التقويم مبكراً، تدريب على أسئلة مشابهة، تنويع أدوات التقويم بدل الاعتماد على اختبار واحد، وتعليم إدارة الوقت."
    ],
    t: [
      ["الحدث الضاغط", "موقف أو تغير في حياة الطالب يفوق قدرته المعتادة على التكيف فيؤثر في تعلمه وسلوكه."],
      ["قلق الاختبار", "توتر وخوف مبالغ فيه قبل الاختبار أو أثناءه يضعف أداء الطالب."],
      ["العلامة التحذيرية", "تغير مفاجئ في سلوك الطالب أو تحصيله أو مظهره يستدعي المتابعة."]
    ] },
  { h: "مؤشرات الاضطرابات الانفعالية والإيذاء والإهمال وإجراء الإبلاغ",
    pts: [
      "مؤشر 5.1 للممارس: **يوضح مؤشرات الاضطرابات الانفعالية وحالات الاعتداء والإهمال**؛ والمعلم أقرب من يلاحظها يومياً.",
      "**مؤشرات اضطراب انفعالي**: حزن مستمر، انسحاب من الزملاء، نوبات غضب أو عدوان غير مبرر، خوف أو قلق مفرط، شكاوى جسمية متكررة بلا سبب طبي، تغير حاد في النوم أو الأكل أو التحصيل.",
      "**الإيذاء** في قواعد السلوك والمواظبة 1447: كل شكل من أشكال الاستغلال أو إساءة المعاملة **الجسدية أو النفسية أو الجنسية** أو التهديد به، ويدخل فيه التقصير في توفير الحاجات الأساسية لمن تجب عليه؛ و**الإهمال**: عدم توفير حاجات الطالب الأساسية (الجسدية، الصحية، العاطفية، النفسية، التربوية، التعليمية...) أو التقصير فيها.",
      "علامات محتملة: **جسدي** (كدمات أو حروق متكررة أو غير مفسرة أو بتفسير لا يتسق مع الإصابة، خوف من العودة إلى المنزل)، **نفسي** (خوف شديد، تدنٍ حاد في تقدير الذات)، **إهمال** (جوع مستمر، رداءة النظافة والملبس، غياب متكرر، حاجات صحية غير معالجة).",
      "العلامة الواحدة **ليست دليلاً قاطعاً**؛ المعلم **يلاحظ ويوثق ويبلغ**، ولا يحقق بنفسه، ولا يواجه الأسرة، ولا يعد الطالب بإخفاء الأمر عن الجهات المختصة.",
      "**المادة 29** من القواعد: من يكتشف الحالة أو يشتبه بها **يبلغ مدير المدرسة فوراً وبسرية** ← إحالة إلى **لجنة التوجيه الطلابي** لتقدير الخطورة (شديدة/متوسطة/بسيطة) والخدمة (عاجلة/غير عاجلة) ← **محضر رسمي** ← استدعاء ولي الأمر (ويُراعى اختيار الطالب لشخص مناسب إذا كان ولي الأمر هو المتسبب) ← مركز صحي عند وجود آثار جسدية.",
      "إذا تطلبت الحالة تدخلاً عاجلاً: **إبلاغ مركز بلاغات وزارة الموارد البشرية والتنمية الاجتماعية (1919) فوراً**، والجهات الأمنية إذا اقتضى الأمر.",
      "إجراءات الإيذاء **لا تتطلب التدرج** المتبع في المخالفات السلوكية، بل تُتخذ **بحسب خطورة الحالة** بشكل **عاجل وسري**، مع استمرار الدعم النفسي والاجتماعي من الموجه الطلابي قبل الإبلاغ وبعده.",
      "إذا كان مصدر الإيذاء **أحد منسوبي المدرسة** تُرفع الحالة إلى **إدارة التعليم**؛ وإذا لاحظ أحد المنسوبين **تراخياً من الإدارة** فله المبادرة بالإبلاغ مباشرة إلى مركز البلاغات (1919).",
      "تعد القواعد **انقطاع الطالب عن التعليم** نوعاً من الإيذاء أو الإهمال، وتستثني الطالب المتعرض للإيذاء من بعض الإجراءات إذا كان تطبيقها يهدد سلامته."
    ],
    t: [
      ["الإيذاء", "استغلال أو إساءة معاملة جسدية أو نفسية أو جنسية أو التهديد بها، ومنه التقصير في الحاجات الأساسية."],
      ["الإهمال", "عدم توفير حاجات الطالب الأساسية الجسدية والصحية والعاطفية والتعليمية أو التقصير فيها."],
      ["مركز البلاغات", "وحدة تابعة لوزارة الموارد البشرية والتنمية الاجتماعية تتلقى بلاغات الإيذاء والإهمال (1919)."],
      ["الحالة عالية الخطورة", "حدث أو ظرف غير متوقع يهدد سلامة الطلبة تهديداً مباشراً أو محتملاً ويتطلب تدخلاً سريعاً، مثل محاولة إيذاء الذات."]
    ] }
],

"L08": [
  { h: "الخلفيات الاجتماعية والاقتصادية والثقافية وحاجاتها التعليمية",
    pts: [
      "مؤشر 5.2 للممارس: **يميز الاختلافات بين المتعلمين التي تعزى للخلفيات الاجتماعية والاقتصادية والثقافية واحتياجاتها التعليمية التي ينبغي تلبيتها**.",
      "**الخلفية الاقتصادية المحدودة**: نقص الأدوات والأجهزة والإنترنت في المنزل وضيق مكان المذاكرة؛ والاستجابة: إتاحة مصادر المدرسة ومركز مصادر التعلم، **عدم اشتراط مواد مكلفة**، وإتاحة وقت لإنجاز المهام داخل المدرسة.",
      "**الخلفية الاجتماعية** (تعليم الوالدين، حجم الأسرة، استقرارها) تؤثر في الدعم المنزلي والخبرات السابقة؛ فلا يُفترض أن الطلاب جميعاً يملكون الخبرات نفسها.",
      "**الخلفية الثقافية واللغوية** (بيئة مختلفة، طالب وافد، لغة أم غير العربية): تختلف الأمثلة المألوفة والمفردات؛ والاستجابة: أمثلة من بيئات متنوعة، شرح المفردات، دعم لغوي، احترام العادات.",

    ],
    t: [
      ["التدريس المستجيب ثقافياً", "تدريس يوظف ثقافة الطالب وخبراته في التعلم مع توقعات عالية للجميع."],
      ["تكافؤ فرص التعلم", "إتاحة فرص متكافئة ومتنوعة تراعي الفروق والخلفيات لجميع المتعلمين."],
      ["القالب النمطي", "حكم مسبق على قدرة الطالب بسبب خلفيته أو فئته لا بسبب أدائه."]
    ] },
  { h: "الخطة التربوية الفردية وفريقها ودور الأسرة والأخصائيين",
    pts: [
      "مؤشر 5.4 للممارس: **يبين الإجراءات التي ينبغي التقيد بها في التعامل مع الفئات الخاصة، ويعرف الجهات التي يجب إشراكها في متابعة حالاتها**.",
      "المسار: **ملاحظة المعلم** ← **الإحالة** ← **موافقة ولي الأمر الخطية** ← **القياس والتشخيص** بفريق متعدد التخصصات ← تحديد **الأهلية والمكان التربوي** ← **الخطة الفردية** ← التنفيذ والتقويم والمراجعة (الدليل التنظيمي للتربية الخاصة).",
      "التشخيص يجمع المعلومات من **مصادر متعددة** (الأسرة، المعلمين، الملفات، المقاييس) بأدوات رسمية وغير رسمية، و**لا يُكتفى بنتيجة مقياس واحد**، وتُحفظ معلوماته **بسرية**.",
      "القياس والتشخيص **بعد موافقة ولي الأمر خطياً** وإشعاره رسمياً؛ وللأسرة طلب **إعادة التشخيص** إذا رأت أن ابنها لم يوضع في البرنامج المناسب.",
      "**الخطة التربوية الفردية** في لائحة تقويم الطالب 2025: وصف للخدمات التربوية والمساندة التي تقتضيها احتياجات الطالب ذي الإعاقة بناءً على نتائج التشخيص والتقويم، يعدها **فريق متعدد التخصصات** بالمدرسة.",
      "عناصرها في الدليل التنظيمي: **مستوى الأداء الحالي** (نقاط القوة والاحتياج) ← **أهداف طويلة المدى** ← **أهداف قصيرة المدى** قابلة للقياس ← **أهداف تدريسية** سلوكية ← **الخدمات** ومسؤولوها ← **مواعيد** البدء والمدة ← **التقويم** ومعاييره ← **المشاركون**.",
      "**لجنة الخطط التعليمية** في الدليل التنظيمي: قائد المدرسة (رئيساً)، ووكيل الشؤون التعليمية، و**معلم التربية الخاصة**، و**معلم التعليم العام**، والمرشد الطلابي أو الأخصائي الاجتماعي، و**المختصون** حسب الحاجة (تدريبات سلوكية، نطق، بصريات...)، و**ولي الأمر**، و**الطالب** قدر الإمكان.",
      "الخطة **وثيقة متجددة**: يراجعها فريقها **سنوياً أو نصف سنوي**، وعند عدم تحقق التقدم المنشود أو تغير حاجات الطالب.",
      "**دور الأسرة**: الموافقة على التشخيص والبرنامج وأي تعديل، المشاركة في إعداد الخطة وتنفيذ ما يُطلب في المنزل، وإطلاع المدرسة على أي تغير؛ و**على المدرسة** شرح حالة الطالب للأسرة بلغة مفهومة وتدريبها وإشعارها خطياً قبل أي تحويل.",
      "**دور معلم التعليم العام بعد الإحالة**: تكييف التدريس، والمشاركة في إعداد الخطة وتنفيذها، والتقويم **بالتعاون مع معلم التربية الخاصة** الذي يتولى الإشراف على تقويم الطالب.",
      "**الخدمات المساندة**: برامج غير تربوية بطبيعتها لكنها ضرورية لنمو الطالب ذي الإعاقة، مثل **العلاج الطبيعي والوظيفي وتصحيح عيوب النطق والكلام والإرشاد النفسي**.",
      "**المكان التربوي** في **البيئة الأقل تقييداً**: فصل عام مع معلم مستشار ← مع معلم متجول ← مع **غرفة المصادر** ← فصل خاص في مدرسة عامة ← معهد تربية خاصة."
    ],
    t: [
      ["فريق الخطة الفردية", "فريق متعدد التخصصات يضم الإدارة ومعلمي التربية الخاصة والعام والمرشد والمختصين وولي الأمر والطالب."],
      ["مستوى الأداء الحالي", "وصف لنقاط قوة الطالب واحتياجاته تُشتق منه أهداف الخطة الفردية."],
      ["الخدمات المساندة", "برامج ضرورية لنمو الطالب ذي الإعاقة كالعلاج الطبيعي والوظيفي والنطق والإرشاد النفسي."],
      ["البيئة الأقل تقييداً", "أقرب مكان تربوي إلى الفصل العام يحقق احتياجات الطالب ذي الإعاقة."]
    ] }
],

"L09": [
  { h: "التعلم المستند إلى الدماغ والأساليب المعرفية",
    pts: [
      "مؤشرا 5.3 للممارس: **يعرف نظريات التعلم ونتائج الأبحاث العلمية المعاصرة في عمليات التعلم وكيفية توظيفها**، و**يعرف أساليب التعلم الفردي ويبين مدى اعتمادها على العوامل المعرفية والانفعالية والبيئية** إضافة إلى الخبرات السابقة.",
      "**التعلم المستند إلى الدماغ** (كين وكين): من مبادئه أن الدماغ **اجتماعي**، و**البحث عن المعنى** فطري ويتم بتكوين **الأنماط**، و**الانفعالات** أساسية في التعلم، والتعلم **يتعزز بالتحدي ويُكبح بالتهديد**، وكل دماغ **فريد**، والدماغ يعالج **الأجزاء والكل معاً**.",
      "عناصره التطبيقية: **الاسترخاء اليقظ** (أمان نفسي مع تحدٍ مرتفع)، **الانغماس المنظم** في خبرات حقيقية غنية، **المعالجة النشطة** (تأمل وتلخيص وتطبيق يثبت المعنى).",
      "في الصف: تقليل التهديد والخوف من الخطأ، ربط الجديد بخبرة الطالب، تنويع المثيرات والحواس، فواصل قصيرة وحركة، تعلم تعاوني، وتغذية راجعة فورية.",
      "**الأسلوب المعرفي**: طريقة مفضلة **ثابتة نسبياً** في الإدراك والتفكير وتنظيم المعلومات؛ يصف **كيف** يتعلم الفرد لا **مقدار** ذكائه.",
      "**الاعتماد على المجال مقابل الاستقلال عنه** (ويتكن): **المعتمد** يدرك الموقف ككل ويتأثر بالسياق ويفضل التوجيه والعمل الجماعي؛ و**المستقل** يحلل الموقف إلى عناصره ويفصل الجزء عن الكل ويفضل العمل الفردي؛ ويُقاس باختبار **الأشكال المتضمنة**.",
      "**الاندفاع مقابل التروي** (كاجان): **المندفع** يستجيب بسرعة وبأخطاء كثيرة، و**المتروي** يتأنى ويفحص البدائل فيخطئ أقل؛ ويُعالج الاندفاع بتعليم **التوقف والتفكير** وفحص البدائل وتمديد وقت الانتظار.",
      "**نموذج دن ودن** يربط أسلوب التعلم بعناصر **بيئية** (الصوت، الإضاءة، الحرارة، تصميم المكان) و**انفعالية** (الدافعية، المثابرة، المسؤولية، الحاجة إلى التنظيم) و**اجتماعية** و**جسمية** و**نفسية**.",
      "لا أسلوب أفضل مطلقاً: المعلم **ينوع** المهام والبيئة، ويساعد الطالب على **الوعي بأسلوبه** وتطوير غيره."
    ],
    t: [
      ["التعلم المستند إلى الدماغ", "تصميم التعليم وفق مبادئ مستخلصة من أبحاث عمل الدماغ."],
      ["الاسترخاء اليقظ", "حالة يجتمع فيها الأمان النفسي مع التحدي المرتفع فتعزز التعلم."],
      ["الأسلوب المعرفي", "طريقة الفرد المفضلة الثابتة نسبياً في الإدراك والتفكير ومعالجة المعلومات."],
      ["الاعتماد على المجال", "أسلوب معرفي يدرك الموقف كلياً ويتأثر بالسياق والمحيط الاجتماعي (ويتكن)."],
      ["الاندفاع والتروي", "بُعد معرفي (كاجان): سرعة الاستجابة مع أخطاء أكثر مقابل التأني مع أخطاء أقل."]
    ] }
],

"L10": [
  { h: "عادات العقل وأثر الاتجاهات والقيم في التعلم",
    pts: [
      "مؤشرا 5.3 للممارس: **يبين عمليات بناء المتعلم للمعاني واكتساب مهارات التفكير الإبداعي والناقد والعادات العقلية**، و**يبين تأثير الاتجاهات والقيم لدى المتعلمين على تعلمهم وكيفية استخدامها لدعمه**.",
      "**عادات العقل** (كوستا وكاليك): نمط من السلوكيات الذكية يختار المتعلم توظيفه عند مواجهة مشكلة **لا يعرف حلها فوراً**؛ فهي **ميل** لاستخدام المهارة، وتُتعلم وتُنمّى.",
      "العادات الست عشرة: المثابرة، **التحكم بالتهور**، الإصغاء بتفهم وتعاطف، التفكير بمرونة، **التفكير حول التفكير**، **الكفاح من أجل الدقة**، التساؤل وطرح المشكلات، تطبيق المعارف الماضية على أوضاع جديدة، التفكير والتوصيل بوضوح ودقة، جمع البيانات باستخدام جميع الحواس، الخلق والتصور والابتكار، الاستجابة بدهشة ورهبة، الإقدام على مخاطر مسؤولة، إيجاد الدعابة، التفكير التبادلي، الاستعداد الدائم للتعلم المستمر.",
      "تمييز سريع: لا يستسلم ويجرب طرقاً أخرى = **المثابرة**؛ يراجع حله ليتأكد من خلوه من الخطأ = **الكفاح من أجل الدقة**؛ يقرأ السؤال كاملاً قبل الإجابة = **التحكم بالتهور**؛ يعيد صياغة كلام زميله قبل الرد = **الإصغاء بتفهم**؛ يصف كيف وصل إلى الحل = **التفكير حول التفكير**.",
      "تنميتها: **تسميتها** للطلاب، **النمذجة** (المعلم يفكر بصوت مسموع)، مشكلات مفتوحة، **تعزيز** ظهورها، والتأمل الذاتي في استخدامها.",
      "**الاتجاه**: استعداد مكتسب ثابت نسبياً للاستجابة بالقبول أو الرفض نحو موضوع، ومكوناته: **معرفي** (معتقدات) و**وجداني** (مشاعر) و**سلوكي** (ميل للفعل).",
      "الاتجاه **الإيجابي** نحو المادة يرفع الانتباه والمثابرة، و**السلبي** («لست جيداً في الرياضيات») يخفض الجهد ويتحول إلى نبوءة تحقق ذاتها.",
      "تعديل الاتجاه: **خبرات نجاح** مبكرة، ربط المادة **بحياة الطالب وقيمه**، **القدوة**، بيئة لا تسخر من الخطأ، التعزيز، والحوار المقنع؛ لا بالوعظ وحده ولا بالإجبار ولا بالمقارنة.",
      "**القيم** معايير يحكم بها المتعلم ويوجه بها سلوكه؛ إذا رأى أن المحتوى **يتصل بقيمه** (الإتقان، خدمة المجتمع، الأمانة العلمية) زاد اندماجه."
    ],
    t: [
      ["عادات العقل", "أنماط من السلوك الذكي يوظفها المتعلم عند مواجهة مشكلات لا يعرف حلها فوراً (كوستا وكاليك)."],
      ["التحكم بالتهور", "عادة عقل: التأني والتفكير وفهم المهمة قبل البدء."],
      ["الكفاح من أجل الدقة", "عادة عقل: مراجعة العمل وتجويده حتى يخلو من الأخطاء."],
      ["مكونات الاتجاه", "معرفي (معتقدات)، ووجداني (مشاعر)، وسلوكي (ميل للفعل)."]
    ] }
],

"L11": [
  { h: "أسس المداخل الأربعة للتدريس كما في مؤشرات 7.1",
    pts: [
      "مؤشر 7.1 للممارس: **يحدد الأسس والمبادئ النظرية للمداخل العامة للتدريس، ويبرز أهميتها في تحفيز المتعلمين وتنمية مهاراتهم وقدراتهم وتعديل سلوكهم وتنمية مهاراتهم الاجتماعية**؛ والمداخل أربعة: **السلوكي، والمعرفي، والإنساني (الشخصي)، والاجتماعي**.",
      "**المدخل السلوكي**: أساسه نظريات الإشراط (سكنر)؛ يركز على **التغيير والتعديل في السلوك** الظاهر، وعلى **استجابة المتعلمين للمهام** و**التعزيز**؛ أدواته: أهداف سلوكية دقيقة، **تحليل المهمة** إلى خطوات صغيرة متدرجة، ممارسة موجهة، تغذية راجعة فورية.",
      "نماذجه: **التعلم للإتقان** (لا ينتقل الطالب حتى يتقن ما قبله)، **التعليم المباشر**، **التعليم المبرمج**، التدريب والممارسة، وبرامج تعديل السلوك.",
      "**المدخل المعرفي**: أساسه الجشطلت ومعالجة المعلومات وبياجيه وبرونر؛ يستند إلى أساليب تمكّن المتعلم من **التفكير والبحث والاكتشاف ذاتياً** والتوصل إلى المعارف **بجهده**.",
      "نماذجه: **الاكتشاف**، **الاستقصاء**، **اكتساب المفاهيم**، **المنظم المتقدم** (أوزوبل)، التفكير الاستقرائي؛ والمعلم يطرح مواقف محيرة ويترك الطالب يصل.",
      "**المدخل الإنساني (الشخصي)**: أساسه علم النفس الإنساني (**روجرز** وماسلو)؛ يعنى بتأثير **الجوانب الوجدانية والشخصية** في التعلم، ويشجع **الاستقلالية المنتجة** و**الوعي بالذات** و**الإحساس بالمسؤولية**.",
      "نموذجه الأشهر **التدريس غير الموجه** (روجرز): المعلم **ميسّر** يتقبل الطالب ويصغي له بتعاطف، ويشاركه في تحديد أهدافه وتقويم تقدمه في مناخ آمن؛ ومن تطبيقاته عقود التعلم والتقويم الذاتي.",
      "**المدخل الاجتماعي**: أساسه التعلم الاجتماعي (**باندورا**) وفيجوتسكي؛ التعلم بالتفاعل و**نمذجة السلوك**، لدعم **النظم التفاعلية** بين المتعلمين و**بناء ثقافة صفية إيجابية**.",
      "نماذجه: التعلم التعاوني، لعب الأدوار، التقصي الجماعي، المحاكاة الاجتماعية؛ و**نمذجة السلوك**: المعلم أو زميل يؤدي السلوك المرغوب ليحاكيه الطلاب مع تعزيز من يتقنه.",
      "تمييز سريع: «خطوات صغيرة وتعزيز فوري» = سلوكي؛ «يكتشف بنفسه» = معرفي؛ «يختار ويقوّم ذاته ويشعر بالمسؤولية» = إنساني؛ «يتعلم من زملائه وبالقدوة» = اجتماعي."
    ],
    t: [
      ["المدخل السلوكي", "مدخل يركز على تعديل السلوك الظاهر بتحليل المهمة والتعزيز والإتقان."],
      ["المدخل المعرفي", "مدخل يركز على العمليات العقلية ووصول المتعلم إلى المعرفة بالبحث والاكتشاف."],
      ["المدخل الإنساني", "مدخل يركز على الجوانب الوجدانية والوعي بالذات والاستقلالية والمسؤولية (روجرز)."],
      ["المدخل الاجتماعي", "مدخل يوظف التفاعل ونمذجة السلوك لبناء ثقافة صفية إيجابية (باندورا)."],
      ["التدريس غير الموجه", "نموذج روجرز: المعلم ميسّر متقبل يشارك الطالب أهدافه وتقويم تقدمه."],
      ["تحليل المهمة", "تجزئة المهارة إلى خطوات صغيرة متتابعة تُتقن واحدة بعد أخرى."]
    ] },
  { h: "العروض العملية والتغيير المفاهيمي",
    pts: [
      "مؤشر 7.2 للممارس يذكر **العروض العملية** ضمن طرق التدريس المباشرة، ويطلب **اختيار ما يتوافق منها مع متطلبات المنهج وخصائص نمو المتعلمين**، ويذكر **التغيير المفاهيمي** ضمن طرق التدريس البنائي.",
      "**العرض العملي** طريقة مباشرة يجمع فيها المعلم الأداء مع **الشرح المتزامن**؛ ويكون الاختيار الأنسب خاصة للتجارب **الخطرة أو المكلفة** أو التي لا تتوفر أدواتها للجميع.",

      "**التغيير المفاهيمي** (بوسنر وزملاؤه): لا يتخلى الطالب عن تصوره إلا بأربعة شروط: **عدم الرضا** عن التصور الحالي ← المفهوم الجديد **واضح** ← **معقول** ← **مثمر** في تفسير مواقف جديدة.",
      "خطوات تدريسه: **كشف التصورات القبلية** ← إحداث **تناقض معرفي** بحدث يخالف التوقع ← تقديم المفهوم العلمي ← **تطبيقه** في مواقف جديدة ← مقارنة الطالب بين تصوره القديم والجديد.",

    t: [

      ["التصورات البديلة", "مفاهيم خاطئة لدى الطالب تخالف المفهوم العلمي وتقاوم التغيير."],

      ["التناقض المعرفي", "مواجهة الطالب بما يخالف توقعه فيشعر بعدم الرضا عن تصوره."],
      ["توقع – لاحظ – فسر", "استراتيجية يتوقع فيها الطالب النتيجة ثم يلاحظ ثم يفسر الفرق بينهما."]

"L12": [

  { h: "شروط اختيار مصادر التعلم الرقمية وغير الرقمية",

"L14": [
  { h: "9.2 (ب) القدوة وحدود العلاقة المهنية والتراجع عن الخطأ ودور المعلم في قواعد السلوك",
    pts: [
      "**المسميات الحالية** في قواعد السلوك والمواظبة (الإصدار الخامس): **الموجه الطلابي** و**لجنة التوجيه الطلابي**، وكانت سابقاً «المرشد الطلابي» و«لجنة التوجيه والإرشاد»؛ قد يرد أي من المسميين في الأسئلة، والمقصود الدور نفسه.",
      "مؤشر 9.2 للممارس: **يظهر القدوة الحسنة في السلوك، ويبقي علاقته مع المتعلمين ضمن حدود العلاقات المهنية، ويتراجع عن الخطأ ويصححه عند حدوثه**.",
      "**القدوة**: اتساق ما يطلبه المعلم مع ما يفعله (الالتزام بالوقت، ضبط الانفعال، احترام الطلاب، الأمانة)؛ فالطلاب يتعلمون بالملاحظة أكثر من التوجيه اللفظي.",
      "**حدود العلاقة المهنية**: علاقة ودودة **عادلة** قائمة على الاحترام، دون محاباة أو تمييز، ودون تواصل شخصي خارج القنوات المعتمدة، ودون إفشاء أسرار الطلاب، ودون مزاح يمس الكرامة.",
      "**التراجع عن الخطأ**: إذا أخطأ المعلم في معلومة أو حكم أو درجة **يعترف ويصحح** في أقرب وقت أمام من وصلهم الخطأ؛ فذلك يبني الثقة ويعلّم الأمانة العلمية ولا ينقص من مكانته.",
      "إذا أساء المعلم إلى طالب أمام زملائه (انفعال، كلمة جارحة) فالأنسب **الاعتذار** بما يحفظ كرامة الطالب، لا التجاهل ولا التبرير.",
      "قواعد السلوك والمواظبة 1447 تجعل من **دور المعلم**: **تمثيل القدوة الحسنة للسلوك الإيجابي في القول والفعل**، وتعزيز الانضباط الذاتي، والمساهمة في توضيح القواعد للطلبة، والعمل على تعديل السلوك غير المرغوب بالاستفادة من خدمات التوجيه الطلابي.",
      "يباشر المعلم **الإجراءات الثلاثة الأولى من مشكلات الدرجة الأولى** (تنبيه شفهي أول ← تنبيه ثانٍ مع ملاحظة الطالب وحصر أسباب السلوك ← تدوين المشكلة وتوقيع الطالب مع إشعار ولي الأمر وحسم تنفذه الإدارة)، ويحيل من لم يستجب إلى الإدارة.",
      "**يرصد المعلم مشكلات الدرجة الثانية فأعلى** التي باشرها ويسلم الأسماء لإدارة المدرسة؛ ومثالها الدخول أو الخروج من الفصل دون استئذان، بينما التأخر في دخول الحصة والنوم في الفصل من الدرجة الأولى.",
      "ومن دوره: توثيق مشكلات الانضباط الصفي في سجلات خاصة، **رصد الحضور في كل حصة**، **تمكين الطالب من فرص التعويض** إذا رغب، وطلب المشورة من لجنة التوجيه الطلابي عند الحاجة.",
      "ممارسات **ممنوعة** في القواعد: الإيذاء الجسدي أو النفسي، التسبب في انقطاع الطالب عن التعليم، حرمانه من الإفطار في وقته، **تكليفه بنسخ الواجب عدة مرات عقاباً**، استفزازه، السخرية من شخصيته، و**إقصاؤه خارج الصف**."
    ],
    t: [
      ["القدوة الحسنة", "اتساق قول المعلم وفعله بما يجعل سلوكه نموذجاً يحاكيه الطلاب."],
      ["حدود العلاقة المهنية", "علاقة عادلة محترمة مع الطلاب داخل القنوات المعتمدة دون محاباة أو خصوصية غير مهنية."],

  { h: "9.3 (ج) جاهزية مصادر التعلم والأمن والسلامة المادية",

["L03","hm","أراد باحث تتبع النمو اللغوي لمجموعة من الأطفال من سن الثالثة حتى التاسعة بملاحظتهم كل عام. نوع الدراسة:",["دراسة طولية","دراسة مستعرضة","دراسة حالة","دراسة تجريبية"],"الدراسة الطولية تتابع المجموعة نفسها عبر سنوات. المستعرضة تقارن أعماراً مختلفة في وقت واحد، ودراسة الحالة تتعمق في فرد أو وحدة واحدة."],
["L03","h","من خصائص البحث النوعي أن:",["الباحث منغمس في الموقف ويصف المعاني لا الأرقام","يعتمد على عينات عشوائية كبيرة","يقيس المتغيرات بأدوات مقننة كمية","يهدف إلى تعميم النتائج إحصائياً"],"البحث النوعي يعتمد الوصف العميق للمعاني وانغماس الباحث في الميدان. العينات الكبيرة والقياس الكمي والتعميم الإحصائي سمات البحث الكمي."],
["L03","m","في دراسة عن أثر التعلم النشط في التحصيل، لاحظ الباحث أن اختلاف خبرة المعلمين أثر في النتائج دون قصد. يمثل اختلاف الخبرة هنا متغيراً:",["دخيلاً","مستقلاً","تابعاً","وسيطاً مقصوداً"],"المستقل هو التعلم النشط (ما يعالجه الباحث)، والتابع التحصيل، أما خبرة المعلم فمتغير خارجي غير مقصود يؤثر في التابع ويجب ضبطه؛ وهو الدخيل."],
["L03","","قسّم باحث مجتمع الدراسة من المعلمين إلى فئات حسب الجنس وسنوات الخبرة ثم اختار عشوائياً من كل فئة بنسبتها. نوع العينة:",["طبقية","عنقودية","قصدية","عارضة"],"العينة الطبقية تقسم المجتمع غير المتجانس إلى فئات ثم تختار من كل فئة. العنقودية تختار مجموعات كاملة، والقصدية والعارضة غير احتماليتين."],
["L03","m","اختار معلم أقرب فصل إليه لتطبيق بحثه لأنه متاح وسهل الوصول. نوع العينة:",["متيسرة","طبقية","منتظمة","بسيطة"],"اختيار الأفراد لسهولة توفرهم هو العينة المتيسرة (غير احتمالية). البسيطة والمنتظمة والطبقية عينات عشوائية احتمالية."],
["L03","","أراد معلم جمع آراء عدد كبير من أولياء الأمور حول الواجبات المنزلية في وقت قصير. أداة جمع البيانات الأنسب:",["الاستبانة","المقابلة","الملاحظة","الاختبار"],"الاستبانة تناسب العدد الكبير والوقت القصير. المقابلة والملاحظة تستغرقان وقتاً، والاختبار يقيس التحصيل لا الآراء."],
["L03","m","طلب مدير المدرسة من معلم متمكن تقديم حصة أمام زملائه لعرض طريقة جديدة في تدريس القراءة عملياً. أسلوب الإشراف المستخدم:",["الدرس التطبيقي (النموذجي)","الزيارة الصفية","النشرة التربوية","اللقاء الفردي"],"الدرس التطبيقي يعرض مهارة عملياً أمام المعلمين. الزيارة الصفية يحضر فيها المشرف حصة المعلم لتقويمه، والنشرة واللقاء لا يتضمنان عرضاً عملياً."],
["L03","","لقاء يناقش فيه عدد من المختصين قضية تربوية أمام المعلمين ويُفتح بعده باب الحوار. هذا الأسلوب يسمى:",["ندوة تربوية","محاضرة تربوية","ورشة عمل","زيارة متبادلة"],"الندوة يتعدد فيها المتحدثون مع حوار، والمحاضرة متحدث واحد، والورشة عمل تطبيقي للمشاركين، والزيارة المتبادلة بين معلمين في الصف."],
["L03","h","أي مما يأتي لا يُعد من صفات المعلم الناجح؟",["تقليد المعلمين الآخرين في أسلوبهم","التأمل في ممارساته وتطويرها","طلب التغذية الراجعة من زملائه","التنويع في طرق التدريس"],"المعلم الناجح يبني أسلوبه الخاص ويطوره بالتأمل والتغذية الراجعة، والتقليد الحرفي للآخرين يناقض الأسلوب الشخصي في التدريس."],
["L03","m","الفرق الجوهري بين البحث الإجرائي الذي يجريه المعلم والبحث الأكاديمي أن الإجرائي:",["يحل مشكلة واقعية في صف المعلم ولا يهدف إلى التعميم","يعتمد عينات عشوائية كبيرة","يتطلب ضبطاً تجريبياً صارماً","يُجرى في المختبرات فقط"],"البحث الإجرائي عملي دوري يستهدف تحسين ممارسة المعلم في سياقه، بخلاف الأكاديمي الذي يسعى للتعميم بعينات وضبط صارم."],
// ===== L04 التفاعل مع المجتمع =====
["L04","h","أراد معلم مخاطبة مدير المدرسة بطلب تجهيز معمل العلوم. الصيغة الأنسب:",["خطاب إداري رسمي","رسالة ودية","حديث شفهي في الممر","رسالة نصية عبر الجوال"],"مخاطبة الإدارة والجهات الرسمية تكون بخطاب إداري بعناصره الرسمية ليُوثق ويُتابع. الأساليب الودية والشفهية لا تناسب الطلب الرسمي."],
["L04","m","تطبيق يخصص مساحة افتراضية لمشاركة الملفات والنقاش بين المعلم والطلاب وأولياء الأمور. التطبيق الذي يحقق ذلك:",["School Circle","Excel","Access","Canva"],"School Circle منصة تواصل وتشارك ملفات بين أطراف العملية التعليمية. إكسل للجداول، وأكسس لقواعد البيانات، وكانفا للتصميم."],
// ===== L06 الكمية =====
["L06","hm","قرّب العدد 5.7654 إلى أقرب جزء من عشرة:",["5.8","5.7","5.77","5.76"],"التقريب لأقرب عُشر ينظر إلى منزلة الأجزاء من مئة (6 ≥ 5) فيرفع العُشر من 7 إلى 8. البدائل الأخرى تقريب لمنازل أخرى أو بلا تقريب."],
["L06","h","متوسط الأعداد 1، 11، 6، 10 هو:",["7","6","8","28"],"المجموع 28 ÷ 4 = 7. من أخطأ قد يأخذ 28 بلا قسمة أو يحسب الوسيط (8)."],
// ===== L07 النمو =====
["L07","hm","يدرّس معلم طلاب الصف الرابع الابتدائي، فوفق تصنيف بياجيه يقع معظم طلابه في مرحلة:",["العمليات المحسوسة","العمليات المجردة","ما قبل العمليات","الحس حركية"],"الصف الرابع عمره نحو 9–10 سنوات ضمن مرحلة العمليات المحسوسة (7–11) التي يفكر فيها الطفل منطقياً بالمحسوسات. المجردة تبدأ من 11–12."],
["L07","h","طفل في الثانية يرمي الأشياء من مكانها ويراقب سقوطها مراراً. هذا السلوك يدل على:",["الاستكشاف","العدوان","فرط الحركة","الإحيائية"],"رمي الأشياء وتجريبها في الطفولة المبكرة استكشاف نمائي طبيعي لخصائص الأشياء. العدوان مقصود للإيذاء، وفرط الحركة اضطراب، والإحيائية إسناد الحياة للجماد."],
["L07","h","يؤكد بياجيه أن التعليم الفعال هو الذي:",["يناسب مرحلة النمو المعرفي للطفل","يسبق مرحلة النمو ليسرّعها","يعتمد على التكرار والتعزيز","يركز على التلقين المباشر"],"بياجيه يرى أن الطفل لا يتعلم ما يتجاوز بنيته المعرفية، فالتعليم يُبنى على المرحلة الحالية. التسريع فكرة برونر، والتكرار والتلقين سلوكية."],
["L07","m","أي العبارات الآتية صحيحة عن العلاقة بين النضج والتعلم؟",["النضج شرط للتعلم وليس التعلم شرطاً للنضج","التعلم شرط للنضج","كلاهما إرادي ويتأثر بالتدريب","لا علاقة بينهما"],"النضج تغيرات داخلية لا إرادية لا يسرّعها التدريب، وهو شرط لحدوث التعلم (لا يتعلم الطفل الكتابة قبل نضج عضلاته)، أما التعلم فيحتاج خبرة وممارسة."],
["L07","","من خصائص النمو أنه تراكمي، ويقصد بذلك أن:",["كل مرحلة تبني على ما سبقها وتمهد لما بعدها","سرعته ثابتة في جميع المراحل","يحدث في جميع الجوانب بالدرجة نفسها","لا تتدخل فيه الوراثة"],"التراكمية والتتابع تعنيان أن المراحل مترابطة. النمو متغير السرعة ومختلف بين الجوانب وينتج عن تفاعل الوراثة والبيئة."],
["L07","m","زيادة طول الطالب ووزنه خلال العام تمثل نمواً:",["تكوينياً","وظيفياً","انفعالياً","اجتماعياً"],"النمو التكويني (البنائي) زيادة في الحجم والشكل، أما الوظيفي فتحسن في أداء الأعضاء والقدرات."],
["L07","","ظهور الأحلام اليقظة بكثرة وتكوّن الاستقلال والانتماء القوي للأصدقاء من خصائص طلاب المرحلة:",["المتوسطة","الابتدائية الدنيا","الابتدائية العليا","الروضة"],"أحلام اليقظة والاستقلال والانتماء للرفاق سمات المراهقة المبكرة (المتوسطة). الابتدائية تتسم بحب الاستطلاع والتطبيع الاجتماعي."],
["L07","m","طالب في الصف الخامس يُنجز مهامه ويحصل على تشجيع فتنمو لديه الثقة في قدرته على الإنجاز. وفق إريكسون يمر بأزمة:",["الكفاية (الاجتهاد) مقابل النقص","الهوية مقابل تشتت الهوية","المبادرة مقابل الذنب","الاستقلال مقابل الخجل"],"سن المدرسة الابتدائية (6–12) أزمتها الاجتهاد/الكفاية مقابل الدونية/النقص. الهوية للمراهقة، والمبادرة لمرحلة الروضة، والاستقلال للطفولة المبكرة."],
// ===== L08 الفروق الفردية والفئات =====
["L08","","قاس معلم الزمن بين عرض المثير وبداية استجابة كل طالب له فوجد تفاوتاً بينهم. ما قاسه المعلم يسمى:",["زمن الرجع","الاستعداد","الاتجاه","الميل"],"زمن الرجع هو الفترة بين المثير وبدء الاستجابة وهو من الفروق الفردية القابلة للقياس. الاستعداد قدرة كامنة، والاتجاه والميل وجدانيان."],
["L08","m","طالب نسبة ذكائه دون 70 مع قصور واضح في مهارات العناية بالذات والتواصل ظهر قبل سن 18. الفئة الأقرب:",["الإعاقة العقلية","صعوبات التعلم","بطء التعلم","التأخر الدراسي"],"الإعاقة العقلية تجمع انخفاض الذكاء (دون 70) وقصور السلوك التكيفي قبل 18. بطء التعلم ذكاء حدي 70–85، وصعوبات التعلم ذكاء عادي، والتأخر الدراسي سببه الإهمال."],
["L08","","صعوبات التعلم الناتجة عن خلل في العمليات النفسية الأساسية نفسها لا عن سوء التعليم أو الحرمان البيئي تسمى صعوبات:",["أولية","ثانوية","أكاديمية","مؤقتة"],"الأولية تعود إلى الخلل الداخلي في العمليات النفسية، والثانوية تنتج عن عوامل خارجية كسوء التدريس أو الحرمان."],
["L08","m","أراد معلم الكشف الأولي عن احتمال وجود صعوبات تعلم لدى طالب بتقدير سلوكه في الفهم والذاكرة والانتباه. الأداة الأنسب:",["مقياس مايكل بست للتقدير السلوكي","اختبار ستانفورد بينيه","اختبار الاستعداد المهني","مقياس ليكرت للاتجاهات"],"مايكل بست مقياس تقدير سلوكي يملؤه المعلم للكشف الأولي عن صعوبات التعلم. ستانفورد بينيه للذكاء، وليكرت للاتجاهات."],
["L08","hm","طالب ذو صعوبات تعلم في القراءة، فاستخدم المعلم البطاقات الملونة مع نطق الحرف ولمس حروف بارزة والكتابة في الهواء. الاستراتيجية المستخدمة:",["تعدد الحواس (VAKT)","التعلم المنظم","الإثراء العمودي","ضغط المنهج"],"VAKT يوظف البصر والسمع والحركة واللمس معاً لذوي الصعوبات. التعلم المنظم للتوحد، والإثراء وضغط المنهج للموهوبين."],
["L08","m","يرى جانييه أن الفرق بين الموهبة والتفوق هو أن:",["الموهبة قدرة طبيعية والتفوق أداء مكتسب ينمى بالبيئة","الموهبة أداء مكتسب والتفوق قدرة فطرية","الموهبة والتفوق مترادفان","التفوق يُقاس بالذكاء والموهبة بالتحصيل"],"نموذج جانييه: الموهبة استعداد فطري غير مدرَّب، والتفوق أداء متميز في مجال نتيجة التدريب؛ ولذلك كل متفوق موهوب وليس كل موهوب متفوقاً."],
["L08","h","من سمات الطالب الموهوب التي قد يخطئ المعلم في تفسيرها:",["حس الدعابة والكمالية المبالغ فيها","ضعف المفردات اللغوية","قلة الأسئلة والفضول","الاعتماد الكلي على المعلم"],"الموهوب يتميز بحس الدعابة والكمالية والفضول والنمو اللغوي المبكر، وقد يُفسر ملله أو سخريته خطأً على أنه سوء سلوك."],
// ===== L09 نظريات التعلم =====
["L09","hm","إجراء قصير المدى يقوم به المعلم لتحقيق أهداف محددة في موقف معين، بينما العملية الأشمل التي تستهدف نمو الفرد وإعداده للحياة هي:",["التدريس، والتربية","التعلم، والتعليم","التعليم، والتدريس","التربية، والتعلم"],"التدريس إجراء المعلم قصير المدى، والتربية أشمل العمليات. التعليم تصميم الخبرة، والتعلم تغير شبه دائم في سلوك المتعلم."],
["L09","m","ثبّت معلم ارتباطاً بين الجرس والاصطفاف بتكرار الاقتران حتى صار الطلاب يصطفون عند سماعه. رائد النظرية التي ترى أن اقتراناً واحداً بين المثير والاستجابة يكفي لتكوين التعلم هو:",["جاثري","بافلوف","ثورندايك","سكنر"],"جاثري صاحب نظرية الاقتران الشرطي ومبدأ المرة الواحدة. بافلوف إشراط كلاسيكي بالتكرار، وثورندايك محاولة وخطأ، وسكنر إجرائي."],
["L09","h","خاف طفل من النار بعد لسعة واحدة فصار يتجنبها. هذا يمثل في نظرية الاشتراط:",["قانون المرة الواحدة","قانون الأثر","التعميم","الاسترجاع التلقائي"],"تكوّن الارتباط من خبرة واحدة شديدة هو قانون المرة الواحدة. قانون الأثر عند ثورندايك يخص الرضا والضيق، والتعميم استجابة لمثيرات مشابهة."],
["L09","m","يميز سكنر بين السلوك الإرادي الذي يصدر عن الكائن ويتأثر بنتائجه، والسلوك اللاإرادي الذي يستثيره مثير سابق. يسمى الأول والثاني على الترتيب:",["إجرائي، واستجابي","استجابي، وإجرائي","شرطي، وغير شرطي","كامن، وظاهر"],"السلوك الإجرائي إرادي تحكمه النتائج (التعزيز)، والاستجابي لا إرادي يستدعيه المثير (كما في بافلوف)."],
["L09","","الاشتراط الإجرائي يسمى أيضاً الاشتراط:",["الوسيلي","الكلاسيكي","الاستجابي","البسيط"],"يسمى وسيلياً لأن الاستجابة وسيلة للحصول على المعزز. الكلاسيكي والبسيط والاستجابي أسماء لاشتراط بافلوف."],
["L09","m","مؤسس مدرسة الجشطلت الذي وضع قوانين التنظيم الإدراكي (التقارب، التشابه، الإغلاق) هو:",["فرتهايمر","كوهلر","تولمان","أوزوبل"],"فرتهايمر مؤسس الجشطلت، وكوهلر صاحب تجربة القرد والعصا (الاستبصار)، وتولمان الخرائط المعرفية، وأوزوبل التعلم ذو المعنى."],
["L09","hm","عرض المعلم فيلماً عن تجاذب الأجسام وتنافرها تمهيداً لدرس الشحنات الكهربائية. ما قام به وفق نظرية أوزوبل يسمى:",["منظماً متقدماً","تثبيتاً","تعزيزاً","تعميماً"],"المنظم المتقدم مادة تمهيدية عامة تربط الدرس الجديد بالبنية المعرفية. التثبيت إجراء لاحق، والتعزيز والتعميم مفاهيم سلوكية."],
["L09","","بدأ معلم الوحدة بأكثر الأفكار شمولاً ثم انتقل تدريجياً إلى التفاصيل الأقل شمولاً. هذا المبدأ عند أوزوبل يسمى:",["التمايز التقدمي","التوفيق التكاملي","المنهج الحلزوني","الاستبصار"],"التمايز التقدمي من العام إلى الخاص، والتوفيق التكاملي ربط الأفكار وإزالة التعارض، والحلزوني لبرونر، والاستبصار للجشطلت."],
["L09","m","عندما يشبّه المعلم عقل المتعلم بالحاسوب الذي يستقبل مدخلات ويعالجها ثم يُخرجها، فإنه يستند إلى نموذج:",["معالجة المعلومات","الاشتراط الإجرائي","التعلم بالاستبصار","التعلم الاجتماعي"],"نموذج معالجة المعلومات (نورمان، أتكنسون وشفرن) يفسر التعلم بالانتباه والترميز والتخزين والاسترجاع كالحاسوب."],
["L09","h","صاحب نظرية الترميز المزدوج التي ترى أن تخزين المعلومة لفظياً وبصرياً معاً أقوى من تخزينها بشكل واحد هو:",["بافيو","بياجيه","باندورا","برونر"],"بافيو صاحب الترميز المزدوج (لفظي وتصوري). بياجيه نمو معرفي، وباندورا تعلم اجتماعي، وبرونر تمثيلات ثلاث."],
["L09","m","نصح معلم طلابه بمراجعة الدرس في جلسات قصيرة متباعدة بدل جلسة واحدة طويلة ليلة الاختبار. المبدأ الذي استند إليه:",["التدريب الموزع أفضل للاحتفاظ من المكثف","التدريب المكثف أفضل للاحتفاظ","التكرار الآلي يضمن الفهم","الحفظ يسبق الفهم دائماً"],"الممارسة الموزعة تعزز التخزين طويل المدى وتقلل التداخل، بخلاف الحشو المكثف الذي يُنسى سريعاً."],
["L09","","يرى باندورا أن السلوك ينتج عن تفاعل مستمر بين الفرد والسلوك والبيئة. هذا المبدأ يسمى:",["الحتمية التبادلية","التعزيز البديل","الاستبصار","التمثل"],"الحتمية (التفاعل) التبادلية جوهر النظرية الاجتماعية المعرفية. التعزيز البديل مفهوم آخر لباندورا يخص ملاحظة نموذج يُعزَّز."],
["L09","m","تجربة باندورا التي شاهد فيها الأطفال نموذجاً يضرب دمية ثم قلدوه تعرف بتجربة:",["دمية بوبو","القرد والعصا","الكلب والجرس","القط والصندوق"],"دمية بوبو تجربة باندورا في التعلم بالملاحظة. القرد لكوهلر، والكلب لبافلوف، والقط لثورندايك."],
["L09","h","ظل طالب يجيب إجابات صحيحة دون أن يتلقى أي تعزيز من المعلم، فقلّت مشاركته تدريجياً. التفسير الأقرب:",["الانطفاء في الاشتراط الإجرائي","الاشتراط الكلاسيكي","التعميم","العقاب السالب"],"إيقاف التعزيز عن استجابة إرادية حتى تتلاشى هو الانطفاء الإجرائي. أحد مفاتيح الملخصات المتداولة قال «الاشتراط الكلاسيكي» والصحيح الانطفاء لأن المشاركة سلوك إرادي تحكمه نتائجه لا مثير سابق. العقاب السالب سحب معزز قائم لا الامتناع عن منحه."],
["L09","m","شاهد طالب زميله يُكافأ على ترتيب أدواته فبدأ يرتب أدواته هو أيضاً. المفهوم:",["التعزيز البديل","التعزيز السالب","التشكيل","الانطفاء"],"التعزيز البديل عند باندورا: ملاحظة نموذج يُعزَّز يزيد احتمال تقليده. التعزيز السالب إزالة منفر عن الطالب نفسه."],
// ===== L10 الدافعية والتفكير =====
["L10","m","يرى علماء النفس أن الدافعية توجّه السلوك نحو هدف محدد. هذه الخاصية تسمى:",["الغرضية","الاستمرارية","التنوع","التحسين"],"الغرضية خاصية التوجه نحو هدف. الاستمرار والتنوع والتحسين خصائص أخرى للدافعية لكنها لا تعني التوجه نحو هدف."],
["L10","","من وظائف الدافعية في التعلم:",["توليد السلوك وتوجيهه وتحديد شدته واستمراره","تحديد مستوى ذكاء الطالب","تفسير الفروق الوراثية","قياس التحصيل الدراسي"],"الدافعية تولد السلوك وتوجهه وتحدد شدته وديمومته. الذكاء والوراثة والتحصيل مفاهيم أخرى."],
["L10","m","الحاجة إلى الطعام والنوم دوافع بيولوجية، أما الحاجة إلى التقدير والإنجاز فدوافع:",["اجتماعية مكتسبة","بيولوجية","فسيولوجية","لا شعورية"],"الدوافع الاجتماعية تُكتسب من التفاعل مع البيئة كالانتماء والتقدير والإنجاز، بخلاف البيولوجية الفطرية كالجوع."],
["L10","h","في الصورة الموسعة لهرم ماسلو، الحاجتان اللتان تقعان بين حاجات التقدير وتحقيق الذات هما:",["المعرفة والجمال","الأمن والانتماء","الفسيولوجية والأمن","الانتماء والتقدير"],"الهرم الموسع سبعة مستويات: فسيولوجية، أمن، انتماء، تقدير، معرفة، جمال، تحقيق الذات. البدائل الأخرى مستويات دنيا."],
["L10","","العالم الذي أكد أثر الوراثة في الذكاء وابتكر فكرة معامل الارتباط هو:",["جالتون","سبيرمان","جاردنر","ستيرنبرغ"],"جالتون رائد دراسة الوراثة والفروق ومعامل الارتباط. سبيرمان العامل العام، وجاردنر الذكاءات المتعددة، وستيرنبرغ الثلاثي."],
["L10","m","اختبار ذكاء غير لفظي يعتمد على إكمال مصفوفات من الأشكال ويناسب من لا يجيد اللغة. هذا الاختبار:",["مصفوفات رافن","ستانفورد بينيه","وكسلر اللفظي","مقياس ليكرت"],"رافن اختبار مصفوفات متتابعة غير لفظي. ستانفورد بينيه ووكسلر لفظيان في معظمهما، وليكرت للاتجاهات."],
["L10","h","كلّف معلم العلوم طلابه بملاحظة مشكلة ذبول النباتات، ثم تحديدها، وجمع بيانات، وفرض فروض، واختبارها، والوصول إلى نتيجة. نمط التفكير الذي ينميه:",["التفكير العلمي","التفكير الحدسي","التفكير التأملي","التفكير التقاربي"],"خطوات الطريقة العلمية (إحساس، تحديد، فروض، اختبار، نتيجة) تمثل التفكير العلمي. الحدسي بلا خطوات، والتقاربي يبحث عن إجابة واحدة."],
["L10","m","ربط طالب ملاحظاته عن ارتفاع الحرارة بمعلوماته السابقة ثم أصدر حكماً بأن المعادن تتمدد بالحرارة. العملية العقلية:",["الاستدلال","الحفظ","التذكر","التخيل"],"الاستدلال وصول إلى نتيجة بناءً على أدلة كافية مربوطة بالمعرفة السابقة. الحفظ والتذكر استرجاع، والتخيل تصور."],
["L10","","توليد الطالب أفكاراً غير مألوفة من تلقاء نفسه دون تغيير في طبيعة الموقف يمثل:",["المرونة التلقائية","المرونة التكيفية","الطلاقة اللفظية","الأصالة"],"المرونة التلقائية إنتاج أفكار متنوعة تلقائياً، والتكيفية تغيير الوجهة الذهنية لمواجهة موقف جديد، والطلاقة كمّ، والأصالة ندرة."],
["L10","hm","طلب معلم من طلابه إيجاد علاقة بين «المفتاح» و«مدير المدرسة» وهما مفهومان لا رابط بينهما لتوليد أفكار جديدة. الأسلوب المستخدم:",["الإثارة العشوائية","العصف الذهني","القبعات الست","الكلمات المترابطة"],"الإثارة العشوائية آلية إبداعية تربط مفهومين متباعدين. العصف الذهني توليد حر لأفكار حول مشكلة، والكلمات المترابطة للتفكير الناقد."],
["L10","","وزّع معلم قوائم كلمات وطلب من الطلاب تمييز المترابط منها عن غير المترابط وتعليل ذلك. المهارة والاستراتيجية:",["التفكير الناقد بالكلمات المترابطة","التفكير الإبداعي بالإثارة العشوائية","ما وراء المعرفة بالتساؤل الذاتي","التفكير الجانبي بالقبعات"],"الكلمات المترابطة استراتيجية لتعليم التفكير الناقد (التمييز والتصنيف). الإثارة العشوائية إبداعية."],
["L10","hm","أثناء مناقشة مشروع، طلب المعلم من مجموعة أن تذكر الفوائد والإيجابيات فقط، ومن أخرى أن تذكر المخاطر والسلبيات. القبعتان على الترتيب:",["الصفراء، والسوداء","الحمراء، والخضراء","البيضاء، والزرقاء","الخضراء، والصفراء"],"عند ديبونو: الصفراء إيجابيات، السوداء سلبيات ومخاطر، الحمراء مشاعر، الخضراء إبداع، البيضاء حقائق، الزرقاء تنظيم واتخاذ قرار."],
["L10","","القبعة التي يرتديها من يدير جلسة التفكير ويحدد تسلسلها ويتخذ القرار النهائي:",["الزرقاء","البيضاء","الحمراء","الخضراء"],"الزرقاء قبعة التنظيم والضبط واتخاذ القرار. البيضاء حقائق محايدة، والحمراء عاطفة، والخضراء ابتكار."],
// ===== L11 طرق التدريس =====
["L11","hm","يعرض معلم التاريخ موضوع الهجرة النبوية عبر مراكز تعلم موزعة في الصالة تمر عليها المجموعات بالتناوب لتقرأ وتستمع وتشاهد. الدور المناسب للمعلم:",["الميسّر الذي يقدم الدعم والإيضاح عند الحاجة","المحاضر الذي يشرح الطرق المناسبة","المراقب الذي يرصد التقدم فقط","المقوّم الذي يحلل الأداء ويقترح التحسين"],"في مراكز التعلم يتعلم الطلاب بأنفسهم ويحتاجون ميسّراً يدعمهم عند الحاجة. المحاضر يناقض فكرة المراكز، والمراقب والمقوّم أدوار جزئية."],
["L11","m","معلم يفوض طلابه مسؤولية تنظيم تعلمهم وتوزيع المهام بينهم ويكتفي بالمتابعة. يمثل دور المعلم:",["المفوّض","التقليدي","المرشد","الملقن"],"المعلم المفوّض يفوض المسؤولية للطلاب ويراقب. التقليدي والملقن ناقل للمعلومة، والمرشد يوجه ويرشد."],
["L11","","دور المعلم الذي يركز على توجيه المتعلم إلى مصادر التعلم وطرقه هو دور المعلم:",["المرشد","المفوّض","التقليدي","الممتحن"],"المعلم المرشد يوجه المتعلم. المفوض يفوض المسؤولية، والتقليدي يلقن."],
["L11","m","بدأ معلم اللغة درسه بتمهيد ثم عرض الأمثلة ثم ربطها بالقديم ثم استنتج القاعدة ثم طبّق عليها. الطريقة المتبعة:",["الاستدلالية (الهربارتية)","الاستنباطية","الحوارية","المشروع"],"خطوات هربارت الخمس: تمهيد، عرض، ربط، استنتاج، تطبيق تجمع الاستقراء والاستنباط. الاستنباطية تبدأ بالقاعدة، والحوارية أسئلة وأجوبة."],
["L11","h","من مزايا الطريقة الاستقرائية أنها:",["تربط النظرية بالتطبيق وتصلح للمجموعات الكبيرة","سريعة وتوفر الوقت","لا تحتاج جهداً من الطالب","تضمن عدم نسيان القاعدة لأنها تُعطى أولاً"],"الاستقراء يبدأ بالأمثلة فيبذل الطالب جهداً ويربط النظرية بالتطبيق، وعيبه طول الوقت. السرعة وتقديم القاعدة أولاً من سمات الاستنباط."],
["L11","","طلب المشرف من المعلم توضيح الفرق بين «المدخل» و«النموذج» في التدريس. الإجابة الصحيحة أن النموذج:",["إطار نظري يصف خطوات التدريس وتُشتق منه الاستراتيجيات","مرادف لأسلوب المعلم الشخصي","الفلسفة العامة التي يستند إليها التدريس","أداة أو وسيلة تعليمية"],"النموذج تصور نظري لخطوات التدريس (جويس وويل)، والمدخل الفلسفة والمنطلقات، والأسلوب ما يميز المعلم شخصياً."],
["L11","m","رتّب معلم المادة من السهل إلى الصعب ومن المحسوس إلى المجرد. المدخل المتبع:",["المنطقي","التاريخي","الديني","التكاملي"],"المدخل المنطقي يعتمد التدرج المنطقي للمادة. التاريخي يتتبع تطور الفكر عبر العصور، والتكاملي يربط المادة بغيرها."],
["L11","","ربط معلم الرياضيات درس النسبة بدرس الزكاة في الفقه وبقراءة الخرائط في الجغرافيا. المدخل المتبع:",["التكاملي","المنطقي","الضبط","النشاط"],"المدخل التكاملي يربط المادة بالمواد الأخرى بعلاقات أفقية. المنطقي ترتيب داخل المادة، والضبط تحكم في السلوك، والنشاط فعل الطالب."],
["L11","m","موقف يقول فيه الطالب: «لا أعرف الحل الآن لكن أريد الوصول إليه». هذا الموقف يمثل مشكلة تعليمية لأنه يحتوي على:",["مانع وهدف يؤدي بلوغه إلى تعلم","قاعدة جاهزة وأمثلة","معلومات محفوظة تُسترجع","تعزيز فوري"],"المشكلة موقف غامض فيه هدف يسعى إليه المتعلم ومانع يحول دونه ويتعلم أثناء تجاوزه."],
["L11","","آخر مراحل تنفيذ المشروع التعليمي بعد الخطة والتنفيذ والتقويم هي:",["كتابة التقرير","اختيار المشروع","تشكيل المجموعات","جمع الأدوات"],"مراحل المشروع: خطة، تنفيذ، تقويم، ثم كتابة التقرير. اختيار المشروع وتشكيل المجموعات في البداية."],
["L11","m","عرض معلم على طلابه موقفاً واقعياً مفصلاً لمدرسة تعاني من التنمر وطلب منهم تحليله واقتراح قرار للعلاج. الطريقة:",["دراسة الحالة","العرض العملي","المحاضرة","التعليم المبرمج"],"دراسة الحالة تحليل موقف واقعي أو خيالي واتخاذ قرار. العرض العملي أداء المعلم أمام الطلاب، والمبرمج خطوات صغيرة."],
["L11","hm","كلّف المعلم جميع طلابه بالمهام نفسها على أن يعمل كل طالب منفرداً. هذا النمط يسمى:",["التعليم الفردي","التعليم التفريدي","التعلم الذاتي","التعلم التعاوني"],"التعليم الفردي: المهام نفسها لكل طالب منفرداً. التفريدي مهام مختلفة لكل طالب بحسب ميوله، والذاتي برغبة المتعلم دون معلم."],
["L11","","صمم المعلم لكل طالب مهام وأنشطة خاصة به بحسب توجهه وميوله. النمط:",["التعليم التفريدي","التعليم الفردي","التعليم الجمعي","التدريس المباشر"],"التفريدي يخصص المهام لكل طالب. الفردي مهام موحدة فردياً، والجمعي للصف كله."],
["L11","m","وقّع المعلم مع طالب اتفاقاً مكتوباً يتعهد فيه الطالب بإنجاز مهام محددة خلال أسبوعين وفق معايير مقابل تقدير. هذا يسمى:",["عقد التعلم","الحقيبة التعليمية","الموديول","الخطة العلاجية"],"عقد التعلم اتفاق مكتوب بين المعلم والطالب على مهام ومعايير ومكافأة. الحقيبة والموديول مواد تعلم ذاتي، والخطة العلاجية إجراء للمعلم."],
["L11","","برنامج تعليمي علاجي يُصمم لطالب بعينه بعد تشخيص مستواه يسمى:",["التعلم الموصوف للفرد","التعلم التعاوني","التعليم المبرمج الخطي","التدريس المصغر"],"التعلم الموصوف للفرد برنامج فردي علاجي بعد التشخيص. التعاوني جماعي، والمبرمج عام للجميع، والمصغر لتدريب المعلمين."],
["L11","m","أراد معلم الكيمياء تدريب طلابه على تجربة خطرة لا يمكن إجراؤها في المختبر المدرسي. نوع البرمجية الأنسب:",["برامج المحاكاة","برامج التدريب والممارسة","الألعاب التعليمية","برامج الاستقصاء"],"المحاكاة تمثل المواقف الخطرة أو المكلفة بأمان. التدريب والممارسة لتثبيت مهارة، والألعاب للتنافس، والاستقصاء للبحث."],
["L11","h","التدريس التبادلي حوار حول نص مقروء يطبق أربع استراتيجيات على الترتيب:",["التنبؤ، توليد الأسئلة، التوضيح، التلخيص","التلخيص، التنبؤ، التوضيح، الأسئلة","القراءة، الحفظ، التسميع، التقويم","العصف، التصنيف، المقارنة، الحكم"],"استراتيجيات التدريس التبادلي (بالينسار وبراون): التنبؤ ثم توليد الأسئلة ثم التوضيح ثم التلخيص، وتنمي ما وراء المعرفة."],
["L11","m","يرتبط نجاح طالب في مسابقة صفية بخسارة زميله، فلا يفوز إلا واحد. بيئة التعلم هنا:",["تنافسية","تعاونية","فردية","تشاركية"],"البيئة التنافسية يرتبط فيها الفوز بخسارة الآخر. التعاونية نجاح الجميع معاً، والفردية كل طالب مستقل."],
["L11","","مراحل التعلم التعاوني في المجموعة على الترتيب:",["التعرف، تحديد المهمة، الإنتاجية، الإنهاء","الإنتاجية، التعرف، الإنهاء، تحديد المهمة","تحديد المهمة، الإنهاء، التعرف، الإنتاجية","الإنهاء، الإنتاجية، تحديد المهمة، التعرف"],"تبدأ المجموعة بالتعرف ثم تحديد المهمة والأدوار ثم العمل والإنتاج ثم الإنهاء وعرض النتاج."],
["L11","m","كلّف معلم الحاسب طالباً من الصف الثالث المتوسط بتدريس طلاب الصف الأول المتوسط مهارة أتقنها. نوع تدريس الأقران:",["عبر الصفوف","داخل الفصل","خارج الفصل للمنقطعين","أقران المجموعة"],"تدريس الأقران عبر الصفوف: طالب من صف أعلى يعلم طلاب صف أدنى. داخل الفصل بين زملاء الصف نفسه."],
["L11","","نشاط موجه يتنافس فيه الطلاب فردياً أو جماعياً بطريقة ممتعة لتحقيق أهداف الدرس يسمى:",["الألعاب التعليمية","لعب الأدوار","المحاكاة","العصف الذهني"],"الألعاب التعليمية تنافس ممتع موجه. لعب الأدوار تقمص شخصيات، والمحاكاة تمثيل موقف واقعي، والعصف توليد أفكار."],
["L11","m","كل ما يستخدمه المعلم والمتعلم من أجهزة وأدوات ومواد داخل الصف أو خارجه لإكساب خبرات محددة يسمى:",["الوسائل التعليمية","تقنيات التعليم","مصادر التعلم","المنهج"],"الوسائل التعليمية أدوات ومواد. تقنيات التعليم منظومة أشمل (إنسان وآلة وطريقة)، ومصادر التعلم كل ما يتفاعل معه المتعلم."],
// ===== L12 التخطيط =====
["L12","h","في هرم المعرفة تقع الحقائق في القاعدة والنظريات في القمة. الانتقال في التدريس من الحقائق وصولاً إلى النظريات يمثل:",["استقراءً من الجزء إلى الكل","استنباطاً من الكل إلى الجزء","انتقالاً من المجرد إلى المحسوس","تطبيقاً للقاعدة على الأمثلة"],"من الحقائق (جزئيات) إلى المفاهيم فالتعميمات فالقوانين فالنظريات (كليات) انتقال استقرائي. الاستنباط العكس."],
["L12","m","«أن يكتسب الطالب حب الوطن» و«أن يذكر الطالب ثلاث مدن سعودية» يمثلان على الترتيب هدفاً:",["عاماً، وسلوكياً","سلوكياً، وعاماً","وجدانياً، ونفس‑حركياً","تربوياً، وغاية"],"الأول عام غير قابل للقياس المباشر في حصة، والثاني سلوكي بفعل قابل للملاحظة ومحتوى محدد."],
// ===== L13 الاستراتيجيات والمنهج والتقنية =====
["L13","hm","درّس معلم موضوعاً بتكليف الطلاب في مجموعات ثنائية برسم خريطة ذهنية له. يُحكم على عمله بأنه تعلم نشط لأن:",["الطلاب عملوا على الحصول على المعلومات وبنوا الخريطة بأنفسهم","المعلم حدد كيفية بناء الخريطة","المجموعات الثنائية تقلل التفاعل","الخريطة الناتجة هي محتوى الكتاب"],"معيار التعلم النشط أن الطالب يبني المعرفة بنفسه. تحديد المعلم للكيفية لا يجعله نشطاً، والثنائيات لا تقلل التفاعل."],
["L13","m","رقّم المعلم أعضاء كل مجموعة من 1 إلى 4، وبعد المناقشة نادى رقماً عشوائياً ليجيب عن مجموعته. الاستراتيجية:",["الرؤوس المرقمة","الكرسي الساخن","حوض السمك","جيكسو"],"الرؤوس المرقمة تضمن استعداد كل عضو لأن أي رقم قد يُستدعى. الكرسي الساخن أسئلة لطالب خبير، وحوض السمك دائرتان، وجيكسو مجموعات خبرة."],
["L13","","رتّب المعلم الكراسي في دائرة داخلية تناقش القضية ودائرة خارجية تراقب وتدون الملاحظات ثم تتبادلان الأدوار. الاستراتيجية:",["حوض السمك","الرؤوس المرقمة","فكر‑زاوج‑شارك","الأعواد"],"حوض السمك: مشاركون في الداخل وملاحظون في الخارج. الأعواد سحب اسم عشوائي، والرؤوس المرقمة ترقيم الأعضاء."],
["L13","m","كتب الطالب في بطاقة رباعية تعريف المفهوم وخصائصه وأمثلة عليه وأمثلة لا تنتمي إليه. المنظم المستخدم:",["نموذج فراير","أشكال فن","جدول KWL","خريطة الشكل V"],"فراير منظم رباعي للمفهوم (تعريف، خصائص، أمثلة، لا أمثلة). فن للمقارنة، وKWL للمعرفة السابقة والمكتسبة."],
["L13","","كتب الطالب رسالة متقمصاً دور طبيب موجهة إلى أولياء الأمور بصيغة منشور توعوي عن موضوع النظافة. استراتيجية الكتابة الإبداعية التي تحدد الدور والجمهور والصيغة والموضوع:",["RAFT (رافت)","تنال القمر","شبكة الأسئلة","التساؤل الذاتي"],"RAFT عناصرها: الدور، الجمهور، الصيغة، الموضوع. تنال القمر للفهم القرائي، وشبكة الأسئلة جمع أسئلة الطلاب."],
["L13","m","استراتيجية فهم قرائي بخمس خطوات: التنبؤ، التنظيم، البحث، التلخيص، المقارنة. اسمها:",["تنال القمر","التدريس التبادلي","الخطوات الست","KWL"],"تنال القمر (أحرفها الأولى من خطواتها الخمس) وتشبه التدريس التبادلي الذي خطواته أربع (تنبؤ، أسئلة، توضيح، تلخيص)."],
["L13","","نموذج بنائي اجتماعي يمر بأربعة أطوار: التمهيدي ثم التركيزي ثم التحدي ثم التطبيق. هو نموذج:",["التعليم التوليدي","التغير المفاهيمي","دورة التعلم الخماسية","التعلم للإتقان"],"التعليم التوليدي (أوزبورن وويتروك) يولّد المعنى في سياق اجتماعي بأطوار أربعة. دورة التعلم الخماسية مراحلها 5E، والتغير المفاهيمي لبوسنر."],
["L13","m","لاحظ المعلم أن مفهوم الطالب الخاطئ بسيط ويمكن تعديله بإضافة معلومة، بينما مفهوم طالب آخر يحتاج إلى استبدال كامل. يسمى التغيران عند بوسنر:",["تطورياً، وثورياً","ثورياً، وتطورياً","استقبالياً، واكتشافياً","أفقياً، ورأسياً"],"التغير التطوري لتعديل بسيط، والثوري لاستبدال المفهوم كله. الاستقبالي والاكتشافي لأوزوبل، والأفقي والرأسي لانتقال الأثر."],
["L13","","طالب يسأل نفسه أثناء القراءة: «ماذا أعرف عن هذا؟ ما الذي لم أفهمه؟ كيف أتابع؟». الاستراتيجية:",["التساؤل الذاتي","العصف الذهني","الكرسي الساخن","لعب الأدوار"],"التساؤل الذاتي مهارة ما وراء معرفية يراقب بها الطالب فهمه. العصف توليد أفكار جماعي."],
["L13","hm","التفاعل بين المعلم والطلاب في الوقت نفسه من أماكن مختلفة عبر الفصول الافتراضية يسمى تعليماً:",["متزامناً","غير متزامن","مدمجاً","مبرمجاً"],"المتزامن في الوقت نفسه (تيمز، غرف الدردشة). غير المتزامن أوقات مختلفة (فيديو مسجل، بريد)، والمدمج حضوري وإلكتروني، والمبرمج خطوات صغيرة."],
["L13","h","رفع المعلم شرح الدرس مسجلاً على منصة ليشاهده الطلاب في الوقت الذي يناسبهم ويرسلوا أسئلتهم بالبريد. نمط التعليم:",["غير متزامن","متزامن","مباشر","تنافسي"],"اختلاف الوقت والمكان يجعل التفاعل غير متزامن. المتزامن يتطلب الحضور في الوقت نفسه."],
["L13","m","استخدم المعلم المنصة الإلكترونية داعماً للحصة الحضورية برفع الواجبات والمصادر فقط دون أن تحل محل التدريس. مستوى توظيف التعلم الإلكتروني:",["مساند","مدمج","كامل عن بعد","مقلوب"],"المساند يدعم الصفي دون تغيير بنيته. المدمج يوزع التعلم بين الحضوري والإلكتروني، والكامل يستبدل الحضور، والمقلوب يقلب مهام الصف والمنزل."],
["L13","","منظومة متكاملة من الإنسان والأجهزة والطرق والمواد تعمل معاً لتحقيق أهداف التعليم. هذا تعريف:",["تقنيات التعليم","الوسائل التعليمية","الكتاب المدرسي","المنهج الخفي"],"تقنيات التعليم منظومة أشمل من الوسائل (أجهزة ومواد فقط). الكتاب وعاء المحتوى، والخفي ما يُتعلم ضمنياً."],
["L13","m","المعلم والمكتبة والمعمل والإنترنت والمتحف جميعها أنظمة وموارد يتفاعل معها المتعلم لاكتساب الخبرة. المصطلح الجامع:",["مصادر التعلم","الوسائل التعليمية","التقويم البديل","المنهج الرسمي"],"مصادر التعلم تشمل الموارد البشرية وغير البشرية التي يتفاعل معها المتعلم. الوسائل أدوات ومواد فقط."],
["L13","h","مدخل منظم لتخطيط التعليم وتطويره وتقويمه يمر بمراحل التحليل والتصميم والتطوير والتنفيذ والتقويم. هذا المدخل ونموذجه:",["التصميم التعليمي، ونموذج ADDIE","التقويم البديل، ونموذج تايلر","التعلم النشط، ونموذج 5E","دمج التقنية، ونموذج SAMR"],"ADDIE أشهر نماذج التصميم التعليمي. تايلر للمنهج، و5E دورة تعلم، وSAMR لمستويات دمج التقنية."],
["L13","m","صفحة إنترنت يستطيع عدة مستخدمين تحريرها وإضافة محتوى إليها تشاركياً كما في ويكيبيديا تسمى:",["الويكي","المدونة","البودكاست","الفيديو التفاعلي"],"الويكي تحرير جماعي. المدونة صفحة شخصية للنشر والتعليق، والبودكاست محتوى صوتي، والفيديو التفاعلي يمزج الفيديو بالتحكم."],
["L13","","أنشأ المعلم صفحة شخصية ينشر فيها تأملاته وشروحه ويعلق عليها الطلاب. الأداة:",["المدونة","الويكي","قاعدة البيانات","الحوسبة السحابية"],"المدونة للنشر الشخصي والتعليق. الويكي تحرير جماعي، والسحابية تخزين وموارد عبر الإنترنت."],
["L13","m","سجل المعلم شروح الدروس ملفات صوتية ليستمع إليها الطلاب في الحافلة أو المنزل. الأداة:",["البودكاست التعليمي","الفيديو التفاعلي","الواقع المعزز","الرحلة المعرفية"],"البودكاست محتوى صوتي مسجل. الفيديو التفاعلي مرئي، والواقع المعزز يضيف عناصر رقمية للواقع، والرحلة المعرفية بحث موجه في الويب."],
["L13","hm","وجّه معلم الأحياء كاميرا الجهاز اللوحي إلى صورة القلب في الكتاب فظهر مجسم ثلاثي الأبعاد ينبض فوق الصفحة. التقنية:",["الواقع المعزز","الواقع الافتراضي","الفيديو التفاعلي","الحوسبة السحابية"],"الواقع المعزز يضيف عناصر رقمية إلى الواقع الحقيقي في الوقت نفسه. الافتراضي يغمر المستخدم في بيئة رقمية كاملة."],
["L13","","وسيلة تمزج بين الحاسوب والفيديو وتسمح للطالب بالتحكم والتفرع وتُعد فعالة في التعلم الفردي:",["الفيديو التفاعلي","البودكاست","الويكي","المدونة"],"الفيديو التفاعلي يسمح بالتحكم والتفرع وفق استجابة المتعلم. البودكاست صوتي، والويكي والمدونة نصيتان."],
["L13","m","أراد المعلم تنظيم درجات طلابه في جدول ورسم مخطط بياني لمقارنتها. البرنامج الأنسب:",["إكسل","أكسس","باوربوينت","وورد"],"إكسل جداول وحسابات ورسوم بيانية. أكسس لقواعد البيانات العلائقية، وباوربوينت للعروض، ووورد للنصوص."],
["L13","","لإنشاء قاعدة بيانات علائقية تربط سجلات الطلاب بأولياء أمورهم ودرجاتهم يُستخدم برنامج:",["أكسس","إكسل","كانفا","كاهوت"],"أكسس نظام إدارة قواعد بيانات. إكسل جداول، وكانفا تصميم، وكاهوت ألعاب تفاعلية."],
["L13","m","أراد المعلم تصميم ملصق تعليمي جذاب للصف دون مهارات تصميم متقدمة، وبناء خريطة معرفية إلكترونية. الأداتان على الترتيب:",["كانفا، وبوبلت","أكسس، وإكسل","زوم، وتيمز","SPSS، وكاهوت"],"كانفا للتصميم المرئي، وبوبلت للخرائط المعرفية. أكسس وإكسل بيانات، وزوم وتيمز اجتماعات، وSPSS تحليل إحصائي."],
["L13","","معايير دولية توجه توظيف التقنية في التعليم للطلاب والمعلمين والقادة تعرف باسم:",["ISTE","TPACK","SAMR","ADDIE"],"ISTE الجمعية الدولية للتقنية في التعليم ومعاييرها. TPACK إطار معرفة المعلم، وSAMR مستويات الدمج، وADDIE تصميم تعليمي."],
["L13","m","استخدم المعلم أداة ذكاء اصطناعي لتوليد أسئلة تدريبية. الإجراء الصحيح قبل عرضها على الطلاب:",["مراجعة دقتها ومناسبتها للأهداف ثم استخدامها","عرضها مباشرة لأن الأداة دقيقة دائماً","رفض استخدام الأداة نهائياً","تركها للطلاب ليحكموا على صحتها"],"الذكاء الاصطناعي أداة مساعدة قد تخطئ، فيبقى التحقق من الدقة والمواءمة مسؤولية المعلم."],
["L13","h","يتكون المنهج بوصفه نظاماً من:",["مدخلات وعمليات ومخرجات وتغذية راجعة","أهداف ومحتوى فقط","كتاب مدرسي ومعلم","اختبارات ودرجات"],"نظرة النظم للمنهج: مدخلات (أهداف ومحتوى) وعمليات (طرق وأنشطة) ومخرجات (نواتج) وتغذية راجعة (تقويم)."],
["L13","m","معلم يرى أن المنهج هو الكتاب المقرر وأن مهمته حفظ المعلومات واستظهارها، بينما يرى زميله أن المنهج جميع الخبرات التي تهيئها المدرسة داخلها وخارجها. المفهومان على الترتيب:",["تقليدي، وحديث","حديث، وتقليدي","خفي، ورسمي","فارغ، وحلزوني"],"المنهج التقليدي يساوي المقرر والحفظ، والحديث يشمل كل الخبرات ويراعي المتعلم. الخفي والفارغ والحلزوني مفاهيم أخرى."],
["L13","","الفرق بين المقرر والكتاب المدرسي أن المقرر:",["موضوعات محددة في مادة لصف معين، والكتاب وعاء يحمل المحتوى والوسائل والأنشطة","مرادف للكتاب تماماً","أشمل من المنهج","يقتصر على الأنشطة اللاصفية"],"المقرر قائمة الموضوعات، والكتاب الوعاء المادي للمحتوى والأنشطة، والمنهج أشمل منهما."],
["L13","m","رتّب المعلم موضوعات الوحدة وفق خصائص المتعلمين وحاجاتهم وميولهم لا وفق التسلسل المنطقي للمادة. تنظيم المحتوى هنا:",["سيكولوجي (نفسي)","منطقي","حلزوني","محوري"],"التنظيم السيكولوجي يبدأ من المتعلم، والمنطقي من بنية المادة (السهل للصعب). الحلزوني تكرار بعمق، والمحوري جزء مشترك واختياري."],
["L13","","المدى في مصفوفة المدى والتتابع يمثل البعد:",["الأفقي (اتساع المحتوى في الصف الواحد)","الرأسي (تدرج المحتوى عبر الصفوف)","الزمني للحصة","الوجداني للأهداف"],"المدى اتساع أفقي في المستوى الواحد، والتتابع تدرج رأسي عبر السنوات."],
["L13","m","تنظيم منهجي يوظف التقنية في تقديم الخبرات ويعتمد على الخطو الذاتي للمتعلم. يسمى المنهج:",["التكنولوجي","المحوري","الحلزوني","الخفي"],"المنهج التكنولوجي قائم على التقنية والخطو الذاتي. المحوري مشترك واختياري، والحلزوني لبرونر، والخفي ضمني."],
// ===== L14 بيئات التعلم =====
["L14","hm","أي المعلمين الأربعة مصيب في إعداد الإجراءات الصفية لتحقيق العدالة والاحترام؟ أشرف: لا يحبذ وضع قواعد. فهد: يضع قواعد لضبط السلوك ويشرح للطلاب فوائدها. حسان: يطلب من كل طالب وضع قواعد تناسب ظروفه. سليم: يحرص على صداقة الطلاب ويضع قواعد تراعي مشاعرهم.",["فهد","سليم","أشرف","حسان"],"القواعد الصفية الفعالة قليلة وواضحة وموحدة ويُشرح للطلاب مسوغاتها. غياب القواعد فوضى، وقواعد لكل طالب تناقض العدالة، والقواعد المبنية على الصداقة والمشاعر غير موضوعية."],
["L14","m","أشرك المعلم طلابه في وضع القواعد ومراقبة التزامهم بها بأنفسهم حتى قلّ تدخله تدريجياً. هذا الأسلوب:",["الإدارة الذاتية للصف","النمط التسلطي","النمط الفوضوي","العقاب الجماعي"],"الإدارة الذاتية تنقل الضبط من المعلم إلى الطلاب (انضباط ذاتي). التسلطي يفرض، والفوضوي يترك، والجماعي يعاقب الكل."],
["L14","","قدّم المعلم لطالب منطوٍ تعليمات وتدريبات ليعبّر عن رأيه ويطلب حقوقه بثقة دون عدوان. الأسلوب:",["السلوك التوكيدي","الإغراق","الكف المتبادل","الإشباع"],"السلوك التوكيدي يبني ثقة الطالب بنفسه في التعبير. الإغراق مواجهة المخاوف دفعة واحدة، والكف المتبادل إحلال استجابة محل أخرى."],
["L14","m","طالب يعض أظافره عند التوتر، فدرّبه المعلم على الضغط على كرة إسفنجية عند الشعور بالتوتر بديلاً عن العض. الأسلوب:",["الكف المتبادل","الإشباع","التلقين","ضبط المثير"],"الكف المتبادل إحلال استجابة مقبولة لا تجتمع مع غير المرغوبة. الإشباع تقديم المثير بكثرة، والتلقين تلميح، وضبط المثير تعديل البيئة."],
