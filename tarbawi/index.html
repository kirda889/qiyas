الطالب بآخر في منتصف المشهد","إنهاء النشاط وتحويله إلى محاضرة"],"في لعب الأدوار لا يُقاطع المشهد ما دام آمناً؛ فالمناقشة والتقويم مرحلة تلي التمثيل، وقد يُعاد المشهد بعدها. المقاطعة أو الاستبدال يكسران الموقف ويحرجان الطالب."],["L11","m","قسّم معلم اللغة العربية الطلاب إلى متقدم للوظيفة ومسؤول توظيف، وطلب منهم تمثيل مقابلة عمل أمام الصف ثم مناقشة ما حدث. الاستراتيجية المستخدمة هي:",["لعب الأدوار","العصف الذهني","التدريس التبادلي","الاستقراء"],"لعب الأدوار محاكاة لموقف واقعي يتقمص فيه الطلاب أدواراً ثم يناقشونها. العصف توليد أفكار، والتبادلي حوار حول نص مقروء."],["L11","m","أثناء جلسة عصف ذهني سخر طالب من فكرة زميله قائلاً إنها غير منطقية. الإجراء الأنسب من المعلم هو:",["تذكير الصف بقاعدة إرجاء الحكم ومواصلة جمع الأفكار","حذف الفكرة التي سُخر منها لأنها غير منطقية","إيقاف الجلسة ومعاقبة الطالب الساخر","الطلب من صاحب الفكرة الدفاع عنها الآن"],"إرجاء الحكم قاعدة أساسية، والمعلم يعيد تثبيتها دون قطع الجلسة. حذف الفكرة أو الدفاع عنها الآن يُدخل التقويم في مرحلة التوليد، والعقاب يوقف تدفق الأفكار."],["L11","","كلّف المعلم طالباً متفوقاً بشرح درس الكسور لزميل يواجه صعوبة فيه. المستفيد من هذا الإجراء هو:",["الطالبان معاً؛ فالقرين المعلّم يرسخ فهمه والمتعلم يتلقى شرحاً بلغة قريبة منه","الطالب الضعيف وحده","الطالب المتفوق وحده","المعلم فقط لأنه وفر وقته"],"من مزايا تدريس الأقران أن الشرح يعمق فهم القرين المعلّم، وأن المتعلم يستفيد من لغة قريبة منه. حصر الفائدة في طرف واحد يغفل هذه الميزة."],["L11","m","يريد معلم جديد التدرب على مهارة طرح الأسئلة الصفية فقط، دون الدخول في درس كامل، والحصول على تغذية راجعة من مدرب وزملاء. الأسلوب الأنسب له هو:",["التدريس المصغر","حضور دورة نظرية عن الأسئلة","قراءة كتاب في طرق التدريس","تدريس حصة كاملة أمام المشرف"],"التدريس المصغر مصمم لهذا الغرض: مهارة واحدة، وقت قصير، تغذية راجعة، وإعادة أداء. الدورة النظرية والقراءة لا تتيحان الممارسة، والحصة الكاملة تشتت التركيز عن المهارة الواحدة."],["L11","m","طلبت معلمة العلوم من الطالبات زراعة بذور في أوعية ومتابعة نموها يومياً وتسجيل الملاحظات. نوع الخبرة وفق مخروط ديل:",["خبرة مباشرة هادفة","خبرة ممثلة","رموز بصرية","خبرة بديلة عبر الفيديو"],"الطالبة تمارس النشاط الحقيقي بنفسها، وهذه الخبرة المباشرة الهادفة في قاعدة المخروط. الخبرة الممثلة دراما، والفيديو والرموز أكثر تجريداً."],["L11","m","يريد معلم الكيمياء تعريف طلابه بتفاعل خطر لا يمكن إجراؤه في معمل المدرسة. الوسيلة الأنسب هي:",["المحاكاة الحاسوبية للتجربة","إجراء التجربة بحذر مع تقليل الكميات","الاكتفاء بوصف التجربة شفهياً","تكليف الطلاب بإجرائها في المنزل"],"المحاكاة خبرة بديلة آمنة تقرب التجارب الخطرة أو المكلفة. إجراؤها بحذر أو في المنزل خطر، والوصف الشفهي رمز لفظي ضعيف الأثر."],["L11","m","يقود معلم الفلسفة طلابه بسلسلة أسئلة متتابعة حتى يكتشف كل طالب التناقض في رأيه ويصل بنفسه إلى الرأي الصواب. الطريقة المستخدمة هي:",["الطريقة الحوارية (السقراطية)","المحاضرة","التعليم المبرمج","لعب الأدوار"],"الحوار السقراطي يقوم على أسئلة متتابعة تقود المتعلم إلى اكتشاف الحقيقة. المحاضرة تقدم الرأي جاهزاً، والمبرمج خطوات مكتوبة، ولعب الأدوار تمثيل."],["L11","","أي الطرق الآتية لا تُعد من الطرق المتمركزة حول المتعلم؟",["المحاضرة","التعلم التعاوني","الاكتشاف الموجه","المشروعات"],"المحاضرة تتمركز حول المعلم بوصفه مصدر المعرفة. التعاوني والاكتشاف والمشروعات تنقل النشاط إلى المتعلم."],["L11","","دعا المعلم ثلاثة متخصصين ليعرض كل منهم جانباً من موضوع «ترشيد المياه» أمام الطلاب، ثم فتح باب النقاش والأسئلة. هذا الأسلوب يسمى:",["الندوة","المناظرة","لعب الأدوار","العصف الذهني"],"الندوة عرض عدة متخصصين لجوانب موضوع واحد يعقبه نقاش. المناظرة مجموعتان مؤيدة ومعارضة، والعصف توليد أفكار من الطلاب أنفسهم."],["L11","m","يدرّس معلم صفاً فيه 45 طالباً محتوى نظرياً كثيفاً في حصة واحدة قبل الاختبار. الطريقة الأنسب لهذا الموقف هي:",["المحاضرة المدعومة بالعرض والأسئلة القصيرة","الاكتشاف الحر","المشروعات الجماعية","لعب الأدوار"],"المحاضرة اقتصادية في الوقت وتناسب الأعداد الكبيرة والمحتوى الكثيف، ويُحسّنها دعمها بالعرض والأسئلة. الاكتشاف الحر والمشروعات تحتاج وقتاً طويلاً، ولعب الأدوار لا يناسب المحتوى النظري الكثيف."],["L11","m","الطريقة الاستقرائية أنسب ما تكون لتعليم:",["المفاهيم والتعميمات","الحقائق المنفصلة كالتواريخ","المهارات الحركية","القراءة الجهرية"],"الاستقراء يبني المفهوم أو القاعدة من الأمثلة، فيناسب المفاهيم والتعميمات. الحقائق المنفصلة تُحفظ مباشرة، والمهارات الحركية تحتاج العرض والممارسة."],["L12","h","كتب معلم الهدف الآتي: «يوضح المعلم مفهوم التفاعل الكيميائي». الخلل في هذه الصياغة أنها:",["تصف سلوك المعلم لا سلوك المتعلم","تتضمن أكثر من ناتج تعلم","غير مرتبطة بالمحتوى","تفتقر إلى الفعل السلوكي"],"الهدف السلوكي يصف ما سيفعله الطالب بعد التعلم، والصياغة هنا فاعلها المعلم. الفعل «يوضح» سلوكي والمحتوى محدد، والناتج واحد."],["L12","","كتب معلم الهدف: «أن يقرأ الطالب الدرس الثالث من الكتاب». الخلل في هذا الهدف أنه:",["يصف نشاطاً تعليمياً لا ناتج تعلم","يصف سلوك المعلم","يتضمن أكثر من ناتج","غير قابل للملاحظة"],"الهدف السلوكي يصف الناتج الذي يكتسبه الطالب (كأن يستخرج الفكرة الرئيسة)، أما قراءة الدرس فنشاط يؤدى للوصول إلى الناتج. الفعل هنا ملاحظ وفاعله الطالب وناتجه واحد."],["L12","m","كتب معلم الهدف: «أن يذكر الطالب أركان الإسلام ويشرح كل ركن منها». الخلل في صياغته أنه:",["يتضمن أكثر من ناتج تعلم في هدف واحد","يصف سلوك المعلم","يستخدم فعلاً غير قابل للقياس","يفتقر إلى المحتوى"],"القاعدة أن يتضمن الهدف ناتج تعلم واحداً؛ وهنا «يذكر» و«يشرح» ناتجان من مستويين مختلفين. الفعلان قابلان للقياس والفاعل هو الطالب."],["L12","m","في الهدف: «أن يحل الطالب 8 مسائل من 10 على الجمع خلال خمس دقائق دون آلة حاسبة»، عبارة «8 مسائل من 10» تمثل:",["معيار الأداء (الإتقان)","شرط الأداء","الفعل السلوكي","المحتوى"],"المعيار هو الحد الأدنى المقبول للأداء. «دون آلة حاسبة» شرط الأداء، و«يحل» الفعل السلوكي، و«مسائل الجمع» المحتوى."],["L12","","في الهدف: «أن يرسم الطالب خريطة المملكة باستخدام الأطلس في 10 دقائق»، عبارة «باستخدام الأطلس» تمثل:",["شرط الأداء","معيار الأداء","الفعل السلوكي","ناتج التعلم"],"الشرط هو الظرف أو الأدوات التي يُؤدى فيها السلوك. «في 10 دقائق» معيار زمني، و«يرسم» الفعل السلوكي."],["L12","","الهدف: «أن يكتسب الطالب مهارات القراءة الناقدة خلال الفصل الدراسي» يمثل:",["هدفاً عاماً للمقرر","هدفاً سلوكياً","غاية تربوية","هدف حصة واحدة"],"الهدف يمتد على فصل كامل ولا يقاس مباشرة في حصة، فهو هدف عام. الغاية أوسع وترتبط بالمجتمع، والسلوكي محدد بحصة."],["L12","","طلب المعلم من الطالب: «لخص الفقرة بأسلوبك الخاص». هذا الطلب يقيس مستوى:",["الفهم","التذكر","التحليل","الإبداع"],"التلخيص وإعادة الصياغة بأسلوب خاص من أفعال الفهم. التذكر يستدعي النص نفسه، والتحليل يفكك، والإبداع يبني جديداً."],["L12","","طلب المعلم من طلابه الحكم على صحة حل زميلهم للمسألة مع تبرير الحكم بمعايير واضحة. هذا الطلب يقيس مستوى:",["التقويم","التطبيق","الفهم","التذكر"],"إصدار الحكم المبرر وفق معايير هو التقويم. التطبيق حل المسألة، والفهم شرح الخطوات."],["L12","","أضاف التصنيف المعدل لبلوم بُعداً جديداً هو:",["بُعد المعرفة: حقائقية ومفاهيمية وإجرائية وما وراء معرفية","بُعد الدافعية","بُعد المهارات الحركية","بُعد القيم"],"التصنيف المعدل ثنائي الأبعاد: العمليات المعرفية (تذكر…إبداع) وأنواع المعرفة الأربعة. البدائل الأخرى مجالات مستقلة لا أبعاداً للمعرفي."],["L12","","الهدف: «أن يصف الطالب خطوات إجراء تجربة قياس الكثافة» يتناول من بُعد المعرفة في التصنيف المعدل المعرفة:",["الإجرائية","الحقائقية","المفاهيمية","ما وراء المعرفية"],"الخطوات والطرائق معرفة إجرائية. الحقائقية مصطلحات وتفاصيل، والمفاهيمية علاقات ونظريات، وما وراء المعرفية وعي الطالب بتفكيره."],["L12","m","راجع المشرف أسئلة اختبار معلم فوجد أن معظمها بصيغة «عدد، اذكر، عرّف». التوجيه الأنسب للمعلم هو:",["إضافة أسئلة تتطلب المقارنة والتعليل والحكم لتغطية المستويات العليا","زيادة عدد أسئلة التذكر لتكون أشمل","حذف كل أسئلة التذكر من الاختبار","تحويل الأسئلة كلها إلى مقالية"],"الأسئلة الحالية تقيس التذكر فقط، والاختبار الجيد يغطي المستويات العليا وفق جدول المواصفات دون إلغاء التذكر كلياً. تحويل النوع لا يغير المستوى بالضرورة."],["L12","h","الترتيب الصحيح لمستويات المجال الوجداني عند كراثوول تصاعدياً هو:",["الاستقبال، الاستجابة، التقييم، التنظيم، التميز بالقيمة","الاستجابة، الاستقبال، التنظيم، التقييم، التميز بالقيمة","الاستقبال، التقييم، الاستجابة، التميز بالقيمة، التنظيم","التنظيم، الاستقبال، الاستجابة، التقييم، التميز بالقيمة"],"يبدأ المجال الوجداني بالانتباه (الاستقبال) ثم المشاركة (الاستجابة) ثم تبني القيمة (التقييم) ثم ترتيب القيم (التنظيم) وينتهي بأن تصبح القيمة سمة ثابتة (التميز بالقيمة)."],["L12","m","لاحظ المعلم أن طالباً يصغي باهتمام لدرس عن النظافة دون أن يشارك أو يبادر. هذا الطالب في المستوى الوجداني:",["الاستقبال","الاستجابة","التقييم","التنظيم"],"الاستقبال هو الانتباه والإصغاء للمثير، وهو أدنى المستويات. الاستجابة تتطلب مشاركة فعلية، والتقييم تبني القيمة."],["L12","m","صار طالب ينظف مكانه ويحافظ على نظافة الصف من تلقاء نفسه في كل موقف حتى أصبح ذلك سمة معروفة عنه بين زملائه. هذا يدل على بلوغه المستوى الوجداني:",["التميز بالقيمة (الوسم)","الاستقبال","الاستجابة","التقييم"],"التميز بالقيمة أعلى المستويات: تصبح القيمة جزءاً ثابتاً من الشخصية يوجه السلوك باستمرار. الاستجابة مشاركة عند الطلب، والتقييم تبني القيمة دون أن تصير سمة ثابتة بعد."],["L12","","تطوع طالب للمشاركة في حملة نظافة الحي بعد درس عن النظافة. سلوكه يمثل المستوى الوجداني:",["الاستجابة","الاستقبال","التنظيم","التميز بالقيمة"],"الاستجابة هي المشاركة الفعلية والتطوع والتفاعل مع الموقف. الاستقبال اهتمام دون فعل، والتنظيم ترتيب منظومة القيم."],["L12","h","صاحب تصنيف الأهداف في المجال النفس‑حركي (المهاري) هو:",["سمبسون","كراثوول","بلوم","ماجر"],"سمبسون صاحب التصنيف السباعي للمجال النفس‑حركي (ومعه هارو وديف). كراثوول للوجداني، وبلوم للمعرفي، وماجر لصياغة الهدف السلوكي."],["L12","m","يؤدي طالب مهارة الخط العربي بتقليد حركة يد المعلم خطوة بخطوة تحت إشرافه. هذا الطالب في مستوى سمبسون:",["الاستجابة الموجهة","الآلية","الاستجابة المعقدة","الإبداع"],"الاستجابة الموجهة أداء المهارة بالتقليد والمحاولة تحت توجيه. الآلية أداء بثقة دون توجيه، والمعقدة أداء سلس لمهارة مركبة."],["L12","m","لاعب كرة سلة يعدّل حركة التصويب التي أتقنها لتناسب موقع المدافع المتغير في كل مرة. هذا الأداء يمثل مستوى سمبسون:",["التكيف","الاستجابة الموجهة","الإدراك الحسي","الاستعداد"],"التكيف تعديل المهارة المتقنة لمواجهة مواقف جديدة. الإدراك والاستعداد والاستجابة الموجهة مستويات دنيا سابقة للإتقان."],["L12","","بعد أن أنهى المعلم الجزء الأول من الدرس، قدم ربطاً قصيراً يمهد للجزء الثاني ويوضح علاقته بما سبق. نوع التهيئة هنا:",["الانتقالية","التوجيهية","الحافزة","التقويمية"],"التهيئة الانتقالية تُستخدم للانتقال السلس بين أجزاء الدرس. التوجيهية في بداية الدرس، والتقويمية تتحقق من الإتقان، والحافزة تثير الاهتمام."],["L12","","قبل الانتقال إلى الجزء الجديد من الدرس، طرح المعلم أسئلة سريعة ليتأكد من إتقان الطلاب للجزء السابق. نوع التهيئة هنا:",["التقويمية","التوجيهية","الحافزة","الانتقالية"],"التهيئة التقويمية تتحقق من مدى تمكن الطلاب مما سبق قبل البناء عليه. الانتقالية ربط لا تحقق، والتوجيهية ربط بالخبرات السابقة في البداية."],["L12","m","في الدقائق الأخيرة من الحصة، طلب المعلم من الطلاب تلخيص الأفكار الرئيسة للدرس وربطها بعضها ببعض. هذه الخطوة تسمى:",["الغلق","التهيئة","التقويم القبلي","التمهيد"],"الغلق خطوة ختامية لتلخيص الدرس وتثبيته. التهيئة والتمهيد في البداية، والتقويم القبلي قبل التدريس."],["L12","m","أعاد معلم أوراق الاختبار الشهري إلى طلابه بعد ثلاثة أسابيع من تطبيقه. أبرز مشكلة في هذا الإجراء أن:",["تأخر التغذية الراجعة يقلل أثرها في تصحيح التعلم","الطلاب سينسون أنهم اختُبروا","الدرجات ستكون أقل","المعلم سيحتاج إلى إعادة الاختبار"],"التغذية الراجعة الفورية أعلى أثراً، وتأخيرها يفصل بين الأداء ومعرفة النتيجة فيضعف التصحيح. البدائل الأخرى لا تصف أثر التأخير على التعلم."],["L12","h","جميع ما يأتي من خصائص التغذية الراجعة الفعالة ما عدا:",["أن تكون عامة مثل «أحسنت» دون تفصيل","أن تكون فورية","أن تكون محددة ووصفية","أن تركز على المهمة لا على شخص الطالب"],"التغذية الراجعة العامة لا تخبر الطالب ماذا أحسن وماذا يحسّن. الفورية والتحديد والتركيز على المهمة من خصائصها الجوهرية."],["L12","m","كتب معلمان تعليقين على مقال طالب؛ الأول: «ممتاز»، والثاني: «الفكرة واضحة لكن الدليل الثاني لا يدعمها، أضف مثالاً من النص». التعليق الأكثر فائدة للطالب هو:",["الثاني لأنه وصفي ومحدد ويوجه التحسين","الأول لأنه يرفع معنويات الطالب","الأول لأنه أقصر وأسرع","كلاهما بالقدر نفسه"],"التغذية الراجعة الوصفية المحددة توضح جوانب القوة والضعف وخطوة التحسين. «ممتاز» وحدها لا تعلّم شيئاً وإن كانت مشجعة."],["L12","m","عند تحليل محتوى درس في العلوم، تُصنف عبارة «يغلي الماء النقي عند 100 درجة مئوية عند مستوى سطح البحر» على أنها:",["حقيقة","مفهوم","تعميم","مهارة"],"الحقيقة معلومة محددة ثابتة قابلة للتحقق. المفهوم تصور مجرد لفئة (الغليان)، والتعميم علاقة بين مفهومين، والمهارة أداء."],["L12","","عبارة «كلما زاد الضغط الجوي ارتفعت درجة غليان السائل» تمثل في تحليل المحتوى:",["تعميماً (مبدأ)","حقيقة","مفهوماً","قيمة"],"التعميم علاقة بين مفهومين أو أكثر تنطبق على حالات كثيرة. الحقيقة معلومة جزئية محددة، والمفهوم كلمة أو تصور مفرد."],["L12","m","خُصص لوحدة «الكسور» 6 حصص من أصل 20 حصة للمقرر. إذا كان الاختبار يتكون من 40 سؤالاً، فعدد الأسئلة التي تستحقها الوحدة في جدول المواصفات هو:",["12 سؤالاً","6 أسئلة","20 سؤالاً","8 أسئلة"],"الوزن النسبي = 6 ÷ 20 = 30%، و30% من 40 = 12 سؤالاً. البديل 6 يخلط عدد الحصص بعدد الأسئلة."],["L12","","اشتكى طلاب من صعوبة الواجب وعدم فهم المطلوب منه. الإجراء الأنسب من المعلم عند تكليفهم بالواجب التالي هو:",["تقديم توجيهات محددة ونموذج للحل قبل التكليف","إلغاء الواجبات نهائياً","مضاعفة الواجب ليتدربوا أكثر","تكليف أولياء الأمور بحله معهم"],"التوجيهات الواضحة ونمذجة الحل من شروط الواجب الفعال. الإلغاء والمضاعفة لا يعالجان سبب الشكوى، ونقل الحل للأسرة يفقد الواجب غرضه."],["L12","m","كلف معلم الطلاب المشاغبين بواجب إضافي مضاعف عقاباً لهم. هذا الإجراء غير سليم لأنه:",["يكوّن اتجاهاً سلبياً نحو الواجب والمادة","يزيد تحصيل الطلاب أكثر من اللازم","يستغرق وقتاً في التصحيح","يخالف رغبة أولياء الأمور"],"الواجب أداة تعلم لا عقاب؛ ربطه بالعقاب يجعله منفراً ويقتل دافعيته. البدائل الأخرى لا تمس الأثر التربوي للإجراء."],["L12","m","يخطط معلم لدرس «جمع الكسور العشرية». أول ما ينبغي أن يتأكد منه قبل تنفيذ الدرس هو:",["إتقان الطلاب لمتطلب الدرس السابق وهو الكسور الاعتيادية والمنازل العشرية","توافر جهاز العرض في الفصل","موعد اختبار الوحدة","عدد الطلاب الغائبين"],"المتطلبات السابقة شرط لبناء التعلم الجديد، والتأكد منها جزء من التخطيط. الجهاز والموعد والغياب أمور تنظيمية لا تحدد إمكانية التعلم."],["L12","m","اكتشف المعلم أثناء التخطيط أن أنشطة الدرس تحتاج 70 دقيقة بينما الحصة 45 دقيقة. الإجراء الأنسب هو:",["إعادة ترتيب الأنشطة حسب أولويتها للأهداف وتأجيل الأقل أهمية","الاكتفاء بالشرح وتحويل كل الأنشطة إلى واجبات منزلية","أخذ حصة إضافية من زميل","تنفيذ الأنشطة كلها بسرعة دون تقويم"],"التخطيط يقوم على الأولوية للأهداف؛ فيُنفذ الأهم ويؤجل الباقي. تحويل الأنشطة كلها واجبات يفرغ الحصة من التطبيق، والحصة الإضافية والتسريع حلول غير منهجية."],["L12","","جميع ما يأتي من عناصر خطة الدرس اليومية ما عدا:",["توزيع المقرر على أسابيع الفصل","الأهداف السلوكية","التقويم","الوسائل التعليمية"],"توزيع المقرر على الأسابيع من التخطيط طويل المدى لا من الخطة اليومية. الأهداف والتقويم والوسائل عناصر أساسية في خطة الدرس."],["L12","m","يخطط معلم العلوم لدرس عن «الذرة» لطلاب الصف الأول المتوسط، ويعلم أن بعضهم لم يصل بعد إلى قدرة عالية على التجريد. الإجراء الأنسب في التخطيط هو:",["البدء بنماذج ومحسوسات وتمثيلات بصرية قبل الشرح المجرد","الاعتماد على التعريفات اللفظية المجردة لأنها أدق","تأجيل الدرس حتى ينضج الطلاب","تكليف الطلاب بقراءة الدرس من الكتاب فقط"],"التخطيط يراعي مستوى النمو المعرفي؛ فالمحسوسات والنماذج جسر إلى المجرد. التعريفات اللفظية والقراءة وحدها رموز مجردة، والتأجيل يهمل دور التعليم."],["L12","","الأفعال «يحكم، ينقد، يبرر، يفاضل» تنتمي إلى مستوى:",["التقويم","التطبيق","الفهم","التذكر"],"إصدار الأحكام المبررة وفق معايير هو التقويم. التطبيق استخدام، والفهم تفسير، والتذكر استرجاع."],["L12","m","أي الأهداف الآتية في مستوى الفهم وفق تصنيف بلوم؟",["أن يعطي الطالب مثالاً من عنده على الفعل المضارع","أن يعدد الطالب علامات رفع الفعل المضارع","أن يصمم الطالب لوحة تلخص أزمنة الفعل","أن يحكم الطالب على صحة إعراب زميله"],"إعطاء مثال من عند الطالب يدل على إدراك المعنى، وهو فهم. التعداد تذكر، والتصميم إبداع، والحكم تقويم."],["L12","","الهدف: «أن يصمم الطالب نموذجاً لمدينة مستدامة يوظف فيه مفاهيم الطاقة المتجددة» في مستوى:",["الإبداع (التركيب)","التطبيق","التحليل","الفهم"],"التصميم إنتاج بناء جديد يجمع عناصر متعددة، وهو الإبداع في التصنيف المعدل. التطبيق استخدام قاعدة في مسألة، والتحليل تفكيك."],["L12","m","الأهمية الأساسية للتخطيط للتدريس أنه:",["يوجه التنفيذ نحو الأهداف ويجنب العشوائية ويحدد الزمن والوسائل","يُرضي المشرف التربوي عند الزيارة","يقلل عدد الحصص المطلوبة","يغني عن التقويم في نهاية الدرس"],"التخطيط خريطة التنفيذ. إرضاء المشرف غاية شكلية، والتخطيط لا يقلل الحصص ولا يغني عن التقويم بل يتضمنه."],["L12","m","بدأ المعلم الحصة بسؤال: «لماذا تطفو السفينة الحديدية بينما يغرق مسمار صغير؟» ثم انتظر إجابات الطلاب قبل أن يبدأ الدرس. نوع التهيئة هنا:",["الحافزة","التقويمية","الانتقالية","الغلق"],"السؤال المحير يثير الاهتمام وحب الاستطلاع، وهذه التهيئة الحافزة. التقويمية تتحقق من إتقان السابق، والانتقالية بين أجزاء الدرس."],["L13","m","في صف مقلوب، اكتشف المعلم في بداية الحصة أن ثلث الطلاب لم يشاهدوا فيديو الدرس. الإجراء الأنسب هو:",["تطبيق نشاط تحقق قصير وتخصيص زاوية مشاهدة سريعة لمن لم يشاهد ثم مواصلة الأنشطة","إعادة شرح الدرس كاملاً للجميع","منع من لم يشاهد من المشاركة في الأنشطة","إلغاء الصف المقلوب نهائياً"],"الاستراتيجية تتطلب آلية تحقق ومعالجة سريعة دون إضاعة وقت الحصة. إعادة الشرح الكامل يعيد الصف التقليدي، والمنع عقاب لا يعالج، والإلغاء حل متسرع."],["L13","m","عمل الطلاب أسابيع عدة على إنتاج فيلم وثائقي عن تراث المنطقة ثم عرضوه أمام أولياء الأمور. الاستراتيجية المستخدمة هي:",["التعلم القائم على المشروعات","التعلم القائم على المشكلات","الاستقصاء العادل","الكرسي الساخن"],"العمل الممتد الذي ينتهي بمنتج يُعرض هو التعلم القائم على المشروعات. القائم على المشكلات ينطلق من مشكلة مفتوحة، والاستقصاء العادل مناظرة."],["L13","m","في درس عن المغناطيس، وزع المعلم مغناطيسات وأجساماً متنوعة وترك الطلاب يجربون ويسجلون ملاحظاتهم قبل أن يقدم أي شرح. هذه المرحلة في دورة التعلم الخماسية هي:",["الاستكشاف","التفسير","التوسع","التقويم"],"الاستكشاف مرحلة يعالج فيها الطلاب المواد بأنفسهم قبل الشرح. التفسير يقدم فيه المعلم المفهوم بعد الاستكشاف، والتوسع تطبيق في موقف جديد."],["L13","","بعد أن فهم الطلاب مفهوم الكثافة، طلب المعلم منهم تفسير سبب طفو السفن الضخمة. هذه المرحلة في دورة التعلم الخماسية هي:",["التوسع (الإثراء)","الانشغال","الاستكشاف","التفسير"],"التوسع تطبيق المفهوم في موقف جديد يعمق الفهم. الانشغال إثارة في البداية، والاستكشاف تجريب قبل الشرح، والتفسير تقديم المفهوم."],["L13","","قدم المعلم المفهوم نفسه لثلاث مجموعات بأنشطة مختلفة: مجموعة بالتجربة، وأخرى بالقراءة، وثالثة بمقطع مرئي. عنصر التمايز هنا هو:",["العملية","المنتج","المحتوى","التقويم"],"تنويع الأنشطة للوصول إلى المفهوم نفسه هو تمايز العملية. تمايز المحتوى يغير ما يُقدم، والمنتج يغير طريقة إظهار التعلم."],["L13","m","يريد المعلم أن يقارن الطلاب بين الخلية النباتية والحيوانية مبينين أوجه الشبه والاختلاف في شكل واحد. المنظم البصري الأنسب هو:",["أشكال فن (دائرتان متقاطعتان)","الخريطة الذهنية","الخط الزمني","الخريطة الجغرافية"],"أشكال فن مصممة للمقارنة: الشبه في التقاطع والاختلاف في الجانبين. الذهنية لفكرة واحدة، والخط الزمني للأحداث."],["L13","h","أجاب طالب إجابة خاطئة، فبدلاً من تصحيحها مباشرة طرح المعلم سلسلة أسئلة متدرجة قادته إلى الإجابة الصحيحة بنفسه. هذا الأسلوب يسمى:",["السبر المشجع","التغذية الراجعة المؤجلة","العقاب السالب","إعادة الصياغة"],"السبر المشجع سلسلة أسئلة بعد إجابة خاطئة تقود الطالب إلى الصواب. إعادة الصياغة تُستخدم عند عدم الإجابة، والتغذية المؤجلة تأتي لاحقاً."],["L13","m","لاحظ المشرف أن المعلم يطرح السؤال ثم يجيب عنه بنفسه بعد نحو ثانية واحدة إذا لم يرفع أحد يده. التوجيه الأنسب للمعلم هو:",["زيادة زمن الانتظار إلى 3–5 ثوانٍ قبل التدخل","طرح أسئلة أسهل فقط","الاكتفاء بسؤال المتفوقين","إلغاء الأسئلة الشفهية"],"قِصر زمن الانتظار يمنع الطلاب من التفكير فيجيب المعلم بنفسه. الأسئلة الأسهل والاقتصار على المتفوقين يقللان المشاركة، والإلغاء يفقد أداة مهمة."],["L13","","عند طرح الأسئلة الصفية، يُفضل أن يطرح المعلم السؤال أولاً ثم يختار المجيب، وذلك لـ:",["إبقاء جميع الطلاب منتبهين ومفكرين في السؤال","توفير وقت الحصة","ضمان إجابة الطالب المتفوق","تجنب إحراج الطالب الضعيف"],"اختيار المجيب قبل السؤال يجعل بقية الطلاب يتوقفون عن التفكير. البدائل الأخرى لا تعبر عن الغرض التربوي من الترتيب."],["L13","m","أجاب طالب إجابة ناقصة، فقال المعلم لطالب آخر: «ما رأيك في إجابة زميلك؟ هل تضيف إليها؟». هذا الأسلوب يسمى:",["إعادة توجيه السؤال (السبر المحوّل)","السبر التبريري","إعادة الصياغة","التلقين"],"إعادة التوجيه تحويل السؤال إلى طالب آخر للبناء على الإجابة. التبريري يطلب «لماذا» من المجيب نفسه، وإعادة الصياغة تغيير صياغة السؤال عند عدم الإجابة."],["L13","","ما يميز استراتيجية التعلم للإتقان عن التدريس التقليدي أن:",["زمن التعلم متغير ومعيار التحصيل ثابت","زمن التعلم ثابت ومعيار التحصيل متغير","التقويم فيها ختامي فقط","الطلاب فيها متجانسون"],"في الإتقان يُمنح كل طالب الوقت الذي يحتاجه لبلوغ المعيار نفسه، عكس التقليدي الذي يثبت الزمن فتتفاوت النتائج. التقويم فيها تكويني مستمر."],["L13","h","تخزين الملفات والتطبيقات على خوادم عبر الإنترنت بحيث يمكن الوصول إليها ومشاركتها من أي جهاز وفي أي وقت يسمى:",["الحوسبة السحابية","التعلم المتنقل","الواقع المعزز","التعليم المبرمج"],"الحوسبة السحابية تقدم التخزين والتطبيقات كخدمة عبر الإنترنت (قوقل درايف، ون درايف). الواقع المعزز يدمج عناصر رقمية بالواقع."],["L13","m","وضع معلم في عرضه التقديمي شرحاً نصياً لجهاز التنفس في شريحة، والرسم التوضيحي في شريحة أخرى منفصلة. وفق مبادئ ماير للوسائط المتعددة، هذا يخالف مبدأ:",["التقارب المكاني","التكرار الزائد","الشخصنة","التجزئة"],"مبدأ التقارب المكاني يقضي بوضع النص قرب الصورة التي يشرحها. التكرار الزائد يتعلق بتقديم النص المكتوب مع الصوت نفسه، والتجزئة بتقسيم العرض إلى أجزاء."],["L13","","وفق مبدأ الصيغة عند ماير، عند عرض رسم متحرك لعملية البناء الضوئي يكون التعلم أفضل إذا صاحبه:",["تعليق صوتي منطوق","نص مكتوب مطول على الشاشة","نص مكتوب وصوت يقرأه حرفياً معاً","لا شيء؛ الرسم وحده كافٍ"],"الصوت المنطوق مع الرسوم يوزع الحمل على القناتين السمعية والبصرية. النص المكتوب يزاحم الرسم في القناة البصرية، وتكرار النص مع الصوت نفسه يخالف مبدأ التكرار الزائد."],["L13","m","أضاف معلم إلى عرضه التقديمي موسيقى خلفية وصوراً تزيينية لا علاقة لها بالدرس بهدف التشويق، فلاحظ تشتت الطلاب. المبدأ الذي أخلّ به وفق ماير هو:",["الاتساق (حذف المواد غير المرتبطة)","التقارب الزماني","الشخصنة","الإشارة"],"مبدأ الاتساق يقضي بحذف الكلمات والصور والأصوات غير المرتبطة لأنها تستهلك الذاكرة العاملة. الزماني يتعلق بتزامن الصوت والصورة، والشخصنة بالأسلوب الحواري."],["L13","m","استبدل معلم السبورة التقليدية بعرض تقديمي يحتوي النص نفسه دون أي إضافة وظيفية. هذا المستوى في نموذج SAMR هو:",["الاستبدال","التعزيز","التعديل","إعادة التعريف"],"الاستبدال استخدام التقنية بديلاً مباشراً بلا تغيير وظيفي. التعزيز يضيف تحسيناً، والتعديل يعيد تصميم المهمة، وإعادة التعريف تخلق مهمة مستحيلة سابقاً."],["L13","m","تعاون طلاب مع طلاب من دولة أخرى عبر الإنترنت لإنتاج بحث مشترك بلغتين ونشره عالمياً، وهي مهمة ما كانت ممكنة دون التقنية. هذا المستوى في نموذج SAMR هو:",["إعادة التعريف","الاستبدال","التعزيز","التعديل"],"إعادة التعريف أعلى مستويات SAMR: مهمة جديدة كلياً غير ممكنة بلا تقنية. الاستبدال والتعزيز لا يغيران المهمة، والتعديل يعيد تصميمها دون أن تكون مستحيلة سابقاً."],["L13","m","نشر طالب صورة زميله على مجموعة الصف دون إذنه فتسبب في إحراجه. البعد الذي ينبغي للمعلم تعزيزه لدى الطلاب لمنع تكرار ذلك هو:",["المواطنة الرقمية وأخلاقيات الاستخدام","مهارة الكتابة على لوحة المفاتيح","التعلم المتنقل","الحوسبة السحابية"],"الموقف يتعلق بالخصوصية والاحترام في الفضاء الرقمي، وهو جوهر المواطنة الرقمية. البدائل الأخرى مهارات أو أنماط تقنية لا تعالج السلوك."],["L13","","قررت لجنة المناهج عدم تضمين موضوع معين في الكتاب عمداً، فلم يتعلمه الطلاب. هذا الموضوع ينتمي إلى:",["المنهج الفارغ (المحذوف)","المنهج الخفي","المنهج الرسمي","منهج النشاط"],"المنهج الفارغ عند آيزنر هو ما لم يُدرج عمداً فيتعلم الطالب بغيابه. الخفي يُتعلم ضمنياً، والرسمي مكتوب ومدرَّس."],["L13","","الوثيقة المكتوبة المعتمدة من الوزارة التي تحدد الأهداف والمحتوى والتقويم لكل مادة تمثل:",["المنهج الرسمي (المعلن)","المنهج الخفي","المنهج الفارغ","المنهج المُختبَر"],"المنهج الرسمي هو المخطط المكتوب المعتمد. الخفي غير مكتوب، والفارغ محذوف، والمختبَر ما يعيشه الطالب فعلاً."],["L13","h","تنظيم المنهج الذي يقوم على اهتمامات الطلاب وميولهم ويبنى على أساس حل المشكلات ويرتبط بجون ديوي هو:",["منهج النشاط","منهج المواد المنفصلة","المنهج المحوري","منهج المجالات الواسعة"],"منهج النشاط لديوي ينطلق من ميول الطلاب ومشكلاتهم. المواد المنفصلة تنظيم تقليدي، والمحوري محور مشترك ومواد اختيارية، والمجالات الواسعة دمج مواد متقاربة."],["L13","m","يعود مفهوم «الطاقة» في الصفوف الرابع والسابع والعاشر في كل مرة بعمق أوسع ومستوى تجريد أعلى. هذا التنظيم للمنهج يسمى:",["المنهج الحلزوني","منهج الوحدات","المنهج المحوري","منهج النشاط"],"المنهج الحلزوني (برونر) يعيد المفاهيم الأساسية بتعمق متزايد عبر الصفوف. الوحدات تنظيم حول موضوعات، والمحوري محور مشترك."],["L13","m","نسق معلم التاريخ مع معلم الجغرافيا لتدريس موضوع «الهجرة النبوية» في الأسبوع نفسه مع بقاء كل مادة مستقلة بحصصها. هذا التنظيم يسمى:",["المواد المترابطة","المواد المندمجة","المواد المنفصلة","المنهج المحوري"],"الترابط تنسيق بين مادتين مع بقائهما منفصلتين. الاندماج يصهرهما في مادة واحدة كالاجتماعيات، والمنفصلة لا تنسيق فيها."],["L13","","تنظيم منهجي يدرس فيه جميع الطلاب محوراً مشتركاً من الخبرات العامة ثم يختار كل منهم مواد تخصصية حسب ميوله. هذا هو:",["المنهج المحوري","منهج النشاط","المواد المنفصلة","المنهج الحلزوني"],"المنهج المحوري يجمع بين جزء مشترك إلزامي وجزء اختياري. النشاط ينطلق من الميول كلياً، والحلزوني يعيد المفاهيم بتعمق."],["L13","m","نموذج بناء المنهج الذي يبدأ من المعلم استقرائياً بتشخيص حاجات الطلاب ثم صياغة الأهداف واختيار المحتوى وتنظيمه هو نموذج:",["تابا","تايلر","برونر","بوسنر"],"هيلدا تابا ترى أن المنهج يُبنى من الأسفل بيد المعلم بدءاً بتشخيص الحاجات. تايلر يبدأ بالأهداف من الأعلى، وبرونر الحلزوني، وبوسنر التغير المفاهيمي."],["L13","m","أدرج معلم الرياضيات نشاطاً يحسب فيه الطلاب ميزانية أسرة شهرية ويقارنون بين خيارات الادخار. البعد المشترك الذي ينميه هذا النشاط هو:",["المهارات الحياتية","الهوية الوطنية","الثقافة الرقمية","مهارات اللغة"],"إدارة الميزانية والادخار من المهارات الحياتية التي تُنمى عبر المواد. الهوية ترتبط بالانتماء، والرقمية بالتقنية، واللغة بالتواصل."],["L13","m","ربط معلم اللغة الإنجليزية درس «الاحتفالات» بتراث المملكة واليوم الوطني، وطلب من الطلاب وصفه بالإنجليزية. البعد المشترك الذي يعززه هو:",["الهوية الوطنية","الثقافة الرقمية","المهارات الحياتية","التفكير الرياضي"],"ربط المحتوى بتراث الوطن ومناسباته يعزز الهوية الوطنية عبر مادة غير مخصصة لها. البدائل الأخرى أبعاد لا يستهدفها النشاط."],["L13","","المعلم الذي يختار استراتيجياته التدريسية وفق مؤشر المعيار 8.3 يراعي في المقام الأول:",["حاجات المتعلمين وخصائصهم وطبيعة أهداف التعلم","التجهيزات التقنية المتاحة في المدرسة فقط","الاستراتيجيات التي يفضلها شخصياً","ما يطلبه أولياء الأمور"],"المؤشر ينص على استراتيجيات تلبي حاجات المتعلمين وخصائصهم وتراعي طبيعة الأهداف. التجهيزات والتفضيل الشخصي وطلبات الأسر عوامل ثانوية."],["L14","h","يستند مفهوم التوقعات العالية إلى اعتقاد تربوي مفاده أن:",["تحصيل الطلاب يميل إلى الارتفاع في علاقة مباشرة مع التوقعات العالية الموضوعة لهم","التوقعات المنخفضة تحمي الطلاب من الإحباط فترفع تحصيلهم","أثر توقعات المعلم يقتصر على الطلاب المتفوقين","العلاقة بين التوقعات والتحصيل ضعيفة لا تُذكر"],"هذا جوهر أثر بجماليون: التوقعات تتحول إلى نبوءة تحقق ذاتها. البدائل الأخرى تعكس إما خفض التوقعات أو إنكار أثرها."],["L14","h","عندما يخطئ الطالب في الإجابة عن سؤال، فالممارسة التي تعكس توقعات المعلم أداءً عالياً من المتعلم هي:",["إعادة صياغة السؤال بطريقة أخرى","الاكتفاء بإخبار الطالب بأنه مخطئ","تقديم الإجابة النموذجية عن السؤال","طلب الإجابة الصحيحة من طالب آخر"],"إعادة الصياغة تبقي الطالب في الموقف وتؤكد أنه قادر على الوصول للإجابة. نقل السؤال لطالب آخر يوحي بأن المعلم تخلى عنه."],["L14","","رسب طالب في اختبار فقال: «أنا غبي في الرياضيات ولن أنجح مهما فعلت». العزو هنا وفق نظرية واينر:",["داخلي ثابت غير قابل للضبط (القدرة)","داخلي متغير قابل للضبط (الجهد)","خارجي متغير (الحظ)","خارجي ثابت (صعوبة المادة)"],"الغباء سبب داخلي يراه الطالب ثابتاً وخارج سيطرته، وهذا أخطر أنواع العزو لأنه يقود إلى العجز المتعلم. عزو الفشل للجهد كان سيبقي الأمل."],["L14","","عند الثناء على نجاح طالب أمام زملائه، الأنسب أن يعزو المعلم النجاح إلى:",["الجهد الذي بذله الطالب","ذكائه الفطري","سهولة الاختبار","حظه في الأسئلة"],"عزو النجاح للجهد يرسخ أن النتيجة تحت سيطرة الطالب فيثابر. عزوه للذكاء يجعله يخاف من المهام الصعبة التي قد تكشف عكس ذلك."],["L14","m","لاحظت معلمة أن طالبة تقول قبل كل مهمة: «لن أحاول لأنني سأفشل كالعادة». الإجراء الأول الأنسب:",["تكليفها بمهمة قصيرة مضمونة النجاح ثم تعزيز جهدها","إعفاؤها من المهام الصعبة مراعاة لحالتها","مقارنتها بزميلتها المتفوقة لتحفيزها","إبلاغ ولي الأمر بضعف ثقتها بنفسها"],"كسر دائرة الفشل يبدأ بخبرة إتقان صغيرة (أقوى مصدر للكفاءة الذاتية) مع تعزيز الجهد. الإعفاء يثبت عجزها، والمقارنة تزيد الإحباط."],["L14","","أفضل طريقة لصياغة أهداف تعلم ترفع دافعية طالب متوسط المستوى:",["أهداف قصيرة المدى واضحة فيها تحدٍّ مناسب لقدراته","أهداف بعيدة المدى عامة الصياغة","أهداف سهلة جداً يضمن تحقيقها دون جهد","أهداف يحددها المعلم دون إطلاع الطالب عليها"],"الأهداف القصيرة الواضحة تمنح نجاحات متتابعة محسوسة، والتحدي المناسب يحفظ الاهتمام. السهلة جداً تُملّ، والبعيدة العامة لا تُشعر بالتقدم."],["L14","m","يمنح معلم جائزة مادية عن كل إجابة صحيحة مهما كانت بسيطة. الأثر المتوقع لهذا الأسلوب على المدى البعيد:",["إضعاف الدافعية الداخلية للتعلم","زيادة الدافعية الداخلية","ارتفاع تقدير الذات","تعلم أعمق وأكثر استمراراً"],"الإفراط في المكافآت الخارجية يجعل الطالب يتعلم من أجل الجائزة لا من أجل المعرفة، فتضعف الدافعية الداخلية. التعزيز المادي مفيد مؤقتاً مع الطلاب الذين لا يُحفَّزون داخلياً."],["L14","","أثر بجماليون في الصف يعني أن:",["توقعات المعلم عن الطالب تتحول إلى نبوءة تحقق ذاتها","الطلاب يقلدون سلوك المعلم بالملاحظة","الدافعية تزداد بزيادة المكافآت","التعلم يحدث بتعزيز التقريبات المتتابعة"],"بجماليون (روزنثال وجاكوبسون): من توقع المعلم تفوقه تفوق فعلاً. التقليد نمذجة، والتقريبات تشكيل."],["L14","","وفق باندورا، المصدر الأقوى للكفاءة الذاتية لدى الطالب هو:",["خبرات الإتقان الشخصية الناجحة","الإقناع اللفظي من المعلم","ملاحظة نجاح الأقران","الحالة الانفعالية والجسمية"],"النجاح الفعلي في مهمة سابقة أقوى دليل للطالب على قدرته. ملاحظة الأقران والإقناع اللفظي مصادر أضعف."],["L14","m","حصلت طالبة على درجة متدنية في مهمة كتابية. أي التعليقات يعكس توقعات عالية وتغذية راجعة وصفية معاً؟",["«مقدمتك واضحة ومرتبة، وتحتاجين إلى دليل يدعم الفقرة الثانية، أعيدي كتابتها وسأراجعها»","«ضعيف، راجعي الدرس»","«حاولي أكثر في المرة القادمة»","«زميلتك كتبت أفضل منك، انظري إلى ورقتها»"],"التعليق الأول يسمي نقطة القوة ونقطة التحسين وكيفيتها ويطلب محاولة أخرى. البدائل الأخرى إما حكم عام أو مقارنة بالأقران."],["L14","m","أي الأوصاف الآتية يدل على طالب ذي دافعية داخلية للتعلم؟",["يعمل بجد حتى عندما لا تُرصد له درجات","لا يبدأ العمل إلا بوعد بمكافأة","يختار دائماً أسهل المهام المتاحة","يتوقف عن العمل عند غياب المعلم"],"الدافعية الداخلية تظهر في المثابرة بلا مقابل خارجي واختيار المهام المتحدية. انتظار المكافأة دافعية خارجية."],["L14","","جميع ما يلي من مؤشرات التوقعات العالية في ممارسات المعلم ما عدا:",["إعطاء الطلاب الضعاف أسئلة أسهل دائماً وزمن انتظار أقصر","توزيع الأسئلة التي تتطلب تفكيراً على جميع الطلاب","انتظار إجابة الطالب المتردد وتشجيعه","الإصرار على إكمال المهمة مع تقديم الدعم"],"حصر الضعاف في الأسئلة السهلة واستعجالهم رسالة ضمنية بأنهم غير قادرين، وهو عكس التوقعات العالية."],["L14","m","يبدأ معلم كل حصة بسؤال طلابه عما يريدون إتقانه فيها، ويعلّق في نهاية الأسبوع تقدم كل طالب مقارنة بأدائه السابق لا بزملائه. يرسخ هذا:",["ثقافة توقعات عالية وتقديراً للجهد","التنافس بين الطلاب","الدافعية الخارجية فقط","الضبط الصفي الصارم"],"المقارنة بالذات وتحديد أهداف شخصية تؤكد أن كل طالب قادر على التقدم وأن الجهد هو المعيار."],["L14","","يريد معلم أن يرفع ثقة طالب متدني التحصيل بنفسه. الأنسب أن:",["يشركه في مجموعة متميزة بدور يستطيع أداءه بنجاح","يعفيه من المشاركة حتى يتحسن مستواه","يذكره دائماً بضرورة بذل الجهد","يعلن درجاته أمام الصف ليتحفز"],"إشراكه في مجموعة ناجحة بدور في متناوله يمنحه خبرة إتقان وانتماء. الإعفاء والتذكير بالجهد لا يقدمان نجاحاً محسوساً، والإعلان عن الدرجات يحرجه."],["L14","h","يُقصد بمفهوم إدارة الصف:",["تنظيم البيئة التعليمية على نحو يساعد على التعلم","استيعاب الطلاب للقواعد والأنظمة الصفية","توظيف ما لدى المعلم من خبرات","الاهتمام بحل المشكلات الطارئة بحزم"],"إدارة الصف تنظيم شامل للبيئة المادية والنفسية والاجتماعية. حل المشكلات بحزم جزء ضيق منها يركز على الضبط."],["L14","","معلم يرى نفسه المصدر الوحيد للمعلومات، ويتوقع من طلابه الطاعة التامة، ويعتمد على الثواب والعقاب، ويخشاه الطلاب. نمط إدارته:",["تسلطي","فوضوي","ديمقراطي","تشاركي"],"الخوف والطاعة التامة والاحتكار سمات النمط التسلطي، وآثاره اتكالية الطلاب ودافعية خارجية مصدرها الرهبة."],["L14","","من الآثار السلبية للنمط التسلطي في الإدارة الصفية على الطلاب:",["الاتكالية ودافعية خارجية مصدرها الخوف من المعلم","زيادة النقد والإبداع لديهم","قوة الانضباط الذاتي","ارتفاع تقدير الذات"],"التسلط يجعل التعديل في السلوك مرتبطاً بزمن الرهبة، فيفشل الطالب في وضع أهداف لنفسه ويعتمد كلياً على المعلم."],["L14","m","الخصائص الأنسب للقواعد الصفية:",["قليلة، واضحة، إيجابية الصياغة، يشارك الطلاب في وضعها","كثيرة لتغطي كل المواقف المحتملة","تُصاغ بالنهي لتكون حازمة","يضعها المعلم وحده ويعلنها في منتصف الفصل الدراسي"],"القواعد القليلة الواضحة تُحفظ وتُطبق، والصياغة الإيجابية تصف السلوك المطلوب لا الممنوع، والمشاركة تولد الالتزام."],["L14","","معلم يتابع ما يجري في كل أركان الصف وهو يشرح، ويتدخل عند أول بوادر تشويش قبل أن تتسع. هذه المهارة سماها كونين:",["اليقظة (الوعي بما يجري)","التداخل","الزخم","أثر الموجة"],"اليقظة withitness هي إدراك كل ما يحدث وإشعار الطلاب بذلك. التداخل معالجة أمرين معاً، والزخم استمرار الدرس بلا توقف."],["L14","","تساعد المعلمة طالبة في مقعدها، وفي الوقت نفسه توقف همساً في الصف الخلفي بنظرة وإشارة دون أن تقطع المساعدة. المهارة:",["التداخل (معالجة أمرين في وقت واحد)","اليقظة","تنبيه المجموعة","السلاسة"],"التداخل overlapping عند كونين هو القدرة على إدارة موقفين متزامنين. اليقظة هي الوعي، أما التداخل فهو الفعل المتزامن."],["L14","","يقصد بأثر الموجة في إدارة الصف عند كونين أن:",["طريقة معالجة المعلم لسلوك طالب واحد تؤثر في سلوك بقية الطلاب","الفوضى تنتقل من طالب إلى آخر بالتقليد","تكرار القاعدة يثبتها لدى الطلاب","العقوبات تتدرج في الشدة"],"أثر الموجة ripple effect: حين يعالج المعلم سلوك طالب بوضوح وهدوء، يضبط الآخرون سلوكهم تلقائياً."],["L14","m","يفقد المعلم دقائق كثيرة كلما انتقل من الشرح إلى العمل في مجموعات. الإجراء الأنسب:",["تدريب الطلاب على إجراء روتيني ثابت للانتقال مع تحديد الأدوار والأماكن مسبقاً","إلغاء العمل في مجموعات حفاظاً على الوقت","معاقبة من يتأخر في الانتقال","تمديد الحصة لتعويض الوقت الضائع"],"الانتقالات السلسة من مهارات إدارة الوقت الأكاديمي وتُبنى بإجراءات روتينية مدرَّبة. الإلغاء يضحي بالاستراتيجية، والعقاب يعالج العرض."],["L14","m","أي ترتيب للمقاعد أنسب لحصة قائمة على نقاش مفتوح يتبادل فيه الطلاب الآراء؟",["حرف U أو دائرة بحيث يرى الطلاب بعضهم","صفوف متوازية تواجه السبورة","مجموعات متباعدة منعزلة","مقاعد فردية على جدران الصف"],"ترتيب المقاعد يتبع نوع النشاط: الصفوف للعرض، والمجموعات للتعاون، وحرف U للنقاش الذي يتطلب تواصلاً بصرياً بين الجميع."],["L14","","عند تكوين مجموعات تعاونية لمهمة مشتركة، الأفضل أن تكون المجموعات:",["غير متجانسة في المستوى وبأدوار محددة لكل عضو","متجانسة في المستوى يختارها الطلاب بأنفسهم","كبيرة العدد لتقليل عدد المجموعات","متغيرة الأعضاء كل عشر دقائق"],"عدم التجانس يحقق معاونة الأفراد لبعضهم (الهدف الأول للتعاوني) والأدوار تضمن المسؤولية الفردية. العدد المناسب 4–6."],["L14","","في نشاط جماعي لاحظ المعلم أن طالباً واحداً ينجز كل العمل بينما يتفرج الباقون. الإجراء الأنسب:",["توزيع أدوار محددة على الأعضاء ومحاسبة كل طالب على جزئه","حل المجموعة وتكليف كل طالب بالعمل فردياً","مكافأة الطالب النشط أمام المجموعة","تقليل حجم المهمة المطلوبة"],"المسؤولية الفردية والاعتماد المتبادل شرطا التعلم التعاوني، وتتحققان بالأدوار ومحاسبة كل عضو. حل المجموعة تخلٍّ عن الاستراتيجية."],["L14","","دور المعلم أثناء عمل الطلاب في مجموعات:",["ميسّر يتنقل بين المجموعات ويوجهها بالأسئلة","ملقّن يشرح المهمة من مكانه","مراقب صامت لا يتدخل حتى النهاية","مصحح يتابع الدفاتر في مكتبه"],"في التعلم النشط المعلم ميسّر ومرشد: يتابع ويسأل ويوجه دون أن يسيطر أو ينسحب."],["L14","","كلف المعلم طلابه بواجب صفي مدته 15 دقيقة، فأنهاه أحدهم قبل الوقت وبدأ يتحدث مع زميله. الإجراء المناسب:",["تزويده بنشاط إثرائي مرتبط بالدرس","توبيخه أمام زملائه","تكليفه بإعادة حل الواجب","تجاهله حتى ينتهي الوقت"],"الطالب الذي ينهي عمله مبكراً يحتاج مهمة لا عقوبة؛ النشاط الإثرائي يستثمر وقته ويمنع التشويش. الإعادة عقاب على الإنجاز."],["L14","m","نشب شجار بين طالبين أثناء الحصة. أول ما يفعله المعلم:",["يحافظ على هدوئه ويفصل بينهما ويشغل بقية الطلاب بنشاط ثم يعالج الأمر","يوقف الحصة ويحقق معهما أمام الجميع","يستدعي مدير المدرسة فوراً","يعاقب الطالبين معاً دون سؤال"],"في الأزمة يبدأ المعلم باحتواء الموقف: يحافظ على هدوئه، ويفصل المتشاجرين، ويشغل بقية الصف، ثم يستمع لكل طرف على انفراد ويرصد المشكلة ويسلمها لإدارة المدرسة، لأن الشجار من مشكلات الدرجة الثانية في الابتدائي والثالثة في المتوسط والثانوي. التحقيق العلني يصعّد، واستدعاء المدير قبل الفصل بينهما يترك الخطر قائماً، والعقاب دون سؤال ظلم."],["L14","","من مهارات إدارة الوقت الأكاديمي في الحصة:",["إجراءات روتينية ثابتة لبدء الحصة وإنهائها","تمديد الشرح على حساب النشاط","تأجيل التهيئة إلى آخر الحصة","الاستطراد لإبعاد الملل"],"الروتين الثابت يوفر الوقت الضائع في البدايات والنهايات. الاستطراد والتمديد يهدران الوقت."],["L14","m","معلم جديد يرغب في بناء خطة لإدارة صفه. أنسب خطوة يبدأ بها:",["مراقبة المعلمين الفعالين في المدرسة والاستفادة من خبراتهم","قراءة كتب عن التعامل مع الأسر والمجتمع","مناقشة الصعوبات مع المدير وطلب تقويم متكرر","التعاون مع المعلمين الجدد فقط ومناقشة صعوباتهم"],"الخبرة الصفية الحية للمعلمين الفعالين أقرب مصدر للمعلم الجديد. الجدد يفتقرون إلى الخبرة نفسها، والكتب عن الأسر بعيدة عن إدارة الصف."],["L14","m","كلما أنجز الطالب واجبه كتب المعلم عبارة ثناء في دفتره، فازداد التزامه بالواجب. الإجراء:",["تعزيز موجب","تعزيز سالب","عقاب سالب","انطفاء"],"أُضيف مثير سارّ (الثناء) بعد السلوك فزاد، وهذا تعزيز موجب."],["L14","","وبّخ المعلم طالباً أمام زملائه بعد مقاطعته، فقلّت مقاطعاته. من حيث التصنيف السلوكي هذا:",["عقاب موجب","عقاب سالب","تعزيز سالب","تكلفة استجابة"],"أُضيف مثير منفّر (التوبيخ) فقلّ السلوك، وهذا عقاب موجب. تربوياً التوبيخ العلني مرفوض وإن كان فعالاً مؤقتاً."],["L14","","سكب طالب العصير على أرضية الفصل، فطلبت منه المعلمة تنظيف المكان الذي سكبه فيه فقط. الأسلوب:",["التصحيح البسيط","التصحيح الزائد","تكلفة الاستجابة","الإقصاء"],"إزالة الضرر بقدر الخطأ دون أعمال إضافية هو التصحيح البسيط؛ لو كُلف بتنظيف بقية الفصل لصار تصحيحاً زائداً."],["L14","h","سأل المعلم سؤالاً فوقف طالب يلوح بيده صائحاً «أنا أعرف»، فلم يمنحه المعلم فرصة الإجابة، وأعطاها لمن رفع يده بهدوء. ما فعله المعلم:",["إطفاء السلوك غير المرغوب مع تعزيز السلوك البديل","عقاب موجب","تكلفة استجابة","تشكيل"],"حجب التعزيز (فرصة الإجابة) عن الصياح هو الإطفاء، وإعطاء الفرصة للهادئ تعزيز تفاضلي للبديل. لم يُضف منفّر ولم يُسحب معزز مكتسب."],["L14","h","«الانطفاء» من الأنماط التي يستخدمها المعلم لتحقيق بيئة صفية فعالة، ويُقصد به:",["تجاهل المعلم للسلوك غير المناسب حتى يتلاشى","كف المعلم السلوكيات غير المناسبة في وقت مبكر","تأنيب المعلم للمتعلم الذي أصدر السلوك منفرداً","إبعاد المتعلم الذي أصدر السلوك من الموقف التعليمي"],"الانطفاء حجب التعزيز عن السلوك فيتلاشى، وأبرز صوره التجاهل المقصود. الإبعاد إقصاء، والتأنيب عقاب موجب."],["L14","m","قال المعلم لطلابه: «من ينهي تمارين الصفحة يحصل على عشر دقائق في ركن القراءة الحرة». يطبق المعلم:",["مبدأ بريماك","الاقتصاد الرمزي","تكلفة الاستجابة","التحصين التدريجي"],"نشاط محبب (القراءة الحرة) اشتُرط بإنهاء نشاط أقل حباً (التمارين)، وهذا بريماك. الاقتصاد الرمزي يحتاج رموزاً تُجمع وتُستبدل."],["L14","h","يجمع الطلاب نجوماً عند كل سلوك إيجابي ثم يستبدلونها في نهاية الأسبوع بجوائز. هذا النظام:",["الاقتصاد الرمزي","مبدأ بريماك","العقد السلوكي","التعزيز المتقطع"],"المعززات الرمزية (النجوم) التي تُستبدل لاحقاً بمعززات حقيقية هي الاقتصاد الرمزي."],["L14","m","عند تعليم طفل الكتابة يعزز المعلم أولاً مسكه القلم صحيحاً، ثم الكتابة على السطر، ثم استقامة الحروف حتى يتقن. الأسلوب:",["التشكيل","التسلسل","التلقين","النمذجة"],"تعزيز التقريبات المتتابعة نحو السلوك النهائي هو التشكيل (تدرج في الاستجابة). التسلسل تعزيز كل حلقة من حلقات مرتبطة تكوّن سلوكاً عاماً."],["L14","h","تعزيز المتعلم عند تأدية كل حلقة من حلقات السلسلة السلوكية يسمى:",["التسلسل","التشكيل","الإفاضة","التلقين"],"التسلسل يتعامل مع حلقات مترابطة تُعزز واحدة واحدة، بخلاف التشكيل الذي يعزز تقريبات سلوك واحد."],["L14","m","أي الآتي يزيد فاعلية التعزيز؟",["أن يكون فورياً عقب السلوك مباشرة","أن يؤجل إلى نهاية الأسبوع ليجمع السلوكيات","أن يكون معززاً واحداً لجميع الطلاب","أن يُقدم بغض النظر عن السلوك"],"الفورية أهم شروط التعزيز لأنها تربطه بالسلوك مباشرة. التنوع ومراعاة الفروق شرطان آخران، وتقديمه بلا سلوك يفقده معناه."],["L14","","لاكتساب الطالب سلوكاً جديداً يُفضل أن يكون التعزيز:",["متواصلاً في كل مرة ثم ينتقل إلى المتقطع","متقطعاً من البداية","مؤجلاً حتى يثبت السلوك","رمزياً فقط"],"المتواصل يبني السلوك الجديد، ثم المتقطع يحافظ عليه ويجعله أكثر مقاومة للانطفاء."],["L14","","جميع ما يلي يقلل السلوك غير المرغوب ما عدا:",["التعزيز السالب","تكلفة الاستجابة","الإقصاء","الانطفاء"],"التعزيز السالب يزيد السلوك المرغوب بإزالة منفّر. البدائل الثلاثة تقلل السلوك: اثنان عقاب سالب والثالث حجب تعزيز."],["L14","","أعفى المعلم طالباً من الواجب المنزلي لأنه شارك بفاعلية طوال الحصة. الإجراء:",["تعزيز سالب","تعزيز موجب","عقاب سالب","انطفاء"],"أُزيل مثير يراه الطالب منفّراً (الواجب) بعد سلوك مرغوب لزيادته، وهذا تعزيز سالب."],["L14","m","تجاهل المعلم تشويش طالب، ثم أثنى عليه فور أن انشغل بالعمل الصفي. الإجراء:",["التعزيز التفاضلي للسلوك البديل","العقاب السالب","التشكيل","التلقين"],"الجمع بين إطفاء السلوك غير المرغوب وتعزيز نقيضه هو التعزيز التفاضلي، وهو أفعل من الإطفاء وحده."],["L14","","أي الآتي ممنوع تربوياً ونظامياً في التعامل مع مخالفات الطلاب؟",["العقاب البدني والتشهير","تكلفة الاستجابة","العقد السلوكي","التصحيح الزائد"],"العقاب البدني والتشهير ممنوعان: قواعد السلوك والمواظبة 1447 تمنع الإيذاء الجسدي أو النفسي والسخرية من الطالب، وتوجب سرية معلومات المخالف. أما تكلفة الاستجابة والعقد السلوكي والتصحيح الزائد فأساليب تعديل سلوك مقبولة بضوابط."],["L14","","طالب يرفع يده دائماً ويجيب إجابات صحيحة، لكن المعلم نادراً ما يناديه مفضلاً الطلاب الصامتين، فقلّ رفعه ليده بعد أسابيع. التفسير:",["انطفاء السلوك لغياب التعزيز","عقاب سالب","تعزيز سالب","تعميم"],"السلوك الذي لا يُعزز يتلاشى، وهذا الانطفاء. لم يُسحب شيء يملكه الطالب فلا عقاب سالب."],["L14","m","أخرج المعلم طالباً ليقف في الممر عشر دقائق كلما شوّش. التصنيف السلوكي لهذا الإجراء وحكمه التربوي:",["إقصاء (عقاب سالب)، وإخراج الطالب من الفصل مرفوض لأنه يحرمه من التعلم ويخلّ بالإشراف عليه","تعزيز سالب وهو مقبول","انطفاء وهو الأسلوب الأمثل","تكلفة استجابة وهو مقبول"],"الإخراج عزل عن بيئة الصف فهو إقصاء من حيث التصنيف، لكنه يفقد الطالب التعلم ويتركه بلا إشراف وقد يعززه إن كان يكره الحصة؛ لذلك لا يُستخدم الإقصاء إلا داخل الصف ولمدة قصيرة، والطرد كعقوبة مرفوض في اللائحة."],["L14","","ليتجنب المعلم إشباع الطالب من المعزز، عليه أن:",["ينوّع المعززات ويقدمها بما يتناسب مع الاستجابة","يقدم المعزز نفسه بعد كل استجابة","يزيد كمية المعزز باستمرار","يوقف التعزيز نهائياً"],"الإشباع يُضعف أثر المعزز، والحل التنويع (لفظي، رمزي، نشاط) والتناسب مع حجم الاستجابة."],["L14","h","لدى أحد المعلمين طالب خجول. التصرف التربوي السليم معه:",["دعمه وتشجيعه على المشاركة تدريجياً","ترك الحرية له في المشاركة من عدمها","مراعاة ظروفه بعدم إشراكه","تحويله إلى المرشد الطلابي"],"الدعم والتدرج يبنيان ثقته. ترك الحرية أو عدم إشراكه يثبتان خجله، والتحويل الفوري تصعيد قبل محاولة المعلم."],["L14","","سمع المعلم طالباً يسب زميله لأول مرة أثناء نشاط جماعي. الخطوة الأولى:",["إيقاف السلوك فوراً وإشعار الطالب بأن السب مرفوض وستتبعه إجراءات","إبلاغ ولي أمره بالحادثة في اليوم نفسه","إحالته إلى المرشد الطلابي","تجاهل الموقف لأنه الأول"],"الخطوة الأولى المباشرة إيقاف الإساءة وإشعار المعتدي بأن سلوكه مرفوض وستتبعه إجراءات. أما إبلاغ ولي الأمر والإحالة إلى الموجه الطلابي فخطوتان لاحقتان تتولاهما إدارة المدرسة بعد أن يرصد المعلم المشكلة ويسلمها لها، والتجاهل لا يصلح مع الإساءة إلى زميل."],["L14","m","تكرر اعتداء الطالب نفسه لفظياً على زملائه رغم تنبيه المعلم وتطبيقه العواقب المتفق عليها. الإجراء الآن:",["إحالة الحالة إلى المرشد الطلابي وإشعار الإدارة وولي الأمر وفق اللائحة","تنبيهه مرة أخرى بالأسلوب نفسه","معاقبة الصف كله حتى يضغط عليه زملاؤه","نقل الطلاب المعتدى عليهم إلى فصل آخر"],"استنفد المعلم إجراءاته داخل الفصل، فيأتي التصعيد المنظم: يرصد المشكلة ويسلمها لإدارة المدرسة، وهي التي تستدعي ولي الأمر وتحيل الطالب إلى الموجه الطلابي (المرشد) لدراسة حالته، ويُطبق الإجراء التالي مباشرة عند التكرار. العقاب الجماعي مرفوض، ونقل المعتدى عليهم يعاقب الضحايا بدل المخالف."],["L14","","طالب يتعرض للتنمر ويميل إلى الصمت والعزلة. الإجراء الأنسب تجاهه:",["دعمه ببناء الثقة وتعليمه مهارات اجتماعية مع ضمان حمايته","مواجهته مع المتنمر أمام الصف لتسوية الخلاف","مطالبته بالدفاع عن نفسه بالمثل","تجاهل الأمر لأنه سيتجاوزه مع الوقت"],"المعتدى عليه يحتاج حماية وثقة ومهارات. المواجهة العلنية تزيد الأذى، والرد بالمثل يوسع العنف."],["L14","","من العلامات التي تدل على تعرض الطالب للتنمر:",["الانطواء المفاجئ وكثرة التغيب وتراجع التحصيل","زيادة المشاركة الصفية","ارتفاع تقدير الذات","المبادرة إلى قيادة المجموعات"],"الضحية تنسحب وتتجنب المدرسة وتتراجع درجاتها وقد تشكو آلاماً جسدية متكررة."],["L14","m","جميع ما يلي من ممارسات البيئة الصفية الآمنة ما عدا:",["العقاب الجماعي للصف عند مخالفة بعض الطلاب","وضوح القواعد والعواقب وثباتها","معالجة المخالفة على انفراد","تعزيز السلوك البديل المرغوب"],"العقاب الجماعي يظلم الملتزمين ويهدم الثقة بالمعلم، وهو ممنوع تربوياً. البدائل الأخرى أركان البيئة الآمنة."],["L14","","في حصة مختبر العلوم لاحظ المعلم طالباً يعبث بمواد كيميائية. الخطوة الأولى:",["إيقافه فوراً وإبعاد المواد عنه ثم تذكير الصف بقواعد السلامة","تسجيل مخالفة في سجل السلوك","إبلاغ ولي الأمر بالحادثة","إخراجه من المختبر بقية الفصل الدراسي"],"الخطر الفوري يُوقف أولاً قبل أي إجراء إداري. التسجيل والإبلاغ خطوات لاحقة، والحرمان الطويل عقوبة غير متناسبة."],["L14","m","طالب محبط قليل الدافعية يبدو شارداً ولا يبذل جهداً في أي مهمة. أول ما يفعله المعلم:",["استكشاف سبب إحجامه عن الجهد ثم كسر دائرة الفشل بمهام متدرجة","تحويله فوراً إلى المرشد الطلابي","إبلاغ ولي الأمر بإهماله","تجاهله حتى يبادر بنفسه"],"فهم السبب أول خطوة في أي تعديل سلوك، ثم تُبنى خبرات نجاح صغيرة. التحويل والإبلاغ قبل محاولة المعلم تصعيد مبكر."],["L14","","من مبادئ لائحة السلوك والمواظبة في التعامل مع المخالفات:",["تعزيز الانضباط الذاتي والتدرج في الإجراءات","العقوبة الفورية القصوى لأي مخالفة","إشراك الطلاب في معاقبة زملائهم","حرمان المخالف من الدراسة"],"اللائحة تصنف المخالفات بدرجات وتتدرج في الإجراءات وتهدف إلى الانضباط الذاتي لا الردع فقط."],["L14","","يصدر طلاب الصف ضوضاء كلما انشغل المعلم بمجموعة واحدة. الإجراء الأنسب:",["الاتفاق مع الصف على إشارة صامتة تعني خفض الصوت وتعزيز الالتزام بها","رفع صوت المعلم فوق أصواتهم","معاقبة الصف كله بواجب إضافي","إيقاف العمل بالمجموعات نهائياً"],"الإشارة المتفق عليها إجراء صفي يضبط الصوت دون قطع النشاط أو عقاب جماعي. رفع الصوت يرفع ضوضاء الصف."],["L14","","أي الآتي ليس من الإجراءات المناسبة عند تكرار المخالفة من الطالب نفسه؟",["التشهير به في الطابور الصباحي ليرتدع","تطبيق العواقب المتفق عليها بثبات","إشراك المرشد الطلابي في دراسة الحالة","التواصل مع ولي الأمر"],"التشهير إهانة علنية ممنوعة وتولد العناد. التكرار يستدعي الثبات في العواقب والتصعيد المنظم."],["L14","m","طالبان يتبادلان الشتائم في الفناء وتجمّع حولهما الطلاب. الخطوة الأولى للمعلم المناوب:",["الفصل بينهما فوراً وتفريق المتجمعين ثم الاستماع لكل منهما على انفراد","إبلاغ ولي أمر كل منهما هاتفياً من مكانه","تسجيل مخالفة لكليهما دون سماعهما","الطلب من الطلاب المتجمعين الحكم بينهما"],"إيقاف الموقف وإزالة الجمهور (المعزز للعدوان) أولاً، ثم التحقق الهادئ. التسجيل والإبلاغ بعد فهم ما حدث."],["L14","","أراد معلم ترتيب أماكن جلوس الطلاب وأدوات الفصل. العامل الذي يأخذه بعين الاعتبار أولاً:",["أنواع الأنشطة التعليمية التي سيستخدمها","مستويات إنجاز الطلاب","الخلفيات الاجتماعية والثقافية للطلاب","أطوال الطلاب فقط"],"التنظيم الفيزيائي يتبع النشاط: صفوف للعرض ومجموعات للتعاون. الترتيب حسب الإنجاز أو الخلفية يوسم الطلاب ويضر بالبيئة الآمنة."],["L14","m","يلاحظ المعلم أن طالباً يأتي إلى المدرسة بكدمات متكررة ويتهرب من الحديث عنها. الإجراء المهني:",["إبلاغ المرشد الطلابي وإدارة المدرسة لاتخاذ الإجراء النظامي","استجواب الطالب أمام زملائه لمعرفة السبب","الاتصال بوالده وتوبيخه","تجاهل الأمر لأنه شأن أسري"],"الاشتباه في إيذاء خارج صلاحية المعلم ويتطلب جهات مختصة بسرية. الاستجواب العلني يؤذي الطالب، والاتصال المباشر بالوالد قد يعرضه لخطر أكبر."],["L14","","يحقق المعلم أثراً إيجابياً أكبر في ضبط سلوك طلابه عندما:",["يكون قدوة في السلوك الذي يطلبه منهم","يكثر من التهديد بالعقوبات","يعتمد على العقاب الجماعي","يحيل كل مخالفة إلى الإدارة"],"الطلاب يتأثرون بسلوك المعلم أكثر من أقواله (النمذجة)؛ المعلم الذي يحترم القواعد يجعلها مقبولة."],["L14","","طالب مشاغب تكررت مخالفاته البسيطة، فقرر المعلم أن يبدأ بأسلوب بنّاء قبل التصعيد. الأنسب:",["عقد سلوكي يحدد السلوك المطلوب والمكافأة والعواقب بالاتفاق معه","إنذار كتابي فوري وإحالة للإدارة","تجاهل كل مخالفاته مهما كانت","نقله إلى فصل آخر"],"العقد السلوكي يشركه في المسؤولية ويحدد التوقعات والعواقب بوضوح. الإحالة تصعيد، والتجاهل لا يصلح مع المتكرر."],["L14","m","زمن الانتظار المناسب بعد طرح السؤال الصفي:",["3–5 ثوانٍ","أقل من ثانية","15–20 ثانية","دقيقة كاملة"],"دراسات ماري رو: 3–5 ثوانٍ تكفي للتفكير دون أن يتحول الصمت إلى إحراج."],["L14","","سؤال المعلم: «ما رأيك في تصرف الشخصية في القصة؟ ولماذا؟» نوعه:",["مفتوح يتطلب تفكيراً متباعداً","مغلق له إجابة واحدة","سابر يبني على إجابة سابقة","تجميعي"],"الرأي والتبرير يحتملان إجابات متعددة، وهذا السؤال المفتوح. المغلق يستدعي معلومة واحدة."],["L14","","استماع المعلم للطالب الذي يعاني من مشكلة في جو يتصف بالدفء والتقبل يساعد الطالب على:",["الشعور بالأمن النفسي والتعبير عن مشكلته بحرية","تحقيق الذات وفق هرم ماسلو","التفوق الدراسي الفوري","التنافس مع زملائه"],"الإنصات المتقبل يوفر الأمن والانتماء، وهما شرط البوح. تحقيق الذات قمة الهرم ولا يتحقق بموقف استماع واحد."],["L14","m","أي التعليقات الآتية يمثل تغذية راجعة وصفية؟",["«ترتيب أفكارك واضح، وتحتاج إلى دليل يدعم الفقرة الثانية»","«ممتاز»","«ضعيف، راجع الدرس»","«7 من 10»"],"الوصفية تسمي ما أُنجز وما يُحسَّن وكيف. «ممتاز» تعزيز عام، والدرجة حكم بلا توجيه."],["L14","","استراتيجية «نجمتان وأمنية» في التغذية الراجعة تعني:",["ذكر نقطتي قوة ونقطة تحسين تُصاغ بصيغة أمنية","منح نجمتين لكل إجابة صحيحة","تأجيل التغذية الراجعة إلى نهاية الوحدة","مقارنة الطالب بزميلين متفوقين"],"نجمتان = إيجابيتان، أمنية = جانب تحسين بصيغة لطيفة؛ تحافظ على الدافعية مع توجيه التطوير."],["L14","m","الطالب الخجول يستجيب على نحو أفضل لنوع التواصل:",["غير اللفظي كالابتسامة والإيماءة المشجعة","اللفظي العلني أمام الصف","الكتابي الرسمي فقط","التوبيخ الخفيف لتحفيزه"],"الإشارات غير اللفظية تشجع دون أن تضعه في بؤرة الاهتمام. التواصل العلني يزيد توتره."],["L14","","نمط الاتصال الصفي الذي يتفاعل فيه جميع الطلاب مع بعضهم ومع المعلم بتوجيهه:",["متعدد الاتجاهات (مفتوح)","وحيد الاتجاه","ثنائي الاتجاه","ثلاثي الاتجاه"],"المفتوح نمط التعلم التعاوني؛ وحيد الاتجاه محاضرة، وثنائي الاتجاه مناقشة بين المعلم وطالب."],["L14","m","أثناء إجابة طالب متلعثم بدأ زملاؤه يضحكون. الإجراء الأنسب:",["إيقاف الضحك بحزم وإتاحة الوقت للطالب لإكمال إجابته ثم تعزيز محاولته","نقل السؤال إلى طالب أفضل تخفيفاً عنه","إنهاء النقاش والانتقال إلى نقطة أخرى","الطلب من الطالب الجلوس"],"الأمان النفسي يقتضي حماية الطالب من السخرية وإكمال فرصته. نقل السؤال أو إجلاسه يؤكد للجميع أن الضحك نجح."],["L14","","من مؤشرات الإنصات النشط لدى المعلم:",["إعادة صياغة ما قاله الطالب للتأكد من فهمه","مقاطعة الطالب لتصحيح خطئه فوراً","النظر إلى الدفتر أثناء حديث الطالب","الانتقال فوراً إلى سؤال آخر"],"إعادة الصياغة والإيماء وعدم المقاطعة تُشعر الطالب أنه مسموع ومفهوم."],["L14","","في صف يضم طلاباً من خلفيات ثقافية ولغوية متنوعة، أفضل ممارسة صفية للمعلم:",["إشراك جميع الطلاب في مناقشة الدرس مع إظهار الاحترام لكل طالب","تجميع طلاب كل خلفية في مجموعة واحدة","تجنب الحديث عن الاختلافات نهائياً","إعفاء بعضهم من المشاركة مراعاة لظروفهم"],"احترام التنوع يعني إشراك الجميع باحترام. التجميع حسب الخلفية والإعفاء يعزلان ويوسمان."],["L14","","يبدأ المعلم حصته بالوقوف عند الباب وتحية الطلاب بأسمائهم. يحقق ذلك:",["بيئة إيجابية وشعوراً بالانتماء","ضبطاً صارماً للصف","تقويماً تشخيصياً","تعزيزاً سالباً"],"العلاقة الإيجابية تبدأ بالتحية والاسم؛ وهي أبسط إجراءات البيئة الداعمة في الابتدائية خاصة."],["L14","m","أرسل ولي أمر رسالة غاضبة على منصة التواصل يتهم فيها المعلم بالتحيز ضد ابنه. الإجراء الأنسب:",["طلب لقاء هادئ للاستماع إليه أولاً ثم عرض الحقائق والاتفاق على متابعة","الرد برسالة دفاعية مفصلة تثبت خطأ الطالب","تجاهل الرسالة لأنها غير مهذبة","تحويلها إلى المدير فوراً دون رد"],"الإنصات أولاً قاعدة التعامل مع ولي الأمر الغاضب، ثم الحقائق بهدوء. الرد الدفاعي يصعّد، والتجاهل والتحويل الفوري تخلٍّ عن التواصل."],["L14","","جميع ما يلي يعزز ثقافة تواصل داعمة للتعلم ما عدا:",["السخرية الخفيفة من الإجابات الخاطئة لكسر الجمود","زمن انتظار كافٍ بعد السؤال","تنويع الأسئلة بين مغلقة ومفتوحة","التغذية الراجعة الوصفية"],"أي سخرية تولد خوفاً من الخطأ، وهو أكبر معوقات التفاعل اللفظي."],["L14","m","يريد المعلم تعزيز تعلم طلابه خارج الصف عبر مجموعات تعلم افتراضية. الشرط الأهم لنجاحها:",["أن تكون تحت إشراف المعلم وتوجيهه بأهداف تعلم واضحة","أن تكون مفتوحة لأي شخص خارج المدرسة","أن تُخصص للتسلية والترفيه","أن يديرها الطلاب دون أي متابعة"],"مؤشر الهيئة: مجموعات افتراضية مع زملائهم تحت إشراف المعلم وتوجيهه. غياب الإشراف يفقدها هدفها التعليمي."],["L14","","وصف الطلاب معلمهم بأنه «يسمعنا ويفهمنا حتى لو اختلف معنا». تصف هذه العبارة:",["ثقافة تواصل آمنة تقوم على الإنصات والاحترام","نمطاً فوضوياً في الإدارة","ضعفاً في الضبط الصفي","تعزيزاً مادياً"],"الاستماع مع الاحتفاظ بالرأي ليس تساهلاً؛ هو جوهر الثقافة الداعمة للتعلم التي يشعر فيها الطالب بالقبول."],["L14","m","ينادي المعلم الطلاب المتطوعين وحدهم، فتركزت المشاركة في ثلاثة طلاب. الإجراء الأنسب لتوسيع المشاركة:",["توزيع الأسئلة على الجميع بأسلوب عشوائي مع زمن انتظار وتدرج في الصعوبة","الاكتفاء بالمتطوعين لأنهم الأكثر رغبة","خصم درجات من غير المشاركين","طرح أسئلة أصعب على المتطوعين"],"التوزيع العادل مع زمن الانتظار يرسل رسالة أن الجميع متوقع منهم المشاركة. الخصم يولد الخوف، والاكتفاء بالمتطوعين يهمّش البقية."],["L01","h","في مهمة عمل تضم عدة جنسيات وجد المعلم زميلاً غير مسلم. الطريقة المتزنة للتعامل معه بحسب قيمنا الإسلامية:",["التعامل معه وفق مقتضيات مهام العمل","دعوته إلى الإسلام وبيان محاسنه في كل لقاء","إرشاده إلى مراكز الدعوة الإسلامية","الاكتفاء بالحد الأدنى من التعامل لاختلاف الدين"],"الوسطية تقتضي التعامل المهني المحترم وفق متطلبات العمل. الدعوة القسرية في كل لقاء أو تقليل التعامل تعصب يناقض التسامح والتعايش اللذين نص عليهما الميثاق."],["L01","h","رُفع الأذان أثناء شرح المعلم. التصرف الذي يجسد القدوة الحسنة:",["يتوقف عن الشرح ويردد الأذان مع طلابه","يستمر في الشرح حتى لا يضيع وقت الحصة","يروي لهم قصة قصيرة عن فضل الأذان","يذكّرهم بواجب المسلم تجاه الأذان ثم يكمل الشرح"],"القدوة سلوك عملي يراه الطلاب، فالتوقف عن الشرح وترديد الأذان معهم نمذجة مباشرة للقيمة. أما تذكيرهم بواجب المسلم ثم إكمال الشرح فوعظ لفظي يخالفه الفعل، ورواية قصة عن فضل الأذان كلام لا فعل، والاستمرار في الشرح يضيّع الموقف التربوي."],["L01","","النظام الذي يجرّم التنصت والابتزاز والتشهير والدخول غير المشروع عبر الشبكة:",["نظام مكافحة الجرائم المعلوماتية","لائحة السلوك والمواظبة","لائحة الوظائف التعليمية","ميثاق أخلاقيات مهنة التعليم"],"نظام مكافحة الجرائم المعلوماتية (1428هـ) هو المرجع الجزائي للجرائم الإلكترونية. لائحة السلوك تنظم سلوك الطلاب داخل المدرسة لا الجرائم العامة."],["L01","","سُئل المعلم في الصف عن مسألة فقهية خلافية تعددت فيها آراء العلماء. التصرف الأنسب:",["يبين أن المسألة خلافية ويحيل الطلاب إلى المصادر الموثوقة والجهات المختصة دون فرض رأيه","يرجح رأيه الشخصي ويطلب من الطلاب الالتزام به","يرفض الإجابة ويطلب عدم إثارة مثل هذه الأسئلة","يفتح نقاشاً مفتوحاً ليصوّت الطلاب على الرأي الأصح"],"الحياد في القضايا الخلافية من أخلاقيات المهنة. فرض الرأي يخالف الحياد، والرفض يقمع السؤال، والتصويت يجعل الفتوى بالأغلبية."],["L01","m","الوسطية كما يقصدها ميثاق أخلاقيات مهنة التعليم تعني:",["الاعتدال بين الغلو والتفريط في الأقوال والأحكام والتعامل","التوسط بين الطلاب عند الخلاف","اختيار الرأي الذي يرضي أغلبية الطلاب","الامتناع عن الحديث في أمور الدين داخل الصف"],"الوسطية موقف بين طرفين: الغلو (الزيادة) والتفريط (التقصير). البديل «إرضاء الأغلبية» ميوعة لا وسطية، والامتناع عن الدين يناقض رسالة التعليم."],["L01","m","الرقيب الحقيقي على سلوك المعلم بعد الله سبحانه وتعالى، كما ينص الميثاق، هو:",["ضميره اليقظ وحسه الناقد","المشرف التربوي","مدير المدرسة","تقويم الأداء الوظيفي"],"الميثاق يقدم الرقابة الذاتية على كل رقابة خارجية مهما تنوعت أساليبها. المشرف والمدير والتقويم رقابة خارجية."],["L01","","لاحظ المعلم أن بعض طلابه يسخرون من زميل لهم بسبب لهجته ومنطقته. الإجراء الأنسب لتعزيز الهوية الوطنية الجامعة:",["يوظف الموقف لبيان أن تنوع المناطق واللهجات ثراء لوطن واحد ويدعم ذلك بشواهد","يعاقب الساخرين أمام زملائهم ليكونوا عبرة","يطلب من الطالب تغيير لهجته ليندمج مع زملائه","يتجاهل الموقف لأنه مزاح أطفال"],"الهوية الوطنية الجامعة تُبنى بتحويل الموقف إلى درس في وحدة الوطن مع تنوعه. العقاب العلني يخالف الميثاق، وطلب تغيير اللهجة يحمّل الضحية المسؤولية."],["L01","m","أراد معلم تعزيز الهوية الوطنية في درسه. الأسلوب الأكثر فاعلية:",["عرض شواهد وإحصاءات ومنجزات وطنية مرتبطة بموضوع الدرس","إلقاء موعظة عن واجب حب الوطن","تكليف الطلاب بحفظ عبارات عن الوطن","تعليق صور الرموز الوطنية في الصف"],"تعزيز الهوية يكون بالشواهد لا بالوعظ؛ الحقائق والمنجزات تقنع العقل وتحرك الوجدان. الموعظة والحفظ والصور وسائل شكلية أو تلقينية."],["L01","","يميل أحد الطلاب إلى التشدد في أحكامه على زملائه ويصف من يخالفه بالفسق. التدخل الأنسب:",["يحاوره بالأدلة مبيناً سماحة الإسلام ووسطيته ويكون قدوة في التسامح","يثني على تدينه ويطلب من زملائه الاقتداء به","يمنعه من الحديث في الدين داخل الصف","يحيله مباشرة إلى المرشد الطلابي دون حوار"],"الغلو يُعالج بالحوار والدليل والقدوة، وهو دور المعلم أولاً. الثناء يعزز الغلو، والمنع قمع، والإحالة قبل الحوار تخطٍّ لدور المعلم."],["L01","","من أهداف رؤية المملكة 2030 في التعليم:",["تنمية الشراكة المجتمعية وسد الفجوة بين مخرجات التعليم وسوق العمل","قصر التعليم على المسار الأكاديمي","إلغاء التعليم الأهلي","تقليص مراحل التعليم العام"],"الرؤية تستهدف جودة المخرجات وربطها بسوق العمل وتنمية الشراكة المجتمعية والتعلم مدى الحياة. البدائل الأخرى لا علاقة لها بأهدافها."],["L01","","برنامج من برامج رؤية 2030 يستهدف بناء المواطن بالقيم والمهارات من الطفولة المبكرة وحتى التعلم مدى الحياة:",["برنامج تنمية القدرات البشرية","برنامج جودة الحياة","برنامج التحول الوطني","برنامج الإسكان"],"برنامج تنمية القدرات البشرية هو المعني بإعداد مواطن تنافسي عالمياً بالقيم والمعارف والمهارات. جودة الحياة والإسكان والتحول الوطني برامج بأهداف أخرى."],["L01","","يستشهد الميثاق بقول «الحكمة ضالة المؤمن أنى وجدها فهو أحق الناس بها» في سياق:",["التفاعل الإيجابي مع الثقافات الأخرى","الالتزام بالأنظمة واللوائح","العدل بين الطلاب","التطوير المهني الذاتي"],"ورد النص في مادة المعلم والمجتمع عند الحديث عن تنمية أهمية التفاعل الإيجابي مع الثقافات الأخرى لدى الطلاب."],["L01","","أثناء درس عن الأعياد سأل طالب غير سعودي عن عيد يحتفل به في بلده. التصرف الأنسب:",["يتيح له الحديث باختصار ويربط ذلك باحترام الثقافات مع تأكيد الثوابت","يطلب منه الاقتصار على ما ورد في المنهج","يؤجل سؤاله إلى ما بعد الحصة ولا يعود إليه","يحوّل الحديث إلى نقد عادات بلده"],"التفاعل الإيجابي مع الثقافات مع الحفاظ على الثوابت هو جوهر التنوع الثقافي في المعيار. التأجيل دون عودة تجاهل، والنقد إساءة."],["L01","","المعلم الذي يكون «قدوة لطلابه خاصة وللمجتمع عامة» يدل سلوكه على التزامه بـ:",["القيم الإسلامية وأخلاقيات المهنة","اللوائح الإدارية للمدرسة","متطلبات التطوير المهني","مبادئ الشراكة المجتمعية"],"القدوة نص صريح في مادة المعلم وطلابه من الميثاق، وهي من القيم والأخلاقيات لا من اللوائح الإدارية."],["L01","","المعلم الذي يحذر طلابه من مخاطر الغلو والتطرف ويبين لهم قيمة الاعتدال يحقق بنداً في:",["ميثاق أخلاقيات مهنة التعليم","لائحة الوظائف التعليمية","لائحة السلوك والمواظبة","قواعد القبول والتسجيل"],"مادة «المعلم وأداؤه المهني» في الميثاق تنص على أن المعلم يغرس مبدأ الاعتدال والتسامح والتعايش بعيداً عن الغلو والتطرف. اللوائح الأخرى تنظيمية لا قيمية."],["L01","","جميع ما يلي من رموز الهوية الوطنية السعودية ما عدا:",["شعار المدرسة","العلم الوطني","النشيد الوطني","يوم التأسيس"],"العلم والنشيد ويوم التأسيس رموز وطنية جامعة، أما شعار المدرسة فرمز مؤسسي محلي لا وطني."],["L01","","طلب طالب من المعلم رأيه في خلاف سياسي متداول في وسائل التواصل. الأنسب:",["يلتزم الحياد ويوجه الطلاب إلى المصادر الرسمية","يعرض رأيه الشخصي بصراحة","يسمح بنقاش مفتوح بين الطلاب حول القضية","يسخر من الطرف الذي يخالفه"],"الحياد في القضايا الخلافية واجب مهني، والتوجيه للمصادر الرسمية يحمي الطلاب من التضليل. النقاش المفتوح في قضية خلافية يحوّل الصف إلى ساحة لغير ما يُعنى بتعليمهم."],["L01","m","المعلم الذي يصحح لطالب معلومة مغلوطة عن تاريخ الوطن بعرض الوثائق والمصادر يستخدم في تعزيز الهوية أسلوب:",["الشواهد والأدلة","الوعظ المباشر","التلقين","الترهيب"],"عرض الوثائق شاهد يقنع ويبني الهوية على المعرفة. الوعظ والتلقين لا يصححان مفهوماً خاطئاً راسخاً."],["L01","","يتداول الطلاب على هواتفهم مقطعاً مسيئاً لأحد زملائهم. أول ما ينبغي على المعلم:",["إيقاف التداول وتوعيتهم بأن ذلك جريمة معلوماتية ثم إبلاغ المرشد والإدارة","مصادرة الهواتف جميعاً وإتلاف المقطع","تجاهل الأمر لأنه حدث خارج الحصة","معاقبة من صوّر المقطع أمام زملائه"],"حماية الطالب المتضرر وإيقاف الانتشار أولاً مع التوعية بالنظام، ثم الإحالة للجهات المختصة. المصادرة والإتلاف تجاوز للصلاحيات، والعقاب العلني يخالف الميثاق."],["L01","m","تنمية الإحساس بالانتماء للدين والوطن وأهمية التفاعل الإيجابي مع الثقافات الأخرى من بنود الميثاق في مادة:",["المعلم والمجتمع","المعلم وطلابه","المعلم والأسرة","المعلم والمجتمع المدرسي"],"هذا البند هو أول بنود مادة «المعلم والمجتمع». مادة «المعلم وطلابه» تتناول العدل والقدوة وتجنب العقاب."],["L01","","في يوم التأسيس، أي الأنشطة يعزز الهوية الوطنية بصورة أعمق؟",["مشروع طلابي يبحث فيه الطلاب تاريخ الدولة ويعرضونه بالشواهد","ارتداء الزي التراثي دون محتوى معرفي","حفظ تاريخ الحدث لاختبار قصير","عرض مقطع مرئي دون مناقشة"],"المشروع يجعل الطالب يبني المعرفة بنفسه ويربطها بالشواهد. الزي والحفظ والعرض الصامت مظاهر لا تبني الانتماء."],["L01","m","ميل المعلم إلى التهاون في تطبيق القيم بحجة التيسير يقع في:",["التفريط","الغلو","الوسطية","الحياد"],"التفريط هو التقصير والتهاون، وهو الطرف المقابل للغلو. الحياد مصطلح يخص القضايا الخلافية لا تطبيق القيم."],["L01","","معلم يتحدث في الصف بازدراء عن شعوب أخرى. سلوكه يتعارض مع:",["قيم التسامح والتعايش والتفاعل الإيجابي مع الثقافات التي نص عليها الميثاق","لائحة الوظائف التعليمية","قواعد الانضباط الصفي","تعليمات الأنشطة غير الصفية"],"الازدراء يناقض الوسطية والتسامح المنصوص عليهما في الميثاق. اللوائح الأخرى تنظيمية ولا تعالج القيم."],["L01","m","قيمة «حب الوطن» عندما تصبح جزءاً من شخصية الطالب يتصرف بها تلقائياً تكون في مستوى كراثول:",["تمثّل القيمة","الاستقبال","الاستجابة","التنظيم"],"أعلى مستويات المجال الوجداني أن تصبح القيمة طابعاً للشخصية. التنظيم يسبقه (ترتيب القيم في نسق)، والاستقبال والاستجابة أدنى."],["L01","","طلاب في المرحلة الثانوية يشككون في جدوى بعض أنظمة الدولة. الاستجابة التربوية الأنسب:",["حوار هادئ يعرض الحقائق والشواهد ويبين قنوات التعبير النظامية","تجاهل حديثهم لأنه خارج المنهج","التهديد بالإبلاغ عنهم","مجاراتهم في النقد لكسب ثقتهم"],"المراهق يحتاج حواراً بالشواهد وتوجيهاً إلى القنوات النظامية، وهذا جوهر تعزيز الهوية. التهديد يقطع الثقة، والمجاراة تخل بالحياد والقدوة."],["L02","h","من اختصاصات اللجنة العليا لسياسة التعليم:",["إقرار الخطة التعليمية","إعداد المعلمين","بناء المقررات الدراسية","تدريب المعلمين أثناء الخدمة"],"اللجنة العليا لسياسة التعليم جهة عليا تضع السياسة وتقرّ الخطط، أما إعداد المعلمين وتدريبهم وبناء المقررات فمهام تنفيذية للوزارة والجامعات. تنبيه: نص الوثيقة نفسه يسمّي الجهة العليا «المجلس الأعلى للتعليم» الذي يشرف على شؤون التعليم (المادة 231)، والفكرة واحدة: الإشراف والإقرار لا التنفيذ."],["L02","","صدرت وثيقة سياسة التعليم في المملكة العربية السعودية عام:",["1390هـ","1427هـ","1440هـ","1373هـ"],"اعتُمدت وثيقة سياسة التعليم بقرار مجلس الوزراء رقم 779 وتاريخ 16/9/1389هـ، وتشتهر في المراجع التربوية بأنها صدرت عام 1390هـ، وهو الأقرب بين البدائل. 1427هـ عام الميثاق، و1440هـ عام لائحة الوظائف التعليمية، و1373هـ عام إنشاء وزارة المعارف."],["L02","","صدر ميثاق أخلاقيات مهنة التعليم عن وزارة التربية والتعليم عام:",["1427هـ","1390هـ","1440هـ","1428هـ"],"الميثاق صدر عام 1427هـ. 1428هـ عام نظام مكافحة الجرائم المعلوماتية، فلا تخلط بينهما."],["L02","m","الرخصة المهنية للمعلم وثيقة تصدرها:",["هيئة تقويم التعليم والتدريب","وزارة التعليم","إدارة التعليم بالمنطقة","المعهد الوطني للتطوير المهني التعليمي"],"اللائحة تعرّف الرخصة بأنها وثيقة تصدرها الهيئة وفق معايير محددة. الوزارة جهة التوظيف لا جهة الترخيص."],["L02","","الدرجة المطلوبة في اختبار الرخصة المهنية للحصول على رتبة معلم متقدم:",["70 فأعلى","50 فأعلى","80 فأعلى","60 فأعلى"],"تشترط ضوابط الرخص المهنية الدرجة الأدنى في الاختبارين معاً: 50–69 ممارس، و70–79 متقدم، و80 فأكثر خبير، مع استيفاء سنوات الخبرة؛ فحامل البكالوريوس يحتاج 6 سنوات فأكثر لرخصة متقدم و11 سنة فأكثر لرخصة خبير."],["L02","","مدة صلاحية الرخصة المهنية للمعلم:",["خمس سنوات","ثلاث سنوات","عشر سنوات","سنتان"],"تسري الرخصة المهنية خمس سنوات تبدأ من تاريخ إصدارها أو ترقيتها أو تجديدها. وإذا أُصدرت بعد مرور سنة ميلادية من اجتياز أحدث اختبار فتُحسب السنوات الخمس من نهاية تلك السنة."],["L02","m","حصل معلم على 82 في الاختبار التربوي العام و74 في اختبار التخصص. أعلى رتبة يمكنه الحصول عليها:",["معلم متقدم","معلم خبير","معلم ممارس","معلم خبير بعد سنة"],"الدرجة تُحسب بأدنى الاختبارين لأن المستوى مطلوب في كليهما؛ 74 تحقق متقدم (70 فأعلى) ولا تحقق خبير (80). لا يوجد تعويض أو درجة موزونة."],["L02","","من شروط الترقية من رتبة معلم ممارس إلى معلم متقدم وفق اللائحة:",["رخصة سارية بالمستوى المطلوب وتقويم أداء جيد جداً فأعلى آخر ثلاث سنوات وإكمال سنوات الرتبة","اجتياز الاختبار بأي درجة وموافقة مدير المدرسة","حضور عدد محدد من الدورات التدريبية فقط","تزكية من المشرف التربوي"],"تشترط المادة 10 من لائحة الوظائف التعليمية للترقية أربعة شروط مجتمعة: إمضاء المدة في الرتبة (6 سنوات للبكالوريوس، 5 للماجستير، 4 للدكتوراه)، والرخصة المهنية اللازمة، والحد الأدنى من نقاط التطوير المهني، وتقويم أداء لا يقل عن «جيد جداً» في السنوات الثلاث الأخيرة."],["L02","m","النصاب التعليمي الأسبوعي للمعلم الخبير:",["18 حصة","24 حصة","22 حصة","20 حصة"],"ممارس 24، متقدم 22، خبير 18؛ يقل النصاب بارتفاع الرتبة لإتاحة وقت لمهام التطوير والإسناد."],["L02","","تعرّف لائحة الوظائف التعليمية «التطوير المهني» بأنه:",["عملية منظمة لتنمية المعارف والمهارات العلمية والتربوية وفق المعايير المهنية","الدورات التدريبية التي تقيمها إدارة التعليم","ما يحصل عليه المعلم من مؤهلات أكاديمية","تقويم الأداء الوظيفي السنوي"],"التعريف يربط التطوير بالمعايير المهنية ويجعله عملية منظمة مستمرة لا مجرد دورات أو شهادات."],["L02","","يُعد المعيّن ابتداءً على الوظائف التعليمية تحت التجربة لمدة:",["سنتين","سنة","ستة أشهر","ثلاث سنوات"],"مدة التجربة سنتان يُقوَّم خلالها مرة على الأقل، وإذا لم تثبت صلاحيته تنتهي خدمته."],["L02","","عدد سنوات الرتبة المطلوبة لترقية معلم يحمل البكالوريوس إلى الرتبة التالية:",["ست سنوات","أربع سنوات","سبع سنوات","ثلاث سنوات"],"تشترط المادة 10 من لائحة الوظائف التعليمية لحامل البكالوريوس ست سنوات في رتبته قبل ترقيته (5 للماجستير و4 للدكتوراه)، وتُخفض كل مدة سنة واحدة عند الترقية من متقدم إلى خبير. أما ثلاث سنوات فهي مدة تقويم الأداء المطلوبة لا سنوات الرتبة."],["L02","m","وفق لائحة الوظائف التعليمية، «مجموع الحصص الصفية التي يجب على شاغلي الوظائف التعليمية أداؤها خلال أيام العمل الأسبوعية» يسمى:",["النصاب التعليمي","الحصص الصفية","الحصص الزائدة","الحصص الاحتياطية"],"هذا تعريف «النصاب التعليمي» نصاً في المادة الأولى من لائحة الوظائف التعليمية (بتعديلات 1446)، ويختلف بالرتبة: 24 حصة للممارس، و22 للمتقدم، و18 للخبير (المادة 9). أما «الحصص الصفية» فهي الحصص التدريسية التي يُجمع منها النصاب، و«الحصص الزائدة» ما يُكلَّف به المعلم بعد استيفاء نصابه وبموافقته (المادة 9/3). والمشاركة في التخطيط والتقويم وإدارة الأنشطة والتطوير المهني التزام إضافي في المادة 9/4."],["L02","","تُسلَّم نسخة من الدليل التنظيمي لقواعد السلوك والمواظبة ويؤخذ توقيعه بالعلم من:",["ولي الأمر","المرشد الطلابي","معلم الفصل","وكيل شؤون الطلاب"],"تنص قواعد السلوك والمواظبة على إطلاع الطلبة وأولياء أمورهم على القواعد وتسليمهم نسخة منها وأخذ توقيعهم بذلك وفق نموذج الالتزام المدرسي، ويُجدد في بداية كل عام دراسي. ومنسوبو المدرسة (المعلم والموجه والوكيل) يوقّعون بالاطلاع على أدوارهم في تطبيقها، أما تسليم النسخة ونموذج الالتزام فللطالب وولي أمره."],["L02","","تُطبق لائحة السلوك والمواظبة على طلاب المرحلتين المتوسطة والثانوية إذا وقعت المخالفة:",["في الطرقات المحيطة بالمدرسة بمرأى أحد منسوبيها","داخل أسوار المدرسة فقط","في أي مكان خارج المدرسة","في حافلة النقل المدرسي فقط"],"تُطبق قواعد السلوك داخل المدرسة، وفي التعليم الإلكتروني، والبرامج والأنشطة خارجها، وحافلات النقل المدرسي، وفي حدود المدرسة (الشوارع المحاذية لها) إذا رصدها منسوبو المدرسة أو كاميراتها. لذلك «داخل الأسوار فقط» و«الحافلة فقط» و«أي مكان» كلها خطأ."],["L02","m","تتعامل مع المشكلة السلوكية لطالب من برامج ذوي الاحتياجات الخاصة في المدرسة:",["لجنة التوجيه الطلابي بالتنسيق مع قسم ذوي الإعاقة بإدارة التعليم","معلم الفصل منفرداً دون الرجوع لأحد","مدير المدرسة مباشرة دون اللجنة","ولي الأمر وحده في المنزل"],"تنص قواعد السلوك والمواظبة على أن مخالفة الطالب من ذوي الإعاقة في برامج الدمج تتعامل معها لجنة التوجيه الطلابي في المدرسة بالتنسيق مع قسم ذوي الإعاقة في إدارة التعليم، مراعاةً لخصائصه. انفراد المعلم أو المدير أو تركها للأسرة يخالف هذا الإجراء."],["L02","","أفشى معلم في مجلس عام معلومات عن ظروف أسرة أحد طلابه. سلوكه يخالف في الميثاق:",["صون كرامة الطالب وحفظ أسراره وأسرار أسرته","واجب النمو المهني","العمل بروح الفريق","التعاون مع المجتمع المحلي"],"الميثاق يلزم المعلم بأن يصون كرامة طلابه (المادة 5، البند 5)، ومدونة السلوك 1447 توجب التعامل مع المعلومات الشخصية للطلاب بسرية تامة وتحظر إفشاء ما فيه خصوصية. أما النمو المهني وروح الفريق والتعاون مع المجتمع فواجبات لا صلة لها بالسرية."],["L02","m","اتخذ معلم من حصته ساحة لمناقشة قضايا لا علاقة لها بتعليم طلابه في تخصصه. يخالف بذلك بند الميثاق الذي ينص على أن المعلم:",["يستثمر أوقات طلابه ولا يتخذ الدروس ساحة لغير تعليمهم","قدوة لطلابه خاصة وللمجتمع عامة","شريك الوالدين في التربية والتنشئة","أمين على كيان الوطن ووحدته"],"نص المادة الخامسة صريح في استثمار وقت الطالب وعدم تحويل الدرس إلى منبر لغير التعليم."],["L02","","يعاقب معلم طلابه بالضرب والتوبيخ النفسي. موقف الميثاق:",["الطالب ينفر من المدرسة التي يُستخدم فيها العقاب البدني والنفسي، والمربي القدير يتجنبهما","العقاب البدني جائز إذا كان خفيفاً","العقاب النفسي مقبول بديلاً عن البدني","يحق للمعلم اختيار أسلوب العقاب بحرية"],"الميثاق يرفض العقاب البدني والنفسي معاً. البديل «النفسي مقبول» فخ لأن النص يذكرهما معاً."],["L02","","«المعلم شريك الوالدين في التربية والتنشئة» بند من مادة:",["المعلم والأسرة","المعلم وطلابه","المعلم والمجتمع المدرسي","المعلم وأداؤه المهني"],"المادة الثامنة (المعلم والأسرة) تجعل المعلم شريكاً للوالدين ويوطد الثقة بين البيت والمدرسة."],["L02","","يرى الميثاق أن أساس العلاقة بين المعلم وزملائه وبين المعلم والإدارة هو:",["الثقة المتبادلة والعمل بروح الفريق الواحد","المنافسة على التميز","الالتزام الرسمي بالمراسلات","التسلسل الإداري الصارم"],"مادة المعلم والمجتمع المدرسي تنص على الثقة وروح الفريق. المنافسة الفردية تناقض ثقافة التعاون."],["L02","m","المعلم الذي يتابع كل جديد في تخصصه وفنون التدريس يدرك أن النمو المهني في الميثاق:",["واجب أساس والثقافة الذاتية المستمرة منهج حياة","خيار شخصي مرتبط بالرغبة","مسؤولية إدارة التعليم وحدها","مطلوب للترقية فقط"],"المادة الرابعة تجعل النمو المهني واجباً أساسياً على المعلم نفسه، لا خياراً ولا مسؤولية الإدارة."],["L02","","يرفض معلم تنفيذ تعميم من الوزارة بحجة أنه لا يقتنع به. تصرفه يخالف:",["الالتزام بالأنظمة والتعليمات الرسمية","حق المعلم في التظلم من القرارات","مبدأ التطوير المهني الذاتي المستمر","قواعد ضبط الصف وإدارته"],"الميثاق يعد احترام قواعد السلوك الوظيفي والالتزام بالأنظمة ركناً أساسياً. الاعتراض يكون عبر قنوات التظلم لا بالامتناع."],["L02","","تنص الغاية من التعليم في وثيقة السياسة على:",["فهم الإسلام فهماً صحيحاً متكاملاً وغرس العقيدة الإسلامية","إعداد الطالب لمتطلبات سوق العمل فقط","حفظ المقررات الدراسية واستظهارها","تخريج أكبر عدد ممكن من الطلاب"],"الغاية في المادة 28 تبدأ بفهم الإسلام وغرس العقيدة ثم القيم والمعارف والمهارات. سوق العمل هدف من أهداف رؤية 2030 لا الغاية الأصلية للوثيقة."],["L02","","مراحل التعليم العام وفق وثيقة سياسة التعليم:",["ابتدائي ست سنوات ومتوسط ثلاث وثانوي ثلاث","ابتدائي خمس ومتوسط أربع وثانوي ثلاث","ابتدائي ست ومتوسط ثلاث وثانوي أربع","ابتدائي أربع ومتوسط أربع وثانوي أربع"],"السلم التعليمي اثنا عشر صفاً: 6 + 3 + 3."],["L02","m","وفق قواعد القبول المعلنة لعام 1448هـ، يُقبل في الصف الأول الابتدائي الطفل الذي يصغر عن سن القبول بنحو تسعين يوماً بشرط:",["أن يكون قد أتمّ سنة في رياض الأطفال","أن يجتاز اختبار قبول تجريه المدرسة","موافقة ولي الأمر الكتابية فقط","أن يكون له أخ مسجّل في المدرسة نفسها"],"أعلنت وزارة التعليم لعام 1448هـ قبول من أكمل ست سنوات حتى 24 أغسطس 2020م، وقبول مواليد 25 أغسطس إلى 22 نوفمبر 2020م (نحو تسعين يوماً أصغر) بشرط إتمام سنة في رياض الأطفال. فالشرط الروضة، لا اختبار قبول ولا موافقة ولي الأمر وحدها."],["L02","","معلم يتهاون في الحضور المبكر لحصصه ويغادر قبل انتهائها. سلوكه يتعارض أولاً مع:",["احترام قواعد السلوك الوظيفي والالتزام بالأنظمة","مبدأ الشراكة المجتمعية","متطلبات البحث الإجرائي","تنمية الهوية الوطنية"],"المواظبة من قواعد السلوك الوظيفي التي عدها الميثاق ركناً في تحقيق أهداف المؤسسة."],["L02","m","طُلب من معلم تسليم درجات طلابه لجهة خارجية تجري دراسة. الإجراء الصحيح:",["الرجوع إلى إدارة المدرسة وتسليم البيانات عبر القنوات الرسمية فقط","تسليمها مباشرة لأنها لغرض البحث العلمي","رفض أي تعاون مع الجهات الخارجية","تسليمها بعد حذف الأسماء دون الرجوع للإدارة"],"بيانات الطلاب لا تخرج إلا بإذن الإدارة ووفق النظام. حذف الأسماء لا يغني عن الإذن، والرفض المطلق يعطل التعاون البحثي المشروع."],["L02","","بالتعديل الذي أُقر عام 1446هـ على لائحة الوظائف التعليمية أصبحت الرخصة المهنية:",["إلزامية لمزاولة التعليم اعتباراً من فبراير 2026","اختيارية لجميع المعلمين على رأس العمل","مطلوبة للترقية بين الرتب فقط","مرتبطة باستحقاق العلاوة السنوية"],"التعديل (القرار الوزاري 63694 بتاريخ 5/5/1446هـ) جعل الرخصة شرطاً لمزاولة المهنة من 1 فبراير 2026 وألغى ربطها بالعلاوة، مع إعفاء من بلغ الخمسين من العمر قبل ذلك التاريخ."],["L02","m","طالب يقل عمره عن ست سنوات بأربعين يوماً تقدم للصف الأول الابتدائي. وفق سياسة القبول:",["يجوز قبوله بعد قبول جميع الأطفال الذين أتموا السادسة","لا يجوز قبوله بأي حال","يُقبل مباشرة مثل أقرانه","يُقبل بعد اجتياز اختبار ذكاء"],"الأربعون يوماً داخل حد الاستثناء (90 يوماً)، فيجوز قبوله استثناءً لا مباشرةً مثل أقرانه، والأولوية لمن أتموا السادسة. وفي إعلان الوزارة لتسجيل 1448 يُشترط لهذا الاستثناء أن يكون الطفل قد أتم عاماً دراسياً كاملاً في رياض الأطفال. أما «لا يجوز بأي حال» فيتجاهل الاستثناء، ولا يوجد اختبار ذكاء للقبول."],["L02","","يرى معلم أن واجباته تقتصر على الشرح داخل الصف ويرفض المشاركة في نشاطات المدرسة. يعد الميثاق المشاركة في نشاطات المدرسة:",["ركناً أساسياً في تحقيق أهداف المؤسسة التعليمية","عملاً تطوعياً اختيارياً","من صلاحيات رائد النشاط وحده","مرتبطة بالمكافآت فقط"],"مادة المعلم والمجتمع المدرسي تجعل المشاركة في نشاطات المدرسة ركناً أساسياً إلى جانب الالتزام بالأنظمة."],["L02","","من الأسس العامة التي تقوم عليها سياسة التعليم في المملكة:",["الإيمان بالله رباً وبالإسلام ديناً وبمحمد صلى الله عليه وسلم نبياً ورسولاً","فرض رسوم دراسية على جميع مراحل التعليم","إلزامية التعليم الثانوي","اعتماد اللغة الإنجليزية لغة للتدريس"],"الأسس العامة في الباب الأول من وثيقة السياسة، وأولها (المادة 2) الإيمان بالله رباً وبالإسلام ديناً وبمحمد صلى الله عليه وسلم نبياً ورسولاً، ثم التصور الإسلامي للكون والإنسان والحياة (المادة 3). أما فرض الرسوم فيناقض المادة 233 (التعليم مجاني)، والوثيقة لم تجعل الثانوي إلزامياً، ولغة التعليم فيها العربية."],["L02","","يحق للمعلم التظلم من نتيجة تقويم الأداء الوظيفي:",["وفق إجراءات التظلم الواردة في إطار العمل التنظيمي","بالامتناع عن العمل حتى يُعدَّل","عبر وسائل التواصل الاجتماعي","بطلب إعادة التقويم من زميل آخر"],"اللائحة تنظم التظلم بإجراءات رسمية. الامتناع عن العمل أو التشهير مخالفة للسلوك الوظيفي."],["L02","m","المصطلح الذي تعرّفه اللائحة بأنه «كل ما يجب على شاغلي الوظائف التعليمية معرفته وممارسته وفق قيم ومسؤوليات مهنة التعليم»:",["المعايير المهنية","الرخصة المهنية","النصاب التعليمي","التطوير المهني"],"هذا تعريف المعايير المهنية الصادرة عن الهيئة. الرخصة وثيقة، والتطوير عملية، والنصاب حصص."],["L02","","عند ارتكاب طالب مخالفة سلوكية يُستدعى ولي أمره ويُطلب توقيعه على:",["العقد السلوكي أو التعهد الذي يحصل عليه الطالب","شهادة حسن سيرة وسلوك","طلب نقل الطالب","تقويم أداء المعلم"],"قواعد السلوك والمواظبة 1447 تشرك ولي الأمر في المتابعة: يُشعَر بالمشكلة ويُدعى للاتفاق على خطة تعديل السلوك، ويوقّع مع الطالب ومدير المدرسة نموذج «التعهد السلوكي» بعدم التكرار، ويُوثَّق رفضه إن رفض. أما شهادة حسن السيرة وطلب النقل وتقويم المعلم فلا صلة لها بإجراءات المخالفة."],["L02","","صرّح معلم لطلابه بأن بعض اللوائح «تعليمات ورقية لا تلزمه». الأثر التربوي الأخطر لسلوكه:",["زعزعة احترام الطلاب للأنظمة وفقدانهم القدوة في الالتزام","إضاعة وقت الحصة","إضعاف علاقته بالإدارة","تأخر خطته الدراسية"],"المعلم قدوة؛ استهانته بالنظام تُعلّم الطلاب الاستهانة به. البدائل الأخرى آثار جانبية أقل خطورة."],["L03","h","تبادل الزيارات الصفية بصفة دورية بين معلمي المدرسة يعد شكلاً من أشكال:",["تطوير الأداء المهني","مجتمعات التعلم المهنية الافتراضية","أخلاقيات مهنة التعليم","تحقيق مفهوم المدرسة المتعلمة"],"الزيارات أسلوب مباشر لتطوير الأداء. «الافتراضية» خاطئة لأن الزيارة حضورية، والمدرسة المتعلمة مفهوم أوسع لا يقتصر على الزيارات."],["L03","h","من أساليب التطوير المهني الذاتي للمعلم:",["التعليم المبرمج","الزيارات المتبادلة","الاجتماعات المهنية","الدرس النموذجي"],"التعليم المبرمج والحقائب والقراءة أساليب ذاتية يقوم بها المعلم وحده. الزيارات والاجتماعات والدرس النموذجي أساليب جماعية أو موجهة."],["L03","h","يطلب المعلم في عامه الأول من زملائه الأكثر خبرة زيارته في الفصل وتقديم النقد البناء له. أهم فائدة تحصل من ذلك:",["تقدم له المعرفة والخبرة بأساليب التدريس المتنوعة","تسهم في اعتياده على عملية التقويم وإحساسه بالراحة فيها","تساعده على تطبيق المبادئ التدريسية بفاعلية في جو الفصل","توصل لزملائه رغبته في أن يكون عضواً فاعلاً في الفريق"],"سؤال من دليل الهيئة: المعلم الجديد يفتقر إلى الخبرة بالأساليب، وزيارة الخبراء تطلعه على الأساليب الناجحة. البدائل الأخرى فوائد ثانوية."],["L04","h","أرسل ولي أمر بريداً إلكترونياً يسأل المعلم إن كان ابنه يعاني صعوبات تعلم. الرد المناسب:",["طلب موعد اجتماع بين ولي الأمر ومختص صعوبات التعلم في المدرسة","تقديم معلومات لولي الأمر عن خدمات تدريس ذوي صعوبات التعلم","مناقشة التدخلات النظامية ودور ولي الأمر في المتابعة مع المعلم","توصية ولي الأمر بمراقبة واجبات ابنه وعاداته السلوكية"],"سؤال من دليل الهيئة (3.2): التشخيص ليس من صلاحية المعلم، فيحيل إلى المختص. مناقشة التدخلات تفترض تشخيصاً لم يحدث بعد."],["L04","h","يلتقي معلمو الصف الخامس بانتظام لمناقشة الاستراتيجيات التي تساعد الطلاب الذين يجدون صعوبة في الرياضيات. الفائدة المرجوة من هذا اللقاء مساعدة المعلمين على:",["تقديم تعليم مناسب لجميع أنواع ومستويات الطلاب","مكافأة المعلمين الذين يستخدمون طرقاً فعالة","التأكيد على أن بعض المعلمين أفضل من غيرهم","تبادل الآراء حول إزالة الشعور بالإحباط لديهم"],"سؤال من دليل الهيئة (3.1): مجتمع التعلم يركز على تعلم الطلاب. إزالة الإحباط بديل يركز على المعلم لا على أثر اللقاء في الطالب."],["L04","h","أحد أساليب تنمية أداء المعلمين يساعد بصورة كبيرة على التكيف مع المواقف والممارسات التعليمية المختلفة:",["مجموعات التعلم المهنية","اللقاءات الدورية مع أولياء الأمور","التنافس في العطاء بين المعلمين","المؤتمرات والورش التربوية"],"مجتمعات التعلم تتيح تجريب الاستراتيجيات في مواقف مختلفة وتبادل الخبرات باستمرار. المؤتمرات موسمية، والتنافس يناقض ثقافة التعاون."],["L04","h","تعتمد الشراكة بين المدرسة والمجتمع على أطراف مثل إدارة المدرسة وأولياء الأمور والقطاعين الحكومي والخاص والجامعات، ويعتمد نجاحها على الاحترام المتبادل وتقدير جهود المعلمين وتعزيز المسؤولية المتبادلة. ما سبق يعني:",["مقومات الشراكة بين المدرسة والأسرة والمجتمع","خصائص الشراكة المجتمعية بين الأسرة والمدرسة","المسؤولية المجتمعية وعلاقتها بالشراكة المجتمعية","متطلبات تفعيل الشراكة بين المدرسة والأسرة"],"الأطراف وشروط النجاح هي مقومات (أركان) الشراكة. الخصائص تصف طبيعتها، والمتطلبات إجراءات تفعيلها."],["L04","h","عند إعداد المعلم للأنشطة غير الصفية ينبغي مراعاة أن تكون:",["اختيارية بما يتناسب مع إمكانيات المتعلمين","مطبقة داخل المدرسة فقط","موحدة للطلاب جميعهم","مقتصرة على محتويات الكتاب المدرسي"],"فلسفة النشاط غير الصفي تقوم على الميول والطوعية والفروق الفردية. التوحيد والإلزام والحصر في الكتاب تناقضها."],["L04","","من المبادئ الأساسية لمجتمعات التعلم المهنية:",["تشارك الرؤية والقيم والأهداف والتركيز على تعلم الطلاب","التنافس الفردي بين المعلمين","الاعتماد على التدريب الخارجي فقط","تقويم المعلمين بعضهم لبعض لأغراض الترقية"],"المبادئ الأربعة: رؤية مشتركة، ثقافة تعاون، تركيز على تعلم الطلاب، تركيز على النتائج. التنافس والتقويم للترقية يناقضان ثقافة التعاون."],["L04","","من أوعية مجتمعات التعلم المهنية:",["التدريب بالأقران والتوأمة المهنية والبحوث الإجرائية","الاختبارات الوطنية","اجتماعات أولياء الأمور","تقويم الأداء الوظيفي"],"الأوعية هي صيغ عمل المجتمع المهني: التدريب المباشر، الورش، المؤتمرات، البحوث الإجرائية، التدريب بالأقران، التوأمة، الشبكات، مجموعات التخصص."],["L04","","من عوامل نجاح مجتمعات التعلم المهنية:",["القيادة الداعمة على مستوى المدرسة وإدارة التعليم","زيادة عدد الحصص لكل معلم","حصر العضوية في المعلمين الجدد","الاكتفاء باللقاءات الافتراضية"],"عوامل النجاح: نظام فاعل للتطبيق، قيادة داعمة، بنية تنظيمية داعمة. زيادة الحصص تحرم المعلم من وقت التعاون."],["L04","","تُعرَّف الشراكة المجتمعية بأنها:",["إتاحة الفرصة لأكبر عدد من أولياء الأمور ومؤسسات المجتمع للإسهام بالفكر والمشورة والموارد في تطوير التعليم","تبرعات مالية تقدمها الشركات للمدارس","اجتماعات دورية بين المدير والمعلمين","زيارات الطلاب للمصانع والمؤسسات"],"الشراكة أوسع من المال؛ تشمل الفكر والمشورة والموارد البشرية، والعلاقة تبادلية. التبرعات صورة واحدة منها."],["L04","m","أكثر ما يجعل العلاقة بين المدرسة وأولياء الأمور فاعلة ومستمرة:",["التركيز على إظهار الجانب الإيجابي لأداء الأبناء وعدم استدعاء ولي الأمر عند المشكلات فقط","استدعاء ولي الأمر عند كل مخالفة","إرسال التقارير في نهاية العام فقط","الاكتفاء بالتواصل عبر الطالب"],"العلاقة التي تُبنى على المشكلات فقط تجعل ولي الأمر يتجنب المدرسة. التواصل الإيجابي المستمر والدعوة للفعاليات يبنيان الثقة."],["L04","","اشتكى طالب لوالده من معلمه، فحضر الوالد طالباً مناقشة الأمر. ما ينبغي أن يراعيه المعلم في
