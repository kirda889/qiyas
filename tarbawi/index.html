"نتائج صف كامل متدنية ← [[مجالس أولياء الأمور|ar.l04.family]]؛ ووالد الطالب المخالف ← **تزويده بلائحة القواعد السلوكية لتدريب ابنه في المنزل**.","الاجتماعات الدورية لا تعني **إشراك أولياء الأمور في تقويم المعلمين**؛ ومخاطبة المدير تكون بـ[[خطاب إداري|ar.l04.parenttools]] رسمي."],"t":[["الإنصات الفعّال","منح ولي الأمر فرصة التعبير والفهم قبل الرد أو التبرير."],["اجتماع الأهداف المشتركة","لقاء مع أولياء الأمور للاتفاق على أهداف تعلم الطالب ومتابعتها."],["مجلس أولياء الأمور","هيئة جماعية تضم أولياء الأمور والمعلمين لبحث قضايا الطلاب."],["مجلس المدرسة","مجلس يضم الإدارة والمعلمين وممثلي أولياء الأمور للمشاركة في القرار."],["دفتر التواصل","أداة يومية لتبادل الملاحظات بين المعلم والأسرة."],["ClassDojo","تطبيق لإدارة الصف وإطلاع أولياء الأمور على سلوك الطالب وتقدمه."],["Remind","تطبيق للتواصل مع الطلاب وأولياء الأمور وإرسال الواجبات دون رقم جوال."],["اليوم المفتوح","فعالية تستقبل فيها المدرسة الأسر لتوطيد العلاقة."],["الخطاب الإداري","كتابة وظيفية رسمية لمخاطبة المدير أو الجهات الرسمية بطلب أو إفادة."]],"ex":[]},{"h":"التفاعل مع المجتمع المحلي","pts":["[[**الشراكة المجتمعية**|ar.l04.partnership]]: إسهام الأسر والمؤسسات بالفكر والمشورة والموارد في علاقة **تبادلية**، وتنميتها هدف في رؤية 2030.","**مقومات الشراكة**: احترام متبادل وتقدير جهود المعلمين ومسؤولية مشتركة بين المدرسة والأسرة والقطاعين والجامعات.","الأنشطة غير الصفية **اختيارية** ولا تُقصر على داخل المدرسة، وأعمال الطلاب المعروضة من عملهم هم.","تنظيف الحديقة والمسجد المجاورين: **تكليف الطلاب بتقرير عما عملوه وتقييمهم**، لا الانصراف المبكر.","مشاركة المعلم في فعاليات الحي **تكسبه خبرات تدعم تعلم طلابه وتفاعلهم مع المجتمع**؛ وهو في الميثاق عضو مؤثر في مجتمعه."],"t":[["الشراكة المجتمعية","إسهام أولياء الأمور ومؤسسات المجتمع بالفكر والموارد في تطوير التعليم بعلاقة تبادلية."],["المشاركة المجتمعية","الجهود التطوعية للأفراد والمؤسسات في تخطيط العملية التعليمية وتنفيذها وتقييمها."],["المجتمع المحيط بالمدرسة","الجهات والأفراد حول المدرسة القادرون على دعمها مادياً أو عينياً أو بشرياً."],["الأنشطة غير الصفية","أنشطة اختيارية خارج الحصص تثري المنهج وتنمي المهارات والقيم."],["المسؤولية الاجتماعية","التزام المؤسسات والأفراد بالإسهام في خدمة المجتمع والتعليم."],["العمل التطوعي","مشاركة المعلم والطلاب في خدمة المجتمع دون مقابل."]]},{"h":"معوقات التواصل مع أولياء الأمور وحلولها","pts":["مؤشر الممارس 3.2: **يستخلص أبرز معوقات التواصل مع أولياء الأمور** ويشارك في اللقاءات التي تستهدف التغلب عليها.","قواعد 1447: من **دور الأسرة** حضور الاجتماعات والتواصل الفوري عند الغياب، ولجنة التوجيه الطلابي تعقد مجلس أولياء الأمور.","ولي أمر لا يستجيب: **يُحلَّل السبب أولاً** (وقت؟ لغة؟ تجربة سابقة؟) ثم يُختار الحل، لا تكرار الاستدعاء."],"t":[["معوقات التواصل","عوامل من جهة الأسرة أو المدرسة تمنع وصول الرسالة أو استجابة ولي الأمر."],["تنويع قنوات التواصل","استخدام رسائل ومنصات معتمدة واتصال ولقاءات حضورية وافتراضية بمواعيد مرنة لتجاوز معوقات التواصل."]],"map":{"type":"fan","title":["Barriers to Parent Communication","معوقات التواصل وحلولها"],"groups":[{"n":"من جهة الأسرة","ar":"انشغال وضيق وقت، تجربة سلبية سابقة، حرج من مستوى الابن، ضعف القراءة أو اختلاف اللغة، و«التعليم مسؤولية المدرسة وحدها»."},{"n":"من جهة المدرسة","ar":"استدعاء عند المشكلات فقط، تقارير مليئة بالمصطلحات، مواعيد غير مناسبة، أسلوب لوم أو استعلاء، قناة واحدة."},{"n":"الحلول","ar":"**تنويع القنوات**، مرونة المواعيد، رسائل إيجابية دورية، لغة بسيطة، الإنصات قبل العرض، وإشراك الأسرة في الأنشطة.","d":"ar.l04.parenttools"}]}},{"h":"توظيف القضايا المحلية في التدريس","pts":["مؤشر 3.3: [[**يتقصى القضايا المحلية ويوظفها في التدريس بصورة تعزز وظيفة المعرفة**|ar.l04.local]]، أي يستعمل الطالب ما تعلمه لفهم مشكلة في بيئته.","**التقصي** من الأخبار والإحصاءات الرسمية والأسر والمؤسسات، و**التوظيف** يربط القضية بهدف الدرس (بيانات في الرياضيات، تجربة في العلوم).","الضوابط: مناسبة للعمر، بلا تشهير بأشخاص أو جهات، ولا تتحول الحصة إلى موعظة؛ والأثر تعلم ذو معنى ومسؤولية مجتمعية."],"t":[["القضية المحلية","مشكلة أو ظاهرة في بيئة الطالب يمكن دراستها واقتراح حلول لها."],["وظيفة المعرفة","استخدام ما يتعلمه الطالب في فهم الواقع وحل مشكلاته لا مجرد حفظه."]],"intro":[]}],"trap":["ولي الأمر الغاضب: **الإنصات أولاً**؛ شرح وجهة نظرك ومراجعة اللوائح خطوات **لاحقة** صحيحة في توقيت خاطئ.","مناقشة التقدم مع أولياء الأمور = **اجتماع أهداف مشتركة**؛ التوقيع على التقارير ودفتر المتابعة إجراءات شكلية.","سؤال عن صعوبات التعلم ← **موعد مع المختص**، لا تشخيص من المعلم ولا توصيات عامة.","ولي أمر غاضب من المستوى ← **هدوء ومنطق**؛ غاضب يريد ابنه في الحصة ← **الإدارة**؛ يشكو تنمراً ← **استماع ثم المرشد**.","التقارير تهدف إلى **توضيح مستوى الطالب** لا إبراز جهود المعلم (بديل يركز على المعلم).","مجتمعات التعلم **عملية** لا نظرية؛ وهدفها تعاون **المعلمين** لتحسين تعلم **الطلاب** (لا تعاون الطلاب ولا الإدارة).","التشكيل حسب **الصفوف/التخصص** لا حسب الأعمار أو الخبرة أو أعداد الطلاب.","تحليل النتائج في مجتمع التعلم يسأل عن **الأسئلة والفصول** لا عن **الأفراد المتفوقين**.","الأنشطة غير الصفية **اختيارية**؛ «إلزامية» أو «موحدة للجميع» أو «داخل المدرسة فقط» تناقض فلسفتها.","تنظيف المسجد والحديقة ← **تقرير وتقييم**؛ المكافأة بالانصراف المبكر تعزيز في غير محله.","النزاع مع الزملاء ← **مبادرات جماعية**، لا تبليغ الإدارة ولا التعامل الرسمي البارد.","مزايا اجتماعات أولياء الأمور لا تشمل **تقويم المعلمين**؛ تقويم المعلم من صلاحية الإشراف والإدارة."],"vid":[["lWqaJZ_d8g0","الرخصة المهنية 6: شرح التفاعل المهني مع التربويين والمجتمع المحلي","سهام الزهراني",35],["rkRSfwoqTA8","شرح الأسئلة التطبيقية على المعيار الثالث الرخصة المهنية","سهام الزهراني",40],["xh7elsIxQdk","مجتمعات التعلم المهنية","سلوى البحيري",7],["MX3GgO3V6m4","المحاضرة الثالثة: المجال الأول، البحث الإجرائي ومجتمعات التعلم المهنية","منصة نبراس",41],["uoQ4uFMXHAg","شرح المجال الأول: القيم والمسؤوليات المهنية (الجزء الثالث)","سهام الزهراني",34],["lfIY9VaExkU","شرح التطوير المهني للمعلمين","سهام الزهراني",35]],"n":4}];
window.QB = [["L02","m","ارتفعت نسبة الرسوب والتسرب في إحدى المدارس، فوصف المشرف ذلك بأنه خسارة للنظام التعليمي. المصطلح الذي يصف هذه الخسارة:",["الفاقد التعليمي","الهدر الإداري","التأخر الدراسي","الفجوة المعرفية"],"الفاقد التعليمي هو ما يخسره النظام بسبب الرسوب والتسرب وله آثار اجتماعية واقتصادية. التأخر الدراسي حالة طالب لا نظام."],["L02","","وثيقة توضح الدليل القابل للملاحظة والقياس على مدى تحقق معيار من المعايير المهنية في ممارسة المعلم. هذا الدليل يسمى:",["مؤشر الأداء","الهدف السلوكي","الكفاية","الرتبة المهنية"],"المعيار عبارة عامة عمّا يجب أن يعرفه المعلم ويؤديه، والمؤشر دليل قابل للقياس على تحققه. الهدف السلوكي يخص تعلم الطالب."],["L02","m","احتاج معلم إلى التغيب يوماً واحداً لظرف طارئ لا يمكن تأجيله. نوع الإجازة النظامية الأنسب:",["إجازة اضطرارية","إجازة مرضية","إجازة صيفية","إجازة استثنائية"],"الإجازة الاضطرارية تُمنح للظروف الطارئة بحد لا يتجاوز خمسة أيام في السنة. المرضية تتطلب تقريراً طبياً، والاستثنائية بلا راتب لظروف خاصة طويلة."],["L04","m","تطبيق يخصص مساحة افتراضية لمشاركة الملفات والنقاش بين المعلم والطلاب وأولياء الأمور. التطبيق الذي يحقق ذلك:",["School Circle","Excel","Access","Canva"],"School Circle منصة تواصل وتشارك ملفات بين أطراف العملية التعليمية. إكسل للجداول، وأكسس لقواعد البيانات، وكانفا للتصميم."],["L07","h","طفل في الثانية يرمي الأشياء من مكانها ويراقب سقوطها مراراً. هذا السلوك يدل على:",["الاستكشاف","العدوان","فرط الحركة","الإحيائية"],"رمي الأشياء وتجريبها في الطفولة المبكرة استكشاف نمائي طبيعي لخصائص الأشياء. العدوان مقصود للإيذاء، وفرط الحركة اضطراب، والإحيائية إسناد الحياة للجماد."],["L07","m","أي العبارات الآتية صحيحة عن العلاقة بين النضج والتعلم؟",["النضج شرط للتعلم وليس التعلم شرطاً للنضج","التعلم شرط للنضج","كلاهما إرادي ويتأثر بالتدريب","لا علاقة بينهما"],"النضج تغيرات داخلية لا إرادية لا يسرّعها التدريب، وهو شرط لحدوث التعلم (لا يتعلم الطفل الكتابة قبل نضج عضلاته)، أما التعلم فيحتاج خبرة وممارسة."],["L07","","من خصائص النمو أنه تراكمي، ويقصد بذلك أن:",["كل مرحلة تبني على ما سبقها وتمهد لما بعدها","سرعته ثابتة في جميع المراحل","يحدث في جميع الجوانب بالدرجة نفسها","لا تتدخل فيه الوراثة"],"التراكمية والتتابع تعنيان أن المراحل مترابطة. النمو متغير السرعة ومختلف بين الجوانب وينتج عن تفاعل الوراثة والبيئة."],["L07","m","زيادة طول الطالب ووزنه خلال العام تمثل نمواً:",["تكوينياً","وظيفياً","انفعالياً","اجتماعياً"],"النمو التكويني (البنائي) زيادة في الحجم والشكل، أما الوظيفي فتحسن في أداء الأعضاء والقدرات."],["L07","","ظهور الأحلام اليقظة بكثرة وتكوّن الاستقلال والانتماء القوي للأصدقاء من خصائص طلاب المرحلة:",["المتوسطة","الابتدائية الدنيا","الابتدائية العليا","الروضة"],"أحلام اليقظة والاستقلال والانتماء للرفاق سمات المراهقة المبكرة (المتوسطة). الابتدائية تتسم بحب الاستطلاع والتطبيع الاجتماعي."],["L07","m","طالب في الصف الخامس يُنجز مهامه ويحصل على تشجيع فتنمو لديه الثقة في قدرته على الإنجاز. وفق إريكسون يمر بأزمة:",["الكفاية (الاجتهاد) مقابل النقص","الهوية مقابل تشتت الهوية","المبادرة مقابل الذنب","الاستقلال مقابل الخجل"],"سن المدرسة الابتدائية (6–12) أزمتها الاجتهاد/الكفاية مقابل الدونية/النقص. الهوية للمراهقة، والمبادرة لمرحلة الروضة، والاستقلال للطفولة المبكرة."],["L08","","قاس معلم الزمن بين عرض المثير وبداية استجابة كل طالب له فوجد تفاوتاً بينهم. ما قاسه المعلم يسمى:",["زمن الرجع","الاستعداد","الاتجاه","الميل"],"زمن الرجع هو الفترة بين المثير وبدء الاستجابة وهو من الفروق الفردية القابلة للقياس. الاستعداد قدرة كامنة، والاتجاه والميل وجدانيان."],["L08","m","طالب نسبة ذكائه دون 70 مع قصور واضح في مهارات العناية بالذات والتواصل ظهر قبل سن 18. الفئة الأقرب:",["الإعاقة العقلية","صعوبات التعلم","بطء التعلم","التأخر الدراسي"],"الإعاقة العقلية تجمع انخفاض الذكاء (دون 70) وقصور السلوك التكيفي قبل 18. بطء التعلم ذكاء حدي 70–85، وصعوبات التعلم ذكاء عادي، والتأخر الدراسي سببه الإهمال."],["L08","","صعوبات التعلم الناتجة عن خلل في العمليات النفسية الأساسية نفسها لا عن سوء التعليم أو الحرمان البيئي تسمى صعوبات:",["أولية","ثانوية","أكاديمية","مؤقتة"],"الأولية تعود إلى الخلل الداخلي في العمليات النفسية، والثانوية تنتج عن عوامل خارجية كسوء التدريس أو الحرمان."],["L08","m","أراد معلم الكشف الأولي عن احتمال وجود صعوبات تعلم لدى طالب بتقدير سلوكه في الفهم والذاكرة والانتباه. الأداة الأنسب:",["مقياس مايكل بست للتقدير السلوكي","اختبار ستانفورد بينيه","اختبار الاستعداد المهني","مقياس ليكرت للاتجاهات"],"مايكل بست مقياس تقدير سلوكي يملؤه المعلم للكشف الأولي عن صعوبات التعلم. ستانفورد بينيه للذكاء، وليكرت للاتجاهات."],["L08","m","يرى جانييه أن الفرق بين الموهبة والتفوق هو أن:",["الموهبة قدرة طبيعية والتفوق أداء مكتسب ينمى بالبيئة","الموهبة أداء مكتسب والتفوق قدرة فطرية","الموهبة والتفوق مترادفان","التفوق يُقاس بالذكاء والموهبة بالتحصيل"],"نموذج جانييه: الموهبة استعداد فطري غير مدرَّب، والتفوق أداء متميز في مجال نتيجة التدريب؛ ولذلك كل متفوق موهوب وليس كل موهوب متفوقاً."],["L08","h","من سمات الطالب الموهوب التي قد يخطئ المعلم في تفسيرها:",["حس الدعابة والكمالية المبالغ فيها","ضعف المفردات اللغوية","قلة الأسئلة والفضول","الاعتماد الكلي على المعلم"],"الموهوب يتميز بحس الدعابة والكمالية والفضول والنمو اللغوي المبكر، وقد يُفسر ملله أو سخريته خطأً على أنه سوء سلوك."],["L09","m","ثبّت معلم ارتباطاً بين الجرس والاصطفاف بتكرار الاقتران حتى صار الطلاب يصطفون عند سماعه. رائد النظرية التي ترى أن اقتراناً واحداً بين المثير والاستجابة يكفي لتكوين التعلم هو:",["جاثري","بافلوف","ثورندايك","سكنر"],"جاثري صاحب نظرية الاقتران الشرطي ومبدأ المرة الواحدة. بافلوف إشراط كلاسيكي بالتكرار، وثورندايك محاولة وخطأ، وسكنر إجرائي."],["L09","h","خاف طفل من النار بعد لسعة واحدة فصار يتجنبها. هذا يمثل في نظرية الاشتراط:",["قانون المرة الواحدة","قانون الأثر","التعميم","الاسترجاع التلقائي"],"تكوّن الارتباط من خبرة واحدة شديدة هو قانون المرة الواحدة. قانون الأثر عند ثورندايك يخص الرضا والضيق، والتعميم استجابة لمثيرات مشابهة."],["L09","m","يميز سكنر بين السلوك الإرادي الذي يصدر عن الكائن ويتأثر بنتائجه، والسلوك اللاإرادي الذي يستثيره مثير سابق. يسمى الأول والثاني على الترتيب:",["إجرائي، واستجابي","استجابي، وإجرائي","شرطي، وغير شرطي","كامن، وظاهر"],"السلوك الإجرائي إرادي تحكمه النتائج (التعزيز)، والاستجابي لا إرادي يستدعيه المثير (كما في بافلوف)."],["L09","","الاشتراط الإجرائي يسمى أيضاً الاشتراط:",["الوسيلي","الكلاسيكي","الاستجابي","البسيط"],"يسمى وسيلياً لأن الاستجابة وسيلة للحصول على المعزز. الكلاسيكي والبسيط والاستجابي أسماء لاشتراط بافلوف."],["L09","m","مؤسس مدرسة الجشطلت الذي وضع قوانين التنظيم الإدراكي (التقارب، التشابه، الإغلاق) هو:",["فرتهايمر","كوهلر","تولمان","أوزوبل"],"فرتهايمر مؤسس الجشطلت، وكوهلر صاحب تجربة القرد والعصا (الاستبصار)، وتولمان الخرائط المعرفية، وأوزوبل التعلم ذو المعنى."],["L09","","بدأ معلم الوحدة بأكثر الأفكار شمولاً ثم انتقل تدريجياً إلى التفاصيل الأقل شمولاً. هذا المبدأ عند أوزوبل يسمى:",["التمايز التقدمي","التوفيق التكاملي","المنهج الحلزوني","الاستبصار"],"التمايز التقدمي من العام إلى الخاص، والتوفيق التكاملي ربط الأفكار وإزالة التعارض، والحلزوني لبرونر، والاستبصار للجشطلت."],["L09","m","عندما يشبّه المعلم عقل المتعلم بالحاسوب الذي يستقبل مدخلات ويعالجها ثم يُخرجها، فإنه يستند إلى نموذج:",["معالجة المعلومات","الاشتراط الإجرائي","التعلم بالاستبصار","التعلم الاجتماعي"],"نموذج معالجة المعلومات (نورمان، أتكنسون وشفرن) يفسر التعلم بالانتباه والترميز والتخزين والاسترجاع كالحاسوب."],["L09","h","صاحب نظرية الترميز المزدوج التي ترى أن تخزين المعلومة لفظياً وبصرياً معاً أقوى من تخزينها بشكل واحد هو:",["بافيو","بياجيه","باندورا","برونر"],"بافيو صاحب الترميز المزدوج (لفظي وتصوري). بياجيه نمو معرفي، وباندورا تعلم اجتماعي، وبرونر تمثيلات ثلاث."],["L09","m","نصح معلم طلابه بمراجعة الدرس في جلسات قصيرة متباعدة بدل جلسة واحدة طويلة ليلة الاختبار. المبدأ الذي استند إليه:",["التدريب الموزع أفضل للاحتفاظ من المكثف","التدريب المكثف أفضل للاحتفاظ","التكرار الآلي يضمن الفهم","الحفظ يسبق الفهم دائماً"],"الممارسة الموزعة تعزز التخزين طويل المدى وتقلل التداخل، بخلاف الحشو المكثف الذي يُنسى سريعاً."],["L09","","يرى باندورا أن السلوك ينتج عن تفاعل مستمر بين الفرد والسلوك والبيئة. هذا المبدأ يسمى:",["الحتمية التبادلية","التعزيز البديل","الاستبصار","التمثل"],"الحتمية (التفاعل) التبادلية جوهر النظرية الاجتماعية المعرفية. التعزيز البديل مفهوم آخر لباندورا يخص ملاحظة نموذج يُعزَّز."],["L09","m","تجربة باندورا التي شاهد فيها الأطفال نموذجاً يضرب دمية ثم قلدوه تعرف بتجربة:",["دمية بوبو","القرد والعصا","الكلب والجرس","القط والصندوق"],"دمية بوبو تجربة باندورا في التعلم بالملاحظة. القرد لكوهلر، والكلب لبافلوف، والقط لثورندايك."],["L09","m","شاهد طالب زميله يُكافأ على ترتيب أدواته فبدأ يرتب أدواته هو أيضاً. المفهوم:",["التعزيز البديل","التعزيز السالب","التشكيل","الانطفاء"],"التعزيز البديل عند باندورا: ملاحظة نموذج يُعزَّز يزيد احتمال تقليده. التعزيز السالب إزالة منفر عن الطالب نفسه."],["L10","m","يرى علماء النفس أن الدافعية توجّه السلوك نحو هدف محدد. هذه الخاصية تسمى:",["الغرضية","الاستمرارية","التنوع","التحسين"],"الغرضية خاصية التوجه نحو هدف. الاستمرار والتنوع والتحسين خصائص أخرى للدافعية لكنها لا تعني التوجه نحو هدف."],["L10","","من وظائف الدافعية في التعلم:",["توليد السلوك وتوجيهه وتحديد شدته واستمراره","تحديد مستوى ذكاء الطالب","تفسير الفروق الوراثية","قياس التحصيل الدراسي"],"الدافعية تولد السلوك وتوجهه وتحدد شدته وديمومته. الذكاء والوراثة والتحصيل مفاهيم أخرى."],["L10","m","الحاجة إلى الطعام والنوم دوافع بيولوجية، أما الحاجة إلى التقدير والإنجاز فدوافع:",["اجتماعية مكتسبة","بيولوجية","فسيولوجية","لا شعورية"],"الدوافع الاجتماعية تُكتسب من التفاعل مع البيئة كالانتماء والتقدير والإنجاز، بخلاف البيولوجية الفطرية كالجوع."],["L10","h","في الصورة الموسعة لهرم ماسلو، الحاجتان اللتان تقعان بين حاجات التقدير وتحقيق الذات هما:",["المعرفة والجمال","الأمن والانتماء","الفسيولوجية والأمن","الانتماء والتقدير"],"الهرم الموسع سبعة مستويات: فسيولوجية، أمن، انتماء، تقدير، معرفة، جمال، تحقيق الذات. البدائل الأخرى مستويات دنيا."],["L10","","العالم الذي أكد أثر الوراثة في الذكاء وابتكر فكرة معامل الارتباط هو:",["جالتون","سبيرمان","جاردنر","ستيرنبرغ"],"جالتون رائد دراسة الوراثة والفروق ومعامل الارتباط. سبيرمان العامل العام، وجاردنر الذكاءات المتعددة، وستيرنبرغ الثلاثي."],["L10","m","اختبار ذكاء غير لفظي يعتمد على إكمال مصفوفات من الأشكال ويناسب من لا يجيد اللغة. هذا الاختبار:",["مصفوفات رافن","ستانفورد بينيه","وكسلر اللفظي","مقياس ليكرت"],"رافن اختبار مصفوفات متتابعة غير لفظي. ستانفورد بينيه ووكسلر لفظيان في معظمهما، وليكرت للاتجاهات."],["L10","m","ربط طالب ملاحظاته عن ارتفاع الحرارة بمعلوماته السابقة ثم أصدر حكماً بأن المعادن تتمدد بالحرارة. العملية العقلية:",["الاستدلال","الحفظ","التذكر","التخيل"],"الاستدلال وصول إلى نتيجة بناءً على أدلة كافية مربوطة بالمعرفة السابقة. الحفظ والتذكر استرجاع، والتخيل تصور."],["L10","","توليد الطالب أفكاراً غير مألوفة من تلقاء نفسه دون تغيير في طبيعة الموقف يمثل:",["المرونة التلقائية","المرونة التكيفية","الطلاقة اللفظية","الأصالة"],"المرونة التلقائية إنتاج أفكار متنوعة تلقائياً، والتكيفية تغيير الوجهة الذهنية لمواجهة موقف جديد، والطلاقة كمّ، والأصالة ندرة."],["L10","","وزّع معلم قوائم كلمات وطلب من الطلاب تمييز المترابط منها عن غير المترابط وتعليل ذلك. المهارة والاستراتيجية:",["التفكير الناقد بالكلمات المترابطة","التفكير الإبداعي بالإثارة العشوائية","ما وراء المعرفة بالتساؤل الذاتي","التفكير الجانبي بالقبعات"],"الكلمات المترابطة استراتيجية لتعليم التفكير الناقد (التمييز والتصنيف). الإثارة العشوائية إبداعية."],["L10","","القبعة التي يرتديها من يدير جلسة التفكير ويحدد تسلسلها ويتخذ القرار النهائي:",["الزرقاء","البيضاء","الحمراء","الخضراء"],"الزرقاء قبعة التنظيم والضبط واتخاذ القرار. البيضاء حقائق محايدة، والحمراء عاطفة، والخضراء ابتكار."],["L11","m","معلم يفوض طلابه مسؤولية تنظيم تعلمهم وتوزيع المهام بينهم ويكتفي بالمتابعة. يمثل دور المعلم:",["المفوّض","التقليدي","المرشد","الملقن"],"المعلم المفوّض يفوض المسؤولية للطلاب ويراقب. التقليدي والملقن ناقل للمعلومة، والمرشد يوجه ويرشد."],["L11","","دور المعلم الذي يركز على توجيه المتعلم إلى مصادر التعلم وطرقه هو دور المعلم:",["المرشد","المفوّض","التقليدي","الممتحن"],"المعلم المرشد يوجه المتعلم. المفوض يفوض المسؤولية، والتقليدي يلقن."],["L11","m","بدأ معلم اللغة درسه بتمهيد ثم عرض الأمثلة ثم ربطها بالقديم ثم استنتج القاعدة ثم طبّق عليها. الطريقة المتبعة:",["الاستدلالية (الهربارتية)","الاستنباطية","الحوارية","المشروع"],"خطوات هربارت الخمس: تمهيد، عرض، ربط، استنتاج، تطبيق تجمع الاستقراء والاستنباط. الاستنباطية تبدأ بالقاعدة، والحوارية أسئلة وأجوبة."],["L11","h","من مزايا الطريقة الاستقرائية أنها:",["تربط النظرية بالتطبيق وتصلح للمجموعات الكبيرة","سريعة وتوفر الوقت","لا تحتاج جهداً من الطالب","تضمن عدم نسيان القاعدة لأنها تُعطى أولاً"],"الاستقراء يبدأ بالأمثلة فيبذل الطالب جهداً ويربط النظرية بالتطبيق، وعيبه طول الوقت. السرعة وتقديم القاعدة أولاً من سمات الاستنباط."],["L11","","طلب المشرف من المعلم توضيح الفرق بين «المدخل» و«النموذج» في التدريس. الإجابة الصحيحة أن النموذج:",["إطار نظري يصف خطوات التدريس وتُشتق منه الاستراتيجيات","مرادف لأسلوب المعلم الشخصي","الفلسفة العامة التي يستند إليها التدريس","أداة أو وسيلة تعليمية"],"النموذج تصور نظري لخطوات التدريس (جويس وويل)، والمدخل الفلسفة والمنطلقات، والأسلوب ما يميز المعلم شخصياً."],["L11","m","رتّب معلم المادة من السهل إلى الصعب ومن المحسوس إلى المجرد. المدخل المتبع:",["المنطقي","التاريخي","الديني","التكاملي"],"المدخل المنطقي يعتمد التدرج المنطقي للمادة. التاريخي يتتبع تطور الفكر عبر العصور، والتكاملي يربط المادة بغيرها."],["L11","","ربط معلم الرياضيات درس النسبة بدرس الزكاة في الفقه وبقراءة الخرائط في الجغرافيا. المدخل المتبع:",["التكاملي","المنطقي","الضبط","النشاط"],"المدخل التكاملي يربط المادة بالمواد الأخرى بعلاقات أفقية. المنطقي ترتيب داخل المادة، والضبط تحكم في السلوك، والنشاط فعل الطالب."],["L11","m","موقف يقول فيه الطالب: «لا أعرف الحل الآن لكن أريد الوصول إليه». هذا الموقف يمثل مشكلة تعليمية لأنه يحتوي على:",["مانع وهدف يؤدي بلوغه إلى تعلم","قاعدة جاهزة وأمثلة","معلومات محفوظة تُسترجع","تعزيز فوري"],"المشكلة موقف غامض فيه هدف يسعى إليه المتعلم ومانع يحول دونه ويتعلم أثناء تجاوزه."],["L11","","آخر مراحل تنفيذ المشروع التعليمي بعد الخطة والتنفيذ والتقويم هي:",["كتابة التقرير","اختيار المشروع","تشكيل المجموعات","جمع الأدوات"],"مراحل المشروع: خطة، تنفيذ، تقويم، ثم كتابة التقرير. اختيار المشروع وتشكيل المجموعات في البداية."],["L11","m","عرض معلم على طلابه موقفاً واقعياً مفصلاً لمدرسة تعاني من التنمر وطلب منهم تحليله واقتراح قرار للعلاج. الطريقة:",["دراسة الحالة","العرض العملي","المحاضرة","التعليم المبرمج"],"دراسة الحالة تحليل موقف واقعي أو خيالي واتخاذ قرار. العرض العملي أداء المعلم أمام الطلاب، والمبرمج خطوات صغيرة."],["L11","","صمم المعلم لكل طالب مهام وأنشطة خاصة به بحسب توجهه وميوله. النمط:",["التعليم التفريدي","التعليم الفردي","التعليم الجمعي","التدريس المباشر"],"التفريدي يخصص المهام لكل طالب. الفردي مهام موحدة فردياً، والجمعي للصف كله."],["L11","m","وقّع المعلم مع طالب اتفاقاً مكتوباً يتعهد فيه الطالب بإنجاز مهام محددة خلال أسبوعين وفق معايير مقابل تقدير. هذا يسمى:",["عقد التعلم","الحقيبة التعليمية","الموديول","الخطة العلاجية"],"عقد التعلم اتفاق مكتوب بين المعلم والطالب على مهام ومعايير ومكافأة. الحقيبة والموديول مواد تعلم ذاتي، والخطة العلاجية إجراء للمعلم."],["L11","","برنامج تعليمي علاجي يُصمم لطالب بعينه بعد تشخيص مستواه يسمى:",["التعلم الموصوف للفرد","التعلم التعاوني","التعليم المبرمج الخطي","التدريس المصغر"],"التعلم الموصوف للفرد برنامج فردي علاجي بعد التشخيص. التعاوني جماعي، والمبرمج عام للجميع، والمصغر لتدريب المعلمين."],["L11","m","أراد معلم الكيمياء تدريب طلابه على تجربة خطرة لا يمكن إجراؤها في المختبر المدرسي. نوع البرمجية الأنسب:",["برامج المحاكاة","برامج التدريب والممارسة","الألعاب التعليمية","برامج الاستقصاء"],"المحاكاة تمثل المواقف الخطرة أو المكلفة بأمان. التدريب والممارسة لتثبيت مهارة، والألعاب للتنافس، والاستقصاء للبحث."],["L11","h","التدريس التبادلي حوار حول نص مقروء يطبق أربع استراتيجيات على الترتيب:",["التنبؤ، توليد الأسئلة، التوضيح، التلخيص","التلخيص، التنبؤ، التوضيح، الأسئلة","القراءة، الحفظ، التسميع، التقويم","العصف، التصنيف، المقارنة، الحكم"],"استراتيجيات التدريس التبادلي (بالينسار وبراون): التنبؤ ثم توليد الأسئلة ثم التوضيح ثم التلخيص، وتنمي ما وراء المعرفة."],["L11","m","يرتبط نجاح طالب في مسابقة صفية بخسارة زميله، فلا يفوز إلا واحد. بيئة التعلم هنا:",["تنافسية","تعاونية","فردية","تشاركية"],"البيئة التنافسية يرتبط فيها الفوز بخسارة الآخر. التعاونية نجاح الجميع معاً، والفردية كل طالب مستقل."],["L11","","مراحل التعلم التعاوني في المجموعة على الترتيب:",["التعرف، تحديد المهمة، الإنتاجية، الإنهاء","الإنتاجية، التعرف، الإنهاء، تحديد المهمة","تحديد المهمة، الإنهاء، التعرف، الإنتاجية","الإنهاء، الإنتاجية، تحديد المهمة، التعرف"],"تبدأ المجموعة بالتعرف ثم تحديد المهمة والأدوار ثم العمل والإنتاج ثم الإنهاء وعرض النتاج."],["L11","m","كلّف معلم الحاسب طالباً من الصف الثالث المتوسط بتدريس طلاب الصف الأول المتوسط مهارة أتقنها. نوع تدريس الأقران:",["عبر الصفوف","داخل الفصل","خارج الفصل للمنقطعين","أقران المجموعة"],"تدريس الأقران عبر الصفوف: طالب من صف أعلى يعلم طلاب صف أدنى. داخل الفصل بين زملاء الصف نفسه."],["L11","","نشاط موجه يتنافس فيه الطلاب فردياً أو جماعياً بطريقة ممتعة لتحقيق أهداف الدرس يسمى:",["الألعاب التعليمية","لعب الأدوار","المحاكاة","العصف الذهني"],"الألعاب التعليمية تنافس ممتع موجه. لعب الأدوار تقمص شخصيات، والمحاكاة تمثيل موقف واقعي، والعصف توليد أفكار."],["L11","m","كل ما يستخدمه المعلم والمتعلم من أجهزة وأدوات ومواد داخل الصف أو خارجه لإكساب خبرات محددة يسمى:",["الوسائل التعليمية","تقنيات التعليم","مصادر التعلم","المنهج"],"الوسائل التعليمية أدوات ومواد. تقنيات التعليم منظومة أشمل (إنسان وآلة وطريقة)، ومصادر التعلم كل ما يتفاعل معه المتعلم."],["L12","h","في هرم المعرفة تقع الحقائق في القاعدة والنظريات في القمة. الانتقال في التدريس من الحقائق وصولاً إلى النظريات يمثل:",["استقراءً من الجزء إلى الكل","استنباطاً من الكل إلى الجزء","انتقالاً من المجرد إلى المحسوس","تطبيقاً للقاعدة على الأمثلة"],"من الحقائق (جزئيات) إلى المفاهيم فالتعميمات فالقوانين فالنظريات (كليات) انتقال استقرائي. الاستنباط العكس."],["L12","m","«أن يكتسب الطالب حب الوطن» و«أن يذكر الطالب ثلاث مدن سعودية» يمثلان على الترتيب هدفاً:",["عاماً، وسلوكياً","سلوكياً، وعاماً","وجدانياً، ونفس‑حركياً","تربوياً، وغاية"],"الأول عام غير قابل للقياس المباشر في حصة، والثاني سلوكي بفعل قابل للملاحظة ومحتوى محدد."],["L13","m","رقّم المعلم أعضاء كل مجموعة من 1 إلى 4، وبعد المناقشة نادى رقماً عشوائياً ليجيب عن مجموعته. الاستراتيجية:",["الرؤوس المرقمة","الكرسي الساخن","حوض السمك","جيكسو"],"الرؤوس المرقمة تضمن استعداد كل عضو لأن أي رقم قد يُستدعى. الكرسي الساخن أسئلة لطالب خبير، وحوض السمك دائرتان، وجيكسو مجموعات خبرة."],["L13","","رتّب المعلم الكراسي في دائرة داخلية تناقش القضية ودائرة خارجية تراقب وتدون الملاحظات ثم تتبادلان الأدوار. الاستراتيجية:",["حوض السمك","الرؤوس المرقمة","فكر‑زاوج‑شارك","الأعواد"],"حوض السمك: مشاركون في الداخل وملاحظون في الخارج. الأعواد سحب اسم عشوائي، والرؤوس المرقمة ترقيم الأعضاء."],["L13","m","كتب الطالب في بطاقة رباعية تعريف المفهوم وخصائصه وأمثلة عليه وأمثلة لا تنتمي إليه. المنظم المستخدم:",["نموذج فراير","أشكال فن","جدول KWL","خريطة الشكل V"],"فراير منظم رباعي للمفهوم (تعريف، خصائص، أمثلة، لا أمثلة). فن للمقارنة، وKWL للمعرفة السابقة والمكتسبة."],["L13","","كتب الطالب رسالة متقمصاً دور طبيب موجهة إلى أولياء الأمور بصيغة منشور توعوي عن موضوع النظافة. استراتيجية الكتابة الإبداعية التي تحدد الدور والجمهور والصيغة والموضوع:",["RAFT (رافت)","تنال القمر","شبكة الأسئلة","التساؤل الذاتي"],"RAFT عناصرها: الدور، الجمهور، الصيغة، الموضوع. تنال القمر للفهم القرائي، وشبكة الأسئلة جمع أسئلة الطلاب."],["L13","m","استراتيجية فهم قرائي بخمس خطوات: التنبؤ، التنظيم، البحث، التلخيص، المقارنة. اسمها:",["تنال القمر","التدريس التبادلي","الخطوات الست","KWL"],"تنال القمر (أحرفها الأولى من خطواتها الخمس) وتشبه التدريس التبادلي الذي خطواته أربع (تنبؤ، أسئلة، توضيح، تلخيص)."],["L13","","نموذج بنائي اجتماعي يمر بأربعة أطوار: التمهيدي ثم التركيزي ثم التحدي ثم التطبيق. هو نموذج:",["التعليم التوليدي","التغير المفاهيمي","دورة التعلم الخماسية","التعلم للإتقان"],"التعليم التوليدي (أوزبورن وويتروك) يولّد المعنى في سياق اجتماعي بأطوار أربعة. دورة التعلم الخماسية مراحلها 5E، والتغير المفاهيمي لبوسنر."],["L13","m","لاحظ المعلم أن مفهوم الطالب الخاطئ بسيط ويمكن تعديله بإضافة معلومة، بينما مفهوم طالب آخر يحتاج إلى استبدال كامل. يسمى التغيران عند بوسنر:",["تطورياً، وثورياً","ثورياً، وتطورياً","استقبالياً، واكتشافياً","أفقياً، ورأسياً"],"التغير التطوري لتعديل بسيط، والثوري لاستبدال المفهوم كله. الاستقبالي والاكتشافي لأوزوبل، والأفقي والرأسي لانتقال الأثر."],["L13","","طالب يسأل نفسه أثناء القراءة: «ماذا أعرف عن هذا؟ ما الذي لم أفهمه؟ كيف أتابع؟». الاستراتيجية:",["التساؤل الذاتي","العصف الذهني","الكرسي الساخن","لعب الأدوار"],"التساؤل الذاتي مهارة ما وراء معرفية يراقب بها الطالب فهمه. العصف توليد أفكار جماعي."],["L13","h","رفع المعلم شرح الدرس مسجلاً على منصة ليشاهده الطلاب في الوقت الذي يناسبهم ويرسلوا أسئلتهم بالبريد. نمط التعليم:",["غير متزامن","متزامن","مباشر","تنافسي"],"اختلاف الوقت والمكان يجعل التفاعل غير متزامن. المتزامن يتطلب الحضور في الوقت نفسه."],["L13","m","استخدم المعلم المنصة الإلكترونية داعماً للحصة الحضورية برفع الواجبات والمصادر فقط دون أن تحل محل التدريس. مستوى توظيف التعلم الإلكتروني:",["مساند","مدمج","كامل عن بعد","مقلوب"],"المساند يدعم الصفي دون تغيير بنيته. المدمج يوزع التعلم بين الحضوري والإلكتروني، والكامل يستبدل الحضور، والمقلوب يقلب مهام الصف والمنزل."],["L13","","منظومة متكاملة من الإنسان والأجهزة والطرق والمواد تعمل معاً لتحقيق أهداف التعليم. هذا تعريف:",["تقنيات التعليم","الوسائل التعليمية","الكتاب المدرسي","المنهج الخفي"],"تقنيات التعليم منظومة أشمل من الوسائل (أجهزة ومواد فقط). الكتاب وعاء المحتوى، والخفي ما يُتعلم ضمنياً."],["L13","m","المعلم والمكتبة والمعمل والإنترنت والمتحف جميعها أنظمة وموارد يتفاعل معها المتعلم لاكتساب الخبرة. المصطلح الجامع:",["مصادر التعلم","الوسائل التعليمية","التقويم البديل","المنهج الرسمي"],"مصادر التعلم تشمل الموارد البشرية وغير البشرية التي يتفاعل معها المتعلم. الوسائل أدوات ومواد فقط."],["L13","m","صفحة إنترنت يستطيع عدة مستخدمين تحريرها وإضافة محتوى إليها تشاركياً كما في ويكيبيديا تسمى:",["الويكي","المدونة","البودكاست","الفيديو التفاعلي"],"الويكي تحرير جماعي. المدونة صفحة شخصية للنشر والتعليق، والبودكاست محتوى صوتي، والفيديو التفاعلي يمزج الفيديو بالتحكم."],["L13","","أنشأ المعلم صفحة شخصية ينشر فيها تأملاته وشروحه ويعلق عليها الطلاب. الأداة:",["المدونة","الويكي","قاعدة البيانات","الحوسبة السحابية"],"المدونة للنشر الشخصي والتعليق. الويكي تحرير جماعي، والسحابية تخزين وموارد عبر الإنترنت."],["L13","m","سجل المعلم شروح الدروس ملفات صوتية ليستمع إليها الطلاب في الحافلة أو المنزل. الأداة:",["البودكاست التعليمي","الفيديو التفاعلي","الواقع المعزز","الرحلة المعرفية"],"البودكاست محتوى صوتي مسجل. الفيديو التفاعلي مرئي، والواقع المعزز يضيف عناصر رقمية للواقع، والرحلة المعرفية بحث موجه في الويب."],["L13","","وسيلة تمزج بين الحاسوب والفيديو وتسمح للطالب بالتحكم والتفرع وتُعد فعالة في التعلم الفردي:",["الفيديو التفاعلي","البودكاست","الويكي","المدونة"],"الفيديو التفاعلي يسمح بالتحكم والتفرع وفق استجابة المتعلم. البودكاست صوتي، والويكي والمدونة نصيتان."],["L13","m","أراد المعلم تنظيم درجات طلابه في جدول ورسم مخطط بياني لمقارنتها. البرنامج الأنسب:",["إكسل","أكسس","باوربوينت","وورد"],"إكسل جداول وحسابات ورسوم بيانية. أكسس لقواعد البيانات العلائقية، وباوربوينت للعروض، ووورد للنصوص."],["L13","","لإنشاء قاعدة بيانات علائقية تربط سجلات الطلاب بأولياء أمورهم ودرجاتهم يُستخدم برنامج:",["أكسس","إكسل","كانفا","كاهوت"],"أكسس نظام إدارة قواعد بيانات. إكسل جداول، وكانفا تصميم، وكاهوت ألعاب تفاعلية."],["L13","m","أراد المعلم تصميم ملصق تعليمي جذاب للصف دون مهارات تصميم متقدمة، وبناء خريطة معرفية إلكترونية. الأداتان على الترتيب:",["كانفا، وبوبلت","أكسس، وإكسل","زوم، وتيمز","SPSS، وكاهوت"],"كانفا للتصميم المرئي، وبوبلت للخرائط المعرفية. أكسس وإكسل بيانات، وزوم وتيمز اجتماعات، وSPSS تحليل إحصائي."],["L13","","معايير دولية توجه توظيف التقنية في التعليم للطلاب والمعلمين والقادة تعرف باسم:",["ISTE","TPACK","SAMR","ADDIE"],"ISTE الجمعية الدولية للتقنية في التعليم ومعاييرها. TPACK إطار معرفة المعلم، وSAMR مستويات الدمج، وADDIE تصميم تعليمي."],["L13","m","استخدم المعلم أداة ذكاء اصطناعي لتوليد أسئلة تدريبية. الإجراء الصحيح قبل عرضها على الطلاب:",["مراجعة دقتها ومناسبتها للأهداف ثم استخدامها","عرضها مباشرة لأن الأداة دقيقة دائماً","رفض استخدام الأداة نهائياً","تركها للطلاب ليحكموا على صحتها"],"الذكاء الاصطناعي أداة مساعدة قد تخطئ، فيبقى التحقق من الدقة والمواءمة مسؤولية المعلم."],["L13","m","معلم يرى أن المنهج هو الكتاب المقرر وأن مهمته حفظ المعلومات واستظهارها، بينما يرى زميله أن المنهج جميع الخبرات التي تهيئها المدرسة داخلها وخارجها. المفهومان على الترتيب:",["تقليدي، وحديث","حديث، وتقليدي","خفي، ورسمي","فارغ، وحلزوني"],"المنهج التقليدي يساوي المقرر والحفظ، والحديث يشمل كل الخبرات ويراعي المتعلم. الخفي والفارغ والحلزوني مفاهيم أخرى."],["L13","","الفرق بين المقرر والكتاب المدرسي أن المقرر:",["موضوعات محددة في مادة لصف معين، والكتاب وعاء يحمل المحتوى والوسائل والأنشطة","مرادف للكتاب تماماً","أشمل من المنهج","يقتصر على الأنشطة اللاصفية"],"المقرر قائمة الموضوعات، والكتاب الوعاء المادي للمحتوى والأنشطة، والمنهج أشمل منهما."],["L13","m","رتّب المعلم موضوعات الوحدة وفق خصائص المتعلمين وحاجاتهم وميولهم لا وفق التسلسل المنطقي للمادة. تنظيم المحتوى هنا:",["سيكولوجي (نفسي)","منطقي","حلزوني","محوري"],"التنظيم السيكولوجي يبدأ من المتعلم، والمنطقي من بنية المادة (السهل للصعب). الحلزوني تكرار بعمق، والمحوري جزء مشترك واختياري."],["L13","","المدى في مصفوفة المدى والتتابع يمثل البعد:",["الأفقي (اتساع المحتوى في الصف الواحد)","الرأسي (تدرج المحتوى عبر الصفوف)","الزمني للحصة","الوجداني للأهداف"],"المدى اتساع أفقي في المستوى الواحد، والتتابع تدرج رأسي عبر السنوات."],["L13","m","تنظيم منهجي يوظف التقنية في تقديم الخبرات ويعتمد على الخطو الذاتي للمتعلم. يسمى المنهج:",["التكنولوجي","المحوري","الحلزوني","الخفي"],"المنهج التكنولوجي قائم على التقنية والخطو الذاتي. المحوري مشترك واختياري، والحلزوني لبرونر، والخفي ضمني."],["L14","m","أشرك المعلم طلابه في وضع القواعد ومراقبة التزامهم بها بأنفسهم حتى قلّ تدخله تدريجياً. هذا الأسلوب:",["الإدارة الذاتية للصف","النمط التسلطي","النمط الفوضوي","العقاب الجماعي"],"الإدارة الذاتية تنقل الضبط من المعلم إلى الطلاب (انضباط ذاتي). التسلطي يفرض، والفوضوي يترك، والجماعي يعاقب الكل."],["L14","","قدّم المعلم لطالب منطوٍ تعليمات وتدريبات ليعبّر عن رأيه ويطلب حقوقه بثقة دون عدوان. الأسلوب:",["السلوك التوكيدي","الإغراق","الكف المتبادل","الإشباع"],"السلوك التوكيدي يبني ثقة الطالب بنفسه في التعبير. الإغراق مواجهة المخاوف دفعة واحدة، والكف المتبادل إحلال استجابة محل أخرى."],["L14","m","طالب يعض أظافره عند التوتر، فدرّبه المعلم على الضغط على كرة إسفنجية عند الشعور بالتوتر بديلاً عن العض. الأسلوب:",["الكف المتبادل","الإشباع","التلقين","ضبط المثير"],"الكف المتبادل إحلال استجابة مقبولة لا تجتمع مع غير المرغوبة. الإشباع تقديم المثير بكثرة، والتلقين تلميح، وضبط المثير تعديل البيئة."],["L14","","أعطى المعلم طالباً مولعاً بالتحدث في غير وقته فرصة طويلة للحديث حتى ملّ وفقد السلوك جاذبيته. الأسلوب:",["الإشباع","الانطفاء","الإقصاء","التصحيح الزائد"],"الإشباع تقديم المثير أو السماح بالسلوك بكثرة حتى يفقد قيمته. الانطفاء تجاهل، والإقصاء عزل، والتصحيح الزائد إصلاح الضرر وزيادة."],["L14","m","استعان المعلم بقصص واقعية وأنشطة خدمية في المجتمع لتعديل سلوك طالب لا يقدر الممتلكات العامة. الأسلوب:",["الإرشاد بالواقع","الغمر","تكلفة الاستجابة","السحب التدريجي"],"الإرشاد بالواقع يوظف المواقف والأنشطة الواقعية. الغمر مواجهة الخوف، وتكلفة الاستجابة سحب معزز، والسحب التدريجي تلاشي المساعدة."],["L14","","طالب يمارس حمية غذائية ويقيّد نفسه عن الحلويات رغم رغبته. هذا مثال على:",["ضبط الذات","الإقصاء","العقاب السالب","الانطفاء"],"ضبط الذات مجاهدة النفس وتقييدها ذاتياً. الإقصاء والعقاب السالب إجراءان خارجيان من المعلم."],["L14","m","بعد أن أتقن بعض الطلاب الهدف، كلفهم المعلم بنشاط إضافي أعمق لتثبيت التعلم، وكلّف غير المتقنين بتدريبات أساسية. النشاطان على الترتيب:",["تعزيزي، وعلاجي","علاجي، وتعزيزي","إثرائي، وتعزيزي","صفي، ولاصفي"],"النشاط التعزيزي لمن أتقن لتثبيت التعلم، والعلاجي لمن لم يتقن. الإثرائي للموهوبين يتجاوز المنهج."],["L14","h","اقترب المعلم من طالب شارد وخفّض نبرة صوته ونظر إليه مباشرة دون أن يتكلم فانتبه. نوع الاتصال:",["غير لفظي","لفظي كتابي","لفظي شفهي","أحادي الاتجاه"],"الاقتراب (اللغة التقاربية) والنبرة (الموازية) والنظر (لغة الجسد) كلها اتصال غير لفظي. اللفظي كلمات منطوقة أو مكتوبة."],["L14","m","استخدام المعلم المسافة والقرب المكاني من الطالب لإيصال رسالة يسمى في الاتصال غير اللفظي:",["اللغة التقاربية","اللغة الموازية","لغة الجسد","الاتصال اللفظي"],"التقاربية تخص المسافة المكانية، والموازية نبرة الصوت وسرعته، ولغة الجسد التعبيرات والإيماءات."],["L14","","لاحظ المعلم أن الطلاب يسمعونه لكن أذهانهم شاردة فلا يستوعبون. هذا يمثل من معوقات الاتصال:",["شرود الذهن لدى المستقبل","ضعف القناة","غياب المرسل","انعدام التغذية الراجعة"],"شرود الذهن معوق يخص المستقبل. القناة والمرسل والتغذية الراجعة عناصر أخرى في الاتصال."],["L14","m","أعاد المعلم أوراق التقويم بعد تلوين ما حقق معايير النجاح باللون الوردي وما يحتاج تحسيناً بالأصفر. استراتيجية التغذية الراجعة:",["التخطيط باللونين","نجمتان وأمنية","الكرسي الساخن","بطاقة الخروج"],"التخطيط باللونين تغذية راجعة بصرية بلونين. نجمتان وأمنية نقطتا قوة ونقطة تحسين لفظياً، وبطاقة الخروج أداة تقويم تكويني."],["L15","h","أي الآتي لا يُعد من الأسئلة الموضوعية؟",["أسئلة الإجابة القصيرة (المقالية المقيدة)","الاختيار من متعدد","الصواب والخطأ","المطابقة"],"الإجابة القصيرة والمقالي المقيد يتأثران بذاتية المصحح نسبياً فلا يُعدان موضوعيين. الاختيار من متعدد والصواب والخطأ والمطابقة والإكمال موضوعية."],["L15","m","قارن المعلم درجة الطالب في اختبار نهاية الوحدة بدرجته في الاختبار القبلي لنفس الطالب ليحكم على تقدمه. نوع التقويم بالمرجع:",["ذاتي المرجع","معياري المرجع","محكي المرجع","ختامي"],"ذاتي المرجع يقارن الطالب بنفسه عبر الزمن. معياري بالأقران، ومحكي بمحك إتقان."],["L15","","أجرى المعلم اختباراً بعد شهرين من انتهاء الوحدة واختبارها النهائي ليتأكد من بقاء أثر التعلم. نوع التقويم:",["تتبعي","تشخيصي","تكويني","قبلي"],"التتبعي يُجرى بعد فترة من الختامي لقياس الاحتفاظ. التشخيصي والقبلي قبل التعلم، والتكويني أثناءه."],["L15","m","تقويم تجريه الوزارة والهيئة على المدرسة من خارجها، وتقويم تجريه المدرسة لنفسها. يسميان على الترتيب:",["خارجياً، وداخلياً","داخلياً، وخارجياً","معيارياً، ومحكياً","ختامياً، وتكوينياً"],"التصنيف حسب الجهة المقوّمة: خارجي من خارج المدرسة، وداخلي من داخلها، ومتعدد الأطراف يجمعهما."],["L15","m","أراد المعلم قياس اتجاهات طلابه نحو مادة الفيزياء بعبارات يختار الطالب أمام كل منها درجة موافقته من «أوافق بشدة» إلى «لا أوافق بشدة». الأداة:",["مقياس ليكرت للاتجاهات","قائمة الشطب","الاختبار التحصيلي","السجل القصصي"],"ليكرت مقياس تقرير ذاتي خماسي للاتجاهات (نواتج وجدانية). قائمة الشطب نعم/لا للمهارات، والتحصيلي معرفي."],["L15","","لقياس الميول المهنية للطلاب يستخدم المرشد مقاييس مثل:",["سترونج وكودر","ستانفورد بينيه ووكسلر","TIMSS وPISA","ليكرت وثيرستون للاتجاهات"],"سترونج وكودر مقياسا ميول مهنية. ستانفورد ووكسلر للذكاء، وTIMSS وPISA اختبارات دولية."],["L15","m","اختبار يناسب الصفوف الأولية ومادة القرآن الكريم وينعدم فيه الغش، لكنه يستغرق وقتاً ويتأثر بذاتية المعلم. هو الاختبار:",["الشفوي","الموضوعي","المقالي","الأدائي"],"الاختبار الشفوي يكشف النطق والتعبير ولا مجال فيه للغش، وعيوبه الوقت والذاتية. الموضوعي سريع التصحيح، والمقالي كتابي."],["L15","","من مواصفات الاختبار الجيد أن يغطي جوانب المحتوى والأهداف كلها بأوزانها. هذه الخاصية:",["الشمول","الموضوعية","الثبات","التمييز"],"الشمول تغطية المحتوى وفق جدول المواصفات. الموضوعية استقلال عن المصحح، والثبات استقرار، والتمييز كشف الفروق."],["L15","m","من أهم ما يضمن العدالة في التقويم البديل:",["إعلان المحكات مسبقاً وإتاحة فرص متساوية","الاعتماد على اختبار واحد","إخفاء معايير التصحيح عن الطلاب","تقويم الطلاب بأدوات مختلفة دون معيار"],"العدالة تتطلب محكات معلنة وفرصاً متكافئة وتعدد الأدوات بمعيار واحد."],["L16","h","في فصل عدد طلابه 25 أجاب 14 طالباً عن فقرة إجابة صحيحة. معامل صعوبة الفقرة:",["0.56","0.44","0.25","0.14"],"الصعوبة (السهولة) = 14 ÷ 25 = 0.56 فقرة متوسطة. 0.44 نسبة المخطئين."],["L16","m","سؤال مقالي درجته 10، أجاب عنه 20 طالباً وكان مجموع درجاتهم فيه 120. معامل صعوبة السؤال:",["0.60","0.12","6.0","0.83"],"في المقالي: مجموع الدرجات ÷ (عدد الطلاب × درجة السؤال) = 120 ÷ (20 × 10) = 0.60."],["L16","","الصدق الذي يبحث في كفاية عدد الأسئلة لتمثيل المادة الدراسية يسمى الصدق:",["العيني","التنبؤي","الظاهري","التلازمي"],"الصدق العيني وجه من صدق المحتوى يخص كفاية العينة من الفقرات. التنبؤي والتلازمي للمحك، والظاهري شكل الاختبار."],["L16","m","أي العوامل الآتية يرفع معامل ثبات الاختبار؟",["زيادة عدد الفقرات المتجانسة","زيادة التخمين","غموض صياغة الأسئلة","اضطراب الطلاب أثناء التطبيق"],"طول الاختبار بفقرات متجانسة متوسطة الصعوبة يزيد الثبات، أما التخمين والغموض والاضطراب فتخفضه."],["L16","m","منحنى درجات قمته حادة لأن معظم الدرجات متقاربة حول المتوسط. يوصف هذا المنحنى بأنه:",["مدبب (التفرطح موجب)","مفرطح","ملتوٍ موجباً","ملتوٍ سالباً"],"التفرطح يصف شكل القمة: مدبب عند تقارب الدرجات ومفرطح عند تشتتها. الالتواء يصف انحراف الذيل لا القمة."],["L16","","من خصائص التغذية الراجعة الفعالة أن تكون:",["فورية ومستمرة وشاملة لجوانب الأداء","عامة ومؤجلة","مركزة على شخصية الطالب","مقتصرة على الدرجة الرقمية"],"التغذية الراجعة الجيدة فورية ودائمة وشاملة ومحددة وتخص المهمة لا الشخص."],["L16","m","العلاقة بين الصدق والثبات أن:",["الاختبار الصادق ثابت بالضرورة، والثابت قد لا يكون صادقاً","الثابت صادق بالضرورة","لا علاقة بينهما","الثبات أشمل من الصدق"],"الصدق يتضمن الثبات؛ فمن يقيس ما وُضع له يعطي نتائج مستقرة، أما الاتساق فلا يضمن قياس الهدف."],["L11","m","معلم يحتكر الحديث طوال الحصة ويملي المعلومات والطلاب متلقون صامتون. يمثل دور المعلم:",["التقليدي (الملقن)","الميسّر","المفوّض","المرشد"],"المعلم التقليدي ناقل للمعلومة والطالب سلبي. الميسر يدعم عند الحاجة، والمفوض يفوض المسؤولية، والمرشد يوجه."],["L11","","من وسائل التعلم الذاتي التي يتعلم بها الطالب دون تدخل مباشر من المعلم:",["التعليم المبرمج والحقائب التعليمية","المحاضرة والإلقاء","العرض العملي","المناقشة الجماعية"],"التعليم المبرمج والحقائب والموديولات والحاسوب وسائل تعلم ذاتي. المحاضرة والعرض والمناقشة طرق يقودها المعلم."],["L07","m","من العوامل المؤثرة في النمو: الوراثة والبيئة والنضج والتعلم وإفرازات:",["الغدد","الأقران","المعلم","التقنية"],"الغدد الصماء (كالنخامية والدرقية) من العوامل البيولوجية المؤثرة في النمو الجسمي والانفعالي."],["L07","","يرى برونر أن تسريع تعليم الطفل مفهوماً معقداً ممكن بشرط:",["أن يكون مستعداً من الناحية الفسيولوجية ويُقدَّم بتمثيل يناسبه","أن يتجاوز الطفل سن الحادية عشرة","أن يتعلمه بالتلقين والتكرار","أن يُقدَّم رمزياً دائماً"],"برونر يرى إمكان تعليم أي مفهوم لأي طفل بصورة أمينة تناسب تمثيله (عملي، أيقوني، رمزي) إذا كان مستعداً، بخلاف بياجيه الذي يربط التعلم بالمرحلة."],["L11","m","يرى معلم أن مهمته ضبط سلوك الطلاب وتعديله بالتعزيز والتعليم المبرمج، ويرى زميله أن التدريس يبدأ من مشاعر الطالب وإدراكاته الذاتية. المدخلان على الترتيب:",["السلوكي، والإنساني (الشخصي)","المعرفي، والاجتماعي","الاجتماعي، والسلوكي","الإنساني، والمعرفي"],"السلوكي ضبط وتعزيز، والإنساني أو الشخصي يركز على الإدراكات الفردية والوجدان. المعرفي يهتم بالبنية المعرفية والاكتشاف، والاجتماعي بالتفاعل الجماعي."],["L11","","في المدخل المعرفي، المدخل الذي يهتم بمفاهيم العلم الكبرى وطرق البحث فيه لا بمحتوى الكتاب المدرسي هو مدخل:",["بنية العلم","المادة الدراسية","الضبط","النشاط"],"مدخل بنية العلم يركز على المفاهيم الكبرى وطرائق العلماء، بينما مدخل المادة الدراسية يهتم بمحتوى الكتاب. الضبط سلوكي والنشاط لديوي."],["L11","m","تصنف طرق التدريس وفق الاحتكاك بين المعلم والمتعلم إلى:",["مباشرة (وجهاً لوجه) وغير مباشرة","عامة وخاصة","جمعية وفردية","استقرائية واستنباطية"],"وفق الاحتكاك: مباشرة وغير مباشرة. وفق حاجة التخصص: عامة وخاصة. وفق عدد المتعلمين: جمعية وفردية."],["L11","","من رواد التعلم التعاوني الذين وضعوا أسسه النظرية:",["ديوي وباركر ودويتش","سكنر وبافلوف وواطسون","بياجيه وكوهلر","أوزوبل وبرونر"],"ديوي وباركر ودويتش ثم جونسون وجونسون رواد التعلم التعاوني. البدائل الأخرى رواد السلوكية والمعرفية."],["L11","m","برنامج تعليمي ذاتي متكامل يجمع بين الحقائب التعليمية ومبدأ التعلم للإتقان ويتضمن اختبارات قبلية وبعدية. يسمى:",["المجمعات التعليمية","التدريس المصغر","لعب الأدوار","العصف الذهني"],"المجمعات التعليمية نظام تعلم ذاتي متكامل. التدريس المصغر لتدريب المعلمين، ولعب الأدوار والعصف استراتيجيات جماعية."],["L11","","من أهداف التعليم الفردي:",["مراعاة الفروق الفردية والتعلم للإتقان وتنمية الاستقلالية","توحيد سرعة التعلم لجميع الطلاب","زيادة التنافس بين الطلاب","تقليل دور الطالب في تعلمه"],"التعليم الفردي يراعي الفروق ويسعى للإتقان والاستقلالية والإبداع. التوحيد والتنافس يناقضانه."],["L13","m","يسمح المعلم للطالب بالانتقال بين المجموعات بحسب المهمة واستعداده، فيكون عضواً في مجموعات مختلفة خلال الأسبوع. الاستراتيجية:",["المجموعات المرنة","التجميع الثابت حسب الذكاء","جيكسو","الرؤوس المرقمة"],"المجموعات المرنة تتغير بحسب المهمة والاستعداد بدل التصنيف الثابت، وهي من أدوات التعليم المتمايز."],["L13","","نموذج تدريس يبدأ بتمهيد ثم اكتشاف ثنائي ثم أنشطة تعاونية في مجموعات ثم إتاحة الفرص وينتهي بتقويم ذاتي فردي. هو نموذج:",["التعلم البنائي الاجتماعي","فكر‑زاوج‑شارك","التعلم للإتقان","التعليم المبرمج"],"نموذج التعلم البنائي الاجتماعي يبدأ ثنائياً وينتهي فردياً، بخلاف فكر‑زاوج‑شارك الذي يبدأ فردياً ثم ثنائياً ثم جماعياً."],["L15","m","من وظائف التقويم التربوي:",["تشخيص الضعف وتوجيه التعلم وتطوير المناهج ودعم القرارات","تصنيف الطلاب نهائياً دون علاج","الاكتفاء برصد الدرجات","معاقبة المقصرين"],"التقويم يشخص ويوجه ويحكم ويطور ويدعم القرارات. الرصد وحده قياس، والتصنيف النهائي والعقاب يناقضان غرضه."],["L15","","أدوات يصف فيها الطالب بنفسه اتجاهاته وميوله مثل مقاييس ليكرت ومقاييس الميول تسمى:",["التقارير الذاتية","الاختبارات التحصيلية","اختبارات الأداء","قوائم الشطب"],"التقارير الذاتية تقيس النواتج الوجدانية بإجابة الطالب عن نفسه. التحصيلية معرفية، والأداء مهارية، وقوائم الشطب ملاحظة المعلم."],["L15","m","أي مما يأتي يمثل أساساً من أسس التقويم السليم؟",["أن يُبنى على أهداف واضحة ويكون مستمراً وشاملاً","أن يقتصر على اختبار نهائي واحد","أن يُسند إلى المشرف فقط","أن يركز على الحفظ دون المهارات"],"أسس التقويم: وضوح الأهداف، الاستمرار، الشمول، التعاون، العلمية. الاقتصار على اختبار واحد يخالف الاستمرار والشمول."],["L07","","دراسة نمو المفاهيم الأساسية عند الأطفال مثل مفهوم الزمن والمكان والعدد ارتبطت باسم:",["بياجيه","ثورندايك","باندورا","سكنر"],"بياجيه رائد نظرية النمو المعرفي ودرس كيف يبني الطفل مفاهيم العدد والزمن والمكان والسببية. الآخرون من رواد نظريات التعلم السلوكية والاجتماعية."],["L07","m","أعطى معلم أطفال الروضة كرتين من الصلصال متساويتين ثم بسط إحداهما، فقال الأطفال إن المبسوطة «أكثر». يدل ذلك على أن الأطفال:",["لم يدركوا مفهوم الاحتفاظ بعد","يفتقرون إلى الانتباه","في مرحلة العمليات المحسوسة","يعانون صعوبة في الإدراك البصري"],"الحكم على الكمية بالشكل الظاهري يعني غياب الاحتفاظ، وهو سمة ما قبل العمليات. لو كانوا في المحسوسة لأدركوا أن الكمية ثابتة. ليست مشكلة انتباه أو إدراك بصري."],["L07","m","لاحظ معلم أن طفلاً في الصف الأول يتحدث عن الشمس بأنها «تغضب وتختبئ خلف الغيوم». هذا مظهر لـ:",["الإحيائية في مرحلة ما قبل العمليات","اضطراب في التفكير يحتاج إحالة","خيال إبداعي مرتفع يستحق الإثراء","التفكير الافتراضي المبكر"],"إضفاء الحياة والمشاعر على الجمادات هو الإحيائية، وهي طبيعية في ما قبل العمليات. ليست اضطراباً ولا دليلاً على موهبة، والتفكير الافتراضي من المرحلة المجردة."],["L07","","الطفل الذي يُخفي المعلم لعبته تحت قطعة قماش فيبحث عنها هناك قد أدرك مفهوم:",["دوام الشيء","الاحتفاظ","المعكوسية","التمركز حول الذات"],"البحث عن الشيء المخفي يعني إدراك أنه موجود رغم غيابه عن البصر؛ وهذا دوام الشيء، إنجاز نهاية الحس-حركية. الاحتفاظ والمعكوسية يأتيان في المحسوسة."],["L07","","أثناء النقاش في الصف الثالث الابتدائي طلب المعلم من الطلاب تصور «ماذا لو كانت الجاذبية نصف قيمتها الحالية؟» فعجز معظمهم عن الإجابة. التفسير الأقرب:",["المهمة تتطلب تفكيراً افتراضياً لا يتوفر في مرحلة العمليات المحسوسة","الطلاب يفتقرون إلى الدافعية","المعلم لم يستخدم التعزيز الكافي","الطلاب لم يحفظوا قانون الجاذبية"],"التفكير في الافتراضات الخيالية (ماذا لو) من سمات العمليات المجردة، وطلاب الثالث الابتدائي في المحسوسة. ليست مشكلة دافعية أو حفظ أو تعزيز."],["L07","m","طلبت معلمة الصف الأول من الطلاب إخبارها بما تراه زميلتهم الجالسة في الجهة المقابلة من المجسم، فوصفوا ما يرونه هم. هذا يعكس:",["التمركز حول الذات","ضعف الذاكرة قصيرة المدى","عدم فهم التعليمات","ضعف الإدراك البصري"],"العجز عن تبني منظور الآخر هو التمركز حول الذات (تجربة الجبال الثلاثة لبياجيه)، وهو سمة ما قبل العمليات لا عيب في الذاكرة أو الفهم."],["L07","m","يفضّل معلم العلوم في الصف الخامس أن يبدأ كل مفهوم بتجربة يمسك فيها الطلاب الأدوات بأيديهم قبل أن يشرح القاعدة. هذا الإجراء يراعي:",["أن طلابه في مرحلة العمليات المحسوسة","أن طلابه في مرحلة العمليات المجردة","أزمة الهوية لدى طلابه","مرحلة الكمون عند فرويد"],"طالب الخامس الابتدائي (10–11 سنة) في مرحلة المحسوسات، فالتجربة الملموسة قبل القاعدة أنسب. الكمون تفسير فرويدي لا يتصل باختيار الطريقة."],["L07","m","طالب في الصف الرابع يُحبط بسرعة ويقول «أنا لا أستطيع» كلما أخطأ. وفق إريكسون، الإجراء الأنسب للمعلم:",["تكليفه بمهام متدرجة يمكنه إنجازها والاعتراف بإنجازه","إعفاؤه من المهام الصعبة حتى يكبر","مقارنته بزميل متفوق ليتحفز","توجيهه إلى المرشد الطلابي فوراً"],"أزمة الابتدائية الاجتهاد مقابل الدونية، ويُحل القطب الإيجابي بخبرات إنجاز وتقدير. الإعفاء يرسخ الدونية، والمقارنة تزيدها، والإحالة سابقة لأوانها."],["L07","","يرفض طالب في الصف الثاني المتوسط نصائح معلمه ويجادل في كل توجيه ويحرص على موافقة أقرانه. التفسير الأقرب لسلوكه:",["سلوك طبيعي لمرحلة البحث عن الهوية والاستقلال","اضطراب سلوكي يستدعي الإحالة","ضعف في الانتباه","نقص في مطالب نمو الطفولة المتوسطة"],"المجادلة والاستقلال والتأثر بالأقران من خصائص المراهقة المبكرة (أزمة الهوية). التعامل معه بالاحتواء والحوار لا الإحالة."],["L07","m","أي الإجراءات أنسب لمعلم الصف الأول الابتدائي لمراعاة قصر مدة الانتباه لدى طلابه؟",["تقسيم الحصة إلى أنشطة قصيرة متنوعة تتخللها حركة","مطالبتهم بالجلوس الهادئ طوال الحصة لتعويدهم","إطالة الشرح مع رفع الصوت","تأجيل الأنشطة إلى نهاية الحصة"],"الطفل في الطفولة المتوسطة انتباهه قصير وحاجته للحركة كبيرة، فالتنويع والأنشطة القصيرة أنسب. الجلوس الطويل والشرح المطوّل يناقضان خصائص المرحلة."],["L07","m","يحرص معلم الثانوية على ربط دروسه بالتخصصات الجامعية والمهن المستقبلية وإعطاء طلابه أدواراً قيادية. هذا الإجراء يراعي من خصائص طلابه:",["اهتمام المراهق بالمستقبل والهوية المهنية وحاجته إلى الاستقلال","حاجتهم إلى التعلم بالمحسوسات","سن الجماعة وروح العمل الجماعي","التمركز حول الذات"],"اختيار المهنة والاستعداد لها من مطالب نمو المراهقة (هافجهرست) وتكوين الهوية (إريكسون). المحسوسات للابتدائية، وسن الجماعة للطفولة المتأخرة."],["L07","m","أراد معلم أن يفهم كيف يبرر طلابه أحكامهم على موقف صعب فعرض عليهم قصة فيها تعارض بين إنقاذ حياة وخرق قانون. هذا الأسلوب يرتبط بنظرية:",["كولبرج في النمو الأخلاقي","بياجيه في النمو المعرفي","إريكسون في النمو النفسي الاجتماعي","فرويد في النمو النفسي الجنسي"],"المعضلات الأخلاقية (قصة هاينز) هي أداة كولبرج لتحديد مرحلة التفكير الأخلاقي من خلال التبرير لا الاختيار. بياجيه يستخدم مهام الاحتفاظ، وإريكسون الأزمات."],["L07","","يقول طالب: «أنا لا أغش في الاختبار لأن المعلم سيعاقبني إذا رآني». وفق كولبرج، هذا الطالب في مرحلة:",["الطاعة وتجنب العقاب (ما قبل التقليدي)","القانون والنظام (التقليدي)","العقد الاجتماعي (ما بعد التقليدي)","الولد الطيب (التقليدي)"],"ربط الصواب بتجنب العقاب هو المرحلة الأولى من المستوى ما قبل التقليدي. الالتزام بالقانون لذاته مرحلة 4، وإرضاء الآخرين مرحلة 3."],["L07","m","يلتزم طالب بنظام المدرسة ويقول: «لو خالف الجميع الأنظمة لعمّت الفوضى». وفق كولبرج، تبريره من مرحلة:",["القانون والنظام","الطاعة وتجنب العقاب","المنفعة المتبادلة","المبادئ الأخلاقية العالمية"],"الحفاظ على النظام الاجتماعي والقانون لذاته هو المرحلة الرابعة (المستوى التقليدي). المبادئ العالمية تتجاوز القانون إلى العدل والكرامة."],["L07","","يحكم الطالب في المرحلة الثالثة عند كولبرج على السلوك بأنه صحيح عندما:",["يرضي الآخرين ويحظى بموافقتهم","يجنّبه العقاب","يحقق له منفعة مقابل منفعة","يتفق مع مبادئ العدل العامة"],"المرحلة الثالثة «الولد الطيب»: الصواب ما يرضي المحيطين ويكسب موافقتهم. تجنب العقاب مرحلة 1، والمنفعة مرحلة 2، ومبادئ العدل مرحلة 6."],["L07","","المرحلة التي يميل فيها الطفل، وفق فرويد، إلى الهدوء النسبي للدوافع والانشغال بالتعلم والأقران، وتوافق سن المدرسة الابتدائية، هي:",["الكمون","الفمية","القضيبية","التناسلية"],"مرحلة الكمون (6–12) فيها تهدأ الدوافع ويتجه الطفل إلى التحصيل والصداقات. الفمية للرضاعة، والقضيبية 3–6، والتناسلية للمراهقة."],["L07","","المكوّن الذي يمثل الضمير والمثل العليا في بناء الشخصية عند فرويد هو:",["الأنا الأعلى","الهو","الأنا","الليبيدو"],"الأنا الأعلى يحمل القيم والضمير المكتسبة من الوالدين. الهو مبدأ اللذة، والأنا مبدأ الواقع يوازن بينهما."],["L07","","من مطالب النمو في مرحلة الطفولة المتوسطة عند هافجهرست:",["تعلم القراءة والكتابة والحساب والمهارات الجسمية للألعاب","اختيار المهنة والاستعداد لها","الاستقلال الانفعالي عن الوالدين","تقبل التغيرات الجسمية للبلوغ"],"القراءة والكتابة والحساب ومهارات اللعب مطالب الطفولة المتوسطة. اختيار المهنة والاستقلال الانفعالي وتقبل الجسم من مطالب المراهقة."],["L07","","النمو يسير من الرأس إلى القدمين، فيتحكم الطفل في رأسه ورقبته قبل ساقيه. يُسمى هذا الاتجاه:",["الرأسي–الذيلي","المركزي–الطرفي","من العام إلى الخاص","من الخاص إلى العام"],"الرأسي–الذيلي يصف تقدم النمو من الرأس إلى الأسفل. المركزي–الطرفي من الجذع إلى الأطراف، ومن العام إلى الخاص يصف الحركات الكلية قبل الدقيقة."],["L07","m","يقبض الرضيع على اللعبة بكفه كاملة قبل أن يصبح قادراً على التقاطها بإصبعين. هذا مثال على مبدأ:",["النمو يسير من العام إلى الخاص","النمو يسير بمعدل ثابت","النمو مستقل عن النضج","الفروق الفردية في النمو"],"القبض الكلي ثم الدقيق يجسد مبدأ من العام (الحركات الكلية) إلى الخاص (الحركات الدقيقة). النمو لا يسير بمعدل ثابت ولا يستقل عن النضج."],["L07","m","حاولت معلمة روضة تدريب أطفال في الثالثة على الكتابة بين السطور فلم تنجح رغم التكرار. السبب الأقرب:",["عدم اكتمال النضج العضلي الدقيق اللازم للمهارة","ضعف دافعية الأطفال","قلة التعزيز المقدم","صعوبات تعلم لدى الأطفال"],"المهارة تحتاج نضجاً في العضلات الدقيقة والتآزر لا يكتمل في هذا العمر؛ التدريب قبل النضج لا يفيد. ليست مشكلة دافعية أو تعزيز، ولا يُشخص الأطفال بصعوبات تعلم في هذه السن."],["L07","","التغير الداخلي البيولوجي الذي يحدث تلقائياً دون تدريب ويحدد استعداد الطفل للتعلم يُسمى:",["النضج","التعلم","الانتقال","التكيف"],"النضج تغير داخلي لا يحتاج خبرة، بخلاف التعلم الناتج عن الخبرة والتدريب. التكيف مصطلح بياجيه للتمثل والمواءمة."],["L07","","جميع ما يلي من مبادئ النمو ما عدا:",["يسير بمعدل واحد ثابت في جميع المراحل","يسير من العام إلى الخاص","يتأثر بتفاعل الوراثة والبيئة","مظاهره متكاملة يؤثر بعضها في بعض"],"النمو مستمر لكن بمعدلات متفاوتة: سريع في الطفولة المبكرة والمراهقة وبطيء في الطفولة المتوسطة. الباقي مبادئ صحيحة."],["L07","","جميع ما يلي من خصائص مرحلة ما قبل العمليات عند بياجيه ما عدا:",["إدراك الاحتفاظ والمعكوسية","التمركز حول الذات","الإحيائية","ظهور اللغة واللعب الرمزي"],"الاحتفاظ والمعكوسية إنجازا مرحلة العمليات المحسوسة لا ما قبلها. التمركز والإحيائية والرمز من سمات ما قبل العمليات."],["L07","","أي مما يلي ليس من أزمات النمو الثماني عند إريكسون؟",["الاحتفاظ مقابل التمركز","الثقة مقابل عدم الثقة","المبادرة مقابل الذنب","الإنتاجية مقابل الركود"],"الاحتفاظ والتمركز مفهومان عند بياجيه لا أزمتان عند إريكسون. الثلاثة الأخرى من أزماته الثماني."],["L07","","أي مما يلي لا يُعد من خصائص المراهقة؟",["بطء النمو الجسمي واستقراره","التقلب الانفعالي","الاهتمام بالمظهر وصورة الذات","الميل إلى المثالية ونقد الكبار"],"المراهقة تتميز بطفرة نمو جسمي سريعة لا ببطئه. التقلب الانفعالي والاهتمام بالمظهر والمثالية من سماتها المعروفة."],["L07","","يعتمد طالب في الصف الثاني الثانوي على وضع فروض واختبارها عقلياً قبل حل مسألة فيزياء. هذا السلوك يُصنّف ضمن:",["التفكير الافتراضي الاستنباطي في مرحلة العمليات المجردة","التفكير الحسي الحركي","التفكير ما قبل الإجرائي","التفكير المتمركز حول الذات"],"وضع الفروض واختبارها عقلياً جوهر العمليات المجردة. الحسي الحركي للرضيع، وما قبل الإجرائي للطفولة المبكرة."],["L07","","قيام الطفل في السنة الأولى من عمره برمي الأشياء وتذوقها وضربها ببعضها يُصنّف على أنه:",["استكشاف للبيئة عبر الحواس والحركة في المرحلة الحس-حركية","سلوك عدواني يحتاج تعديلاً","تعلم بالملاحظة","مظهر لفرط الحركة"],"الرضيع يعرف العالم بالحواس والأفعال الحركية؛ الرمي والتذوق استكشاف طبيعي. ليس عدواناً ولا فرط حركة ولا تعلماً بالملاحظة."],["L07","m","معلم في المرحلة المتوسطة لاحظ أن طلابه يميلون إلى مقارنة أنفسهم بأقرانهم والتأثر بأحكامهم. الإجراء الأنسب لتوظيف هذه الخاصية:",["استخدام التعلم التعاوني والأقران نماذج إيجابية","منع الحديث بين الطلاب داخل الصف","المقارنة العلنية بين درجات الطلاب لتحفيزهم","تجاهل تأثير الأقران لأنه مؤقت"],"تأثير الأقران في المراهقة قوي، فتوظيفه بالتعاون والنمذجة الإيجابية يخدم التعلم. المقارنة العلنية تجرح وتُحبط، والمنع غير واقعي."],["L07","","الفروق بين الجنسين في موعد البلوغ تتمثل في أن:",["البنات يسبقن الأولاد بنحو سنة إلى سنتين","الأولاد يسبقون البنات بنحو سنتين","الجنسين يبلغان في السن نفسها","لا علاقة للجنس بموعد البلوغ"],"تبدأ طفرة البلوغ عند البنات أبكر من الأولاد بنحو سنة إلى سنتين، وهذا يفسر تفاوت الأحجام في الصفوف العليا من الابتدائية."],["L07","m","يصنّف طفل كل الحيوانات ذات الأربع أرجل على أنها «قطط». عندما يفرّق لاحقاً بين القط والكلب ويكوّن مفهومين، يكون قد قام بعملية:",["المواءمة","التمثل","الاحتفاظ","التعميم"],"تعديل المخطط القائم وإنشاء مفهوم جديد هو المواءمة. تسمية الكلب قطاً كانت تمثلاً (إدخال الجديد في مخطط قائم). التعميم مصطلح سلوكي."],["L07","m","يقول طالب في الصف السادس «أعمل الواجب لأن المعلم يثق بي ولا أريد أن أخيب ظنه». هذا التبرير يُصنّف وفق كولبرج ضمن المستوى:",["التقليدي","ما قبل التقليدي","ما بعد التقليدي","الأخلاق الذاتية"],"إرضاء الآخرين والحفاظ على صورة الولد الطيب هو المستوى التقليدي (المرحلة 3). ما قبل التقليدي يرتبط بالعقاب والمنفعة، وما بعده بالمبادئ."],["L07","","المرحلة التي تُعد فيها اللغة والرموز واللعب الإيهامي من أهم إنجازاتها، ويغيب فيها إدراك الاحتفاظ، هي:",["ما قبل العمليات","الحس-حركية","العمليات المحسوسة","العمليات المجردة"],"ظهور الوظيفة الرمزية (اللغة واللعب الإيهامي) مع غياب الاحتفاظ سمة ما قبل العمليات (2–7)."],["L07","","تريد معلمة أن تختار أسلوباً لتعليم مفهوم الكسور لطلاب الصف الثالث. الأنسب وفق خصائص مرحلتهم:",["تقسيم تفاحة أو قطع ورقية وتناولها بأيديهم","شرح تعريف الكسر لفظياً ثم حل تمارين مجردة","عرض قاعدة عامة واستنباط الأمثلة منها","طلب تخيّل الكسر ذهنياً دون أدوات"],"طالب الثالث في المحسوسات، فالتعامل اليدوي مع المواد (التمثيل العملي عند برونر) هو الأنسب. الشرح اللفظي المجرد والاستنباط من قاعدة يناسبان مراحل أعلى."],["L07","","العوامل المؤثرة في النمو المعرفي عند بياجيه هي النضج والخبرة والتفاعل الاجتماعي و:",["الموازنة (التوازن العقلي)","التعزيز","النمذجة","الاستبصار"],"الموازنة هي العامل الرابع الذي ينظم التمثل والمواءمة عند بياجيه. التعزيز سلوكي، والنمذجة لباندورا، والاستبصار للجشطلت."],["L07","m","لاحظ معلم أن طالباً في الصف الخامس يتفوق في كرة القدم ويقود فريقه، لكنه يخجل من القراءة أمام الزملاء. أفضل توظيف لخصائص مرحلته:",["إسناد أدوار قيادية في أنشطة جماعية ترتبط بالقراءة تدريجياً","منعه من الرياضة حتى يتحسن في القراءة","إجباره على القراءة أمام الصف ليتعود","تجاهل الخجل لأنه سيزول مع العمر"],"الطفولة المتأخرة سن الجماعة والقيادة، فتوظيف قوته الاجتماعية جسر لمهارة القراءة. المنع والإجبار يضران بأزمة الكفاءة، والتجاهل لا يعالج."],["L08","h","المتعلم الذي يفضّل تلقي المعلومات عن طريق القراءة والرسوم التوضيحية والخرائط نمطه:",["بصري","سمعي","حسي حركي","اجتماعي"],"الصور والرسوم والخرائط والقراءة مدخل النمط البصري. السمعي يفضل الشرح والمناقشة، والحسي التجربة والحركة."],["L08","h","يمكن التنبؤ بأن درجة طالب حصل على 110 في اختبار ذكاء، عند إعادة قياسه بعد سنوات، ستكون غالباً:",["قريبة من 110 لأن نسبة الذكاء ثابتة نسبياً","أعلى بكثير لأنها ترتفع بالعمر","أقل بكثير لأنها تنخفض بالعمر","لا يمكن التنبؤ بها إطلاقاً"],"نسبة الذكاء محسوبة بالنسبة لأقران العمر فتبقى ثابتة نسبياً عبر الزمن، مع تغيرات طفيفة."],["L08","","تريد معلمة الصف الخامس تحقيق هدف واحد (فهم دورة الماء) لطلاب متفاوتين، فقدمت المحتوى بنص وفيديو ومجسم، وسمحت للطلاب باختيار منتج (ملصق، عرض، تجربة). هذا تطبيق لـ:",["التعليم المتمايز","التعلم للإتقان","التعليم المبرمج","التعلم التعاوني"],"هدف واحد مع تنويع المحتوى والعملية والمنتج وفق الاستعداد والاهتمام هو التمايز (توملينسون). الإتقان يركز على الزمن حتى الإتقان، والمبرمج خطوات صغيرة."],["L08","m","الأبعاد التي يمكن للمعلم أن يمايز فيها وفق توملينسون هي المحتوى والعملية والمنتج و:",["بيئة التعلم","الأهداف العامة للمقرر","درجات الاختبار النهائي","المنهج الرسمي"],"أبعاد التمايز الأربعة: المحتوى، العملية، المنتج، بيئة التعلم. الأهداف والمنهج الرسمي لا تتغير بين الطلاب."],["L08","m","أي الممارسات تتعارض مع فلسفة التعليم المتمايز؟",["تقسيم الطلاب دائماً إلى مجموعات ثابتة حسب ذكائهم","تنويع طرق عرض المحتوى","السماح بمنتجات مختلفة لإثبات التعلم","تكوين مجموعات مرنة تتغير بحسب المهمة"],"التمايز يقوم على مجموعات مرنة لا تصنيف دائم يوصم الطالب. الباقي من ممارساته."],["L08","","يرغب معلم في أن يبقى طلابه الموهوبون في صفهم مع تعميق خبراتهم بمشاريع بحثية وتوسيع موضوعات المنهج. الأسلوب الذي يستخدمه:",["الإثراء","التعجيل","التجميع","الدمج الجزئي"],"الإثراء يعمّق (رأسي) أو يوسّع (أفقي) الخبرة داخل الصف نفسه. التعجيل يغيّر الزمن أو الصف (قبول مبكر، تخطي صفوف، ضغط المنهج)، والتجميع يعزلهم في مجموعات خاصة، والدمج الجزئي مصطلح يخص ذوي الإعاقة."],["L08","m","نقلت مدرسة طالباً موهوباً من الصف الرابع إلى السادس مباشرة بعد تقييم شامل. يُصنّف هذا الإجراء ضمن:",["التعجيل (تخطي الصفوف)","الإثراء الرأسي","التجميع","الدمج الجزئي"],"تخطي الصفوف أحد صور التعجيل مع القبول المبكر وضغط المنهج. الإثراء يبقي الطالب في صفه."],["L08","","أي الآتي يُعد من صور التعجيل الدراسي للموهوبين؟",["ضغط المنهج ودراسته في زمن أقل","تكليف الطالب بتمارين إضافية من النوع نفسه","جعل الطالب مساعداً للمعلم","إعفاؤه من الواجبات"],"ضغط المنهج صورة من التعجيل. التمارين المكررة والمساعدة والإعفاء ممارسات خاطئة مع الموهوب."],["L08","","وفق نموذج رنزولي للحلقات الثلاث، تتكوّن الموهبة من تفاعل:",["قدرة فوق المتوسط والإبداع والالتزام بالمهمة","الذكاء والتحصيل والوراثة","الطلاقة والمرونة والأصالة","الذاكرة والانتباه والإدراك"],"حلقات رنزولي: قدرة فوق المتوسط، إبداع، التزام بالمهمة (الدافعية). الطلاقة والمرونة مكونات الإبداع وحده."],["L08","m","يريد معلم ترشيح طلاب لبرنامج الموهوبين. الإجراء الأدق:",["الاعتماد على محكات متعددة: قدرات وتحصيل وإبداع وملاحظة الأداء","اختيار أعلى الطلاب في درجات الاختبار النهائي فقط","اختيار الأكثر هدوءاً والتزاماً","اختيار من يطلب أولياء أمورهم ذلك"],"الكشف عن الموهبة يتطلب محكات متعددة لأن التحصيل وحده قد يخفي موهوباً ذا صعوبات أو ملل. الهدوء وطلب الأهل ليسا محكين."],["L08","","موهوب في الصف الثاني المتوسط يشعر بالملل ويسبب إزعاجاً لأنه ينهي المهام قبل زملائه. الإجراء الأنسب:",["تقديم مهام أعمق وأكثر تحدياً ترتبط بالدرس","تكليفه بحل المزيد من التمارين نفسها","معاقبته على الإزعاج","نقله إلى آخر الصف ليشغل نفسه"],"الملل سببه عدم التحدي، فالحل إثراء رأسي بمهام أعمق. التمارين المكررة تزيد الملل، والعقاب يعالج العرض لا السبب."],["L08","","من الخصائص العقلية للطالب الموهوب:",["نمو لغوي مبكر وذاكرة قوية وفضول غير عادي","بطء في اكتساب المفردات","الحاجة إلى تكرار كثير لفهم المفاهيم","تجنب الأسئلة والمشكلات المعقدة"],"الموهوب يتميز بالنمو اللغوي المبكر والذاكرة والفضول وحب التحدي. الباقي عكس خصائصه."],["L08","m","لاحظ معلم أن طالباً في الصف الثاني الابتدائي يقلب الحروف عند القراءة (ب/ت، د/ذ) ويقرأ ببطء شديد رغم ذكائه الواضح وفهمه عند الاستماع. الحالة الأقرب:",["عسر القراءة (ديسلكسيا)","بطء تعلم","إعاقة بصرية","تأخر دراسي"],"قلب الحروف وبطء القراءة مع ذكاء عادي وفهم سمعي جيد علامات الديسلكسيا (صعوبة أكاديمية). بطء التعلم ضعف عام، والإعاقة البصرية تظهر في كل مهام الرؤية."],["L08","","صعوبة الكتابة ورداءة الخط وتنظيم الحروف مع سلامة الذكاء تُسمى:",["ديسغرافيا","ديسلكسيا","ديسكالكوليا","ديسفازيا"],"الديسغرافيا عسر الكتابة. الديسلكسيا قراءة، والديسكالكوليا حساب، والديسفازيا اضطراب لغوي."],["L08","m","أي الإجراءات أنسب لمعلم لديه طالب مشخص بصعوبات تعلم في القراءة داخل الصف العادي؟",["تكييف المهام (نصوص أقصر، وقت أطول، قراءة التعليمات له) والتنسيق مع معلم غرفة المصادر","إعفاؤه من كل مهام القراءة","نقله إلى معهد للتربية الفكرية","تكليفه بالقراءة أمام الصف ليتدرب"],"ذو الصعوبات يبقى في صفه مع تكييفات وخدمة غرفة المصادر. الإعفاء يحرمه، والتربية الفكرية للإعاقة العقلية، والقراءة العلنية تحرجه."],["L08","","طالب لا يستطيع الجلوس في مكانه، يقاطع كثيراً، ويجيب قبل اكتمال السؤال، وينسى أدواته باستمرار. السمات تشير إلى:",["فرط الحركة وتشتت الانتباه","التوحد","بطء التعلم","الإعاقة الفكرية"],"النشاط الزائد والاندفاعية وضعف الانتباه هي الثلاثية المميزة لاضطراب فرط الحركة وتشتت الانتباه. التوحد يتميز بقصور التواصل والسلوك النمطي."],["L08","m","طفل في الروضة لا يستجيب لاسمه، ويتجنب التواصل البصري، ويكرر رصف المكعبات بالطريقة نفسها ويضطرب عند تغيير الروتين. المعلمة تشتبه في:",["اضطراب طيف التوحد","فرط الحركة","الإعاقة السمعية فقط","صعوبات التعلم"],"قصور التواصل الاجتماعي والسلوك النمطي ومقاومة التغيير هي السمات المميزة للتوحد. الإعاقة السمعية لا تفسر السلوك النمطي، وصعوبات التعلم لا تُشخص في الروضة بهذه الصورة."],["L08","","لاحظ معلم الصف الأول علامات تشير إلى إعاقة محتملة لدى طالب. الخطوة الأولى الصحيحة:",["تسجيل ملاحظاته وإحالة الطالب إلى المختص في المدرسة","إبلاغ ولي الأمر بأن ابنه معاق","تشخيص الحالة بنفسه وتعديل المنهج","تجاهل الأمر لأن الطفل ما زال صغيراً"],"دور معلم الصف العادي الملاحظة والإحالة؛ التشخيص للمختص. إخبار الأهل بحكم غير مؤكد ضار، والتجاهل يضيّع التدخل المبكر."],["L08","m","لديك طالب ضعيف السمع في صفك. الإجراء الأنسب:",["إجلاسه في المقدمة ومواجهته عند الكلام واستخدام الوسائل البصرية","إجلاسه في الخلف لتقليل الإحراج","رفع الصوت طوال الحصة فقط","إعفاؤه من الأنشطة الشفهية"],"المقدمة ومواجهة الوجه (لقراءة الشفاه) والوسائل البصرية تعوض القصور السمعي. رفع الصوت وحده غير كافٍ، والإعفاء يحرمه."],["L08","","الطريقة التي يعتمد عليها المكفوفون في القراءة والكتابة هي:",["برايل","لغة الإشارة","قراءة الشفاه","الكتابة الصوتية"],"برايل نظام نقاط بارزة للمكفوفين. لغة الإشارة وقراءة الشفاه للصم وضعاف السمع."],["L08","","تُعرَّف الإعاقة الفكرية (العقلية) بانخفاض الذكاء عن 70 تقريباً مع قصور في:",["السلوك التكيفي قبل سن الثامنة عشرة","القدرات الحركية فقط","الحواس البصرية والسمعية","التحصيل في مادة واحدة"],"التعريف يشترط انخفاض الذكاء وقصور السلوك التكيفي خلال فترة النمو. القصور في مادة واحدة يشير إلى صعوبات التعلم."],["L08","","متلازمة داون سببها:",["خلل كروموسومي (نسخة زائدة من الكروموسوم 21)","حرمان بيئي في الطفولة","إصابة في الرأس بعد الولادة","سوء تغذية الأم فقط"],"متلازمة داون اضطراب وراثي كروموسومي يسبب إعاقة فكرية بدرجات متفاوتة."],["L08","m","أي الفئات التالية تُعد من ذوي الاحتياجات الخاصة؟",["الموهوبون","الطلاب المتوسطون في التحصيل","الطلاب كثيرو الغياب","الطلاب الجدد في المدرسة"],"ذوو الاحتياجات الخاصة كل من ينحرف عن المتوسط ويحتاج خدمات خاصة، وتشمل الموهوبين لا ذوي الإعاقة فقط."],["L08","","الطالب الذي تتراوح نسبة ذكائه بين 70 و85 تقريباً ويتدنى تحصيله في جميع المواد يُصنّف:",["بطيء التعلم","ذا صعوبات تعلم","متأخراً دراسياً","معاقاً فكرياً"],"الفئة الحدية 70–85 مع تدنٍ عام هي بطء التعلم. الإعاقة الفكرية دون 70، وصعوبات التعلم والتأخر الدراسي بذكاء عادي."],["L08","","معلمة لديها طالبة بطيئة التعلم. أي الإجراءات أنسب؟",["تبسيط المادة وتجزئتها وإعطاؤها وقتاً أطول مع تكرار وتعزيز","تكليفها بالمهام نفسها بالسرعة نفسها احتراماً للمساواة","تحويلها إلى معهد التربية الفكرية","إعفاؤها من الاختبارات"],"بطيء التعلم يحتاج تبسيطاً وتجزئة ووقتاً وتكراراً داخل الصف العادي. المعاهد للإعاقة الفكرية، والإعفاء لا يعلّم."],["L08","","أي العبارات تصف الفروق الفردية وصفاً صحيحاً؟",["فروق كمية في الدرجة تتوزع توزيعاً اعتدالياً","فروق نوعية تجعل كل فرد فئة مستقلة","تقتصر على القدرات العقلية","تنتج عن الوراثة وحدها"],"الفروق كمية (درجة لا نوع) وتوزيعها اعتدالي، وتشمل كل السمات، وتنتج عن تفاعل الوراثة والبيئة."],["L08","m","طالب متفوق في اللغة العربية وضعيف جداً في الرياضيات. هذا مثال على:",["الفروق داخل الفرد","الفروق بين الأفراد","صعوبات التعلم بالضرورة","بطء التعلم"],"تفاوت قدرات الطالب نفسه بين مجال وآخر هو الفروق داخل الفرد. لا يُحكم بصعوبات تعلم إلا بتشخيص."],["L08","","أي طرق التدريس التالية أقل مراعاة للفروق الفردية؟",["المحاضرة والإلقاء","التعليم المبرمج","الموديولات التعليمية","الصف المقلوب"],"المحاضرة تقدم المحتوى نفسه بالسرعة نفسها للجميع. المبرمج والموديولات والصف المقلوب تتيح السير بالسرعة الذاتية."],["L08","m","عرض معلم الدرس شرحاً شفهياً ثم خريطة مفاهيم ثم نشاطاً يدوياً. ما الأساس التربوي لهذا التنويع؟",["مراعاة أنماط التعلم المختلفة (سمعي، بصري، حسي)","تطبيق جداول التعزيز المتغيرة","إشباع الحاجات الفسيولوجية","تحقيق الانطفاء التدريجي"],"تنويع قنوات العرض يخاطب الأنماط السمعية والبصرية والحسية. التعزيز والانطفاء مفاهيم سلوكية لا تتصل بالعرض."],["L08","","يحب طالب تصنيف النباتات والحشرات ويقضي وقته في ملاحظة الطيور. وفق جاردنر، يبرز لديه الذكاء:",["الطبيعي","المكاني","الجسمي الحركي","الذاتي"],"الاهتمام بالكائنات الحية وتصنيفها من الذكاء الطبيعي. المكاني للأشكال والأبعاد، والجسمي للحركة."],["L08","m","طالبة تفهم مشاعر زميلاتها وتحل خلافاتهن وتقود مجموعتها بسهولة. يبرز لديها الذكاء:",["الاجتماعي (بين الأشخاص)","الذاتي (ضمن الشخص)","اللغوي","المنطقي الرياضي"],"فهم الآخرين والتأثير فيهم هو الذكاء الاجتماعي. الذاتي يخص فهم النفس."],["L08","","المدى الذي يُعرَّف بأنه الفرق بين أقل درجة وأعلى درجة في توزيع صفة ما يصف:",["اتساع الفروق الفردية في تلك الصفة","متوسط الفروق الفردية","ثبات الصفة عبر الزمن","صدق قياس الصفة"],"المدى مقياس تشتت يبين اتساع الفروق بين الأفراد في الصفة."],["L08","m","أي المواقف يدل على أن المعلم يطبق الدمج الأكاديمي الكلي؟",["طالب من ذوي الإعاقة يدرس كل المواد في الفصل العادي مع خدمات مساندة","طالب يدرس في فصل خاص داخل المدرسة ويشارك الزملاء في الفسحة فقط","طالب يدرس في معهد مستقل","طالب يخرج إلى غرفة المصادر معظم اليوم"],"الدمج الكلي يعني تلقي كل التعليم في الفصل العادي مع دعم. المشاركة في الفسحة فقط دمج اجتماعي، والمعهد عزل، وغرفة المصادر معظم اليوم دمج جزئي."],["L08","","أفضل أداة للاستدلال على وجود صعوبات تعلم معرفية لدى المتعلم مقارنةً بقدرته:",["الاختبارات التحصيلية والتشخيصية","مقياس الاتجاه","استبانة الميول","مقياس تقدير الذات"],"الفجوة بين القدرة والتحصيل تُكشف بالاختبارات التحصيلية والتشخيصية. مقاييس الاتجاه والميول والذات لا تقيس التحصيل."],["L08","","الوثيقة المكتوبة التي تحدد الأهداف والخدمات والتعديلات لطالب من ذوي الاحتياجات الخاصة تُسمى:",["الخطة التربوية الفردية","جدول المواصفات","الخطة الفصلية","السجل القصصي"],"الخطة التربوية الفردية تُعدّ لكل طالب من ذوي الاحتياجات الخاصة. جدول المواصفات لبناء الاختبار، والخطة الفصلية لعموم الصف."],["L08","","طالب يرفض كل تغيير في ترتيب مقاعد الصف ويصاب بنوبة انزعاج عند تغيير الجدول. أنسب إجراء للمعلم:",["تثبيت الروتين وإعلام الطالب مسبقاً بأي تغيير بجدول بصري","تغيير الترتيب باستمرار ليعتاد","تجاهل انزعاجه حتى يتوقف","معاقبته على النوبات"],"مقاومة التغيير سمة التوحد، والتعامل معها بالروتين والتهيئة المسبقة بالجداول البصرية (التعلم المنظم). التغيير المستمر والعقاب يزيدان الاضطراب."],["L08","","أي العبارات صحيحة عن الموهوبين داخل الفصول العادية؟",["قد يعانون الملل وضعف التحدي ما لم تُقدم لهم أنشطة إثرائية","لا يحتاجون أي خدمات خاصة لأنهم متفوقون","يُكتشفون دائماً بدرجات الاختبار","ينبغي عزلهم دائماً في فصول خاصة"],"الموهوب يحتاج إثراءً وإلا ملّ وربما انخفض تحصيله. التحصيل وحده لا يكشف كل الموهوبين، والعزل الدائم ليس الخيار الأفضل."],["L08","m","تلاحظ معلمة أن طالبة موهوبة تنتقد عملها بقسوة وتتوتر من أي خطأ صغير ولا تسلّم المهمة إلا «مثالية». هذا يعكس من خصائص الموهوبين:",["الكمالية والحساسية المفرطة","بطء التعلم","ضعف الدافعية","العجز المتعلم"],"الكمالية والحساسية المفرطة من الخصائص الانفعالية للموهوبين وقد تسبب القلق. العجز المتعلم توقف عن المحاولة، وهي عكس ذلك."],["L09","h","عرض المعلم فيلماً يبين تجاذب وتنافر بعض الأجسام تمهيداً لدراسة الشحنات الكهربائية. ما قام به المعلم حسب نظرية التعلم ذي المعنى يُسمى:",["منظماً متقدماً","تثبيتاً","تعزيزاً","كفاية ذاتية"],"المادة التمهيدية العامة التي تُعرض قبل الدرس لربطه بالبنية المعرفية هي المنظم المتقدم عند أوزوبل. التعزيز سلوكي والكفاية الذاتية لباندورا."],["L09","h","ترى نظرية التعلم أن التعلم يحدث من خلال التفاعل الاجتماعي والتعاون والحوار مع الأكثر خبرة. هذه هي:",["البنائية الاجتماعية (فيجوتسكي)","البنائية المعرفية (بياجيه)","السلوكية (سكنر)","الجشطلت"],"فيجوتسكي يرى التعلم اجتماعياً أولاً عبر الحوار والمساعدة في منطقة النمو القريب. بياجيه يركز على البناء الفردي."],["L09","h","مسح رأس الطالب والابتسام له بعد سلوكه الحسن يُعد من المعززات:",["الاجتماعية","المادية","الرمزية","النشاطية"],"اللمسة والابتسامة والمدح معززات اجتماعية. المادية هدايا، والرمزية نجوم تُستبدل، والنشاطية وقت لعب."],["L09","h","من أدوار المعلم وفق النظرية البنائية:",["ميسّر ينظم بيئة تعلم يبني فيها الطالب معرفته","ملقّن ينقل المعرفة ويتحكم في التعزيز","مصدر وحيد للمعلومات","مراقب للاستجابات الظاهرة فقط"],"البنائية تجعل المعلم ميسراً والطالب بانياً نشطاً. الأدوار الأخرى سلوكية."],["L09","","لاحظ معلم أن طالباً يرفع يده كثيراً فشكره أمام زملائه، فازداد رفعه ليده. الإجراء الذي قام به المعلم:",["تعزيز موجب","تعزيز سالب","عقاب سالب","انطفاء"],"الشكر مثير سارّ أُضيف بعد السلوك فزاد، وهذا التعزيز الموجب. التعزيز السالب إزالة منفّر، والعقاب السالب سحب معزّز."],["L09","h","لم يؤدِّ طالب واجبه، فحرمه المعلم من حصة الرياضة التي كان ينتظرها ذلك اليوم، فقلّ إهماله للواجبات بعدها. يُصنّف هذا الإجراء:",["تكلفة استجابة (عقاب سالب)","تعزيز سالب","عقاب موجب","تشكيل"],"سحب امتياز مكتسب (حصة الرياضة) بعد السلوك غير المرغوب فقلّ السلوك = تكلفة الاستجابة، وهي صورة من العقاب السالب. التعزيز السالب إزالة منفّر فيزيد السلوك، والعقاب الموجب إضافة منفّر."],["L09","m","يصرخ طالب لجذب الانتباه، فاتفق المعلم مع الصف على تجاهل صراخه تماماً والالتفات إليه عندما يتكلم بهدوء. الإجراء مع الصراخ:",["انطفاء","عقاب موجب","تعزيز سالب","إقصاء"],"وقف التعزيز (الانتباه) عن السلوك فيتلاشى = انطفاء، مع تعزيز السلوك البديل (تعزيز تفاضلي). الإقصاء يتطلب إبعاده."],["L09","","أخرج المعلم طالباً مشاغباً من مجموعة اللعب ليجلس وحده دقائق بعيداً عن النشاط. يُصنّف هذا:",["إقصاء (وقت مستقطع)","تكلفة استجابة","تعزيز سالب","انطفاء"],"الإبعاد المؤقت عن مصدر التعزيز هو الإقصاء. تكلفة الاستجابة خسارة شيء مكتسب كالدرجات."],["L09","m","يعطي معلم نجمة بعد كل خمس إجابات صحيحة بالضبط. جدول التعزيز المستخدم:",["نسبة ثابتة","نسبة متغيرة","فترة ثابتة","فترة متغيرة"],"التعزيز بعد عدد ثابت من الاستجابات = نسبة ثابتة. الفترة ترتبط بالزمن، والمتغيرة بعدد غير منتظم."],["L09","","يفاجئ المعلم طلابه باختبارات قصيرة في أوقات غير متوقعة فيستمر استذكارهم طوال الفصل. جدول التعزيز الأقرب:",["فترة متغيرة","فترة ثابتة","نسبة ثابتة","تعزيز مستمر"],"الاختبارات في أوقات زمنية غير منتظمة = فترة متغيرة، وتحافظ على أداء مستمر. الفترة الثابتة (كل أسبوع) تجعل الاستذكار يتركز قبل الموعد."],["L09","","أي جداول التعزيز أكثر مقاومة للانطفاء ويُنتج أعلى معدل استجابة؟",["النسبة المتغيرة","النسبة الثابتة","الفترة الثابتة","التعزيز المستمر"],"النسبة المتغيرة (كألعاب الحظ) الأقوى وأكثرها مقاومة للانطفاء. المستمر أسرع تعلماً لكنه أسرع انطفاءً."],["L09","m","يلاحظ معلم أن طلابه يذاكرون بكثافة قبل اختبار الشهر فقط ثم يتوقفون بعده. هذا النمط ينتج عن جدول تعزيز:",["الفترة الثابتة","النسبة المتغيرة","الفترة المتغيرة","المستمر"],"التعزيز بعد زمن ثابت يُنتج نمط «الحافة»: ارتفاع الأداء قبل الموعد وانخفاضه بعده."],["L09","m","يريد معلم تعليم طفل في الروضة كتابة اسمه. بدأ بتعزيزه عند مسك القلم، ثم عند رسم خط، ثم عند كتابة حرف، حتى كتب الاسم كاملاً. الإجراء:",["تشكيل","تسلسل","نمذجة","تعميم"],"تعزيز التقريبات المتتابعة نحو السلوك النهائي هو التشكيل. التسلسل ربط خطوات مكتملة، والنمذجة ملاحظة نموذج."],["L09","","يستخدم معلم بطاقات نقاط يجمعها الطلاب ويستبدلونها آخر الأسبوع بامتيازات. هذا النظام:",["الاقتصاد الرمزي","التعزيز السالب","مبدأ بريماك","العقد السلوكي"],"الرموز القابلة للاستبدال بمعززات هي الاقتصاد الرمزي. بريماك نشاط محبب يعزز نشاطاً آخر، والعقد اتفاق مكتوب."],["L09","m","يشعر طالب بالخوف من حصة الرياضيات بعد تعرضه للتوبيخ المتكرر فيها، وبدأ يخاف من كل حصة تُعرض فيها أرقام. انتقال الخوف إلى الحصص المشابهة يُسمى:",["التعميم","التمييز","الانطفاء","الاسترجاع التلقائي"],"إصدار الاستجابة الشرطية لمثيرات تشبه المثير الأصلي هو التعميم. التمييز عكسه."],["L09","","تعلم طفل الخوف من الطبيب ذي المعطف الأبيض، لكنه لا يخاف من والده عندما يلبس معطفاً أبيض. هذا يدل على:",["التمييز","التعميم","الانطفاء","الإشراط من الدرجة الثانية"],"الاستجابة للمثير الأصلي دون المشابه هي التمييز."],["L09","m","توقف طالب عن الخوف من قاعة الاختبار بعد عدة اختبارات مرت دون توبيخ، ثم عاد الخوف فجأة بعد إجازة طويلة. عودة الخوف تُسمى:",["الاسترجاع التلقائي","التعميم","التمييز","الكف"],"عودة الاستجابة المنطفئة بعد فترة راحة هي الاسترجاع التلقائي عند بافلوف."],["L09","","في الإشراط الكلاسيكي، صوت الجرس الذي صار يستدعي اللعاب بعد اقترانه بالطعام يُسمى:",["مثيراً شرطياً","مثيراً غير شرطي","استجابة شرطية","استجابة غير شرطية"],"الجرس مثير محايد صار شرطياً. الطعام غير شرطي، واللعاب للجرس استجابة شرطية."],["L09","m","يعلّم معلم جدول الضرب بتكرار التسميع مع مدح كل إجابة صحيحة ومراعاة الاستعداد. يستند هذا إلى قوانين:",["ثورندايك (الأثر والتدريب والاستعداد)","الجشطلت","فيجوتسكي","أوزوبل"],"التكرار (قانون التدريب)، والمدح (قانون الأثر)، والاستعداد هي قوانين ثورندايك."],["L09","","مؤسس المدرسة السلوكية الذي أجرى تجربة الطفل ألبرت وقال إن الانفعالات تُتعلم بالإشراط:",["واطسون","بافلوف","ثورندايك","تولمان"],"واطسون مؤسس السلوكية ومعه تجربة ألبرت الصغير. تولمان معرفي (التعلم الكامن)."],["L09","","فئران تولمان التي تجولت في المتاهة دون تعزيز ثم تحسن أداؤها فجأة عند تقديم الطعام تمثل ظاهرة:",["التعلم الكامن (تولمان)","الاستبصار","الانطفاء","التعزيز البديل"],"التعلم حدث دون تعزيز وظهر عند وجود الدافع: التعلم الكامن والخرائط المعرفية عند تولمان."],["L09","m","بعد محاولات عديدة فاشلة، توقف طالب عن حل لغز هندسي، ثم صاح فجأة «فهمت!» ورسم الحل كاملاً. التعلم هنا بـ:",["الاستبصار","المحاولة والخطأ","التشكيل","التلقين"],"الحل المفاجئ بعد إعادة تنظيم الموقف هو الاستبصار (الجشطلت/كوهلر). المحاولة والخطأ تدريجي."],["L09","","يبدأ معلم كل وحدة بعرض خريطة مفاهيم عامة تبين علاقة الدرس الجديد بما سبق، ثم يفصّل. ما يقوم به المعلم:",["منظم متقدم (أوزوبل)","تعزيز متقطع","استبصار","سقالات"],"الإطار العام المقدّم قبل الدرس لربطه بالبنية المعرفية هو المنظم المتقدم. السقالات دعم أثناء الأداء."],["L09","m","يكتفي طلاب بحفظ تعريف الاحتكاك دون ربطه بما يعرفونه عن الحركة. وفق أوزوبل، نوع تعلمهم:",["تعلم صمّ (استظهاري) بالاستقبال","تعلم ذو معنى بالاستقبال","تعلم ذو معنى بالاكتشاف","تعلم كامن"],"الحفظ دون ربط بالبنية المعرفية هو التعلم الاستظهاري (الصمّ) بالاستقبال. ذو المعنى يربط الجديد بالقديم."],["L09","","يعرض معلم العلوم المفهوم بمجسم يتعامل معه الطلاب بأيديهم، ثم بصور ورسوم، ثم بالمعادلة الرمزية. هذا التدرج وفق:",["برونر (العملي ثم الأيقوني ثم الرمزي)","بياجيه (الحس-حركي ثم المجرد)","سكنر (التعليم المبرمج)","باندورا (النمذجة)"],"التدرج من التمثيل العملي إلى الأيقوني إلى الرمزي هو ترتيب برونر لأنماط التمثيل."],["L09","","المنهج الذي تعود فيه المفاهيم الأساسية بعمق أكبر في كل صف دراسي يُسمى عند برونر:",["المنهج الحلزوني","المنهج المحوري","منهج النشاط","المنهج المدمج"],"الحلزوني تنظيم برونر لتكرار المفاهيم بتعمق متزايد."],["L09","m","يطلب معلم من طلابه حفظ رقم مكوّن من عشرة أرقام فيفشل معظمهم، ثم يعرضه مقسماً إلى ثلاث مجموعات فينجحون. الاستراتيجية التي ساعدتهم:",["التجميع (التقطيع)","التسميع","التنظيم الهرمي","الترميز المزدوج"],"تجميع الوحدات المتفرقة في وحدات أكبر يوسع سعة الذاكرة العاملة (7±2). التسميع تكرار، والتنظيم الهرمي للمفاهيم."],["L09","","سعة الذاكرة قصيرة المدى (العاملة) تقدَّر بنحو:",["7±2 وحدات","غير محدودة","وحدة واحدة","50 وحدة"],"ميلر: 7±2 وحدات لمدة 15–30 ثانية. غير المحدودة هي طويلة المدى."],["L09","m","تعلم طالب قائمة كلمات فرنسية ثم قائمة إسبانية، فوجد أن الإسبانية جعلته ينسى الفرنسية. نوع التداخل:",["تداخل بعدي (رجعي)","تداخل قبلي","اضمحلال","كبت"],"التعلم الجديد (الإسبانية) أعاق تذكر القديم (الفرنسية) = تداخل بعدي. القبلي القديم يعيق الجديد."],["L09","","عندما يكتب المعلم أرقاماً على السبورة ويطلب حفظها بسرعة دون ورقة، ثم يمسحها، فإن ما يختبره لدى الطلاب هو:",["الذاكرة قصيرة المدى (العاملة)","الذاكرة طويلة المدى","الذاكرة الإجرائية","الذاكرة الحسية فقط"],"الاحتفاظ بالمعلومات ثوانٍ قليلة ومعالجتها دون تثبيت عمل الذاكرة العاملة."],["L09","","مراحل التعلم بالملاحظة عند باندورا بالترتيب:",["الانتباه ← الاحتفاظ ← الإنتاج ← الدافعية","الدافعية ← الانتباه ← الاحتفاظ ← الإنتاج","الاحتفاظ ← الانتباه ← الدافعية ← الإنتاج","الإنتاج ← الانتباه ← الاحتفاظ ← الدافعية"],"يبدأ الملاحظ بالانتباه للنموذج ثم الاحتفاظ بالصورة ثم إنتاج السلوك ثم الدافعية لأدائه."],["L09","","رأى طالب زميله يُكافأ على ترتيب أدواته فبدأ يرتب أدواته هو أيضاً. ما حدث له:",["تعزيز بديل","تعزيز موجب مباشر","استبصار","تمييز"],"زيادة سلوك الملاحظ بعد رؤية النموذج يُعزز هي التعزيز البديل (باندورا). التعزيز المباشر يقتضي أن يُكافأ هو."],["L09","m","طالب يعتقد أنه لن ينجح في الرياضيات مهما حاول، رغم قدرته. وفق باندورا، أفضل طريقة لرفع كفاءته الذاتية:",["إتاحة خبرات نجاح متدرجة وإبراز نماذج مشابهة له نجحت","إخباره بأنه ذكي فقط","تقليل التوقعات منه","مقارنته بالمتفوقين"],"أقوى مصادر الكفاءة الذاتية خبرات الإتقان ثم الخبرات البديلة. الإقناع اللفظي وحده ضعيف، والمقارنة تضعفها."],["L09","m","يسمي طفل في الروضة الحمار الوحشي «حصاناً مخططاً». وفق بياجيه، الطفل يقوم بـ:",["التمثل","المواءمة","الموازنة","التعميم الشرطي"],"إدخال الخبرة الجديدة في مخطط قائم (الحصان) دون تعديله هو التمثل. لو كوّن مفهوماً جديداً لكان مواءمة."],["L09","","لاحظ معلم أن طالباً يستطيع حل مسألة من خطوتين وحده، ويحل مسألة من أربع خطوات بتلميحات منه. وفق فيجوتسكي، ينبغي أن يوجه المعلم تدريسه إلى:",["مسائل الأربع خطوات مع دعم يتناقص تدريجياً","مسائل الخطوتين فقط حتى يتقنها تماماً","مسائل من ثماني خطوات ليتحدى نفسه","ترك الطالب يختار بنفسه دائماً"],"التدريس الفعال يستهدف منطقة النمو القريب (ما ينجزه بالمساعدة) مع سقالات تُسحب تدريجياً. ما يتقنه وحده لا يطوره، والبعيد جداً يُحبط."],["L09","m","تقدم معلمة لطلابها قائمة تحقق وأسئلة موجهة ونماذج أثناء كتابة أول تقرير علمي، ثم تقلل هذه المساعدات في التقارير التالية. ما تقوم به:",["السقالات التعليمية","التعليم المبرمج","التعزيز المتقطع","الإثراء"],"الدعم المؤقت المتناقص مع تقدم المتعلم هو السقالات (فيجوتسكي/برونر)."],["L09","","يتحدث طفل مع نفسه بصوت مسموع وهو يركب الأحجية: «هذه هنا… لا، هناك». وفق فيجوتسكي، هذا الحديث الذاتي:",["أداة لتنظيم التفكير وتوجيه السلوك ويُعد تطوراً طبيعياً","دليل على تمركز حول الذات يجب علاجه","مظهر لتشتت الانتباه","سلوك يجب إيقافه حفاظاً على الهدوء"],"فيجوتسكي يرى الحديث الذاتي وسيلة لضبط الذات وتوجيه الفعل ويتحول لاحقاً إلى حديث داخلي. بياجيه عدّه تمركزاً، لكن السؤال عن فيجوتسكي."],["L09","","اعتاد طالب القيادة في بلد تسير فيه السيارات على اليسار، فأخطأ كثيراً عند القيادة في المملكة. هذا مثال على:",["انتقال أثر سلبي","انتقال أثر إيجابي","انتقال صفري","تعميم إيجابي"],"العادة القديمة أعاقت الأداء الجديد = انتقال سلبي."],["L09","m","تعلم الطلاب الجمع ثم انتقلوا إلى الضرب الذي يبنى عليه. نوع انتقال أثر التعلم:",["رأسي","أفقي","سلبي","صفري"],"تعلم مهارة أعلى مستوى تبنى على سابقة = انتقال رأسي. الأفقي مهارة بالمستوى نفسه في سياق آخر."],["L09","","فسّر ثورندايك انتقال أثر التعلم بوجود:",["عناصر متطابقة بين الموقفين","استبصار في الموقف الجديد","دافعية داخلية مرتفعة","منظم متقدم"],"نظرية العناصر المتطابقة لثورندايك: ينتقل الأثر بقدر تشابه عناصر الموقفين. جد فسّره بالتعميم."],["L09","","أي العبارات الآتية لا تنطبق على التعزيز السالب؟",["يقلل من احتمال تكرار السلوك","يزيد من احتمال تكرار السلوك","يتضمن إزالة مثير منفّر","يحدث بعد صدور الاستجابة"],"التعزيز بنوعيه يزيد السلوك؛ التقليل وظيفة العقاب. الالتباس الشائع هو عدّ «السالب» عقاباً."],["L09","","جميع ما يلي من مفاهيم النظرية البنائية ما عدا:",["جداول التعزيز","منطقة النمو القريب","التمثل والمواءمة","السقالات"],"جداول التعزيز من الإشراط الإجرائي. الباقي من بياجيه وفيجوتسكي."],["L09","","أي مما يلي ليس من استراتيجيات نقل المعلومات إلى الذاكرة طويلة المدى؟",["تكديس المعلومات دفعة واحدة قبل الاختبار","التسميع الموزع","التجميع","الربط بالمعرفة السابقة (الإتقان)"],"التكديس يرهق الذاكرة العاملة ويضعف التخزين. التسميع الموزع والتجميع والربط استراتيجيات فعالة."],["L09","m","يعرض معلم طالباً متميزاً في النظافة نموذجاً أمام الصف ويمدحه، فيلاحظ تحسن نظافة الطلاب الآخرين. التفسير النظري لذلك:",["التعلم بالملاحظة والتعزيز البديل","الانطفاء","الإشراط الكلاسيكي","التعلم الكامن"],"رؤية نموذج يُعزز يزيد السلوك عند الملاحظين (باندورا)."],["L09","","بعد أن شرح المعلم مفهوماً معقداً عشرين دقيقة متواصلة لاحظ أن الطلاب توقفوا عن المتابعة. التفسير وفق معالجة المعلومات:",["تجاوز الحمل المعرفي سعة الذاكرة العاملة","انطفاء الاستجابة","ضعف قانون الاستعداد","غياب المواءمة"],"المعلومات المتواصلة الكثيفة تفوق سعة الذاكرة العاملة (الحمل المعرفي الزائد)، فالحل التقسيم والتوقف للمعالجة."],["L10","h","لكي يحافظ المعلم على مستوى مرتفع من الدافعية لدى طالب تعرض لخبرات إخفاق، فإنه استناداً إلى النظريات المعرفية في الدافعية (العزو) يقوم بـ:",["توجيه الطالب إلى عزو الفشل إلى نقص الجهد المبذول لا إلى القدرة","تعزيز أي تقدم يحققه مادياً","توفير بيئة خالية من أي
