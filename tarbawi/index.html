["L13","","الوثيقة المكتوبة المعتمدة من الوزارة التي تحدد الأهداف والمحتوى والتقويم لكل مادة تمثل:",["المنهج الرسمي (المعلن)","المنهج الخفي","المنهج الفارغ","المنهج المُختبَر"],"المنهج الرسمي هو المخطط المكتوب المعتمد. الخفي غير مكتوب، والفارغ محذوف، والمختبَر ما يعيشه الطالب فعلاً."],
["L13","h","نظم معلم محتوى المادة من البسيط إلى المعقد ومن القديم إلى الحديث ومن المحسوس إلى المجرد. يسمى هذا التنظيم للمحتوى:",["المنطقي","السيكولوجي","الرأسي","الأفقي"],"التنظيم المنطقي يتبع بنية المادة الداخلية وتسلسلها. السيكولوجي وفق حاجات المتعلم وميوله، والرأسي والأفقي يصفان مدى المنهج وتتابعه."],
["L13","h","تنظيم المنهج الذي يقوم على اهتمامات الطلاب وميولهم ويبنى على أساس حل المشكلات ويرتبط بجون ديوي هو:",["منهج النشاط","منهج المواد المنفصلة","المنهج المحوري","منهج المجالات الواسعة"],"منهج النشاط لديوي ينطلق من ميول الطلاب ومشكلاتهم. المواد المنفصلة تنظيم تقليدي، والمحوري محور مشترك ومواد اختيارية، والمجالات الواسعة دمج مواد متقاربة."],
["L13","m","يعود مفهوم «الطاقة» في الصفوف الرابع والسابع والعاشر في كل مرة بعمق أوسع ومستوى تجريد أعلى. هذا التنظيم للمنهج يسمى:",["المنهج الحلزوني","منهج الوحدات","المنهج المحوري","منهج النشاط"],"المنهج الحلزوني (برونر) يعيد المفاهيم الأساسية بتعمق متزايد عبر الصفوف. الوحدات تنظيم حول موضوعات، والمحوري محور مشترك."],
["L13","m","نسق معلم التاريخ مع معلم الجغرافيا لتدريس موضوع «الهجرة النبوية» في الأسبوع نفسه مع بقاء كل مادة مستقلة بحصصها. هذا التنظيم يسمى:",["المواد المترابطة","المواد المندمجة","المواد المنفصلة","المنهج المحوري"],"الترابط تنسيق بين مادتين مع بقائهما منفصلتين. الاندماج يصهرهما في مادة واحدة كالاجتماعيات، والمنفصلة لا تنسيق فيها."],
["L13","","تنظيم منهجي يدرس فيه جميع الطلاب محوراً مشتركاً من الخبرات العامة ثم يختار كل منهم مواد تخصصية حسب ميوله. هذا هو:",["المنهج المحوري","منهج النشاط","المواد المنفصلة","المنهج الحلزوني"],"المنهج المحوري يجمع بين جزء مشترك إلزامي وجزء اختياري. النشاط ينطلق من الميول كلياً، والحلزوني يعيد المفاهيم بتعمق."],
["L13","h","يبدأ نموذج تايلر في بناء المنهج بـ:",["تحديد الأهداف","اختيار الخبرات التعليمية","تنظيم الخبرات","التقويم"],"أسئلة تايلر الأربعة: ما الأهداف؟ ما الخبرات؟ كيف تنظم؟ كيف نقوم؟ فالأهداف أولاً. التقويم آخر الأسئلة."],
["L13","h","صاحب النموذج الأشهر في تقويم المنهج القائم على مدى تحقق الأهداف هو:",["تايلر","دانيلسون","بوزان","نوفاك"],"تايلر صاحب نموذج تقويم المنهج بمقارنة النتائج بالأهداف. دانيلسون نموذج تقويم المعلمين، وبوزان الخرائط الذهنية، ونوفاك خرائط المفاهيم."],
["L13","m","نموذج بناء المنهج الذي يبدأ من المعلم استقرائياً بتشخيص حاجات الطلاب ثم صياغة الأهداف واختيار المحتوى وتنظيمه هو نموذج:",["تابا","تايلر","برونر","بوسنر"],"هيلدا تابا ترى أن المنهج يُبنى من الأسفل بيد المعلم بدءاً بتشخيص الحاجات. تايلر يبدأ بالأهداف من الأعلى، وبرونر الحلزوني، وبوسنر التغير المفاهيمي."],
["L13","h","جميع ما يأتي من أسس بناء المنهج ما عدا:",["الأساس الإداري","الأساس الفلسفي","الأساس النفسي","الأساس الاجتماعي"],"أسس المنهج: الفلسفي (العقدي) والنفسي والاجتماعي والمعرفي. الإدارة تنفيذ لا أساس يُبنى عليه المنهج."],
["L13","m","أدرج معلم الرياضيات نشاطاً يحسب فيه الطلاب ميزانية أسرة شهرية ويقارنون بين خيارات الادخار. البعد المشترك الذي ينميه هذا النشاط هو:",["المهارات الحياتية","الهوية الوطنية","الثقافة الرقمية","مهارات اللغة"],"إدارة الميزانية والادخار من المهارات الحياتية التي تُنمى عبر المواد. الهوية ترتبط بالانتماء، والرقمية بالتقنية، واللغة بالتواصل."],
["L13","m","ربط معلم اللغة الإنجليزية درس «الاحتفالات» بتراث المملكة واليوم الوطني، وطلب من الطلاب وصفه بالإنجليزية. البعد المشترك الذي يعززه هو:",["الهوية الوطنية","الثقافة الرقمية","المهارات الحياتية","التفكير الرياضي"],"ربط المحتوى بتراث الوطن ومناسباته يعزز الهوية الوطنية عبر مادة غير مخصصة لها. البدائل الأخرى أبعاد لا يستهدفها النشاط."],
["L13","h","في نهاية درس بالتعلم النشط، طلب المعلم من المجموعات وصف العمليات التي قاموا بها وتحديد أبرز الصعوبات التي واجهوها. يهدف المعلم من ذلك إلى:",["تعزيز التأمل والتوجيه الذاتي (ما وراء المعرفة)","ترسيخ معلومات الدرس بالتكرار","قياس سرعة الإنجاز","مقارنة المجموعات ببعضها"],"وصف العمليات والصعوبات تفكير في التفكير يعزز الوعي بالتعلم وتنظيمه ذاتياً. التكرار والسرعة والمقارنة ليست غاية هذا النشاط."],
["L13","h","استراتيجية تُطرح فيها الأسئلة على طالب معين يجلس أمام الصف بهدف تنمية مهارات بناء الأسئلة وتبادل الأفكار والقراءة تسمى:",["الكرسي الساخن","العمل الجماعي","أعواد المثلجات","المائدة المستديرة"],"الكرسي الساخن يركز الأسئلة على طالب واحد أمام زملائه. أعواد المثلجات اختيار عشوائي للمجيب، والمائدة المستديرة إجابات بالتناوب داخل المجموعة."],
["L13","","المعلم الذي يختار استراتيجياته التدريسية وفق مؤشر المعيار 8.3 يراعي في المقام الأول:",["حاجات المتعلمين وخصائصهم وطبيعة أهداف التعلم","التجهيزات التقنية المتاحة في المدرسة فقط","الاستراتيجيات التي يفضلها شخصياً","ما يطلبه أولياء الأمور"],"المؤشر ينص على استراتيجيات تلبي حاجات المتعلمين وخصائصهم وتراعي طبيعة الأهداف. التجهيزات والتفضيل الشخصي وطلبات الأسر عوامل ثانوية."]
]);

// ===== 9.1 توقعات أداء عالية والدافعية =====
["L14","hm","توقعات المعلم العالية لطلابه تعكس:",["إيمانه بقدرة جميع طلابه على النجاح","رغبته في تحقيق تنافس مستمر بين طلابه","إنجازه الشخصي وتطوره المهني","أداءه المتمركز حول أنشطة التعلم"],"التوقعات العالية اعتقاد بأن كل طالب قادر على التعلم إذا وجد التحدي والدعم. التنافس بين الطلاب يُظهر الضعفاء ويخفض الدافعية، وهو أقوى مشتت."],
["L14","h","يستند مفهوم التوقعات العالية إلى اعتقاد تربوي مفاده أن:",["تحصيل الطلاب يميل إلى الارتفاع في علاقة مباشرة مع التوقعات العالية الموضوعة لهم","التوقعات المنخفضة تحمي الطلاب من الإحباط فترفع تحصيلهم","أثر توقعات المعلم يقتصر على الطلاب المتفوقين","العلاقة بين التوقعات والتحصيل ضعيفة لا تُذكر"],"هذا جوهر أثر بجماليون: التوقعات تتحول إلى نبوءة تحقق ذاتها. البدائل الأخرى تعكس إما خفض التوقعات أو إنكار أثرها."],
["L14","h","أي العبارات الآتية تصف وصفاً صحيحاً العلاقة بين مستوى توقعات المعلم من طلابه وتحصيلهم؟",["توقعات المعلم من العوامل الرئيسة المؤثرة في تحصيل الطلاب","التوقعات العالية تؤثر سلباً في تحصيل طلاب المرحلة الثانوية","ينحصر أثر توقعات المعلم في الطلاب الضعاف","تربطهما علاقة ضعيفة لا أثر لها في التحصيل"],"الدراسات (روزنثال وجاكوبسون) تؤكد أن توقعات المعلم عامل رئيس في التحصيل لجميع المراحل والمستويات."],
["L14","h","أي الاستراتيجيات الآتية لا تدعم الوصول بالطلاب إلى التوقعات العالية منهم؟",["مقارنة أداء الطالب بأداء أقرانه","تقديم تغذية راجعة وصفية","استخدام تكليفات متنوعة","التعرف على أوجه التميز لدى كل طالب"],"المقارنة بالأقران تُشعر الأضعف بالعجز وتخفض دافعيته؛ المقارنة الصحيحة بأداء الطالب السابق. البدائل الثلاثة الأخرى من أدوات رفع التوقعات."],
["L14","h","أي الاستراتيجيات الآتية تقلل من دافعية الطلاب للتعلم والعمل؟",["وضع توقعات مثالية لا تراعي قدراتهم الحالية","إشراك الطلاب في التخطيط لتعلمهم","تزويد الطلاب بنتائجهم فور الانتهاء منها","إعادة ترتيب بيئة الصف بين فترة وأخرى"],"التوقعات العالية تكون متحدية لكنها قابلة للتحقيق؛ أما المثالية غير الواقعية فتولد الإحباط. البدائل الأخرى ترفع الدافعية."],
["L14","hm","يؤكد معلم الرياضيات لطلابه باستمرار أنهم ذوو قدرة عالية، ويكلفهم بما يتوافق مع هذه القدرة، ومع ذلك يرشدهم إلى ما يسهّل عليهم إنجاز المهام. يدل ذلك على قدرة المعلم على:",["تحفيز الطلاب وإظهار التوقعات العالية لتعلمهم","إعطاء تكليفات منزلية ضاغطة على الطلاب","اكتشاف المبدعين من الطلاب من خلال ذكائهم","متابعة الطلاب والقيام بدور المرشد الطلابي"],"الجمع بين التحدي (مهام تناسب القدرة العالية) والدعم (إرشاد يسهّل الإنجاز) هو عين التوقعات العالية. التكليفات الضاغطة تفتقد الدعم."],
["L14","h","عندما يخطئ الطالب في الإجابة عن سؤال، فالممارسة التي تعكس توقعات المعلم أداءً عالياً من المتعلم هي:",["إعادة صياغة السؤال بطريقة أخرى","الاكتفاء بإخبار الطالب بأنه مخطئ","تقديم الإجابة النموذجية عن السؤال","طلب الإجابة الصحيحة من طالب آخر"],"إعادة الصياغة تبقي الطالب في الموقف وتؤكد أنه قادر على الوصول للإجابة. نقل السؤال لطالب آخر يوحي بأن المعلم تخلى عنه."],
["L14","hm","تشير الدراسات إلى أن تقدير الذات يتراجع بوضوح لدى الطلاب ذوي التحصيل المتدني. كيف يمكن للمعلم مساعدتهم على رفع تقدير الذات؟",["تحديد جوانب القوة لديهم وتعزيزها","حثهم على بذل مزيد من الجهد","حث جميع الطلاب على التعامل باحترام متبادل","تدريبهم على عدد من المهارات الدراسية الفاعلة"],"تقدير الذات يُبنى على خبرات نجاح حقيقية، فالبدء بجوانب القوة يمنحها. الحث على الجهد أو المهارات الدراسية إجراء أكاديمي لا يعالج صورة الذات مباشرة."],
["L14","h","طالب يشارك شفهياً بحماس وخطه وإملاؤه سليمان، لكنه يتجنب أي مهمة كتابية ويقول: «لن أنجح فيها مهما حاولت، فأنا أفشل فيها منذ سنوات». أقرب وصف لحالته:",["الإحباط","صعوبة تعلم في الكتابة","الخجل","فرط الحركة"],"اليأس من المحاولة وعزو الفشل إلى عجز دائم مع قدرة ظاهرة (خط وإملاء سليمان) سمة الإحباط والعجز المتعلم. صعوبة التعلم تُشخَّص باختبارات ويكون فيها خلل فعلي في الأداء لا تجنب فقط، والخجول لا يشارك شفهياً بحماس."],
["L14","","رسب طالب في اختبار فقال: «أنا غبي في الرياضيات ولن أنجح مهما فعلت». العزو هنا وفق نظرية واينر:",["داخلي ثابت غير قابل للضبط (القدرة)","داخلي متغير قابل للضبط (الجهد)","خارجي متغير (الحظ)","خارجي ثابت (صعوبة المادة)"],"الغباء سبب داخلي يراه الطالب ثابتاً وخارج سيطرته، وهذا أخطر أنواع العزو لأنه يقود إلى العجز المتعلم. عزو الفشل للجهد كان سيبقي الأمل."],
["L14","","عند الثناء على نجاح طالب أمام زملائه، الأنسب أن يعزو المعلم النجاح إلى:",["الجهد الذي بذله الطالب","ذكائه الفطري","سهولة الاختبار","حظه في الأسئلة"],"عزو النجاح للجهد يرسخ أن النتيجة تحت سيطرة الطالب فيثابر. عزوه للذكاء يجعله يخاف من المهام الصعبة التي قد تكشف عكس ذلك."],
["L14","m","لاحظت معلمة أن طالبة تقول قبل كل مهمة: «لن أحاول لأنني سأفشل كالعادة». الإجراء الأول الأنسب:",["تكليفها بمهمة قصيرة مضمونة النجاح ثم تعزيز جهدها","إعفاؤها من المهام الصعبة مراعاة لحالتها","مقارنتها بزميلتها المتفوقة لتحفيزها","إبلاغ ولي الأمر بضعف ثقتها بنفسها"],"كسر دائرة الفشل يبدأ بخبرة إتقان صغيرة (أقوى مصدر للكفاءة الذاتية) مع تعزيز الجهد. الإعفاء يثبت عجزها، والمقارنة تزيد الإحباط."],
["L14","","أفضل طريقة لصياغة أهداف تعلم ترفع دافعية طالب متوسط المستوى:",["أهداف قصيرة المدى واضحة فيها تحدٍّ مناسب لقدراته","أهداف بعيدة المدى عامة الصياغة","أهداف سهلة جداً يضمن تحقيقها دون جهد","أهداف يحددها المعلم دون إطلاع الطالب عليها"],"الأهداف القصيرة الواضحة تمنح نجاحات متتابعة محسوسة، والتحدي المناسب يحفظ الاهتمام. السهلة جداً تُملّ، والبعيدة العامة لا تُشعر بالتقدم."],
["L14","h","لاحظ معلم شعور بعض طلابه بالملل وقلة الحماس وانتظار انتهاء الحصة. أي الآتي لا يُعد من أساليب إثارة الدافعية؟",["إثارة التنافس من خلال مقارنة أداء الطالب بغيره","ربط الدرس بواقع حياة الطلاب","التعزيز الإيجابي اللفظي والمادي","توظيف التقنية في الدرس"],"المقارنة بالآخرين تحفز المتفوقين فقط وتحبط البقية. البدائل الأخرى أساليب معتمدة لإثارة الدافعية."],
["L14","m","يمنح معلم جائزة مادية عن كل إجابة صحيحة مهما كانت بسيطة. الأثر المتوقع لهذا الأسلوب على المدى البعيد:",["إضعاف الدافعية الداخلية للتعلم","زيادة الدافعية الداخلية","ارتفاع تقدير الذات","تعلم أعمق وأكثر استمراراً"],"الإفراط في المكافآت الخارجية يجعل الطالب يتعلم من أجل الجائزة لا من أجل المعرفة، فتضعف الدافعية الداخلية. التعزيز المادي مفيد مؤقتاً مع الطلاب الذين لا يُحفَّزون داخلياً."],
["L14","","أثر بجماليون في الصف يعني أن:",["توقعات المعلم عن الطالب تتحول إلى نبوءة تحقق ذاتها","الطلاب يقلدون سلوك المعلم بالملاحظة","الدافعية تزداد بزيادة المكافآت","التعلم يحدث بتعزيز التقريبات المتتابعة"],"بجماليون (روزنثال وجاكوبسون): من توقع المعلم تفوقه تفوق فعلاً. التقليد نمذجة، والتقريبات تشكيل."],
["L14","","وفق باندورا، المصدر الأقوى للكفاءة الذاتية لدى الطالب هو:",["خبرات الإتقان الشخصية الناجحة","الإقناع اللفظي من المعلم","ملاحظة نجاح الأقران","الحالة الانفعالية والجسمية"],"النجاح الفعلي في مهمة سابقة أقوى دليل للطالب على قدرته. ملاحظة الأقران والإقناع اللفظي مصادر أضعف."],
["L14","m","حصلت طالبة على درجة متدنية في مهمة كتابية. أي التعليقات يعكس توقعات عالية وتغذية راجعة وصفية معاً؟",["«مقدمتك واضحة ومرتبة، وتحتاجين إلى دليل يدعم الفقرة الثانية، أعيدي كتابتها وسأراجعها»","«ضعيف، راجعي الدرس»","«حاولي أكثر في المرة القادمة»","«زميلتك كتبت أفضل منك، انظري إلى ورقتها»"],"التعليق الأول يسمي نقطة القوة ونقطة التحسين وكيفيتها ويطلب محاولة أخرى. البدائل الأخرى إما حكم عام أو مقارنة بالأقران."],
["L14","m","أي الأوصاف الآتية يدل على طالب ذي دافعية داخلية للتعلم؟",["يعمل بجد حتى عندما لا تُرصد له درجات","لا يبدأ العمل إلا بوعد بمكافأة","يختار دائماً أسهل المهام المتاحة","يتوقف عن العمل عند غياب المعلم"],"الدافعية الداخلية تظهر في المثابرة بلا مقابل خارجي واختيار المهام المتحدية. انتظار المكافأة دافعية خارجية."],
["L14","h","أي المواقف الآتية يقوم بها المعلم ومن شأنها أن تعزز التعلم في إطار العلاقات الإنسانية؟",["يتعاطف مع طلابه ويعاملهم كأفراد متميزين","يستخدم طرق تدريس تناسب جميع طلابه","يلتزم بالمنهج المقرر بدقة","يكافئ المتفوقين وحدهم"],"العلاقات الإنسانية تقوم على التعاطف وتقدير كل طالب فرداً. تنويع طرق التدريس إجراء تدريسي لا علائقي، وهو أقوى مشتت."],
["L14","","جميع ما يلي من مؤشرات التوقعات العالية في ممارسات المعلم ما عدا:",["إعطاء الطلاب الضعاف أسئلة أسهل دائماً وزمن انتظار أقصر","توزيع الأسئلة التي تتطلب تفكيراً على جميع الطلاب","انتظار إجابة الطالب المتردد وتشجيعه","الإصرار على إكمال المهمة مع تقديم الدعم"],"حصر الضعاف في الأسئلة السهلة واستعجالهم رسالة ضمنية بأنهم غير قادرين، وهو عكس التوقعات العالية."],
["L14","m","يبدأ معلم كل حصة بسؤال طلابه عما يريدون إتقانه فيها، ويعلّق في نهاية الأسبوع تقدم كل طالب مقارنة بأدائه السابق لا بزملائه. يرسخ هذا:",["ثقافة توقعات عالية وتقديراً للجهد","التنافس بين الطلاب","الدافعية الخارجية فقط","الضبط الصفي الصارم"],"المقارنة بالذات وتحديد أهداف شخصية تؤكد أن كل طالب قادر على التقدم وأن الجهد هو المعيار."],
["L14","","يريد معلم أن يرفع ثقة طالب متدني التحصيل بنفسه. الأنسب أن:",["يشركه في مجموعة متميزة بدور يستطيع أداءه بنجاح","يعفيه من المشاركة حتى يتحسن مستواه","يذكره دائماً بضرورة بذل الجهد","يعلن درجاته أمام الصف ليتحفز"],"إشراكه في مجموعة ناجحة بدور في متناوله يمنحه خبرة إتقان وانتماء. الإعفاء والتذكير بالجهد لا يقدمان نجاحاً محسوساً، والإعلان عن الدرجات يحرجه."],
// ===== 9.2 قيادة الأنشطة الصفية =====
["L14","hm","«تهيئة الفرص لتعلم الطلاب ليصبحوا متعلمين مدى الحياة بحيث ينهمكون في تعلم تعاوني يسوده الاحترام والتشجيع». هذا المصطلح يعني:",["إدارة الصف الفعالة","ثقافة التعلم الصفية","التعلم التشاركي","إثارة الدافعية"],"هذا التعريف الحديث لإدارة الصف الفعالة: تهيئة فرص التعلم لا الضبط فقط. التعلم التشاركي والدافعية جزء منها لا مرادف لها."],
["L14","h","يُقصد بمفهوم إدارة الصف:",["تنظيم البيئة التعليمية على نحو يساعد على التعلم","استيعاب الطلاب للقواعد والأنظمة الصفية","توظيف ما لدى المعلم من خبرات","الاهتمام بحل المشكلات الطارئة بحزم"],"إدارة الصف تنظيم شامل للبيئة المادية والنفسية والاجتماعية. حل المشكلات بحزم جزء ضيق منها يركز على الضبط."],
["L14","h","إدارة الصف إدارة جيدة تتطلب من المعلم أن:",["يوفر الجو الاجتماعي والانفعالي الذي يحقق العدل والاحترام في الصف","يتصف بالشدة في تعامله لئلا ينصرف الطلاب عن التعلم","يتصف باللين في تعامله لئلا يعوقهم عن المشاركة","يتخذ قرارات صارمة ضد الطلاب المخالفين"],"الشدة تسلط واللين فوضى، والإدارة الجيدة ديمقراطية توازن بين الحزم والاحترام."],
["L14","hm","من ركائز العملية التعليمية العلاقة الإيجابية بين المعلم والطالب، إلا أن الإفراط فيها يأخذ منحنى سلبياً يتمثل في إضعاف مكانة المعلم. يوصف هذا النمط في الإدارة الصفية بأنه:",["فوضوي","تسلطي","ديمقراطي","شوري"],"الود بلا ضوابط حتى تذوب شخصية المعلم بين الطلاب هو النمط الفوضوي. الديمقراطي فيه حوار مع ضوابط واضحة، وهو أقوى مشتت."],
["L14","","معلم يرى نفسه المصدر الوحيد للمعلومات، ويتوقع من طلابه الطاعة التامة، ويعتمد على الثواب والعقاب، ويخشاه الطلاب. نمط إدارته:",["تسلطي","فوضوي","ديمقراطي","تشاركي"],"الخوف والطاعة التامة والاحتكار سمات النمط التسلطي، وآثاره اتكالية الطلاب ودافعية خارجية مصدرها الرهبة."],
["L14","","من الآثار السلبية للنمط التسلطي في الإدارة الصفية على الطلاب:",["الاتكالية ودافعية خارجية مصدرها الخوف من المعلم","زيادة النقد والإبداع لديهم","قوة الانضباط الذاتي","ارتفاع تقدير الذات"],"التسلط يجعل التعديل في السلوك مرتبطاً بزمن الرهبة، فيفشل الطالب في وضع أهداف لنفسه ويعتمد كلياً على المعلم."],
["L14","hm","لضبط إدارة الصف في أمور كدخول الطلاب وخروجهم ومشاركتهم أثناء الدرس، يُنصح المعلم بأن:",["يضع مبادئ وقواعد يناقشها مع الطلاب ويلزمهم باتباعها","يعوّد الطلاب على عدم دخول الفصل بعده أو المشاركة دون إذنه","يمنح الطلاب الحرية في الدخول والخروج والمشاركة بهدوء","يترك الأمور تسير على طبيعتها ووقت حدوثها"],"القواعد المتفق عليها مع الطلاب تحقق الانضباط الذاتي. البديل الثاني تسلطي، والثالث والرابع فوضويان."],
["L14","h","اتفق المعلم مع طلابه على معايير لضبط الصف مثل رفع اليد قبل طرح السؤال، وهذا مؤشر على إدارة فاعلة، لكن يجب أن تكون تلك المعايير:",["متسقة مع قواعد الانضباط التي أقرتها وزارة التعليم","متضمنة توقعات الطلاب وأولياء الأمور معاً","متطابقة مع معايير المعلمين الآخرين في المدرسة","متضمنة قواعد تنص على عقوبات محسوسة لكل مخالفة"],"القواعد الصفية فرع من لائحة السلوك والمواظبة ولا يجوز أن تخالفها. العقوبات المحسوسة لكل مخالفة تحول القواعد إلى أداة عقاب."],
["L14","h","الأنسب في تنفيذ قواعد إجراءات النشاط الصفي أن المعلم:",["يشرحها لطلابه ويقنعهم بها حتى يطبقوها ذاتياً","يكتبها في الفصل ويلزم الطلاب بها دون نقاش","يغيرها كل حصة حتى لا يشعر الطلاب بالملل","يحتفظ بها لنفسه ويربط درجات الاختبار بها"],"الإقناع يحول القاعدة من نظام خارجي إلى انضباط ذاتي. الإلزام دون نقاش تسلط، وتغييرها كل حصة يفقدها الثبات."],
["L14","h","أي الآتي يُضعف فاعلية الإجراءات والقواعد الصفية الداعمة للتعلم؟",["التمسك بها دون مراجعة أو تعديل عند الحاجة","وضعها بالاتفاق مع الطلاب في بداية العام","صياغتها بعبارات قليلة وواضحة","ربطها بقواعد المدرسة العامة"],"القواعد تحتاج ثباتاً لكنها تُراجع إذا ظهر أنها لا تخدم التعلم؛ الجمود يفقدها معناها. مفتاح الملخصات المتداولة يضع هذا البديل جواباً لسؤال صيغ بـ«يؤثر في»، والمقصود الأثر السلبي."],
["L14","m","الخصائص الأنسب للقواعد الصفية:",["قليلة، واضحة، إيجابية الصياغة، يشارك الطلاب في وضعها","كثيرة لتغطي كل المواقف المحتملة","تُصاغ بالنهي لتكون حازمة","يضعها المعلم وحده ويعلنها في منتصف الفصل الدراسي"],"القواعد القليلة الواضحة تُحفظ وتُطبق، والصياغة الإيجابية تصف السلوك المطلوب لا الممنوع، والمشاركة تولد الالتزام."],
["L14","","معلم يتابع ما يجري في كل أركان الصف وهو يشرح، ويتدخل عند أول بوادر تشويش قبل أن تتسع. هذه المهارة سماها كونين:",["اليقظة (الوعي بما يجري)","التداخل","الزخم","أثر الموجة"],"اليقظة withitness هي إدراك كل ما يحدث وإشعار الطلاب بذلك. التداخل معالجة أمرين معاً، والزخم استمرار الدرس بلا توقف."],
["L14","","تساعد المعلمة طالبة في مقعدها، وفي الوقت نفسه توقف همساً في الصف الخلفي بنظرة وإشارة دون أن تقطع المساعدة. المهارة:",["التداخل (معالجة أمرين في وقت واحد)","اليقظة","تنبيه المجموعة","السلاسة"],"التداخل overlapping عند كونين هو القدرة على إدارة موقفين متزامنين. اليقظة هي الوعي، أما التداخل فهو الفعل المتزامن."],
["L14","","يقصد بأثر الموجة في إدارة الصف عند كونين أن:",["طريقة معالجة المعلم لسلوك طالب واحد تؤثر في سلوك بقية الطلاب","الفوضى تنتقل من طالب إلى آخر بالتقليد","تكرار القاعدة يثبتها لدى الطلاب","العقوبات تتدرج في الشدة"],"أثر الموجة ripple effect: حين يعالج المعلم سلوك طالب بوضوح وهدوء، يضبط الآخرون سلوكهم تلقائياً."],
["L14","m","يفقد المعلم دقائق كثيرة كلما انتقل من الشرح إلى العمل في مجموعات. الإجراء الأنسب:",["تدريب الطلاب على إجراء روتيني ثابت للانتقال مع تحديد الأدوار والأماكن مسبقاً","إلغاء العمل في مجموعات حفاظاً على الوقت","معاقبة من يتأخر في الانتقال","تمديد الحصة لتعويض الوقت الضائع"],"الانتقالات السلسة من مهارات إدارة الوقت الأكاديمي وتُبنى بإجراءات روتينية مدرَّبة. الإلغاء يضحي بالاستراتيجية، والعقاب يعالج العرض."],
["L14","hm","في الحصة السادسة لاحظت المعلمة فتور معظم طالبات الصف السادس وتثاؤب بعضهن وأن إحداهن أوشكت أن تنام. الإجراء الأكثر ملاءمة:",["تنفذ نشاطاً حركياً قصيراً يعيد تفاعلهن ثم تستكمل الدرس","تذكرهن بأن أسئلة الاختبار مرتبطة بانتباههن","تواصل الشرح وتتغاضى حفاظاً على سير الدرس","تنقل من أوشكت أن تنام إلى المقعد الأمامي"],"فتور الأغلبية مشكلة في إيقاع الدرس لا في طالبة واحدة، فيُعالج بكسر الروتين. التهديد بالاختبار والنقل يعالجان عرضاً فردياً."],
["L14","h","لاحظ المعلم علامات ضعف الانتباه والعزوف عن المشاركة لدى بعض طلابه. الطريقة المناسبة للتعامل:",["التنقل بين الطلاب واستخدام الإيماءات والإشارات","استخدام طرق التدريس المتمركزة حول المعلم","إنهاء الدرس فوراً وإعطاء فترة استراحة","تغيير أماكن الطلاب الذين ظهر عليهم ضعف الانتباه فقط"],"حركة المعلم والتواصل غير اللفظي يعيدان الانتباه دون قطع الدرس. التمركز حول المعلم سبب أصلاً لضعف الانتباه."],
["L14","m","أي ترتيب للمقاعد أنسب لحصة قائمة على نقاش مفتوح يتبادل فيه الطلاب الآراء؟",["حرف U أو دائرة بحيث يرى الطلاب بعضهم","صفوف متوازية تواجه السبورة","مجموعات متباعدة منعزلة","مقاعد فردية على جدران الصف"],"ترتيب المقاعد يتبع نوع النشاط: الصفوف للعرض، والمجموعات للتعاون، وحرف U للنقاش الذي يتطلب تواصلاً بصرياً بين الجميع."],
["L14","","عند تكوين مجموعات تعاونية لمهمة مشتركة، الأفضل أن تكون المجموعات:",["غير متجانسة في المستوى وبأدوار محددة لكل عضو","متجانسة في المستوى يختارها الطلاب بأنفسهم","كبيرة العدد لتقليل عدد المجموعات","متغيرة الأعضاء كل عشر دقائق"],"عدم التجانس يحقق معاونة الأفراد لبعضهم (الهدف الأول للتعاوني) والأدوار تضمن المسؤولية الفردية. العدد المناسب 4–6."],
["L14","","في نشاط جماعي لاحظ المعلم أن طالباً واحداً ينجز كل العمل بينما يتفرج الباقون. الإجراء الأنسب:",["توزيع أدوار محددة على الأعضاء ومحاسبة كل طالب على جزئه","حل المجموعة وتكليف كل طالب بالعمل فردياً","مكافأة الطالب النشط أمام المجموعة","تقليل حجم المهمة المطلوبة"],"المسؤولية الفردية والاعتماد المتبادل شرطا التعلم التعاوني، وتتحققان بالأدوار ومحاسبة كل عضو. حل المجموعة تخلٍّ عن الاستراتيجية."],
["L14","","دور المعلم أثناء عمل الطلاب في مجموعات:",["ميسّر يتنقل بين المجموعات ويوجهها بالأسئلة","ملقّن يشرح المهمة من مكانه","مراقب صامت لا يتدخل حتى النهاية","مصحح يتابع الدفاتر في مكتبه"],"في التعلم النشط المعلم ميسّر ومرشد: يتابع ويسأل ويوجه دون أن يسيطر أو ينسحب."],
["L14","","كلف المعلم طلابه بواجب صفي مدته 15 دقيقة، فأنهاه أحدهم قبل الوقت وبدأ يتحدث مع زميله. الإجراء المناسب:",["تزويده بنشاط إثرائي مرتبط بالدرس","توبيخه أمام زملائه","تكليفه بإعادة حل الواجب","تجاهله حتى ينتهي الوقت"],"الطالب الذي ينهي عمله مبكراً يحتاج مهمة لا عقوبة؛ النشاط الإثرائي يستثمر وقته ويمنع التشويش. الإعادة عقاب على الإنجاز."],
["L14","m","نشب شجار بين طالبين أثناء الحصة. أول ما يفعله المعلم:",["يحافظ على هدوئه ويفصل بينهما ويشغل بقية الطلاب بنشاط ثم يعالج الأمر","يوقف الحصة ويحقق معهما أمام الجميع","يستدعي مدير المدرسة فوراً","يعاقب الطالبين معاً دون سؤال"],"السيطرة على الأزمة: هدوء، عزل المتسببين، إشغال الآخرين، ثم معالجة فردية. التحقيق العلني يصعّد، والاستدعاء الفوري تصعيد قبل المعالجة."],
["L14","h","استمر طالب في إثارة الفوضى داخل الفصل والفناء والحافلة المدرسية رغم إجراءات المعلم وجلسات المرشد الطلابي معه. وفق الدليل التنظيمي لمدارس التعليم العام ولائحة السلوك والمواظبة، الجهة الإدارية داخل المدرسة التي تتولى متابعة سجل سلوكه ومواظبته وتطبيق إجراءات اللائحة هي:",["وكيل المدرسة لشؤون الطلاب","المشرف التربوي للمادة","مدير التعليم بالمنطقة","المعلم الأول للمادة"],"متابعة سجل السلوك والمواظبة وتطبيق درجات المخالفات من مهام وكيل شؤون الطلاب بالتنسيق مع المرشد ولجنة التوجيه والإرشاد. المشرف ومدير التعليم خارج المدرسة، والمعلم الأول شأنه المادة لا السلوك. مفتاح الملخصات المتداولة: وكيل المدرسة."],
["L14","","من مهارات إدارة الوقت الأكاديمي في الحصة:",["إجراءات روتينية ثابتة لبدء الحصة وإنهائها","تمديد الشرح على حساب النشاط","تأجيل التهيئة إلى آخر الحصة","الاستطراد لإبعاد الملل"],"الروتين الثابت يوفر الوقت الضائع في البدايات والنهايات. الاستطراد والتمديد يهدران الوقت."],
["L14","m","معلم جديد يرغب في بناء خطة لإدارة صفه. أنسب خطوة يبدأ بها:",["مراقبة المعلمين الفعالين في المدرسة والاستفادة من خبراتهم","قراءة كتب عن التعامل مع الأسر والمجتمع","مناقشة الصعوبات مع المدير وطلب تقويم متكرر","التعاون مع المعلمين الجدد فقط ومناقشة صعوباتهم"],"الخبرة الصفية الحية للمعلمين الفعالين أقرب مصدر للمعلم الجديد. الجدد يفتقرون إلى الخبرة نفسها، والكتب عن الأسر بعيدة عن إدارة الصف."],
// ===== 9.3 (أ) تعديل السلوك =====
["L14","h","رأى معلم التزام طالب وانضباطه فألغى عنه إنذاراً سابقاً. هذا الإجراء:",["تعزيز سالب","تعزيز موجب","عقاب سالب","عقاب موجب"],"أُزيل مثير منفّر (الإنذار) بعد سلوك مرغوب لزيادته، وهذا تعزيز سالب. العقاب السالب سحب معزز لتقليل سلوك غير مرغوب."],
["L14","hm","يستخدم المعلم التعزيز السالب في الموقف التعليمي من أجل:",["تقوية السلوك المرغوب","إضعاف السلوك غير المرغوب","إطفاء السلوك","المحافظة على السلوك كما هو"],"التعزيز بنوعيه يزيد السلوك؛ كلمة سالب تعني الإزالة لا الإضعاف. الإضعاف وظيفة العقاب والإطفاء."],
["L14","h","قررت مدرسة أهلية إعفاء الطالب الحاصل على تقدير ممتاز من رسوم الفصل التالي. هذا الإجراء:",["تعزيز سالب","تعزيز موجب","عقاب سالب","عقاب موجب"],"الرسوم مثير منفّر أُزيل بعد سلوك مرغوب (التفوق) لزيادته؛ فهو تعزيز سالب. لو أُعطي الطالب جائزة لكان تعزيزاً موجباً."],
["L14","m","كلما أنجز الطالب واجبه كتب المعلم عبارة ثناء في دفتره، فازداد التزامه بالواجب. الإجراء:",["تعزيز موجب","تعزيز سالب","عقاب سالب","انطفاء"],"أُضيف مثير سارّ (الثناء) بعد السلوك فزاد، وهذا تعزيز موجب."],
["L14","","وبّخ المعلم طالباً أمام زملائه بعد مقاطعته، فقلّت مقاطعاته. من حيث التصنيف السلوكي هذا:",["عقاب موجب","عقاب سالب","تعزيز سالب","تكلفة استجابة"],"أُضيف مثير منفّر (التوبيخ) فقلّ السلوك، وهذا عقاب موجب. تربوياً التوبيخ العلني مرفوض وإن كان فعالاً مؤقتاً."],
["L14","h","يفقد الطالب ثلاث درجات من درجات المشاركة لعدم تسليم الواجب في الوقت الذي حدده المعلم. يُعد ذلك:",["تكلفة الاستجابة","التصحيح الزائد","التعزيز السالب","المحو"],"فقدان معزز مكتسب (درجات) بسبب السلوك هو تكلفة الاستجابة، وهي صورة من العقاب السالب. التصحيح الزائد يتطلب إزالة ضرر وأعمالاً إضافية."],
["L14","hm","حُوِّل طالب إلى المرشد لأنه ضرب زميله وخرب المقعد الذي يجلس عليه، فاتفق المرشد معه على أن يعتذر لزميله ويحضر مقعداً جديداً. الأسلوب الذي استخدمه المرشد:",["التصحيح الزائد","تكلفة الاستجابة","الإقصاء","التعزيز السالب"],"إزالة الضرر (المقعد) مع عمل إضافي (الاعتذار) هو التصحيح الزائد. تكلفة الاستجابة فقدان معزز لا إصلاح ضرر."],
["L14","h","كسر طالب لوح زجاج النافذة عمداً، فقرر مدير المدرسة أن يدفع الطالب ثمن اللوح من مصروفه الشخصي. يستخدم المدير أسلوب:",["تكلفة الاستجابة","التصحيح الزائد","الإقصاء","التعزيز السالب"],"فقدان شيء يملكه الطالب (ماله) نتيجة سلوكه هو تكلفة الاستجابة، وهي عقاب سالب. لو كُلّف بتركيب اللوح وتنظيف الزجاج المتناثر وتلميع بقية النوافذ لكان تصحيحاً زائداً، ولو عُزل عن النشاط مدة محددة لكان إقصاءً. مفتاح الملخصات المتداولة لصيغة «إحضار لوح بدلاً منه»: تكلفة الاستجابة."],
["L14","","سكب طالب العصير على أرضية الفصل، فطلبت منه المعلمة تنظيف المكان الذي سكبه فيه فقط. الأسلوب:",["التصحيح البسيط","التصحيح الزائد","تكلفة الاستجابة","الإقصاء"],"إزالة الضرر بقدر الخطأ دون أعمال إضافية هو التصحيح البسيط؛ لو كُلف بتنظيف بقية الفصل لصار تصحيحاً زائداً."],
["L14","hm","أثناء حصة التربية البدنية دفع طالب زميله عمداً، فأجلسه المعلم على مقعد جانب الملعب خمس دقائق يراقب زملاءه دون أن يشارك، ثم أعاده إلى اللعب. الأسلوب:",["الإقصاء (العزل المؤقت عن البيئة المعززة)","تكلفة الاستجابة","التعزيز السالب","الانطفاء"],"عزل الطالب عن النشاط المعزز مدة قصيرة محددة ثم إعادته هو الإقصاء (مثال ملزمة الجهني: الحرمان المؤقت من النشاط). تكلفة الاستجابة فقدان كمية من معزز مكتسب كدرجات أو نقاط لا عزل عن المكان، والانطفاء حجب تعزيز السلوك نفسه."],
["L14","h","سأل المعلم سؤالاً فوقف طالب يلوح بيده صائحاً «أنا أعرف»، فلم يمنحه المعلم فرصة الإجابة، وأعطاها لمن رفع يده بهدوء. ما فعله المعلم:",["إطفاء السلوك غير المرغوب مع تعزيز السلوك البديل","عقاب موجب","تكلفة استجابة","تشكيل"],"حجب التعزيز (فرصة الإجابة) عن الصياح هو الإطفاء، وإعطاء الفرصة للهادئ تعزيز تفاضلي للبديل. لم يُضف منفّر ولم يُسحب معزز مكتسب."],
["L14","h","«الانطفاء» من الأنماط التي يستخدمها المعلم لتحقيق بيئة صفية فعالة، ويُقصد به:",["تجاهل المعلم للسلوك غير المناسب حتى يتلاشى","كف المعلم السلوكيات غير المناسبة في وقت مبكر","تأنيب المعلم للمتعلم الذي أصدر السلوك منفرداً","إبعاد المتعلم الذي أصدر السلوك من الموقف التعليمي"],"الانطفاء حجب التعزيز عن السلوك فيتلاشى، وأبرز صوره التجاهل المقصود. الإبعاد إقصاء، والتأنيب عقاب موجب."],
["L14","hm","من الأساليب التربوية البديلة للعقاب عند صدور سلوك بسيط غير مرغوب فيه (كتعليق جانبي لجذب الانتباه) من أحد الطلاب لأول مرة:",["التجاهل المقصود حتى لا يتكرر هذا السلوك","طرده من الفصل حتى يتعظ زملاؤه","معاقبته أمام زملائه حتى يرتدع","إحالته إلى إدارة المدرسة لاتخاذ إجراء مناسب"],"السلوك البسيط أول مرة غالباً لجذب الانتباه، والتجاهل المقصود يحرمه من التعزيز. الإحالة للإدارة تصعيد في توقيت خاطئ، والطرد والعقاب العلني مرفوضان. أما العدوان على زميل فلا يُتجاهل بل يُوقف ويُنبَّه صاحبه."],
["L14","h","«الاستجابات الأكثر تكراراً تعزز الاستجابات الأقل تكراراً» مبدأ وضعه:",["ديفيد بريماك","سكنر","ثورندايك","باندورا"],"هذا مبدأ بريماك: النشاط المحبب (كثير التكرار) يُجعل معززاً للنشاط الأقل حباً. سكنر صاحب الإشراط الإجرائي عموماً."],
["L14","m","قال المعلم لطلابه: «من ينهي تمارين الصفحة يحصل على عشر دقائق في ركن القراءة الحرة». يطبق المعلم:",["مبدأ بريماك","الاقتصاد الرمزي","تكلفة الاستجابة","التحصين التدريجي"],"نشاط محبب (القراءة الحرة) اشتُرط بإنهاء نشاط أقل حباً (التمارين)، وهذا بريماك. الاقتصاد الرمزي يحتاج رموزاً تُجمع وتُستبدل."],
["L14","h","يجمع الطلاب نجوماً عند كل سلوك إيجابي ثم يستبدلونها في نهاية الأسبوع بجوائز. هذا النظام:",["الاقتصاد الرمزي","مبدأ بريماك","العقد السلوكي","التعزيز المتقطع"],"المعززات الرمزية (النجوم) التي تُستبدل لاحقاً بمعززات حقيقية هي الاقتصاد الرمزي."],
["L14","hm","وثيقة مكتوبة بين المعلم والطالب يُحدد فيها السلوك المطلوب منه ونوع المكافأة تسمى:",["العقد السلوكي","التشكيل","ضبط الذات","الإرشاد بالواقع"],"العقد السلوكي اتفاق مكتوب بين طرفين بالتفاوض: الطالب يتعهد بسلوك والمعلم يتعهد بتعزيزه."],
["L14","h","اتفق معلم الرياضيات والمرشد الطلابي على نقل طالب متأخر دراسياً إلى جوار طالب متفوق محبوب لديه. يُعد هذا الأسلوب العلاجي:",["نمذجة","تشكيلاً","تلقيناً","تدريس أقران"],"الطالب يلاحظ النموذج المتفوق ويقلده، وهذه النمذجة (التعلم بالملاحظة). تدريس الأقران يتطلب تكليف المتفوق بالشرح، ولم يُذكر."],
["L14","m","عند تعليم طفل الكتابة يعزز المعلم أولاً مسكه القلم صحيحاً، ثم الكتابة على السطر، ثم استقامة الحروف حتى يتقن. الأسلوب:",["التشكيل","التسلسل","التلقين","النمذجة"],"تعزيز التقريبات المتتابعة نحو السلوك النهائي هو التشكيل (تدرج في الاستجابة). التسلسل تعزيز كل حلقة من حلقات مرتبطة تكوّن سلوكاً عاماً."],
["L14","h","تعزيز المتعلم عند تأدية كل حلقة من حلقات السلسلة السلوكية يسمى:",["التسلسل","التشكيل","الإفاضة","التلقين"],"التسلسل يتعامل مع حلقات مترابطة تُعزز واحدة واحدة، بخلاف التشكيل الذي يعزز تقريبات سلوك واحد."],
["L14","h","الإمساك بيد التلميذ لمساعدته في رسم حرف هجائي مثال على:",["التلقين الجسدي","النمذجة","التشكيل","السحب التدريجي"],"التلقين تلميح يجعل الاستجابة أكثر حدوثاً، وأنواعه لفظي وإيمائي وجسدي. النمذجة تتطلب أن يراقب الطالب نموذجاً يؤدي السلوك."],
["L14","h","طالب خجول يخشى الحديث أمام زملائه، فدربه المعلم على التحدث أمام زميل مقرب، ثم زميلين، ثم أمام الصف. الأسلوب:",["التحصين التدريجي","الغمر","التشكيل","الإقصاء"],"التعرض المتدرج من الأسهل إلى الأصعب لإزالة الخوف هو التحصين التدريجي. الغمر مواجهة دفعة واحدة."],
["L14","h","طالب يمتنع كلياً عن الحديث أمام زملائه، فطلب منه المرشد إعداد كلمة وإلقاءها أمام طلاب المدرسة مباشرة ليواجه خوفه. الأسلوب:",["الغمر (الإغراق)","التحصين التدريجي","التلقين","النمذجة"],"مواجهة المثير المخيف دفعة واحدة دون تدرج هي الغمر. التحصين يتدرج خطوة خطوة."],
["L14","h","طالب يتحدث دائماً مع زميل مجاور أثناء الشرح، فنقله المعلم إلى مكان آخر فقلّ الحديث. الأسلوب:",["ضبط المثير","الإقصاء","تكلفة الاستجابة","التصحيح الزائد"],"إعادة ترتيب البيئة لتقليل السلوك هي ضبط المثير. الإقصاء عزل عن البيئة المعززة مدة محددة لا تغيير مقعد."],
["L14","m","أي الآتي يزيد فاعلية التعزيز؟",["أن يكون فورياً عقب السلوك مباشرة","أن يؤجل إلى نهاية الأسبوع ليجمع السلوكيات","أن يكون معززاً واحداً لجميع الطلاب","أن يُقدم بغض النظر عن السلوك"],"الفورية أهم شروط التعزيز لأنها تربطه بالسلوك مباشرة. التنوع ومراعاة الفروق شرطان آخران، وتقديمه بلا سلوك يفقده معناه."],
["L14","","لاكتساب الطالب سلوكاً جديداً يُفضل أن يكون التعزيز:",["متواصلاً في كل مرة ثم ينتقل إلى المتقطع","متقطعاً من البداية","مؤجلاً حتى يثبت السلوك","رمزياً فقط"],"المتواصل يبني السلوك الجديد، ثم المتقطع يحافظ عليه ويجعله أكثر مقاومة للانطفاء."],
["L14","","جميع ما يلي يقلل السلوك غير المرغوب ما عدا:",["التعزيز السالب","تكلفة الاستجابة","الإقصاء","الانطفاء"],"التعزيز السالب يزيد السلوك المرغوب بإزالة منفّر. البدائل الثلاثة تقلل السلوك: اثنان عقاب سالب والثالث حجب تعزيز."],
["L14","","أعفى المعلم طالباً من الواجب المنزلي لأنه شارك بفاعلية طوال الحصة. الإجراء:",["تعزيز سالب","تعزيز موجب","عقاب سالب","انطفاء"],"أُزيل مثير يراه الطالب منفّراً (الواجب) بعد سلوك مرغوب لزيادته، وهذا تعزيز سالب."],
["L14","m","تجاهل المعلم تشويش طالب، ثم أثنى عليه فور أن انشغل بالعمل الصفي. الإجراء:",["التعزيز التفاضلي للسلوك البديل","العقاب السالب","التشكيل","التلقين"],"الجمع بين إطفاء السلوك غير المرغوب وتعزيز نقيضه هو التعزيز التفاضلي، وهو أفعل من الإطفاء وحده."],
["L14","","أي الآتي ممنوع تربوياً ونظامياً في التعامل مع مخالفات الطلاب؟",["العقاب البدني والتشهير","تكلفة الاستجابة","الإقصاء المؤقت","التصحيح الزائد"],"ميثاق الأخلاقيات ولائحة السلوك يمنعان العقاب البدني والنفسي والإهانة. البدائل الأخرى أساليب تعديل سلوك مقبولة بضوابط."],
["L14","","طالب يرفع يده دائماً ويجيب إجابات صحيحة، لكن المعلم نادراً ما يناديه مفضلاً الطلاب الصامتين، فقلّ رفعه ليده بعد أسابيع. التفسير:",["انطفاء السلوك لغياب التعزيز","عقاب سالب","تعزيز سالب","تعميم"],"السلوك الذي لا يُعزز يتلاشى، وهذا الانطفاء. لم يُسحب شيء يملكه الطالب فلا عقاب سالب."],
["L14","m","أخرج المعلم طالباً ليقف في الممر عشر دقائق كلما شوّش. التصنيف السلوكي لهذا الإجراء وحكمه التربوي:",["إقصاء (عقاب سالب)، وإخراج الطالب من الفصل مرفوض لأنه يحرمه من التعلم ويخلّ بالإشراف عليه","تعزيز سالب وهو مقبول","انطفاء وهو الأسلوب الأمثل","تكلفة استجابة وهو مقبول"],"الإخراج عزل عن بيئة الصف فهو إقصاء من حيث التصنيف، لكنه يفقد الطالب التعلم ويتركه بلا إشراف وقد يعززه إن كان يكره الحصة؛ لذلك لا يُستخدم الإقصاء إلا داخل الصف ولمدة قصيرة، والطرد كعقوبة مرفوض في اللائحة."],
["L14","","ليتجنب المعلم إشباع الطالب من المعزز، عليه أن:",["ينوّع المعززات ويقدمها بما يتناسب مع الاستجابة","يقدم المعزز نفسه بعد كل استجابة","يزيد كمية المعزز باستمرار","يوقف التعزيز نهائياً"],"الإشباع يُضعف أثر المعزز، والحل التنويع (لفظي، رمزي، نشاط) والتناسب مع حجم الاستجابة."],
// ===== 9.3 (ب) المشكلات السلوكية والفئات والسلامة =====
["L14","hm","عبدالرحيم طالب خجول جداً ومنطوٍ على ذاته، لا يسأل أبداً خلال الحصة، ويعاني كثيراً عندما يوجه إليه سؤال، ويبدو حزيناً دائماً مما جعل زملاءه يسخرون منه. الخطوة الأولى لحل مشكلته:",["بناء علاقة إنسانية جيدة معه ليكسب المعلم ثقته أولاً ثم مساعدته","إحالته إلى المرشد الطلابي لدراسة حالته","إشعار مدير المدرسة ولجنة التوجيه والإرشاد","تكليفه بالإلقاء أمام الصف ليتغلب على خجله"],"الخجول يحتاج أماناً نفسياً قبل أي إجراء، فالثقة هي الخطوة الأولى. الإحالة خطوة لاحقة إن لم تنجح جهود المعلم، والإلقاء المباشر غمر يزيد الخوف."],
["L14","h","لدى أحد المعلمين طالب خجول. التصرف التربوي السليم معه:",["دعمه وتشجيعه على المشاركة تدريجياً","ترك الحرية له في المشاركة من عدمها","مراعاة ظروفه بعدم إشراكه","تحويله إلى المرشد الطلابي"],"الدعم والتدرج يبنيان ثقته. ترك الحرية أو عدم إشراكه يثبتان خجله، والتحويل الفوري تصعيد قبل محاولة المعلم."],
["L14","h","من الأخطاء في التعامل مع الطالب الخجول:",["تجنب توجيه الأسئلة إليه حتى لا يحرج","تكليفه بمهام سهلة ينجح فيها","استخدام التواصل غير اللفظي المشجع معه","تقديم التعزيز الفوري عند مشاركته"],"تجنب سؤاله يحرمه فرص النجاح ويرسخ انسحابه؛ الصواب أسئلة في متناوله مع تشجيع وتعزيز."],
["L14","h","طالب كثير الحركة لا يستقر في مقعده ويزعج من حوله. الإجراء الأنسب:",["تغيير مكانه قريباً من المعلم وإشراكه في مهام فيها حركة مشروعة","حرمانه من الفسحة حتى يهدأ","إجباره على الجلوس بلا حركة طوال الحصة","إرساله إلى الإدارة في أول مخالفة"],"كثير الحركة يحتاج قناة مشروعة لطاقته وقرباً يسهل متابعته. الحرمان والإجبار يزيدان التوتر، والإرسال للإدارة تصعيد."],
["L14","hm","كلف المعلم طلابه بحل مسألة صعبة، فنجح خالد في حلها وقدمها لمعلمه، وأثناء عودته إلى مقعده ضرب زميله بالكتاب على رأسه أمام المعلم. أفضل تعامل مع الموقفين:",["«حلك صحيح» ثم «ضرب زميلك خطأ يستحق العقاب»","«أنت ذكي» ثم «سأتجاهل تصرفك نظراً لحلك المسألة»","«أنت ذكي» ثم «ضرب زميلك خطأ يستحق العقاب»","«حلك صحيح» ثم «أنت مشاغب»"],"يُعترف بالإنجاز (وصف العمل لا الشخص) ويُرفض السلوك (وصف الفعل لا الشخص). التجاهل يكافئ العدوان، و«أنت ذكي» و«أنت مشاغب» وصم للشخص."],
["L14","hm","واجه معلم في بداية العام معضلة مع طالب في المرحلة الثانوية لا تقتصر مشكلاته على إهمال الواجبات، بل يظهر سلوكاً فظاً مع المعلم فيه كثير من روح التحدي. الحل الأنسب:",["أن يجتمع بالطالب منفرداً ويعالج المشكلة بقدر من الود","أن يكون حازماً معه أمام الصف وإلا أصبح قدوة سيئة","أن يحيله إلى إدارة المدرسة لإيقاع العقوبة المناسبة","ألا يدخل في أي مشكلة معه ويكتفي بتقويم أدائه المنخفض"],"المتحدي يبحث عن مواجهة علنية؛ اللقاء الفردي الودي يفهم السبب ويبني علاقة. الإحالة أول العام تصعيد، والتجاهل تخلٍّ."],
["L14","","سمع المعلم طالباً يسب زميله لأول مرة أثناء نشاط جماعي. الخطوة الأولى:",["إيقاف السلوك فوراً وتنبيه الطالب بأن السب مرفوض وله عواقب إن تكرر","إبلاغ ولي أمره بالحادثة في اليوم نفسه","إحالته إلى المرشد الطلابي","تجاهل الموقف لأنه الأول"],"أول حادثة يعالجها المعلم مباشرة بالتنبيه وتوضيح العواقب (منطق دليل الهيئة). الإبلاغ والإحالة خطوات لاحقة عند التكرار، والتجاهل لا يصلح مع العنف اللفظي على زميل."],
["L14","m","تكرر اعتداء الطالب نفسه لفظياً على زملائه رغم تنبيه المعلم وتطبيقه العواقب المتفق عليها. الإجراء الآن:",["إحالة الحالة إلى المرشد الطلابي وإشعار الإدارة وولي الأمر وفق اللائحة","تنبيهه مرة أخرى بالأسلوب نفسه","معاقبة الصف كله حتى يضغط عليه زملاؤه","نقل الطلاب المعتدى عليهم إلى فصل آخر"],"بعد استنفاد إجراءات المعلم يأتي التصعيد المنظم (المرشد ثم الإدارة وولي الأمر). العقاب الجماعي مرفوض، ونقل الضحايا يعاقبهم."],
["L14","h","انتقل معلم إلى مدرسة فوجد فيها ظاهرة تنمر منتشرة بين الطلاب. التصرف المهني:",["يعمل على علاجها بخطة مع المرشد والإدارة","يطلب النقل إلى مدرسة أخرى","يبلغ المشرف التربوي ويكتفي","يتجاهلها لأنها ليست من مهامه"],"التنمر ظاهرة مدرسية تُعالج بعمل مشترك ووقاية، والمعلم جزء من الحل. النقل هروب، والاكتفاء بالتبليغ تخلٍّ عن الدور."],
["L14","hm","في مساء أحد الأيام صادفك ولي أمر عبّر عن استيائه من تعرض ابنه المتكرر للتنمر من بعض زملائه في المدرسة. أفضل استجابة:",["الاستماع للمشكلة ثم إخباره بمتابعتها مع المرشد الطلابي في المدرسة","توضيح أن المدرسة لا تملك الصلاحية ونصحه بالاتصال بالجهات المختصة","أخذ الأمر ببساطة وإخباره أن هذا جزء طبيعي من الحياة المدرسية","إخباره بضرورة مراجعة الإدارة لأن الأمر ليس من طبيعة عملك"],"الإنصات أولاً ثم ربطه بالجهة المختصة داخل المدرسة. التهوين والتنصل من المسؤولية مرفوضان."],
["L14","","طالب يتعرض للتنمر ويميل إلى الصمت والعزلة. الإجراء الأنسب تجاهه:",["دعمه ببناء الثقة وتعليمه مهارات اجتماعية مع ضمان حمايته","مواجهته مع المتنمر أمام الصف لتسوية الخلاف","مطالبته بالدفاع عن نفسه بالمثل","تجاهل الأمر لأنه سيتجاوزه مع الوقت"],"المعتدى عليه يحتاج حماية وثقة ومهارات. المواجهة العلنية تزيد الأذى، والرد بالمثل يوسع العنف."],
["L14","","من العلامات التي تدل على تعرض الطالب للتنمر:",["الانطواء المفاجئ وكثرة التغيب وتراجع التحصيل","زيادة المشاركة الصفية","ارتفاع تقدير الذات","المبادرة إلى قيادة المجموعات"],"الضحية تنسحب وتتجنب المدرسة وتتراجع درجاتها وقد تشكو آلاماً جسدية متكررة."],
["L14","hm","شاهد المعلم أحد طلابه يدخن خارج أسوار المدرسة. الإجراء الصحيح:",["إبلاغ المرشد الطلابي ليدرس حالته وإشعار إدارة المدرسة لتطبيق لائحة السلوك","تجاهله لأن السلوك حدث خارج المدرسة","الاتصال بوالده فوراً وإخباره بسلوك ابنه","توبيخه أمام زملائه في الطابور"],"التدخين مخالفة سلوكية وصحية تُتابع بالإجراءات النظامية: المرشد يدرس الحالة والإدارة تطبق اللائحة وتستدعي ولي الأمر عبر القنوات الرسمية، لا بالتشهير ولا بالتجاهل ولا باتصال المعلم المباشر بالوالد. مفتاح الملخصات المتداولة يتذبذب بين «المرشد» و«المدير»، والبديل الصحيح هنا يجمعهما وفق اللائحة."],
["L14","m","جميع ما يلي من ممارسات البيئة الصفية الآمنة ما عدا:",["العقاب الجماعي للصف عند مخالفة بعض الطلاب","وضوح القواعد والعواقب وثباتها","معالجة المخالفة على انفراد","تعزيز السلوك البديل المرغوب"],"العقاب الجماعي يظلم الملتزمين ويهدم الثقة بالمعلم، وهو ممنوع تربوياً. البدائل الأخرى أركان البيئة الآمنة."],
["L14","","في حصة مختبر العلوم لاحظ المعلم طالباً يعبث بمواد كيميائية. الخطوة الأولى:",["إيقافه فوراً وإبعاد المواد عنه ثم تذكير الصف بقواعد السلامة","تسجيل مخالفة في سجل السلوك","إبلاغ ولي الأمر بالحادثة","إخراجه من المختبر بقية الفصل الدراسي"],"الخطر الفوري يُوقف أولاً قبل أي إجراء إداري. التسجيل والإبلاغ خطوات لاحقة، والحرمان الطويل عقوبة غير متناسبة."],
["L14","m","طالب محبط قليل الدافعية يبدو شارداً ولا يبذل جهداً في أي مهمة. أول ما يفعله المعلم:",["استكشاف سبب إحجامه عن الجهد ثم كسر دائرة الفشل بمهام متدرجة","تحويله فوراً إلى المرشد الطلابي","إبلاغ ولي الأمر بإهماله","تجاهله حتى يبادر بنفسه"],"فهم السبب أول خطوة في أي تعديل سلوك، ثم تُبنى خبرات نجاح صغيرة. التحويل والإبلاغ قبل محاولة المعلم تصعيد مبكر."],
["L14","","من مبادئ لائحة السلوك والمواظبة في التعامل مع المخالفات:",["تعزيز الانضباط الذاتي والتدرج في الإجراءات","العقوبة الفورية القصوى لأي مخالفة","إشراك الطلاب في معاقبة زملائهم","حرمان المخالف من الدراسة"],"اللائحة تصنف المخالفات بدرجات وتتدرج في الإجراءات وتهدف إلى الانضباط الذاتي لا الردع فقط."],
["L14","","يصدر طلاب الصف ضوضاء كلما انشغل المعلم بمجموعة واحدة. الإجراء الأنسب:",["الاتفاق مع الصف على إشارة صامتة تعني خفض الصوت وتعزيز الالتزام بها","رفع صوت المعلم فوق أصواتهم","معاقبة الصف كله بواجب إضافي","إيقاف العمل بالمجموعات نهائياً"],"الإشارة المتفق عليها إجراء صفي يضبط الصوت دون قطع النشاط أو عقاب جماعي. رفع الصوت يرفع ضوضاء الصف."],
["L14","","أي الآتي ليس من الإجراءات المناسبة عند تكرار المخالفة من الطالب نفسه؟",["التشهير به في الطابور الصباحي ليرتدع","تطبيق العواقب المتفق عليها بثبات","إشراك المرشد الطلابي في دراسة الحالة","التواصل مع ولي الأمر"],"التشهير إهانة علنية ممنوعة وتولد العناد. التكرار يستدعي الثبات في العواقب والتصعيد المنظم."],
["L14","m","طالبان يتبادلان الشتائم في الفناء وتجمّع حولهما الطلاب. الخطوة الأولى للمعلم المناوب:",["الفصل بينهما فوراً وتفريق المتجمعين ثم الاستماع لكل منهما على انفراد","إبلاغ ولي أمر كل منهما هاتفياً من مكانه","تسجيل مخالفة لكليهما دون سماعهما","الطلب من الطلاب المتجمعين الحكم بينهما"],"إيقاف الموقف وإزالة الجمهور (المعزز للعدوان) أولاً، ثم التحقق الهادئ. التسجيل والإبلاغ بعد فهم ما حدث."],
["L14","","أراد معلم ترتيب أماكن جلوس الطلاب وأدوات الفصل. العامل الذي يأخذه بعين الاعتبار أولاً:",["أنواع الأنشطة التعليمية التي سيستخدمها","مستويات إنجاز الطلاب","الخلفيات الاجتماعية والثقافية للطلاب","أطوال الطلاب فقط"],"التنظيم الفيزيائي يتبع النشاط: صفوف للعرض ومجموعات للتعاون. الترتيب حسب الإنجاز أو الخلفية يوسم الطلاب ويضر بالبيئة الآمنة."],
["L14","m","يلاحظ المعلم أن طالباً يأتي إلى المدرسة بكدمات متكررة ويتهرب من الحديث عنها. الإجراء المهني:",["إبلاغ المرشد الطلابي وإدارة المدرسة لاتخاذ الإجراء النظامي","استجواب الطالب أمام زملائه لمعرفة السبب","الاتصال بوالده وتوبيخه","تجاهل الأمر لأنه شأن أسري"],"الاشتباه في إيذاء خارج صلاحية المعلم ويتطلب جهات مختصة بسرية. الاستجواب العلني يؤذي الطالب، والاتصال المباشر بالوالد قد يعرضه لخطر أكبر."],
["L14","","يحقق المعلم أثراً إيجابياً أكبر في ضبط سلوك طلابه عندما:",["يكون قدوة في السلوك الذي يطلبه منهم","يكثر من التهديد بالعقوبات","يعتمد على العقاب الجماعي","يحيل كل مخالفة إلى الإدارة"],"الطلاب يتأثرون بسلوك المعلم أكثر من أقواله (النمذجة)؛ المعلم الذي يحترم القواعد يجعلها مقبولة."],
["L14","","طالب مشاغب تكررت مخالفاته البسيطة، فقرر المعلم أن يبدأ بأسلوب بنّاء قبل التصعيد. الأنسب:",["عقد سلوكي يحدد السلوك المطلوب والمكافأة والعواقب بالاتفاق معه","إنذار كتابي فوري وإحالة للإدارة","تجاهل كل مخالفاته مهما كانت","نقله إلى فصل آخر"],"العقد السلوكي يشركه في المسؤولية ويحدد التوقعات والعواقب بوضوح. الإحالة تصعيد، والتجاهل لا يصلح مع المتكرر."],
// ===== 9.4 ثقافة تواصل معززة للتعلم =====
["L14","hm","إذا أجاب أحد الطلاب عن سؤال إجابة خاطئة، فأي الآتي يُعد التعامل الأمثل؟",["أنظر إلى الجانب الصحيح في إجابته وأبني عليه","أنتقل إلى طالب آخر مباشرة","أقول له: إجابتك خاطئة","أقول له: محاولة جيدة، ثم أعطي الإجابة"],"البحث عن الجزء الصحيح يحفظ ثقة الطالب ويبقيه في الموقف. الانتقال الفوري ونقل الإجابة يحبطانه، و«محاولة جيدة» مجاملة لا تعلّم."],
["L14","h","من معوقات التفاعل اللفظي بين المعلم وطلابه التي ترجع إلى المناخ النفسي للصف:",["تخوف الطلاب من الإدلاء بإجابات قد تكون خاطئة","كثافة أعداد الطلاب في الفصل","التوقعات المنخفضة للمعلم عن أداء الطلاب","تعزيزات المعلم غير المناسبة للاستجابات"],"الخوف من الخطأ نتاج مناخ صفي غير آمن، وهو ما يعيق التفاعل اللفظي. الكثافة عامل مادي في البيئة لا نفسي، والتوقعات والتعزيز متعلقان بسلوك المعلم."],
["L14","h","صمت المعلم بضع ثوانٍ بعد طرح السؤال يساعد الطلاب على الإجابة لأنه:",["يتيح زمن انتظار للتفكير وصياغة الإجابة","يُظهر هيبة المعلم","يمنح المعلم استراحة قصيرة","يهدئ الصف"],"زمن الانتظار (3–5 ثوانٍ) يرفع عدد الإجابات وجودتها ويشرك الخجولين."],
["L14","m","زمن الانتظار المناسب بعد طرح السؤال الصفي:",["3–5 ثوانٍ","أقل من ثانية","15–20 ثانية","دقيقة كاملة"],"دراسات ماري رو: 3–5 ثوانٍ تكفي للتفكير دون أن يتحول الصمت إلى إحراج."],
["L14","h","يوجه المعلم سلسلة من الأسئلة بعد إجابة خاطئة أو ناقصة ليقود الطالب إلى الإجابة الصحيحة دون إحراج. يسمى هذا:",["السبر المشجع","الأسئلة المغلقة","الأسئلة التجميعية","العصف الذهني"],"السبر أسئلة متتابعة تبني على إجابة الطالب؛ والمشجع منه يوجهه بلطف نحو الصواب."],
["L14","","سؤال المعلم: «ما رأيك في تصرف الشخصية في القصة؟ ولماذا؟» نوعه:",["مفتوح يتطلب تفكيراً متباعداً","مغلق له إجابة واحدة","سابر يبني على إجابة سابقة","تجميعي"],"الرأي والتبرير يحتملان إجابات متعددة، وهذا السؤال المفتوح. المغلق يستدعي معلومة واحدة."],
["L14","h","أي مما يأتي من سمات المتحدث الجيد؟",["القدرة على ضبط الانفعال","الاستطراد لإبعاد الملل","الحماس المتواصل برفع الصوت","الابتعاد عن النقاشات حفاظاً على الوقت"],"ضبط الانفعال يحفظ هيبة الحديث ووضوحه. الاستطراد يشتت، ورفع الصوت الدائم يفقد النبرة قيمتها."],
["L14","","استماع المعلم للطالب الذي يعاني من مشكلة في جو يتصف بالدفء والتقبل يساعد الطالب على:",["الشعور بالأمن النفسي والتعبير عن مشكلته بحرية","تحقيق الذات وفق هرم ماسلو","التفوق الدراسي الفوري","التنافس مع زملائه"],"الإنصات المتقبل يوفر الأمن والانتماء، وهما شرط البوح. تحقيق الذات قمة الهرم ولا يتحقق بموقف استماع واحد."],
["L14","h","استخدام التغذية الراجعة في عمليات التعلم يؤدي إلى:",["معرفة الطالب بطبيعة معارفه وتقويمها","إحباط الطالب بمعرفة نقاط الضعف","تحديد المستوى النهائي لتحصيل الطالب","تشجيع الطالب بعد معرفة نقاط القوة فقط"],"التغذية الراجعة معلومات عن الأداء توضح القوة والضعف معاً ليقوّم الطالب تعلمه. تحديد المستوى النهائي وظيفة التقويم الختامي."],
["L14","h","الفرق بين التغذية الراجعة والتعزيز:",["التغذية الراجعة تراكم معرفي، والتعزيز تراكم وجداني","التغذية الراجعة أقل دقة من التعزيز","التغذية الراجعة نتيجة للأداء، والتعزيز متعلق بالأداء","مصطلحان لشيء واحد"],"التغذية الراجعة معلومات عن الأداء (معرفي) وهي أدق، والتعزيز نتيجة للأداء تمس الوجدان. البديل الثالث يعكس العلاقة."],
["L14","h","من خصائص التغذية الراجعة الفاعلة جميع ما يلي ما عدا:",["متقطعة","فورية","موجهة","محددة"],"التغذية الفاعلة مستمرة لا متقطعة، وفورية ومحددة وموجهة للأداء."],
["L14","h","إخبار المتعلم بنتائج استجابته الصحيحة لتقوى ثقته بنفسه هو وظيفة التغذية الراجعة:",["التعزيزية","الإخبارية","التقويمية","التشخيصية"],"الوظيفة التعزيزية تقوي الثقة، والإخبارية تبين الصواب والخطأ ليصحح، والدافعية تدفعه لمزيد جهد."],
["L14","m","أي التعليقات الآتية يمثل تغذية راجعة وصفية؟",["«ترتيب أفكارك واضح، وتحتاج إلى دليل يدعم الفقرة الثانية»","«ممتاز»","«ضعيف، راجع الدرس»","«7 من 10»"],"الوصفية تسمي ما أُنجز وما يُحسَّن وكيف. «ممتاز» تعزيز عام، والدرجة حكم بلا توجيه."],
["L14","","استراتيجية «نجمتان وأمنية» في التغذية الراجعة تعني:",["ذكر نقطتي قوة ونقطة تحسين تُصاغ بصيغة أمنية","منح نجمتين لكل إجابة صحيحة","تأجيل التغذية الراجعة إلى نهاية الوحدة","مقارنة الطالب بزميلين متفوقين"],"نجمتان = إيجابيتان، أمنية = جانب تحسين بصيغة لطيفة؛ تحافظ على الدافعية مع توجيه التطوير."],
["L14","m","الطالب الخجول يستجيب على نحو أفضل لنوع التواصل:",["غير اللفظي كالابتسامة والإيماءة المشجعة","اللفظي العلني أمام الصف","الكتابي الرسمي فقط","التوبيخ الخفيف لتحفيزه"],"الإشارات غير اللفظية تشجع دون أن تضعه في بؤرة الاهتمام. التواصل العلني يزيد توتره."],
["L14","","نمط الاتصال الصفي الذي يتفاعل فيه جميع الطلاب مع بعضهم ومع المعلم بتوجيهه:",["متعدد الاتجاهات (مفتوح)","وحيد الاتجاه","ثنائي الاتجاه","ثلاثي الاتجاه"],"المفتوح نمط التعلم التعاوني؛ وحيد الاتجاه محاضرة، وثنائي الاتجاه مناقشة بين المعلم وطالب."],
["L14","m","أثناء إجابة طالب متلعثم بدأ زملاؤه يضحكون. الإجراء الأنسب:",["إيقاف الضحك بحزم وإتاحة الوقت للطالب لإكمال إجابته ثم تعزيز محاولته","نقل السؤال إلى طالب أفضل تخفيفاً عنه","إنهاء النقاش والانتقال إلى نقطة أخرى","الطلب من الطالب الجلوس"],"الأمان النفسي يقتضي حماية الطالب من السخرية وإكمال فرصته. نقل السؤال أو إجلاسه يؤكد للجميع أن الضحك نجح."],
["L14","","من مؤشرات الإنصات النشط لدى المعلم:",["إعادة صياغة ما قاله الطالب للتأكد من فهمه","مقاطعة الطالب لتصحيح خطئه فوراً","النظر إلى الدفتر أثناء حديث الطالب","الانتقال فوراً إلى سؤال آخر"],"إعادة الصياغة والإيماء وعدم المقاطعة تُشعر الطالب أنه مسموع ومفهوم."],
["L14","","في صف يضم طلاباً من خلفيات ثقافية ولغوية متنوعة، أفضل ممارسة صفية للمعلم:",["إشراك جميع الطلاب في مناقشة الدرس مع إظهار الاحترام لكل طالب","تجميع طلاب كل خلفية في مجموعة واحدة","تجنب الحديث عن الاختلافات نهائياً","إعفاء بعضهم من المشاركة مراعاة لظروفهم"],"احترام التنوع يعني إشراك الجميع باحترام. التجميع حسب الخلفية والإعفاء يعزلان ويوسمان."],
["L14","","يبدأ المعلم حصته بالوقوف عند الباب وتحية الطلاب بأسمائهم. يحقق ذلك:",["بيئة إيجابية وشعوراً بالانتماء","ضبطاً صارماً للصف","تقويماً تشخيصياً","تعزيزاً سالباً"],"العلاقة الإيجابية تبدأ بالتحية والاسم؛ وهي أبسط إجراءات البيئة الداعمة في الابتدائية خاصة."],
["L14","m","أرسل ولي أمر رسالة غاضبة على منصة التواصل يتهم فيها المعلم بالتحيز ضد ابنه. الإجراء الأنسب:",["طلب لقاء هادئ للاستماع إليه أولاً ثم عرض الحقائق والاتفاق على متابعة","الرد برسالة دفاعية مفصلة تثبت خطأ الطالب","تجاهل الرسالة لأنها غير مهذبة","تحويلها إلى المدير فوراً دون رد"],"الإنصات أولاً قاعدة التعامل مع ولي الأمر الغاضب، ثم الحقائق بهدوء. الرد الدفاعي يصعّد، والتجاهل والتحويل الفوري تخلٍّ عن التواصل."],
["L14","hm","أتى إلى المدرسة ولي أمر غاضب من تدني مستوى ابنه الدراسي. التصرف الصحيح للتعامل معه:",["مقابلته بهدوء والاستماع إليه أولاً ثم مناقشته بموضوعية في مستوى ابنه","امتصاص غضبه برفع درجات الطالب","تحويله إلى المرشد الطلابي","تحويله إلى مدير المدرسة"],"ولي الأمر الغاضب يحتاج إنصاتاً أولاً ثم حقائق بهدوء، والمعلم هو المعني بمستوى الطالب. رفع الدرجات خيانة للأمانة، والتحويل تهرب."],
["L14","h","في الحصة الأخيرة جاء ولي أمر يريد استئذان ابنه للخروج، ولاحظت أنه غاضب ولا يبدو في حالة طبيعية. ما ينبغي فعله:",["تحويله إلى إدارة المدرسة لتتولى الموقف وفق الإجراءات","السماح للابن بالخروج معه فوراً","سؤال الطالب إن كان يريد الخروج أم لا","الطلب منه الانتظار حتى نهاية الحصة ثم أخذ ابنه"],"سلامة الطالب أولاً، وولي الأمر في حالة غير طبيعية خارج صلاحية المعلم؛ الإدارة تملك إجراءات الاستئذان والتحقق."],
["L14","","جميع ما يلي يعزز ثقافة تواصل داعمة للتعلم ما عدا:",["السخرية الخفيفة من الإجابات الخاطئة لكسر الجمود","زمن انتظار كافٍ بعد السؤال","تنويع الأسئلة بين مغلقة ومفتوحة","التغذية الراجعة الوصفية"],"أي سخرية تولد خوفاً من الخطأ، وهو أكبر معوقات التفاعل اللفظي."],
["L14","m","يريد المعلم تعزيز تعلم طلابه خارج الصف عبر مجموعات تعلم افتراضية. الشرط الأهم لنجاحها:",["أن تكون تحت إشراف المعلم وتوجيهه بأهداف تعلم واضحة","أن تكون مفتوحة لأي شخص خارج المدرسة","أن تُخصص للتسلية والترفيه","أن يديرها الطلاب دون أي متابعة"],"مؤشر الهيئة: مجموعات افتراضية مع زملائهم تحت إشراف المعلم وتوجيهه. غياب الإشراف يفقدها هدفها التعليمي."],
["L14","","وصف الطلاب معلمهم بأنه «يسمعنا ويفهمنا حتى لو اختلف معنا». تصف هذه العبارة:",["ثقافة تواصل آمنة تقوم على الإنصات والاحترام","نمطاً فوضوياً في الإدارة","ضعفاً في الضبط الصفي","تعزيزاً مادياً"],"الاستماع مع الاحتفاظ بالرأي ليس تساهلاً؛ هو جوهر الثقافة الداعمة للتعلم التي يشعر فيها الطالب بالقبول."],
["L14","m","ينادي المعلم الطلاب المتطوعين وحدهم، فتركزت المشاركة في ثلاثة طلاب. الإجراء الأنسب لتوسيع المشاركة:",["توزيع الأسئلة على الجميع بأسلوب عشوائي مع زمن انتظار وتدرج في الصعوبة","الاكتفاء بالمتطوعين لأنهم الأكثر رغبة","خصم درجات من غير المشاركين","طرح أسئلة أصعب على المتطوعين"],"التوزيع العادل مع زمن الانتظار يرسل رسالة أن الجميع متوقع منهم المشاركة. الخصم يولد الخوف، والاكتفاء بالمتطوعين يهمّش البقية."]
]);

// بنك أسئلة المجال الأول: القيم والمسؤوليات المهنية (L01–L04)
// الحقول: [معرّف الدرس، أعلام (h=صياغة محاكية للاختبار، m=محجوز للمحاكيات)، السؤال، [4 بدائل، الأول صحيح]، الشرح]
window.QB = (window.QB || []).concat([
// ===== L01: القيم الإسلامية الوسطية والهوية الوطنية =====
["L01","hm","عندما يستشهد معلم أثناء درسه بأمثلة إيجابية من ثقافة أخرى فإنه:",["يعزز ثقافة احترام الآخرين","يصنف ذلك من تعزيز الهوية الوطنية","يرسخ القيم المهنية لدى طلابه","يخفض دافعية الطلاب للتعلم"],"الاستشهاد الإيجابي بثقافة أخرى ينمي احترام الآخر والتفاعل الإيجابي مع الثقافات كما ينص الميثاق. البديل «تعزيز الهوية الوطنية» فخ؛ الهوية تُعزَّز بشواهد الوطن نفسه لا بأمثلة من غيره."],
["L01","h","في مهمة عمل تضم عدة جنسيات وجد المعلم زميلاً غير مسلم. الطريقة المتزنة للتعامل معه بحسب قيمنا الإسلامية:",["التعامل معه وفق مقتضيات مهام العمل","دعوته إلى الإسلام وبيان محاسنه في كل لقاء","إرشاده إلى مراكز الدعوة الإسلامية","الاكتفاء بالحد الأدنى من التعامل لاختلاف الدين"],"الوسطية تقتضي التعامل المهني المحترم وفق متطلبات العمل. الدعوة القسرية في كل لقاء أو تقليل التعامل تعصب يناقض التسامح والتعايش اللذين نص عليهما الميثاق."],
["L01","hm","وضع المعلم أربعة أهداف لقيمة المواطنة: (1) يشارك الطالب في ندوة عن جهود المملكة في خدمة الحرمين، (2) يتمثل القدوة الحسنة لأسرته في بناء الحس الوطني، (3) يقدّر الطالب دور المملكة في خدمة الحجاج، (4) يبدي اهتمامه بحديث معلمه عن منجزات الوطن. الترتيب من الأدنى إلى الأعلى وفق تصنيف كراثول:",["4 ، 1 ، 3 ، 2","1 ، 2 ، 3 ، 4","4 ، 3 ، 1 ، 2","1 ، 3 ، 2 ، 4"],"إبداء الاهتمام = استقبال، المشاركة في ندوة = استجابة، التقدير = تقييم القيمة، والقدوة للأسرة = تمثّل القيمة (أعلى المستويات). البديل الذي يبدأ بالمشاركة يتجاوز مستوى الاستقبال الذي يسبقها."],
["L01","h","قاطع طالب المعلم أثناء حديثه عن منجزات المملكة متسائلاً: أيهما أهم، حال الأمة أم حال الوطن؟ الاستجابة الأنسب:",["يحاوره بهدوء مبيناً أن حب الوطن لا يتعارض مع الانتماء للأمة، وأن من لا خير فيه لوطنه لا خير فيه لغيره","يطلب منه عدم المقاطعة لأن الدرس ليس للمقارنة بين الوطن والأمة","يبين له أن مصطلح الأمة غير واقعي ويفرق أكثر مما يجمع","يوضح له أنه منساق لأفكار لا تنفعه وعليه الصمت"],"تعزيز الهوية يكون بالحوار الهادئ والشواهد التي تجمع لا تفرق. البدائل الأخرى تُسكت الطالب أو تسخر منه أو تنفي الانتماء للأمة، وكلها تناقض الوسطية."],
["L01","h","رُفع الأذان أثناء شرح المعلم. التصرف الذي يجسد القدوة الحسنة:",["يتوقف عن الشرح ويردد الأذان مع طلابه","يستمر في الشرح حتى لا يضيع وقت الحصة","يروي لهم قصة قصيرة عن فضل الأذان","يذكّرهم بواجب المسلم تجاه الأذان ثم يكمل الشرح"],"القدوة سلوك عملي يراه الطلاب، والترديد مع الأذان نمذجة مباشرة للقيمة. البديل «يوضح واجب المسلم» وعظ لفظي أضعف أثراً من الفعل، والاستمرار في الشرح يفقد الموقف التربوي."],
["L01","hm","الإجراء الذي يمثل «المعلم القدوة»:",["حسن التعامل مع الطلاب","استخدام أساليب تربوية في العقاب","مراعاة ظروف الطلاب النفسية","التطبيق العملي للمواقف التعليمية"],"القدوة تظهر في سلوك المعلم اليومي مع طلابه؛ حسن التعامل هو ما يُحتذى. «أساليب تربوية في العقاب» بديل جذاب لكنه عن ضبط السلوك لا عن القدوة، ومراعاة الظروف جزء من العدل لا جوهر القدوة."],
["L01","h","طالب يحب الجدل ويشكك في بعض الثوابت ولا يحيد عن رأيه. الحل الأنسب لمعالجة الأمر:",["الاستعانة بأدلة منطقية وتقديم المعلومات بالقدوة العملية والسلوك","إغلاق باب الجدال حتى لا يزداد تشبثاً برأيه","دعوة مختص لزيارة الصف وتقديم توجيهات عن الحوار","إرشاده إلى موقع إلكتروني يعالج التعصب والتعميم الخاطئ"],"الميثاق يطلب تعويد الطلاب على الحوار البناء والتفكير السليم، فالأدلة مع القدوة هي العلاج. إغلاق الحوار قمع يزيد التشبث، والإحالة إلى موقع أو مختص تنصل من دور المعلم."],
["L01","hm","لتنمية الروح الوطنية لدى الطلاب يبدأ المعلم بـ:",["غرس مفهوم حب الوطن والمواطنة","تعليق الأعلام في الفصول","تنظيم برامج ثقافية","زيارة المصانع الوطنية"],"المفهوم والقيمة هما الأصل، والأعلام والبرامج والزيارات وسائل تخدمه. البديل «تعليق الأعلام» مظهر شكلي قد يوجد بلا انتماء حقيقي."],
["L01","h","يزود المعلم طلابه بخبرات عن القضايا المجتمعية عندما يشارك في:",["ندوة عن التطرف الفكري","مؤتمر علمي في تخصصه","محاضرة عن أحكام الصلاة","دورة في تخطيط الدروس"],"التطرف الفكري قضية مجتمعية تمس الوسطية والأمن الفكري. المؤتمر التخصصي والدورة تطوير مهني، والمحاضرة الفقهية معرفة شرعية لا قضية مجتمعية."],
["L01","hm","ورد تعميم بوجوب المحافظة على مواقع الآثار والتراث العمراني. الأنشطة غير الصفية الآتية تصلح لتعزيز هذه القيمة ما عدا:",["تقديم مبادرات لتحويل المباني التراثية إلى مبانٍ حديثة","حث أصحاب المباني التراثية على ترميمها بما يحفظ طابعها الأصلي","إعداد فيلم وثائقي عن المباني التراثية في الحي","توزيع مطويات توعية بأهمية المباني التراثية"],"تحويل المباني التراثية إلى حديثة يناقض قيمة الحفاظ على التراث. أما الترميم الذي يحفظ الطابع الأصلي فصيانة للتراث، والفيلم والمطويات توعية."],
["L01","h","من صور المواطنة الرقمية لدى الطالب:",["الممارسة الآمنة والقانونية والأخلاقية للمعلومات والتقنية","فهم أنظمة التقنية وطريقة عملها","معالجة البيانات وكتابة تقرير عن النتائج","سرعة إنجاز المهام الرقمية"],"المواطنة الرقمية تتعلق بالسلوك المسؤول (الأمان، القانون، الأخلاق). فهم الأنظمة ومعالجة البيانات مهارات تقنية لا مواطنة."],
["L01","hm","أي الآتي يندرج تحت أخلاقيات التعامل مع التقنية ومصادر المعلومات؟",["توجيه رسالة اعتذار عند إرسال رسالة إلكترونية خطأ لغير صاحبها","إرسال بريد إلكتروني متكرر للتنبيه على قضية معينة","إخفاء الهوية أو الانتماء الإداري في المراسلات الإلكترونية","الاستفادة من الوثائق التي تصل خطأ إلى البريد الإلكتروني"],"الاعتذار عن الخطأ سلوك أخلاقي. إخفاء الهوية والتصرف في وثائق الغير والإزعاج بالتكرار كلها مخالفات لأخلاقيات التقنية."],
["L01","h","جميع ما يلي من أخلاقيات التعامل مع التقنية ومصادر المعلومات ما عدا:",["حرية التصرف في الوثائق التي تصل خطأ إلى بريده الإلكتروني","تعريف النفس بوضوح في كل المراسلات","مراعاة حقوق النشر والملكية الفكرية","التأكد من صحة المعلومة قبل نشرها"],"الوثيقة التي تصل بالخطأ ملك لغيرك ولا يجوز التصرف فيها. البدائل الأخرى كلها قواعد أخلاقية صحيحة."],
["L01","h","الاستراتيجية الأكثر فاعلية لمساعدة الطلاب على فهم التنوع الثقافي واحترام ثقافة الآخرين:",["تكليف الطلاب بنشاط عملي حول الثقافات المختلفة","وضع ملصقات عن الثقافات المختلفة على جدران الصف","بيان أيام العطل والأعياد الرسمية في الثقافات المختلفة","تشجيع الطلاب على تعلم اللغات الأجنبية"],"الفهم والاحترام يتكونان بالخبرة المباشرة والنشاط الذي يعيشه الطالب. الملصقات وقوائم الأعياد معلومات سطحية، وتعلم اللغات هدف بعيد غير مباشر."],
["L01","hm","تريد معلمة تكوين معاني المواطنة الصالحة لدى طالباتها وإدراكهن مكانة المملكة من خلال علاقاتها بدول العالم. أفضل طريقة:",["ربط التدريس بشواهد وقصص واقعية عن جهود المملكة وعلاقاتها الدولية","تشجيع الطالبات على الالتحاق بالجامعات السعودية","تشجيعهن على المطالعة حول التحديات التي تواجههن","تكليفهن بحفظ النشيد الوطني"],"الهوية تُعزَّز بالشواهد والمنجزات المرتبطة بالدرس. الالتحاق بالجامعات والمطالعة العامة بعيدان عن الهدف، والحفظ وحده لا يبني المعنى."],
["L01","h","يرغب المعلم في تقدير جهود طلابه بتحميل صور مشاركتهم على موقع المدرسة. الإجراء اللازم قبل التحميل:",["مراجعة ما تتطلبه لوائح نشر الصور المعتمدة من وزارة التعليم","الحصول على إقرار خطي من أولياء الأمور بالموافقة","الحصول على موافقة كل طالب على صورته","نشر الصور دون وضع أسماء الطلاب"],"الالتزام باللوائح هو الخطوة الأولى، وهي التي تحدد ما يلزم بعدها (كإذن ولي الأمر). الإقرار من أولياء الأمور إجراء صحيح لكنه تالٍ لمعرفة ما تنص عليه اللائحة."],
["L01","","النظام الذي يجرّم التنصت والابتزاز والتشهير والدخول غير المشروع عبر الشبكة:",["نظام مكافحة الجرائم المعلوماتية","لائحة السلوك والمواظبة","لائحة الوظائف التعليمية","ميثاق أخلاقيات مهنة التعليم"],"نظام مكافحة الجرائم المعلوماتية (1428هـ) هو المرجع الجزائي للجرائم الإلكترونية. لائحة السلوك تنظم سلوك الطلاب داخل المدرسة لا الجرائم العامة."],
["L01","","سُئل المعلم في الصف عن مسألة فقهية خلافية تعددت فيها آراء العلماء. التصرف الأنسب:",["يبين أن المسألة خلافية ويحيل الطلاب إلى المصادر الموثوقة والجهات المختصة دون فرض رأيه","يرجح رأيه الشخصي ويطلب من الطلاب الالتزام به","يرفض الإجابة ويطلب عدم إثارة مثل هذه الأسئلة","يفتح نقاشاً مفتوحاً ليصوّت الطلاب على الرأي الأصح"],"الحياد في القضايا الخلافية من أخلاقيات المهنة. فرض الرأي يخالف الحياد، والرفض يقمع السؤال، والتصويت يجعل الفتوى بالأغلبية."],
["L01","m","الوسطية كما يقصدها ميثاق أخلاقيات مهنة التعليم تعني:",["الاعتدال بين الغلو والتفريط في الأقوال والأحكام والتعامل","التوسط بين الطلاب عند الخلاف","اختيار الرأي الذي يرضي أغلبية الطلاب","الامتناع عن الحديث في أمور الدين داخل الصف"],"الوسطية موقف بين طرفين: الغلو (الزيادة) والتفريط (التقصير). البديل «إرضاء الأغلبية» ميوعة لا وسطية، والامتناع عن الدين يناقض رسالة التعليم."],
["L01","m","الرقيب الحقيقي على سلوك المعلم بعد الله سبحانه وتعالى، كما ينص الميثاق، هو:",["ضميره اليقظ وحسه الناقد","المشرف التربوي","مدير المدرسة","تقويم الأداء الوظيفي"],"الميثاق يقدم الرقابة الذاتية على كل رقابة خارجية مهما تنوعت أساليبها. المشرف والمدير والتقويم رقابة خارجية."],
["L01","","لاحظ المعلم أن بعض طلابه يسخرون من زميل لهم بسبب لهجته ومنطقته. الإجراء الأنسب لتعزيز الهوية الوطنية الجامعة:",["يوظف الموقف لبيان أن تنوع المناطق واللهجات ثراء لوطن واحد ويدعم ذلك بشواهد","يعاقب الساخرين أمام زملائهم ليكونوا عبرة","يطلب من الطالب تغيير لهجته ليندمج مع زملائه","يتجاهل الموقف لأنه مزاح أطفال"],"الهوية الوطنية الجامعة تُبنى بتحويل الموقف إلى درس في وحدة الوطن مع تنوعه. العقاب العلني يخالف الميثاق، وطلب تغيير اللهجة يحمّل الضحية المسؤولية."],
["L01","m","أراد معلم تعزيز الهوية الوطنية في درسه. الأسلوب الأكثر فاعلية:",["عرض شواهد وإحصاءات ومنجزات وطنية مرتبطة بموضوع الدرس","إلقاء موعظة عن واجب حب الوطن","تكليف الطلاب بحفظ عبارات عن الوطن","تعليق صور الرموز الوطنية في الصف"],"تعزيز الهوية يكون بالشواهد لا بالوعظ؛ الحقائق والمنجزات تقنع العقل وتحرك الوجدان. الموعظة والحفظ والصور وسائل شكلية أو تلقينية."],
["L01","","يميل أحد الطلاب إلى التشدد في أحكامه على زملائه ويصف من يخالفه بالفسق. التدخل الأنسب:",["يحاوره بالأدلة مبيناً سماحة الإسلام ووسطيته ويكون قدوة في التسامح","يثني على تدينه ويطلب من زملائه الاقتداء به","يمنعه من الحديث في الدين داخل الصف","يحيله مباشرة إلى المرشد الطلابي دون حوار"],"الغلو يُعالج بالحوار والدليل والقدوة، وهو دور المعلم أولاً. الثناء يعزز الغلو، والمنع قمع، والإحالة قبل الحوار تخطٍّ لدور المعلم."],
["L01","","من أهداف رؤية المملكة 2030 في التعليم:",["تنمية الشراكة المجتمعية وسد الفجوة بين مخرجات التعليم وسوق العمل","قصر التعليم على المسار الأكاديمي","إلغاء التعليم الأهلي","تقليص مراحل التعليم العام"],"الرؤية تستهدف جودة المخرجات وربطها بسوق العمل وتنمية الشراكة المجتمعية والتعلم مدى الحياة. البدائل الأخرى لا علاقة لها بأهدافها."],
["L01","","برنامج من برامج رؤية 2030 يستهدف بناء المواطن بالقيم والمهارات من الطفولة المبكرة وحتى التعلم مدى الحياة:",["برنامج تنمية القدرات البشرية","برنامج جودة الحياة","برنامج التحول الوطني","برنامج الإسكان"],"برنامج تنمية القدرات البشرية هو المعني بإعداد مواطن تنافسي عالمياً بالقيم والمعارف والمهارات. جودة الحياة والإسكان والتحول الوطني برامج بأهداف أخرى."],
["L01","","يستشهد الميثاق بقول «الحكمة ضالة المؤمن أنى وجدها فهو أحق الناس بها» في سياق:",["التفاعل الإيجابي مع الثقافات الأخرى","الالتزام بالأنظمة واللوائح","العدل بين الطلاب","التطوير المهني الذاتي"],"ورد النص في مادة المعلم والمجتمع عند الحديث عن تنمية أهمية التفاعل الإيجابي مع الثقافات الأخرى لدى الطلاب."],
["L01","","أثناء درس عن الأعياد سأل طالب غير سعودي عن عيد يحتفل به في بلده. التصرف الأنسب:",["يتيح له الحديث باختصار ويربط ذلك باحترام الثقافات مع تأكيد الثوابت","يطلب منه الاقتصار على ما ورد في المنهج","يؤجل سؤاله إلى ما بعد الحصة ولا يعود إليه","يحوّل الحديث إلى نقد عادات بلده"],"التفاعل الإيجابي مع الثقافات مع الحفاظ على الثوابت هو جوهر التنوع الثقافي في المعيار. التأجيل دون عودة تجاهل، والنقد إساءة."],
["L01","","المعلم الذي يكون «قدوة لطلابه خاصة وللمجتمع عامة» يدل سلوكه على التزامه بـ:",["القيم الإسلامية وأخلاقيات المهنة","اللوائح الإدارية للمدرسة","متطلبات التطوير المهني","مبادئ الشراكة المجتمعية"],"القدوة نص صريح في مادة المعلم وطلابه من الميثاق، وهي من القيم والأخلاقيات لا من اللوائح الإدارية."],
["L01","","المعلم الذي يحذر طلابه من مخاطر الغلو والتطرف ويبين لهم قيمة الاعتدال يحقق بنداً في:",["ميثاق أخلاقيات مهنة التعليم","لائحة الوظائف التعليمية","لائحة السلوك والمواظبة","قواعد القبول والتسجيل"],"مادة «المعلم وأداؤه المهني» في الميثاق تنص على أن المعلم يغرس مبدأ الاعتدال والتسامح والتعايش بعيداً عن الغلو والتطرف. اللوائح الأخرى تنظيمية لا قيمية."],
["L01","","جميع ما يلي من رموز الهوية الوطنية السعودية ما عدا:",["شعار المدرسة","العلم الوطني","النشيد الوطني","يوم التأسيس"],"العلم والنشيد ويوم التأسيس رموز وطنية جامعة، أما شعار المدرسة فرمز مؤسسي محلي لا وطني."],
["L01","","طلب طالب من المعلم رأيه في خلاف سياسي متداول في وسائل التواصل. الأنسب:",["يلتزم الحياد ويوجه الطلاب إلى المصادر الرسمية","يعرض رأيه الشخصي بصراحة","يسمح بنقاش مفتوح بين الطلاب حول القضية","يسخر من الطرف الذي يخالفه"],"الحياد في القضايا الخلافية واجب مهني، والتوجيه للمصادر الرسمية يحمي الطلاب من التضليل. النقاش المفتوح في قضية خلافية يحوّل الصف إلى ساحة لغير ما يُعنى بتعليمهم."],
["L01","m","المعلم الذي يصحح لطالب معلومة مغلوطة عن تاريخ الوطن بعرض الوثائق والمصادر يستخدم في تعزيز الهوية أسلوب:",["الشواهد والأدلة","الوعظ المباشر","التلقين","الترهيب"],"عرض الوثائق شاهد يقنع ويبني الهوية على المعرفة. الوعظ والتلقين لا يصححان مفهوماً خاطئاً راسخاً."],
["L01","","يتداول الطلاب على هواتفهم مقطعاً مسيئاً لأحد زملائهم. أول ما ينبغي على المعلم:",["إيقاف التداول وتوعيتهم بأن ذلك جريمة معلوماتية ثم إبلاغ المرشد والإدارة","مصادرة الهواتف جميعاً وإتلاف المقطع","تجاهل الأمر لأنه حدث خارج الحصة","معاقبة من صوّر المقطع أمام زملائه"],"حماية الطالب المتضرر وإيقاف الانتشار أولاً مع التوعية بالنظام، ثم الإحالة للجهات المختصة. المصادرة والإتلاف تجاوز للصلاحيات، والعقاب العلني يخالف الميثاق."],
["L01","m","تنمية الإحساس بالانتماء للدين والوطن وأهمية التفاعل الإيجابي مع الثقافات الأخرى من بنود الميثاق في مادة:",["المعلم والمجتمع","المعلم وطلابه","المعلم والأسرة","المعلم والمجتمع المدرسي"],"هذا البند هو أول بنود مادة «المعلم والمجتمع». مادة «المعلم وطلابه» تتناول العدل والقدوة وتجنب العقاب."],
["L01","","في يوم التأسيس، أي الأنشطة يعزز الهوية الوطنية بصورة أعمق؟",["مشروع طلابي يبحث فيه الطلاب تاريخ الدولة ويعرضونه بالشواهد","ارتداء الزي التراثي دون محتوى معرفي","حفظ تاريخ الحدث لاختبار قصير","عرض مقطع مرئي دون مناقشة"],"المشروع يجعل الطالب يبني المعرفة بنفسه ويربطها بالشواهد. الزي والحفظ والعرض الصامت مظاهر لا تبني الانتماء."],
["L01","m","ميل المعلم إلى التهاون في تطبيق القيم بحجة التيسير يقع في:",["التفريط","الغلو","الوسطية","الحياد"],"التفريط هو التقصير والتهاون، وهو الطرف المقابل للغلو. الحياد مصطلح يخص القضايا الخلافية لا تطبيق القيم."],
["L01","","معلم يتحدث في الصف بازدراء عن شعوب أخرى. سلوكه يتعارض مع:",["قيم التسامح والتعايش والتفاعل الإيجابي مع الثقافات التي نص عليها الميثاق","لائحة الوظائف التعليمية","قواعد الانضباط الصفي","تعليمات الأنشطة غير الصفية"],"الازدراء يناقض الوسطية والتسامح المنصوص عليهما في الميثاق. اللوائح الأخرى تنظيمية ولا تعالج القيم."],
["L01","m","قيمة «حب الوطن» عندما تصبح جزءاً من شخصية الطالب يتصرف بها تلقائياً تكون في مستوى كراثول:",["تمثّل القيمة","الاستقبال","الاستجابة","التنظيم"],"أعلى مستويات المجال الوجداني أن تصبح القيمة طابعاً للشخصية. التنظيم يسبقه (ترتيب القيم في نسق)، والاستقبال والاستجابة أدنى."],
["L01","","طلاب في المرحلة الثانوية يشككون في جدوى بعض أنظمة الدولة. الاستجابة التربوية الأنسب:",["حوار هادئ يعرض الحقائق والشواهد ويبين قنوات التعبير النظامية","تجاهل حديثهم لأنه خارج المنهج","التهديد بالإبلاغ عنهم","مجاراتهم في النقد لكسب ثقتهم"],"المراهق يحتاج حواراً بالشواهد وتوجيهاً إلى القنوات النظامية، وهذا جوهر تعزيز الهوية. التهديد يقطع الثقة، والمجاراة تخل بالحياد والقدوة."],
["L01","hm","عُين معلم لتدريس فصل يضم طلاباً من خلفيات لغوية وثقافية متنوعة. يعزز المعلم تعلمهم على أفضل وجه عن طريق:",["إتاحة الفرصة للطلاب ليتحدثوا عن محتوى الدرس","جمع ذوي المستوى المتقارب في مجموعات منفصلة","استخدام أسئلة تتيح إجابات مختصرة","اتباع طريقة ثابتة لتقديم المفاهيم"],"سؤال من دليل الهيئة 1441: التنوع يُستثمر بإتاحة الحديث والمشاركة. التجميع المتجانس يعزل، والإجابات المختصرة والطريقة الثابتة تحرمهم من التعبير."],
// ===== L02: أخلاقيات المهنة وسياسة التعليم واللوائح =====
["L02","hm","وفق وثيقة سياسة التعليم يُقبل الطالب في الصف الأول الابتدائي إذا أكمل:",["ست سنوات هجرية في اليوم الأول من بداية الدراسة","ست سنوات ميلادية في اليوم الأول من بداية الدراسة","خمس سنوات ميلادية واجتاز اختبار قبول مبكر","خمس سنوات وثمانية أشهر عند بداية الدراسة"],"النص: من أكمل ست سنوات هجرية في اليوم الأول من الدراسة أو قبله. البديل «ميلادية» هو الفخ المتكرر، والقبول المبكر استثناء محدود بتسعين يوماً لا يغير القاعدة."],
["L02","h","من اختصاصات اللجنة العليا لسياسة التعليم:",["إقرار الخطة التعليمية","إعداد المعلمين","بناء المقررات الدراسية","تدريب المعلمين أثناء الخدمة"],"اللجنة العليا ترسم السياسة وتقر الخطط. إعداد المعلمين وتدريبهم وبناء المقررات مهام تنفيذية للوزارة والجامعات."],
["L02","h","وفق وثيقة سياسة التعليم يكون الاهتمام بذوي الاحتياجات الخاصة بـ:",["وضع سياسة شاملة لرعايتهم","توجيه الرعاية الأكبر للموهوبين والنابغين","إعطاء الأولوية للمعاقين ذهنياً","ترك رعايتهم للمؤسسات الأهلية"],"الوثيقة تنص على التربية الخاصة والعناية بذوي الاحتياجات ضمن سياسة شاملة. تفضيل فئة على أخرى أو ترك الرعاية للأهلي يخالف مبدأ التعليم حق لكل مواطن."],
["L02","hm","يخطط معلم لأنشطته بحيث تنمو شخصية الطالب في جوانبها الجسمية والعقلية والنفسية والاجتماعية والروحية معاً. المبدأ الذي يطبقه من مبادئ سياسة التعليم:",["التربية المتكاملة","التربية للحياة","الأصالة والتجديد","تكافؤ الفرص"],"رعاية جوانب الشخصية كلها هي التربية المتكاملة. «التربية للحياة» تزويد المواطن بالقدر المناسب من العلم ليكون عضواً صالحاً، والأصالة والتجديد التمسك بالتراث مع المعاصرة، وتكافؤ الفرص إتاحة التعليم للجميع."],
["L02","h","يهدف ميثاق أخلاقيات مهنة التعليم إلى:",["تعزيز انتماء المعلم لرسالته ومهنته والارتقاء بها","تعزيز الانتماء الديني والوطني للمعلم فقط","بث روح الفريق بين المعلم والمدير والطالب","تعامل المعلم مع الطلاب بالعدل وعدم التمييز"],"المادة الثانية تنص على أن الميثاق يهدف إلى تعزيز انتماء المعلم لرسالته ومهنته والارتقاء بها. العدل وروح الفريق بنود من واجبات المعلم لا من أهداف الميثاق العامة."],
["L02","hm","«الإسهام في تعزيز مكانة المعلم العلمية والاجتماعية» تمثل أحد:",["أهداف ميثاق أخلاقيات مهنة التعليم","أهداف سياسة التعليم في المملكة","الحقوق الوظيفية وفق الخدمة المدنية","متطلبات الممارسة المهنية"],"هذا نص الهدف الثاني في المادة الثانية من الميثاق. سياسة التعليم تتناول غايات التعليم والطالب لا مكانة المعلم."],
["L02","h","اختلف معلمون في المدرسة حول أمر مهني. الطريقة التي يُحل بها الخلاف:",["يراجعون ميثاق أخلاقيات مهنة التعليم بالمملكة","الرجوع إلى مدير المدرسة للحكم بينهم","ترك الأمر لكل منهم ليقرر ما يقتنع به","مراجعة المواثيق العالمية في أخلاقيات المهنة"],"الميثاق هو المرجع الوطني المعتمد لأخلاقيات المهنة. المواثيق العالمية ليست ملزمة محلياً، وحكم المدير لا يُغني عن المرجع المكتوب."],
["L02","hm","شاهد المعلم أحد طلابه يدخن خارج أسوار المدرسة. الإجراء الصحيح:",["يبلغ المرشد الطلابي ومدير المدرسة بسلوك الطالب","يتجاهل الأمر لأنه خارج المدرسة","يتصل بوالد الطالب فوراً ويخبره","يوبخه أمام زملائه في اليوم التالي"],"لائحة السلوك تشمل محيط المدرسة بمرأى منسوبيها، والجهة المختصة بالمتابعة هي المرشد والإدارة. اتصال المعلم بالوالد مباشرة يتجاوز القناة النظامية، والتوبيخ العلني يخالف الميثاق."],
["L02","h","تلقى معلم اتصالاً من أخصائي نفسي في عيادة خارج المدرسة يطلب معلومات عن أحد طلابه. الخطوة الأولى التي يتبعها:",["التحدث مع إدارة المدرسة بذلك واتباع تعليماتها","تصوير سجلات الطالب الأكاديمية وإرسالها","استشارة معلمين آخرين لإعداد سجل غير رسمي وإرساله","إبلاغ الطالب وأخذ إذنه بإرسال المعلومات"],"سؤال من دليل الهيئة 1441 (المعيار 1.3): بيانات الطالب سرية ولا تخرج إلا عبر الإدارة. إذن الطالب وحده لا يكفي لأنه قاصر وليس صاحب الصلاحية."],
["L02","hm","اتفق المعلم مع طلابه على معايير لضبط الصف مثل رفع اليد قبل السؤال. يجب أن تكون هذه المعايير:",["متسقة مع قواعد الانضباط التي أقرتها وزارة التعليم","متضمنة لتوقعات الطلاب وأولياء الأمور معاً","متسقة مع معايير المعلمين الآخرين في المدرسة","متضمنة عقوبات محسوسة في حال المخالفة"],"القواعد الصفية لا تعلو على النظام الرسمي للوزارة. اتساقها مع معلمي المدرسة أمر حسن لكنه ليس الشرط الملزم، والعقوبات المحسوسة قد تخالف اللائحة."],
["L02","h","بحسب قواعد السلوك والمواظبة، الإجراء الذي لا يُعد من الإجراءات المعتمدة حيال اعتداء طالب على زميله بالضرب:",["عقاب الطالب أمام زملائه بما يوازي خطأه","إشعار ولي الأمر","تعهد خطي يكتبه الطالب","نقل الطالب إلى فصل آخر"],"العقاب العلني يمس كرامة الطالب ويخالف الميثاق واللائحة معاً. الإشعار والتعهد والنقل إجراءات تصحيحية منصوص عليها."],
["L02","hm","استجابة المعلم الإيجابية أو السلبية للمواقف النفسية والتربوية المرتبطة بمهنة التدريس تشير إلى:",["اتجاهه نحو مهنة التدريس","كفايات مهنة التدريس","مهارات مهنة التدريس","فاعليته التدريسية"],"الاتجاه هو الاستجابة الوجدانية (إيجابية أو سلبية) نحو موضوع. الكفايات والمهارات قدرات أدائية لا مواقف وجدانية."],
["L02","h","من حقوق المعلم الوظيفية وفق لائحة الوظائف التعليمية:",["الاطلاع على تقويم أدائه الوظيفي","دراسة المناهج وتقويمها","المشاركة في برامج النشاط","حضور الاجتماعات المدرسية"],"الاطلاع على التقويم والتظلم منه حق نصت عليه اللائحة. البدائل الثلاثة الأخرى واجبات وظيفية لا حقوق."],
["L02","","صدرت وثيقة سياسة التعليم في المملكة العربية السعودية عام:",["1390هـ","1427هـ","1440هـ","1373هـ"],"صدرت بقرار مجلس الوزراء رقم 779 عام 1390هـ. 1427هـ عام الميثاق، و1440هـ عام لائحة الوظائف التعليمية، و1373هـ تأسيس وزارة المعارف."],
["L02","","صدر ميثاق أخلاقيات مهنة التعليم عن وزارة التربية والتعليم عام:",["1427هـ","1390هـ","1440هـ","1428هـ"],"الميثاق صدر عام 1427هـ. 1428هـ عام نظام مكافحة الجرائم المعلوماتية، فلا تخلط بينهما."],
["L02","m","الرخصة المهنية للمعلم وثيقة تصدرها:",["هيئة تقويم التعليم والتدريب","وزارة التعليم","إدارة التعليم بالمنطقة","المعهد الوطني للتطوير المهني التعليمي"],"اللائحة تعرّف الرخصة بأنها وثيقة تصدرها الهيئة وفق معايير محددة. الوزارة جهة التوظيف لا جهة الترخيص."],
["L02","hm","رتب الوظائف التعليمية وفق لائحة الوظائف التعليمية (1440هـ) بالترتيب:",["مساعد معلم، معلم، معلم ممارس، معلم متقدم، معلم خبير","معلم، معلم أول، معلم خبير، مشرف تربوي","معلم مبتدئ، معلم ممارس، معلم خبير","معلم ممارس، معلم متقدم، معلم خبير فقط"],"الرتب خمس تبدأ بمساعد معلم وتنتهي بخبير. البديل الأخير ينسى رتبتي «مساعد معلم» و«معلم» (لحامل المؤهل دون الجامعي)."],
["L02","","الدرجة المطلوبة في اختبار الرخصة المهنية للحصول على رتبة معلم متقدم:",["70 فأعلى","50 فأعلى","80 فأعلى","60 فأعلى"],"ممارس 50 فأعلى، متقدم 70 فأعلى، خبير 80 فأعلى، وتُطلب الدرجة في الاختبارين معاً."],
["L02","","مدة صلاحية الرخصة المهنية للمعلم:",["خمس سنوات","ثلاث سنوات","عشر سنوات","سنتان"],"الرخصة سارية خمس سنوات من الإصدار أو التجديد أو الترقية، ويُطلب إصدارها خلال 12 شهراً من إعلان أحدث نتيجة."],
["L02","m","حصل معلم على 82 في الاختبار التربوي العام و74 في اختبار التخصص. أعلى رتبة يمكنه الحصول عليها:",["معلم متقدم","معلم خبير","معلم ممارس","معلم خبير بعد سنة"],"الدرجة تُحسب بأدنى الاختبارين لأن المستوى مطلوب في كليهما؛ 74 تحقق متقدم (70 فأعلى) ولا تحقق خبير (80). لا يوجد تعويض أو درجة موزونة."],
["L02","","من شروط الترقية من رتبة معلم ممارس إلى معلم متقدم وفق اللائحة:",["رخصة سارية بالمستوى المطلوب وتقويم أداء جيد جداً فأعلى آخر ثلاث سنوات وإكمال سنوات الرتبة","اجتياز الاختبار بأي درجة وموافقة مدير المدرسة","حضور عدد محدد من الدورات التدريبية فقط","تزكية من المشرف التربوي"],"الشروط الثلاثة مجتمعة: الرخصة بالمستوى، والتقويم جيد جداً فأعلى لثلاث سنوات، وسنوات الرتبة (6 بكالوريوس، 5 ماجستير، 4 دكتوراه)."],
["L02","m","النصاب التعليمي الأسبوعي للمعلم الخبير:",["18 حصة","24 حصة","22 حصة","20 حصة"],"ممارس 24، متقدم 22، خبير 18؛ يقل النصاب بارتفاع الرتبة لإتاحة وقت لمهام التطوير والإسناد."],
["L02","","تعرّف لائحة الوظائف التعليمية «التطوير المهني» بأنه:",["عملية منظمة لتنمية المعارف والمهارات العلمية والتربوية وفق المعايير المهنية","الدورات التدريبية التي تقيمها إدارة التعليم","ما يحصل عليه المعلم من مؤهلات أكاديمية","تقويم الأداء الوظيفي السنوي"],"التعريف يربط التطوير بالمعايير المهنية ويجعله عملية منظمة مستمرة لا مجرد دورات أو شهادات."],
["L02","","يُعد المعيّن ابتداءً على الوظائف التعليمية تحت التجربة لمدة:",["سنتين","سنة","ستة أشهر","ثلاث سنوات"],"مدة التجربة سنتان يُقوَّم خلالها مرة على الأقل، وإذا لم تثبت صلاحيته تنتهي خدمته."],
["L02","","عدد سنوات الرتبة المطلوبة لترقية معلم يحمل البكالوريوس إلى الرتبة التالية:",["ست سنوات","أربع سنوات","خمس سنوات","ثلاث سنوات"],"6 سنوات للبكالوريوس، 5 للماجستير، 4 للدكتوراه. ثلاث سنوات هي مدة التقويم المطلوبة (جيد جداً) لا سنوات الرتبة."],
["L02","m","«الحصص التي يقضيها شاغل الوظيفة التعليمية في التخطيط والتقويم وإدارة الأنشطة والمشاركة في التطوير المهني» تسمى في اللائحة:",["الأنشطة اللاصفية","الحصص الصفية","النصاب التعليمي","الحصص الاحتياطية"],"اللائحة تسمي كل ما هو خارج التدريس المباشر أنشطة لاصفية. النصاب هو مجموع الحصص الصفية التدريسية."],
["L02","h","أتى ولي أمر غاضب أثناء الحصة الأخيرة يريد أخذ ابنه، ولا يبدو بحالة جيدة. ما ينبغي على المعلم:",["تحويل ولي الأمر إلى إدارة المدرسة","السماح للابن بالخروج مع والده","أخذ رأي الطالب في الخروج من عدمه","الطلب من ولي الأمر الانتظار حتى نهاية الحصة"],"الاستئذان إجراء إداري بسجلات وصلاحيات، والمعلم لا يملك تسليم الطالب خاصة مع حالة غير مطمئنة. الانتظار أو رأي الطالب حلول تتجاوز النظام."],
["L02","","تُسلَّم نسخة من الدليل التنظيمي لقواعد السلوك والمواظبة ويؤخذ توقيعه بالعلم من:",["ولي الأمر","المرشد الطلابي","معلم الفصل","وكيل شؤون الطلاب"],"اللائحة تشترط إعلام ولي الأمر بالقواعد وتوقيعه عليها ليكون شريكاً في الالتزام، ثم يوقع لاحقاً على العقود السلوكية والتعهدات."],
["L02","","تُطبق لائحة السلوك والمواظبة على طلاب المرحلتين المتوسطة والثانوية إذا وقعت المخالفة:",["في الطرقات المحيطة بالمدرسة بمرأى أحد منسوبيها","داخل أسوار المدرسة فقط","في أي مكان خارج المدرسة","في حافلة النقل المدرسي فقط"],"نطاق اللائحة: داخل المدرسة، والأنشطة الخارجية، والحافلات، ويضاف للمتوسطة والثانوية محيط المدرسة بمرأى منسوبيها. «أي مكان» توسيع غير منصوص."],
["L02","m","تتعامل مع المشكلة السلوكية لطالب من برامج ذوي الاحتياجات الخاصة في المدرسة:",["لجنة التوجيه والإرشاد مع قسم التربية الخاصة","معلم الفصل منفرداً دون الرجوع لأحد","مدير المدرسة مباشرة دون اللجنة","ولي الأمر وحده في المنزل"],"اللائحة تخص هذه الفئة بإجراء تكاملي بين اللجنة والتربية الخاصة لمراعاة خصائصهم."],
["L02","","أفشى معلم في مجلس عام معلومات عن ظروف أسرة أحد طلابه. سلوكه يخالف في الميثاق:",["صون كرامة الطالب وحفظ أسراره وأسرة طالبه","واجب النمو المهني","العمل بروح الفريق","التعاون مع المجتمع المحلي"],"السرية من واجبات المعلم تجاه طلابه وأسرهم. البدائل الأخرى واجبات مهنية لا علاقة لها بالخصوصية."],
["L02","m","اتخذ معلم من حصته ساحة لمناقشة قضايا لا علاقة لها بتعليم طلابه في تخصصه. يخالف بذلك بند الميثاق الذي ينص على أن المعلم:",["يستثمر أوقات طلابه ولا يتخذ الدروس ساحة لغير تعليمهم","قدوة لطلابه خاصة وللمجتمع عامة","شريك الوالدين في التربية والتنشئة","أمين على كيان الوطن ووحدته"],"نص المادة الخامسة صريح في استثمار وقت الطالب وعدم تحويل الدرس إلى منبر لغير التعليم."],
["L02","","يعاقب معلم طلابه بالضرب والتوبيخ النفسي. موقف الميثاق:",["الطالب ينفر من المدرسة التي يُستخدم فيها العقاب البدني والنفسي، والمربي القدير يتجنبهما","العقاب البدني جائز إذا كان خفيفاً","العقاب النفسي مقبول بديلاً عن البدني","يحق للمعلم اختيار أسلوب العقاب بحرية"],"الميثاق يرفض العقاب البدني والنفسي معاً. البديل «النفسي مقبول» فخ لأن النص يذكرهما معاً."],
["L02","","«المعلم شريك الوالدين في التربية والتنشئة» بند من مادة:",["المعلم والأسرة","المعلم وطلابه","المعلم والمجتمع المدرسي","المعلم وأداؤه المهني"],"المادة الثامنة (المعلم والأسرة) تجعل المعلم شريكاً للوالدين ويوطد الثقة بين البيت والمدرسة."],
["L02","","يرى الميثاق أن أساس العلاقة بين المعلم وزملائه وبين المعلم والإدارة هو:",["الثقة المتبادلة والعمل بروح الفريق الواحد","المنافسة على التميز","الالتزام الرسمي بالمراسلات","التسلسل الإداري الصارم"],"مادة المعلم والمجتمع المدرسي تنص على الثقة وروح الفريق. المنافسة الفردية تناقض ثقافة التعاون."],
["L02","m","المعلم الذي يتابع كل جديد في تخصصه وفنون التدريس يدرك أن النمو المهني في الميثاق:",["واجب أساس والثقافة الذاتية المستمرة منهج حياة","خيار شخصي مرتبط بالرغبة","مسؤولية إدارة التعليم وحدها","مطلوب للترقية فقط"],"المادة الرابعة تجعل النمو المهني واجباً أساسياً على المعلم نفسه، لا خياراً ولا مسؤولية الإدارة."],
["L02","","يرفض معلم تنفيذ تعميم من الوزارة بحجة أنه لا يقتنع به. تصرفه يخالف:",["الالتزام بالأنظمة والتعليمات الرسمية","حق المعلم في التظلم من القرارات","مبدأ التطوير المهني الذاتي المستمر","قواعد ضبط الصف وإدارته"],"الميثاق يعد احترام قواعد السلوك الوظيفي والالتزام بالأنظمة ركناً أساسياً. الاعتراض يكون عبر قنوات التظلم لا بالامتناع."],
["L02","","تنص الغاية من التعليم في وثيقة السياسة على:",["فهم الإسلام فهماً صحيحاً متكاملاً وغرس العقيدة الإسلامية","إعداد الطالب لمتطلبات سوق العمل فقط","حفظ المقررات الدراسية واستظهارها","تخريج أكبر عدد ممكن من الطلاب"],"الغاية في المادة 28 تبدأ بفهم الإسلام وغرس العقيدة ثم القيم والمعارف والمهارات. سوق العمل هدف من أهداف رؤية 2030 لا الغاية الأصلية للوثيقة."],
["L02","","مراحل التعليم العام وفق وثيقة سياسة التعليم:",["ابتدائي ست سنوات ومتوسط ثلاث وثانوي ثلاث","ابتدائي خمس ومتوسط أربع وثانوي ثلاث","ابتدائي ست ومتوسط ثلاث وثانوي أربع","ابتدائي أربع ومتوسط أربع وثانوي أربع"],"السلم التعليمي اثنا عشر صفاً: 6 + 3 + 3."],
["L02","m","يجوز لمدير المدرسة قبول طفل يقل عمره عن ست سنوات ولا يحمل شهادة من رياض الأطفال بما لا يزيد على:",["تسعين يوماً، بعد قبول جميع من أتم السادسة","سنة كاملة بموافقة ولي الأمر","ستة أشهر دون أي شرط","ثلاثين يوماً بعد اختبار قبول"],"الاستثناء العام تسعون يوماً مشروط بقبول من أتموا السادسة أولاً. ويرتفع الحد إلى مائة وثمانين يوماً فقط لمن يقدم شهادة انتظام فصلين في رياض الأطفال، وهذا هو الفخ في بديل «ستة أشهر»."],
["L02","","معلم يتهاون في الحضور المبكر لحصصه ويغادر قبل انتهائها. سلوكه يتعارض أولاً مع:",["احترام قواعد السلوك الوظيفي والالتزام بالأنظمة","مبدأ الشراكة المجتمعية","متطلبات البحث الإجرائي","تنمية الهوية الوطنية"],"المواظبة من قواعد السلوك الوظيفي التي عدها الميثاق ركناً في تحقيق أهداف المؤسسة."],
["L02","m","طُلب من معلم تسليم درجات طلابه لجهة خارجية تجري دراسة. الإجراء الصحيح:",["الرجوع إلى إدارة المدرسة وتسليم البيانات عبر القنوات الرسمية فقط","تسليمها مباشرة لأنها لغرض البحث العلمي","رفض أي تعاون مع الجهات الخارجية","تسليمها بعد حذف الأسماء دون الرجوع للإدارة"],"بيانات الطلاب لا تخرج إلا بإذن الإدارة ووفق النظام. حذف الأسماء لا يغني عن الإذن، والرفض المطلق يعطل التعاون البحثي المشروع."],
