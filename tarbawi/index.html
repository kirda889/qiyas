roblem]] (ديوي) يبدأ **بالشعور بالمشكلة** ← تحديدها ← البيانات ← الفروض ← اختبارها ← التعميم.","[[**المشروعات**|ar.l11.project]] (كلباترك، تلميذ ديوي): اختيار ← تخطيط ← تنفيذ ← تقويم، وتنتهي بمنتج ملموس.","الفرق في النهاية: الاكتشاف ← **مفهوم**، وحل المشكلات يعالج مشكلة محددة بخطوات، والمشروع ← منتج.","أكثر الطرق تطلباً **لفعالية المتعلم** الاكتشاف والمشروعات، وأقلها المحاضرة؛ وفي **دراسة الحالة** يحلل الطلاب ظاهرة ويقررون علاجها."],"t":[["الاكتشاف الموجه","المعلم يحدد المشكلة ويوجه بأسئلة وأدوات والطالب يصل إلى المفهوم."],["الاكتشاف الحر","الطالب يحدد المشكلة والأدوات والإجراءات دون توجيه مسبق."],["حل المشكلات","طريقة ديوي: شعور بالمشكلة، تحديد، فروض، اختبار، نتيجة."],["طريقة المشروعات","عمل هادف ممتد ينفذه الطلاب وينتهي بمنتج، رائدها كلباترك."],["الفرض","تفسير مؤقت محتمل للمشكلة يُختبر بالأدلة."],["دراسة الحالة","تحليل موقف واقعي مفصل واقتراح قرار أو حل له."]],"intro":[],"ex":[]},{"h":"التعليم المبرمج والتعلم الذاتي","pts":["[[**التعليم المبرمج**|ar.l11.programmed]] (سكنر) **سلوكي**: خطوات صغيرة، واستجابة نشطة، وتعزيز فوري، وخطو ذاتي.","**البرمجة الخطية** (سكنر) مسار واحد، و**المتشعبة** (كراودر) تحوّل المخطئ إلى إطار علاجي ثم تعيده.","عيبه أنه **لا ينمي التفاعل الاجتماعي** ولا يناسب الأهداف الوجدانية والإبداع.","[[**التعلم الذاتي**|ar.l11.self]] يتحمل فيه المتعلم مسؤولية تعلمه؛ ومن وسائله الحقيبة التعليمية والموديول وعقد التعلم.","**الفردي**: المهام نفسها لكل طالب منفرداً؛ و**التفريدي**: مهام مختلفة وفق ميوله.","**عقد التعلم** اتفاق مكتوب يتعهد فيه الطالب بمهام محددة وفق معايير مقابل تقدير."],"t":[["التعليم المبرمج","تقسيم المادة إلى خطوات صغيرة بتعزيز فوري وخطو ذاتي، رائده سكنر."],["البرمجة المتشعبة","برنامج كراودر الذي يحوّل المتعلم عند الخطأ إلى إطار علاجي."],["الحقيبة التعليمية","وحدة تعلم ذاتي متكاملة بوسائط متعددة واختبار قبلي وبعدي."],["الموديول","وحدة تعليمية صغيرة مستقلة ضمن برنامج تعلم ذاتي."],["الخطو الذاتي","انتقال المتعلم بين الخطوات بسرعته الخاصة."],["عقد التعلم","اتفاقية مكتوبة بين المعلم والطالب على مهام ومعايير وتعزيز."],["التعلم الموصوف للفرد","خطة تعليمية علاجية تُبنى لطالب واحد بعد تشخيصه."],["المجمعات التعليمية","برامج تعليمية ذاتية متكاملة تجمع بين الحقائب والتعلم للإتقان."],["برامج المحاكاة","برمجيات تمثل مواقف يصعب أو يخطر تنفيذها واقعياً."]],"intro":[],"ex":[]},{"h":"الاستراتيجيات الاجتماعية: التعاوني ولعب الأدوار والعصف والتبادلي والأقران والمصغر","pts":["[[**التعلم التعاوني**|ar.l11.coop]] (جونسون وجونسون): مجموعات **غير متجانسة** 4–6 بخمسة عناصر، أولها الاعتماد الإيجابي المتبادل.","[[**جيكسو (المجموعات المتداخلة)**|ar.l11.jigsaw]] (أرونسون): مجموعة خبراء ثم عودة لتعليم المجموعة الأم؛ وفي فرق التحصيل (STAD) لسلافين درجة الفريق من التحسن.","[[**العصف الذهني**|ar.l11.social]] (أوزبورن): إرجاء النقد، وحرية التفكير، و**الكم قبل الكيف**، والبناء على أفكار الآخرين.","**التدريس التبادلي** (بالينسكار وبراون) للفهم القرائي: التنبؤ، وتوليد الأسئلة، والتوضيح، والتلخيص، ويتبادل الطلاب دور المعلم.","**التدريس المصغر**: مهارة تدريسية واحدة مع 5–10 طلاب في 5–10 دقائق، ثم تسجيل وتغذية راجعة وإعادة.","**لعب الأدوار** لا يُقاطع فيه المشهد وتُناقش السلوكيات بعده، و**تدريس الأقران** يستفيد منه الطرفان.","بيئات التعلم ثلاث: **تنافسية** (فوز طالب خسارة آخر)، وفردية، وتعاونية."],"t":[["الاعتماد الإيجابي المتبادل","إدراك أعضاء المجموعة أنهم ينجحون معاً أو يفشلون معاً."],["المسؤولية الفردية","كل عضو مسؤول عن تعلمه وعن إسهامه في عمل المجموعة."],["جيكسو","استراتيجية المجموعات المتداخلة ومجموعات الخبراء (أرونسون)."],["العصف الذهني","توليد أكبر كم من الأفكار بحرية مع إرجاء الحكم (أوزبورن)."],["التدريس التبادلي","حوار منظم حول نص بالتلخيص والتساؤل والتوضيح والتنبؤ."],["تدريس الأقران","تعليم الطلاب بعضهم بعضاً بإشراف المعلم."],["التدريس المصغر","موقف تدريسي قصير لمهارة واحدة مع عدد قليل بتغذية راجعة."],["لعب الأدوار","محاكاة موقف واقعي يتقمص فيه المتعلمون أدواراً ثم يناقشونها."],["بيئة التعلم التنافسية","موقف يرتبط فيه نجاح طالب بفشل غيره."],["الألعاب التعليمية","نشاط تنافسي ممتع موجه لتحقيق أهداف تعليمية."]],"ex":[],"intro":[]},{"h":"مخروط الخبرة لإدجار ديل","pts":["رتّب [[**إدجار ديل**|ar.l11.dale]] الخبرات من الأكثر حسية في **القاعدة** إلى الأكثر تجريداً في القمة.","القاعدة **الخبرات المباشرة الهادفة**، ثم المعدلة (النماذج والمجسمات)، ثم الممثلة (الدراما ولعب الأدوار).","القمة **الرموز اللفظية**، وتحتها الرموز البصرية (الخرائط والرسوم).","المجسم خبرة **معدلة** لا مباشرة، و**المحاكاة** بديل للتجارب الخطرة أو المكلفة؛ والأصغر سناً يحتاج القاعدة أكثر."],"t":[["مخروط الخبرة","تصنيف ديل للخبرات من المباشرة (القاعدة) إلى الرموز اللفظية (القمة)."],["الخبرة المباشرة الهادفة","ما يمارسه المتعلم بنفسه في موقف حقيقي."],["الخبرة المعدلة","نماذج ومجسمات تحاكي الواقع عندما يتعذر الأصل."],["الرموز اللفظية","الكلمات المنطوقة والمكتوبة وهي قمة التجريد."],["المحاكاة","خبرة بديلة آمنة تمثل موقفاً حقيقياً يصعب تنفيذه."]],"intro":[],"ex":[]},{"h":"أسس المداخل الأربعة للتدريس كما في مؤشرات 7.1","pts":["مؤشر 7.1: يحدد **الأسس النظرية** للمداخل العامة للتدريس؛ والمداخل أربعة: السلوكي، والمعرفي، والإنساني، والاجتماعي.","**نمذجة السلوك** (اجتماعي): المعلم أو زميل يؤدي السلوك المرغوب ليحاكيه الطلاب، مع تعزيز من يتقنه.","تمييز سريع: «خطوات صغيرة وتعزيز» سلوكي، «يكتشف بنفسه» معرفي، «يختار ويقوّم ذاته» إنساني، «بالقدوة والزملاء» اجتماعي."],"t":[["المدخل السلوكي","مدخل يركز على تعديل السلوك الظاهر بتحليل المهمة والتعزيز والإتقان."],["المدخل المعرفي","مدخل يركز على العمليات العقلية ووصول المتعلم إلى المعرفة بالبحث والاكتشاف."],["المدخل الإنساني","مدخل يركز على الجوانب الوجدانية والوعي بالذات والاستقلالية والمسؤولية (روجرز)."],["المدخل الاجتماعي","مدخل يوظف التفاعل ونمذجة السلوك لبناء ثقافة صفية إيجابية (باندورا)."],["التدريس غير الموجه","نموذج روجرز: المعلم ميسّر متقبل يشارك الطالب أهدافه وتقويم تقدمه."],["تحليل المهمة","تجزئة المهارة إلى خطوات صغيرة متتابعة تُتقن واحدة بعد أخرى."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Four Teaching Approaches","المداخل الأربعة للتدريس"],"groups":[{"n":"السلوكي","who":"Skinner سكنر","ar":"**التغيير والتعديل في السلوك** الظاهر و**استجابة المتعلمين للمهام** والتعزيز","d":"ar.l11.approaches","items":[{"n":"التعلم للإتقان"},{"n":"التعليم المباشر"},{"n":"التعليم المبرمج"}]},{"n":"المعرفي","who":"Piaget · Bruner · Ausubel","ar":"**التفكير والبحث والاكتشاف ذاتياً** والوصول إلى المعرفة بجهده","d":"ar.l11.approaches","items":[{"n":"الاكتشاف"},{"n":"الاستقصاء"},{"n":"اكتساب المفاهيم"},{"n":"المنظم المتقدم"}]},{"n":"الإنساني (الشخصي)","who":"Rogers روجرز · Maslow","ar":"الوعي بالذات والاستقلالية والمسؤولية؛ المعلم **ميسّر**","d":"ar.l11.approaches","items":[{"n":"التدريس غير الموجه"},{"n":"عقود التعلم"},{"n":"التقويم الذاتي"}]},{"n":"الاجتماعي","who":"Bandura باندورا · Vygotsky","ar":"التفاعل و**نمذجة السلوك** لدعم **النظم التفاعلية** وثقافة صفية إيجابية","d":"ar.l11.approaches","items":[{"n":"التعلم التعاوني"},{"n":"لعب الأدوار"},{"n":"التقصي الجماعي"}]}]}},{"h":"العروض العملية والتغيير المفاهيمي","pts":["مؤشر 7.2: العرض العملي من الطرق **المباشرة**، والتغيير المفاهيمي من طرق التدريس **البنائي**.","العرض العملي أداء مع **شرح متزامن**؛ الأنسب للتجارب الخطرة أو المكلفة أو قليلة الأدوات.","**التصورات البديلة** أفكار تخالف العلم و**مقاومة للتغيير** لأنها مبنية على الخبرة اليومية.","[[**التغيير المفاهيمي**|ar.l11.conceptual]] (بوسنر) بأربعة شروط: **عدم الرضا** ← واضح ← معقول ← مثمر.","إعادة شرح الصواب **دون إحداث عدم الرضا** لا تغير التصور غالباً."],"t":[["خطوات العرض العملي","تجريب مسبق، توضيح الهدف، رؤية الجميع، أداء متدرج مع الشرح والسلامة، ثم تطبيق الطلاب."],["التصورات البديلة","مفاهيم خاطئة لدى الطالب تخالف المفهوم العلمي وتقاوم التغيير."],["التغيير المفاهيمي","استبدال التصور البديل بالمفهوم العلمي بشروط: عدم الرضا، الوضوح، المعقولية، الإثمار."],["التناقض المعرفي","مواجهة الطالب بما يخالف توقعه فيشعر بعدم الرضا عن تصوره."],["توقع – لاحظ – فسر","استراتيجية يتوقع فيها الطالب النتيجة ثم يلاحظ ثم يفسر الفرق بينهما."]],"intro":[],"ex":[]}],"trap":["[[**الأسلوب**|ar.l11.terms]] ما يميز المعلم شخصياً، و**الطريقة** إجراءات عامة يشترك فيها المعلمون؛ معلمان بطريقة واحدة = أسلوبان.","[[**الاستقراء**|ar.l11.induct]] أمثلة ← قاعدة، و**الاستنباط** قاعدة ← أمثلة؛ لا تخلط بينهما بسبب كلمة «استنتاج».","**الاكتشاف** يصل إلى مفهوم، و[[**حل المشكلات**|ar.l11.problem]] يعالج مشكلة بخطوات ديوي، و**المشروع** ينتهي بمنتج (كلباترك).","الخطوة الأولى في حل المشكلات **الشعور بالمشكلة** لا تحديدها ولا وضع الفروض.","**ديوي** صاحب حل المشكلات ومنهج النشاط، و[[**كلباترك**|ar.l11.project]] صاحب المشروعات، و**برونر** صاحب الاكتشاف، و**أوزبورن** صاحب العصف.","**الاكتشاف الموجه**: المعلم يحدد المشكلة والأدوات؛ **الحر**: الطالب يحدد الأدوات والإجراءات.","[[**جيكسو**|ar.l11.jigsaw]] مجموعات متداخلة بخبراء، و**فرق التحصيل** اختبار فردي ودرجة فريق من التحسن.","في العصف «هل هناك فكرة **أخرى**؟» صحيح، و«هل هناك فكرة **أفضل**؟» خطأ لأنه حكم على الأفكار.","**التدريس التبادلي** يتبادل فيه الطلاب دور المعلم حول نص مقروء، و**تدريس الأقران** طالب يعلّم طالباً، و**التعاوني** مجموعة لهدف مشترك.","**التدريس المصغر** للمعلم المتدرب على مهارة واحدة، وليس طريقة لتدريس الطلاب.","[[**التعليم المبرمج**|ar.l11.programmed]] سلوكي (سكنر) وفردي، و**المدمج** حضوري وإلكتروني، و**المتنقل** عبر الأجهزة المحمولة.","في مخروط ديل **القاعدة** مباشرة والقمة **رموز لفظية**؛ المجسم خبرة **معدلة** لا مباشرة.","**التعليم الفردي**: المهام نفسها لكل طالب منفرداً؛ **التفريدي**: مهام مختلفة لكل طالب بحسب ميوله؛ **الذاتي**: برغبة المتعلم ودون معلم.","**الاستقراء** أمثلة ← قاعدة (هربارت) ويناسب المجموعات الكبيرة ويطول وقته؛ **الاستنباط** قاعدة ← أمثلة وسريع لكن القاعدة تُنسى."],"vid":[["gpRfBrVb07o","تطبيقات المعيار السابع من معايير الرخصة المهنية","سهام الزهراني",23],["hYtkZI7UnDs","الفرق بين استراتيجية التدريس وطريقة التدريس وأسلوب التدريس","منصة البراعة",10],["yWUu2BxtyGk","شرح المعيار السابع: المعرفة بطرق التدريس العامة","سهام الزهراني",31],["IbuXK4l7vwY","الرخصة المهنية عام: استراتيجيات التدريس للتعلم النشط","قناة عين المبدع",75]],"map":{"title":["General Teaching Methods","طرق التدريس العامة"],"groups":[{"n":"طرق العرض المباشر","short":"العرض","ar":"المعلم مصدر الخبرة","idea":"تعلم استقبالي","items":[{"n":"الاستقراء والاستنباط","who":"Herbart هربارت","ar":"أمثلة ← قاعدة والعكس","d":"ar.l11.induct"},{"n":"المحاضرة","ar":"اقتصادية والمتعلم متلقٍّ","d":"ar.l11.lecture"}],"trap":"استنتاج القاعدة من الأمثلة استقراء"},{"n":"الاكتشاف والاستقصاء","short":"الاكتشاف","ar":"موجه أو حر","idea":"موجه وشبه موجه وحر","items":[{"n":"الاكتشاف","who":"Bruner برونر","ar":"يصل بنفسه إلى مفهوم","d":"ar.l11.discovery"}]},{"n":"المشكلات والمشروعات","short":"المشكلات","ar":"التعلم بالعمل","idea":"حل لمشكلة، أو منتج ملموس","items":[{"n":"حل المشكلات","who":"Dewey ديوي","ar":"يبدأ بالشعور بالمشكلة","d":"ar.l11.problem"},{"n":"المشروعات","who":"Kilpatrick كلباترك","ar":"ينتهي بمنتج","d":"ar.l11.project"}]},{"n":"التعلم الذاتي","short":"الذاتي","ar":"كل طالب بسرعته","idea":"خطوات صغيرة وتعزيز فوري","items":[{"n":"المبرمج الخطي","who":"Skinner سكنر","ar":"خطوات صغيرة ومسار واحد","d":"ar.l11.programmed"},{"n":"المبرمج المتشعب","who":"Crowder كراودر","ar":"إطار علاجي عند الخطأ"}]},{"n":"الاستراتيجيات الاجتماعية","short":"الاجتماعية","ar":"تعلم بالزملاء","idea":"نجاح مشترك ومسؤولية فردية","items":[{"n":"التعاوني","who":"Johnson & Johnson","ar":"اعتماد إيجابي متبادل","d":"ar.l11.coop"},{"n":"جيكسو","who":"Aronson أرونسون","ar":"مجموعات الخبراء","d":"ar.l11.jigsaw"},{"n":"العصف الذهني","who":"Osborn أوزبورن","ar":"الكم قبل الكيف","d":"ar.l11.social"}]},{"n":"الخبرة والمفاهيم","short":"الخبرة","ar":"من الحسي إلى المجرد","idea":"المخروط والتصورات البديلة","items":[{"n":"مخروط الخبرة","who":"Edgar Dale ديل","ar":"القاعدة خبرة مباشرة","d":"ar.l11.dale"},{"n":"التغيير المفاهيمي","who":"Posner بوسنر","ar":"عدم الرضا أولاً","d":"ar.l11.conceptual"}]}]},"n":11},{"id":"L12","d":"P","std":"8","sub":"8.1، 8.2","ar":"التخطيط للتدريس: الأهداف وتصنيف بلوم وخطة الدرس","goal":"تصوغ هدفاً سلوكياً سليماً، وتصنف أي هدف أو سؤال في مستواه ومجاله، وتعرف عناصر خطة الدرس وأدوات التخطيط التي يقيسها الاختبار.","sec":[{"h":"مستويات الأهداف وصياغة الهدف السلوكي","pts":["مستويات الأهداف: [[**الغايات**|ar.l12.levels]] ← الأهداف العامة (مرحلة أو مقرر) ← **الخاصة السلوكية** (درس واحد).","[[**الهدف السلوكي**|ar.l12.behav]] عند ماجر: أن + فعل سلوكي + الطالب + المحتوى + شرط الأداء + معيار الإتقان.","في «أن يحل 8 مسائل من 10 دون آلة حاسبة»: «8 من 10» **معيار**، و«دون آلة حاسبة» **شرط**.","يصف سلوك **المتعلم** لا المعلم، وناتجاً واحداً لا نشاطاً، بفعل قابل للملاحظة؛ ويلتقي مع صفات [[SMART|ar.l12.smart]].","أخطاء شائعة: «يوضح المعلم» سلوك معلم، و«يفهم/يدرك» لا يُقاس، و«يقرأ الدرس» نشاط لا ناتج."],"t":[["الغايات","أهداف تربوية بعيدة المدى تعبر عن فلسفة المجتمع."],["الهدف العام","ما يُتوقع تحقيقه في مرحلة أو مقرر، غير قابل للقياس المباشر."],["الهدف السلوكي","وصف دقيق لسلوك المتعلم المتوقع بعد الدرس، قابل للملاحظة والقياس."],["الفعل السلوكي","فعل يصف أداءً ظاهراً مثل يعدد، يحل، يرسم، يقارن."],["شرط الأداء","الظرف الذي يُؤدى فيه السلوك (بالخريطة، دون آلة حاسبة)."],["معيار الأداء","الحد الأدنى المقبول للإتقان (8 من 10، خلال دقيقتين)."]],"intro":[],"ex":[]},{"h":"تصنيف بلوم للمجال المعرفي: الأصلي والمعدل","pts":["[[**بلوم**|ar.l12.bloom]] (1956): المعرفة، الفهم، التطبيق، التحليل، التركيب، التقويم؛ والقمة **التقويم**.","[[المعدل|ar.l12.revised]] (أندرسون وكراثوول 2001): التذكر، الفهم، التطبيق، التحليل، التقويم، الإبداع؛ والقمة **الإبداع**.","صنّف الهدف بفعله عبر [[قائمة الأفعال|ar.l12.verbs]]: يقارن ويميز **تحليل**، ويحكم وينقد ويبرر تقويم، ويصمم ويقترح التركيب/الإبداع.","الدنيا: تذكر وفهم وتطبيق؛ والعليا: تحليل وتقويم وإبداع، وهي ما تستهدفه **أسئلة التفكير**."],"t":[["تصنيف بلوم","تدرج هرمي لأهداف المجال المعرفي في ستة مستويات (1956)."],["تصنيف أندرسون وكراثوول","تعديل 2001: أفعال، الإبداع في القمة، وبُعد للمعرفة."],["بُعد المعرفة","أنواع المعرفة: حقائقية، مفاهيمية، إجرائية، ما وراء معرفية."],["التحليل","تفكيك المادة إلى عناصرها وإدراك العلاقات (يقارن، يميز)."],["التركيب","جمع العناصر لبناء جديد (يقترح، يصمم)؛ يقابله الإبداع في المعدل."],["التقويم","إصدار حكم على قيمة شيء وفق معايير (ينقد، يبرر)."]],"intro":[],"cmp":{"title":"الأصلي والمعدل","cols":["الأصلي 1956 (بلوم)","المعدل 2001 (أندرسون وكراثوول)"],"rows":[{"k":"صيغة المستويات","a":"أسماء (المعرفة، الفهم…)","b":"أفعال (تذكّر، افهم…)","tag":"تغيّر"},{"k":"المستوى الأول","a":"المعرفة","b":"التذكر","tag":"تغيّر"},{"k":"القمة","a":"التقويم","b":"الإبداع (يقابل التركيب)","tag":"تغيّر"},{"k":"بعد المعرفة","a":"","b":"حقائقية، مفاهيمية، إجرائية، ما وراء معرفية","tag":"أُضيف"},{"k":"عدد المستويات","a":"ستة","b":"ستة","tag":"بقي"}]},"ex":[]},{"h":"المجال الوجداني والمجال النفس‑حركي","pts":["**الوجداني** ([[كراثوول|ar.l12.krath]]): الاستقبال ← الاستجابة ← التقييم ← التنظيم ← **التميز بالقيمة** (الوسم).","«أن يحب وطنه» و«أن يقدّر جهود العلماء» أهداف **وجدانية**.","**النفس‑حركي** ([[سمبسون|ar.l12.simpson]]) سبعة: الإدراك الحسي، الاستعداد، الاستجابة الموجهة، الآلية، المعقدة، التكيف، الإبداع.","تصنيفات حركية أخرى: **ديف** وأعلاه التطبيع، و**هارو** ويبدأ بالحركات الانعكاسية.","**التركيب** ليس من مستويات الوجداني، و**التقمص والتجسيد** مصطلحات تمويه في البدائل."],"t":[["تصنيف كراثوول","خمسة مستويات للمجال الوجداني من الاستقبال إلى التميز بالقيمة."],["الاستقبال","أدنى الوجداني: الانتباه والرغبة في الإصغاء للمثير."],["التميز بالقيمة","أعلى الوجداني: القيمة تصبح سمة ثابتة توجه السلوك."],["تصنيف سمبسون","سبعة مستويات للمجال النفس‑حركي من الإدراك إلى الإبداع."],["الاستجابة الموجهة","أداء المهارة بالتقليد والمحاولة والخطأ تحت التوجيه."],["التكيف","تعديل أداء المهارة لتناسب مواقف جديدة."],["التطبيع (ديف)","أعلى مستوى عند ديف: أداء المهارة تلقائياً دون تفكير."]],"intro":[],"ex":[]},{"h":"التخطيط ومستوياته وعناصر خطة الدرس والتهيئة","pts":["[[**التخطيط**|ar.l12.plan]] طويل المدى: الخطة السنوية والفصلية؛ وقصير المدى: خطة الوحدة والخطة اليومية.","[[**التهيئة**|ar.l12.set]] أكثر عنصر يُغفل: حافزة، وتوجيهية تربط بالسابق، وانتقالية، وتقويمية؛ ويقابلها الغلق.","أحداث [[جانييه|ar.l12.gagne]] التسعة تبدأ بجذب الانتباه وتنتهي بتعزيز الاحتفاظ والانتقال.","يبدأ المعلم بالتحقق من **المتطلبات السابقة**؛ وتوزيع المقرر السنوي ليس من عناصر الخطة اليومية.","عند ضيق الوقت تُرتب الأنشطة **حسب أولويتها للأهداف**، ولا تُحوَّل كلها واجبات."],"t":[["الخطة الفصلية","تخطيط طويل المدى يوزع موضوعات المقرر على أسابيع الفصل."],["خطة الوحدة","تخطيط لمجموعة دروس مترابطة بتحليل محتواها وتوزيعها زمنياً."],["التهيئة","مقدمة الدرس التي تجذب الانتباه وتربطه بالخبرات السابقة."],["التهيئة التوجيهية","تهيئة تحدد ما ينبغي الانتباه إليه وتربط الجديد بالسابق."],["المتطلبات السابقة","المعارف والمهارات اللازم توافرها قبل الدرس الجديد."],["الغلق","ختام الدرس بتلخيص الأفكار وتثبيتها."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Daily Lesson Plan","عناصر خطة الدرس اليومية"],"groups":[{"n":"قبل الدرس","ar":"ماذا سيتعلم الطالب؟","items":[{"n":"الموضوع"},{"n":"الأهداف"},{"n":"المتطلبات السابقة"}]},{"n":"البداية","ar":"تثير الانتباه وتربط بالسابق","d":"ar.l12.set","items":[{"n":"التهيئة"}]},{"n":"العرض","ar":"كيف سيتعلم؟","items":[{"n":"المحتوى والإجراءات"},{"n":"الاستراتيجيات"},{"n":"الوسائل"},{"n":"الأنشطة"}]},{"n":"الختام","ar":"هل تحقق الهدف؟","items":[{"n":"التقويم"},{"n":"الغلق"},{"n":"الواجب"}]},{"n":"الزمن","ar":"لكل خطوة وقتها، وهو أساس **إدارة وقت الحصة**","d":"ar.l12.plan"}]}},{"h":"التغذية الراجعة وتحليل المحتوى وجدول المواصفات والواجبات","pts":["[[**التغذية الراجعة**|ar.l12.feedback]] فورية، محددة ووصفية، على المهمة لا الشخص؛ و«أحسنت» وحدها لا تكفي.","أفضل صورها **تقدير مع تعليق**؛ والمؤجلة أقل أثراً من الفورية.","[[**تحليل المحتوى**|ar.l12.content]]: حقائق، ومفاهيم، وتعميمات، ومهارات، وقيم واتجاهات؛ بعد الأهداف وقبل الأنشطة.","[[**جدول المواصفات**|ar.l15.tos]]: الموضوعات (المحتوى) × مستويات الأهداف، يحقق صدق المحتوى؛ وزن الموضوع = حصصه ÷ مجموع الحصص × 100.","[[**الواجبات المنزلية**|ar.l12.homework]] مرتبطة بالدرس ومناسبة الكم، تُصحح وتُعاد بتغذية راجعة، ولا تُستخدم عقاباً."],"t":[["التغذية الراجعة","معلومات عن الأداء تعزز الصحيح وتصحح الخطأ."],["التغذية الراجعة الوصفية","تعليق محدد يصف ما تحقق وما يحتاج تحسيناً."],["تحليل المحتوى","تفكيك المادة إلى حقائق ومفاهيم وتعميمات ومهارات وقيم."],["التعميم","علاقة بين مفهومين أو أكثر تنطبق على حالات كثيرة."],["جدول المواصفات","مخطط ثنائي البعد يوزع الأسئلة على المحتوى ومستويات الأهداف."],["الوزن النسبي","نسبة الموضوع من الاختبار وفق حصصه أو أهميته."],["هرم المعرفة","ترتيب المعرفة من الحقائق إلى المفاهيم فالتعميمات فالقوانين فالنظريات."]],"intro":[],"ex":[]},{"h":"ربط أهداف التعلم بمعايير المنهج ونواتج التعلم","pts":["مؤشر 8.1: يخطط أنشطة بتسلسل منطقي تربط **أهداف التعلم بمعايير المنهج**.","[[**معايير المحتوى**|ar.l12.align]] ما ينبغي تعلمه في كل مجال، و**معايير الأداء** نواتج التعلم المتوقعة نهاية كل صف.","التسلسل: المعيار ← ناتج التعلم ← أهداف الدرس ← الأنشطة ← أدوات تقويم تجمع **دليلاً**.","**التصميم العكسي** (ويغنز وماكتاي): النتائج المرغوبة ← أدلة التقويم ← خبرات التعلم.","**المحاذاة**: الهدف والنشاط والتقويم بالمستوى نفسه؛ فهدف «يقارن» لا يُقوَّم بسؤال «اذكر»."],"t":[["معايير المحتوى","وصف عام لما ينبغي أن يتعلمه المتعلم في كل مجال تعلم."],["معايير الأداء","نواتج التعلم المتوقعة من المتعلم في نهاية كل صف أو مستوى."],["نواتج التعلم","ما يكتسبه الطالب من معارف ومهارات وقيم نتيجة خبرة تعليمية."],["التصميم العكسي","تخطيط يبدأ بالنتائج المرغوبة ثم أدلة التقويم ثم خبرات التعلم."],["المحاذاة","اتساق الهدف والنشاط والتقويم في المحتوى والمستوى المعرفي."]],"intro":[],"ex":[]},{"h":"شروط اختيار مصادر التعلم الرقمية وغير الرقمية","pts":["مؤشر 8.1: يضمّن الخطة [[**مصادر رقمية وغير رقمية**|ar.l12.resources]] تحقق شروط الاختيار.","أول الشروط **الارتباط بالهدف**، ثم المناسبة للمتعلمين، والدقة، والأمان، والإتاحة للجميع، واحترام الملكية الفكرية.","المصدر **وسيلة لا غاية**: يجربه المعلم قبل الحصة ويعد بديلاً، والأحدث أو الأغلى ليس الأفضل بالضرورة.","**مصادر البيئة المحلية** (زيارة، عينات حقيقية، خبير من المجتمع) فاعلة وقليلة التكلفة."],"t":[["مصادر التعلم","كل ما يُستخدم لدعم تعلم الطالب: مطبوع أو رقمي أو مجسم أو بشري أو من البيئة."],["شروط اختيار المصدر","الارتباط بالهدف، المناسبة للمتعلم، الدقة والحداثة، الأمان، التكلفة، الإتاحة، الملكية الفكرية."],["الإتاحة","إمكانية وصول جميع الطلاب إلى المصدر واستخدامه بمن فيهم ذوو الإعاقة."]],"intro":[],"ex":[]}],"trap":["[[**الهدف السلوكي**|ar.l12.behav]] يصف سلوك **الطالب**؛ أي صيغة فاعلها المعلم خاطئة مهما بدت مرتبة.","«يفهم، يدرك، يعتقد، يستوعب» **غير قابلة للقياس**؛ «يفسر، يعدد، يحل، يرسم» قابلة.","**الناتج** لا **النشاط**: «أن يقرأ الطالب الدرس» نشاط، و«أن يستخرج الفكرة الرئيسة» ناتج.","[[**التركيب**|ar.l12.bloom]] في الأصلي = **الإبداع** في المعدل؛ و**المعرفة** = **التذكر**؛ والإبداع صار **القمة** بدل التقويم.","**يقارن/يميز** تحليل، **يقترح/يصمم** تركيب، **يحكم/ينقد** تقويم، **يلخص/يفسر** فهم، **يحل/يستخدم** تطبيق.","[[**الاستقبال والاستجابة**|ar.l12.krath]] مستويات **وجدانية** دنيا، و**الإدراك والاستعداد** مستويات **نفس‑حركية** دنيا؛ لا تخلط العائلتين.","**التركيب** ليس من الوجداني، و**التقمص** ليس في كراثوول رغم ظهوره في البدائل.","**الهدف العام** يُشتق من فلسفة المجتمع وغير قابل للقياس المباشر؛ **السلوكي** في حصة واحدة.","**المعيار** (8 من 10) غير **الشرط** (دون آلة حاسبة).","[[**التهيئة التوجيهية**|ar.l12.set]] تربط بالسابق (كالمنظم المتقدم)؛ **الحافزة** تثير الاهتمام فقط؛ **التقويمية** تتأكد قبل الانتقال.","**جدول المواصفات** أداة تخطيط تسبق الأسئلة وتحقق **صدق المحتوى** لا الثبات.","[[التغذية الراجعة الجيدة|ar.l12.feedback]] **فورية ومحددة**؛ العامة («ممتاز») أو المتأخرة أسابيع ضعيفة الأثر."],"vid":[["7thKw6iZiq4","شرح المعيار الثامن: تخطيط الوحدات والأنشطة الدراسية","سهام الزهراني",32],["1gubFqh896U","حل أسئلة المعيار الثامن من معايير الرخصة المهنية","سهام الزهراني",29],["Xoqvja-oWTg","الأهداف المعرفية: تصنيف هرم بلوم","اختبار الرخصة المهنية للمعلم",19],["-2d4T2f0CW8","الأهداف المهارية: تصنيف هرم سمبسون","اختبار الرخصة المهنية للمعلم",24],["2QCvCsyFNhU","هرم بلوم المجال العقلي المعرفي","المدرب علي القرشي",13],["uLHuLpYCmlY","المعيار الثامن: تخطيط الدرس","سلوى البحيري",20]],"map":{"type":"tree","title":["Objectives & Their Domains","الأهداف ومجالاتها وتصنيفاتها"],"groups":[{"n":"المجال المعرفي","ar":"عمليات التفكير","items":[{"n":"التصنيف الأصلي 1956","who":"Bloom بلوم","ar":"معرفة ← فهم ← تطبيق ← تحليل ← تركيب ← تقويم","d":"ar.l12.bloom"},{"n":"التصنيف المعدل 2001","who":"Anderson & Krathwohl","ar":"تذكر ← فهم ← تطبيق ← تحليل ← تقويم ← إبداع","d":"ar.l12.revised"},{"n":"أفعال كل مستوى","ar":"مفتاح تصنيف الهدف والسؤال","d":"ar.l12.verbs"}],"trap":"التركيب في الأصلي = الإبداع في المعدل"},{"n":"المجال الوجداني","ar":"القيم والاتجاهات","items":[{"n":"خمسة مستويات","who":"Krathwohl كراثوول","ar":"استقبال ← استجابة ← تقييم ← تنظيم ← تميز بالقيمة","d":"ar.l12.krath"}],"trap":"التركيب والتقمص ليسا من مستوياته"},{"n":"المجال النفس‑حركي","ar":"المهارات الحركية","items":[{"n":"سبعة مستويات","who":"Simpson سمبسون","ar":"إدراك ← استعداد ← استجابة موجهة ← آلية ← معقدة ← تكيف ← إبداع","d":"ar.l12.simpson"},{"n":"خمسة مستويات","who":"Dave ديف","ar":"تقليد ← معالجة ← دقة ← ترابط ← تطبيع"},{"n":"ستة مستويات","who":"Harrow هارو","ar":"من الحركات الانعكاسية إلى التواصل غير اللفظي"}]},{"n":"صياغة الأهداف","ar":"من الغاية إلى السلوك","items":[{"n":"الهدف السلوكي","who":"Mager ماجر","ar":"سلوك وشرط ومعيار","d":"ar.l12.behav"},{"n":"SMART","ar":"محدد، قابل للقياس والتحقيق، وثيق الصلة، محدد بزمن","d":"ar.l12.smart"}],"trap":"الفاعل هو الطالب دائماً"}]},"n":12},{"id":"L13","d":"P","std":"8","sub":"8.3، 8.4","ar":"استراتيجيات التدريس والتعلم النشط والمنهج والتقنية","goal":"تختار الاستراتيجية أو الأداة التقنية المناسبة لموقف صفي محدد، وتميز أنواع المنهج وتنظيماته ونماذج بنائه، وتعرف الأبعاد المشتركة التي يجب تنميتها عبر المواد.","sec":[{"h":"التعلم النشط واستراتيجياته","pts":["**التعلم النشط** تطبيق للنظرية **البنائية**: الطالب يبني معرفته بالعمل، والمعلم ميسّر لا ملقّن.","**فكر‑زاوج‑شارك** (ليمان): فردي ← ثنائي ← جماعي؛ و**KWL** (أوجل): أعرف، أريد، تعلمت.","[[**الصف المقلوب**|ar.l13.flipped]]: الشرح في **المنزل** والتطبيق والمناقشة في الفصل.","[[**دورة التعلم 5E**|ar.l13.5e]] (بايبي): الانشغال ← الاستكشاف قبل الشرح ← التفسير ← التوسع ← التقويم.","[[**التعلم القائم على المشكلات**|ar.l13.pbl]]: مشكلة غير محددة البنية بلا حل واحد؛ والقائم على المشروعات ينتهي بمنتج.","**التعلم للإتقان** (بلوم وكارول): إتقان 80–90% قبل الانتقال؛ **الزمن متغير والتحصيل ثابت**.","[[استراتيجيات تفاعلية|ar.l13.active]]: **مراكز التعلم** بالتناوب، والرؤوس المرقمة، وحوض السمك؛ و[[نماذج بنائية|ar.l13.models]] منها التغير المفاهيمي ([[بوسنر|ar.l11.conceptual]])."],"t":[["التعلم النشط","تعلم يشارك فيه الطالب بفاعلية ويبني معرفته والمعلم ميسر."],["فكر‑زاوج‑شارك","تفكير فردي ثم نقاش ثنائي ثم مشاركة مع الصف."],["جدول KWL","أعرف، أريد أن أعرف، تعلمت: ينشط المعرفة السابقة ويقوّم التعلم."],["الصف المقلوب","المحتوى في المنزل بالفيديو والتطبيق في الحصة."],["دورة التعلم الخماسية","5E لبايبي: انشغال، استكشاف، تفسير، توسع، تقويم."],["التعلم للإتقان","لا انتقال قبل الإتقان؛ تقويم تكويني وعلاج وإثراء."],["نموذج بوسنر","نموذج التغير المفاهيمي لمعالجة التصورات البديلة."],["الرؤوس المرقمة","ترقيم أعضاء المجموعة واستدعاء رقم عشوائي للإجابة عن الجميع."],["حوض السمك","دائرة مناقشة داخلية ودائرة ملاحظة خارجية تتبادلان الأدوار."],["نموذج فراير","منظم رباعي للمفهوم: تعريف، خصائص، أمثلة، لا أمثلة."],["RAFT","كتابة إبداعية بأربعة عناصر: الدور، الجمهور، الصيغة، الموضوع."],["تنال القمر","استراتيجية فهم قرائي: تنبؤ، تنظيم، بحث، تلخيص، مقارنة."],["التعليم التوليدي","نموذج بنائي اجتماعي بأطوار تمهيدي وتركيزي وتحدٍّ وتطبيق."],["التساؤل الذاتي","طرح الطالب أسئلة على نفسه لمراقبة فهمه (ما وراء معرفي)."]],"intro":[],"ex":[]},{"h":"التعليم المتمايز والخرائط والأسئلة الصفية","pts":["[[**التعليم المتمايز**|ar.l13.diff]] (توملينسون): تكييف المحتوى والعملية والمنتج والبيئة وفق الاستعداد والاهتمام ونمط التعلم.","التمايز = المثير نفسه + **مهام متنوعة** = مخرجات متنوعة؛ والتقليدي مهمة واحدة للجميع.","[[**خريطة المفاهيم**|ar.l13.maps]] (نوفاك) هرمية بكلمات ربط وأساسها **أوزوبل**؛ والذهنية (بوزان) شعاعية؛ وأشكال فن للمقارنة.","[[**زمن الانتظار**|ar.l14.questions]] (رو) 3–5 ثوانٍ؛ ويُطرح السؤال **ثم** يُختار المجيب.","**الأسئلة السابرة**: إجابة ناقصة ← توضيحي، خاطئة ← مشجع لا تصحيح فوري، لا إجابة ← إعادة صياغة.","طلب وصف العمليات والصعوبات نهاية الدرس ينمي **التأمل** وما وراء المعرفة."],"t":[["التعليم المتمايز","تكييف المحتوى والعملية والمنتج والبيئة وفق الفروق (توملينسون)."],["الخريطة الذهنية","تمثيل شعاعي لفكرة مركزية بفروع وألوان (بوزان)."],["خريطة المفاهيم","تمثيل هرمي للمفاهيم بكلمات ربط (نوفاك)."],["أشكال فن","دائرتان متقاطعتان لمقارنة مفهومين."],["زمن الانتظار","فترة صمت 3–5 ثوانٍ بعد طرح السؤال."],["السؤال السابر","سؤال متابعة يعمق إجابة الطالب أو يوجهها."],["السبر المشجع","سلسلة أسئلة بعد إجابة خاطئة تقود الطالب إلى الصواب."]],"cmp":null,"intro":[],"ex":[]},{"h":"التقنية في التعليم: الأنماط والمنصات والنماذج","pts":["[[**التعليم المدمج**|ar.l13.elearn]] حضوري + إلكتروني؛ و**المتزامن** في الوقت نفسه، وغير المتزامن في أوقات مختلفة.","مستويات توظيف التعلم الإلكتروني: **مساند** للتعليم الصفي، ومدمج، وكامل عن بعد؛ وليس من مميزات الحاسب تنمية التفاعل الاجتماعي.","[[**نموذج SAMR**|ar.l13.samr]] (بونتيدورا): الاستبدال ← التعزيز ← التعديل ← إعادة التعريف؛ و**TPACK** (ميشرا وكوهلر) معارف المعلم.","[[منصات الوزارة|ar.l13.platforms]]: **مدرستي** للتعليم الإلكتروني، ونور للدرجات والغياب، وعين للمحتوى، وروافد للمصادر.","[[**مبادئ ماير**|ar.l13.mayer]]: التعليق الصوتي مع الرسوم أفضل من النص المكتوب، والنص قرب الصورة، وحذف المشتتات.","**الويب كويست** بحث في مصادر يحددها المعلم مسبقاً، و**الحوسبة السحابية** لدمج الملفات؛ والمزيد في [[أدوات الويب والتطبيقات|ar.l13.tools]].","[[**ADDIE**|ar.l13.design]] أشهر نماذج التصميم التعليمي: تحليل ← تصميم ← تطوير ← تنفيذ ← تقويم."],"t":[["التعليم المدمج","دمج التعلم الحضوري بالإلكتروني."],["التعلم المتنقل","تعلم عبر الأجهزة المحمولة بلا قيد مكان أو زمان."],["الرحلة المعرفية","ويب كويست: بحث موجه في مصادر إنترنت يحددها المعلم."],["الحوسبة السحابية","تخزين ومعالجة عبر الإنترنت من أي جهاز."],["مدرستي","منصة الوزارة الرسمية للتعليم الإلكتروني والفصول الافتراضية."],["نور","نظام الإدارة التربوية: درجات وغياب وشهادات."],["SAMR","استبدال، تعزيز، تعديل، إعادة تعريف لدمج التقنية."],["TPACK","تكامل معرفة التقنية والتربية والمحتوى."],["مبدأ التقارب المكاني","وضع النص قرب الصورة التي يشرحها (ماير)."],["التعليم المتزامن","تفاعل المعلم والطلاب في الوقت نفسه من أماكن مختلفة."],["التعليم غير المتزامن","تفاعل في أوقات وأماكن مختلفة عبر محتوى مسجل أو منصات."],["تقنيات التعليم","منظومة من الإنسان والآلة والطريقة لتحقيق أهداف التعليم."],["مصادر التعلم","كل الموارد البشرية وغير البشرية التي يتفاعل معها المتعلم لاكتساب الخبرة."],["التصميم التعليمي","تخطيط منظم للتعليم وتطويره وتقويمه (نموذج ADDIE)."],["الويكي","صفحة ويب يحررها عدة مستخدمين تشاركياً."],["البودكاست التعليمي","ملفات صوتية مسجلة تقدم شروحاً يستمع إليها الطالب في أي وقت."],["الواقع المعزز","تقنية تضيف عناصر رقمية إلى مشهد الواقع الحقيقي في الوقت نفسه."],["روافد","بوابة الوزارة لمصادر التعلم الرقمية المساندة للمناهج."]],"intro":[],"ex":[]},{"h":"المنهج: مفهومه وأنواعه وتنظيماته ونماذج بنائه","pts":["[[**المنهج**|ar.l13.curr]] الحديث = **جميع الخبرات** داخل المدرسة وخارجها؛ وهو أعم من المقرر، والمقرر أعم من الكتاب.","عناصره: الأهداف ← المحتوى ← طرق التدريس والأنشطة ← التقويم؛ وأسسه: الفلسفي (العقدي)، النفسي، الاجتماعي، المعرفي.","المنهج الرسمي (المعلن) وثيقة معتمدة، و**الخفي** (جاكسون) يُتعلم ضمناً دون تخطيط، و**الفارغ** (آيزنر) ما لم يُدرج عمداً.","[[تنظيمات المنهج|ar.l13.currorg]]: المنفصلة، والمترابطة، والمندمجة، والمحوري، و**النشاط** (ديوي)، و**الحلزوني** (برونر).","**نموذج تايلر** (1949) يبدأ بالأهداف، و**نموذج تابا** استقرائي يبدأ من المعلم بتشخيص الحاجات.","**التنظيم المنطقي** من البسيط إلى المعقد، و**السيكولوجي** وفق حاجات المتعلم وميوله.","**المدى والتتابع**: المدى أفقي (اتساع المحتوى)، والتتابع رأسي (تدرجه عبر الصفوف)."],"t":[["المنهج","جميع الخبرات المخططة التي تقدمها المدرسة لتحقيق أهدافها."],["المنهج الخفي","ما يُتعلم ضمنياً من المناخ والعلاقات دون تخطيط."],["المنهج الفارغ","ما حُذف أو أُغفل عمداً من المنهج الرسمي."],["منهج النشاط","تنظيم ديوي القائم على ميول الطلاب وحل المشكلات."],["المنهج الحلزوني","تنظيم برونر الذي يعيد المفاهيم بعمق متزايد."],["نموذج تايلر","أربعة أسئلة لبناء المنهج تبدأ بالأهداف."],["نموذج تابا","بناء المنهج استقرائياً من المعلم بتشخيص الحاجات."],["المدى والتتابع","اتساع المحتوى أفقياً وتدرجه رأسياً عبر الصفوف."],["المنهج كنظام","مدخلات وعمليات ومخرجات وتغذية راجعة متفاعلة."],["المقرر الدراسي","موضوعات محددة في مادة دراسية لصف معين."],["المنهج التكنولوجي","تنظيم منهجي يعتمد التقنية والخطو الذاتي في تقديم الخبرات."]],"ex":[],"intro":[]},{"h":"الأبعاد المشتركة بين المناهج","pts":["[[**الأبعاد المشتركة**|ar.l13.cross]] تُنمّى عبر **جميع المواد**، بالشواهد والمواقف والأنشطة لا بالوعظ المباشر.","مؤشر 8.3: استراتيجيات تلبي **حاجات المتعلمين وخصائصهم** وتراعي طبيعة الأهداف؛ وتنويعها يخفض كره المادة.","**الثقافة الرقمية**: الاستخدام الآمن والأخلاقي للتقنية وتقويم مصداقية المصادر.","الأسئلة التي تحفز النقاش وحب الاستطلاع **مفتوحة** لا تبحث عن إجابة واحدة."],"t":[["الأبعاد المشتركة","مهارات وقيم تُنمّى عبر كل المواد: هوية، تفكير، حياتية، رقمية، لغة."],["المهارات الحياتية","مهارات التعامل مع متطلبات الحياة اليومية كالتخطيط والإدارة المالية."],["الثقافة الرقمية","الاستخدام الكفء والآمن والأخلاقي للتقنية ومصادرها."],["مهارات التفكير العليا","التحليل والتقويم والإبداع وحل المشكلات."]],"intro":[],"ex":[]},{"h":"التعليم الشامل وعلاقته بالدمج والتمايز","pts":["مؤشر 8.3: [[**التعليم الشامل**|ar.l13.udl]] يعلّم الجميع معاً في الفصل العام، مع تكييف البيئة والمنهج والتدريس والتقويم.","**الدمج** يطلب من الطالب التكيف، و**الشمول** يغيّر النظام نفسه ليستوعب التنوع.","**التصميم الشامل للتعلم (UDL)**: وسائل متعددة للتمثيل، ووسائل متعددة للتعبير والأداء، ووسائل متعددة للمشاركة والتحفيز.","ممارسات شاملة: توقعات عالية للجميع، ومجموعات مرنة، وتقنيات مساعدة، و**تعاون مع معلم التربية الخاصة**.","التمايز أداة من أدوات الشمول؛ والشمول **ليس** خفض الأهداف ولا عزل ذوي الاحتياج."],"t":[["التعليم الشامل","تعليم جميع المتعلمين معاً في الفصل العام مع تكييف النظام ليستوعب تنوعهم."],["التصميم الشامل للتعلم","تخطيط مسبق بوسائل متعددة للتمثيل والتعبير والمشاركة ليناسب الجميع (UDL)."],["الدمج","إلحاق الطالب ذي الاحتياج بالنظام التعليمي القائم مع خدمات مساندة."]],"intro":[],"ex":[]},{"h":"الأبعاد المشتركة بصيغة مؤشرات المعيار الثامن: الأولويات والقيم والمهارات","pts":["المعيار الثامن: بيئة تعزز الأبعاد المشتركة = **أولويات + قيم ست + مهارات**.","**التنمية المستدامة**: تلبية حاجات الحاضر دون الإضرار بقدرة الأجيال القادمة (ترشيد، حفاظ على الموارد).","**الشغف المعرفي**: حب الاستطلاع والرغبة الذاتية في المعرفة، ويُنمّى بالأسئلة المفتوحة والمشروعات البحثية.","التضمين **الضمني** أقوى من الوعظ؛ والقائمة المختصرة (هوية، تفكير، حياتية، رقمية، لغة) لا تطابق نص المؤشرات."],"t":[["الأولويات في الأبعاد المشتركة","المواطنة المسؤولة، ومكانة المملكة الريادية، والتنمية المستدامة."],["القيم الست","تقوى الله، الوسطية والاعتدال، تقدير الذات، الشغف المعرفي، تقدير العمل وإتقانه، المسؤولية."],["الشغف المعرفي","حب الاستطلاع والرغبة الذاتية في المعرفة والبحث."],["التنمية المستدامة","تلبية حاجات الحاضر دون الإضرار بحاجات الأجيال القادمة."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Cross-Curricular Dimensions","الأبعاد المشتركة في المعيار الثامن"],"groups":[{"n":"الأولويات","ar":"خبرات **مباشرة أو ضمنية**","d":"ar.l13.cross","items":[{"n":"المواطنة المسؤولة"},{"n":"مكانة المملكة العربية السعودية ومكانتها الريادية"},{"n":"التنمية المستدامة"}]},{"n":"القيم الست","ar":"يراعيها المعلم في الأنشطة ويعززها","d":"ar.l13.cross","items":[{"n":"تقوى الله"},{"n":"الوسطية والاعتدال"},{"n":"تقدير الذات"},{"n":"الشغف المعرفي"},{"n":"تقدير العمل وإتقانه"},{"n":"المسؤولية"}]},{"n":"المهارات","ar":"تُنمّى بالمهام والاستراتيجيات","d":"ar.l13.cross","items":[{"n":"حل المشكلات"},{"n":"الاعتماد على الذات وتقديرها"},{"n":"التعامل باحترام مع الآخرين"}]}]}}],"trap":["[[**الصف المقلوب**|ar.l13.flipped]]: الشرح في المنزل والتطبيق في الفصل؛ **المدمج**: حضوري + إلكتروني؛ **المتنقل**: أجهزة محمولة.","**فكر‑زاوج‑شارك** يبدأ فردياً، وبعض الاستراتيجيات المشابهة تبدأ ثنائياً؛ الترتيب هو المفتاح.","**KWL** ينمي ما وراء المعرفة (يفكر الطالب فيما يعرفه) لا التفكير الإبداعي.","**الرحلات المعرفية** مصادر إنترنت يختارها المعلم؛ **الرحلات الميدانية** خارج الصف؛ **الحوسبة السحابية** تخزين ومشاركة.","**الخريطة الذهنية** شعاعية بلا كلمات ربط (بوزان)؛ **خريطة المفاهيم** هرمية بكلمات ربط (نوفاك) والعام في **القمة**.","**نموذج بوسنر** للتصورات البديلة، لا التعلم التعاوني ولا الموديولات.","[[**دورة التعلم**|ar.l13.5e]] الثلاثية لكاربلس تبدأ بالاستكشاف؛ **بايبي** = الخماسية 5E تبدأ بالانشغال.","**التعلم للإتقان**: الزمن متغير والمعيار ثابت؛ ليس تدريساً للمتفوقين فقط.","[[**المنهج الخفي**|ar.l13.curr]] غير مخطط ويؤثر في القيم؛ **الفارغ** حُذف عمداً؛ **الرسمي** مكتوب.","**تايلر** يبدأ بالأهداف ومن أعلى؛ **تابا** تبدأ من المعلم استقرائياً؛ و**تايلر** صاحب تقويم المنهج و**دانيلسون** صاحب تقويم المعلمين.","**التنظيم المنطقي** بسيط ← معقد؛ **السيكولوجي** حسب المتعلم؛ **الحلزوني** عودة المفاهيم بتعمق.","[[**SAMR**|ar.l13.samr]]: الاستبدال لا يغير المهمة، وإعادة التعريف مهمة مستحيلة بلا تقنية."],"vid":[["7thKw6iZiq4","شرح المعيار الثامن: تخطيط الوحدات والأنشطة الدراسية","سهام الزهراني",32],["1gubFqh896U","حل أسئلة المعيار الثامن من معايير الرخصة المهنية","سهام الزهراني",29],["OUKCqkJaY_Q","المنهج في الرخصة المهنية","سلوى البحيري",17],["CaFz9OJJGy4","سؤال 26: استراتيجية الفصل المقلوب","زيدان محمود",2],["PLRm6ZBuG3oAeYEQjpFN0qVUWD4kIH8rfV","قائمة: معيار التخطيط للدرس وتنفيذه (استراتيجيات بدقيقة واحدة)","نبراس السعودية",17],["ujgQj1bVaEQ","المحاضرة الثامنة: التقنية في التعليم","منصة ثقة التعليمية",113]],"map":{"type":"cards","title":["Strategies, Models & Their Founders","الاستراتيجيات والنماذج وأصحابها"],"groups":[{"n":"Active Learning","ar":"التعلم النشط","items":[{"n":"فكر‑زاوج‑شارك","who":"Lyman ليمان","ar":"فردي ← ثنائي ← جماعي"},{"n":"KWL","who":"Ogle أوجل","ar":"أعرف، أريد، تعلمت"},{"n":"دورة التعلم الخماسية","who":"Bybee بايبي","ar":"5E: تجريب قبل الشرح","d":"ar.l13.5e"},{"n":"التعلم للإتقان","who":"Bloom & Carroll","ar":"الزمن متغير والتحصيل ثابت"}]},{"n":"Differentiation & Maps","ar":"التمايز والخرائط","items":[{"n":"التعليم المتمايز","who":"Tomlinson توملينسون","ar":"محتوى، عملية، منتج، بيئة","d":"ar.l13.diff"},{"n":"خريطة المفاهيم","who":"Novak نوفاك","ar":"هرمية بكلمات ربط","d":"ar.l13.maps"},{"n":"الخريطة الذهنية","who":"Buzan بوزان","ar":"مركز وفروع شعاعية"}]},{"n":"Technology","ar":"التقنية","items":[{"n":"SAMR","who":"Puentedura بونتيدورا","ar":"من الاستبدال إلى إعادة التعريف","d":"ar.l13.samr"},{"n":"TPACK","who":"Mishra & Koehler","ar":"تقنية + تربية + محتوى"},{"n":"مبادئ الوسائط المتعددة","who":"Mayer ماير","ar":"صوت مع الرسوم، بلا مشتتات","d":"ar.l13.mayer"}]},{"n":"Curriculum","ar":"المنهج","items":[{"n":"المنهج الخفي","who":"Jackson جاكسون","ar":"يُتعلم ضمناً دون تخطيط","d":"ar.l13.curr"},{"n":"المنهج الفارغ","who":"Eisner آيزنر","ar":"ما حُذف عمداً"},{"n":"نموذج تايلر","who":"Tyler 1949","ar":"يبدأ بالأهداف","d":"ar.l13.currorg"},{"n":"نموذج تابا","who":"Taba تابا","ar":"يبدأ من المعلم"}]}]},"n":13},{"id":"L14","d":"P","std":"9","sub":"9.1–9.4","ar":"بيئات التعلم: الإدارة الصفية والتعزيز والتوقعات والتواصل","goal":"تميّز أساليب تعديل السلوك بدقة، وتختار الإجراء الأنسب والخطوة الأولى في المواقف الصفية بمنطق الهيئة (أول حادثة ← المعلم، المتكرر والخطر ← المرشد والإدارة)، وتبني توقعات عالية وتواصلاً داعماً للتعلم.","sec":[{"h":"9.1 تأسيس توقعات أداء عالية والدافعية الصفية","pts":["التوقعات العالية تعكس **إيمانه بقدرة جميع طلابه على النجاح**، لا رغبة المعلم في التنافس أو إنجازه الشخصي.","[[**أثر بجماليون**|ar.l14.expect]] (روزنثال وجاكوبسون 1968): التوقع **نبوءة تحقق ذاتها**.","التوقع العالي تحدٍّ مع دعم و**أهداف تعلم واضحة** قابلة للتحقيق؛ والتوقع **المثالي غير الواقعي** يُحبط.","قارن الطالب **بأدائه السابق** لا بأقرانه؛ والدافعية الداخلية أبقى من المكافآت.","[[**العزو**|ar.l14.attrib]] (واينر): إلى **الجهد** يزيد المثابرة، وإلى القدرة الثابتة يولّد العجز المتعلم.","**الكفاءة الذاتية** (باندورا): أقوى مصادرها **خبرات الإتقان**؛ وتقدير الذات يُرفع بإبراز جوانب القوة لا بخفض المطلوب.","بعد الإجابة الخاطئة: **إعادة صياغة السؤال** أو السبر، لا الإجابة الجاهزة."],"t":[["التوقعات العالية","إيمان المعلم بقدرة كل طالب على التعلم وتكليفه بمهام تتحداه مع دعمه حتى يحققها."],["أثر بجماليون","تحوّل توقعات المعلم (عالية أو منخفضة) إلى نبوءة تحقق ذاتها في تحصيل الطالب (روزنثال وجاكوبسون)."],["الدافعية الداخلية","قوة تنبع من المتعلم نفسه (فضول، رغبة في الإتقان) وهي أقوى أنواع الدافعية وأبقاها."],["الدافعية الخارجية","سلوك يُؤدَّى وسيلة لشيء آخر كالدرجة أو الجائزة أو تجنب العقاب."],["نظرية العزو (واينر)","تفسير الطالب لسبب نجاحه أو فشله على أبعاد: داخلي/خارجي، ثابت/متغير، قابل للضبط/غير قابل."],["العجز المتعلم (سليجمان)","توقف الطالب عن المحاولة بعد فشل متكرر لاعتقاده أن النتيجة خارج سيطرته."],["تقدير الذات","حكم الطالب على قيمته وقدراته؛ يُرفع بخبرات نجاح حقيقية وتعزيز جوانب القوة."],["الكفاءة الذاتية","اعتقاد الطالب بقدرته على أداء مهمة محددة بنجاح، ومصدرها الأقوى خبرات الإتقان (باندورا)."],["التغذية الراجعة الوصفية","تعليق يصف ما أُنجز بدقة وما يحتاج تحسيناً وكيف، بدل الحكم العام أو الدرجة فقط."]],"intro":[],"ex":[]},{"h":"9.2 قيادة الأنشطة الصفية: أنماط الإدارة والقواعد والوقت والمجموعات","pts":["إدارة الصف **تنظيم البيئة التعليمية** للتعلم، لا مجرد ضبط ومعاقبة.","[[**القواعد الصفية**|ar.l14.styles]] قليلة (3–5) إيجابية، توضع **مع الطلاب** بداية العام ومتسقة مع قواعد الوزارة.","[[**كونين**|ar.l14.kounin]]: **اليقظة**، والتداخل، والزخم، وتنبيه المجموعة، وأثر الموجة.","[[الانضباط الحازم|ar.l14.canter]] (كانتر): قواعد، وتقدير إيجابي، وعواقب متدرجة معلنة.","المقاعد حسب **نوع النشاط** (صفوف، مجموعات، حرف U)، والمجموعات غير متجانسة بأدوار محددة والمعلم **ميسّر** بينها.","عند الملل: **نشاط قصير يكسر الروتين**؛ ومن ينهي مبكراً يُعطى نشاطاً إثرائياً.","**الأزمة الصفية**: الهدوء ← فصل المتسببين ← شغل البقية بنشاط ← معالجة فردية بعد الحصة."],"t":[["إدارة الصف","مجموعة الأنشطة التي ينظم بها المعلم البيئة المادية والنفسية والاجتماعية للصف ليحدث التعلم."],["النمط الديمقراطي","إدارة تقوم على الحوار والمشاركة والأمن النفسي وتبني الانضباط الذاتي."],["النمط التسلطي","إدارة بالخوف والطاعة التامة والثواب والعقاب؛ تولّد الاتكالية والدافعية الخارجية."],["النمط الفوضوي","إدارة بلا ضوابط لمعلم ضعيف الشخصية أو مفرط في الود؛ يضيع الوقت وتضعف مكانته."],["اليقظة (كونين)","وعي المعلم المستمر بكل ما يجري في الصف وإظهار ذلك للطلاب فيتدخل قبل اتساع المشكلة."],["التداخل (كونين)","قدرة المعلم على معالجة أمرين في وقت واحد دون توقف الدرس."],["أثر الموجة","تأثر بقية الطلاب بطريقة معالجة المعلم لسلوك طالب واحد (كونين)."],["القواعد الصفية","توقعات عامة قليلة وواضحة تُوضع مع الطلاب أول العام وتتسق مع لائحة السلوك."],["الإجراءات الصفية","خطوات روتينية لإنجاز نشاط محدد: بدء الحصة، إنهاؤها، الانتباه، العمل في المقاعد."],["المعلم الميسّر","دور المعلم في التعلم النشط: ينظم ويوجه ويتنقل بين المجموعات ولا يلقّن."],["الإدارة الذاتية للصف","انتقال ضبط السلوك من المعلم إلى الطلاب أنفسهم."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Classroom Management Styles","أنماط إدارة الصف"],"groups":[{"n":"الديمقراطي","ar":"حوار ومشاركة وأمن نفسي و**انضباط ذاتي**؛ وهو الأنسب","d":"ar.l14.styles"},{"n":"التسلطي","ar":"خوف وطاعة تامة واتكالية ودافعية خارجية","d":"ar.l14.styles"},{"n":"الفوضوي (المتساهل)","ar":"لا ضوابط وضياع الوقت؛ ومنه الود الزائد الذي يُضعف مكانة المعلم","d":"ar.l14.styles"}]}},{"h":"9.3 (أ) تعديل السلوك: التعزيز والعقاب وأساليبهما","pts":["[[**التعزيز**|ar.l14.reinf]] يزيد السلوك و**العقاب** يقلله؛ ثم: أُضيف شيء = موجب، وأُزيل = سالب.","التعزيز الفعال **فوري** متنوع متناسب دون إشباع؛ [[المتواصل|ar.l14.schedules]] للاكتساب، و**المتقطع** للاستمرار.","المعززات: **اجتماعية** (أسهلها وأكثرها تأثيراً)، ونشاطية، ومادية، ورمزية، وغذائية.","[[**الانطفاء/الإطفاء**|ar.l14.extinct]]: حجب التعزيز (تجاهل مقصود) مع **التعزيز التفاضلي** للبديل.","**تكلفة الاستجابة** (خصم نقاط) و**الإقصاء** (إبعاد مؤقت) كلاهما عقاب سالب.","[[**مبدأ بريماك**|ar.l14.premack]]: نشاط محبب يعزز نشاطاً أقل حباً؛ و**الاقتصاد الرمزي** رموز تُستبدل لاحقاً.","**التشكيل** تعزيز التقريبات المتتابعة، و**النمذجة** تعلم بملاحظة نموذج؛ و[[أساليب أخرى|ar.l14.othermod]] كالتصحيح الزائد وضبط المثير والتلقين."],"t":[["التعزيز الموجب","إضافة مثير سارّ بعد السلوك مباشرة فيزداد احتمال تكراره."],["التعزيز السالب","إزالة مثير منفّر بعد السلوك المرغوب فيزداد السلوك؛ ليس عقاباً."],["العقاب السالب","سحب معزز بعد السلوك غير المرغوب فيقل؛ يشمل تكلفة الاستجابة والإقصاء."],["تكلفة الاستجابة","فقدان الطالب جزءاً من معززاته المكتسبة (درجات، نقاط، امتياز) بسبب سلوك غير مرغوب."],["الإقصاء (العزل المؤقت)","إبعاد الطالب مدة محددة عن البيئة أو الأنشطة المعززة بعد السلوك غير المقبول."],["الانطفاء","تلاشي السلوك غير المرغوب عند إيقاف التعزيز عنه، وأبرز صوره التجاهل المقصود."],["التصحيح الزائد","إزالة الضرر الناتج عن السلوك مع تكليف الطالب بأعمال إضافية تتجاوز الضرر."],["مبدأ بريماك","السلوك الأكثر تكراراً (المحبب) يُستخدم معززاً للسلوك الأقل تكراراً."],["الاقتصاد الرمزي","نظام معززات رمزية (نجوم، كوبونات) تُستبدل لاحقاً بمعززات حقيقية."],["التعزيز التفاضلي","تجاهل السلوك غير المرغوب مع تعزيز السلوك البديل أو النقيض له."],["السلوك التوكيدي","تدريب الطالب على التعبير عن رأيه وحقوقه بثقة دون عدوان."],["الكف المتبادل","إحلال استجابة مقبولة محل استجابة غير مرغوبة لا تجتمعان معاً."],["الإرشاد بالواقع","الاستفادة من المواقف والأنشطة الواقعية في تعديل السلوك."],["النشاط التعزيزي","نشاط إضافي لمن أتقن الهدف لتثبيت التعلم وتعميقه."]],"cmp":{"title":"التعزيز والعقاب في جدول واحد","cols":["موجب (نضيف شيئاً)","سالب (نزيل شيئاً)"],"rows":[{"k":"تعزيز: يزيد السلوك","a":"نضيف محبباً: مدح، نجمة","b":"نزيل منفّراً: إلغاء إنذار، إعفاء من واجب"},{"k":"عقاب: يقلل السلوك","a":"نضيف منفّراً: توبيخ","b":"نسحب محبباً: حرمان من امتياز، تكلفة الاستجابة"}]},"ex":["طالب يحضّر دروسه ليتجنب توبيخ المعلم: زاد السلوك لأنه يزيل شيئاً يكرهه، فهذا **تعزيز سالب** لا عقاب."],"intro":[]},{"h":"9.3 (ب) بيئة آمنة: التعامل مع المشكلات السلوكية والفئات والسلامة","pts":["**العنف** لأول مرة: الخطوة الأولى تنبيه المعتدين بأن السلوك مرفوض وله عواقب إن تكرر.","**التنمر** بخطة مدرسية (الموجه والإدارة والأسرة)؛ وشكوى ولي الأمر منه ← **الإنصات** أولاً.","[[فئات الطلاب|ar.l14.cases]]: الخجول ← **علاقة ثقة** ومهام سهلة؛ كثير الحركة ← حركة مشروعة؛ المتحدي ← لقاء فردي.","**المعتدى عليه**: بناء ثقته وحمايته، لا لومه ولا مواجهته بالمتنمر أمام الصف.","أنجز ثم أساء: افصل **الاعتراف بالإنجاز** عن رفض السلوك.","**التدخين** ولو خارج السور ← الموجه والإدارة وفق [[قواعد السلوك والمواظبة|ar.l14.rules1447]].","ممنوع: **العقاب الجماعي** والبدني والتشهير والطرد من الفصل؛ والسلامة تبدأ **بإيقاف الخطر فوراً**."],"t":[["البيئة الصفية الآمنة","أمان جسدي ونفسي: قواعد واضحة، احترام متبادل، لا إهانة ولا عقاب بدني، معالجة خاصة للمخالفة."],["التحصين التدريجي","تعريض الطالب بالتدرج لمواقف يخشاها من الأسهل إلى الأصعب حتى يزول الخوف."],["الغمر (الإغراق)","مواجهة الطالب للمثير المخيف دفعة واحدة ودون تدرج."],["التنمر","إيذاء متكرر ومقصود من طالب أقوى لآخر أضعف، لفظياً أو جسدياً أو إلكترونياً."],["العقاب الجماعي","معاقبة الصف كله على مخالفة بعض الطلاب؛ ممارسة مرفوضة تربوياً."],["لائحة السلوك والمواظبة","وثيقة الوزارة التي تصنف المخالفات بدرجات وتحدد الإجراءات التدريجية ولجنة التوجيه والإرشاد."],["لجنة التوجيه والإرشاد","لجنة مدرسية تنظر في المخالفات السلوكية المتكررة أو الجسيمة وفق اللائحة."],["وكيل شؤون الطلاب","الجهة التي تُحال إليها المخالفات المتكررة داخل المدرسة والحافلة بعد إجراءات المعلم."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Escalation Ladder","سلّم التصعيد في المواقف السلوكية"],"groups":[{"n":"بسيط لأول مرة","ar":"يعالجه **المعلم**: تجاهل مقصود أو تنبيه هادئ على انفراد مع توضيح العواقب","d":"ar.l14.choose"},{"n":"متكرر","ar":"عواقب **اللائحة** وإشراك الموجه الطلابي وولي الأمر","d":"ar.l14.rules1447"},{"n":"خطر أو خارج الصلاحية","ar":"**الإدارة** والموجه فوراً (طبي، نفسي، قانوني، ولي أمر بحالة غير طبيعية)","d":"ar.l14.choose"}]}},{"h":"9.4 ثقافة تواصل معززة للتعلم","pts":["[[عناصر الاتصال|ar.l14.comm]]: مرسل، رسالة، قناة، مستقبل، و**تغذية راجعة** تميز الاتصال الحديث.","**غير اللفظي** (نظرة، إيماءة، قرب، نبرة) يسبق اللفظي أثراً، والأنسب للخجول وللتنبيه الصامت.","النمط **المتعدد (المفتوح)** أفضل للتعلم من وحيد الاتجاه والثنائي.","[[**زمن الانتظار**|ar.l14.questions]] 3–5 ثوانٍ يرفع جودة الإجابات ومشاركة الخجولين.","**الإنصات النشط** إيماء وإعادة صياغة دون مقاطعة؛ ومع الإجابة الخاطئة انظر إلى الجزء الصحيح ولا تسخر.","[[التغذية الراجعة|ar.l12.feedback]] **تراكم معرفي** والتعزيز وجداني؛ و«نجمتان وأمنية»: قوتان ونقطة تحسين.","**ولي الأمر الغاضب**: إنصات ← حقائق بهدوء ← خطة مشتركة؛ وإن بدا بحالة غير طبيعية ← الإدارة."],"t":[["زمن الانتظار","صمت المعلم 3–5 ثوانٍ بعد السؤال ليفكر الطلاب ويصوغوا إجاباتهم (ماري رو)."],["الأسئلة السابرة","سلسلة أسئلة متتابعة يبني كل منها على إجابة الطالب لتعميق فهمه أو توجيهه نحو الصواب."],["السبر المشجع","أسئلة توجيهية بعد إجابة خاطئة أو ناقصة تقود الطالب إلى الإجابة الصحيحة دون إحراج."],["الإنصات النشط","استماع بانتباه مع إيماء وإعادة صياغة وعدم مقاطعة ليشعر الطالب أنه مسموع."],["التواصل غير اللفظي","لغة الجسد والنظرات والإيماءات ونبرة الصوت؛ يسبق اللفظي في التأثير."],["الاتصال متعدد الاتجاهات","نمط يتفاعل فيه جميع الطلاب مع بعضهم ومع المعلم بتوجيهه (التعلم التعاوني)."],["التغذية الراجعة","معلومات تُقدم للطالب عن أثر أدائه توجه سلوكه الحالي والمستقبلي؛ تراكم معرفي."],["نجمتان وأمنية","استراتيجية تغذية راجعة: نقطتا قوة ونقطة تحسين تُصاغ بصيغة أمنية."],["الاتصال اللفظي","اتصال بالكلمات منطوقة أو مكتوبة."],["اللغة التقاربية","توظيف المسافة والقرب المكاني من الطالب في التواصل."],["اللغة الموازية","نبرة الصوت وسرعته وتنغيمه كرسائل غير لفظية."],["التخطيط باللونين","تغذية راجعة بالتلوين: الوردي لما تحقق والأصفر لما يحتاج تحسيناً."]],"intro":[],"ex":[]},{"h":"قواعد اختيار البديل في مواقف المعيار التاسع","pts":["[[**الخطوة الأولى**|ar.l14.choose]] تعالج الموقف الحاضر مباشرة؛ والإجراء العام أو الوقائي أو التبليغ خطوات لاحقة.","عالج **السلوك لا الشخص**، على انفراد لا علناً، وعزز البديل المرغوب.","**بديلان مترادفان** = كلاهما خطأ؛ والبديل البديهي الذي لا يضيف شيئاً خطأ.","البيئة الإيجابية تبدأ **بالعلاقة** (تحية، أسماء، احترام) قبل الأدوات والعقوبات.","ولي الأمر: **استمع ← افهم ← اشرح ← اتفق**."],"t":[["الخطوة الأولى","الإجراء المباشر الذي يعالج الموقف الحاضر قبل أي إجراء عام أو وقائي أو تصعيدي."],["التصعيد","الانتقال من معالجة المعلم إلى المرشد ثم الإدارة وولي الأمر عند التكرار أو الخطر."],["البديل البديهي","خيار يفرضه النشاط أصلاً ولا يضيف شيئاً، فلا يكون الإجابة الصحيحة."],["البديل المتمركز حول المعلم","خيار يخدم راحة المعلم أو سير الدرس لا تعلم الطالب؛ غالباً مشتت."],["معالجة السلوك لا الشخص","وصف الفعل الخاطئ وعواقبه دون وصم الطالب بصفة (مشاغب، كسول)."]],"ex":["طالبة تسخر من إجابة زميلتها لأول مرة: الخطوة الأولى تنبيهها على انفراد بأن السخرية مرفوضة ولها عواقب إن تكررت، مع دعم المتضررة؛ أما إبلاغ الإدارة أو محاضرة الصف فخطوات لاحقة أو عامة."],"intro":[]},{"h":"9.2 (ب) القدوة وحدود العلاقة المهنية والتراجع عن الخطأ ودور المعلم في قواعد السلوك","pts":["مؤشر 9.2: [[**القدوة الحسنة**|ar.l14.ethics]]، وعلاقة ضمن **حدود مهنية**، والتراجع عن الخطأ وتصحيحه.","**حدود العلاقة المهنية**: ودّ عادل دون محاباة، ولا تواصل شخصي خارج القنوات المعتمدة، ولا إفشاء لأسرار الطلاب.","إن أخطأ المعلم أو أساء أمام الطلاب ← **يعترف ويعتذر** ويصحح؛ فذلك يبني الثقة.","يباشر المعلم **الإجراءات الثلاثة الأولى من مشكلات الدرجة الأولى** ثم يحيل للإدارة.","ممنوع: **نسخ الواجب عقاباً**، وإقصاء الطالب خارج الصف، والإيذاء والسخرية.","**المسميات الحالية**: الموجه الطلابي ولجنة التوجيه الطلابي (المرشد ولجنة التوجيه والإرشاد سابقاً)."],"t":[["القدوة الحسنة","اتساق قول المعلم وفعله بما يجعل سلوكه نموذجاً يحاكيه الطلاب."],["حدود العلاقة المهنية","علاقة عادلة محترمة مع الطلاب داخل القنوات المعتمدة دون محاباة أو خصوصية غير مهنية."],["التراجع عن الخطأ","اعتراف المعلم بخطئه وتصحيحه في أقرب وقت أمام من وصلهم."]],"intro":[],"ex":[]},{"h":"9.3 (ج) جاهزية مصادر التعلم والأمن والسلامة المادية","pts":["مؤشر 9.3: **جاهزية مصادر التعلم** وإتاحتها للجميع، وبيئة تحقق الأمن والسلامة.","افحص الأجهزة والروابط **قبل الحصة** وأعد خطة بديلة، ووفّر بدائل لضعيف البصر والسمع.","[[**الإخلاء**|ar.l14.safety]]: هدوء، وخروج منتظم **دون الحقائب**، ثم التحقق من العدد.","**المختبر**: نظارات وقفازات واقية، ومواد موسومة، وإشراف دائم، ومعرفة مكان طفاية الحريق.","عند الإصابة: **إيقاف الخطر** أولاً، ثم الإسعاف، ثم الإبلاغ والتوثيق.","معرفة **الحالات الصحية** (ربو، حساسية، سكري، صرع) والتنسيق مع الموجه الصحي.","محاولة إيذاء الذات: **عدم تركه بمفرده** والتبليغ فوراً (المادة 30 من قواعد 1447)."],"t":[["خطة الإخلاء","إجراءات مكتوبة ومُتدرَّب عليها لإخراج الطلاب بأمان عند الطوارئ إلى نقطة التجمع."],["نقطة التجمع","مكان آمن محدد يتجمع فيه الطلاب بعد الإخلاء للتحقق من عددهم."],["إتاحة الوصول","تمكين جميع الطلاب، بمن فيهم ذوو الإعاقة، من استخدام مصادر التعلم والمكان."]],"intro":[],"ex":[]}],"trap":["[[**التعزيز السالب**|ar.l14.reinf]] يزيد السلوك (إزالة منفّر)؛ **العقاب** بنوعيه يقلله. إلغاء إنذار بعد الالتزام = تعزيز سالب لا عقاب.","[[**تكلفة الاستجابة**|ar.l14.extinct]] = فقدان معزز مكتسب (درجات، نقاط)؛ **الإقصاء** = عزل مؤقت عن البيئة المعززة؛ كلاهما عقاب سالب.","**الانطفاء** = حجب التعزيز (تجاهل مقصود) فيتلاشى السلوك؛ **العقاب السالب** = سحب معزز موجود. التجاهل ليس عقاباً.","**التصحيح البسيط** = إزالة أثر الخطأ فقط؛ **التصحيح الزائد** = إزالة الأثر + أعمال إضافية (اعتذار وإحضار مقعد جديد).","[[**مبدأ بريماك**|ar.l14.premack]] = نشاط محبب يُشترط بإنهاء نشاط أقل حباً؛ **الاقتصاد الرمزي** = جمع رموز تُستبدل لاحقاً.","[[**التشكيل**|ar.l14.premack]] تدرج في الاستجابة (تعزيز التقريبات)؛ **السحب التدريجي** تدرج في المثير أو المساعدة؛ **التسلسل** تعزيز كل حلقة.","**النمذجة** = تعلم بملاحظة قرين؛ **التلقين** = تلميح لفظي أو إيمائي أو جسدي؛ **ضبط المثير** = تغيير المكان؛ **التحصين التدريجي** خطوة خطوة مقابل **الغمر** دفعة واحدة.","**التغذية الراجعة** تراكم معرفي متعلق بالأداء؛ **التعزيز** تراكم وجداني نتيجة للأداء. والتغذية الفاعلة فورية مستمرة لا متقطعة.","الود بلا ضوابط = **النمط الفوضوي** وليس الديمقراطي؛ الديمقراطي فيه حوار **وضوابط**.","**أول حادثة** ← يعالجها المعلم (تنبيه وعواقب)؛ **المتكرر أو الخطر** ← المرشد والإدارة؛ تبليغ الإدارة أول مرة بديل صحيح في توقيت خاطئ.","[[**التوقعات العالية**|ar.l14.expect]] ≠ التوقعات المثالية غير الواقعية؛ و**المقارنة بالأقران** تخفض الدافعية ولا ترفع التوقعات.","**ولي الأمر الغاضب**: الإنصات أولاً وإتاحة التعبير، لا شرح وجهة نظرك ولا مراجعة القوانين ولا رفع الدرجات لامتصاص غضبه."],"vid":[["-tjqnyMSAeU","تطبيقات المعيار التاسع من معايير الرخصة المهنية","سهام الزهراني",21],["Q3_IUAFZOvk","الإدارة الصفية — قائمة المعيار التاسع","سلوى البحيري · الرخصة المهنية تربوي عام",16],["LwyA4xg2zqE","التعزيز والعقاب في دورة الرخصة المهنية التربوي","منصة البراعة",9],["-MYCRoSFZOM","شرح المعيار التاسع: تهيئة بيئات تفاعلية داعمة للتعلم","سهام الزهراني",25]],"n":14},{"id":"L01","d":"V","std":"1","sub":"1.1، 1.2","ar":"القيم الإسلامية الوسطية والهوية الوطنية","goal":"تختار في كل موقف صفي التصرف الذي يجسّد الوسطية والقدوة والحياد، وتميّز تعزيز الهوية الوطنية بالشواهد والمشاركة عن الوعظ والمظاهر الشكلية.","sec":[{"h":"الوسطية والقدوة والحياد","pts":["[[الوسطية|ar.l01.wasat]] هي **الاعتدال** بين الغلو والتفريط في الأقوال والأحكام والتعامل، والمعلم يغرس الاعتدال والتسامح والتعايش.","المعلم **قدوة** داخل المدرسة وخارجها، و«المعلم القدوة» يعني حسن التعامل مع الطلاب؛ والرقيب بعد الله الضمير اليقظ.","القضايا [[**الخلافية**|ar.l01.neutral]]: حياد وإحالة إلى المصادر والجهات المختصة دون فرض الرأي، وهو نص في [[مدونة 1447|ar.l02.code1447]].","الطالب الجدلي يُعالَج بـ[[**الأدلة المنطقية والقدوة العملية**|ar.l01.dialogue]]، لا بإغلاق الحوار ولا بالإحالة إلى موقع إلكتروني.","القيم تُعلَّم بالمواقف لا بحصة وعظ: يتوقف المعلم عند الأذان ويردده مع طلابه (**نمذجة** للقيمة)."],"t":[["الوسطية","الاعتدال بين الغلو (الزيادة) والتفريط (التقصير) في الفكر والسلوك والحكم."],["الغلو","تجاوز الحد المشروع في الدين أو الرأي حتى يصل إلى التشدد والتطرف."],["التفريط","التهاون والتقصير في أداء الواجب أو الالتزام بالقيم."],["القدوة","أن يجسّد المعلم القيمة سلوكاً يُحتذى، وأثره أبقى من الكلام."],["الحياد المهني","امتناع المعلم عن فرض رأيه الشخصي في القضايا الخلافية داخل الصف."],["الرقابة الذاتية","التزام المعلم بالقيم بدافع ضميره لا بدافع المساءلة الخارجية."],["التسامح","قبول المخالف في الرأي والتعامل معه بالحسنى من غير تنازل عن الثوابت."]]},{"h":"تعزيز الهوية الوطنية","pts":["الهوية تُعزَّز بـ**الشواهد والإحصاءات والمنجزات** لا بالوعظ، وتبدأ بغرس مفهوم حب الوطن والمواطنة؛ والأعلام وسيلة لا غاية.","رموزها: العلم، النشيد، الشعار (السيفان والنخلة)، اللغة العربية، اليوم الوطني، يوم التأسيس، العملة.","المواطنة بسلّم [[**كراثول**|ar.l01.krathwohl]]: يصغي ← يشارك ← يقدّر ← ينظّم ← **تمثّل القيمة** (قدوة لأسرته).","[[**رؤية 2030**|ar.l01.identity]] في التعليم: جودة المخرجات، الشراكة المجتمعية، مواءمة التعليم مع سوق العمل، التعلم مدى الحياة.","النشاط التراثي لا يشمل **تحويل المباني التراثية إلى حديثة**؛ وشواهد جهود المملكة كخدمة الحرمين تنمي المواطنة الصالحة."],"t":[["الهوية الوطنية","شعور الفرد بالانتماء لوطنه وقيمه ورموزه وتاريخه والاعتزاز بها."],["المواطنة","علاقة حقوق وواجبات بين الفرد ووطنه تظهر في السلوك المسؤول والولاء."],["تمثّل القيمة","أعلى مستويات كراثول: تصبح القيمة جزءاً من شخصية الطالب يتصرف بها تلقائياً."],["رؤية 2030","خطة المملكة الاستراتيجية (2016) بمحاورها: مجتمع حيوي، اقتصاد مزدهر، وطن طموح."],["برنامج تنمية القدرات البشرية","أحد برامج الرؤية لإعداد مواطن تنافسي بالقيم والمعارف والمهارات."],["الشواهد","الأدلة الواقعية (أرقام، منجزات، مواقف) التي يُبنى عليها تعزيز الهوية بدل الوعظ."]]},{"h":"التنوع الثقافي والتعايش","pts":["مثال إيجابي من ثقافة أخرى [[**يعزز ثقافة احترام الآخرين**|ar.l01.diversity]]، والمعلم ينمي التفاعل الإيجابي مع الثقافات الأخرى دون تنازل عن الثوابت.","أفعل استراتيجية **نشاط عملي** يعيشه الطالب، والتنوع في الفصل يُستثمر بإتاحة الحديث عن محتوى الدرس لا بعزل المتشابهين.","الزميل غير المسلم: التعامل **وفق مقتضيات مهام العمل** باتزان؛ والآراء المتباينة مكونات ثقافية تتكامل في بناء الحضارة."],"t":[["التنوع الثقافي","وجود خلفيات وعادات ولغات مختلفة داخل الصف أو المجتمع تُدار بالاحترام المتبادل."],["التعايش","العيش المشترك مع المختلف ثقافياً أو دينياً على أساس الاحترام والمصلحة المشتركة."],["التفاعل الإيجابي مع الثقافات","الاستفادة من الحكمة والعلم أينما وُجدا مع الحفاظ على الهوية."],["التعصب","رفض الآخر لمجرد اختلافه، وهو نقيض الوسطية."]]},{"h":"المواطنة الرقمية وأخلاقيات التقنية","pts":["**المواطنة الرقمية**: الممارسة الآمنة والقانونية والأخلاقية للتقنية، ويحكمها [[نظام مكافحة الجرائم المعلوماتية|ar.l01.techcode]] (1428هـ).","من أخلاقيات المراسلة: **تعريف النفس بوضوح** ومراعاة حقوق النشر والاعتذار عن الرسالة الخاطئة؛ لا إخفاء الهوية.","صور الطلاب: [[**مراجعة ما تتطلبه لوائح الوزارة لنشر الصور**|ar.l01.privacy]] أولاً، ثم إذن ولي الأمر.","مصداقية الموقع: **وجود معلومات مُعدّ الموقع وإمكانية التأكد منها**، لا عدد الروابط ولا جمال العرض."],"t":[["المواطنة الرقمية","الاستخدام المسؤول والآمن والأخلاقي للتقنية والإنترنت."],["الجريمة المعلوماتية","فعل يُرتكب عبر الحاسب أو الشبكة مخالفاً للنظام (ابتزاز، تشهير، اختراق)."],["حقوق الملكية الفكرية","حق المؤلف في نتاجه؛ يُراعى بالعزو وعدم النسخ غير المصرح به."],["الأمن الرقمي","حماية البيانات والحسابات وكلمات المرور من الوصول غير المشروع."]]},{"h":"التراث الثقافي الوطني والمناسبات الوطنية","pts":["مؤشر الممارس 1.2: **يوظف المعلم خبرات ومواقف وأنشطة تعليمية** تدعم الاعتزاز بالهوية الوطنية وبالتراث الثقافي الوطني.","[[**التراث المادي**|ar.l01.heritage]]: مبانٍ تاريخية وآثار وحِرف وأزياء؛ و**التراث غير المادي**: عادات وأمثال وشعر وفنون كالعرضة وآداب الضيافة.","الاحتفاء بأنشطة هادفة لا بالمظاهر، وقواعد 1447 تعد المشاركة الإيجابية في المناسبات الوطنية من **السلوك المتميز** (الانتماء الوطني).","تنوع تراث المناطق **ثراء لهوية وطنية واحدة**، والتعريف به يعزز الوحدة الوطنية."],"t":[["التراث المادي","الموروث الملموس: المباني التاريخية والمواقع الأثرية والحرف والأدوات والأزياء."],["التراث غير المادي","الموروث غير الملموس: العادات والأمثال والشعر والفنون الشعبية وآداب التعامل."],["يوم التأسيس","22 فبراير: ذكرى تأسيس الدولة السعودية الأولى عام 1139هـ على يد الإمام محمد بن سعود."],["يوم العلم","11 مارس: مناسبة وطنية للاعتزاز بالعلم السعودي ودلالاته."]],"map":{"type":"tree","title":["National Occasions","المناسبات الوطنية"],"groups":[{"n":"يوم التأسيس","ar":"22 فبراير","d":"ar.l01.heritage","items":[{"n":"1139هـ (1727م)","who":"الإمام محمد بن سعود","ar":"تأسيس الدولة السعودية الأولى"}]},{"n":"اليوم الوطني","ar":"23 سبتمبر","d":"ar.l01.heritage","items":[{"n":"1351هـ (1932م)","who":"الملك عبدالعزيز","ar":"توحيد المملكة"}]},{"n":"يوم العلم","ar":"11 مارس","d":"ar.l01.heritage","items":[{"n":"العلم","ar":"من رموز الهوية الوطنية"}]}]}}],"trap":["الاستشهاد بأمثلة إيجابية من ثقافة أخرى = **احترام الآخرين**، وليس تعزيز الهوية الوطنية ولا إضعافها.","تنمية الوطنية تبدأ بـ**غرس المفهوم** (حب الوطن)، أما تعليق الأعلام والبرامج الثقافية فوسائل تابعة.","القدوة = **حسن التعامل** والسلوك العملي؛ «أساليب تربوية في العقاب» بديل جذاب لكنه عن الضبط لا القدوة.","الطالب الجدلي: **أدلة منطقية + قدوة** وليس «قفل باب الجدال» (قمع) ولا «موقع إلكتروني» (تنصّل).","الحياد في القضايا **الخلافية** لا يعني الحياد في **الثوابت**؛ الثوابت تُعلَّم بوضوح.","تعزيز الهوية **بالشواهد والمنجزات** لا بالوعظ؛ الخيار الوعظي يبدو «أخلاقياً» لكنه أقل فاعلية.","التنوع الثقافي يُفهم بـ**نشاط عملي** لا بملصقات أو قوائم أعياد (شكلية).","زميل غير مسلم في مهمة عمل: التعامل **وفق مهام العمل**، لا دعوة ولا مقاطعة ولا إحالة لمراكز دعوة.","«الأمة أم الوطن؟» الجواب حوار يجمع لا يفرّق؛ أي خيار يُسكت الطالب أو يسخر منه خاطئ.","نشر صور الطلاب: الخطوة الأولى **مراجعة لوائح الوزارة**، وإذن ولي الأمر يأتي بعدها.","ترتيب كراثول للمواطنة: **إصغاء ← مشاركة ← تقدير ← تمثّل**؛ «يكون قدوة لأسرته» هو الأعلى دائماً."],"vid":[["BhH2AyKxhLw","مراجعة شاملة لكل المعايير: المختصر المفيد","سهام الزهراني",116],["QwM81gxnLak","شرح المجال الأول: القيم والمسؤوليات المهنية2","سهام الزهراني",36],["-8jrL3Z4yjw","حل أسئلة المعيار الأول","سهام الزهراني",32],["is9hFBvOkrE","شرح المجال الأول: القيم والمسؤوليات المهنية (الجزء الأول)","سهام الزهراني",34],["fDefgVgKliE","ميثاق أخلاقيات مهنة التعليم","سلوى البحيري",28],["yhVbxgy0B9I","مراجعة المعيار الأول","د. حمدي العياضي",29]],"n":1},{"id":"L02","d":"V","std":"1","sub":"1.3","ar":"أخلاقيات المهنة وسياسة التعليم واللوائح","goal":"تستدعي أرقام وبنود وثيقة سياسة التعليم وميثاق الأخلاقيات ولائحة الوظائف التعليمية ولائحة السلوك، وتطبّقها على مواقف الالتزام بالأنظمة التي يقيسها الاختبار.","sec":[{"h":"وثيقة سياسة التعليم (1390هـ)","pts":["[[سياسة التعليم|ar.l02.policy]]: قرار مجلس الوزراء **779** (1389/9/16هـ)، وتشتهر باسم «سياسة التعليم 1390هـ»: 236 مادة هي «الخطوط العامة» للتعليم.","أسسها الإيمان بالله رباً وبالإسلام ديناً وبمحمد ﷺ نبياً، وغاية التعليم **فهم الإسلام فهماً صحيحاً متكاملاً**.","السلم: ابتدائي 6 ومتوسط 3 وثانوي 3؛ ومن مبادئها **التربية المتكاملة** وحق الفتاة في التعليم.","**مستجد:** ألغاها قرار مجلس الوزراء 103 (1448هـ) مع بقاء أحكامها حتى يصدر البديل؛ والنظام الجديد في القسم التالي."],"t":[["سياسة التعليم","الخطوط العامة التي تقوم عليها التربية والتعليم في المملكة، المعتمدة بقرار 779 لعام 1390هـ."],["الغاية من التعليم","فهم الإسلام فهماً صحيحاً متكاملاً وغرس العقيدة وتزويد الطالب بالقيم والمعارف."],["التربية المتكاملة","إعداد المواطن المؤمن إعداداً سليماً شاملاً لجوانب شخصيته."],["السلم التعليمي","مجموع الصفوف الدراسية في التعليم العام وعددها اثنا عشر صفاً."],["التعليم الموازي","تحفيظ القرآن ومعاهد التربية الخاصة والمدارس الأهلية ومحو الأمية وتعليم الكبار."],["اللجنة العليا لسياسة التعليم","الجهة التي تقر الخطة التعليمية وترسم السياسة العامة للتعليم."]]},{"h":"نظام التعليم العام 1448: أهم ما فيه","pts":["**منشور ولم يُطبَّق بعد:** نُشر في أم القرى **1448/2/10هـ**، ويُعمل به [[بعد 180 يوماً من نشره|ar.law.effective]] (المادة 68)، أي نحو يناير 2027.","[[ألغى سياسة التعليم 1390|ar.law.repeal]] بانتقال منظم: أحكامها **سارية حتى يُقر البديل** خلال سنة من نفاذه (قرار مجلس الوزراء 103).","[[مجلس شؤون التعليم العام|ar.law.council]] برئاسة **وزير التعليم**، يحدد سن القبول، ويعمل **من تاريخ النشر** لا بعد 180 يوماً.","[[**الإلزام من 6 إلى 15**|ar.law.compulsory]] (المادة 4)، والتعليم **مجاني في المؤسسات الحكومية** (المادة 3).","[[المراحل|ar.law.defs]]: الحضانة ورياض الأطفال والصفوف 1–12، و**الطفولة المبكرة** حتى **نهاية الصف الثالث** (المادة 1).","ذوو الإعاقة: [[الدمج أولاً|ar.law.inclusion]] والمراكز لمن يتعذر دمجه؛ والموهوبون: برامج و[[التسريع|ar.law.gifted]] بتقويم شامل.","وفيه [[12 هدفاً|ar.law.goals]] و[[إطار وطني للمناهج|ar.law.curriculum]]، و[[أحكام أخرى|ar.law.general]]: التعليم **حضوري**، والعربية أساس مع جواز لغة إضافية."],"t":[["نظام التعليم العام","نظام صدر بالمرسوم الملكي م/36 (1448/1/27هـ)، 68 مادة في 9 فصول، نُشر 1448/2/10هـ ويُعمل به بعد 180 يوماً من نشره (المادة 68)."],["الفترة الانتقالية","بقاء أحكام سياسة التعليم والوثائق الملغاة معها سارية حتى يقر المجلس البديل خلال سنة من نفاذ النظام (قرار مجلس الوزراء 103)."],["مجلس شؤون التعليم العام","مجلس يرأسه وزير التعليم، يقر سياسات التعليم العام ولوائحه الكبرى ويحدد سن القبول (المادتان 7 و8)."],["الطفولة المبكرة","التعليم والرعاية من بداية الحضانة حتى نهاية الصف الثالث (المادة 1)."],["سن التعليم الإلزامي","من السنة السادسة حتى الخامسة عشرة (المادة 4)."],["المنهج التعليمي","أهداف مخطط لها تحقق نواتج تعلم مقصودة، ويُتأكد من تحققها بالتقويم (المادة 1)."],["المقرر الدراسي","المحتوى الذي تتضمنه الخطة الدراسية ويدرسه الطلاب (المادة 1)."],["الدمج","تعليم ذوي الإعاقة في المؤسسات التعليمية مع الوسائل والتقنيات المساعدة وتقويم يراعي خصائصهم (المادة 20)."],["التسريع","انتقال المتفوق من مرحلة إلى أعلى وفق معايير وتقويم شامل وتنسيق مع ولي الأمر (المادة 23)."],["الاعتماد المدرسي","اعتماد تلتزم به المؤسسات الخاصة من هيئة تقويم التعليم والتدريب أو هيئة دولية تعتمدها (المادة 30)."]]},{"h":"نظام 1448: الطالب والمعلم والمدرسة الخاصة والجزاءات","pts":["[[الجزاءات|ar.law.penalties]]: عند **قرائن** الإخلال تدابير عاجلة مثل كف اليد؛ وعند **ثبوت** المخالفة الجسيمة إنهاء الخدمة والمنع من العودة للتعليم العام والخاص.","التظلم من الجزاء أمام **الجهة القضائية خلال 60 يوماً** (المادة 63)؛ و**الحكم القضائي النهائي** بجريمة مخلة بالأمانة أو الشرف يُنهي الخدمة (المادة 64)."],"t":[["الاجتهاد الفردي","تكليف من معلم أو إداري بلا سند في النظام واللوائح، ومن حق الطالب ألا يُكلَّف به (المادة 38/1/د)."],["ميثاق أخلاقيات مهنة التعليم","الوثيقة التي تُلزم المادة 49/3 المعلم بالالتزام بها ضمن واجب القدوة."],["واجب الإبلاغ","التزام إدارة المؤسسة بإبلاغ الجهة المختصة عن أي اعتداء أو إيذاء داخلها أو في محيطها (المادة 65)."],["كف اليد","إيقاف المعلم أو الإداري مؤقتاً عن العمل في المؤسسة الحكومية تدبيراً عاجلاً (المادة 58)."],["المخالفة الجسيمة","في الإخلال بالنظام العام أو اللحمة الوطنية: إذا ثبتت أُنهيت الخدمة ومُنع صاحبها من العودة للمجال التعليمي عاماً وخاصاً (المادة 59)."]],"map":{"type":"fan","title":["Who the law addresses","أطراف النظام: الحقوق والواجبات"],"groups":[{"n":"الطالب","ar":"7 حقوق منها الأمان النفسي والجسدي والفكري، وسماع شكواه وقيدها، وشهادة النجاح **دون قيد أو شرط** (م38).","d":"ar.law.srights"},{"n":"المعلم","ar":"العدالة والفروق الفردية، والقدوة والالتزام بالميثاق **داخل المدرسة وخارجها** (م49).","d":"ar.law.teacher","items":[{"n":"القدوة والميثاق","d":"ar.law.ethics"}]},{"n":"إدارة المدرسة","ar":"**تبلغ الجهة المختصة** عن أي إيذاء داخلها أو في محيطها لطلابها أو منسوبيها (م65).","d":"ar.law.report"},{"n":"المدرسة الخاصة","ar":"ترخيص الوزارة **خلال 30 يوماً**، وتدريس مواد الهوية الوطنية، وغرامة 5,000–50,000 ريال (م32، 31، 60).","d":"ar.law.license"},{"n":"الأسرة","ar":"شريك؛ الوزارة تضع ضوابط مشاركة أولياء الأمور (م50).","d":"ar.law.general"}]}},{"h":"الفروق بين سياسة 1390 ونظام 1448","intro":["أكبر فرق: السياسة **«خطوط عامة»** للتعليم كله ومنه الجامعات، والنظام **أحكام ملزمة** فيها حقوق وجزاءات، وخاص **بالتعليم العام** حتى الصف 12."],"pts":[],"cmp":{"title":"ما الذي تغيّر؟","cols":["سياسة التعليم 1390","نظام التعليم العام 1448"],"rows":[{"k":"طبيعة الوثيقة","tag":"تغيّر","a":"«الخطوط العامة» التي تقوم عليها التربية والتعليم (م1)، **236 مادة في 9 أبواب** بقرار مجلس الوزراء 779.","b":"**نظام** بمرسوم ملكي م/36، **68 مادة في 9 فصول**، فيه جزاءات (ف8) ولوائح تنفيذية بقرار الوزير (م67)."},{"k":"النطاق والمراحل","tag":"تغيّر","a":"التعليم كله: من الحضانة ورياض الأطفال إلى **التعليم العالي** (م108–149)؛ ابتدائي 6 ومتوسط 3 وثانوي 3 (م120، 124، 127).","b":"**التعليم العام فقط** حتى نهاية الصف 12، ومراحله الحضانة ورياض الأطفال والصفوف 1–12 (م1)."},{"k":"الطفولة المبكرة","tag":"تغيّر","a":"دور الحضانة ورياض الأطفال **تشجعها الدولة** وتشرف عليها الجهة المختصة (م116–117).","b":"جزء من التعليم العام، و«الطفولة المبكرة» من الحضانة حتى **نهاية الصف الثالث** (م1)."},{"k":"الجهة العليا","tag":"تغيّر","a":"«مجلس أعلى للتعليم» يشرف على التعليم بكافة أنواعه ومراحله (م231).","b":"[[مجلس شؤون التعليم العام|ar.law.council]] برئاسة **وزير التعليم** (م7)، يقر السياسات واللوائح (م8)."},{"k":"الإلزام وسن القبول","tag":"أُضيف","a":"لا سن إلزام؛ الابتدائي «متاح لكل من بلغ سن التعليم» (م121).","b":"**إلزام من 6 إلى 15** وإجراءات تجاه من يحرم الطفل (م4)، و**سن القبول يحدده المجلس** (م8/2)."},{"k":"المجانية","tag":"تغيّر","a":"التعليم **مجاني في كافة أنواعه ومراحله** (م233).","b":"مجاني **في المؤسسات الحكومية** (م3)، والخاص يحدد رسومه وفق معايير يعتمدها المجلس (م35)."},{"k":"تعليم البنات","tag":"تغيّر","a":"يُمنع الاختلاط في جميع المراحل **إلا في دور الحضانة ورياض الأطفال** (م155).","b":"مدارس البنات مستقلة **بعد مرحلة الطفولة المبكرة**، ويجوز استثناء الخاص بضوابط يعتمدها مجلس الوزراء (م6)."},{"k":"ذوو الإعاقة والموهوبون","tag":"تغيّر","a":"تعليم المعوقين **«وفق إمكانياتها»** بمناهج خاصة (م188)، ورعاية النابغين (م192–194).","b":"[[الدمج أولاً|ar.law.inclusion]] ومراكز لمن يتعذر دمجه (م20–21)، وبرامج للموهوبين و**التسريع** (م22–23)."},{"k":"التعليم الأهلي والأجنبي","tag":"تغيّر","a":"ترخيص الأهلي للجهات المختصة **ولا يُسمح به لغير السعوديين** (م176).","b":"ترخيص الوزارة (م32)، ويشمل الخاص **الاستثمار الأجنبي**، مع تدريس **مواد الهوية الوطنية** (م31)."},{"k":"المعلم","tag":"تغيّر","a":"إعداد المعلم وتدريبه المستمر وكادر خاص (م163–172)، واختيار القائمين على التعليم بالكفاية والخلق (م195).","b":"حقوق للمعلم (م48) وواجبات منها [[الالتزام بميثاق أخلاقيات مهنة التعليم|ar.law.ethics]] داخل المدرسة وخارجها (م49)."},{"k":"حقوق الطالب","tag":"أُضيف","a":"لا قائمة حقوق؛ من أهداف الابتدائية تنمية وعيه بما له من حقوق وما عليه من واجبات (م79).","b":"[[سبعة حقوق وخمسة واجبات|ar.law.srights]] منصوصة (م38)."},{"k":"المخالفات والجزاءات","tag":"أُضيف","a":"","b":"[[تدابير عاجلة وجزاءات|ar.law.penalties]] حتى إنهاء الخدمة، وغرامات على الخاص، و[[واجب الإبلاغ|ar.law.report]] (م57–65)."}]}},{"h":"ميثاق أخلاقيات مهنة التعليم (1427هـ)","pts":["صدر **1427هـ**؛ وأخلاقيات المهنة فيه «السجايا الحميدة والسلوكيات الفاضلة» التي يتحلى بها العاملون في التعليم.","من أهدافه **الإسهام في تعزيز مكانة المعلم العلمية والاجتماعية** وتعزيز انتمائه لرسالته.","مع طلابه: **العدل** وصون الكرامة و[[تجنب العقاب البدني والنفسي|ar.l02.rifq]]؛ ومع الأسرة: [[شريك الوالدين|ar.l04.parentcomm]].","الخلاف المهني بين المعلمين يُحسم بـ**مراجعة ميثاق أخلاقيات مهنة التعليم**، لا بالمواثيق العالمية.","[[النمو المهني|ar.l03.pd]] فيه **واجب أساس**؛ واستجابة المعلم لمواقف مهنته تسمى **اتجاهه نحو المهنة**."],"t":[["أخلاقيات مهنة التعليم","السجايا الحميدة والسلوكيات الفاضلة الواجبة على العاملين في التعليم فكراً وسلوكاً."],["رسالة التعليم","رسالة تستمد أخلاقياتها من الشريعة وتوجب الإخلاص والصدق والعطاء المستمر."],["المعلم شريك الوالدين","بند الميثاق في علاقة المعلم بالأسرة: توطيد الثقة والتشاور بشأن الطالب."],["الاتجاه نحو المهنة","استجابة المعلم الإيجابية أو السلبية للمواقف المرتبطة بمهنة التدريس."],["السرية المهنية","[[حفظ أسرار الطلاب وأسرهم|ar.l02.prohibited]] وعدم إفشاء معلوماتهم إلا عبر القنوات النظامية."]],"intro":["ثلاث وثائق تتكلم عن أخلاق المعلم: [[الميثاق|ar.l02.mithaq]] وثيقة قيم يسميها المعيار 1.3 صراحة، و[[مدونة 1447|ar.l02.code1447]] قواعد ملزمة بواجبات و[[محظورات|ar.l02.prohibited]] ومساءلة، و[[مدونة الوظيفة العامة|ar.l02.civilcode]] إطار عام لكل موظفي الدولة. إذا ذُكر في السؤال طلاب أو أولياء أمور أو اختبارات فالمرجع الأدق مدونة 1447."]},{"h":"لائحة الوظائف التعليمية (1440هـ) والرخصة المهنية","pts":["[[اللائحة|ar.l02.jobsreg]] بقرار مجلس الوزراء 601 لعام 1440هـ (38 مادة)، و[[**الرخصة المهنية**|ar.l02.license]] تصدرها **هيئة تقويم التعليم والتدريب**.","الرخصة **إلزامية لمزاولة التعليم** منذ فبراير 2026 (تعديل 1446)، ويُعفى من بلغ الخمسين قبله.","الاجتياز بدرجة الرتبة في **الاختبارين معاً**، والدرجة لا تكفي وحدها بل مع **سنوات الخبرة**.","الصلاحية **خمس سنوات**؛ و[[الترقية|ar.l02.jobsmore]] برخصة سارية وأداء جيد جداً فأعلى وسنوات الرتبة (6 بكالوريوس، 5 ماجستير، 4 دكتوراه).","المعيّن ابتداءً **تحت التجربة سنتين**."],"t":[["الرخصة المهنية","وثيقة تصدرها هيئة تقويم التعليم والتدريب تؤهل حاملها لمزاولة التعليم برتبة ومدة محددتين."],["المعايير المهنية","ما يجب على شاغلي الوظائف التعليمية معرفته وممارسته وفق قيم المهنة ومسؤولياتها."],["معلم ممارس","الرتبة التي يبدأ بها حامل البكالوريوس بعد اجتياز الاختبار بـ50 فأعلى."],["معلم خبير","أعلى رتب المعلمين وتتطلب 80 فأعلى في الاختبارين وسنوات رتبة متقدم."],["النصاب التعليمي","مجموع الحصص الصفية الأسبوعية الواجبة على شاغل الوظيفة التعليمية."],["مدة التجربة","سنتان للمعيّن ابتداءً يُقوَّم خلالها مرة على الأقل."],["هيئة تقويم التعليم والتدريب","الجهة المسؤولة عن المعايير المهنية والاختبارات وإصدار الرخص."],["الفاقد التعليمي","خسارة النظام التعليمي الناتجة عن رسوب الطلاب أو تسربهم من المدرسة."],["مؤشر الأداء","دليل قابل للملاحظة والقياس يبيّن مدى تحقق المعيار في ممارسة المعلم."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Five Teacher Ranks","الرتب الخمس: الاجتياز والنصاب"],"groups":[{"n":"مساعد معلم","ar":"ثانوية ودبلوم لا يقل عن سنة.","d":"ar.l02.jobsreg"},{"n":"معلم","ar":"مؤهل **دون الجامعي** · نصاب **24** حصة.","d":"ar.l02.jobsreg"},{"n":"معلم ممارس","ar":"اجتياز **50** · نصاب **24** حصة؛ ويبدأ به التعيين الجامعي.","d":"ar.l02.license"},{"n":"معلم متقدم","ar":"اجتياز **70** · نصاب **22** حصة.","d":"ar.l02.license"},{"n":"معلم خبير","ar":"اجتياز **80** · نصاب **18** حصة.","d":"ar.l02.license"}]}},{"h":"لائحة السلوك والمواظبة ومواقف الالتزام بالأنظمة","pts":["ضرب طالب لزميله: **إشعار ولي الأمر** وتعهد خطي ونقل لفصل آخر، لا عقابه أمام زملائه.","طالب يدخن خارج السور: [[**إبلاغ المرشد الطلابي ومدير المدرسة**|ar.l02.committee]]، لا التجاهل ولا التوبيخ العلني.","جهة خارجية تطلب معلومات طالب: [[**التحدث مع إدارة المدرسة واتباع تعليماتها**|ar.l01.privacy]]، لا إرسال السجلات.","ولي أمر يريد أخذ ابنه أثناء الحصة: يُحال إلى **إدارة المدرسة**، فالاستئذان إجراء إداري.","قواعد ضبط الصف مع الطلاب **متسقة مع قواعد الانضباط التي أقرتها الوزارة**، ودليل [[القواعد|ar.l02.behavior]] يُسلَّم لولي الأمر ويوقّع بالعلم."],"t":[["لائحة السلوك والمواظبة","القواعد المنظمة لسلوك الطلاب وحضورهم ودرجات السلوك والإجراءات التصحيحية."],["العقد السلوكي","اتفاق موقّع بين المدرسة والطالب وولي أمره على سلوك محدد وتبعاته."],["لجنة التوجيه والإرشاد","اللجنة المدرسية المختصة بدراسة المشكلات السلوكية واتخاذ الإجراءات، واسمها في قواعد 1447 لجنة التوجيه الطلابي."],["المرشد الطلابي","المختص بمتابعة الحالات السلوكية والنفسية وتُحال إليه المخالفات المتكررة، ويسمى في قواعد 1447 الموجه الطلابي."],["الدليل التنظيمي","وثيقة الوزارة التي تحدد الإجراءات والصلاحيات المدرسية."]],"cmp":{"title":"ما تغيّر في قواعد السلوك والمواظبة 1447 (الإصدار الخامس)","cols":["الإصدارات السابقة","قواعد 1447"],"rows":[{"k":"اسم اللجنة","a":"لجنة التوجيه والإرشاد","b":"لجنة التوجيه الطلابي","tag":"تغيّر"},{"k":"المختص بدراسة الحالة","a":"المرشد الطلابي","b":"الموجه الطلابي، ولا يشارك في رصد الدرجات ولا تنفيذ الإجراءات","tag":"تغيّر"},{"k":"النطاق خارج السور","a":"الطرقات المحيطة لطلاب المتوسطة والثانوية","b":"حدود المدرسة (الشوارع المحاذية) لجميع الطلاب إذا رصدها منسوبو المدرسة أو كاميراتها، والتعليم الإلكتروني والحافلات والأنشطة","tag":"تغيّر"},{"k":"درجة السلوك","a":"—","b":"100: إيجابي 80 تُحسم منه، ومتميز 20 تُكتسب، مع فرص تعويض","tag":"أُضيف"}]}},{"h":"قواعد السلوك والمواظبة 1447 (الإصدار الخامس): الدرجات والمواظبة","pts":["[[الإصدار الخامس|ar.l02.grades]] (1447هـ) ألغى ما سبقه: **درجة السلوك 100** = 80 للسلوك الإيجابي تُحسم، و20 للسلوك المتميز تُكتسب.","**درجات الحسم**: الأولى 1، الثانية 2، الثالثة 3، الرابعة 10، الخامسة 15؛ مع فرص تعويض لا تعفي من الإجراءات.","**التدرج**: الإجراء التالي عند تكرار المشكلة نفسها؛ وتعدد المشكلات معاً ← إجراءات الأعلى درجة.","**المواظبة 100 درجة** من الثالث الابتدائي: درجة عن كل يوم غياب بدون عذر، وتجاوز 10% يحرم من الانتقال.","العذر خلال **ثلاثة أيام عمل**، ويُشعَر ولي الأمر بالغياب في اليوم نفسه."],"t":[["السلوك المتميز","سلوك يعكس الممارسات المتسقة مع القيم الإسلامية والهوية الوطنية، وله 20 درجة من درجة السلوك."],["فرص التعويض","ممارسات يؤديها الطالب المخالف لاسترداد الدرجات المحسومة من السلوك الإيجابي."],["لجنة التوجيه الطلابي","اللجنة المدرسية التي تدرس المشكلات السلوكية والحالات عالية الخطورة وترفع توصياتها للمدير."],["الموجه الطلابي","المختص بدراسة حالات الطلبة وعلاجها، ولا يشارك في رصد الدرجات أو حسمها."]]}],"trap":["سن القبول **ست سنوات هجرية** لا ميلادية؛ والـ90 يوماً استثناء بعد قبول من أتم السادسة.","سياسة التعليم **1390هـ** · الميثاق **1427هـ** · اللائحة **1440هـ** (نافذة 1441هـ) · الجرائم المعلوماتية **1428هـ**.","الرخصة يصدرها **هيئة تقويم التعليم والتدريب**، لا وزارة التعليم.","الدرجات 50/70/80 مطلوبة في **كلا الاختبارين**، ولا تُوزَن بينهما.","«تعزيز مكانة المعلم» و«تعزيز انتمائه لمهنته» = أهداف **الميثاق**، وليست أهداف سياسة التعليم.","اللجنة العليا لسياسة التعليم تُقر **الخطة** ولا تُعد المعلمين ولا تبني المقررات.","الخلاف بين معلمين: مرجعه **الميثاق السعودي** لا المواثيق العالمية ولا حكم المدير.","التدخين خارج السور: **المرشد والمدير** معاً؛ «التجاهل لأنه خارج المدرسة» فخ لأن اللائحة تشمل محيط المدرسة.","طلب جهة خارجية معلومات: **الإدارة أولاً**؛ إذن الطالب وحده لا يكفي.","الاطلاع على تقويم الأداء **حق**؛ حضور الاجتماعات والنشاط **واجب**.","الرتب خمس تبدأ بـ**مساعد معلم** وتنتهي بـ**خبير**؛ «معلم» رتبة لحامل المؤهل دون الجامعي.","ضبط الصف باتفاق مع الطلاب شيء جميل لكنه يجب أن يتسق مع **قواعد الوزارة** لا مع معلمي المدرسة الآخرين.","نظام التعليم العام **منشور لا نافذ**: يُعمل به **بعد 180 يوماً من نشره** (1448/2/10)، لا من تاريخ المرسوم ولا قرار مجلس الوزراء؛ والمجلس وحده يعمل **من تاريخ النشر**.","سياسة التعليم **أُلغيت بقرار مجلس الوزراء 103**، لكن أحكامها **سارية حتى يصدر البديل خلال سنة من نفاذ النظام**؛ «أُلغيت فوراً» خطأ.","الإلزام **من 6 إلى 15** (المادة 4)، والتعليم العام **حتى نهاية الصف 12** (المادة 1)، والطفولة المبكرة **حتى نهاية الصف الثالث**؛ لا تخلط الحدود الثلاثة.","سن القبول في النظام يحدده **المجلس** (المادة 8/2) لا الوزارة؛ ورئيس المجلس **وزير التعليم**.","شهادة النجاح تُسلَّم **دون قيد أو شرط** (المادة 38/1/ز)، وواجب القدوة **داخل المدرسة وخارجها** (المادة 49/3).","الإبلاغ عن الإيذاء واجب **إدارة المؤسسة** إلى **الجهة المختصة**، ويشمل **محيط المدرسة** و**المنسوبين** لا الطلاب فقط (المادة 65).","مُهل النظام: الترخيص **30 يوماً** (م32)، التظلم من الجزاء **60 يوماً** (م63)، النفاذ **180 يوماً** (م68)."],"vid":[["uoQ4uFMXHAg","شرح المجال الأول: القيم والمسؤوليات المهنية 3","سهام الزهراني",34],["-8jrL3Z4yjw","حل أسئلة المعيار الأول","سهام الزهراني",32],["QwM81gxnLak","شرح المجال الأول: القيم والمسؤوليات المهنية (الجزء الثاني)","سهام الزهراني",36],["nZ_a_uuGpGU","شرح مختصر للوائح التعليمية","سهام الزهراني",27],["fDefgVgKliE","ميثاق أخلاقيات مهنة التعليم","سلوى البحيري",28],["dWG7q59sM80","شرح المعيار الأول","د. منصور البلادي",67]],"_law1448":true,"n":2},{"id":"L03","d":"V","std":"2","sub":"2.1، 2.2","ar":"التطوير المهني المستمر والبحث الإجرائي","goal":"تبني خطة تطوير مهني في ضوء المعايير انطلاقاً من التأمل وتقويم الزملاء، وتميّز أساليب النمو المهني وأدوات التأمل، وتعرف خطوات البحث الإجرائي وخصائصه كما تَرِد في الاختبار.","sec":[{"h":"مفهوم التطوير المهني وخطته","pts":["خطة التطوير تُبنى **في ضوء المعايير المهنية**: رصد الممارسة ← مقارنتها بالمعيار ← تحديد الفجوة ← أهداف التحسين.","الاحتياجات تُعرف بـ[[**التأمل الذاتي وتقويم الزملاء والخبراء**|ar.l03.reflect]] وآراء الطلاب (الاحتياجات التدريبية).","التطوير يُعامَل **كعمليات مستمرة لا كنتائج**، وليس من أهدافه تطوير البيئة المادية للصف.","النمو المهني **واجب أساس**؛ ودورة أثناء الخدمة: **يدرس مدى مناسبتها له** قبل التقدم.","دورة في التخطيط وإدارة الصف = تطوير **المهارات المهنية**؛ وتدني نتائج صفه: يتحمل المسؤولية كاملة ويرفع مستواهم."],"t":[["التنمية المهنية","كل عمل مخطط يقوم به المعلم لتعديل وتطوير معارفه ومهاراته وقيمه المهنية."],["التدريب المهني","إكساب المعلم مهارات التدريس اللازمة لرفع كفاءته."],["التربية المهنية","تعديل أفكار المعلم ومعتقداته وترسيخ القيم المهنية لديه."],["المساندة المهنية","توفير الاستقرار الوظيفي والمناخ المادي والنفسي المناسب."],["الاحتياج التدريبي","الفجوة بين الأداء الحالي والأداء المطلوب وفق المعايير المهنية."],["التعلم مدى الحياة","استمرار المعلم في التعلم والتطور طوال مسيرته المهنية."]],"map":{"type":"fan","title":["Elements of Professional Development","عناصر التنمية المهنية"],"groups":[{"n":"التدريب المهني","ar":"إكساب المعلم **مهارات** التدريس اللازمة لرفع كفاءته.","d":"ar.l03.pd"},{"n":"المساندة المهنية","ar":"توفير **الاستقرار الوظيفي** والمناخ المادي والنفسي المناسب وتحسين بيئة العمل.","d":"ar.l03.pd"},{"n":"التربية المهنية","ar":"تعديل **أفكار المعلم ومعتقداته** وترسيخ القيم المهنية لديه.","d":"ar.l03.pd"}]}}],"trap":[],"vid":[["lfIY9VaExkU","شرح المجال الأول: شرح التطوير المهني للمعلمين 5","سهام الزهراني",35],["muq6eiH9a4Q","أسئلة تطبيقية على معيار الثاني من معايير الرخصة المهنية التطوير المهني المستمر","سهام الزهراني",38],["BfhKUwGzi8I","التنمية المهنية","سلوى البحيري",32],["tAkMiU4n-hg","البحث الإجرائي","سلوى البحيري",9],["DkIDi1eBrwQ","البحث الإجرائي في الرخصة المهنية","منصة البراعة",5],["MX3GgO3V6m4","المحاضرة الثالثة: المجال الأول، البحث الإجرائي ومجتمعات التعلم المهنية","منصة نبراس",41]],"n":3,"locked":true},{"id":"L04","d":"V","std":"3","sub":"3.1–3.3","ar":"التفاعل مع مجتمعات التعلم وأولياء الأمور والمجتمع","goal":"تعرف مبادئ مجتمعات التعلم المهنية وأوعيتها، وتختار في كل موقف مع ولي أمر أو المجتمع المحلي الخطوة الأولى والأنسب كما يحددها مفتاح الهيئة.","sec":[{"h":"مجتمعات التعلم المهنية","pts":["[[**مجتمع التعلم المهني**|ar.l04.plc]]: مهنيون في المدرسة يعملون بشكل مخطط، وهدفه **تفعيل تعاون المعلمين لتحسين تعلم الطلاب**.","مبادئه: تشارك الرؤية والقيم والأهداف، تبني ثقافة التعاون، التركيز على تعلم الطلاب، التركيز على النتائج.","المفهوم الخاطئ: أنه **يُعنى بالجوانب النظرية**؛ و[[أوعيته|ar.l04.plcforms]] منها البحوث الإجرائية والتوأمة المهنية والتدريب بالأقران.","يُشكَّل حسب **الصفوف التي يدرسونها**، ويحلل النتائج بأسئلة عن الأسئلة والفصول، لا عمّن حصل على أعلى الدرجات.","اجتماع معلمي صف لمساعدة الضعاف = **تقديم تعليم مناسب لجميع أنواع ومستويات الطلاب**.","الخلاف مع الزملاء ← **اقتراح مبادرات جماعية للعمل كفريق**، والنقد ← الصبر؛ وللمستجدين البيئة الداعمة والإسناد."],"t":[["مجتمع التعلم المهني","مجموعة من المهنيين يعملون بتعاون مخطط لتحسين تعلم الطلاب وأداء بعضهم."],["ثقافة التعاون","عمل المعلمين بشكل تبادلي للتأثير في ممارساتهم الصفية وتحمل المسؤولية المشتركة."],["التوأمة المهنية","شراكة بين معلمين أو مدرستين لتبادل الخبرات والممارسات."],["التدريب بالأقران","معلم يدرب زميله على مهارة ويتابعه داخل الصف."],["الشبكات المهنية","روابط معلمين متميزين في مهارة ينسق المشرف عملهم لدعم أقرانهم."],["المدرسة المتعلمة","مدرسة تتعلم كمؤسسة ويطور منتسبوها ممارساتهم باستمرار."],["التركيز على النتائج","الحكم على نجاح التنمية المهنية بما يتعلمه الطلاب ويستطيعون فعله."]],"intro":[]},{"h":"التفاعل مع أولياء الأمور","pts":["ولي الأمر الغاضب: [[**الإنصات أولاً**|ar.l04.angry]] ثم العرض؛ والغاضب من مستوى ابنه: مواجهته بهدوء ومنطق ومحايدة.","مناقشة التقدم: [[**عقد اجتماع لمناقشة الأهداف المشتركة**|ar.l04.parentcomm]]، لا الملاحظات المكتوبة ولا دفتر المتابعة.","صعوبات التعلم: **طلب موعد اجتماع مع مختص صعوبات التعلم**؛ وشكوى التنمر: [[استماع ثم متابعة مع المرشد الطلابي|ar.l02.rifq]].","التقارير هدفها **توضيح مستوى الطالب وتقدمه** بلغة بسيطة وموجزة؛ والسؤال الحاكم: ماذا أريد من ولي الأمر أن يعرف؟",
