قتصاد مزدهر، وطن طموح."],["برنامج تنمية القدرات البشرية","أحد برامج الرؤية لإعداد مواطن تنافسي بالقيم والمعارف والمهارات."],["الشواهد","الأدلة الواقعية (أرقام، منجزات، مواقف) التي يُبنى عليها تعزيز الهوية بدل الوعظ."]]},{"h":"التنوع الثقافي والتعايش","pts":["مثال إيجابي من ثقافة أخرى [[**يعزز ثقافة احترام الآخرين**|ar.l01.diversity]]، والمعلم ينمي التفاعل الإيجابي مع الثقافات الأخرى دون تنازل عن الثوابت.","أفعل استراتيجية **نشاط عملي** يعيشه الطالب، والتنوع في الفصل يُستثمر بإتاحة الحديث عن محتوى الدرس لا بعزل المتشابهين.","الزميل غير المسلم: التعامل **وفق مقتضيات مهام العمل** باتزان؛ والآراء المتباينة مكونات ثقافية تتكامل في بناء الحضارة."],"t":[["التنوع الثقافي","وجود خلفيات وعادات ولغات مختلفة داخل الصف أو المجتمع تُدار بالاحترام المتبادل."],["التعايش","العيش المشترك مع المختلف ثقافياً أو دينياً على أساس الاحترام والمصلحة المشتركة."],["التفاعل الإيجابي مع الثقافات","الاستفادة من الحكمة والعلم أينما وُجدا مع الحفاظ على الهوية."],["التعصب","رفض الآخر لمجرد اختلافه، وهو نقيض الوسطية."]]},{"h":"المواطنة الرقمية وأخلاقيات التقنية","pts":["**المواطنة الرقمية**: الممارسة الآمنة والقانونية والأخلاقية للتقنية، ويحكمها [[نظام مكافحة الجرائم المعلوماتية|ar.l01.techcode]] (1428هـ).","من أخلاقيات المراسلة: **تعريف النفس بوضوح** ومراعاة حقوق النشر والاعتذار عن الرسالة الخاطئة؛ لا إخفاء الهوية.","صور الطلاب: [[**مراجعة ما تتطلبه لوائح الوزارة لنشر الصور**|ar.l01.privacy]] أولاً، ثم إذن ولي الأمر.","مصداقية الموقع: **وجود معلومات مُعدّ الموقع وإمكانية التأكد منها**، لا عدد الروابط ولا جمال العرض."],"t":[["المواطنة الرقمية","الاستخدام المسؤول والآمن والأخلاقي للتقنية والإنترنت."],["الجريمة المعلوماتية","فعل يُرتكب عبر الحاسب أو الشبكة مخالفاً للنظام (ابتزاز، تشهير، اختراق)."],["حقوق الملكية الفكرية","حق المؤلف في نتاجه؛ يُراعى بالعزو وعدم النسخ غير المصرح به."],["الأمن الرقمي","حماية البيانات والحسابات وكلمات المرور من الوصول غير المشروع."]]},{"h":"التراث الثقافي الوطني والمناسبات الوطنية","pts":["مؤشر الممارس 1.2: **يوظف المعلم خبرات ومواقف وأنشطة تعليمية** تدعم الاعتزاز بالهوية الوطنية وبالتراث الثقافي الوطني.","[[**التراث المادي**|ar.l01.heritage]]: مبانٍ تاريخية وآثار وحِرف وأزياء؛ و**التراث غير المادي**: عادات وأمثال وشعر وفنون كالعرضة وآداب الضيافة.","الاحتفاء بأنشطة هادفة لا بالمظاهر، وقواعد 1447 تعد المشاركة الإيجابية في المناسبات الوطنية من **السلوك المتميز** (الانتماء الوطني).","تنوع تراث المناطق **ثراء لهوية وطنية واحدة**، والتعريف به يعزز الوحدة الوطنية."],"t":[["التراث المادي","الموروث الملموس: المباني التاريخية والمواقع الأثرية والحرف والأدوات والأزياء."],["التراث غير المادي","الموروث غير الملموس: العادات والأمثال والشعر والفنون الشعبية وآداب التعامل."],["يوم التأسيس","22 فبراير: ذكرى تأسيس الدولة السعودية الأولى عام 1139هـ على يد الإمام محمد بن سعود."],["يوم العلم","11 مارس: مناسبة وطنية للاعتزاز بالعلم السعودي ودلالاته."]],"map":{"type":"tree","title":["National Occasions","المناسبات الوطنية"],"groups":[{"n":"يوم التأسيس","ar":"22 فبراير","d":"ar.l01.heritage","items":[{"n":"1139هـ (1727م)","who":"الإمام محمد بن سعود","ar":"تأسيس الدولة السعودية الأولى"}]},{"n":"اليوم الوطني","ar":"23 سبتمبر","d":"ar.l01.heritage","items":[{"n":"1351هـ (1932م)","who":"الملك عبدالعزيز","ar":"توحيد المملكة"}]},{"n":"يوم العلم","ar":"11 مارس","d":"ar.l01.heritage","items":[{"n":"العلم","ar":"من رموز الهوية الوطنية"}]}]}}],"trap":["الاستشهاد بأمثلة إيجابية من ثقافة أخرى = **احترام الآخرين**، وليس تعزيز الهوية الوطنية ولا إضعافها.","تنمية الوطنية تبدأ بـ**غرس المفهوم** (حب الوطن)، أما تعليق الأعلام والبرامج الثقافية فوسائل تابعة.","القدوة = **حسن التعامل** والسلوك العملي؛ «أساليب تربوية في العقاب» بديل جذاب لكنه عن الضبط لا القدوة.","الطالب الجدلي: **أدلة منطقية + قدوة** وليس «قفل باب الجدال» (قمع) ولا «موقع إلكتروني» (تنصّل).","الحياد في القضايا **الخلافية** لا يعني الحياد في **الثوابت**؛ الثوابت تُعلَّم بوضوح.","تعزيز الهوية **بالشواهد والمنجزات** لا بالوعظ؛ الخيار الوعظي يبدو «أخلاقياً» لكنه أقل فاعلية.","التنوع الثقافي يُفهم بـ**نشاط عملي** لا بملصقات أو قوائم أعياد (شكلية).","زميل غير مسلم في مهمة عمل: التعامل **وفق مهام العمل**، لا دعوة ولا مقاطعة ولا إحالة لمراكز دعوة.","«الأمة أم الوطن؟» الجواب حوار يجمع لا يفرّق؛ أي خيار يُسكت الطالب أو يسخر منه خاطئ.","نشر صور الطلاب: الخطوة الأولى **مراجعة لوائح الوزارة**، وإذن ولي الأمر يأتي بعدها.","ترتيب كراثول للمواطنة: **إصغاء ← مشاركة ← تقدير ← تمثّل**؛ «يكون قدوة لأسرته» هو الأعلى دائماً."],"vid":[["BhH2AyKxhLw","مراجعة شاملة لكل المعايير: المختصر المفيد","سهام الزهراني",116],["QwM81gxnLak","شرح المجال الأول: القيم والمسؤوليات المهنية2","سهام الزهراني",36],["-8jrL3Z4yjw","حل أسئلة المعيار الأول","سهام الزهراني",32],["is9hFBvOkrE","شرح المجال الأول: القيم والمسؤوليات المهنية (الجزء الأول)","سهام الزهراني",34],["fDefgVgKliE","ميثاق أخلاقيات مهنة التعليم","سلوى البحيري",28],["yhVbxgy0B9I","مراجعة المعيار الأول","د. حمدي العياضي",29]],"n":1},{"id":"L02","d":"V","std":"1","sub":"1.3","ar":"أخلاقيات المهنة وسياسة التعليم واللوائح","goal":"تستدعي أرقام وبنود وثيقة سياسة التعليم وميثاق الأخلاقيات ولائحة الوظائف التعليمية ولائحة السلوك، وتطبّقها على مواقف الالتزام بالأنظمة التي يقيسها الاختبار.","sec":[{"h":"وثيقة سياسة التعليم (1390هـ)","pts":["[[سياسة التعليم|ar.l02.policy]]: قرار مجلس الوزراء **779** (1389/9/16هـ)، وتشتهر باسم «سياسة التعليم 1390هـ»: 236 مادة هي «الخطوط العامة» للتعليم.","أسسها الإيمان بالله رباً وبالإسلام ديناً وبمحمد ﷺ نبياً، وغاية التعليم **فهم الإسلام فهماً صحيحاً متكاملاً**.","السلم: ابتدائي 6 ومتوسط 3 وثانوي 3؛ ومن مبادئها **التربية المتكاملة** وحق الفتاة في التعليم.","**مستجد:** ألغاها قرار مجلس الوزراء 103 (1448هـ) مع بقاء أحكامها حتى يصدر البديل؛ والنظام الجديد في القسم التالي."],"t":[["سياسة التعليم","الخطوط العامة التي تقوم عليها التربية والتعليم في المملكة، المعتمدة بقرار 779 لعام 1390هـ."],["الغاية من التعليم","فهم الإسلام فهماً صحيحاً متكاملاً وغرس العقيدة وتزويد الطالب بالقيم والمعارف."],["التربية المتكاملة","إعداد المواطن المؤمن إعداداً سليماً شاملاً لجوانب شخصيته."],["السلم التعليمي","مجموع الصفوف الدراسية في التعليم العام وعددها اثنا عشر صفاً."],["التعليم الموازي","تحفيظ القرآن ومعاهد التربية الخاصة والمدارس الأهلية ومحو الأمية وتعليم الكبار."],["اللجنة العليا لسياسة التعليم","الجهة التي تقر الخطة التعليمية وترسم السياسة العامة للتعليم."]]},{"h":"نظام التعليم العام 1448: أهم ما فيه","pts":["**منشور ولم يُطبَّق بعد:** نُشر في أم القرى **1448/2/10هـ**، ويُعمل به [[بعد 180 يوماً من نشره|ar.law.effective]] (المادة 68)، أي نحو يناير 2027.","[[ألغى سياسة التعليم 1390|ar.law.repeal]] بانتقال منظم: أحكامها **سارية حتى يُقر البديل** خلال سنة من نفاذه (قرار مجلس الوزراء 103).","[[مجلس شؤون التعليم العام|ar.law.council]] برئاسة **وزير التعليم**، يحدد سن القبول، ويعمل **من تاريخ النشر** لا بعد 180 يوماً.","[[**الإلزام من 6 إلى 15**|ar.law.compulsory]] (المادة 4)، والتعليم **مجاني في المؤسسات الحكومية** (المادة 3).","[[المراحل|ar.law.defs]]: الحضانة ورياض الأطفال والصفوف 1–12، و**الطفولة المبكرة** حتى **نهاية الصف الثالث** (المادة 1).","ذوو الإعاقة: [[الدمج أولاً|ar.law.inclusion]] والمراكز لمن يتعذر دمجه؛ والموهوبون: برامج و[[التسريع|ar.law.gifted]] بتقويم شامل.","وفيه [[12 هدفاً|ar.law.goals]] و[[إطار وطني للمناهج|ar.law.curriculum]]، و[[أحكام أخرى|ar.law.general]]: التعليم **حضوري**، والعربية أساس مع جواز لغة إضافية."],"t":[["نظام التعليم العام","نظام صدر بالمرسوم الملكي م/36 (1448/1/27هـ)، 68 مادة في 9 فصول، نُشر 1448/2/10هـ ويُعمل به بعد 180 يوماً من نشره (المادة 68)."],["الفترة الانتقالية","بقاء أحكام سياسة التعليم والوثائق الملغاة معها سارية حتى يقر المجلس البديل خلال سنة من نفاذ النظام (قرار مجلس الوزراء 103)."],["مجلس شؤون التعليم العام","مجلس يرأسه وزير التعليم، يقر سياسات التعليم العام ولوائحه الكبرى ويحدد سن القبول (المادتان 7 و8)."],["الطفولة المبكرة","التعليم والرعاية من بداية الحضانة حتى نهاية الصف الثالث (المادة 1)."],["سن التعليم الإلزامي","من السنة السادسة حتى الخامسة عشرة (المادة 4)."],["المنهج التعليمي","أهداف مخطط لها تحقق نواتج تعلم مقصودة، ويُتأكد من تحققها بالتقويم (المادة 1)."],["المقرر الدراسي","المحتوى الذي تتضمنه الخطة الدراسية ويدرسه الطلاب (المادة 1)."],["الدمج","تعليم ذوي الإعاقة في المؤسسات التعليمية مع الوسائل والتقنيات المساعدة وتقويم يراعي خصائصهم (المادة 20)."],["التسريع","انتقال المتفوق من مرحلة إلى أعلى وفق معايير وتقويم شامل وتنسيق مع ولي الأمر (المادة 23)."],["الاعتماد المدرسي","اعتماد تلتزم به المؤسسات الخاصة من هيئة تقويم التعليم والتدريب أو هيئة دولية تعتمدها (المادة 30)."]]},{"h":"نظام 1448: الطالب والمعلم والمدرسة الخاصة والجزاءات","pts":["[[الجزاءات|ar.law.penalties]]: عند **قرائن** الإخلال تدابير عاجلة مثل كف اليد؛ وعند **ثبوت** المخالفة الجسيمة إنهاء الخدمة والمنع من العودة للتعليم العام والخاص.","التظلم من الجزاء أمام **الجهة القضائية خلال 60 يوماً** (المادة 63)؛ و**الحكم القضائي النهائي** بجريمة مخلة بالأمانة أو الشرف يُنهي الخدمة (المادة 64)."],"t":[["الاجتهاد الفردي","تكليف من معلم أو إداري بلا سند في النظام واللوائح، ومن حق الطالب ألا يُكلَّف به (المادة 38/1/د)."],["ميثاق أخلاقيات مهنة التعليم","الوثيقة التي تُلزم المادة 49/3 المعلم بالالتزام بها ضمن واجب القدوة."],["واجب الإبلاغ","التزام إدارة المؤسسة بإبلاغ الجهة المختصة عن أي اعتداء أو إيذاء داخلها أو في محيطها (المادة 65)."],["كف اليد","إيقاف المعلم أو الإداري مؤقتاً عن العمل في المؤسسة الحكومية تدبيراً عاجلاً (المادة 58)."],["المخالفة الجسيمة","في الإخلال بالنظام العام أو اللحمة الوطنية: إذا ثبتت أُنهيت الخدمة ومُنع صاحبها من العودة للمجال التعليمي عاماً وخاصاً (المادة 59)."]],"map":{"type":"fan","title":["Who the law addresses","أطراف النظام: الحقوق والواجبات"],"groups":[{"n":"الطالب","ar":"7 حقوق منها الأمان النفسي والجسدي والفكري، وسماع شكواه وقيدها، وشهادة النجاح **دون قيد أو شرط** (م38).","d":"ar.law.srights"},{"n":"المعلم","ar":"العدالة والفروق الفردية، والقدوة والالتزام بالميثاق **داخل المدرسة وخارجها** (م49).","d":"ar.law.teacher","items":[{"n":"القدوة والميثاق","d":"ar.law.ethics"}]},{"n":"إدارة المدرسة","ar":"**تبلغ الجهة المختصة** عن أي إيذاء داخلها أو في محيطها لطلابها أو منسوبيها (م65).","d":"ar.law.report"},{"n":"المدرسة الخاصة","ar":"ترخيص الوزارة **خلال 30 يوماً**، وتدريس مواد الهوية الوطنية، وغرامة 5,000–50,000 ريال (م32، 31، 60).","d":"ar.law.license"},{"n":"الأسرة","ar":"شريك؛ الوزارة تضع ضوابط مشاركة أولياء الأمور (م50).","d":"ar.law.general"}]}},{"h":"الفروق بين سياسة 1390 ونظام 1448","intro":["أكبر فرق: السياسة **«خطوط عامة»** للتعليم كله ومنه الجامعات، والنظام **أحكام ملزمة** فيها حقوق وجزاءات، وخاص **بالتعليم العام** حتى الصف 12."],"pts":[],"cmp":{"title":"ما الذي تغيّر؟","cols":["سياسة التعليم 1390","نظام التعليم العام 1448"],"rows":[{"k":"طبيعة الوثيقة","tag":"تغيّر","a":"«الخطوط العامة» التي تقوم عليها التربية والتعليم (م1)، **236 مادة في 9 أبواب** بقرار مجلس الوزراء 779.","b":"**نظام** بمرسوم ملكي م/36، **68 مادة في 9 فصول**، فيه جزاءات (ف8) ولوائح تنفيذية بقرار الوزير (م67)."},{"k":"النطاق والمراحل","tag":"تغيّر","a":"التعليم كله: من الحضانة ورياض الأطفال إلى **التعليم العالي** (م108–149)؛ ابتدائي 6 ومتوسط 3 وثانوي 3 (م120، 124، 127).","b":"**التعليم العام فقط** حتى نهاية الصف 12، ومراحله الحضانة ورياض الأطفال والصفوف 1–12 (م1)."},{"k":"الطفولة المبكرة","tag":"تغيّر","a":"دور الحضانة ورياض الأطفال **تشجعها الدولة** وتشرف عليها الجهة المختصة (م116–117).","b":"جزء من التعليم العام، و«الطفولة المبكرة» من الحضانة حتى **نهاية الصف الثالث** (م1)."},{"k":"الجهة العليا","tag":"تغيّر","a":"«مجلس أعلى للتعليم» يشرف على التعليم بكافة أنواعه ومراحله (م231).","b":"[[مجلس شؤون التعليم العام|ar.law.council]] برئاسة **وزير التعليم** (م7)، يقر السياسات واللوائح (م8)."},{"k":"الإلزام وسن القبول","tag":"أُضيف","a":"لا سن إلزام؛ الابتدائي «متاح لكل من بلغ سن التعليم» (م121).","b":"**إلزام من 6 إلى 15** وإجراءات تجاه من يحرم الطفل (م4)، و**سن القبول يحدده المجلس** (م8/2)."},{"k":"المجانية","tag":"تغيّر","a":"التعليم **مجاني في كافة أنواعه ومراحله** (م233).","b":"مجاني **في المؤسسات الحكومية** (م3)، والخاص يحدد رسومه وفق معايير يعتمدها المجلس (م35)."},{"k":"تعليم البنات","tag":"تغيّر","a":"يُمنع الاختلاط في جميع المراحل **إلا في دور الحضانة ورياض الأطفال** (م155).","b":"مدارس البنات مستقلة **بعد مرحلة الطفولة المبكرة**، ويجوز استثناء الخاص بضوابط يعتمدها مجلس الوزراء (م6)."},{"k":"ذوو الإعاقة والموهوبون","tag":"تغيّر","a":"تعليم المعوقين **«وفق إمكانياتها»** بمناهج خاصة (م188)، ورعاية النابغين (م192–194).","b":"[[الدمج أولاً|ar.law.inclusion]] ومراكز لمن يتعذر دمجه (م20–21)، وبرامج للموهوبين و**التسريع** (م22–23)."},{"k":"التعليم الأهلي والأجنبي","tag":"تغيّر","a":"ترخيص الأهلي للجهات المختصة **ولا يُسمح به لغير السعوديين** (م176).","b":"ترخيص الوزارة (م32)، ويشمل الخاص **الاستثمار الأجنبي**، مع تدريس **مواد الهوية الوطنية** (م31)."},{"k":"المعلم","tag":"تغيّر","a":"إعداد المعلم وتدريبه المستمر وكادر خاص (م163–172)، واختيار القائمين على التعليم بالكفاية والخلق (م195).","b":"حقوق للمعلم (م48) وواجبات منها [[الالتزام بميثاق أخلاقيات مهنة التعليم|ar.law.ethics]] داخل المدرسة وخارجها (م49)."},{"k":"حقوق الطالب","tag":"أُضيف","a":"لا قائمة حقوق؛ من أهداف الابتدائية تنمية وعيه بما له من حقوق وما عليه من واجبات (م79).","b":"[[سبعة حقوق وخمسة واجبات|ar.law.srights]] منصوصة (م38)."},{"k":"المخالفات والجزاءات","tag":"أُضيف","a":"","b":"[[تدابير عاجلة وجزاءات|ar.law.penalties]] حتى إنهاء الخدمة، وغرامات على الخاص، و[[واجب الإبلاغ|ar.law.report]] (م57–65)."}]}},{"h":"ميثاق أخلاقيات مهنة التعليم (1427هـ)","pts":["صدر **1427هـ**؛ وأخلاقيات المهنة فيه «السجايا الحميدة والسلوكيات الفاضلة» التي يتحلى بها العاملون في التعليم.","من أهدافه **الإسهام في تعزيز مكانة المعلم العلمية والاجتماعية** وتعزيز انتمائه لرسالته.","مع طلابه: **العدل** وصون الكرامة و[[تجنب العقاب البدني والنفسي|ar.l02.rifq]]؛ ومع الأسرة: [[شريك الوالدين|ar.l04.parentcomm]].","الخلاف المهني بين المعلمين يُحسم بـ**مراجعة ميثاق أخلاقيات مهنة التعليم**، لا بالمواثيق العالمية.","[[النمو المهني|ar.l03.pd]] فيه **واجب أساس**؛ واستجابة المعلم لمواقف مهنته تسمى **اتجاهه نحو المهنة**."],"t":[["أخلاقيات مهنة التعليم","السجايا الحميدة والسلوكيات الفاضلة الواجبة على العاملين في التعليم فكراً وسلوكاً."],["رسالة التعليم","رسالة تستمد أخلاقياتها من الشريعة وتوجب الإخلاص والصدق والعطاء المستمر."],["المعلم شريك الوالدين","بند الميثاق في علاقة المعلم بالأسرة: توطيد الثقة والتشاور بشأن الطالب."],["الاتجاه نحو المهنة","استجابة المعلم الإيجابية أو السلبية للمواقف المرتبطة بمهنة التدريس."],["السرية المهنية","[[حفظ أسرار الطلاب وأسرهم|ar.l02.prohibited]] وعدم إفشاء معلوماتهم إلا عبر القنوات النظامية."]],"intro":["ثلاث وثائق تتكلم عن أخلاق المعلم: [[الميثاق|ar.l02.mithaq]] وثيقة قيم يسميها المعيار 1.3 صراحة، و[[مدونة 1447|ar.l02.code1447]] قواعد ملزمة بواجبات و[[محظورات|ar.l02.prohibited]] ومساءلة، و[[مدونة الوظيفة العامة|ar.l02.civilcode]] إطار عام لكل موظفي الدولة. إذا ذُكر في السؤال طلاب أو أولياء أمور أو اختبارات فالمرجع الأدق مدونة 1447."]},{"h":"لائحة الوظائف التعليمية (1440هـ) والرخصة المهنية","pts":["[[اللائحة|ar.l02.jobsreg]] بقرار مجلس الوزراء 601 لعام 1440هـ (38 مادة)، و[[**الرخصة المهنية**|ar.l02.license]] تصدرها **هيئة تقويم التعليم والتدريب**.","الرخصة **إلزامية لمزاولة التعليم** منذ فبراير 2026 (تعديل 1446)، ويُعفى من بلغ الخمسين قبله.","الاجتياز بدرجة الرتبة في **الاختبارين معاً**، والدرجة لا تكفي وحدها بل مع **سنوات الخبرة**.","الصلاحية **خمس سنوات**؛ و[[الترقية|ar.l02.jobsmore]] برخصة سارية وأداء جيد جداً فأعلى وسنوات الرتبة (6 بكالوريوس، 5 ماجستير، 4 دكتوراه).","المعيّن ابتداءً **تحت التجربة سنتين**."],"t":[["الرخصة المهنية","وثيقة تصدرها هيئة تقويم التعليم والتدريب تؤهل حاملها لمزاولة التعليم برتبة ومدة محددتين."],["المعايير المهنية","ما يجب على شاغلي الوظائف التعليمية معرفته وممارسته وفق قيم المهنة ومسؤولياتها."],["معلم ممارس","الرتبة التي يبدأ بها حامل البكالوريوس بعد اجتياز الاختبار بـ50 فأعلى."],["معلم خبير","أعلى رتب المعلمين وتتطلب 80 فأعلى في الاختبارين وسنوات رتبة متقدم."],["النصاب التعليمي","مجموع الحصص الصفية الأسبوعية الواجبة على شاغل الوظيفة التعليمية."],["مدة التجربة","سنتان للمعيّن ابتداءً يُقوَّم خلالها مرة على الأقل."],["هيئة تقويم التعليم والتدريب","الجهة المسؤولة عن المعايير المهنية والاختبارات وإصدار الرخص."],["الفاقد التعليمي","خسارة النظام التعليمي الناتجة عن رسوب الطلاب أو تسربهم من المدرسة."],["مؤشر الأداء","دليل قابل للملاحظة والقياس يبيّن مدى تحقق المعيار في ممارسة المعلم."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Five Teacher Ranks","الرتب الخمس: الاجتياز والنصاب"],"groups":[{"n":"مساعد معلم","ar":"ثانوية ودبلوم لا يقل عن سنة.","d":"ar.l02.jobsreg"},{"n":"معلم","ar":"مؤهل **دون الجامعي** · نصاب **24** حصة.","d":"ar.l02.jobsreg"},{"n":"معلم ممارس","ar":"اجتياز **50** · نصاب **24** حصة؛ ويبدأ به التعيين الجامعي.","d":"ar.l02.license"},{"n":"معلم متقدم","ar":"اجتياز **70** · نصاب **22** حصة.","d":"ar.l02.license"},{"n":"معلم خبير","ar":"اجتياز **80** · نصاب **18** حصة.","d":"ar.l02.license"}]}},{"h":"لائحة السلوك والمواظبة ومواقف الالتزام بالأنظمة","pts":["ضرب طالب لزميله: **إشعار ولي الأمر** وتعهد خطي ونقل لفصل آخر، لا عقابه أمام زملائه.","طالب يدخن خارج السور: [[**إبلاغ المرشد الطلابي ومدير المدرسة**|ar.l02.committee]]، لا التجاهل ولا التوبيخ العلني.","جهة خارجية تطلب معلومات طالب: [[**التحدث مع إدارة المدرسة واتباع تعليماتها**|ar.l01.privacy]]، لا إرسال السجلات.","ولي أمر يريد أخذ ابنه أثناء الحصة: يُحال إلى **إدارة المدرسة**، فالاستئذان إجراء إداري.","قواعد ضبط الصف مع الطلاب **متسقة مع قواعد الانضباط التي أقرتها الوزارة**، ودليل [[القواعد|ar.l02.behavior]] يُسلَّم لولي الأمر ويوقّع بالعلم."],"t":[["لائحة السلوك والمواظبة","القواعد المنظمة لسلوك الطلاب وحضورهم ودرجات السلوك والإجراءات التصحيحية."],["العقد السلوكي","اتفاق موقّع بين المدرسة والطالب وولي أمره على سلوك محدد وتبعاته."],["لجنة التوجيه والإرشاد","اللجنة المدرسية المختصة بدراسة المشكلات السلوكية واتخاذ الإجراءات، واسمها في قواعد 1447 لجنة التوجيه الطلابي."],["المرشد الطلابي","المختص بمتابعة الحالات السلوكية والنفسية وتُحال إليه المخالفات المتكررة، ويسمى في قواعد 1447 الموجه الطلابي."],["الدليل التنظيمي","وثيقة الوزارة التي تحدد الإجراءات والصلاحيات المدرسية."]],"cmp":{"title":"ما تغيّر في قواعد السلوك والمواظبة 1447 (الإصدار الخامس)","cols":["الإصدارات السابقة","قواعد 1447"],"rows":[{"k":"اسم اللجنة","a":"لجنة التوجيه والإرشاد","b":"لجنة التوجيه الطلابي","tag":"تغيّر"},{"k":"المختص بدراسة الحالة","a":"المرشد الطلابي","b":"الموجه الطلابي، ولا يشارك في رصد الدرجات ولا تنفيذ الإجراءات","tag":"تغيّر"},{"k":"النطاق خارج السور","a":"الطرقات المحيطة لطلاب المتوسطة والثانوية","b":"حدود المدرسة (الشوارع المحاذية) لجميع الطلاب إذا رصدها منسوبو المدرسة أو كاميراتها، والتعليم الإلكتروني والحافلات والأنشطة","tag":"تغيّر"},{"k":"درجة السلوك","a":"—","b":"100: إيجابي 80 تُحسم منه، ومتميز 20 تُكتسب، مع فرص تعويض","tag":"أُضيف"}]}},{"h":"قواعد السلوك والمواظبة 1447 (الإصدار الخامس): الدرجات والمواظبة","pts":["[[الإصدار الخامس|ar.l02.grades]] (1447هـ) ألغى ما سبقه: **درجة السلوك 100** = 80 للسلوك الإيجابي تُحسم، و20 للسلوك المتميز تُكتسب.","**درجات الحسم**: الأولى 1، الثانية 2، الثالثة 3، الرابعة 10، الخامسة 15؛ مع فرص تعويض لا تعفي من الإجراءات.","**التدرج**: الإجراء التالي عند تكرار المشكلة نفسها؛ وتعدد المشكلات معاً ← إجراءات الأعلى درجة.","**المواظبة 100 درجة** من الثالث الابتدائي: درجة عن كل يوم غياب بدون عذر، وتجاوز 10% يحرم من الانتقال.","العذر خلال **ثلاثة أيام عمل**، ويُشعَر ولي الأمر بالغياب في اليوم نفسه."],"t":[["السلوك المتميز","سلوك يعكس الممارسات المتسقة مع القيم الإسلامية والهوية الوطنية، وله 20 درجة من درجة السلوك."],["فرص التعويض","ممارسات يؤديها الطالب المخالف لاسترداد الدرجات المحسومة من السلوك الإيجابي."],["لجنة التوجيه الطلابي","اللجنة المدرسية التي تدرس المشكلات السلوكية والحالات عالية الخطورة وترفع توصياتها للمدير."],["الموجه الطلابي","المختص بدراسة حالات الطلبة وعلاجها، ولا يشارك في رصد الدرجات أو حسمها."]]}],"trap":["سن القبول **ست سنوات** عند بداية العام الدراسي بتاريخ الميلاد (إعلان 1448)، والقبول المبكر لمن يصغر بنحو 90 يوماً **مشروط بسنة في رياض الأطفال**؛ و«ست سنوات هجرية» قاعدة قديمة.","سياسة التعليم **1390هـ** · الميثاق **1427هـ** · اللائحة **1440هـ** (نافذة 1441هـ) · الجرائم المعلوماتية **1428هـ**.","الرخصة يصدرها **هيئة تقويم التعليم والتدريب**، لا وزارة التعليم.","الدرجات 50/70/80 مطلوبة في **كلا الاختبارين**، ولا تُوزَن بينهما.","«تعزيز مكانة المعلم» و«تعزيز انتمائه لمهنته» = أهداف **الميثاق**، وليست أهداف سياسة التعليم.","اللجنة العليا لسياسة التعليم تُقر **الخطة** ولا تُعد المعلمين ولا تبني المقررات.","الخلاف بين معلمين: مرجعه **الميثاق السعودي** لا المواثيق العالمية ولا حكم المدير.","التدخين خارج السور: **المرشد والمدير** معاً؛ «التجاهل لأنه خارج المدرسة» فخ لأن اللائحة تشمل محيط المدرسة.","طلب جهة خارجية معلومات: **الإدارة أولاً**؛ إذن الطالب وحده لا يكفي.","الاطلاع على تقويم الأداء **حق**؛ حضور الاجتماعات والنشاط **واجب**.","الرتب خمس تبدأ بـ**مساعد معلم** وتنتهي بـ**خبير**؛ «معلم» رتبة لحامل المؤهل دون الجامعي.","ضبط الصف باتفاق مع الطلاب شيء جميل لكنه يجب أن يتسق مع **قواعد الوزارة** لا مع معلمي المدرسة الآخرين.","نظام التعليم العام **منشور لا نافذ**: يُعمل به **بعد 180 يوماً من نشره** (1448/2/10)، لا من تاريخ المرسوم ولا قرار مجلس الوزراء؛ والمجلس وحده يعمل **من تاريخ النشر**.","سياسة التعليم **أُلغيت بقرار مجلس الوزراء 103**، لكن أحكامها **سارية حتى يصدر البديل خلال سنة من نفاذ النظام**؛ «أُلغيت فوراً» خطأ.","الإلزام **من 6 إلى 15** (المادة 4)، والتعليم العام **حتى نهاية الصف 12** (المادة 1)، والطفولة المبكرة **حتى نهاية الصف الثالث**؛ لا تخلط الحدود الثلاثة.","سن القبول في النظام يحدده **المجلس** (المادة 8/2) لا الوزارة؛ ورئيس المجلس **وزير التعليم**.","شهادة النجاح تُسلَّم **دون قيد أو شرط** (المادة 38/1/ز)، وواجب القدوة **داخل المدرسة وخارجها** (المادة 49/3).","الإبلاغ عن الإيذاء واجب **إدارة المؤسسة** إلى **الجهة المختصة**، ويشمل **محيط المدرسة** و**المنسوبين** لا الطلاب فقط (المادة 65).","مُهل النظام: الترخيص **30 يوماً** (م32)، التظلم من الجزاء **60 يوماً** (م63)، النفاذ **180 يوماً** (م68)."],"vid":[["uoQ4uFMXHAg","شرح المجال الأول: القيم والمسؤوليات المهنية 3","سهام الزهراني",34],["-8jrL3Z4yjw","حل أسئلة المعيار الأول","سهام الزهراني",32],["QwM81gxnLak","شرح المجال الأول: القيم والمسؤوليات المهنية (الجزء الثاني)","سهام الزهراني",36],["nZ_a_uuGpGU","شرح مختصر للوائح التعليمية","سهام الزهراني",27],["fDefgVgKliE","ميثاق أخلاقيات مهنة التعليم","سلوى البحيري",28],["dWG7q59sM80","شرح المعيار الأول","د. منصور البلادي",67]],"_law1448":true,"n":2},{"id":"L03","d":"V","std":"2","sub":"2.1، 2.2","ar":"التطوير المهني المستمر والبحث الإجرائي","goal":"تبني خطة تطوير مهني في ضوء المعايير انطلاقاً من التأمل وتقويم الزملاء، وتميّز أساليب النمو المهني وأدوات التأمل، وتعرف خطوات البحث الإجرائي وخصائصه كما تَرِد في الاختبار.","sec":[{"h":"مفهوم التطوير المهني وخطته","pts":["خطة التطوير تُبنى **في ضوء المعايير المهنية**: رصد الممارسة ← مقارنتها بالمعيار ← تحديد الفجوة ← أهداف التحسين.","الاحتياجات تُعرف بـ[[**التأمل الذاتي وتقويم الزملاء والخبراء**|ar.l03.reflect]] وآراء الطلاب (الاحتياجات التدريبية).","التطوير يُعامَل **كعمليات مستمرة لا كنتائج**، وليس من أهدافه تطوير البيئة المادية للصف.","النمو المهني **واجب أساس**؛ ودورة أثناء الخدمة: **يدرس مدى مناسبتها له** قبل التقدم.","دورة في التخطيط وإدارة الصف = تطوير **المهارات المهنية**؛ وتدني نتائج صفه: يتحمل المسؤولية كاملة ويرفع مستواهم."],"t":[["التنمية المهنية","كل عمل مخطط يقوم به المعلم لتعديل وتطوير معارفه ومهاراته وقيمه المهنية."],["التدريب المهني","إكساب المعلم مهارات التدريس اللازمة لرفع كفاءته."],["التربية المهنية","تعديل أفكار المعلم ومعتقداته وترسيخ القيم المهنية لديه."],["المساندة المهنية","توفير الاستقرار الوظيفي والمناخ المادي والنفسي المناسب."],["الاحتياج التدريبي","الفجوة بين الأداء الحالي والأداء المطلوب وفق المعايير المهنية."],["التعلم مدى الحياة","استمرار المعلم في التعلم والتطور طوال مسيرته المهنية."]],"map":{"type":"fan","title":["Elements of Professional Development","عناصر التنمية المهنية"],"groups":[{"n":"التدريب المهني","ar":"إكساب المعلم **مهارات** التدريس اللازمة لرفع كفاءته.","d":"ar.l03.pd"},{"n":"المساندة المهنية","ar":"توفير **الاستقرار الوظيفي** والمناخ المادي والنفسي المناسب وتحسين بيئة العمل.","d":"ar.l03.pd"},{"n":"التربية المهنية","ar":"تعديل **أفكار المعلم ومعتقداته** وترسيخ القيم المهنية لديه.","d":"ar.l03.pd"}]}}],"trap":[],"vid":[["lfIY9VaExkU","شرح المجال الأول: شرح التطوير المهني للمعلمين 5","سهام الزهراني",35],["muq6eiH9a4Q","أسئلة تطبيقية على معيار الثاني من معايير الرخصة المهنية التطوير المهني المستمر","سهام الزهراني",38],["BfhKUwGzi8I","التنمية المهنية","سلوى البحيري",32],["tAkMiU4n-hg","البحث الإجرائي","سلوى البحيري",9],["DkIDi1eBrwQ","البحث الإجرائي في الرخصة المهنية","منصة البراعة",5],["MX3GgO3V6m4","المحاضرة الثالثة: المجال الأول، البحث الإجرائي ومجتمعات التعلم المهنية","منصة نبراس",41]],"n":3,"locked":true},{"id":"L04","d":"V","std":"3","sub":"3.1–3.3","ar":"التفاعل مع مجتمعات التعلم وأولياء الأمور والمجتمع","goal":"تعرف مبادئ مجتمعات التعلم المهنية وأوعيتها، وتختار في كل موقف مع ولي أمر أو المجتمع المحلي الخطوة الأولى والأنسب كما يحددها مفتاح الهيئة.","sec":[{"h":"مجتمعات التعلم المهنية","pts":["[[**مجتمع التعلم المهني**|ar.l04.plc]]: مهنيون في المدرسة يعملون بشكل مخطط، وهدفه **تفعيل تعاون المعلمين لتحسين تعلم الطلاب**.","مبادئه: تشارك الرؤية والقيم والأهداف، تبني ثقافة التعاون، التركيز على تعلم الطلاب، التركيز على النتائج.","المفهوم الخاطئ: أنه **يُعنى بالجوانب النظرية**؛ و[[أوعيته|ar.l04.plcforms]] منها البحوث الإجرائية والتوأمة المهنية والتدريب بالأقران.","يُشكَّل حسب **الصفوف التي يدرسونها**، ويحلل النتائج بأسئلة عن الأسئلة والفصول، لا عمّن حصل على أعلى الدرجات.","اجتماع معلمي صف لمساعدة الضعاف = **تقديم تعليم مناسب لجميع أنواع ومستويات الطلاب**.","الخلاف مع الزملاء ← **اقتراح مبادرات جماعية للعمل كفريق**، والنقد ← الصبر؛ وللمستجدين البيئة الداعمة والإسناد."],"t":[["مجتمع التعلم المهني","مجموعة من المهنيين يعملون بتعاون مخطط لتحسين تعلم الطلاب وأداء بعضهم."],["ثقافة التعاون","عمل المعلمين بشكل تبادلي للتأثير في ممارساتهم الصفية وتحمل المسؤولية المشتركة."],["التوأمة المهنية","شراكة بين معلمين أو مدرستين لتبادل الخبرات والممارسات."],["التدريب بالأقران","معلم يدرب زميله على مهارة ويتابعه داخل الصف."],["الشبكات المهنية","روابط معلمين متميزين في مهارة ينسق المشرف عملهم لدعم أقرانهم."],["المدرسة المتعلمة","مدرسة تتعلم كمؤسسة ويطور منتسبوها ممارساتهم باستمرار."],["التركيز على النتائج","الحكم على نجاح التنمية المهنية بما يتعلمه الطلاب ويستطيعون فعله."]],"intro":[]},{"h":"التفاعل مع أولياء الأمور","pts":["ولي الأمر الغاضب: [[**الإنصات أولاً**|ar.l04.angry]] ثم العرض؛ والغاضب من مستوى ابنه: مواجهته بهدوء ومنطق ومحايدة.","مناقشة التقدم: [[**عقد اجتماع لمناقشة الأهداف المشتركة**|ar.l04.parentcomm]]، لا الملاحظات المكتوبة ولا دفتر المتابعة.","صعوبات التعلم: **طلب موعد اجتماع مع مختص صعوبات التعلم**؛ وشكوى التنمر: [[استماع ثم متابعة مع المرشد الطلابي|ar.l02.rifq]].","التقارير هدفها **توضيح مستوى الطالب وتقدمه** بلغة بسيطة وموجزة؛ والسؤال الحاكم: ماذا أريد من ولي الأمر أن يعرف؟","نتائج صف كامل متدنية ← [[مجالس أولياء الأمور|ar.l04.family]]؛ ووالد الطالب المخالف ← **تزويده بلائحة القواعد السلوكية لتدريب ابنه في المنزل**.","الاجتماعات الدورية لا تعني **إشراك أولياء الأمور في تقويم المعلمين**؛ ومخاطبة المدير تكون بـ[[خطاب إداري|ar.l04.parenttools]] رسمي."],"t":[["الإنصات الفعّال","منح ولي الأمر فرصة التعبير والفهم قبل الرد أو التبرير."],["اجتماع الأهداف المشتركة","لقاء مع أولياء الأمور للاتفاق على أهداف تعلم الطالب ومتابعتها."],["مجلس أولياء الأمور","هيئة جماعية تضم أولياء الأمور والمعلمين لبحث قضايا الطلاب."],["مجلس المدرسة","مجلس يضم الإدارة والمعلمين وممثلي أولياء الأمور للمشاركة في القرار."],["دفتر التواصل","أداة يومية لتبادل الملاحظات بين المعلم والأسرة."],["ClassDojo","تطبيق لإدارة الصف وإطلاع أولياء الأمور على سلوك الطالب وتقدمه."],["Remind","تطبيق للتواصل مع الطلاب وأولياء الأمور وإرسال الواجبات دون رقم جوال."],["اليوم المفتوح","فعالية تستقبل فيها المدرسة الأسر لتوطيد العلاقة."],["الخطاب الإداري","كتابة وظيفية رسمية لمخاطبة المدير أو الجهات الرسمية بطلب أو إفادة."]],"ex":[]},{"h":"التفاعل مع المجتمع المحلي","pts":["[[**الشراكة المجتمعية**|ar.l04.partnership]]: إسهام الأسر والمؤسسات بالفكر والمشورة والموارد في علاقة **تبادلية**، وتنميتها هدف في رؤية 2030.","**مقومات الشراكة**: احترام متبادل وتقدير جهود المعلمين ومسؤولية مشتركة بين المدرسة والأسرة والقطاعين والجامعات.","الأنشطة غير الصفية **اختيارية** ولا تُقصر على داخل المدرسة، وأعمال الطلاب المعروضة من عملهم هم.","تنظيف الحديقة والمسجد المجاورين: **تكليف الطلاب بتقرير عما عملوه وتقييمهم**، لا الانصراف المبكر.","مشاركة المعلم في فعاليات الحي **تكسبه خبرات تدعم تعلم طلابه وتفاعلهم مع المجتمع**؛ وهو في الميثاق عضو مؤثر في مجتمعه."],"t":[["الشراكة المجتمعية","إسهام أولياء الأمور ومؤسسات المجتمع بالفكر والموارد في تطوير التعليم بعلاقة تبادلية."],["المشاركة المجتمعية","الجهود التطوعية للأفراد والمؤسسات في تخطيط العملية التعليمية وتنفيذها وتقييمها."],["المجتمع المحيط بالمدرسة","الجهات والأفراد حول المدرسة القادرون على دعمها مادياً أو عينياً أو بشرياً."],["الأنشطة غير الصفية","أنشطة اختيارية خارج الحصص تثري المنهج وتنمي المهارات والقيم."],["المسؤولية الاجتماعية","التزام المؤسسات والأفراد بالإسهام في خدمة المجتمع والتعليم."],["العمل التطوعي","مشاركة المعلم والطلاب في خدمة المجتمع دون مقابل."]]},{"h":"معوقات التواصل مع أولياء الأمور وحلولها","pts":["مؤشر الممارس 3.2: **يستخلص أبرز معوقات التواصل مع أولياء الأمور** ويشارك في اللقاءات التي تستهدف التغلب عليها.","قواعد 1447: من **دور الأسرة** حضور الاجتماعات والتواصل الفوري عند الغياب، ولجنة التوجيه الطلابي تعقد مجلس أولياء الأمور.","ولي أمر لا يستجيب: **يُحلَّل السبب أولاً** (وقت؟ لغة؟ تجربة سابقة؟) ثم يُختار الحل، لا تكرار الاستدعاء."],"t":[["معوقات التواصل","عوامل من جهة الأسرة أو المدرسة تمنع وصول الرسالة أو استجابة ولي الأمر."],["تنويع قنوات التواصل","استخدام رسائل ومنصات معتمدة واتصال ولقاءات حضورية وافتراضية بمواعيد مرنة لتجاوز معوقات التواصل."]],"map":{"type":"fan","title":["Barriers to Parent Communication","معوقات التواصل وحلولها"],"groups":[{"n":"من جهة الأسرة","ar":"انشغال وضيق وقت، تجربة سلبية سابقة، حرج من مستوى الابن، ضعف القراءة أو اختلاف اللغة، و«التعليم مسؤولية المدرسة وحدها»."},{"n":"من جهة المدرسة","ar":"استدعاء عند المشكلات فقط، تقارير مليئة بالمصطلحات، مواعيد غير مناسبة، أسلوب لوم أو استعلاء، قناة واحدة."},{"n":"الحلول","ar":"**تنويع القنوات**، مرونة المواعيد، رسائل إيجابية دورية، لغة بسيطة، الإنصات قبل العرض، وإشراك الأسرة في الأنشطة.","d":"ar.l04.parenttools"}]}},{"h":"توظيف القضايا المحلية في التدريس","pts":["مؤشر 3.3: [[**يتقصى القضايا المحلية ويوظفها في التدريس بصورة تعزز وظيفة المعرفة**|ar.l04.local]]، أي يستعمل الطالب ما تعلمه لفهم مشكلة في بيئته.","**التقصي** من الأخبار والإحصاءات الرسمية والأسر والمؤسسات، و**التوظيف** يربط القضية بهدف الدرس (بيانات في الرياضيات، تجربة في العلوم).","الضوابط: مناسبة للعمر، بلا تشهير بأشخاص أو جهات، ولا تتحول الحصة إلى موعظة؛ والأثر تعلم ذو معنى ومسؤولية مجتمعية."],"t":[["القضية المحلية","مشكلة أو ظاهرة في بيئة الطالب يمكن دراستها واقتراح حلول لها."],["وظيفة المعرفة","استخدام ما يتعلمه الطالب في فهم الواقع وحل مشكلاته لا مجرد حفظه."]],"intro":[]}],"trap":["ولي الأمر الغاضب: **الإنصات أولاً**؛ شرح وجهة نظرك ومراجعة اللوائح خطوات **لاحقة** صحيحة في توقيت خاطئ.","مناقشة التقدم مع أولياء الأمور = **اجتماع أهداف مشتركة**؛ التوقيع على التقارير ودفتر المتابعة إجراءات شكلية.","سؤال عن صعوبات التعلم ← **موعد مع المختص**، لا تشخيص من المعلم ولا توصيات عامة.","ولي أمر غاضب من المستوى ← **هدوء ومنطق**؛ غاضب يريد ابنه في الحصة ← **الإدارة**؛ يشكو تنمراً ← **استماع ثم المرشد**.","التقارير تهدف إلى **توضيح مستوى الطالب** لا إبراز جهود المعلم (بديل يركز على المعلم).","مجتمعات التعلم **عملية** لا نظرية؛ وهدفها تعاون **المعلمين** لتحسين تعلم **الطلاب** (لا تعاون الطلاب ولا الإدارة).","التشكيل حسب **الصفوف/التخصص** لا حسب الأعمار أو الخبرة أو أعداد الطلاب.","تحليل النتائج في مجتمع التعلم يسأل عن **الأسئلة والفصول** لا عن **الأفراد المتفوقين**.","الأنشطة غير الصفية **اختيارية**؛ «إلزامية» أو «موحدة للجميع» أو «داخل المدرسة فقط» تناقض فلسفتها.","تنظيف المسجد والحديقة ← **تقرير وتقييم**؛ المكافأة بالانصراف المبكر تعزيز في غير محله.","النزاع مع الزملاء ← **مبادرات جماعية**، لا تبليغ الإدارة ولا التعامل الرسمي البارد.","مزايا اجتماعات أولياء الأمور لا تشمل **تقويم المعلمين**؛ تقويم المعلم من صلاحية الإشراف والإدارة."],"vid":[["lWqaJZ_d8g0","الرخصة المهنية 6: شرح التفاعل المهني مع التربويين والمجتمع المحلي","سهام الزهراني",35],["rkRSfwoqTA8","شرح الأسئلة التطبيقية على المعيار الثالث الرخصة المهنية","سهام الزهراني",40],["xh7elsIxQdk","مجتمعات التعلم المهنية","سلوى البحيري",7],["MX3GgO3V6m4","المحاضرة الثالثة: المجال الأول، البحث الإجرائي ومجتمعات التعلم المهنية","منصة نبراس",41],["uoQ4uFMXHAg","شرح المجال الأول: القيم والمسؤوليات المهنية (الجزء الثالث)","سهام الزهراني",34],["lfIY9VaExkU","شرح التطوير المهني للمعلمين","سهام الزهراني",35]],"n":4}];
window.QB = [["L02","m","ارتفعت نسبة الرسوب والتسرب في إحدى المدارس، فوصف المشرف ذلك بأنه خسارة للنظام التعليمي. المصطلح الذي يصف هذه الخسارة:",["الفاقد التعليمي","الهدر الإداري","التأخر الدراسي","الفجوة المعرفية"],"الفاقد التعليمي هو ما يخسره النظام بسبب الرسوب والتسرب وله آثار اجتماعية واقتصادية. التأخر الدراسي حالة طالب لا نظام."],["L02","","وثيقة توضح الدليل القابل للملاحظة والقياس على مدى تحقق معيار من المعايير المهنية في ممارسة المعلم. هذا الدليل يسمى:",["مؤشر الأداء","الهدف السلوكي","الكفاية","الرتبة المهنية"],"المعيار عبارة عامة عمّا يجب أن يعرفه المعلم ويؤديه، والمؤشر دليل قابل للقياس على تحققه. الهدف السلوكي يخص تعلم الطالب."],["L02","m","احتاج معلم إلى التغيب يوماً واحداً لظرف طارئ لا يمكن تأجيله. نوع الإجازة النظامية الأنسب:",["إجازة اضطرارية","إجازة مرضية","إجازة صيفية","إجازة استثنائية"],"الإجازة الاضطرارية تُمنح للظروف الطارئة بحد لا يتجاوز خمسة أيام في السنة. المرضية تتطلب تقريراً طبياً، والاستثنائية بلا راتب لظروف خاصة طويلة."],["L04","h","أراد معلم مخاطبة مدير المدرسة بطلب تجهيز معمل العلوم. الصيغة الأنسب:",["خطاب إداري رسمي","رسالة ودية","حديث شفهي في الممر","رسالة نصية عبر الجوال"],"مخاطبة الإدارة والجهات الرسمية تكون بخطاب إداري بعناصره الرسمية ليُوثق ويُتابع. الأساليب الودية والشفهية لا تناسب الطلب الرسمي."],["L04","m","تطبيق يخصص مساحة افتراضية لمشاركة الملفات والنقاش بين المعلم والطلاب وأولياء الأمور. التطبيق الذي يحقق ذلك:",["School Circle","Excel","Access","Canva"],"School Circle منصة تواصل وتشارك ملفات بين أطراف العملية التعليمية. إكسل للجداول، وأكسس لقواعد البيانات، وكانفا للتصميم."],["L07","h","طفل في الثانية يرمي الأشياء من مكانها ويراقب سقوطها مراراً. هذا السلوك يدل على:",["الاستكشاف","العدوان","فرط الحركة","الإحيائية"],"رمي الأشياء وتجريبها في الطفولة المبكرة استكشاف نمائي طبيعي لخصائص الأشياء. العدوان مقصود للإيذاء، وفرط الحركة اضطراب، والإحيائية إسناد الحياة للجماد."],["L07","m","أي العبارات الآتية صحيحة عن العلاقة بين النضج والتعلم؟",["النضج شرط للتعلم وليس التعلم شرطاً للنضج","التعلم شرط للنضج","كلاهما إرادي ويتأثر بالتدريب","لا علاقة بينهما"],"النضج تغيرات داخلية لا إرادية لا يسرّعها التدريب، وهو شرط لحدوث التعلم (لا يتعلم الطفل الكتابة قبل نضج عضلاته)، أما التعلم فيحتاج خبرة وممارسة."],["L07","","من خصائص النمو أنه تراكمي، ويقصد بذلك أن:",["كل مرحلة تبني على ما سبقها وتمهد لما بعدها","سرعته ثابتة في جميع المراحل","يحدث في جميع الجوانب بالدرجة نفسها","لا تتدخل فيه الوراثة"],"التراكمية والتتابع تعنيان أن المراحل مترابطة. النمو متغير السرعة ومختلف بين الجوانب وينتج عن تفاعل الوراثة والبيئة."],["L07","m","زيادة طول الطالب ووزنه خلال العام تمثل نمواً:",["تكوينياً","وظيفياً","انفعالياً","اجتماعياً"],"النمو التكويني (البنائي) زيادة في الحجم والشكل، أما الوظيفي فتحسن في أداء الأعضاء والقدرات."],["L07","","ظهور أحلام اليقظة بكثرة وتكوّن الاستقلال والانتماء القوي للأصدقاء من خصائص طلاب المرحلة:",["المتوسطة","الابتدائية الدنيا","الابتدائية العليا","الروضة"],"أحلام اليقظة والاستقلال والانتماء للرفاق سمات المراهقة المبكرة (المتوسطة). الابتدائية تتسم بحب الاستطلاع والتطبيع الاجتماعي."],["L07","m","طالب في الصف الخامس يُنجز مهامه ويحصل على تشجيع فتنمو لديه الثقة في قدرته على الإنجاز. وفق إريكسون يمر بأزمة:",["الكفاية (الاجتهاد) مقابل النقص","الهوية مقابل تشتت الهوية","المبادرة مقابل الذنب","الاستقلال مقابل الخجل"],"سن المدرسة الابتدائية (6–12) أزمتها الاجتهاد/الكفاية مقابل الدونية/النقص. الهوية للمراهقة، والمبادرة لمرحلة الروضة، والاستقلال للطفولة المبكرة."],["L08","","قاس معلم الزمن بين عرض المثير وبداية استجابة كل طالب له فوجد تفاوتاً بينهم. ما قاسه المعلم يسمى:",["زمن الرجع","الاستعداد","الاتجاه","الميل"],"زمن الرجع هو الفترة بين المثير وبدء الاستجابة وهو من الفروق الفردية القابلة للقياس. الاستعداد قدرة كامنة، والاتجاه والميل وجدانيان."],["L08","m","طالب نسبة ذكائه دون 70 مع قصور واضح في مهارات العناية بالذات والتواصل ظهر قبل سن 18. الفئة الأقرب:",["الإعاقة العقلية","صعوبات التعلم","بطء التعلم","التأخر الدراسي"],"الإعاقة الفكرية (العقلية) تجمع انخفاض الذكاء (دون 70) وقصور السلوك التكيفي قبل سن 18. أما بطء التعلم فذكاء حدي (70–85)، وصعوبات التعلم مع ذكاء عادي، والتأخر الدراسي تدنٍّ في التحصيل مع ذكاء عادي غالباً لأسباب خارجية كالغياب وضعف الدافعية والظروف الأسرية."],["L08","","صعوبات التعلم الناتجة عن خلل في العمليات النفسية الأساسية نفسها لا عن سوء التعليم أو الحرمان البيئي تسمى صعوبات:",["أولية","ثانوية","أكاديمية","مؤقتة"],"الصعوبات الأولية تعود إلى اضطراب داخلي في العمليات النفسية الأساسية نفسها (الانتباه والإدراك والذاكرة)، والثانوية (التفكير واللغة الشفهية) تنشأ عنها وفق تصنيف كيرك وكالفانت. أما التدني الناتج عن سوء التعليم أو الحرمان البيئي فمستبعد أصلاً من صعوبات التعلم (محك الاستبعاد)، والأكاديمية تخص القراءة والكتابة والحساب."],["L08","m","أراد معلم الكشف الأولي عن احتمال وجود صعوبات تعلم لدى طالب بتقدير سلوكه في الفهم والذاكرة والانتباه. الأداة الأنسب:",["مقياس مايكل بست للتقدير السلوكي","اختبار ستانفورد بينيه","اختبار الاستعداد المهني","مقياس ليكرت للاتجاهات"],"مايكل بست مقياس تقدير سلوكي يملؤه المعلم للكشف الأولي عن صعوبات التعلم. ستانفورد بينيه للذكاء، وليكرت للاتجاهات."],["L08","m","يرى جانييه أن الفرق بين الموهبة والتفوق هو أن:",["الموهبة قدرة طبيعية والتفوق أداء مكتسب ينمى بالبيئة","الموهبة أداء مكتسب والتفوق قدرة فطرية","الموهبة والتفوق مترادفان","التفوق يُقاس بالذكاء والموهبة بالتحصيل"],"نموذج جانييه: الموهبة استعداد فطري غير مدرَّب، والتفوق أداء متميز في مجال نتيجة التدريب؛ ولذلك كل متفوق موهوب وليس كل موهوب متفوقاً."],["L08","h","من سمات الطالب الموهوب التي قد يخطئ المعلم في تفسيرها:",["حس الدعابة والكمالية المبالغ فيها","ضعف المفردات اللغوية","قلة الأسئلة والفضول","الاعتماد الكلي على المعلم"],"الموهوب يتميز بحس الدعابة والكمالية والفضول والنمو اللغوي المبكر، وقد يُفسر ملله أو سخريته خطأً على أنه سوء سلوك."],["L09","m","ثبّت معلم ارتباطاً بين الجرس والاصطفاف بتكرار الاقتران حتى صار الطلاب يصطفون عند سماعه. رائد النظرية التي ترى أن اقتراناً واحداً بين المثير والاستجابة يكفي لتكوين التعلم هو:",["جاثري","بافلوف","ثورندايك","سكنر"],"جاثري صاحب نظرية الاقتران الشرطي ومبدأ المرة الواحدة. بافلوف إشراط كلاسيكي بالتكرار، وثورندايك محاولة وخطأ، وسكنر إجرائي."],["L09","h","خاف طفل من النار بعد لسعة واحدة فصار يتجنبها. هذا يمثل في نظرية الاشتراط:",["قانون المرة الواحدة","قانون الأثر","التعميم","الاسترجاع التلقائي"],"تكوّن الارتباط من خبرة واحدة شديدة الأثر دون تكرار هو التعلم من المحاولة الواحدة (قانون المرة الواحدة) عند جثري في نظرية الاشتراط بالاقتران. قانون الأثر عند ثورندايك يقوّي الارتباط أو يضعفه تدريجياً عبر محاولات متكررة، والتعميم استجابة لمثيرات مشابهة لا للمثير نفسه، والاسترجاع التلقائي عودة استجابة منطفئة بعد فترة راحة."],["L09","m","يميز سكنر بين السلوك الإرادي الذي يصدر عن الكائن ويتأثر بنتائجه، والسلوك اللاإرادي الذي يستثيره مثير سابق. يسمى الأول والثاني على الترتيب:",["إجرائي، واستجابي","استجابي، وإجرائي","شرطي، وغير شرطي","كامن، وظاهر"],"السلوك الإجرائي إرادي تحكمه النتائج (التعزيز)، والاستجابي لا إرادي يستدعيه المثير (كما في بافلوف)."],["L09","","الاشتراط الإجرائي يسمى أيضاً الاشتراط:",["الوسيلي","الكلاسيكي","الاستجابي","البسيط"],"يسمى وسيلياً لأن الاستجابة وسيلة للحصول على المعزز. الكلاسيكي والبسيط والاستجابي أسماء لاشتراط بافلوف."],["L09","m","مؤسس مدرسة الجشطلت الذي وضع قوانين التنظيم الإدراكي (التقارب، التشابه، الإغلاق) هو:",["فرتهايمر","كوهلر","تولمان","أوزوبل"],"فرتهايمر مؤسس الجشطلت، وكوهلر صاحب تجربة القرد والعصا (الاستبصار)، وتولمان الخرائط المعرفية، وأوزوبل التعلم ذو المعنى."],["L09","","بدأ معلم الوحدة بأكثر الأفكار شمولاً ثم انتقل تدريجياً إلى التفاصيل الأقل شمولاً. هذا المبدأ عند أوزوبل يسمى:",["التمايز التقدمي","التوفيق التكاملي","المنهج الحلزوني","الاستبصار"],"التمايز التقدمي من العام إلى الخاص، والتوفيق التكاملي ربط الأفكار وإزالة التعارض، والحلزوني لبرونر، والاستبصار للجشطلت."],["L09","m","عندما يشبّه المعلم عقل المتعلم بالحاسوب الذي يستقبل مدخلات ويعالجها ثم يُخرجها، فإنه يستند إلى نموذج:",["معالجة المعلومات","الاشتراط الإجرائي","التعلم بالاستبصار","التعلم الاجتماعي"],"نموذج معالجة المعلومات (نورمان، أتكنسون وشفرن) يفسر التعلم بالانتباه والترميز والتخزين والاسترجاع كالحاسوب."],["L09","h","صاحب نظرية الترميز المزدوج التي ترى أن تخزين المعلومة لفظياً وبصرياً معاً أقوى من تخزينها بشكل واحد هو:",["بافيو","بياجيه","باندورا","برونر"],"بافيو صاحب الترميز المزدوج (لفظي وتصوري). بياجيه نمو معرفي، وباندورا تعلم اجتماعي، وبرونر تمثيلات ثلاث."],["L09","m","نصح معلم طلابه بمراجعة الدرس في جلسات قصيرة متباعدة بدل جلسة واحدة طويلة ليلة الاختبار. المبدأ الذي استند إليه:",["التدريب الموزع أفضل للاحتفاظ من المكثف","التدريب المكثف أفضل للاحتفاظ","التكرار الآلي يضمن الفهم","الحفظ يسبق الفهم دائماً"],"الممارسة الموزعة تعزز التخزين طويل المدى وتقلل التداخل، بخلاف الحشو المكثف الذي يُنسى سريعاً."],["L09","","يرى باندورا أن السلوك ينتج عن تفاعل مستمر بين الفرد والسلوك والبيئة. هذا المبدأ يسمى:",["الحتمية التبادلية","التعزيز البديل","الاستبصار","التمثل"],"الحتمية (التفاعل) التبادلية جوهر النظرية الاجتماعية المعرفية. التعزيز البديل مفهوم آخر لباندورا يخص ملاحظة نموذج يُعزَّز."],["L09","m","تجربة باندورا التي شاهد فيها الأطفال نموذجاً يضرب دمية ثم قلدوه تعرف بتجربة:",["دمية بوبو","القرد والعصا","الكلب والجرس","القط والصندوق"],"دمية بوبو تجربة باندورا في التعلم بالملاحظة. القرد لكوهلر، والكلب لبافلوف، والقط لثورندايك."],["L09","h","ظل طالب يجيب إجابات صحيحة دون أن يتلقى أي تعزيز من المعلم، فقلّت مشاركته تدريجياً. التفسير الأقرب:",["الانطفاء في الاشتراط الإجرائي","الاشتراط الكلاسيكي","التعميم","العقاب السالب"],"إيقاف التعزيز عن استجابة إرادية كانت تُعزَّز فتضعف تدريجياً هو الانطفاء في الاشتراط الإجرائي. الموقف ليس اشتراطاً كلاسيكياً لأن المشاركة سلوك إرادي تحكمه نتائجه لا مثير سابق، والتعميم استجابة لمثيرات مشابهة، والعقاب السالب سحب معزز قائم بعد السلوك لا الامتناع عن منحه."],["L09","m","شاهد طالب زميله يُكافأ على ترتيب أدواته فبدأ يرتب أدواته هو أيضاً. المفهوم:",["التعزيز البديل","التعزيز السالب","التشكيل","الانطفاء"],"التعزيز البديل عند باندورا: ملاحظة نموذج يُعزَّز يزيد احتمال تقليده. التعزيز السالب إزالة منفر عن الطالب نفسه."],["L10","m","يرى علماء النفس أن الدافعية توجّه السلوك نحو هدف محدد. هذه الخاصية تسمى:",["الغرضية","الاستمرارية","التنوع","التحسين"],"الغرضية خاصية التوجه نحو هدف. الاستمرار والتنوع والتحسين خصائص أخرى للدافعية لكنها لا تعني التوجه نحو هدف."],["L10","","من وظائف الدافعية في التعلم:",["توليد السلوك وتوجيهه وتحديد شدته واستمراره","تحديد مستوى ذكاء الطالب","تفسير الفروق الوراثية","قياس التحصيل الدراسي"],"الدافعية تولد السلوك وتوجهه وتحدد شدته وديمومته. الذكاء والوراثة والتحصيل مفاهيم أخرى."],["L10","m","الحاجة إلى الطعام والنوم دوافع بيولوجية، أما الحاجة إلى التقدير والإنجاز فدوافع:",["اجتماعية مكتسبة","بيولوجية","فسيولوجية","لا شعورية"],"الدوافع الاجتماعية تُكتسب من التفاعل مع البيئة كالانتماء والتقدير والإنجاز، بخلاف البيولوجية الفطرية كالجوع."],["L10","h","يُعرض هرم ماسلو أحياناً في صورة سباعية تضيف مستويين بين حاجات التقدير وتحقيق الذات، هما:",["المعرفية والجمالية","الأمن والانتماء","الفسيولوجية والأمن","الانتماء والتقدير"],"الهرم الخماسي المشهور: فسيولوجية ← أمن ← انتماء ← تقدير ← تحقيق الذات. وفي صورته السباعية (ماسلو 1970) يأتي بعد التقدير مستويان: الحاجات المعرفية (الفهم والاستطلاع) ثم الجمالية (التذوق والتناسق والنظام)، ثم تحقيق الذات. والبدائل الأخرى كلها مستويات تسبق التقدير أو تشمله."],["L10","","العالم الذي أكد أثر الوراثة في الذكاء وابتكر فكرة معامل الارتباط هو:",["جالتون","سبيرمان","جاردنر","ستيرنبرغ"],"جالتون رائد دراسة الوراثة والفروق ومعامل الارتباط. سبيرمان العامل العام، وجاردنر الذكاءات المتعددة، وستيرنبرغ الثلاثي."],["L10","m","اختبار ذكاء غير لفظي يعتمد على إكمال مصفوفات من الأشكال ويناسب من لا يجيد اللغة. هذا الاختبار:",["مصفوفات رافن","ستانفورد بينيه","وكسلر اللفظي","مقياس ليكرت"],"مصفوفات رافن المتتابعة اختبار غير لفظي يطلب إكمال النمط الناقص في مصفوفة أشكال، فيناسب من لا يجيد اللغة. ووكسلر اللفظي هو القسم اللفظي من مقياس وكسلر (وللمقياس قسم أدائي مستقل)، وستانفورد بينيه في صورته التقليدية يعتمد كثيراً على اللغة، وليكرت مقياس للاتجاهات لا للذكاء."],["L10","m","ربط طالب ملاحظاته عن ارتفاع الحرارة بمعلوماته السابقة ثم أصدر حكماً بأن المعادن تتمدد بالحرارة. العملية العقلية:",["الاستدلال","الحفظ","التذكر","التخيل"],"الاستدلال وصول إلى نتيجة بناءً على أدلة كافية مربوطة بالمعرفة السابقة. الحفظ والتذكر استرجاع، والتخيل تصور."],["L10","","توليد الطالب أفكاراً غير مألوفة من تلقاء نفسه دون تغيير في طبيعة الموقف يمثل:",["المرونة التلقائية","المرونة التكيفية","الطلاقة اللفظية","الإفاضة (التوسع)"],"المرونة التلقائية إنتاج أفكار متنوعة من تلقاء النفس دون أن يفرض الموقف تغيير الاتجاه، وهذا ما يميزها عن المرونة التكيفية التي يغيّر فيها الفرد وجهته الذهنية لأن المشكلة تتطلب ذلك. والطلاقة اللفظية كثرة الألفاظ، والإفاضة إضافة التفاصيل إلى الفكرة."],["L10","","وزّع معلم قوائم كلمات وطلب من الطلاب تمييز المترابط منها عن غير المترابط وتعليل ذلك. المهارة والاستراتيجية:",["التفكير الناقد بالكلمات المترابطة","التفكير الإبداعي بالإثارة العشوائية","ما وراء المعرفة بالتساؤل الذاتي","التفكير الجانبي بالقبعات"],"الكلمات المترابطة استراتيجية لتعليم التفكير الناقد (التمييز والتصنيف). الإثارة العشوائية إبداعية."],["L10","","القبعة التي يرتديها من يدير جلسة التفكير ويحدد تسلسلها ويتخذ القرار النهائي:",["الزرقاء","البيضاء","الحمراء","الخضراء"],"الزرقاء قبعة التنظيم والضبط واتخاذ القرار. البيضاء حقائق محايدة، والحمراء عاطفة، والخضراء ابتكار."],["L11","m","معلم يفوض طلابه مسؤولية تنظيم تعلمهم وتوزيع المهام بينهم ويكتفي بالمتابعة. يمثل دور المعلم:",["المفوّض","التقليدي","المرشد","الملقن"],"المعلم المفوّض يفوض المسؤولية للطلاب ويراقب. التقليدي والملقن ناقل للمعلومة، والمرشد يوجه ويرشد."],["L11","","دور المعلم الذي يركز على توجيه المتعلم إلى مصادر التعلم وطرقه هو دور المعلم:",["المرشد","المفوّض","التقليدي","الممتحن"],"المعلم المرشد يوجه المتعلم. المفوض يفوض المسؤولية، والتقليدي يلقن."],["L11","m","بدأ معلم اللغة درسه بتمهيد ثم عرض الأمثلة ثم ربطها بالقديم ثم استنتج القاعدة ثم طبّق عليها. الطريقة المتبعة:",["الاستدلالية (الهربارتية)","الاستنباطية","الحوارية","المشروع"],"خطوات هربارت الخمس: تمهيد، عرض، ربط، استنتاج، تطبيق تجمع الاستقراء والاستنباط. الاستنباطية تبدأ بالقاعدة، والحوارية أسئلة وأجوبة."],["L11","h","من مزايا الطريقة الاستقرائية أنها:",["تعوّد الطالب الاعتماد على نفسه في الوصول إلى القاعدة من الأمثلة","سريعة وتوفر الوقت","لا تحتاج جهداً من الطالب","تضمن عدم نسيان القاعدة لأنها تُعطى أولاً"],"الاستقراء يبدأ بالأمثلة ويصل منها الطالب إلى القاعدة بنفسه، فيكون إيجابياً وتثبت القاعدة أكثر. عيبه أنه يأخذ وقتاً أطول. السرعة وتقديم القاعدة أولاً من سمات الطريقة القياسية (الاستنباطية)، و«لا تحتاج جهداً من الطالب» عكس الاستقراء تماماً."],["L11","","طلب المشرف من المعلم توضيح الفرق بين «المدخل» و«النموذج» في التدريس. الإجابة الصحيحة أن النموذج:",["إطار نظري يصف خطوات التدريس وتُشتق منه الاستراتيجيات","مرادف لأسلوب المعلم الشخصي","الفلسفة العامة التي يستند إليها التدريس","أداة أو وسيلة تعليمية"],"النموذج تصور نظري لخطوات التدريس (جويس وويل)، والمدخل الفلسفة والمنطلقات، والأسلوب ما يميز المعلم شخصياً."],["L11","m","رتّب معلم المادة من السهل إلى الصعب ومن المحسوس إلى المجرد. المدخل المتبع:",["المنطقي","التاريخي","الديني","التكاملي"],"المدخل المنطقي يعتمد التدرج المنطقي للمادة. التاريخي يتتبع تطور الفكر عبر العصور، والتكاملي يربط المادة بغيرها."],["L11","","ربط معلم الرياضيات درس النسبة بدرس الزكاة في الفقه وبقراءة الخرائط في الجغرافيا. المدخل المتبع:",["التكاملي","المنطقي","الضبط","النشاط"],"المدخل التكاملي يربط المادة بالمواد الأخرى بعلاقات أفقية. المنطقي ترتيب داخل المادة، والضبط تحكم في السلوك، والنشاط فعل الطالب."],["L11","m","موقف يقول فيه الطالب: «لا أعرف الحل الآن لكن أريد الوصول إليه». هذا الموقف يمثل مشكلة تعليمية لأنه يحتوي على:",["مانع وهدف يؤدي بلوغه إلى تعلم","قاعدة جاهزة وأمثلة","معلومات محفوظة تُسترجع","تعزيز فوري"],"المشكلة موقف غامض فيه هدف يسعى إليه المتعلم ومانع يحول دونه ويتعلم أثناء تجاوزه."],["L11","","آخر مراحل تنفيذ المشروع التعليمي بعد الخطة والتنفيذ والتقويم هي:",["كتابة التقرير","اختيار المشروع","تشكيل المجموعات","جمع الأدوات"],"مراحل المشروع: خطة، تنفيذ، تقويم، ثم كتابة التقرير. اختيار المشروع وتشكيل المجموعات في البداية."],["L11","m","عرض معلم على طلابه موقفاً واقعياً مفصلاً لمدرسة تعاني من التنمر وطلب منهم تحليله واقتراح قرار للعلاج. الطريقة:",["دراسة الحالة","العرض العملي","المحاضرة","التعليم المبرمج"],"دراسة الحالة تحليل موقف واقعي أو خيالي واتخاذ قرار. العرض العملي أداء المعلم أمام الطلاب، والمبرمج خطوات صغيرة."],["L11","","صمم المعلم لكل طالب مهام وأنشطة خاصة به بحسب توجهه وميوله. النمط:",["التعليم التفريدي","التعليم الفردي","التعليم الجمعي","التدريس المباشر"],"التفريدي يخصص المهام لكل طالب. الفردي مهام موحدة فردياً، والجمعي للصف كله."],["L11","m","وقّع المعلم مع طالب اتفاقاً مكتوباً يتعهد فيه الطالب بإنجاز مهام محددة خلال أسبوعين وفق معايير مقابل تقدير. هذا يسمى:",["عقد التعلم","الحقيبة التعليمية","الموديول","الخطة العلاجية"],"عقد التعلم اتفاق مكتوب بين المعلم والطالب على مهام ومعايير ومكافأة. الحقيبة والموديول مواد تعلم ذاتي، والخطة العلاجية إجراء للمعلم."],["L11","","برنامج تعليمي علاجي يُصمم لطالب بعينه بعد تشخيص مستواه يسمى:",["التعلم الموصوف للفرد","التعلم التعاوني","التعليم المبرمج الخطي","التدريس المصغر"],"التعلم الموصوف للفرد برنامج فردي علاجي بعد التشخيص. التعاوني جماعي، والمبرمج عام للجميع، والمصغر لتدريب المعلمين."],["L11","m","أراد معلم الكيمياء تدريب طلابه على تجربة خطرة لا يمكن إجراؤها في المختبر المدرسي. نوع البرمجية الأنسب:",["برامج المحاكاة","برامج التدريب والممارسة","الألعاب التعليمية","برامج الاستقصاء"],"المحاكاة تمثل المواقف الخطرة أو المكلفة بأمان. التدريب والممارسة لتثبيت مهارة، والألعاب للتنافس، والاستقصاء للبحث."],["L11","h","التدريس التبادلي حوار حول نص مقروء يطبق أربع استراتيجيات على الترتيب:",["التنبؤ، توليد الأسئلة، التوضيح، التلخيص","التلخيص، التنبؤ، التوضيح، الأسئلة","القراءة، الحفظ، التسميع، التقويم","العصف، التصنيف، المقارنة، الحكم"],"استراتيجيات التدريس التبادلي (بالينسار وبراون): التنبؤ ثم توليد الأسئلة ثم التوضيح ثم التلخيص، وتنمي ما وراء المعرفة."],["L11","m","يرتبط نجاح طالب في مسابقة صفية بخسارة زميله، فلا يفوز إلا واحد. بيئة التعلم هنا:",["تنافسية","تعاونية","فردية","تشاركية"],"البيئة التنافسية يرتبط فيها الفوز بخسارة الآخر. التعاونية نجاح الجميع معاً، والفردية كل طالب مستقل."],["L11","","مراحل التعلم التعاوني في المجموعة على الترتيب:",["التعرف، بلورة معايير العمل، الإنتاجية، الإنهاء","الإنتاجية، التعرف، الإنهاء، بلورة معايير العمل","بلورة معايير العمل، الإنهاء، التعرف، الإنتاجية","الإنهاء، الإنتاجية، بلورة معايير العمل، التعرف"],"تبدأ المجموعة بالتعرف على المهمة ومعطياتها والمطلوب منها، ثم بلورة معايير العمل بتوزيع الأدوار والمسؤوليات، ثم الإنتاجية بالانخراط في العمل، ثم الإنهاء بعرض ما توصلت إليه. تحديد المهمة جزء من مرحلة التعرف وليس مرحلة مستقلة."],["L11","m","كلّف معلم الحاسب طالباً من الصف الثالث المتوسط بتدريس طلاب الصف الأول المتوسط مهارة أتقنها. نوع تدريس الأقران:",["عبر الصفوف","داخل الفصل","خارج الفصل للمنقطعين","أقران المجموعة"],"تدريس الأقران عبر الصفوف: طالب من صف أعلى يعلم طلاب صف أدنى. داخل الفصل بين زملاء الصف نفسه."],["L11","","نشاط موجه يتنافس فيه الطلاب فردياً أو جماعياً بطريقة ممتعة لتحقيق أهداف الدرس يسمى:",["الألعاب التعليمية","لعب الأدوار","المحاكاة","العصف الذهني"],"الألعاب التعليمية تنافس ممتع موجه. لعب الأدوار تقمص شخصيات، والمحاكاة تمثيل موقف واقعي، والعصف توليد أفكار."],["L11","m","كل ما يستخدمه المعلم والمتعلم من أجهزة وأدوات ومواد داخل الصف أو خارجه لإكساب خبرات محددة يسمى:",["الوسائل التعليمية","تقنيات التعليم","مصادر التعلم","المنهج"],"الوسائل التعليمية أدوات ومواد. تقنيات التعليم منظومة أشمل (إنسان وآلة وطريقة)، ومصادر التعلم كل ما يتفاعل معه المتعلم."],["L12","h","في هرم المعرفة تقع الحقائق في القاعدة والنظريات في القمة. الانتقال في التدريس من الحقائق وصولاً إلى النظريات يمثل:",["استقراءً من الجزء إلى الكل","استنباطاً من الكل إلى الجزء","انتقالاً من المجرد إلى المحسوس","تطبيقاً للقاعدة على الأمثلة"],"من الحقائق (جزئيات) إلى المفاهيم فالتعميمات فالقوانين فالنظريات (كليات) انتقال استقرائي. الاستنباط العكس."],["L12","m","«أن يكتسب الطالب حب الوطن» و«أن يذكر الطالب ثلاث مدن سعودية» يمثلان على الترتيب هدفاً:",["عاماً، وسلوكياً","سلوكياً، وعاماً","وجدانياً، ونفس‑حركياً","تربوياً، وغاية"],"الأول عام غير قابل للقياس المباشر في حصة، والثاني سلوكي بفعل قابل للملاحظة ومحتوى محدد."],["L13","m","رقّم المعلم أعضاء كل مجموعة من 1 إلى 4، وبعد المناقشة نادى رقماً عشوائياً ليجيب عن مجموعته. الاستراتيجية:",["الرؤوس المرقمة","الكرسي الساخن","حوض السمك","جيكسو"],"الرؤوس المرقمة تضمن استعداد كل عضو لأن أي رقم قد يُستدعى. الكرسي الساخن أسئلة لطالب خبير، وحوض السمك دائرتان، وجيكسو مجموعات خبرة."],["L13","","رتّب المعلم الكراسي في دائرة داخلية تناقش القضية ودائرة خارجية تراقب وتدون الملاحظات ثم تتبادلان الأدوار. الاستراتيجية:",["حوض السمك","الرؤوس المرقمة","فكر‑زاوج‑شارك","الأعواد"],"حوض السمك: مشاركون في الداخل وملاحظون في الخارج. الأعواد سحب اسم عشوائي، والرؤوس المرقمة ترقيم الأعضاء."],["L13","m","كتب الطالب في بطاقة رباعية تعريف المفهوم وخصائصه وأمثلة عليه وأمثلة لا تنتمي إليه. المنظم المستخدم:",["نموذج فراير","أشكال فن","جدول KWL","خريطة الشكل V"],"فراير منظم رباعي للمفهوم (تعريف، خصائص، أمثلة، لا أمثلة). فن للمقارنة، وKWL للمعرفة السابقة والمكتسبة."],["L13","","كتب الطالب رسالة متقمصاً دور طبيب موجهة إلى أولياء الأمور بصيغة منشور توعوي عن موضوع النظافة. استراتيجية الكتابة الإبداعية التي تحدد الدور والجمهور والصيغة والموضوع:",["RAFT (رافت)","تنال القمر","شبكة الأسئلة","التساؤل الذاتي"],"RAFT عناصرها: الدور، الجمهور، الصيغة، الموضوع. تنال القمر للفهم القرائي، وشبكة الأسئلة جمع أسئلة الطلاب."],["L13","m","استراتيجية فهم قرائي بخمس خطوات: التنبؤ، التنظيم، البحث، التلخيص، المقارنة. اسمها:",["تنال القمر","التدريس التبادلي","الخطوات الست","KWL"],"تنال القمر (أحرفها الأولى من خطواتها الخمس) وتشبه التدريس التبادلي الذي خطواته أربع (تنبؤ، أسئلة، توضيح، تلخيص)."],["L13","","نموذج بنائي اجتماعي يمر بأربعة أطوار: التمهيدي ثم التركيزي ثم التحدي ثم التطبيق. هو نموذج:",["التعليم التوليدي","التغير المفاهيمي","دورة التعلم الخماسية","التعلم للإتقان"],"التعليم التوليدي (أوزبورن وويتروك) يولّد المعنى في سياق اجتماعي بأطوار أربعة. دورة التعلم الخماسية مراحلها 5E، والتغير المفاهيمي لبوسنر."],["L13","m","لاحظ المعلم أن مفهوم الطالب الخاطئ بسيط ويمكن تعديله بإضافة معلومة، بينما مفهوم طالب آخر يحتاج إلى استبدال كامل. يسمى التغيران عند بوسنر:",["تطورياً، وثورياً","ثورياً، وتطورياً","استقبالياً، واكتشافياً","أفقياً، ورأسياً"],"التغير التطوري لتعديل بسيط، والثوري لاستبدال المفهوم كله. الاستقبالي والاكتشافي لأوزوبل، والأفقي والرأسي لانتقال الأثر."],["L13","","طالب يسأل نفسه أثناء القراءة: «ماذا أعرف عن هذا؟ ما الذي لم أفهمه؟ كيف أتابع؟». الاستراتيجية:",["التساؤل الذاتي","العصف الذهني","الكرسي الساخن","لعب الأدوار"],"التساؤل الذاتي مهارة ما وراء معرفية يراقب بها الطالب فهمه. العصف توليد أفكار جماعي."],["L13","h","رفع المعلم شرح الدرس مسجلاً على منصة ليشاهده الطلاب في الوقت الذي يناسبهم ويرسلوا أسئلتهم بالبريد. نمط التعليم:",["غير متزامن","متزامن","مباشر","تنافسي"],"يشاهد الطلاب الشرح ويرسلون أسئلتهم في أوقات مختلفة، واختلاف الوقت هو ما يجعل التعليم غير متزامن. أما المتزامن (المباشر) فيجمع المعلم والطلاب في الوقت نفسه ولو اختلفت أماكنهم."],["L13","m","استخدم المعلم المنصة الإلكترونية داعماً للحصة الحضورية برفع الواجبات والمصادر فقط دون أن تحل محل التدريس. مستوى توظيف التعلم الإلكتروني:",["مساند","مدمج","كامل عن بعد","مقلوب"],"المساند يدعم الصفي دون تغيير بنيته. المدمج يوزع التعلم بين الحضوري والإلكتروني، والكامل يستبدل الحضور، والمقلوب يقلب مهام الصف والمنزل."],["L13","","منظومة متكاملة من الإنسان والأجهزة والطرق والمواد تعمل معاً لتحقيق أهداف التعليم. هذا تعريف:",["تقنيات التعليم","الوسائل التعليمية","الكتاب المدرسي","المنهج الخفي"],"تقنيات التعليم منظومة أشمل من الوسائل (أجهزة ومواد فقط). الكتاب وعاء المحتوى، والخفي ما يُتعلم ضمنياً."],["L13","m","المعلم والمكتبة والمعمل والإنترنت والمتحف جميعها أنظمة وموارد يتفاعل معها المتعلم لاكتساب الخبرة. المصطلح الجامع:",["مصادر التعلم","الوسائل التعليمية","التقويم البديل","المنهج الرسمي"],"مصادر التعلم تشمل الموارد البشرية وغير البشرية التي يتفاعل معها المتعلم. الوسائل أدوات ومواد فقط."],["L13","h","مدخل منظم لتخطيط التعليم وتطويره وتقويمه يمر بمراحل التحليل والتصميم والتطوير والتنفيذ والتقويم. هذا المدخل ونموذجه:",["التصميم التعليمي، ونموذج ADDIE","التقويم البديل، ونموذج تايلر","التعلم النشط، ونموذج 5E","دمج التقنية، ونموذج SAMR"],"ADDIE أشهر نماذج التصميم التعليمي. تايلر للمنهج، و5E دورة تعلم، وSAMR لمستويات دمج التقنية."],["L13","m","صفحة إنترنت يستطيع عدة مستخدمين تحريرها وإضافة محتوى إليها تشاركياً كما في ويكيبيديا تسمى:",["الويكي","المدونة","البودكاست","الفيديو التفاعلي"],"الويكي تحرير جماعي. المدونة صفحة شخصية للنشر والتعليق، والبودكاست محتوى صوتي، والفيديو التفاعلي يمزج الفيديو بالتحكم."],["L13","","أنشأ المعلم صفحة شخصية ينشر فيها تأملاته وشروحه ويعلق عليها الطلاب. الأداة:",["المدونة","الويكي","قاعدة البيانات","الحوسبة السحابية"],"المدونة للنشر الشخصي والتعليق. الويكي تحرير جماعي، والسحابية تخزين وموارد عبر الإنترنت."],["L13","m","سجل المعلم شروح الدروس ملفات صوتية ليستمع إليها الطلاب في الحافلة أو المنزل. الأداة:",["البودكاست التعليمي","الفيديو التفاعلي","الواقع المعزز","الرحلة المعرفية"],"البودكاست محتوى صوتي مسجل. الفيديو التفاعلي مرئي، والواقع المعزز يضيف عناصر رقمية للواقع، والرحلة المعرفية بحث موجه في الويب."],["L13","","وسيلة تمزج بين الحاسوب والفيديو وتسمح للطالب بالتحكم والتفرع وتُعد فعالة في التعلم الفردي:",["الفيديو التفاعلي","البودكاست","الويكي","المدونة"],"الفيديو التفاعلي يسمح بالتحكم والتفرع وفق استجابة المتعلم. البودكاست صوتي، والويكي والمدونة نصيتان."],["L13","m","أراد المعلم تنظيم درجات طلابه في جدول ورسم مخطط بياني لمقارنتها. البرنامج الأنسب:",["إكسل","أكسس","باوربوينت","وورد"],"إكسل جداول وحسابات ورسوم بيانية. أكسس لقواعد البيانات العلائقية، وباوربوينت للعروض، ووورد للنصوص."],["L13","","لإنشاء قاعدة بيانات علائقية تربط سجلات الطلاب بأولياء أمورهم ودرجاتهم يُستخدم برنامج:",["أكسس","إكسل","كانفا","كاهوت"],"أكسس نظام إدارة قواعد بيانات. إكسل جداول، وكانفا تصميم، وكاهوت ألعاب تفاعلية."],["L13","m","أراد المعلم تصميم ملصق تعليمي جذاب للصف دون مهارات تصميم متقدمة، وبناء خريطة معرفية إلكترونية. الأداتان على الترتيب:",["كانفا، وبوبلت","أكسس، وإكسل","زوم، وتيمز","SPSS، وكاهوت"],"كانفا للتصميم المرئي، وبوبلت للخرائط المعرفية. أكسس وإكسل بيانات، وزوم وتيمز اجتماعات، وSPSS تحليل إحصائي."],["L13","","معايير دولية توجه توظيف التقنية في التعليم للطلاب والمعلمين والقادة تعرف باسم:",["ISTE","TPACK","SAMR","ADDIE"],"ISTE الجمعية الدولية للتقنية في التعليم ومعاييرها. TPACK إطار معرفة المعلم، وSAMR مستويات الدمج، وADDIE تصميم تعليمي."],["L13","m","استخدم المعلم أداة ذكاء اصطناعي لتوليد أسئلة تدريبية. الإجراء الصحيح قبل عرضها على الطلاب:",["مراجعة دقتها ومناسبتها للأهداف ثم استخدامها","عرضها مباشرة لأن الأداة دقيقة دائماً","رفض استخدام الأداة نهائياً","تركها للطلاب ليحكموا على صحتها"],"الذكاء الاصطناعي أداة مساعدة قد تخطئ، فيبقى التحقق من الدقة والمواءمة مسؤولية المعلم."],["L13","m","معلم يرى أن المنهج هو الكتاب المقرر وأن مهمته حفظ المعلومات واستظهارها، بينما يرى زميله أن المنهج جميع الخبرات التي تهيئها المدرسة داخلها وخارجها. المفهومان على الترتيب:",["تقليدي، وحديث","حديث، وتقليدي","خفي، ورسمي","فارغ، وحلزوني"],"المنهج التقليدي يساوي المقرر والحفظ، والحديث يشمل كل الخبرات ويراعي المتعلم. الخفي والفارغ والحلزوني مفاهيم أخرى."],["L13","","الفرق بين المقرر والكتاب المدرسي أن المقرر:",["موضوعات محددة في مادة لصف معين، والكتاب وعاء يحمل المحتوى والوسائل والأنشطة","مرادف للكتاب تماماً","أشمل من المنهج","يقتصر على الأنشطة اللاصفية"],"المقرر قائمة الموضوعات، والكتاب الوعاء المادي للمحتوى والأنشطة، والمنهج أشمل منهما."],["L13","m","رتّب المعلم موضوعات الوحدة وفق خصائص المتعلمين وحاجاتهم وميولهم لا وفق التسلسل المنطقي للمادة. تنظيم المحتوى هنا:",["سيكولوجي (نفسي)","منطقي","حلزوني","محوري"],"التنظيم السيكولوجي يبدأ من المتعلم، والمنطقي من بنية المادة (السهل للصعب). الحلزوني تكرار بعمق، والمحوري جزء مشترك واختياري."],["L13","","المدى في مصفوفة المدى والتتابع يمثل البعد:",["الأفقي (اتساع المحتوى في الصف الواحد)","الرأسي (تدرج المحتوى عبر الصفوف)","الزمني للحصة","الوجداني للأهداف"],"المدى اتساع أفقي في المستوى الواحد، والتتابع تدرج رأسي عبر السنوات."],["L13","m","تنظيم منهجي يوظف التقنية في تقديم الخبرات ويعتمد على الخطو الذاتي للمتعلم. يسمى المنهج:",["التكنولوجي","المحوري","الحلزوني","الخفي"],"المنهج التكنولوجي قائم على التقنية والخطو الذاتي. المحوري مشترك واختياري، والحلزوني لبرونر، والخفي ضمني."],["L14","m","أشرك المعلم طلابه في وضع القواعد ومراقبة التزامهم بها بأنفسهم حتى قلّ تدخله تدريجياً. هذا الأسلوب:",["الإدارة الذاتية للصف","النمط التسلطي","النمط الفوضوي","العقاب الجماعي"],"الإدارة الذاتية تنقل الضبط من المعلم إلى الطلاب (انضباط ذاتي). التسلطي يفرض، والفوضوي يترك، والجماعي يعاقب الكل."],["L14","","قدّم المعلم لطالب منطوٍ تعليمات وتدريبات ليعبّر عن رأيه ويطلب حقوقه بثقة دون عدوان. الأسلوب:",["السلوك التوكيدي","الإغراق","الكف المتبادل","الإشباع"],"السلوك التوكيدي يبني ثقة الطالب بنفسه في التعبير. الإغراق مواجهة المخاوف دفعة واحدة، والكف المتبادل إحلال استجابة محل أخرى."],["L14","m","طالب يعض أظافره عند التوتر، فدرّبه المعلم على الضغط على كرة إسفنجية عند الشعور بالتوتر بديلاً عن العض. الأسلوب:",["الكف المتبادل","الإشباع","التلقين","ضبط المثير"],"الكف المتبادل إحلال استجابة مقبولة لا تجتمع مع غير المرغوبة. الإشباع تقديم المثير بكثرة، والتلقين تلميح، وضبط المثير تعديل البيئة."],["L14","","أعطى المعلم طالباً مولعاً بالتحدث في غير وقته فرصة طويلة للحديث حتى ملّ وفقد السلوك جاذبيته. الأسلوب:",["الإشباع","الانطفاء","الإقصاء","التصحيح الزائد"],"الإشباع تقديم المثير أو السماح بالسلوك بكثرة حتى يفقد قيمته. الانطفاء تجاهل، والإقصاء عزل، والتصحيح الزائد إصلاح الضرر وزيادة."],["L14","m","استعان المعلم بقصص واقعية وأنشطة خدمية في المجتمع لتعديل سلوك طالب لا يقدر الممتلكات العامة. الأسلوب:",["الإرشاد بالواقع","الغمر","تكلفة الاستجابة","السحب التدريجي"],"الإرشاد بالواقع (جلاسر) يواجه الطالب بواقع سلوكه وأثره على الآخرين ويحمّله مسؤولية اختياره، ومن أدواته القصص الواقعية والأنشطة الخدمية التي تُريه قيمة الممتلكات العامة. الغمر مواجهة مفاجئة لمثير الخوف، وتكلفة الاستجابة سحب معزز، والسحب التدريجي تلاشي المساعدة."],["L14","","طالب يمارس حمية غذائية ويقيّد نفسه عن الحلويات رغم رغبته. هذا مثال على:",["ضبط الذات","الإقصاء","العقاب السالب","الانطفاء"],"ضبط الذات مجاهدة النفس وتقييدها ذاتياً. الإقصاء والعقاب السالب إجراءان خارجيان من المعلم."],["L14","m","بعد أن أتقن بعض الطلاب الهدف، كلفهم المعلم بنشاط إضافي أعمق لتثبيت التعلم، وكلّف غير المتقنين بتدريبات أساسية. النشاطان على الترتيب:",["تعزيزي، وعلاجي","علاجي، وتعزيزي","إثرائي، وتعزيزي","صفي، ولاصفي"],"النشاط التعزيزي لمن أتقن لتثبيت التعلم، والعلاجي لمن لم يتقن. الإثرائي للموهوبين يتجاوز المنهج."],["L14","h","اقترب المعلم من طالب شارد وخفّض نبرة صوته ونظر إليه مباشرة دون أن يتكلم فانتبه. نوع الاتصال:",["غير لفظي","لفظي كتابي","لفظي شفهي","أحادي الاتجاه"],"الاقتراب (اللغة التقاربية) والنبرة (الموازية) والنظر (لغة الجسد) كلها اتصال غير لفظي. اللفظي كلمات منطوقة أو مكتوبة."],["L14","m","استخدام المعلم المسافة والقرب المكاني من الطالب لإيصال رسالة يسمى في الاتصال غير اللفظي:",["اللغة التقاربية","اللغة الموازية","لغة الجسد","الاتصال اللفظي"],"التقاربية تخص المسافة المكانية، والموازية نبرة الصوت وسرعته، ولغة الجسد التعبيرات والإيماءات."],["L14","","لاحظ المعلم أن الطلاب يسمعونه لكن أذهانهم شاردة فلا يستوعبون. هذا يمثل من معوقات الاتصال:",["شرود الذهن لدى المستقبل","ضعف القناة","غياب المرسل","انعدام التغذية الراجعة"],"شرود الذهن معوق يخص المستقبل. القناة والمرسل والتغذية الراجعة عناصر أخرى في الاتصال."],["L14","m","أعاد المعلم أوراق التقويم بعد تلوين ما حقق معايير النجاح باللون الوردي وما يحتاج تحسيناً بالأصفر. استراتيجية التغذية الراجعة:",["التخطيط باللونين","نجمتان وأمنية","الكرسي الساخن","بطاقة الخروج"],"التخطيط باللونين تغذية راجعة بصرية بلونين. نجمتان وأمنية نقطتا قوة ونقطة تحسين لفظياً، وبطاقة الخروج أداة تقويم تكويني."],["L15","h","أي الآتي لا يُعد من الأسئلة الموضوعية؟",["الأسئلة المقالية المقيدة (محددة الإجابة)","الاختيار من متعدد","الصواب والخطأ","المطابقة"],"في المقالية المقيدة يكتب الطالب إجابته بأسلوبه في حدود معينة، فتتأثر درجتها بتقدير المصحح، فهي من الأسئلة المقالية لا الموضوعية. أما الاختيار من متعدد والصواب والخطأ والمطابقة فتصحيحها ثابت لا يختلف باختلاف المصحح."],["L15","m","قارن المعلم درجة الطالب في اختبار نهاية الوحدة بدرجته في الاختبار القبلي لنفس الطالب ليحكم على تقدمه. نوع التقويم بالمرجع:",["ذاتي المرجع","معياري المرجع","محكي المرجع","ختامي"],"ذاتي المرجع يقارن الطالب بنفسه عبر الزمن. معياري بالأقران، ومحكي بمحك إتقان."],["L15","","أجرى المعلم اختباراً بعد شهرين من انتهاء الوحدة واختبارها النهائي ليتأكد من بقاء أثر التعلم. نوع التقويم:",["تتبعي","تشخيصي","تكويني","قبلي"],"التتبعي يُجرى بعد فترة من الختامي لقياس الاحتفاظ. التشخيصي والقبلي قبل التعلم، والتكويني أثناءه."],["L15","m","تقويم تجريه الوزارة والهيئة على المدرسة من خارجها، وتقويم تجريه المدرسة لنفسها. يسميان على الترتيب:",["خارجياً، وداخلياً","داخلياً، وخارجياً","معيارياً، ومحكياً","ختامياً، وتكوينياً"],"التصنيف حسب الجهة المقوّمة: خارجي من خارج المدرسة، وداخلي من داخلها، ومتعدد الأطراف يجمعهما."],["L15","m","أراد المعلم قياس اتجاهات طلابه نحو مادة الفيزياء بعبارات يختار الطالب أمام كل منها درجة موافقته من «أوافق بشدة» إلى «لا أوافق بشدة». الأداة:",["مقياس ليكرت للاتجاهات","قائمة الشطب","الاختبار التحصيلي","السجل القصصي"],"ليكرت مقياس تقرير ذاتي خماسي للاتجاهات (نواتج وجدانية). قائمة الشطب نعم/لا للمهارات، والتحصيلي معرفي."],["L15","","لقياس الميول المهنية للطلاب يستخدم المرشد مقاييس مثل:",["سترونج وكودر","ستانفورد بينيه ووكسلر","TIMSS وPISA","ليكرت وثيرستون للاتجاهات"],"سترونج وكودر مقياسا ميول مهنية. ستانفورد ووكسلر للذكاء، وTIMSS وPISA اختبارات دولية."],["L15","m","اختبار يناسب الصفوف الأولية ومادة القرآن الكريم وينعدم فيه الغش، لكنه يستغرق وقتاً ويتأثر بذاتية المعلم. هو الاختبار:",["الشفوي","الموضوعي","المقالي","الأدائي"],"الاختبار الشفوي يكشف النطق والتعبير ولا مجال فيه للغش، وعيوبه الوقت والذاتية. الموضوعي سريع التصحيح، والمقالي كتابي."],["L15","","من مواصفات الاختبار الجيد أن يغطي جوانب المحتوى والأهداف كلها بأوزانها. هذه الخاصية:",["الشمول","الموضوعية","الثبات","التمييز"],"الشمول تغطية المحتوى وفق جدول المواصفات. الموضوعية استقلال عن المصحح، والثبات استقرار، والتمييز كشف الفروق."],["L15","m","من أهم ما يضمن العدالة في التقويم البديل:",["إعلان المحكات مسبقاً وإتاحة فرص متساوية","الاعتماد على اختبار واحد","إخفاء معايير التصحيح عن الطلاب","تقويم الطلاب بأدوات مختلفة دون معيار"],"العدالة تتطلب محكات معلنة وفرصاً متكافئة وتعدد الأدوات بمعيار واحد."],["L16","h","في فصل عدد طلابه 25 أجاب 14 طالباً عن فقرة إجابة صحيحة. معامل صعوبة الفقرة:",["0.56","1.79","0.25","0.14"],"معامل الصعوبة = عدد من أجابوا إجابة صحيحة ÷ عدد الطلاب = 14 ÷ 25 = 0.56، فالفقرة متوسطة الصعوبة. كلما ارتفع المعامل كانت الفقرة أسهل (لذلك يسمى أيضاً معامل السهولة). و1.79 قسمة معكوسة (25 ÷ 14)، والمعامل لا يتجاوز 1."],["L16","m","سؤال مقالي درجته 10، أجاب عنه 20 طالباً وكان مجموع درجاتهم فيه 120. معامل صعوبة السؤال:",["0.60","0.12","6.0","0.83"],"في المقالي: مجموع الدرجات ÷ (عدد الطلاب × درجة السؤال) = 120 ÷ (20 × 10) = 0.60."],["L16","","الصدق الذي يبحث في كفاية عدد الأسئلة لتمثيل المادة الدراسية يسمى الصدق:",["العيني","التنبؤي","الظاهري","التلازمي"],"الصدق العيني وجه من صدق المحتوى يخص كفاية العينة من الفقرات. التنبؤي والتلازمي للمحك، والظاهري شكل الاختبار."],["L16","m","أي العوامل الآتية يرفع معامل ثبات الاختبار؟",["زيادة عدد الفقرات المتجانسة","زيادة التخمين","غموض صياغة الأسئلة","اضطراب الطلاب أثناء التطبيق"],"طول الاختبار بفقرات متجانسة متوسطة الصعوبة يزيد الثبات، أما التخمين والغموض والاضطراب فتخفضه."],["L16","m","منحنى درجات قمته حادة لأن معظم الدرجات متقاربة حول المتوسط. يوصف هذا المنحنى بأنه:",["مدبب (التفرطح موجب)","مفرطح","ملتوٍ موجباً","ملتوٍ سالباً"],"التفرطح يصف شكل القمة: مدبب عند تقارب الدرجات ومفرطح عند تشتتها. الالتواء يصف انحراف الذيل لا القمة."],["L16","","من خصائص التغذية الراجعة الفعالة أن تكون:",["فورية ومستمرة وشاملة لجوانب الأداء","عامة ومؤجلة","مركزة على شخصية الطالب","مقتصرة على الدرجة الرقمية"],"التغذية الراجعة الفعالة تأتي في وقتها (فورية غالباً) وتتكرر مع التعلم، وتغطي جوانب الأداء المهمة قوةً وضعفاً بعبارة موجزة محددة، وتركز على المهمة لا على شخص الطالب. أما العامة المؤجلة والموجهة إلى الشخصية والمقتصرة على الدرجة فلا ترشده إلى التحسين."],["L16","m","العلاقة بين الصدق والثبات أن:",["الاختبار الصادق ثابت بالضرورة، والثابت قد لا يكون صادقاً","الثابت صادق بالضرورة","لا علاقة بينهما","الثبات أشمل من الصدق"],"الصدق يتضمن الثبات؛ فمن يقيس ما وُضع له يعطي نتائج مستقرة، أما الاتساق فلا يضمن قياس الهدف."],["L11","m","معلم يحتكر الحديث طوال الحصة ويملي المعلومات والطلاب متلقون صامتون. يمثل دور المعلم:",["التقليدي (الملقن)","الميسّر","المفوّض","المرشد"],"المعلم التقليدي ناقل للمعلومة والطالب سلبي. الميسر يدعم عند الحاجة، والمفوض يفوض المسؤولية، والمرشد يوجه."],["L11","","من وسائل التعلم الذاتي التي يتعلم بها الطالب دون تدخل مباشر من المعلم:",["التعليم المبرمج والحقائب التعليمية","المحاضرة والإلقاء","العرض العملي","المناقشة الجماعية"],"التعليم المبرمج والحقائب والموديولات والحاسوب وسائل تعلم ذاتي. المحاضرة والعرض والمناقشة طرق يقودها المعلم."],["L07","m","من العوامل المؤثرة في النمو: الوراثة والبيئة والنضج والتعلم وإفرازات:",["الغدد","الأقران","المعلم","التقنية"],"الغدد الصماء (كالنخامية والدرقية) من العوامل البيولوجية المؤثرة في النمو الجسمي والانفعالي."],["L07","","يرى برونر أن تسريع تعليم الطفل مفهوماً معقداً ممكن بشرط:",["أن يكون مستعداً من الناحية الفسيولوجية ويُقدَّم بتمثيل يناسبه","أن يتجاوز الطفل سن الحادية عشرة","أن يتعلمه بالتلقين والتكرار","أن يُقدَّم رمزياً دائماً"],"برونر يرى إمكان تعليم أي مفهوم لأي طفل بصورة أمينة تناسب تمثيله (عملي، أيقوني، رمزي) إذا كان مستعداً، بخلاف بياجيه الذي يربط التعلم بالمرحلة."],["L11","m","يرى معلم أن مهمته ضبط سلوك الطلاب وتعديله بالتعزيز والتعليم المبرمج، ويرى زميله أن التدريس يبدأ من مشاعر الطالب وإدراكاته الذاتية. المدخلان على الترتيب:",["السلوكي، والإنساني (الشخصي)","المعرفي، والاجتماعي","الاجتماعي، والسلوكي","الإنساني، والمعرفي"],"السلوكي ضبط وتعزيز، والإنساني أو الشخصي يركز على الإدراكات الفردية والوجدان. المعرفي يهتم بالبنية المعرفية والاكتشاف، والاجتماعي بالتفاعل الجماعي."],["L11","","في المدخل المعرفي، المدخل الذي يهتم بمفاهيم العلم الكبرى وطرق البحث فيه لا بمحتوى الكتاب المدرسي هو مدخل:",["بنية العلم","المادة الدراسية","الضبط","النشاط"],"مدخل بنية العلم يركز على المفاهيم الكبرى وطرائق العلماء، بينما مدخل المادة الدراسية يهتم بمحتوى الكتاب. الضبط سلوكي والنشاط لديوي."],["L11","m","تصنف طرق التدريس وفق الاحتكاك بين المعلم والمتعلم إلى:",["مباشرة (وجهاً لوجه) وغير مباشرة","عامة وخاصة","جمعية وفردية","استقرائية واستنباطية"],"وفق الاحتكاك: مباشرة وغير مباشرة. وفق حاجة التخصص: عامة وخاصة. وفق عدد المتعلمين: جمعية وفردية."],["L11","","من رواد التعلم التعاوني الذين وضعوا أسسه النظرية:",["ديوي وباركر ودويتش","سكنر وبافلوف وواطسون","بياجيه وكوهلر","أوزوبل وبرونر"],"ديوي وباركر ودويتش ثم جونسون وجونسون رواد التعلم التعاوني. البدائل الأخرى رواد السلوكية والمعرفية."],["L11","m","برنامج تعليمي ذاتي متكامل يجمع بين الحقائب التعليمية ومبدأ التعلم للإتقان ويتضمن اختبارات قبلية وبعدية. يسمى:",["المجمعات التعليمية","التدريس المصغر","لعب الأدوار","العصف الذهني"],"المجمعات التعليمية نظام تعلم ذاتي متكامل. التدريس المصغر لتدريب المعلمين، ولعب الأدوار والعصف استراتيجيات جماعية."],["L11","","من أهداف التعليم الفردي:",["مراعاة الفروق الفردية والتعلم للإتقان وتنمية الاستقلالية","توحيد سرعة التعلم لجميع الطلاب","زيادة التنافس بين الطلاب","تقليل دور الطالب في تعلمه"],"التعليم الفردي يراعي الفروق ويسعى للإتقان والاستقلالية والإبداع. التوحيد والتنافس يناقضانه."],["L13","m","يسمح المعلم للطالب بالانتقال بين المجموعات بحسب المهمة واستعداده، فيكون عضواً في مجموعات مختلفة خلال الأسبوع. الاستراتيجية:",["المجموعات المرنة","التجميع الثابت حسب الذكاء","جيكسو","الرؤوس المرقمة"],"المجموعات المرنة تتغير بحسب المهمة والاستعداد بدل التصنيف الثابت، وهي من أدوات التعليم المتمايز."],["L13","","نموذج تدريس يبدأ بتمهيد ثم اكتشاف ثنائي ثم أنشطة تعاونية في مجموعات ثم إتاحة الفرص وينتهي بتقويم ذاتي فردي. هو نموذج:",["التعلم البنائي الاجتماعي","فكر‑زاوج‑شارك","التعلم للإتقان","التعليم المبرمج"],"نموذج التعلم البنائي الاجتماعي يبدأ ثنائياً وينتهي فردياً، بخلاف فكر‑زاوج‑شارك الذي يبدأ فردياً ثم ثنائياً ثم جماعياً."],["L15","m","من وظائف التقويم التربوي:",["تشخيص الضعف وتوجيه التعلم وتطوير المناهج ودعم القرارات","تصنيف الطلاب نهائياً دون علاج","الاكتفاء برصد الدرجات","معاقبة المقصرين"],"التقويم يشخص ويوجه ويحكم ويطور ويدعم القرارات. الرصد وحده قياس، والتصنيف النهائي والعقاب يناقضان غرضه."],["L15","","أدوات يصف فيها الطالب بنفسه اتجاهاته وميوله مثل مقاييس ليكرت ومقاييس الميول تسمى:",["التقارير الذاتية","الاختبارات التحصيلية","اختبارات الأداء","قوائم الشطب"],"التقارير الذاتية تقيس النواتج الوجدانية بإجابة الطالب عن نفسه. التحصيلية معرفية، والأداء مهارية، وقوائم الشطب ملاحظة المعلم."],["L15","m","أي مما يأتي يمثل أساساً من أسس التقويم السليم؟",["أن يُبنى على أهداف واضحة ويكون مستمراً وشاملاً","أن يقتصر على اختبار نهائي واحد","أن يُسند إلى المشرف فقط","أن يركز على الحفظ دون المهارات"],"أسس التقويم: وضوح الأهداف، الاستمرار، الشمول، التعاون، العلمية. الاقتصار على اختبار واحد يخالف الاستمرار والشمول."],["L07","","دراسة نمو المفاهيم الأساسية عند الأطفال مثل مفهوم الزمن والمكان والعدد ارتبطت باسم:",["بياجيه","ثورندايك","باندورا","سكنر"],"بياجيه رائد نظرية النمو المعرفي ودرس كيف يبني الطفل مفاهيم العدد والزمن والمكان والسببية. الآخرون من رواد نظريات التعلم السلوكية والاجتماعية."],["L07","m","أعطى معلم أطفال الروضة كرتين من الصلصال متساويتين ثم بسط إحداهما، فقال الأطفال إن المبسوطة «أكثر». يدل ذلك على أن الأطفال:",["لم يدركوا مفهوم الاحتفاظ بعد","يفتقرون إلى الانتباه","في مرحلة العمليات المحسوسة","يعانون صعوبة في الإدراك البصري"],"الحكم على الكمية بالشكل الظاهري يعني غياب الاحتفاظ، وهو سمة ما قبل العمليات. لو كانوا في المحسوسة لأدركوا أن الكمية ثابتة. ليست مشكلة انتباه أو إدراك بصري."],["L07","m","لاحظ معلم أن طفلاً في الصف الأول يتحدث عن الشمس بأنها «تغضب وتختبئ خلف الغيوم». هذا مظهر لـ:",["الإحيائية في مرحلة ما قبل العمليات","اضطراب في التفكير يحتاج إحالة","خيال إبداعي مرتفع يستحق الإثراء","التفكير الافتراضي المبكر"],"إضفاء الحياة والمشاعر على الجمادات هو الإحيائية، وهي طبيعية في ما قبل العمليات. ليست اضطراباً ولا دليلاً على موهبة، والتفكير الافتراضي من المرحلة المجردة."],["L07","","الطفل الذي يُخفي المعلم لعبته تحت قطعة قماش فيبحث عنها هناك قد أدرك مفهوم:",["دوام الشيء","الاحتفاظ","المعكوسية","التمركز حول الذات"],"البحث عن الشيء المخفي يعني إدراك أنه موجود رغم غيابه عن البصر؛ وهذا دوام الشيء، إنجاز نهاية الحس-حركية. الاحتفاظ والمعكوسية يأتيان في المحسوسة."],["L07","","أثناء النقاش في الصف الثالث الابتدائي طلب المعلم من الطلاب تصور «ماذا لو كانت الجاذبية نصف قيمتها الحالية؟» فعجز معظمهم عن الإجابة. التفسير الأقرب:",["المهمة تتطلب تفكيراً افتراضياً لا يتوفر في مرحلة العمليات المحسوسة","الطلاب يفتقرون إلى الدافعية","المعلم لم يستخدم التعزيز الكافي","الطلاب لم يحفظوا قانون الجاذبية"],"التفكير في الافتراضات الخيالية (ماذا لو) من سمات العمليات المجردة، وطلاب الثالث الابتدائي في المحسوسة. ليست مشكلة دافعية أو حفظ أو تعزيز."],["L07","m","طلبت معلمة الصف الأول من الطلاب إخبارها بما تراه زميلتهم الجالسة في الجهة المقابلة من المجسم، فوصفوا ما يرونه هم. هذا يعكس:",["التمركز حول الذات","ضعف الذاكرة قصيرة المدى","عدم فهم التعليمات","ضعف الإدراك البصري"],"العجز عن تبني منظور الآخر هو التمركز حول الذات (تجربة الجبال الثلاثة لبياجيه)، وهو سمة ما قبل العمليات لا عيب في الذاكرة أو الفهم."],["L07","m","يفضّل معلم العلوم في الصف الخامس أن يبدأ كل مفهوم بتجربة يمسك فيها الطلاب الأدوات بأيديهم قبل أن يشرح القاعدة. هذا الإجراء يراعي:",["أن طلابه في مرحلة العمليات المحسوسة","أن طلابه في مرحلة العمليات المجردة","أزمة الهوية لدى طلابه","مرحلة الكمون عند فرويد"],"طالب الخامس الابتدائي (10–11 سنة) في مرحلة المحسوسات، فالتجربة الملموسة قبل القاعدة أنسب. الكمون تفسير فرويدي لا يتصل باختيار الطريقة."],["L07","m","طالب في الصف الرابع يُحبط بسرعة ويقول «أنا لا أستطيع» كلما أخطأ. وفق إريكسون، الإجراء الأنسب للمعلم:",["تكليفه بمهام متدرجة يمكنه إنجازها والاعتراف بإنجازه","إعفاؤه من المهام الصعبة حتى يكبر","مقارنته بزميل متفوق ليتحفز","توجيهه إلى المرشد الطلابي فوراً"],"أزمة الابتدائية الاجتهاد مقابل الدونية، ويُحل القطب الإيجابي بخبرات إنجاز وتقدير. الإعفاء يرسخ الدونية، والمقارنة تزيدها، والإحالة سابقة لأوانها."],["L07","","يرفض طالب في الصف الثاني المتوسط نصائح معلمه ويجادل في كل توجيه ويحرص على موافقة أقرانه. التفسير الأقرب لسلوكه:",["سلوك طبيعي لمرحلة البحث عن الهوية والاستقلال","اضطراب سلوكي يستدعي الإحالة","ضعف في الانتباه","نقص في مطالب نمو الطفولة المتوسطة"],"المجادلة والاستقلال والتأثر بالأقران من خصائص المراهقة المبكرة (أزمة الهوية). التعامل معه بالاحتواء والحوار لا الإحالة."],["L07","m","أي الإجراءات أنسب لمعلم الصف الأول الابتدائي لمراعاة قصر مدة الانتباه لدى طلابه؟",["تقسيم الحصة إلى أنشطة قصيرة متنوعة تتخللها حركة","مطالبتهم بالجلوس الهادئ طوال الحصة لتعويدهم","إطالة الشرح مع رفع الصوت","تأجيل الأنشطة إلى نهاية الحصة"],"الطفل في الطفولة المتوسطة انتباهه قصير وحاجته للحركة كبيرة، فالتنويع والأنشطة القصيرة أنسب. الجلوس الطويل والشرح المطوّل يناقضان خصائص المرحلة."],["L07","m","يحرص معلم الثانوية على ربط دروسه بالتخصصات الجامعية والمهن المستقبلية وإعطاء طلابه أدواراً قيادية. هذا الإجراء يراعي من خصائص طلابه:",["اهتمام المراهق بالمستقبل والهوية المهنية وحاجته إلى الاستقلال","حاجتهم إلى التعلم بالمحسوسات","سن الجماعة وروح العمل الجماعي","التمركز حول الذات"],"اختيار المهنة والاستعداد لها من مطالب نمو المراهقة (هافجهرست) وتكوين الهوية (إريكسون). المحسوسات للابتدائية، وسن الجماعة للطفولة المتأخرة."],["L07","m","أراد معلم أن يفهم كيف يبرر طلابه أحكامهم على موقف صعب فعرض عليهم قصة فيها تعارض بين إنقاذ حياة وخرق قانون. هذا الأسلوب يرتبط بنظرية:",["كولبرج في النمو الأخلاقي","بياجيه في النمو المعرفي","إريكسون في النمو النفسي الاجتماعي","فرويد في النمو النفسي الجنسي"],"المعضلات الأخلاقية (قصة هاينز) هي أداة كولبرج لتحديد مرحلة التفكير الأخلاقي من خلال التبرير لا الاختيار. بياجيه يستخدم مهام الاحتفاظ، وإريكسون الأزمات."],["L07","","يقول طالب: «أنا لا أغش في الاختبار لأن المعلم سيعاقبني إذا رآني». وفق كولبرج، هذا الطالب في مرحلة:",["الطاعة وتجنب العقاب (ما قبل التقليدي)","القانون والنظام (التقليدي)","العقد الاجتماعي (ما بعد التقليدي)","الولد الطيب (التقليدي)"],"ربط الصواب بتجنب العقاب هو المرحلة الأولى من المستوى ما قبل التقليدي. الالتزام بالقانون لذاته مرحلة 4، وإرضاء الآخرين مرحلة 3."],["L07","m","يلتزم طالب بنظام المدرسة ويقول: «لو خالف الجميع الأنظمة لعمّت الفوضى». وفق كولبرج، تبريره من مرحلة:",["القانون والنظام","الطاعة وتجنب العقاب","المنفعة المتبادلة","المبادئ الأخلاقية العالمية"],"الحفاظ على النظام الاجتماعي والقانون لذاته هو المرحلة الرابعة (المستوى التقليدي). المبادئ العالمية تتجاوز القانون إلى العدل والكرامة."],["L07","","يحكم الطالب في المرحلة الثالثة عند كولبرج على السلوك بأنه صحيح عندما:",["يرضي الآخرين ويحظى بموافقتهم","يجنّبه العقاب","يحقق له منفعة مقابل منفعة","يتفق مع مبادئ العدل العامة"],"المرحلة الثالثة «الولد الطيب»: الصواب ما يرضي المحيطين ويكسب موافقتهم. تجنب العقاب مرحلة 1، والمنفعة مرحلة 2، ومبادئ العدل مرحلة 6."],["L07","","المرحلة التي يميل فيها الطفل، وفق فرويد، إلى الهدوء النسبي للدوافع والانشغال بالتعلم والأقران، وتوافق سن المدرسة الابتدائية، هي:",["الكمون","الفمية","القضيبية","التناسلية"],"مرحلة الكمون (6–12) فيها تهدأ الدوافع ويتجه الطفل إلى التحصيل والصداقات. الفمية للرضاعة، والقضيبية 3–6، والتناسلية للمراهقة."],["L07","","المكوّن الذي يمثل الضمير والمثل العليا في بناء الشخصية عند فرويد هو:",["الأنا الأعلى","الهو","الأنا","الليبيدو"],"الأنا الأعلى يحمل القيم والضمير المكتسبة من الوالدين. الهو مبدأ اللذة، والأنا مبدأ الواقع يوازن بينهما."],["L07","","من مطالب النمو في مرحلة الطفولة المتوسطة عند هافجهرست:",["تعلم القراءة والكتابة والحساب والمهارات الجسمية للألعاب","اختيار المهنة والاستعداد لها","الاستقلال الانفعالي عن الوالدين","تقبل التغيرات الجسمية للبلوغ"],"القراءة والكتابة والحساب ومهارات اللعب مطالب الطفولة المتوسطة. اختيار المهنة والاستقلال الانفعالي وتقبل الجسم من مطالب المراهقة."],["L07","","النمو يسير من الرأس إلى القدمين، فيتحكم الطفل في رأسه ورقبته قبل ساقيه. يُسمى هذا الاتجاه:",["الرأسي–الذيلي","المركزي–الطرفي","من العام إلى الخاص","من الخاص إلى العام"],"الرأسي–الذيلي يصف تقدم النمو من الرأس إلى الأسفل. المركزي–الطرفي من الجذع إلى الأطراف، ومن العام إلى الخاص يصف الحركات الكلية قبل الدقيقة."],["L07","m","يقبض الرضيع على اللعبة بكفه كاملة قبل أن يصبح قادراً على التقاطها بإصبعين. هذا مثال على مبدأ:",["النمو يسير من العام إلى الخاص","النمو يسير بمعدل ثابت","النمو مستقل عن النضج","الفروق الفردية في النمو"],"القبض الكلي ثم الدقيق يجسد مبدأ من العام (الحركات الكلية) إلى الخاص (الحركات الدقيقة). النمو لا يسير بمعدل ثابت ولا يستقل عن النضج."],["L07","m","حاولت معلمة روضة تدريب أطفال في الثالثة على الكتابة بين السطور فلم تنجح رغم التكرار. السبب الأقرب:",["عدم اكتمال النضج العضلي الدقيق اللازم للمهارة","ضعف دافعية الأطفال","قلة التعزيز المقدم","صعوبات تعلم لدى الأطفال"],"المهارة تحتاج نضجاً في العضلات الدقيقة والتآزر لا يكتمل في هذا العمر؛ التدريب قبل النضج لا يفيد. ليست مشكلة دافعية أو تعزيز، ولا يُشخص الأطفال بصعوبات تعلم في هذه السن."],["L07","","التغير الداخلي البيولوجي الذي يحدث تلقائياً دون تدريب ويحدد استعداد الطفل للتعلم يُسمى:",["النضج","التعلم","الانتقال","التكيف"],"النضج تغير داخلي لا يحتاج خبرة، بخلاف التعلم الناتج عن الخبرة والتدريب. التكيف مصطلح بياجيه للتمثل والمواءمة."],["L07","","جميع ما يلي من مبادئ النمو ما عدا:",["يسير بمعدل واحد ثابت في جميع المراحل","يسير من العام إلى الخاص","يتأثر بتفاعل الوراثة والبيئة","مظاهره متكاملة يؤثر بعضها في بعض"],"النمو مستمر لكن بمعدلات متفاوتة: سريع في الطفولة المبكرة والمراهقة وبطيء في الطفولة المتوسطة. الباقي مبادئ صحيحة."],["L07","","جميع ما يلي من خصائص مرحلة ما قبل العمليات عند بياجيه
