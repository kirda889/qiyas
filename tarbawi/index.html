["L13","عند طرح الأسئلة الصفية على الطلاب بهدف استثارة تفكيرهم، ينبغي على المعلم أن يركز على:",["أن يكون للسؤال إجابة واحدة صحيحة.","أن يطرح السؤال بلغة صحيحة وسليمة.","الأسئلة المباشرة التي تبحث عن حقائق محددة.","الأسئلة المفتوحة التي لا تبحث عن إجابة محددة."],3,"الأسئلة المفتوحة تتعلق بمستويات التفكير العليا فتستثير التفكير. البديلان (أ، ب) من اشتراطات صياغة الأسئلة عمومًا، والأسئلة المباشرة ترتبط بمستوى الحفظ والتذكر. (المعيار 8.3)","1441"],
["L12","أي من التصنيفات الآتية يتناول المستويات العليا للأهداف النفس حركية؟",["الاستقبال - الاستجابة - التقمص.","الملاحظة - التقليد - التجريب.","الممارسة – الإتقان - الإبداع.","التقدير - التنظيم - التجسيد."],2,"الممارسة والإتقان والإبداع هي المستويات الثلاثة العليا في المجال النفس حركي. (ب) هي مستوياته الدنيا، أما (أ) و(د) فهما المستويات الدنيا والعليا للمجال الوجداني. (المعيار 10.1)","1441"],
["L14","حضر معلم الصف الرابع الابتدائي موقفًا تعرض فيه أحد الطلاب للعنف اللفظي (الشتم) لأول مرة في الفصل من قِبَل مجموعة من الطلاب. أي من الآتي تكون الخطوة الأولى التي يتخذها المعلم كتصرف مباشر في مثل هذا الموقف عامة؟",["مساعدة الطالب المعنف على تعلم المهارات الاجتماعية المناسبة لعمره.","إبلاغ الإداريين والأهل بالحادثة ليتم التدخل بالأسلوب الملائم.","إشعار الطلاب المعتدين بأن سلوكهم مرفوض وستتبعه إجراءات تأديبية.","توفير نموذج للسلوك المقبول والذي يفترض على جميع الطلاب اتباعه."],2,"الخطوة الأولى في موقف يحدث لأول مرة هي إشعار المعتدين فورًا بأن سلوكهم مرفوض لتحقيق البيئة الآمنة. (أ) و(ب) خطوتان لاحقتان، و(د) إجراء عام في لائحة السلوك لا يعالج الموقف نفسه. (المعيار 9.3)","1441"],
["L09","استخدام الخبرات السابقة في موقف تعليمي جديد يسمى:",["تعزيز التعلم.","الدافعية للتعلم.","انتقال أثر التعلم.","النضج المرافق للتعلم."],2,"انتقال أثر التعلم هو توظيف معلومات أو خبرات سابقة في أداء مهام في مواقف جديدة. التعزيز يدعم السلوك ليتكرر، والدافعية حالة داخلية تحرك السلوك نحو الهدف، والنضج تغيرات بيولوجية داخلية مع النمو. (المعيار 5.2)","1441"],
["L04","تلقى أحد معلمي الصف الأول الثانوي مكالمة هاتفية من والد أحد طلابه وقد كان منزعجًا من حادثة حصلت لابنه في فصل هذا المعلم ويرى أن ابنه تمت معاقبته بطريقة غير عادلة، فاستجاب المعلم وطلب موعدًا لمقابلة الأب للاهتمام بالمشكلة وهو يرغب في اتخاذ خطوات لضمان التواصل الفعال مع الأب والوصول إلى مقابلة مجدية. يستطيع المعلم أن يحقق هدفه من المقابلة إذا بدأها بما يأتي:",["يطلب من الأب توضيح ردة فعله التي يظن أنها الأنسب للتعامل مع الموقف.","يتيح الفرصة للأب للتعبير عن رأيه ومشاعره ووصف فهمه لما حصل.","يراجع مع الأب قوانين المدرسة والفصل التي خالفها ابنه في ذلك الموقف.","يصف للأب بالتفصيل وجهة نظره فيما يتعلق بالحادثة وأسباب ردة الفعل."],1,"الخطوة الأولى للتفاعل الإيجابي مع ولي الأمر هي السماح له بالتعبير عن رأيه ومشاعره تجاه المشكلة. البدائل (أ، ج، د) خطوات لاحقة تأتي بعد معرفة رأي ولي الأمر وخلفيته عن الموقف. (المعيار 3.2)","1441"],
["L03","يطلب المعلم في عامه الأول ـ أحيانًا ـ من زملائه الأكثر خبرة زيارته في الفصل وتقديم النقد البنّاء له. أي من الآتي تُعد أهم فائدة تحصل من هذه الطريقة؟",["تسهم في اعتياد المعلم على عملية التقويم وإحساسه بالراحة فيها.","تساعد المعلم على تعلم تطبيق المبادئ التدريسية بفاعلية في جو الفصل.","تقدم للمعلم المعرفة والخبرة بأساليب التدريس المتنوعة.","توصل لزملاء المعلم رغبته في أن يكون عضوًا فاعلًا في الفريق."],2,"المعلم الجديد يفتقر للخبرة بالأساليب التدريسية، وزيارة الزملاء له تطلعه على الأساليب الناجحة التي يستخدمونها من واقع خبراتهم. اعتياد التقويم أو إظهار الرغبة في الانتماء فوائد أقل، و(ب) لم تتضح علاقته المباشرة بالزيارة. (المعيار 2.1)","1441"],
["L05","(إن الصفوة الممتازة من مثقفي الأمة العربية مشدودة إلى مجلات ودوريات تصدر في العالم العربي وتقوم بعملية التوصيل. وسر ذلك الشد والشوق والانبهار أن تلك المجلات والدوريات تعيش واقع عصرها في تغيراته الفكرية والأدبية والفنية، فتربط قارئها بما يحقق له معنى المعاصرة والمعايشة والمتابعة، وتوقظ في المكتفي بروائع تراث أمته الشعور بالتطلع إلى الإضافة بأخذ المزية وترك المجمل). الفكرة الرئيسة في هذا النص هي:",["اهتمام المثقفين بالمجلات والدوريات.","دور المجلات والدوريات في إبراز روائع التراث.","سبب اهتمام المثقفين بالمجلات والدوريات.","انقطاع صلة المثقفين بالتراث وانبهارهم بالمجلات."],2,"النص بمجمله يفسر «سر» اهتمام المثقفين بالمجلات، فالفكرة الرئيسة هي السبب لا مجرد الاهتمام. (أ) فكرة عامة لم يتناولها النص إلا كسبب، و(ب) ليس في النص ما يدل على إبراز التراث، و(د) تعارض ما ذكره النص عن الاهتمام بالتراث. (المعيار 4.1)","1441"],

// ───────────── دليل الهيئة 1441 — الأسئلة التدريبية (1–23) ─────────────
["L09","يقوم خالد وهو طالب يدرس في الصف الأول الابتدائي بالتحدّث مع نفسه غالبًا أثناء حلّه للمسائل والأنشطة الصفيّة. هذا الحديث للنفس يُشير إلى أن الطفل:",["يستخدم إستراتيجية تساعده في توجيه عملية التفكير.","يُظهر عدم النضج الاجتماعي.","يطوّر عادة يجب علاجها إذا استمرت.","يوظّف إستراتيجية لجذب انتباه الآخرين له."],0,"الحديث الذاتي عند فيجوتسكي وسيلة ينظم بها الطفل تفكيره ويوجه سلوكه أثناء حل المشكلات، وهو طبيعي في هذه السن. اعتباره عدم نضج أو عادة تحتاج علاجًا خطأ شائع. (المعيار 5.2)","1441"],
["L13","أيٌ مما يأتي يُعَدُّ ميزة لاستخدام إستراتيجيات تدريسية متنوعة؟",["انخفاض احتمالية كره الطلاب لمواضيع أو مواد محددة.","منح المعلمين مرونة أكبر في تحضير الدروس والأنشطة.","إعطاء الطلاب فرصة لتعميم المعرفة الجديدة وتطبيقها.","تقليل شعور المعلمين بالضغط الناتج عن كثرة الموضوعات."],0,"التنويع في الإستراتيجيات يراعي أنماط الطلاب وميولهم فيقل الملل والنفور من المادة، وهذه ميزة تعود على المتعلم. (ج) ميزة الممارسة والتطبيق لا التنويع بحد ذاته، و(ب) و(د) تركزان على راحة المعلم لا على تعلم الطالب. (المعيار 8.3)","1441"],
["L11","يعرض معلم التاريخ موضوع الهجرة النبوية من خلال تصميم نشاط قائم على الأسئلة باستخدام مراكز للتعلّم موزعة في صالة الأنشطة الدراسية بحيث يمر الطلاب على كل مركز منها في مجموعات تعاونية ويقومون بالقراءة أو الاستماع للتسجيل ومشاهدة لمقاطع ورسوم متحركة، وإكمال الأنشطة والأسئلة المتعلقة بالموضوع. أثناء تطبيق هذا النوع من الأنشطة، فإن أنسب دور يمكن للمعلم تأديته هو:",["المراقب بحيث يراقب الطلاب ويقوّم تقدّمهم.","النموذج الذي يشرح للطلاب الطرق المناسبة لأداء مهامهم.","المسهل الذي يقدم الدعم والإيضاحات للطلاب عند حاجتهم لها.","المدرب الذي يحلل أداء الطلاب ويقترح طرقًا لتحسينه."],2,"في مراكز التعلم التعاونية يكون التعلم متمركزًا حول الطالب، ودور المعلم ميسّر يقدم الدعم عند الحاجة. المراقب والمدرب يركزان على التقويم والتصحيح، والنموذج الشارح يعيد المعلم إلى مركز العملية. (المعيار 7.2)","1441"],
["L14","أي الأعمال الآتية التي يؤديها المعلم يكون لها الأثر الأكبر في دعم طلاب الصف الثالث الثانوي عندما يكون أداؤهم جيدًا؟",["وضع ملصق مكتوب عليه عبارة «أحسنت» على أعمال الطلاب.","تسجيل أسماء الطلاب المكرمين أسبوعيًّا؛ لضمان عدم تجاهل أي طالب.","تقديم تعليقات إيجابية على الجوانب المميزة لديهم بشكل فردي.","خفض عدد الواجبات والمهام المطلوبة تشجيعًا لهم."],2,"التغذية الراجعة الفردية المحددة على الجوانب المميزة هي أقوى أشكال التعزيز لطلاب المرحلة الثانوية. الملصقات والقوائم الأسبوعية تعزيز عام غير محدد، وخفض الواجبات يقلل فرص التعلم. (المعيار 9.4)","1441"],
["L09","الخطوة التي يجب على المعلم اتباعها لتعزيز قدرة الطلاب على تعلّم أي مهارة من خلال أسلوب الملاحظة هي:",["تعريف الطلاب بأصعب جوانب المهارة المقصودة.","شرح ترتيب الخطوات شفهيًّا للطلاب حسب ترتيبها في المهارة.","ضمان تركيز انتباه الطلاب على الجوانب المهمة في المهارة الموضحة.","تقديم أمثلة حيّة للطلاب على تطبيقات هذه المهارة في أرض الواقع."],3,"التعلم بالملاحظة (باندورا) يقوم أساسًا على وجود نموذج حي يؤدي المهارة أمام المتعلم ليقلده، فلا تعلم بالملاحظة بلا نموذج. (ج) مغرٍ لأن الانتباه أول عمليات النمذجة، لكنه شرط عند المتعلم يأتي بعد توفير النموذج؛ و(ب) شرح لفظي لا ملاحظة. (المعيار 10.2)","1441"],
["L08","عُين أحد معلمي اللغة الإنجليزية لتدريس فصل يشتمل على عدد كبير من متعلمي اللغة الإنجليزية ذوي خلفيات لغوية متنوعة. يستطيع المعلم أن يعزز عملية التعلم لديهم على أفضل وجه عن طريق:",["جمع الطلاب ذوي المستوى المتقارب ليقدموا أنشطة في مجموعات صغيرة.","استخدام الأسئلة التي تتيح للطلاب تقديم إجابات مختصرة.","اتباع طريقة ثابتة لتقديم المفاهيم المهمة في الدرس للطلاب.","إتاحة الفرصة للطلاب ليتحدثوا عن محتوى الدرس."],0,"مراعاة الفروق الفردية تقتضي تجميع الطلاب في مجموعات متقاربة المستوى لتلقي أنشطة تناسب كل مجموعة. الإجابات المختصرة والطريقة الثابتة تتجاهل التنوع، و(د) مغرٍ لكنه لا يراعي اختلاف المستويات اللغوية. (المعيار 5.2)","1441"],
["L14","أي العوامل الآتية يجب أن يأخذها المعلم بعين الاعتبار عندما يُرتب أماكن جلوس الطلاب والأدوات في الفصل؟",["مستويات إنجاز الطلاب.","طبيعة المادة والمهارات التي سيدرسها.","أنواع الأنشطة التعليمية التي سيستخدمها المعلم.","الخلفيات الاجتماعية والثقافية للطلاب."],2,"ترتيب البيئة المادية للصف يتبع نوع النشاط (فردي، مجموعات، نقاش، عرض). الترتيب بحسب مستوى الإنجاز أو الخلفية الاجتماعية يوصم الطلاب، وطبيعة المادة أعم من أن تحدد ترتيب المقاعد. (المعيار 9.3)","1441"],
["L11","غالبًا ما يقدم أحد معلمي التاريخ مادته للطلاب على شكل قصة تقدم أوصافًا حيّة لشخصيات تاريخية ملهمة كافحت لتحقيق إنجازات عظيمة أو تصحيح أخطاء مجتمعية. أي من الجمل الآتية تصف أكثر النتائج احتمالًا عند استخدام هذه الإستراتيجية؟",["سيربط الطلاب بين فروع المادة العلمية مما يعيق فهمهم للمفاهيم الواسعة.","سيؤدي ذلك لاستخدام الطلاب لمخيلتهم وتنمية قدرتهم على تطبيق مهارات التفكير الإبداعي.","سيكون محتوى المادة أكثر سهولة للطلاب مما يزيد من استيعابهم لها.","سيصبح محتوى المادة أكثر ارتباطًا بحياة الطلاب مما يزيد من قدرتهم على تذكر المعلومات الواقعية."],3,"القصة تربط الحقائق التاريخية بحياة البشر وتجاربهم فتصبح ذات معنى وأسهل في التذكر. (ب) مغرٍ لكن الاستماع لقصة يقدمها المعلم لا ينمي التفكير الإبداعي بالضرورة، و(ج) السهولة ليست نتيجة مؤكدة. (المعيار 7.2)","1441"],
["L10","أي مما يأتي يساعد المعلم في تعزيز التفكير الإبداعي لدى طلاب المرحلة المتوسطة بعد قراءة قصة خيالية مختارة؟",["يعيد الطلاب كتابة القصة لتغيير نهايتها.","يستخدم الطلاب الإنترنت لتحديد معلومات عن الكاتب.","يرسم الطلاب صورة لبطل القصة.","يصور الطلاب مقطعَ فيديو لإعادة تمثيل أحداث مختارة من القصة."],0,"إعادة كتابة القصة بنهاية جديدة تتطلب إنتاج أفكار أصيلة وهذا جوهر الإبداع. البحث عن الكاتب استدعاء معلومات، والرسم أو التمثيل إعادة إنتاج لما في القصة لا إضافة جديدة. (المعيار 8.2)","1441"],
["L04","قام ولي أمر طالب بإرسال بريد إلكتروني لمعلم ولده، يسأله عن ابنه إن كان يعاني من صعوبات تعلم. الرد المناسب الذي ترى أنه سيقدمه المعلم في هذه الحالة هو:",["طلب موعد اجتماع بين ولي الأمر ومختص صعوبات التعلّم في المدرسة.","تقديم معلومات لولي الأمر عن خدمات تدريس الطلاب ذوي صعوبات التعلّم.","مناقشة عملية التدخلات النظامية ودور ولي الأمر في المراقبة والتقويم مع معلمه.","توصية ولي الأمر بمراقبة أداء ابنه في واجباته المدرسية وعاداته السلوكية."],0,"تشخيص صعوبات التعلم ليس من اختصاص معلم الصف، فالرد المهني إحالة ولي الأمر إلى المختص داخل المدرسة. البدائل الأخرى تفترض وجود الصعوبة قبل تشخيصها أو تقدم معلومات عامة لا تجيب عن السؤال. (المعيار 3.2)","1441"],
["L03","ما الخطوة التي تقوم بها كمعلّم جديد بعد أن قضيت الأسبوع الأول في المدرسة لتساعدك في تحسين خطتك لإدارة الصف؟",["زيارة المكتبة للاطلاع على كتب ودراسات تساعد في توجيه التعامل مع أولياء الأمور.","مناقشة الصعوبات التي تراها مع مدير المدرسة وطلب تقويم متكرر لتحسين أدائك.","مراقبة المعلمين الفاعلين في المدرسة والاستفادة من خبراتهم في دعم مهاراتك التدريسية.","التعاون مع معلمين جدد آخرين في المدرسة ومناقشة الصعوبات التي واجهوها في المدرسة."],2,"التطوير المهني الأنفع للمعلم الجديد هو التعلم من الممارسة الناجحة لزملاء ذوي خبرة في السياق نفسه. المكتبة تركز على أولياء الأمور لا الإدارة الصفية، والمعلمون الجدد لا يملكون الخبرة، ومدير المدرسة خطوة أقل مباشرة. (المعيار 2.2)","1441"],
["L04","يلتقي معلمو الصف الخامس الابتدائي بانتظام في إحدى المدارس لمناقشة الإستراتيجيات التدريسية التي تساعد الطلاب الذين لديهم صعوبة في مادة الرياضيات. الفائدة المرجوّة من هذا اللقاء مساعدة المعلمين على:",["تقديم تعليم مناسب لجميع أنواع ومستويات الطلاب.","مكافأة المعلمين الذين يستخدمون طرق تدريس فعّالة.","التأكيد على أن بعض المعلمين يستخدمون طرقًا تدريسية أفضل من غيرهم.","استشارة بعضهم بعضًا وتبادل الآراء حول إزالة الشعور بالإحباط لديهم."],0,"هذا مجتمع تعلم مهني هدفه تحسين تعلم الطلاب بتبادل الإستراتيجيات، لا المكافأة ولا المقارنة بين المعلمين. (د) يركز على مشاعر المعلمين لا على الطالب. (المعيار 3.1)","1441"],
["L04","يرغب المعلّم (خالد) في التحدّث إلى أولياء أمور طلابه ومناقشتهم وتبادل الآراء معهم حول تقدّم الطلاب في الأداء. ما أفضل طريقة يمكن للمعلّم أن يطبقها لتحقيق هدفه؟",["كتابة ملاحظات إيجابية وإرسالها لأولياء الأمور حول مدى تقدّم أبنائهم.","عقد اجتماع لمناقشة الأهداف المشتركة مع أولياء الأمور حول أداء أبنائهم.","ضمان استلام أولياء الأمور تقارير الأداء لأبنائهم وتوقيعها وإعادتها للمعلم.","إلزام الطلاب بالمحافظة على دفتر المتابعة اليومية وتوقيعه من أولياء أمورهم."],1,"الهدف «مناقشة وتبادل آراء» ولا يحققه إلا تواصل ثنائي الاتجاه كالاجتماع. الملاحظات والتقارير ودفتر المتابعة تواصل في اتجاه واحد من المعلم إلى البيت. (المعيار 3.2)","1441"],
["L14","لاحظت أثناء شرحك لدرس معيّن لطلابك عدم انتباه عدد من الطلاب ونوم أحدهم. ما التصرّف المناسب الذي تراه لمعالجة هذا الموقف؟",["تذكير الطلاب بأن عدم الانتباه للدرس سيكون له عواقب وخيمة.","التغافل عن هؤلاء الطلاب وعدم إرباك خطة سير الدرس.","عمل نشاط قصير لكسر الروتين عند الطلاب ثم العودة لشرح موضوع الدرس.","نقل أماكن جلوس الطلاب الذين لم ينتبهوا للدرس إلى المقاعد الأمامية."],2,"عدم الانتباه الجماعي مؤشر على ملل الدرس، والعلاج تغيير النشاط لاستعادة الانتباه ثم المتابعة. التهديد ونقل المقاعد يعالجان الطالب لا السبب، والتغافل يترك المشكلة. (المعيار 9.2)","1441"],
["L15","طلب أحد المعلمين من طلابه في الصف الثالث الثانوي، كجزء من تقويم الأداء لديهم، أن يكمل كل طالب نموذج طلب توظيف على موقع إلكتروني مع إرفاق سيرته الذاتية. هذا النوع من الأسلوب التقويمي يسمح للطالب بأن:",["يطبق ما تعلّمه نظريًّا على أرض الواقع.","يحدد مهاراته التقنية التي يحتاجها.","يطبق إستراتيجيات ما وراء المعرفة.","يحدد أهدافه التعليمية التي يرغب في تحقيقها من المادة."],0,"هذا تقويم أصيل (واقعي) يقيس الأداء في مهمة من الحياة الحقيقية، فميزته تطبيق المتعلَّم في الواقع. تحديد المهارات أو الأهداف أو ما وراء المعرفة ليست غاية هذه المهمة. (المعيار 10.2)","1441"],
["L14","اتبع معلم الصف الأول المتوسط خطوات معينة مع طلابه قبل أن يبدؤوا في تنفيذ مشاريعهم البحثية في مجموعات بغرض ضمان تنفيذ البحوث بسهولة. أي من الخطوات الآتية تعدّ أكثر فائدة لتحقيق هدفه؟",["الاجتماع بالطلاب في بداية العمل وعند نهايته لتقويم العمل.","عمل قائمة بالمهارات الأكاديمية اللازمة لإكمال المشروعات البحثية بنجاح.","وضع جدول يحدد أوقات الاجتماع بكل مجموعة بحثية؛ لمناقشتهم والإجابة عن أسئلتهم.","طلب المعلم من بقية زملائه معلمي الصف الأول المتوسط دمج بعض مهارات البحث في دروسهم."],2,"الهدف سهولة التنفيذ، وأكثر ما يضمنها متابعة منتظمة لكل مجموعة في جدول معلن يُجاب فيه عن أسئلتهم أثناء العمل. الاجتماع في البداية والنهاية فقط يترك فترة التنفيذ بلا دعم، وقائمة المهارات تخطيط لا متابعة. (المعيار 9.2)","1441"],
["L14","اتفق المعلمون في إحدى المدارس المتوسطة في أحد اجتماعاتهم لمناقشة مشكلة التسرّب من المدرسة، على أهمية تحديد طرق لإدارة صفوفهم بصورة أكثر فاعلية. عند مناقشة هذه المشكلة يجب على المعلمين أن يأخذوا بعين الاعتبار أن الهدف الرئيس لإدارة بيئة تعلّم طلابهم هو تنظيم:",["الأنشطة المدرسية لضمان التركيز على الأنشطة التي يبادر بها الطلاب.","الوقت في جدول يتيح للطلاب معرفة أقصى وقت يستغرقه الدرس مسبقًا.","الوقت لضمان تنفيذ أنشطة تتيح المشاركة الجماعية والفردية بالتساوي.","الأنشطة بطرق تعزز حس الطلاب الانتمائي والمشاركة في عضوية مجتمع تعلّم متعاون."],3,"التسرب مرتبط بضعف الانتماء، فالهدف الرئيس لإدارة بيئة التعلم بناء شعور الطالب بالانتماء والعضوية في مجتمع متعاون. تنظيم الوقت والأنشطة بالتساوي وسائل إجرائية لا هدف رئيس. (المعيار 8.2)","1441"],
["L13","درّب معلم اللغة العربية للصف الأول الثانوي طلابه على استخدام أساليب متنوعة للقراءة: القراءة السريعة للاطلاع، القراءة السريعة للبحث عن معلومة، القراءة لمعرفة الفكرة الرئيسة للنص، وغيرها. هذا التدريب الذي قدمه المعلم يساعد طلابه على:",["تقويم فاعلية الأساليب الأدبية في القصص الخيالية التي يدرسونها.","تعديل طريقة قراءتهم لتناسب الغرض منها للتعامل مع النصوص المختلفة.","استخدام إستراتيجيات التقويم الذاتي لتحسين مستويات القراءة.","تحليل صحة الحجج ودقة الجمل المساندة في الكتابة المقنعة لهم."],1,"كل أسلوب قراءة ذُكر مرتبط بغرض مختلف (اطلاع، بحث، فكرة رئيسة)، فالمهارة المكتسبة هي اختيار طريقة القراءة بحسب الغرض. التقويم الذاتي وتحليل الحجج ونقد الأساليب الأدبية مهارات أخرى لم يدرّب عليها. (المعيار 8.3)","1441"],
["L15","عندما يرغب المعلم في بناء اختبار تشخيصي تحريري لطلابه، فإن الهدف الأساسي من الاختبار هو أن:",["يتحدّى الطلاب في تطبيق معارفهم ومهاراتهم بطرق جديدة عليهم.","يحدّد نقاط القوة والضعف لدى الطلاب وحاجاتهم التعليمية.","يوضّح الفروق الفردية بين الطلاب فيما يتعلق بالمعارف والمهارات المستهدفة.","يقدم معلومات عن إمكانات الطلاب المستقبلية إضافة إلى إنجازاتهم الحالية."],1,"الاختبار التشخيصي يكشف نقاط القوة والضعف والحاجات قبل التدريس أو عند تعثر التعلم. إظهار الفروق الفردية وظيفة الاختبار التحصيلي معياري المرجع، والتنبؤ بالإمكانات وظيفة اختبارات الاستعداد. (المعيار 10.2)","1441"],
["L13","طلب معلم الأحياء من طلابه البحث في الإنترنت لجمع معلومات ضرورية لعمل تقارير بحثية متنوّعة. يمكن للطلاب أن يقوّموا المعلومات التي وجدوها في أحد المواقع من حيث دقتها وصحتها من خلال:",["عدد الروابط الموجودة على الموقع وسرعة تحديثها.","وجود معلومات مُعدّ الموقع وإمكانية التأكّد منها.","وضوح المعلومات المعروضة في الموقع.","تقديم المعلومات بطريقة جديّة ومنظمة."],1,"مصداقية المصدر الرقمي تُحكم بمعرفة جهة الإعداد وإمكانية التحقق منها. الوضوح والتنظيم وكثرة الروابط مظاهر شكلية لا تثبت الدقة. (المعيار 9.3)","1441"],
["L14","أي الأعمال الآتية يقوم بها المعلم لكي يضمن إيجاد بيئة إيجابية في أحد صفوف المرحلة الابتدائية التي يدرسها؟",["وضع أهداف تعليمية موحدة لجميع الطلاب.","تقديم دروس سهلة لجميع الطلاب.","إلقاء التحية على الطلاب عند دخول الفصل.","منح الطلاب حرية تكوين المجموعات أثناء الأنشطة الجماعية."],2,"البيئة الإيجابية تبدأ بعلاقة دافئة وإشعار الطلاب بالترحيب، والتحية اليومية أبسط تطبيق لذلك. الأهداف الموحدة تتجاهل الفروق، والدروس السهلة تخفض التوقعات، وحرية المجموعات قد تقصي بعض الطلاب. (المعيار 9.3)","1441"],
["L10","أكمل طلاب الصف الثالث المتوسط دراسة وحدة في مادة التاريخ عن المستكشفين الأوائل لأوروبا. أيّ من الأنشطة الآتية يساعد في إظهار أعلى مستوى لمهارة التفكير الناقد عند الطلاب؟",["وضع خط زمني لتسلسل الأحداث خلال فترة التوسع باتجاه الغرب.","إكمال اختبار قصير من فقرات الاختيار من متعدد في نهاية الوحدة.","كتابة مقال من وجهة نظر المستكشفين الأوائل في تلك الفترة.","رسم صورة تخيلية لأحد المستكشفين الأوائل في تلك الفترة."],2,"كتابة مقال من منظور شخصية تاريخية تتطلب تحليل الأحداث وتفسير دوافعها والحكم عليها، وهي مستويات عليا. الخط الزمني والاختبار القصير تذكّر وترتيب، والرسم التخيلي نشاط إبداعي لا ناقد. (المعيار 8.2)","1441"],
["L02","تلقى أحد المعلمين اتصالًا من أخصائي نفسي من عيادة خارج المدرسة يطلب فيه معلومات عن أحد طلاب الصف الأول المتوسط، ما الخطوة الأولى التي يجب على المعلم اتباعها؟",["التحدّث مع إدارة المدرسة بذلك الشأن واتباع تعليماتها.","تصوير سجلات الأداء الأكاديمي للطالب في ذلك العام وإرسالها.","استشارة معلمين آخرين لإعداد سجل غير رسمي للطالب وإرساله.","إبلاغ الطالب وأخذ إذنه بالموافقة لإرسال المعلومات المطلوبة."],0,"معلومات الطالب سرية، وأي جهة خارجية تُحال إلى إدارة المدرسة التي تملك صلاحية الإفصاح وفق اللوائح. إرسال السجلات أو إعداد سجل غير رسمي إخلال بالسرية، وإذن الطالب القاصر لا يكفي. (المعيار 1.3)","1441"],

// ───────────── دليل قياس 1436 — النماذج المشروحة ─────────────
["L08","تضم إحدى المدارس طلابًا من خلفيات متنوعة، ذات ظروف اقتصادية مختلفة، بحيث تتفاوت الخلفية المعرفية بين الطلاب بسبب اطلاع بعضهم على مصادر تعليمية وثقافية أكثر من غيرهم. في مثل هذه الظروف، ينبغي للمعلم أن يدرك أن الطلاب تزيد احتمالية اختلافهم عن بعضهم بسبب اختلاف ظروفهم الاقتصادية في الآتي:",["طرق التعلّم المفضّلة لديهم.","قدرتهم على التعلّم بشكل عام.","خلفياتهم المعرفية وخبراتهم.","دافعيتهم والتزامهم بمهام التعلّم."],2,"الظروف الاقتصادية تؤثر في توفر مصادر المعرفة ونوعيتها، فتختلف الخلفية المعرفية والخبرات. لا يوجد ارتباط مباشر مثبت بين المستوى الاقتصادي والقدرة على التعلم أو أنماط التعلم أو الدافعية. (المعيار القديم 1.3)","1436"],
["L13","قبل أن يقوم طلاب الصف الخامس بقراءة درس الزواحف في كتاب العلوم، ناقشهم المعلم حول الموضوع ووضع قائمة من الأسئلة المرتبطة بالزواحف التي يودون معرفة إجاباتها. هذه المناقشة القبلية للطلاب سوف تعزز لديهم فهم الدرس من خلال:",["تسهيل استخدام الطلاب لمهارات التفكير التحليلي.","وضع غرض واضح للقراءة وتنشيط المعرفة العامة.","زيادة استخدام الطلاب لاستراتيجيات مراقبة الذات.","تقديم مصطلحات غير معروفة لمحتوى المادة وربطها بالمفاهيم المعروفة."],1,"المناقشة القبلية وقائمة الأسئلة توجه القراءة نحو غرض محدد وتنشط المعرفة السابقة (التهيئة). الأسئلة قد تكون لحقائق لا للتحليل، ومراقبة الذات ليست مستهدفة، والمصطلحات الجديدة جزء ضيق مما تناولته المناقشة. (المعيار القديم 4.2)","1436"],
["L13","يرغب أحد المعلمين في استخدام برنامج تطبيقي جديد لأحد الأنشطة الصفيّة، لكن قبل استخدام التطبيق لأول مرّة يُستحسن أن يقوم المعلم بالآتي:",["يوضح للطلاب الغرض من استخدام البرنامج لإثارة اهتمامهم.","يجرب مميزات البرنامج المتعددة للتأكّد من أنها تعمل كما يجب.","يراجع البرنامج مع معلمين آخرين لتحديد مدى ملاءمته للطلاب.","يعيد كتابة وثيقة الدعم الفني لضمان فهم الطلاب لها بسهولة."],2,"مراجعة البرنامج مع زملاء تحكم على مناسبته للطلاب والنشاط بقرار جماعي قبل التطبيق. (ب) مغرٍ لكنه يتأكد من أن البرنامج يعمل لا من مناسبته للطلاب، و(أ) و(د) يفترضان أن البرنامج مناسب قبل التحقق. (المعيار القديم 4.3)","1436"],
["L13","أي الآتي يُعد أهم مبدأ يؤخذ بعين الاعتبار عند طرح أسئلة مهارات التحليل والتقويم على طلاب المرحلة الابتدائية؟",["أن يكون السؤال عن المعارف وله إجابة واحدة صحيحة.","أن يراعي المعلم مستوى انتباه الطلاب في الفصل وإزعاجهم.","أن يتوقع المعلم ردود فعل الطلاب ويحكم عليهم قبل أن يجيبوا على السؤال.","أن يُصاغ السؤال بأسلوب يستثير تفكير الطلبة ويحفزهم على إبداء الرأي."],3,"أسئلة التحليل والتقويم تستثير التفكير وتفتح باب الرأي والإجابات غير المتوقعة. الإجابة الواحدة تجعل السؤال معرفيًا، وتوقع الردود مسبقًا يقيد حكم المعلم، وضبط الانتباه مطلوب في كل المواقف لا في الأسئلة وحدها. (المعيار القديم 6.3)","1436"],
["L15","يستعمل أحد المعلمين عددًا من الطرق الرسمية وغير الرسمية في تقويم فهم الطلاب وتطور أدائهم أثناء تدريسه لكل وحدة دراسية. الفائدة الأساسية من هذه الطريقة في التقويم هي أنها:",["تساعد الطلاب في التقويم الذاتي وتطوير فهمهم لقدراتهم وإمكاناتهم في التعلّم.","تتيح للمعلمين مراقبة تحصيل الطلبة ومدى فاعلية تدريسهم وتعديله عند الحاجة.","تقلل من مستويات القلق لدى الطلاب من عملية التقويم الختامي.","تضمن للمعلم الحصول على بيانات أكثر لأداء الطلبة يساعده في الحكم المناسب."],1,"هذا تقويم تكويني (بنائي) وظيفته الأساسية مراقبة التقدم وتعديل التدريس أثناء الوحدة. (د) مغرٍ لكن جمع بيانات أكثر للحكم وظيفة التقويم الختامي في نهاية الوحدة، وتقليل القلق فائدة ثانوية. (المعيار القديم 7.2)","1436"],
["L14","حضر معلم الصف الرابع الابتدائي موقفًا تعرض فيه أحد الطلاب للعنف اللفظي (الشتم) من عدد من زملائه لأول مرّة في الفصل؛ فأي الآتي يمثل الخطوة الأولى للتصرف المباشر الذي يتخذه المعلم في مثل هذا الموقف؟",["تقليل احتمالية حدوث هذه المواقف، بمساعدة الطالب المتعرّض للعنف على تعلم المهارات الاجتماعية المناسبة لعمره.","تبليغ إدارة المدرسة والمرشد والأهل بالحادثة ليتدخلوا تدخلًا مباشرًا.","تنبيه الطلاب المعتدين بأن العنف مرفوض، وإذا تكرر فستكون له عواقب تأديبية.","توفير نموذج للسلوك المقبول يفترض على جميع الطلاب اتباعه."],2,"في أول حدوث للسلوك يعالج المعلم الموقف فورًا بتنبيه المعتدين وبيان خطورة التكرار. التبليغ غير مناسب لسلوك يحدث أول مرة ويمكن للمعلم علاجه بحكمته، ومساعدة الضحية وتوفير النموذج لا يعالجان الموقف الحاصل. (المعيار القديم 8.4)","1436"],
["L13","أي الإستراتيجيات التالية تعد الأكثر فاعلية في تعزيز سلوك التعاون الإيجابي بين الطلاب في أحد أنشطة المجموعات الصغيرة؟",["طلب المشاركة بين أعضاء المجموعة في المواد لإكمال المهمة.","تقويم كل عضو في المجموعة لمشاركات زملائه ودورهم في إنجاز المهمة.","إلزام كل مجموعة بتسليم منتج واحد فقط.","عمل مهام معقدة تتطلب من الأعضاء الاعتماد على بعضهم في الحصول على المعلومات."],1,"تقويم الأقران داخل المجموعة يحقق المساءلة الفردية فيشارك كل طالب فعليًا لأن زملاءه سيقوّمون دوره. طلب المشاركة بدهي لا يضمنها، والمنتج الواحد لا يمنع الاتكال، و(د) مغرٍ لكن تعقيد المهام قد ينفّر الطلاب ولا يضمن المشاركة. (المعيار القديم 9.2)","1436"],
["L04","تلقى أحد معلمي الصف الأول الثانوي مكالمة هاتفية من والد أحد طلابه، وقد كان منزعجًا من حادثة حصلت لابنه في فصل هذا المعلم، ويرى أن ابنه عوقب بشكل غير عادل، فاستجاب المعلم وطلب موعدًا لمقابلة الأب لمناقشة المشكلة، وهو يرغب في اتخاذ خطوات لضمان التواصل الفعال مع الأب والوصول إلى مقابلة مجدية. يستطيع المعلم أن يحقق هدفه من المقابلة إذا بدأها بما يلي:",["يطلب من الأب اقتراح العقوبة التي يرى أنها الأنسب للتعامل مع الموقف.","يتيح الفرصة للأب للتعبير عن رأيه ومشاعره ووصف فهمه لما حصل.","يراجع مع الأب قوانين المدرسة التي قام ابنه بمخالفتها في ذلك الموقف.","يصف المعلم وجهة نظره فيما يتعلق بالحادثة وأسباب ردة الفعل للأب بالتفصيل."],1,"الاستماع أولًا لولي الأمر يتيح فهم رأيه وتصحيح المفاهيم لدى الطرفين قبل أي نقاش. طلب اقتراح عقوبة أو مراجعة القوانين يفترض ثبوت المخالفة مسبقًا، وعرض وجهة نظر المعلم يعكس هدف المقابلة. (المعيار القديم 10.2)","1436"],
["L03","يطلب المعلم في عامه الأول أحيانًا من زملائه الأكثر خبرة الإشراف عليه في الفصل وتقديم النقد البنّاء له. أي الآتي تُعدّ أهم فائدة يحصل عليها من هذه الطريقة؟",["تساهم في اعتياده على عملية التقويم وإحساسه بأهميتها.","تساعده على تعلم تطبيق المبادئ التدريسية بفاعلية في جو الفصل الدراسي.","تقدم له المعرفة والخبرة بآراء وفلسفات متنوعة من الزملاء في التدريس.","توصل لزملائه رغبته بأن يكون عضوًا فعالًا في الفريق."],2,"غرض الزيارة الإشرافية من الزملاء هو الحصول على تغذية راجعة وخبرة متنوعة من ذوي الخبرة لتحسين الأداء في العام الأول. الاعتياد على التقويم ليس هدفًا أساسيًا، و(ب) لم تتضح علاقته المباشرة بالإشراف، و(د) قد يأتي بنتائج عكسية. (المعيار القديم 11.2)","1436"],
["L10","أي العوامل المنزلية التالية قد يكون لها الأثر الأكبر على نظرة طالب المرحلة الابتدائية لكفاءته العلمية وربما تدعمه الدراسات في هذا المجال؟",["أساليب الانضباط المتبعة في المنزل.","الترتيب بين الإخوة وطبيعة العلاقة بهم.","معتقدات الوالدين الظاهرة حول قدرات الطالب.","أنواع الألعاب في المنزل والقيمة التعليمية التي تحملها."],2,"إدراك الطفل لكفاءته (الكفاءة الذاتية) يتشكل كثيرًا من توقعات الوالدين المعلنة عن قدراته. أساليب الانضباط وترتيب الإخوة ونوع الألعاب لا تدعم الدراسات علاقة مباشرة بينها وبين نظرة الطالب لكفاءته العلمية. (المعيار القديم 1.2)","1436"],
["L05","اقرأ النص التالي: «لم يعد ينظر إلى المتعلمين على أنهم مجرد أفراد مستقبلين للمعلومات، بل على أنهم أشخاص مبدعون، يشكلون بناءهم المعرفي من خلال اتخاذ دور نشط وهادف في تفاعلهم مع بيئتهم، وقادرون على تحقيق أهداف قيمة بما تتضمنه من معارف، ومهارات، واتجاهات تمكنهم من العمل تمكنًا فاعلًا وبنّاءً تحت توجيهات وإشراف المعلم. وقد طُوّرت أساليب التقويم وممارساته؛ لتعكس هذا التوجه متحولة من التركيز الضيق على عينة محددة مختارة من سلوك الطالب إلى تناول مدى واسع من السلوك في مواقف حقيقية متنوعة داخل حجرة الدراسة وخارجها». الفكرة الرئيسة في هذا النص هي:",["الطلاب هم ركيزة الإبداع بما ينجزونه من أهداف قيمة.","المعلم بقدرته على التوجيه والإشراف والقدوة هو محل الإبداع.","أساليب التقويم وتطبيقاته حولت الاهتمام للتعلم المتمركز حول الطالب.","سلوك المواقف الحقيقية داخل حجرة الدراسة هو الموجه الحقيقي لإبداع."],0,"محور النص أن المتعلم مبدع يصنع بناءه المعرفي بنفسه، وما بعده تفاصيل تخدم هذه الفكرة. (ج) مغرٍ لأن التقويم ذُكر، لكنه جزئية جاءت لتعكس التوجه لا لتكون الفكرة، ودور المعلم والمواقف الحقيقية جزئيات كذلك. (المعيار القديم 2.1)","1436"],
["L06","يعطي معرض تجاري خصمًا مقداره 20% على بضائعه، فإذا كان سعر إحدى السلع 40 ريالًا قبل الخصم فكم سعرها بالريال بعد الخصم؟",["38","36","34","32"],3,"الخصم = 20 ÷ 100 × 40 = 8 ريالات، فالسعر بعد الخصم = 40 − 8 = 32 ريالًا. الخطأ الشائع طرح 20% كأنها 2 أو 4 ريالات فتظهر 38 أو 36. (المعيار القديم 2.4)","1436"],

// ───────────── دليل قياس 1436 — الأسئلة التدريبية (1–25) ─────────────
["L11","يعرض معلم التاريخ موضوع الهجرة النبوية من خلال تصميم نشاط قائم على الأسئلة، حيث يستخدم مراكز للتعلّم موزعة في صالة الأنشطة المدرسية، ويمر الطلاب في مجموعات تعاونية على كل مركز منها، ويقرؤون أو يستمعون إلى تسجيل أو يشاهدون مقاطع فيديو لإكمال النشاط. في أثناء تطبيق هذا النوع من النشاط، الدور المناسب للمعلم هو دور:",["المراقب، الذي يراقب الطلاب ويقوّم تقدّمهم.","المحاضر، الذي يشرح للطلاب الطرق المناسبة لأداء مهامهم.","الميسر، الذي يقدم الدعم والإيضاحات للطلاب عند حاجتهم لها.","المقوّم، الذي يحلل أداء الطلاب ويقترح الطرق لتحسينه."],2,"في التعلم بمراكز المجموعات يكون المعلم ميسّرًا يتدخل بالدعم عند الحاجة فقط. المحاضر يعيد المعلم إلى مركز الدرس، والمراقب والمقوّم يركزان على الحكم على الأداء لا على دعم التعلم أثناء النشاط. (المعيار القديم 4.1، صعوبة 0.585)","1436"],
["L04","أرسل ولي أمر طالب بريدًا إلكترونيًا إليك لكونك معلم ولده، يسألك عن رأيك في ابنه وعن صعوبات التعلّم لديه؛ فأي الاختيارات الآتية قد يكون الأنسب في الرد عليه؟",["طلب اجتماع بين ولي الأمر ومدير المدرسة والأستاذ المتخصص في صعوبات التعلّم لدى المدرسة.","تقديم معلومات جاهزة لولي الأمر عن خدمات تدريس الطلبة ذوي صعوبات التعلّم ومصادر وبرامج متنوعة وإضافية موجودة على الإنترنت.","مناقشة عملية التدخلات النظامية ودور ولي الأمر في المراقبة والتقويم معك.","توصية ولي الأمر بمراقبة أداء ابنه في واجباته المدرسية وعاداته السلوكية باستمرار."],0,"تشخيص صعوبات التعلم من اختصاص المختص، فالرد المهني هو ترتيب اجتماع يضم المختص والإدارة وولي الأمر. البدائل الأخرى تفترض وجود الصعوبة قبل تشخيصها أو تحيل ولي الأمر إلى معلومات عامة. (المعيار القديم 10.2، صعوبة 0.325)","1436"],
["L08","طُلب من أحد معلمي اللغة الإنجليزية تدريس فصل فيه طلاب ينتمون إلى ثقافات متعددة وأسر ذوات مستويات تعليمية متباينة، فأي الطرق الآتية يمكن للمعلم استخدامها لتعزيز عملية التعلم لديهم على أفضل وجه؟",["وضع الطلاب ذوي المستوى المتقارب في مجموعات تعلميّة صغيرة لأداء الأنشطة التي تناسبهم.","استخدام أساليب الأسئلة التي تتيح للطلاب ذوي الأداء المنخفض تقديم إجابات مختصرة بغض النظر عن كونها صحيحة أو غير صحيحة.","إتباع طريقة تدريس ثابتة لجميع الطلاب لتقديم المفاهيم المهمة في الدرس لهم.","إتاحة فرص متعددة للطلاب المتميزين ليتحدثوا باللغة الإنجليزية ويكتبوا ويقرؤوا عن محتوى الدرس."],0,"مراعاة الفروق تقتضي تجميعًا مرنًا بحسب المستوى مع أنشطة تناسب كل مجموعة. الطريقة الثابتة تتجاهل التنوع، وقبول إجابات خاطئة مختصرة يخفض التوقعات، و(د) يخدم المتميزين فقط. (المعيار القديم 1.3، صعوبة 0.295)","1436"],
["L15","الخطوة الأولى في إعداد الاختبار التحصيلي، هي:",["صياغة الأسئلة.","إعداد تعليمات الاختبار.","تحديد الأهداف التعليمية المراد قياسها.","تحليل محتوى المادة الدراسية المستهدفة."],2,"بناء الاختبار يبدأ بتحديد الأهداف التي سيقيسها، ثم تحليل المحتوى، ثم جدول المواصفات، ثم صياغة الفقرات والتعليمات. (د) مغرٍ لأنه مبكر أيضًا لكنه يأتي بعد تحديد الأهداف. (المعيار القديم 7.1، صعوبة 0.593)","1436"],
["L04","أي المواضيع الآتية يمكن وضعها على الموقع الإلكتروني لأحد الصفوف الدراسية ومناقشتها مع الطلاب وأولياء أمورهم على أن يُمكَّن الجميع من الوصول إليها والاطلاع على تفاصيلها؟",["تقارير فرديّة لتقدّم التعلّم للطلاب.","أخبار أنشطة الفصل ومواعيد التقويم وتسليم الواجبات.","الآراء الشخصية والمناظرات حول سياسة التعليم في المدرسة.","نتائج اختبارات المنطقة لجميع مستويات المراحل الدراسية."],1,"ما يُنشر للجميع يجب أن يكون معلومات عامة لا تمس خصوصية أحد، كأخبار الفصل والمواعيد. التقارير الفردية ونتائج الاختبارات بيانات سرية، والآراء والمناظرات حول السياسة لا تليق بموقع صفي رسمي. (المعيار القديم 10.2، صعوبة 0.408)","1436"],
["L13","أي الأساليب التالية أفضل لضمان استيعاب جميع الطلاب للدرس؟",["التنويع في طرق التدريس المتبعة.","توجيه مجموعة من الأسئلة للطلاب.","البدء بعرض المفاهيم الرئيسة للموضوع.","إعادة شرح الدرس في الحصة عدة مرات."],0,"لا يستوعب «جميع» الطلاب إلا إذا تنوعت الطرق لتناسب اختلاف أنماطهم وقدراتهم. إعادة الشرح بالطريقة نفسها لا تفيد من لم يفهم أول مرة، والأسئلة أداة تقويم لا ضمان استيعاب. (المعيار القديم 4.2، صعوبة 0.629)","1436"],
["L12","«تدريب التلاميذ على أداء العبادات أداءً صحيحًا». أي الأهداف الخاصة التالية يمكن اشتقاقه من الهدف العام السابق لتحقيقه؟",["أن يعرف الطالب الوضوء تعريفًا كاملًا.","أن يعدد الطالب أركان الوضوء وشروطه.","أن يؤدي الطالب فرض الوضوء بصورة صحيحة.","أن يذكر الطالب شواهد من القرآن والسنة على فرض الوضوء."],2,"الهدف العام مهاري (أداء العبادات)، فالهدف الخاص المشتق منه يجب أن يكون أداءً كذلك: «يؤدي». التعريف والتعديد وذكر الشواهد أهداف معرفية لا تحقق «الأداء الصحيح». (المعيار القديم 5.1، صعوبة 0.762)","1436"],
["L15","أي الآتي يُعدّ أسلوب التقويم الأكثر مناسبة لقياس مدى تمكن الطلاب من محتوى مادة الرياضيات في الصف الثاني الثانوي في الشهر الثاني؟",["اختبار تشخيصي تقدّمه إدارة التربية والتعليم.","الاختبار الذي يعده المعلم لطلابه في المدرسة.","اختبار الإنجاز المقنن الذي توفره الوزارة.","اختبارات يومية قصيرة يتضمنها كتاب الطالب."],1,"قياس التمكن من محتوى درّسه المعلم في فترة محددة يناسبه اختبار من إعداد المعلم نفسه لأنه مطابق لما دُرّس. الاختبارات المقننة والتشخيصية لا تطابق محتوى الشهر، والاختبارات اليومية القصيرة لا تغطي التمكن من المحتوى كله. (المعيار القديم 7.2، صعوبة 0.436)","1436"],
["L09","يستخدم معلم العلوم العبارة التالية: «في غرفة الفصل تسعة مصابيح صغيرة»، لمساعدة الطلاب على تذكر عدد الكواكب في مجرتنا. تُعدّ هذه العبارة مثالًا على:",["الربط بالمعايير للدرس.","ملاحظة تلخيص المحتوى.","وسيلة مراجعة للمفاهيم.","وسيلة ربط للذاكرة."],3,"العبارة وسيلة تذكرية (ربط ذاكري) من إستراتيجيات معالجة المعلومات لتسهيل الاسترجاع. (ج) مغرٍ لكن المراجعة إعادة للمحتوى، أما هنا فصورة ذهنية تربط الرقم بشيء مألوف. (المعيار القديم 1.2، صعوبة 0.739)","1436"],
["L11","إذا أردت تطبيق طريقة الاستكشاف أثناء تدريسك، فإنك تهدف إلى تدريب الطلاب على:",["تطبيق المعرفة.","اكتساب خبرات التعلم.","الحصول على المعلومات.","كيفية الوصول للمعلومات."],3,"التعلم بالاستكشاف غايته أن يتعلم الطالب «كيف» يصل إلى المعرفة بنفسه، لا أن يتلقاها جاهزة. الحصول على المعلومات نتيجة لأي طريقة، أما الاستكشاف فيدرّب على عملية الوصول. (المعيار القديم 6.5، صعوبة 0.594)","1436"],
["L10","أي الأساليب الآتية يُعدُّ مثالًا جيّدًا لتعزيز المعلم التفكير الإبداعي لدى طلاب المرحلة المتوسطة بعد قراءة قصة خيالية مختارة؟",["أن يُعيد الطلاب كتابة نهاية القطعة لتغيير نهاية القصة.","أن يستخدم الطلاب الإنترنت لتحديد معلومات عن الكاتب.","أن يرسم الطلاب صورة ثابتة لبطل القصة.","أن يصور الطلاب مقطع فيديو لإعادة تمثيل أحداث القصة."],0,"تغيير نهاية القصة إنتاج أصيل يتطلب طلاقة ومرونة وهذا جوهر الإبداع. البحث عن الكاتب تذكّر، والرسم والتمثيل إعادة إنتاج لما هو موجود. (المعيار القديم 1.2، صعوبة 0.484)","1436"],
["L11","يقدم أحد معلمي الاجتماعيات مادته الدراسية للطلاب في قصة تعطي أوصافًا حيّة لشخصيات تاريخية مؤثرة في المجتمع الإنساني. أي الجمل الآتية يصف أكثر النتائج التعلّمية التي يمكن تحققها عند استخدام هذه الإستراتيجية؟",["سوف يقوم الطلاب بالربط بين فروع المادة العلمية التفصيلية مما يعيق فهمهم للمفاهيم (الصورة) الكبيرة.","سيؤدي ذلك لاستخدام الطلاب لمخيلتهم وتنمية قدرتهم على تطبيق مهارات التفكير الإبداعي في تعلمهم.","سوف يكون وقت الدرس أكثر إمتاعًا وسيصعب ربطه بمحتوى المادة من مفاهيم وحقائق.","سيصبح محتوى المادة أكثر ارتباطًا بحياة الطلاب مما يزيد من قدرتهم على تذكر المعلومات الواقعية."],3,"القصة تجعل الحقائق ذات معنى ومرتبطة بالحياة فيسهل تذكرها. (ب) مغرٍ لكن الاستماع إلى قصة المعلم لا يدرّب على الإبداع بالضرورة، و(أ) و(ج) تفترضان نتائج سلبية غير لازمة. (المعيار القديم 4.2، صعوبة 0.622)","1436"],
["L08","أيّ الطرائق الآتية لا يُعَدّ من صور التعجيل الدراسي للموهوبين؟",["حذف بعض المواد الدراسية.","دراسة المادة في زمن أقل من المعتاد.","النقل إلى صفوف أعلى في زمن أقل.","قبولهم في سن مبكرة في المرحلة الابتدائية أو الجامعية."],0,"التعجيل يعني اجتياز المراحل أو المواد بزمن أقل (القبول المبكر، تخطي الصفوف، ضغط المنهج)، أما حذف مواد فليس تعجيلًا بل إنقاص للمحتوى. الفخ هنا صيغة النفي «لا يُعد». (المعيار القديم 1.4، صعوبة 0.641)","1436"],
["L10","أكمل طلاب الصف الثالث المتوسط دراسة وحدة في مادة الجغرافيا عن المستكشفين الأوائل لأوروبا؛ فأيّ الأنشطة الآتية يساعد في إظهار أعلى مستوى لمهارة التفكير الناقد عند الطلاب؟",["وضع خط زمني لتسلسل الأحداث خلال فترة التوسع باتجاه الغرب.","إكمال اختبار قصير من فقرات الاختيار من متعدد في نهاية الوحدة التدريسية.","كتابة مقال من وجهة نظر المستكشفين الأوائل في تلك الفترة.","رسم صورة تخيلية لأحد المستكشفين الأوائل في تلك الفترة."],2,"المقال من منظور الشخصيات يتطلب تحليل الدوافع وتفسير الأحداث وإصدار أحكام، وهي أعلى مستويات التفكير الناقد. الخط الزمني والاختبار القصير تذكّر، والرسم التخيلي إبداع لا نقد. (المعيار القديم 4.2، صعوبة 0.387)","1436"],
["L09","إذا أراد المعلم تعليم سلوك «احترام رأي الآخرين» فإن من أمثلة التعليم بالنمذجة أن:",["يمارسه.","يشرح معناه.","يحث على فعله.","يكافئ من يمارسه."],0,"النمذجة (باندورا) تعني أن يكون المعلم قدوة يؤدي السلوك أمام الطلاب ليلاحظوه ويقلدوه. الشرح والحث تلقين لفظي، والمكافأة تعزيز سلوكي لا نمذجة. (المعيار القديم 8.4، صعوبة 0.664)","1436"],
["L12","كتب أحد المعلمين اختبارًا جاء فيه (عرِّف الوضوء – عدِّد فروضه) هذا النوع من الأسئلة يقيس أهدافًا تعليمية من مستوى:",["التذكر.","التطبيق.","التحليل.","التركيب."],0,"«عرّف» و«عدّد» أفعال استرجاع للمعلومات كما حُفظت، وهي مستوى التذكر في تصنيف بلوم. التطبيق يتطلب استخدام المعرفة في موقف جديد، وهذا غير مطلوب هنا. (المعيار القديم 5.1، صعوبة 0.622)","1436"],
["L10","أي الأسئلة التالية يشجع على التفكير الإبداعي لدى الطلاب؟",["ما مكونات الماء؟","عدِّد أنواع الطاقة المتجددة؟","كيف نحافظ على سلامة البيئة؟","متى ولد النبي صلى الله عليه وسلم؟"],2,"السؤال المفتوح «كيف نحافظ…» يقبل إجابات متعددة ويستدعي توليد حلول، وهذا ما يشجع الإبداع. الأسئلة الأخرى لها إجابة واحدة محفوظة فهي في مستوى التذكر. (المعيار القديم 4.2، صعوبة 0.721)","1436"],
["L15","طلب أحد المعلمين من طلابه في الصف الثالث الثانوي أن يقوم كل طالب بإكمال نموذج طلب توظيف على موقع إلكتروني مع إرفاق سيرته الذاتية. أراد بهذا تقويم أدائهم؛ فهذا النوع من الأسلوب التقويمي يسمح للطالب بأن:",["يطبق ما تعلّمه نظريًا على أرض الواقع.","يحدد مهاراته التقنية التي يحتاج إليها.","يطبق إستراتيجيات ما وراء المعرفة.","يحدد أهدافه التعليمية التي يرغب في تحقيقها من المادة."],0,"هذا تقويم أصيل يضع الطالب في مهمة واقعية، فميزته تطبيق التعلم النظري في الواقع. (ج) مغرٍ لأن المهمة تتطلب تخطيطًا، لكن ما وراء المعرفة ليس ما يقيسه الأسلوب. (المعيار القديم 7.2، صعوبة 0.289)","1436"],
["L13","أي الآتي لا يُعَدّ من مميزات استخدام الحاسب الآلي في التعليم؟",["الجمع بين الترفيه والتعليم.","مراعاة السرعة الذاتية للتعلم.","تنمية مهارات التفاعل الاجتماعي.","اعتماد الطالب على نفسه في التعليم."],2,"التعلم بالحاسب فردي في الغالب، فمن مآخذه لا مميزاته ضعف التفاعل الاجتماعي. الترفيه والخطو الذاتي والاعتماد على النفس مميزات معروفة له. انتبه لصيغة النفي «لا يُعد». (المعيار القديم 4.3، صعوبة 0.546)","1436"],
["L14","اتبع معلم الصف الأول المتوسط خطوات معينة مع طلابه قبل البداية في تنفيذ مشاريعهم البحثية كمجموعات صغيرة لضمان تنفيذ البحوث المتفق عليها بسهولة؛ فأي الخطوات التالية يُعد الأنسب والأكثر فائدة لتحقيق هدفه قبل تنفيذ المشروع؟",["الاجتماع بمسؤول المكتبة المدرسية ومناقشة سهولة تصنيف المصادر التعليمية في المكتبة.","عمل قائمة بالمهارات التعليمية المتوقع من الطلاب اكتسابها بعد تنفيذ المشروعات البحثية بنجاح.","توزيع جدول يحدد أوقات الاجتماع بكل مجموعة بحثية ويناقشهم ويجيب على أسئلتهم.","طلب المعلم من بقية زملائه معلمي الصف الأول المتوسط مناقشة الطلاب في مشروعاتهم البحثية أثناء شرح دروسهم."],2,"سهولة التنفيذ تتحقق بجدول متابعة معلن لكل مجموعة يضمن الدعم والإجابة عن الأسئلة طوال العمل. قائمة المهارات تخطيط للنواتج لا للتنفيذ، ومسؤول المكتبة والزملاء خارج دائرة المتابعة المباشرة. (المعيار القديم 5.3، صعوبة 0.496)","1436"],
["L14","اجتمع المعلمون في إحدى المدارس المتوسطة لمناقشة مشكلة تسرّب الطلاب من المدرسة والتركيز على أهمية تنفيذ أساليب لإدارة صفوفهم بصورة أكثر فاعليّة. يجب على المعلمين عند مناقشة هذه المشكلة أن يأخذوا في الاعتبار أن الهدف الرئيس لإدارة بيئة تعلّم طلابهم هو:",["تنظيم الأنشطة المدرسية لضمان التركيز على الأنشطة التي يوجهها المعلم لطلابه.","تنظيم الوقت في جدول يتيح للطلاب معرفة أقصى وقت يستغرقه النشاط سلفًا.","تنظيم الأنشطة التي تتيح مشاركة الفصل بأكمله والمجموعات الصغيرة والتعلّم الفردي بالتساوي.","تنظيم الأنشطة بطرق تعزز حس الطلاب الانتمائي للمدرسة والمشاركة في عضوية مجتمع تعلّم متعاون هادف."],3,"علاج التسرب يبدأ من تعزيز انتماء الطالب للمدرسة وشعوره بالعضوية في مجتمع تعلم؛ هذا هو الهدف الرئيس لإدارة بيئة التعلم. تنظيم الوقت والمشاركة بالتساوي إجراءات تنفيذية لا هدف. (المعيار القديم 9.2، صعوبة 0.720)","1436"],
["L15","طلب المعلم من كل طالب أن يجمع أعماله بانتظام في حقيبة، وفي كل أسبوع يطلب من الطلاب مراجعة أعمالهم السابقة ثم إعادتها إلى مكانها داخل الصف، فما الهدف الذي يسعى إليه المعلم من هذا الطلب؟",["مشاركة الطالب زملاءه في عملية التقويم.","إتاحة النقاش بين الطلاب للمقارنة بين أعمالهم.","تقويم مستوى الطلاب في المحافظة على مقتنياتهم.","تشجيع الطالب على التأمل في أعماله ومدى تقدمه."],3,"هذا ملف الإنجاز (البورتفوليو) وغايته التأمل الذاتي في التقدم عبر مراجعة الأعمال دوريًا. المقارنة بين الطلاب أو تقويم الأقران ليست مطلوبة هنا، والمحافظة على المقتنيات ليست هدفًا تقويميًا. (المعيار القديم 7.2، صعوبة 0.651)","1436"],
["L11","يُعدّ أسلوب التعلّم الاستكشافي أداة تعليمية مناسبة لمساعدة المعلمين على تحديد الوقت الذي يضمن حصول طلابهم على فرصة في القيام بالآتي:",["تعلّم محتوى جديد بمعدّل تقدّم قياسي في الانتقال من الأسهل إلى الأكثر تعقيدًا.","الانخراط بفاعلية في عملية بناء المعرفة العلمية.","وضع أهداف تعلّم واضحة ومراقبة التقدّم في تحقيقها.","الحصول على فكرة مختصرة عن مجال واسع من المحتوى لتسهيل التعلّم فيما بعد."],0,"المفتاح الرسمي (أ): الاستكشاف الموجّه يتدرج بالطالب من البسيط إلى المعقد بمعدل يناسبه، فيحدد المعلم متى ينتقل به للمحتوى الأعلى. ⚠ المفتاح الرسمي يقول (أ)؛ الأرجح (ب) لأن جوهر التعلم الاستكشافي أن يبني الطالب المعرفة بنفسه، أما التدرج القياسي فأقرب للتعليم المبرمج. السؤال كان الأصعب في العينة (صعوبة 0.287) مما يعزز الشك في وضوحه. (المعيار القديم 4.1)","1436"],
["L08","أي العبارات الآتية تصف طالبًا نمطه المفضل في التعلم «حسي»؟",["يدرك الأنماط والعلاقات.","يهتم بالرسوم البيانية والخرائط.","يميل لحل المسائل الرياضية.","يستمتع بتركيب المجسمات."],3,"المتعلم الحسي (الحركي) يتعلم باللمس والعمل اليدوي كتركيب المجسمات. الاهتمام بالرسوم والخرائط نمط بصري، وإدراك الأنماط وحل المسائل نمط منطقي رياضي. (المعيار القديم 1.3، صعوبة 0.485)","1436"],
["L03","إذا كنت معلّمًا جديدًا وقضيت الأسبوع الأول في المدرسة؛ فما أنسب خطوة تقوم بها لتساعدك في تحسين خطتك لإدارة الصف؟",["زيارة المكتبة للاطلاع على كتب ودراسات تساعد في توجيه التعامل مع الأسر والمجتمعات الكبيرة.","مراقبة المعلمين الفعالين في المدرسة والاستفادة من خبراتهم في دعم مهاراتك التي ترغب في دعمها.","مناقشة الصعوبات التي تراها مع مدير المدرسة وطلب تقويم متكرر لتحسين أدائك التدريسي.","التعاون مع معلمين جدد آخرين في المدرسة ومناقشة الصعوبات التي واجهوها في المدرسة."],1,"التعلم من الممارسين الناجحين في المدرسة نفسها أنسب وأسرع طريق لتحسين الإدارة الصفية. المعلمون الجدد يفتقرون للخبرة، والمكتبة موجهة لأولياء الأمور لا للصف، ومدير المدرسة خيار أقل مباشرة. (المعيار القديم 10.1، صعوبة 0.556)","1436"]

function todayStr(d){d=d||new Date();const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return todayStr(d)}
function diffDays(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000)}
function fmtDate(s){try{return new Date(s+"T12:00:00").toLocaleDateString("ar-SA-u-ca-gregory-nu-latn",{day:"numeric",month:"short"})}catch(e){return s}}
function pct(a,b){return b?Math.round(a*100/b):0}

/* ---------- question bank ---------- */
const QS = (window.QB||[]).filter(r=>LBY[r[0]]).map(([l,f,q,o,e])=>{
  const id = hash(q).toString(36);
  const order = shuffle([0,1,2,3], hash(id));
  return {id,l,d:LBY[l].d,std:LBY[l].std,h:f.includes("h"),m:f.includes("m"),n:f.includes("n"),q,o:order.map(i=>o[i]),a:order.indexOf(0),e};
}).concat((window.OFFICIAL||[]).filter(r=>LBY[r[0]]).map(([l,q,o,a,e,src])=>({id:"o"+hash(q).toString(36),l,d:LBY[l].d,std:LBY[l].std,h:true,m:false,of:true,src,q,o,a,e})));
const _seen=new Set(); for(let i=QS.length-1;i>=0;i--){ if(_seen.has(QS[i].id)) QS.splice(i,1); else _seen.add(QS[i].id) }
const QBY = Object.fromEntries(QS.map(q=>[q.id,q]));
const TERMS = [];
LESSONS.forEach(l=>l.sec.forEach(s=>(s.t||[]).forEach(t=>TERMS.push({id:l.id+":"+t[0],l:l.id,t:t[0],def:t[1]||""}))));

/* fixed tests */
const STD_N = (function(){const keys=SORDER; const raw=keys.map(k=>88*STDW[k]/100); const fl=raw.map(Math.floor); const left=88-fl.reduce((a,b)=>a+b,0); raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(([_,i])=>fl[i]++); return Object.fromEntries(keys.map((k,i)=>[k,fl[i]]));})();
function buildMocks(){
  const mocks=[[],[],[]];
  SORDER.forEach((sd,si)=>{
    const inStd=q=>q.std===sd && !q.of && !q.n;
    const pool = shuffle(QS.filter(q=>inStd(q)&&q.m),101+si).concat(shuffle(QS.filter(q=>inStd(q)&&!q.m),201+si));
    pool.slice(0,STD_N[sd]*3).forEach((q,i)=>mocks[i%3].push(q.id));
  });
  return mocks.map((m,i)=>shuffle(m,301+i));
}
const MOCKS = buildMocks();
const DIAG = (function(){
  const n={V:8,K:17,P:15}; let ids=[];
  DORDER.forEach((d,di)=>{
    const pool = shuffle(QS.filter(q=>q.d===d&&!q.m&&!q.n&&!q.of&&q.h),401+di).concat(shuffle(QS.filter(q=>q.d===d&&!q.m&&!q.n&&!q.of&&!q.h),501+di));
    ids = ids.concat(pool.slice(0,n[d]).map(q=>q.id));
  });
  return shuffle(ids,601);
})();
const TESTS = {
  diag:{title:"الاختبار التشخيصي", ids:DIAG, min:40},
  official:{title:"أسئلة الدليلين الرسميين", ids:QS.filter(q=>q.of).map(q=>q.id), min:0, practice:true},
  mock1:{title:"الاختبار المحاكي 1", ids:MOCKS[0], min:90},
  mock2:{title:"الاختبار المحاكي 2", ids:MOCKS[1], min:90},

const LS_KEY = "rakhsa-tarbawi.v1";
function freshState(){return {v:1,start:todayStr(),exam:EXAM_DEFAULT,lessons:{},q:{},terms:{},tests:{},tasks:{},updatedAt:0}}

let dbRef=null, remoteBusy=false, remotePending=false, syncOn=false, saveTimer=null;
function save(){
  S.updatedAt = Date.now();
  try{localStorage.setItem(LS_KEY, JSON.stringify(S))}catch(e){}
  clearTimeout(saveTimer); saveTimer=setTimeout(pushRemote, 1200);
}
async function pushRemote(){
  if(!dbRef) return;
  if(remoteBusy){remotePending=true;return}
  remoteBusy=true;
  try{await dbRef.set(JSON.parse(JSON.stringify(S))); syncOn=true}catch(e){if(e&&e.code==="invalid_argument"){dbRef=null;syncOn=false}}
  remoteBusy=false; renderSync();
  if(remotePending){remotePending=false;pushRemote()}
}
async function pullRemote(){
  if(!dbRef) return;
  try{
    const snap = await dbRef.get();
    if(snap.exists){const r=snap.data(); if(r&&r.v===1&&(r.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(freshState(),JSON.parse(JSON.stringify(r)));try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){};render()}
      else if((S.updatedAt||0)>(r&&r.updatedAt||0)) pushRemote();}
    else if(S.updatedAt) pushRemote();
    syncOn=true; renderSync();
  }catch(e){}
}
async function initRemote(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    dbRef = db.doc("data/users/"+uid+"/progress");
    await pullRemote();
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pullRemote()});
  }catch(e){}
}

/* question stats */
function recordAnswer(id, correct){
  const st = S.q[id] || (S.q[id]={a:0,c:0});
  st.a++; if(correct) st.c++; st.last = correct?1:0;
  if(!correct){st.b=0; st.due=todayStr()}
  else if(st.b!=null){st.b=Math.min(st.b+1,5); st.due=addDays(todayStr(),INT[st.b])}
}
function reviewDue(){const t=todayStr();return QS.filter(q=>{const s=S.q[q.id];return s&&s.b!=null&&s.b<5&&s.due<=t})}
function reviewAll(){return QS.filter(q=>{const s=S.q[q.id];return s&&s.b!=null&&s.b<5})}
function mocksDone(){return ["mock1","mock2","mock3"].every(k=>S.tests[k])}
function groupStats(filter){
  const qs=QS.filter(filter); let att=0,cor=0,mast=0;
  qs.forEach(q=>{const s=S.q[q.id];if(s){att+=s.a;cor+=s.c;if(s.last===1)mast++}});
  return {total:qs.length,mast,acc:pct(cor,att),att};
}
const domainStats=d=>groupStats(q=>q.d===d);
const stdStats=sd=>groupStats(q=>q.std===sd);
function lessonStats(id){
  const qs=QS.filter(q=>q.l===id); let att=0,cor=0;
  qs.forEach(q=>{const s=S.q[q.id];if(s){att+=s.a;cor+=s.c}}); return {att,cor,acc:pct(cor,att)};
}

/* ترتيب الدروس في الخطة: حسب الوزن والصعوبة، لا حسب رقم المعيار */
const PLAN_ORDER = ["L15","L16","L09","L07","L08","L10","L12","L13","L14","L11","L02","L01","L04","L03","L06","L05"];
function planTasks(){
  return [{id:"diag",type:"test",t:"الاختبار التشخيصي",s:"40 سؤالاً من المجالات الثلاثة لقياس مستواك قبل البداية"},
          {id:"official",type:"test",t:"أسئلة الدليلين الرسميين",s:"أسئلة دليل الهيئة (1441) ودليل قياس (1436) بإجاباتها وتبريرها"}]
    .concat(PLAN_ORDER.filter(id=>LBY[id]).map(id=>{const l=LBY[id];return {id:l.id,type:"lesson",t:l.ar,s:"المعيار "+AR(l.std)+" · "+STDS[l.std]+" · "+AR(STDW[l.std])+"%",d:l.d}}))
    .concat([
      {id:"mock1",type:"test",t:"الاختبار المحاكي 1",s:"88 سؤالاً بأوزان المعايير الرسمية · 90 دقيقة"},
      {id:"rev1",type:"review",t:"مراجعة أخطاء المحاكي 1",s:"الأخطاء + فخاخ أضعف معيارين"},
      {id:"mock2",type:"test",t:"الاختبار المحاكي 2",s:"88 سؤالاً جديداً"},
      {id:"rev2",type:"review",t:"مراجعة أخطاء المحاكي 2",s:"الأخطاء + البطاقات المستحقة"},
      {id:"mock3",type:"test",t:"الاختبار المحاكي 3",s:"آخر محاكاة قبل الاختبار"},
      {id:"final",type:"final",t:"ورقة الليلة الأخيرة",s:"كل الفخاخ في صفحة واحدة + نصائح يوم الاختبار"}
    ]);
}
function taskDone(t){
  if(t.type==="lesson") return !!(S.lessons[t.id]&&S.lessons[t.id].done);
  if(t.type==="test") return !!S.tests[t.id];
  return !!S.tasks[t.id];
}
function buildPlan(){
  const tasks=planTasks();
  const span = S.exam ? Math.max(1, diffDays(S.start,S.exam)) : 30;
  const lessons=tasks.filter(t=>t.type==="lesson"), head=tasks.filter(t=>t.id==="diag"||t.id==="official"), tail=tasks.filter(t=>t.type!=="lesson"&&!head.includes(t));
  let days=[];
  if(span>=tasks.length){
    days = tasks.map(t=>[t]);
    const extra = span-tasks.length;
    for(let i=0;i<extra;i++) days.splice(days.length-6,0,[{id:"buf"+i,type:"review",t:"يوم مراجعة",s:"مراجعة الأخطاء + البطاقات المستحقة + 20 سؤالاً سريعاً"}]);
  } else {
    let tailDays = span>=12 ? tail.map(t=>[t]) : [[tail[0]],[tail[2]],[tail[4],tail[5]]];
    if(span<6) tailDays=[[tail[0],tail[5]]];
    const lessonDays=Math.max(1, span-1-tailDays.length);
    const per=Math.ceil(lessons.length/lessonDays);
    const ld=[]; for(let i=0;i<lessons.length;i+=per) ld.push(lessons.slice(i,i+per));
    days=[head].concat(ld,tailDays);
  }
  return days.map((ts,i)=>({n:i+1,date:addDays(S.start,i),tasks:ts}));
}
function nextTask(){const t=planTasks().find(t=>!taskDone(t));return t||null}

/* ---------- quiz engine ---------- */
let timerId=null;
function stopTimer(){clearInterval(timerId);timerId=null}
function startSession(o){
  session = Object.assign({i:0, ans:{}, flags:{}, done:false, confirm:false}, o);
  if(session.mode==="exam"){session.end = Date.now()+session.min*60000}
  go({name:"quiz"});
}
function quizPool(filter){
  let pool=QS.filter(filter); if(!mocksDone()) pool=pool.filter(q=>!q.m); return pool;
}
function viewQuiz(){
  const s=session; if(!s) return viewPractice();

  const q=QBY[s.ids[s.i]], n=s.ids.length, chosen=s.ans[q.id];
  const shown = s.mode==="practice" && chosen!=null;
  const opts=q.o.map((o,i)=>{let c="opt";
    if(shown){ if(i===q.a)c+=" right"; else if(i===chosen)c+=" wrong" } else if(i===chosen)c+=" sel";
    return `<button class="${c}" data-opt="${i}" ${shown?"disabled":""}><span class="b">${LET[i]}</span><span>${esc(o)}</span></button>`}).join("");
  const answered=Object.keys(s.ans).length;
  return `<section style="padding-top:6px">
   <div class="qbar"><button class="btn sm quiet" data-act="quitQuiz">إنهاء</button>

   </div>
   <div class="qnav">
     ${s.mode==="exam"?`<button class="btn sm quiet" data-act="prev" ${s.i===0?"disabled":""}>السابق</button><button class="btn sm quiet" data-act="flag">${s.flags[q.id]?"إلغاء العلامة":"علّم للمراجعة"}</button>`:"<span></span>"}
     ${s.mode==="exam"?(s.i<n-1?`<button class="btn sm" data-act="next">التالي</button>`:`<button class="btn sm" data-act="askSubmit">تسليم</button>`)
       :(shown?(s.i<n-1?`<button class="btn" data-act="next">التالي</button>`:`<button class="btn" data-act="finish">النتيجة</button>`):`<span class="small muted">اختر إجابة</span>`)}
   </div>
   ${s.mode==="exam"?`
   ${s.confirm?`<div class="confirm stack" style="margin-top:14px"><p>${n-answered?`باقي <strong>${AR(n-answered)}</strong> سؤالاً بدون إجابة.`:"أجبت على كل الأسئلة."} تسلّم الحين؟</p><div class="row"><button class="btn sm" data-act="submit">نعم، سلّم</button><button class="btn sm quiet" data-act="cancelSubmit">رجوع</button></div></div>`:""}
   <div class="sheet" style="margin-top:14px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3>ورقة الإجابة</h3><span class="small muted">${AR(answered)} من ${AR(n)}</span></div>
     <div class="grid88">${s.ids.map((id,i)=>`<button class="gq ${s.ans[id]!=null?"ans":""} ${i===s.i?"cur":""} ${s.flags[id]?"flag":""}" data-jump="${i}" aria-label="سؤال ${i+1}">${AR(i+1)}</button>`).join("")}</div>

}
function tickTimer(){
  const el=document.getElementById("timer"); if(!session||session.mode!=="exam"||session.done){stopTimer();return}
  const left=Math.max(0,session.end-Date.now()); const m=Math.floor(left/60000), sec=Math.floor(left%60000/1000);
  if(el){el.textContent=String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"); el.classList.toggle("low",left<5*60000)}
  if(left<=0){finishSession()}
}
function finishSession(){
  const s=session; if(!s||s.done) return;
  stopTimer(); s.done=true;
  let cor=0; const byD={}, byS={};
  s.ids.forEach(id=>{const q=QBY[id], a=s.ans[id], ok=a===q.a; if(ok)cor++;
    byD[q.d]=byD[q.d]||{c:0,n:0}; byD[q.d].n++; if(ok)byD[q.d].c++;
    byS[q.std]=byS[q.std]||{c:0,n:0}; byS[q.std].n++; if(ok)byS[q.std].c++;
    if(s.mode==="exam") recordAnswer(id, ok);});
  s.score=pct(cor,s.ids.length); s.cor=cor; s.byD=byD; s.byS=byS;
  if(s.kind==="test"){ S.tests[s.ref]={score:s.score,at:todayStr(),byD,byS} }
  if(s.kind==="lesson"){ const st=S.lessons[s.ref]||(S.lessons[s.ref]={}); st.done=true; st.best=Math.max(st.best||0,s.score); st.at=todayStr() }
  if(s.kind==="daily"){ S.tasks["daily:"+todayStr()]=true }
  save(); render(); window.scrollTo(0,0);
}
function viewResults(){

  const weakStd = s.mode==="exam" ? Object.entries(s.byS).map(([k,v])=>({k,p:pct(v.c,v.n),n:v.n})).filter(x=>x.n>=3).sort((a,b)=>a.p-b.p).slice(0,2) : [];
  return `<section class="stack" style="padding-top:18px">

     <div class="row"><button class="btn" data-go="home">الرئيسية</button>${wrong.length?`<button class="btn quiet" data-act="retryWrong">أعد الأسئلة الخاطئة الآن</button>`:""}${s.kind==="lesson"&&LBY[s.ref].n<LESSONS.length?`<button class="btn quiet" data-lesson="${LESSONS[LBY[s.ref].n].id}">الدرس التالي</button>`:""}</div>

/* ---------- flashcards ---------- */
let fc=null;
function startCards(lessonId){
  const t=todayStr();
  let deck = TERMS.filter(x=>lessonId?x.l===lessonId:true);
  if(!lessonId){ const read=new Set(LESSONS.filter(l=>S.lessons[l.id]&&S.lessons[l.id].done).map(l=>l.id)); if(read.size) deck=deck.filter(x=>read.has(x.l)); }
  const due=deck.filter(x=>{const s=S.terms[x.id];return !s||s.due<=t});
  fc={lesson:lessonId||null, ids:shuffle((due.length?due:deck).map(x=>x.id)).slice(0,30), i:0, flip:false, known:0};
  go({name:"cards"});
}

   <h1>ورقة الليلة الأخيرة</h1>
   <div class="sheet stack"><h3>نصائح يوم الاختبار</h3><div class="tips">${tips.map(t=>`<div class="tip"><p>${fmt(t)}</p></div>`).join("")}</div></div>
   <div class="hy">${DORDER.map(d=>`<div class="dhead"><span class="sw" style="background:var(--d${d})"></span><h2>${DOM[d].ar}</h2><span class="w">${AR(DOM[d].w)}%</span></div>`+LESSONS.filter(l=>l.d===d).map(l=>`<div class="hy-l"><h3><span class="chip">م${AR(l.sub||l.std)}</span>${esc(l.ar)}</h3><ul>${l.trap.map(t=>`<li>${fmt(t)}</li>`).join("")}</ul></div>`).join("")).join("")}</div>
   <div class="row"><button class="btn" data-act="markFinal">${S.tasks.final?"تمت مراجعتها":"أنهيت الورقة"}</button></div>
  </section>`;
}

/* ---------- settings ---------- */
function reportText(){
  let att=0,cor=0; Object.values(S.q).forEach(s=>{att+=s.a;cor+=s.c});
  const lines=["تقرير مذاكرة رخصة التربوي العام — "+todayStr(),
   "موعد الاختبار: "+(S.exam||"غير محدد"),
   "الدروس المنجزة: "+LESSONS.filter(l=>S.lessons[l.id]&&S.lessons[l.id].done).length+"/"+LESSONS.length,
   "الإجابات: "+att+" · الدقة: "+pct(cor,att)+"%",
   "الاختبارات: "+Object.entries(S.tests).map(([k,v])=>k+"="+v.score+"%").join(" ، "),
   "المعايير:"].concat(SORDER.map(sd=>{const s=stdStats(sd);return "  م"+sd+" "+STDS[sd]+": إتقان "+pct(s.mast,s.total)+"% · دقة "+s.acc+"% · محاولات "+s.att}));
  const weak=LESSONS.map(l=>({l,s:lessonStats(l.id)})).filter(x=>x.s.att>=5).sort((a,b)=>a.s.acc-b.s.acc).slice(0,5);
  lines.push("أضعف الدروس: "+(weak.map(x=>x.l.id+" "+x.l.ar+" ("+x.s.acc+"%)").join(" ، ")||"لا يوجد بعد"));
  lines.push("أخطاء في دورة المراجعة: "+reviewAll().length);
  return lines.join("\n");
}
function viewSettings(){
  return `<section class="stack" style="padding-top:18px"><h1>الإعدادات والتقرير</h1>
   <div class="sheet stack"><h3>موعد الاختبار</h3><div class="set-date"><input type="date" id="examDate" dir="ltr" lang="en" value="${S.exam||""}"><button class="btn sm" data-act="setExam">احفظ</button></div>
     <p class="small muted">الافتراضي 6 نوفمبر 2026 (أول يوم للاختبار التربوي حسب إعلان الهيئة). بداية الخطة: ${fmtDate(S.start)}. <button class="btn sm quiet" data-act="restartPlan">ابدأ الخطة من اليوم</button></p></div>
   <div class="sheet stack"><h3>تقريرك</h3><p class="small muted">انسخه واحتفظ به لتتابع تقدمك من أسبوع لأسبوع.</p>
     <textarea class="report" id="report" readonly>${esc(reportText())}</textarea><div><button class="btn sm" data-act="copyReport">انسخ التقرير</button></div></div>
   <div class="sheet stack"><h3>تصفير التقدم</h3><p class="small muted">يمسح كل الإجابات والدروس والاختبارات من هذا الجهاز.</p>
     ${resetAsk?`<div class="confirm row"><span>متأكد؟ ما تقدر ترجعه.</span><button class="btn sm" data-act="resetYes" style="background:var(--bad);border-color:var(--bad)">نعم، صفّر</button><button class="btn sm quiet" data-act="resetNo">لا</button></div>`:`<div><button class="btn sm quiet" data-act="resetAsk">تصفير…</button></div>`}</div>
   <p class="small muted">المصادر: المعايير المهنية العامة للمعلمين ومؤشراتها وأوزانها النسبية كما في الأدلة الرسمية المنشورة، والأنظمة واللوائح التعليمية المعتمدة، ومراجع علم النفس التربوي والقياس والتقويم. أسئلة البنك تدريبية محاكية لأسلوب الاختبار ومكتوبة من جديد، ونماذج الأسئلة الرسمية منقولة كما نُشرت مع ذكر مصدرها: دليل المتقدم للاختبار التربوي العام (1441هـ) ودليل الاختبار العام للمعلمين (1436هـ).</p>
  </section>`;
}
let resetAsk=false;

/* ---------- render ---------- */
function render(){
  renderNav();
  const v=document.getElementById("view");
  const r=route.name;
  v.innerHTML = r==="plan"?viewPlan(): r==="lessons"?viewLessons(): r==="lesson"?viewLesson(route.id): r==="practice"?viewPractice():
    r==="quiz"?viewQuiz(): r==="cards"?viewCards(): r==="sheet"?viewSheet(): r==="settings"?viewSettings(): viewHome();
  renderSync();
  if(r==="quiz"&&session&&session.mode==="exam"&&!session.done){ if(!timerId) timerId=setInterval(tickTimer,1000); tickTimer(); }
}
/* ---------- report a question (sent to GoatCounter as an event; hidden until configured) ---------- */
const GC_CODE = (window.SITE_CFG && window.SITE_CFG.gc) || "";
let reportOpen = null;
function reportUI(q){
  if(!GC_CODE) return "";
  if(reportOpen!==q.id) return `<button class="btn sm quiet" data-act="reportOpen" data-id="${q.id}" style="margin-top:6px">بلّغ عن خطأ في السؤال</button>`;
  return `<div class="row" style="margin-top:8px"><span class="small muted">وش المشكلة؟</span>${[["key","الإجابة غلط"],["unclear","السؤال غير واضح"],["typo","خطأ إملائي"]].map(([k,l])=>`<button class="chip" data-act="reportSend" data-id="${q.id}" data-v="${k}" style="background:none;cursor:pointer">${l}</button>`).join("")}</div>`;
}
const SITE_ID = "tarbawi";
let toastT=null;
function toast(m){let el=document.getElementById("toast"); if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)} el.textContent=m; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true},2200)}

/* ---------- events ---------- */
function openTask(id){
  const t=planTasks().find(x=>x.id===id); if(!t) return;
  if(t.type==="lesson") return go({name:"lesson",id});
  if(t.type==="test") return startTest(id);
  if(t.type==="final") return go({name:"sheet"});
  if(t.type==="review"){ S.tasks[id]=true; save(); if(reviewDue().length) return startReview(); toast("ما عندك أخطاء مستحقة. راجع البطاقات"); return startCards(null) }
}
function startTest(k){const T=TESTS[k]; if(!T.ids.length){toast("لا توجد أسئلة بعد");return} startSession({mode:T.practice?"practice":"exam",kind:"test",ref:k,title:T.title,ids:T.ids.slice(),min:T.min})}
function startReview(){const due=shuffle(reviewDue()).slice(0,30); if(!due.length){toast("ما فيه أخطاء مستحقة اليوم");return} startSession({mode:"practice",kind:"review",title:"مراجعة الأخطاء",ids:due.map(q=>q.id)})}
function startDaily(){
  const seed=hash(todayStr()); const out=[];
  SORDER.forEach((sd,i)=>{const pool=quizPool(q=>q.std===sd&&!q.of); const k=Math.max(1,Math.round(10*STDW[sd]/100)); out.push(...shuffle(pool,seed+i).slice(0,k))});
  const ids=shuffle(out,seed).slice(0,10).map(q=>q.id); if(!ids.length){toast("لا توجد أسئلة بعد");return}
  startSession({mode:"practice",kind:"daily",title:"سؤال اليوم ×10 · "+fmtDate(todayStr()),ids});
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,a"); if(!b) return;
  const ds=b.dataset;
  if(ds.go){ if(ds.go==="cards") fc=null; return go({name:ds.go}) }
  if(ds.lesson) return go({name:"lesson",id:ds.lesson});
  if(ds.std){ const l=LESSONS.find(x=>x.std===ds.std); if(l) return go({name:"lesson",id:l.id}); return }
  if(ds.openTask) return openTask(ds.openTask);
  if(ds.pr){ if(ds.pr==="hot") pr.hot=!pr.hot; else pr[ds.pr]= ds.pr==="n"?+ds.v:ds.v; return render() }
  if(ds.jump!=null){ session.i=+ds.jump; session.confirm=false; return render() }
  if(ds.opt!=null && session && !session.done){
    const q=QBY[session.ids[session.i]], i=+ds.opt;
    if(session.mode==="practice"){ if(session.ans[q.id]!=null) return; session.ans[q.id]=i; recordAnswer(q.id,i===q.a); save(); }
    else { session.ans[q.id]=i; }
    return render();
  }
  const a=ds.act; if(!a) return;
  const s=session;
  switch(a){
    case "reportOpen": reportOpen=ds.id; render(); break;
    case "reportSend":{const q=QBY[ds.id]; let ok=false; try{ if(window.goatcounter&&window.goatcounter.count){ window.goatcounter.count({path:"report/"+SITE_ID+"/"+q.l+"/"+q.id+"/"+ds.v, title:String(q.q).slice(0,140), event:true}); ok=true } }catch(e){}
      toast(ok?"شكراً، وصل البلاغ":"تعذّر إرسال البلاغ الآن"); reportOpen=null; render(); break}
    case "theme":{const n=isDark()?"light":"dark"; document.documentElement.dataset.theme=n; try{localStorage.setItem(THEME_KEY,n)}catch(e){}; renderTheme(); break}
    case "setExam":{const v=document.getElementById("examDate").value; if(!v){toast("اختر التاريخ أولاً");return} S.exam=v; if(diffDays(S.start,v)<1) S.start=todayStr(); save(); toast("حُفظ الموعد"); render(); break}
    case "restartPlan": S.start=todayStr(); save(); toast("بدأت الخطة من اليوم"); render(); break;
    case "lessonQuiz":{const ids=shuffle(QS.filter(q=>q.l===ds.id&&!q.m).map(q=>q.id)); if(!ids.length){toast("لا توجد أسئلة لهذا الدرس بعد");return} startSession({mode:"practice",kind:"lesson",ref:ds.id,title:LBY[ds.id].ar,ids}); break}
    case "lessonCards": startCards(ds.id); break;
    case "cardsAll": startCards(null); break;
    case "cardsAgain": startCards(fc&&fc.lesson); break;
    case "cardsHome": fc=null; render(); break;
    case "flip": fc.flip=!fc.flip; render(); break;
    case "cardYes": case "cardNo":{const id=fc.ids[fc.i]; const st=S.terms[id]||(S.terms[id]={b:0});
      if(a==="cardYes"){st.b=Math.min((st.b||0)+1,5); st.due=addDays(todayStr(),INT[st.b]); fc.known++} else {st.b=0; st.due=addDays(todayStr(),1)}
      fc.i++; fc.flip=false; save(); render(); break}
    case "quick":{
      const isStd=pr.dom.startsWith("s");
      let pool=quizPool(q=>!q.of&&(pr.dom==="all"||(isStd?q.std===pr.dom.slice(1):q.d===pr.dom))&&(!pr.hot||q.h));
      if(pr.dom==="all"&&!pr.hot){ const out=[]; SORDER.forEach(sd=>{const n=Math.max(1,Math.round(pr.n*STDW[sd]/100)); out.push(...shuffle(pool.filter(q=>q.std===sd)).slice(0,n))}); pool=out }
      const ids=shuffle(pool).slice(0,pr.n).map(q=>q.id); if(!ids.length){toast("ما فيه أسئلة بهذا الفلتر");return}
      startSession({mode:"practice",kind:"quick",title:"تدريب سريع",ids}); break}
    case "daily": startDaily(); break;
    case "review": startReview(); break;
    case "test": startTest(ds.id); break;
    case "next": s.i=Math.min(s.i+1,s.ids.length-1); s.confirm=false; render(); window.scrollTo(0,0); break;
    case "prev": s.i=Math.max(0,s.i-1); s.confirm=false; render(); break;
    case "flag":{const id=s.ids[s.i]; s.flags[id]=!s.flags[id]; render(); break}
    case "askSubmit": s.confirm=true; render(); break;
    case "cancelSubmit": s.confirm=false; render(); break;
    case "submit": case "finish": finishSession(); break;
    case "quitQuiz": if(s&&s.mode==="exam"&&!s.done){ if(!s.confirm){s.confirm=true;render();toast("سلّم الاختبار أو ارجع له");return} } stopTimer(); session=null; go({name:"practice"}); break;
    case "retryWrong":{const ids=s.ids.filter(id=>s.ans[id]!==QBY[id].a); startSession({mode:"practice",kind:"retry",title:"إعادة الأخطاء",ids:shuffle(ids)}); break}
    case "markFinal": S.tasks.final=true; save(); toast("ممتاز"); render(); break;
    case "copyReport":{const t=reportText(); const ta=document.getElementById("report");
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("نُسخ التقرير")).catch(()=>{ta.focus();ta.select();toast("حدّد النص وانسخه")}); break}
    case "resetAsk": resetAsk=true; render(); break;
    case "resetNo": resetAsk=false; render(); break;
    case "resetYes": resetAsk=false; S=freshState(); save(); toast("تم التصفير"); go({name:"home"}); break;
  }
});
document.addEventListener("keydown",e=>{
  if(route.name!=="quiz"||!session||session.done) return;
  const k=e.key.toUpperCase(); const map={A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3,"1":0,"2":1,"3":2,"4":3};
  if(k in map && !e.metaKey && !e.ctrlKey){const btn=document.querySelector(`[data-opt="${map[k]}"]`); if(btn&&!btn.disabled) btn.click()}
  if(e.key==="Enter"){const nb=document.querySelector('[data-act="next"],[data-act="finish"]'); if(nb) nb.click()}
});

/* ---------- boot ---------- */
function start(data){
  if(data&&data.session){session=data.session; if(data.route) route=data.route}
  else if(data&&data.route) route=data.route;
  if(data&&data.fc) fc=data.fc;
  render(); initRemote(); try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({route,session,fc}));
if(hot&&hot.ready) hot.ready(start); else start(hot&&hot.data||{});
})();
