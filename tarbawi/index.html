["L16","","عند تحليل فقرة تبين أن مشتتاً اختاره طلاب الفئة العليا أكثر من الدنيا. التفسير الأرجح:",["المشتت غامض أو يحتمل أن يكون إجابة صحيحة ثانية فيجب مراجعته","المشتت ممتاز ويؤدي وظيفته","الفقرة سهلة جداً","الفئة العليا لم تذاكر"],"إذا انجذب المتفوقون إلى بديل خاطئ فغالباً أن في البديل أو المقدمة غموضاً أو إجابة صحيحة جزئياً، فتُراجع الفقرة."],
["L16","m","فقرة أجاب عنها جميع طلاب الصف إجابة صحيحة. معامل صعوبتها ومعامل تمييزها على الترتيب:",["1 وصفر","صفر و1","0.5 و0.5","1 و1"],"الصعوبة = الكل ÷ الكل = 1 (سهلة جداً)، والتمييز = (العليا − الدنيا) ÷ العدد = صفر لأن الفئتين أجابتا بالتساوي. الفقرات شديدة السهولة لا تميز."],
["L16","","المدى المقبول لمعامل الصعوبة في الفقرات الجيدة عادة:",["من 0.20 إلى 0.80 والمثالي قرب 0.50","من 0.90 إلى 1.00","من صفر إلى 0.10","من 0.95 فأعلى"],"الفقرات شديدة السهولة (فوق 0.80) أو شديدة الصعوبة (دون 0.20) لا تميز جيداً، والمعامل الأمثل للتمييز الأقصى حول 0.50."],
["L16","h","معامل تمييز فقرة 0.25. الحكم المناسب:",["فقرة تحتاج إلى تعديل","فقرة ممتازة","فقرة جيدة تُقبل كما هي","تُحذف فوراً"],"التمييز 0.20 إلى 0.29 يعني فقرة ضعيفة تُراجع وتُعدَّل. 0.40 فأعلى ممتاز، و0.30 إلى 0.39 جيد، وأقل من 0.20 أو السالب يُحذف."],
["L16","","في مجموعتين قوام كل منهما 25 طالباً، أجاب عن الفقرة 18 من العليا و8 من الدنيا. معامل الصعوبة بطريقة المجموعتين:",["0.52","0.40","0.72","0.32"],"الصعوبة = (18 + 8) ÷ (25 + 25) = 26 ÷ 50 = 0.52، فقرة متوسطة. الرقم 0.40 هو معامل التمييز للفقرة نفسها."],
["L16","m","العلاقة بين معامل الصعوبة ومعامل التمييز توصف بأن:",["الفقرات متوسطة الصعوبة تتيح أعلى تمييز ممكن","الفقرات شديدة الصعوبة أعلى تمييزاً دائماً","الفقرات شديدة السهولة أعلى تمييزاً دائماً","لا علاقة بينهما إطلاقاً"],"حين تكون الصعوبة قرب 0.50 يمكن أن يكون الفرق بين الفئتين أكبر ما يمكن. أما الفقرات التي يجيب عنها الجميع أو لا يجيب عنها أحد فتمييزها يقترب من الصفر."],
["L16","","إذا كان معامل السهولة لفقرة 0.65، فإن نسبة الطلاب الذين أخطؤوا فيها:",["35%","65%","0.65 من طالب","50%"],"معامل السهولة هو نسبة المصيبين (65%)، ومجموع نسبة المصيبين والمخطئين = 1، فالمخطئون = 1 − 0.65 = 0.35 أي 35%."],
["L16","hm","لحساب النسبة المئوية لتحصيل طلاب الصف في اختبار، يحتاج المعلم كل ما يأتي ما عدا:",["عدد الفصول في المدرسة","عدد طلاب الصف","درجات الطلاب","الدرجة الكلية للاختبار"],"نسبة التحصيل = مجموع درجات الطلاب ÷ (عدد الطلاب × الدرجة الكلية) × 100. عدد الفصول في المدرسة لا يدخل في المعادلة."],
["L16","","عند تحليل فقرات الاختبار بطريقة المجموعتين الطرفيتين في صف كبير، تُؤخذ:",["أعلى 27% وأدنى 27% من الأوراق بعد ترتيبها","أعلى 50% وأدنى 50%","أول 10 أوراق وآخر 10 أوراق بترتيب التسليم","الأوراق كلها دون ترتيب"],"النسبة المعتمدة للمجموعتين الطرفيتين 27% من كل طرف بعد الترتيب التنازلي بالدرجة؛ وفي الصفوف الصغيرة يُقسم الصف نصفين."],
// --- الإحصاء الوصفي ---
["L16","h","المتوسط الحسابي للدرجات: 1، 11، 6، 10 يساوي:",["7","6","8","28"],"المتوسط = مجموع القيم ÷ عددها = (1 + 11 + 6 + 10) ÷ 4 = 28 ÷ 4 = 7. الرقم 28 هو المجموع لا المتوسط."],
["L16","hm","الوسيط للأعداد: 8، 4، 14، 5 يساوي:",["6.5","4.5","8","7.75"],"نرتب: 4، 5، 8، 14. العدد زوجي فالوسيط = متوسط العددين الأوسطين = (5 + 8) ÷ 2 = 6.5. الرقم 7.75 هو المتوسط الحسابي."],
["L16","h","المنوال لدرجات الطلاب: 7، 9، 5، 12، 7، 9، 7 هو:",["7","9","12","8"],"المنوال هو القيمة الأكثر تكراراً؛ 7 تكررت ثلاث مرات و9 مرتين. المتوسط هنا 8 وليس المنوال."],
["L16","hm","المدى لمجموعة الدرجات: 5، 4، 7، 9، 6، 5، 10، 8، 4 يساوي:",["6","10","4","9"],"المدى = أكبر قيمة − أصغر قيمة = 10 − 4 = 6. الأرقام 10 و4 هما الطرفان لا المدى."],
["L16","h","إذا كان تباين درجات صف 81 فإن الانحراف المعياري يساوي:",["9","81","40.5","3"],"الانحراف المعياري = الجذر التربيعي للتباين = جذر 81 = 9. الخطأ الشائع تكرار التباين أو قسمته على 2."],
["L16","","إذا كان الانحراف المعياري لدرجات صف 4 فإن التباين يساوي:",["16","2","4","8"],"التباين = مربع الانحراف المعياري = 4 × 4 = 16. الجذر (2) والضعف (8) إجابات خاطئة شائعة."],
["L16","hm","كم يزيد المدى عن المنوال في البيانات: 7، 9، 5، 12، 7؟",["صفر","5","2","7"],"المدى = 12 − 5 = 7، والمنوال = 7 (الأكثر تكراراً). الفرق = 7 − 7 = صفر."],
["L16","m","أضاف المعلم 5 درجات لكل طالب في الصف. أثر ذلك على المتوسط والانحراف المعياري:",["يزيد المتوسط 5 درجات ولا يتغير الانحراف المعياري","يزيد كل منهما 5 درجات","لا يتغير المتوسط ويزيد الانحراف 5","يتغير كل منهما بنسبة 5%"],"إضافة ثابت تنقل كل الدرجات بالمقدار نفسه فيزيد المتوسط بالثابت، لكن المسافات بين الدرجات لا تتغير فيبقى الانحراف المعياري كما هو."],
["L16","h","عند وجود درجات متطرفة والتوزيع شديد الالتواء، فإن مقياس النزعة المركزية الأنسب:",["الوسيط","المتوسط الحسابي","المدى","الانحراف المعياري"],"الوسيط لا يتأثر بالقيم المتطرفة لأنه يعتمد الترتيب لا القيم، بخلاف المتوسط الذي تجرّه المتطرفات. المدى والانحراف مقاييس تشتت لا نزعة مركزية."],
["L16","","أفضل مقياس نزعة مركزية لوصف بيانات نوعية (اسمية) مثل الأنماط التعليمية المفضلة لدى الطلاب:",["المنوال","المتوسط الحسابي","الوسيط","التباين"],"البيانات الاسمية لا تُجمع ولا تُرتب فلا يمكن حساب متوسط أو وسيط، ويبقى المنوال (الفئة الأكثر تكراراً) هو المناسب."],
["L16","m","صفان لهما المتوسط نفسه (70)، الانحراف المعياري للصف الأول 3 وللثاني 12. الاستنتاج الصحيح:",["الصف الأول أكثر تجانساً في مستوى طلابه","الصف الثاني أكثر تجانساً","الصفان متساويان في التجانس","الصف الثاني أعلى تحصيلاً"],"الانحراف المعياري يقيس التشتت حول المتوسط؛ وصغره يعني تقارب الدرجات (تجانس). المتوسط المتساوي يعني تحصيلاً متقارباً لا تفوق أحدهما."],
["L16","","إذا كان الانحراف المعياري لدرجات مجموعة يساوي صفراً فهذا يعني أن:",["جميع الدرجات متساوية","المتوسط يساوي صفراً","نصف الدرجات فوق المتوسط","التوزيع ملتوٍ التواءً موجباً"],"الانحراف صفر يعني أن كل الدرجات تساوي المتوسط فلا تشتت. لا علاقة بقيمة المتوسط ولا بالالتواء."],
["L16","","الرسم البياني الأنسب لعرض توزيع درجات الطلاب على فئات متتالية هو:",["المدرج التكراري","الرسم الدائري","الخط البياني الزمني","الرسم الشجري"],"المدرج التكراري يعرض تكرار كل فئة من الدرجات ويبين شكل التوزيع. الدائري للنسب من كل، والخطي للتغير عبر الزمن."],
["L16","m","في جدول تكراري لدرجات 40 طالباً: 10 طلاب في الفئة 50 إلى 59، و12 في 60 إلى 69، و11 في 70 إلى 79، و7 في 80 إلى 89. عدد الطلاب الذين حصلوا على 70 فأكثر:",["18","11","22","7"],"الطلاب في 70 إلى 79 عددهم 11، وفي 80 إلى 89 عددهم 7؛ المجموع = 18. الرقم 22 هو من حصلوا على أقل من 70."],
["L16","","الوسيط للدرجات: 3، 9، 7، 12، 5 يساوي:",["7","9","12","7.2"],"نرتب: 3، 5، 7، 9، 12؛ العدد فردي (5 قيم) فالوسيط القيمة الوسطى الثالثة = 7. الرقم 7.2 هو المتوسط الحسابي."],
["L16","hm","المتوسط الحسابي لدرجات خمسة طلاب: 70، 80، 90، 100، 60 يساوي:",["80","75","90","85"],"المجموع = 70 + 80 + 90 + 100 + 60 = 400، والمتوسط = 400 ÷ 5 = 80."],
["L16","","أي مقاييس التشتت الآتية أكثر تأثراً بالقيم المتطرفة؟",["المدى","الانحراف المعياري","التباين","الانحراف الربيعي"],"المدى يعتمد على قيمتين فقط هما الطرفان، فأي قيمة متطرفة واحدة تغيره كلياً؛ بينما الانحراف المعياري والتباين يعتمدان على كل القيم."],
// --- المنحنى الاعتدالي والالتواء والدرجات المعيارية والارتباط ---
["L16","h","في التوزيع الاعتدالي تكون العلاقة بين المتوسط والوسيط والمنوال:",["متساوية","المتوسط أكبر من الوسيط والمنوال","المنوال أكبر من المتوسط","الوسيط أكبر من المتوسط"],"التوزيع الاعتدالي متماثل فتتطابق مقاييس النزعة المركزية الثلاثة في مركزه. تفاوتها يدل على التواء."],
["L16","hm","في التوزيع الاعتدالي، نسبة الدرجات الواقعة بين انحراف معياري واحد تحت المتوسط وانحراف واحد فوقه تقريباً:",["68%","95%","50%","34%"],"القاعدة 68 و95 و99.7: 68% ضمن انحراف واحد، 95% ضمن انحرافين، 99.7% ضمن ثلاثة. 34% هي النسبة بين المتوسط وانحراف واحد في جهة واحدة فقط."],
["L16","","في توزيع اعتدالي متوسطه 60 وانحرافه 5، نسبة الطلاب الذين تزيد درجاتهم عن 70 تقريباً:",["2.5%","5%","16%","34%"],"70 تبعد انحرافين فوق المتوسط. 95% من الدرجات ضمن انحرافين، فالباقي 5% موزعة على الطرفين، أي 2.5% فوق 70."],
["L16","m","في توزيع اعتدالي متوسطه 50 وانحرافه 10، نسبة الطلاب الذين تقع درجاتهم بين 50 و60 تقريباً:",["34%","68%","16%","50%"],"الفترة من المتوسط إلى انحراف واحد فوقه تضم نصف الـ68% أي 34%. 16% هي نسبة من تزيد درجاتهم عن 60."],
["L16","h","إذا كان توزيع درجات اختبار ملتوياً التواءً سالباً فهذا يدل على أن:",["معظم الدرجات مرتفعة والاختبار سهل","معظم الدرجات منخفضة والاختبار صعب","الدرجات موزعة بالتساوي","المتوسط أكبر من الوسيط"],"في الالتواء السالب يتكدس الطلاب في الطرف الأعلى ويمتد الذيل نحو الدرجات المنخفضة، فالمتوسط أصغر من الوسيط والاختبار سهل. بعض مفاتيح الملخصات المتداولة تعكس المعنى، والصحيح أن الإشارة تتبع اتجاه الذيل."],
["L16","hm","متوسط درجات صف 60 ووسيطها 70. شكل التوزيع وتفسيره:",["التواء سالب، معظم الدرجات مرتفعة","التواء موجب، معظم الدرجات منخفضة","توزيع اعتدالي","لا يمكن الحكم"],"المتوسط أصغر من الوسيط يعني أن قيماً متطرفة منخفضة جرّت المتوسط لأسفل بينما أغلب الطلاب فوقه؛ وهذا التواء سالب (اختبار سهل)."],
["L16","","في اختبار كان المتوسط 45 والوسيط 35 والمنوال 30. الاستنتاج:",["التوزيع ملتوٍ التواءً موجباً والاختبار صعب","التوزيع ملتوٍ التواءً سالباً والاختبار سهل","التوزيع اعتدالي","الاختبار متوسط الصعوبة تماماً"],"المتوسط أكبر من الوسيط أكبر من المنوال: الذيل نحو اليمين والتكدس عند الدرجات المنخفضة؛ التواء موجب يدل على اختبار صعب."],
["L16","h","درجات طالب في الاجتماعيات 41 وفي العلوم 35، ومتوسط صفه في المادتين 35 و25، والانحراف المعياري 3 و5 على الترتيب. الاستنتاج الصحيح عن أدائه النسبي مقارنة بصفه:",["أداؤه متساوٍ في المادتين","أداؤه في الاجتماعيات أفضل","أداؤه في العلوم أفضل","لا يمكن المقارنة بين المادتين"],"الدرجة المعيارية في الاجتماعيات = (41 − 35) ÷ 3 = 2، وفي العلوم = (35 − 25) ÷ 5 = 2. التساوي في ز يعني أداءً نسبياً متساوياً رغم اختلاف الدرجات الخام."],
["L16","hm","حصل طالب على 70 في اختبار متوسطه 60 وانحرافه المعياري 5. درجته المعيارية (ز):",["2","10","1.4","−2"],"ز = (الدرجة − المتوسط) ÷ الانحراف = (70 − 60) ÷ 5 = 10 ÷ 5 = 2. الرقم 10 هو الفرق قبل القسمة."],
["L16","","طالب درجته المعيارية ز = −1. درجته التائية (ت):",["40","60","49","−10"],"ت = 50 + 10 × ز = 50 + 10 × (−1) = 50 − 10 = 40. الدرجة التائية تتخلص من الإشارة السالبة وتبقي المعنى (دون المتوسط بانحراف واحد)."],
["L16","m","حصل طالب على 80 في العربي (المتوسط 70 والانحراف 10) وعلى 65 في الرياضيات (المتوسط 50 والانحراف 5). أداؤه الأفضل مقارنة بزملائه في:",["الرياضيات لأن ز = 3 مقابل ز = 1","العربي لأن درجته الخام أعلى","المادتين بالتساوي","لا يمكن الحكم دون الدرجة الكلية"],"العربي: ز = (80 − 70) ÷ 10 = 1. الرياضيات: ز = (65 − 50) ÷ 5 = 3. الدرجة الخام الأعلى لا تعني أداءً نسبياً أفضل؛ المقارنة الصحيحة بالدرجة المعيارية."],
["L16","","الدرجة المعيارية (ز) لها متوسط وانحراف معياري يساويان على الترتيب:",["صفر و1","50 و10","100 و15","1 وصفر"],"ز توزيع متوسطه صفر وانحرافه 1. المتوسط 50 والانحراف 10 للدرجة التائية، و100 و15 لنسبة الذكاء الانحرافية."],
["L16","hm","رتبة طالب المئينية في اختبار 90. هذا يعني أن:",["درجته أعلى من درجات 90% من المجموعة","أجاب عن 90% من الأسئلة إجابة صحيحة","حصل على 90 درجة من 100","أداؤه أقل من 90% من المجموعة"],"الرتبة المئينية موقع نسبي بين الأقران: 90% من الطلاب دونه. لا تعبر عن نسبة الإجابات الصحيحة ولا عن الدرجة الخام."],
["L16","h","معامل الارتباط بين درجات الطلاب في مادتين 0.65. وصف العلاقة:",["متوسطة موجبة","قوية موجبة","ضعيفة موجبة","متوسطة سالبة"],"القيمة بين 0.3 و0.7 تُعد متوسطة، والإشارة الموجبة تعني علاقة طردية. فوق 0.7 قوية ودون 0.3 ضعيفة."],
["L16","hm","معامل الارتباط بين عدد الغيابات ودرجات الطلاب −0.9. تفسيره:",["علاقة قوية عكسية: كلما زاد الغياب انخفضت الدرجات","علاقة ضعيفة لأن الإشارة سالبة","لا توجد علاقة","علاقة قوية طردية"],"القيمة المطلقة 0.9 تدل على قوة العلاقة، والإشارة السالبة على اتجاهها العكسي. الإشارة لا تعبر عن الضعف أبداً."],
["L16","h","معامل الارتباط بين درجات الطلاب في اختبارين 0.2. الاستنتاج:",["العلاقة بين الاختبارين ضعيفة","العلاقة قوية بين المادتين","الاختبارات تمتاز بالصدق والثبات","الاختباران شديدا السهولة"],"0.2 قيمة منخفضة تدل على ارتباط ضعيف. لا يمكن استنتاج الصدق أو الثبات أو السهولة من ارتباط درجات اختبارين مختلفين."],
["L16","","وجد معلم ارتباطاً قوياً (0.85) بين درجات القراءة ودرجات العلوم لدى طلابه. الاستنتاج غير الصحيح:",["تحسين القراءة هو سبب تفوق الطلاب في العلوم","الطلاب المتفوقون في القراءة يميلون للتفوق في العلوم","العلاقة بين المتغيرين طردية قوية","يمكن التنبؤ بدرجة العلوم من درجة القراءة بدرجة جيدة"],"الارتباط يصف العلاقة ولا يثبت السببية؛ قد يكون وراء الاثنين عامل ثالث كالقدرة العامة أو الدافعية. أما الاتجاه والقوة والتنبؤ فاستنتاجات مشروعة."],
["L16","m","يتراوح معامل الارتباط بين:",["−1 و+1","صفر و1","صفر و100","−100 و+100"],"معامل الارتباط قيمة بين −1 (عكسي تام) و+1 (طردي تام)، والصفر يعني انعدام العلاقة الخطية."],
["L16","","حصل طالب على درجة معيارية ز = 1.5 في اختبار متوسطه 50 وانحرافه 8. درجته الخام:",["62","58","51.5","65"],"الدرجة الخام = المتوسط + ز × الانحراف = 50 + 1.5 × 8 = 50 + 12 = 62."],
["L16","","اختباران طُبقا على الصف نفسه وكان معامل الارتباط بين درجاتهما 0.95. الاستنتاج الصحيح:",["وجود علاقة قوية بين أداء الطلاب في الاختبارين","أن 95% من الطلاب نجحوا في الاختبارين","أن معامل صعوبة الاختبارين 0.95","أن الاختبارين متطابقان في الأسئلة"],"الارتباط 0.95 يعني أن ترتيب الطلاب في الاختبارين متقارب جداً. لا يخبرنا عن نسبة النجاح ولا الصعوبة ولا تطابق الأسئلة."],
["L16","m","طالب درجته التائية 65. موقعه بالنسبة لمجموعته:",["أعلى من المتوسط بانحراف ونصف","أدنى من المتوسط بانحراف ونصف","عند المتوسط تماماً","أعلى من المتوسط بـ 65 درجة"],"ت = 50 + 10ز، فإذا كانت ت = 65 فإن ز = (65 − 50) ÷ 10 = 1.5، أي فوق المتوسط بانحراف ونصف."],
// --- توظيف النتائج ---
["L16","hm","التوقيت الأفضل لتقديم التغذية الراجعة للطلاب عن أدائهم في اختبار:",["في أقرب وقت ممكن بعد الاختبار، في الحصة التالية له","في نهاية الفصل الدراسي مع الدرجات النهائية","قبل الاختبار الختامي بيوم","بعد شهر عندما تكتمل الاختبارات كلها"],"التغذية الراجعة تؤثر أكثر كلما قربت من الأداء، وأقصاها الحصة التالية للاختبار كما في الملخصات المتداولة. تأخيرها حتى نهاية الفصل أو شهراً يفقدها وظيفتها التصحيحية."],
["L16","h","أي الآتي يصف تغذية راجعة فعالة؟",["وصفية محددة تركز على المهمة وتوجه الطالب إلى الخطوة التالية","ثناء عام مثل «ممتاز، استمر»","قائمة بنقاط الضعف فقط","مقارنة الطالب بزملائه المتفوقين"],"التغذية الراجعة الفعالة تخبر الطالب بما أصاب وما أخطأ وكيف يتحسن. الثناء العام لا يوجه، والاقتصار على الضعف يحبط، والمقارنة بالأقران تركز على الترتيب لا التعلم."],
["L16","hm","بعد تحليل نتائج الاختبار تبين أن ثلث الطلاب أخفقوا في مهارة محددة بينما أتقنها الباقون. الإجراء الأنسب:",["برنامج علاجي للمخفقين وأنشطة إثرائية للمتقنين","إعادة الوحدة كاملة للصف","الانتقال إلى الوحدة التالية مباشرة","إعادة الاختبار نفسه للجميع"],"توظيف النتائج يعني استجابة متمايزة: علاج موجه لمن أخفق وإثراء لمن أتقن. إعادة الوحدة تهدر وقت المتقنين، والتجاهل أو إعادة الاختبار لا يعالج."],
["L16","","بعد اطلاع معلم الأول الثانوي على النتائج المتدنية لطلابه في اختبار الشهر الأول، الإجراء الأول الذي ينبغي أن يقوم به:",["تحليل النتائج لتحديد مواطن الضعف ثم تعديل التدريس","إعادة الاختبار في الأسبوع التالي","توبيخ الطلاب على إهمالهم","تخفيض مستوى الاختبار القادم"],"التدني العام يستدعي تشخيص الأسباب أولاً (الفقرات، المهارات، طريقة التدريس) ثم التعديل. إعادة الاختبار أو التوبيخ أو التسهيل لا تعالج السبب."],
["L16","m","الهدف الأساسي من تقرير نتائج الطالب الذي يُرسل إلى ولي الأمر:",["توضيح مستوى الطالب وتقدمه وما يحتاجه من دعم","إبراز جهود المعلم والمدرسة","تحقيق مبدأ الثواب والعقاب","مقارنة الطالب بالمتفوقين في صفه"],"التقرير وسيلة شراكة مع الأسرة لدعم تعلم الطالب، فيركز على مستواه وتقدمه وحاجاته. إبراز جهود المعلم يركز على المعلم، والعقاب والمقارنة لا يخدمان التعلم."],
["L16","","الغرض الأساسي لتحليل المعلم نتائج اختباره:",["تحسين التدريس وتعديل الخطة في ضوء مواطن الضعف والقوة","رصد الدرجات في النظام فقط","ترتيب الطلاب لإعلان المتفوقين","تبرير الدرجات أمام الإدارة"],"التحليل يكشف الفقرات الضعيفة والمهارات غير المتقنة فيوجه قرارات التدريس. الرصد والترتيب والتبرير نواتج ثانوية لا تمثل الغرض الأساسي."],
["L16","hm","تغذية راجعة تذكر للطالب ما أصاب فيه وما أخطأ وتوجهه إلى ما يفعله لتحسين أدائه في المحاولة التالية توصف بأنها تغذية راجعة:",["تكوينية (بنائية)","ختامية","معيارية","انطباعية"],"التغذية الراجعة التي تقود إلى تحسين مستقبلي جزء من التقويم التكويني. الختامية تكتفي بالحكم، والمعيارية تقارن بالآخرين، والانطباعية عامة غير محددة."],
["L16","","عند كتابة تغذية راجعة مكتوبة على ورقة الطالب ينبغي أن:",["تكون بلغة بسيطة وموجزة ومحددة","تتضمن عبارات ثناء عامة فقط","تقتصر على نقاط الضعف","تكون مطولة تغطي كل جوانب الإجابة"],"الوضوح والإيجاز والتحديد يجعل الطالب يفهم ما يحتاج تحسينه ويطبقه. الثناء العام لا يفيد، والاقتصار على الضعف يحبط، والإطالة تضيع الرسالة."],
["L16","m","جميع الآتي من الاستخدامات المشروعة لنتائج التقويم ما عدا:",["معاقبة الطلاب ضعاف التحصيل بالحرمان من الأنشطة","تعديل خطة التدريس وأساليبه","تصنيف الطلاب لبرامج علاجية وإثرائية","إعداد تقارير لأولياء الأمور"],"نتائج التقويم أداة تحسين وتوجيه لا أداة عقاب؛ فالحرمان لا يعالج الضعف بل يزيد النفور. التعديل والتصنيف للدعم والتقارير كلها توظيف سليم."],
["L16","","يستخدم المعلم جدولاً إلكترونياً لحساب معاملات الصعوبة والتمييز لفقرات اختباره. الفائدة الأساسية من ذلك:",["تحديد الفقرات الضعيفة بسرعة لتحسين الاختبارات القادمة","رفع درجات الطلاب الضعاف","إلغاء الحاجة إلى جدول المواصفات","تقليل عدد الأسئلة في الاختبار"],"تحليل الفقرات بالتقنية يكشف الفقرات التي تحتاج تعديلاً أو حذفاً فتتحسن جودة الاختبار. لا يغير درجات الطلاب ولا يغني عن التخطيط."],
["L16","hm","لاحظ المعلم أن طالباً حصل على 95 في اختبار الوحدة وأنهى المهام قبل زملائه بوقت طويل. التوظيف الأنسب لهذه النتيجة:",["تقديم أنشطة إثرائية تتحدى قدراته","إلزامه بمساعدة المعلم في التصحيح","تركه دون تكليف حتى ينتهي زملاؤه","إعادة الاختبار للتأكد من درجته"],"نتائج التقويم توجه إلى الإثراء للمتقنين كما توجه إلى العلاج للمخفقين. التصحيح والانتظار لا يطوران تعلمه، وإعادة الاختبار بلا مبرر."],
["L16","","طالب حصل على درجة أقل من زملائه في اختبار العلوم، وأراد المعلم أن يخبره بنتيجته بطريقة تدعم دافعيته. الأسلوب الأنسب:",["بيان ما أتقنه ثم المهارات المحددة التي يحتاج تحسينها وكيف","إعلان درجته أمام الصف لحثه على الاجتهاد","مقارنة درجته بدرجة المتفوق الأول","الاكتفاء بإبلاغه الدرجة دون تعليق"],"التغذية الراجعة الداعمة تبدأ بنقاط القوة ثم توجه إلى خطوات تحسين محددة. الإعلان والمقارنة يحرجان ويحبطان، والدرجة وحدها لا توجه."]
]);

// بنك أسئلة المعيارين 7 و8 — الدروس L11 وL12 وL13
// الحقول: [معرّف الدرس، الأعلام، نص السؤال، [البدائل والأول هو الصحيح]، الشرح]
window.QB = (window.QB || []).concat([
["L11","hm","يطبق معلمان طريقة المناقشة نفسها في درس واحد، لكن طريقة كل منهما في طرح الأسئلة وإدارة الحوار تختلف باختلاف شخصيته. ما يميز كل معلم هنا يسمى:",["أسلوب التدريس","طريقة التدريس","استراتيجية التدريس","مدخل التدريس"],"الأسلوب هو الطابع الشخصي الذي يميز معلماً عن آخر عند تنفيذ الطريقة نفسها. الطريقة إجراءات عامة مشتركة بين المعلمين، والاستراتيجية خطة أشمل، والمدخل فلسفة عامة."],
["L11","","الإطار الفكري أو الفلسفة العامة التي تنبثق منها طرق التدريس، كالقول «أدرّس وفق المدخل البنائي»، يسمى:",["مدخل التدريس","أسلوب التدريس","تقنية التدريس","طريقة التدريس"],"المدخل هو التصور النظري الذي تقوم عليه الطريقة. الطريقة إجراءات تنفيذية، والأسلوب طابع شخصي، والتقنية أداة."],
["L11","","الترتيب الصحيح لمفاهيم التدريس من الأعم إلى الأخص هو:",["مدخل ← استراتيجية ← طريقة ← أسلوب","استراتيجية ← مدخل ← أسلوب ← طريقة","طريقة ← استراتيجية ← مدخل ← أسلوب","أسلوب ← طريقة ← استراتيجية ← مدخل"],"المدخل فلسفة عامة تضم استراتيجيات، والاستراتيجية خطة تضم طرقاً، والطريقة تُنفذ بأساليب شخصية. البدائل الأخرى تقلب العلاقة."],
["L11","h","في تصنيف جويس وويل لنماذج التدريس، ينتمي التعليم المبرمج والتعلم للإتقان إلى عائلة النماذج:",["السلوكية","الاجتماعية","الشخصية","معالجة المعلومات"],"النماذج السلوكية تقوم على ضبط السلوك وتعديله بالتعزيز والخطوات الصغيرة، ومنها المبرمج والإتقان والتعليم المباشر. الاجتماعية تضم التعاوني ولعب الأدوار."],
["L11","m","أراد معلم استخدام نموذج تدريس يعتمد على التفاعل بين الطلاب في جو اجتماعي، مثل التعلم التعاوني والتقصي الجماعي. هذا النموذج ينتمي عند جويس وويل إلى العائلة:",["الاجتماعية","السلوكية","الشخصية","معالجة المعلومات"],"العائلة الاجتماعية تركز على التعلم من التفاعل مع الآخرين. الشخصية تركز على الفرد وتطوره الذاتي، ومعالجة المعلومات على العمليات العقلية كالاستقراء والمنظم المتقدم."],
["L11","hm","عرض معلم النحو عدة جمل فيها الفاعل مرفوعاً، وطلب من الطلاب ملاحظتها ثم استنتاج القاعدة بأنفسهم. الطريقة التي استخدمها هي:",["الاستقراء","الاستنباط","المحاضرة","العرض العملي"],"الاستقراء ينتقل من الأمثلة الجزئية إلى القاعدة العامة. الاستنباط عكسه: يبدأ بالقاعدة ثم يطبقها على الأمثلة."],
["L11","h","بدأ معلم الرياضيات بذكر قاعدة مساحة المستطيل، ثم طلب من الطلاب تطبيقها على مسائل متنوعة. الطريقة التي اتبعها هي:",["الاستنباط","الاستقراء","الاكتشاف الحر","حل المشكلات"],"الاستنباط (القياس) يسير من القاعدة العامة إلى الحالات الجزئية. الاستقراء يبدأ بالأمثلة ويصل إلى القاعدة، والاكتشاف الحر يترك للطالب تحديد المشكلة والأدوات."],
["L11","h","طريقة التدريس التي يكون فيها المتعلم متلقياً سلبياً، وتناسب الأعداد الكبيرة وتقديم معلومات كثيرة في وقت قصير، هي:",["المحاضرة","المناقشة","الاكتشاف","المشروعات"],"المحاضرة (الإلقاء) اقتصادية في الوقت لكنها تجعل الطالب متلقياً وتهمل الفروق الفردية. المناقشة والاكتشاف والمشروعات تقوم على نشاط المتعلم."],
["L11","h","أبرز عيب في طريقة المناقشة داخل الصف هو:",["سيطرة بعض الطلاب على الحوار وانسحاب آخرين","قلة المعلومات التي يقدمها المعلم","عدم مناسبتها لتنمية التفكير","حاجتها إلى تجهيزات تقنية مكلفة"],"المناقشة قد يستأثر بها بعض الطلاب، ولذلك يضبط المعلم المشاركة ويمنع الاستئثار أو الانسحاب. البدائل الأخرى لا تصف عيوب المناقشة؛ فهي تنمي التفكير ولا تحتاج تقنية."],
["L11","","أدى معلم التربية الإسلامية الوضوء أمام طلابه خطوة خطوة مع الشرح، ثم طلب من كل طالب تطبيقه. الطريقة المستخدمة هي:",["العرض العملي (البيان)","المحاضرة","لعب الأدوار","الاستقصاء"],"العرض العملي يؤدي فيه المعلم المهارة أمام الطلاب ثم يطبقونها، ويناسب المهارات الأدائية. لعب الأدوار تمثيل لموقف اجتماعي، والمحاضرة لا تتضمن أداء المهارة."],
["L11","m","تريد معلمة الصف الأول الابتدائي تقديم قيمة الصدق لطالبات في السادسة بأقل قدر من التجريد وبما يثير خيالهن. الطريقة الأنسب هي:",["القصة","المحاضرة","المناظرة","التعليم المبرمج"],"القصة تناسب الصغار وتقدم القيم في موقف حي يثير الخيال. المحاضرة مجردة، والمناظرة تحتاج نضجاً جدلياً، والمبرمج فردي ولا يناسب الأهداف الوجدانية."],
["L11","h","حدد المعلم مشكلة الدرس، وقدم للطلاب الأدوات والأسئلة الموجهة، وتركهم يصلون إلى المفهوم بأنفسهم. نوع الاكتشاف هنا هو:",["الاكتشاف الموجه","الاكتشاف الحر","الاستقصاء العادل","التعليم المباشر"],"في الاكتشاف الموجه يحدد المعلم المشكلة ويوجه بالأدوات والأسئلة. في الحر يحدد الطالب المشكلة والأدوات والإجراءات بنفسه، والاستقصاء العادل مناظرة بين مجموعتين."],
["L11","hm","طرح معلم العلوم مشكلة على طلابه وترك لهم تحديد الأدوات والخطوات والإجراءات بأنفسهم دون توجيه. هذا النوع يسمى:",["الاستقصاء الحر","الاستقصاء الموجه","الاستقصاء شبه الموجه","التعليم المبرمج"],"في الاستقصاء الحر يقوم الطالب بالنشاط العلمي كاملاً كالعلماء. في الموجه يقدم المعلم كل التوجيهات، وفي شبه الموجه بعضها."],
["L11","h","الترتيب الصحيح لخطوات حل المشكلات عند ديوي هو:",["الشعور بالمشكلة، تحديدها، وضع الفروض، اختبار الفروض، الوصول إلى النتيجة","تحديد المشكلة، الشعور بها، وضع الفروض، اختبار الفروض، النتيجة","وضع الفروض، الشعور بالمشكلة، تحديدها، اختبارها، النتيجة","الشعور بالمشكلة، وضع الفروض، تحديد المشكلة، النتيجة، اختبار الفروض"],"تبدأ الطريقة بالإحساس بالمشكلة ثم تحديدها بدقة، ثم جمع البيانات ووضع الفروض واختبارها، وتنتهي بالنتيجة والتعميم. البدائل الأخرى تقدم الفروض أو التحديد على الشعور بالمشكلة."],
["L11","hm","لاحظ طلاب الصف الخامس ذبول نباتات الحديقة المدرسية وتساءلوا عن السبب قبل أن يحدد المعلم المشكلة بدقة. هذه المرحلة في طريقة حل المشكلات تمثل:",["الشعور بالمشكلة","تحديد المشكلة","وضع الفروض","اختبار الفروض"],"الشعور بالمشكلة هو الخطوة الأولى: إدراك وجود صعوبة تثير التساؤل. تحديد المشكلة يأتي بعده بصياغتها بدقة، ووضع الفروض اقتراح تفسيرات محتملة."],
["L11","","بعد أن حدد الطلاب مشكلة ذبول النبات، اقترحوا تفسيرات محتملة: قلة الماء، أو نقص الضوء، أو مرض في التربة. هذه الخطوة تمثل:",["وضع الفروض","اختبار الفروض","الشعور بالمشكلة","التعميم"],"الفروض تفسيرات مؤقتة محتملة للمشكلة. اختبارها يكون بجمع الأدلة والتجريب، والتعميم في الخطوة الأخيرة بعد التحقق."],
["L11","h","رائد طريقة المشروعات في التدريس هو:",["كلباترك","ديوي","برونر","أوزبورن"],"كلباترك تلميذ ديوي هو من نادى بطريقة المشروعات. ديوي صاحب حل المشكلات ومنهج النشاط، وبرونر صاحب الاكتشاف، وأوزبورن صاحب العصف الذهني."],
["L11","m","يريد معلم تنفيذ مشروع «حديقة المدرسة» مع طلاب الصف السادس. الخطوة الأولى في طريقة المشروعات هي:",["اختيار المشروع بمشاركة الطلاب","وضع خطة التنفيذ","تنفيذ المشروع ميدانياً","تقويم المشروع"],"خطوات المشروع: اختيار المشروع، ثم التخطيط، ثم التنفيذ، ثم التقويم. اختيار المشروع يكون بمشاركة الطلاب ليرتبط بميولهم."],
["L11","","ما الذي يميز طريقة المشروعات عن طريقة حل المشكلات؟",["أنها عمل ممتد ينتهي بمنتج ملموس","أنها تبدأ بالشعور بالمشكلة","أنها تعتمد على وضع الفروض","أنها تُنفذ داخل الصف فقط"],"المشروع عمل هادف ممتد ينتهي بمنتج (حديقة، مجسم، معرض). الشعور بالمشكلة والفروض من خطوات حل المشكلات، والمشروعات غالباً ميدانية خارج الصف."],
["L11","h","يستند التعليم المبرمج إلى النظرية:",["السلوكية","المعرفية","البنائية","الجشطلتية"],"التعليم المبرمج من وضع سكنر ويقوم على التعزيز الفوري والخطوات الصغيرة، وهي مبادئ الاشتراط الإجرائي السلوكي. البنائية تقوم على بناء المتعلم للمعرفة لا على التعزيز."],
["L11","h","طريقة التدريس التي توفر لكل طالب فرصة التعلم حسب سرعته وقدرته الخاصة هي:",["التعليم المبرمج","التعلم التعاوني","العصف الذهني","الحوار والمناقشة"],"التعليم المبرمج يقوم على الخطو الذاتي؛ ينتقل الطالب بين الخطوات بسرعته. التعاوني والعصف والمناقشة أنشطة جماعية تسير بإيقاع المجموعة."],
["L11","","في برنامج تعليمي محوسب، عندما يخطئ الطالب في إطار معين يُحوَّل إلى إطار علاجي يشرح الخطأ ثم يعود إلى المسار الأصلي. نوع البرمجة هنا هو:",["البرمجة المتشعبة","البرمجة الخطية","البرمجة التعاونية","البرمجة الاستقرائية"],"البرمجة المتشعبة (كراودر) تتفرع حسب استجابة الطالب وتقدم إطارات علاجية. الخطية (سكنر) مسار واحد مستقيم لا يتفرع."],
["L11","","جميع ما يأتي من خصائص التعليم المبرمج ما عدا:",["تنمية التفاعل الاجتماعي بين المتعلمين","تقسيم المادة إلى خطوات صغيرة","التعزيز الفوري للاستجابة الصحيحة","التقدم بسرعة المتعلم الخاصة"],"التعليم المبرمج فردي ولا ينمي التفاعل الاجتماعي، وهذا من عيوبه. الخطوات الصغيرة والتعزيز الفوري والخطو الذاتي خصائصه الأساسية."],
["L11","m","أعد معلم وحدة تعلم ذاتي متكاملة تتضمن أهدافاً واختباراً قبلياً وأنشطة بدائل متعددة الوسائط واختباراً بعدياً يدرسها الطالب بنفسه. هذه الوحدة تسمى:",["الحقيبة التعليمية","المحاضرة المسجلة","الرحلة المعرفية","خريطة المفاهيم"],"الحقيبة التعليمية وحدة تعلم ذاتي متكاملة بهذه المكونات. الرحلة المعرفية بحث موجه عبر الإنترنت، والمحاضرة المسجلة مصدر واحد بلا أنشطة بدائل."],
["L11","","وحدة تعليمية صغيرة مستقلة من برنامج أكبر، يدرسها الطالب ذاتياً ويُقوَّم بعدها قبل الانتقال إلى التالية، تسمى:",["الموديول","المشروع","الاستقصاء","التدريس المصغر"],"الموديول (الوحدة النسقية) وحدة صغيرة مستقلة للتعلم الذاتي. التدريس المصغر تدريب للمعلم، والمشروع عمل ممتد، والاستقصاء طريقة بحث."],
["L11","hm","قسّم المعلم الدرس إلى أربعة أجزاء، وكلف كل طالب في المجموعة بدراسة جزء مع طلاب من مجموعات أخرى درسوا الجزء نفسه، ثم عاد كل طالب ليعلّم زملاءه في مجموعته الأصلية. هذه الاستراتيجية هي:",["جيكسو (المجموعات المتداخلة)","فرق التحصيل","فكر‑زاوج‑شارك","التدريس التبادلي"],"جيكسو تقوم على مجموعات الخبراء ثم العودة إلى المجموعة الأم. فرق التحصيل تعتمد اختباراً فردياً ودرجة فريق من التحسن، وفكر‑زاوج‑شارك ثنائية."],
["L11","h","جميع ما يأتي من العناصر الخمسة للتعلم التعاوني عند جونسون وجونسون ما عدا:",["التنافس بين أعضاء المجموعة الواحدة","الاعتماد الإيجابي المتبادل","المسؤولية الفردية","المهارات الاجتماعية"],"العناصر الخمسة: الاعتماد الإيجابي المتبادل، المسؤولية الفردية، التفاعل وجهاً لوجه، المهارات الاجتماعية، معالجة عمل المجموعة. التنافس داخل المجموعة يناقض الاعتماد المتبادل."],
["L11","m","أنجزت مجموعة تعاونية مهمتها بدرجة ممتازة، لكن المعلم اكتشف أن طالباً واحداً أنجز كل العمل بينما اكتفى الآخرون بالمشاهدة. العنصر المفقود في هذه المجموعة هو:",["المسؤولية الفردية","التفاعل وجهاً لوجه","الاعتماد الإيجابي المتبادل","المهارات الاجتماعية"],"المسؤولية الفردية تعني أن كل عضو مسؤول عن تعلمه وإسهامه، ويضمنها المعلم بتوزيع الأدوار والاختبار الفردي. التفاعل والاعتماد قد يكونان موجودين شكلاً مع غياب المحاسبة الفردية."],
["L11","h","تعمل المجموعات في استراتيجية تعاونية على ورقة عمل، ثم يُختبر كل طالب فردياً، وتُحسب درجة الفريق من مقدار تحسن كل عضو عن درجته السابقة. هذه الاستراتيجية هي:",["فرق التحصيل (STAD)","جيكسو","المائدة المستديرة","لعب الأدوار"],"فرق التحصيل لسلافين تقوم على الاختبار الفردي وحساب درجة الفريق من التحسن. جيكسو تقوم على مجموعات الخبراء، والمائدة المستديرة إجابات بالتناوب."],
["L11","","عند تشكيل مجموعات التعلم التعاوني، الأفضل أن تكون المجموعة:",["غير متجانسة في مستوى التحصيل من 4 إلى 6 طلاب","متجانسة من المتفوقين فقط","كبيرة تضم نصف الصف","مكونة من الأصدقاء الذين يختارون بعضهم"],"المجموعات غير المتجانسة الصغيرة تتيح تعليم الأقران ومساعدة الضعفاء. المجموعات المتجانسة أو الكبيرة أو مجموعات الأصدقاء تضعف التفاعل والمسؤولية."],
["L11","","أثناء عمل المجموعات التعاونية على مهمة، الدور الأنسب للمعلم هو:",["المتابعة والتدخل بالدعم عند الحاجة فقط","الشرح الكامل للمهمة لكل مجموعة على حدة","الجلوس في مكتبه حتى تنتهي المجموعات","حل المهمة أمام الصف ليقلدها الطلاب"],"المعلم في التعاوني ميسر يلاحظ ويقدم الدعم عند الحاجة. الشرح الكامل أو حل المهمة يلغي دور المجموعة، والانسحاب التام يفقدها التوجيه."],
["L11","","أثناء تمثيل الطلاب لمشهد في استراتيجية لعب الأدوار، لاحظ المعلم أن أحدهم أدى دوره بطريقة لا تتفق مع الموقف المقصود (دون إساءة لأحد). الإجراء الأنسب هو:",["ترك المشهد يكتمل ثم مناقشة الأداء مع الصف في مرحلة التقويم","إيقاف التمثيل فوراً وتصحيح الأداء أمام الجميع","استبدال الطالب بآخر في منتصف المشهد","إنهاء النشاط وتحويله إلى محاضرة"],"في لعب الأدوار لا يُقاطع المشهد ما دام آمناً؛ فالمناقشة والتقويم مرحلة تلي التمثيل، وقد يُعاد المشهد بعدها. المقاطعة أو الاستبدال يكسران الموقف ويحرجان الطالب."],
["L11","m","قسّم معلم اللغة العربية الطلاب إلى مُحاوِر ومسؤول توظيف، وطلب منهم تمثيل مقابلة عمل أمام الصف ثم مناقشة ما حدث. الاستراتيجية المستخدمة هي:",["لعب الأدوار","العصف الذهني","التدريس التبادلي","الاستقراء"],"لعب الأدوار محاكاة لموقف واقعي يتقمص فيه الطلاب أدواراً ثم يناقشونها. العصف توليد أفكار، والتبادلي حوار حول نص مقروء."],
["L11","h","من مبادئ جلسة العصف الذهني التركيز على:",["كم الأفكار قبل نوعيتها","نوعية الأفكار قبل كمها","نقد كل فكرة فور طرحها","اختيار الأفكار من الطلاب المتفوقين"],"العصف الذهني يهدف إلى توليد أكبر عدد من الأفكار مع إرجاء الحكم عليها؛ فالكم قبل الكيف. النقد الفوري يقتل تدفق الأفكار."],
["L11","hm","جميع ما يأتي من قواعد العصف الذهني ما عدا:",["فحص الأفكار ونقدها قبل طرحها","إرجاء الحكم على الأفكار","البناء على أفكار الآخرين","إطلاق حرية التفكير"],"قواعد أوزبورن الأربع: إرجاء الحكم، حرية التفكير، الكم قبل الكيف، البناء على أفكار الآخرين. فحص الأفكار قبل طرحها يناقض إرجاء الحكم."],
["L11","h","في جلسة عصف ذهني بدأ تدفق الأفكار يتباطأ. العبارة الأنسب التي يقولها المعلم لاستمرار التجاوب هي:",["هل هناك فكرة أخرى؟","هل هناك فكرة أفضل؟","أي الأفكار المطروحة أصح؟","لماذا لم تفكروا جيداً؟"],"«هل هناك فكرة أخرى؟» تدعو إلى مزيد من التوليد دون حكم. «أفضل» و«أصح» تقويم يناقض إرجاء الحكم، واللوم يوقف المشاركة."],
["L11","m","أثناء جلسة عصف ذهني سخر طالب من فكرة زميله قائلاً إنها غير منطقية. الإجراء الأنسب من المعلم هو:",["تذكير الصف بقاعدة إرجاء الحكم ومواصلة جمع الأفكار","حذف الفكرة التي سُخر منها لأنها غير منطقية","إيقاف الجلسة ومعاقبة الطالب الساخر","الطلب من صاحب الفكرة الدفاع عنها الآن"],"إرجاء الحكم قاعدة أساسية، والمعلم يعيد تثبيتها دون قطع الجلسة. حذف الفكرة أو الدفاع عنها الآن يُدخل التقويم في مرحلة التوليد، والعقاب يوقف تدفق الأفكار."],
["L11","h","صاحب أسلوب العصف الذهني هو:",["أوزبورن","ديوي","سكنر","برونر"],"أليكس أوزبورن وضع العصف الذهني بقواعده الأربع. ديوي صاحب حل المشكلات، وسكنر صاحب التعليم المبرمج، وبرونر صاحب الاكتشاف."],
["L11","hm","في درس قراءة، تناوب الطلاب قيادة الحوار حول النص: يلخص أحدهم الفقرة، ويولّد آخر أسئلة عنها، ويوضح ثالث الكلمات الغامضة، ويتنبأ رابع بما سيأتي. الاستراتيجية المستخدمة هي:",["التدريس التبادلي","تدريس الأقران","العصف الذهني","فكر‑زاوج‑شارك"],"التدريس التبادلي يقوم على أربع استراتيجيات: التلخيص وتوليد الأسئلة والتوضيح والتنبؤ، ويتبادل فيه الطلاب دور المعلم. تدريس الأقران طالب يعلّم طالباً دون هذه البنية."],
["L11","h","الهدف الرئيس من استراتيجية التدريس التبادلي هو تحسين:",["الاستيعاب القرائي ومهارات ما وراء المعرفة","الأداء الحركي في التربية البدنية","حفظ الحقائق والتواريخ","سرعة الكتابة الإملائية"],"التدريس التبادلي صممه بالينسكار وبراون لتحسين فهم المقروء وتنمية مراقبة الطالب لفهمه. البدائل الأخرى مهارات لا تخدمها استراتيجياته الأربع."],
["L11","h","استراتيجية يقوم فيها الطلاب بتعليم بعضهم بعضاً تحت إشراف المعلم وتوجيهه تسمى:",["تدريس الأقران","التدريس المصغر","التعليم المبرمج","المحاضرة"],"تدريس الأقران يعلّم فيه طالب طالباً آخر بإشراف المعلم. التدريس المصغر تدريب للمعلم على مهارة، والمبرمج تعلم فردي."],
["L11","","كلّف المعلم طالباً متفوقاً بشرح درس الكسور لزميل يواجه صعوبة فيه. المستفيد من هذا الإجراء هو:",["الطالبان معاً؛ فالقرين المعلّم يرسخ فهمه والمتعلم يتلقى شرحاً بلغة قريبة منه","الطالب الضعيف وحده","الطالب المتفوق وحده","المعلم فقط لأنه وفر وقته"],"من مزايا تدريس الأقران أن الشرح يعمق فهم القرين المعلّم، وأن المتعلم يستفيد من لغة قريبة منه. حصر الفائدة في طرف واحد يغفل هذه الميزة."],
["L11","h","موقف تدريسي حقيقي مصغر يتدرب فيه المعلم على مهارة تدريسية واحدة مع عدد قليل من الطلاب في وقت قصير، ويتلقى بعده تغذية راجعة ثم يعيد التدريس، يسمى:",["التدريس المصغر","تدريس الأقران","التدريس التبادلي","التعليم المباشر"],"التدريس المصغر (ستانفورد) يركز على مهارة واحدة مع 5–10 طلاب في 5–10 دقائق مع تسجيل وتغذية راجعة. التبادلي والأقران استراتيجيات لتعلم الطلاب لا لتدريب المعلم."],
["L11","m","يريد معلم جديد التدرب على مهارة طرح الأسئلة الصفية فقط، دون الدخول في درس كامل، والحصول على تغذية راجعة من مدرب وزملاء. الأسلوب الأنسب له هو:",["التدريس المصغر","حضور دورة نظرية عن الأسئلة","قراءة كتاب في طرق التدريس","تدريس حصة كاملة أمام المشرف"],"التدريس المصغر مصمم لهذا الغرض: مهارة واحدة، وقت قصير، تغذية راجعة، وإعادة أداء. الدورة النظرية والقراءة لا تتيحان الممارسة، والحصة الكاملة تشتت التركيز عن المهارة الواحدة."],
["L11","h","في مخروط الخبرة لإدجار ديل، تقع في قمة المخروط (الأكثر تجريداً):",["الرموز اللفظية","الخبرات المباشرة الهادفة","الرحلات الميدانية","الخبرات المعدلة"],"القمة هي الرموز اللفظية (الكلمات) ثم الرموز البصرية، والقاعدة الخبرات المباشرة. الرحلات والخبرات المعدلة في الأجزاء الوسطى والدنيا."],
["L11","h","قاعدة مخروط الخبرة لديل (الأكثر حسية) هي:",["الخبرات المباشرة الهادفة","الرموز البصرية","الصور الثابتة","التلفاز والأفلام"],"الخبرات المباشرة الهادفة التي يمارسها الطالب بنفسه تقع في القاعدة. الصور والأفلام والرموز البصرية أعلى في المخروط وأكثر تجريداً."],
["L11","hm","استخدم معلم الأحياء مجسماً يحاكي جسم الإنسان لشرح أعضائه. الخبرة التي يقدمها هذا المجسم وفق مخروط ديل هي:",["خبرة معدلة (شبه محسوسة)","خبرة مباشرة هادفة","رمز لفظي","رمز بصري"],"المجسمات والنماذج خبرات معدلة تحاكي الواقع عندما يتعذر الأصل. الخبرة المباشرة تتطلب الجسم الحقيقي، والرموز البصرية رسوم وخرائط."],
["L11","m","طلبت معلمة العلوم من الطالبات زراعة بذور في أوعية ومتابعة نموها يومياً وتسجيل الملاحظات. نوع الخبرة وفق مخروط ديل:",["خبرة مباشرة هادفة","خبرة ممثلة","رموز بصرية","خبرة بديلة عبر الفيديو"],"الطالبة تمارس النشاط الحقيقي بنفسها، وهذه الخبرة المباشرة الهادفة في قاعدة المخروط. الخبرة الممثلة دراما، والفيديو والرموز أكثر تجريداً."],
["L11","m","يريد معلم الكيمياء تعريف طلابه بتفاعل خطر لا يمكن إجراؤه في معمل المدرسة. الوسيلة الأنسب هي:",["المحاكاة الحاسوبية للتجربة","إجراء التجربة بحذر مع تقليل الكميات","الاكتفاء بوصف التجربة شفهياً","تكليف الطلاب بإجرائها في المنزل"],"المحاكاة خبرة بديلة آمنة تقرب التجارب الخطرة أو المكلفة. إجراؤها بحذر أو في المنزل خطر، والوصف الشفهي رمز لفظي ضعيف الأثر."],
["L11","hm","في بداية درس عن دورة الماء، عرض المعلم فيديو قصيراً يقدم الفكرة العامة للموضوع قبل الشرح التفصيلي ليربطها بما يعرفه الطلاب. ما قدمه المعلم يسمى:",["منظماً متقدماً","عصفاً ذهنياً","تعليماً مبرمجاً","تعلماً استقرائياً"],"المنظم المتقدم (أوزوبل) مادة تمهيدية عامة تُقدم قبل الدرس لربطه بالبنية المعرفية. العصف توليد أفكار، والمبرمج خطوات صغيرة، والاستقراء أمثلة ثم قاعدة."],
["L11","hm","أراد معلم اختيار استراتيجية تدريس من بين استراتيجيات متعددة. المعيار الأهم الذي يجب أن يراعيه هو:",["ارتباط الاستراتيجية بأهداف الدرس وخصائص الطلاب وحاجاتهم","اختيار الاستراتيجية الأكثر شيوعاً بين الزملاء","اختيار استراتيجية تتطلب فصولاً مكتملة التجهيزات","اختيار الاستراتيجية الأسهل في التحضير"],"الاستراتيجية تُختار لتلائم الهدف والمتعلم. الشيوع بين الزملاء وسهولة التحضير مرتكزان على المعلم لا على المتعلم، واشتراط التجهيزات الكاملة قيد لا معيار."],
["L11","h","أي طرق التدريس الآتية تتطلب أنشطتها القدر الأكبر من فعالية المتعلم ونشاطه؟",["الاكتشاف","المحاضرة","الإلقاء المدعوم بالعرض","العرض العملي"],"في الاكتشاف يعالج الطالب المواد ويصل إلى المفهوم بنفسه. المحاضرة والإلقاء والعرض العملي يتمركز فيها النشاط حول المعلم."],
["L11","h","يوصف تعلم الطالب في طرق التدريس المباشرة (الإلقاء والعرض) بأنه تعلم:",["استقبالي","اكتشافي","تعاوني","ذاتي"],"في التدريس المباشر يتلقى الطالب المعرفة جاهزة من المعلم، فهو تعلم استقبالي. الاكتشافي يبني فيه الطالب المعرفة، والذاتي والتعاوني ينقلان المسؤولية إلى المتعلم."],
["L11","m","يقود معلم الفلسفة طلابه بسلسلة أسئلة متتابعة حتى يكتشف كل طالب التناقض في رأيه ويصل بنفسه إلى الرأي الصواب. الطريقة المستخدمة هي:",["الطريقة الحوارية (السقراطية)","المحاضرة","التعليم المبرمج","لعب الأدوار"],"الحوار السقراطي يقوم على أسئلة متتابعة تقود المتعلم إلى اكتشاف الحقيقة. المحاضرة تقدم الرأي جاهزاً، والمبرمج خطوات مكتوبة، ولعب الأدوار تمثيل."],
["L11","","أي الطرق الآتية لا تُعد من الطرق المتمركزة حول المتعلم؟",["المحاضرة","التعلم التعاوني","الاكتشاف الموجه","المشروعات"],"المحاضرة تتمركز حول المعلم بوصفه مصدر المعرفة. التعاوني والاكتشاف والمشروعات تنقل النشاط إلى المتعلم."],
["L11","h","رتب معلم محتوى مادته وفق ميول طلابه وحاجاتهم وخبراتهم السابقة ومستوى نضجهم، لا وفق التسلسل الداخلي للمادة. المدخل الذي اتبعه في تنظيم المحتوى هو:",["المدخل السيكولوجي (النفسي)","المدخل المنطقي","المدخل التاريخي","المدخل الاستنباطي"],"المدخل السيكولوجي يرتب المحتوى وفق خصائص المتعلم وميوله وحاجاته. المنطقي يرتبه وفق بنية المادة الداخلية (من البسيط إلى المعقد، ومن المحسوس إلى المجرد)، والتاريخي يتتبع تطور المعرفة، والاستنباطي طريقة تدريس لا مدخل تنظيم."],
["L11","","دعا المعلم ثلاثة متخصصين ليعرض كل منهم جانباً من موضوع «ترشيد المياه» أمام الطلاب، ثم فتح باب النقاش والأسئلة. هذا الأسلوب يسمى:",["الندوة","المناظرة","لعب الأدوار","العصف الذهني"],"الندوة عرض عدة متخصصين لجوانب موضوع واحد يعقبه نقاش. المناظرة مجموعتان مؤيدة ومعارضة، والعصف توليد أفكار من الطلاب أنفسهم."],
["L11","m","يدرّس معلم صفاً فيه 45 طالباً محتوى نظرياً كثيفاً في حصة واحدة قبل الاختبار. الطريقة الأنسب لهذا الموقف هي:",["المحاضرة المدعومة بالعرض والأسئلة القصيرة","الاكتشاف الحر","المشروعات الجماعية","لعب الأدوار"],"المحاضرة اقتصادية في الوقت وتناسب الأعداد الكبيرة والمحتوى الكثيف، ويُحسّنها دعمها بالعرض والأسئلة. الاكتشاف الحر والمشروعات تحتاج وقتاً طويلاً، ولعب الأدوار لا يناسب المحتوى النظري الكثيف."],
["L11","h","طرح المعلم قضية «حظر الجوال في المدرسة» على مجموعة مؤيدة وأخرى معارضة، واستعان بطلاب محكمين مستقلين يحكمون على الحجج. يهدف المعلم من هذه الطريقة إلى تنمية:",["اتخاذ القرار والتفكير الناقد","الحفظ والاستظهار","المهارات الحركية","سرعة القراءة"],"الاستقصاء العادل (المناظرة بمحكمين) يدرب الطلاب على وزن الحجج والحكم عليها واتخاذ القرار. البدائل الأخرى لا تخدمها طبيعة النشاط الجدلي."],
["L11","m","الطريقة الاستقرائية أنسب ما تكون لتعليم:",["المفاهيم والتعميمات","الحقائق المنفصلة كالتواريخ","المهارات الحركية","القراءة الجهرية"],"الاستقراء يبني المفهوم أو القاعدة من الأمثلة، فيناسب المفاهيم والتعميمات. الحقائق المنفصلة تُحفظ مباشرة، والمهارات الحركية تحتاج العرض والممارسة."]
]);
window.QB = (window.QB || []).concat([
["L12","hm","أي الأهداف الآتية صيغ صياغة سلوكية يمكن قياسها؟",["أن يفسر الطالب الرموز على الخريطة","أن يدرك الطالب أهمية الخريطة","أن يفهم الطالب مفهوم الخريطة","أن يعتقد الطالب بفائدة الخرائط"],"«يفسر» فعل سلوكي ظاهر يمكن ملاحظته وقياسه. «يدرك» و«يفهم» و«يعتقد» عمليات داخلية غير قابلة للملاحظة المباشرة."],
["L12","h","كتب معلم الهدف الآتي: «يوضح المعلم مفهوم التفاعل الكيميائي». الخلل في هذه الصياغة أنها:",["تصف سلوك المعلم لا سلوك المتعلم","تتضمن أكثر من ناتج تعلم","غير مرتبطة بالمحتوى","تفتقر إلى الفعل السلوكي"],"الهدف السلوكي يصف ما سيفعله الطالب بعد التعلم، والصياغة هنا فاعلها المعلم. الفعل «يوضح» سلوكي والمحتوى محدد، والناتج واحد."],
["L12","","كتب معلم الهدف: «أن يقرأ الطالب الدرس الثالث من الكتاب». الخلل في هذا الهدف أنه:",["يصف نشاطاً تعليمياً لا ناتج تعلم","يصف سلوك المعلم","يتضمن أكثر من ناتج","غير قابل للملاحظة"],"الهدف السلوكي يصف الناتج الذي يكتسبه الطالب (كأن يستخرج الفكرة الرئيسة)، أما قراءة الدرس فنشاط يؤدى للوصول إلى الناتج. الفعل هنا ملاحظ وفاعله الطالب وناتجه واحد."],
["L12","m","كتب معلم الهدف: «أن يذكر الطالب أركان الإسلام ويشرح كل ركن منها». الخلل في صياغته أنه:",["يتضمن أكثر من ناتج تعلم في هدف واحد","يصف سلوك المعلم","يستخدم فعلاً غير قابل للقياس","يفتقر إلى المحتوى"],"القاعدة أن يتضمن الهدف ناتج تعلم واحداً؛ وهنا «يذكر» و«يشرح» ناتجان من مستويين مختلفين. الفعلان قابلان للقياس والفاعل هو الطالب."],
["L12","m","في الهدف: «أن يحل الطالب 8 مسائل من 10 على الجمع خلال خمس دقائق دون آلة حاسبة»، عبارة «8 مسائل من 10» تمثل:",["معيار الأداء (الإتقان)","شرط الأداء","الفعل السلوكي","المحتوى"],"المعيار هو الحد الأدنى المقبول للأداء. «دون آلة حاسبة» شرط الأداء، و«يحل» الفعل السلوكي، و«مسائل الجمع» المحتوى."],
["L12","","في الهدف: «أن يرسم الطالب خريطة المملكة باستخدام الأطلس في 10 دقائق»، عبارة «باستخدام الأطلس» تمثل:",["شرط الأداء","معيار الأداء","الفعل السلوكي","ناتج التعلم"],"الشرط هو الظرف أو الأدوات التي يُؤدى فيها السلوك. «في 10 دقائق» معيار زمني، و«يرسم» الفعل السلوكي."],
["L12","h","الهدف: «إعداد مواطن صالح يسهم في بناء مجتمعه» يمثل مستوى:",["الغايات (الأهداف التربوية العامة)","الأهداف السلوكية","أهداف الدرس اليومي","أهداف الوحدة"],"الغايات أهداف بعيدة المدى تعبر عن فلسفة المجتمع ولا تُقاس في حصة. الأهداف السلوكية وأهداف الدرس قصيرة المدى وقابلة للقياس."],
["L12","h","ترتبط الأهداف التربوية العامة في المملكة بـ:",["فلسفة المجتمع وقيمه","ميول المعلم الشخصية","إدارة المدرسة","الكتاب المدرسي"],"الأهداف العامة تُشتق من فلسفة المجتمع وعقيدته وحاجاته. الكتاب والمعلم والإدارة وسائل لتحقيقها لا مصادر لاشتقاقها."],
["L12","h","جميع ما يأتي من مصادر اشتقاق الأهداف التربوية ما عدا:",["الميول الشخصية للمعلم","فلسفة المجتمع وحاجاته","طبيعة المتعلم وخصائص نموه","طبيعة المادة الدراسية"],"مصادر الأهداف: فلسفة المجتمع، والمتعلم، والمعرفة، ونتائج البحوث. ميول المعلم الشخصية لا تصلح مصدراً لأهداف عامة تخص الجميع."],
["L12","","الهدف: «أن يكتسب الطالب مهارات القراءة الناقدة خلال الفصل الدراسي» يمثل:",["هدفاً عاماً للمقرر","هدفاً سلوكياً","غاية تربوية","هدف حصة واحدة"],"الهدف يمتد على فصل كامل ولا يقاس مباشرة في حصة، فهو هدف عام. الغاية أوسع وترتبط بالمجتمع، والسلوكي محدد بحصة."],
["L12","h","أبسط المستويات في تصنيف بلوم للأهداف المعرفية هو:",["التذكر","الفهم","التطبيق","التحليل"],"التذكر (المعرفة) قاعدة الهرم ويقتصر على الاسترجاع. الفهم والتطبيق والتحليل مستويات أعلى تتطلب معالجة."],
["L12","hm","الفعل «يقارن» في صياغة الأهداف ينتمي إلى مستوى:",["التحليل","التركيب","التقويم","الفهم"],"المقارنة تتطلب تفكيك الشيئين وإدراك أوجه الشبه والاختلاف والعلاقات بينهما، وهذا جوهر التحليل، وهو مفتاح الملخصات المتداولة وما تذكره ملازم الرخصة. التركيب يبني جديداً، والتقويم يحكم بمعيار، والفهم يفسر ويلخص (وتُدرج المقارنة البسيطة أحياناً ضمن الفهم في التصنيف المعدل، لكن مفتاح الاختبار: التحليل)."],
["L12","h","الفعل الذي يدل على مستوى التركيب في تصنيف بلوم هو:",["يقترح","يعرف","يقارن","يوضح"],"«يقترح» و«يصمم» و«يؤلف» أفعال بناء جديد (تركيب/إبداع). «يعرف» تذكر، «يقارن» تحليل، «يوضح» فهم."],
["L12","h","أي الأهداف الآتية في مستوى التحليل وفق تصنيف بلوم؟",["أن يبين الطالب أسباب هزيمة المسلمين في غزوة أحد","أن يعدد الطالب غزوات الرسول صلى الله عليه وسلم","أن يكتب الطالب مقالة عن احترام النظام","أن يعرّف الطالب الغزوة"],"بيان الأسباب يتطلب تفكيك الحدث وإدراك العلاقات بين عناصره، وهو تحليل. التعداد والتعريف تذكر، وكتابة المقالة تركيب."],
["L12","hm","صاغ معلم الرياضيات الهدف: «أن يستعمل الطالب جدول الضرب في عمليات البيع والشراء اليومية». هذا الهدف في مستوى:",["التطبيق","الفهم","التقويم","التذكر"],"استعمال المعرفة في موقف جديد هو التطبيق. التذكر استرجاع الجدول، والفهم شرحه، والتقويم الحكم عليه."],
["L12","","طلب المعلم من الطالب: «لخص الفقرة بأسلوبك الخاص». هذا الطلب يقيس مستوى:",["الفهم","التذكر","التحليل","الإبداع"],"التلخيص وإعادة الصياغة بأسلوب خاص من أفعال الفهم. التذكر يستدعي النص نفسه، والتحليل يفكك، والإبداع يبني جديداً."],
["L12","","طلب المعلم من طلابه الحكم على صحة حل زميلهم للمسألة مع تبرير الحكم بمعايير واضحة. هذا الطلب يقيس مستوى:",["التقويم","التطبيق","الفهم","التذكر"],"إصدار الحكم المبرر وفق معايير هو التقويم. التطبيق حل المسألة، والفهم شرح الخطوات."],
["L12","hm","قرأ المعلم قصة لطلابه ثم طلب منهم إعادة كتابتها بنهاية مختلفة من إنشائهم. هذا النشاط يقيس مستوى:",["التركيب (الإبداع)","الفهم","التذكر","التطبيق"],"إنتاج نهاية جديدة يجمع العناصر في بناء لم يكن موجوداً، وهذا التركيب في الأصلي والإبداع في المعدل. إعادة سرد القصة كما هي تذكر، وتلخيصها فهم."],
["L12","h","أبرز فرق بين تصنيف بلوم الأصلي (1956) والمعدل (أندرسون وكراثوول 2001) هو أن المعدل:",["جعل الإبداع في قمة الهرم بدل التقويم واستخدم الأفعال بدل الأسماء","ألغى مستوى التطبيق","دمج التذكر مع الفهم","أضاف مستوى الوجدان إلى المعرفي"],"المعدل حوّل المستويات إلى أفعال، وتبادل موقعي التركيب والتقويم فصار الإبداع في القمة، وأضاف بُعد المعرفة. لم يُلغ التطبيق ولم يدمج مستويات."],
["L12","","أضاف التصنيف المعدل لبلوم بُعداً جديداً هو:",["بُعد المعرفة: حقائقية ومفاهيمية وإجرائية وما وراء معرفية","بُعد الدافعية","بُعد المهارات الحركية","بُعد القيم"],"التصنيف المعدل ثنائي الأبعاد: العمليات المعرفية (تذكر…إبداع) وأنواع المعرفة الأربعة. البدائل الأخرى مجالات مستقلة لا أبعاداً للمعرفي."],
["L12","","الهدف: «أن يصف الطالب خطوات إجراء تجربة قياس الكثافة» يتناول من بُعد المعرفة في التصنيف المعدل المعرفة:",["الإجرائية","الحقائقية","المفاهيمية","ما وراء المعرفية"],"الخطوات والطرائق معرفة إجرائية. الحقائقية مصطلحات وتفاصيل، والمفاهيمية علاقات ونظريات، وما وراء المعرفية وعي الطالب بتفكيره."],
["L12","m","راجع المشرف أسئلة اختبار معلم فوجد أن معظمها بصيغة «عدد، اذكر، عرّف». التوجيه الأنسب للمعلم هو:",["إضافة أسئلة تتطلب المقارنة والتعليل والحكم لتغطية المستويات العليا","زيادة عدد أسئلة التذكر لتكون أشمل","حذف كل أسئلة التذكر من الاختبار","تحويل الأسئلة كلها إلى مقالية"],"الأسئلة الحالية تقيس التذكر فقط، والاختبار الجيد يغطي المستويات العليا وفق جدول المواصفات دون إلغاء التذكر كلياً. تحويل النوع لا يغير المستوى بالضرورة."],
["L12","h","الهدف: «أن يحب الطالب وطنه ويعتز بالانتماء إليه» ينتمي إلى المجال:",["الوجداني","المعرفي","النفس‑حركي","المهاري"],"الحب والاعتزاز مشاعر وقيم واتجاهات، وهذا المجال الوجداني (كراثوول). المعرفي عمليات عقلية، والنفس‑حركي أداء حركي."],
["L12","h","الترتيب الصحيح لمستويات المجال الوجداني عند كراثوول تصاعدياً هو:",["الاستقبال، الاستجابة، التقييم، التنظيم، التميز بالقيمة","الاستجابة، الاستقبال، التنظيم، التقييم، التميز بالقيمة","الاستقبال، التقييم، الاستجابة، التميز بالقيمة، التنظيم","التنظيم، الاستقبال، الاستجابة، التقييم، التميز بالقيمة"],"يبدأ المجال الوجداني بالانتباه (الاستقبال) ثم المشاركة (الاستجابة) ثم تبني القيمة (التقييم) ثم ترتيب القيم (التنظيم) وينتهي بأن تصبح القيمة سمة ثابتة (التميز بالقيمة)."],
["L12","m","لاحظ المعلم أن طالباً يصغي باهتمام لدرس عن النظافة دون أن يشارك أو يبادر. هذا الطالب في المستوى الوجداني:",["الاستقبال","الاستجابة","التقييم","التنظيم"],"الاستقبال هو الانتباه والإصغاء للمثير، وهو أدنى المستويات. الاستجابة تتطلب مشاركة فعلية، والتقييم تبني القيمة."],
["L12","m","صار طالب ينظف مكانه ويحافظ على نظافة الصف من تلقاء نفسه في كل موقف حتى أصبح ذلك سمة معروفة عنه بين زملائه. هذا يدل على بلوغه المستوى الوجداني:",["التميز بالقيمة (الوسم)","الاستقبال","الاستجابة","التقييم"],"التميز بالقيمة أعلى المستويات: تصبح القيمة جزءاً ثابتاً من الشخصية يوجه السلوك باستمرار. الاستجابة مشاركة عند الطلب، والتقييم تبني القيمة دون أن تصير سمة ثابتة بعد."],
["L12","","تطوع طالب للمشاركة في حملة نظافة الحي بعد درس عن النظافة. سلوكه يمثل المستوى الوجداني:",["الاستجابة","الاستقبال","التنظيم","التميز بالقيمة"],"الاستجابة هي المشاركة الفعلية والتطوع والتفاعل مع الموقف. الاستقبال اهتمام دون فعل، والتنظيم ترتيب منظومة القيم."],
["L12","h","جميع ما يأتي من مستويات المجال الوجداني ما عدا:",["التركيب","التنظيم","الاستجابة","التقييم"],"التركيب من مستويات المجال المعرفي عند بلوم. التنظيم والاستجابة والتقييم من مستويات كراثوول الخمسة."],
["L12","h","صاحب تصنيف الأهداف في المجال النفس‑حركي (المهاري) هو:",["سمبسون","كراثوول","بلوم","ماجر"],"سمبسون صاحب التصنيف السباعي للمجال النفس‑حركي (ومعه هارو وديف). كراثوول للوجداني، وبلوم للمعرفي، وماجر لصياغة الهدف السلوكي."],
["L12","h","أي التصنيفات الآتية يتناول المستويات الدنيا للأهداف النفس‑حركية؟",["الملاحظة، التقليد، التجريب","الممارسة، الإتقان، الإبداع","الاستقبال، الاستجابة، التقييم","التقدير، التنظيم، التميز بالقيمة"],"المستويات الدنيا للمهاري: الإدراك والاستعداد والاستجابة الموجهة (ملاحظة وتقليد وتجريب)؛ والعليا الممارسة والإتقان والإبداع. أما «الاستقبال والاستجابة والتقييم» و«التقدير والتنظيم والتميز بالقيمة» فمستويات وجدانية عند كراثوول."],
["L12","m","يؤدي طالب مهارة الخط العربي بتقليد حركة يد المعلم خطوة بخطوة تحت إشرافه. هذا الطالب في مستوى سمبسون:",["الاستجابة الموجهة","الآلية","الاستجابة المعقدة","الإبداع"],"الاستجابة الموجهة أداء المهارة بالتقليد والمحاولة تحت توجيه. الآلية أداء بثقة دون توجيه، والمعقدة أداء سلس لمهارة مركبة."],
["L12","m","لاعب كرة سلة يعدّل حركة التصويب التي أتقنها لتناسب موقع المدافع المتغير في كل مرة. هذا الأداء يمثل مستوى سمبسون:",["التكيف","الاستجابة الموجهة","الإدراك الحسي","الاستعداد"],"التكيف تعديل المهارة المتقنة لمواجهة مواقف جديدة. الإدراك والاستعداد والاستجابة الموجهة مستويات دنيا سابقة للإتقان."],
["L12","h","أعلى مستوى في تصنيف ديف للمجال النفس‑حركي، حيث تُؤدى المهارة تلقائياً دون تفكير، هو:",["التطبيع","التقليد","المعالجة","الدقة"],"تصنيف ديف: التقليد ← المعالجة ← الدقة ← الترابط ← التطبيع. التطبيع هو الأداء الآلي التلقائي، والتقليد أدنى المستويات."],
["L12","h","وزّع معلم موضوعات المقرر على أسابيع الفصل الدراسي محدداً زمن كل وحدة. هذا النوع من التخطيط يسمى:",["التخطيط طويل المدى (الفصلي)","التخطيط اليومي","تخطيط الدرس","التهيئة"],"توزيع المقرر على الفصل تخطيط طويل المدى. اليومي وتخطيط الدرس قصيرا المدى، والتهيئة خطوة داخل الدرس."],
["L12","h","التحق معلمون بورشة تتناول تحليل محتوى مجموعة من الدروس المترابطة وترتيب خبراتها وأنشطتها وتوزيعها زمنياً على عدة حصص. العنوان المتوقع للورشة هو:",["التخطيط للوحدة الدراسية","التخطيط اليومي","التخطيط السنوي","التخطيط الأسبوعي"],"تحليل محتوى دروس مترابطة وتوزيعها على حصص هو تخطيط الوحدة. اليومي لدرس واحد، والسنوي توزيع عام للمقرر دون تحليل تفصيلي."],
["L12","hm","أعد معلم خطة درس يومية تضمنت الأهداف والمحتوى والأساليب والوسائل والتقويم، لكنه أغفل عنصراً مهماً هو:",["التهيئة","الحوافز المادية","توزيع المقرر السنوي","اختبار نهاية الفصل"],"التهيئة عنصر أساسي في الخطة اليومية لجذب الانتباه والربط بالسابق. توزيع المقرر واختبار الفصل من التخطيط طويل المدى، والحوافز ليست عنصراً في الخطة."],
["L12","h","بدأ المعلم درسه عن الكسور العشرية بمراجعة سريعة للكسور الاعتيادية وبيان صلة الدرس الجديد بها. نوع التهيئة هنا هو:",["التهيئة التوجيهية","التهيئة الانتقالية","التهيئة التقويمية","الغلق"],"التهيئة التوجيهية تربط الدرس الجديد بالخبرات السابقة وتوجه الانتباه إلى ما سيُتعلم. الانتقالية بين أجزاء الدرس، والتقويمية تتأكد من الإتقان قبل الانتقال."],
["L12","","بعد أن أنهى المعلم الجزء الأول من الدرس، قدم ربطاً قصيراً يمهد للجزء الثاني ويوضح علاقته بما سبق. نوع التهيئة هنا:",["الانتقالية","التوجيهية","الحافزة","التقويمية"],"التهيئة الانتقالية تُستخدم للانتقال السلس بين أجزاء الدرس. التوجيهية في بداية الدرس، والتقويمية تتحقق من الإتقان، والحافزة تثير الاهتمام."],
["L12","","قبل الانتقال إلى الجزء الجديد من الدرس، طرح المعلم أسئلة سريعة ليتأكد من إتقان الطلاب للجزء السابق. نوع التهيئة هنا:",["التقويمية","التوجيهية","الحافزة","الانتقالية"],"التهيئة التقويمية تتحقق من مدى تمكن الطلاب مما سبق قبل البناء عليه. الانتقالية ربط لا تحقق، والتوجيهية ربط بالخبرات السابقة في البداية."],
["L12","m","في الدقائق الأخيرة من الحصة، طلب المعلم من الطلاب تلخيص الأفكار الرئيسة للدرس وربطها بعضها ببعض. هذه الخطوة تسمى:",["الغلق","التهيئة","التقويم القبلي","التمهيد"],"الغلق خطوة ختامية لتلخيص الدرس وتثبيته. التهيئة والتمهيد في البداية، والتقويم القبلي قبل التدريس."],
["L12","h","المعلم الناجح يحرص في بداية درسه على:",["التحقق من توافر متطلبات التعلم السابقة لدى الطلاب","تقديم اختبار ختامي للدرس","توزيع الواجب المنزلي","قراءة أهداف الدرس كما هي في الكتاب"],"المتطلبات السابقة شرط لبناء التعلم الجديد، والتحقق منها جزء من التهيئة. الاختبار الختامي والواجب في نهاية الدرس، وقراءة الأهداف حرفياً إجراء شكلي."],
["L12","h","من أفضل صور التغذية الراجعة البناءة أن تتضمن:",["تقديراً وتعليقاً يوضح ما أُحسن وما يُحسَّن","تعليقاً عاماً فقط","درجة فقط دون تعليق","مقارنة الطالب بزملائه"],"التغذية الراجعة الفعالة تجمع بين التقدير والتعليق المحدد. الدرجة وحدها أو التعليق العام لا يرشدان الطالب، والمقارنة بالأقران تضعف الدافعية."],
["L12","m","أعاد معلم أوراق الاختبار الشهري إلى طلابه بعد ثلاثة أسابيع من تطبيقه. أبرز مشكلة في هذا الإجراء أن:",["تأخر التغذية الراجعة يقلل أثرها في تصحيح التعلم","الطلاب سينسون أنهم اختُبروا","الدرجات ستكون أقل","المعلم سيحتاج إلى إعادة الاختبار"],"التغذية الراجعة الفورية أعلى أثراً، وتأخيرها يفصل بين الأداء ومعرفة النتيجة فيضعف التصحيح. البدائل الأخرى لا تصف أثر التأخير على التعلم."],
["L12","h","جميع ما يأتي من خصائص التغذية الراجعة الفعالة ما عدا:",["أن تكون عامة مثل «أحسنت» دون تفصيل","أن تكون فورية","أن تكون محددة ووصفية","أن تركز على المهمة لا على شخص الطالب"],"التغذية الراجعة العامة لا تخبر الطالب ماذا أحسن وماذا يحسّن. الفورية والتحديد والتركيز على المهمة من خصائصها الجوهرية."],
["L12","m","كتب معلمان تعليقين على مقال طالب؛ الأول: «ممتاز»، والثاني: «الفكرة واضحة لكن الدليل الثاني لا يدعمها، أضف مثالاً من النص». التعليق الأكثر فائدة للطالب هو:",["الثاني لأنه وصفي ومحدد ويوجه التحسين","الأول لأنه يرفع معنويات الطالب","الأول لأنه أقصر وأسرع","كلاهما بالقدر نفسه"],"التغذية الراجعة الوصفية المحددة توضح جوانب القوة والضعف وخطوة التحسين. «ممتاز» وحدها لا تعلّم شيئاً وإن كانت مشجعة."],
["L12","h","يؤدي استخدام التغذية الراجعة في عمليات التعلم إلى:",["معرفة الطالب بنقاط قوته وضعفه وتحسين أدائه","إحباط الطالب بمعرفة نقاط ضعفه","تحديد المستوى النهائي للتحصيل فقط","إلغاء الحاجة إلى التقويم"],"الغاية من التغذية الراجعة توجيه التعلم وتطوير الأداء. الإحباط ينتج عن سوء تقديمها لا عنها، وهي ليست حكماً نهائياً."],
["L12","m","عند تحليل محتوى درس في العلوم، تُصنف عبارة «يغلي الماء النقي عند 100 درجة مئوية عند مستوى سطح البحر» على أنها:",["حقيقة","مفهوم","تعميم","مهارة"],"الحقيقة معلومة محددة ثابتة قابلة للتحقق. المفهوم تصور مجرد لفئة (الغليان)، والتعميم علاقة بين مفهومين، والمهارة أداء."],
["L12","","عبارة «كلما زاد الضغط الجوي ارتفعت درجة غليان السائل» تمثل في تحليل المحتوى:",["تعميماً (مبدأ)","حقيقة","مفهوماً","قيمة"],"التعميم علاقة بين مفهومين أو أكثر تنطبق على حالات كثيرة. الحقيقة معلومة جزئية محددة، والمفهوم كلمة أو تصور مفرد."],
["L12","h","بعد أن صاغ المعلم الأهداف وحلل المحتوى، يحدد ما يمارسه الطلاب داخل الحصة لاكتساب الخبرات. هذا العنصر من خطة الدرس هو:",["اختيار الأنشطة التعليمية","صياغة الأهداف","تحليل المحتوى","تحديد الزمن"],"الأنشطة هي الممارسات التي يكتسب بها الطلاب الخبرات، وتُختار بعد الأهداف والمحتوى. الزمن عنصر تنظيمي لاحق."],
["L12","hm","يتكون جدول المواصفات من بُعدين هما:",["الموضوعات (المحتوى) ومستويات الأهداف","الأهداف والأنشطة","الزمن والدرجات","الطلاب والأسئلة"],"جدول المواصفات مخطط ثنائي البعد يوزع الأسئلة على موضوعات المحتوى ومستويات الأهداف. البدائل الأخرى ليست بُعدي الجدول."],
["L12","h","عند إعداد جدول المواصفات، يُحدد الوزن النسبي لكل موضوع بناءً على:",["عدد الحصص أو الأهمية النسبية للموضوع","زمن الاختبار الكلي","عدد طلاب الصف","سهولة صياغة الأسئلة"],"الوزن النسبي يعكس حجم الموضوع وأهميته (الحصص أو الأهداف). زمن الاختبار وعدد الطلاب وسهولة الصياغة لا علاقة لها بأهمية الموضوع."],
["L12","m","خُصص لوحدة «الكسور» 6 حصص من أصل 20 حصة للمقرر. إذا كان الاختبار يتكون من 40 سؤالاً، فعدد الأسئلة التي تستحقها الوحدة في جدول المواصفات هو:",["12 سؤالاً","6 أسئلة","20 سؤالاً","8 أسئلة"],"الوزن النسبي = 6 ÷ 20 = 30%، و30% من 40 = 12 سؤالاً. البديل 6 يخلط عدد الحصص بعدد الأسئلة."],
["L12","h","الهدف الأساسي من إعداد جدول المواصفات قبل بناء الاختبار هو تحقيق:",["صدق المحتوى وتمثيل الاختبار للمادة والمستويات","ثبات الاختبار عبر الزمن","سهولة تصحيح الاختبار","تقليل زمن الاختبار"],"جدول المواصفات يضمن أن الاختبار يغطي المحتوى والمستويات بأوزانها، وهذا صدق المحتوى. الثبات يُقاس بإعادة التطبيق أو الاتساق الداخلي، ولا علاقة للجدول بسهولة التصحيح."],
["L12","h","أي الممارسات الآتية تضعف الفائدة التعليمية للواجب المنزلي؟",["تكليف الطلاب بواجب عن محتوى لم يُدرَّس بعد دون توجيه","ربط الواجب بأهداف الدرس","تقديم توجيهات واضحة لحل الواجب","تصحيح الواجب وإعادته بتغذية راجعة"],"الواجب يرسخ ما تُعلم، فإسناده إلى محتوى غير مدروس دون توجيه يحوله إلى عبء بلا فائدة. البدائل الأخرى ممارسات سليمة."],
["L12","hm","بعد أن جمع المعلم مشاريع طلابه المنزلية، الإجراء الأنسب هو:",["الاطلاع على ما أنجزوه وتقديم تغذية راجعة لهم","رصد الدرجة دون تعليق","تخزين المشاريع في غرفة المصادر","مقارنة المشاريع ببعضها أمام الصف"],"قيمة الواجب في التغذية الراجعة التي يتلقاها الطالب. الدرجة وحدها لا تطور، والتخزين يهمل الطلاب، والمقارنة العلنية تحبط."],
["L12","","اشتكى طلاب من صعوبة الواجب وعدم فهم المطلوب منه. الإجراء الأنسب من المعلم عند تكليفهم بالواجب التالي هو:",["تقديم توجيهات محددة ونموذج للحل قبل التكليف","إلغاء الواجبات نهائياً","مضاعفة الواجب ليتدربوا أكثر","تكليف أولياء الأمور بحله معهم"],"التوجيهات الواضحة ونمذجة الحل من شروط الواجب الفعال. الإلغاء والمضاعفة لا يعالجان سبب الشكوى، ونقل الحل للأسرة يفقد الواجب غرضه."],
["L12","m","كلف معلم الطلاب المشاغبين بواجب إضافي مضاعف عقاباً لهم. هذا الإجراء غير سليم لأنه:",["يكوّن اتجاهاً سلبياً نحو الواجب والمادة","يزيد تحصيل الطلاب أكثر من اللازم","يستغرق وقتاً في التصحيح","يخالف رغبة أولياء الأمور"],"الواجب أداة تعلم لا عقاب؛ ربطه بالعقاب يجعله منفراً ويقتل دافعيته. البدائل الأخرى لا تمس الأثر التربوي للإجراء."],
["L12","h","إذا أراد معلم إدارة وقت حصته بفاعلية، فإن عليه:",["التخطيط المسبق وتوزيع الزمن على أنشطة الدرس","ترك الوقت مفتوحاً حسب مجريات الحصة","إتاحة الطلاب اختيار الأنشطة التي يفضلونها بغض النظر عن الوقت","تخصيص الحصة كاملة للشرح لضمان إنهاء المحتوى"],"إدارة الوقت تبدأ من التخطيط وتوزيع الزمن. ترك الوقت مفتوحاً وتفويض الاختيار للطلاب يفقدان الضبط، والشرح الكامل يهمل التطبيق والتقويم."],
["L12","h","عند التخطيط لتدريس المادة الدراسية لا بد من مراعاة:",["الفروق الفردية بين الطلاب","توافق الخطة مع خطط معلمي المدارس الأخرى","رغبة أولياء الأمور في نوع الأنشطة","أن تكون كل الدروس بالطريقة نفسها"],"التخطيط الجيد يراعي تباين الطلاب في القدرات والأنماط. البدائل الأخرى إما خارجة عن الصف أو تناقض التنويع في الطرق."],
["L12","h","عند التخطيط لتعلم مهارة معقدة، يراعي المعلم أن يتدرب المتعلم على ممارستها بصورة:",["مجزأة إلى خطوات ثم تجميعها","مركبة كاملة من البداية","نظرية دون ممارسة","سريعة لإنهاء المقرر"],"المهارات المعقدة تُجزأ إلى خطوات تُتقن ثم تُجمع. الأداء الكامل من البداية يربك المتعلم، والنظري وحده لا يبني مهارة."],
["L12","m","يخطط معلم لدرس «جمع الكسور العشرية». أول ما ينبغي أن يتأكد منه قبل تنفيذ الدرس هو:",["إتقان الطلاب لمتطلب الدرس السابق وهو الكسور الاعتيادية والمنازل العشرية","توافر جهاز العرض في الفصل","موعد اختبار الوحدة","عدد الطلاب الغائبين"],"المتطلبات السابقة شرط لبناء التعلم الجديد، والتأكد منها جزء من التخطيط. الجهاز والموعد والغياب أمور تنظيمية لا تحدد إمكانية التعلم."],
["L12","m","اكتشف المعلم أثناء التخطيط أن أنشطة الدرس تحتاج 70 دقيقة بينما الحصة 45 دقيقة. الإجراء الأنسب هو:",["إعادة ترتيب الأنشطة حسب أولويتها للأهداف وتأجيل الأقل أهمية","الاكتفاء بالشرح وتحويل كل الأنشطة إلى واجبات منزلية","أخذ حصة إضافية من زميل","تنفيذ الأنشطة كلها بسرعة دون تقويم"],"التخطيط يقوم على الأولوية للأهداف؛ فيُنفذ الأهم ويؤجل الباقي. تحويل الأنشطة كلها واجبات يفرغ الحصة من التطبيق، والحصة الإضافية والتسريع حلول غير منهجية."],
["L12","","جميع ما يأتي من عناصر خطة الدرس اليومية ما عدا:",["توزيع المقرر على أسابيع الفصل","الأهداف السلوكية","التقويم","الوسائل التعليمية"],"توزيع المقرر على الأسابيع من التخطيط طويل المدى لا من الخطة اليومية. الأهداف والتقويم والوسائل عناصر أساسية في خطة الدرس."],
["L12","m","يخطط معلم العلوم لدرس عن «الذرة» لطلاب الصف الأول المتوسط، ويعلم أن بعضهم لم يصل بعد إلى قدرة عالية على التجريد. الإجراء الأنسب في التخطيط هو:",["البدء بنماذج ومحسوسات وتمثيلات بصرية قبل الشرح المجرد","الاعتماد على التعريفات اللفظية المجردة لأنها أدق","تأجيل الدرس حتى ينضج الطلاب","تكليف الطلاب بقراءة الدرس من الكتاب فقط"],"التخطيط يراعي مستوى النمو المعرفي؛ فالمحسوسات والنماذج جسر إلى المجرد. التعريفات اللفظية والقراءة وحدها رموز مجردة، والتأجيل يهمل دور التعليم."],
["L12","h","لصياغة أهداف تقيس مستوى التطبيق وفق تصنيف بلوم يُفضل استخدام الأفعال:",["يحل، يستخدم، يوظف","يعدد، يسمي، يذكر","يقارن، يميز، يصنف","يحكم، ينقد، يبرر"],"أفعال التطبيق تعبر عن استخدام المعرفة في موقف جديد. «يعدد ويسمي ويذكر» تذكر، و«يقارن ويميز ويصنف» تحليل، و«يحكم وينقد ويبرر» تقويم."],
["L12","","الأفعال «يحكم، ينقد، يبرر، يفاضل» تنتمي إلى مستوى:",["التقويم","التطبيق","الفهم","التذكر"],"إصدار الأحكام المبررة وفق معايير هو التقويم. التطبيق استخدام، والفهم تفسير، والتذكر استرجاع."],
["L12","m","أي الأهداف الآتية في مستوى الفهم وفق تصنيف بلوم؟",["أن يعطي الطالب مثالاً من عنده على الفعل المضارع","أن يعدد الطالب علامات رفع الفعل المضارع","أن يصمم الطالب لوحة تلخص أزمنة الفعل","أن يحكم الطالب على صحة إعراب زميله"],"إعطاء مثال من عند الطالب يدل على إدراك المعنى، وهو فهم. التعداد تذكر، والتصميم إبداع، والحكم تقويم."],
["L12","","الهدف: «أن يصمم الطالب نموذجاً لمدينة مستدامة يوظف فيه مفاهيم الطاقة المتجددة» في مستوى:",["الإبداع (التركيب)","التطبيق","التحليل","الفهم"],"التصميم إنتاج بناء جديد يجمع عناصر متعددة، وهو الإبداع في التصنيف المعدل. التطبيق استخدام قاعدة في مسألة، والتحليل تفكيك."],
["L12","m","الأهمية الأساسية للتخطيط للتدريس أنه:",["يوجه التنفيذ نحو الأهداف ويجنب العشوائية ويحدد الزمن والوسائل","يُرضي المشرف التربوي عند الزيارة","يقلل عدد الحصص المطلوبة","يغني عن التقويم في نهاية الدرس"],"التخطيط خريطة التنفيذ. إرضاء المشرف غاية شكلية، والتخطيط لا يقلل الحصص ولا يغني عن التقويم بل يتضمنه."],
["L12","m","بدأ المعلم الحصة بسؤال: «لماذا تطفو السفينة الحديدية بينما يغرق مسمار صغير؟» ثم انتظر إجابات الطلاب قبل أن يبدأ الدرس. نوع التهيئة هنا:",["الحافزة","التقويمية","الانتقالية","الغلق"],"السؤال المحير يثير الاهتمام وحب الاستطلاع، وهذه التهيئة الحافزة. التقويمية تتحقق من إتقان السابق، والانتقالية بين أجزاء الدرس."]
]);
window.QB = (window.QB || []).concat([
["L13","h","يُعد التعلم النشط تطبيقاً عملياً للنظرية:",["البنائية","السلوكية","الجشطلتية","التحليلية"],"التعلم النشط يقوم على أن الطالب يبني معرفته بالمشاركة والعمل والمعلم ميسر، وهذا جوهر البنائية. السلوكية تركز على المثير والاستجابة والتعزيز."],
["L13","h","جميع ما يأتي من مبادئ التعلم النشط ما عدا:",["أن يكون المعلم المصدر الوحيد للمعرفة","مشاركة الطالب الفاعلة في بناء المعرفة","ربط التعلم بالواقع وخبرات الطلاب","تنمية مهارات التفكير العليا"],"في التعلم النشط المعلم ميسر والمصادر متعددة. المشاركة والربط بالواقع والتفكير العليا من مبادئه الأساسية."],
["L13","hm","الترتيب الصحيح لخطوات استراتيجية فكر‑زاوج‑شارك هو:",["تفكير فردي ثم مناقشة ثنائية ثم مشاركة جماعية","مناقشة ثنائية ثم تفكير فردي ثم مشاركة جماعية","مشاركة جماعية ثم تفكير فردي ثم مناقشة ثنائية","تفكير فردي ثم مشاركة جماعية ثم مناقشة ثنائية"],"تبدأ الاستراتيجية بالتفكير الفردي، ثم المزاوجة مع زميل، ثم المشاركة مع الصف. البدائل الأخرى تقلب الترتيب."],
["L13","h","طرح المعلم سؤالاً ومنح الطلاب دقيقة للتفكير فيه فردياً، ثم طلب من كل طالب مناقشة إجابته مع زميله، ثم عرض الثنائيات ما توصلوا إليه أمام الصف. الاستراتيجية المستخدمة هي:",["فكر‑زاوج‑شارك","جيكسو","الكرسي الساخن","العصف الذهني"],"الموقف يطابق الخطوات الثلاث: فردي ثم ثنائي ثم جماعي. جيكسو تقوم على مجموعات الخبراء، والكرسي الساخن أسئلة لطالب واحد."],
["L13","h","في بداية وحدة عن «الطاقة»، رسم المعلم جدولاً من ثلاثة أعمدة: ماذا أعرف؟ ماذا أريد أن أعرف؟ ماذا تعلمت؟ وملأ الطلاب العمودين الأولين قبل الدرس والثالث بعده. هذه الاستراتيجية هي:",["جدول التعلم KWL","خريطة المفاهيم","الصف المقلوب","دورة التعلم"],"الأعمدة الثلاثة هي بنية جدول KWL الذي ينشط المعرفة السابقة ويحدد هدف التعلم ويقوّمه. خريطة المفاهيم تمثيل هرمي، والمقلوب يقدم المحتوى في المنزل."],
["L13","h","استراتيجية KWL تنمي لدى الطالب في المقام الأول التفكير:",["ما وراء المعرفي","الإبداعي","الحركي","الاستقرائي"],"في KWL يفكر الطالب فيما يعرفه وما يريد معرفته وما تعلمه، أي يراقب معرفته بنفسه، وهذا ما وراء المعرفة. الإبداعي توليد جديد، والاستقرائي من الأمثلة للقاعدة."],
["L13","h","يُعد معلم وحدة إثرائية عن «أشجار النخيل» ويريد الانطلاق مما يعرفه الطلاب أنفسهم عن الموضوع. النشاط الأكثر ملاءمة لذلك هو:",["ملء عمود «ماذا أعرف» في جدول KWL أو عصف ذهني حول الموضوع","تقديم اختبار ختامي عن النخيل","عرض محاضرة شاملة عن النخيل","تكليفهم بتلخيص فصل من كتاب"],"الكشف عن المعرفة السابقة يكون بتنشيطها عبر KWL أو العصف. الاختبار الختامي والمحاضرة والتلخيص لا تنطلق مما يعرفه الطلاب."],
["L13","hm","سجل معلم العلوم شرح الدرس في مقطع فيديو يشاهده الطلاب في المنزل، وخصص وقت الحصة للأنشطة والمناقشة وحل التمارين في مجموعات. الاستراتيجية المستخدمة هي:",["الصف المقلوب","التعليم المبرمج","الفيديو التفاعلي","المحاكاة"],"الصف المقلوب يقلب مهام التعلم: المحتوى في المنزل والتطبيق في الفصل. المبرمج خطوات صغيرة بتعزيز، والمحاكاة تمثيل لموقف."],
["L13","h","الهدف الرئيس من استراتيجية الصف المقلوب هو:",["استثمار وقت الحصة في التطبيق والتفاعل والمهام العليا","تقليل عدد الحصص الأسبوعية","إعفاء المعلم من الشرح نهائياً","استبدال الكتاب المدرسي بالفيديو"],"نقل الشرح إلى المنزل يحرر وقت الحصة للتطبيق والنقاش ومراعاة الفروق. البدائل الأخرى ليست أهدافاً تربوية للاستراتيجية."],
["L13","m","في صف مقلوب، اكتشف المعلم في بداية الحصة أن ثلث الطلاب لم يشاهدوا فيديو الدرس. الإجراء الأنسب هو:",["تطبيق نشاط تحقق قصير وتخصيص زاوية مشاهدة سريعة لمن لم يشاهد ثم مواصلة الأنشطة","إعادة شرح الدرس كاملاً للجميع","منع من لم يشاهد من المشاركة في الأنشطة","إلغاء الصف المقلوب نهائياً"],"الاستراتيجية تتطلب آلية تحقق ومعالجة سريعة دون إضاعة وقت الحصة. إعادة الشرح الكامل يعيد الصف التقليدي، والمنع عقاب لا يعالج، والإلغاء حل متسرع."],
["L13","h","قدم المعلم لطلابه مشكلة واقعية غير محددة البنية ليس لها حل واحد صحيح (ازدحام مواقف المدرسة)، وطلب منهم البحث وتحديد ما يحتاجون تعلمه لاقتراح حلول. هذه الاستراتيجية هي:",["التعلم القائم على المشكلات","التعلم القائم على المشروعات","التعليم المبرمج","المحاضرة"],"التعلم القائم على المشكلات ينطلق من مشكلة واقعية مفتوحة ويحدد الطلاب حاجاتهم التعليمية. القائم على المشروعات يركز على إنتاج منتج ممتد."],
["L13","m","عمل الطلاب أسابيع عدة على إنتاج فيلم وثائقي عن تراث المنطقة ثم عرضوه أمام أولياء الأمور. الاستراتيجية المستخدمة هي:",["التعلم القائم على المشروعات","التعلم القائم على المشكلات","الاستقصاء العادل","الكرسي الساخن"],"العمل الممتد الذي ينتهي بمنتج يُعرض هو التعلم القائم على المشروعات. القائم على المشكلات ينطلق من مشكلة مفتوحة، والاستقصاء العادل مناظرة."],
["L13","h","دورة التعلم التي طورها بايبي هي:",["دورة تعلم خماسية (5E)","دورة تعلم ثلاثية","دورة تعلم رباعية","دورة تعلم مفاهيمية"],"بايبي طور دورة التعلم إلى خمس مراحل: الانشغال، الاستكشاف، التفسير، التوسع، التقويم. الثلاثية أصلها عند كاربلس."],
["L13","m","في درس عن المغناطيس، وزع المعلم مغناطيسات وأجساماً متنوعة وترك الطلاب يجربون ويسجلون ملاحظاتهم قبل أن يقدم أي شرح. هذه المرحلة في دورة التعلم الخماسية هي:",["الاستكشاف","التفسير","التوسع","التقويم"],"الاستكشاف مرحلة يعالج فيها الطلاب المواد بأنفسهم قبل الشرح. التفسير يقدم فيه المعلم المفهوم بعد الاستكشاف، والتوسع تطبيق في موقف جديد."],
["L13","","بعد أن فهم الطلاب مفهوم الكثافة، طلب المعلم منهم تفسير سبب طفو السفن الضخمة. هذه المرحلة في دورة التعلم الخماسية هي:",["التوسع (الإثراء)","الانشغال","الاستكشاف","التفسير"],"التوسع تطبيق المفهوم في موقف جديد يعمق الفهم. الانشغال إثارة في البداية، والاستكشاف تجريب قبل الشرح، والتفسير تقديم المفهوم."],
["L13","h","تبدأ دورة التعلم الثلاثية (كاربلس) بمرحلة:",["الاستكشاف","تقديم المفهوم","التطبيق","التقويم"],"ترتيب الثلاثية: استكشاف ثم تقديم المفهوم ثم تطبيق. التقويم مرحلة مستقلة في الخماسية لا الثلاثية."],
["L13","h","التوجه الحديث في التعليم الذي يُكيَّف فيه المحتوى والطرق والمنتج ليستجيب للفروق الفردية بين الطلاب هو:",["التعليم المتمايز","التعليم المبرمج","التعليم الإلكتروني","التعليم المباشر"],"التعليم المتمايز (توملينسون) يكيف عناصر التدريس وفق استعداد الطلاب واهتماماتهم وأنماطهم. المبرمج والمباشر لا يكيفان المحتوى، والإلكتروني وسيط."],
["L13","hm","أتاح معلم التاريخ لطلابه إظهار تعلمهم عن الدولة السعودية الأولى بمقال أو عرض تقديمي أو فيلم قصير حسب اختيارهم. عنصر التمايز هنا هو:",["المنتج","المحتوى","العملية","بيئة التعلم"],"تنويع طريقة إظهار التعلم هو تمايز المنتج. المحتوى ما يُتعلم، والعملية الأنشطة، والبيئة تنظيم الصف."],
["L13","","قدم المعلم المفهوم نفسه لثلاث مجموعات بأنشطة مختلفة: مجموعة بالتجربة، وأخرى بالقراءة، وثالثة بمقطع مرئي. عنصر التمايز هنا هو:",["العملية","المنتج","المحتوى","التقويم"],"تنويع الأنشطة للوصول إلى المفهوم نفسه هو تمايز العملية. تمايز المحتوى يغير ما يُقدم، والمنتج يغير طريقة إظهار التعلم."],
["L13","h","في التعليم المتمايز يثبّت المعلم هدف التعلم والمثير نفسه لجميع الطلاب، لكنه ينوّع المهام والأنشطة بحسب قدراتهم واهتماماتهم فتختلف منتجاتهم. أي المعادلات الآتية تمثل ذلك؟",["نفس المثير + مهام متنوعة = مخرجات متنوعة","نفس المثير + نفس المهمة = نفس المخرجات","مثيرات مختلفة + نفس المهمة = نفس المخرجات","نفس المثير + نفس المهمة = مخرجات متنوعة"],"في التمايز يُثبّت الهدف والمثير وتُنوَّع المهام والطرق فتتنوع المنتجات وفق قدرات الطلاب، وهذا مفتاح الملخصات المتداولة. أما «نفس المثير + نفس المهمة = مخرجات متنوعة» فتصف التدريس التقليدي حيث تختلف المخرجات رغم توحيد المهمة بسبب الفروق الفردية."],
["L13","h","رسم طالب فكرة مركزية في وسط الورقة وتفرعت منها فروع شعاعية ملونة بصور وكلمات مفتاحية، أشبه بالخلية العصبية. هذا التمثيل هو:",["خريطة ذهنية","خريطة مفاهيم","أشكال فن","جدول KWL"],"الخريطة الذهنية (بوزان) شعاعية حول فكرة مركزية بألوان وصور. خريطة المفاهيم هرمية بكلمات ربط، وأشكال فن دوائر متقاطعة للمقارنة."],
["L13","hm","نظم الطلاب مفاهيم درس «الخلية» في شكل هرمي: المفهوم الأعم في القمة والأخص أسفله، مع كتابة كلمات ربط على الأسهم بين المفاهيم. هذا التمثيل هو:",["خريطة مفاهيم","خريطة ذهنية","خط زمني","جدول مقارنة"],"خريطة المفاهيم (نوفاك) هرمية بكلمات ربط تبين العلاقات. الذهنية شعاعية بلا كلمات ربط، والخط الزمني ترتيب أحداث."],
["L13","h","تستند خرائط المفاهيم التي طورها نوفاك إلى نظرية:",["التعلم ذي المعنى لأوزوبل","الاشتراط الإجرائي لسكنر","التعلم الاجتماعي لباندورا","الجشطلت"],"نوفاك بنى خرائط المفاهيم على فكرة أوزوبل في ربط المعرفة الجديدة بالبنية المعرفية القائمة. البدائل الأخرى نظريات لا علاقة لها بتنظيم المفاهيم هرمياً."],
["L13","h","في خريطة المفاهيم توضع المفاهيم الأكثر عمومية:",["في قمة الخريطة","في قاعدة الخريطة","في الجانب الأيمن","في مركز الخريطة بلا ترتيب"],"خريطة المفاهيم هرمية تبدأ بالعام في القمة وتتدرج إلى الخاص. وضع العام في المركز يميز الخريطة الذهنية."],
["L13","m","يريد المعلم أن يقارن الطلاب بين الخلية النباتية والحيوانية مبينين أوجه الشبه والاختلاف في شكل واحد. المنظم البصري الأنسب هو:",["أشكال فن (دائرتان متقاطعتان)","الخريطة الذهنية","الخط الزمني","الخريطة الجغرافية"],"أشكال فن مصممة للمقارنة: الشبه في التقاطع والاختلاف في الجانبين. الذهنية لفكرة واحدة، والخط الزمني للأحداث."],
["L13","hm","أجاب طالب عن سؤال المعلم إجابة صحيحة لكنها ناقصة، فسأله المعلم: «هل يمكنك توضيح ما تقصده أكثر؟». هذا السؤال يسمى:",["سؤالاً سابراً توضيحياً","سؤالاً مغلقاً","سؤالاً بلاغياً","سؤالاً تقويمياً ختامياً"],"السبر التوضيحي يتبع إجابة ناقصة لتعميقها. المغلق إجابة واحدة قصيرة، والبلاغي لا ينتظر إجابة."],
["L13","h","أجاب طالب إجابة خاطئة، فبدلاً من تصحيحها مباشرة طرح المعلم سلسلة أسئلة متدرجة قادته إلى الإجابة الصحيحة بنفسه. هذا الأسلوب يسمى:",["السبر المشجع","التغذية الراجعة المؤجلة","العقاب السالب","إعادة الصياغة"],"السبر المشجع سلسلة أسئلة بعد إجابة خاطئة تقود الطالب إلى الصواب. إعادة الصياغة تُستخدم عند عدم الإجابة، والتغذية المؤجلة تأتي لاحقاً."],
["L13","h","زمن الانتظار المناسب الذي يمنحه المعلم للطلاب بعد طرح السؤال قبل اختيار المجيب هو:",["3 إلى 5 ثوانٍ","أقل من ثانية","دقيقتان على الأقل","لا يوجد انتظار؛ يجيب الأسرع"],"بحوث رو أظهرت أن 3–5 ثوانٍ ترفع جودة الإجابات ومشاركة الطلاب. الانتظار القصير جداً يحرم بطيئي الاستجابة، والطويل جداً يفقد الحصة إيقاعها."],
["L13","m","لاحظ المشرف أن المعلم يطرح السؤال ثم يجيب عنه بنفسه بعد نحو ثانية واحدة إذا لم يرفع أحد يده. التوجيه الأنسب للمعلم هو:",["زيادة زمن الانتظار إلى 3–5 ثوانٍ قبل التدخل","طرح أسئلة أسهل فقط","الاكتفاء بسؤال المتفوقين","إلغاء الأسئلة الشفهية"],"قِصر زمن الانتظار يمنع الطلاب من التفكير فيجيب المعلم بنفسه. الأسئلة الأسهل والاقتصار على المتفوقين يقللان المشاركة، والإلغاء يفقد أداة مهمة."],
["L13","","عند طرح الأسئلة الصفية، يُفضل أن يطرح المعلم السؤال أولاً ثم يختار المجيب، وذلك لـ:",["إبقاء جميع الطلاب منتبهين ومفكرين في السؤال","توفير وقت الحصة","ضمان إجابة الطالب المتفوق","تجنب إحراج الطالب الضعيف"],"اختيار المجيب قبل السؤال يجعل بقية الطلاب يتوقفون عن التفكير. البدائل الأخرى لا تعبر عن الغرض التربوي من الترتيب."],
["L13","m","أجاب طالب إجابة ناقصة، فقال المعلم لطالب آخر: «ما رأيك في إجابة زميلك؟ هل تضيف إليها؟». هذا الأسلوب يسمى:",["إعادة توجيه السؤال (السبر المحوّل)","السبر التبريري","إعادة الصياغة","التلقين"],"إعادة التوجيه تحويل السؤال إلى طالب آخر للبناء على الإجابة. التبريري يطلب «لماذا» من المجيب نفسه، وإعادة الصياغة تغيير صياغة السؤال عند عدم الإجابة."],
["L13","hm","يختبر معلم الرياضيات طلابه بعد كل وحدة، ولا ينتقل إلى الوحدة التالية حتى يتقنها معظم الطلاب بنسبة 80%، ويقدم أنشطة علاجية لغير المتقنين وإثرائية للمتقنين. الاستراتيجية التي يطبقها هي:",["التعلم للإتقان","التعليم المبرمج","الصف المقلوب","التعلم بالاكتشاف"],"التعلم للإتقان (بلوم) يقوم على التدريس ثم التقويم التكويني ثم العلاج والإثراء، ولا انتقال قبل بلوغ معيار الإتقان. المبرمج فردي بخطوات صغيرة، والمقلوب يقدم المحتوى في المنزل."],
["L13","","ما يميز استراتيجية التعلم للإتقان عن التدريس التقليدي أن:",["زمن التعلم متغير ومعيار التحصيل ثابت","زمن التعلم ثابت ومعيار التحصيل متغير","التقويم فيها ختامي فقط","الطلاب فيها متجانسون"],"في الإتقان يُمنح كل طالب الوقت الذي يحتاجه لبلوغ المعيار نفسه، عكس التقليدي الذي يثبت الزمن فتتفاوت النتائج. التقويم فيها تكويني مستمر."],
["L13","h","نمط التعليم الذي يدمج التعلم الإلكتروني مع التعلم الصفي التقليدي في إطار واحد هو:",["التعليم المدمج","التعليم المبرمج","التعلم المتنقل","الرحلات المعرفية"],"التعليم المدمج يجمع الحضوري بالإلكتروني. المتنقل عبر الأجهزة المحمولة، والمبرمج خطوات بتعزيز، والرحلات المعرفية بحث موجه."],
["L13","h","التعلم الذي يتم عبر الأجهزة المحمولة كالهواتف الذكية دون قيد بالمكان أو الزمان يسمى:",["التعلم المتنقل","التعليم المدمج","التعليم المبرمج","التعلم الاستقبالي"],"التعلم المتنقل يعتمد على الأجهزة المحمولة وحرية المكان والزمان. المدمج يتطلب حضوراً، والمبرمج أسلوب عرض المادة لا وسيطها."],
["L13","hm","صمم معلم صفحة إلكترونية تتضمن مقدمة ومهمة محددة وروابط مصادر اختارها مسبقاً ومعايير تقويم، وطلب من مجموعات الطلاب البحث فيها للوصول إلى المعلومات. ما صممه المعلم يسمى:",["رحلة معرفية (ويب كويست)","رحلة ميدانية","تعليماً مبرمجاً","مدونة تعليمية"],"الرحلة المعرفية بحث موجه عبر الإنترنت في مصادر يحددها المعلم بهذه البنية. الميدانية خارج الصف، والمدونة صفحة نشر وتعليق."],
["L13","h","تخزين الملفات والتطبيقات على خوادم عبر الإنترنت بحيث يمكن الوصول إليها ومشاركتها من أي جهاز وفي أي وقت يسمى:",["الحوسبة السحابية","التعلم المتنقل","الواقع المعزز","التعليم المبرمج"],"الحوسبة السحابية تقدم التخزين والتطبيقات كخدمة عبر الإنترنت (قوقل درايف، ون درايف). الواقع المعزز يدمج عناصر رقمية بالواقع."],
["L13","h","جميع ما يأتي من أدوات الحوسبة السحابية ما عدا:",["الذاكرة المحمولة (الفلاش)","قوقل درايف","دروب بوكس","ون درايف"],"الفلاش وسيط تخزين مادي محلي لا يعتمد على الإنترنت. البدائل الأخرى خدمات تخزين سحابي."],
["L13","h","في درس عن تأسيس المملكة، كلف المعلم الطلاب بنشاط يتضمن دمج ملفات متنوعة وتحريرها معاً عن بعد لإنتاج وثيقة مشتركة. الأداة التقنية الأنسب هي:",["مستندات مشتركة عبر الحوسبة السحابية","برنامج عرض تقديمي مثبت على جهاز واحد","الذاكرة المحمولة لتبادل الملفات","طباعة الملفات وتجميعها يدوياً"],"المستندات السحابية المشتركة تتيح التحرير التزامني عن بعد. البرنامج المحلي والفلاش والطباعة لا تتيح العمل المشترك عن بعد."],
["L13","hm","يريد معلم إنشاء فصل افتراضي لطلابه وإرسال واجب إلكتروني وتصحيحه ضمن المنصة الرسمية لوزارة التعليم. المنصة المناسبة هي:",["مدرستي","نور","عين الإثرائية","قوقل درايف"],"مدرستي المنصة الرسمية للتعليم الإلكتروني بفصول افتراضية وواجبات واختبارات. نور للإدارة التربوية والدرجات، وعين محتوى رقمي، وقوقل درايف تخزين."],
["L13","h","النظام الرسمي الذي تُرصد فيه درجات الطلاب وغيابهم وتُستخرج منه الشهادات ويتابع فيه أولياء الأمور أبناءهم هو:",["نظام نور","منصة مدرستي","بوابة عين","منصة روافد"],"نور نظام الإدارة التربوية للدرجات والغياب والشهادات. مدرستي للتعليم الإلكتروني، وعين للمحتوى الرقمي والقنوات."],
["L13","h","بوابة التعليم الوطنية التي تقدم دروساً ومحتوى رقمياً للمناهج وقنوات تلفزيونية تعليمية هي:",["عين","نور","مدرستي","توكلنا"],"عين بوابة التعليم الوطنية بدروس وقنوات عين الفضائية. نور للإدارة، ومدرستي للفصول الافتراضية، وتوكلنا تطبيق حكومي عام."],
["L13","h","موقع إلكتروني رُفعت عليه الدروس مسجلة بالصوت والصورة، ومدعوم ببريد إلكتروني، ويدخله الطالب بكلمة مرور خاصة ليتفاعل مع المواد ويتواصل مع المعلم. يصنف هذا الموقع على أنه:",["نظام إدارة تعلم","مدونة شخصية","محرك بحث","شبكة تواصل اجتماعي"],"نظام إدارة التعلم يقدم المحتوى والتفاعل والتواصل بصلاحيات دخول محددة. المدونة للنشر والتعليق، ومحرك البحث للبحث فقط."],
["L13","m","وضع معلم في عرضه التقديمي شرحاً نصياً لجهاز التنفس في شريحة، والرسم التوضيحي في شريحة أخرى منفصلة. وفق مبادئ ماير للوسائط المتعددة، هذا يخالف مبدأ:",["التقارب المكاني","التكرار الزائد","الشخصنة","التجزئة"],"مبدأ التقارب المكاني يقضي بوضع النص قرب الصورة التي يشرحها. التكرار الزائد يتعلق بتقديم النص المكتوب مع الصوت نفسه، والتجزئة بتقسيم العرض إلى أجزاء."],
["L13","","وفق مبدأ الصيغة عند ماير، عند عرض رسم متحرك لعملية البناء الضوئي يكون التعلم أفضل إذا صاحبه:",["تعليق صوتي منطوق","نص مكتوب مطول على الشاشة","نص مكتوب وصوت يقرأه حرفياً معاً","لا شيء؛ الرسم وحده كافٍ"],"الصوت المنطوق مع الرسوم يوزع الحمل على القناتين السمعية والبصرية. النص المكتوب يزاحم الرسم في القناة البصرية، وتكرار النص مع الصوت نفسه يخالف مبدأ التكرار الزائد."],
["L13","m","أضاف معلم إلى عرضه التقديمي موسيقى خلفية وصوراً تزيينية لا علاقة لها بالدرس بهدف التشويق، فلاحظ تشتت الطلاب. المبدأ الذي أخلّ به وفق ماير هو:",["الاتساق (حذف المواد غير المرتبطة)","التقارب الزماني","الشخصنة","الإشارة"],"مبدأ الاتساق يقضي بحذف الكلمات والصور والأصوات غير المرتبطة لأنها تستهلك الذاكرة العاملة. الزماني يتعلق بتزامن الصوت والصورة، والشخصنة بالأسلوب الحواري."],
["L13","m","استبدل معلم السبورة التقليدية بعرض تقديمي يحتوي النص نفسه دون أي إضافة وظيفية. هذا المستوى في نموذج SAMR هو:",["الاستبدال","التعزيز","التعديل","إعادة التعريف"],"الاستبدال استخدام التقنية بديلاً مباشراً بلا تغيير وظيفي. التعزيز يضيف تحسيناً، والتعديل يعيد تصميم المهمة، وإعادة التعريف تخلق مهمة مستحيلة سابقاً."],
["L13","m","تعاون طلاب مع طلاب من دولة أخرى عبر الإنترنت لإنتاج بحث مشترك بلغتين ونشره عالمياً، وهي مهمة ما كانت ممكنة دون التقنية. هذا المستوى في نموذج SAMR هو:",["إعادة التعريف","الاستبدال","التعزيز","التعديل"],"إعادة التعريف أعلى مستويات SAMR: مهمة جديدة كلياً غير ممكنة بلا تقنية. الاستبدال والتعزيز لا يغيران المهمة، والتعديل يعيد تصميمها دون أن تكون مستحيلة سابقاً."],
["L13","h","إطار يتكامل فيه ثلاثة أنواع من معرفة المعلم: التقنية والتربوية والمحتوى، عند التخطيط لدمج التقنية في التدريس، يسمى:",["TPACK","SAMR","ADDIE","5E"],"نموذج تيباك (ميشرا وكوهلر) يربط معرفة التقنية بالتربية والمحتوى. SAMR مستويات دمج التقنية، وADDIE للتصميم التعليمي، و5E دورة تعلم."],
["L13","h","مجموعة القواعد والمعايير التي توجه الأفراد نحو منافع التقنية الحديثة والحماية من أخطارها تُعرف بـ:",["المواطنة الرقمية","الرقابة الرقمية","الفجوة الرقمية","الحوسبة السحابية"],"المواطنة الرقمية تشمل الاستخدام الآمن والأخلاقي والمسؤول للتقنية. الرقابة الرقمية إجراء جزئي، والفجوة تفاوت في الوصول، والسحابية خدمة تخزين."],
["L13","m","نشر طالب صورة زميله على مجموعة الصف دون إذنه فتسبب في إحراجه. البعد الذي ينبغي للمعلم تعزيزه لدى الطلاب لمنع تكرار ذلك هو:",["المواطنة الرقمية وأخلاقيات الاستخدام","مهارة الكتابة على لوحة المفاتيح","التعلم المتنقل","الحوسبة السحابية"],"الموقف يتعلق بالخصوصية والاحترام في الفضاء الرقمي، وهو جوهر المواطنة الرقمية. البدائل الأخرى مهارات أو أنماط تقنية لا تعالج السلوك."],
["L13","h","المنهج بمفهومه الحديث هو:",["جميع الخبرات التي تقدمها المدرسة للطلاب داخلها وخارجها لتحقيق النمو الشامل","الكتاب المدرسي المقرر","المعلومات التي يحفظها الطالب ويتذكرها","جدول الحصص الأسبوعي"],"المفهوم الحديث يتسع ليشمل كل الخبرات والأنشطة المخططة داخل المدرسة وخارجها. الكتاب والمعلومات المحفوظة مفهوم تقليدي ضيق."],
["L13","h","تبدأ عناصر المنهج وتنتهي وفق الترتيب الآتي:",["الأهداف، المحتوى، طرق التدريس والأنشطة، التقويم","المحتوى، الأهداف، التقويم، طرق التدريس","طرق التدريس، المحتوى، الأهداف، التقويم","التقويم، الأهداف، المحتوى، طرق التدريس"],"الأهداف نقطة البداية التي يُختار المحتوى في ضوئها ثم الطرق والأنشطة، وينتهي بالتقويم الذي يتحقق من بلوغ الأهداف."],
["L13","h","العلاقة بين المنهج والمقرر الدراسي أن:",["المنهج أعم وأشمل من المقرر","المقرر أعم وأشمل من المنهج","المنهج هو المقرر نفسه","لا صلة بينهما"],"المنهج يشمل الأهداف والمحتوى والطرق والأنشطة والتقويم، والمقرر هو المحتوى المعرفي لمادة. فالمنهج أعم، والكتاب أخص من المقرر."],
["L13","hm","تعلم الطلاب من طريقة تعامل المعلم معهم ونظام المدرسة قيم الالتزام بالوقت واحترام الرأي الآخر، مع أن هذه القيم لم تُكتب في أي خطة. هذا النوع من المنهج يسمى:",["المنهج الخفي","المنهج الرسمي","المنهج الفارغ","المنهج المحوري"],"المنهج الخفي ما يتعلمه الطالب ضمنياً من مناخ المدرسة والعلاقات دون تخطيط. الرسمي مكتوب ومعلن، والفارغ ما حُذف عمداً."],
["L13","","قررت لجنة المناهج عدم تضمين موضوع معين في الكتاب عمداً، فلم يتعلمه الطلاب. هذا الموضوع ينتمي إلى:",["المنهج الفارغ (المحذوف)","المنهج الخفي","المنهج الرسمي","منهج النشاط"],"المنهج الفارغ عند آيزنر هو ما لم يُدرج عمداً فيتعلم الطالب بغيابه. الخفي يُتعلم ضمنياً، والرسمي مكتوب ومدرَّس."],
