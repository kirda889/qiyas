من نماذج المدخل المعرفي الذي يهتم بالعمليات العقلية وتنظيم المعرفة وربطها بالخبرة السابقة."],["L11","n","يشارك معلم طلابه في تحديد أهداف تعلمهم الشخصية، ويصغي لمشاعرهم بتعاطف، ويطلب منهم تقويم تقدمهم بأنفسهم، مؤدياً دور الميسر. المدخل الذي يستند إليه:",["الإنساني (الشخصي)","السلوكي","المعرفي","الاجتماعي"],"المدخل الإنساني أو الشخصي يعنى بتأثير الجوانب الوجدانية والشخصية على التعلم، ويشجع الاستقلالية المنتجة والوعي بالذات والإحساس بالمسؤولية؛ ومن نماذجه التدريس غير الموجه لروجرز."],["L11","n","يرتبط نموذج «التدريس غير الموجه» الذي يكون فيه المعلم ميسراً متقبلاً للمتعلم باسم:",["كارل روجرز","ألبرت باندورا","بنجامين بلوم","ديفيد أوزوبل"],"روجرز رائد علم النفس الإنساني وصاحب التدريس غير الموجه. باندورا للتعلم الاجتماعي، وبلوم للتعلم للإتقان، وأوزوبل للتعلم ذي المعنى والمنظم المتقدم."],["L11","n","يؤدي المعلم أمام طلابه طريقة الحوار المهذب مع المخالف، ثم يطلب منهم محاكاتها في مواقف لعب أدوار جماعية يتبادلون فيها الملاحظات. المدخل الذي يمثله هذا الإجراء:",["الاجتماعي","السلوكي","المعرفي","الإنساني"],"المدخل الاجتماعي يوظف نمذجة السلوك والتفاعل بين المتعلمين لدعم النظم التفاعلية وبناء ثقافة صفية إيجابية (مؤشر 7.1)، ويستند إلى التعلم الاجتماعي لباندورا."],["L11","n","يريد معلم علوم تعليم طلابه خطوات تجربة تتضمن مادة قابلة للاشتعال ولا تتوفر أدواتها إلا بنسخة واحدة. الطريقة المباشرة الأنسب:",["العرض العملي من المعلم مع التأكيد على قواعد السلامة","تقسيم الطلاب إلى مجموعات تنفذ التجربة في الوقت نفسه","المحاضرة مع وصف لفظي للتجربة دون أدوات","تكليف الطلاب بتنفيذها في المنزل"],"العرض العملي يناسب التجارب الخطرة أو التي لا تتوفر أدواتها للجميع، ويجمع بين الأداء والشرح؛ وتنفيذ تجربة فيها مادة قابلة للاشتعال في المنزل أو في مجموعات يعرض الطلاب للخطر."],["L11","n","أي الإجراءات الآتية أهم قبل تنفيذ العرض العملي أمام الطلاب؟",["تجريب العرض مسبقاً وترتيب المكان ليراه الجميع","توزيع ورقة الاختبار على الطلاب","إخفاء هدف العرض لزيادة التشويق","تنفيذ الخطوات بسرعة لتوفير وقت الحصة للتطبيق الفردي"],"نجاح العرض العملي يتطلب تجريبه مسبقاً، وتوضيح هدفه، وضمان رؤية الجميع، والأداء خطوة خطوة ببطء مع الشرح."],["L11","n","وفق نموذج التغيير المفاهيمي، أول شرط ليتخلى الطالب عن تصوره البديل هو:",["شعوره بعدم الرضا عن تصوره الحالي","حفظه التعريف العلمي الصحيح","إعادة المعلم شرح المفهوم عدة مرات","حصوله على درجة منخفضة في الاختبار"],"شروط بوسنر وزملائه: عدم الرضا عن التصور الحالي، ثم أن يكون المفهوم الجديد واضحاً ومعقولاً ومثمراً."],["L11","n","يعتقد طلاب أن الجسم الثقيل يسقط أسرع من الخفيف. طلب المعلم توقعاتهم، ثم أسقط أمامهم كرتين متماثلتين في الحجم مختلفتين في الكتلة من الارتفاع نفسه فوصلتا إلى الأرض معاً تقريباً، ثم ناقشهم في تفسير ما لاحظوه. الإجراء الذي استخدمه لإحداث التغيير المفاهيمي:",["إحداث تناقض معرفي بين التوقع والملاحظة","التعزيز الفوري للإجابة الصحيحة","التلقين المباشر للقانون العلمي","تقسيم المهارة إلى خطوات صغيرة"],"كشف التصور القبلي ثم تقديم حدث يخالف التوقع يولد عدم الرضا (التناقض المعرفي) الذي يمهد لتبني المفهوم العلمي؛ وهي استراتيجية توقع – لاحظ – فسر."],["L12","n","يبدأ معلم تخطيط وحدته بتحديد نواتج التعلم المستهدفة من معايير المنهج، ثم يحدد الأدلة التي تثبت تحققها، ثم يصمم الأنشطة. يمثل هذا التسلسل:",["التصميم العكسي","التخطيط الخطي من صفحات الكتاب","تحليل المهمة","التعلم للإتقان"],"التصميم العكسي يبدأ بالنتائج المرغوبة ثم أدلة التقويم ثم خبرات التعلم؛ وهو تطبيق لمؤشر 8.1: ربط أهداف التعلم بمعايير المنهج في تسلسل منطقي."],["L12","n","وفق الإطار الوطني لمعايير مناهج التعليم العام، تمثل «معايير الأداء»:",["نواتج التعلم المتوقعة في نهاية كل صف أو مستوى","وصفاً عاماً لما ينبغي أن يتعلمه المتعلم في المجال","معايير تقويم أداء المعلم في الفصل","الحد الأدنى لدرجة النجاح في المادة"],"الإطار الوطني: معايير المحتوى وصف عام لما ينبغي أن يتعلمه المتعلم في كل مجال، ومعايير الأداء تمثل نواتج التعلم المتوقعة بعد دراسته المجال في نهاية كل صف أو مستوى."],["L12","n","هدف درس ينص على «أن يقارن الطالب بين نوعين من الصخور»، لكن تقويم الدرس اقتصر على سؤال «اذكر أنواع الصخور». المشكلة في هذا التخطيط:",["عدم المحاذاة المعرفية بين الهدف والتقويم","صياغة الهدف بفعل غير قابل للقياس والملاحظة","كثرة أدوات التقويم في الدرس","ارتباط الهدف بمعايير المنهج"],"المحاذاة تعني أن الهدف والنشاط والتقويم تقيس الشيء نفسه وبالمستوى نفسه؛ «يقارن» أعلى من «يذكر» فلا يقيسه سؤال تذكر، و«يقارن» فعل قابل للقياس."],["L12","n","وجد معلم مقطع فيديو جذاباً عن موضوع درسه، لكنه يتضمن معلومات علمية قديمة وإعلانات تجارية متكررة. القرار الأنسب وفق شروط اختيار مصادر التعلم:",["استبعاده والبحث عن مصدر دقيق وحديث","عرضه لأنه يجذب انتباه الطلاب","عرضه دون تعليق على الأخطاء لتوفير الوقت","تكليف الطلاب بمشاهدته في المنزل بدل الحصة"],"من شروط اختيار المصدر: الدقة العلمية والحداثة وموثوقية الناشر وخلوه من المحتوى غير المناسب؛ والجاذبية وحدها ليست معياراً (مؤشر 8.1)."],["L12","n","أي الآتي يُعد الشرط الأول والأساسي عند اختيار مصدر تعلم لدرس ما؟",["ارتباط المصدر بأهداف الدرس","حداثة الجهاز المستخدم في عرضه","ارتفاع تكلفته ودلالتها على جودته","كثرة المؤثرات البصرية فيه"],"المصدر وسيلة لتحقيق الهدف، فارتباطه بالهدف أول الشروط، ثم مناسبته للمتعلمين ودقته وإتاحته وأمانه وتكلفته."],["L12","n","اختار معلم تطبيقاً تفاعلياً لدرسه، ثم تذكر أن في فصله طالباً ضعيف البصر وأن شبكة المدرسة ضعيفة. الإجراء الأنسب قبل الحصة:",["تجريبه على أجهزة المدرسة وتجهيز نسخة مكبرة وبديل دون شبكة","إلغاء استخدام أي مصدر رقمي في الدرس","تنفيذ الدرس كما خُطط له تماماً، ثم حل المشكلات عند ظهورها أثناء الحصة","إعفاء الطالب ضعيف البصر من النشاط"],"من شروط اختيار المصادر الإتاحة وسهولة الوصول لجميع الطلاب وملاءمتها للإمكانات المتاحة؛ والتجريب المسبق والبديل يضمنان تحقيق الهدف للجميع."],["L13","n","أي العبارات الآتية تميز التعليم الشامل عن الدمج؟",["الشمول يكيّف البيئة والمنهج لتنوع الجميع، والدمج يُلحق الطالب بالنظام القائم","الشمول يعزل ذوي الاحتياجات في فصول خاصة، والدمج يضعهم مع أقرانهم في الفصل العادي","الشمول يقتصر على الموهوبين والمتفوقين، والدمج يقتصر على الطلاب ذوي الإعاقة","لا فرق بينهما في المفهوم ولا في الممارسة"],"التعليم الشامل يغير النظام نفسه ليناسب الجميع ويعد التنوع أمراً طبيعياً، بينما الدمج يُلحق الطالب بالنظام القائم ويطلب منه التكيف."],["L13","n","خطط معلم درسه منذ البداية بحيث يعرض المحتوى نصاً وصورة وصوتاً، ويتيح للطلاب إظهار تعلمهم كتابةً أو شفهياً أو بمنتج، وينوع أساليب التحفيز. يطبق المعلم:",["مبادئ التصميم الشامل للتعلم","التعليم المبرمج الخطي","نموذج التدريس المباشر الصريح","استراتيجية التعلم للإتقان"],"التصميم الشامل للتعلم من ممارسات التعليم الشامل: وسائل متعددة للتمثيل وللتعبير والأداء وللمشاركة والتحفيز، يُخطط لها من البداية لا بعد ظهور المشكلة."],["L13","n","وفق مؤشرات المعيار الثامن، تشمل الأولويات المتصلة بالأبعاد المشتركة في المناهج:",["المواطنة المسؤولة وريادة المملكة والتنمية المستدامة","تقوى الله والوسطية والاعتدال والشغف المعرفي وتقدير الذات","حل المشكلات والاعتماد على الذات والتواصل والعمل الجماعي","القراءة والكتابة والحساب والمهارات الرقمية"],"مؤشر 8.4 الأول: خبرات تستهدف تنمية الأولويات المتصلة بالمواطنة المسؤولة ومكانة المملكة الريادية والتنمية المستدامة؛ البديل الثاني من القيم، والثالث من المهارات."],["L13","n","يدرّس معلم علوم درساً عن الطاقة، فكلف طلابه بتحليل فاتورة كهرباء المدرسة واقتراح خطة لترشيد الاستهلاك. الأولوية التي ينميها بصورة مباشرة:",["التنمية المستدامة","الشغف المعرفي","تقدير الذات","مكانة المملكة الريادية"],"ترشيد الموارد والحفاظ عليها للأجيال القادمة من صور التنمية المستدامة، وهي إحدى الأولويات في مؤشر 8.4."],["L13","n","أي المجموعات الآتية تمثل القيم الست التي نص عليها مؤشر المعيار الثامن للأبعاد المشتركة؟",["تقوى الله، الوسطية والاعتدال، تقدير الذات، الشغف المعرفي، تقدير العمل وإتقانه، المسؤولية","الصدق، الأمانة، التعاون، النظافة، الطاعة، الكرم","المواطنة، الريادة، الاستدامة، الإبداع، الابتكار، التميز","حل المشكلات، الاعتماد على الذات، التواصل الفعال، القيادة، التفكير الناقد، العمل ضمن فريق"],"نص مؤشر 8.4: يراعي عند تطبيق الأنشطة تنمية قيم تقوى الله، والوسطية والاعتدال، وتقدير الذات، والشغف المعرفي، وتقدير العمل وإتقانه، والمسؤولية."],["L13","n","يطرح معلم أسئلة مفتوحة تثير الفضول، ويشجع طلابه على البحث عن إجابات خارج الكتاب ومشاركة اكتشافاتهم. القيمة التي ينميها أساساً من القيم الست في الأبعاد المشتركة:",["الشغف المعرفي","تقوى الله","الوسطية والاعتدال","تقدير العمل وإتقانه"],"الشغف المعرفي حب الاستطلاع والرغبة الذاتية في المعرفة والبحث، ويُنمّى بالأسئلة المفتوحة والمشروعات البحثية."],["L13","n","تراجع معلمة مع طالباتها مشروعاتهن مرحلة بعد مرحلة، وتطلب منهن تجويدها حتى تبلغ أفضل صورة ممكنة قبل التسليم. القيمة التي تعززها:",["تقدير العمل وإتقانه","الشغف المعرفي","الوسطية والاعتدال","تقدير الذات"],"تجويد العمل ومراجعته حتى يبلغ أفضل صورة تجسيد لقيمة تقدير العمل وإتقانه."],["L13","n","أي الأنشطة الآتية أقرب إلى تنمية مهارة «الاعتماد على الذات» الواردة في مؤشرات الأبعاد المشتركة؟",["تكليف الطالب بتخطيط مهمته وتنفيذها وتقويمها بنفسه","تقديم المعلم الحل كاملاً ثم مطالبة الطالب بنسخه","حل الطالب التمارين بمساعدة ولي أمره في كل خطوة من خطوات الحل","انتظار الطالب تعليمات المعلم قبل كل خطوة"],"الاعتماد على الذات ينمو حين يتولى الطالب التخطيط والتنفيذ والتقويم بنفسه، مع دعم يتلاشى تدريجياً."],["L13","n","يعرض معلم على طلابه مشكلة واقعية في المدرسة، ويطلب منهم تحديدها وجمع المعلومات عنها واقتراح حلول وتجريب أفضلها. المهارة التي يستهدفها من مهارات إطار المناهج:",["حل المشكلات","الحفظ والاستظهار","القراءة الجهرية","الإصغاء بتفهم"],"مؤشر 8.4: يقدم أنشطة ومهام تساعد المتعلمين على استخدام استراتيجيات تنمي المهارات المحددة في إطار المناهج، ومنها حل المشكلات بخطواته."],["L14","n","اكتشف معلم بعد انتهاء الحصة أنه شرح قاعدة بصورة خاطئة. التصرف الذي يتفق مع مؤشرات المعيار التاسع:",["الاعتراف بالخطأ في الحصة التالية وتصحيحه","تجاهل الخطأ حفاظاً على مكانته أمام الطلاب","تصحيحه في ورقة الاختبار دون إشارة إلى ما حدث","انتظار أن يكتشف الطلاب الخطأ بأنفسهم"],"مؤشر 9.2 للممارس: يتراجع عن الخطأ ويصححه عند حدوثه؛ والاعتراف يعزز الثقة ويعلّم الأمانة العلمية ولا ينقص من مكانة المعلم."],["L14","n","طلب طالب من معلمه التواصل معه عبر حسابه الشخصي في وسائل التواصل لمناقشة أمور خاصة. التصرف الأنسب الذي يحفظ حدود العلاقة المهنية:",["توجيهه بلطف إلى القنوات المدرسية المعتمدة والموجه الطلابي","قبول الطلب والتواصل معه عبر حسابه الخاص لتقوية العلاقة وكسب ثقته","رفض الطلب بحدة أمام زملائه ليكون عبرة لغيره","تجاهل الطلب دون أي رد"],"مؤشر 9.2: يبقي علاقته مع المتعلمين ضمن حدود العلاقات المهنية؛ التوجيه للقنوات المعتمدة يحفظ الحدود دون جرح الطالب، والأمور الخاصة مجالها الموجه الطلابي."],["L14","n","وفق قواعد السلوك والمواظبة 1447، أي الأدوار الآتية من أدوار المعلم المنصوص عليها؟",["تمثيل القدوة الحسنة في القول والفعل","توثيق درجات السلوك ورصدها في نظام نور","إصدار قرار نقل الطالب المخالف إلى مدرسة أخرى","حسم درجات المواظبة على الطالب المتغيب"],"من أدوار المعلم في القواعد: تمثيل القدوة الحسنة في القول والفعل وتعزيز الانضباط الذاتي؛ أما توثيق درجات السلوك وحسم المواظبة فمن أدوار إدارة المدرسة، وقرار النقل تصدره الجهة المختصة في إدارة التعليم."],["L14","n","تأخر طالب في المرحلة المتوسطة عن دخول الحصة لأول مرة. وفق قواعد السلوك والمواظبة 1447، الإجراء الذي يتخذه المعلم:",["تنبيه شفهي أول بأسلوب تربوي يوضح أضرار السلوك","حسم درجتين من درجات السلوك الإيجابي","استدعاء ولي الأمر وأخذ تعهد خطي عليه بعدم التكرار","تحويله فوراً إلى لجنة التوجيه الطلابي"],"التأخر في الدخول إلى الحصص من مشكلات الدرجة الأولى، والإجراء الأول فيها التنبيه الشفهي من المعلم بأسلوب تربوي؛ وللمعلم مباشرة الإجراءات الثلاثة الأولى منها."],["L14","n","خرج طالب من الفصل دون استئذان أثناء الحصة. وفق قواعد السلوك والمواظبة 1447، دور المعلم في هذه الحالة:",["رصدها وتسليم اسم الطالب للإدارة لأنها من الدرجة الثانية","حسم درجات السلوك بنفسه مباشرة، ثم إبلاغ الطالب وولي أمره بذلك","إخراج الطالب من الصف بقية اليوم","الاكتفاء بالتنبيه الشفهي دون توثيق"],"الدخول أو الخروج من الفصل دون استئذان من مشكلات الدرجة الثانية، وعلى المعلم رصد مشكلات الدرجة الثانية فأعلى التي باشرها وتسليم الأسماء للإدارة التي تتخذ الإجراءات؛ وإقصاء الطالب خارج الصف ممارسة ممنوعة."],["L14","n","أي الممارسات الآتية نصت قواعد السلوك والمواظبة 1447 على تجنبها عند التعامل مع الطالب المخالف؟",["تكليفه بنسخ الواجب المدرسي عدة مرات عقاباً","تمكينه من فرص تعويض الدرجات المحسومة","إشعار ولي أمره بالإجراءات المتخذة","مراعاة مناسبة الإجراء لمرحلته العمرية"],"من الممارسات غير التربوية الممنوعة: الإيذاء الجسدي أو النفسي، التسبب في انقطاعه عن التعليم، حرمانه من الإفطار، تكليفه بنسخ الواجب عدة مرات كعقاب، استفزازه، السخرية منه، وإقصاؤه خارج الصف."],["L14","n","خطط معلم لنشاط على الأجهزة اللوحية، لكن المتوفر منها 10 أجهزة لفصل فيه 30 طالباً. الإجراء الأنسب لضمان إتاحة المصدر للجميع:",["مجموعات تتناوب على الأجهزة بأدوار محددة مع مهمة موازية","إعطاء الأجهزة للطلاب المتفوقين فقط لضمان إنجاز النشاط","إلغاء النشاط كاملاً","السماح لمن يملك جهازاً شخصياً فقط بالمشاركة في النشاط الرقمي"],"مؤشر 9.3: يتأكد من جاهزية مصادر التعلم وإمكانية وصول جميع المتعلمين إليها؛ والتناوب المنظم يحقق العدالة والإتاحة."],["L14","n","قبل حصة تعتمد على عرض مرئي، أي الإجراءات الآتية يحقق مؤشر جاهزية مصادر التعلم؟",["فحص الجهاز والعرض مسبقاً وتجهيز بديل","تشغيل الجهاز لأول مرة أمام الطلاب","الاعتماد على الطلاب لإصلاح أي عطل","تأجيل العرض إذا تعطل الجهاز إلى الأسبوع التالي"],"جاهزية المصدر تعني التأكد منه قبل الحصة ووجود خطة بديلة تحفظ وقت التعلم."],["L14","n","انطلق إنذار الحريق أثناء الحصة. أول ما يفعله المعلم:",["إخراج الطلاب بهدوء عبر مسار الإخلاء دون أخذ الحقائب","السماح للطلاب بجمع أغراضهم قبل الخروج","التحقق بنفسه من مصدر الإنذار قبل إخراج الطلاب","إبقاء الطلاب في الفصل مع إغلاق الباب حتى تصل تعليمات الإدارة"],"عند الإنذار تُنفذ خطة الإخلاء فوراً بهدوء وعبر المسار المحدد دون الانشغال بالأغراض، ثم يُتحقق من عدد الطلاب في نقطة التجمع."],["L14","n","قبل تنفيذ تجربة في المختبر، أي الإجراءات الآتية أولى بتحقيق عوامل الأمن والسلامة؟",["شرح تعليمات السلامة وارتداء أدوات الوقاية ووسم المواد","السماح للطلاب بتذوق المواد للتعرف عليها","البدء بالتجربة مباشرة ثم شرح التعليمات في نهايتها","ترك الطلاب ينفذون التجربة دون إشراف لتنمية استقلاليتهم"],"مؤشر 9.3: يهيئ البيئة التعليمية بطريقة تحقق عوامل الأمن والسلامة؛ وفي المختبر تسبق التعليماتُ وأدواتُ الوقاية ووسمُ المواد والإشرافُ الدائم أيَّ تجربة."],["L14","n","أخبر طالب معلمه بنيته إيذاء نفسه وبدا مضطرباً. وفق إجراءات الحالات عالية الخطورة في قواعد السلوك والمواظبة 1447، أنسب تصرف:",["أخذ كلامه بجدية وعدم تركه بمفرده مع إبلاغ الإدارة فوراً","مطالبته بالعودة إلى مقعده بهدوء حتى نهاية الحصة ثم الحديث معه","توجيه أسئلة كثيرة له لمعرفة كل التفاصيل قبل إبلاغ أحد","إخبار زملائه بحالته ليراقبوه"],"المادة 30: التعامل مع الحالة بهدوء وأخذ أقوالها بجدية، وتجنب الضغط عليها بكثرة الأسئلة، ووضعها في مكان آمن وعدم تركها بمفردها، ومراعاة خصوصيتها، وتبليغ الجهات المختصة فوراً."],["L02","n","وفق قواعد السلوك والمواظبة 1447، كيف توزع درجة السلوك البالغة 100 درجة؟",["80 درجة للسلوك الإيجابي و20 درجة للسلوك المتميز","50 درجة للسلوك و50 درجة للمواظبة","100 درجة للسلوك الإيجابي تُحسم منها المخالفات فقط","60 درجة للسلوك داخل الفصل و40 درجة خارجه"],"تخصص 100 درجة للسلوك: 80 للسلوك الإيجابي يستحقها الطالب تلقائياً بداية كل فصل وتُحسم عند المخالفة، و20 للسلوك المتميز الذي يعكس القيم الإسلامية والهوية الوطنية."],["L02","n","تغيب طالب يوماً دون عذر مقبول. أثر ذلك على درجة مواظبته وفق قواعد السلوك والمواظبة 1447:",["حسم درجة واحدة من درجات المواظبة","حسم خمس درجات من درجات المواظبة","حرمانه من دخول الاختبار مباشرة","لا يؤثر الغياب في الدرجة إلا بعد أسبوع"],"تُحسم درجة واحدة من درجات المواظبة عن غياب كل يوم دراسي بدون عذر؛ ويُحرم الطالب من الانتقال إذا تجاوز غيابه بدون عذر 10% من أيام العام."],["L02","n","وفق قواعد السلوك والمواظبة 1447، أي الآتي لا يدخل في مهام الموجه الطلابي؟",["رصد درجات السلوك وتنفيذ إجراءات الحسم على الطالب المخالف","دراسة حالة الطالب المخالف بعد تنفيذ الإجراء","متابعة الطلبة متكرري الغياب بالتنسيق مع وكيل شؤون الطلبة","توعية الطلبة المخالفين بحقهم في فرص تعويض الدرجات"],"نصت الأحكام العامة على عدم إشراك الموجه الطلابي في رصد درجات السلوك ولا في تنفيذ الإجراءات أو حسم درجات المواظبة، والاكتفاء بدوره في دراسة الحالة وعلاجها."],["L15","n","أثناء الشرح طلب معلم من الطلاب رفع بطاقات (نعم/لا) للإجابة عن سؤال سريع، فلاحظ أن نصفهم أخطأ فأعاد شرح الفكرة بمثال آخر. يمثل هذا الإجراء:",["تقويماً غير رسمي ضمن دورة التقويم قصيرة المدى","تقويماً رسمياً ضمن دورة التقويم طويلة المدى","تقويماً ختامياً لإصدار حكم نهائي على تعلم الطلاب","تقويماً معيارياً لترتيب الطلاب"],"التقويم غير الرسمي يجري تلقائياً أثناء التدريس دون درجة وغرضه تعديل التدريس فوراً، وتعديل الشرح داخل الحصة دورة تقويم قصيرة المدى (مؤشر 10.1)."],["L15","n","أي الأمثلة الآتية يمثل تقويماً رسمياً؟",["اختبار قصير معلن مسبقاً بزمن ودرجة محددين","ملاحظة المعلم لتفاعل الطلاب أثناء النقاش","سؤال شفهي عابر لتفقد الفهم","إشارة الطلاب بالإبهام لمدى فهمهم أثناء الشرح"],"التقويم الرسمي مخطط ومنظم وموثق بشروط محددة ويُبنى عليه حكم؛ البقية أساليب غير رسمية تجري ضمن التدريس."],["L15","n","وفق لائحة تقويم الطالب 2025 وإجراءاتها التنفيذية، توزع درجة المادة (100) في الصفوف من الثالث الابتدائي إلى الثالث الثانوي للمواد التي تقوم تكوينياً وختامياً على النحو الآتي:",["60 درجة للتقويمات التكوينية و40 درجة لاختبار نهاية الفترة","40 درجة للتقويمات التكوينية و60 درجة لاختبار نهاية الفترة","50 درجة للأعمال و50 درجة للاختبار","100 درجة لاختبار نهاية الفترة فقط"],"نصت الإجراءات التنفيذية على 60 درجة للتقويمات التكوينية بحسب أدوات التقويم ووحدات المقرر، و40 درجة لاختبار نهاية كل فترة دراسية."],["L15","n","طالب في الصف الثاني الثانوي حصل في إحدى المواد على 62 من 100 في الفترة الدراسية، لكنه حصل في اختبار نهاية الفترة التحريري على 6 من 40. وفق لائحة تقويم الطالب 2025، وضعه في المادة:",["لا يُعد ناجحاً لعدم تحقيقه 20% من درجة الاختبار التحريري","يُعد ناجحاً لأن مجموعه تجاوز النهاية الصغرى 50% من الدرجة","يُعد ناجحاً لأن الاختبار التحريري لا يدخل في شروط النجاح","يعيد الصف كاملاً دون دور ثانٍ"],"شرطا النجاح في المقرر بالمرحلة الثانوية: النهاية الصغرى (50%)، والنسبة الشرطية (20% من درجة الاختبار التحريري نهاية الفترة)؛ و20% من 40 = 8 درجات و6 أقل منها، فلا يُعد ناجحاً رغم تجاوز مجموعه 50، ويُختبر في الدور الثاني الذي لا تُطبق فيه النسبة الشرطية."],["L15","n","طالب لديه صعوبات تعلم في القراءة يعرف الإجابات لكنه يعجز عن قراءة أسئلة اختبار العلوم. التسهيل المناسب وفق الإجراءات التنفيذية للائحة تقويم الطالب:",["قراءة الأسئلة له بصوت مسموع قبل الإجابة","إعفاؤه من اختبار العلوم كاملاً","تخفيض درجة الاختبار إلى النصف","إعطاؤه أسئلة أسهل من أسئلة زملائه دون الرجوع لخطته"],"نصت الإجراءات التنفيذية على أنه إذا كانت قراءة الأسئلة مشكلة لدى طالب صعوبات التعلم فيجب أن تُقرأ له بصوت عال؛ والتسهيل يغير طريقة الأداء لا المستوى المقيس."],["L15","n","وفق الإجراءات التنفيذية للائحة تقويم الطالب، أي الآتي يُراعى في جميع حالات تقويم الطالب ذي الإعاقة؟",["ألا يُختبر في أكثر من مادة تحريرية في اليوم مع زمن مناسب","أن يُختبر مع زملائه في الوقت نفسه وبالشروط نفسها دون استثناء","أن تُخفض درجة النجاح إلى النصف في جميع المواد","أن يتولى معلم التعليم العام وحده إعداد أسئلته"],"نصت القاعدة السابعة على ألا يُختبر الطالب ذو الإعاقة في أكثر من مادة تحريرية في اليوم الواحد مع إعطائه الزمن المناسب وتقديم الدعم، ويتولى معلم التربية الخاصة الإشراف على تقويمه بالتعاون مع معلم التعليم العام."],["L15","n","طالب أصم في فصل دمج يكتب إجابات صحيحة المضمون لكنها تتضمن أخطاء إملائية ونحوية. وفق الإجراءات التنفيذية للائحة تقويم الطالب، يصحح معلم الدراسات الاجتماعية إجابته بحيث:",["يقيّم المضمون ولا يحاسبه على الأخطاء اللغوية","يحسم درجة عن كل خطأ إملائي","يطلب منه إعادة الإجابة شفهياً","يعطيه صفراً في الأسئلة التي فيها أخطاء لغوية"],"نصت الإجراءات على ألا يتأثر تقويم الطالب الأصم بالتركيب البنائي للغته المكتوبة، وعدم محاسبته على الأخطاء الإملائية أو النحوية في جميع المواد."],["L15","n","طالب لديه فرط حركة وتشتت انتباه يجد صعوبة في البقاء على مقعده طوال الاختبار. أي التسهيلات الآتية نصت عليها الإجراءات التنفيذية للائحة تقويم الطالب؟",["السماح له بالتحرك وتوزيع الاختبار على فترات قصيرة","إخراجه من قاعة الاختبار عند كثرة حركته","إعفاؤه من الاختبار والاكتفاء بالأعمال","إلزامه بالجلوس حتى نهاية الوقت ليتعود الانضباط والهدوء"],"نصت القاعدة السابعة لذوي فرط الحركة وتشتت الانتباه على توزيع محتوى الاختبار على فترات قصيرة، والسماح بالتوقف والتحرك، والاختبار في ركن خاص بعيداً عن المشتتات."],["L16","n","رصد معلم نتائج طلابه في برنامج جداول، فوجد أن نسبة الإتقان في معيار «حل المسائل الكلامية» بلغت 35% من الصف، بينما تجاوزت 80% في بقية المعايير. القرار الأنسب في ضوء هذا المؤشر:",["إعادة تدريس المعيار للصف بطريقة مختلفة ثم إعادة تقويمه","إعداد خطة علاجية فردية لطالبين أو ثلاثة فقط","الانتقال إلى الوحدة التالية لأن معظم المعايير متقنة","حذف أسئلة هذا المعيار من الاختبارات القادمة"],"انخفاض الإتقان لدى أغلب الصف في معيار بعينه مؤشر على حاجة التدريس نفسه إلى التعديل؛ أما انخفاضه لدى قلة فتعالجه خطط فردية (مؤشر 10.3: استخلاص المؤشرات الأساسية للأداء وتوظيفها)."],["L16","n","في الصفين الأول والثاني الابتدائي، تنص الإجراءات التنفيذية للائحة تقويم الطالب على أن يدوّن المعلم تقويمه للطالب في المعايير:",["يومياً في سجل المتابعة، ثم يرصد الخلاصة في النظام الرقمي نهاية الفترة","مرة واحدة في نهاية العام الدراسي، مباشرة في النظام الرقمي دون سجل يومي","في دفتر خاص لا يطلع عليه أحد","عند طلب ولي الأمر فقط"],"نصت الإجراءات على أن يدون المعلم تقويمه بشكل يومي في سجل متابعة تقويم الطالب، ثم يرصد خلاصة تقويمه وملحوظاته في النظام الرقمي نهاية الفترة موثقة بشواهد في ملف إنجاز الطالب."],["L16","n","أراد معلم أن يرى بسرعة في جدول درجات طلابه من لم يبلغ مستوى الإتقان في كل معيار. أنسب خاصية في برنامج الجداول لذلك:",["التنسيق الشرطي لتلوين ما دون حد الإتقان","ترتيب الطلاب أبجدياً حسب أسمائهم","تغيير نوع الخط وحجمه في جميع أعمدة الدرجات","دمج الخلايا في رأس الجدول وتلوينه"],"التنسيق الشرطي يلوّن الخلايا وفق شرط محدد (مثل أقل من 75%)، فيستخلص المعلم بسرعة الطلاب والمعايير المحتاجة إلى علاج."]];
window.OFFICIAL = [["L13","إستراتيجية التعلم التي يبحث فيها الطلاب عبر الإنترنت بحثًا جماعيًّا للوصول إلى المعلومات من مصادر موثوقة ومعدة سابقًا من طرف المعلم هي:",["الرحلات الميدانية.","الرحلات المعرفية.","التعلم المبرمج.","التعلم المدمج."],1,"الرحلات المعرفية (الويب كويست) تقوم على بحث جماعي عبر الإنترنت في مصادر اختارها المعلم مسبقًا. الرحلات الميدانية أنشطة خارج الصف، والتعلم المبرمج فردي ذاتي لا جماعي، والتعلم المدمج يدمج الإلكتروني بالصفي التقليدي. (المعيار 8.3)","1441"],["L13","لدعم عمليات التعلم بالاستقصاء، يُدرب المعلم طلابه على:",["الملاحظة وتنظيم البيانات.","استخدام وسائل التواصل التقني.","تقويم جودة الحلول التي يتوصل لها.","سرعة إنجاز المهام بنسبة مقبولة من الأخطاء."],0,"الاستقصاء يولّد المعرفة بالبحث وطرح الأسئلة عبر عمليات عقلية أساسها الملاحظة والتصنيف والقياس والتنبؤ. تقويم جودة الحلول مستوى لاحق يأتي بعد البحث، والتواصل التقني أداة بلا عملية عقلية، والإتقان السريع يتعلق بمعرفة سابقة. (المعيار 9.4)","1441"],["L12","(قدرة المتعلم على نقد وتبرير الأفكار بالنسبة لهدف معين)، يصنف هذا الهدف وفقًا لتصنيف بلوم في مستوى:",["الفهم.","التحليل.","التركيب.","التقويم."],3,"النقد والتبرير وإصدار الأحكام هي جوهر مستوى التقويم. التحليل يفكك المعلومات ويوضح العلاقات بينها، والتركيب يجمع الأفكار في بناء جديد، والفهم يصف ويفسر فقط. (المعيار 10.1)","1441"],["L13","عند طرح الأسئلة الصفية على الطلاب بهدف استثارة تفكيرهم، ينبغي على المعلم أن يركز على:",["أن يكون للسؤال إجابة واحدة صحيحة.","أن يطرح السؤال بلغة صحيحة وسليمة.","الأسئلة المباشرة التي تبحث عن حقائق محددة.","الأسئلة المفتوحة التي لا تبحث عن إجابة محددة."],3,"الأسئلة المفتوحة تتعلق بمستويات التفكير العليا فتستثير التفكير. البديلان (أ، ب) من اشتراطات صياغة الأسئلة عمومًا، والأسئلة المباشرة ترتبط بمستوى الحفظ والتذكر. (المعيار 8.3)","1441"],["L12","أي من التصنيفات الآتية يتناول المستويات العليا للأهداف النفس حركية؟",["الاستقبال - الاستجابة - التقمص.","الملاحظة - التقليد - التجريب.","الممارسة – الإتقان - الإبداع.","التقدير - التنظيم - التجسيد."],2,"الممارسة والإتقان والإبداع هي المستويات الثلاثة العليا في المجال النفس حركي. (ب) هي مستوياته الدنيا، أما (أ) و(د) فهما المستويات الدنيا والعليا للمجال الوجداني. (المعيار 10.1)","1441"],["L14","حضر معلم الصف الرابع الابتدائي موقفًا تعرض فيه أحد الطلاب للعنف اللفظي (الشتم) لأول مرة في الفصل من قِبَل مجموعة من الطلاب. أي من الآتي تكون الخطوة الأولى التي يتخذها المعلم كتصرف مباشر في مثل هذا الموقف عامة؟",["مساعدة الطالب المعنف على تعلم المهارات الاجتماعية المناسبة لعمره.","إبلاغ الإداريين والأهل بالحادثة ليتم التدخل بالأسلوب الملائم.","إشعار الطلاب المعتدين بأن سلوكهم مرفوض وستتبعه إجراءات تأديبية.","توفير نموذج للسلوك المقبول والذي يفترض على جميع الطلاب اتباعه."],2,"الخطوة الأولى في موقف يحدث لأول مرة هي إشعار المعتدين فورًا بأن سلوكهم مرفوض لتحقيق البيئة الآمنة. (أ) و(ب) خطوتان لاحقتان، و(د) إجراء عام في لائحة السلوك لا يعالج الموقف نفسه. (المعيار 9.3)","1441"],["L09","استخدام الخبرات السابقة في موقف تعليمي جديد يسمى:",["تعزيز التعلم.","الدافعية للتعلم.","انتقال أثر التعلم.","النضج المرافق للتعلم."],2,"انتقال أثر التعلم هو توظيف معلومات أو خبرات سابقة في أداء مهام في مواقف جديدة. التعزيز يدعم السلوك ليتكرر، والدافعية حالة داخلية تحرك السلوك نحو الهدف، والنضج تغيرات بيولوجية داخلية مع النمو. (المعيار 5.2)","1441"],["L04","تلقى أحد معلمي الصف الأول الثانوي مكالمة هاتفية من والد أحد طلابه وقد كان منزعجًا من حادثة حصلت لابنه في فصل هذا المعلم ويرى أن ابنه تمت معاقبته بطريقة غير عادلة، فاستجاب المعلم وطلب موعدًا لمقابلة الأب للاهتمام بالمشكلة وهو يرغب في اتخاذ خطوات لضمان التواصل الفعال مع الأب والوصول إلى مقابلة مجدية. يستطيع المعلم أن يحقق هدفه من المقابلة إذا بدأها بما يأتي:",["يطلب من الأب توضيح ردة فعله التي يظن أنها الأنسب للتعامل مع الموقف.","يتيح الفرصة للأب للتعبير عن رأيه ومشاعره ووصف فهمه لما حصل.","يراجع مع الأب قوانين المدرسة والفصل التي خالفها ابنه في ذلك الموقف.","يصف للأب بالتفصيل وجهة نظره فيما يتعلق بالحادثة وأسباب ردة الفعل."],1,"الخطوة الأولى للتفاعل الإيجابي مع ولي الأمر هي السماح له بالتعبير عن رأيه ومشاعره تجاه المشكلة. البدائل (أ، ج، د) خطوات لاحقة تأتي بعد معرفة رأي ولي الأمر وخلفيته عن الموقف. (المعيار 3.2)","1441"],["L03","يطلب المعلم في عامه الأول ـ أحيانًا ـ من زملائه الأكثر خبرة زيارته في الفصل وتقديم النقد البنّاء له. أي من الآتي تُعد أهم فائدة تحصل من هذه الطريقة؟",["تسهم في اعتياد المعلم على عملية التقويم وإحساسه بالراحة فيها.","تساعد المعلم على تعلم تطبيق المبادئ التدريسية بفاعلية في جو الفصل.","تقدم للمعلم المعرفة والخبرة بأساليب التدريس المتنوعة.","توصل لزملاء المعلم رغبته في أن يكون عضوًا فاعلًا في الفريق."],2,"المعلم الجديد يفتقر للخبرة بالأساليب التدريسية، وزيارة الزملاء له تطلعه على الأساليب الناجحة التي يستخدمونها من واقع خبراتهم. اعتياد التقويم أو إظهار الرغبة في الانتماء فوائد أقل، و(ب) لم تتضح علاقته المباشرة بالزيارة. (المعيار 2.1)","1441"],["L05","(إن الصفوة الممتازة من مثقفي الأمة العربية مشدودة إلى مجلات ودوريات تصدر في العالم العربي وتقوم بعملية التوصيل. وسر ذلك الشد والشوق والانبهار أن تلك المجلات والدوريات تعيش واقع عصرها في تغيراته الفكرية والأدبية والفنية، فتربط قارئها بما يحقق له معنى المعاصرة والمعايشة والمتابعة، وتوقظ في المكتفي بروائع تراث أمته الشعور بالتطلع إلى الإضافة بأخذ المزية وترك المجمل). الفكرة الرئيسة في هذا النص هي:",["اهتمام المثقفين بالمجلات والدوريات.","دور المجلات والدوريات في إبراز روائع التراث.","سبب اهتمام المثقفين بالمجلات والدوريات.","انقطاع صلة المثقفين بالتراث وانبهارهم بالمجلات."],2,"النص بمجمله يفسر «سر» اهتمام المثقفين بالمجلات، فالفكرة الرئيسة هي السبب لا مجرد الاهتمام. (أ) فكرة عامة لم يتناولها النص إلا كسبب، و(ب) ليس في النص ما يدل على إبراز التراث، و(د) تعارض ما ذكره النص عن الاهتمام بالتراث. (المعيار 4.1)","1441"],["L09","يقوم خالد وهو طالب يدرس في الصف الأول الابتدائي بالتحدّث مع نفسه غالبًا أثناء حلّه للمسائل والأنشطة الصفيّة. هذا الحديث للنفس يُشير إلى أن الطفل:",["يستخدم إستراتيجية تساعده في توجيه عملية التفكير.","يُظهر عدم النضج الاجتماعي.","يطوّر عادة يجب علاجها إذا استمرت.","يوظّف إستراتيجية لجذب انتباه الآخرين له."],0,"الحديث الذاتي عند فيجوتسكي وسيلة ينظم بها الطفل تفكيره ويوجه سلوكه أثناء حل المشكلات، وهو طبيعي في هذه السن. اعتباره عدم نضج أو عادة تحتاج علاجًا خطأ شائع. (المعيار 5.2)","1441"],["L13","أيٌ مما يأتي يُعَدُّ ميزة لاستخدام إستراتيجيات تدريسية متنوعة؟",["انخفاض احتمالية كره الطلاب لمواضيع أو مواد محددة.","منح المعلمين مرونة أكبر في تحضير الدروس والأنشطة.","إعطاء الطلاب فرصة لتعميم المعرفة الجديدة وتطبيقها.","تقليل شعور المعلمين بالضغط الناتج عن كثرة الموضوعات."],0,"التنويع في الإستراتيجيات يراعي أنماط الطلاب وميولهم فيقل الملل والنفور من المادة، وهذه ميزة تعود على المتعلم. (ج) ميزة الممارسة والتطبيق لا التنويع بحد ذاته، و(ب) و(د) تركزان على راحة المعلم لا على تعلم الطالب. (المعيار 8.3)","1441"],["L11","يعرض معلم التاريخ موضوع الهجرة النبوية من خلال تصميم نشاط قائم على الأسئلة باستخدام مراكز للتعلّم موزعة في صالة الأنشطة الدراسية بحيث يمر الطلاب على كل مركز منها في مجموعات تعاونية ويقومون بالقراءة أو الاستماع للتسجيل ومشاهدة لمقاطع ورسوم متحركة، وإكمال الأنشطة والأسئلة المتعلقة بالموضوع. أثناء تطبيق هذا النوع من الأنشطة، فإن أنسب دور يمكن للمعلم تأديته هو:",["المراقب بحيث يراقب الطلاب ويقوّم تقدّمهم.","النموذج الذي يشرح للطلاب الطرق المناسبة لأداء مهامهم.","المسهل الذي يقدم الدعم والإيضاحات للطلاب عند حاجتهم لها.","المدرب الذي يحلل أداء الطلاب ويقترح طرقًا لتحسينه."],2,"في مراكز التعلم التعاونية يكون التعلم متمركزًا حول الطالب، ودور المعلم ميسّر يقدم الدعم عند الحاجة. المراقب والمدرب يركزان على التقويم والتصحيح، والنموذج الشارح يعيد المعلم إلى مركز العملية. (المعيار 7.2)","1441"],["L14","أي الأعمال الآتية التي يؤديها المعلم يكون لها الأثر الأكبر في دعم طلاب الصف الثالث الثانوي عندما يكون أداؤهم جيدًا؟",["وضع ملصق مكتوب عليه عبارة «أحسنت» على أعمال الطلاب.","تسجيل أسماء الطلاب المكرمين أسبوعيًّا؛ لضمان عدم تجاهل أي طالب.","تقديم تعليقات إيجابية على الجوانب المميزة لديهم بشكل فردي.","خفض عدد الواجبات والمهام المطلوبة تشجيعًا لهم."],2,"التغذية الراجعة الفردية المحددة على الجوانب المميزة هي أقوى أشكال التعزيز لطلاب المرحلة الثانوية. الملصقات والقوائم الأسبوعية تعزيز عام غير محدد، وخفض الواجبات يقلل فرص التعلم. (المعيار 9.4)","1441"],["L09","الخطوة التي يجب على المعلم اتباعها لتعزيز قدرة الطلاب على تعلّم أي مهارة من خلال أسلوب الملاحظة هي:",["تعريف الطلاب بأصعب جوانب المهارة المقصودة.","شرح ترتيب الخطوات شفهيًّا للطلاب حسب ترتيبها في المهارة.","ضمان تركيز انتباه الطلاب على الجوانب المهمة في المهارة الموضحة.","تقديم أمثلة حيّة للطلاب على تطبيقات هذه المهارة في أرض الواقع."],3,"التعلم بالملاحظة (باندورا) يقوم أساسًا على وجود نموذج حي يؤدي المهارة أمام المتعلم ليقلده، فلا تعلم بالملاحظة بلا نموذج. (ج) مغرٍ لأن الانتباه أول عمليات النمذجة، لكنه شرط عند المتعلم يأتي بعد توفير النموذج؛ و(ب) شرح لفظي لا ملاحظة. (المعيار 10.2)","1441"],["L08","عُين أحد معلمي اللغة الإنجليزية لتدريس فصل يشتمل على عدد كبير من متعلمي اللغة الإنجليزية ذوي خلفيات لغوية متنوعة. يستطيع المعلم أن يعزز عملية التعلم لديهم على أفضل وجه عن طريق:",["جمع الطلاب ذوي المستوى المتقارب ليقدموا أنشطة في مجموعات صغيرة.","استخدام الأسئلة التي تتيح للطلاب تقديم إجابات مختصرة.","اتباع طريقة ثابتة لتقديم المفاهيم المهمة في الدرس للطلاب.","إتاحة الفرصة للطلاب ليتحدثوا عن محتوى الدرس."],0,"مراعاة الفروق الفردية تقتضي تجميع الطلاب في مجموعات متقاربة المستوى لتلقي أنشطة تناسب كل مجموعة. الإجابات المختصرة والطريقة الثابتة تتجاهل التنوع، و(د) مغرٍ لكنه لا يراعي اختلاف المستويات اللغوية. (المعيار 5.2)","1441"],["L14","أي العوامل الآتية يجب أن يأخذها المعلم بعين الاعتبار عندما يُرتب أماكن جلوس الطلاب والأدوات في الفصل؟",["مستويات إنجاز الطلاب.","طبيعة المادة والمهارات التي سيدرسها.","أنواع الأنشطة التعليمية التي سيستخدمها المعلم.","الخلفيات الاجتماعية والثقافية للطلاب."],2,"ترتيب البيئة المادية للصف يتبع نوع النشاط (فردي، مجموعات، نقاش، عرض). الترتيب بحسب مستوى الإنجاز أو الخلفية الاجتماعية يوصم الطلاب، وطبيعة المادة أعم من أن تحدد ترتيب المقاعد. (المعيار 9.3)","1441"],["L11","غالبًا ما يقدم أحد معلمي التاريخ مادته للطلاب على شكل قصة تقدم أوصافًا حيّة لشخصيات تاريخية ملهمة كافحت لتحقيق إنجازات عظيمة أو تصحيح أخطاء مجتمعية. أي من الجمل الآتية تصف أكثر النتائج احتمالًا عند استخدام هذه الإستراتيجية؟",["سيربط الطلاب بين فروع المادة العلمية مما يعيق فهمهم للمفاهيم الواسعة.","سيؤدي ذلك لاستخدام الطلاب لمخيلتهم وتنمية قدرتهم على تطبيق مهارات التفكير الإبداعي.","سيكون محتوى المادة أكثر سهولة للطلاب مما يزيد من استيعابهم لها.","سيصبح محتوى المادة أكثر ارتباطًا بحياة الطلاب مما يزيد من قدرتهم على تذكر المعلومات الواقعية."],3,"القصة تربط الحقائق التاريخية بحياة البشر وتجاربهم فتصبح ذات معنى وأسهل في التذكر. (ب) مغرٍ لكن الاستماع لقصة يقدمها المعلم لا ينمي التفكير الإبداعي بالضرورة، و(ج) السهولة ليست نتيجة مؤكدة. (المعيار 7.2)","1441"],["L10","أي مما يأتي يساعد المعلم في تعزيز التفكير الإبداعي لدى طلاب المرحلة المتوسطة بعد قراءة قصة خيالية مختارة؟",["يعيد الطلاب كتابة القصة لتغيير نهايتها.","يستخدم الطلاب الإنترنت لتحديد معلومات عن الكاتب.","يرسم الطلاب صورة لبطل القصة.","يصور الطلاب مقطعَ فيديو لإعادة تمثيل أحداث مختارة من القصة."],0,"إعادة كتابة القصة بنهاية جديدة تتطلب إنتاج أفكار أصيلة وهذا جوهر الإبداع. البحث عن الكاتب استدعاء معلومات، والرسم أو التمثيل إعادة إنتاج لما في القصة لا إضافة جديدة. (المعيار 8.2)","1441"],["L04","قام ولي أمر طالب بإرسال بريد إلكتروني لمعلم ولده، يسأله عن ابنه إن كان يعاني من صعوبات تعلم. الرد المناسب الذي ترى أنه سيقدمه المعلم في هذه الحالة هو:",["طلب موعد اجتماع بين ولي الأمر ومختص صعوبات التعلّم في المدرسة.","تقديم معلومات لولي الأمر عن خدمات تدريس الطلاب ذوي صعوبات التعلّم.","مناقشة عملية التدخلات النظامية ودور ولي الأمر في المراقبة والتقويم مع معلمه.","توصية ولي الأمر بمراقبة أداء ابنه في واجباته المدرسية وعاداته السلوكية."],0,"تشخيص صعوبات التعلم ليس من اختصاص معلم الصف، فالرد المهني إحالة ولي الأمر إلى المختص داخل المدرسة. البدائل الأخرى تفترض وجود الصعوبة قبل تشخيصها أو تقدم معلومات عامة لا تجيب عن السؤال. (المعيار 3.2)","1441"],["L03","ما الخطوة التي تقوم بها كمعلّم جديد بعد أن قضيت الأسبوع الأول في المدرسة لتساعدك في تحسين خطتك لإدارة الصف؟",["زيارة المكتبة للاطلاع على كتب ودراسات تساعد في توجيه التعامل مع أولياء الأمور.","مناقشة الصعوبات التي تراها مع مدير المدرسة وطلب تقويم متكرر لتحسين أدائك.","مراقبة المعلمين الفاعلين في المدرسة والاستفادة من خبراتهم في دعم مهاراتك التدريسية.","التعاون مع معلمين جدد آخرين في المدرسة ومناقشة الصعوبات التي واجهوها في المدرسة."],2,"التطوير المهني الأنفع للمعلم الجديد هو التعلم من الممارسة الناجحة لزملاء ذوي خبرة في السياق نفسه. المكتبة تركز على أولياء الأمور لا الإدارة الصفية، والمعلمون الجدد لا يملكون الخبرة، ومدير المدرسة خطوة أقل مباشرة. (المعيار 2.2)","1441"],["L04","يلتقي معلمو الصف الخامس الابتدائي بانتظام في إحدى المدارس لمناقشة الإستراتيجيات التدريسية التي تساعد الطلاب الذين لديهم صعوبة في مادة الرياضيات. الفائدة المرجوّة من هذا اللقاء مساعدة المعلمين على:",["تقديم تعليم مناسب لجميع أنواع ومستويات الطلاب.","مكافأة المعلمين الذين يستخدمون طرق تدريس فعّالة.","التأكيد على أن بعض المعلمين يستخدمون طرقًا تدريسية أفضل من غيرهم.","استشارة بعضهم بعضًا وتبادل الآراء حول إزالة الشعور بالإحباط لديهم."],0,"هذا مجتمع تعلم مهني هدفه تحسين تعلم الطلاب بتبادل الإستراتيجيات، لا المكافأة ولا المقارنة بين المعلمين. (د) يركز على مشاعر المعلمين لا على الطالب. (المعيار 3.1)","1441"],["L04","يرغب المعلّم (خالد) في التحدّث إلى أولياء أمور طلابه ومناقشتهم وتبادل الآراء معهم حول تقدّم الطلاب في الأداء. ما أفضل طريقة يمكن للمعلّم أن يطبقها لتحقيق هدفه؟",["كتابة ملاحظات إيجابية وإرسالها لأولياء الأمور حول مدى تقدّم أبنائهم.","عقد اجتماع لمناقشة الأهداف المشتركة مع أولياء الأمور حول أداء أبنائهم.","ضمان استلام أولياء الأمور تقارير الأداء لأبنائهم وتوقيعها وإعادتها للمعلم.","إلزام الطلاب بالمحافظة على دفتر المتابعة اليومية وتوقيعه من أولياء أمورهم."],1,"الهدف «مناقشة وتبادل آراء» ولا يحققه إلا تواصل ثنائي الاتجاه كالاجتماع. الملاحظات والتقارير ودفتر المتابعة تواصل في اتجاه واحد من المعلم إلى البيت. (المعيار 3.2)","1441"],["L14","لاحظت أثناء شرحك لدرس معيّن لطلابك عدم انتباه عدد من الطلاب ونوم أحدهم. ما التصرّف المناسب الذي تراه لمعالجة هذا الموقف؟",["تذكير الطلاب بأن عدم الانتباه للدرس سيكون له عواقب وخيمة.","التغافل عن هؤلاء الطلاب وعدم إرباك خطة سير الدرس.","عمل نشاط قصير لكسر الروتين عند الطلاب ثم العودة لشرح موضوع الدرس.","نقل أماكن جلوس الطلاب الذين لم ينتبهوا للدرس إلى المقاعد الأمامية."],2,"عدم الانتباه الجماعي مؤشر على ملل الدرس، والعلاج تغيير النشاط لاستعادة الانتباه ثم المتابعة. التهديد ونقل المقاعد يعالجان الطالب لا السبب، والتغافل يترك المشكلة. (المعيار 9.2)","1441"],["L15","طلب أحد المعلمين من طلابه في الصف الثالث الثانوي، كجزء من تقويم الأداء لديهم، أن يكمل كل طالب نموذج طلب توظيف على موقع إلكتروني مع إرفاق سيرته الذاتية. هذا النوع من الأسلوب التقويمي يسمح للطالب بأن:",["يطبق ما تعلّمه نظريًّا على أرض الواقع.","يحدد مهاراته التقنية التي يحتاجها.","يطبق إستراتيجيات ما وراء المعرفة.","يحدد أهدافه التعليمية التي يرغب في تحقيقها من المادة."],0,"هذا تقويم أصيل (واقعي) يقيس الأداء في مهمة من الحياة الحقيقية، فميزته تطبيق المتعلَّم في الواقع. تحديد المهارات أو الأهداف أو ما وراء المعرفة ليست غاية هذه المهمة. (المعيار 10.2)","1441"],["L14","اتبع معلم الصف الأول المتوسط خطوات معينة مع طلابه قبل أن يبدؤوا في تنفيذ مشاريعهم البحثية في مجموعات بغرض ضمان تنفيذ البحوث بسهولة. أي من الخطوات الآتية تعدّ أكثر فائدة لتحقيق هدفه؟",["الاجتماع بالطلاب في بداية العمل وعند نهايته لتقويم العمل.","عمل قائمة بالمهارات الأكاديمية اللازمة لإكمال المشروعات البحثية بنجاح.","وضع جدول يحدد أوقات الاجتماع بكل مجموعة بحثية؛ لمناقشتهم والإجابة عن أسئلتهم.","طلب المعلم من بقية زملائه معلمي الصف الأول المتوسط دمج بعض مهارات البحث في دروسهم."],2,"الهدف سهولة التنفيذ، وأكثر ما يضمنها متابعة منتظمة لكل مجموعة في جدول معلن يُجاب فيه عن أسئلتهم أثناء العمل. الاجتماع في البداية والنهاية فقط يترك فترة التنفيذ بلا دعم، وقائمة المهارات تخطيط لا متابعة. (المعيار 9.2)","1441"],["L14","اتفق المعلمون في إحدى المدارس المتوسطة في أحد اجتماعاتهم لمناقشة مشكلة التسرّب من المدرسة، على أهمية تحديد طرق لإدارة صفوفهم بصورة أكثر فاعلية. عند مناقشة هذه المشكلة يجب على المعلمين أن يأخذوا بعين الاعتبار أن الهدف الرئيس لإدارة بيئة تعلّم طلابهم هو تنظيم:",["الأنشطة المدرسية لضمان التركيز على الأنشطة التي يبادر بها الطلاب.","الوقت في جدول يتيح للطلاب معرفة أقصى وقت يستغرقه الدرس مسبقًا.","الوقت لضمان تنفيذ أنشطة تتيح المشاركة الجماعية والفردية بالتساوي.","الأنشطة بطرق تعزز حس الطلاب الانتمائي والمشاركة في عضوية مجتمع تعلّم متعاون."],3,"التسرب مرتبط بضعف الانتماء، فالهدف الرئيس لإدارة بيئة التعلم بناء شعور الطالب بالانتماء والعضوية في مجتمع متعاون. تنظيم الوقت والأنشطة بالتساوي وسائل إجرائية لا هدف رئيس. (المعيار 8.2)","1441"],["L13","درّب معلم اللغة العربية للصف الأول الثانوي طلابه على استخدام أساليب متنوعة للقراءة: القراءة السريعة للاطلاع، القراءة السريعة للبحث عن معلومة، القراءة لمعرفة الفكرة الرئيسة للنص، وغيرها. هذا التدريب الذي قدمه المعلم يساعد طلابه على:",["تقويم فاعلية الأساليب الأدبية في القصص الخيالية التي يدرسونها.","تعديل طريقة قراءتهم لتناسب الغرض منها للتعامل مع النصوص المختلفة.","استخدام إستراتيجيات التقويم الذاتي لتحسين مستويات القراءة.","تحليل صحة الحجج ودقة الجمل المساندة في الكتابة المقنعة لهم."],1,"كل أسلوب قراءة ذُكر مرتبط بغرض مختلف (اطلاع، بحث، فكرة رئيسة)، فالمهارة المكتسبة هي اختيار طريقة القراءة بحسب الغرض. التقويم الذاتي وتحليل الحجج ونقد الأساليب الأدبية مهارات أخرى لم يدرّب عليها. (المعيار 8.3)","1441"],["L15","عندما يرغب المعلم في بناء اختبار تشخيصي تحريري لطلابه، فإن الهدف الأساسي من الاختبار هو أن:",["يتحدّى الطلاب في تطبيق معارفهم ومهاراتهم بطرق جديدة عليهم.","يحدّد نقاط القوة والضعف لدى الطلاب وحاجاتهم التعليمية.","يوضّح الفروق الفردية بين الطلاب فيما يتعلق بالمعارف والمهارات المستهدفة.","يقدم معلومات عن إمكانات الطلاب المستقبلية إضافة إلى إنجازاتهم الحالية."],1,"الاختبار التشخيصي يكشف نقاط القوة والضعف والحاجات قبل التدريس أو عند تعثر التعلم. إظهار الفروق الفردية وظيفة الاختبار التحصيلي معياري المرجع، والتنبؤ بالإمكانات وظيفة اختبارات الاستعداد. (المعيار 10.2)","1441"],["L13","طلب معلم الأحياء من طلابه البحث في الإنترنت لجمع معلومات ضرورية لعمل تقارير بحثية متنوّعة. يمكن للطلاب أن يقوّموا المعلومات التي وجدوها في أحد المواقع من حيث دقتها وصحتها من خلال:",["عدد الروابط الموجودة على الموقع وسرعة تحديثها.","وجود معلومات مُعدّ الموقع وإمكانية التأكّد منها.","وضوح المعلومات المعروضة في الموقع.","تقديم المعلومات بطريقة جديّة ومنظمة."],1,"مصداقية المصدر الرقمي تُحكم بمعرفة جهة الإعداد وإمكانية التحقق منها. الوضوح والتنظيم وكثرة الروابط مظاهر شكلية لا تثبت الدقة. (المعيار 9.3)","1441"],["L14","أي الأعمال الآتية يقوم بها المعلم لكي يضمن إيجاد بيئة إيجابية في أحد صفوف المرحلة الابتدائية التي يدرسها؟",["وضع أهداف تعليمية موحدة لجميع الطلاب.","تقديم دروس سهلة لجميع الطلاب.","إلقاء التحية على الطلاب عند دخول الفصل.","منح الطلاب حرية تكوين المجموعات أثناء الأنشطة الجماعية."],2,"البيئة الإيجابية تبدأ بعلاقة دافئة وإشعار الطلاب بالترحيب، والتحية اليومية أبسط تطبيق لذلك. الأهداف الموحدة تتجاهل الفروق، والدروس السهلة تخفض التوقعات، وحرية المجموعات قد تقصي بعض الطلاب. (المعيار 9.3)","1441"],["L10","أكمل طلاب الصف الثالث المتوسط دراسة وحدة في مادة التاريخ عن المستكشفين الأوائل لأوروبا. أيّ من الأنشطة الآتية يساعد في إظهار أعلى مستوى لمهارة التفكير الناقد عند الطلاب؟",["وضع خط زمني لتسلسل الأحداث خلال فترة التوسع باتجاه الغرب.","إكمال اختبار قصير من فقرات الاختيار من متعدد في نهاية الوحدة.","كتابة مقال من وجهة نظر المستكشفين الأوائل في تلك الفترة.","رسم صورة تخيلية لأحد المستكشفين الأوائل في تلك الفترة."],2,"كتابة مقال من منظور شخصية تاريخية تتطلب تحليل الأحداث وتفسير دوافعها والحكم عليها، وهي مستويات عليا. الخط الزمني والاختبار القصير تذكّر وترتيب، والرسم التخيلي نشاط إبداعي لا ناقد. (المعيار 8.2)","1441"],["L02","تلقى أحد المعلمين اتصالًا من أخصائي نفسي من عيادة خارج المدرسة يطلب فيه معلومات عن أحد طلاب الصف الأول المتوسط، ما الخطوة الأولى التي يجب على المعلم اتباعها؟",["التحدّث مع إدارة المدرسة بذلك الشأن واتباع تعليماتها.","تصوير سجلات الأداء الأكاديمي للطالب في ذلك العام وإرسالها.","استشارة معلمين آخرين لإعداد سجل غير رسمي للطالب وإرساله.","إبلاغ الطالب وأخذ إذنه بالموافقة لإرسال المعلومات المطلوبة."],0,"معلومات الطالب سرية، وأي جهة خارجية تُحال إلى إدارة المدرسة التي تملك صلاحية الإفصاح وفق اللوائح. إرسال السجلات أو إعداد سجل غير رسمي إخلال بالسرية، وإذن الطالب القاصر لا يكفي. (المعيار 1.3)","1441"],["L08","تضم إحدى المدارس طلابًا من خلفيات متنوعة، ذات ظروف اقتصادية مختلفة، بحيث تتفاوت الخلفية المعرفية بين الطلاب بسبب اطلاع بعضهم على مصادر تعليمية وثقافية أكثر من غيرهم. في مثل هذه الظروف، ينبغي للمعلم أن يدرك أن الطلاب تزيد احتمالية اختلافهم عن بعضهم بسبب اختلاف ظروفهم الاقتصادية في الآتي:",["طرق التعلّم المفضّلة لديهم.","قدرتهم على التعلّم بشكل عام.","خلفياتهم المعرفية وخبراتهم.","دافعيتهم والتزامهم بمهام التعلّم."],2,"الظروف الاقتصادية تؤثر في توفر مصادر المعرفة ونوعيتها، فتختلف الخلفية المعرفية والخبرات. لا يوجد ارتباط مباشر مثبت بين المستوى الاقتصادي والقدرة على التعلم أو أنماط التعلم أو الدافعية. (المعيار القديم 1.3)","1436"],["L13","قبل أن يقوم طلاب الصف الخامس بقراءة درس الزواحف في كتاب العلوم، ناقشهم المعلم حول الموضوع ووضع قائمة من الأسئلة المرتبطة بالزواحف التي يودون معرفة إجاباتها. هذه المناقشة القبلية للطلاب سوف تعزز لديهم فهم الدرس من خلال:",["تسهيل استخدام الطلاب لمهارات التفكير التحليلي.","وضع غرض واضح للقراءة وتنشيط المعرفة العامة.","زيادة استخدام الطلاب لاستراتيجيات مراقبة الذات.","تقديم مصطلحات غير معروفة لمحتوى المادة وربطها بالمفاهيم المعروفة."],1,"المناقشة القبلية وقائمة الأسئلة توجه القراءة نحو غرض محدد وتنشط المعرفة السابقة (التهيئة). الأسئلة قد تكون لحقائق لا للتحليل، ومراقبة الذات ليست مستهدفة، والمصطلحات الجديدة جزء ضيق مما تناولته المناقشة. (المعيار القديم 4.2)","1436"],["L13","يرغب أحد المعلمين في استخدام برنامج تطبيقي جديد لأحد الأنشطة الصفيّة، لكن قبل استخدام التطبيق لأول مرّة يُستحسن أن يقوم المعلم بالآتي:",["يوضح للطلاب الغرض من استخدام البرنامج لإثارة اهتمامهم.","يجرب مميزات البرنامج المتعددة للتأكّد من أنها تعمل كما يجب.","يراجع البرنامج مع معلمين آخرين لتحديد مدى ملاءمته للطلاب.","يعيد كتابة وثيقة الدعم الفني لضمان فهم الطلاب لها بسهولة."],2,"مراجعة البرنامج مع زملاء تحكم على مناسبته للطلاب والنشاط بقرار جماعي قبل التطبيق. (ب) مغرٍ لكنه يتأكد من أن البرنامج يعمل لا من مناسبته للطلاب، و(أ) و(د) يفترضان أن البرنامج مناسب قبل التحقق. (المعيار القديم 4.3)","1436"],["L13","أي الآتي يُعد أهم مبدأ يؤخذ بعين الاعتبار عند طرح أسئلة مهارات التحليل والتقويم على طلاب المرحلة الابتدائية؟",["أن يكون السؤال عن المعارف وله إجابة واحدة صحيحة.","أن يراعي المعلم مستوى انتباه الطلاب في الفصل وإزعاجهم.","أن يتوقع المعلم ردود فعل الطلاب ويحكم عليهم قبل أن يجيبوا على السؤال.","أن يُصاغ السؤال بأسلوب يستثير تفكير الطلبة ويحفزهم على إبداء الرأي."],3,"أسئلة التحليل والتقويم تستثير التفكير وتفتح باب الرأي والإجابات غير المتوقعة. الإجابة الواحدة تجعل السؤال معرفيًا، وتوقع الردود مسبقًا يقيد حكم المعلم، وضبط الانتباه مطلوب في كل المواقف لا في الأسئلة وحدها. (المعيار القديم 6.3)","1436"],["L15","يستعمل أحد المعلمين عددًا من الطرق الرسمية وغير الرسمية في تقويم فهم الطلاب وتطور أدائهم أثناء تدريسه لكل وحدة دراسية. الفائدة الأساسية من هذه الطريقة في التقويم هي أنها:",["تساعد الطلاب في التقويم الذاتي وتطوير فهمهم لقدراتهم وإمكاناتهم في التعلّم.","تتيح للمعلمين مراقبة تحصيل الطلبة ومدى فاعلية تدريسهم وتعديله عند الحاجة.","تقلل من مستويات القلق لدى الطلاب من عملية التقويم الختامي.","تضمن للمعلم الحصول على بيانات أكثر لأداء الطلبة يساعده في الحكم المناسب."],1,"هذا تقويم تكويني (بنائي) وظيفته الأساسية مراقبة التقدم وتعديل التدريس أثناء الوحدة. (د) مغرٍ لكن جمع بيانات أكثر للحكم وظيفة التقويم الختامي في نهاية الوحدة، وتقليل القلق فائدة ثانوية. (المعيار القديم 7.2)","1436"],["L14","حضر معلم الصف الرابع الابتدائي موقفًا تعرض فيه أحد الطلاب للعنف اللفظي (الشتم) من عدد من زملائه لأول مرّة في الفصل؛ فأي الآتي يمثل الخطوة الأولى للتصرف المباشر الذي يتخذه المعلم في مثل هذا الموقف؟",["تقليل احتمالية حدوث هذه المواقف، بمساعدة الطالب المتعرّض للعنف على تعلم المهارات الاجتماعية المناسبة لعمره.","تبليغ إدارة المدرسة والمرشد والأهل بالحادثة ليتدخلوا تدخلًا مباشرًا.","تنبيه الطلاب المعتدين بأن العنف مرفوض، وإذا تكرر فستكون له عواقب تأديبية.","توفير نموذج للسلوك المقبول يفترض على جميع الطلاب اتباعه."],2,"في أول حدوث للسلوك يعالج المعلم الموقف فورًا بتنبيه المعتدين وبيان خطورة التكرار. التبليغ غير مناسب لسلوك يحدث أول مرة ويمكن للمعلم علاجه بحكمته، ومساعدة الضحية وتوفير النموذج لا يعالجان الموقف الحاصل. (المعيار القديم 8.4)","1436"],["L13","أي الإستراتيجيات التالية تعد الأكثر فاعلية في تعزيز سلوك التعاون الإيجابي بين الطلاب في أحد أنشطة المجموعات الصغيرة؟",["طلب المشاركة بين أعضاء المجموعة في المواد لإكمال المهمة.","تقويم كل عضو في المجموعة لمشاركات زملائه ودورهم في إنجاز المهمة.","إلزام كل مجموعة بتسليم منتج واحد فقط.","عمل مهام معقدة تتطلب من الأعضاء الاعتماد على بعضهم في الحصول على المعلومات."],1,"تقويم الأقران داخل المجموعة يحقق المساءلة الفردية فيشارك كل طالب فعليًا لأن زملاءه سيقوّمون دوره. طلب المشاركة بدهي لا يضمنها، والمنتج الواحد لا يمنع الاتكال، و(د) مغرٍ لكن تعقيد المهام قد ينفّر الطلاب ولا يضمن المشاركة. (المعيار القديم 9.2)","1436"],["L04","تلقى أحد معلمي الصف الأول الثانوي مكالمة هاتفية من والد أحد طلابه، وقد كان منزعجًا من حادثة حصلت لابنه في فصل هذا المعلم، ويرى أن ابنه عوقب بشكل غير عادل، فاستجاب المعلم وطلب موعدًا لمقابلة الأب لمناقشة المشكلة، وهو يرغب في اتخاذ خطوات لضمان التواصل الفعال مع الأب والوصول إلى مقابلة مجدية. يستطيع المعلم أن يحقق هدفه من المقابلة إذا بدأها بما يلي:",["يطلب من الأب اقتراح العقوبة التي يرى أنها الأنسب للتعامل مع الموقف.","يتيح الفرصة للأب للتعبير عن رأيه ومشاعره ووصف فهمه لما حصل.","يراجع مع الأب قوانين المدرسة التي قام ابنه بمخالفتها في ذلك الموقف.","يصف المعلم وجهة نظره فيما يتعلق بالحادثة وأسباب ردة الفعل للأب بالتفصيل."],1,"الاستماع أولًا لولي الأمر يتيح فهم رأيه وتصحيح المفاهيم لدى الطرفين قبل أي نقاش. طلب اقتراح عقوبة أو مراجعة القوانين يفترض ثبوت المخالفة مسبقًا، وعرض وجهة نظر المعلم يعكس هدف المقابلة. (المعيار القديم 10.2)","1436"],["L03","يطلب المعلم في عامه الأول أحيانًا من زملائه الأكثر خبرة الإشراف عليه في الفصل وتقديم النقد البنّاء له. أي الآتي تُعدّ أهم فائدة يحصل عليها من هذه الطريقة؟",["تساهم في اعتياده على عملية التقويم وإحساسه بأهميتها.","تساعده على تعلم تطبيق المبادئ التدريسية بفاعلية في جو الفصل الدراسي.","تقدم له المعرفة والخبرة بآراء وفلسفات متنوعة من الزملاء في التدريس.","توصل لزملائه رغبته بأن يكون عضوًا فعالًا في الفريق."],2,"غرض الزيارة الإشرافية من الزملاء هو الحصول على تغذية راجعة وخبرة متنوعة من ذوي الخبرة لتحسين الأداء في العام الأول. الاعتياد على التقويم ليس هدفًا أساسيًا، و(ب) لم تتضح علاقته المباشرة بالإشراف، و(د) قد يأتي بنتائج عكسية. (المعيار القديم 11.2)","1436"],["L10","أي العوامل المنزلية التالية قد يكون لها الأثر الأكبر على نظرة طالب المرحلة الابتدائية لكفاءته العلمية وربما تدعمه الدراسات في هذا المجال؟",["أساليب الانضباط المتبعة في المنزل.","الترتيب بين الإخوة وطبيعة العلاقة بهم.","معتقدات الوالدين الظاهرة حول قدرات الطالب.","أنواع الألعاب في المنزل والقيمة التعليمية التي تحملها."],2,"إدراك الطفل لكفاءته (الكفاءة الذاتية) يتشكل كثيرًا من توقعات الوالدين المعلنة عن قدراته. أساليب الانضباط وترتيب الإخوة ونوع الألعاب لا تدعم الدراسات علاقة مباشرة بينها وبين نظرة الطالب لكفاءته العلمية. (المعيار القديم 1.2)","1436"],["L05","اقرأ النص التالي: «لم يعد ينظر إلى المتعلمين على أنهم مجرد أفراد مستقبلين للمعلومات، بل على أنهم أشخاص مبدعون، يشكلون بناءهم المعرفي من خلال اتخاذ دور نشط وهادف في تفاعلهم مع بيئتهم، وقادرون على تحقيق أهداف قيمة بما تتضمنه من معارف، ومهارات، واتجاهات تمكنهم من العمل تمكنًا فاعلًا وبنّاءً تحت توجيهات وإشراف المعلم. وقد طُوّرت أساليب التقويم وممارساته؛ لتعكس هذا التوجه متحولة من التركيز الضيق على عينة محددة مختارة من سلوك الطالب إلى تناول مدى واسع من السلوك في مواقف حقيقية متنوعة داخل حجرة الدراسة وخارجها». الفكرة الرئيسة في هذا النص هي:",["الطلاب هم ركيزة الإبداع بما ينجزونه من أهداف قيمة.","المعلم بقدرته على التوجيه والإشراف والقدوة هو محل الإبداع.","أساليب التقويم وتطبيقاته حولت الاهتمام للتعلم المتمركز حول الطالب.","سلوك المواقف الحقيقية داخل حجرة الدراسة هو الموجه الحقيقي لإبداع."],0,"محور النص أن المتعلم مبدع يصنع بناءه المعرفي بنفسه، وما بعده تفاصيل تخدم هذه الفكرة. (ج) مغرٍ لأن التقويم ذُكر، لكنه جزئية جاءت لتعكس التوجه لا لتكون الفكرة، ودور المعلم والمواقف الحقيقية جزئيات كذلك. (المعيار القديم 2.1)","1436"],["L06","يعطي معرض تجاري خصمًا مقداره 20% على بضائعه، فإذا كان سعر إحدى السلع 40 ريالًا قبل الخصم فكم سعرها بالريال بعد الخصم؟",["38","36","34","32"],3,"الخصم = 20 ÷ 100 × 40 = 8 ريالات، فالسعر بعد الخصم = 40 − 8 = 32 ريالًا. الخطأ الشائع طرح 20% كأنها 2 أو 4 ريالات فتظهر 38 أو 36. (المعيار القديم 2.4)","1436"],["L11","يعرض معلم التاريخ موضوع الهجرة النبوية من خلال تصميم نشاط قائم على الأسئلة، حيث يستخدم مراكز للتعلّم موزعة في صالة الأنشطة المدرسية، ويمر الطلاب في مجموعات تعاونية على كل مركز منها، ويقرؤون أو يستمعون إلى تسجيل أو يشاهدون مقاطع فيديو لإكمال النشاط. في أثناء تطبيق هذا النوع من النشاط، الدور المناسب للمعلم هو دور:",["المراقب، الذي يراقب الطلاب ويقوّم تقدّمهم.","المحاضر، الذي يشرح للطلاب الطرق المناسبة لأداء مهامهم.","الميسر، الذي يقدم الدعم والإيضاحات للطلاب عند حاجتهم لها.","المقوّم، الذي يحلل أداء الطلاب ويقترح الطرق لتحسينه."],2,"في التعلم بمراكز المجموعات يكون المعلم ميسّرًا يتدخل بالدعم عند الحاجة فقط. المحاضر يعيد المعلم إلى مركز الدرس، والمراقب والمقوّم يركزان على الحكم على الأداء لا على دعم التعلم أثناء النشاط. (المعيار القديم 4.1، صعوبة 0.585)","1436"],["L04","أرسل ولي أمر طالب بريدًا إلكترونيًا إليك لكونك معلم ولده، يسألك عن رأيك في ابنه وعن صعوبات التعلّم لديه؛ فأي الاختيارات الآتية قد يكون الأنسب في الرد عليه؟",["طلب اجتماع بين ولي الأمر ومدير المدرسة والأستاذ المتخصص في صعوبات التعلّم لدى المدرسة.","تقديم معلومات جاهزة لولي الأمر عن خدمات تدريس الطلبة ذوي صعوبات التعلّم ومصادر وبرامج متنوعة وإضافية موجودة على الإنترنت.","مناقشة عملية التدخلات النظامية ودور ولي الأمر في المراقبة والتقويم معك.","توصية ولي الأمر بمراقبة أداء ابنه في واجباته المدرسية وعاداته السلوكية باستمرار."],0,"تشخيص صعوبات التعلم من اختصاص المختص، فالرد المهني هو ترتيب اجتماع يضم المختص والإدارة وولي الأمر. البدائل الأخرى تفترض وجود الصعوبة قبل تشخيصها أو تحيل ولي الأمر إلى معلومات عامة. (المعيار القديم 10.2، صعوبة 0.325)","1436"],["L08","طُلب من أحد معلمي اللغة الإنجليزية تدريس فصل فيه طلاب ينتمون إلى ثقافات متعددة وأسر ذوات مستويات تعليمية متباينة، فأي الطرق الآتية يمكن للمعلم استخدامها لتعزيز عملية التعلم لديهم على أفضل وجه؟",["وضع الطلاب ذوي المستوى المتقارب في مجموعات تعلميّة صغيرة لأداء الأنشطة التي تناسبهم.","استخدام أساليب الأسئلة التي تتيح للطلاب ذوي الأداء المنخفض تقديم إجابات مختصرة بغض النظر عن كونها صحيحة أو غير صحيحة.","إتباع طريقة تدريس ثابتة لجميع الطلاب لتقديم المفاهيم المهمة في الدرس لهم.","إتاحة فرص متعددة للطلاب المتميزين ليتحدثوا باللغة الإنجليزية ويكتبوا ويقرؤوا عن محتوى الدرس."],0,"مراعاة الفروق تقتضي تجميعًا مرنًا بحسب المستوى مع أنشطة تناسب كل مجموعة. الطريقة الثابتة تتجاهل التنوع، وقبول إجابات خاطئة مختصرة يخفض التوقعات، و(د) يخدم المتميزين فقط. (المعيار القديم 1.3، صعوبة 0.295)","1436"],["L15","الخطوة الأولى في إعداد الاختبار التحصيلي، هي:",["صياغة الأسئلة.","إعداد تعليمات الاختبار.","تحديد الأهداف التعليمية المراد قياسها.","تحليل محتوى المادة الدراسية المستهدفة."],2,"بناء الاختبار يبدأ بتحديد الأهداف التي سيقيسها، ثم تحليل المحتوى، ثم جدول المواصفات، ثم صياغة الفقرات والتعليمات. (د) مغرٍ لأنه مبكر أيضًا لكنه يأتي بعد تحديد الأهداف. (المعيار القديم 7.1، صعوبة 0.593)","1436"],["L04","أي المواضيع الآتية يمكن وضعها على الموقع الإلكتروني لأحد الصفوف الدراسية ومناقشتها مع الطلاب وأولياء أمورهم على أن يُمكَّن الجميع من الوصول إليها والاطلاع على تفاصيلها؟",["تقارير فرديّة لتقدّم التعلّم للطلاب.","أخبار أنشطة الفصل ومواعيد التقويم وتسليم الواجبات.","الآراء الشخصية والمناظرات حول سياسة التعليم في المدرسة.","نتائج اختبارات المنطقة لجميع مستويات المراحل الدراسية."],1,"ما يُنشر للجميع يجب أن يكون معلومات عامة لا تمس خصوصية أحد، كأخبار الفصل والمواعيد. التقارير الفردية ونتائج الاختبارات بيانات سرية، والآراء والمناظرات حول السياسة لا تليق بموقع صفي رسمي. (المعيار القديم 10.2، صعوبة 0.408)","1436"],["L13","أي الأساليب التالية أفضل لضمان استيعاب جميع الطلاب للدرس؟",["التنويع في طرق التدريس المتبعة.","توجيه مجموعة من الأسئلة للطلاب.","البدء بعرض المفاهيم الرئيسة للموضوع.","إعادة شرح الدرس في الحصة عدة مرات."],0,"لا يستوعب «جميع» الطلاب إلا إذا تنوعت الطرق لتناسب اختلاف أنماطهم وقدراتهم. إعادة الشرح بالطريقة نفسها لا تفيد من لم يفهم أول مرة، والأسئلة أداة تقويم لا ضمان استيعاب. (المعيار القديم 4.2، صعوبة 0.629)","1436"],["L12","«تدريب التلاميذ على أداء العبادات أداءً صحيحًا». أي الأهداف الخاصة التالية يمكن اشتقاقه من الهدف العام السابق لتحقيقه؟",["أن يعرف الطالب الوضوء تعريفًا كاملًا.","أن يعدد الطالب أركان الوضوء وشروطه.","أن يؤدي الطالب فرض الوضوء بصورة صحيحة.","أن يذكر الطالب شواهد من القرآن والسنة على فرض الوضوء."],2,"الهدف العام مهاري (أداء العبادات)، فالهدف الخاص المشتق منه يجب أن يكون أداءً كذلك: «يؤدي». التعريف والتعديد وذكر الشواهد أهداف معرفية لا تحقق «الأداء الصحيح». (المعيار القديم 5.1، صعوبة 0.762)","1436"],["L15","أي الآتي يُعدّ أسلوب التقويم الأكثر مناسبة لقياس مدى تمكن الطلاب من محتوى مادة الرياضيات في الصف الثاني الثانوي في الشهر الثاني؟",["اختبار تشخيصي تقدّمه إدارة التربية والتعليم.","الاختبار الذي يعده المعلم لطلابه في المدرسة.","اختبار الإنجاز المقنن الذي توفره الوزارة.","اختبارات يومية قصيرة يتضمنها كتاب الطالب."],1,"قياس التمكن من محتوى درّسه المعلم في فترة محددة يناسبه اختبار من إعداد المعلم نفسه لأنه مطابق لما دُرّس. الاختبارات المقننة والتشخيصية لا تطابق محتوى الشهر، والاختبارات اليومية القصيرة لا تغطي التمكن من المحتوى كله. (المعيار القديم 7.2، صعوبة 0.436)","1436"],["L09","يستخدم معلم العلوم العبارة التالية: «في غرفة الفصل تسعة مصابيح صغيرة»، لمساعدة الطلاب على تذكر عدد الكواكب في مجرتنا. تُعدّ هذه العبارة مثالًا على:",["الربط بالمعايير للدرس.","ملاحظة تلخيص المحتوى.","وسيلة مراجعة للمفاهيم.","وسيلة ربط للذاكرة."],3,"العبارة وسيلة تذكرية (ربط ذاكري) من إستراتيجيات معالجة المعلومات لتسهيل الاسترجاع. (ج) مغرٍ لكن المراجعة إعادة للمحتوى، أما هنا فصورة ذهنية تربط الرقم بشيء مألوف. (المعيار القديم 1.2، صعوبة 0.739)","1436"],["L11","إذا أردت تطبيق طريقة الاستكشاف أثناء تدريسك، فإنك تهدف إلى تدريب الطلاب على:",["تطبيق المعرفة.","اكتساب خبرات التعلم.","الحصول على المعلومات.","كيفية الوصول للمعلومات."],3,"التعلم بالاستكشاف غايته أن يتعلم الطالب «كيف» يصل إلى المعرفة بنفسه، لا أن يتلقاها جاهزة. الحصول على المعلومات نتيجة لأي طريقة، أما الاستكشاف فيدرّب على عملية الوصول. (المعيار القديم 6.5، صعوبة 0.594)","1436"],["L10","أي الأساليب الآتية يُعدُّ مثالًا جيّدًا لتعزيز المعلم التفكير الإبداعي لدى طلاب المرحلة المتوسطة بعد قراءة قصة خيالية مختارة؟",["أن يُعيد الطلاب كتابة نهاية القطعة لتغيير نهاية القصة.","أن يستخدم الطلاب الإنترنت لتحديد معلومات عن الكاتب.","أن يرسم الطلاب صورة ثابتة لبطل القصة.","أن يصور الطلاب مقطع فيديو لإعادة تمثيل أحداث القصة."],0,"تغيير نهاية القصة إنتاج أصيل يتطلب طلاقة ومرونة وهذا جوهر الإبداع. البحث عن الكاتب تذكّر، والرسم والتمثيل إعادة إنتاج لما هو موجود. (المعيار القديم 1.2، صعوبة 0.484)","1436"],["L11","يقدم أحد معلمي الاجتماعيات مادته الدراسية للطلاب في قصة تعطي أوصافًا حيّة لشخصيات تاريخية مؤثرة في المجتمع الإنساني. أي الجمل الآتية يصف أكثر النتائج التعلّمية التي يمكن تحققها عند استخدام هذه الإستراتيجية؟",["سوف يقوم الطلاب بالربط بين فروع المادة العلمية التفصيلية مما يعيق فهمهم للمفاهيم (الصورة) الكبيرة.","سيؤدي ذلك لاستخدام الطلاب لمخيلتهم وتنمية قدرتهم على تطبيق مهارات التفكير الإبداعي في تعلمهم.","سوف يكون وقت الدرس أكثر إمتاعًا وسيصعب ربطه بمحتوى المادة من مفاهيم وحقائق.","سيصبح محتوى المادة أكثر ارتباطًا بحياة الطلاب مما يزيد من قدرتهم على تذكر المعلومات الواقعية."],3,"القصة تجعل الحقائق ذات معنى ومرتبطة بالحياة فيسهل تذكرها. (ب) مغرٍ لكن الاستماع إلى قصة المعلم لا يدرّب على الإبداع بالضرورة، و(أ) و(ج) تفترضان نتائج سلبية غير لازمة. (المعيار القديم 4.2، صعوبة 0.622)","1436"],["L08","أيّ الطرائق الآتية لا يُعَدّ من صور التعجيل الدراسي للموهوبين؟",["حذف بعض المواد الدراسية.","دراسة المادة في زمن أقل من المعتاد.","النقل إلى صفوف أعلى في زمن أقل.","قبولهم في سن مبكرة في المرحلة الابتدائية أو الجامعية."],0,"التعجيل يعني اجتياز المراحل أو المواد بزمن أقل (القبول المبكر، تخطي الصفوف، ضغط المنهج)، أما حذف مواد فليس تعجيلًا بل إنقاص للمحتوى. الفخ هنا صيغة النفي «لا يُعد». (المعيار القديم 1.4، صعوبة 0.641)","1436"],["L10","أكمل طلاب الصف الثالث المتوسط دراسة وحدة في مادة الجغرافيا عن المستكشفين الأوائل لأوروبا؛ فأيّ الأنشطة الآتية يساعد في إظهار أعلى مستوى لمهارة التفكير الناقد عند الطلاب؟",["وضع خط زمني لتسلسل الأحداث خلال فترة التوسع باتجاه الغرب.","إكمال اختبار قصير من فقرات الاختيار من متعدد في نهاية الوحدة التدريسية.","كتابة مقال من وجهة نظر المستكشفين الأوائل في تلك الفترة.","رسم صورة تخيلية لأحد المستكشفين الأوائل في تلك الفترة."],2,"المقال من منظور الشخصيات يتطلب تحليل الدوافع وتفسير الأحداث وإصدار أحكام، وهي أعلى مستويات التفكير الناقد. الخط الزمني والاختبار القصير تذكّر، والرسم التخيلي إبداع لا نقد. (المعيار القديم 4.2، صعوبة 0.387)","1436"],["L09","إذا أراد المعلم تعليم سلوك «احترام رأي الآخرين» فإن من أمثلة التعليم بالنمذجة أن:",["يمارسه.","يشرح معناه.","يحث على فعله.","يكافئ من يمارسه."],0,"النمذجة (باندورا) تعني أن يكون المعلم قدوة يؤدي السلوك أمام الطلاب ليلاحظوه ويقلدوه. الشرح والحث تلقين لفظي، والمكافأة تعزيز سلوكي لا نمذجة. (المعيار القديم 8.4، صعوبة 0.664)","1436"],["L12","كتب أحد المعلمين اختبارًا جاء فيه (عرِّف الوضوء – عدِّد فروضه) هذا النوع من الأسئلة يقيس أهدافًا تعليمية من مستوى:",["التذكر.","التطبيق.","التحليل.","التركيب."],0,"«عرّف» و«عدّد» أفعال استرجاع للمعلومات كما حُفظت، وهي مستوى التذكر في تصنيف بلوم. التطبيق يتطلب استخدام المعرفة في موقف جديد، وهذا غير مطلوب هنا. (المعيار القديم 5.1، صعوبة 0.622)","1436"],["L10","أي الأسئلة التالية يشجع على التفكير الإبداعي لدى الطلاب؟",["ما مكونات الماء؟","عدِّد أنواع الطاقة المتجددة؟","كيف نحافظ على سلامة البيئة؟","متى ولد النبي صلى الله عليه وسلم؟"],2,"السؤال المفتوح «كيف نحافظ…» يقبل إجابات متعددة ويستدعي توليد حلول، وهذا ما يشجع الإبداع. الأسئلة الأخرى لها إجابة واحدة محفوظة فهي في مستوى التذكر. (المعيار القديم 4.2، صعوبة 0.721)","1436"],["L15","طلب أحد المعلمين من طلابه في الصف الثالث الثانوي أن يقوم كل طالب بإكمال نموذج طلب توظيف على موقع إلكتروني مع إرفاق سيرته الذاتية. أراد بهذا تقويم أدائهم؛ فهذا النوع من الأسلوب التقويمي يسمح للطالب بأن:",["يطبق ما تعلّمه نظريًا على أرض الواقع.","يحدد مهاراته التقنية التي يحتاج إليها.","يطبق إستراتيجيات ما وراء المعرفة.","يحدد أهدافه التعليمية التي يرغب في تحقيقها من المادة."],0,"هذا تقويم أصيل يضع الطالب في مهمة واقعية، فميزته تطبيق التعلم النظري في الواقع. (ج) مغرٍ لأن المهمة تتطلب تخطيطًا، لكن ما وراء المعرفة ليس ما يقيسه الأسلوب. (المعيار القديم 7.2، صعوبة 0.289)","1436"],["L13","أي الآتي لا يُعَدّ من مميزات استخدام الحاسب الآلي في التعليم؟",["الجمع بين الترفيه والتعليم.","مراعاة السرعة الذاتية للتعلم.","تنمية مهارات التفاعل الاجتماعي.","اعتماد الطالب على نفسه في التعليم."],2,"التعلم بالحاسب فردي في الغالب، فمن مآخذه لا مميزاته ضعف التفاعل الاجتماعي. الترفيه والخطو الذاتي والاعتماد على النفس مميزات معروفة له. انتبه لصيغة النفي «لا يُعد». (المعيار القديم 4.3، صعوبة 0.546)","1436"],["L14","اتبع معلم الصف الأول المتوسط خطوات معينة مع طلابه قبل البداية في تنفيذ مشاريعهم البحثية كمجموعات صغيرة لضمان تنفيذ البحوث المتفق عليها بسهولة؛ فأي الخطوات التالية يُعد الأنسب والأكثر فائدة لتحقيق هدفه قبل تنفيذ المشروع؟",["الاجتماع بمسؤول المكتبة المدرسية ومناقشة سهولة تصنيف المصادر التعليمية في المكتبة.","عمل قائمة بالمهارات التعليمية المتوقع من الطلاب اكتسابها بعد تنفيذ المشروعات البحثية بنجاح.","توزيع جدول يحدد أوقات الاجتماع بكل مجموعة بحثية ويناقشهم ويجيب على أسئلتهم.","طلب المعلم من بقية زملائه معلمي الصف الأول المتوسط مناقشة الطلاب في مشروعاتهم البحثية أثناء شرح دروسهم."],2,"سهولة التنفيذ تتحقق بجدول متابعة معلن لكل مجموعة يضمن الدعم والإجابة عن الأسئلة طوال العمل. قائمة المهارات تخطيط للنواتج لا للتنفيذ، ومسؤول المكتبة والزملاء خارج دائرة المتابعة المباشرة. (المعيار القديم 5.3، صعوبة 0.496)","1436"],["L14","اجتمع المعلمون في إحدى المدارس المتوسطة لمناقشة مشكلة تسرّب الطلاب من المدرسة والتركيز على أهمية تنفيذ أساليب لإدارة صفوفهم بصورة أكثر فاعليّة. يجب على المعلمين عند مناقشة هذه المشكلة أن يأخذوا في الاعتبار أن الهدف الرئيس لإدارة بيئة تعلّم طلابهم هو:",["تنظيم الأنشطة المدرسية لضمان التركيز على الأنشطة التي يوجهها المعلم لطلابه.","تنظيم الوقت في جدول يتيح للطلاب معرفة أقصى وقت يستغرقه النشاط سلفًا.","تنظيم الأنشطة التي تتيح مشاركة الفصل بأكمله والمجموعات الصغيرة والتعلّم الفردي بالتساوي.","تنظيم الأنشطة بطرق تعزز حس الطلاب الانتمائي للمدرسة والمشاركة في عضوية مجتمع تعلّم متعاون هادف."],3,"علاج التسرب يبدأ من تعزيز انتماء الطالب للمدرسة وشعوره بالعضوية في مجتمع تعلم؛ هذا هو الهدف الرئيس لإدارة بيئة التعلم. تنظيم الوقت والمشاركة بالتساوي إجراءات تنفيذية لا هدف. (المعيار القديم 9.2، صعوبة 0.720)","1436"],["L15","طلب المعلم من كل طالب أن يجمع أعماله بانتظام في حقيبة، وفي كل أسبوع يطلب من الطلاب مراجعة أعمالهم السابقة ثم إعادتها إلى مكانها داخل الصف، فما الهدف الذي يسعى إليه المعلم من هذا الطلب؟",["مشاركة الطالب زملاءه في عملية التقويم.","إتاحة النقاش بين الطلاب للمقارنة بين أعمالهم.","تقويم مستوى الطلاب في المحافظة على مقتنياتهم.","تشجيع الطالب على التأمل في أعماله ومدى تقدمه."],3,"هذا ملف الإنجاز (البورتفوليو) وغايته التأمل الذاتي في التقدم عبر مراجعة الأعمال دوريًا. المقارنة بين الطلاب أو تقويم الأقران ليست مطلوبة هنا، والمحافظة على المقتنيات ليست هدفًا تقويميًا. (المعيار القديم 7.2، صعوبة 0.651)","1436"],["L11","يُعدّ أسلوب التعلّم الاستكشافي أداة تعليمية مناسبة لمساعدة المعلمين على تحديد الوقت الذي يضمن حصول طلابهم على فرصة في القيام بالآتي:",["تعلّم محتوى جديد بمعدّل تقدّم قياسي في الانتقال من الأسهل إلى الأكثر تعقيدًا.","الانخراط بفاعلية في عملية بناء المعرفة العلمية.","وضع أهداف تعلّم واضحة ومراقبة التقدّم في تحقيقها.","الحصول على فكرة مختصرة عن مجال واسع من المحتوى لتسهيل التعلّم فيما بعد."],0,"المفتاح الرسمي (أ): الاستكشاف الموجّه يتدرج بالطالب من البسيط إلى المعقد بمعدل يناسبه، فيحدد المعلم متى ينتقل به للمحتوى الأعلى. ⚠ المفتاح الرسمي يقول (أ)؛ الأرجح (ب) لأن جوهر التعلم الاستكشافي أن يبني الطالب المعرفة بنفسه، أما التدرج القياسي فأقرب للتعليم المبرمج. السؤال كان الأصعب في العينة (صعوبة 0.287) مما يعزز الشك في وضوحه. (المعيار القديم 4.1)","1436"],["L08","أي العبارات الآتية تصف طالبًا نمطه المفضل في التعلم «حسي»؟",["يدرك الأنماط والعلاقات.","يهتم بالرسوم البيانية والخرائط.","يميل لحل المسائل الرياضية.","يستمتع بتركيب المجسمات."],3,"المتعلم الحسي (الحركي) يتعلم باللمس والعمل اليدوي كتركيب المجسمات. الاهتمام بالرسوم والخرائط نمط بصري، وإدراك الأنماط وحل المسائل نمط منطقي رياضي. (المعيار القديم 1.3، صعوبة 0.485)","1436"],["L03","إذا كنت معلّمًا جديدًا وقضيت الأسبوع الأول في المدرسة؛ فما أنسب خطوة تقوم بها لتساعدك في تحسين خطتك لإدارة الصف؟",["زيارة المكتبة للاطلاع على كتب ودراسات تساعد في توجيه التعامل مع الأسر والمجتمعات الكبيرة.","مراقبة المعلمين الفعالين في المدرسة والاستفادة من خبراتهم في دعم مهاراتك التي ترغب في دعمها.","مناقشة الصعوبات التي تراها مع مدير المدرسة وطلب تقويم متكرر لتحسين أدائك التدريسي.","التعاون مع معلمين جدد آخرين في المدرسة ومناقشة الصعوبات التي واجهوها في المدرسة."],1,"التعلم من الممارسين الناجحين في المدرسة نفسها أنسب وأسرع طريق لتحسين الإدارة الصفية. المعلمون الجدد يفتقرون للخبرة، والمكتبة موجهة لأولياء الأمور لا للصف، ومدير المدرسة خيار أقل مباشرة. (المعيار القديم 10.1، صعوبة 0.556)","1436"]];

window.DEEP = {"ar.law.defs":{"k":"نظام التعليم العام","t":"التعريفات والمراحل (المادة 1)","body":["**التعليم العام** في النظام يمتد **حتى نهاية الصف الثاني عشر**، ومراحله: **الحضانة، ورياض الأطفال، والصفوف 1–12**. ويعرّف النظام مصطلحات يكثر السؤال عنها."],"pts":["**النطاق ضاق وتحدّد:** السياسة شملت التعليم كله ومنه **التعليم العالي والجامعات** (المواد 108–149 منها)، والنظام خاص **بالتعليم العام حتى نهاية الصف الثاني عشر**.","**الطفولة المبكرة**: من **بداية الحضانة** حتى **نهاية الصف الثالث**.","**المعلم**: من **يُرخَّص له** بالعمل في مهنة التعليم العام.","**المنهج**: أهداف ونواتج تعلم مخطط لها يُتأكد منها **بالتقويم**.","**البرنامج**: نشاط داخل المنهج لهدف محدد؛ و**المقرر**: المحتوى الذي تتضمنه الخطة ويدرسه الطلاب."],"traps":["الطفولة المبكرة تنتهي **بنهاية الصف الثالث**، لا بنهاية رياض الأطفال؛ والإلزام (6–15) حدّ آخر."],"src":"نظام التعليم العام، المادة 1"},"ar.law.general":{"k":"نظام التعليم العام","t":"أحكام عامة يكثر السؤال عنها","body":["مواد قصيرة في النظام تتكرر في الأسئلة لأنها تحسم مواقف يومية في المدرسة."],"pts":["**اللغة** (المادة 5): العربية **اللغة الأساس**، ويجوز التعليم **بلغة إضافية** وفق ضوابط يقرها المجلس.","**تعليم البنات** (المادة 6): مدارس البنات مستقلة عن البنين **بعد الطفولة المبكرة**، مع جواز استثناء الخاص بضوابط يعتمدها مجلس الوزراء.","**التعليم حضوري** في جميع المراحل، والتقنية **جزء منه** لا بديل عنه (المادة 24).","للوزارة تكليف معلمي الحكومي **بتدريس مقررات خارج تخصصهم** وفق قواعد يقرها المجلس (المادة 46).","**الأسرة شريك**: الوزارة تضع ضوابط تمكّن أولياء الأمور من المشاركة في تحقيق أهداف التعليم (المادة 50).","**اللوائح التنفيذية** تضعها الوزارة بالتنسيق مع الجهات ذات العلاقة، وتصدر **بقرار الوزير** (المادة 67)."],"traps":["طلب الدراسة عن بُعد طوال العام بحجة التقنية لا يستقيم: التعليم **حضوري** والتقنية جزء منه."],"src":"نظام التعليم العام، المواد 5 و6 و24 و46 و50 و67"},"ar.law.effective":{"k":"نظام التعليم العام","t":"الصدور والنشر والنفاذ","body":["النظام **صدر ونُشر ولم يُطبَّق بعد**: نُشر في أم القرى **1448/2/10هـ** (24 يوليو 2026) ويُعمل به **بعد 180 يوماً من نشره** (المادة 68)، أي في حدود 20 يناير 2027."],"pts":["قرار مجلس الوزراء بالموافقة: **رقم 103 وتاريخ 1448/1/22هـ**.","المرسوم الملكي: **م/36 وتاريخ 1448/1/27هـ**.","**مجلس شؤون التعليم العام** يمارس اختصاصاته **من تاريخ النشر** (البند 2 من القرار).","يلغي النظام **كل ما يتعارض معه** (المادة 68)، وألغى القرار وثائق محددة [[مع فترة انتقالية|ar.law.repeal]]."],"traps":["مدة النفاذ تُحسب **من تاريخ النشر**، لا من تاريخ المرسوم ولا قرار مجلس الوزراء."],"src":"نظام التعليم العام، المادة 68؛ قرار مجلس الوزراء رقم 103 (1448/1/22هـ)؛ المرسوم الملكي م/36 (1448/1/27هـ)"},"ar.law.repeal":{"k":"نظام التعليم العام","t":"ما ألغاه قرار الموافقة على النظام","body":["قرار مجلس الوزراء 103 ألغى وثائق محددة مع **استمرار العمل بأحكامها** حتى يقر **مجلس شؤون التعليم العام** البديل **خلال سنة من نفاذ النظام**."],"pts":["**سياسة التعليم في المملكة** (قرار مجلس الوزراء 779 وتاريخ 1389/9/16هـ).","**لائحة تنظيم المدارس الأهلية** (1395هـ) و**لائحة المدارس الأجنبية** (1418هـ).","ضوابط إحداث مدارس التعليم العام، وضوابط تعيين مديري المدارس الأهلية، وضوابط مدارس تحفيظ القرآن الصيفية، وأحكام مدارس الثغر النموذجية.","و**نظام تعليم الكبار ومحو الأمية** (م/22 وتاريخ 1392/6/9هـ) بالشرط الانتقالي نفسه."],"traps":["الإلغاء **لا يوقف العمل فوراً**: الأحكام سارية حتى يصدر البديل خلال سنة من **النفاذ** (لا من النشر)."],"src":"قرار مجلس الوزراء رقم 103 وتاريخ 1448/1/22هـ، البنود 3–5 (أم القرى)"},"ar.law.council":{"k":"نظام التعليم العام","t":"مجلس شؤون التعليم العام","body":["مجلس ينشئه النظام **برئاسة وزير التعليم**، ونائبه **نائب الوزير للتعليم العام**. أما سياسة التعليم فنصت على «مجلس أعلى للتعليم» يشرف على شؤون التعليم بكافة أنواعه ومراحله (م231 منها)."],"pts":["أعضاؤه نواب وزراء (منهم المالية والصحة والموارد البشرية)، و**رئيس هيئة تقويم التعليم والتدريب**، و**4 مختصين** يعيَّنون 3 سنوات (المادة 7).","من اختصاصه: الخطط والسياسات، و**تحديد سن القبول**، وشروط التعاقد مع المعلمين، ولوائح الخاص وذوي الإعاقة والموهوبين ورياض الأطفال (المادة 8).","**التقويم الدراسي**: الوزارة تعدّه، والمجلس يرفعه موصياً، ومجلس الوزراء يعتمده (المادة 8).","يجتمع **كل 90 يوماً على الأقل**، والنصاب **ثلثا الأعضاء** (المادة 9).","و**الوزارة** هي الجهة المشرفة على التعليم العام (المادة 13)."],"traps":["رئيس المجلس **وزير التعليم**؛ رئيس هيئة تقويم التعليم والتدريب **عضو**.","المجلس يعمل **من تاريخ النشر**، قبل نفاذ بقية النظام."],"src":"نظام التعليم العام، المواد 7–9؛ قرار مجلس الوزراء رقم 103، البند 2؛ سياسة التعليم، المادة 231"},"ar.law.goals":{"k":"نظام التعليم العام","t":"أهداف النظام (المادة 2)","body":["الهدف: **الجودة وحسن الأداء**، وبناء الطلاب **دينياً ووطنياً وقيمياً وعلمياً وثقافياً ومهارياً**، عبر اثني عشر هدفاً."],"pts":["العقيدة الإسلامية، والولاء لولاة الأمر والانتماء للوطن و**الأسرة نواة المجتمع**، و**الهوية الوطنية**.","**إتقان العربية**، وقيم **التسامح والتعايش** وحقوق الإنسان.","**التحصن من التيارات المنحرفة** و**التعامل الواعي مع المحتوى الإعلامي**، و**التفكير الإبداعي والناقد**.","**التعلم مدى الحياة**، والبحث والابتكار و**التقنيات الناشئة**، والعمل التطوعي والصحة والسلامة.","**لغة أجنبية واحدة على الأقل** (الهدف 12)، وكانت السياسة تقول «لغة أخرى من اللغات الحية على الأقل» (م50 منها)."],"traps":["الهدف 12 «لغة أجنبية واحدة **على الأقل**»، لا «لغتان» ولا «الإنجليزية تحديداً»."],"src":"نظام التعليم العام، المادة 2؛ سياسة التعليم، المادة 50"},"ar.law.compulsory":{"k":"نظام التعليم العام","t":"الحق والمجانية والإلزام (المادتان 3 و4)","body":["التعليم العام **حق للجميع** و**مجاني في المؤسسات الحكومية**، وسن الإلزام **من السنة السادسة حتى الخامسة عشرة**. السياسة لم تضع سن إلزام، واكتفت بأن الابتدائي «متاح لكل من بلغ سن التعليم» (م121 منها)."],"pts":["الوزارة تتخذ الإجراءات النظامية تجاه **من يتسبب في حرمان الطفل** من التعليم أو **انقطاعه** خلال سنوات الإلزام (المادة 4/2).","**سن القبول** واقتراح تعديل **حدّي الإلزام** من اختصاص **المجلس** (المادة 8).","ومن الجديد الذي لم تعرفه السياسة: **سن إلزام من 6 إلى 15** (المادة 4)، و**قائمة حقوق للطالب** (المادة 38)، و**واجب الإبلاغ** عن الإيذاء (المادة 65)."],"ex":["طالب في الحادية عشرة انقطع لأن والده يشغّله في متجره. هو في سن الإلزام، فتتخذ الوزارة الإجراءات النظامية تجاه من تسبب في انقطاعه بالتنسيق مع الجهات المختصة (المادة 4/2)."],"traps":["سن الإلزام (6–15) غير مدى التعليم العام (حتى نهاية الصف الثاني عشر)."],"src":"نظام التعليم العام، المواد 3 و4 و8؛ سياسة التعليم، المادة 121"},"ar.law.inclusion":{"k":"نظام التعليم العام","t":"الكشف المبكر ودمج ذوي الإعاقة (المواد 19–21)","body":["ثلاث درجات: **كشف مبكر** عن اضطرابات النمو أو السلوك، ثم **دمج** ذوي الإعاقة في المؤسسات التعليمية، ثم **برامج ومراكز متخصصة** لمن يتعذر دمجه. والسياسة كانت تنص على تعليمهم «وفق إمكانياتها» بمناهج خاصة (م188 منها)."],"pts":["الدمج يصحبه **وسائل مناسبة** و**تقويم يراعي خصائصهم واحتياجاتهم وقدراتهم** و**تقنيات مساعدة وتكيفية** (المادة 20).","لمن يتعذر دمجه: برامج ومراكز متخصصة، وبرامج **رقمية وعن بُعد** (المادة 21).","لوائح ذوي الإعاقة والموهوبين يقرها **المجلس** (المادة 8)."],"ex":["طالب ضعيف بصر في فصل عادي: يبقى مدموجاً، وتُوفَّر له تقنيات مساعدة، ويُقوَّم بأساليب تراعي قدراته (المادة 20)."],"traps":["المركز المتخصص ليس الخيار الأول؛ هو **لمن يتعذر دمجه**."],"src":"نظام التعليم العام، المواد 8 و19–21؛ سياسة التعليم، المادة 188"},"ar.law.gifted":{"k":"نظام التعليم العام","t":"الموهوبون والتسريع (المادتان 22 و23)","body":["رعاية الموهوبين **باقية** من السياسة (م57 و192–194 منها)، والنظام يفصّلها ويضيف **ضوابط التسريع**."],"pts":["برامج **بفصول أو مدارس مخصصة**، و**مراكز إثرائية**، و**معايير واضحة** لتحديدهم، وتدريب المعلمين، وشراكات مع الجامعات (المادة 22).","**التسريع**: معايير للمؤهلين، و**تقويم شامل**، و**تنسيق مع أولياء الأمور**، بما يضمن استمرار التفوق والتكيف (المادة 23).","ومن واجب المعلم **اكتشاف الموهوبين والمبدعين** (المادة 49/2)."],"traps":["التسريع ليس قراراً بالدرجات وحدها؛ فيه **تقويم شامل** و**تنسيق مع ولي الأمر**."],"src":"نظام التعليم العام، المواد 22 و23 و49؛ سياسة التعليم، المواد 57 و192–194"},"ar.law.curriculum":{"k":"نظام التعليم العام","t":"المناهج والاختبارات الوطنية والاعتماد (المواد 27–30)","body":["ثلاث جهات: **المركز الوطني للمناهج** و**الوزارة** و**هيئة تقويم التعليم والتدريب**."],"pts":["**الإطار الوطني لمناهج التعليم العام**: تعدّه الوزارة والهيئة مع المركز الوطني للمناهج (المادة 27).","**الكتب الدراسية دون مقابل** لمن يطبق المنهج الحكومي (المادة 29).","المؤسسات تطبق **الاختبارات والمقاييس الوطنية والدولية** التي تنفذها الهيئة (المادة 30/1).","الخاص يلتزم **بالاعتماد المدرسي** من الهيئة أو هيئة دولية **تعتمدها الهيئة** (المادة 30/2)."],"traps":["الإطار الوطني للمناهج عمل **مشترك** بين ثلاث جهات، لا تنفرد به الوزارة."],"src":"نظام التعليم العام، المواد 27–30"},"ar.law.license":{"k":"نظام التعليم العام","t":"المؤسسات التعليمية الخاصة: الترخيص والرسوم (المواد 31–36)","body":["الترخيص **اختصاص الوزارة**، والقطاع الخاص يشمل **المستثمر الأجنبي** والقطاع غير الربحي. وكانت السياسة لا تسمح بترخيص المدارس الأهلية **لغير السعوديين** (م176 منها)."],"pts":["قرار الوزارة **كتابي خلال 30 يوماً**، والرفض **مسبَّب** مع **حق التظلم** (المادة 32).","لا يجوز **قبل موافقة الوزارة**: فتح المؤسسة، أو نقل ملكيتها، أو تغيير **اسمها أو موقعها أو مرحلتها** (المادة 33).","الالتزام **بتدريس مواد الهوية الوطنية** التي يعتمدها المركز الوطني للمناهج (المادة 31).","الرسوم: الوزارة تضع **معايير تعديلها** ويعتمدها **المجلس**، والمؤسسة تحدد رسومها وفقها (المادة 35)."],"traps":["مهلة الرد على الترخيص **30 يوماً**، لا 60 (التظلم من الجزاء) ولا 90 (اجتماع المجلس)."],"src":"نظام التعليم العام، المواد 31–36؛ سياسة التعليم، المادة 176"},"ar.law.srights":{"k":"نظام التعليم العام","t":"حقوق الطالب وواجباته (المادة 38)","body":["للطالب، إضافة إلى حقوقه في الأنظمة الأخرى والاتفاقيات الدولية، **سبعة حقوق**، وعليه **خمسة التزامات**. ولم تضع السياسة قائمة حقوق كهذه."],"pts":["(أ) بيئة تمكّنه من التحصيل. (ب) بيئة **آمنة نفسياً وجسدياً وفكرياً** وحمايته من **جميع أشكال الإيذاء**.","(ج) **سماع شكواه وقيدها واتخاذ الإجراء** حيالها. (د) **ألا يُكلَّف بعمل ناتج عن اجتهاد فردي** يخالف النظام واللوائح.","(هـ) **الرعاية الصحية الأولية**. (و) **جوائز وحوافز** عند تميزه. (ز) **تسلّم شهادة النجاح دون قيد أو شرط**.","الالتزامات: الاحترام، والحضور في الوقت، وبذل الجهد، **وعدم الإضرار بالمدرسة**، و**قواعد السلوك والمواظبة**."],"ex":["معلم ألزم طلابه بشراء أدوات غالية لمشروع لم يرد في الخطة ولا التعليمات. هذا تكليف ناتج عن اجتهاد فردي، ومن حق الطالب ألا يُكلَّف به (المادة 38/1/د)."],"traps":["الشكوى ثلاث خطوات: **سماع ثم قيد ثم إجراء**؛ الاكتفاء بالسماع ناقص.","الأمان في النظام ثلاثي: **نفسي وجسدي وفكري**."],"src":"نظام التعليم العام، المادة 38"},"ar.law.teacher":{"k":"نظام التعليم العام","t":"حقوق المعلم وواجباته (المادتان 48 و49)","body":["السياسة ركزت على **إعداد المعلم وتدريبه** (م163–172 منها)، والنظام يضع للمعلم **حقوقاً وواجبات** منصوصة."],"pts":["حقوقه في الحكومي: بيئة مناسبة، و**التدريب والتطوير المهني**، وفرص الإسهام في تطوير التعليم، وجوائز وحوافز (المادة 48).","التدريس **وفق الأهداف والبرامج المعتمدة** (المادة 49/1).","مراعاة **الفروق الفردية** و**أعلى مستويات العدالة** واكتشاف الموهوبين (المادة 49/2).","[[القدوة الحسنة والالتزام بالميثاق|ar.law.ethics]] (المادة 49/3)، واستثمار اليوم الدراسي (49/4)، والإسهام في التطوير المهني والبحوث (49/5)."],"traps":["التطوير المهني في النظام **حق** (المادة 48) و**واجب** (المادة 49/5) معاً."],"src":"نظام التعليم العام، المادتان 48 و49؛ سياسة التعليم، المواد 163–172"},"ar.law.ethics":{"k":"نظام التعليم العام","t":"القدوة وميثاق أخلاقيات مهنة التعليم (المادة 49/3)","body":["من واجبات المعلم: **تمثيل القدوة الحسنة** خُلقاً، و**الالتزام بقيم الهوية الوطنية**، و**الابتعاد عن كل ما يمس شرف المهنة داخل المدرسة وخارجها**، و**الالتزام بميثاق أخلاقيات مهنة التعليم**.","بذلك صار الالتزام بالميثاق **نصاً في نظام** صادر بمرسوم ملكي (يُعمل به بعد نفاذ النظام)، لا توجيهاً إدارياً فقط."],"pts":["عبارة **«داخل المدرسة وخارجها»** تُدخل سلوك المعلم العام، ومنه حضوره الرقمي، في واجب القدوة.","عند وجود **قرائن** على الإخلال بالنظام العام أو اللحمة الوطنية: تدابير عاجلة (المادة 58)، وعند **الثبوت**: جزاءات (المادة 59)."],"ex":["معلم ينشر في حسابه الشخصي محتوى ساخراً يمس زملاءه وطلابه ويقول: «هذا خارج الدوام». المادة 49/3 تجعل القدوة واجباً **داخل المدرسة وخارجها**."],"traps":["«ما يفعله المعلم خارج الدوام لا يخص المدرسة» يناقض نص المادة 49/3."],"src":"نظام التعليم العام، المادة 49 (الفقرة 3)"},"ar.law.penalties":{"k":"نظام التعليم العام","t":"المخالفات والجزاءات (المواد 57–64)","body":["لم تتضمن سياسة التعليم جزاءات. النظام يطبق على المعلمين والإداريين في الحكومي إجراءات **نظام الانضباط الوظيفي** عبر **لجنة المادة 62**، ويضع جزاءات بحسب الجسامة."],"pts":["**تدابير عاجلة** عند **قرائن** الإخلال بالنظام العام أو اللحمة الوطنية: منع من العمل داخل المؤسسة، أو **كف اليد مؤقتاً**؛ يتخذها الوزير أو من يفوضه (المادة 58).","بعد **الثبوت**: غير الجسيمة = أي جزاء عدا إنهاء الخدمة (ويجوز عند **التكرار**)؛ الجسيمة = **إنهاء الخدمة والمنع من العودة للتعليم العام والخاص** (المادة 59).","المدرسة الخاصة: إنذار، إيقاف تسجيل، **غرامة 5,000–50,000 ريال**، إلغاء الترخيص مع إكمال العام **على نفقة المالك** (المادة 60).","اللجنة **3 أعضاء على الأقل** (المادة 62)، والتظلم أمام **الجهة القضائية خلال 60 يوماً** (المادة 63).","**حكم قضائي نهائي** بجريمة مخلة بالأمانة أو الشرف = إجراءات **إنهاء خدماته** (المادة 64)."],"traps":["التدبير العاجل يكفيه **وجود قرائن**، والجزاء يشترط **الثبوت**.","المنع من العودة بعد الجسيمة يشمل **القطاع الخاص** أيضاً."],"src":"نظام التعليم العام، المواد 57–64"},"ar.law.report":{"k":"نظام التعليم العام","t":"واجب الإبلاغ عن الاعتداء والإيذاء (المادة 65)","body":["**على إدارة المؤسسة التعليمية إبلاغ الجهة المختصة** عن أي **اعتداء أو إيذاء** يقع **داخل المؤسسة أو في محيطها** على **أي من طلابها أو منسوبيها**، لاستكمال الإجراءات النظامية."],"pts":["المُلزَم: **إدارة المؤسسة**. المكان: **داخلها أو في محيطها**. المتضرر: **الطلاب أو المنسوبون**.","الغرض: **استكمال الإجراءات النظامية** لدى الجهة المختصة، لا إنهاء الموضوع داخلياً.","ويقابله حق الطالب في **بيئة آمنة وحمايته من جميع أشكال الإيذاء** (المادة 38/1/ب)."],"ex":["مشاجرة عنيفة أمام بوابة المدرسة بعد الانصراف أُصيب فيها طالب: المادة 65 تشمل **محيط المؤسسة**، فتبلغ الإدارة الجهة المختصة ولا تكتفي بالصلح."],"traps":["الاكتفاء بالصلح أو بإبلاغ ولي الأمر لا يحقق الإبلاغ إلى **الجهة المختصة**.","الاعتداء على **معلم** داخل المدرسة مشمول أيضاً."],"src":"نظام التعليم العام، المادة 65"},"ar.l05.mainidea":{"k":"استيعاب المقروء","t":["Main Idea","الفكرة الرئيسة والعنوان"],"body":["الفكرة الرئيسة هي ما تدور حوله جمل النص كلها، والأفكار الفرعية تخدمها بالشرح أو المثال أو التعليل. والعنوان المناسب صياغة مختصرة لها. طريقة عملية: اسأل «عمّ يتحدث النص كله؟» ثم «ماذا يقول عنه؟»."],"pts":["البديل الصحيح يشمل النص كله؛ ما يغطي جزءاً منه أضيق من المطلوب.","البديل الذي يذكر ما لم يرد في النص أوسع من المطلوب، فيُرفض أيضاً.","الغرض يُعرف من نوع الجمل: أخبار = إخبار، أدلة = إقناع، أمر ورجاء = حث، نهي وعواقب = تحذير."],"ex":["«تقلل القراءة اليومية التوتر، وتوسع المفردات، وتقوي الذاكرة؛ لذلك يوصي المختصون بعشرين دقيقة يومياً»: الفكرة الرئيسة فوائد القراءة اليومية والحث عليها، و«توسع المفردات» فكرة فرعية."],"traps":["البديل الذي ينقل جملة من النص حرفياً يغري لكنه غالباً تفصيل.","إذا كان النص يفسر سبب ظاهرة فالفكرة الرئيسة هي السبب لا مجرد وجود الظاهرة."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 4.1: استيعاب المقروء","aka":["الفكرة الرئيسة","العنوان المناسب"]},"ar.l05.context":{"k":"استيعاب المقروء","t":["Meaning from Context & Inference","معنى الكلمة من السياق والاستنتاج"],"body":["معنى الكلمة يحدده موقعها: ضع كل بديل مكانها، والبديل الذي يستقيم به المعنى هو الصحيح. والاستنتاج معنى لم يُصرَّح به تدل عليه معطيات النص؛ فما ورد نصاً ليس استنتاجاً، وما لا تدل عليه القرائن ليس استنتاجاً كذلك."],"pts":["الضمير يعود على أقرب اسم يستقيم به المعنى، لا على أقرب اسم في اللفظ فقط.","طردية: يزيد الأول فيزيد الثاني؛ عكسية: يزيد الأول فينقص الثاني.","الاستفهام المنفي «ألم…؟» يُجاب في الإثبات بـ«بلى» وفي النفي بـ«نعم»."],"ex":["«أسدل الليل ستاره»: بتجربة البدائل (رفع، أرخى، مزّق) يستقيم «أرخى»."],"traps":["المعنى المعجمي الأشهر ليس دائماً المقصود في السياق."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 4.1: استيعاب المقروء","aka":["معنى الكلمة من السياق","الاستنتاج","عود الضمير"]},"ar.l07.maturation":{"k":"مبادئ النمو","t":["Maturation, Learning & Readiness","النضج والتعلم وا
