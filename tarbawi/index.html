","**الختامي (التجميعي)** نهاية الوحدة أو الفصل لأحكام النجاح والانتقال؛ و**التتبعي** بعده لقياس بقاء الأثر.","[[**محكي المرجع**|ar.l15.ref]]: أتقن أم لم يتقن؛ و**معياري المرجع**: ترتيبه بين أقرانه، ومنه معرفة ترتيب طالب منقول بين زملائه الجدد.","**التقويم ذاتي المرجع** يقارن الطالب بدرجته السابقة (قبلي/بعدي).","**التقويم الذاتي** و**تقويم الأقران** يحكمان على العمل بمحكات واضحة معدة مسبقاً.","**تقويم التعلم** ختامي، والتقويم من أجل التعلم تكويني، والتقويم كتعلم يراقب فيه الطالب نفسه."],"t":[["التقويم القبلي","تقويم يسبق التعلم لتحديد الاستعداد والمتطلبات السابقة."],["التقويم التشخيصي","تقويم يحدد مواطن القوة والضعف وأسباب الصعوبات لوضع العلاج."],["التقويم التكويني (البنائي)","تقويم مستمر أثناء التدريس لتحسين التعلم وتعديل التدريس."],["التقويم الختامي (التجميعي)","تقويم نهاية البرنامج لإصدار الحكم ورصد الدرجات."],["محكي المرجع","تفسير الدرجة بمقارنتها بمحك إتقان محدد مسبقاً."],["معياري المرجع","تفسير الدرجة بمقارنتها بأداء المجموعة (الأقران)."],["التقويم من أجل التعلم","تقويم تكويني يبحث عن أدلة التعلم ويفسرها المعلم والمتعلم لتوجيه الخطوة التالية."],["التقويم كتعلم","تقويم يقوده المتعلم نفسه بمراقبة تعلمه وتقويمه ذاتياً."],["التقويم التتبعي","تقويم بعد انقضاء فترة من النهائي للتحقق من بقاء أثر التعلم."],["ذاتي المرجع","مقارنة أداء الطالب بأدائه السابق لا بغيره."]],"intro":[],"ex":[]},{"h":"التقويم البديل (الأصيل) وأدواته","pts":["[[**التقويم البديل**|ar.l15.authentic]] (الأصيل) يقيس الأداء في **مهام حقيقية** بمعايير معلنة مسبقاً.","**قائمة الشطب (الرصد)**: موجود أم لا؛ و**سلم التقدير العددي** (1–5) أو اللفظي: بأي درجة.","[[**الروبرك (سلم التقدير الوصفي)**|ar.l15.rubric]] يصف كل مستوى أداء لكل معيار؛ التحليلي تفصيلي والكلي حكم عام.","[[**ملف الإنجاز (البورتفوليو)**|ar.l15.portfolio]] أعمال منظمة هدفها **التأمل الذاتي** ومتابعة التقدم.","المهارة العملية (الوضوء، التجربة) تُقوَّم **بالملاحظة** لا بالاختبار الكتابي.","[[أدوات أخرى|ar.l15.tools]]: السجل القصصي، وسجل سير التعلم، والمقابلة، و**التقارير الذاتية** للوجداني، والاختبارات الشفوية."],"t":[["التقويم الأصيل","تقويم يعتمد مهام واقعية ذات معنى بمعايير معلنة."],["ملف الإنجاز","ملف منظم لأعمال الطالب يوثق تقدمه ويشجع التأمل الذاتي."],["قائمة الشطب","قائمة سلوكيات تُؤشَّر بوجودها أو غيابها فقط."],["سلم التقدير","أداة تحدد مستوى الأداء على تدريج عددي أو لفظي."],["الروبرك","سلم تقدير وصفي يبين مستويات الجودة لكل معيار بعبارات ودرجات."],["السجل القصصي","وصف سردي مؤرخ لسلوك محدد لطالب في موقف فعلي."],["تقويم الأقران","حكم الطلاب على أعمال زملائهم وفق محكات متفق عليها."],["التقارير الذاتية","أدوات يصف فيها الطالب اتجاهاته وميوله (مقاييس ليكرت)."],["الاختبار الشفوي","أسئلة منطوقة يجيب عنها الطالب مباشرة؛ بلا غش لكنه يستغرق وقتاً."]],"intro":[],"ex":[]},{"h":"أنواع الأسئلة: الموضوعية والمقالية وقواعد صياغتها","pts":["[[**الموضوعية**|ar.l15.objective]]: اختيار من متعدد، وصواب وخطأ، ومطابقة، وإكمال؛ لا تتأثر بذاتية المصحح لكنها عرضة للتخمين.","[[**المقالية**|ar.l15.essay]] مقيدة أو حرة: تقيس التنظيم والتفكير العليا، لكن تصحيحها ذاتي فينخفض ثباتها.","**أسئلة الإجابة القصيرة والمقالية المقيدة ليست** موضوعية.","الصياغة: بدائل متجانسة معقولة، وبلا كلمات جزم، واستجابات المطابقة أكثر من مقدماتها، وفراغ واحد قرب آخر الجملة.","لتقليل التخمين **تُزاد** البدائل الفعالة، وتُرتب الفقرات من السهل إلى الصعب.","أسئلة تركز على موضوعات دون أخرى ← **جدول مواصفات** لصدق المحتوى."],"t":[["الأسئلة الموضوعية","فقرات لها إجابة محددة سلفاً لا تتأثر بحكم المصحح."],["الأسئلة المقالية","فقرات يكتب فيها الطالب إجابته بأسلوبه الحر أو المقيد."],["المشتت (المموّه)","بديل خاطئ في الاختيار من متعدد يبدو معقولاً لمن لم يتقن المحتوى."],["المقالي المقيد","سؤال مقالي يحدد المطلوب وحدود الإجابة فترتفع موضوعية تصحيحه."],["كلمات الجزم","ألفاظ كـ«جميع» و«دائماً» في عبارات الصواب والخطأ تكشف الإجابة."],["المطابقة (المزاوجة)","قائمتان يربط الطالب بين عناصرهما."]],"intro":[],"ex":[]},{"h":"بناء الاختبار التحصيلي وجدول المواصفات والتصحيح","pts":["[[خطوات البناء|ar.l15.build]]: **تحديد الأهداف** أولاً ← تحليل المحتوى ← جدول المواصفات ← الصياغة ← التعليمات ← التجريب.","[[**جدول المواصفات**|ar.l15.tos]]: المحتوى × مستويات الأهداف؛ وزن الموضوع = عدد حصصه أو أهدافه ÷ المجموع × 100.","التعليمات: الزمن، وطريقة الإجابة ومكانها، ودرجة كل سؤال، وتنبيهات التخمين.","تصحيح المقالي: نموذج إجابة ومحكات مسبقة، والسؤال الواحد لكل الطلاب، وإخفاء الأسماء.","التصحيح **بمعيار واحد للجميع**؛ وظرف الطالب لا يرفع درجته."],"t":[["جدول المواصفات","مخطط ثنائي البعد يوزع الأسئلة على المحتوى ومستويات الأهداف بأوزانها."],["صدق المحتوى","تمثيل فقرات الاختبار لمحتوى المادة وأهدافها تمثيلاً متوازناً."],["محكات التصحيح","قواعد محددة مسبقاً لتوزيع الدرجات على عناصر الإجابة."],["أثر الهالة","تأثر المصحح بانطباعه العام عن الطالب أو إجابته السابقة."],["نموذج الإجابة","الإجابة النموذجية المعتمدة التي يقاس عليها تصحيح الأسئلة."]],"ex":[],"intro":[]},{"h":"الاختبارات الوطنية والدولية ولائحة تقويم الطالب","pts":["[[**نافس**|ar.l15.intl]]: اختبارات وطنية للصفوف 3 و6 و9 لتشخيص المستوى الوطني، لا لنجاح الطالب.","**PISA** (OECD) لعمر 15 كل 3 سنوات؛ و**TIMSS** للرابع والثامن كل 4؛ وPIRLS للقراءة في الرابع كل 5.","**TALIS** مسح دولي عن المعلمين، لا اختبار للطلاب.","[[لائحة تقويم الطالب|ar.l15.reg]]: الصفان الأول والثاني [[مستويات أداء|ar.l15.levels]] وصفية، ومن **الثالث الابتدائي** درجات."],"t":[["نافس","برنامج الاختبارات الوطنية السعودي لقياس مخرجات التعلم في صفوف محددة."],["PISA","اختبار دولي لعمر 15 سنة كل 3 سنوات في القراءة والرياضيات والعلوم."],["TIMSS","اختبار دولي للصفين الرابع والثامن كل 4 سنوات في الرياضيات والعلوم."],["PIRLS","اختبار دولي للصف الرابع كل 5 سنوات في القراءة."],["التقويم المستمر","تقويم الصفين الأول والثاني الابتدائي بمستويات أداء وصفية للمهارات على مدار العام."]],"intro":[],"ex":[]},{"h":"التقويم الرسمي وغير الرسمي ودورتا التقويم وخطة التقويم في لائحة 2025","pts":["[[**الرسمي**|ar.l15.formal]] مخطط موثق بدرجة، و**غير الرسمي** تلقائي أثناء التدريس لتعديله فوراً؛ والخطة تجمعهما.","أدوات غير الرسمي: الملاحظة، والأسئلة الشفهية، و**بطاقة الخروج**، والسبورات الصغيرة.","دورة التقويم **قصيرة المدى** داخل الحصة، و**طويلة المدى** على مستوى الوحدة والفترة والعام.","من الثالث الابتدائي: **60 درجة** للتقويمات التكوينية و**40 درجة** لاختبار نهاية الفترة.","النجاح: **النهاية الصغرى 50%** و**النسبة الشرطية 20%** من الاختبار التحريري، ولا تُطبق في الدور الثاني.","**الصفان الأول والثاني الابتدائي**: تقويم تكويني بمستويات أداء، والنجاح بإتقان **75%** من المعايير بما فيها الحد الأدنى."],"t":[["التقويم الرسمي","تقويم مخطط منظم موثق بشروط وزمن ودرجة محددة يُبنى عليه حكم."],["التقويم غير الرسمي (الاعتيادي)","تقويم تلقائي أثناء التدريس كالملاحظة والأسئلة الشفهية لتعديل التدريس فوراً."],["دورة التقويم قصيرة المدى","تقويم داخل الحصة أو بين الحصص يعقبه تعديل فوري للتدريس."],["دورة التقويم طويلة المدى","تقويم على مستوى الوحدة والفترة والعام لقياس تحقق نواتج التعلم."],["النسبة الشرطية","20% من درجة الاختبار التحريري يلزم الطالب تحقيقها شرطاً للنجاح."]],"intro":[],"ex":[]},{"h":"تسهيلات الاختبار وتقويم الطلاب ذوي الإعاقة","pts":["مؤشر 10.2: [[**التسهيلات**|ar.l15.access]] تغيّر طريقة الاختبار أو مكانه أو زمنه **دون خفض المستوى المقيس**؛ والتعديل يغيّر المحتوى وفق الخطة الفردية.","تسهيلات عامة: زمن كافٍ، ومكان مناسب، وتجزئة، و**ألا يُختبر في أكثر من مادة تحريرية في اليوم الواحد**.","يشرف **معلم التربية الخاصة** بالتعاون مع معلم التعليم العام؛ والتسهيل **حق** لا تفضيل.","من لم يستفد مما يقدم في الفصل العام **يُقوَّم في محتوى خطته الفردية**."],"t":[["تسهيلات الاختبار (المواءمات)","تغيير طريقة التقديم أو الاستجابة أو المكان أو الزمن دون خفض المستوى المقيس."],["التعديل في التقويم","تغيير محتوى التقويم أو مستواه وفق الخطة التربوية الفردية."],["القارئ الكاتب","شخص يقرأ الأسئلة للطالب ويكتب إجاباته كما يمليها، كما في الإعاقة البصرية."]],"cmp":null,"ex":[],"intro":[],"map":{"type":"fan","title":["Accommodations by Disability","تسهيلات حسب نوع الإعاقة"],"groups":[{"n":"البصرية","ar":"برايل، أو شفهي، أو **قارئ كاتب مبصر**، وطباعة مكبرة","d":"ar.l15.access"},{"n":"السمعية","ar":"أسئلة موضوعية واضحة، ولغة الإشارة، و**لا محاسبة على الإملاء والنحو**","d":"ar.l15.access"},{"n":"صعوبات التعلم","ar":"**قراءة الأسئلة بصوت عال**، وإجابة شفهية، وفترات راحة","d":"ar.l15.access"},{"n":"فرط الحركة وتشتت الانتباه","ar":"**فترات قصيرة**، والسماح بالتحرك، وركن بعيد عن المشتتات","d":"ar.l15.access"},{"n":"الجسمية واضطرابات النطق","ar":"أجهزة تعويضية وكاتب موثوق، ولا محاسبة على أخطاء الاضطراب","d":"ar.l15.access"}]}}],"trap":["[[**القياس**|ar.l15.terms]] رقم بلا حكم، **التقييم** حكم على القيمة، **التقويم** حكم + علاج؛ التقويم هو الأشمل.","**التشخيصي** يبحث عن أسباب الصعوبة ومواطنها، **القبلي** يبحث عن الاستعداد والمتطلبات السابقة؛ وكلاهما قبل أو في بداية التعلم.","**التكويني** أثناء التدريس لتحسينه بلا حكم نهائي، **الختامي** في النهاية لإصدار الحكم؛ السؤال الذي يذكر «أثناء» و«تغذية راجعة» و«تعديل» جوابه التكويني.","[[**محكي المرجع**|ar.l15.ref]] مقارنة بمحك إتقان (أتقن / لم يتقن)، **معياري المرجع** مقارنة بالأقران (ترتيب)؛ كلمة «زملائه» أو «ترتيبه» تعني معياري.","[[**ملف الإنجاز**|ar.l15.portfolio]] يجمع الأعمال ويتأمل فيها الطالب، **السجل القصصي** يكتبه المعلم عن سلوك الطالب، **سجل سير التعلم** يكتبه الطالب عن تعلمه.","**قائمة الشطب** وجود/غياب فقط، **سلم التقدير** درجة الإتقان على تدريج، [[**الروبرك**|ar.l15.rubric]] وصف لكل مستوى.","**الإكمال** سؤال موضوعي، أما **المقالي المقيد** فمقالي؛ لا تخلط الإجابة القصيرة بالمقالي الحر.","عيب **المقالية** ذاتية التصحيح وقلة الثبات، وعيب **الموضوعية** التخمين وصعوبة الإعداد؛ الموضوعية لا تقيس التعبير.","الخطوة الأولى في بناء الاختبار **تحديد الأهداف** وليست تحليل المحتوى ولا صياغة الأسئلة ولا جدول المواصفات.","[[**جدول المواصفات**|ar.l15.tos]] يحقق صدق المحتوى لا الثبات ولا الموضوعية.","**نافس** وطني سعودي، **PISA** عمر 15 كل 3 سنوات، **TIMSS** الرابع والثامن كل 4 سنوات، **PIRLS** الرابع قراءة كل 5 سنوات.","الاختبار **المقنن** يعده متخصصون بظروف موحدة؛ اختبار المعلم ليس مقنناً حتى لو كان جيداً.","**الإجابة القصيرة** و**المقالي المقيد** ليست موضوعية؛ **الإكمال (التكملة)** موضوعي.","**معياري المرجع** يجيب عن «ترتيب الطالب بين زملائه»؛ **محكي** عن «هل أتقن المهارة؟»؛ **ذاتي المرجع** عن «هل تحسن عن نفسه؟»."],"vid":[["Awg3Juk0fDY","تطبيقات المعيار العاشر من معايير الرخصة المهنية","سهام الزهراني",23],["xqe8s8AicFU","التقويم — قائمة المعيار العاشر","سلوى البحيري",29],["HePXggcRAMk","أنواع التقويم في دورة الرخصة المهنية التربوي","منصة البراعة",9],["jgpW906rcmQ","سؤال مضمون في الاختبار: شرح أنواع التقويم","د. فيصل العوفي",9],["Om4odXBq8Gs","شرح المعيار العاشر: استراتيجيات التقويم البديل","سهام الزهراني",11]],"map":{"type":"tree","title":["Types & Tools of Assessment","أنواع التقويم وأدواته"],"groups":[{"n":"بزمن التطبيق وغرضه","ar":"متى نقوّم؟","items":[{"n":"القبلي (التشخيصي)","ar":"استعداد ومتطلبات سابقة","d":"ar.l15.types"},{"n":"التكويني","ar":"أثناء التعلم لتحسينه"},{"n":"الختامي","ar":"حكم ورصد في النهاية"},{"n":"التتبعي","ar":"بقاء أثر التعلم"}],"trap":"«أثناء» و«تعديل التدريس» = تكويني"},{"n":"بمرجع التفسير","ar":"بماذا نقارن الدرجة؟","items":[{"n":"محكي المرجع","ar":"بمحك إتقان","d":"ar.l15.ref"},{"n":"معياري المرجع","ar":"بالأقران وترتيبه"},{"n":"ذاتي المرجع","ar":"بأدائه السابق"}]},{"n":"بمن يستفيد من النتيجة","ar":"الغرض","items":[{"n":"تقويم التعلم","ar":"ختامي للحكم"},{"n":"التقويم من أجل التعلم","ar":"تكويني لتوجيه الخطوة التالية"},{"n":"التقويم كتعلم","ar":"الطالب يقوّم نفسه"}]},{"n":"الأدوات","ar":"كيف نجمع الدليل؟","items":[{"n":"الأسئلة الموضوعية","ar":"اختيار، صواب وخطأ، مطابقة، إكمال","d":"ar.l15.objective"},{"n":"التقويم البديل","ar":"أداء وملاحظة وقوائم شطب","d":"ar.l15.authentic"},{"n":"الروبرك","ar":"وصف لكل مستوى","d":"ar.l15.rubric"},{"n":"ملف الإنجاز","ar":"شواهد وتأمل","d":"ar.l15.portfolio"}]},{"n":"البناء والتنظيم","ar":"القواعد الرسمية","items":[{"n":"جدول المواصفات","ar":"محتوى × مستويات","d":"ar.l15.tos"},{"n":"لائحة تقويم الطالب 2025","ar":"الدرجات وشروط النجاح","d":"ar.l15.reg"},{"n":"مستويات الأداء","ar":"للصفين الأول والثاني فقط","d":"ar.l15.levels"}]}]},"n":15},{"id":"L16","d":"P","std":"10","sub":"10.3","ar":"القياس: الصدق والثبات وتحليل الفقرات وتوظيف النتائج","goal":"تحكم على جودة الاختبار بالصدق والثبات والموضوعية وتحلل فقراته بالصعوبة والتمييز، وتحسب وتفسر مقاييس الإحصاء الوصفي والدرجات المعيارية والارتباط، ثم توظف النتائج في تغذية راجعة وخطط علاجية وإثرائية.","sec":[{"h":"الصدق وأنواعه","pts":["[[**الصدق**|ar.l16.validity]]: أن يقيس الاختبار ما وُضع لقياسه؛ أهم خصائص الاختبار وأعمها.","يضعفه: غموض الأسئلة، وتلميحات تكشف الإجابة، واستعماله لغير غرضه أو فئته، وسوء ظروف التطبيق.","صدق المحك بنوعيه يُقدَّر **بمعامل ارتباط** بين درجات الاختبار ودرجات المحك."],"t":[["الصدق","درجة قياس الاختبار للسمة التي وُضع لقياسها."],["صدق المحتوى","تمثيل الفقرات للمحتوى والأهداف، ويُضمن بجدول المواصفات والتحكيم."],["الصدق الظاهري","المظهر العام للاختبار يوحي بأنه يقيس ما وضع له."],["الصدق التلازمي","ارتباط الاختبار بمحك يُقاس في الوقت نفسه."],["الصدق التنبؤي","ارتباط الاختبار بمحك يُقاس في المستقبل."],["صدق البناء","اتساق الاختبار مع النظرية التي تفسر السمة المقيسة."],["الصدق الذاتي","الجذر التربيعي لمعامل الثبات."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Types of Validity","أنواع الصدق"],"groups":[{"n":"صدق المحتوى","ar":"تمثيل متوازن للمحتوى والأهداف؛ **بجدول المواصفات** وتحكيم المختصين","d":"ar.l16.validity"},{"n":"الصدق الظاهري","ar":"يبدو في شكله وتعليماته أنه يقيس ما وُضع له؛ **أضعفها**","d":"ar.l16.validity"},{"n":"صدق المحك التلازمي","ar":"ارتباط بمحك يُجمع **في الوقت نفسه** (اختبار مقنن مماثل)","d":"ar.l16.validity"},{"n":"صدق المحك التنبؤي","ar":"ارتباط بمحك **مستقبلي** (المعدل الجامعي من اختبار القبول)","d":"ar.l16.validity"},{"n":"صدق البناء (المفهوم / التكوين الفرضي)","ar":"انسجام مع النظرية؛ **بالتحليل العاملي**","d":"ar.l16.validity"},{"n":"الصدق الذاتي","ar":"**الجذر التربيعي لمعامل الثبات**، وهو الحد الأعلى للصدق","d":"ar.l16.validity"}]}},{"h":"الثبات وطرقه والموضوعية والعلاقة بالصدق","pts":["[[**الثبات**|ar.l16.reliab]] اتساق النتائج عند تكرار القياس في ظروف مماثلة؛ معامله بين 0 و1.","[[**الخطأ المعياري للقياس**|ar.l16.coef]] = الانحراف المعياري × √(1 − الثبات)؛ كلما كبر قلّ الثبات.","**عوامل الثبات**: يرتفع بطول الاختبار وتباين العينة وتوسط الصعوبة، وينخفض بالتخمين والغموض والعينة شديدة التجانس.","**الموضوعية** شرط للثبات، والثبات شرط **ضروري غير كافٍ** للصدق: الصادق ثابت، والثابت قد لا يصدق."],"t":[["الثبات","اتساق درجات الاختبار واستقرارها عند تكرار القياس."],["معامل الاستقرار","ثبات يُحسب بإعادة تطبيق الاختبار نفسه بعد فترة."],["معامل التكافؤ","ثبات يُحسب بالارتباط بين صورتين متكافئتين."],["التجزئة النصفية","ثبات الاتساق الداخلي بارتباط نصفي الاختبار مع تصحيح سبيرمان براون."],["كرونباخ ألفا","معامل اتساق داخلي للمقاييس متعددة التدريج."],["كودر ريتشاردسون","معامل اتساق داخلي للفقرات ثنائية التصحيح."],["الخطأ المعياري للقياس","مقدار تذبذب الدرجة الملاحظة حول الدرجة الحقيقية."],["الموضوعية","استقلال الدرجة عن ذاتية المصحح وأحكامه الشخصية."],["الصدق العيني","كفاية عدد الفقرات في تمثيل المادة (أحد وجوه صدق المحتوى)."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Estimating Reliability","طرق تقدير الثبات"],"groups":[{"n":"إعادة التطبيق","ar":"الاختبار نفسه بعد فاصل (**الاستقرار**)؛ عيبه أثر الذاكرة","d":"ar.l16.reliab"},{"n":"الصور المتكافئة","ar":"نسختان بمواصفات واحدة (**التكافؤ**)","d":"ar.l16.reliab"},{"n":"التجزئة النصفية","who":"Spearman–Brown سبيرمان براون","ar":"تطبيق واحد: الفردية × الزوجية، ثم ر الكلي = 2ر ÷ (1 + ر)","d":"ar.l16.coef"},{"n":"KR-20 ومعامل ألفا","who":"Kuder–Richardson · Cronbach","ar":"كودر للفقرات **الثنائية**، وألفا **للمتدرج** والمقالي","d":"ar.l16.coef"},{"n":"ثبات المصححين (اتفاق المقيمين)","ar":"اتفاق مصححين مستقلين؛ مؤشر **الموضوعية** في المقالي","d":"ar.l16.reliab"}]}},{"h":"تحليل الفقرات: الصعوبة والتمييز وفعالية المشتتات","pts":["[[**معامل الصعوبة (السهولة)**|ar.l16.difficulty]] = المصيبون ÷ المجيبين؛ كلما ارتفع كانت الفقرة **أسهل**، والمقبول 0.20–0.80.","**معامل الصعوبة في السؤال المقالي** = مجموع درجاته ÷ (عدد الطلاب × درجة السؤال).","[[**معامل التمييز**|ar.l16.discrim]] = (صحيح العليا − صحيح الدنيا) ÷ عدد إحدى الفئتين، بأخذ 27% من كل طرف.","0.40 فأعلى ممتاز، وأقل من 0.20 ضعيف، و**السالب** يُحذف؛ والفقرة التي يجيبها الجميع تمييزها صفر.","[[**المشتت الفعال**|ar.l16.distract]] تختاره الدنيا أكثر من العليا؛ والذي لا يختاره أحد يُستبدل."],"t":[["معامل الصعوبة","نسبة المجيبين إجابة صحيحة عن الفقرة إلى عددهم الكلي."],["معامل التمييز","قدرة الفقرة على التفريق بين المتفوقين والضعاف."],["المجموعتان الطرفيتان","أعلى 27% وأدنى 27% من الأوراق بعد ترتيبها بالدرجة."],["فعالية المشتت","جذب البديل الخاطئ لعدد من الفئة الدنيا أكبر من الفئة العليا."],["التمييز السالب","إجابة الفئة الدنيا عن الفقرة أفضل من العليا، وتُحذف."]],"intro":[],"ex":[]},{"h":"الإحصاء الوصفي: النزعة المركزية والتشتت والجداول التكرارية","pts":["[[**المتوسط**|ar.l16.central]] يتأثر بالمتطرفات، و**الوسيط** لا يتأثر (للملتوي)، والمنوال الأكثر تكراراً (للنوعي).","**المدى** = أكبر قيمة − أصغر قيمة، و[[**الانحراف المعياري**|ar.l16.spread]] = √التباين؛ والأصغر أكثر تجانساً.","إضافة ثابت ترفع المتوسط ولا تغير الانحراف؛ والضرب في ثابت يضرب الاثنين.","**المدرج التكراري** لتوزيع الدرجات، والأعمدة للمقارنة، والدائري للنسب، والخطي للتغير عبر الزمن."],"t":[["المتوسط الحسابي","مجموع القيم مقسوماً على عددها."],["الوسيط","القيمة التي تتوسط البيانات بعد ترتيبها."],["المنوال","القيمة الأكثر تكراراً في البيانات."],["المدى","الفرق بين أكبر قيمة وأصغر قيمة."],["التباين","متوسط مربعات انحرافات القيم عن متوسطها."],["الانحراف المعياري","الجذر التربيعي للتباين، ويقاس بوحدة الدرجات نفسها."],["التكرار المتجمع","مجموع تكرارات الفئة وما قبلها."]],"intro":[],"ex":[]},{"h":"المنحنى الاعتدالي والالتواء والدرجات المعيارية والارتباط","pts":["[[**التوزيع الاعتدالي**|ar.l16.normal]]: المتوسط = الوسيط = المنوال؛ 68% ضمن ± انحراف، و95% ضمن ± انحرافين، و99.7% ضمن ± ثلاثة.","**الالتواء الموجب**: الذيل يميناً واختبار **صعب**؛ والسالب: الذيل يساراً واختبار سهل.","[[**الدرجة المعيارية ز**|ar.l16.z]] = (الدرجة − المتوسط) ÷ الانحراف، و**ت** = 50 + 10 × ز؛ الأفضل نسبياً صاحب ز الأكبر.","**الرتبة المئينية** 90: تفوق على 90% من المجموعة، لا 90% إجابات صحيحة.","[[**معامل الارتباط**|ar.l16.corr]] بين −1 و+1: الإشارة اتجاه والقيمة قوة، ولا يعني السببية.","**التفرطح**: مدبب (درجات متقاربة) أو مفرطح (متشتتة)، والمعتدل بينهما."],"t":[["التوزيع الاعتدالي","توزيع متماثل جرسي تتساوى فيه مقاييس النزعة المركزية."],["الالتواء الموجب","تكدس الدرجات في الطرف المنخفض وذيل نحو اليمين؛ اختبار صعب."],["الالتواء السالب","تكدس الدرجات في الطرف المرتفع وذيل نحو اليسار؛ اختبار سهل."],["الدرجة المعيارية ز","بعد الدرجة عن المتوسط مقاساً بوحدات الانحراف المعياري."],["الدرجة التائية ت","تحويل خطي لدرجة ز بمتوسط 50 وانحراف 10."],["الرتبة المئينية","النسبة المئوية للأفراد الذين تقع درجاتهم دون درجة الطالب."],["معامل الارتباط","مقياس لاتجاه العلاقة بين متغيرين وقوتها من −1 إلى +1."],["التفرطح","درجة تدبب قمة المنحنى أو انبساطها مقارنة بالاعتدالي."]],"ex":[],"intro":[]},{"h":"توظيف نتائج التقويم: التغذية الراجعة والخطط والتقارير","pts":["[[**التغذية الراجعة**|ar.l12.feedback]] **فورية** (الحصة التالية للاختبار على الأكثر)، محددة، على المهمة لا الشخص.","بعد التحليل: **برنامج علاجي** لمن أخفق في مهارة، و**برنامج إثرائي** للمتفوقين.","تدني نتائج الصف كله ← **تحليل النتائج** ثم تعديل التدريس، لا إعادة الاختبار ولا اللوم.","[[تقرير ولي الأمر|ar.l16.use]] واضح محدد بلا مقارنة بالآخرين، والنتائج لا تُستخدم أداة عقاب."],"t":[["التغذية الراجعة","معلومات تصف أداء الطالب وتوجهه إلى الخطوة التالية للتحسن."],["الخطة العلاجية","إجراءات تدريسية لمعالجة ضعف محدد كشفه التقويم."],["الخطة الإثرائية","أنشطة متقدمة للطلاب الذين أتقنوا الأهداف."],["تقرير ولي الأمر","وثيقة توضح مستوى الطالب وتقدمه وحاجاته للأسرة."],["تحليل النتائج","دراسة درجات الطلاب والفقرات لاستخلاص قرارات التحسين."]],"intro":[],"ex":[]},{"h":"سجلات الرصد وتحليل النتائج ببرامج الجداول","pts":["مؤشر 10.3: [[**نماذج رصد**|ar.l16.records]] الإنجاز والتقدم التراكمي، وتحليل البيانات ببرامج تقنية.","الصفان الأول والثاني: تدوين **يومي** في سجل المتابعة، ثم رصد الخلاصة في **النظام الرقمي** بشواهد في ملف الإنجاز.","ببرنامج الجداول: المتوسط، و**نسبة الإتقان لكل معيار**، ونسبة التحسن، والتنسيق الشرطي.","معيار ضعيف لدى **أغلب الصف** ← إعادة تدريسه؛ ولدى **قلة** ← خطة علاجية فردية أو مجموعة صغيرة.","**سرية البيانات**: النتيجة تخص الطالب وولي أمره والقائمين على تعليمه، فلا تُنشر علناً."],"t":[["سجل متابعة تقويم الطالب","سجل يدون فيه المعلم تقويم طلابه في المعايير بشكل يومي."],["ملف الإنجاز","جمع منظم وهادف لشواهد تعلم الطالب يبين جهوده وتقدمه."],["نسبة الإتقان","عدد الطلاب المتقنين لمعيار مقسوماً على عدد الطلاب."],["التنسيق الشرطي","خاصية في برامج الجداول تلون الخلايا تلقائياً وفق شرط محدد."]],"ex":[],"intro":[]}],"trap":["**الصدق** يقيس ما وُضع له، **الثبات** اتساق النتائج؛ الصادق ثابت بالضرورة، والثابت ليس بالضرورة صادقاً.","[[**التلازمي**|ar.l16.validity]] محك في الوقت نفسه، **التنبؤي** محك في المستقبل؛ كلمة «بعد سنة» أو «سينجح» تعني تنبؤي.","**صدق المحتوى** بجدول المواصفات والتحكيم، **صدق البناء** بالتحليل العاملي والنظرية؛ الظاهري مجرد مظهر.","**إعادة التطبيق** اختبار واحد مرتين، **الصور المتكافئة** اختباران مرة واحدة لكل منهما، **التجزئة النصفية** اختبار واحد مرة واحدة.","[[**كرونباخ ألفا**|ar.l16.coef]] للمتدرج (ليكرت)، **كودر ريتشاردسون** للثنائي (صح/خطأ)؛ كلاهما يقيس الثبات لا الصدق.","إجابة صحيحة ثم خاطئة في الإعادة = ضعف **ثبات** لا ضعف تمييز؛ التمييز يُحكم عليه بالفرق بين العليا والدنيا.","[[**معامل الصعوبة**|ar.l16.difficulty]] المرتفع يعني فقرة سهلة (0.9 سهلة، 0.2 صعبة)؛ لا تعكس المعنى إلا إذا نص السؤال على نسبة المخطئين.","[[**التمييز السالب**|ar.l16.discrim]] يعني أن الضعاف أجابوا أفضل، والفقرة تُحذف؛ أما 0.25 فتُعدَّل لا تُحذف.","[[**المشتت الجيد**|ar.l16.distract]] يجذب الدنيا أكثر من العليا؛ والذي لا يختاره أحد مشتت فاشل.","[[**الوسيط**|ar.l16.central]] للبيانات الملتوية والمتطرفة، **المتوسط** للاعتدالية، **المنوال** للنوعية.","[[**الالتواء السالب**|ar.l16.normal]] = درجات مرتفعة = اختبار سهل، **الموجب** = درجات منخفضة = اختبار صعب؛ الإشارة تتبع اتجاه الذيل لا اتجاه التكدس.","[[**ز**|ar.l16.z]] متوسطها 0 وانحرافها 1، **ت** = 50 + 10ز؛ الرتبة المئينية 90 ليست 90% إجابات صحيحة.","الارتباط 0.65 متوسط لا قوي، و0.2 ضعيف، والإشارة السالبة تعني عكسياً لا ضعيفاً؛ والارتباط لا يثبت السببية.","**التغذية الراجعة** فورية وصفية عن المهمة؛ تأخيرها أسبوعاً أو الاكتفاء بثناء عام يضعف أثرها."],"vid":[["Awg3Juk0fDY","تطبيقات المعيار العاشر من معايير الرخصة المهنية","سهام الزهراني",23],["QNm0EOCSbd4","مراجعة مركزة على المعيار العاشر (التقويم) ج1","المدرب محمد رجب",66],["xtOirfEs94Q","مراجعة مركزة على المعيار العاشر (التقويم) ج2","المدرب محمد رجب",99],["tLgzlIeRtjM","محكمات التقويم: الصدق والثبات والموضوعية","سلوى البحيري",16],["eZbNJ4p68zE","الكمي في الرخصة المهنية: النزعة المركزية والتشتت","منصة ميم التعليمية",39],["UvKs6qLOA5o","كيفية حساب معامل الصعوبة","منصة ميم التعليمية",4],["fQVZa9SbC6M","معامل التمييز","منصة البراعة",5],["fyIaUKLKHVw","صدق الاختبار","عصام ممدوح",29],["vLgkOZZqSwM","اختبار الرخصة المهنية معياري أم محكي","زيدان محمود",17]],"map":null,"n":16},{"id":"L11","d":"K","std":"7","sub":"7.1، 7.2","ar":"مداخل التدريس وطرقه العامة","goal":"تميّز بين المدخل والاستراتيجية والطريقة والأسلوب، وتعرف كل طريقة تدريس برائدها وخطواتها والموقف الصفي الذي تناسبه.","sec":[{"h":"المفاهيم الأساسية ومداخل التدريس","pts":["الترتيب من الأعم إلى الأخص: [[**المدخل**|ar.l11.terms]] فلسفة ← الاستراتيجية خطة شاملة ← الطريقة إجراءات ← الأسلوب ← التقنية.","**الأسلوب** بصمة المعلم الشخصية في تنفيذ الطريقة نفسها، و**التقنية** أداة تخدم الطريقة وليست طريقة.","صنّف **جويس وويل** النماذج في [[أربع عائلات|ar.l11.other]]: معالجة المعلومات، والاجتماعية، والشخصية، والسلوكية.","**المدخل المنطقي** يرتب المحتوى من البسيط إلى المعقد، و**المدخل السيكولوجي** وفق ميول المتعلم وحاجاته.","معيار اختيار الطريقة مناسبتها **لأهداف الدرس وخصائص الطلاب**، لا شيوعها بين الزملاء.","أدوار المعلم: مرشد، و**ميسّر** يهيئ الظروف ويدعم عند الحاجة، ومفوّض، وتقليدي ملقّن."],"t":[["مدخل التدريس","الفلسفة أو الإطار الفكري العام الذي تنبثق منه طرق التدريس."],["استراتيجية التدريس","خطة شاملة مرنة من إجراءات متتابعة لتحقيق أهداف الدرس."],["طريقة التدريس","الإجراءات التي ينفذ بها المعلم الدرس داخل الاستراتيجية."],["أسلوب التدريس","الطابع الشخصي الذي يميز معلماً عن آخر في تنفيذ الطريقة نفسها."],["نماذج جويس وويل","تصنيف نماذج التدريس في أربع عائلات: معالجة المعلومات، الاجتماعية، الشخصية، السلوكية."],["التعليم المباشر","نموذج سلوكي يشرح فيه المعلم ويعرض ثم يطبق الطلاب بتغذية راجعة فورية."],["المعلم الميسّر","يهيئ بيئة التعلم ويقدم الدعم والإيضاح عند حاجة الطلاب إليه."],["المعلم المفوّض","يفوض الطلاب مسؤولية التعلم ويقتصر دوره على المتابعة."],["المعلم المرشد","يوجه المتعلم ويرشده إلى مصادر التعلم وطرقه."],["المعلم التقليدي","ملقن يحتكر الحديث والطالب متلق سلبي."],["نموذج التدريس","إطار نظري يصف خطوات التدريس ومنه تُشتق الاستراتيجيات."],["المدخل التكاملي","ربط المادة بالمواد الأخرى بعلاقات أفقية."]],"intro":[],"ex":[]},{"h":"الاستقراء والاستنباط وطرق العرض","pts":["[[**الاستقراء**|ar.l11.induct]] من الأمثلة إلى القاعدة، و**الاستنباط (القياس)** من القاعدة إلى الأمثلة؛ الأول لبناء المفاهيم، والثاني أسرع للتطبيق.","**الطريقة الاستدلالية (الهربارتية)** تجمعهما في خطوات هربارت الخمس: التمهيد ← العرض ← الربط ← الاستنتاج ← التطبيق.","[[**المحاضرة**|ar.l11.lecture]] اقتصادية للأعداد الكبيرة لكن المتعلم متلقٍّ سلبي؛ والتعلم في الطرق المباشرة **استقبالي**.","**المناقشة** أبرز عيوبها سيطرة بعض الطلاب، و**الحوار السقراطي** أسئلة متتابعة تكشف التناقض حتى يصل الطالب للصواب.","[[**العرض العملي**|ar.l11.demo]] للمهارات الأدائية (الوضوء، التجارب)، و**القصة** للابتدائية والتاريخ والتربية الإسلامية.","**الوسائل التعليمية** أدوات لخبرات محددة، و**تقنيات التعليم** أشمل: منظومة من الإنسان والآلة والطريقة."],"t":[["الاستقراء","السير من الأمثلة الجزئية إلى استنتاج القاعدة العامة."],["الاستنباط","السير من القاعدة العامة إلى تطبيقها على الأمثلة الجزئية."],["المحاضرة","طريقة إلقائية يكون فيها المعلم المصدر الرئيس والطالب متلقياً."],["الطريقة الحوارية","حوار سقراطي بأسئلة متتابعة يقود المتعلم إلى اكتشاف الحقيقة."],["العرض العملي","أداء المعلم للمهارة أمام الطلاب ثم تطبيقهم لها."],["الاستقصاء العادل","طرح قضية على مجموعتين مؤيدة ومعارضة مع محكمين مستقلين."],["الطريقة الهربارتية","طريقة استدلالية بخمس خطوات: تمهيد، عرض، ربط، استنتاج، تطبيق."],["الوسائل التعليمية","الأجهزة والأدوات والمواد التي تعين على إكساب المتعلم خبرة محددة."]],"ex":[],"intro":[]},{"h":"الاكتشاف وحل المشكلات والمشروعات","pts":["[[**الاكتشاف**|ar.l11.discovery]] (برونر): يصل الطالب إلى المفهوم بنفسه؛ موجّه، وشبه موجّه، وحر يحدد فيه الطالب المشكلة والأدوات.","**الاستقصاء** يولّد المعرفة بالأسئلة والبحث: ملاحظة، وتصنيف، وقياس، وتنبؤ.","[[**حل المشكلات**|ar.l11.problem]] (ديوي) يبدأ **بالشعور بالمشكلة** ← تحديدها ← البيانات ← الفروض ← اختبارها ← التعميم.","[[**المشروعات**|ar.l11.project]] (كلباترك، تلميذ ديوي): اختيار ← تخطيط ← تنفيذ ← تقويم، وتنتهي بمنتج ملموس.","الفرق في النهاية: الاكتشاف ← **مفهوم**، وحل المشكلات يعالج مشكلة محددة بخطوات، والمشروع ← منتج.","أكثر الطرق تطلباً **لفعالية المتعلم** الاكتشاف والمشروعات، وأقلها المحاضرة؛ وفي **دراسة الحالة** يحلل الطلاب ظاهرة ويقررون علاجها."],"t":[["الاكتشاف الموجه","المعلم يحدد المشكلة ويوجه بأسئلة وأدوات والطالب يصل إلى المفهوم."],["الاكتشاف الحر","الطالب يحدد المشكلة والأدوات والإجراءات دون توجيه مسبق."],["حل المشكلات","طريقة ديوي: شعور بالمشكلة، تحديد، فروض، اختبار، نتيجة."],["طريقة المشروعات","عمل هادف ممتد ينفذه الطلاب وينتهي بمنتج، رائدها كلباترك."],["الفرض","تفسير مؤقت محتمل للمشكلة يُختبر بالأدلة."],["دراسة الحالة","تحليل موقف واقعي مفصل واقتراح قرار أو حل له."]],"intro":[],"ex":[]},{"h":"التعليم المبرمج والتعلم الذاتي","pts":["[[**التعليم المبرمج**|ar.l11.programmed]] (سكنر) **سلوكي**: خطوات صغيرة، واستجابة نشطة، وتعزيز فوري، وخطو ذاتي.","**البرمجة الخطية** (سكنر) مسار واحد، و**المتشعبة** (كراودر) تحوّل المخطئ إلى إطار علاجي ثم تعيده.","عيبه أنه **لا ينمي التفاعل الاجتماعي** ولا يناسب الأهداف الوجدانية والإبداع.","[[**التعلم الذاتي**|ar.l11.self]] يتحمل فيه المتعلم مسؤولية تعلمه؛ ومن وسائله الحقيبة التعليمية والموديول وعقد التعلم.","**الفردي**: المهام نفسها لكل طالب منفرداً؛ و**التفريدي**: مهام مختلفة وفق ميوله.","**عقد التعلم** اتفاق مكتوب يتعهد فيه الطالب بمهام محددة وفق معايير مقابل تقدير."],"t":[["التعليم المبرمج","تقسيم المادة إلى خطوات صغيرة بتعزيز فوري وخطو ذاتي، رائده سكنر."],["البرمجة المتشعبة","برنامج كراودر الذي يحوّل المتعلم عند الخطأ إلى إطار علاجي."],["الحقيبة التعليمية","وحدة تعلم ذاتي متكاملة بوسائط متعددة واختبار قبلي وبعدي."],["الموديول","وحدة تعليمية صغيرة مستقلة ضمن برنامج تعلم ذاتي."],["الخطو الذاتي","انتقال المتعلم بين الخطوات بسرعته الخاصة."],["عقد التعلم","اتفاقية مكتوبة بين المعلم والطالب على مهام ومعايير وتعزيز."],["التعلم الموصوف للفرد","خطة تعليمية علاجية تُبنى لطالب واحد بعد تشخيصه."],["المجمعات التعليمية","برامج تعليمية ذاتية متكاملة تجمع بين الحقائب والتعلم للإتقان."],["برامج المحاكاة","برمجيات تمثل مواقف يصعب أو يخطر تنفيذها واقعياً."]],"intro":[],"ex":[]},{"h":"الاستراتيجيات الاجتماعية: التعاوني ولعب الأدوار والعصف والتبادلي والأقران والمصغر","pts":["[[**التعلم التعاوني**|ar.l11.coop]] (جونسون وجونسون): مجموعات **غير متجانسة** 4–6 بخمسة عناصر، أولها الاعتماد الإيجابي المتبادل.","[[**جيكسو (المجموعات المتداخلة)**|ar.l11.jigsaw]] (أرونسون): مجموعة خبراء ثم عودة لتعليم المجموعة الأم؛ وفي فرق التحصيل (STAD) لسلافين درجة الفريق من التحسن.","[[**العصف الذهني**|ar.l11.social]] (أوزبورن): إرجاء النقد، وحرية التفكير، و**الكم قبل الكيف**، والبناء على أفكار الآخرين.","**التدريس التبادلي** (بالينسكار وبراون) للفهم القرائي: التنبؤ، وتوليد الأسئلة، والتوضيح، والتلخيص، ويتبادل الطلاب دور المعلم.","**التدريس المصغر**: مهارة تدريسية واحدة مع 5–10 طلاب في 5–10 دقائق، ثم تسجيل وتغذية راجعة وإعادة.","**لعب الأدوار** لا يُقاطع فيه المشهد وتُناقش السلوكيات بعده، و**تدريس الأقران** يستفيد منه الطرفان.","بيئات التعلم ثلاث: **تنافسية** (فوز طالب خسارة آخر)، وفردية، وتعاونية."],"t":[["الاعتماد الإيجابي المتبادل","إدراك أعضاء المجموعة أنهم ينجحون معاً أو يفشلون معاً."],["المسؤولية الفردية","كل عضو مسؤول عن تعلمه وعن إسهامه في عمل المجموعة."],["جيكسو","استراتيجية المجموعات المتداخلة ومجموعات الخبراء (أرونسون)."],["العصف الذهني","توليد أكبر كم من الأفكار بحرية مع إرجاء الحكم (أوزبورن)."],["التدريس التبادلي","حوار منظم حول نص بالتلخيص والتساؤل والتوضيح والتنبؤ."],["تدريس الأقران","تعليم الطلاب بعضهم بعضاً بإشراف المعلم."],["التدريس المصغر","موقف تدريسي قصير لمهارة واحدة مع عدد قليل بتغذية راجعة."],["لعب الأدوار","محاكاة موقف واقعي يتقمص فيه المتعلمون أدواراً ثم يناقشونها."],["بيئة التعلم التنافسية","موقف يرتبط فيه نجاح طالب بفشل غيره."],["الألعاب التعليمية","نشاط تنافسي ممتع موجه لتحقيق أهداف تعليمية."]],"ex":[],"intro":[]},{"h":"مخروط الخبرة لإدجار ديل","pts":["رتّب [[**إدجار ديل**|ar.l11.dale]] الخبرات من الأكثر حسية في **القاعدة** إلى الأكثر تجريداً في القمة.","القاعدة **الخبرات المباشرة الهادفة**، ثم المعدلة (النماذج والمجسمات)، ثم الممثلة (الدراما ولعب الأدوار).","القمة **الرموز اللفظية**، وتحتها الرموز البصرية (الخرائط والرسوم).","المجسم خبرة **معدلة** لا مباشرة، و**المحاكاة** بديل للتجارب الخطرة أو المكلفة؛ والأصغر سناً يحتاج القاعدة أكثر."],"t":[["مخروط الخبرة","تصنيف ديل للخبرات من المباشرة (القاعدة) إلى الرموز اللفظية (القمة)."],["الخبرة المباشرة الهادفة","ما يمارسه المتعلم بنفسه في موقف حقيقي."],["الخبرة المعدلة","نماذج ومجسمات تحاكي الواقع عندما يتعذر الأصل."],["الرموز اللفظية","الكلمات المنطوقة والمكتوبة وهي قمة التجريد."],["المحاكاة","خبرة بديلة آمنة تمثل موقفاً حقيقياً يصعب تنفيذه."]],"intro":[],"ex":[]},{"h":"أسس المداخل الأربعة للتدريس كما في مؤشرات 7.1","pts":["مؤشر 7.1: يحدد **الأسس النظرية** للمداخل العامة للتدريس؛ والمداخل أربعة: السلوكي، والمعرفي، والإنساني، والاجتماعي.","**نمذجة السلوك** (اجتماعي): المعلم أو زميل يؤدي السلوك المرغوب ليحاكيه الطلاب، مع تعزيز من يتقنه.","تمييز سريع: «خطوات صغيرة وتعزيز» سلوكي، «يكتشف بنفسه» معرفي، «يختار ويقوّم ذاته» إنساني، «بالقدوة والزملاء» اجتماعي."],"t":[["المدخل السلوكي","مدخل يركز على تعديل السلوك الظاهر بتحليل المهمة والتعزيز والإتقان."],["المدخل المعرفي","مدخل يركز على العمليات العقلية ووصول المتعلم إلى المعرفة بالبحث والاكتشاف."],["المدخل الإنساني","مدخل يركز على الجوانب الوجدانية والوعي بالذات والاستقلالية والمسؤولية (روجرز)."],["المدخل الاجتماعي","مدخل يوظف التفاعل ونمذجة السلوك لبناء ثقافة صفية إيجابية (باندورا)."],["التدريس غير الموجه","نموذج روجرز: المعلم ميسّر متقبل يشارك الطالب أهدافه وتقويم تقدمه."],["تحليل المهمة","تجزئة المهارة إلى خطوات صغيرة متتابعة تُتقن واحدة بعد أخرى."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Four Teaching Approaches","المداخل الأربعة للتدريس"],"groups":[{"n":"السلوكي","who":"Skinner سكنر","ar":"**التغيير والتعديل في السلوك** الظاهر و**استجابة المتعلمين للمهام** والتعزيز","d":"ar.l11.approaches","items":[{"n":"التعلم للإتقان"},{"n":"التعليم المباشر"},{"n":"التعليم المبرمج"}]},{"n":"المعرفي","who":"Piaget · Bruner · Ausubel","ar":"**التفكير والبحث والاكتشاف ذاتياً** والوصول إلى المعرفة بجهده","d":"ar.l11.approaches","items":[{"n":"الاكتشاف"},{"n":"الاستقصاء"},{"n":"اكتساب المفاهيم"},{"n":"المنظم المتقدم"}]},{"n":"الإنساني (الشخصي)","who":"Rogers روجرز · Maslow","ar":"الوعي بالذات والاستقلالية والمسؤولية؛ المعلم **ميسّر**","d":"ar.l11.approaches","items":[{"n":"التدريس غير الموجه"},{"n":"عقود التعلم"},{"n":"التقويم الذاتي"}]},{"n":"الاجتماعي","who":"Bandura باندورا · Vygotsky","ar":"التفاعل و**نمذجة السلوك** لدعم **النظم التفاعلية** وثقافة صفية إيجابية","d":"ar.l11.approaches","items":[{"n":"التعلم التعاوني"},{"n":"لعب الأدوار"},{"n":"التقصي الجماعي"}]}]}},{"h":"العروض العملية والتغيير المفاهيمي","pts":["مؤشر 7.2: العرض العملي من الطرق **المباشرة**، والتغيير المفاهيمي من طرق التدريس **البنائي**.","العرض العملي أداء مع **شرح متزامن**؛ الأنسب للتجارب الخطرة أو المكلفة أو قليلة الأدوات.","**التصورات البديلة** أفكار تخالف العلم و**مقاومة للتغيير** لأنها مبنية على الخبرة اليومية.","[[**التغيير المفاهيمي**|ar.l11.conceptual]] (بوسنر) بأربعة شروط: **عدم الرضا** ← واضح ← معقول ← مثمر.","إعادة شرح الصواب **دون إحداث عدم الرضا** لا تغير التصور غالباً."],"t":[["خطوات العرض العملي","تجريب مسبق، توضيح الهدف، رؤية الجميع، أداء متدرج مع الشرح والسلامة، ثم تطبيق الطلاب."],["التصورات البديلة","مفاهيم خاطئة لدى الطالب تخالف المفهوم العلمي وتقاوم التغيير."],["التغيير المفاهيمي","استبدال التصور البديل بالمفهوم العلمي بشروط: عدم الرضا، الوضوح، المعقولية، الإثمار."],["التناقض المعرفي","مواجهة الطالب بما يخالف توقعه فيشعر بعدم الرضا عن تصوره."],["توقع – لاحظ – فسر","استراتيجية يتوقع فيها الطالب النتيجة ثم يلاحظ ثم يفسر الفرق بينهما."]],"intro":[],"ex":[]}],"trap":["[[**الأسلوب**|ar.l11.terms]] ما يميز المعلم شخصياً، و**الطريقة** إجراءات عامة يشترك فيها المعلمون؛ معلمان بطريقة واحدة = أسلوبان.","[[**الاستقراء**|ar.l11.induct]] أمثلة ← قاعدة، و**الاستنباط** قاعدة ← أمثلة؛ لا تخلط بينهما بسبب كلمة «استنتاج».","**الاكتشاف** يصل إلى مفهوم، و[[**حل المشكلات**|ar.l11.problem]] يعالج مشكلة بخطوات ديوي، و**المشروع** ينتهي بمنتج (كلباترك).","الخطوة الأولى في حل المشكلات **الشعور بالمشكلة** لا تحديدها ولا وضع الفروض.","**ديوي** صاحب حل المشكلات ومنهج النشاط، و[[**كلباترك**|ar.l11.project]] صاحب المشروعات، و**برونر** صاحب الاكتشاف، و**أوزبورن** صاحب العصف.","**الاكتشاف الموجه**: المعلم يحدد المشكلة والأدوات؛ **الحر**: الطالب يحدد الأدوات والإجراءات.","[[**جيكسو**|ar.l11.jigsaw]] مجموعات متداخلة بخبراء، و**فرق التحصيل** اختبار فردي ودرجة فريق من التحسن.","في العصف «هل هناك فكرة **أخرى**؟» صحيح، و«هل هناك فكرة **أفضل**؟» خطأ لأنه حكم على الأفكار.","**التدريس التبادلي** يتبادل فيه الطلاب دور المعلم حول نص مقروء، و**تدريس الأقران** طالب يعلّم طالباً، و**التعاوني** مجموعة لهدف مشترك.","**التدريس المصغر** للمعلم المتدرب على مهارة واحدة، وليس طريقة لتدريس الطلاب.","[[**التعليم المبرمج**|ar.l11.programmed]] سلوكي (سكنر) وفردي، و**المدمج** حضوري وإلكتروني، و**المتنقل** عبر الأجهزة المحمولة.","في مخروط ديل **القاعدة** مباشرة والقمة **رموز لفظية**؛ المجسم خبرة **معدلة** لا مباشرة.","**التعليم الفردي**: المهام نفسها لكل طالب منفرداً؛ **التفريدي**: مهام مختلفة لكل طالب بحسب ميوله؛ **الذاتي**: برغبة المتعلم ودون معلم.","**الاستقراء** أمثلة ← قاعدة (هربارت) ويناسب المجموعات الكبيرة ويطول وقته؛ **الاستنباط** قاعدة ← أمثلة وسريع لكن القاعدة تُنسى."],"vid":[["gpRfBrVb07o","تطبيقات المعيار السابع من معايير الرخصة المهنية","سهام الزهراني",23],["hYtkZI7UnDs","الفرق بين استراتيجية التدريس وطريقة التدريس وأسلوب التدريس","منصة البراعة",10],["yWUu2BxtyGk","شرح المعيار السابع: المعرفة بطرق التدريس العامة","سهام الزهراني",31],["IbuXK4l7vwY","الرخصة المهنية عام: استراتيجيات التدريس للتعلم النشط","قناة عين المبدع",75]],"map":{"title":["General Teaching Methods","طرق التدريس العامة"],"groups":[{"n":"طرق العرض المباشر","short":"العرض","ar":"المعلم مصدر الخبرة","idea":"تعلم استقبالي","items":[{"n":"الاستقراء والاستنباط","who":"Herbart هربارت","ar":"أمثلة ← قاعدة والعكس","d":"ar.l11.induct"},{"n":"المحاضرة","ar":"اقتصادية والمتعلم متلقٍّ","d":"ar.l11.lecture"}],"trap":"استنتاج القاعدة من الأمثلة استقراء"},{"n":"الاكتشاف والاستقصاء","short":"الاكتشاف","ar":"موجه أو حر","idea":"موجه وشبه موجه وحر","items":[{"n":"الاكتشاف","who":"Bruner برونر","ar":"يصل بنفسه إلى مفهوم","d":"ar.l11.discovery"}]},{"n":"المشكلات والمشروعات","short":"المشكلات","ar":"التعلم بالعمل","idea":"حل لمشكلة، أو منتج ملموس","items":[{"n":"حل المشكلات","who":"Dewey ديوي","ar":"يبدأ بالشعور بالمشكلة","d":"ar.l11.problem"},{"n":"المشروعات","who":"Kilpatrick كلباترك","ar":"ينتهي بمنتج","d":"ar.l11.project"}]},{"n":"التعلم الذاتي","short":"الذاتي","ar":"كل طالب بسرعته","idea":"خطوات صغيرة وتعزيز فوري","items":[{"n":"المبرمج الخطي","who":"Skinner سكنر","ar":"خطوات صغيرة ومسار واحد","d":"ar.l11.programmed"},{"n":"المبرمج المتشعب","who":"Crowder كراودر","ar":"إطار علاجي عند الخطأ"}]},{"n":"الاستراتيجيات الاجتماعية","short":"الاجتماعية","ar":"تعلم بالزملاء","idea":"نجاح مشترك ومسؤولية فردية","items":[{"n":"التعاوني","who":"Johnson & Johnson","ar":"اعتماد إيجابي متبادل","d":"ar.l11.coop"},{"n":"جيكسو","who":"Aronson أرونسون","ar":"مجموعات الخبراء","d":"ar.l11.jigsaw"},{"n":"العصف الذهني","who":"Osborn أوزبورن","ar":"الكم قبل الكيف","d":"ar.l11.social"}]},{"n":"الخبرة والمفاهيم","short":"الخبرة","ar":"من الحسي إلى المجرد","idea":"المخروط والتصورات البديلة","items":[{"n":"مخروط الخبرة","who":"Edgar Dale ديل","ar":"القاعدة خبرة مباشرة","d":"ar.l11.dale"},{"n":"التغيير المفاهيمي","who":"Posner بوسنر","ar":"عدم الرضا أولاً","d":"ar.l11.conceptual"}]}]},"n":11},{"id":"L12","d":"P","std":"8","sub":"8.1، 8.2","ar":"التخطيط للتدريس: الأهداف وتصنيف بلوم وخطة الدرس","goal":"تصوغ هدفاً سلوكياً سليماً، وتصنف أي هدف أو سؤال في مستواه ومجاله، وتعرف عناصر خطة الدرس وأدوات التخطيط التي يقيسها الاختبار.","sec":[{"h":"مستويات الأهداف وصياغة الهدف السلوكي","pts":["مستويات الأهداف: [[**الغايات**|ar.l12.levels]] ← الأهداف العامة (مرحلة أو مقرر) ← **الخاصة السلوكية** (درس واحد).","[[**الهدف السلوكي**|ar.l12.behav]] عند ماجر: أن + فعل سلوكي + الطالب + المحتوى + شرط الأداء + معيار الإتقان.","في «أن يحل 8 مسائل من 10 دون آلة حاسبة»: «8 من 10» **معيار**، و«دون آلة حاسبة» **شرط**.","يصف سلوك **المتعلم** لا المعلم، وناتجاً واحداً لا نشاطاً، بفعل قابل للملاحظة؛ ويلتقي مع صفات [[SMART|ar.l12.smart]].","أخطاء شائعة: «يوضح المعلم» سلوك معلم، و«يفهم/يدرك» لا يُقاس، و«يقرأ الدرس» نشاط لا ناتج."],"t":[["الغايات","أهداف تربوية بعيدة المدى تعبر عن فلسفة المجتمع."],["الهدف العام","ما يُتوقع تحقيقه في مرحلة أو مقرر، غير قابل للقياس المباشر."],["الهدف السلوكي","وصف دقيق لسلوك المتعلم المتوقع بعد الدرس، قابل للملاحظة والقياس."],["الفعل السلوكي","فعل يصف أداءً ظاهراً مثل يعدد، يحل، يرسم، يقارن."],["شرط الأداء","الظرف الذي يُؤدى فيه السلوك (بالخريطة، دون آلة حاسبة)."],["معيار الأداء","الحد الأدنى المقبول للإتقان (8 من 10، خلال دقيقتين)."]],"intro":[],"ex":[]},{"h":"تصنيف بلوم للمجال المعرفي: الأصلي والمعدل","pts":["[[**بلوم**|ar.l12.bloom]] (1956): المعرفة، الفهم، التطبيق، التحليل، التركيب، التقويم؛ والقمة **التقويم**.","[[المعدل|ar.l12.revised]] (أندرسون وكراثوول 2001): التذكر، الفهم، التطبيق، التحليل، التقويم، الإبداع؛ والقمة **الإبداع**.","صنّف الهدف بفعله عبر [[قائمة الأفعال|ar.l12.verbs]]: يقارن ويميز **تحليل**، ويحكم وينقد ويبرر تقويم، ويصمم ويقترح التركيب/الإبداع.","الدنيا: تذكر وفهم وتطبيق؛ والعليا: تحليل وتقويم وإبداع، وهي ما تستهدفه **أسئلة التفكير**."],"t":[["تصنيف بلوم","تدرج هرمي لأهداف المجال المعرفي في ستة مستويات (1956)."],["تصنيف أندرسون وكراثوول","تعديل 2001: أفعال، الإبداع في القمة، وبُعد للمعرفة."],["بُعد المعرفة","أنواع المعرفة: حقائقية، مفاهيمية، إجرائية، ما وراء معرفية."],["التحليل","تفكيك المادة إلى عناصرها وإدراك العلاقات (يقارن، يميز)."],["التركيب","جمع العناصر لبناء جديد (يقترح، يصمم)؛ يقابله الإبداع في المعدل."],["التقويم","إصدار حكم على قيمة شيء وفق معايير (ينقد، يبرر)."]],"intro":[],"cmp":{"title":"الأصلي والمعدل","cols":["الأصلي 1956 (بلوم)","المعدل 2001 (أندرسون وكراثوول)"],"rows":[{"k":"صيغة المستويات","a":"أسماء (المعرفة، الفهم…)","b":"أفعال (تذكّر، افهم…)","tag":"تغيّر"},{"k":"المستوى الأول","a":"المعرفة","b":"التذكر","tag":"تغيّر"},{"k":"القمة","a":"التقويم","b":"الإبداع (يقابل التركيب)","tag":"تغيّر"},{"k":"بعد المعرفة","a":"","b":"حقائقية، مفاهيمية، إجرائية، ما وراء معرفية","tag":"أُضيف"},{"k":"عدد المستويات","a":"ستة","b":"ستة","tag":"بقي"}]},"ex":[]},{"h":"المجال الوجداني والمجال النفس‑حركي","pts":["**الوجداني** ([[كراثوول|ar.l12.krath]]): الاستقبال ← الاستجابة ← التقييم ← التنظيم ← **التميز بالقيمة** (الوسم).","«أن يحب وطنه» و«أن يقدّر جهود العلماء» أهداف **وجدانية**.","**النفس‑حركي** ([[سمبسون|ar.l12.simpson]]) سبعة: الإدراك الحسي، الاستعداد، الاستجابة الموجهة، الآلية، المعقدة، التكيف، الإبداع.","تصنيفات حركية أخرى: **ديف** وأعلاه التطبيع، و**هارو** ويبدأ بالحركات الانعكاسية.","**التركيب** ليس من مستويات الوجداني، و**التقمص والتجسيد** مصطلحات تمويه في البدائل."],"t":[["تصنيف كراثوول","خمسة مستويات للمجال الوجداني من الاستقبال إلى التميز بالقيمة."],["الاستقبال","أدنى الوجداني: الانتباه والرغبة في الإصغاء للمثير."],["التميز بالقيمة","أعلى الوجداني: القيمة تصبح سمة ثابتة توجه السلوك."],["تصنيف سمبسون","سبعة مستويات للمجال النفس‑حركي من الإدراك إلى الإبداع."],["الاستجابة الموجهة","أداء المهارة بالتقليد والمحاولة والخطأ تحت التوجيه."],["التكيف","تعديل أداء المهارة لتناسب مواقف جديدة."],["التطبيع (ديف)","أعلى مستوى عند ديف: أداء المهارة تلقائياً دون تفكير."]],"intro":[],"ex":[]},{"h":"التخطيط ومستوياته وعناصر خطة الدرس والتهيئة","pts":["[[**التخطيط**|ar.l12.plan]] طويل المدى: الخطة السنوية والفصلية؛ وقصير المدى: خطة الوحدة والخطة اليومية.","[[**التهيئة**|ar.l12.set]] أكثر عنصر يُغفل: حافزة، وتوجيهية تربط بالسابق، وانتقالية، وتقويمية؛ ويقابلها الغلق.","أحداث [[جانييه|ar.l12.gagne]] التسعة تبدأ بجذب الانتباه وتنتهي بتعزيز الاحتفاظ والانتقال.","يبدأ المعلم بالتحقق من **المتطلبات السابقة**؛ وتوزيع المقرر السنوي ليس من عناصر الخطة اليومية.","عند ضيق الوقت تُرتب الأنشطة **حسب أولويتها للأهداف**، ولا تُحوَّل كلها واجبات."],"t":[["الخطة الفصلية","تخطيط طويل المدى يوزع موضوعات المقرر على أسابيع الفصل."],["خطة الوحدة","تخطيط لمجموعة دروس مترابطة بتحليل محتواها وتوزيعها زمنياً."],["التهيئة","مقدمة الدرس التي تجذب الانتباه وتربطه بالخبرات السابقة."],["التهيئة التوجيهية","تهيئة تحدد ما ينبغي الانتباه إليه وتربط الجديد بالسابق."],["المتطلبات السابقة","المعارف والمهارات اللازم توافرها قبل الدرس الجديد."],["الغلق","ختام الدرس بتلخيص الأفكار وتثبيتها."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Daily Lesson Plan","عناصر خطة الدرس اليومية"],"groups":[{"n":"قبل الدرس","ar":"ماذا سيتعلم الطالب؟","items":[{"n":"الموضوع"},{"n":"الأهداف"},{"n":"المتطلبات السابقة"}]},{"n":"البداية","ar":"تثير الانتباه وتربط بالسابق","d":"ar.l12.set","items":[{"n":"التهيئة"}]},{"n":"العرض","ar":"كيف سيتعلم؟","items":[{"n":"المحتوى والإجراءات"},{"n":"الاستراتيجيات"},{"n":"الوسائل"},{"n":"الأنشطة"}]},{"n":"الختام","ar":"هل تحقق الهدف؟","items":[{"n":"التقويم"},{"n":"الغلق"},{"n":"الواجب"}]},{"n":"الزمن","ar":"لكل خطوة وقتها، وهو أساس **إدارة وقت الحصة**","d":"ar.l12.plan"}]}},{"h":"التغذية الراجعة وتحليل المحتوى وجدول المواصفات والواجبات","pts":["[[**التغذية الراجعة**|ar.l12.feedback]] فورية، محددة ووصفية، على المهمة لا الشخص؛ و«أحسنت» وحدها لا تكفي.","أفضل صورها **تقدير مع تعليق**؛ والمؤجلة أقل أثراً من الفورية.","[[**تحليل المحتوى**|ar.l12.content]]: حقائق، ومفاهيم، وتعميمات، ومهارات، وقيم واتجاهات؛ بعد الأهداف وقبل الأنشطة.","[[**جدول المواصفات**|ar.l15.tos]]: الموضوعات (المحتوى) × مستويات الأهداف، يحقق صدق المحتوى؛ وزن الموضوع = حصصه ÷ مجموع الحصص × 100.","[[**الواجبات المنزلية**|ar.l12.homework]] مرتبطة بالدرس ومناسبة الكم، تُصحح وتُعاد بتغذية راجعة، ولا تُستخدم عقاباً."],"t":[["التغذية الراجعة","معلومات عن الأداء تعزز الصحيح وتصحح الخطأ."],["التغذية الراجعة الوصفية","تعليق محدد يصف ما تحقق وما يحتاج تحسيناً."],["تحليل المحتوى","تفكيك المادة إلى حقائق ومفاهيم وتعميمات ومهارات وقيم."],["التعميم","علاقة بين مفهومين أو أكثر تنطبق على حالات كثيرة."],["جدول المواصفات","مخطط ثنائي البعد يوزع الأسئلة على المحتوى ومستويات الأهداف."],["الوزن النسبي","نسبة الموضوع من الاختبار وفق حصصه أو أهميته."],["هرم المعرفة","ترتيب المعرفة من الحقائق إلى المفاهيم فالتعميمات فالقوانين فالنظريات."]],"intro":[],"ex":[]},{"h":"ربط أهداف التعلم بمعايير المنهج ونواتج التعلم","pts":["مؤشر 8.1: يخطط أنشطة بتسلسل منطقي تربط **أهداف التعلم بمعايير المنهج**.","[[**معايير المحتوى**|ar.l12.align]] ما ينبغي تعلمه في كل مجال، و**معايير الأداء** نواتج التعلم المتوقعة نهاية كل صف.","التسلسل: المعيار ← ناتج التعلم ← أهداف الدرس ← الأنشطة ← أدوات تقويم تجمع **دليلاً**.","**التصميم العكسي** (ويغنز وماكتاي): النتائج المرغوبة ← أدلة التقويم ← خبرات التعلم.","**المحاذاة**: الهدف والنشاط والتقويم بالمستوى نفسه؛ فهدف «يقارن» لا يُقوَّم بسؤال «اذكر»."],"t":[["معايير المحتوى","وصف عام لما ينبغي أن يتعلمه المتعلم في كل مجال تعلم."],["معايير الأداء","نواتج التعلم المتوقعة من المتعلم في نهاية كل صف أو مستوى."],["نواتج التعلم","ما يكتسبه الطالب من معارف ومهارات وقيم نتيجة خبرة تعليمية."],["التصميم العكسي","تخطيط يبدأ بالنتائج المرغوبة ثم أدلة التقويم ثم خبرات التعلم."],["المحاذاة","اتساق الهدف والنشاط والتقويم في المحتوى والمستوى المعرفي."]],"intro":[],"ex":[]},{"h":"شروط اختيار مصادر التعلم الرقمية وغير الرقمية","pts":["مؤشر 8.1: يضمّن الخطة [[**مصادر رقمية وغير رقمية**|ar.l12.resources]] تحقق شروط الاختيار.","أول الشروط **الارتباط بالهدف**، ثم المناسبة للمتعلمين، والدقة، والأمان، والإتاحة للجميع، واحترام الملكية الفكرية.","المصدر **وسيلة لا غاية**: يجربه المعلم قبل الحصة ويعد بديلاً، والأحدث أو الأغلى ليس الأفضل بالضرورة.","**مصادر البيئة المحلية** (زيارة، عينات حقيقية، خبير من المجتمع) فاعلة وقليلة التكلفة."],"t":[["مصادر التعلم","كل ما يُستخدم لدعم تعلم الطالب: مطبوع أو رقمي أو مجسم أو بشري أو من البيئة."],["شروط اختيار المصدر","الارتباط بالهدف، المناسبة للمتعلم، الدقة والحداثة، الأمان، التكلفة، الإتاحة، الملكية الفكرية."],["الإتاحة","إمكانية وصول جميع الطلاب إلى المصدر واستخدامه بمن فيهم ذوو الإعاقة."]],"intro":[],"ex":[]}],"trap":["[[**الهدف السلوكي**|ar.l12.behav]] يصف سلوك **الطالب**؛ أي صيغة فاعلها المعلم خاطئة مهما بدت مرتبة.","«يفهم، يدرك، يعتقد، يستوعب» **غير قابلة للقياس**؛ «يفسر، يعدد، يحل، يرسم» قابلة.","**الناتج** لا **النشاط**: «أن يقرأ الطالب الدرس» نشاط، و«أن يستخرج الفكرة الرئيسة» ناتج.","[[**التركيب**|ar.l12.bloom]] في الأصلي = **الإبداع** في المعدل؛ و**المعرفة** = **التذكر**؛ والإبداع صار **القمة** بدل التقويم.","**يقارن/يميز** تحليل، **يقترح/يصمم** تركيب، **يحكم/ينقد** تقويم، **يلخص/يفسر** فهم، **يحل/يستخدم** تطبيق.","[[**الاستقبال والاستجابة**|ar.l12.krath]] مستويات **وجدانية** دنيا، و**الإدراك والاستعداد** مستويات **نفس‑حركية** دنيا؛ لا تخلط العائلتين.","**التركيب** ليس من الوجداني، و**التقمص** ليس في كراثوول رغم ظهوره في البدائل.","**الهدف العام** يُشتق من فلسفة المجتمع وغير قابل للقياس المباشر؛ **السلوكي** في حصة واحدة.","**المعيار** (8 من 10) غير **الشرط** (دون آلة حاسبة).","[[**التهيئة التوجيهية**|ar.l12.set]] تربط بالسابق (كالمنظم المتقدم)؛ **الحافزة** تثير الاهتمام فقط؛ **التقويمية** تتأكد قبل الانتقال.","**جدول المواصفات** أداة تخطيط تسبق الأسئلة وتحقق **صدق المحتوى** لا الثبات.","[[التغذية الراجعة الجيدة|ar.l12.feedback]] **فورية ومحددة**؛ العامة («ممتاز») أو المتأخرة أسابيع ضعيفة الأثر."],"vid":[["7thKw6iZiq4","شرح المعيار الثامن: تخطيط الوحدات والأنشطة الدراسية","سهام الزهراني",32],["1gubFqh896U","حل أسئلة المعيار الثامن من معايير الرخصة المهنية","سهام الزهراني",29],["Xoqvja-oWTg","الأهداف المعرفية: تصنيف هرم بلوم","اختبار الرخصة المهنية للمعلم",19],["-2d4T2f0CW8","الأهداف المهارية: تصنيف هرم سمبسون","اختبار الرخصة المهنية للمعلم",24],["2QCvCsyFNhU","هرم بلوم المجال العقلي المعرفي","المدرب علي القرشي",13],["uLHuLpYCmlY","المعيار الثامن: تخطيط الدرس","سلوى البحيري",20]],"map":{"type":"tree","title":["Objectives & Their Domains","الأهداف ومجالاتها وتصنيفاتها"],"groups":[{"n":"المجال المعرفي","ar":"عمليات التفكير","items":[{"n":"التصنيف الأصلي 1956","who":"Bloom بلوم","ar":"معرفة ← فهم ← تطبيق ← تحليل ← تركيب ← تقويم","d":"ar.l12.bloom"},{"n":"التصنيف المعدل 2001","who":"Anderson & Krathwohl","ar":"تذكر ← فهم ← تطبيق ← تحليل ← تقويم ← إبداع","d":"ar.l12.revised"},{"n":"أفعال كل مستوى","ar":"مفتاح تصنيف الهدف والسؤال","d":"ar.l12.verbs"}],"trap":"التركيب في الأصلي = الإبداع في المعدل"},{"n":"المجال الوجداني","ar":"القيم والاتجاهات","items":[{"n":"خمسة مستويات","who":"Krathwohl كراثوول","ar":"استقبال ← استجابة ← تقييم ← تنظيم ← تميز بالقيمة","d":"ar.l12.krath"}],"trap":"التركيب والتقمص ليسا من مستوياته"},{"n":"المجال النفس‑حركي","ar":"المهارات الحركية","items":[{"n":"سبعة مستويات","who":"Simpson سمبسون","ar":"إدراك ← استعداد ← استجابة موجهة ← آلية ← معقدة ← تكيف ← إبداع","d":"ar.l12.simpson"},{"n":"خمسة مستويات","who":"Dave ديف","ar":"تقليد ← معالجة ← دقة ← ترابط ← تطبيع"},{"n":"ستة مستويات","who":"Harrow هارو","ar":"من الحركات الانعكاسية إلى التواصل غير اللفظي"}]},{"n":"صياغة الأهداف","ar":"من الغاية إلى السلوك","items":[{"n":"الهدف السلوكي","who":"Mager ماجر","ar":"سلوك وشرط ومعيار","d":"ar.l12.behav"},{"n":"SMART","ar":"محدد، قابل للقياس والتحقيق، وثيق الصلة، محدد بزمن","d":"ar.l12.smart"}],"trap":"الفاعل هو الطالب دائماً"}]},"n":12},{"id":"L13","d":"P","std":"8","sub":"8.3، 8.4","ar":"استراتيجيات التدريس والتعلم النشط والمنهج والتقنية","goal":"تختار الاستراتيجية أو الأداة التقنية المناسبة لموقف صفي محدد، وتميز أنواع المنهج وتنظيماته ونماذج بنائه، وتعرف الأبعاد المشتركة التي يجب تنميتها عبر المواد.","sec":[{"h":"التعلم النشط واستراتيجياته","pts":["**التعلم النشط** تطبيق للنظرية **البنائية**: الطالب يبني معرفته بالعمل، والمعلم ميسّر لا ملقّن.","**فكر‑زاوج‑شارك** (ليمان): فردي ← ثنائي ← جماعي؛ و**KWL** (أوجل): أعرف، أريد، تعلمت.","[[**الصف المقلوب**|ar.l13.flipped]]: الشرح في **المنزل** والتطبيق والمناقشة في الفصل.","[[**دورة التعلم 5E**|ar.l13.5e]] (بايبي): الانشغال ← الاستكشاف قبل الشرح ← التفسير ← التوسع ← التقويم.","[[**التعلم القائم على المشكلات**|ar.l13.pbl]]: مشكلة غير محددة البنية بلا حل واحد؛ والقائم على المشروعات ينتهي بمنتج.","**التعلم للإتقان** (بلوم وكارول): إتقان 80–90% قبل الانتقال؛ **الزمن متغير والتحصيل ثابت**.","[[استراتيجيات تفاعلية|ar.l13.active]]: **مراكز التعلم** بالتناوب، والرؤوس المرقمة، وحوض السمك؛ و[[نماذج بنائية|ar.l13.models]] منها التغير المفاهيمي ([[بوسنر|ar.l11.conceptual]])."],"t":[["التعلم النشط","تعلم يشارك فيه الطالب بفاعلية ويبني معرفته والمعلم ميسر."],["فكر‑زاوج‑شارك","تفكير فردي ثم نقاش ثنائي ثم مشاركة مع الصف."],["جدول KWL","أعرف، أريد أن أعرف، تعلمت: ينشط المعرفة السابقة ويقوّم التعلم."],["الصف المقلوب","المحتوى في المنزل بالفيديو والتطبيق في الحصة."],["دورة التعلم الخماسية","5E لبايبي: انشغال، استكشاف، تفسير، توسع، تقويم."],["التعلم للإتقان","لا انتقال قبل الإتقان؛ تقويم تكويني وعلاج وإثراء."],["نموذج بوسنر","نموذج التغير المفاهيمي لمعالجة التصورات البديلة."],["الرؤوس المرقمة","ترقيم أعضاء المجموعة واستدعاء رقم عشوائي للإجابة عن الجميع."],["حوض السمك","دائرة مناقشة داخلية ودائرة ملاحظة خارجية تتبادلان الأدوار."],["نموذج فراير","منظم رباعي للمفهوم: تعريف، خصائص، أمثلة، لا أمثلة."],["RAFT","كتابة إبداعية بأربعة عناصر: الدور، الجمهور، الصيغة، الموضوع."],["تنال القمر","استراتيجية فهم قرائي: تنبؤ، تنظيم، بحث، تلخيص، مقارنة."],["التعليم التوليدي","نموذج بنائي اجتماعي بأطوار تمهيدي وتركيزي وتحدٍّ وتطبيق."],["التساؤل الذاتي","طرح الطالب أسئلة على نفسه لمراقبة فهمه (ما وراء معرفي)."]],"intro":[],"ex":[]},{"h":"التعليم المتمايز والخرائط والأسئلة الصفية","pts":["[[**التعليم المتمايز**|ar.l13.diff]] (توملينسون): تكييف المحتوى والعملية والمنتج والبيئة وفق الاستعداد والاهتمام ونمط التعلم.","التمايز = المثير نفسه + **مهام متنوعة** = مخرجات متنوعة؛ والتقليدي مهمة واحدة للجميع.","[[**خريطة المفاهيم**|ar.l13.maps]] (نوفاك) هرمية بكلمات ربط وأساسها **أوزوبل**؛ والذهنية (بوزان) شعاعية؛ وأشكال فن للمقارنة.","[[**زمن الانتظار**|ar.l14.questions]] (رو) 3–5 ثوانٍ؛ ويُطرح السؤال **ثم** يُختار المجيب.","**الأسئلة السابرة**: إجابة ناقصة ← توضيحي، خاطئة ← مشجع لا تصحيح فوري، لا إجابة ← إعادة صياغة.","طلب وصف العمليات والصعوبات نهاية الدرس ينمي **التأمل** وما وراء المعرفة."],"t":[["التعليم المتمايز","تكييف المحتوى والعملية والمنتج والبيئة وفق الفروق (توملينسون)."],["الخريطة الذهنية","تمثيل شعاعي لفكرة مركزية بفروع وألوان (بوزان)."],["خريطة المفاهيم","تمثيل هرمي للمفاهيم بكلمات ربط (نوفاك)."],["أشكال فن","دائرتان متقاطعتان لمقارنة مفهومين."],["زمن الانتظار","فترة صمت 3–5 ثوانٍ بعد طرح السؤال."],["السؤال السابر","سؤال متابعة يعمق إجابة الطالب أو يوجهها."],["السبر المشجع","سلسلة أسئلة بعد إجابة خاطئة تقود الطالب إلى الصواب."]],"cmp":null,"intro":[],"ex":[]},{"h":"التقنية في التعليم: الأنماط والمنصات والنماذج","pts":["[[**التعليم المدمج**|ar.l13.elearn]] حضوري + إلكتروني؛ و**المتزامن** في الوقت نفسه، وغير المتزامن في أوقات مختلفة.","مستويات توظيف التعلم الإلكتروني: **مساند** للتعليم الصفي، ومدمج، وكامل عن بعد؛ وليس من مميزات الحاسب تنمية التفاعل الاجتماعي.","[[**نموذج SAMR**|ar.l13.samr]] (بونتيدورا): الاستبدال ← التعزيز ← التعديل ← إعادة التعريف؛ و**TPACK** (ميشرا وكوهلر) معارف المعلم.","[[منصات الوزارة|ar.l13.platforms]]: **مدرستي** للتعليم الإلكتروني، ونور للدرجات والغياب، وعين للمحتوى، وروافد للمصادر.","[[**مبادئ ماير**|ar.l13.mayer]]: التعليق الصوتي مع الرسوم أفضل من النص المكتوب، والنص قرب الصورة، وحذف المشتتات.","**الويب كويست** بحث في مصادر يحددها المعلم مسبقاً، و**الحوسبة السحابية** لدمج الملفات؛ والمزيد في [[أدوات الويب والتطبيقات|ar.l13.tools]].","[[**ADDIE**|ar.l13.design]] أشهر نماذج التصميم التعليمي: تحليل ← تصميم ← تطوير ← تنفيذ ← تقويم."],"t":[["التعليم المدمج","دمج التعلم الحضوري بالإلكتروني."],["التعلم المتنقل","تعلم عبر الأجهزة المحمولة بلا قيد مكان أو زمان."],["الرحلة المعرفية","ويب كويست: بحث موجه في مصادر إنترنت يحددها المعلم."],["الحوسبة السحابية","تخزين ومعالجة عبر الإنترنت من أي جهاز."],["مدرستي","منصة الوزارة الرسمية للتعليم الإلكتروني والفصول الافتراضية."],["نور","نظام الإدارة التربوية: درجات وغياب وشهادات."],["SAMR","استبدال، تعزيز، تعديل، إعادة تعريف لدمج التقنية."],["TPACK","تكامل معرفة التقنية والتربية والمحتوى."],["مبدأ التقارب المكاني","وضع النص قرب الصورة التي يشرحها (ماير)."],["التعليم المتزامن","تفاعل المعلم والطلاب في الوقت نفسه من أماكن مختلفة."],["التعليم غير المتزامن","تفاعل في أوقات وأماكن مختلفة عبر محتوى مسجل أو منصات."],["تقنيات التعليم","منظومة من الإنسان والآلة والطريقة لتحقيق أهداف التعليم."],["مصادر التعلم","كل الموارد البشرية وغير البشرية التي يتفاعل معها المتعلم لاكتساب الخبرة."],["التصميم التعليمي","تخطيط منظم للتعليم وتطويره وتقويمه (نموذج ADDIE)."],["الويكي","صفحة ويب يحررها عدة مستخدمين تشاركياً."],["البودكاست التعليمي","ملفات صوتية مسجلة تقدم شروحاً يستمع إليها الطالب في أي وقت."],["الواقع المعزز","تقنية تضيف عناصر رقمية إلى مشهد الواقع الحقيقي في الوقت نفسه."],["روافد","بوابة الوزارة لمصادر التعلم الرقمية المساندة للمناهج."]],"intro":[],"ex":[]},{"h":"المنهج: مفهومه وأنواعه وتنظيماته ونماذج بنائه","pts":["[[**المنهج**|ar.l13.curr]] الحديث = **جميع الخبرات** داخل المدرسة وخارجها؛ وهو أعم من المقرر، والمقرر أعم من الكتاب.","عناصره: الأهداف ← المحتوى ← طرق التدريس والأنشطة ← التقويم؛ وأسسه: الفلسفي (العقدي)، النفسي، الاجتماعي، المعرفي.","المنهج الرسمي (المعلن) وثيقة معتمدة، و**الخفي** (جاكسون) يُتعلم ضمناً دون تخطيط، و**الفارغ** (آيزنر) ما لم يُدرج عمداً.","[[تنظيمات المنهج|ar.l13.currorg]]: المنفصلة، والمترابطة، والمندمجة، والمحوري، و**النشاط** (ديوي)، و**الحلزوني** (برونر).","**نموذج تايلر** (1949) يبدأ بالأهداف، و**نموذج تابا** استقرائي يبدأ من المعلم بتشخيص الحاجات.","**التنظيم المنطقي** من البسيط إلى المعقد، و**السيكولوجي** وفق حاجات المتعلم وميوله.","**المدى والتتابع**: المدى أفقي (اتساع المحتوى)، والتتابع رأسي (تدرجه عبر الصفوف)."],"t":[["المنهج","جميع الخبرات المخططة التي تقدمها المدرسة لتحقيق أهدافها."],["المنهج الخفي","ما يُتعلم ضمنياً من المناخ والعلاقات دون تخطيط."],["المنهج الفارغ","ما حُذف أو أُغفل عمداً من المنهج الرسمي."],["منهج النشاط","تنظيم ديوي القائم على ميول الطلاب وحل المشكلات."],["المنهج الحلزوني","تنظيم برونر الذي يعيد المفاهيم بعمق متزايد."],["نموذج تايلر","أربعة أسئلة لبناء المنهج تبدأ بالأهداف."],["نموذج تابا","بناء المنهج استقرائياً من المعلم بتشخيص الحاجات."],["المدى والتتابع","اتساع المحتوى أفقياً وتدرجه رأسياً عبر الصفوف."],["المنهج كنظام","مدخلات وعمليات ومخرجات وتغذية راجعة متفاعلة."],["المقرر الدراسي","موضوعات محددة في مادة دراسية لصف معين."],["المنهج التكنولوجي","تنظيم منهجي يعتمد التقنية والخطو الذاتي في تقديم الخبرات."]],"ex":[],"intro":[]},{"h":"الأبعاد المشتركة بين المناهج","pts":["[[**الأبعاد المشتركة**|ar.l13.cross]] تُنمّى عبر **جميع المواد**، بالشواهد والمواقف والأنشطة لا بالوعظ المباشر.","مؤشر 8.3: استراتيجيات تلبي **حاجات المتعلمين وخصائصهم** وتراعي طبيعة الأهداف؛ وتنويعها يخفض كره المادة.","**الثقافة الرقمية**: الاستخدام الآمن والأخلاقي للتقنية وتقويم مصداقية المصادر.","الأسئلة التي تحفز النقاش وحب الاستطلاع **مفتوحة** لا تبحث عن إجابة واحدة."],"t":[["الأبعاد المشتركة","مهارات وقيم تُنمّى عبر كل المواد: هوية، تفكير، حياتية، رقمية، لغة."],["المهارات الحياتية","مهارات التعامل مع متطلبات الحياة اليومية كالتخطيط والإدارة المالية."],["الثقافة الرقمية","الاستخدام الكفء والآمن والأخلاقي للتقنية ومصادرها."],["مهارات التفكير العليا","التحليل والتقويم والإبداع وحل المشكلات."]],"intro":[],"ex":[]},{"h":"التعليم الشامل وعلاقته بالدمج والتمايز","pts":["مؤشر 8.3: [[**التعليم الشامل**|ar.l13.udl]] يعلّم الجميع معاً في الفصل العام، مع تكييف البيئة والمنهج والتدريس والتقويم.","**الدمج** يطلب من الطالب التكيف، و**الشمول** يغيّر النظام نفسه ليستوعب التنوع.","**التصميم الشامل للتعلم (UDL)**: وسائل متعددة للتمثيل، ووسائل متعددة للتعبير والأداء، ووسائل متعددة للمشاركة والتحفيز.","ممارسات شاملة: توقعات عالية للجميع، ومجموعات مرنة، وتقنيات مساعدة، و**تعاون مع معلم التربية الخاصة**.","التمايز أداة من أدوات الشمول؛ والشمول **ليس** خفض الأهداف ولا عزل ذوي الاحتياج."],"t":[["التعليم الشامل","تعليم جميع المتعلمين معاً في الفصل العام مع تكييف النظام ليستوعب تنوعهم."],["التصميم الشامل للتعلم","تخطيط مسبق بوسائل متعددة للتمثيل والتعبير والمشاركة ليناسب الجميع (UDL)."],["الدمج","إلحاق الطالب ذي الاحتياج بالنظام التعليمي القائم مع خدمات مساندة."]],"intro":[],"ex":[]},{"h":"الأبعاد المشتركة بصيغة مؤشرات المعيار الثامن: الأولويات والقيم والمهارات","pts":["المعيار الثامن: بيئة تعزز الأبعاد المشتركة = **أولويات + قيم ست + مهارات**.","**التنمية المستدامة**: تلبية حاجات الحاضر دون الإضرار بقدرة الأجيال القادمة (ترشيد، حفاظ على الموارد).","**الشغف المعرفي**: حب الاستطلاع والرغبة الذاتية في المعرفة، ويُنمّى بالأسئلة المفتوحة والمشروعات البحثية.","التضمين **الضمني** أقوى من الوعظ؛ والقائمة المختصرة (هوية، تفكير، حياتية، رقمية، لغة) لا تطابق نص المؤشرات."],"t":[["الأولويات في الأبعاد المشتركة","المواطنة المسؤولة، ومكانة المملكة الريادية، والتنمية المستدامة."],["القيم الست","تقوى الله، الوسطية والاعتدال، تقدير الذات، الشغف المعرفي، تقدير العمل وإتقانه، المسؤولية."],["الشغف المعرفي","حب الاستطلاع والرغبة الذاتية في المعرفة والبحث."],["التنمية المستدامة","تلبية حاجات الحاضر دون الإضرار بحاجات الأجيال القادمة."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Cross-Curricular Dimensions","الأبعاد المشتركة في المعيار الثامن"],"groups":[{"n":"الأولويات","ar":"خبرات **مباشرة أو ضمنية**","d":"ar.l13.cross","items":[{"n":"المواطنة المسؤولة"},{"n":"مكانة المملكة العربية السعودية ومكانتها الريادية"},{"n":"التنمية المستدامة"}]},{"n":"القيم الست","ar":"يراعيها المعلم في الأنشطة ويعززها","d":"ar.l13.cross","items":[{"n":"تقوى الله"},{"n":"الوسطية والاعتدال"},{"n":"تقدير الذات"},{"n":"الشغف المعرفي"},{"n":"تقدير العمل وإتقانه"},{"n":"المسؤولية"}]},{"n":"المهارات","ar":"تُنمّى بالمهام والاستراتيجيات","d":"ar.l13.cross","items":[{"n":"حل المشكلات"},{"n":"الاعتماد على الذات وتقديرها"},{"n":"التعامل باحترام مع الآخرين"}]}]}}],"trap":["[[**الصف المقلوب**|ar.l13.flipped]]: الشرح في المنزل والتطبيق في الفصل؛ **المدمج**: حضوري + إلكتروني؛ **المتنقل**: أجهزة محمولة.","**فكر‑زاوج‑شارك** يبدأ فردياً، وبعض الاستراتيجيات المشابهة تبدأ ثنائياً؛ الترتيب هو المفتاح.","**KWL** ينمي ما وراء المعرفة (يفكر الطالب فيما يعرفه) لا التفكير الإبداعي.","**الرحلات المعرفية** مصادر إنترنت يختارها المعلم؛ **الرحلات الميدانية** خارج الصف؛ **الحوسبة السحابية** تخزين ومشاركة.","**الخريطة الذهنية** شعاعية بلا كلمات ربط (بوزان)؛ **خريطة المفاهيم** هرمية بكلمات ربط (نوفاك) والعام في **القمة**.","**نموذج بوسنر** للتصورات البديلة، لا التعلم التعاوني ولا الموديولات.","[[**دورة التعلم**|ar.l13.5e]] الثلاثية لكاربلس تبدأ بالاستكشاف؛ **بايبي** = الخماسية 5E تبدأ بالانشغال.","**التعلم للإتقان**: الزمن متغير والمعيار ثابت؛ ليس تدريساً للمتفوقين فقط.","[[**المنهج الخفي**|ar.l13.curr]] غير مخطط ويؤثر في القيم؛ **الفارغ** حُذف عمداً؛ **الرسمي** مكتوب.","**تايلر** يبدأ بالأهداف ومن أعلى؛ **تابا** تبدأ من المعلم استقرائياً؛ و**تايلر** صاحب تقويم المنهج و**دانيلسون** صاحب تقويم المعلمين.","**التنظيم المنطقي** بسيط ← معقد؛ **السيكولوجي** حسب المتعلم؛ **الحلزوني** عودة المفاهيم بتعمق.","[[**SAMR**|ar.l13.samr]]: الاستبدال لا يغير المهمة، وإعادة التعريف مهمة مستحيلة بلا تقنية."],"vid":[["7thKw6iZiq4","شرح المعيار الثامن: تخطيط الوحدات والأنشطة الدراسية","سهام الزهراني",32],["1gubFqh896U","حل أسئلة المعيار الثامن من معايير الرخصة المهنية","سهام الزهراني",29],["OUKCqkJaY_Q","المنهج في الرخصة المهنية","سلوى البحيري",17],["CaFz9OJJGy4","سؤال 26: استراتيجية الفصل المقلوب","زيدان محمود",2],["PLRm6ZBuG3oAeYEQjpFN0qVUWD4kIH8rfV","قائمة: معيار التخطيط للدرس وتنفيذه (استراتيجيات بدقيقة واحدة)","نبراس السعودية",17],["ujgQj1bVaEQ","المحاضرة الثامنة: التقنية في التعليم","منصة ثقة التعليمية",113]],"map":{"type":"cards","title":["Strategies, Models & Their Founders","الاستراتيجيات والنماذج وأصحابها"],"groups":[{"n":"Active Learning","ar":"التعلم النشط","items":[{"n":"فكر‑زاوج‑شارك","who":"Lyman ليمان","ar":"فردي ← ثنائي ← جماعي"},{"n":"KWL","who":"Ogle أوجل","ar":"أعرف، أريد، تعلمت"},{"n":"دورة التعلم الخماسية","who":"Bybee بايبي","ar":"5E: تجريب قبل الشرح","d":"ar.l13.5e"},{"n":"التعلم للإتقان","who":"Bloom & Carroll","ar":"الزمن متغير والتحصيل ثابت"}]},{"n":"Differentiation & Maps","ar":"التمايز والخرائط","items":[{"n":"التعليم المتمايز","who":"Tomlinson توملينسون","ar":"محتوى، عملية، منتج، بيئة","d":"ar.l13.diff"},{"n":"خريطة المفاهيم","who":"Novak نوفاك","ar":"هرمية بكلمات ربط","d":"ar.l13.maps"},{"n":"الخريطة الذهنية","who":"Buzan بوزان","ar":"مركز وفروع شعاعية"}]},{"n":"Technology","ar":"التقنية","items":[{"n":"SAMR","who":"Puentedura بونتيدورا","ar":"من الاستبدال إلى إعادة التعريف","d":"ar.l13.samr"},{"n":"TPACK","who":"Mishra & Koehler","ar":"تقنية + تربية + محتوى"},{"n":"مبادئ الوسائط المتعددة","who":"Mayer ماير","ar":"صوت مع الرسوم، بلا مشتتات","d":"ar.l13.mayer"}]},{"n":"Curriculum","ar":"المنهج","items":[{"n":"المنهج الخفي","who":"Jackson جاكسون","ar":"يُتعلم ضمناً دون تخطيط","d":"ar.l13.curr"},{"n":"المنهج الفارغ","who":"Eisner آيزنر","ar":"ما حُذف عمداً"},{"n":"نموذج تايلر","who":"Tyler 1949","ar":"يبدأ بالأهداف","d":"ar.l13.currorg"},{"n":"نموذج تابا","who":"Taba تابا","ar":"يبدأ من المعلم"}]}]},"n":13},{"id":"L14","d":"P","std":"9","sub":"9.1–9.4","ar":"بيئات التعلم: الإدارة الصفية والتعزيز والتوقعات والتواصل","goal":"تميّز أساليب تعديل السلوك بدقة، وتختار الإجراء الأنسب والخطوة الأولى في المواقف الصفية بمنطق الهيئة (أول حادثة ← المعلم، المتكرر والخطر ← المرشد والإدارة)، وتبني توقعات عالية وتواصلاً داعماً للتعلم.","sec":[{"h":"9.1 تأسيس توقعات أداء عالية والدافعية الصفية","pts":["التوقعات العالية تعكس **إيمانه بقدرة جميع طلابه على النجاح**، لا رغبة المعلم في التنافس أو إنجازه الشخصي.","[[**أثر بجماليون**|ar.l14.expect]] (روزنثال وجاكوبسون 1968): التوقع **نبوءة تحقق ذاتها**.","التوقع العالي تحدٍّ مع دعم و**أهداف تعلم واضحة** قابلة للتحقيق؛ والتوقع **المثالي غير الواقعي** يُحبط.","قارن الطالب **بأدائه السابق** لا بأقرانه؛ والدافعية الداخلية أبقى من المكافآت.","[[**العزو**|ar.l14.attrib]] (واينر): إلى **الجهد** يزيد المثابرة، وإلى القدرة الثابتة يولّد العجز المتعلم.","**الكفاءة الذاتية** (باندورا): أقوى مصادرها **خبرات الإتقان**؛ وتقدير الذات يُرفع بإبراز جوانب القوة لا بخفض المطلوب.","بعد الإجابة الخاطئة: **إعادة صياغة السؤال** أو السبر، لا الإجابة الجاهزة."],"t":[["التوقعات العالية","إيمان المعلم بقدرة كل طالب على التعلم وتكليفه بمهام تتحداه مع دعمه حتى يحققها."],["أثر بجماليون","تحوّل توقعات المعلم (عالية أو منخفضة) إلى نبوءة تحقق ذاتها في تحصيل الطالب (روزنثال وجاكوبسون)."],["الدافعية الداخلية","قوة تنبع من المتعلم نفسه (فضول، رغبة في الإتقان) وهي أقوى أنواع الدافعية وأبقاها."],["الدافعية الخارجية","سلوك يُؤدَّى وسيلة لشيء آخر كالدرجة أو الجائزة أو تجنب العقاب."],["نظرية العزو (واينر)","تفسير الطالب لسبب نجاحه أو فشله على أبعاد: داخلي/خارجي، ثابت/متغير، قابل للضبط/غير قابل."],["العجز المتعلم (سليجمان)","توقف الطالب عن المحاولة بعد فشل متكرر لاعتقاده أن النتيجة خارج سيطرته."],["تقدير الذات","حكم الطالب على قيمته وقدراته؛ يُرفع بخبرات نجاح حقيقية وتعزيز جوانب القوة."],["الكفاءة الذاتية","اعتقاد الطالب بقدرته على أداء مهمة محددة بنجاح، ومصدرها الأقوى خبرات الإتقان (باندورا)."],["التغذية الراجعة الوصفية","تعليق يصف ما أُنجز بدقة وما يحتاج تحسيناً وكيف، بدل الحكم العام أو الدرجة فقط."]],"intro":[],"ex":[]},{"h":"9.2 قيادة الأنشطة الصفية: أنماط الإدارة والقواعد والوقت والمجموعات","pts":["إدارة الصف **تنظيم البيئة التعليمية** للتعلم، لا مجرد ضبط ومعاقبة.","[[**القواعد الصفية**|ar.l14.styles]] قليلة (3–5) إيجابية، توضع **مع الطلاب** بداية العام ومتسقة مع قواعد الوزارة.","[[**كونين**|ar.l14.kounin]]: **اليقظة**، والتداخل، والزخم، وتنبيه المجموعة، وأثر الموجة.","[[الانضباط الحازم|ar.l14.canter]] (كانتر): قواعد، وتقدير إيجابي، وعواقب متدرجة معلنة.","المقاعد حسب **نوع النشاط** (صفوف، مجموعات، حرف U)، والمجموعات غير متجانسة بأدوار محددة والمعلم **ميسّر** بينها.","عند الملل: **نشاط قصير يكسر الروتين**؛ ومن ينهي مبكراً يُعطى نشاطاً إثرائياً.","**الأزمة الصفية**: الهدوء ← فصل المتسببين ← شغل البقية بنشاط ← معالجة فردية بعد الحصة."],"t":[["إدارة الصف","مجموعة الأنشطة التي ينظم بها المعلم البيئة المادية والنفسية والاجتماعية للصف ليحدث التعلم."],["النمط الديمقراطي","إدارة تقوم على الحوار والمشاركة والأمن النفسي وتبني الانضباط الذاتي."],["النمط التسلطي","إدارة بالخوف والطاعة التامة والثواب والعقاب؛ تولّد الاتكالية والدافعية الخارجية."],["النمط الفوضوي","إدارة بلا ضوابط لمعلم ضعيف الشخصية أو مفرط في الود؛ يضيع الوقت وتضعف مكانته."],["اليقظة (كونين)","وعي المعلم المستمر بكل ما يجري في الصف وإظهار ذلك للطلاب فيتدخل قبل اتساع المشكلة."],["التداخل (كونين)","قدرة المعلم على معالجة أمرين في وقت واحد دون توقف الدرس."],["أثر الموجة","تأثر بقية الطلاب بطريقة معالجة المعلم لسلوك طالب واحد (كونين)."],["القواعد الصفية","توقعات عامة قليلة وواضحة تُوضع مع الطلاب أول العام وتتسق مع لائحة السلوك."],["الإجراءات الصفية","خطوات روتينية لإنجاز نشاط محدد: بدء الحصة، إنهاؤها، الانتباه، العمل في المقاعد."],["المعلم الميسّر","دور المعلم في التعلم النشط: ينظم ويوجه ويتنقل بين المجموعات ولا يلقّن."],["الإدارة الذاتية للصف","انتقال ضبط السلوك من المعلم إلى الطلاب أنفسهم."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Classroom Management Styles","أنماط إدارة الصف"],"groups":[{"n":"الديمقراطي","ar":"حوار ومشاركة وأمن نفسي و**انضباط ذاتي**؛ وهو الأنسب","d":"ar.l14.styles"},{"n":"التسلطي","ar":"خوف وطاعة تامة واتكالية ودافعية خارجية","d":"ar.l14.styles"},{"n":"الفوضوي (المتساهل)","ar":"لا ضوابط وضياع الوقت؛ ومنه الود الزائد الذي يُضعف مكانة المعلم","d":"ar.l14.styles"}]}},{"h":"9.3 (أ) تعديل السلوك: التعزيز والعقاب وأساليبهما","pts":["[[**التعزيز**|ar.l14.reinf]] يزيد السلوك و**العقاب** يقلله؛ ثم: أُضيف شيء = موجب، وأُزيل = سالب.","التعزيز الفعال **فوري** متنوع متناسب دون إشباع؛ [[المتواصل|ar.l14.schedules]] للاكتساب، و**المتقطع** للاستمرار.","المعززات: **اجتماعية** (أسهلها وأكثرها تأثيراً)، ونشاطية، ومادية، ورمزية، وغذائية.","[[**الانطفاء/الإطفاء**|ar.l14.extinct]]: حجب التعزيز (تجاهل مقصود) مع **التعزيز التفاضلي** للبديل.","**تكلفة الاستجابة** (خصم نقاط) و**الإقصاء** (إبعاد مؤقت) كلاهما عقاب سالب.","[[**مبدأ بريماك**|ar.l14.premack]]: نشاط محبب يعزز نشاطاً أقل حباً؛ و**الاقتصاد الرمزي** رموز تُستبدل لاحقاً.","**التشكيل** تعزيز التقريبات المتتابعة، و**النمذجة** تعلم بملاحظة نموذج؛ و[[أساليب أخرى|ar.l14.othermod]] كالتصحيح الزائد وضبط المثير والتلقين."],"t":[["التعزيز الموجب","إضافة مثير سارّ بعد السلوك مباشرة فيزداد احتمال تكراره."],["التعزيز السالب","إزالة مثير منفّر بعد السلوك المرغوب فيزداد السلوك؛ ليس عقاباً."],["العقاب السالب","سحب معزز بعد السلوك غير المرغوب فيقل؛ يشمل تكلفة الاستجابة والإقصاء."],["تكلفة الاستجابة","فقدان الطالب جزءاً من معززاته المكتسبة (درجات، نقاط، امتياز) بسبب سلوك غير مرغوب."],["الإقصاء (العزل المؤقت)","إبعاد الطالب مدة محددة عن البيئة أو الأنشطة المعززة بعد السلوك غير المقبول."],["الانطفاء","تلاشي السلوك غير المرغوب عند إيقاف التعزيز عنه، وأبرز صوره التجاهل المقصود."],["التصحيح الزائد","إزالة الضرر الناتج عن السلوك مع تكليف الطالب بأعمال إضافية تتجاوز الضرر."],["مبدأ بريماك","السلوك الأكثر تكراراً (المحبب) يُستخدم معززاً للسلوك الأقل تكراراً."],["الاقتصاد الرمزي","نظام معززات رمزية (نجوم، كوبونات) تُستبدل لاحقاً بمعززات حقيقية."],["التعزيز التفاضلي","تجاهل السلوك غير المرغوب مع تعزيز السلوك البديل أو النقيض له."],["السلوك التوكيدي","تدريب الطالب على التعبير عن رأيه وحقوقه بثقة دون عدوان."],["الكف المتبادل","إحلال استجابة مقبولة محل استجابة غير مرغوبة لا تجتمعان معاً."],["الإرشاد بالواقع","الاستفادة من المواقف والأنشطة الواقعية في تعديل السلوك."],["النشاط التعزيزي","نشاط إضافي لمن أتقن الهدف لتثبيت التعلم وتعميقه."]],"cmp":{"title":"التعزيز والعقاب في جدول واحد","cols":["موجب (نضيف شيئاً)","سالب (نزيل شيئاً)"],"rows":[{"k":"تعزيز: يزيد السلوك","a":"نضيف محبباً: مدح، نجمة","b":"نزيل منفّراً: إلغاء إنذار، إعفاء من واجب"},{"k":"عقاب: يقلل السلوك","a":"نضيف منفّراً: توبيخ","b":"نسحب محبباً: حرمان من امتياز، تكلفة الاستجابة"}]},"ex":["طالب يحضّر دروسه ليتجنب توبيخ المعلم: زاد السلوك لأنه يزيل شيئاً يكرهه، فهذا **تعزيز سالب** لا عقاب."],"intro":[]},{"h":"9.3 (ب) بيئة آمنة: التعامل مع المشكلات السلوكية والفئات والسلامة","pts":["**العنف** لأول مرة: الخطوة الأولى تنبيه المعتدين بأن السلوك مرفوض وله عواقب إن تكرر.","**التنمر** بخطة مدرسية (الموجه والإدارة والأسرة)؛ وشكوى ولي الأمر منه ← **الإنصات** أولاً.","[[فئات الطلاب|ar.l14.cases]]: الخجول ← **علاقة ثقة** ومهام سهلة؛ كثير الحركة ← حركة مشروعة؛ المتحدي ← لقاء فردي.","**المعتدى عليه**: بناء ثقته وحمايته، لا لومه ولا مواجهته بالمتنمر أمام الصف.","أنجز ثم أساء: افصل **الاعتراف بالإنجاز** عن رفض السلوك.","**التدخين** ولو خارج السور ← الموجه والإدارة وفق [[قواعد السلوك والمواظبة|ar.l14.rules1447]].","ممنوع: **العقاب الجماعي** والبدني والتشهير والطرد من الفصل؛ والسلامة تبدأ **بإيقاف الخطر فوراً**."],"t":[["البيئة الصفية الآمنة","أمان جسدي ونفسي: قواعد واضحة، احترام متبادل، لا إهانة ولا عقاب بدني، معالجة خاصة للمخالفة."],["التحصين التدريجي","تعريض الطالب بالتدرج لمواقف يخشاها من الأسهل إلى الأصعب حتى يزول الخوف."],["الغمر (الإغراق)","مواجهة الطالب للمثير المخيف دفعة واحدة ودون تدرج."],["التنمر","إيذاء متكرر ومقصود من طالب أقوى لآخر أضعف، لفظياً أو جسدياً أو إلكترونياً."],["العقاب الجماعي","معاقبة الصف كله على مخالفة بعض الطلاب؛ ممارسة مرفوضة تربوياً."],["لائحة السلوك والمواظبة","وثيقة الوزارة التي تصنف المخالفات بدرجات وتحدد الإجراءات التدريجية ولجنة التوجيه والإرشاد."],["لجنة التوجيه والإرشاد","لجنة مدرسية تنظر في المخالفات السلوكية المتكررة أو الجسيمة وفق اللائحة."],["وكيل شؤون الطلاب","الجهة التي تُحال إليها المخالفات المتكررة داخل المدرسة والحافلة بعد إجراءات المعلم."]],"intro":[],"ex":[],"map":{"type":"fan","title":["Escalation Ladder","سلّم التصعيد في المواقف السلوكية"],"groups":[{"n":"بسيط لأول مرة","ar":"يعالجه **المعلم**: تجاهل مقصود أو تنبيه هادئ على انفراد مع توضيح العواقب","d":"ar.l14.choose"},{"n":"متكرر","ar":"عواقب **اللائحة** وإشراك الموجه الطلابي وولي الأمر","d":"ar.l14.rules1447"},{"n":"خطر أو خارج الصلاحية","ar":"**الإدارة** والموجه فوراً (طبي، نفسي، قانوني، ولي أمر بحالة غير طبيعية)","d":"ar.l14.choose"}]}},{"h":"9.4 ثقافة تواصل معززة للتعلم","pts":["[[عناصر الاتصال|ar.l14.comm]]: مرسل، رسالة، قناة، مستقبل، و**تغذية راجعة** تميز الاتصال الحديث.","**غير اللفظي** (نظرة، إيماءة، قرب، نبرة) يسبق اللفظي أثراً، والأنسب للخجول وللتنبيه الصامت.","النمط **المتعدد (المفتوح)** أفضل للتعلم من وحيد الاتجاه والثنائي.","[[**زمن الانتظار**|ar.l14.questions]] 3–5 ثوانٍ يرفع جودة الإجابات ومشاركة الخجولين.","**الإنصات النشط** إيماء وإعادة صياغة دون مقاطعة؛ ومع الإجابة الخاطئة انظر إلى الجزء الصحيح ولا تسخر.","[[التغذية الراجعة|ar.l12.feedback]] **تراكم معرفي** والتعزيز وجداني؛ و«نجمتان وأمنية»: قوتان ونقطة تحسين.","**ولي الأمر الغاضب**: إنصات ← حقائق بهدوء ← خطة مشتركة؛ وإن بدا بحالة غير طبيعية ← الإدارة."],"t":[["زمن الانتظار","صمت المعلم 3–5 ثوانٍ بعد السؤال ليفكر الطلاب ويصوغوا إجاباتهم (ماري رو)."],["الأسئلة السابرة","سلسلة أسئلة متتابعة يبني كل منها على إجابة الطالب لتعميق فهمه أو توجيهه نحو الصواب."],["السبر المشجع","أسئلة توجيهية بعد إجابة خاطئة أو ناقصة تقود الطالب إلى الإجابة الصحيحة دون إحراج."],["الإنصات النشط","استماع بانتباه مع إيماء وإعادة صياغة وعدم مقاطعة ليشعر الطالب أنه مسموع."],["التواصل غير اللفظي","لغة الجسد والنظرات والإيماءات ونبرة الصوت؛ يسبق اللفظي في التأثير."],["الاتصال متعدد الاتجاهات","نمط يتفاعل فيه جميع الطلاب مع بعضهم ومع المعلم بتوجيهه (التعلم التعاوني)."],["التغذية الراجعة","معلومات تُقدم للطالب عن أثر أدائه توجه سلوكه الحالي والمستقبلي؛ تراكم معرفي."],["نجمتان وأمنية","استراتيجية تغذية راجعة: نقطتا قوة ونقطة تحسين تُصاغ بصيغة أمنية."],["الاتصال اللفظي","اتصال بالكلمات منطوقة أو مكتوبة."],["اللغة التقاربية","توظيف المسافة والقرب المكاني من الطالب في التواصل."],["اللغة الموازية","نبرة الصوت وسرعته وتنغيمه كرسائل غير لفظية."],["التخطيط باللونين","تغذية راجعة بالتلوين: الوردي لما تحقق والأصفر لما يحتاج تحسيناً."]],"intro":[],"ex":[]},{"h":"قواعد اختيار البديل في مواقف المعيار التاسع","pts":["[[**الخطوة الأولى**|ar.l14.choose]] تعالج الموقف الحاضر مباشرة؛ والإجراء العام أو الوقائي أو التبليغ خطوات لاحقة.","عالج **السلوك لا الشخص**، على انفراد لا علناً، وعزز البديل المرغوب.","**بديلان مترادفان** = كلاهما خطأ؛ والبديل البديهي الذي لا يضيف شيئاً خطأ.","البيئة الإيجابية تبدأ **بالعلاقة** (تحية، أسماء، احترام) قبل الأدوات والعقوبات.","ولي الأمر: **استمع ← افهم ← اشرح ← اتفق**."],"t":[["الخطوة الأولى","الإجراء المباشر الذي يعالج الموقف الحاضر قبل أي إجراء عام أو وقائي أو تصعيدي."],["التصعيد","الانتقال من معالجة المعلم إلى المرشد ثم الإدارة وولي الأمر عند التكرار أو الخطر."],["البديل البديهي","خيار يفرضه النشاط أصلاً ولا يضيف شيئاً، فلا يكون الإجابة الصحيحة."],["البديل المتمركز حول المعلم","خيار يخدم راحة المعلم أو سير الدرس لا تعلم الطالب؛ غالباً مشتت."],["معالجة السلوك لا الشخص","وصف الفعل الخاطئ وعواقبه دون وصم الطالب بصفة (مشاغب، كسول)."]],"ex":["طالبة تسخر من إجابة زميلتها لأول مرة: الخطوة الأولى تنبيهها على انفراد بأن السخرية مرفوضة ولها عواقب إن تكررت، مع دعم المتضررة؛ أما إبلاغ الإدارة أو محاضرة الصف فخطوات لاحقة أو عامة."],"intro":[]},{"h":"9.2 (ب) القدوة وحدود العلاقة المهنية والتراجع عن الخطأ ودور المعلم في قواعد السلوك","pts":["مؤشر 9.2: [[**القدوة الحسنة**|ar.l14.ethics]]، وعلاقة ضمن **حدود مهنية**، والتراجع عن الخطأ وتصحيحه.","**حدود العلاقة المهنية**: ودّ عادل دون محاباة، ولا تواصل شخصي خارج القنوات المعتمدة، ولا إفشاء لأسرار الطلاب.","إن أخطأ المعلم أو أساء أمام الطلاب ← **يعترف ويعتذر** ويصحح؛ فذلك يبني الثقة.","يباشر المعلم **الإجراءات الثلاثة الأولى من مشكلات الدرجة الأولى** ثم يحيل للإدارة.","ممنوع: **نسخ الواجب عقاباً**، وإقصاء الطالب خارج الصف، والإيذاء والسخرية.","**المسميات الحالية**: الموجه الطلابي ولجنة التوجيه الطلابي (المرشد ولجنة التوجيه والإرشاد سابقاً)."],"t":[["القدوة الحسنة","اتساق قول المعلم وفعله بما يجعل سلوكه نموذجاً يحاكيه الطلاب."],["حدود العلاقة المهنية","علاقة عادلة محترمة مع الطلاب داخل القنوات المعتمدة دون محاباة أو خصوصية غير مهنية."],["التراجع عن الخطأ","اعتراف المعلم بخطئه وتصحيحه في أقرب وقت أمام من وصلهم."]],"intro":[],"ex":[]},{"h":"9.3 (ج) جاهزية مصادر التعلم والأمن والسلامة المادية","pts":["مؤشر 9.3: **جاهزية مصادر التعلم** وإتاحتها للجميع، وبيئة تحقق الأمن والسلامة.","افحص الأجهزة والروابط **قبل الحصة** وأعد خطة بديلة، ووفّر بدائل لضعيف البصر والسمع.","[[**الإخلاء**|ar.l14.safety]]: هدوء، وخروج منتظم **دون الحقائب**، ثم التحقق من العدد.","**المختبر**: نظارات وقفازات واقية، ومواد موسومة، وإشراف دائم، ومعرفة مكان طفاية الحريق.","عند الإصابة: **إيقاف الخطر** أولاً، ثم الإسعاف، ثم الإبلاغ والتوثيق.","معرفة **الحالات الصحية** (ربو، حساسية، سكري، صرع) والتنسيق مع الموجه الصحي.","محاولة إيذاء الذات: **عدم تركه بمفرده** والتبليغ فوراً (المادة 30 من قواعد 1447)."],"t":[["خطة الإخلاء","إجراءات مكتوبة ومُتدرَّب عليها لإخراج الطلاب بأمان عند الطوارئ إلى نقطة التجمع."],["نقطة التجمع","مكان آمن محدد يتجمع فيه الطلاب بعد الإخلاء للتحقق من عددهم."],["إتاحة الوصول","تمكين جميع الطلاب، بمن فيهم ذوو الإعاقة، من استخدام مصادر التعلم والمكان."]],"intro":[],"ex":[]}],"trap":["[[**التعزيز السالب**|ar.l14.reinf]] يزيد السلوك (إزالة منفّر)؛ **العقاب** بنوعيه يقلله. إلغاء إنذار بعد الالتزام = تعزيز سالب لا عقاب.","[[**تكلفة الاستجابة**|ar.l14.extinct]] = فقدان معزز مكتسب (درجات، نقاط)؛ **الإقصاء** = عزل مؤقت عن البيئة المعززة؛ كلاهما عقاب سالب.","**الانطفاء** = حجب التعزيز (تجاهل مقصود) فيتلاشى السلوك؛ **العقاب السالب** = سحب معزز موجود. التجاهل ليس عقاباً.","**التصحيح البسيط** = إزالة أثر الخطأ فقط؛ **التصحيح الزائد** = إزالة الأثر + أعمال إضافية (اعتذار وإحضار مقعد جديد).","[[**مبدأ بريماك**|ar.l14.premack]] = نشاط محبب يُشترط بإنهاء نشاط أقل حباً؛ **الاقتصاد الرمزي** = جمع رموز تُستبدل لاحقاً.","[[**التشكيل**|ar.l14.premack]] تدرج في الاستجابة (تعزيز التقريبات)؛ **السحب التدريجي** تدرج في المثير أو المساعدة؛ **التسلسل** تعزيز كل حلقة.","**النمذجة** = تعلم بملاحظة قرين؛ **التلقين** = تلميح لفظي أو إيمائي أو جسدي؛ **ضبط المثير** = تغيير المكان؛ **التحصين التدريجي** خطوة خطوة مقابل **الغمر** دفعة واحدة.","**التغذية الراجعة** تراكم معرفي متعلق بالأداء؛ **التعزيز** تراكم وجداني نتيجة للأداء. والتغذية الفاعلة فورية مستمرة لا متقطعة.","الود بلا ضوابط = **النمط الفوضوي** وليس الديمقراطي؛ الديمقراطي فيه حوار **وضوابط**.","**أول حادثة** ← يعالجها المعلم (تنبيه وعواقب)؛ **المتكرر أو الخطر** ← المرشد والإدارة؛ تبليغ الإدارة أول مرة بديل صحيح في توقيت خاطئ.","[[**التوقعات العالية**|ar.l14.expect]] ≠ التوقعات المثالية غير الواقعية؛ و**المقارنة بالأقران** تخفض الدافعية ولا ترفع التوقعات.","**ولي الأمر الغاضب**: الإنصات أولاً وإتاحة التعبير، لا شرح وجهة نظرك ولا مراجعة القوانين ولا رفع الدرجات لامتصاص غضبه."],"vid":[["-tjqnyMSAeU","تطبيقات المعيار التاسع من معايير الرخصة المهنية","سهام الزهراني",21],["Q3_IUAFZOvk","الإدارة الصفية — قائمة المعيار التاسع","سلوى البحيري · الرخصة المهنية تربوي عام",16],["LwyA4xg2zqE","التعزيز والعقاب في دورة الرخصة المهنية التربوي","منصة البراعة",9],["-MYCRoSFZOM","شرح المعيار التاسع: تهيئة بيئات تفاعلية داعمة للتعلم","سهام الزهراني",25]],"n":14},{"id":"L01","d":"V","std":"1","sub":"1.1، 1.2","ar":"القيم الإسلامية الوسطية والهوية الوطنية","goal":"تختار في كل موقف صفي التصرف الذي يجسّد الوسطية والقدوة والحياد، وتميّز تعزيز الهوية الوطنية بالشواهد والمشاركة عن الوعظ والمظاهر الشكلية.","sec":[{"h":"الوسطية والقدوة والحياد","pts":["[[الوسطية|ar.l01.wasat]] هي **الاعتدال** بين الغلو والتفريط في الأقوال والأحكام والتعامل، والمعلم يغرس الاعتدال والتسامح والتعايش.","المعلم **قدوة** داخل المدرسة وخارجها، و«المعلم القدوة» يعني حسن التعامل مع الطلاب؛ والرقيب بعد الله الضمير اليقظ.","القضايا [[**الخلافية**|ar.l01.neutral]]: حياد وإحالة إلى المصادر والجهات المختصة دون فرض الرأي، وهو نص في [[مدونة 1447|ar.l02.code1447]].","الطالب الجدلي يُعالَج بـ[[**الأدلة المنطقية والقدوة العملية**|ar.l01.dialogue]]، لا بإغلاق الحوار ولا بالإحالة إلى موقع إلكتروني.","القيم تُعلَّم بالمواقف لا بحصة وعظ: يتوقف المعلم عند الأذان ويردده مع طلابه (**نمذجة** للقيمة)."],"t":[["الوسطية","الاعتدال بين الغلو (الزيادة) والتفريط (التقصير) في الفكر والسلوك والحكم."],["الغلو","تجاوز الحد المشروع في الدين أو الرأي حتى يصل إلى التشدد والتطرف."],["التفريط","التهاون والتقصير في أداء الواجب أو الالتزام بالقيم."],["القدوة","أن يجسّد المعلم القيمة سلوكاً يُحتذى، وأثره أبقى من الكلام."],["الحياد المهني","امتناع المعلم عن فرض رأيه الشخصي في القضايا الخلافية داخل الصف."],["الرقابة الذاتية","التزام المعلم بالقيم بدافع ضميره لا بدافع المساءلة الخارجية."],["التسامح","قبول المخالف في الرأي والتعامل معه بالحسنى من غير تنازل عن الثوابت."]]},{"h":"تعزيز الهوية الوطنية","pts":["الهوية تُعزَّز بـ**الشواهد والإحصاءات والمنجزات** لا بالوعظ، وتبدأ بغرس مفهوم حب الوطن والمواطنة؛ والأعلام وسيلة لا غاية.","رموزها: العلم، النشيد، الشعار (السيفان والنخلة)، اللغة العربية، اليوم الوطني، يوم التأسيس، العملة.","المواطنة بسلّم [[**كراثول**|ar.l01.krathwohl]]: يصغي ← يشارك ← يقدّر ← ينظّم ← **تمثّل القيمة** (قدوة لأسرته).","[[**رؤية 2030**|ar.l01.identity]] في التعليم: جودة المخرجات، الشراكة المجتمعية، مواءمة التعليم مع سوق العمل، التعلم مدى الحياة.","النشاط التراثي لا يشمل **تحويل المباني التراثية إلى حديثة**؛ وشواهد جهود المملكة كخدمة الحرمين تنمي المواطنة الصالحة."],"t":[["الهوية الوطنية","شعور الفرد بالانتماء لوطنه وقيمه ورموزه وتاريخه والاعتزاز بها."],["المواطنة","علاقة حقوق وواجبات بين الفرد ووطنه تظهر في السلوك المسؤول والولاء."],["تمثّل القيمة","أعلى مستويات كراثول: تصبح القيمة جزءاً من شخصية الطالب يتصرف بها تلقائياً."],["رؤية 2030","خطة المملكة الاستراتيجية (2016) بمحاورها: مجتمع حيوي، ا
