 ماسلو في صورته الموسعة **سبعة** مستويات: فسيولوجية ← أمن ← انتماء ← تقدير ← **المعرفة** ← **الجمال** ← تحقيق الذات."],"src":"Deci & Ryan؛ Eccles & Wigfield؛ المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.3"},"ar.l10.iq":{"k":"الذكاء","t":["IQ & Intelligence Tests","نسبة الذكاء واختباراته"],"body":["**الذكاء** قدرة عقلية عامة على التعلم والتفكير المجرد والتكيف وحل المشكلات. **بينيه** وضع **أول اختبار ذكاء** (1905) ومفهوم **العمر العقلي**، و**نسبة الذكاء** (ستيرن/تيرمان) متوسطها 100 وانحرافها 15."],"pts":["**90–109** متوسط، **70–85** بطيء التعلم (حدّي)، **أقل من 70** إعاقة فكرية، **130 فأكثر** موهوب.","**ثابتة نسبياً**: طالب ذكاؤه 110 يبقى قريباً منها.","**جالتون** أكد **الوراثة** وابتكر **معامل الارتباط**؛ **وكسلر** مقاييس لفظية وأدائية؛ **ستانفورد بينيه** أول اختبار مقنن؛ **رافن** مصفوفات غير لفظية.","النتيجة **لا تُستخدم وحدها** للتصنيف، ولا تُعلن للطلاب.","**سبيرمان – العاملان**، **جاردنر – الذكاءات المتعددة**، **ستيرنبرغ – الثلاثي**، **جولمان – الذكاء الوجداني (العاطفي)**؛ و**ثيرستون – القدرات العقلية الأولية**؛ **جيلفورد – بنية العقل**؛ **كاتل**: ذكاء **سائل** و**متبلور**."],"src":"Binet & Simon (1905)؛ Terman, Stanford-Binet؛ Wechsler"},"ar.l10.goleman":{"k":"الذكاء","t":["Goleman — Emotional Intelligence","جولمان: الذكاء الوجداني"],"body":["دانيال جولمان رأى أن النجاح لا يتوقف على الذكاء المعرفي وحده، بل على **الذكاء الوجداني (العاطفي)**: فهم الانفعالات وإدارتها في النفس ومع الآخرين."],"pts":["**الوعي بالذات**: معرفة الفرد بانفعالاته.","**تنظيم الانفعالات**: التحكم فيها.","**الدافعية**: توجيه الانفعالات نحو الهدف.","**التعاطف**: فهم مشاعر الآخرين.","**المهارات الاجتماعية**: إدارة العلاقات."],"src":"Goleman, Emotional Intelligence (1995)"},"ar.l10.critical":{"k":"التفكير","t":["Critical, Reflective & Scientific Thinking","التفكير الناقد والتأملي والعلمي"],"body":["**التفكير الناقد**: فحص المعلومات والحجج و**تقويمها** بمعايير مع مراعاة وجهات نظر الآخرين؛ منطلقه **الشك المنهجي**."],"pts":["مهاراته (واطسون–جليسر): **الاستنتاج**، **التعرف على الافتراضات**، **الاستنباط**، **التفسير**، **تقويم الحجج**؛ ومنها **التمييز** بين الحقيقة والرأي والكشف عن **التحيز**.","أمثلة: تحليل وجهات نظر مختلفة، تقييم مواقع الإنترنت من حيث **دقة المعلومات ومصداقيتها**، تقديم **تفسيرات منطقية للنتائج**.","**التفكير التأملي** مراجعة الخبرة؛ و**حل المشكلات** (ديوي): الشعور بالمشكلة ← تحديدها ← فروض ← اختبار ← تعميم؛ و**اتخاذ القرار** مفاضلة بين بدائل.","**التفكير العلمي**: الإحساس بالمشكلة ← جمع البيانات ← الفروض ← اختبارها ← نتيجة قابلة للتحقق؛ و**الاستدلال** نتيجة من أدلة كافية.","تدريس التفكير **مباشر** (كورت) أو **مدمج** في المحتوى؛ مع أسئلة مفتوحة و**ينتظر 3–5 ثوانٍ**.","**KWL**: ماذا أعرف؟ ماذا أريد أن أعرف؟ ماذا تعلمت؟ تنمي **ما وراء المعرفة**؛ والدنيا في بلوم: التذكر والفهم والتطبيق."],"src":"Watson & Glaser؛ Dewey, How We Think؛ المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.3"},"ar.l10.creatools":{"k":"الإبداع","t":["Fluency, Flexibility & Idea Tools","أنواع الطلاقة والمرونة وأدوات التوليد"],"pts":["أنواع الطلاقة: **لفظية** (كلمات بحرف معين)، **فكرية/معاني** (حلول كثيرة)، **أشكال**، **تداعي** (كلمات بمعنى واحد).","**المرونة التكيفية** تغيير الوجهة بحسب الموقف، و**المرونة التلقائية** أفكار متنوعة من تلقاء النفس.","**الإثارة العشوائية**: علاقة بين مفهومين لا رابط بينهما («ما العلاقة بين المفتاح والمدير؟»)؛ و**التفكير الجانبي** (ديبونو) خروج من الأنماط المعتادة.","تنمية الإبداع: **أسئلة مفتوحة** («ماذا لو…»، نهاية جديدة لقصة)، **سكامبر**، الرحلة التخيلية، قبول غير المألوف.","**الكلمات المترابطة**: استراتيجية للتفكير الناقد يميز فيها الطالب المترابط من غير المترابط.","القاعدة الخاطئة في العصف: **فحص الأفكار ونقدها قبل طرحها**؛ و**إرجاء الحكم** و**الكم قبل الكيف** هما الصواب."],"ex":["«اذكر أكبر عدد من استخدامات القلم» = **طلاقة**؛ تنوعت الفئات = **مرونة**؛ إجابة لم يذكرها أحد = **أصالة**؛ شرح التفاصيل والرسم = **الإفاضة/التوسع**."],"src":"Guilford؛ Torrance؛ Osborn؛ de Bono"},"ar.l10.progs":{"k":"برامج التفكير","t":["Herrmann, 4MAT & Thinking Strategies","هيرمان ومكارثي واستراتيجيات التفكير"],"pts":["**هيرمان – السيطرة الدماغية**: **A** تحليلي منطقي، **B** منظم تخطيطي، **C** عاطفي اجتماعي، **D** تخيّلي كلي.","**مكارثي (4MAT)**: لماذا، ماذا، كيف، ماذا لو؛ و**كولب** دورة التعلم الخبراتي.","**التفكير التقاربي** إجابة واحدة، و**التباعدي** إجابات متعددة؛ والاختبارات الموضوعية تقيس التقاربي غالباً.","**برنامج كورت** ست وحدات: توسعة الإدراك، التنظيم، التفاعل، الإبداع، المعلومات والعواطف، الفعل؛ وأداته **PMI**.","استراتيجيات: الخرائط الذهنية (بوزان) والمفاهيمية (نوفاك)، الاستقصاء، المناظرة، لعب الأدوار، **الأسئلة السابرة**، حل المشكلات الإبداعي."],"src":"Herrmann, The Creative Brain؛ McCarthy, 4MAT؛ de Bono, CoRT"},"ar.l10.habits":{"k":"عادات العقل","t":["Costa & Kallick — Habits of Mind","عادات العقل"],"body":["مؤشرا 5.3 للممارس: **يبين عمليات بناء المتعلم للمعاني واكتساب مهارات التفكير الإبداعي والناقد والعادات العقلية**، و**يبين تأثير الاتجاهات والقيم لدى المتعلمين على تعلمهم وكيفية استخدامها لدعمه**."],"pts":["عادات العقل نمط من السلوكيات الذكية عند مشكلة **لا يعرف حلها فوراً**؛ فهي **ميل** لاستخدام المهارة.","الست عشرة: المثابرة، **التحكم بالتهور**، الإصغاء بتفهم وتعاطف، التفكير بمرونة، **التفكير حول التفكير**، **الكفاح من أجل الدقة**، التساؤل، تطبيق المعارف الماضية، التوصيل بوضوح، جمع البيانات بالحواس، الابتكار، الدهشة، المخاطرة المسؤولة، الدعابة، التفكير التبادلي، التعلم المستمر.","تمييز: لا يستسلم = **المثابرة**؛ يراجع حله = **الكفاح من أجل الدقة**؛ يقرأ السؤال كاملاً = **التحكم بالتهور**؛ يعيد صياغة كلام زميله = **الإصغاء بتفهم**؛ يصف كيف وصل = **التفكير حول التفكير**.","تنميتها: **تسميتها**، و**النمذجة**، ومشكلات مفتوحة، و**تعزيز** ظهورها، والتأمل الذاتي."],"src":"Costa & Kallick, Habits of Mind"},"ar.l10.attitude":{"k":"الاتجاهات والقيم","t":["Attitudes & Values","الاتجاهات والقيم والتعلم"],"body":["**الاتجاه** استعداد مكتسب ثابت نسبياً للاستجابة بالقبول أو الرفض نحو موضوع، ومكوناته **معرفي** (معتقدات) و**وجداني** (مشاعر) و**سلوكي** (ميل للفعل)."],"pts":["الاتجاه **الإيجابي** يرفع الانتباه والمثابرة، و**السلبي** يخفض الجهد ويصير نبوءة تحقق ذاتها.","تعديله: **خبرات نجاح** مبكرة، ربط المادة **بحياة الطالب وقيمه**، **القدوة**، بيئة لا تسخر من الخطأ، التعزيز، الحوار؛ لا الوعظ وحده ولا الإجبار.","**القيم** معايير يحكم بها المتعلم؛ وإذا رأى المحتوى **يتصل بقيمه** (الإتقان، خدمة المجتمع، الأمانة العلمية) زاد اندماجه."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.3"},"ar.l11.other":{"k":"مداخل التدريس","t":["Teaching Models, Roles & Other Approaches","عائلات النماذج وأدوار المعلم ومداخل أخرى"],"body":["**نموذج التدريس** تصور نظري لخطوات التدريس تُشتق منه استراتيجيات، و**مهارة التدريس** أداء جزئي محدد كالتهيئة أو طرح الأسئلة أو الغلق."],"pts":["عائلات **جويس وويل**: **معالجة المعلومات** (الاستقراء، المنظم المتقدم، الاستقصاء، تكوين المفاهيم)، و**الاجتماعية** (التعاوني، لعب الأدوار، التقصي الجماعي).","و**السلوكية** (التعليم المبرمج، التعلم للإتقان، التعليم المباشر)، و**الشخصية** (التدريس غير الموجه).","أدوار المعلم: **المرشد** يوجه المتعلم، **الميسّر** يهيئ الظروف ويدعم عند الحاجة، **المفوّض** يفوض الطلاب مسؤولية تعلمهم ويراقب، **التقليدي** ملقن ناقل للمعلومة.","**المدخل المنطقي** يرتب المحتوى من البسيط إلى المعقد ومن القديم إلى الحديث (ومن المحسوس إلى المجرد)، و**المدخل السيكولوجي** وفق ميول المتعلم وحاجاته.","مداخل أخرى: **التاريخي** (تطور الفكر عبر العصور)، **النشاط** (ديوي)، **الضبط** (التحكم في السلوك)، **التكنولوجي**، **التكاملي** (ربط المادة بغيرها)، **البيئي**، **الديني**.","في المدخل المعرفي: **مدخل المادة الدراسية** يهتم بالمحتوى والكتاب المدرسي، و**مدخل بنية العلم** بمفاهيم العلم الكبرى وطرق بحثه."],"traps":["التدريس غير الموجه من العائلة **الشخصية**، والتعاوني من **الاجتماعية**."]},"ar.l11.lecture":{"k":"طرق العرض","t":["Lecture, Discussion & Dialogue","المحاضرة والمناقشة والحوار والقصة"],"body":["طرق يكون فيها المعلم أو المتحدث مصدر الخبرة الأساسي، وتختلف في قدر مشاركة الطالب."],"pts":["**المحاضرة (الإلقاء)**: اقتصادية في الوقت وتناسب الأعداد الكبيرة والمعلومات الكثيرة، لكن المتعلم فيها **متلقٍّ سلبي** وتهمل الفروق الفردية.","**المناقشة**: حوار موجه بين المعلم والطلاب أو بين الطلاب؛ مراحلها تهيئة ← مناقشة ← تقويم، وأبرز عيوبها **سيطرة بعض الطلاب**.","**الحوار السقراطي**: يقود المعلم الطالب بأسئلة متتابعة حتى يكتشف التناقض في رأيه ويصل إلى الصواب بنفسه.","**الندوة**: عدد من المتخصصين يعرضون جوانب موضوع واحد ثم يُفتح النقاش؛ و**المناظرة**: مجموعة مؤيدة وأخرى معارضة بمحكّمين.","**القصة**: تناسب المرحلة الابتدائية ومواد التاريخ والتربية الإسلامية، وتقدم القيم بأقل تجريد وتنمي الخيال."],"traps":["الندوة **متخصصون** يعرضون جوانب موضوع، والمناظرة **مؤيد ومعارض**."]},"ar.l11.demo":{"k":"طرق العرض","t":["Demonstration","العرض العملي (البيان)"],"body":["طريقة مباشرة يؤدي فيها المعلم المهارة أمام الطلاب خطوة خطوة مع **الشرح المتزامن** ثم يطبقونها؛ وتناسب المهارات الأدائية كالوضوء والتجارب، وهي الاختيار الأنسب للتجارب **الخطرة أو المكلفة** أو التي لا تتوفر أدواتها للجميع."],"pts":["الخطوات: **تجريب العرض مسبقاً** ← توضيح هدفه وما سيُلاحظ ← ترتيب المكان بحيث **يرى الجميع**.","ثم الأداء **خطوة خطوة ببطء** مع الشرح والأسئلة ← التأكيد على **قواعد السلامة** ← تطبيق الطلاب تحت الإشراف ← تلخيص وتغذية راجعة.","قصوره: الطالب **مشاهد** إن لم يُشرك، وقد لا يرى البعيدون التفاصيل.","العلاج: إشراك الطلاب في التوقع والملاحظة والتسجيل، والعرض المكبر.","مؤشر 7.2 يطلب **اختيار ما يتوافق منها مع متطلبات المنهج وخصائص نمو المتعلمين**."],"traps":["العرض العملي طريقة **مباشرة**، والتغيير المفاهيمي **بنائي**."]},"ar.l11.self":{"k":"التعلم الذاتي","t":["Self-directed & Individualized Learning","التعلم الذاتي وأدواته"],"body":["التعلم الذاتي يتحمل فيه المتعلم مسؤولية تعلمه بأنشطة ومصادر معدّة، والمعلم موجّه ومصمم؛ وهو مع التعليم المبرمج الطريقة التي تتيح لكل طالب التعلم **حسب سرعته وقدرته**."],"pts":["**الحقيبة التعليمية**: وحدة متكاملة متعددة الوسائط فيها أهداف واختبار قبلي وأنشطة بدائل واختبار بعدي.","**الموديول (الوحدة النسقية)**: وحدة صغيرة مستقلة من برنامج أكبر يدرسها الطالب ذاتياً ويُقوَّم بعدها.","**التعلم الذاتي** برغبة المتعلم لتنمية مهاراته، و**التعليم الفردي** مخطط يؤدي فيه كل طالب المهام نفسها منفرداً، و**التعليم التفريدي** مهام مختلفة وفق الميول.","أهداف **التعليم الفردي**: مراعاة الفروق، والتعلم للإتقان، والتعلم الموجه، وتنمية الاستقلالية والإبداع؛ ومن **وسائل التعلم الذاتي**: المبرمج، والحقائب والموديولات، والحاسوب، وعقود التعلم.","**التعلم الموصوف للفرد**: برنامج علاجي يُصمم لطالب بعينه بعد تشخيص مستواه.","**البرمجيات التعليمية**: تعليمية (تقديم مفهوم)، و**تدريب وممارسة**، و**محاكاة** (التجارب الخطرة)، و**ألعاب تعليمية**، وحل مشكلات، واستقصاء."],"traps":["الفردي **المهام نفسها**، والتفريدي **مهام مختلفة**."]},"ar.l11.social":{"k":"الاستراتيجيات الاجتماعية","t":["Brainstorming, Peers & Other Social Strategies","العصف الذهني والأقران واستراتيجيات اجتماعية أخرى"],"body":["العصف الذهني (أوزبورن) قواعده الأربع: إرجاء الحكم والنقد، وحرية التفكير، و**الكم قبل الكيف**، والبناء على أفكار الآخرين. ولاستمرار التجاوب يسأل المعلم «هل هناك فكرة أخرى؟» لا «هل هناك فكرة أفضل؟» لأنها حكم."],"pts":["رواد التعلم التعاوني: ديوي و**باركر** و**دويتش** وجونسون وجونسون؛ ومراحله: **التعرف** ← تحديد المهمة ← **الإنتاجية** ← **الإنهاء**.","**بيئات التعلم**: **تنافسية** (فوز طالب يعني خسارة آخر)، و**فردية** (كل طالب مستقل)، و**تعاونية** (نجاح المجموعة معاً).","أنواع **تدريس الأقران**: داخل الفصل، وعبر الصفوف (أعلى يعلّم أدنى)، وأقران المجموعة، وخارج الفصل للمنقطعين؛ والقرين المعلّم يرسخ فهمه.","**الكرسي الساخن**: أسئلة تُطرح على طالب معين لتنمية بناء الأسئلة وتبادل الأفكار؛ و**المائدة المستديرة**: إجابات بالتناوب داخل المجموعة.","**الألعاب التعليمية** نشاط موجه يتنافس فيه الطلاب بمتعة لتحقيق هدف الدرس؛ و**اللعب الموجه** يحدده المعلم و**غير الموجه** حر.","**التدريس التبادلي** حوار حول نص مقروء: **التنبؤ** ← **توليد الأسئلة** ← **التوضيح** ← **التلخيص**، وينمي ما وراء المعرفة."],"traps":["«هل هناك فكرة أفضل؟» تخالف قاعدة **إرجاء الحكم**."]},"ar.l11.dale":{"k":"الوسائل والخبرة","t":["Cone of Experience — Edgar Dale","مخروط الخبرة (إدجار ديل)"],"body":["رتّب إدجار ديل الخبرات التعليمية من الأكثر حسية في القاعدة إلى الأكثر تجريداً في القمة؛ كلما نزلنا زادت الحسية وقلّ التجريد، والعكس صحيح."],"pts":["1) **الخبرات المباشرة الهادفة** (يعمل الطالب بنفسه: زراعة، تجربة حقيقية) 2) **الخبرات المعدلة** (النماذج والمجسمات والعينات) 3) **الخبرات الممثلة** (الدراما ولعب الأدوار).","4) التوضيحات العملية 5) الرحلات الميدانية 6) المعارض 7) التلفاز والأفلام 8) الصور الثابتة والتسجيلات.","9) **الرموز البصرية** (الخرائط والرسوم البيانية) 10) **الرموز اللفظية** (الكلمات المسموعة والمقروءة) وهي الأكثر تجريداً.","المجسم الذي يحاكي جسم الإنسان خبرة **معدلة (شبه محسوسة)**، و**المحاكاة** خبرة بديلة للتجارب الخطرة أو المكلفة أو المستحيلة."],"traps":["قمة المخروط **الرموز اللفظية** لا البصرية.","الأصغر سناً يحتاج **قاعدة** المخروط أكثر."]},"ar.l12.levels":{"k":"الأهداف","t":["Levels of Objectives","مستويات الأهداف ومصادرها"],"body":["تتدرج الأهداف من العام البعيد إلى الخاص القريب: **الغايات** تعبر عن فلسفة المجتمع وبعيدة المدى، و**الأهداف العامة** لمرحلة أو مقرر، و**الأهداف الخاصة/السلوكية** لدرس واحد وقابلة للملاحظة."],"pts":["تُشتق الأهداف التربوية العامة من **فلسفة المجتمع** وحاجاته، وطبيعة المتعلم، وطبيعة المعرفة، ونتائج البحوث.","**الهدف السلوكي** عبارة تصف **سلوك المتعلم** المتوقع بعد التعلم، قابلاً للملاحظة والقياس.","شروطه: سلوك **المتعلم** لا المعلم، **ناتج تعلم واحد**، فعل **قابل للملاحظة**، يصف **الناتج** لا النشاط، واضح غير غامض.","أهداف قابلة للقياس: «أن يفسر الطالب الرموز على الخريطة»، «أن يؤدي الطالب الوضوء بصورة صحيحة»."],"ex":["الهدف العام «تدريب التلاميذ على أداء العبادات» يُشتق منه الهدف الخاص «أن يؤدي الطالب الوضوء بصورة صحيحة»."],"traps":["«يوضح المعلم مفهوم…» خطأ لأنه سلوك **المعلم**."]},"ar.l12.plan":{"k":"خطة الدرس","t":["Planning Levels & Lesson Plan","التخطيط ومستوياته وعناصر خطة الدرس"],"body":["التخطيط **طويل المدى** هو الخطة السنوية والفصلية (توزيع المقرر على الأسابيع)، و**قصير المدى** خطة الوحدة والخطة اليومية. ويشمل **التخطيط للوحدة** تحليل محتواها وترتيب خبراتها وأنشطتها وتوزيعها زمنياً على عدة حصص."],"pts":["أهميته: يوجه التنفيذ، ويضمن تحقيق الأهداف، ويحدد الزمن والوسائل، ويجنب العشوائية؛ وهو أساس **إدارة وقت الحصة**.","عناصر الخطة اليومية: الموضوع، **الأهداف**، المتطلبات السابقة، **التهيئة**، المحتوى والإجراءات، الاستراتيجيات، الوسائل، الأنشطة، **التقويم**، الغلق، الواجب، الزمن.","**الغلق** خطوة ختامية لتلخيص الأفكار الرئيسة وربطها وتثبيتها.","المهارات المعقدة تُخطط للتدرب عليها **مجزأة** ثم تُجمع، والتخطيط يراعي **الفروق الفردية** ومستوى التجريد لدى الطلاب."],"traps":["توزيع المقرر السنوي ليس من عناصر الخطة **اليومية**.","عند ضيق الوقت لا تُحوَّل الأنشطة كلها **واجبات**."]},"ar.l12.content":{"k":"التخطيط","t":["Content Analysis & Knowledge Pyramid","تحليل المحتوى وهرم المعرفة"],"body":["**تحليل المحتوى** تفكيك المادة إلى **حقائق ومفاهيم وتعميمات (مبادئ) ومهارات وقيم واتجاهات**؛ ويأتي بعد تحديد الأهداف وقبل اختيار الأنشطة."],"pts":["«الماء يغلي عند 100 درجة» **حقيقة**؛ «الضغط» **مفهوم**؛ «كلما زاد الضغط ارتفعت درجة الغليان» **تعميم**.","**هرم المعرفة**: الحقائق في القاعدة ← المفاهيم ← التعميمات (المبادئ) ← القوانين ← النظريات في القمة.","الانتقال من قاعدة الهرم إلى قمته **استقراء**، ومن الجزء إلى الكل."],"traps":["العلاقة بين مفهومين («كلما… ارتفع…») **تعميم** لا مفهوم."]},"ar.l12.homework":{"k":"التخطيط","t":["Homework","الواجبات المنزلية"],"body":["الواجب امتداد للدرس لا عقوبة: يرتبط بأهدافه، ويكون مناسب الكم، بتوجيهات واضحة، ويُصحح ويُعاد **بتغذية راجعة**."],"pts":["بعد جمع الواجبات: الإجراء الأنسب **الاطلاع عليها وتقديم تغذية راجعة**، لا رصد درجة فقط ولا تخزينها.","لا يُستخدم الواجب **عقاباً**."],"traps":["رصد الدرجة دون تعليق **لا يكفي**."]},"ar.l12.align":{"k":"المعايير ونواتج التعلم","t":["Standards, Outcomes & Alignment","معايير المنهج ونواتج التعلم والمحاذاة"],"body":["في الإطار الوطني لمعايير مناهج التعليم العام: **معايير المحتوى** وصف عام لما ينبغي أن يتعلمه المتعلم في كل مجال تعلم، و**معايير الأداء** تمثل **نواتج التعلم المتوقعة** في نهاية كل صف أو مستوى، أي ما يعرفه المتعلم ويفهمه ويستطيع أداءه."],"pts":["**نواتج التعلم** (لائحة تقويم الطالب 2025): ما يكتسبه الطالب من معارف ومهارات وقيم نتيجة مروره بخبرة تعليمية خلال دراسته مقرراً ما.","بنية المعايير: **البنية التخصصية** للمجال (البعد الرئيس)، ويدعمها **بعد المهارات** و**بعد القيم**.","مؤشر 10.1: يشتق من معايير المناهج أهداف تعلم وفق التصنيف المناسب والأبعاد المشتركة.","**التصميم العكسي** (ويغنز وماكتاي) يبدأ **بالنتائج المرغوبة** ← ثم **أدلة التقويم** ← ثم **خبرات التعلم**؛ عكس البدء بصفحات الكتاب.","التسلسل المنطقي يراعي **المتطلبات السابقة**، ومن البسيط إلى المركب، ومن المحسوس إلى المجرد، وبنية المادة؛ فلا يُقدَّم ناتج يعتمد على مهارة لم تُدرَّس."],"traps":["المحاذاة: الهدف والنشاط والتقويم تقيس **الشيء نفسه وبالمستوى المعرفي نفسه**."]},"ar.l12.resources":{"k":"مصادر التعلم","t":["Selecting Learning Resources","شروط اختيار مصادر التعلم الرقمية وغير الرقمية"],"body":["مؤشر 8.1 للممارس: **يضمّن خطة الدرس مجموعة متنوعة من أدوات ومصادر التعلم الرقمية وغير الرقمية تحقق شروط اختيار المصادر التعليمية**."],"pts":["الشروط: **الارتباط بالهدف** أولاً ← **المناسبة لخصائص المتعلمين** ← **الدقة العلمية والحداثة** ← **الوضوح وجودة الإخراج** ← **التوافق مع القيم والثقافة**.","ثم **الأمان** ← **تكلفة ووقت وجهد** يتناسب مع ما يحققه ← **الإتاحة وسهولة الوصول للجميع** بمن فيهم ذوو الإعاقة ← **احترام الملكية الفكرية**.","المصدر الرقمي يُقوَّم أيضاً بموثوقية الجهة الناشرة، وتاريخ التحديث، وخلوه من الإعلانات والمحتوى غير المناسب، وعمله على أجهزة المدرسة وشبكتها.","**يجرب المعلم المصدر قبل الحصة**، ويعد **بديلاً** عند تعطل التقنية.","**التنوع** (مطبوع، مجسم، فيديو، محاكاة، منصة رقمية، بيئة محلية) يراعي أنماط المتعلمين، دون تكديس مصادر كثيرة تشتت الانتباه."],"traps":["المعيار تحقيق الهدف بأقل جهد وكلفة، لا **الأحدث أو الأغلى**."]},"ar.l13.active":{"k":"التعلم النشط","t":["Interactive Classroom Strategies","استراتيجيات صفية تفاعلية"],"body":["مبادئ التعلم النشط: مشاركة فاعلة، وربط بالواقع، وتعاون، وتفكير عليا، وتغذية راجعة، ومراعاة الفروق، وتحمل الطالب مسؤولية تعلمه. وهذه استراتيجيات قصيرة تطبقها."],"pts":["**مراكز التعلم**: محطات في الصف أو الصالة تمر عليها المجموعات بالتناوب، والمعلم فيها **الميسّر** الذي يقدم الدعم عند الحاجة.","**الرؤوس المرقمة**: يُرقَّم أعضاء كل مجموعة ويُستدعى رقم عشوائي ليجيب عنها فيستعد الجميع؛ و**الأعواد** (أعواد الآيسكريم) سحب اسم طالب عشوائياً.","**حوض السمك**: دائرة داخلية تناقش (المشاركون) وخارجية تراقب وتدوّن (الملاحظون) ثم تتبادلان.","**نموذج فراير**: بطاقة رباعية للمفهوم (التعريف، الخصائص، أمثلة، لا أمثلة)؛ و**RAFT (رافت)**: كتابة يحدد فيها الطالب **الدور** و**الجمهور** و**الصيغة** و**الموضوع**.","**الكرسي الساخن**: أسئلة لطالب معين لتنمية بناء الأسئلة؛ و**شبكة الأسئلة**: جمع أسئلة الطلاب نهاية الحصة ومناقشتها لتصحيح المفاهيم البديلة."],"traps":["في الرؤوس المرقمة يجيب رقم **عشوائي** عن المجموعة، فيلتزم الجميع بالاستعداد."]},"ar.l13.models":{"k":"النماذج البنائية","t":["Constructivist & Metacognitive Models","نماذج بنائية وما وراء معرفية"],"body":["نماذج تشترك في أن الطالب يبني المعنى بنفسه أو مع زملائه، وكثير منها ينمي **ما وراء المعرفة**: وعي الطالب بتفكيره."],"pts":["**جدول التعلم KWL** ينشط المعرفة السابقة وينمي التفكير **ما وراء المعرفي**؛ و**التساؤل الذاتي**: ماذا أعرف؟ ما الذي لا أعرفه؟ كيف أتابع؟","**التعلم المنظم ذاتياً**: الطالب يخطط ويراقب ويقوّم تعلمه؛ وطلب وصف العمليات والصعوبات نهاية الدرس ينمي **التأمل والتوجيه الذاتي**.","**تنال القمر**: فهم قرائي بخمس خطوات: التنبؤ ← التنظيم ← البحث ← التلخيص ← المقارنة (تشبه التدريس التبادلي).","**التعليم التوليدي**: بنائي اجتماعي بأربعة أطوار: التمهيدي ← التركيزي ← **التحدي** ← التطبيق.","**نموذج التعلم البنائي الاجتماعي**: تمهيد ← اكتشاف ثنائي ← أنشطة تعاونية ← إتاحة الفرص ← **تقويم ذاتي**؛ يبدأ ثنائياً وينتهي فردياً بخلاف فكر‑زاوج‑شارك.","**نموذج بوسنر للتغير المفاهيمي** يعالج **التصورات البديلة (الخاطئة)**، والتغير نوعان: **تطوري** للخطأ البسيط، و**ثوري** حين يُستبدل المفهوم كله."],"traps":["فكر‑زاوج‑شارك يبدأ **فردياً**، والبنائي الاجتماعي يبدأ **ثنائياً**."]},"ar.l13.maps":{"k":"الخرائط","t":["Concept Maps vs Mind Maps","خريطة المفاهيم والخريطة الذهنية وأشكال فن"],"body":["**خريطة المفاهيم** (نوفاك) **هرمية** من العام في **القمة** إلى الخاص، مع **كلمات ربط** على الأسهم تكوّن جملاً ذات معنى، وتستند إلى نظرية **أوزوبل** في التعلم ذي المعنى. و**الخريطة الذهنية** (بوزان) فكرة مركزية وفروع شعاعية بألوان وصور تشبه الخلية العصبية."],"pts":["الذهنية: كلمات الربط لا تُشترط غالباً، وأساسها التفكير البصري والتذكر، وأنسب استخدام لها العصف والتلخيص.","المفاهيم: أنسب استخدام لها كشف العلاقات وتقويم الفهم.","**أشكال فن**: للمقارنة بين مفهومين؛ أوجه الشبه في التقاطع والاختلاف في الجانبين."],"traps":["الهرمية وكلمات الربط = **خريطة مفاهيم** (نوفاك)؛ الفروع الشعاعية الملونة = **ذهنية** (بوزان)."]},"ar.l13.platforms":{"k":"التقنية في التعليم","t":["Ministry Platforms","منصات الوزارة وأنظمة إدارة التعلم"],"body":["**نظام إدارة التعلم** منصة بدروس مسجلة وواجبات وتواصل يدخلها الطالب بحساب وكلمة مرور. ولكل منصة رسمية وظيفة تميزها في الأسئلة."],"pts":["**مدرستي**: المنصة الرسمية للتعليم الإلكتروني منذ 1442هـ؛ فصول افتراضية عبر تيمز، وواجبات واختبارات إلكترونية، وإثراءات.","**عين**: بوابة التعليم الوطنية بدروس ومحتوى رقمي للمناهج وقنوات عين الفضائية.","**نور**: نظام الإدارة التربوية للدرجات والغياب والشهادات وأولياء الأمور.","**روافد**: مستودع المصادر الرقمية؛ و**منظومة التعليم الموحد**: منصة التعلم عن بعد التي سبقت مدرستي."],"traps":["الدرجات والغياب في **نور**، والفصول الافتراضية في **مدرستي**."]},"ar.l13.mayer":{"k":"الوسائط المتعددة","t":["Mayer's Multimedia Principles","مبادئ ماير للوسائط المتعددة"],"body":["مبادئ لتصميم العروض والفيديو التعليمي تخفف العبء على ذاكرة المتعلم."],"pts":["التقارب **المكاني** (النص قرب الصورة) و**الزماني** (الصوت مع الصورة في الوقت نفسه).","**الاتساق**: حذف المشتتات والزخارف غير اللازمة.","**الصيغة**: تعليق صوتي مع الرسوم أفضل من نص مكتوب.","**التكرار الزائد**: لا يُعرض نص مكتوب مطابق للصوت نفسه.","**التجزئة**: تقسيم العرض إلى أجزاء يتحكم المتعلم في تتابعها؛ و**الشخصنة**: أسلوب حواري قريب."],"traps":["قراءة الشرائح نصاً بالصوت نفسه تخالف مبدأ **التكرار الزائد**."]},"ar.l13.design":{"k":"التقنية في التعليم","t":["Instructional Design & Learning Resources","التصميم التعليمي وتقنيات التعليم ومصادر التعلم"],"body":["**التصميم التعليمي** مدخل منظم لتخطيط التعليم وتطويره وتقويمه، وأشهر نماذجه **ADDIE**: تحليل ← تصميم ← تطوير ← تنفيذ ← تقويم."],"pts":["**تقنيات التعليم**: منظومة متكاملة من الإنسان والأجهزة والطرق لتحقيق الأهداف.","**مصادر التعلم**: كل ما يتفاعل معه المتعلم من أنظمة وقنوات وموارد بشرية وغير بشرية لاكتساب الخبرة.","**التعلم المتنقل**: عبر **الأجهزة المحمولة** دون قيد مكان أو زمان."],"traps":["ADDIE يبدأ **بالتحليل** وينتهي **بالتقويم**."]},"ar.l13.tools":{"k":"التقنية في التعليم","t":["Web Tools, Apps & Digital Citizenship","أدوات الويب والتطبيقات والمواطنة الرقمية"],"body":["التقنية تُقاس بما تضيفه إلى التعلم لا بحداثتها. ومن مميزات الحاسب في التعليم: السرعة الذاتية، والاعتماد على النفس، والجمع بين الترفيه والتعليم."],"pts":["**الرحلات المعرفية (ويب كويست)**: بحث جماعي في **مصادر يحددها المعلم مسبقاً**؛ بنيتها مقدمة، مهمة، عملية، مصادر، تقويم، خاتمة.","**الحوسبة السحابية**: تخزين الملفات والتطبيقات على الإنترنت والوصول إليها من أي جهاز (قوقل درايف، ون درايف، دروب بوكس)؛ تناسب **دمج ملفات** ومستندات مشتركة.","**المدونة** للنشر والتعليق، و**الويكي** يحررها عدة مستخدمين، و**البودكاست** صوتي، و**الفيديو التفاعلي** للتعلم الفردي، و**الواقع المعزز** يضيف عناصر رقمية إلى الواقع.","**إكسل** للجداول والرسوم والإحصاء البسيط و**SPSS** للتحليل الإحصائي، و**أكسس** لقواعد البيانات، و**كانفا** للتصميم، و**بوبلت** للخرائط المعرفية، و**كاهوت** للألعاب التفاعلية.","**المواطنة الرقمية** (**الثقافة الرقمية**): قواعد توجه نحو منافع التقنية والحماية من أخطارها، والاستخدام الآمن والأخلاقي وتقويم مصداقية المصادر.","معايير **ISTE** دولية لتوظيف التقنية (للطلاب والمعلمين والقادة)، و**الذكاء الاصطناعي** للتعلم التكيفي والتغذية الراجعة الآلية مع تحقق المعلم من دقته."],"traps":["الويب كويست مصادره **محددة مسبقاً** لا بحث حر."]},"ar.l13.currorg":{"k":"المنهج","t":["Curriculum Organization & Design Models","تنظيمات المنهج ونماذج بنائه"],"body":["**المنهج بمفهومه التقليدي** المقرر والكتاب وحفظ المعلومات وإهمال الفروق، و**بمفهومه الحديث** جميع الخبرات التي تهيئها المدرسة داخلها وخارجها وتراعي المتعلم. و**المقرر** موضوعات مادة معينة، و**الكتاب المدرسي** وعاء المحتوى والوسائل والأنشطة، و**المحتوى** المعارف والمفاهيم والمهارات والقيم."],"pts":["التنظيمات: **المواد المنفصلة**، **المترابطة** (تنسيق بين مادتين مع بقائهما)، **المندمجة** (الاجتماعيات)، **المجالات الواسعة** (العلوم العامة)، **المحوري** (محور مشترك ومواد اختيارية).","و**النشاط** (ديوي: ميول الطلاب وحل المشكلات)، و**الوحدات**، و**الحلزوني** (برونر: المفاهيم تعود بتعمق)، و**المنهج التكنولوجي** (تقنية تنظم الخبرات ويعتمد على **الخطو الذاتي**).","**التنظيم المنطقي**: من البسيط (السهل) إلى المعقد، ومن القديم إلى الحديث، ومن المحسوس إلى المجرد؛ و**التنظيم السيكولوجي**: وفق خصائص المتعلم وحاجاته وميوله.","**نموذج تايلر** (1949) أربعة أسئلة: ما الأهداف؟ ما الخبرات؟ كيف تُنظم؟ كيف نقوّم؟ وهو أيضاً صاحب نموذج **تقويم المنهج**.","**نموذج تابا** استقرائي يبدأ **من المعلم**: تشخيص حاجات الطلاب ← صياغة الأهداف ← اختيار المحتوى وتنظيمه ← الخبرات ← التقويم.","**المنهج كنظام**: **مدخلات** (أهداف ومحتوى) ← **عمليات** (طرق وأنشطة ووسائل) ← **مخرجات** (نواتج التعلم) ← **تغذية راجعة** (تقويم)."],"traps":["تايلر يبدأ **بالأهداف**، وتابا **من المعلم** بتشخيص الحاجات."]},"ar.l14.styles":{"k":"إدارة الصف","t":["Management Styles, Rules & Time","أنماط الإدارة والقواعد الصفية وإدارة الوقت"],"body":["إدارة الصف الفعالة تهيئ الفرص للطلاب ليصبحوا **متعلمين مدى الحياة** في تعلم تعاوني يسوده **الاحترام والتشجيع**. والنمط **الديمقراطي** (حوار، مشاركة، أمن نفسي، انضباط ذاتي) هو الأنسب، و**التسلطي** يولد الخوف والطاعة التامة والاتكالية والدافعية الخارجية، و**الفوضوي/المتساهل** ضعف شخصية بلا ضوابط وضياع للوقت."],"pts":["**القواعد الصفية**: قليلة (3–5)، واضحة، إيجابية الصياغة، توضع **مع الطلاب في بداية العام**، تُراجع عند الحاجة، و**متسقة مع قواعد الانضباط التي أقرتها الوزارة**.","**اشرح للطلاب فوائدها** واتفق عليها معهم حتى يطبقوها **ذاتياً**؛ فالانضباط (تنظيم ذاتي) أعلى من النظام (مصدره خارجي)، وهذه **الإدارة الذاتية للصف**.","**الوقت الأكاديمي**: إجراءات روتينية لبدء الحصة وإنهائها، و**انتقالات** سلسة، وتهيئة قصيرة؛ تقل المشكلات حين **ينهمك الطلاب في النجاح**.","**التنظيم الفيزيائي**: المقاعد حسب **نوع النشاط** (صفوف للعرض، مجموعات للتعاون، حرف U للنقاش)، والمعلم **يرى جميع الطلاب** ويتحرك بينهم.","المجموعات: 4–6 أعضاء بأدوار (قائد، مقرر، ضابط وقت، متحدث)، مسؤولية فردية مع اعتماد إيجابي متبادل؛ والمعلم **ميسّر** ومرشد لا ملقّن ولا متفرج.","**الأزمة الصفية**: **الهدوء**، وفصل المتسببين، وشغل البقية بنشاط، ثم المعالجة الفردية بعد الحصة؛ وعند الملل تغيير أسلوب العرض مع التحرك والإيماءات."],"traps":["الود الزائد حتى تضيع الضوابط = **الفوضوي** لا الديمقراطي.","لا تترك الصف بلا قواعد ولا تجعل لكل طالب قواعده الخاصة."]},"ar.l14.othermod":{"k":"تعديل السلوك","t":["Other Behavior-Change Techniques","أساليب أخرى في تعديل السلوك"],"body":["إلى جانب التعزيز والعقاب أساليب يميزها تفصيل واحد في السؤال: هل نزيل الأثر؟ هل نغير المكان؟ هل نساعد الطالب بتلميح؟"],"pts":["**التصحيح البسيط**: إزالة أثر الخطأ فقط (تنظيف ما سكبه)؛ **التصحيح الزائد**: إزالة الأثر مع أعمال إضافية (اعتذار وإحضار مقعد جديد، تنظيف بقية الفصل).","**التلقين**: تلميح لفظي أو إيمائي أو جسدي (الإمساك بيد الطفل ليرسم الحرف)؛ و**السحب التدريجي/التلاشي**: تدرج في المثير أو المساعدة؛ و**التسلسل**: تعزيز كل حلقة في سلسلة سلوكية.","**ضبط المثير**: تغيير البيئة أو المكان (نقل الطالب الثرثار)؛ و**النمذجة** مثل نقل الطالب بجوار قرين متفوق محبوب.","**التحصين التدريجي** للخجول خطوة خطوة مقابل **الغمر** دفعة واحدة؛ و**الكف المتبادل**: إحلال عادة مقبولة محل أخرى؛ و**الإشباع**: تقديم المثير بكميات كبيرة حتى يفقد جاذبيته.","**ضبط الذات** (تقييد النفس كالحمية)، و**السلوك التوكيدي** (تعليمات تبني ثقة الطالب بنفسه)، و**الإرشاد بالواقع** (توظيف القراءة والأنشطة الواقعية)؛ و**العقد السلوكي** اتفاق مكتوب بالسلوك والمكافأة.","**النشاط التعزيزي** نشاط إضافي لمن أتقن لتثبيت التعلم وتعميقه، و**النشاط العلاجي** لمن لم يتقن."],"traps":["إزالة الأثر مع عمل إضافي = **تصحيح زائد**.","نقل الطالب الثرثار من مكانه = **ضبط المثير**."]},"ar.l14.cases":{"k":"بيئة آمنة","t":["Handling Student Cases","التعامل مع فئات الطلاب والمشكلات السلوكية"],"body":["لكل حالة خطوة أولى تعالج سببها لا مظهرها، دون إحراج علني."],"pts":["**العنف** لأول مرة: تنبيه المعتدين بأن السلوك مرفوض وله عواقب تأديبية إن تكرر؛ تبليغ الإدارة والأهل خطوة لاحقة، وتعليم المهارات الاجتماعية إجراء عام لا يعالج الموقف الحاضر.","**المعتدى عليه** (في التنمر): بناء ثقته وتعليمه مهارات اجتماعية وضمان حمايته؛ لا لومه ولا مواجهته مع المتنمر أمام الصف، ولا يُعالج التنمر بطلب النقل أو التجاهل.","**الخجول**: علاقة ثقة أولاً، ثم مهام سهلة ناجحة، وتواصل **غير لفظي** مشجع، وتحصين تدريجي؛ والخطأ **تجنب سؤاله** أو الزج به أمام الجميع أو تحويله فوراً للمرشد.","**كثير الحركة**: مقعد قريب من المعلم، ومهام فيها حركة مشروعة، وأنشطة قصيرة متنوعة؛ لا حرمانه من الحركة كلياً ولا من الفسحة.","**المشاغب أو المتحدي**: لقاء فردي بود وحزم لفهم السبب، لا مواجهة علنية، ثم اتفاق سلوكي وعواقب ثابتة؛ و**المحبط قليل الدافعية**: استكشف سبب إحجامه، ثم مهام متدرجة ونجاح مبكر وتعزيز الجهد.","أنجز ثم أساء: «حلك صحيح، وضرب زميلك خطأ يستحق العقاب»؛ لا تلغِ أحدهما بالآخر ولا تصفه بصفة سلبية. و**التدخين** ليس تجاهلاً ولا توبيخاً علنياً ولا اتصالاً انفعالياً بالوالد؛ يُبلّغ **المرشد الطلابي والإدارة**."],"traps":["الخطوة الأولى مع الخجول **بناء الثقة** لا تحويله للمرشد.","الطالب المعتدى عليه **لا يُلام**."]},"ar.l14.comm":{"k":"التواصل","t":["Classroom Communication","الاتصال الصفي ولغاته ومعوقاته"],"body":["عناصر الاتصال التعليمي: **مرسل، رسالة، قناة، مستقبل، تغذية راجعة**. والاتصال **اللفظي** بالكلام أو الكتابة، و**غير اللفظي** ثلاث لغات: **لغة الجسد** (تعبيرات وتواصل بصري)، و**اللغة التقاربية** (المسافة والقرب من الطالب)، و**اللغة الموازية** (نبرة الصوت وسرعته)."],"pts":["أنماطه: **وحيد الاتجاه** (محاضرة)، **ثنائي** (معلم وطالب)، **متعدد/مفتوح** (تفاعل الجميع بتوجيه المعلم) وهو الأفضل.","الأسئلة الصفية: **مغلقة** (إجابة واحدة)، **مفتوحة** (تفكير متباعد)، **سابرة** (تبني على إجابة الطالب)، **تجميعية** (تجمع عدة أفكار).","معوقات التفاعل و**معوقات الاتصال**: **خوف الطلاب من الخطأ**، والتعزيز غير المناسب، ومقاطعة المعلم، والتوقعات المنخفضة، وشرود الذهن، والضجيج، وغموض الرسالة؛ والعلاج تنويع المثيرات والأسئلة.","**الإنصات النشط**: إيماء وإعادة صياغة وعدم مقاطعة في جو **دافئ متقبل** يحقق الأمن النفسي؛ والمتحدث الجيد: **ضبط الانفعال**، ووضوح، ونبرة متنوعة، ولا استطراد.","وظائف التغذية الراجعة: **تعزيزية**، و**إخبارية**، و**دافعية**، وتقويمية؛ وصفاتها: فورية، محددة، وصفية، للأداء لا للشخص، مستمرة؛ و**التخطيط باللونين**: الوردي لما حقق المعايير والأصفر لما يحتاج تحسيناً.","**احترام التنوع**: إشراك كل طالب وتحيته باسمه، ولا تجميع حسب الخلفيات؛ والتواصل الرقمي بمجموعات افتراضية **تحت إشراف المعلم وتوجيهه**."],"traps":["الأنسب للتنبيه دون إحراج **غير اللفظي**.","الإجابة الخاطئة لا تُنقل فوراً لطالب آخر."]},"ar.l14.choose":{"k":"مواقف المعيار التاسع","t":["Choosing the Best Option","قواعد اختيار البديل في المواقف الصفية"],"body":["منطق الهيئة: السلوك البسيط **أول مرة** يعالجه المعلم بنفسه (تجاهل مقصود أو تنبيه هادئ على انفراد مع توضيح العواقب)، و**المتكرر** عواقب اللائحة وإشراك المرشد، و**الخطر** المرشد والإدارة فوراً."],"pts":["سلم التصعيد: **أول حادثة** ← المعلم؛ **متكررة أو خطرة** ← المرشد والإدارة وولي الأمر؛ **خارج صلاحية المعلم** (طبي، نفسي، قانوني، ولي أمر بحالة غير طبيعية) ← الإدارة.","الإجراء العام (نموذج سلوك للجميع) أو الوقائي (تعليم مهارات) أو التصعيدي (تبليغ) خطوات لاحقة لا أولى.","البديل الذي يركز على **أثر الإجراء في الطالب** يسبق ما يركز على راحة المعلم أو سير الدرس.","أي بديل فيه إهانة أو عقاب جماعي أو طرد خطأ دائماً.","البيئة الإيجابية تبدأ **بالعلاقة** (تحية، أسماء، احترام) قبل الأدوات والعقوبات.","قاعدة التوقيت: التعزيز والتغذية الراجعة **فورية**، والتصحيح المحرج **مؤجل وخاص**؛ ومع ولي الأمر لا تبدأ بشرح وجهة نظرك ولا بمراجعة القوانين."],"traps":["تعليم الصف كله مهارات اجتماعية إجراء **عام** لا خطوة أولى."]},"ar.l14.ethics":{"k":"القدوة والعلاقة المهنية","t":["Role Model & Professional Boundaries","القدوة وحدود العلاقة المهنية والتراجع عن الخطأ"],"body":["مؤشر 9.2 للممارس: **يظهر القدوة الحسنة في السلوك، ويبقي علاقته مع المتعلمين ضمن حدود العلاقات المهنية، ويتراجع عن الخطأ ويصححه عند حدوثه**. وتمنع القواعد الإيذاء والسخرية و**تكليفه بنسخ الواجب عدة مرات عقاباً** وإقصاءه خارج الصف."],"pts":["**القدوة**: اتساق ما يطلبه المعلم مع ما يفعله (الالتزام بالوقت، ضبط الانفعال، احترام الطلاب، الأمانة)؛ فالطلاب يتعلمون بالملاحظة أكثر من التوجيه اللفظي.","**حدود العلاقة المهنية**: علاقة ودودة **عادلة** قائمة على الاحترام، دون محاباة أو تمييز، ودون تواصل شخصي خارج القنوات المعتمدة، ودون إفشاء أسرار الطلاب أو مزاح يمس الكرامة.","**التراجع عن الخطأ**: إذا أخطأ في معلومة أو حكم أو درجة **يعترف ويصحح** في أقرب وقت أمام من وصلهم الخطأ؛ وإذا أساء إلى طالب أمام زملائه فالأنسب **الاعتذار** بما يحفظ كرامته.","دوره في قواعد 1447: **تمثيل القدوة الحسنة للسلوك الإيجابي في القول والفعل**، وتعزيز الانضباط الذاتي، وتوضيح القواعد، وتعديل السلوك بالاستفادة من التوجيه الطلابي.","ومن دوره: توثيق مشكلات الانضباط في سجلات خاصة، و**رصد الحضور في كل حصة**، و**تمكين الطالب من فرص التعويض**، وطلب المشورة من لجنة التوجيه الطلابي.","**يرصد المعلم مشكلات الدرجة الثانية فأعلى** التي باشرها ويسلم الأسماء للإدارة، ومثالها الدخول أو الخروج من الفصل دون استئذان؛ أما التأخر في دخول الحصة والنوم في الفصل فمن الدرجة الأولى."],"traps":["الإجراءات الثلاثة الأولى: تنبيه شفهي ← تنبيه ثانٍ مع حصر الأسباب ← تدوين وتوقيع وإشعار ولي الأمر وحسم تنفذه الإدارة."],"src":"قواعد السلوك والمواظبة لطلبة التعليم العام (الإصدار الخامس 1447هـ)؛ المعايير التربوية العامة."},"ar.l14.safety":{"k":"الأمن والسلامة","t":["Classroom Safety & Emergencies","السلامة في الصف والمختبر والطوارئ"],"body":["مؤشرا 9.3 للممارس: **يتأكد من جاهزية مصادر التعلم وإمكانية وصول جميع المتعلمين إليها بما في ذلك التقنية الرقمية وتقنية المعلومات**، و**يهيئ البيئة التعليمية بطريقة تحقق عوامل الأمن والسلامة**."],"pts":["**الجاهزية** و**إتاحة الوصول للجميع**: عدد كافٍ من الأدوات أو **تناوب عادل**؛ وموقع يرى منه الجميع، وخط مكبر لضعيف البصر، ونص مرافق للفيديو لضعيف السمع، وممرات خالية للكرسي المتحرك، وبدائل لمن لا يملك جهازاً.","**السلامة في الصف**: ممرات واسعة، ومخارج غير مسدودة، وأثاث ثابت، وتوصيلات آمنة، وتهوية وإضاءة مناسبتان، وأدوات خطرة محفوظة.","**الإخلاء**: معرفة المسار ونقطة التجمع وتدريب دوري؛ وعند الإنذار **الهدوء** وإخراج الطلاب بانتظام **دون أخذ الحقائب** ثم **التحقق من العدد**.","**المختبر**: تعليمات قبل التجربة، و**نظارات وقفازات واقية**، ولا أكل ولا شرب ولا تذوق ولا شم مباشر، ومواد **موسومة**، ومعرفة مكان **طفاية الحريق** و**حقيبة الإسعافات الأولية**، و**إشراف دائم**.","عند **الإصابة أو الخطر**: **إيقاف الخطر وحماية الطلاب أولاً**، ثم الإسعاف في حدود التدريب، ثم إبلاغ الإدارة وولي الأمر والتوثيق، و**استدعاء الهلال الأحمر** عند الحاجة؛ ومعرفة **الحالات الصحية** (ربو، حساسية، سكري، صرع) بالتنسيق مع الموجه الصحي.","**محاولة إيذاء الذات** (المادة 30): الهدوء وأخذ كلامه بجدية، وتجنب كثرة الأسئلة، ومكان آمن و**عدم تركه بمفرده**، وحفظ خصوصيته، والتبليغ فوراً (إدارة التعليم، الجهات الأمنية، الحماية من العنف الأسري وحماية الطفل 1919، وزارة الصحة)."],"traps":["عند الحريق لا تُؤخذ **الحقائب**.","أول إجراء عند الإصابة **إيقاف الخطر** لا الاتصال بولي الأمر."],"src":"قواعد السلوك والمواظبة لطلبة التعليم العام (الإصدار الخامس 1447هـ)؛ المعايير التربوية العامة."},"ar.l15.eval":{"k":"مفاهيم التقويم","t":["Educational Evaluation: Qualities & Functions","التقويم التربوي: خصائصه ووظائفه"],"body":["التقويم التربوي يشمل تقويم المتعلم والمعلم والمنهج والإدارة والمبنى، والتقويم التعليمي جزء إجرائي منه. والحكم على درجات الطلاب في ضوء معيار الوزارة ثم كتابة وسائل تعزز مستواهم = **تقويم تربوي** (حكم + علاج)، لا قياس ولا تقييم فقط."],"pts":["خصائص التقويم الجيد: مستمر، شامل لجوانب المتعلم، تعاوني، علمي (صادق وثابت وموضوعي)، اقتصادي، وليس نشاطاً ختامياً فقط.","**مواصفات الاختبار الجيد**: الصدق، الثبات، الموضوعية، **التمييز**، **الشمول** (تغطية المحتوى وفق جدول المواصفات)، والتقنين، وسهولة التطبيق والتصحيح.","**وظائف التقويم**: تشخيص الضعف، وتوجيه التعلم، والحكم على الأهداف، وتطوير المناهج وطرق التدريس، ودعم القرارات الإدارية."],"traps":["الحكم مع وسائل علاجية = **تقويم** لا تقييم."]},"ar.l15.tools":{"k":"أدوات التقويم","t":["Other Assessment Tools","أدوات تقويم أخرى: السجلات والملاحظة والمقابلة والتقارير الذاتية"],"body":["كل أداة تكشف جانباً لا يكشفه الاختبار الورقي؛ فاختر الأداة بحسب ما تريد قياسه."],"pts":["**السجل القصصي**: وصف دقيق مؤرخ لسلوك طالب في موقف محدد كما حدث؛ من عيوبه الوقت الطويل وتأثره بذاتية الملاحِظ. و**سجل سير التعلم (اليوميات)** يكتب فيه الطالب تأملاته.","**الملاحظة** أنسب لتقويم المهارات العملية والسلوك، بسيطة أو منظمة بأداة (بطاقة ملاحظة)؛ و**المقابلة / المؤتمر** تواصل وجهاً لوجه حول أعمال الطالب وتفكيره.","**تقويم الأقران** يعتمد على نشاطين رئيسيين: **الملاحظة** و**التواصل**، وهو مكمل للتقويم الذاتي.","**التقارير الذاتية** للنواتج **الوجدانية**: مقاييس **الاتجاهات** (ليكرت الخماسي)، ومقاييس **الميول** (سترونج وكودر)، والاختبارات الإسقاطية، والمقابلة المقيدة أو المفتوحة.","**الاختبارات الشفوية**: أنسب للصفوف الأولية ومواد كالقرآن الكريم، ينعدم فيها الغش وتكشف التعبير، لكنها تستغرق وقتاً وتتأثر بذاتية المعلم وخوف الطالب."],"traps":["الاتجاهات والميول تُقاس **بالتقارير الذاتية** لا بالاختبار التحصيلي."]},"ar.l15.essay":{"k":"أنواع الأسئلة","t":["Essay Questions","الأسئلة المقالية"],"body":["**المقالية** نوعان: **المقيدة** تحدد المطلوب ونطاق الإجابة، و**الحرة (المفتوحة)**. تقيس تنظيم الأفكار والتعبير والتكامل والتفكير العليا، وهي سهلة الإعداد ولا تخمين فيها، لكن تصحيحها ذاتي فينخفض ثباتها، وتغطي محتوى محدوداً."],"pts":["تقييد السؤال («اذكر ثلاثة أسباب») يرفع موضوعية التصحيح؛ والسؤال المفتوح بلا تحديد يصعب تصحيحه.","الموضوعية في المقابل تغطي المحتوى وسهلة التصحيح، لكنها تحتاج وقتاً في الإعداد ولا تقيس التعبير والتنظيم."],"traps":["الموضوعية: الاختيار من متعدد، والصواب والخطأ، والمطابقة، و**الإكمال (التكملة)** فقط."]},"ar.l15.build":{"k":"بناء الاختبار","t":["Building an Achievement Test","خطوات بناء الاختبار التحصيلي وتصحيحه"],"body":["الخطوات بالترتيب: **تحديد الأهداف** ← تحليل المحتوى ← جدول المواصفات ← صياغة الفقرات ← التعليمات ← التجريب والتحليل. والخطوة الأولى دائماً **تحديد الأهداف التعليمية المراد قياسها**، لا كتابة الأسئلة ولا تحليل المحتوى."],"pts":["التعليمات تتضمن الزمن، وطريقة الإجابة ومكانها، ودرجة كل سؤال، وتنبيهات التخمين.","تصحيح المقالي: نموذج إجابة ومحكات تصحيح (قواعد كلية أو تحليلية بوزن لكل محك) تُعد قبل التصحيح، وتصحيح السؤال الواحد لكل الطلاب قبل غيره، وإخفاء الأسماء.","التصحيح بمعيار واحد للجميع؛ وظرف الطالب الشخصي يُعالج بطرق تربوية أخرى لا برفع درجته.","اختبار المعلم هو الأنسب لقياس تمكن طلابه من محتوى درسوه في فترة محددة، والمقنن لمقارنات أوسع.","ترتيب الفقرات من السهل إلى الصعب يشجع متدني التحصيل على الاستمرار ويقلل القلق."],"ex":["معلمة وجدت أن اختبارها الماضي فيه 15 سؤالاً من الدرس الأول و3 فقط من بقية الوحدة: خلل في صدق المحتوى، وعلاجه بناء جدول مواصفات بأوزان الدروس قبل كتابة الأسئلة."],"traps":["الخطوة الأولى **تحديد الأهداف** لا الجدول ولا الأسئلة."]},"ar.l15.intl":{"k":"الاختبارات الوطنية والدولية","t":["National & International Assessments","نافس والاختبارات الدولية"],"body":["**نافس** الاختبارات الوطنية التي تنفذها هيئة تقويم التعليم والتدريب لقياس مخرجات التعلم في القراءة والرياضيات والعلوم للصفوف 3 و6 و9؛ غرضها تشخيص المستوى الوطني وتحسين التعليم لا ترتيب الطالب أو نجاحه."],"pts":["**PISA** (بيزا) من منظمة OECD، لعمر 15 سنة، كل 3 سنوات، يقيس تطبيق المعرفة في القراءة والرياضيات والعلوم في مواقف حياتية.","**TIMSS** (تيمس) من IEA، للصفين الرابع والثامن (الثاني متوسط)، كل 4 سنوات، في الرياضيات والعلوم.","**PIRLS** (بيرلز) للصف الرابع، كل 5 سنوات، في مهارات القراءة والاستيعاب.","**TALIS** مسح دولي عن المعلمين وبيئات التدريس وليس اختباراً للطلاب."],"traps":["PISA بالعمر (15 سنة)، وTIMSS وPIRLS **بالصف**."]},"ar.l15.formal":{"k":"خطة التقويم","t":["Formal & Informal Assessment, Assessment Cycles","التقويم الرسمي وغير الرسمي ودورتا التقويم"],"body":["مؤشر 10.1 للممارس: **يعد خطة تقويم وفقاً للمبادئ الصحيحة توضح ما سيقوم به لتمثيل أساليب التقويم الرسمي والاعتيادي، ولتحقيق أغراض التقويم الأساسية خلال دورتي التقويم الطويلة والقصيرة المدى**."],"pts":["**الرسمي**: مخطط له، **منظم وموثق**، بشروط وزمن ودرجة (اختبار قصير، اختبار نهاية الفترة، مشروع بسلم تقدير)؛ تُرصد نتائجه ويُبنى عليه حكم.","**غير الرسمي (الاعتيادي)**: يجري **تلقائياً أثناء التدريس** دون إعلان أو درجة غالباً (الملاحظة، الأسئلة الشفهية، بطاقة الخروج، الإشارات، السبورات الصغيرة)؛ غرضه **تعديل التدريس فوراً**.","**قصيرة المدى**: داخل الحصة أو بين حصة وأخرى، دليل سريع يعقبه تعديل أو تغذية راجعة؛ و**طويلة المدى**: الوحدة والفترة والعام، تقيس تحقق النواتج وتوجه الخطط العلاجية والإثرائية والتقارير.","**خطة التقويم** تحدد لكل ناتج تعلم: ماذا يُقوَّم، وبأي أداة، ومتى، وكيف يُصحح، وكيف تُوظف النتائج، مع **توزيع الدرجات**.","لائحة 2025: **التقويم القبلي (التشخيصي)** في بداية العام أو الفترة أو الوحدة أو الدرس، و**التكويني** عمليات مستمرة لتجويد التعلم، و**الختامي** في ختام فترات التعلم للحكم على المستوى.","**النسبة الشرطية لا تُطبق على اختبار الدور الثاني**، ويستمر تحسين درجات أدوات التقويم التكوينية حتى بدء اختبارات نهاية الفترة."],"traps":["الخطة الجيدة **تجمع بين الرسمي وغير الرسمي** ولا تعتمد على الاختبار وحده."],"src":"المعايير التربوية العامة؛ لائحة تقويم الطالب 2025 وإجراءاتها التنفيذية."},"ar.l15.access":{"k":"تقويم ذوي الإعاقة","t":["Test Accommodations","تسهيلات الاختبار وتقويم الطلاب ذوي الإعاقة"],"body":["**التسهيلات (المواءمات)** تغيّر **طريقة** تقديم الاختبار أو الاستجابة أو المكان أو الزمن، ويبقى المستوى المقيس كما هو؛ أما **التعديل** فيغيّر محتوى التقويم أو مستواه وفق **الخطة التربوية الفردية**."],"pts":["عامة: **الزمن الكافي** المناسب لقدرات الطالب، و**مكان مناسب** فردي أو جماعي، و**مرونة المواعيد** بالتنسيق مع الإدارة، و**تجزئة** المادة أو الاختبار.","**البصرية**: برايل، أو الشفهي، أو التسجيل الصوتي، أو **قارئ كاتب مبصر**، و**الطباعة المكبرة والعدسات** لضعاف البصر، وتكييف الصور والرسوم أو بديل لها.","**السمعية**: أسئلة **موضوعية مباشرة واضحة** بدل المقالية والمركبة، وترجمة بلغة الإشارة، و**عدم محاسبة الأصم على الأخطاء الإملائية والنحوية**، واستبدال مهارات الاستماع بنصوص أو صور.","**صعوبات التعلم**: قراءة الأسئلة بصوت عال، والإجابة **شفهياً** أو كتابتها عنه أو تسجيلها، و**فترات راحة**، وتقويم فردي بعيد عن المشتتات؛ و**فرط الحركة**: **فترات قصيرة**، والسماح **بالتوقف والتحرك**، والاختبار في **ركن خاص بعيد عن المشتتات**.","**الجسمية**: الأجهزة التعويضية، وإجابة شفهية يكتبها أحد منسوبي المدرسة الموثوقين بتكليف من المدير، وإعفاء من التقويمات العملية والرسم الكتابي؛ و**اضطرابات النطق**: لا يُحاسب على أخطائها، ويمكن استبدال الشفهي بالتحريري.","يتولى **معلم التربية الخاصة** الإشراف بالتعاون مع معلم التعليم العام وتُعد الأسئلة بالتشاور؛ ومن لم يستفد من الفصل العام **يُقوَّم في محتوى خطته الفردية**؛ ومن مرتكزات اللائحة **توافر فرص متكافئة لجميع الطلاب في أساليب التقويم وأدواته وظروف تطبيقه**."],"ex":["طالب ذو صعوبة في القراءة يُختبر في الرياضيات: يقرأ له المعلم الأسئلة في غرفة هادئة مع وقت إضافي، والمسائل نفسها لم تتغير؛ هذا تسهيل لا تعديل. أما أسئلة من محتوى خطته الفردية فتعديل."],"traps":["التسهيل لا يخفض **المستوى المقيس**؛ تغيير المحتوى **تعديل**."],"src":"لائحة تقويم الطالب 2025 وإجراءاتها التنفيذية؛ المعايير التربوية العامة (مؤشر 10.2)."},"ar.l16.corr":{"k":"الإحصاء","t":["Correlation Coefficient","معامل الارتباط"],"body":["**معامل الارتباط** يصف العلاقة بين متغيرين، ويتراوح بين −1 و+1: الإشارة تحدد الاتجاه (طردي / عكسي)، والقيمة المطلقة تحدد القوة."],"pts":["أقل من 0.3 ضعيف، و0.3 إلى 0.7 متوسط، وفوق 0.7 قوي.","يُستخدم في الثبات (ارتباط التطبيقين أو النصفين) وفي صدق المحك (ارتباط الاختبار بالمحك).","**الارتباط لا يعني السببية**: ارتباط قوي بين الحضور والتحصيل لا يثبت أن أحدهما سبب للآخر."],"traps":["ارتباط −0.8 **أقوى** من +0.5؛ الإشارة للاتجاه فقط."]},"ar.l16.use":{"k":"توظيف النتائج","t":["Using Assessment Results","توظيف نتائج التقويم والتقارير"],"body":["التغذية الراجعة الفعالة محددة ووصفية، تركز على المهمة لا على شخص الطالب، تذكر نقاط القوة ثم ما يُحسَّن، بلغة بسيطة موجزة، ولا تقتصر على الثناء العام ولا على نقاط الضعف."],"pts":["**خصائص التغذية الراجعة** الجيدة: الفورية، و**الدوام والاستمرارية**، و**الشمولية** لجوانب الأداء، والتحديد، والتركيز على المهمة لا الشخص.","يُفضل تقديمها **في الحصة التالية للاختبار** مباشرة لا في نهاية الفصل؛ والأقرب زمنياً أفضل عموماً.","تقرير ولي الأمر يوضح مستوى الطالب وتقدمه ونقاط قوته وما يحتاجه من دعم، بلغة واضحة بعيداً عن المقارنة بالآخرين.","تُستخدم النتائج لتعديل الخطة والتدريس وتصنيف الطلاب وتوجيههم وإعداد التقارير، ولا تُستخدم أداة عقاب.","تحليل الاختبار بالجداول الإلكترونية يسرّع حساب الصعوبة والتمييز والمتوسطات ويكشف الفقرات الضعيفة لتحسين الاختبارات القادمة."],"traps":["الإجراء الأول عند تدني نتائج الصف **تحليل النتائج** لا إعادة الاختبار."]},"ar.l16.records":{"k":"سجلات الرصد","t":["Record-keeping & Data Analysis","سجلات الرصد وتحليل النتائج ببرامج الجداول"],"body":["مؤشر 10.3 للممارس: **يعد نماذج رصد إنجازات المتعلمين ونتائجهم التراكمية ومدى تقدمهم خلال الفصل أو العام، ويستخدم بعض البرامج التقنية لتحليل البيانات واستخلاص المؤشرات الأساسية للأداء**."],"pts":["الصفان الأول والثاني: يُقوَّم الطالب **من بداية الفترة**، ويدوّن المعلم تقويمه **بشكل يومي في سجل متابعة تقويم الطالب**، ويرصد الخلاصة في النظام الرقمي نهاية الفترة موثقة في **ملف إنجاز الطالب** (جمع منظم وهادف لشواهد تعلمه).","نموذج الرصد الجيد: صف لكل طالب، وأعمدة **بالمعايير أو نواتج التعلم** والأداة والتاريخ، ومستوى الإتقان أو الدرجة، وعمود للملحوظات والإجراء العلاجي؛ و**الرصد التراكمي** يُظهر **مسار تقدم** الطالب (قبلي ← تكويني ← ختامي).","بالجداول: المتوسط والوسيط والانحراف، و**نسبة الإتقان لكل معيار** = عدد المتقنين ÷ عدد الطلاب، و**نسبة التحسن** بين القبلي والبعدي، و**التنسيق الشرطي** لتلوين غير المتقنين، و**الرسوم البيانية** للمقارنة.","**المؤشرات الأساسية للأداء**: نسبة الإتقان في كل معيار، وتوزيع الطلاب على المستويات، وأضعف المعايير وأقواها، والطلاب المحتاجون لعلاج أو إثراء، وتطور الأداء عبر الفترات.","اللائحة: **يحلل المعلم نتائج طلابه** لتحديد مواطن القوة والضعف وأسبابها وبناء خطة علاجية، وتحلل **لجنة التحصيل الدراسي** النتائج على مستوى المدرسة.","حساب النسبة المئوية لتحصيل الصف يحتاج عدد الطلاب ودرجاتهم والدرجة الكلية، ولا يحتاج عدد الفصول."],"ex":["في فصل من 30 طالبة أتقنت 12 معيار «حساب المساحة» (40%)، فتعيد المعلمة تدريسه للصف كله؛ وأتقنت 27 معيار «المحيط» (90%)، فتضع للثلاث الباقيات خطة علاجية في مجموعة صغيرة."],"traps":["نتيجة الطالب **سرية** تخصه وولي أمره والقائمين على تعليمه."],"src":"لائحة تقويم الطالب 2025 وإجراءاتها التنفيذية؛ المعايير التربوية العامة (مؤشر 10.3)."},"ar.l01.identity":{"k":"الهوية الوطنية","t":["Vision 2030 & National Identity","رؤية 2030 وتعزيز الهوية الوطنية"],"aka":["برنامج تنمية القدرات البشرية","رؤية 2030"],"body":["الهوية الوطنية تُبنى بشواهد يراها الطالب: خدمة الحرمين، ومنجزات رؤية 2030، والمشاريع الوطنية، لا بالوعظ المجرد. ومن واجبات المعلم في الميثاق أنه **أمين على كيان الوطن ووحدته**، يعمل لتسود المحبة بين المواطنين وبينهم وبين ولاة الأمر."],"pts":["**رؤية 2030** في التعليم: رفع جودة المخرجات، تنمية الشراكة المجتمعية، سد الفجوة بين التعليم وسوق العمل، التعلم مدى الحياة.","**برنامج تنمية القدرات البشرية** أحد برامج رؤية 2030، ويستهدف بناء المواطن بالقيم والمهارات من الطفولة المبكرة حتى التعلم مدى الحياة.","سؤال «الأمة أم الوطن؟» يُجاب بحوار هادئ: حب الوطن لا يتعارض مع الانتماء للأمة، ولا يُسكت الطالب ولا يُسخر منه.","ربط الدرس بشواهد علاقات المملكة الدولية وجهودها (خدمة الحرمين والحجاج) ينمي **المواطنة الصالحة** أفضل من الطلب العام بالمطالعة."],"traps":["تعليق الأعلام والمظاهر **وسيلة** لا غاية؛ البداية غرس مفهوم حب الوطن والمواطنة."],"src":"رؤية المملكة 2030 (برنامج تنمية القدرات البشرية)؛ ميثاق أخلاقيات مهنة التعليم 1427هـ"},"ar.l01.heritage":{"k":"مؤشر 1.2","t":["National Heritage in the Lesson","التراث الوطني والمناسبات في الدرس"],"aka":["التراث المادي","التراث غير المادي"],"body":["مؤشر الممارس 1.2 يطلب أن **يوظف المعلم خبرات ومواقف وأنشطة تعليمية** تدعم الاعتزاز بالهوية الوطنية السعودية **وبالتراث الثقافي الوطني**؛ أي أن يدخل التراث في الدرس والنشاط نفسه، لا أن يبقى مناسبة عابرة."],"pts":["**التراث المادي**: المباني التاريخية والمواقع الأثرية والحِرف والأدوات والأزياء.","**التراث غير المادي**: العادات والتقاليد والأمثال والشعر والفنون الشعبية كالعرضة وآداب الضيافة.","**التوظيف داخل المادة**: مسألة رياضية عن مساحة مبنى تراثي، نص قرائي عن الضيافة، مشروع عن حرفة من منطقة الطالب، مقابلة كبار السن، زيارة متحف أو موقع تراثي.","**المناسبات**: يوم التأسيس (22 فبراير) ذكرى تأسيس الدولة السعودية الأولى على يد الإمام محمد بن سعود عام 1139هـ (1727م)؛ اليوم الوطني (23 سبتمبر) ذكرى توحيد المملكة على يد الملك عبدالعزيز عام 1351هـ (1932م)؛ يوم العلم (11 مارس).","الاحتفاء يكون **بأنشطة هادفة** يشارك فيها الطلاب (بحث، معرض، عرض تاريخي، مسابقة معرفية) مرتبطة بالقيم، لا بالمظاهر الشكلية وحدها."],"traps":["يوم التأسيس = الدولة السعودية **الأولى** (1139هـ)؛ اليوم الوطني = **توحيد المملكة** (1351هـ)."],"src":"المعايير المهنية للمعلمين، هيئة تقويم التعليم والتدريب (1.2)؛ قواعد السلوك والمواظبة لطلبة التعليم العام، الإصدار الخامس 1447هـ (السلوك المتميز)"},"ar.l02.policy":{"k":"وثيقة 1390","t":["Education Policy Document (1390 AH)","وثيقة سياسة التعليم 1390هـ"],"aka":["سياسة التعليم","الأسس العامة","مصادر الأهداف"],"body":["صدرت بقرار مجلس الوزراء رقم **779** وتاريخ **1389/9/16هـ** في **236 مادة**، وهي «الخطوط العامة التي تقوم عليها عملية التربية والتعليم». وتشتهر باسم «سياسة التعليم 1390هـ»: إن سُئلت عن سنة الوثيقة فالمعتمد 1390هـ، وإن سُئلت عن تاريخ القرار نفسه فهو 1389هـ.","وقد ألغاها [[قرار مجلس الوزراء 103|ar.law.repeal]] (1448هـ) المصاحب لنظام التعليم العام، مع بقاء أحكامها سارية حتى يصدر البديل."],"pts":["**الأسس العامة** تبدأ بالإيمان بالله رباً وبالإسلام ديناً وبمحمد ﷺ نبياً ورسولاً، والتصور الإسلامي للكون والحياة والإنسان.","**الغاية** من التعليم: فهم الإسلام فهماً صحيحاً متكاملاً، وغرس العقيدة ونشرها، وتزويد الطالب بالقيم والمعارف والمهارات.","**مصادر الأهداف**: العقيدة الإسلامية، الأوضاع الاجتماعية والاقتصادية ومطالب التنمية، اتجاهات العصر، حاجات المواطن.","**من مبادئها**: التربية المتكاملة (إعداد المواطن المؤمن إعداداً سليماً متوازناً)، طلب العلم فريضة، حق الفتاة في التعليم، توجيه العلوم توجيهاً إسلامياً.","**المراحل**: ابتدائي 6 سنوات، متوسط 3، ثانوي 3 (السلم 12 صفاً)؛ ولذوي الاحتياجات الخاصة توضع **سياسة شاملة لرعايتهم**؛ وتأسست وزارة المعارف عام **1373هـ**، والتعليم حق لكل مواطن تكفله الدولة.","**سن القبول** في الصف الأول: من أكمل **ست سنوات هجرية** في اليوم الأول من الدراسة أو قبله، ويجوز قبول من يقل عمره بما لا يزيد على 90 يوماً بعد قبول من أتم السادسة؛ وهذه من **قواعد القبول** في الوزارة لا من نص الوثيقة، وفي النظام الجديد يحدد سنَّ القبول المجلس (المادة 8)."],"traps":["**اللجنة العليا لسياسة التعليم** تختص بإقرار الخطة التعليمية ورسم السياسة، لا بإعداد المعلمين ولا بناء المقررات؛ أما نص الوثيقة فيذكر «مجلساً أعلى للتعليم» (م231).","سنة الوثيقة **1390هـ**، وتاريخ قرارها **1389هـ**."],"src":"سياسة التعليم في المملكة العربية السعودية (قرار مجلس الوزراء 779 وتاريخ 1389/9/16هـ)؛ قواعد القبول في وزارة التعليم؛ قرار مجلس الوزراء 103 (1448هـ)"},"ar.l02.jobsmore":{"k":"لائحة","t":["Education Jobs Regulation: Details","لائحة الوظائف: الترقية والأداء والإجازات"],"aka":["الأنشطة اللاصفية","الفاقد التعليمي","إجازات المعلم"],"body":["تفاصيل من لائحة الوظائف التعليمية تتكرر في الأسئلة بعد الرتب والرخصة."],"pts":["**الترقية**: رخصة سارية بالمستوى المطلوب + تقويم أداء **جيد جداً فأعلى** آخر ثلاث سنوات + إكمال سنوات الرتبة (6 بكالوريوس / 5 ماجستير / 4 دكتوراه).","**الأنشطة اللاصفية**: الحصص غير التدريسية كالتخطيط والتقويم وإدارة الأنشطة والمشاركة في التطوير المهني والأعمال الإدارية.","**تقويم الأداء** يُعدّ سنوياً ويحق للموظف التظلم منه؛ ومن **حقوق** المعلم الاطلاع عليه، أما حضور الاجتماعات والمشاركة في النشاط ودراسة المناهج فـ**واجبات**.","**إجازات المعلم**: الصيفية مع نهاية العام الدراسي، والمرضية والاضطرارية بضوابط نظام الخدمة المدنية؛ و**الاضطرارية** لا تتجاوز خمسة أيام في السنة ولا تُخصم من الصيفية.","**تعديل 1446**: الرخصة إلزامية لمزاولة التعليم اعتباراً من فبراير 2026 مع إعفاء من بلغ الخمسين قبله، وأُلغي ربط العلاوة بالرخصة.","**الفاقد التعليمي** مصطلح يرد مع هذا الباب: ما يخسره النظام التعليمي بسبب **الرسوب والتسرب**، وله آثار تربوية واجتماعية واقتصادية."],"traps":["الاطلاع على تقويم الأداء **حق**؛ حضور الاجتماعات والنشاط **واجب**."],"src":"لائحة الوظائف التعليمية بتعديلات 1446هـ"},"ar.l02.grades":{"k":"قواعد 1447","t":["Behavior & Attendance Grades","درجات السلوك والمواظبة في قواعد 1447"],"aka":["درجة السلوك","درجات الحسم","المواظبة"],"body":["صدر **الإصدار الخامس** من قواعد السلوك والمواظبة لطلبة التعليم العام عام **1447هـ (2025م)** وألغى ما سبقه. وللطالب درجتان منفصلتان: **السلوك 100** و**المواظبة 100**."],"pts":["**السلوك**: **80 للسلوك الإيجابي** يستحقها تلقائياً بداية كل فصل وتُحسم عند المخالفة، و**20 للسلوك المتميز** تُكتسب بممارسات تعكس القيم الإسلامية والهوية الوطنية (الانضباط، التسامح، الأمانة، العزيمة، التعاون، الانتماء الوطني).","**الحسم** حسب درجة المشكلة: 1، 2، 3، 10، 15؛ وللطالب **فرص تعويض** للمحسوم بممارسات السلوك المتميز، والتعويض **لا يعفيه** من بقية الإجراءات.","**الضمانات**: **مناسبة الإجراء للمرحلة العمرية** والظروف، و**سرية** معلومات الطالب المخالف، وتزويده **بنوع المشكلات** التي حُسمت بسببها درجاته إذا طلب.","**المواظبة** من الثالث الابتدائي إلى الثالث الثانوي (وتقدير كيفي في الصفين الأول والثاني): تُحسم **درجة واحدة عن كل يوم غياب بدون عذر**؛ والعذر المقبول في وقته لا يؤثر فيها.","**تجاوز الغياب بدون عذر 10%** من أيام العام يحرم الطالب من الانتقال: الابتدائية والمتوسطة إلى العام التالي، والثانوية إلى الفصل التالي.","تكرار الغياب بدون عذر: تحويل إلى **الموجه الطلابي** ← إحالة إلى **لجنة التوجيه الطلابي** ← مخاطبة **الجهات المختصة** وفق نظامي حماية الطفل والحماية من الإيذاء، مع استمرار الخدمات التعليمية واستكمال الغائب خطة التعلم بعذر أو بدونه."],"traps":["الموجه الطلابي **لا يحسم** درجات السلوك ولا المواظبة؛ دوره دراسة الحالة وعلاجها."],"src":"قواعد السلوك والمواظبة لطلبة التعليم العام، الإصدار الخامس 1447هـ"},"ar.l04.parenttools":{"k":"أولياء الأمور","t":["Parent Communication Channels","قنوات التواصل مع الأسرة"],"aka":["الخطاب الإداري","تقنيات التواصل"],"body":["التواصل الفاعل مع ولي الأمر منتظم ومتنوع القنوات، ولا يقتصر على المشكلات."],"pts":["تقنيات التواصل تُطلع أولياء الأمور على **خطط المعلم التدريسية وتعلم الطلاب**.","تطبيقات مثل **ClassDojo** و**Remind** تتيح التواصل المنتظم وإطلاع أولياء الأمور على التقدم دون استدعاء.","**School Circle**: مشاركة الملفات ومساحة افتراضية للنقاش بين المعلم والطلاب وأولياء الأمور؛ و**TeacherApp**: رصد الحضور والغياب والتقييم.","العلاقة الفاعلة تُظهر **الجانب الإيجابي** وتدعو ولي الأمر للفعاليات والتكريم، وولي الأمر المتعاون يُمنح عضوية **مجلس المدرسة**.","**الخطاب الإداري** لمدير المدرسة أو جهة رسمية: عنوان، تحية، موضوع واضح، خاتمة، توقيع؛ لا رسالة ودية ولا شفهية.","الميثاق: المعلم **شريك الوالدين**، ويحفظ **سرية** الاجتماعات، ولا يتحدث عن الطالب أمامه مدحاً أو ذماً."],"src":"مدونة قواعد السلوك الوظيفي وأخلاقيات الوظيفة لشاغلي الوظائف التعليمية، وزارة التعليم، 1447/2/3هـ (المادة 9)؛ ميثاق أخلاقيات مهنة التعليم 1427هـ"}};

        ". النسخة الكاملة تعالجها بدروسها كاملة، و" + N(C.qTotal) + " سؤالاً، و3 اختبارات محاكية.</p>" +

      var rest = Math.max(0, (C.similarTotal || 0) - (C.similar || []).length);

<script>

document.documentElement.lang = "ar";

/* ---------- constants ---------- */
const DOM = {

const DORDER = ["V","K","P"];
const STDS = {"1":"القيم الإسلامية وأخلاقيات المهنة والهوية","2":"التطوير المهني المستمر","3":"التفاعل مع التربويين والمجتمع","4":"المهارات اللغوية والكمية","5":"المعرفة بالمتعلم وكيفية تعلمه","7":"طرق التدريس العامة","8":"التخطيط للتدريس وتنفيذه","9":"بيئات التعلم التفاعلية والداعمة","10":"التقويم"};
const STDW = window.STD_WEIGHTS || {"1":8,"2":5,"3":8,"4":17,"5":15,"7":8,"8":15,"9":11,"10":13};
const SORDER = Object.keys(STDS);
const LORDER = ["L01","L02","L03","L04","L05","L06","L07","L08","L09","L10","L11","L12","L13","L14","L15","L16"];  // نظام التعليم العام الجديد (1448) صار أقساماً داخل L02 بجوار سياسة التعليم 1390
const LESSONS = (window.LESSONS||[]).slice().sort((a,b)=>LORDER.indexOf(a.id)-LORDER.indexOf(b.id));
const LBY = Object.fromEntries(LESSONS.map((l,i)=>[l.id, Object.assign(l,{n:i+1, trap:l.trap||[], vid:l.vid||[], sec:l.sec||[]})]));
const INT = [0,1,3,7,14,30];
const EXAM_DEFAULT = "2026-11-06";  // التربوي العام 1448: 6–7 نوفمبر 2026 (اليوم نقلاً عن الهيئة، إعلان التسجيل 3 أغسطس 2026)
const AR = n => String(n);
const LET = ["أ","ب","ج","د"];

/* ---------- utils ---------- */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0)}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,seed){const r=seed==null?Math.random:rng(seed);const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function esc(s){return String(s==null?"":s).replace(/[<>"&]/g,c=>({"<":"&lt;",">":"&gt;",'"':"&quot;","&":"&amp;"}[c]))}
function fmt0(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}
function fmt(s){return window.QX?QX.withLinks(s,fmt0):fmt0(s)}
function todayStr(d){d=d||new Date();const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return todayStr(d)}
function diffDays(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000)}
function fmtDate(s){try{return new Date(s+"T12:00:00").toLocaleDateString("ar-SA-u-ca-gregory-nu-latn",{day:"numeric",month:"short"})}catch(e){return s}}
function pct(a,b){return b?Math.round(a*100/b):0}

/* ---------- question bank ---------- */
const QS = (window.QB||[]).filter(r=>LBY[r[0]]).map(([l,f,q,o,e])=>{
  const id = hash(q).toString(36);
  const order = shuffle([0,1,2,3], hash(id));
  return {id,l,d:LBY[l].d,std:LBY[l].std,h:f.includes("h"),m:f.includes("m"),n:f.includes("n"),q,o:order.map(i=>o[i]),a:order.indexOf(0),e};
}).concat((window.OFFICIAL||[]).filter(r=>LBY[r[0]]).map(([l,q,o,a,e,src])=>({id:"o"+hash(q).toString(36),l,d:LBY[l].d,std:LBY[l].std,h:true,m:false,of:true,src,q,o,a,e})));
const _seen=new Set(); for(let i=QS.length-1;i>=0;i--){ if(_seen.has(QS[i].id)) QS.splice(i,1); else _seen.add(QS[i].id) }
const QBY = Object.fromEntries(QS.map(q=>[q.id,q]));
const TERMS = [];
LESSONS.forEach(l=>l.sec.forEach(s=>(s.t||[]).forEach(t=>TERMS.push({id:l.id+":"+t[0],l:l.id,t:t[0],def:t[1]||""}))));

/* fixed tests */
const STD_N = (function(){const keys=SORDER; const raw=keys.map(k=>88*STDW[k]/100); const fl=raw.map(Math.floor); const left=88-fl.reduce((a,b)=>a+b,0); raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(([_,i])=>fl[i]++); return Object.fromEntries(keys.map((k,i)=>[k,fl[i]]));})();
function buildMocks(){
  const mocks=[[],[],[]];
  SORDER.forEach((sd,si)=>{
    const inStd=q=>q.std===sd && !q.of && !q.n;
    const pool = shuffle(QS.filter(q=>inStd(q)&&q.m),101+si).concat(shuffle(QS.filter(q=>inStd(q)&&!q.m),201+si));
    pool.slice(0,STD_N[sd]*3).forEach((q,i)=>mocks[i%3].push(q.id));
  });
  return mocks.map((m,i)=>shuffle(m,301+i));
}
const MOCKS = buildMocks();
const DIAG = (window.PW&&PW.diag) ? PW.diag.filter(id=>QBY[id]) : (function(){
  const n={V:8,K:17,P:15}; let ids=[];
  DORDER.forEach((d,di)=>{
    const pool = shuffle(QS.filter(q=>q.d===d&&!q.m&&!q.n&&!q.of&&q.h),401+di).concat(shuffle(QS.filter(q=>q.d===d&&!q.m&&!q.n&&!q.of&&!q.h),501+di));
    ids = ids.concat(pool.slice(0,n[d]).map(q=>q.id));

})();
const TESTS = {

};

/* ---------- state & persistence ---------- */
const LS_KEY = "rakhsa-tarbawi.v1";
function freshState(){return {v:1,start:todayStr(),exam:EXAM_DEFAULT,lessons:{},q:{},terms:{},tests:{},tasks:{},updatedAt:0}}
let S = freshState();
try{const raw=localStorage.getItem(LS_KEY); if(raw){const p=JSON.parse(raw); if(p&&p.v===1) S=Object.assign(freshState(),p);}}catch(e){}
let dbRef=null, remoteBusy=false, remotePending=false, syncOn=false, saveTimer=null;
function save(){
  S.updatedAt = Date.now();
  try{localStorage.setItem(LS_KEY, JSON.stringify(S))}catch(e){}
  clearTimeout(saveTimer); saveTimer=setTimeout(pushRemote, 1200);
}
async function pushRemote(){

      else if((S.updatedAt||0)>(r&&r.updatedAt||0)) pushRemote();}

}

/* question stats */
function recordAnswer(id, correct){

function reviewAll(){return QS.filter(q=>{const s=S.q[q.id];return s&&s.b!=null&&s.b<5})}

function groupStats(filter){

  qs.forEach(q=>{const s=S.q[q.id];if(s){att+=s.a;cor+=s.c;if(s.last===1)mast++}});

}

/* ---------- plan ---------- */
/* ترتيب الدروس في الخطة: حسب الوزن والصعوبة، لا حسب رقم المعيار */
const PLAN_ORDER = ["L15","L16","L09","L07","L08","L10","L12","L13","L14","L11","L02","L01","L04","L03","L06","L05"];
function planTasks(){
  return [{id:"diag",type:"test",t:"الاختبار التشخيصي",s:"40 سؤالاً من المجالات الثلاثة لقياس مستواك قبل البداية"},
          {id:"official",type:"test",t:"أسئلة الدليلين الرسميين",s:"أسئلة دليل الهيئة (1441) ودليل قياس (1436) بإجاباتها وتبريرها"}]
    .concat(PLAN_ORDER.filter(id=>LBY[id]).map(id=>{const l=LBY[id];return {id:l.id,type:"lesson",t:l.ar,s:"المعيار "+AR(l.std)+" · "+STDS[l.std]+" · "+AR(STDW[l.std])+"%",d:l.d}}))
    .concat([
      {id:"mock1",type:"test",t:"الاختبار المحاكي 1",s:"88 سؤالاً بأوزان المعايير الرسمية · 90 دقيقة"},
      {id:"rev1",type:"review",t:"مراجعة أخطاء المحاكي 1",s:"الأخطاء + فخاخ أضعف معيارين"},
      {id:"mock2",type:"test",t:"الاختبار المحاكي 2",s:"88 سؤالاً جديداً"},
      {id:"rev2",type:"review",t:"مراجعة أخطاء المحاكي 2",s:"الأخطاء + البطاقات المستحقة"},
      {id:"mock3",type:"test",t:"الاختبار المحاكي 3",s:"آخر محاكاة قبل الاختبار"},
      {id:"final",type:"final",t:"ورقة الليلة الأخيرة",s:"كل الفخاخ في صفحة واحدة + نصائح يوم الاختبار"}
    ]);
}
function taskDone(t){
  if(t.type==="lesson") return !!(S.lessons[t.id]&&S.lessons[t.id].done);
  if(t.type==="test") return !!S.tests[t.id];
  return !!S.tasks[t.id];
}
function buildPlan(){
  const tasks=planTasks();
  const span = S.exam ? Math.max(1, diffDays(S.start,S.exam)) : 30;
  const lessons=tasks.filter(t=>t.type==="lesson"), head=tasks.filter(t=>t.id==="diag"||t.id==="official"), tail=tasks.filter(t=>t.type!=="lesson"&&!head.includes(t));
  let days=[];
  if(span>=tasks.length){
    days = tasks.map(t=>[t]);
    const extra = span-tasks.length;
    for(let i=0;i<extra;i++) days.splice(days.length-6,0,[{id:"buf"+i,type:"review",t:"يوم مراجعة",s:"مراجعة الأخطاء + البطاقات المستحقة + 20 سؤالاً سريعاً"}]);
  } else {
    let tailDays = span>=12 ? tail.map(t=>[t]) : [[tail[0]],[tail[2]],[tail[4],tail[5]]];
    if(span<6) tailDays=[[tail[0],tail[5]]];
    const lessonDays=Math.max(1, span-1-tailDays.length);
    const per=Math.ceil(lessons.length/lessonDays);
    const ld=[]; for(let i=0;i<lessons.length;i+=per) ld.push(lessons.slice(i,i+per));
    days=[head].concat(ld,tailDays);
  }
  return days.map((ts,i)=>({n:i+1,date:addDays(S.start,i),tasks:ts}));
}
function nextTask(){const t=planTasks().find(t=>!taskDone(t));return t||null}

const IC = {

/* ---------- quiz engine ---------- */
let timerId=null;
function stopTimer(){clearInterval(timerId);timerId=null}
function startSession(o){
  session = Object.assign({i:0, ans:{}, flags:{}, done:false, confirm:false}, o);
  if(session.mode==="exam"){session.end = Date.now()+session.min*60000}
  go({name:"quiz"});
}
function quizPool(filter){
  let pool=QS.filter(filter); if(!mocksDone()) pool=pool.filter(q=>!q.m); return pool;
}
function viewQuiz(){
  const s=session; if(!s) return viewPractice();
  if(s.done) return viewResults();
  const q=QBY[s.ids[s.i]], n=s.ids.length, chosen=s.ans[q.id];
  const shown = s.mode==="practice" && chosen!=null;
  const opts=q.o.map((o,i)=>{let c="opt";
    if(shown){ if(i===q.a)c+=" right"; else if(i===chosen)c+=" wrong" } else if(i===chosen)c+=" sel";
    return `<button class="${c}" data-opt="${i}" ${shown?"disabled":""}><span class="b">${LET[i]}</span><span>${esc(o)}</span></button>`}).join("");
  const answered=Object.keys(s.ans).length;
  return `<section style="padding-top:6px">
   <div class="qbar"><button class="btn sm quiet" data-act="quitQuiz">إنهاء</button>
     <div class="progress" aria-hidden="true"><i style="width:${pct(s.i+1,n)}%"></i></div>
     <span class="mono small num">${AR(s.i+1)}/${AR(n)}</span>
     ${s.mode==="exam"?`<span class="timer mono" id="timer"></span>`:""}</div>
   <div class="qcard">
     <div class="qmeta"><span class="chip"><span class="dot" style="background:var(--d${q.d})"></span>${DOM[q.d].ar}</span><span class="chip">المعيار ${AR(q.std)}</span>${q.of?`<span class="chip done">الدليل الرسمي ${AR(q.src||"")}</span>`:q.h?`<span class="chip">سؤال مشابه</span>`:""}${s.title?`<span class="small muted">${esc(s.title)}</span>`:""}</div>
     <div class="qtext">${esc(q.q)}</div>
     <div class="opts">${opts}</div>
     ${shown?`<div class="explain ${chosen===q.a?"ok":"no"}"><b>${chosen===q.a?"صحيح":"الإجابة الصحيحة: "+LET[q.a]}</b>${fmt(q.e)} <button class="btn sm quiet" data-lesson="${q.l}" style="margin-top:6px">افتح الدرس</button>${reportUI(q)}</div>`:""}
   </div>

function tickTimer(){
  const el=document.getElementById("timer"); if(!session||session.mode!=="exam"||session.done){stopTimer();return}
  const left=Math.max(0,session.end-Date.now()); const m=Math.floor(left/60000), sec=Math.floor(left%60000/1000);
  if(el){el.textContent=String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"); el.classList.toggle("low",left<5*60000)}
  if(left<=0){finishSession()}
}
function finishSession(){
  const s=session; if(!s||s.done) return;
  stopTimer(); s.done=true; if(s.ref==="diag"&&window.QXEV)QXEV("finish_diag");
  let cor=0; const byD={}, byS={};
  s.ids.forEach(id=>{const q=QBY[id], a=s.ans[id], ok=a===q.a; if(ok)cor++;
    byD[q.d]=byD[q.d]||{c:0,n:0}; byD[q.d].n++; if(ok)byD[q.d].c++;
    byS[q.std]=byS[q.std]||{c:0,n:0}; byS[q.std].n++; if(ok)byS[q.std].c++;
    if(s.mode==="exam") recordAnswer(id, ok);});
  s.score=pct(cor,s.ids.length); s.cor=cor; s.byD=byD; s.byS=byS;
  if(s.kind==="test"){ S.tests[s.ref]={score:s.score,at:todayStr(),byD,byS} }
  if(s.kind==="lesson"){ const st=S.lessons[s.ref]||(S.lessons[s.ref]={}); st.done=true; st.best=Math.max(st.best||0,s.score); st.at=todayStr() }
  if(s.kind==="daily"){ S.tasks["daily:"+todayStr()]=true }
  save(); render(); window.scrollTo(0,0);
}

  fc={lesson:lessonId||null, ids:shuffle((due.length?due:deck).map(x=>x.id)).slice(0,30), i:0, flip:false, known:0};
  go({name:"cards"});
}

function startDaily(){

  if(ds.jump!=null){ session.i=+ds.jump; session.confirm=false; return render() }
  if(ds.opt!=null && session && !session.done){
    const q=QBY[session.ids[session.i]], i=+ds.opt;

    else { session.ans[q.id]=i; }

  }

    case "reportSend":{const q=QBY[ds.id]; let ok=false; try{ if(window.goatcounter&&window.goatcounter.count){ window.goatcounter.count({path:"report/"+SITE_ID+"/"+q.l+"/"+q.id+"/"+ds.v, title:String(q.q).slice(0,140), event:true}); ok=true } }catch(e){}
      toast(ok?"شكراً، وصل البلاغ":"تعذّر إرسال البلاغ الآن"); reportOpen=null; render(); break}
    case "theme":{const n=isDark()?"light":"dark"; document.documentElement.dataset.theme=n; try{localStorage.setItem(THEME_KEY,n)}catch(e){}; renderTheme(); break}
    case "setExam":{const v=document.getElementById("examDate").value; if(!v){toast("اختر التاريخ أولاً");return} S.exam=v; if(diffDays(S.start,v)<1) S.start=todayStr(); save(); toast("حُفظ الموعد"); render(); break}
    case "restartPlan": S.start=todayStr(); save(); toast("بدأت الخطة من اليوم"); render(); break;
    case "lessonQuiz":{if(window.PW&&PW.gate("lesson:"+ds.id))break;const ids=shuffle(QS.filter(q=>q.l===ds.id&&!q.m).map(q=>q.id)); if(!ids.length){toast("لا توجد أسئلة لهذا الدرس بعد");return} startSession({mode:"practice",kind:"lesson",ref:ds.id,title:LBY[ds.id].ar,ids}); break}
    case "lessonCards": if(window.PW&&PW.gate("lesson:"+ds.id))break; startCards(ds.id); break;
    case "cardsAll": startCards(null); break;
    case "cardsAgain": startCards(fc&&fc.lesson); break;
    case "cardsHome": fc=null; render(); break;
    case "flip": fc.flip=!fc.flip; render(); break;
    case "cardYes": case "cardNo":{const id=fc.ids[fc.i]; const st=S.terms[id]||(S.terms[id]={b:0});
      if(a==="cardYes"){st.b=Math.min((st.b||0)+1,5); st.due=addDays(todayStr(),INT[st.b]); fc.known++} else {st.b=0; st.due=addDays(todayStr(),1)}
      fc.i++; fc.flip=false; save(); render(); break}
    case "quick":{
      const isStd=pr.dom.startsWith("s");
      let pool=quizPool(q=>!q.of&&(pr.dom==="all"||(isStd?q.std===pr.dom.slice(1):q.d===pr.dom))&&(!pr.hot||q.h));
      if(pr.dom==="all"&&!pr.hot){ const out=[]; SORDER.forEach(sd=>{const n=Math.max(1,Math.round(pr.n*STDW[sd]/100)); out.push(...shuffle(pool.filter(q=>q.std===sd)).slice(0,n))}); pool=out }
      const ids=shuffle(pool).slice(0,pr.n).map(q=>q.id); if(!ids.length){toast("ما فيه أسئلة بهذا الفلتر");return}
      startSession({mode:"practice",kind:"quick",title:"تدريب سريع",ids}); break}
    case "daily": startDaily(); break;
    case "similar":{const ids=window.PW?PW.similar.filter(id=>QBY[id]):shuffle(QS.filter(q=>q.h&&!q.of).map(q=>q.id)).slice(0,20); if(!ids.length)break; startSession({mode:"practice",kind:"similar",title:"الأسئلة المشابهة",ids}); break}
    case "review": startReview(); break;
    case "test": startTest(ds.id); break;
    case "next": s.i=Math.min(s.i+1,s.ids.length-1); s.confirm=false; render(); window.scrollTo(0,0); break;
    case "prev": s.i=Math.max(0,s.i-1); s.confirm=false; render(); break;
    case "flag":{const id=s.ids[s.i]; s.flags[id]=!s.flags[id]; render(); break}
    case "askSubmit": s.confirm=true; render(); break;
    case "cancelSubmit": s.confirm=false; render(); break;
    case "submit": case "finish": finishSession(); break;
    case "quitQuiz": if(s&&s.mode==="exam"&&!s.done){ if(!s.confirm){s.confirm=true;render();toast("سلّم الاختبار أو ارجع له");return} } stopTimer(); session=null; go({name:"practice"}); break;
    case "retryWrong":{const ids=s.ids.filter(id=>s.ans[id]!==QBY[id].a); startSession({mode:"practice",kind:"retry",title:"إعادة الأخطاء",ids:shuffle(ids)}); break}
    case "markFinal": S.tasks.final=true; save(); toast("ممتاز"); render(); break;
    case "copyReport":{const t=reportText(); const ta=document.getElementById("report");
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("نُسخ التقرير")).catch(()=>{ta.focus();ta.select();toast("حدّد النص وانسخه")}); break}
    case "resetAsk": resetAsk=true; render(); break;
    case "resetNo": resetAsk=false; render(); break;
    case "resetYes": resetAsk=false; S=freshState(); save(); toast("تم التصفير"); go({name:"home"}); break;
  }
});
document.addEventListener("keydown",e=>{
  if(route.name!=="quiz"||!session||session.done) return;
  const k=e.key.toUpperCase(); const map={A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3,"1":0,"2":1,"3":2,"4":3};
  if(k in map && !e.metaKey && !e.ctrlKey){const btn=document.querySelector(`[data-opt="${map[k]}"]`); if(btn&&!btn.disabled) btn.click()}
  if(e.key==="Enter"){const nb=document.querySelector('[data-act="next"],[data-act="finish"]'); if(nb) nb.click()}
});

/* ---------- boot ---------- */
function start(data){
  if(data&&data.session){session=data.session; if(data.route) route=data.route}
  else if(data&&data.route) route=data.route;
  if(data&&data.fc) fc=data.fc;
  render(); initRemote(); try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  // رابط مباشر للتشخيصي من صفحة الاختبار السريع والمنشورات: ‎…/#diag
  if(location.hash==="#diag"){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} startTest("diag")}
  // رابط مباشر لدرس من الاختبار السريع وصفحات الشرح: ‎…/#lesson-L07
  else{const m=/^#lesson-(L\d+)$/.exec(location.hash); if(m&&LBY[m[1]]){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} go({name:"lesson",id:m[1]})}}
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({route,session,fc}));
if(hot&&hot.ready) hot.ready(start); else start(hot&&hot.data||{});
})();
