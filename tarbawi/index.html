 ما عدا:",["إدراك الاحتفاظ والمعكوسية","التمركز حول الذات","الإحيائية","ظهور اللغة واللعب الرمزي"],"الاحتفاظ والمعكوسية إنجازا مرحلة العمليات المحسوسة لا ما قبلها. التمركز والإحيائية والرمز من سمات ما قبل العمليات."],["L07","","أي مما يلي ليس من أزمات النمو الثماني عند إريكسون؟",["الاحتفاظ مقابل التمركز","الثقة مقابل عدم الثقة","المبادرة مقابل الذنب","الإنتاجية مقابل الركود"],"الاحتفاظ والتمركز مفهومان عند بياجيه لا أزمتان عند إريكسون. الثلاثة الأخرى من أزماته الثماني."],["L07","","أي مما يلي لا يُعد من خصائص المراهقة؟",["بطء النمو الجسمي واستقراره","التقلب الانفعالي","الاهتمام بالمظهر وصورة الذات","الميل إلى المثالية ونقد الكبار"],"المراهقة تتميز بطفرة نمو جسمي سريعة لا ببطئه. التقلب الانفعالي والاهتمام بالمظهر والمثالية من سماتها المعروفة."],["L07","","يعتمد طالب في الصف الثاني الثانوي على وضع فروض واختبارها عقلياً قبل حل مسألة فيزياء. هذا السلوك يُصنّف ضمن:",["التفكير الافتراضي الاستنباطي في مرحلة العمليات المجردة","التفكير الحسي الحركي","التفكير ما قبل الإجرائي","التفكير المتمركز حول الذات"],"وضع الفروض واختبارها عقلياً جوهر العمليات المجردة. الحسي الحركي للرضيع، وما قبل الإجرائي للطفولة المبكرة."],["L07","","قيام الطفل في السنة الأولى من عمره برمي الأشياء وتذوقها وضربها ببعضها يُصنّف على أنه:",["استكشاف للبيئة عبر الحواس والحركة في المرحلة الحس-حركية","سلوك عدواني يحتاج تعديلاً","تعلم بالملاحظة","مظهر لفرط الحركة"],"الرضيع يعرف العالم بالحواس والأفعال الحركية؛ الرمي والتذوق استكشاف طبيعي. ليس عدواناً ولا فرط حركة ولا تعلماً بالملاحظة."],["L07","m","معلم في المرحلة المتوسطة لاحظ أن طلابه يميلون إلى مقارنة أنفسهم بأقرانهم والتأثر بأحكامهم. الإجراء الأنسب لتوظيف هذه الخاصية:",["استخدام التعلم التعاوني والأقران نماذج إيجابية","منع الحديث بين الطلاب داخل الصف","المقارنة العلنية بين درجات الطلاب لتحفيزهم","تجاهل تأثير الأقران لأنه مؤقت"],"تأثير الأقران في المراهقة قوي، فتوظيفه بالتعاون والنمذجة الإيجابية يخدم التعلم. المقارنة العلنية تجرح وتُحبط، والمنع غير واقعي."],["L07","","الفروق بين الجنسين في موعد البلوغ تتمثل في أن:",["البنات يسبقن الأولاد بنحو سنة إلى سنتين","الأولاد يسبقون البنات بنحو سنتين","الجنسين يبلغان في السن نفسها","لا علاقة للجنس بموعد البلوغ"],"تبدأ طفرة البلوغ عند البنات أبكر من الأولاد بنحو سنة إلى سنتين، وهذا يفسر تفاوت الأحجام في الصفوف العليا من الابتدائية."],["L07","m","يصنّف طفل كل الحيوانات ذات الأربع أرجل على أنها «قطط». عندما يفرّق لاحقاً بين القط والكلب ويكوّن مفهومين، يكون قد قام بعملية:",["المواءمة","التمثل","الاحتفاظ","التعميم"],"تعديل المخطط القائم وإنشاء مفهوم جديد هو المواءمة. تسمية الكلب قطاً كانت تمثلاً (إدخال الجديد في مخطط قائم). التعميم مصطلح سلوكي."],["L07","m","يقول طالب في الصف السادس «أعمل الواجب لأن المعلم يثق بي ولا أريد أن أخيب ظنه». هذا التبرير يُصنّف وفق كولبرج ضمن المستوى:",["التقليدي","ما قبل التقليدي","ما بعد التقليدي","الأخلاق الذاتية"],"إرضاء الآخرين والحفاظ على صورة الولد الطيب هو المستوى التقليدي (المرحلة 3). ما قبل التقليدي يرتبط بالعقاب والمنفعة، وما بعده بالمبادئ."],["L07","","المرحلة التي تُعد فيها اللغة والرموز واللعب الإيهامي من أهم إنجازاتها، ويغيب فيها إدراك الاحتفاظ، هي:",["ما قبل العمليات","الحس-حركية","العمليات المحسوسة","العمليات المجردة"],"ظهور الوظيفة الرمزية (اللغة واللعب الإيهامي) مع غياب الاحتفاظ سمة ما قبل العمليات (2–7)."],["L07","","تريد معلمة أن تختار أسلوباً لتعليم مفهوم الكسور لطلاب الصف الثالث. الأنسب وفق خصائص مرحلتهم:",["تقسيم تفاحة أو قطع ورقية وتناولها بأيديهم","شرح تعريف الكسر لفظياً ثم حل تمارين مجردة","عرض قاعدة عامة واستنباط الأمثلة منها","طلب تخيّل الكسر ذهنياً دون أدوات"],"طالب الثالث في المحسوسات، فالتعامل اليدوي مع المواد (التمثيل العملي عند برونر) هو الأنسب. الشرح اللفظي المجرد والاستنباط من قاعدة يناسبان مراحل أعلى."],["L07","","العوامل المؤثرة في النمو المعرفي عند بياجيه هي النضج والخبرة والتفاعل الاجتماعي و:",["الموازنة (التوازن العقلي)","التعزيز","النمذجة","الاستبصار"],"الموازنة هي العامل الرابع الذي ينظم التمثل والمواءمة عند بياجيه. التعزيز سلوكي، والنمذجة لباندورا، والاستبصار للجشطلت."],["L07","m","لاحظ معلم أن طالباً في الصف الخامس يتفوق في كرة القدم ويقود فريقه، لكنه يخجل من القراءة أمام الزملاء. أفضل توظيف لخصائص مرحلته:",["إسناد أدوار قيادية في أنشطة جماعية ترتبط بالقراءة تدريجياً","منعه من الرياضة حتى يتحسن في القراءة","إجباره على القراءة أمام الصف ليتعود","تجاهل الخجل لأنه سيزول مع العمر"],"الطفولة المتأخرة سن الجماعة والقيادة، فتوظيف قوته الاجتماعية جسر لمهارة القراءة. المنع والإجبار يضران بأزمة الكفاءة، والتجاهل لا يعالج."],["L08","h","قسّم معلم طلابه إلى (سمعي، بصري، حسي حركي). اعتمد المعلم في تقسيمه على:",["أنماط التعلم","الذكاءات المتعددة","نظريات التعلم","أنماط الشخصية"],"التقسيم إلى سمعي وبصري وحسي حركي هو تصنيف أنماط التعلم (نموذج VAK). أما الذكاءات المتعددة فتصنيف جاردنر (لغوي، منطقي رياضي، مكاني…)، وأنماط الشخصية تصنيف للسمات لا لطرق تلقي المعلومات."],["L08","h","المتعلم الذي يفضّل تلقي المعلومات عن طريق القراءة والرسوم التوضيحية والخرائط نمطه:",["بصري","سمعي","حسي حركي","اجتماعي"],"الصور والرسوم والخرائط والقراءة مدخل النمط البصري. السمعي يفضل الشرح والمناقشة، والحسي التجربة والحركة."],["L08","h","يمكن التنبؤ بأن درجة طالب حصل على 110 في اختبار ذكاء، عند إعادة قياسه بعد سنوات، ستكون غالباً:",["قريبة من 110 لأن نسبة الذكاء ثابتة نسبياً","أعلى بكثير لأنها ترتفع بالعمر","أقل بكثير لأنها تنخفض بالعمر","لا يمكن التنبؤ بها إطلاقاً"],"نسبة الذكاء محسوبة بالنسبة لأقران العمر فتبقى ثابتة نسبياً عبر الزمن، مع تغيرات طفيفة."],["L08","","تريد معلمة الصف الخامس تحقيق هدف واحد (فهم دورة الماء) لطلاب متفاوتين، فقدمت المحتوى بنص وفيديو ومجسم، وسمحت للطلاب باختيار منتج (ملصق، عرض، تجربة). هذا تطبيق لـ:",["التعليم المتمايز","التعلم للإتقان","التعليم المبرمج","التعلم التعاوني"],"هدف واحد مع تنويع المحتوى والعملية والمنتج وفق الاستعداد والاهتمام هو التمايز (توملينسون). الإتقان يركز على الزمن حتى الإتقان، والمبرمج خطوات صغيرة."],["L08","m","الأبعاد التي يمكن للمعلم أن يمايز فيها وفق توملينسون هي المحتوى والعملية والمنتج و:",["بيئة التعلم","الأهداف العامة للمقرر","درجات الاختبار النهائي","المنهج الرسمي"],"أبعاد التمايز الأربعة: المحتوى، العملية، المنتج، بيئة التعلم. الأهداف والمنهج الرسمي لا تتغير بين الطلاب."],["L08","m","أي الممارسات تتعارض مع فلسفة التعليم المتمايز؟",["تقسيم الطلاب دائماً إلى مجموعات ثابتة حسب ذكائهم","تنويع طرق عرض المحتوى","السماح بمنتجات مختلفة لإثبات التعلم","تكوين مجموعات مرنة تتغير بحسب المهمة"],"التمايز يقوم على مجموعات مرنة لا تصنيف دائم يوصم الطالب. الباقي من ممارساته."],["L08","","يرغب معلم في أن يبقى طلابه الموهوبون في صفهم مع تعميق خبراتهم بمشاريع بحثية وتوسيع موضوعات المنهج. الأسلوب الذي يستخدمه:",["الإثراء","التعجيل","التجميع","الدمج الجزئي"],"الإثراء يعمّق (رأسي) أو يوسّع (أفقي) الخبرة داخل الصف نفسه. التعجيل يغيّر الزمن أو الصف (قبول مبكر، تخطي صفوف، ضغط المنهج)، والتجميع يعزلهم في مجموعات خاصة، والدمج الجزئي مصطلح يخص ذوي الإعاقة."],["L08","m","نقلت مدرسة طالباً موهوباً من الصف الرابع إلى السادس مباشرة بعد تقييم شامل. يُصنّف هذا الإجراء ضمن:",["التعجيل (تخطي الصفوف)","الإثراء الرأسي","التجميع","الدمج الجزئي"],"تخطي الصفوف أحد صور التعجيل مع القبول المبكر وضغط المنهج. الإثراء يبقي الطالب في صفه."],["L08","","أي الآتي يُعد من صور التعجيل الدراسي للموهوبين؟",["ضغط المنهج ودراسته في زمن أقل","تكليف الطالب بتمارين إضافية من النوع نفسه","جعل الطالب مساعداً للمعلم","إعفاؤه من الواجبات"],"ضغط المنهج صورة من التعجيل. التمارين المكررة والمساعدة والإعفاء ممارسات خاطئة مع الموهوب."],["L08","","وفق نموذج رنزولي للحلقات الثلاث، تتكوّن الموهبة من تفاعل:",["قدرة فوق المتوسط والإبداع والالتزام بالمهمة","الذكاء والتحصيل والوراثة","الطلاقة والمرونة والأصالة","الذاكرة والانتباه والإدراك"],"حلقات رنزولي: قدرة فوق المتوسط، إبداع، التزام بالمهمة (الدافعية). الطلاقة والمرونة مكونات الإبداع وحده."],["L08","m","يريد معلم ترشيح طلاب لبرنامج الموهوبين. الإجراء الأدق:",["الاعتماد على محكات متعددة: قدرات وتحصيل وإبداع وملاحظة الأداء","اختيار أعلى الطلاب في درجات الاختبار النهائي فقط","اختيار الأكثر هدوءاً والتزاماً","اختيار من يطلب أولياء أمورهم ذلك"],"الكشف عن الموهبة يتطلب محكات متعددة لأن التحصيل وحده قد يخفي موهوباً ذا صعوبات أو ملل. الهدوء وطلب الأهل ليسا محكين."],["L08","","موهوب في الصف الثاني المتوسط يشعر بالملل ويسبب إزعاجاً لأنه ينهي المهام قبل زملائه. الإجراء الأنسب:",["تقديم مهام أعمق وأكثر تحدياً ترتبط بالدرس","تكليفه بحل المزيد من التمارين نفسها","معاقبته على الإزعاج","نقله إلى آخر الصف ليشغل نفسه"],"الملل سببه عدم التحدي، فالحل إثراء رأسي بمهام أعمق. التمارين المكررة تزيد الملل، والعقاب يعالج العرض لا السبب."],["L08","","من الخصائص العقلية للطالب الموهوب:",["نمو لغوي مبكر وذاكرة قوية وفضول غير عادي","بطء في اكتساب المفردات","الحاجة إلى تكرار كثير لفهم المفاهيم","تجنب الأسئلة والمشكلات المعقدة"],"الموهوب يتميز بالنمو اللغوي المبكر والذاكرة والفضول وحب التحدي. الباقي عكس خصائصه."],["L08","m","لاحظ معلم أن طالباً في الصف الثاني الابتدائي يقلب الحروف عند القراءة (ب/ت، د/ذ) ويقرأ ببطء شديد رغم ذكائه الواضح وفهمه عند الاستماع. الحالة الأقرب:",["عسر القراءة (ديسلكسيا)","بطء تعلم","إعاقة بصرية","تأخر دراسي"],"قلب الحروف وبطء القراءة مع ذكاء عادي وفهم سمعي جيد علامات الديسلكسيا (صعوبة أكاديمية). بطء التعلم ضعف عام، والإعاقة البصرية تظهر في كل مهام الرؤية."],["L08","","صعوبة الكتابة ورداءة الخط وتنظيم الحروف مع سلامة الذكاء تُسمى:",["ديسغرافيا","ديسلكسيا","ديسكالكوليا","ديسفازيا"],"الديسغرافيا عسر الكتابة. الديسلكسيا قراءة، والديسكالكوليا حساب، والديسفازيا اضطراب لغوي."],["L08","m","أي الإجراءات أنسب لمعلم لديه طالب مشخص بصعوبات تعلم في القراءة داخل الصف العادي؟",["تكييف المهام (نصوص أقصر، وقت أطول، قراءة التعليمات له) والتنسيق مع معلم غرفة المصادر","إعفاؤه من كل مهام القراءة","نقله إلى معهد للتربية الفكرية","تكليفه بالقراءة أمام الصف ليتدرب"],"ذو الصعوبات يبقى في صفه مع تكييفات وخدمة غرفة المصادر. الإعفاء يحرمه، والتربية الفكرية للإعاقة العقلية، والقراءة العلنية تحرجه."],["L08","","طالب لا يستطيع الجلوس في مكانه، يقاطع كثيراً، ويجيب قبل اكتمال السؤال، وينسى أدواته باستمرار. السمات تشير إلى:",["فرط الحركة وتشتت الانتباه","التوحد","بطء التعلم","الإعاقة الفكرية"],"النشاط الزائد والاندفاعية وضعف الانتباه هي الثلاثية المميزة لاضطراب فرط الحركة وتشتت الانتباه. التوحد يتميز بقصور التواصل والسلوك النمطي."],["L08","m","طفل في الروضة لا يستجيب لاسمه، ويتجنب التواصل البصري، ويكرر رصف المكعبات بالطريقة نفسها ويضطرب عند تغيير الروتين. المعلمة تشتبه في:",["اضطراب طيف التوحد","فرط الحركة","الإعاقة السمعية فقط","صعوبات التعلم"],"قصور التواصل الاجتماعي والسلوك النمطي ومقاومة التغيير هي السمات المميزة للتوحد. الإعاقة السمعية لا تفسر السلوك النمطي، وصعوبات التعلم لا تُشخص في الروضة بهذه الصورة."],["L08","","لاحظ معلم الصف الأول علامات تشير إلى إعاقة محتملة لدى طالب. الخطوة الأولى الصحيحة:",["تسجيل ملاحظاته وإحالة الطالب إلى المختص في المدرسة","إبلاغ ولي الأمر بأن ابنه معاق","تشخيص الحالة بنفسه وتعديل المنهج","تجاهل الأمر لأن الطفل ما زال صغيراً"],"دور معلم الصف العادي الملاحظة والإحالة؛ التشخيص للمختص. إخبار الأهل بحكم غير مؤكد ضار، والتجاهل يضيّع التدخل المبكر."],["L08","m","لديك طالب ضعيف السمع في صفك. الإجراء الأنسب:",["إجلاسه في المقدمة ومواجهته عند الكلام واستخدام الوسائل البصرية","إجلاسه في الخلف لتقليل الإحراج","رفع الصوت طوال الحصة فقط","إعفاؤه من الأنشطة الشفهية"],"المقدمة ومواجهة الوجه (لقراءة الشفاه) والوسائل البصرية تعوض القصور السمعي. رفع الصوت وحده غير كافٍ، والإعفاء يحرمه."],["L08","","الطريقة التي يعتمد عليها المكفوفون في القراءة والكتابة هي:",["برايل","لغة الإشارة","قراءة الشفاه","الكتابة الصوتية"],"برايل نظام نقاط بارزة للمكفوفين. لغة الإشارة وقراءة الشفاه للصم وضعاف السمع."],["L08","","تُعرَّف الإعاقة الفكرية (العقلية) بانخفاض الذكاء عن 70 تقريباً مع قصور في:",["السلوك التكيفي قبل سن الثامنة عشرة","القدرات الحركية فقط","الحواس البصرية والسمعية","التحصيل في مادة واحدة"],"التعريف يشترط انخفاض الذكاء وقصور السلوك التكيفي خلال فترة النمو. القصور في مادة واحدة يشير إلى صعوبات التعلم."],["L08","","متلازمة داون سببها:",["خلل كروموسومي (نسخة زائدة من الكروموسوم 21)","حرمان بيئي في الطفولة","إصابة في الرأس بعد الولادة","سوء تغذية الأم فقط"],"متلازمة داون اضطراب وراثي كروموسومي يسبب إعاقة فكرية بدرجات متفاوتة."],["L08","m","أي الفئات التالية تُعد من ذوي الاحتياجات الخاصة؟",["الموهوبون","الطلاب المتوسطون في التحصيل","الطلاب كثيرو الغياب","الطلاب الجدد في المدرسة"],"ذوو الاحتياجات الخاصة كل من ينحرف عن المتوسط ويحتاج خدمات خاصة، وتشمل الموهوبين لا ذوي الإعاقة فقط."],["L08","","الطالب الذي تتراوح نسبة ذكائه بين 70 و85 تقريباً ويتدنى تحصيله في جميع المواد يُصنّف:",["بطيء التعلم","ذا صعوبات تعلم","موهوباً متدني التحصيل","معاقاً فكرياً"],"نسبة الذكاء الحدّية (70–85 تقريباً) مع تدنٍّ في جميع المواد هي سمة بطء التعلم. أما صعوبات التعلم فذكاؤها عادي أو فوق العادي والتدني في مجال محدد، والإعاقة الفكرية دون 70 مع قصور في السلوك التكيفي، والموهوب ذكاؤه مرتفع وإن انخفض تحصيله."],["L08","","معلمة لديها طالبة بطيئة التعلم. أي الإجراءات أنسب؟",["تبسيط المادة وتجزئتها وإعطاؤها وقتاً أطول مع تكرار وتعزيز","تكليفها بالمهام نفسها بالسرعة نفسها احتراماً للمساواة","تحويلها إلى معهد التربية الفكرية","إعفاؤها من الاختبارات"],"بطيء التعلم يحتاج تبسيطاً وتجزئة ووقتاً وتكراراً داخل الصف العادي. المعاهد للإعاقة الفكرية، والإعفاء لا يعلّم."],["L08","","أي العبارات تصف الفروق الفردية وصفاً صحيحاً؟",["فروق كمية في الدرجة تتوزع توزيعاً اعتدالياً","فروق نوعية تجعل كل فرد فئة مستقلة","تقتصر على القدرات العقلية","تنتج عن الوراثة وحدها"],"الفروق كمية (درجة لا نوع) وتوزيعها اعتدالي، وتشمل كل السمات، وتنتج عن تفاعل الوراثة والبيئة."],["L08","m","طالب متفوق في اللغة العربية وضعيف جداً في الرياضيات. هذا مثال على:",["الفروق داخل الفرد","الفروق بين الأفراد","صعوبات التعلم بالضرورة","بطء التعلم"],"تفاوت قدرات الطالب نفسه بين مجال وآخر هو الفروق داخل الفرد. لا يُحكم بصعوبات تعلم إلا بتشخيص."],["L08","","أي طرق التدريس التالية أقل مراعاة للفروق الفردية؟",["المحاضرة والإلقاء","التعليم المبرمج","الموديولات التعليمية","الصف المقلوب"],"المحاضرة تقدم المحتوى نفسه بالسرعة نفسها للجميع. المبرمج والموديولات والصف المقلوب تتيح السير بالسرعة الذاتية."],["L08","m","عرض معلم الدرس شرحاً شفهياً ثم خريطة مفاهيم ثم نشاطاً يدوياً. ما الأساس التربوي لهذا التنويع؟",["مراعاة أنماط التعلم المختلفة (سمعي، بصري، حسي)","تطبيق جداول التعزيز المتغيرة","إشباع الحاجات الفسيولوجية","تحقيق الانطفاء التدريجي"],"تنويع قنوات العرض يخاطب الأنماط السمعية والبصرية والحسية. التعزيز والانطفاء مفاهيم سلوكية لا تتصل بالعرض."],["L08","","يحب طالب تصنيف النباتات والحشرات ويقضي وقته في ملاحظة الطيور. وفق جاردنر، يبرز لديه الذكاء:",["الطبيعي","المكاني","الجسمي الحركي","الذاتي"],"الاهتمام بالكائنات الحية وتصنيفها من الذكاء الطبيعي. المكاني للأشكال والأبعاد، والجسمي للحركة."],["L08","m","طالبة تفهم مشاعر زميلاتها وتحل خلافاتهن وتقود مجموعتها بسهولة. يبرز لديها الذكاء:",["الاجتماعي (بين الأشخاص)","الذاتي (ضمن الشخص)","اللغوي","المنطقي الرياضي"],"فهم الآخرين والتأثير فيهم هو الذكاء الاجتماعي. الذاتي يخص فهم النفس."],["L08","","المدى الذي يُعرَّف بأنه الفرق بين أقل درجة وأعلى درجة في توزيع صفة ما يصف:",["اتساع الفروق الفردية في تلك الصفة","متوسط الفروق الفردية","ثبات الصفة عبر الزمن","صدق قياس الصفة"],"المدى مقياس تشتت يبين اتساع الفروق بين الأفراد في الصفة."],["L08","m","أي المواقف يدل على أن المعلم يطبق الدمج الأكاديمي الكلي؟",["طالب من ذوي الإعاقة يدرس كل المواد في الفصل العادي مع خدمات مساندة","طالب يدرس في فصل خاص داخل المدرسة ويشارك الزملاء في الفسحة فقط","طالب يدرس في معهد مستقل","طالب يخرج إلى غرفة المصادر معظم اليوم"],"الدمج الكلي يعني تلقي كل التعليم في الفصل العادي مع دعم. المشاركة في الفسحة فقط دمج اجتماعي، والمعهد عزل، وغرفة المصادر معظم اليوم دمج جزئي."],["L08","","أفضل أداة للاستدلال على وجود صعوبات تعلم معرفية لدى المتعلم مقارنةً بقدرته:",["الاختبارات التحصيلية والتشخيصية","مقياس الاتجاه","استبانة الميول","مقياس تقدير الذات"],"الفجوة بين القدرة والتحصيل تُكشف بالاختبارات التحصيلية والتشخيصية. مقاييس الاتجاه والميول والذات لا تقيس التحصيل."],["L08","","الوثيقة المكتوبة التي تحدد الأهداف والخدمات والتعديلات لطالب من ذوي الاحتياجات الخاصة تُسمى:",["الخطة التربوية الفردية","جدول المواصفات","الخطة الفصلية","السجل القصصي"],"الخطة التربوية الفردية تُعدّ لكل طالب من ذوي الاحتياجات الخاصة. جدول المواصفات لبناء الاختبار، والخطة الفصلية لعموم الصف."],["L08","","طالب يرفض كل تغيير في ترتيب مقاعد الصف ويصاب بنوبة انزعاج عند تغيير الجدول. أنسب إجراء للمعلم:",["تثبيت الروتين وإعلام الطالب مسبقاً بأي تغيير بجدول بصري","تغيير الترتيب باستمرار ليعتاد","تجاهل انزعاجه حتى يتوقف","معاقبته على النوبات"],"مقاومة التغيير سمة التوحد، والتعامل معها بالروتين والتهيئة المسبقة بالجداول البصرية (التعلم المنظم). التغيير المستمر والعقاب يزيدان الاضطراب."],["L08","","أي العبارات صحيحة عن الموهوبين داخل الفصول العادية؟",["قد يعانون الملل وضعف التحدي ما لم تُقدم لهم أنشطة إثرائية","لا يحتاجون أي خدمات خاصة لأنهم متفوقون","يُكتشفون دائماً بدرجات الاختبار","ينبغي عزلهم دائماً في فصول خاصة"],"الموهوب يحتاج إثراءً وإلا ملّ وربما انخفض تحصيله. التحصيل وحده لا يكشف كل الموهوبين، والعزل الدائم ليس الخيار الأفضل."],["L08","m","تلاحظ معلمة أن طالبة موهوبة تنتقد عملها بقسوة وتتوتر من أي خطأ صغير ولا تسلّم المهمة إلا «مثالية». هذا يعكس من خصائص الموهوبين:",["الكمالية والحساسية المفرطة","بطء التعلم","ضعف الدافعية","العجز المتعلم"],"الكمالية والحساسية المفرطة من الخصائص الانفعالية للموهوبين وقد تسبب القلق. العجز المتعلم توقف عن المحاولة، وهي عكس ذلك."],["L09","h","عرض المعلم فيلماً يبين تجاذب وتنافر بعض الأجسام تمهيداً لدراسة الشحنات الكهربائية. ما قام به المعلم حسب نظرية التعلم ذي المعنى يُسمى:",["منظماً متقدماً","تثبيتاً","تعزيزاً","كفاية ذاتية"],"المادة التمهيدية العامة التي تُعرض قبل الدرس لربطه بالبنية المعرفية هي المنظم المتقدم عند أوزوبل. التعزيز سلوكي والكفاية الذاتية لباندورا."],["L09","h","ترى نظرية التعلم أن التعلم يحدث من خلال التفاعل الاجتماعي والتعاون والحوار مع الأكثر خبرة. هذه هي:",["البنائية الاجتماعية (فيجوتسكي)","البنائية المعرفية (بياجيه)","السلوكية (سكنر)","الجشطلت"],"فيجوتسكي يرى التعلم اجتماعياً أولاً عبر الحوار والمساعدة في منطقة النمو القريب. بياجيه يركز على البناء الفردي."],["L09","h","مسح رأس الطالب والابتسام له بعد سلوكه الحسن يُعد من المعززات:",["الاجتماعية","المادية","الرمزية","النشاطية"],"اللمسة والابتسامة والمدح معززات اجتماعية. المادية هدايا، والرمزية نجوم تُستبدل، والنشاطية وقت لعب."],["L09","h","من أدوار المعلم وفق النظرية البنائية:",["ميسّر ينظم بيئة تعلم يبني فيها الطالب معرفته","ملقّن ينقل المعرفة ويتحكم في التعزيز","مصدر وحيد للمعلومات","مراقب للاستجابات الظاهرة فقط"],"البنائية تجعل المعلم ميسراً والطالب بانياً نشطاً. الأدوار الأخرى سلوكية."],["L09","","لاحظ معلم أن طالباً يرفع يده كثيراً فشكره أمام زملائه، فازداد رفعه ليده. الإجراء الذي قام به المعلم:",["تعزيز موجب","تعزيز سالب","عقاب سالب","انطفاء"],"الشكر مثير سارّ أُضيف بعد السلوك فزاد، وهذا التعزيز الموجب. التعزيز السالب إزالة منفّر، والعقاب السالب سحب معزّز."],["L09","h","لم يؤدِّ طالب واجبه، فحرمه المعلم من حصة الرياضة التي كان ينتظرها ذلك اليوم، فقلّ إهماله للواجبات بعدها. يُصنّف هذا الإجراء:",["تكلفة استجابة (عقاب سالب)","تعزيز سالب","عقاب موجب","تشكيل"],"سحب امتياز مكتسب (حصة الرياضة) بعد السلوك غير المرغوب فقلّ السلوك = تكلفة الاستجابة، وهي صورة من العقاب السالب. التعزيز السالب إزالة منفّر فيزيد السلوك، والعقاب الموجب إضافة منفّر."],["L09","m","يصرخ طالب لجذب الانتباه، فاتفق المعلم مع الصف على تجاهل صراخه تماماً والالتفات إليه عندما يتكلم بهدوء. الإجراء مع الصراخ:",["انطفاء","عقاب موجب","تعزيز سالب","إقصاء"],"وقف التعزيز (الانتباه) عن السلوك فيتلاشى = انطفاء، مع تعزيز السلوك البديل (تعزيز تفاضلي). الإقصاء يتطلب إبعاده."],["L09","","أخرج المعلم طالباً مشاغباً من مجموعة اللعب ليجلس وحده دقائق بعيداً عن النشاط. يُصنّف هذا:",["إقصاء (وقت مستقطع)","تكلفة استجابة","تعزيز سالب","انطفاء"],"الإبعاد المؤقت عن مصدر التعزيز هو الإقصاء. تكلفة الاستجابة خسارة شيء مكتسب كالدرجات."],["L09","m","يعطي معلم نجمة بعد كل خمس إجابات صحيحة بالضبط. جدول التعزيز المستخدم:",["نسبة ثابتة","نسبة متغيرة","فترة ثابتة","فترة متغيرة"],"التعزيز بعد عدد ثابت من الاستجابات = نسبة ثابتة. الفترة ترتبط بالزمن، والمتغيرة بعدد غير منتظم."],["L09","","يفاجئ المعلم طلابه باختبارات قصيرة في أوقات غير متوقعة فيستمر استذكارهم طوال الفصل. جدول التعزيز الأقرب:",["فترة متغيرة","فترة ثابتة","نسبة ثابتة","تعزيز مستمر"],"الاختبارات في أوقات زمنية غير منتظمة = فترة متغيرة، وتحافظ على أداء مستمر. الفترة الثابتة (كل أسبوع) تجعل الاستذكار يتركز قبل الموعد."],["L09","","أي جداول التعزيز أكثر مقاومة للانطفاء ويُنتج أعلى معدل استجابة؟",["النسبة المتغيرة","النسبة الثابتة","الفترة الثابتة","التعزيز المستمر"],"النسبة المتغيرة (كألعاب الحظ) الأقوى وأكثرها مقاومة للانطفاء. المستمر أسرع تعلماً لكنه أسرع انطفاءً."],["L09","m","يلاحظ معلم أن طلابه يذاكرون بكثافة قبل اختبار الشهر فقط ثم يتوقفون بعده. هذا النمط ينتج عن جدول تعزيز:",["الفترة الثابتة","النسبة المتغيرة","الفترة المتغيرة","المستمر"],"التعزيز بعد زمن ثابت يُنتج نمط «الحافة»: ارتفاع الأداء قبل الموعد وانخفاضه بعده."],["L09","m","يريد معلم تعليم طفل في الروضة كتابة اسمه. بدأ بتعزيزه عند مسك القلم، ثم عند رسم خط، ثم عند كتابة حرف، حتى كتب الاسم كاملاً. الإجراء:",["تشكيل","تسلسل","نمذجة","تعميم"],"تعزيز التقريبات المتتابعة نحو السلوك النهائي هو التشكيل. التسلسل ربط خطوات مكتملة، والنمذجة ملاحظة نموذج."],["L09","","يستخدم معلم بطاقات نقاط يجمعها الطلاب ويستبدلونها آخر الأسبوع بامتيازات. هذا النظام:",["الاقتصاد الرمزي","التعزيز السالب","مبدأ بريماك","العقد السلوكي"],"الرموز القابلة للاستبدال بمعززات هي الاقتصاد الرمزي. بريماك نشاط محبب يعزز نشاطاً آخر، والعقد اتفاق مكتوب."],["L09","m","يشعر طالب بالخوف من حصة الرياضيات بعد تعرضه للتوبيخ المتكرر فيها، وبدأ يخاف من كل حصة تُعرض فيها أرقام. انتقال الخوف إلى الحصص المشابهة يُسمى:",["التعميم","التمييز","الانطفاء","الاسترجاع التلقائي"],"إصدار الاستجابة الشرطية لمثيرات تشبه المثير الأصلي هو التعميم. التمييز عكسه."],["L09","","تعلم طفل الخوف من الطبيب ذي المعطف الأبيض، لكنه لا يخاف من والده عندما يلبس معطفاً أبيض. هذا يدل على:",["التمييز","التعميم","الانطفاء","الإشراط من الدرجة الثانية"],"الاستجابة للمثير الأصلي دون المشابه هي التمييز."],["L09","m","توقف طالب عن الخوف من قاعة الاختبار بعد عدة اختبارات مرت دون توبيخ، ثم عاد الخوف فجأة بعد إجازة طويلة. عودة الخوف تُسمى:",["الاسترجاع التلقائي","التعميم","التمييز","الكف"],"عودة الاستجابة المنطفئة بعد فترة راحة هي الاسترجاع التلقائي عند بافلوف."],["L09","","في الإشراط الكلاسيكي، صوت الجرس الذي صار يستدعي اللعاب بعد اقترانه بالطعام يُسمى:",["مثيراً شرطياً","مثيراً غير شرطي","استجابة شرطية","استجابة غير شرطية"],"الجرس مثير محايد صار شرطياً. الطعام غير شرطي، واللعاب للجرس استجابة شرطية."],["L09","m","يعلّم معلم جدول الضرب بتكرار التسميع مع مدح كل إجابة صحيحة ومراعاة الاستعداد. يستند هذا إلى قوانين:",["ثورندايك (الأثر والتدريب والاستعداد)","الجشطلت","فيجوتسكي","أوزوبل"],"التكرار (قانون التدريب)، والمدح (قانون الأثر)، والاستعداد هي قوانين ثورندايك."],["L09","","مؤسس المدرسة السلوكية الذي أجرى تجربة الطفل ألبرت وقال إن الانفعالات تُتعلم بالإشراط:",["واطسون","بافلوف","ثورندايك","تولمان"],"واطسون مؤسس السلوكية ومعه تجربة ألبرت الصغير. تولمان معرفي (التعلم الكامن)."],["L09","","فئران تولمان التي تجولت في المتاهة دون تعزيز ثم تحسن أداؤها فجأة عند تقديم الطعام تمثل ظاهرة:",["التعلم الكامن (تولمان)","الاستبصار","الانطفاء","التعزيز البديل"],"التعلم حدث دون تعزيز وظهر عند وجود الدافع: التعلم الكامن والخرائط المعرفية عند تولمان."],["L09","m","بعد محاولات عديدة فاشلة، توقف طالب عن حل لغز هندسي، ثم صاح فجأة «فهمت!» ورسم الحل كاملاً. التعلم هنا بـ:",["الاستبصار","المحاولة والخطأ","التشكيل","التلقين"],"الحل المفاجئ بعد إعادة تنظيم الموقف هو الاستبصار (الجشطلت/كوهلر). المحاولة والخطأ تدريجي."],["L09","","يبدأ معلم كل وحدة بعرض خريطة مفاهيم عامة تبين علاقة الدرس الجديد بما سبق، ثم يفصّل. ما يقوم به المعلم:",["منظم متقدم (أوزوبل)","تعزيز متقطع","استبصار","سقالات"],"الإطار العام المقدّم قبل الدرس لربطه بالبنية المعرفية هو المنظم المتقدم. السقالات دعم أثناء الأداء."],["L09","m","يكتفي طلاب بحفظ تعريف الاحتكاك دون ربطه بما يعرفونه عن الحركة. وفق أوزوبل، نوع تعلمهم:",["تعلم صمّ (استظهاري) بالاستقبال","تعلم ذو معنى بالاستقبال","تعلم ذو معنى بالاكتشاف","تعلم كامن"],"الحفظ دون ربط بالبنية المعرفية هو التعلم الاستظهاري (الصمّ) بالاستقبال. ذو المعنى يربط الجديد بالقديم."],["L09","","يعرض معلم العلوم المفهوم بمجسم يتعامل معه الطلاب بأيديهم، ثم بصور ورسوم، ثم بالمعادلة الرمزية. هذا التدرج وفق:",["برونر (العملي ثم الأيقوني ثم الرمزي)","بياجيه (الحس-حركي ثم المجرد)","سكنر (التعليم المبرمج)","باندورا (النمذجة)"],"التدرج من التمثيل العملي إلى الأيقوني إلى الرمزي هو ترتيب برونر لأنماط التمثيل."],["L09","","المنهج الذي تعود فيه المفاهيم الأساسية بعمق أكبر في كل صف دراسي يُسمى عند برونر:",["المنهج الحلزوني","المنهج المحوري","منهج النشاط","المنهج المدمج"],"الحلزوني تنظيم برونر لتكرار المفاهيم بتعمق متزايد."],["L09","m","يطلب معلم من طلابه حفظ رقم مكوّن من عشرة أرقام فيفشل معظمهم، ثم يعرضه مقسماً إلى ثلاث مجموعات فينجحون. الاستراتيجية التي ساعدتهم:",["التجميع (التقطيع)","التسميع","التنظيم الهرمي","الترميز المزدوج"],"تجميع الوحدات المتفرقة في وحدات أكبر يوسع سعة الذاكرة العاملة (7±2). التسميع تكرار، والتنظيم الهرمي للمفاهيم."],["L09","","سعة الذاكرة قصيرة المدى (العاملة) تقدَّر بنحو:",["7±2 وحدات","غير محدودة","وحدة واحدة","50 وحدة"],"ميلر: 7±2 وحدات لمدة 15–30 ثانية. غير المحدودة هي طويلة المدى."],["L09","m","تعلم طالب قائمة كلمات فرنسية ثم قائمة إسبانية، فوجد أن الإسبانية جعلته ينسى الفرنسية. نوع التداخل:",["تداخل بعدي (رجعي)","تداخل قبلي","اضمحلال","كبت"],"التعلم الجديد (الإسبانية) أعاق تذكر القديم (الفرنسية) = تداخل بعدي. القبلي القديم يعيق الجديد."],["L09","","عندما يكتب المعلم أرقاماً على السبورة ويطلب حفظها بسرعة دون ورقة، ثم يمسحها، فإن ما يختبره لدى الطلاب هو:",["الذاكرة قصيرة المدى (العاملة)","الذاكرة طويلة المدى","الذاكرة الإجرائية","الذاكرة الحسية فقط"],"الاحتفاظ بالمعلومات ثوانٍ قليلة ومعالجتها دون تثبيت عمل الذاكرة العاملة."],["L09","","مراحل التعلم بالملاحظة عند باندورا بالترتيب:",["الانتباه ← الاحتفاظ ← الإنتاج ← الدافعية","الدافعية ← الانتباه ← الاحتفاظ ← الإنتاج","الاحتفاظ ← الانتباه ← الدافعية ← الإنتاج","الإنتاج ← الانتباه ← الاحتفاظ ← الدافعية"],"يبدأ الملاحظ بالانتباه للنموذج ثم الاحتفاظ بالصورة ثم إنتاج السلوك ثم الدافعية لأدائه."],["L09","","رأى طالب زميله يُكافأ على ترتيب أدواته فبدأ يرتب أدواته هو أيضاً. ما حدث له:",["تعزيز بديل","تعزيز موجب مباشر","استبصار","تمييز"],"زيادة سلوك الملاحظ بعد رؤية النموذج يُعزز هي التعزيز البديل (باندورا). التعزيز المباشر يقتضي أن يُكافأ هو."],["L09","m","طالب يعتقد أنه لن ينجح في الرياضيات مهما حاول، رغم قدرته. وفق باندورا، أفضل طريقة لرفع كفاءته الذاتية:",["إتاحة خبرات نجاح متدرجة وإبراز نماذج مشابهة له نجحت","إخباره بأنه ذكي فقط","تقليل التوقعات منه","مقارنته بالمتفوقين"],"أقوى مصادر الكفاءة الذاتية خبرات الإتقان ثم الخبرات البديلة. الإقناع اللفظي وحده ضعيف، والمقارنة تضعفها."],["L09","m","يسمي طفل في الروضة الحمار الوحشي «حصاناً مخططاً». وفق بياجيه، الطفل يقوم بـ:",["التمثل","المواءمة","الموازنة","التعميم الشرطي"],"إدخال الخبرة الجديدة في مخطط قائم (الحصان) دون تعديله هو التمثل. لو كوّن مفهوماً جديداً لكان مواءمة."],["L09","","لاحظ معلم أن طالباً يستطيع حل مسألة من خطوتين وحده، ويحل مسألة من أربع خطوات بتلميحات منه. وفق فيجوتسكي، ينبغي أن يوجه المعلم تدريسه إلى:",["مسائل الأربع خطوات مع دعم يتناقص تدريجياً","مسائل الخطوتين فقط حتى يتقنها تماماً","مسائل من ثماني خطوات ليتحدى نفسه","ترك الطالب يختار بنفسه دائماً"],"التدريس الفعال يستهدف منطقة النمو القريب (ما ينجزه بالمساعدة) مع سقالات تُسحب تدريجياً. ما يتقنه وحده لا يطوره، والبعيد جداً يُحبط."],["L09","m","تقدم معلمة لطلابها قائمة تحقق وأسئلة موجهة ونماذج أثناء كتابة أول تقرير علمي، ثم تقلل هذه المساعدات في التقارير التالية. ما تقوم به:",["السقالات التعليمية","التعليم المبرمج","التعزيز المتقطع","الإثراء"],"الدعم المؤقت المتناقص مع تقدم المتعلم هو السقالات (فيجوتسكي/برونر)."],["L09","","يتحدث طفل مع نفسه بصوت مسموع وهو يركب الأحجية: «هذه هنا… لا، هناك». وفق فيجوتسكي، هذا الحديث الذاتي:",["أداة لتنظيم التفكير وتوجيه السلوك ويُعد تطوراً طبيعياً","دليل على تمركز حول الذات يجب علاجه","مظهر لتشتت الانتباه","سلوك يجب إيقافه حفاظاً على الهدوء"],"فيجوتسكي يرى الحديث الذاتي وسيلة لضبط الذات وتوجيه الفعل ويتحول لاحقاً إلى حديث داخلي. بياجيه عدّه تمركزاً، لكن السؤال عن فيجوتسكي."],["L09","","اعتاد طالب القيادة في بلد تسير فيه السيارات على اليسار، فأخطأ كثيراً عند القيادة في المملكة. هذا مثال على:",["انتقال أثر سلبي","انتقال أثر إيجابي","انتقال صفري","تعميم إيجابي"],"العادة القديمة أعاقت الأداء الجديد = انتقال سلبي."],["L09","m","تعلم الطلاب الجمع ثم انتقلوا إلى الضرب الذي يبنى عليه. نوع انتقال أثر التعلم:",["رأسي","أفقي","سلبي","صفري"],"تعلم مهارة أعلى مستوى تبنى على سابقة = انتقال رأسي. الأفقي مهارة بالمستوى نفسه في سياق آخر."],["L09","","فسّر ثورندايك انتقال أثر التعلم بوجود:",["عناصر متطابقة بين الموقفين","استبصار في الموقف الجديد","دافعية داخلية مرتفعة","منظم متقدم"],"نظرية العناصر المتطابقة لثورندايك: ينتقل الأثر بقدر تشابه عناصر الموقفين. جد فسّره بالتعميم."],["L09","","أي العبارات الآتية لا تنطبق على التعزيز السالب؟",["يقلل من احتمال تكرار السلوك","يزيد من احتمال تكرار السلوك","يتضمن إزالة مثير منفّر","يحدث بعد صدور الاستجابة"],"التعزيز بنوعيه يزيد السلوك؛ التقليل وظيفة العقاب. الالتباس الشائع هو عدّ «السالب» عقاباً."],["L09","","جميع ما يلي من مفاهيم النظرية البنائية ما عدا:",["جداول التعزيز","منطقة النمو القريب","التمثل والمواءمة","السقالات"],"جداول التعزيز من الإشراط الإجرائي. الباقي من بياجيه وفيجوتسكي."],["L09","","أي مما يلي ليس من استراتيجيات نقل المعلومات إلى الذاكرة طويلة المدى؟",["تكديس المعلومات دفعة واحدة قبل الاختبار","التسميع الموزع","التجميع","الربط بالمعرفة السابقة (التوسيع)"],"تكديس المعلومات دفعة واحدة قبل الاختبار يثقل الذاكرة العاملة ويُنسى سريعاً، فليس استراتيجية لنقلها إلى الذاكرة طويلة المدى. أما التسميع الموزع والتجميع والتوسيع (ربط الجديد بالمعرفة السابقة) فاستراتيجيات ترميز فعالة."],["L09","m","يعرض معلم طالباً متميزاً في النظافة نموذجاً أمام الصف ويمدحه، فيلاحظ تحسن نظافة الطلاب الآخرين. التفسير النظري لذلك:",["التعلم بالملاحظة والتعزيز البديل","الانطفاء","الإشراط الكلاسيكي","التعلم الكامن"],"رؤية نموذج يُعزز يزيد السلوك عند الملاحظين (باندورا)."],["L09","","بعد أن شرح المعلم مفهوماً معقداً عشرين دقيقة متواصلة لاحظ أن الطلاب توقفوا عن المتابعة. التفسير وفق معالجة المعلومات:",["تجاوز الحمل المعرفي سعة الذاكرة العاملة","انطفاء الاستجابة","ضعف قانون الاستعداد","غياب المواءمة"],"المعلومات المتواصلة الكثيفة تفوق سعة الذاكرة العاملة (الحمل المعرفي الزائد)، فالحل التقسيم والتوقف للمعالجة."],["L10","h","لكي يحافظ المعلم على مستوى مرتفع من الدافعية لدى طالب تعرض لخبرات إخفاق، فإنه استناداً إلى النظريات المعرفية في الدافعية (العزو) يقوم بـ:",["توجيه الطالب إلى عزو الفشل إلى نقص الجهد المبذول لا إلى القدرة","تعزيز أي تقدم يحققه مادياً","توفير بيئة خالية من أي نقد","تشجيعه على تكرار المحاولات دون تفسير"],"نظرية العزو (واينر): عزو الفشل إلى الجهد (متغير قابل للضبط) يدفع للمحاولة، وعزوه إلى القدرة يُحبط. التعزيز المادي سلوكي لا معرفي."],["L10","","كان طالب يرسم في البيت لمتعته، ثم بدأ المعلم يعطيه درجات على كل رسمة، فلما توقفت الدرجات توقف عن الرسم. يفسر ذلك:",["المكافآت الخارجية المفرطة أضعفت الدافعية الداخلية","الانطفاء في الإشراط الكلاسيكي","تدني الذكاء المكاني","العجز المتعلم"],"أثر التبرير الزائد: المكافأة الخارجية على نشاط محبب داخلياً تُحوّل الدافع إلى خارجي فيزول بزوالها."],["L10","m","يقول طالب بعد نجاحه: «نجحت لأن الاختبار كان سهلاً». وفق واينر، عزا نجاحه إلى سبب:",["خارجي ثابت","داخلي ثابت","داخلي متغير","خارجي متغير"],"صعوبة المهمة سبب خارجي ثابت. الحظ خارجي متغير، والجهد داخلي متغير، والقدرة داخلية ثابتة."],["L10","","يأتي طالب إلى المدرسة دون إفطار ويبدو خائفاً من زملاء يتنمرون عليه، ولا تنفع معه المكافآت لرفع تحصيله. وفق ماسلو، الخطوة الأولى:",["إشباع حاجاته الفسيولوجية وحاجة الأمن أولاً","زيادة المكافآت والدرجات","تكليفه بمهام تحقق ذاته","تجاهل الأمر لأنه خارج الصف"],"الحاجات الدنيا (طعام، أمن) تسبق الحاجات العليا؛ لا تعلم مع جوع أو خوف."],["L10","","وفق قانون يركس–دودسون، العلاقة بين مستوى القلق (الاستثارة) والأداء:",["منحنى مقلوب: الأداء الأفضل عند الاستثارة المتوسطة","خطية موجبة: كلما زاد القلق تحسن الأداء","خطية سالبة: كلما زاد القلق ساء الأداء","لا علاقة بينهما"],"الاستثارة المتوسطة تُحسّن الأداء، أما المنخفضة جداً أو المرتفعة جداً فتضعفه."],["L10","m","طالب لا يبالي بالاختبار إطلاقاً فيؤدي ضعيفاً، وآخر يرتعش من شدة القلق فينسى ما حفظ. ما ينصح به المعلم لكليهما وفق يركس–دودسون:",["رفع قلق الأول قليلاً وتهدئة الثاني للوصول إلى مستوى متوسط","إزالة القلق تماماً عند الاثنين","زيادة القلق عند الاثنين","تجاهل عامل القلق"],"الأداء الأمثل عند الاستثارة المتوسطة، فالمنخفض يُرفع والمرتفع يُخفض."],["L10","","يختار طالب ذو دافع إنجاز مرتفع المهام التي:",["متوسطة الصعوبة وتتحدى قدراته","سهلة جداً لضمان النجاح","مستحيلة ليُعذر عند الفشل","يختارها له الآخرون"],"وفق ماكليلاند وأتكنسون، ذو دافع الإنجاز المرتفع يفضل المهام متوسطة الصعوبة، ومنخفضه يختار السهل جداً أو الصعب جداً."],["L10","m","طالب هدفه من المذاكرة أن يحصل على أعلى درجة ليُظهر تفوقه، وآخر هدفه أن يفهم ويتحسن حتى لو أخطأ. وفق دويك، الأول توجهه:",["أداء، والثاني توجهه إتقان","إتقان، والثاني توجهه أداء","داخلي، والثاني خارجي","تجنب، والثاني اقتراب"],"توجه الأداء يسعى لإثبات القدرة والظهور، وتوجه الإتقان يسعى للتعلم ويرى الخطأ فرصة."],["L10","m","أي الممارسات أكثر دعماً لدافعية الطلاب في الصف؟",["تغذية راجعة فورية وصفية وأهداف قريبة قابلة للتحقيق","مقارنة درجات الطلاب علناً","مكافآت مادية لكل إجابة","تأجيل التغذية الراجعة إلى نهاية الفصل"],"التغذية الفورية الوصفية والأهداف القريبة ترفع الكفاءة الذاتية. المقارنة تُحبط، والمكافآت المفرطة تضعف الداخلية، والتأجيل يفقد الأثر."],["L10","","مصادر الكفاءة الذاتية عند باندورا هي خبرات الإتقان والخبرات البديلة والإقناع اللفظي و:",["الحالة الفسيولوجية والانفعالية","الذكاء الموروث","المستوى الاقتصادي","جداول التعزيز"],"المصدر الرابع هو الحالة الفسيولوجية والانفعالية (القلق، التعب) التي يفسرها الفرد كمؤشر على قدرته."],["L10","","واضع أول اختبار للذكاء وصاحب مفهوم العمر العقلي:",["بينيه","سبيرمان","وكسلر","جاردنر"],"بينيه (1905) وضع أول مقياس للذكاء مع سيمون. وكسلر لاحق، وسبيرمان نظرية العاملين."],["L10","","نسبة الذكاء تُحسب بالعلاقة:",["العمر العقلي ÷ العمر الزمني × 100","العمر الزمني ÷ العمر العقلي × 100","العمر العقلي − العمر الزمني","العمر العقلي + العمر الزمني ÷ 2"],"معادلة ستيرن/تيرمان: ن.ذ = ع.ع ÷ ع.ز × 100؛ فطفل عمره العقلي 12 وزمنه 10 نسبته 120."],["L10","","طفل عمره الزمني 8 سنوات وعمره العقلي 10 سنوات. نسبة ذكائه:",["125","80","100","180"],"10 ÷ 8 × 100 = 125. القسمة العكسية تعطي 80 خطأً."],["L10","m","حصل طالب على 68 في اختبار ذكاء مقنن ولديه قصور واضح في مهارات الحياة اليومية. التصنيف الأقرب:",["إعاقة فكرية","بطء تعلم","صعوبات تعلم","موهبة"],"أقل من 70 مع قصور في السلوك التكيفي = إعاقة فكرية. بطء التعلم 70–85، وصعوبات التعلم ذكاء عادي."],["L10","","نظرية الذكاء التي تفترض عاملاً عاماً (g) يشترك في جميع القدرات وعوامل خاصة (s):",["سبيرمان","ثيرستون","جاردنر","ستيرنبرغ"],"سبيرمان صاحب نظرية العاملين. ثيرستون قدرات أولية، جاردنر متعددة، ستيرنبرغ ثلاثي."],["L10","","طالب يحل مسائل جديدة غير مألوفة بسرعة لكنه ضعيف في المعلومات العامة والمفردات. وفق كاتل، يبرز لديه الذكاء:",["السائل","المتبلور","الوجداني","العملي"],"السائل قدرة فطرية على حل المشكلات الجديدة، والمتبلور معارف مكتسبة (مفردات ومعلومات)."],["L10","","نظرية بنية العقل التي صنفت القدرات في أبعاد (العمليات × المحتوى × النواتج) وفرقت بين التفكير التقاربي والتباعدي لـ:",["جيلفورد","جاردنر","ثيرستون","بينيه"],"جيلفورد صاحب نموذج بنية العقل (120–180 قدرة) والتفكير التباعدي أساس الإبداع."],["L10","","طلب المعلم من طلابه اقتراح أكبر عدد ممكن من استخدامات علبة الكرتون في دقيقتين. المهارة الإبداعية المستهدفة:",["الطلاقة","المرونة","الأصالة","التوسع"],"الطلاقة كمية الأفكار في زمن محدد. المرونة تنوعها، والأصالة ندرتها، والتوسع التفاصيل."],["L10","m","قدم طالب أفكاراً لاستخدام علبة الكرتون تنوعت بين التخزين والديكور واللعب والزراعة، بينما اقتصر زميله على أفكار التخزين. يتفوق الأول في:",["المرونة","الطلاقة","الأصالة","الحساسية للمشكلات"],"تنوع فئات الأفكار وتغيير الزاوية هو المرونة، بغض النظر عن عددها."],["L10","","قدمت طالبة فكرة لم يذكرها أحد في الصف ولم تخطر على بال المعلم. المهارة الإبداعية التي تبرز لديها:",["الأصالة","الطلاقة","المرونة","الإفاضة"],"الأصالة ندرة الفكرة وجدّتها."],["L10","m","بعد أن طرح طالب فكرة مشروع، أضاف إليها تفاصيل الخطوات والأدوات والرسوم التوضيحية. المهارة:",["الإفاضة (التوسع)","الطلاقة","المرونة","الأصالة"],"إضافة التفاصيل والتوضيحات إلى الفكرة هي الإفاضة."],["L10","","مراحل العملية الإبداعية بالترتيب:",["الإعداد ← الاحتضان ← الإلهام ← التحقق","الإلهام ← الإعداد ← الاحتضان ← التحقق","الاحتضان ← الإعداد ← التحقق ← الإلهام","الإعداد ← الإلهام ← الاحتضان ← التحقق"],"والاس: جمع المعلومات (إعداد)، ثم تركها تختمر (احتضان)، ثم ومضة الفكرة (إلهام)، ثم اختبارها (تحقق)."],["L10","","توقف باحث عن التفكير في مشكلة عالقة وذهب للمشي، ثم خطر له الحل فجأة. المرحلة التي كان فيها قبل خطور الحل:",["الاحتضان","الإعداد","التحقق","الإلهام"],"ترك المشكلة تختمر لا شعورياً هو الاحتضان الذي يسبق الإلهام."],["L10","","أي الأنشطة يُعد نشاطاً ما وراء معرفي؟",["يراجع الطالب خطته لحل المسألة ويسأل نفسه هل هذه أفضل طريقة","يقرأ الطالب النص قراءة صامتة","يحفظ الطالب القصيدة","ينسخ الطالب الدرس في دفتره"],"مراقبة الخطة وتقويمها تفكير في التفكير. القراءة والحفظ والنسخ مهارات معرفية."],["L10","m","قال طالب في نقاش: «هذه الفكرة ستفشل لأن التكلفة مرتفعة والوقت قصير». وفق القبعات الست، يفكر بالقبعة:",["السوداء","الحمراء","الصفراء","الخضراء"],"الحذر والسلبيات والمخاطر قبعة سوداء. الحمراء مشاعر، الصفراء فوائد، الخضراء إبداع."],["L10","","طلب قائد المجموعة: «لنعرض الأرقام والحقائق المتوفرة أولاً». القبعة المستخدمة:",["البيضاء","الزرقاء","الحمراء","السوداء"],"البيضاء للحقائق والمعلومات المحايدة. الزرقاء تنظم عملية التفكير."],["L10","m","قالت طالبة: «لا أعرف السبب لكنني أشعر أن هذا الحل لا يريحني». القبعة:",["الحمراء","البيضاء","الصفراء","الزرقاء"],"المشاعر والحدس دون تبرير قبعة حمراء."],["L10","","في نهاية النقاش قال المعلم: «لنلخص ما توصلنا إليه ونحدد الخطوة التالية». القبعة:",["الزرقاء","الخضراء","الصفراء","البيضاء"],"الزرقاء تضبط عملية التفكير وتنظمها وتلخص وتتخذ القرار."],["L10","","القبعة الخضراء في نموذج ديبونو تمثل:",["الإبداع والبدائل والأفكار الجديدة","الحقائق والمعلومات","السلبيات والمخاطر","الإيجابيات والفوائد"],"الخضراء لون النمو: الإبداع والاقتراحات. البيضاء حقائق، السوداء مخاطر، الصفراء فوائد."],["L10","","برنامج ديبونو لتعليم مهارات التفكير تعليماً مباشراً في وحدات (توسعة الإدراك، التنظيم، التفاعل، الإبداع…) يُسمى:",["كورت","4MAT","سكامبر","VARK"],"كورت برنامج ديبونو. 4MAT لمكارثي، سكامبر لتوليد الأفكار، VARK أنماط التعلم."],["L10","","مهارات التفكير العليا في تصنيف بلوم المعدل هي:",["التحليل والتقويم والإبداع","التذكر والفهم والتطبيق","الفهم والتطبيق والتحليل","التذكر والتقويم والإبداع"],"المستويات العليا الثلاثة: تحليل، تقويم، إبداع. الدنيا: تذكر، فهم، تطبيق."],["L10","m","طلب معلم من طلابه اختيار أفضل ثلاثة حلول من قائمة عشرين حلاً وتبرير الاختيار بمعايير. نوع التفكير:",["ناقد","إبداعي","تباعدي","حدسي"],"الفرز والمفاضلة والتقويم بمعايير تفكير ناقد (تقاربي). توليد العشرين كان إبداعياً تباعدياً."],["L10","","التفكير الذي يُنتج إجابات متعددة لمشكلة واحدة، ويُعد أساس الإبداع عند جيلفورد:",["التباعدي","التقاربي","الناقد","الاستنباطي"],"التباعدي ينطلق إلى حلول متعددة، والتقاربي يصل إلى الحل الواحد الصحيح."],["L10","m","أي أسئلة المعلم التالية أكثر تنمية للتفكير الإبداعي لدى طلاب الصف الخامس بعد قراءة قصة؟",["ماذا لو تغيرت نهاية القصة؟ اكتب نهاية أخرى","من بطل القصة؟","في أي زمن وقعت أحداث القصة؟","ما معنى الكلمة الواردة في السطر الثالث؟"],"السؤال المفتوح متعدد الإجابات (ماذا لو) يستدعي الطلاقة والأصالة. الأسئلة الأخرى استدعاء معلومات."],["L10","","أي مما يلي ليس من معوقات التفكير الإبداعي؟",["تقبل الأفكار غير المألوفة","الخوف من الخطأ","النقد المبكر للأفكار","الجمود الذهني"],"تقبل الغريب من محفزات الإبداع. الخوف والنقد المبكر والجمود معوقات."],["L10","","أي مما يلي لا يُعد من مكونات الذكاء الوجداني عند جولمان؟",["الاستدلال العددي","الوعي بالذات","التعاطف","تنظيم الانفعالات"],"الاستدلال العددي قدرة عقلية أولية عند ثيرستون. مكونات جولمان: الوعي بالذات، تنظيم الانفعالات، الدافعية، التعاطف، المهارات الاجتماعية."],["L10","","يلاحظ المعلم أن طالباً يتوتر ويغضب بسرعة عند أي تعليق من زملائه ويصعب عليه فهم مشاعرهم. الجانب الذي يحتاج تنميته:",["الذكاء الوجداني","الذكاء المنطقي الرياضي","الطلاقة اللفظية","الذكاء المكاني"],"ضبط الانفعال والتعاطف من مكونات الذكاء الوجداني (جولمان)."],["L05","h","قال تعالى: «واتقوا يوماً تُرجعون فيه إلى الله»، الفعل «ترجعون» مرفوع بـ:",["ثبوت النون","الضمة","الواو","الألف"],"ترجعون من الأفعال الخمسة لأنه مضارع اتصلت به واو الجماعة، ولم يسبقه ناصب ولا جازم فهو مرفوع بثبوت النون."],["L05","h","«ابتهجت روحي برؤية البحر ابتهاجاً»، إعراب كلمة «ابتهاجاً»:",["مفعول مطلق منصوب","مفعول به منصوب","مفعول لأجله منصوب","مفعول معه منصوب"],"«ابتهاجاً» مصدر من لفظ الفعل «ابتهجت» جاء لتوكيده فهو مفعول مطلق. المفعول لأجله يبين السبب وليس من لفظ الفعل."],["L05","h","«حضر المعلمون جميعاً»، إعراب كلمة «جميعاً»:",["حال منصوبة","توكيد معنوي","مفعول به","نعت"],"«جميعاً» من الكلمات التي تُعرب حالاً دائماً (معاً، وحده، عمداً). ولو قيل «جميعُهم» بالإضافة إلى الضمير لكانت توكيداً معنوياً."],["L05","h","«جاء ...... العلمِ»، الكلمة الصحيحة في الفراغ:",["طالبا","طالبان","طالبين","طالبي"],"الفاعل مثنى مرفوع بالألف، ونون المثنى تُحذف عند الإضافة: طالبا العلم. و«طالبان» تصح لو لم يُضف."],["L06","h","دفع رجل 5000 ريال زكاةً لماله؛ مقدار ماله قبل دفع الزكاة:",["200000 ريال","100000 ريال","300000 ريال","400000 ريال"],"المال = الزكاة × 40 = 5000 × 40 = 200000؛ لأن الزكاة ربع العشر (2.5%)."],["L06","h","في العدد 2571315، الرقم 5 الواقع على يسار الرقم 7 في منزلة:",["مئات الألوف","عشرات الألوف","آحاد الملايين","آحاد الألوف"],"من اليمين: 5 آحاد، 1 عشرات، 3 مئات، 1 آحاد الألوف، 7 عشرات الألوف، 5 مئات الألوف، 2 آحاد الملايين."],["L06","h","إذا مشى خالد حول ملعب مستطيل طوله 12 م وعرضه 8 م دورتين كاملتين، فالمسافة التي قطعها:",["80 م","40 م","96 م","192 م"],"محيط المستطيل = 2 × (12 + 8) = 40 م، ودورتان = 80 م. و96 مساحته لا محيطه."],["L15","","كتب المعلم بجانب درجة الطالب عبارة «مستوى جيد جداً» مستنداً إلى محك محدد، دون وضع خطة لتحسين أدائه. هذا الإجراء يمثل:",["تقييماً","قياساً","تقويماً","تغذية راجعة"],"إصدار حكم على قيمة الأداء في ضوء محك هو التقييم. القياس لا يتضمن حكماً، والتقويم يضيف العلاج والتعديل، والتغذية الراجعة تصف الأداء وتوجه."],["L15","m","الترتيب المنطقي الصحيح لعمليات الحكم على تعلم الطالب هو:",["قياس ثم تقييم ثم تقويم","تقويم ثم قياس ثم تقييم","تقييم ثم قياس ثم تقويم","قياس ثم تقويم ثم تقييم"],"يبدأ بالقياس (جمع أرقام)، ثم التقييم (حكم في ضوء محك)، ثم التقويم (قرار التعديل والعلاج). لا يمكن الحكم قبل القياس ولا العلاج قبل الحكم."],["L15","","العلاقة بين الاختبار والقياس هي أن الاختبار:",["أداة من أدوات القياس","مرادف للتقويم","أحد أنواع التقويم الختامي","الغاية التي يسعى إليها القياس"],"الاختبار وسيلة لجمع البيانات الكمية، أي أداة قياس. ليس مرادفاً للتقويم لأن التقويم أشمل، وليس نوعاً من التقويم بل أداة قد تستخدم في أي نوع."],["L15","m","أراد معلم أن يعرف ما اكتسبه طلابه فعلاً من معارف ومهارات بعد تدريس وحدة كاملة، لا ما يمكن أن يتعلموه مستقبلاً. الاختبار المناسب هو اختبار:",["تحصيلي","استعداد","ذكاء","قدرات عامة"],"الاختبار التحصيلي يقيس نواتج التعلم الفعلية. اختبار الاستعداد يتنبأ بإمكانية التعلم مستقبلاً، والذكاء والقدرات يقيسان قدرة عامة لا محتوى درسه الطالب."],["L15","","اختبار يُطبَّق على طلاب الثالث الثانوي للتنبؤ بمدى نجاحهم في تخصص هندسي مستقبلاً هو اختبار:",["استعداد","تحصيل","تشخيصي","ختامي"],"اختبارات الاستعداد تقيس إمكانية التعلم أو النجاح مستقبلاً. التحصيلي يقيس ما تعلمه الطالب فعلاً، والتشخيصي يبحث عن مواطن الضعف، والختامي يصدر حكم النهاية."],["L15","m","أي الآتي لا يُعد من خصائص الاختبارات المقننة؟",["يعدّه المعلم لطلابه وفق ما درّسه في فصله","تطبَّق في ظروف وتعليمات موحدة لجميع المختبرين","يعدّها فريق من المتخصصين بإشراف مراكز القياس","لها معايير تُفسَّر الدرجات في ضوئها"],"الاختبار المقنن يعدّه متخصصون ويطبَّق بظروف موحدة وله معايير؛ أما الاختبار الذي يعدّه المعلم لصفه فهو اختبار معلم غير مقنن مهما كانت جودته."],["L15","","أي الآتي لا يُعد من خصائص التقويم الجيد؟",["أن يكون نشاطاً ختامياً في نهاية العام فقط","أن يكون مستمراً يواكب التعلم","أن يكون شاملاً لجوانب المتعلم المعرفية والمهارية والوجدانية","أن يكون تعاونياً يشارك فيه المعلم والطالب وولي الأمر"],"التقويم الجيد مستمر وشامل وتعاوني وعلمي واقتصادي، وليس غاية بحد ذاته ولا نشاطاً ختامياً فقط؛ فاقتصاره على نهاية العام يفقده وظيفة التحسين."],["L15","m","الفرق الجوهري بين التقويم التكويني والتقويم الختامي يكمن في:",["التوقيت والغرض: تحسين التعلم أثناءه مقابل إصدار الحكم في نهايته","نوع الأسئلة: موضوعية مقابل مقالية","من يقوم بالتصحيح: الطالب مقابل المعلم","عدد الأسئلة: قليلة مقابل كثيرة"],"التكويني أثناء التدريس وغايته التحسين والتغذية الراجعة، والختامي في النهاية وغايته الحكم. أما نوع الأسئلة وعددها ومن يصحح فلا يميز بينهما."],["L15","","يُطلق على التقويم التكويني أحياناً اسم التقويم:",["المستمر","النهائي","المقنن","المعياري"],"لأنه يواكب التعلم ويستمر معه طوال التدريس. النهائي هو الختامي، والمقنن وصف للاختبار لا لنوع التقويم، والمعياري طريقة تفسير."],["L15","","طبّق معلم اختباراً في بداية العام ثم صنّف الطلاب في مجموعات متجانسة في مستوى المهارة ليخطط لتعليم يناسب كل مجموعة. التقويم المستخدم:",["قبلي","ختامي","تكويني","ذاتي"],"توزيع الطلاب في مستويات وتصنيفهم قبل التعلم من أغراض التقويم القبلي. الختامي يحكم بعد التعلم، والتكويني أثناءه، والذاتي يقوم به الطالب."],["L15","m","أي أنواع التقويم الآتية يفيد في الحكم على مدى فاعلية طرق التدريس التي استُخدمت خلال الفصل الدراسي كاملاً؟",["الختامي","القبلي","التشخيصي","الذاتي"],"من أغراض التقويم الختامي الحكم على فاعلية جهود المعلم وطرق تدريسه ومقارنة الشعب. القبلي والتشخيصي يسبقان التعلم أو يبحثان عن الصعوبات."],["L15","","تظهر نتائج الاختبار محكي المرجع عادة في صورة:",["قائمة وصفية بالأهداف التي تحققت والتي لم تتحقق","ترتيب الطلاب من الأعلى إلى الأدنى","رتب مئينية ودرجات معيارية","منحنى اعتدالي لدرجات الصف"],"المحكي يخبرنا ما يستطيع الطالب عمله (أتقن / لم يتقن) فنتائجه قائمة أهداف. الترتيب والرتب المئينية والمنحنى الاعتدالي كلها أدوات التفسير معياري المرجع."],["L15","m","في استراتيجية التعلم للإتقان لا ينتقل الطالب إلى المهارة التالية حتى يصل إلى 80% في اختبار المهارة الحالية. نوع التقويم المعتمد:",["محكي المرجع","معياري المرجع","ذاتي المرجع","قبلي"],"نسبة الإتقان المحددة مسبقاً (80%) محك ثابت يقارن به أداء الطالب، فهو محكي المرجع. لا علاقة له بأداء الآخرين فليس معيارياً."],["L15","","يكون التقويم معياري المرجع هو الأنسب عندما يكون الغرض:",["الانتقاء والتصفية للقبول في برنامج بمقاعد محدودة","التأكد من إتقان الطالب لمهارات وحدة معينة","منح شهادة إتقان لمهارة مهنية","تشخيص أسباب تدني أداء طالب"],"الانتقاء والمفاضلة يحتاجان ترتيب المتقدمين بعضهم بالنسبة لبعض، وهذا جوهر المعياري. الإتقان والشهادات والتشخيص تحتاج مقارنة بمحك محدد."],["L15","m","قارن معلم درجة الطالب في اختبار الشهر الثاني بدرجته هو نفسه في الشهر الأول ليحكم على تقدمه. هذا التفسير:",["ذاتي المرجع","معياري المرجع","محكي المرجع","مقنن"],"مقارنة الطالب بأدائه السابق تفسير ذاتي المرجع يركز على النمو الفردي. المعياري يقارن بالأقران، والمحكي بمستوى إتقان محدد."],["L15","","أي الآتي يصف «التقويم من أجل التعلم» وصفاً صحيحاً؟",["بحث عن أدلة التعلم وتفسيرها من المعلم والمتعلم لتوجيه الخطوة التالية","إصدار حكم نهائي على مستوى الطالب في نهاية الوحدة","ترتيب الطلاب لاختيار المتفوقين منهم","قياس قدرات الطالب العقلية العامة"],"التقويم من أجل التعلم تقويم تكويني يستخدم الأدلة لتوجيه التعلم والتدريس. الحكم النهائي هو تقويم التعلم، والترتيب معياري، وقياس القدرات ليس تقويماً صفياً."],["L15","m","تبادل طالبان مسودتي موضوع التعبير وصحّح كل منهما عمل الآخر وفق قائمة محكات أعدّها المعلم. هذا الأسلوب:",["تقويم الأقران","التقويم الذاتي","التقويم الختامي","تقويم الأداء"],"حكم الطالب على عمل زميله وفق محكات هو تقويم الأقران. الذاتي حكم الطالب على عمله هو، والأداء يتعلق بإنجاز مهمة فعلية، والختامي حكم المعلم في النهاية."],["L15","","أهم ميزة للتقويم الذاتي بالنسبة للطالب أنه:",["يساعده على اكتشاف أخطائه وتعديل مساره بنفسه","يوفر على المعلم وقت التصحيح","يرفع درجاته في الاختبار الختامي","يغني عن تقويم المعلم"],"التقويم الذاتي ينمي وعي الطالب بأخطائه ودوافعه فيعدل سلوكه ويزيد ثقته. توفير الوقت نظرة تركز على المعلم، ولا يغني عن تقويم المعلم ولا يرفع الدرجات بالضرورة."],["L15","m","في نهاية كل حصة يطلب المعلم من طلابه كتابة ثلاث جمل عن أهم ما تعلموه وما بقي غامضاً لديهم. هذا الأسلوب يخدم أساساً:",["التقويم التكويني والتغذية الراجعة للمعلم","رصد درجات أعمال السنة","التقويم الختامي للوحدة","تصنيف الطلاب إلى مستويات"],"تذكرة الخروج تكشف ما تعلمه الطلاب وما غمض عليهم فيعدل المعلم الحصة التالية؛ وهذا تقويم تكويني. ليست أداة رصد درجات ولا تصنيف ولا حكم ختامي."],["L15","h","طلب المعلم من كل طالب جمع أعماله بانتظام في حقيبة، وفي كل أسبوع يراجع أعماله السابقة ويكتب ملاحظاته عن تقدمه. الأداة التي يستخدمها المعلم:",["ملف الإنجاز","السجل القصصي","قائمة الشطب","سلم التقدير العددي"],"جمع الأعمال بانتظام ومراجعتها بهدف التأمل في التقدم هو ملف الإنجاز (البورتفوليو). السجل القصصي يكتبه المعلم عن سلوك الطالب، والشطب والسلم أدوات رصد أداء."],["L15","","أداة تقويم تتضمن عبارات مثل «دائماً، غالباً، أحياناً، نادراً» لتقدير تكرار سلوك الطالب هي:",["سلم التقدير اللفظي","قائمة الشطب","سلم التقدير العددي","الروبرك"],"التدريج بكلمات وصفية للتكرار هو سلم التقدير اللفظي. العددي يستخدم أرقاماً، والشطب نعم / لا، والروبرك يصف مستويات الجودة لكل معيار."],["L15","","الميزة الأساسية للروبرك التحليلي مقارنة بالروبرك الكلي أنه:",["يقدم تغذية راجعة تفصيلية عن كل معيار على حدة","أسرع في التصحيح","لا يحتاج إلى محكات مسبقة","يعطي حكماً عاماً واحداً على العمل"],"الروبرك التحليلي يفصّل الدرجة لكل معيار فيعرف الطالب موضع قوته وضعفه. الكلي أسرع لكنه يعطي حكماً عاماً واحداً، وكلاهما يحتاج محكات مسبقة."],["L15","m","أراد معلم الكيمياء تقويم مهارة طلابه في إجراء تجربة معايرة. الأداة الأنسب:",["بطاقة ملاحظة بسلم تقدير للأداء","اختبار اختيار من متعدد عن خطوات التجربة","اختبار مقالي يصف فيه الطالب التجربة","قائمة بالمصطلحات العلمية للحفظ"],"المهارة العملية تُقوَّم بملاحظة الأداء الفعلي بأداة مدرجة. الاختبارات الكتابية تقيس المعرفة بالخطوات لا القدرة على تنفيذها."],["L15","","من عيوب السجل القصصي كأداة تقويم أنه:",["يحتاج وقتاً طويلاً وقد يتأثر بذاتية الملاحِظ","لا يصلح إلا للمهارات العملية","يقتصر على تسجيل الدرجات الرقمية","لا يمكن استخدامه في الصفوف الدنيا"],"الوصف السردي لكل طالب يستهلك وقتاً ويعتمد على ما يلاحظه المعلم ويفسره. السجل القصصي يناسب السلوك والجوانب الوجدانية في جميع الصفوف ولا يسجل درجات."],["L15","m","عقد المعلم جلسة قصيرة مع كل طالب حول أعماله في ملف الإنجاز، يسأله فيها عن اختياراته وما تعلمه وكيف يطورها. هذا الأسلوب من التقويم يسمى:",["التقويم بالتواصل (المقابلة / المؤتمر)","التقويم الختامي","الاختبار الشفهي المقنن","تقويم الأقران"],"الحوار وجهاً لوجه مع الطالب حول أعماله وتفكيره هو التقويم بالتواصل. ليس اختباراً مقنناً ولا حكماً ختامياً ولا يشارك فيه أقران."],["L15","","حين يطلب المعلم من الطلاب رسم خريطة مفاهيم لوحدة كاملة كأداة تقويم، فإنه يكشف أساساً عن:",["بنيتهم المعرفية والعلاقات التي يدركونها بين المفاهيم","سرعتهم في الكتابة","قدرتهم على حفظ التعريفات حرفياً","مهاراتهم اليدوية في الرسم"],"خريطة المفاهيم تُظهر كيف ينظم الطالب المفاهيم ويربطها، وهذا مؤشر على الفهم العميق. الحفظ الحرفي يُقاس بأسئلة التذكر، والرسم والسرعة ليسا المقصود."],["L15","","أي الآتي من خصائص التقويم الأصيل (الواقعي)؟",["مهام حقيقية مرتبطة بالحياة بمعايير معلنة مسبقاً","الاعتماد على أسئلة الاختيار من متعدد فقط","إخفاء معايير التقويم عن الطلاب حتى نهاية المهمة","التركيز على التذكر الحرفي للمعلومات"],"التقويم الأصيل يقيس الأداء في مواقف واقعية ذات معنى مع معايير يعرفها الطالب مسبقاً. إخفاء المعايير والاقتصار على التذكر أو الاختيار من متعدد سمات التقويم التقليدي."],["L15","m","أي الآتي ليس من أدوات التقويم البديل؟",["اختبار الاختيار من متعدد","ملف الإنجاز","سلم التقدير الوصفي","السجل القصصي"],"التقويم البديل يعتمد الأداء والملاحظة والملفات وسلالم التقدير بديلاً عن الاختبارات الورقية التقليدية؛ والاختيار من متعدد اختبار تقليدي."],["L15","","سجل يكتب فيه الطالب بنفسه تأملاته حول ما تعلمه وما قرأه وما واجهه من صعوبات يسمى:",["سجل سير التعلم (يوميات الطالب)","السجل القصصي","قائمة الشطب","بطاقة الملاحظة"],"سجل سير التعلم يكتبه الطالب عن تعلمه. السجل القصصي يكتبه المعلم عن سلوك الطالب، وقائمة الشطب وبطاقة الملاحظة أدوات يستخدمها المعلم لرصد الأداء."],["L15","","في أسئلة المطابقة (المزاوجة) يُفضَّل أن:",["يكون عدد الاستجابات أكبر من عدد المقدمات وأن تكون القائمة متجانسة","يتساوى عدد المقدمات والاستجابات تماماً","تجمع القائمة عناصر من موضوعات مختلفة","تُرتَّب الاستجابات بترتيب الإجابات الصحيحة"],"زيادة الاستجابات تقلل التخمين بالاستبعاد، والتجانس يمنع كشف الإجابة من نوع العنصر. التساوي والخلط وترتيب الإجابات تسهّل التخمين."],["L15","m","أي الآتي الصياغة الأفضل لسؤال إكمال؟",["وضع فراغ واحد في موضع مهم قرب نهاية الجملة","نقل الجملة حرفياً من الكتاب مع حذف كلمة","ترك عدة فراغات في الجملة الواحدة","وضع الفراغ في بداية الجملة"],"الفراغ الواحد في موضع مهم قرب النهاية يجعل المطلوب واضحاً بعد قراءة السياق. النقل الحرفي يشجع الحفظ، وكثرة الفراغات تجعل الجملة مبهمة، والفراغ في البداية يقطع السياق."],["L15","","في صياغة عبارات الصواب والخطأ ينبغي:",["أن تحمل كل عبارة فكرة واحدة وتخلو من النفي المزدوج","أن تحتوي كل عبارة على فكرتين لزيادة الدقة","أن تكون أغلب العبارات صحيحة","أن تُستخدم كلمات مثل دائماً وأبداً لتوضيح المعنى"],"الفكرة الواحدة تجعل الحكم واضحاً، والنفي المزدوج يربك الطالب. ينبغي توازن الصواب والخطأ، وكلمات الجزم تكشف الإجابة."],["L15","","لتقليل أثر التخمين في أسئلة الاختيار من متعدد يُنصح بـ:",["زيادة عدد البدائل الفعالة إلى أربعة وتحسين جودة المشتتات","تقليل البدائل إلى اثنين","وضع الإجابة الصحيحة دائماً في البديل الأول","حذف المشتتات الصعبة"],"كلما زادت البدائل الفعالة انخفض احتمال التخمين الصحيح (25% مع أربعة بدائل). تقليل البدائل أو تثبيت موضع الإجابة أو إضعاف المشتتات يرفع التخمين."],["L15","m","كتب معلم سؤالاً: «سقطت الدولة العثمانية لعدة أسباب، وضح ذلك». المشكلة في هذا السؤال أنه:",["مفتوح لا يحدد المطلوب فيصعب تصحيحه بموضوعية","موضوعي لا يقيس التفكير","قصير جداً","يحتوي على كلمات جزم"],"السؤال لا يحدد عدد الأسباب ولا نطاق الإجابة فيختلف المصححون في تقدير الإجابة؛ والأفضل تقييده مثل: اذكر ثلاثة أسباب. ليس موضوعياً ولا فيه كلمات جزم."],["L15","","لقياس عدد كبير من الحقائق والمفاهيم بتغطية واسعة للمحتوى في زمن محدود، الأنسب:",["الأسئلة الموضوعية","الأسئلة المقالية الحرة","المقابلة الشخصية","ملف الإنجاز"],"الموضوعية قصيرة الإجابة فتغطي محتوى واسعاً بعدد كبير من الفقرات في وقت قصير. المقالية تغطي محتوى محدوداً، والمقابلة وملف الإنجاز لا يناسبان هذا الغرض."],["L15","","في بناء اختبار الاختيار من متعدد، موقع الإجابة الصحيحة بين البدائل ينبغي أن:",["يتغير عشوائياً من فقرة إلى أخرى","يثبت في البديل الأول لتسهيل التصحيح","يكون دائماً في البديل الأخير","يتبع نمطاً ثابتاً يسهل حفظه"],"تغيير الموقع عشوائياً يمنع الطالب من اكتشاف نمط يجيب به دون معرفة. أي نمط ثابت يكشف الإجابة ويضعف الصدق."],["L15","m","معلم يريد قياس قدرة طلابه على الحكم على صحة الأحكام وتبريرها (مستوى التقويم في بلوم). نوع الأسئلة الأقل مناسبة لهذا الغرض:",["الصواب والخطأ","المقالية المقيدة","المقالية الحرة","الاختيار من متعدد المبني على موقف"],"الصواب والخطأ يقيس غالباً التذكر ولا يتيح تبرير الحكم. المقالية بنوعيها والاختيار من متعدد المبني على موقف يمكن أن تقيس مستويات عليا."],["L15","m","وحدة دراسية استغرقت 6 حصص من أصل 30 حصة في الفصل، والاختبار من 40 سؤالاً. عدد الأسئلة التي تستحقها هذه الوحدة في جدول المواصفات:",["8 أسئلة","6 أسئلة","12 سؤالاً","10 أسئلة"],"وزن الوحدة = 6 ÷ 30 = 0.20 أي 20%. عدد أسئلتها = 40 × 0.20 = 8 أسئلة. الخطأ الشائع أخذ عدد الحصص (6) كأنه عدد الأسئلة."],["L15","","اختبار من 50 سؤالاً، وزن موضوع «الكسور» فيه 30%، ووزن مستوى الفهم 40% من الأهداف. عدد أسئلة الكسور في مستوى الفهم:",["6 أسئلة","15 سؤالاً","20 سؤالاً","12 سؤالاً"],"أسئلة الخلية = العدد الكلي × وزن الموضوع × وزن المستوى = 50 × 0.30 × 0.40 = 6. الرقم 15 هو كل أسئلة الكسور، و20 كل أسئلة الفهم."],["L15","m","الأساس الذي يُحدَّد به وزن كل موضوع في جدول المواصفات هو:",["عدد الحصص أو الأهداف المخصصة له وأهميته النسبية","صعوبة الموضوع على الطلاب","ترتيب الموضوع في الكتاب","رغبة الطلاب في الموضوع"],"الوزن النسبي يُشتق من حجم الموضوع في التدريس (حصصه أو أهدافه) وأهميته. الصعوبة والترتيب والرغبة ليست أسساً لتوزيع الأسئلة."],["L15","","ينبغي أن تتضمن تعليمات الاختبار:",["زمن الإجابة وطريقتها ودرجة كل سؤال","أسماء الطلاب المتوقع نجاحهم","الإجابات النموذجية للأسئلة","ملخصاً للمحتوى الدراسي"],"التعليمات تخبر الطالب بما هو متوقع منه: الزمن وأسلوب الإجابة ومكانها وتوزيع الدرجات. الإجابات والملخص لا مكان لهما في ورقة الاختبار."],["L15","","لتقليل أثر الهالة عند تصحيح الأسئلة المقالية يُنصح بأن:",["يصحح المعلم السؤال الواحد لجميع الطلاب قبل الانتقال إلى السؤال التالي مع إخفاء الأسماء","يصحح ورقة كل طالب كاملة قبل الانتقال لورقة أخرى","يبدأ بأوراق الطلاب المتفوقين","يصحح الأوراق حسب ترتيب الحضور"],"تصحيح السؤال نفسه عبر كل الأوراق يثبت المعيار ويمنع تأثر الدرجة بالانطباع عن الطالب أو عن إجاباته السابقة. تصحيح الورقة كاملة يقوّي أثر الهالة."],["L15","","الترتيب الصحيح لخطوات بناء الاختبار التحصيلي:",["تحديد الأهداف، تحليل المحتوى، جدول المواصفات، صياغة الفقرات، التعليمات","صياغة الفقرات، تحديد الأهداف، جدول المواصفات، التعليمات","جدول المواصفات، تحديد الأهداف، تحليل المحتوى، صياغة الفقرات","تحليل المحتوى، صياغة الفقرات، تحديد الأهداف، التعليمات"],"يبدأ البناء بالأهداف ثم المحتوى، ثم يجمعهما جدول المواصفات، ثم تُكتب الفقرات في ضوئه، ثم التعليمات، ثم التجريب والتحليل."],["L15","m","أي الآتي الأفضل عند تصميم الاختبار لرفع موضوعيته؟",["الاعتماد على أسئلة موضوعية ذات إجابة واحدة محددة مع نموذج إجابة","الاعتماد على أسئلة مقالية حرة","ترك تقدير الدرجة لانطباع المصحح","عدم تحديد درجة لكل سؤال"],"الموضوعية هي استقلال الدرجة عن المصحح، وتتحقق بالأسئلة محددة الإجابة ونموذج تصحيح. المقالية الحرة والانطباع وعدم تحديد الدرجات ترفع الذاتية."],["L15","","الغرض الرئيس من الاختبارات الوطنية (نافس) هو:",["تشخيص مستوى تحصيل الطلاب على مستوى الوطن لتحسين التعليم","تحديد نجاح الطالب أو رسوبه في نهاية العام","ترتيب الطلاب داخل الصف الواحد","منح الطالب شهادة إتمام المرحلة"],"نافس تقويم نظامي يقدم مؤشرات عن جودة التعليم وليس اختباراً يترتب عليه نجاح الطالب أو ترتيبه أو شهادته."],["L15","m","«TALIS» يختلف عن الاختبارات الدولية الأخرى في أنه:",["مسح دولي عن المعلمين وبيئات التدريس وليس اختباراً للطلاب","اختبار للرياضيات فقط","اختبار يُعقد سنوياً للصف الأول","اختبار وطني خاص بالمملكة"],"تاليس استطلاع للمعلمين وقادة المدارس عن ظروف التدريس والتطوير المهني. الاختبارات الأخرى (بيزا، تيمس، بيرلز) تُطبَّق على الطلاب."],["L15","","يتميز اختبار PISA عن الاختبارات التحصيلية المدرسية في أنه يقيس:",["قدرة الطالب على توظيف المعرفة في مواقف حياتية حقيقية","حفظ الطالب لمحتوى المنهج الوطني","سرعة الطالب في الإجابة عن أسئلة الكتاب","سلوك الطالب داخل الفصل"],"بيزا يقيس الثقافة القرائية والرياضية والعلمية بمعنى القدرة على استخدام المعرفة في الحياة لا استظهار المنهج."],["L15","","في لائحة تقويم الطالب، الغرض من مستويات الأداء في التقويم المستمر للصفوف الأولية هو:",["تحديد درجة إتقان الطالب لكل مهارة لبناء خطة علاجية عند الحاجة","ترتيب الطلاب داخل الفصل","تحديد الطلاب الراسبين فقط","مقارنة المدرسة بغيرها"],"في الإجراءات التنفيذية للائحة تقويم الطالب 2025 تُقوَّم مواد الصفين الأول والثاني الابتدائي تكوينياً بمستويات أداء (متفوق، متقدم، متمكن، غير مجتاز) تُحدَّد بنسبة معايير المادة التي أتقنها الطالب، ويُعد المعلم برنامجاً علاجياً لمن لم يتقن معياراً أو أكثر؛ فغرضها تحديد الإتقان وتوجيه العلاج، لا ترتيب الطلاب ولا حصر الراسبين ولا مقارنة المدارس."],["L16","","الصدق الظاهري للاختبار يعني أن:",["مظهر الاختبار وعنوانه وتعليماته توحي بأنه يقيس ما وُضع له","فقراته تمثل المحتوى تمثيلاً كاملاً","درجاته ترتبط بمحك مستقبلي","فقراته تنسجم مع الإطار النظري للسمة"],"الصدق الظاهري يتعلق بالشكل العام وهو أضعف الأنواع. التمثيل الكامل صدق محتوى، والمحك المستقبلي تنبؤي، والإطار النظري صدق بناء."],["L16","m","أعد باحث مقياساً لـ«التفكير الناقد» وتحقق عبر التحليل العاملي من أن فقراته تنتظم في الأبعاد التي تفترضها النظرية. نوع الصدق:",["البناء (المفهوم)","المحتوى","التلازمي","الظاهري"],"مطابقة الاختبار للإطار النظري للسمة وأبعادها هو صدق البناء (التكوين الفرضي)، ومن أساليبه التحليل العاملي والمقارنة بين المجموعات المتباينة."],["L16","","معامل ثبات اختبار 0.81، فإن صدقه الذاتي يساوي:",["0.90","0.81","0.66","0.19"],"الصدق الذاتي = الجذر التربيعي لمعامل الثبات = جذر 0.81 = 0.9. الخطأ الشائع إعادة كتابة الثبات نفسه أو تربيعه (0.66)."],["L16","","صيغت فقرات اختبار بلغة فوق مستوى الطلاب فعجز كثير منهم عن فهم المطلوب. أثر ذلك أن الاختبار صار يقيس:",["فهم اللغة بدل المحتوى المستهدف فينخفض صدقه","المحتوى بدقة أكبر","مستويات التفكير العليا","المحتوى دون أي تأثر"],"إذا حالت اللغة دون إظهار الطالب ما يعرفه فالدرجة لا تمثل تحصيله الحقيقي، وهذا خلل في الصدق."],["L16","m","استخدم معلم اختبار قواعد النحو ليحكم على القدرة اللغوية الشاملة لطلابه (قراءة وكتابة وتحدث). الخلل في هذا الاستخدام يتعلق بـ:",["الصدق، لأن الاختبار استُخدم في غير ما وُضع له","الثبات، لأن الاختبار طُبّق مرة واحدة","الموضوعية، لأن أسئلة القواعد مقالية","التمييز، لأن القواعد سهلة"],"الاختبار قد يكون صادقاً لقياس القواعد، لكنه غير صادق لقياس القدرة اللغوية الشاملة؛ فالصدق يرتبط بالغرض الذي يُستخدم له."],["L16","","أي أنواع الصدق الآتية يُقدَّر بحساب معامل ارتباط بين درجات الاختبار ودرجات اختبار آخر؟",["صدق المحك","صدق المحتوى","الصدق الظاهري","الصدق المنطقي"],"صدق المحك بنوعيه (التلازمي والتنبؤي) يُحسب بمعامل ارتباط مع محك خارجي. المحتوى والظاهري والمنطقي تُقدَّر بالحكم والتحليل لا بالارتباط."],["L16","m","عرض معلم فقرات اختباره على خمسة من المتخصصين للحكم على مدى تمثيلها للمحتوى وملاءمتها للأهداف. الإجراء يتحقق من:",["صدق المحتوى","الثبات","الصدق التنبؤي","معامل التمييز"],"حكم المحكمين على تمثيل الفقرات للمحتوى والأهداف أسلوب لتقدير صدق المحتوى. الثبات والتمييز يُحسبان من درجات الطلاب، والتنبؤي يحتاج محكاً لاحقاً."],["L16","","أي العوامل الآتية لا يُضعف صدق الاختبار؟",["تنويع مستويات الأسئلة بين التذكر والفهم والتطبيق","غموض صياغة الأسئلة","تطبيق الاختبار على فئة غير التي أُعد لها","وجود تلميحات في الصياغة تكشف الإجابة"],"تنويع المستويات يزيد تمثيل الأهداف فيرفع الصدق. أما الغموض والتطبيق على فئة مختلفة والتلميحات فتجعل الدرجة لا تمثل القدرة الحقيقية."],["L16","m","أراد معلم حساب ثبات اختبار كل فقراته تُصحح بـ 1 للصحيح و0 للخطأ من تطبيق واحد. المعادلة الأنسب:",["كودر ريتشاردسون","كرونباخ ألفا للمقاييس المتدرجة","معادلة التنبؤ","معامل سبيرمان للرتب"],"كودر ريتشاردسون (20 و21) مخصصة للفقرات ثنائية التصحيح. ألفا أعم وتناسب المتدرج (ليكرت)، والمعادلات الأخرى لا تقيس الثبات."],["L16","","لحساب ثبات مقياس اتجاهات بتدريج ليكرت الخماسي (موافق بشدة إلى غير موافق بشدة)، الأنسب:",["كرونباخ ألفا","كودر ريتشاردسون","الصدق الذاتي","معامل الصعوبة"],"الفقرات متعددة التدريج تحتاج كرونباخ ألفا. كودر ريتشاردسون للفقرات الثنائية فقط، والصدق الذاتي والصعوبة ليسا طرقاً لحساب الثبات."],["L16","m","كان معامل الارتباط بين نصفي اختبار 0.60. معامل ثبات الاختبار كاملاً بعد تصحيحه بمعادلة سبيرمان براون:",["0.75","0.60","0.30","0.80"],"سبيرمان براون: الثبات = (2 × 0.60) ÷ (1 + 0.60) = 1.20 ÷ 1.60 = 0.75. التصحيح يرفع المعامل لأن ارتباط النصفين يمثل ثبات نصف الاختبار فقط."],["L16","","اختبار انحرافه المعياري 10 ومعامل ثباته 0.84. الخطأ المعياري للقياس يساوي:",["4","8.4","1.6","6"],"الخطأ المعياري = الانحراف × الجذر التربيعي لـ(1 − الثبات) = 10 × جذر(1 − 0.84) = 10 × جذر(0.16) = 10 × 0.4 = 4."],["L16","","كلما كبر الخطأ المعياري للقياس في اختبار، فإن معامل ثباته:",["ينخفض","يرتفع","لا يتأثر","يساوي الصفر دائماً"],"الخطأ المعياري يعبر عن تذبذب الدرجة الملاحظة حول الحقيقية؛ وكبره يعني اتساقاً أقل، أي ثباتاً أقل. العلاقة عكسية بينهما."],["L16","m","طبّق باحث اختباراً على مجموعة متقاربة جداً في قدراتها فحصل على معامل ثبات منخفض رغم جودة الفقرات. السبب الأرجح:",["تجانس العينة قلل التباين بين الدرجات","طول الاختبار الزائد","صعوبة الفقرات المتوسطة","وضوح التعليمات"],"معامل الثبات ارتباط، والارتباط ينخفض حين يقل التباين؛ فالعينة المتجانسة تعطي ثباتاً أقل. الطول والصعوبة المتوسطة والوضوح عوامل ترفع الثبات."],["L16","","أعاد معلم تطبيق الاختبار نفسه في اليوم التالي مباشرة. الأثر المتوقع على معامل الثبات:",["يرتفع زيفاً بسبب تذكر الطلاب لإجاباتهم","ينخفض بسبب نسيان الطلاب","لا يتأثر بالفاصل الزمني","يصبح سالباً"],"قصر الفترة بين التطبيقين يجعل الذاكرة ترفع الاتفاق بين الدرجتين فيبدو الثبات أعلى من حقيقته؛ لذلك يُفضَّل فاصل مناسب (نحو أسبوعين)."],["L16","","الخاصية التي تُعد شرطاً ضرورياً لصدق الاختبار لكنها غير كافية له:",["الثبات","الشمول","سهولة التطبيق","طول الاختبار"],"بلا ثبات لا صدق، لكن الثبات وحده لا يضمن الصدق. الشمول والسهولة والطول خصائص مساعدة لا تُعد شرطاً منطقياً للصدق."],["L16","m","ترتيب الخصائص من حيث العلاقة الشرطية بينها:",["الموضوعية شرط للثبات، والثبات شرط للصدق","الصدق شرط للثبات، والثبات شرط للموضوعية","الثبات شرط للموضوعية، والموضوعية شرط للصدق","لا توجد علاقة شرطية بين الثلاث"],"إذا تأثرت الدرجة بالمصحح اختل اتساقها (الثبات)، وإذا اختل الاتساق لم يقس الاختبار السمة بدقة (الصدق). فالموضوعية في القاعدة والصدق في القمة."],["L16","","أي الآتي يُعد من عوامل انخفاض ثبات الاختبار؟",["غموض التعليمات واختلاف ظروف التطبيق بين الطلاب","زيادة عدد الفقرات","تباين قدرات العينة","صعوبة الفقرات المتوسطة"],"الغموض وتفاوت الظروف يدخلان أخطاء عشوائية في الدرجات فيقل الاتساق. الطول وتباين العينة والصعوبة المتوسطة ترفع الثبات."],["L16","","في اختبار على 100 طالب أُخذت المجموعة العليا (27 طالباً) والدنيا (27 طالباً). أجاب عن الفقرة 20 من العليا و5 من الدنيا. معامل التمييز تقريباً:",["0.56","0.25","0.46","0.15"],"التمييز = (20 − 5) ÷ 27 = 15 ÷ 27 ≈ 0.56، أي ممتاز. القسمة تكون على عدد أفراد إحدى المجموعتين (27) لا على العدد الكلي."],["L16","m","في مجموعتين قوام كل منهما 20 طالباً، أجاب عن الفقرة 6 من العليا و14 من الدنيا. القرار المناسب:",["حذف الفقرة فوراً لأن تمييزها سالب (−0.40)","الإبقاء عليها لأن صعوبتها متوسطة","تعديلها قليلاً لأن تمييزها 0.40","استبدال أحد مشتتاتها فقط"],"التمييز = (6 − 14) ÷ 20 = −0.40؛ الإشارة السالبة تعني أن الضعاف أجابوا أفضل من المتفوقين، وهذا خلل جوهري يستوجب الحذف وإن كانت الصعوبة (20 ÷ 40 = 0.50) متوسطة."],["L16","","عند تحليل فقرة تبين أن مشتتاً اختاره طلاب الفئة العليا أكثر من الدنيا. التفسير الأرجح:",["المشتت غامض أو يحتمل أن يكون إجابة صحيحة ثانية فيجب مراجعته","المشتت ممتاز ويؤدي وظيفته","الفقرة سهلة جداً","الفئة العليا لم تذاكر"],"إذا انجذب المتفوقون إلى بديل خاطئ فغالباً أن في البديل أو المقدمة غموضاً أو إجابة صحيحة جزئياً، فتُراجع الفقرة."],["L16","m","فقرة أجاب عنها جميع طلاب الصف إجابة صحيحة. معامل صعوبتها ومعامل تمييزها على الترتيب:",["1 وصفر","صفر و1","0.5 و0.5","1 و1"],"الصعوبة = الكل ÷ الكل = 1 (سهلة جداً)، والتمييز = (العليا − الدنيا) ÷ العدد = صفر لأن الفئتين أجابتا بالتساوي. الفقرات شديدة السهولة لا تميز."],["L16","","المدى المقبول لمعامل الصعوبة في الفقرات الجيدة عادة:",["من 0.20 إلى 0.80 والمثالي قرب 0.50","من 0.90 إلى 1.00","من صفر إلى 0.10","من 0.95 فأعلى"],"الفقرات شديدة السهولة (فوق 0.80) أو شديدة الصعوبة (دون 0.20) لا تميز جيداً، والمعامل الأمثل للتمييز الأقصى حول 0.50."],["L16","","في مجموعتين قوام كل منهما 25 طالباً، أجاب عن الفقرة 18 من العليا و8 من الدنيا. معامل الصعوبة بطريقة المجموعتين:",["0.52","0.40","0.72","0.32"],"الصعوبة = (18 + 8) ÷ (25 + 25) = 26 ÷ 50 = 0.52، فقرة متوسطة. الرقم 0.40 هو معامل التمييز للفقرة نفسها."],["L16","m","العلاقة بين معامل الصعوبة ومعامل التمييز توصف بأن:",["الفقرات متوسطة الصعوبة تتيح أعلى تمييز ممكن","الفقرات شديدة الصعوبة أعلى تمييزاً دائماً","الفقرات شديدة السهولة أعلى تمييزاً دائماً","لا علاقة بينهما إطلاقاً"],"حين تكون الصعوبة قرب 0.50 يمكن أن يكون الفرق بين الفئتين أكبر ما يمكن. أما الفقرات التي يجيب عنها الجميع أو لا يجيب عنها أحد فتمييزها يقترب من الصفر."],["L16","","إذا كان معامل السهولة لفقرة 0.65، فإن نسبة الطلاب الذين أخطؤوا فيها:",["35%","65%","0.65 من طالب","50%"],"معامل السهولة هو نسبة المصيبين (65%)، ومجموع نسبة المصيبين والمخطئين = 1، فالمخطئون = 1 − 0.65 = 0.35 أي 35%."],["L16","","عند تحليل فقرات الاختبار بطريقة المجموعتين الطرفيتين في صف كبير، تُؤخذ:",["أعلى 27% وأدنى 27% من الأوراق بعد ترتيبها","أعلى 50% وأدنى 50%","أول 10 أوراق وآخر 10 أوراق بترتيب التسليم","الأوراق كلها دون ترتيب"],"النسبة المعتمدة للمجموعتين الطرفيتين 27% من كل طرف بعد الترتيب التنازلي بالدرجة؛ وفي الصفوف الصغيرة يُقسم الصف نصفين."],["L16","","إذا كان الانحراف المعياري لدرجات صف 4 فإن التباين يساوي:",["16","2","4","8"],"التباين = مربع الانحراف المعياري = 4 × 4 = 16. الجذر (2) والضعف (8) إجابات خاطئة شائعة."],["L16","m","أضاف المعلم 5 درجات لكل طالب في الصف. أثر ذلك على المتوسط والانحراف المعياري:",["يزيد المتوسط 5 درجات ولا يتغير الانحراف المعياري","يزيد كل منهما 5 درجات","لا يتغير المتوسط ويزيد الانحراف 5","يتغير كل منهما بنسبة 5%"],"إضافة ثابت تنقل كل الدرجات بالمقدار نفسه فيزيد المتوسط بالثابت، لكن المسافات بين الدرجات لا تتغير فيبقى الانحراف المعياري كما هو."],["L16","","أفضل مقياس نزعة مركزية لوصف بيانات نوعية (اسمية) مثل الأنماط التعليمية المفضلة لدى الطلاب:",["المنوال","المتوسط الحسابي","الوسيط","التباين"],"البيانات الاسمية لا تُجمع ولا تُرتب فلا يمكن حساب متوسط أو وسيط، ويبقى المنوال (الفئة الأكثر تكراراً) هو المناسب."],["L16","m","صفان لهما المتوسط نفسه (70)، الانحراف المعياري للصف الأول 3 وللثاني 12. الاستنتاج الصحيح:",["الصف الأول أكثر تجانساً في مستوى طلابه","الصف الثاني أكثر تجانساً","الصفان متساويان في التجانس","الصف الثاني أعلى تحصيلاً"],"الانحراف المعياري يقيس التشتت حول المتوسط؛ وصغره يعني تقارب الدرجات (تجانس). المتوسط المتساوي يعني تحصيلاً متقارباً لا تفوق أحدهما."],["L16","","إذا كان الانحراف المعياري لدرجات مجموعة يساوي صفراً فهذا يعني أن:",["جميع الدرجات متساوية","المتوسط يساوي صفراً","نصف الدرجات فوق المتوسط","التوزيع ملتوٍ التواءً موجباً"],"الانحراف صفر يعني أن كل الدرجات تساوي المتوسط فلا تشتت. لا علاقة بقيمة المتوسط ولا بالالتواء."],["L16","","الرسم البياني الأنسب لعرض توزيع درجات الطلاب على فئات متتالية هو:",["المدرج التكراري","الرسم الدائري","الخط البياني الزمني","الرسم الشجري"],"المدرج التكراري يعرض تكرار كل فئة من الدرجات ويبين شكل التوزيع. الدائري للنسب من كل، والخطي للتغير عبر الزمن."],["L16","m","في جدول تكراري لدرجات 40 طالباً: 10 طلاب في الفئة 50 إلى 59، و12 في 60 إلى 69، و11 في 70 إلى 79، و7 في 80 إلى 89. عدد الطلاب الذين حصلوا على 70 فأكثر:",["18","11","22","7"],"الطلاب في 70 إلى 79 عددهم 11، وفي 80 إلى 89 عددهم 7؛ المجموع = 18. الرقم 22 هو من حصلوا على أقل من 70."],["L16","","الوسيط للدرجات: 3، 9، 7، 12، 5 يساوي:",["7","9","12","7.2"],"نرتب: 3، 5، 7، 9، 12؛ العدد فردي (5 قيم) فالوسيط القيمة الوسطى الثالثة = 7. الرقم 7.2 هو المتوسط الحسابي."],["L16","","أي مقاييس التشتت الآتية أكثر تأثراً بالقيم المتطرفة؟",["المدى","الانحراف المعياري","التباين","الانحراف الربيعي"],"المدى يعتمد على قيمتين فقط هما الطرفان، فأي قيمة متطرفة واحدة تغيره كلياً؛ بينما الانحراف المعياري والتباين يعتمدان على كل القيم."],["L16","","في توزيع اعتدالي متوسطه 60 وانحرافه 5، نسبة الطلاب الذين تزيد درجاتهم عن 70 تقريباً:",["2.5%","5%","16%","34%"],"70 تبعد انحرافين فوق المتوسط. 95% من الدرجات ضمن انحرافين، فالباقي 5% موزعة على الطرفين، أي 2.5% فوق 70."],["L16","m","في توزيع اعتدالي متوسطه 50 وانحرافه 10، نسبة الطلاب الذين تقع درجاتهم بين 50 و60 تقريباً:",["34%","68%","16%","50%"],"الفترة من المتوسط إلى انحراف واحد فوقه تضم نصف الـ68% أي 34%. 16% هي نسبة من تزيد درجاتهم عن 60."],["L16","","في اختبار كان المتوسط 45 والوسيط 35 والمنوال 30. الاستنتاج:",["التوزيع ملتوٍ التواءً موجباً والاختبار صعب","التوزيع ملتوٍ التواءً سالباً والاختبار سهل","التوزيع اعتدالي","الاختبار متوسط الصعوبة تماماً"],"المتوسط أكبر من الوسيط أكبر من المنوال: الذيل نحو اليمين والتكدس عند الدرجات المنخفضة؛ التواء موجب يدل على اختبار صعب."],["L16","","طالب درجته المعيارية ز = −1. درجته التائية (ت):",["40","60","49","−10"],"ت = 50 + 10 × ز = 50 + 10 × (−1) = 50 − 10 = 40. الدرجة التائية تتخلص من الإشارة السالبة وتبقي المعنى (دون المتوسط بانحراف واحد)."],["L16","m","حصل طالب على 80 في العربي (المتوسط 70 والانحراف 10) وعلى 65 في الرياضيات (المتوسط 50 والانحراف 5). أداؤه الأفضل مقارنة بزملائه في:",["الرياضيات لأن ز = 3 مقابل ز = 1","العربي لأن درجته الخام أعلى","المادتين بالتساوي","لا يمكن الحكم دون الدرجة الكلية"],"العربي: ز = (80 − 70) ÷ 10 = 1. الرياضيات: ز = (65 − 50) ÷ 5 = 3. الدرجة الخام الأعلى لا تعني أداءً نسبياً أفضل؛ المقارنة الصحيحة بالدرجة المعيارية."],["L16","","الدرجة المعيارية (ز) لها متوسط وانحراف معياري يساويان على الترتيب:",["صفر و1","50 و10","100 و15","1 وصفر"],"ز توزيع متوسطه صفر وانحرافه 1. المتوسط 50 والانحراف 10 للدرجة التائية، و100 و15 لنسبة الذكاء الانحرافية."],["L16","h","معامل الارتباط بين درجات الطلاب في اختبارين 0.2. الاستنتاج:",["العلاقة بين الاختبارين ضعيفة","العلاقة قوية بين المادتين","الاختبارات تمتاز بالصدق والثبات","الاختباران شديدا السهولة"],"0.2 قيمة منخفضة تدل على ارتباط ضعيف. لا يمكن استنتاج الصدق أو الثبات أو السهولة من ارتباط درجات اختبارين مختلفين."],["L16","","وجد معلم ارتباطاً قوياً (0.85) بين درجات القراءة ودرجات العلوم لدى طلابه. الاستنتاج غير الصحيح:",["تحسين القراءة هو سبب تفوق الطلاب في العلوم","الطلاب المتفوقون في القراءة يميلون للتفوق في العلوم","العلاقة بين المتغيرين طردية قوية","يمكن التنبؤ بدرجة العلوم من درجة القراءة بدرجة جيدة"],"الارتباط يصف العلاقة ولا يثبت السببية؛ قد يكون وراء الاثنين عامل ثالث كالقدرة العامة أو الدافعية. أما الاتجاه والقوة والتنبؤ فاستنتاجات مشروعة."],["L16","m","يتراوح معامل الارتباط بين:",["−1 و+1","صفر و1","صفر و100","−100 و+100"],"معامل الارتباط قيمة بين −1 (عكسي تام) و+1 (طردي تام)، والصفر يعني انعدام العلاقة الخطية."],["L16","","حصل طالب على درجة معيارية ز = 1.5 في اختبار متوسطه 50 وانحرافه 8. درجته الخام:",["62","58","51.5","65"],"الدرجة الخام = المتوسط + ز × الانحراف = 50 + 1.5 × 8 = 50 + 12 = 62."],["L16","","اختباران طُبقا على الصف نفسه وكان معامل الارتباط بين درجاتهما 0.95. الاستنتاج الصحيح:",["وجود علاقة قوية بين أداء الطلاب في الاختبارين","أن 95% من الطلاب نجحوا في الاختبارين","أن معامل صعوبة الاختبارين 0.95","أن الاختبارين متطابقان في الأسئلة"],"الارتباط 0.95 يعني أن ترتيب الطلاب في الاختبارين متقارب جداً. لا يخبرنا عن نسبة النجاح ولا الصعوبة ولا تطابق الأسئلة."],["L16","m","طالب درجته التائية 65. موقعه بالنسبة لمجموعته:",["أعلى من المتوسط بانحراف ونصف","أدنى من المتوسط بانحراف ونصف","عند المتوسط تماماً","أعلى من المتوسط بـ 65 درجة"],"ت = 50 + 10ز، فإذا كانت ت = 65 فإن ز = (65 − 50) ÷ 10 = 1.5، أي فوق المتوسط بانحراف ونصف."],["L16","","بعد اطلاع معلم الأول الثانوي على النتائج المتدنية لطلابه في اختبار الشهر الأول، الإجراء الأول الذي ينبغي أن يقوم به:",["تحليل النتائج لتحديد مواطن الضعف ثم تعديل التدريس","إعادة الاختبار في الأسبوع التالي","توبيخ الطلاب على إهمالهم","تخفيض مستوى الاختبار القادم"],"التدني العام يستدعي تشخيص الأسباب أولاً (الفقرات، المهارات، طريقة التدريس) ثم التعديل. إعادة الاختبار أو التوبيخ أو التسهيل لا تعالج السبب."],["L16","m","الهدف الأساسي من تقرير نتائج الطالب الذي يُرسل إلى ولي الأمر:",["توضيح مستوى الطالب وتقدمه وما يحتاجه من دعم","إبراز جهود المعلم والمدرسة","تحقيق مبدأ الثواب والعقاب","مقارنة الطالب بالمتفوقين في صفه"],"التقرير وسيلة شراكة مع الأسرة لدعم تعلم الطالب، فيركز على مستواه وتقدمه وحاجاته. إبراز جهود المعلم يركز على المعلم، والعقاب والمقارنة لا يخدمان التعلم."],["L16","","الغرض الأساسي لتحليل المعلم نتائج اختباره:",["تحسين التدريس وتعديل الخطة في ضوء مواطن الضعف والقوة","رصد الدرجات في النظام فقط","ترتيب الطلاب لإعلان المتفوقين","تبرير الدرجات أمام الإدارة"],"التحليل يكشف الفقرات الضعيفة والمهارات غير المتقنة فيوجه قرارات التدريس. الرصد والترتيب والتبرير نواتج ثانوية لا تمثل الغرض الأساسي."],["L16","","عند كتابة تغذية راجعة مكتوبة على ورقة الطالب ينبغي أن:",["تكون بلغة بسيطة وموجزة ومحددة","تتضمن عبارات ثناء عامة فقط","تقتصر على نقاط الضعف","تكون مطولة تغطي كل جوانب الإجابة"],"الوضوح والإيجاز والتحديد يجعل الطالب يفهم ما يحتاج تحسينه ويطبقه. الثناء العام لا يفيد، والاقتصار على الضعف يحبط، والإطالة تضيع الرسالة."],["L16","m","جميع الآتي من الاستخدامات المشروعة لنتائج التقويم ما عدا:",["معاقبة الطلاب ضعاف التحصيل بالحرمان من الأنشطة","تعديل خطة التدريس وأساليبه","تصنيف الطلاب لبرامج علاجية وإثرائية","إعداد تقارير لأولياء الأمور"],"نتائج التقويم أداة تحسين وتوجيه لا أداة عقاب؛ فالحرمان لا يعالج الضعف بل يزيد النفور. التعديل والتصنيف للدعم والتقارير كلها توظيف سليم."],["L16","","يستخدم المعلم جدولاً إلكترونياً لحساب معاملات الصعوبة والتمييز لفقرات اختباره. الفائدة الأساسية من ذلك:",["تحديد الفقرات الضعيفة بسرعة لتحسين الاختبارات القادمة","رفع درجات الطلاب الضعاف","إلغاء الحاجة إلى جدول المواصفات","تقليل عدد الأسئلة في الاختبار"],"تحليل الفقرات بالتقنية يكشف الفقرات التي تحتاج تعديلاً أو حذفاً فتتحسن جودة الاختبار. لا يغير درجات الطلاب ولا يغني عن التخطيط."],["L16","","طالب حصل على درجة أقل من زملائه في اختبار العلوم، وأراد المعلم أن يخبره بنتيجته بطريقة تدعم دافعيته. الأسلوب الأنسب:",["بيان ما أتقنه ثم المهارات المحددة التي يحتاج تحسينها وكيف","إعلان درجته أمام الصف لحثه على الاجتهاد","مقارنة درجته بدرجة المتفوق الأول","الاكتفاء بإبلاغه الدرجة دون تعليق"],"التغذية الراجعة الداعمة تبدأ بنقاط القوة ثم توجه إلى خطوات تحسين محددة. الإعلان والمقارنة يحرجان ويحبطان، والدرجة وحدها لا توجه."],["L11","","الإطار الفكري أو الفلسفة العامة التي تنبثق منها طرق التدريس، كالقول «أدرّس وفق المدخل البنائي»، يسمى:",["مدخل التدريس","أسلوب التدريس","تقنية التدريس","طريقة التدريس"],"المدخل هو التصور النظري الذي تقوم عليه الطريقة. الطريقة إجراءات تنفيذية، والأسلوب طابع شخصي، والتقنية أداة."],["L11","","الترتيب الصحيح لمفاهيم التدريس من الأعم إلى الأخص هو:",["مدخل ← استراتيجية ← طريقة ← أسلوب","استراتيجية ← مدخل ← أسلوب ← طريقة","طريقة ← استراتيجية ← مدخل ← أسلوب","أسلوب ← طريقة ← استراتيجية ← مدخل"],"المدخل فلسفة عامة تضم استراتيجيات، والاستراتيجية خطة تضم طرقاً، والطريقة تُنفذ بأساليب شخصية. البدائل الأخرى تقلب العلاقة."],["L11","h","في تصنيف جويس وويل لنماذج التدريس، ينتمي التعليم المبرمج والتعلم للإتقان إلى عائلة النماذج:",["السلوكية","الاجتماعية","الشخصية","معالجة المعلومات"],"النماذج السلوكية تقوم على ضبط السلوك وتعديله بالتعزيز والخطوات الصغيرة، ومنها المبرمج والإتقان والتعليم المباشر. الاجتماعية تضم التعاوني ولعب الأدوار."],["L11","m","أراد معلم استخدام نموذج تدريس يعتمد على التفاعل بين الطلاب في جو اجتماعي، مثل التعلم التعاوني والتقصي الجماعي. هذا النموذج ينتمي عند جويس وويل إلى العائلة:",["الاجتماعية","السلوكية","الشخصية","معالجة المعلومات"],"العائلة الاجتماعية تركز على التعلم من التفاعل مع الآخرين. الشخصية تركز على الفرد وتطوره الذاتي، ومعالجة المعلومات على العمليات العقلية كالاستقراء والمنظم المتقدم."],["L11","","أدى معلم التربية الإسلامية الوضوء أمام طلابه خطوة خطوة مع الشرح، ثم طلب من كل طالب تطبيقه. الطريقة المستخدمة هي:",["العرض العملي (البيان)","المحاضرة","لعب الأدوار","الاستقصاء"],"العرض العملي يؤدي فيه المعلم المهارة أمام الطلاب ثم يطبقونها، ويناسب المهارات الأدائية. لعب الأدوار تمثيل لموقف اجتماعي، والمحاضرة لا تتضمن أداء المهارة."],["L11","m","تريد معلمة الصف الأول الابتدائي تقديم قيمة الصدق لطالبات في السادسة بأقل قدر من التجريد وبما يثير خيالهن. الطريقة الأنسب هي:",["القصة","المحاضرة","المناظرة","التعليم المبرمج"],"القصة تناسب الصغار وتقدم القيم في موقف حي يثير الخيال. المحاضرة مجردة، والمناظرة تحتاج نضجاً جدلياً، والمبرمج فردي ولا يناسب الأهداف الوجدانية."],["L11","","بعد أن حدد الطلاب مشكلة ذبول النبات، اقترحوا تفسيرات محتملة: قلة الماء، أو نقص الضوء، أو مرض في التربة. هذه الخطوة تمثل:",["وضع الفروض","اختبار الفروض","الشعور بالمشكلة","التعميم"],"الفروض تفسيرات مؤقتة محتملة للمشكلة. اختبارها يكون بجمع الأدلة والتجريب، والتعميم في الخطوة الأخيرة بعد التحقق."],["L11","m","يريد معلم تنفيذ مشروع «حديقة المدرسة» مع طلاب الصف السادس. الخطوة الأولى في طريقة المشروعات هي:",["اختيار المشروع بمشاركة الطلاب","وضع خطة التنفيذ","تنفيذ المشروع ميدانياً","تقويم المشروع"],"خطوات المشروع: اختيار المشروع، ثم التخطيط، ثم التنفيذ، ثم التقويم. اختيار المشروع يكون بمشاركة الطلاب ليرتبط بميولهم."],["L11","","ما الذي يميز طريقة المشروعات عن طريقة حل المشكلات؟",["أنها عمل ممتد ينتهي بمنتج ملموس","أنها تبدأ بالشعور بالمشكلة","أنها تعتمد على وضع الفروض","أنها تُنفذ داخل الصف فقط"],"المشروع عمل هادف ممتد ينتهي بمنتج (حديقة، مجسم، معرض). الشعور بالمشكلة والفروض من خطوات حل المشكلات، والمشروعات غالباً ميدانية خارج الصف."],["L11","","في برنامج تعليمي محوسب، عندما يخطئ الطالب في إطار معين يُحوَّل إلى إطار علاجي يشرح الخطأ ثم يعود إلى المسار الأصلي. نوع البرمجة هنا هو:",["البرمجة المتشعبة","البرمجة الخطية","البرمجة التعاونية","البرمجة الاستقرائية"],"البرمجة المتشعبة (كراودر) تتفرع حسب استجابة الطالب وتقدم إطارات علاجية. الخطية (سكنر) مسار واحد مستقيم لا يتفرع."],["L11","","جميع ما يأتي من خصائص التعليم المبرمج ما عدا:",["تنمية التفاعل الاجتماعي بين المتعلمين","تقسيم المادة إلى خطوات صغيرة","التعزيز الفوري للاستجابة الصحيحة","التقدم بسرعة المتعلم الخاصة"],"التعليم المبرمج فردي ولا ينمي التفاعل الاجتماعي، وهذا من عيوبه. الخطوات الصغيرة والتعزيز الفوري والخطو الذاتي خصائصه الأساسية."],["L11","m","أعد معلم وحدة تعلم ذاتي متكاملة تتضمن أهدافاً واختباراً قبلياً وأنشطة بدائل متعددة الوسائط واختباراً بعدياً يدرسها الطالب بنفسه. هذه الوحدة تسمى:",["الحقيبة التعليمية","المحاضرة المسجلة","الرحلة المعرفية","خريطة المفاهيم"],"الحقيبة التعليمية وحدة تعلم ذاتي متكاملة بهذه المكونات. الرحلة المعرفية بحث موجه عبر الإنترنت، والمحاضرة المسجلة مصدر واحد بلا أنشطة بدائل."],["L11","","وحدة تعليمية صغيرة مستقلة من برنامج أكبر، يدرسها الطالب ذاتياً ويُقوَّم بعدها قبل الانتقال إلى التالية، تسمى:",["الموديول","المشروع","الاستقصاء","التدريس المصغر"],"الموديول (الوحدة النسقية) وحدة صغيرة مستقلة للتعلم الذاتي. التدريس المصغر تدريب للمعلم، والمشروع عمل ممتد، والاستقصاء طريقة بحث."],["L11","m","أنجزت مجموعة تعاونية مهمتها بدرجة ممتازة، لكن المعلم اكتشف أن طالباً واحداً أنجز كل العمل بينما اكتفى الآخرون بالمشاهدة. العنصر المفقود في هذه المجموعة هو:",["المسؤولية الفردية","التفاعل وجهاً لوجه","الاعتماد الإيجابي المتبادل","المهارات الاجتماعية"],"المسؤولية الفردية تعني أن كل عضو مسؤول عن تعلمه وإسهامه، ويضمنها المعلم بتوزيع الأدوار والاختبار الفردي. التفاعل والاعتماد قد يكونان موجودين شكلاً مع غياب المحاسبة الفردية."],["L11","","عند تشكيل مجموعات التعلم التعاوني، الأفضل أن تكون المجموعة:",["غير متجانسة في مستوى التحصيل من 4 إلى 6 طلاب","متجانسة من المتفوقين فقط","كبيرة تضم نصف الصف","مكونة من الأصدقاء الذين يختارون بعضهم"],"المجموعات غير المتجانسة الصغيرة تتيح تعليم الأقران ومساعدة الضعفاء. المجموعات المتجانسة أو الكبيرة أو مجموعات الأصدقاء تضعف التفاعل والمسؤولية."],["L11","","أثناء عمل المجموعات التعاونية على مهمة، الدور الأنسب للمعلم هو:",["المتابعة والتدخل بالدعم عند الحاجة فقط","الشرح الكامل للمهمة لكل مجموعة على حدة","الجلوس في مكتبه حتى تنتهي المجموعات","حل المهمة أمام الصف ليقلدها الطلاب"],"المعلم في التعاوني ميسر يلاحظ ويقدم الدعم عند الحاجة. الشرح الكامل أو حل المهمة يلغي دور المجموعة، والانسحاب التام يفقدها التوجيه."],["L11","","أثناء تمثيل الطلاب لمشهد في استراتيجية لعب الأدوار، لاحظ المعلم أن أحدهم أدى دوره بطريقة لا تتفق مع الموقف المقصود (دون إساءة لأحد). الإجراء الأنسب هو:",["ترك المشهد يكتمل ثم مناقشة الأداء مع الصف في مرحلة التقويم","إيقاف التمثيل فوراً وتصحيح الأداء أمام الجميع","استبدال
