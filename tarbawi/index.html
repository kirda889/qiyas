توقعة. الإجابة الواحدة تجعل السؤال معرفيًا، وتوقع الردود مسبقًا يقيد حكم المعلم، وضبط الانتباه مطلوب في كل المواقف لا في الأسئلة وحدها. (المعيار القديم 6.3)","1436"],["L15","يستعمل أحد المعلمين عددًا من الطرق الرسمية وغير الرسمية في تقويم فهم الطلاب وتطور أدائهم أثناء تدريسه لكل وحدة دراسية. الفائدة الأساسية من هذه الطريقة في التقويم هي أنها:",["تساعد الطلاب في التقويم الذاتي وتطوير فهمهم لقدراتهم وإمكاناتهم في التعلّم.","تتيح للمعلمين مراقبة تحصيل الطلبة ومدى فاعلية تدريسهم وتعديله عند الحاجة.","تقلل من مستويات القلق لدى الطلاب من عملية التقويم الختامي.","تضمن للمعلم الحصول على بيانات أكثر لأداء الطلبة يساعده في الحكم المناسب."],1,"هذا تقويم تكويني (بنائي) وظيفته الأساسية مراقبة التقدم وتعديل التدريس أثناء الوحدة. (د) مغرٍ لكن جمع بيانات أكثر للحكم وظيفة التقويم الختامي في نهاية الوحدة، وتقليل القلق فائدة ثانوية. (المعيار القديم 7.2)","1436"],["L14","حضر معلم الصف الرابع الابتدائي موقفًا تعرض فيه أحد الطلاب للعنف اللفظي (الشتم) من عدد من زملائه لأول مرّة في الفصل؛ فأي الآتي يمثل الخطوة الأولى للتصرف المباشر الذي يتخذه المعلم في مثل هذا الموقف؟",["تقليل احتمالية حدوث هذه المواقف، بمساعدة الطالب المتعرّض للعنف على تعلم المهارات الاجتماعية المناسبة لعمره.","تبليغ إدارة المدرسة والمرشد والأهل بالحادثة ليتدخلوا تدخلًا مباشرًا.","تنبيه الطلاب المعتدين بأن العنف مرفوض، وإذا تكرر فستكون له عواقب تأديبية.","توفير نموذج للسلوك المقبول يفترض على جميع الطلاب اتباعه."],2,"في أول حدوث للسلوك يعالج المعلم الموقف فورًا بتنبيه المعتدين وبيان خطورة التكرار. التبليغ غير مناسب لسلوك يحدث أول مرة ويمكن للمعلم علاجه بحكمته، ومساعدة الضحية وتوفير النموذج لا يعالجان الموقف الحاصل. (المعيار القديم 8.4)","1436"],["L13","أي الإستراتيجيات التالية تعد الأكثر فاعلية في تعزيز سلوك التعاون الإيجابي بين الطلاب في أحد أنشطة المجموعات الصغيرة؟",["طلب المشاركة بين أعضاء المجموعة في المواد لإكمال المهمة.","تقويم كل عضو في المجموعة لمشاركات زملائه ودورهم في إنجاز المهمة.","إلزام كل مجموعة بتسليم منتج واحد فقط.","عمل مهام معقدة تتطلب من الأعضاء الاعتماد على بعضهم في الحصول على المعلومات."],1,"تقويم الأقران داخل المجموعة يحقق المساءلة الفردية فيشارك كل طالب فعليًا لأن زملاءه سيقوّمون دوره. طلب المشاركة بدهي لا يضمنها، والمنتج الواحد لا يمنع الاتكال، و(د) مغرٍ لكن تعقيد المهام قد ينفّر الطلاب ولا يضمن المشاركة. (المعيار القديم 9.2)","1436"],["L04","تلقى أحد معلمي الصف الأول الثانوي مكالمة هاتفية من والد أحد طلابه، وقد كان منزعجًا من حادثة حصلت لابنه في فصل هذا المعلم، ويرى أن ابنه عوقب بشكل غير عادل، فاستجاب المعلم وطلب موعدًا لمقابلة الأب لمناقشة المشكلة، وهو يرغب في اتخاذ خطوات لضمان التواصل الفعال مع الأب والوصول إلى مقابلة مجدية. يستطيع المعلم أن يحقق هدفه من المقابلة إذا بدأها بما يلي:",["يطلب من الأب اقتراح العقوبة التي يرى أنها الأنسب للتعامل مع الموقف.","يتيح الفرصة للأب للتعبير عن رأيه ومشاعره ووصف فهمه لما حصل.","يراجع مع الأب قوانين المدرسة التي قام ابنه بمخالفتها في ذلك الموقف.","يصف المعلم وجهة نظره فيما يتعلق بالحادثة وأسباب ردة الفعل للأب بالتفصيل."],1,"الاستماع أولًا لولي الأمر يتيح فهم رأيه وتصحيح المفاهيم لدى الطرفين قبل أي نقاش. طلب اقتراح عقوبة أو مراجعة القوانين يفترض ثبوت المخالفة مسبقًا، وعرض وجهة نظر المعلم يعكس هدف المقابلة. (المعيار القديم 10.2)","1436"],["L03","يطلب المعلم في عامه الأول أحيانًا من زملائه الأكثر خبرة الإشراف عليه في الفصل وتقديم النقد البنّاء له. أي الآتي تُعدّ أهم فائدة يحصل عليها من هذه الطريقة؟",["تساهم في اعتياده على عملية التقويم وإحساسه بأهميتها.","تساعده على تعلم تطبيق المبادئ التدريسية بفاعلية في جو الفصل الدراسي.","تقدم له المعرفة والخبرة بآراء وفلسفات متنوعة من الزملاء في التدريس.","توصل لزملائه رغبته بأن يكون عضوًا فعالًا في الفريق."],2,"غرض الزيارة الإشرافية من الزملاء هو الحصول على تغذية راجعة وخبرة متنوعة من ذوي الخبرة لتحسين الأداء في العام الأول. الاعتياد على التقويم ليس هدفًا أساسيًا، و(ب) لم تتضح علاقته المباشرة بالإشراف، و(د) قد يأتي بنتائج عكسية. (المعيار القديم 11.2)","1436"],["L10","أي العوامل المنزلية التالية قد يكون لها الأثر الأكبر على نظرة طالب المرحلة الابتدائية لكفاءته العلمية وربما تدعمه الدراسات في هذا المجال؟",["أساليب الانضباط المتبعة في المنزل.","الترتيب بين الإخوة وطبيعة العلاقة بهم.","معتقدات الوالدين الظاهرة حول قدرات الطالب.","أنواع الألعاب في المنزل والقيمة التعليمية التي تحملها."],2,"إدراك الطفل لكفاءته (الكفاءة الذاتية) يتشكل كثيرًا من توقعات الوالدين المعلنة عن قدراته. أساليب الانضباط وترتيب الإخوة ونوع الألعاب لا تدعم الدراسات علاقة مباشرة بينها وبين نظرة الطالب لكفاءته العلمية. (المعيار القديم 1.2)","1436"],["L05","اقرأ النص التالي: «لم يعد ينظر إلى المتعلمين على أنهم مجرد أفراد مستقبلين للمعلومات، بل على أنهم أشخاص مبدعون، يشكلون بناءهم المعرفي من خلال اتخاذ دور نشط وهادف في تفاعلهم مع بيئتهم، وقادرون على تحقيق أهداف قيمة بما تتضمنه من معارف، ومهارات، واتجاهات تمكنهم من العمل تمكنًا فاعلًا وبنّاءً تحت توجيهات وإشراف المعلم. وقد طُوّرت أساليب التقويم وممارساته؛ لتعكس هذا التوجه متحولة من التركيز الضيق على عينة محددة مختارة من سلوك الطالب إلى تناول مدى واسع من السلوك في مواقف حقيقية متنوعة داخل حجرة الدراسة وخارجها». الفكرة الرئيسة في هذا النص هي:",["الطلاب هم ركيزة الإبداع بما ينجزونه من أهداف قيمة.","المعلم بقدرته على التوجيه والإشراف والقدوة هو محل الإبداع.","أساليب التقويم وتطبيقاته حولت الاهتمام للتعلم المتمركز حول الطالب.","سلوك المواقف الحقيقية داخل حجرة الدراسة هو الموجه الحقيقي لإبداع."],0,"محور النص أن المتعلم مبدع يصنع بناءه المعرفي بنفسه، وما بعده تفاصيل تخدم هذه الفكرة. (ج) مغرٍ لأن التقويم ذُكر، لكنه جزئية جاءت لتعكس التوجه لا لتكون الفكرة، ودور المعلم والمواقف الحقيقية جزئيات كذلك. (المعيار القديم 2.1)","1436"],["L06","يعطي معرض تجاري خصمًا مقداره 20% على بضائعه، فإذا كان سعر إحدى السلع 40 ريالًا قبل الخصم فكم سعرها بالريال بعد الخصم؟",["38","36","34","32"],3,"الخصم = 20 ÷ 100 × 40 = 8 ريالات، فالسعر بعد الخصم = 40 − 8 = 32 ريالًا. الخطأ الشائع طرح 20% كأنها 2 أو 4 ريالات فتظهر 38 أو 36. (المعيار القديم 2.4)","1436"],["L11","يعرض معلم التاريخ موضوع الهجرة النبوية من خلال تصميم نشاط قائم على الأسئلة، حيث يستخدم مراكز للتعلّم موزعة في صالة الأنشطة المدرسية، ويمر الطلاب في مجموعات تعاونية على كل مركز منها، ويقرؤون أو يستمعون إلى تسجيل أو يشاهدون مقاطع فيديو لإكمال النشاط. في أثناء تطبيق هذا النوع من النشاط، الدور المناسب للمعلم هو دور:",["المراقب، الذي يراقب الطلاب ويقوّم تقدّمهم.","المحاضر، الذي يشرح للطلاب الطرق المناسبة لأداء مهامهم.","الميسر، الذي يقدم الدعم والإيضاحات للطلاب عند حاجتهم لها.","المقوّم، الذي يحلل أداء الطلاب ويقترح الطرق لتحسينه."],2,"في التعلم بمراكز المجموعات يكون المعلم ميسّرًا يتدخل بالدعم عند الحاجة فقط. المحاضر يعيد المعلم إلى مركز الدرس، والمراقب والمقوّم يركزان على الحكم على الأداء لا على دعم التعلم أثناء النشاط. (المعيار القديم 4.1، صعوبة 0.585)","1436"],["L04","أرسل ولي أمر طالب بريدًا إلكترونيًا إليك لكونك معلم ولده، يسألك عن رأيك في ابنه وعن صعوبات التعلّم لديه؛ فأي الاختيارات الآتية قد يكون الأنسب في الرد عليه؟",["طلب اجتماع بين ولي الأمر ومدير المدرسة والأستاذ المتخصص في صعوبات التعلّم لدى المدرسة.","تقديم معلومات جاهزة لولي الأمر عن خدمات تدريس الطلبة ذوي صعوبات التعلّم ومصادر وبرامج متنوعة وإضافية موجودة على الإنترنت.","مناقشة عملية التدخلات النظامية ودور ولي الأمر في المراقبة والتقويم معك.","توصية ولي الأمر بمراقبة أداء ابنه في واجباته المدرسية وعاداته السلوكية باستمرار."],0,"تشخيص صعوبات التعلم من اختصاص المختص، فالرد المهني هو ترتيب اجتماع يضم المختص والإدارة وولي الأمر. البدائل الأخرى تفترض وجود الصعوبة قبل تشخيصها أو تحيل ولي الأمر إلى معلومات عامة. (المعيار القديم 10.2، صعوبة 0.325)","1436"],["L08","طُلب من أحد معلمي اللغة الإنجليزية تدريس فصل فيه طلاب ينتمون إلى ثقافات متعددة وأسر ذوات مستويات تعليمية متباينة، فأي الطرق الآتية يمكن للمعلم استخدامها لتعزيز عملية التعلم لديهم على أفضل وجه؟",["وضع الطلاب ذوي المستوى المتقارب في مجموعات تعلميّة صغيرة لأداء الأنشطة التي تناسبهم.","استخدام أساليب الأسئلة التي تتيح للطلاب ذوي الأداء المنخفض تقديم إجابات مختصرة بغض النظر عن كونها صحيحة أو غير صحيحة.","إتباع طريقة تدريس ثابتة لجميع الطلاب لتقديم المفاهيم المهمة في الدرس لهم.","إتاحة فرص متعددة للطلاب المتميزين ليتحدثوا باللغة الإنجليزية ويكتبوا ويقرؤوا عن محتوى الدرس."],0,"مراعاة الفروق تقتضي تجميعًا مرنًا بحسب المستوى مع أنشطة تناسب كل مجموعة. الطريقة الثابتة تتجاهل التنوع، وقبول إجابات خاطئة مختصرة يخفض التوقعات، و(د) يخدم المتميزين فقط. (المعيار القديم 1.3، صعوبة 0.295)","1436"],["L15","الخطوة الأولى في إعداد الاختبار التحصيلي، هي:",["صياغة الأسئلة.","إعداد تعليمات الاختبار.","تحديد الأهداف التعليمية المراد قياسها.","تحليل محتوى المادة الدراسية المستهدفة."],2,"بناء الاختبار يبدأ بتحديد الأهداف التي سيقيسها، ثم تحليل المحتوى، ثم جدول المواصفات، ثم صياغة الفقرات والتعليمات. (د) مغرٍ لأنه مبكر أيضًا لكنه يأتي بعد تحديد الأهداف. (المعيار القديم 7.1، صعوبة 0.593)","1436"],["L04","أي المواضيع الآتية يمكن وضعها على الموقع الإلكتروني لأحد الصفوف الدراسية ومناقشتها مع الطلاب وأولياء أمورهم على أن يُمكَّن الجميع من الوصول إليها والاطلاع على تفاصيلها؟",["تقارير فرديّة لتقدّم التعلّم للطلاب.","أخبار أنشطة الفصل ومواعيد التقويم وتسليم الواجبات.","الآراء الشخصية والمناظرات حول سياسة التعليم في المدرسة.","نتائج اختبارات المنطقة لجميع مستويات المراحل الدراسية."],1,"ما يُنشر للجميع يجب أن يكون معلومات عامة لا تمس خصوصية أحد، كأخبار الفصل والمواعيد. التقارير الفردية ونتائج الاختبارات بيانات سرية، والآراء والمناظرات حول السياسة لا تليق بموقع صفي رسمي. (المعيار القديم 10.2، صعوبة 0.408)","1436"],["L13","أي الأساليب التالية أفضل لضمان استيعاب جميع الطلاب للدرس؟",["التنويع في طرق التدريس المتبعة.","توجيه مجموعة من الأسئلة للطلاب.","البدء بعرض المفاهيم الرئيسة للموضوع.","إعادة شرح الدرس في الحصة عدة مرات."],0,"لا يستوعب «جميع» الطلاب إلا إذا تنوعت الطرق لتناسب اختلاف أنماطهم وقدراتهم. إعادة الشرح بالطريقة نفسها لا تفيد من لم يفهم أول مرة، والأسئلة أداة تقويم لا ضمان استيعاب. (المعيار القديم 4.2، صعوبة 0.629)","1436"],["L12","«تدريب التلاميذ على أداء العبادات أداءً صحيحًا». أي الأهداف الخاصة التالية يمكن اشتقاقه من الهدف العام السابق لتحقيقه؟",["أن يعرف الطالب الوضوء تعريفًا كاملًا.","أن يعدد الطالب أركان الوضوء وشروطه.","أن يؤدي الطالب فرض الوضوء بصورة صحيحة.","أن يذكر الطالب شواهد من القرآن والسنة على فرض الوضوء."],2,"الهدف العام مهاري (أداء العبادات)، فالهدف الخاص المشتق منه يجب أن يكون أداءً كذلك: «يؤدي». التعريف والتعديد وذكر الشواهد أهداف معرفية لا تحقق «الأداء الصحيح». (المعيار القديم 5.1، صعوبة 0.762)","1436"],["L15","أي الآتي يُعدّ أسلوب التقويم الأكثر مناسبة لقياس مدى تمكن الطلاب من محتوى مادة الرياضيات في الصف الثاني الثانوي في الشهر الثاني؟",["اختبار تشخيصي تقدّمه إدارة التربية والتعليم.","الاختبار الذي يعده المعلم لطلابه في المدرسة.","اختبار الإنجاز المقنن الذي توفره الوزارة.","اختبارات يومية قصيرة يتضمنها كتاب الطالب."],1,"قياس التمكن من محتوى درّسه المعلم في فترة محددة يناسبه اختبار من إعداد المعلم نفسه لأنه مطابق لما دُرّس. الاختبارات المقننة والتشخيصية لا تطابق محتوى الشهر، والاختبارات اليومية القصيرة لا تغطي التمكن من المحتوى كله. (المعيار القديم 7.2، صعوبة 0.436)","1436"],["L09","يستخدم معلم العلوم العبارة التالية: «في غرفة الفصل تسعة مصابيح صغيرة»، لمساعدة الطلاب على تذكر عدد الكواكب في مجرتنا. تُعدّ هذه العبارة مثالًا على:",["الربط بالمعايير للدرس.","ملاحظة تلخيص المحتوى.","وسيلة مراجعة للمفاهيم.","وسيلة ربط للذاكرة."],3,"العبارة وسيلة تذكرية (ربط ذاكري) من إستراتيجيات معالجة المعلومات لتسهيل الاسترجاع. (ج) مغرٍ لكن المراجعة إعادة للمحتوى، أما هنا فصورة ذهنية تربط الرقم بشيء مألوف. (المعيار القديم 1.2، صعوبة 0.739)","1436"],["L11","إذا أردت تطبيق طريقة الاستكشاف أثناء تدريسك، فإنك تهدف إلى تدريب الطلاب على:",["تطبيق المعرفة.","اكتساب خبرات التعلم.","الحصول على المعلومات.","كيفية الوصول للمعلومات."],3,"التعلم بالاستكشاف غايته أن يتعلم الطالب «كيف» يصل إلى المعرفة بنفسه، لا أن يتلقاها جاهزة. الحصول على المعلومات نتيجة لأي طريقة، أما الاستكشاف فيدرّب على عملية الوصول. (المعيار القديم 6.5، صعوبة 0.594)","1436"],["L10","أي الأساليب الآتية يُعدُّ مثالًا جيّدًا لتعزيز المعلم التفكير الإبداعي لدى طلاب المرحلة المتوسطة بعد قراءة قصة خيالية مختارة؟",["أن يُعيد الطلاب كتابة نهاية القطعة لتغيير نهاية القصة.","أن يستخدم الطلاب الإنترنت لتحديد معلومات عن الكاتب.","أن يرسم الطلاب صورة ثابتة لبطل القصة.","أن يصور الطلاب مقطع فيديو لإعادة تمثيل أحداث القصة."],0,"تغيير نهاية القصة إنتاج أصيل يتطلب طلاقة ومرونة وهذا جوهر الإبداع. البحث عن الكاتب تذكّر، والرسم والتمثيل إعادة إنتاج لما هو موجود. (المعيار القديم 1.2، صعوبة 0.484)","1436"],["L11","يقدم أحد معلمي الاجتماعيات مادته الدراسية للطلاب في قصة تعطي أوصافًا حيّة لشخصيات تاريخية مؤثرة في المجتمع الإنساني. أي الجمل الآتية يصف أكثر النتائج التعلّمية التي يمكن تحققها عند استخدام هذه الإستراتيجية؟",["سوف يقوم الطلاب بالربط بين فروع المادة العلمية التفصيلية مما يعيق فهمهم للمفاهيم (الصورة) الكبيرة.","سيؤدي ذلك لاستخدام الطلاب لمخيلتهم وتنمية قدرتهم على تطبيق مهارات التفكير الإبداعي في تعلمهم.","سوف يكون وقت الدرس أكثر إمتاعًا وسيصعب ربطه بمحتوى المادة من مفاهيم وحقائق.","سيصبح محتوى المادة أكثر ارتباطًا بحياة الطلاب مما يزيد من قدرتهم على تذكر المعلومات الواقعية."],3,"القصة تجعل الحقائق ذات معنى ومرتبطة بالحياة فيسهل تذكرها. (ب) مغرٍ لكن الاستماع إلى قصة المعلم لا يدرّب على الإبداع بالضرورة، و(أ) و(ج) تفترضان نتائج سلبية غير لازمة. (المعيار القديم 4.2، صعوبة 0.622)","1436"],["L08","أيّ الطرائق الآتية لا يُعَدّ من صور التعجيل الدراسي للموهوبين؟",["حذف بعض المواد الدراسية.","دراسة المادة في زمن أقل من المعتاد.","النقل إلى صفوف أعلى في زمن أقل.","قبولهم في سن مبكرة في المرحلة الابتدائية أو الجامعية."],0,"التعجيل يعني اجتياز المراحل أو المواد بزمن أقل (القبول المبكر، تخطي الصفوف، ضغط المنهج)، أما حذف مواد فليس تعجيلًا بل إنقاص للمحتوى. الفخ هنا صيغة النفي «لا يُعد». (المعيار القديم 1.4، صعوبة 0.641)","1436"],["L10","أكمل طلاب الصف الثالث المتوسط دراسة وحدة في مادة الجغرافيا عن المستكشفين الأوائل لأوروبا؛ فأيّ الأنشطة الآتية يساعد في إظهار أعلى مستوى لمهارة التفكير الناقد عند الطلاب؟",["وضع خط زمني لتسلسل الأحداث خلال فترة التوسع باتجاه الغرب.","إكمال اختبار قصير من فقرات الاختيار من متعدد في نهاية الوحدة التدريسية.","كتابة مقال من وجهة نظر المستكشفين الأوائل في تلك الفترة.","رسم صورة تخيلية لأحد المستكشفين الأوائل في تلك الفترة."],2,"المقال من منظور الشخصيات يتطلب تحليل الدوافع وتفسير الأحداث وإصدار أحكام، وهي أعلى مستويات التفكير الناقد. الخط الزمني والاختبار القصير تذكّر، والرسم التخيلي إبداع لا نقد. (المعيار القديم 4.2، صعوبة 0.387)","1436"],["L09","إذا أراد المعلم تعليم سلوك «احترام رأي الآخرين» فإن من أمثلة التعليم بالنمذجة أن:",["يمارسه.","يشرح معناه.","يحث على فعله.","يكافئ من يمارسه."],0,"النمذجة (باندورا) تعني أن يكون المعلم قدوة يؤدي السلوك أمام الطلاب ليلاحظوه ويقلدوه. الشرح والحث تلقين لفظي، والمكافأة تعزيز سلوكي لا نمذجة. (المعيار القديم 8.4، صعوبة 0.664)","1436"],["L12","كتب أحد المعلمين اختبارًا جاء فيه (عرِّف الوضوء – عدِّد فروضه) هذا النوع من الأسئلة يقيس أهدافًا تعليمية من مستوى:",["التذكر.","التطبيق.","التحليل.","التركيب."],0,"«عرّف» و«عدّد» أفعال استرجاع للمعلومات كما حُفظت، وهي مستوى التذكر في تصنيف بلوم. التطبيق يتطلب استخدام المعرفة في موقف جديد، وهذا غير مطلوب هنا. (المعيار القديم 5.1، صعوبة 0.622)","1436"],["L10","أي الأسئلة التالية يشجع على التفكير الإبداعي لدى الطلاب؟",["ما مكونات الماء؟","عدِّد أنواع الطاقة المتجددة؟","كيف نحافظ على سلامة البيئة؟","متى ولد النبي صلى الله عليه وسلم؟"],2,"السؤال المفتوح «كيف نحافظ…» يقبل إجابات متعددة ويستدعي توليد حلول، وهذا ما يشجع الإبداع. الأسئلة الأخرى لها إجابة واحدة محفوظة فهي في مستوى التذكر. (المعيار القديم 4.2، صعوبة 0.721)","1436"],["L15","طلب أحد المعلمين من طلابه في الصف الثالث الثانوي أن يقوم كل طالب بإكمال نموذج طلب توظيف على موقع إلكتروني مع إرفاق سيرته الذاتية. أراد بهذا تقويم أدائهم؛ فهذا النوع من الأسلوب التقويمي يسمح للطالب بأن:",["يطبق ما تعلّمه نظريًا على أرض الواقع.","يحدد مهاراته التقنية التي يحتاج إليها.","يطبق إستراتيجيات ما وراء المعرفة.","يحدد أهدافه التعليمية التي يرغب في تحقيقها من المادة."],0,"هذا تقويم أصيل يضع الطالب في مهمة واقعية، فميزته تطبيق التعلم النظري في الواقع. (ج) مغرٍ لأن المهمة تتطلب تخطيطًا، لكن ما وراء المعرفة ليس ما يقيسه الأسلوب. (المعيار القديم 7.2، صعوبة 0.289)","1436"],["L13","أي الآتي لا يُعَدّ من مميزات استخدام الحاسب الآلي في التعليم؟",["الجمع بين الترفيه والتعليم.","مراعاة السرعة الذاتية للتعلم.","تنمية مهارات التفاعل الاجتماعي.","اعتماد الطالب على نفسه في التعليم."],2,"التعلم بالحاسب فردي في الغالب، فمن مآخذه لا مميزاته ضعف التفاعل الاجتماعي. الترفيه والخطو الذاتي والاعتماد على النفس مميزات معروفة له. انتبه لصيغة النفي «لا يُعد». (المعيار القديم 4.3، صعوبة 0.546)","1436"],["L14","اتبع معلم الصف الأول المتوسط خطوات معينة مع طلابه قبل البداية في تنفيذ مشاريعهم البحثية كمجموعات صغيرة لضمان تنفيذ البحوث المتفق عليها بسهولة؛ فأي الخطوات التالية يُعد الأنسب والأكثر فائدة لتحقيق هدفه قبل تنفيذ المشروع؟",["الاجتماع بمسؤول المكتبة المدرسية ومناقشة سهولة تصنيف المصادر التعليمية في المكتبة.","عمل قائمة بالمهارات التعليمية المتوقع من الطلاب اكتسابها بعد تنفيذ المشروعات البحثية بنجاح.","توزيع جدول يحدد أوقات الاجتماع بكل مجموعة بحثية ويناقشهم ويجيب على أسئلتهم.","طلب المعلم من بقية زملائه معلمي الصف الأول المتوسط مناقشة الطلاب في مشروعاتهم البحثية أثناء شرح دروسهم."],2,"سهولة التنفيذ تتحقق بجدول متابعة معلن لكل مجموعة يضمن الدعم والإجابة عن الأسئلة طوال العمل. قائمة المهارات تخطيط للنواتج لا للتنفيذ، ومسؤول المكتبة والزملاء خارج دائرة المتابعة المباشرة. (المعيار القديم 5.3، صعوبة 0.496)","1436"],["L14","اجتمع المعلمون في إحدى المدارس المتوسطة لمناقشة مشكلة تسرّب الطلاب من المدرسة والتركيز على أهمية تنفيذ أساليب لإدارة صفوفهم بصورة أكثر فاعليّة. يجب على المعلمين عند مناقشة هذه المشكلة أن يأخذوا في الاعتبار أن الهدف الرئيس لإدارة بيئة تعلّم طلابهم هو:",["تنظيم الأنشطة المدرسية لضمان التركيز على الأنشطة التي يوجهها المعلم لطلابه.","تنظيم الوقت في جدول يتيح للطلاب معرفة أقصى وقت يستغرقه النشاط سلفًا.","تنظيم الأنشطة التي تتيح مشاركة الفصل بأكمله والمجموعات الصغيرة والتعلّم الفردي بالتساوي.","تنظيم الأنشطة بطرق تعزز حس الطلاب الانتمائي للمدرسة والمشاركة في عضوية مجتمع تعلّم متعاون هادف."],3,"علاج التسرب يبدأ من تعزيز انتماء الطالب للمدرسة وشعوره بالعضوية في مجتمع تعلم؛ هذا هو الهدف الرئيس لإدارة بيئة التعلم. تنظيم الوقت والمشاركة بالتساوي إجراءات تنفيذية لا هدف. (المعيار القديم 9.2، صعوبة 0.720)","1436"],["L15","طلب المعلم من كل طالب أن يجمع أعماله بانتظام في حقيبة، وفي كل أسبوع يطلب من الطلاب مراجعة أعمالهم السابقة ثم إعادتها إلى مكانها داخل الصف، فما الهدف الذي يسعى إليه المعلم من هذا الطلب؟",["مشاركة الطالب زملاءه في عملية التقويم.","إتاحة النقاش بين الطلاب للمقارنة بين أعمالهم.","تقويم مستوى الطلاب في المحافظة على مقتنياتهم.","تشجيع الطالب على التأمل في أعماله ومدى تقدمه."],3,"هذا ملف الإنجاز (البورتفوليو) وغايته التأمل الذاتي في التقدم const STD_N = (function(){const keys=SORDER; const raw=keys.map(k=>88*STDW[k]/100); const fl=raw.map(Math.floor); const left=88-fl.reduce((a,b)=>a+b,0); raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(([_,i])=>fl[i]++); return Object.fromEntries(keys.map((k,i)=>[k,fl[i]]));})();

function free60Ids(){const ds=new Set(DIAG), pool=QS.filter(q=>!q.h&&!q.m&&!q.of&&!ds.has(q.id)); const tw=DORDER.reduce((a,d)=>a+(DOM[d].w||1),0); let out=[];

      {id:"rev2",type:"review",t:"مراجعة أخطاء المحاكي 2",s:"الأخطاء + البطاقات المستحقة"},
      {id:"mock3",type:"test",t:"الاختبار المحاكي 3",s:"آخر محاكاة قبل الاختبار"},
      {id:"final",type:"final",t:"خلاصة الفخاخ",s:"كل الفخاخ في صفحة واحدة + نصائح يوم الاختبار"}
    ]);
}
function taskDone(t){
  if(t.type==="lesson") return !!(S.lessons[t.id]&&S.lessons[t.id].done);
  if(t.type==="test") return !!S.tests[t.id];
  return !!S.tasks[t.id];
}
function buildPlan(){
  const tasks=planTasks();
  const span = S.exam ? Math.max(1, diffDays(S.start,S.exam)) : 30;
  const lessons=tasks.filter(t=>t.type==="lesson"), head=tasks.filter(t=>t.id==="diag"||t.id==="official"), tail=tasks.filter(t=>t.type!=="lesson"&&!head.includes(t));
  let days=[];
  if(span>=tasks.length){
    days = tasks.map(t=>[t]);
    const extra = span-tasks.length;
    for(let i=0;i<extra;i++) days.splice(days.length-6,0,[{id:"buf"+i,type:"review",t:"يوم مراجعة",s:"مراجعة الأخطاء + البطاقات المستحقة + 20 سؤالاً سريعاً"}]);
  } else {
    let tailDays = span>=12 ? tail.map(t=>[t]) : [[tail[0]],[tail[2]],[tail[4],tail[5]]];
    if(span<6) tailDays=[[tail[0],tail[5]]];
    const lessonDays=Math.max(1, span-1-tailDays.length);
    const per=Math.ceil(lessons.length/lessonDays);
    const ld=[]; for(let i=0;i<lessons.length;i+=per) ld.push(lessons.slice(i,i+per));
    days=[head].concat(ld,tailDays);
  }
  return days.map((ts,i)=>({n:i+1,date:addDays(S.start,i),tasks:ts}));
}
function nextTask(){const t=planTasks().find(t=>!taskDone(t));return t||null}

    "في أسئلة المواقف الصفية الإجابة الصحيحة هي التي تعالج الموقف نفسه، في التوقيت الصحيح، وتركز على أثرها في الطالب لا على راحة المعلم. أول حادثة يعالجها المعلم بنفسه قبل التصعيد.",
    "إذا كان بديلان مترادفين فكلاهما خطأ، لأن الإجابة الصحيحة واحدة.",
    "احذف البديلين الأبعد أولاً، ثم قارن الباقيين بالكلمة المفتاحية في السؤال.",
    "الوقت نحو دقيقة لكل سؤال. السؤال الذي يأخذ أكثر من دقيقتين علّمه وارجع له.",
    "لا تترك سؤالاً بدون إجابة.",
    "الأزواج المتشابهة التي تتكرر: التعزيز السالب والعقاب، الصدق والثبات، التكويني والختامي، التمثل والمواءمة، الاستقراء والاستنباط، المنهج الخفي والرسمي، الطلاقة والمرونة والأصالة، الوسيط عند الالتواء.",
    "في الكمي: اقرأ ماذا يُطلب بالضبط (نسبة أم عدد؟ تقريب لأي منزلة؟)، واكتب الخطوة على الورقة.",
    "الليلة الأخيرة: هذه الورقة + البطاقات المستحقة فقط، ونم بدري."];
  return `<section class="stack" style="padding-top:18px">
   <div class="row"><button class="btn sm quiet" data-go="practice">→ الأسئلة</button></div>
   <h1>خلاصة الفخاخ</h1>
   <div class="sheet stack"><h3>نصائح يوم الاختبار</h3><div class="tips">${tips.map(t=>`<div class="tip"><p>${fmt(t)}</p></div>`).join("")}</div></div>
   <div class="hy">${DORDER.map(d=>`<div class="dhead"><span class="sw" style="background:var(--d${d})"></span><h2>${DOM[d].ar}</h2><span class="w">${AR(DOM[d].w)}%</span></div>`+LESSONS.filter(l=>l.d===d).map(l=>`<div class="hy-l"><h3><span class="chip">م${AR(l.sub||l.std)}</span>${esc(l.ar)}</h3><ul>${(SHEET[l.id]||[]).map(t=>`<li>${fmt(t)}</li>`).join("")}</ul></div>`).join("")).join("")}</div>
   <div class="row"><button class="btn" data-act="markFinal">${S.tasks.final?"تمت مراجعتها":"أنهيت الورقة"}</button></div>
  </section>`;
}

/* ---------- settings ---------- */
function reportText(){
  let att=0,cor=0; Object.values(S.q).forEach(s=>{att+=s.a;cor+=s.c});
  const lines=["تقرير مذاكرة رخصة التربوي العام — "+todayStr(),
   "موعد الاختبار: "+(S.exam||"غير محدد"),
   "الدروس المنجزة: "+LESSONS.filter(l=>S.lessons[l.id]&&S.lessons[l.id].done).length+"/"+LESSONS.length,
   "الإجابات: "+att+" · الدقة: "+pct(cor,att)+"%",
   "الاختبارات: "+Object.entries(S.tests).map(([k,v])=>k+"="+v.score+"%").join(" ، "),
   "المعايير:"].concat(SORDER.map(sd=>{const s=stdStats(sd);return "  م"+sd+" "+STDS[sd]+": إتقان "+pct(s.mast,s.total)+"% · دقة "+s.acc+"% · محاولات "+s.att}));
  const weak=LESSONS.map(l=>({l,s:lessonStats(l.id)})).filter(x=>x.s.att>=5).sort((a,b)=>a.s.acc-b.s.acc).slice(0,5);
  lines.push("أضعف الدروس: "+(weak.map(x=>x.l.id+" "+x.l.ar+" ("+x.s.acc+"%)").join(" ، ")||"لا يوجد بعد"));
  lines.push("أخطاء في دورة المراجعة: "+reviewAll().length);
  return lines.join("\n");
}
function viewSettings(){
  return `<section class="stack" style="padding-top:18px"><h1>الإعدادات والتقرير</h1>
   <div class="sheet stack"><h3>موعد الاختبار</h3><div class="set-date"><input type="date" id="examDate" dir="ltr" lang="en" value="${S.exam||""}"><button class="btn sm" data-act="setExam">احفظ</button></div>
     <p class="small muted">الافتراضي 6 نوفمبر 2026 (أول يوم للاختبار التربوي حسب إعلان الهيئة). بداية الخطة: ${fmtDate(S.start)}. <button class="btn sm quiet" data-act="restartPlan">ابدأ الخطة من اليوم</button></p></div>
   <div class="sheet stack"><h3>تقريرك</h3><p class="small muted">انسخه واحتفظ به لتتابع تقدمك من أسبوع لأسبوع.</p>
     <textarea class="report" id="report" readonly>${esc(reportText())}</textarea><div><button class="btn sm" data-act="copyReport">انسخ التقرير</button></div></div>
   <div class="sheet stack"><h3>تصفير التقدم</h3><p class="small muted">يمسح كل الإجابات والدروس والاختبارات من هذا الجهاز.</p>
     ${resetAsk?`<div class="confirm row"><span>متأكد؟ ما تقدر ترجعه.</span><button class="btn sm" data-act="resetYes" style="background:var(--bad);border-color:var(--bad)">نعم، صفّر</button><button class="btn sm quiet" data-act="resetNo">لا</button></div>`:`<div><button class="btn sm quiet" data-act="resetAsk">تصفير…</button></div>`}</div>
   <p class="small muted">المصادر: المعايير المهنية العامة للمعلمين ومؤشراتها وأوزانها النسبية كما في الأدلة الرسمية المنشورة، والأنظمة واللوائح التعليمية المعتمدة، ومراجع علم النفس التربوي والقياس والتقويم. أسئلة البنك تدريبية محاكية لأسلوب الاختبار ومكتوبة من جديد، ونماذج الأسئلة الرسمية منقولة كما نُشرت مع ذكر مصدرها: دليل المتقدم للاختبار التربوي العام (1441هـ) ودليل الاختبار العام للمعلمين (1436هـ).</p>
  </section>`;
}
let resetAsk=false;

/* ---------- render ---------- */
function render(){
  renderNav();
  const v=document.getElementById("view");
  const r=route.name;
  v.innerHTML = r==="plan"?viewPlan(): r==="lessons"?viewLessons(): r==="lesson"?viewLesson(route.id): r==="practice"?viewPractice():
    r==="quiz"?viewQuiz(): r==="cards"?viewCards(): r==="sheet"?viewSheet(): r==="settings"?viewSettings(): viewHome();
  renderSync();
  if(r==="quiz"&&session&&session.mode==="exam"&&!session.done){ if(!timerId) timerId=setInterval(tickTimer,1000); tickTimer(); }
}
/* ---------- report a question (sent to GoatCounter as an event; hidden until configured) ---------- */
const GC_CODE = (window.SITE_CFG && window.SITE_CFG.gc) || "";
let reportOpen = null;
/* ردّنا على البلاغات (2026-10-24): البلاغ يصل بلا اسم، فالرد يظهر تحت الشرح لكل من يرى السؤال. window.QREPLY[id] = [التاريخ، النص] في src/q_replies.js */
function replyUI(q){const r=(window.QREPLY||{})[q.id];return r?`<div class="qreply"><b>ردّنا على البلاغات <span>· ${esc(r[0])}</span></b>${String(r[1]).split("\n").map(s=>`<div dir="auto">${esc(s)}</div>`).join("")}</div>`:""}
function reportUI(q){
  if(reportOpen!==q.id) return replyUI(q)+`<button class="btn sm quiet" data-act="reportOpen" data-id="${q.id}" style="margin-top:6px">بلّغ عن خطأ في السؤال</button>`;
  return replyUI(q)+`<div class="row" style="margin-top:8px"><span class="small muted">وش المشكلة؟</span>${[["key","الإجابة غلط"],["unclear","السؤال غير واضح"],["typo","خطأ إملائي"]].map(([k,l])=>`<button class="chip" data-act="reportSend" data-id="${q.id}" data-v="${k}" style="background:none;cursor:pointer">${l}</button>`).join("")}</div>`;
}
const SITE_ID = "tarbawi";
let toastT=null;
function toast(m){let el=document.getElementById("toast"); if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)} el.textContent=m; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true},2200)}

/* ---------- events ---------- */
function openTask(id){
  const t=planTasks().find(x=>x.id===id); if(!t) return;
  if(t.type==="lesson") return go({name:"lesson",id});
  if(t.type==="test") return startTest(id);
  if(t.type==="final") return go({name:"sheet"});
  if(t.type==="review"){ S.tasks[id]=true; save(); if(reviewDue().length) return startReview(); toast("ما عندك أخطاء مستحقة. راجع البطاقات"); return startCards(null) }
}
window.QXEV=function(n,t){try{if(/localhost|127\.0\.0\.1/.test(location.hostname))return; if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:n+"/"+SITE_ID,event:true});const u="https://api.yousefalshamrani.com/v1/ev",b=t?JSON.stringify({n:n+"/"+SITE_ID,t:t}):n+"/"+SITE_ID; if(navigator.sendBeacon)navigator.sendBeacon(u,b); else fetch(u,{method:"POST",body:b,keepalive:true})}catch(e){}};
function startTest(k){if(window.PW&&PW.gate("test:"+k))return; if(k==="diag")QXEV("start_diag"); if(k==="free60")QXEV("start_free60");const T=TESTS[k]; if(!T.ids.length){toast("لا توجد أسئلة بعد");return} startSession({mode:T.practice?"practice":"exam",kind:"test",ref:k,title:T.title,ids:T.ids.slice(),min:T.min})}
function startReview(){const due=shuffle(reviewDue()).slice(0,30); if(!due.length){toast("ما فيه أخطاء مستحقة اليوم");return} startSession({mode:"practice",kind:"review",title:"مراجعة الأخطاء",ids:due.map(q=>q.id)})}
function startDaily(){
  const seed=hash(todayStr()); const out=[];
  SORDER.forEach((sd,i)=>{const pool=quizPool(q=>q.std===sd&&!q.of); const k=Math.max(1,Math.round(10*STDW[sd]/100)); out.push(...shuffle(pool,seed+i).slice(0,k))});
  const ids=shuffle(out,seed).slice(0,10).map(q=>q.id); if(!ids.length){toast("لا توجد أسئلة بعد");return}
  startSession({mode:"practice",kind:"daily",title:"سؤال اليوم ×10 · "+fmtDate(todayStr()),ids});
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,a"); if(!b) return;
  const ds=b.dataset;
  if(ds.go){ if(ds.go==="cards") fc=null; return go({name:ds.go}) }
  if(ds.lesson) return go({name:"lesson",id:ds.lesson});
  if(ds.std){ const l=LESSONS.find(x=>x.std===ds.std); if(l) return go({name:"lesson",id:l.id}); return }
  if(ds.openTask) return openTask(ds.openTask);
  if(ds.pr){ if(ds.pr==="hot") pr.hot=!pr.hot; else pr[ds.pr]= ds.pr==="n"?+ds.v:ds.v; return render() }
  if(ds.jump!=null){ session.i=+ds.jump; session.confirm=false; return render() }
  if(ds.opt!=null && session && !session.done){
    const q=QBY[session.ids[session.i]], i=+ds.opt;
    if(session.mode==="practice"){ if(session.ans[q.id]!=null) return; session.ans[q.id]=i; recordAnswer(q.id,i===q.a); save(); }
    else { session.ans[q.id]=i; }
    render(); if(session.mode==="practice") revealNext(); return;
  }
  const a=ds.act; if(!a) return;
  const s=session;
  switch(a){
    case "reportOpen": reportOpen=ds.id; render(); break;
    case "reportSend":{const q=QBY[ds.id]; let ok=false; try{ fetch("https://api.yousefalshamrani.com/v1/ev",{method:"POST",body:JSON.stringify({n:"report/"+SITE_ID+"/"+q.l+"/"+q.id+"/"+ds.v,t:String(q.q).slice(0,180)}),keepalive:true}); ok=true }catch(e){}
      toast(ok?"شكراً، وصل البلاغ":"تعذّر إرسال البلاغ الآن"); reportOpen=null; render(); break}
    case "theme":{const n=isDark()?"light":"dark"; document.documentElement.dataset.theme=n; try{localStorage.setItem(THEME_KEY,n)}catch(e){}; renderTheme(); break}
    case "setExam":{const v=document.getElementById("examDate").value; if(!v){toast("اختر التاريخ أولاً");return} S.exam=v; if(diffDays(S.start,v)<1) S.start=todayStr(); save(); toast("حُفظ الموعد"); render(); break}
    case "restartPlan": S.start=todayStr(); save(); toast("بدأت الخطة من اليوم"); render(); break;
    case "lessonQuiz":{if(window.PW&&PW.gate("lesson:"+ds.id))break;const ids=shuffle(QS.filter(q=>q.l===ds.id&&!q.m).map(q=>q.id)); if(!ids.length){toast("لا توجد أسئلة لهذا الدرس بعد");return} startSession({mode:"practice",kind:"lesson",ref:ds.id,title:LBY[ds.id].ar,ids}); break}
    case "lessonCards": if(window.PW&&PW.gate("lesson:"+ds.id))break; startCards(ds.id); break;
    case "cardsAll": startCards(null); break;
    case "cardsAgain": startCards(fc&&fc.lesson); break;
    case "cardsHome": fc=null; render(); break;
    case "flip": fc.flip=!fc.flip; render(); break;
    case "cardYes": case "cardNo":{const id=fc.ids[fc.i]; const st=S.terms[id]||(S.terms[id]={b:0});
      if(a==="cardYes"){st.b=Math.min((st.b||0)+1,5); st.due=addDays(todayStr(),INT[st.b]); fc.known++} else {st.b=0; st.due=addDays(todayStr(),1)}
      fc.i++; fc.flip=false; save(); render(); break}
    case "quick":{
      const isStd=pr.dom.startsWith("s");
      let pool=quizPool(q=>!q.of&&(pr.dom==="all"||(isStd?q.std===pr.dom.slice(1):q.d===pr.dom))&&(!pr.hot||q.h));
      if(pr.dom==="all"&&!pr.hot){ const out=[]; SORDER.forEach(sd=>{const n=Math.max(1,Math.round(pr.n*STDW[sd]/100)); out.push(...shuffle(pool.filter(q=>q.std===sd)).slice(0,n))}); pool=out }
      const ids=shuffle(pool).slice(0,pr.n).map(q=>q.id); if(!ids.length){toast("ما فيه أسئلة بهذا الفلتر");return}
      startSession({mode:"practice",kind:"quick",title:"تدريب سريع",ids}); break}
    case "daily": startDaily(); break;
    case "similar":{const ids=window.PW?PW.similar.filter(id=>QBY[id]):shuffle(QS.filter(q=>q.h&&!q.of&&hOK(q)).map(q=>q.id)).slice(0,20); if(!ids.length)break; startSession({mode:"practice",kind:"similar",title:"أسئلة من الاختبارات الماضية",ids}); break}
    case "review": startReview(); break;
    case "test": startTest(ds.id); break;
    case "bankDom": bankDom=ds.v; render(); break;
    case "bankLock": if(window.PW)PW.open("بقية "+BANK_LABEL); break;
    case "plusLock": if(window.PW)PW.open("كامل أسئلة الخمس سنوات الماضية"); break;
    case "plusUp": plusBox=!plusBox; render(); break;
    case "plusCode":{const c=String((document.getElementById("upc")||{}).value||"").toUpperCase().replace(/[^A-Z0-9]/g,""); if(c.length<8){toast("اكتب الكود كاملاً");break} try{localStorage.setItem("qx.code."+TIER_C.site,c);localStorage.setItem("qx.code.last",c)}catch(e){} location.reload(); break}
    case "mzLock": if(window.PW)PW.open("ملزمة أهم 120 سؤالاً"); break;
    case "mzGet": mzGet(b); break;
    case "bankStart":{const ids=bankIds(bankDom); if(!ids.length)break; QXEV("start_bank"); const bp=bankPos(); startSession({mode:"practice",kind:"bank",title:BANK_LABEL,ids,dom:bankDom}); if(bp&&bp.dom===bankDom&&bp.i>0&&bp.i<ids.length&&ds.v!=="restart"){session.i=bp.i; render()} break}
    case "next": s.i=Math.min(s.i+1,s.ids.length-1); s.confirm=false; bankSave(); render(); window.scrollTo(0,0); break;
    case "prev": s.i=Math.max(0,s.i-1); s.confirm=false; render(); break;
    case "flag":{const id=s.ids[s.i]; s.flags[id]=!s.flags[id]; render(); break}
    case "askSubmit": s.confirm=true; render(); break;
    case "cancelSubmit": s.confirm=false; render(); break;
    case "submit": case "finish": finishSession(); break;
    case "quitQuiz": bankSave(); if(s&&s.mode==="exam"&&!s.done){ if(!s.confirm){s.confirm=true;render();toast("سلّم الاختبار أو ارجع له");return} } stopTimer(); session=null; go({name:"practice"}); break;
    case "retryWrong":{const ids=s.ids.filter(id=>s.ans[id]!==QBY[id].a); startSession({mode:"practice",kind:"retry",title:"إعادة الأخطاء",ids:shuffle(ids)}); break}
    case "markFinal": S.tasks.final=true; save(); toast("ممتاز"); render(); break;
    case "copyReport":{const t=reportText(); const ta=document.getElementById("report");
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("نُسخ التقرير")).catch(()=>{ta.focus();ta.select();toast("حدّد النص وانسخه")}); break}
    case "resetAsk": resetAsk=true; render(); break;
    case "resetNo": resetAsk=false; render(); break;
    case "resetYes": resetAsk=false; S=freshState(); save(); toast("تم التصفير"); go({name:"home"}); break;
  }
});
document.addEventListener("keydown",e=>{
  if(route.name!=="quiz"||!session||session.done) return;
  const k=e.key.toUpperCase(); const map={A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3,"1":0,"2":1,"3":2,"4":3};
  if(k in map && !e.metaKey && !e.ctrlKey){const btn=document.querySelector(`[data-opt="${map[k]}"]`); if(btn&&!btn.disabled) btn.click()}
  if(e.key==="Enter"){const nb=document.querySelector('[data-act="next"],[data-act="finish"]'); if(nb) nb.click()}
});

/* ---------- boot ---------- */
function start(data){
  if(data&&data.session){session=data.session; if(data.route) route=data.route}
  else if(data&&data.route) route=data.route;
  if(data&&data.fc) fc=data.fc;
  render(); initRemote(); try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){} if(window.QXEV) QXEV(window.PW?"view_app":"view_app_full");
  addEventListener("qx-deep",()=>{if(route.name==="lesson")render()});   // الشروح الموسعة تصل بعد الفتح (deep.js)
  // رابط مباشر للتشخيصي من صفحة الاختبار السريع والمنشورات: ‎…/#diag
  if(location.hash==="#diag"){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} startTest("diag")}
  // روابط القروبات (2026-10-21): ‎#questions يفتح تبويب الأسئلة، ‎#bank يبدأ الأسئلة المشابهة مباشرة
  else if(location.hash==="#questions"){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} go({name:"practice"})}
  else if(location.hash==="#bank"){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} const ids=bankIds("all"); if(ids.length)startSession({mode:"practice",kind:"bank",title:BANK_LABEL,ids}); else go({name:"practice"})}
  // رابط مباشر لدرس من الاختبار السريع وصفحات الشرح: ‎…/#lesson-L07
  else{const m=/^#lesson-(L\d+)$/.exec(location.hash); if(m&&LBY[m[1]]){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} go({name:"lesson",id:m[1]})}}
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({route,session,fc}));
if(hot&&hot.ready) hot.ready(start); else start(hot&&hot.data||{});
