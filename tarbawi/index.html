ي مجموعة متميزة بدور يستطيع أداءه بنجاح","يعفيه من المشاركة حتى يتحسن مستواه","يذكره دائماً بضرورة بذل الجهد","يعلن درجاته أمام الصف ليتحفز"],"إشراكه في مجموعة ناجحة بدور في متناوله يمنحه خبرة إتقان وانتماء. الإعفاء والتذكير بالجهد لا يقدمان نجاحاً محسوساً، والإعلان عن الدرجات يحرجه."],["L14","h","يُقصد بمفهوم إدارة الصف:",["تنظيم البيئة التعليمية على نحو يساعد على التعلم","استيعاب الطلاب للقواعد والأنظمة الصفية","توظيف ما لدى المعلم من خبرات","الاهتمام بحل المشكلات الطارئة بحزم"],"إدارة الصف تنظيم شامل للبيئة المادية والنفسية والاجتماعية. حل المشكلات بحزم جزء ضيق منها يركز على الضبط."],["L14","","معلم يرى نفسه المصدر الوحيد للمعلومات، ويتوقع من طلابه الطاعة التامة، ويعتمد على الثواب والعقاب، ويخشاه الطلاب. نمط إدارته:",["تسلطي","فوضوي","ديمقراطي","تشاركي"],"الخوف والطاعة التامة والاحتكار سمات النمط التسلطي، وآثاره اتكالية الطلاب ودافعية خارجية مصدرها الرهبة."],["L14","","من الآثار السلبية للنمط التسلطي في الإدارة الصفية على الطلاب:",["الاتكالية ودافعية خارجية مصدرها الخوف من المعلم","زيادة النقد والإبداع لديهم","قوة الانضباط الذاتي","ارتفاع تقدير الذات"],"التسلط يجعل التعديل في السلوك مرتبطاً بزمن الرهبة، فيفشل الطالب في وضع أهداف لنفسه ويعتمد كلياً على المعلم."],["L14","m","الخصائص الأنسب للقواعد الصفية:",["قليلة، واضحة، إيجابية الصياغة، يشارك الطلاب في وضعها","كثيرة لتغطي كل المواقف المحتملة","تُصاغ بالنهي لتكون حازمة","يضعها المعلم وحده ويعلنها في منتصف الفصل الدراسي"],"القواعد القليلة الواضحة تُحفظ وتُطبق، والصياغة الإيجابية تصف السلوك المطلوب لا الممنوع، والمشاركة تولد الالتزام."],["L14","","معلم يتابع ما يجري في كل أركان الصف وهو يشرح، ويتدخل عند أول بوادر تشويش قبل أن تتسع. هذه المهارة سماها كونين:",["اليقظة (الوعي بما يجري)","التداخل","الزخم","أثر الموجة"],"اليقظة withitness هي إدراك كل ما يحدث وإشعار الطلاب بذلك. التداخل معالجة أمرين معاً، والزخم استمرار الدرس بلا توقف."],["L14","","تساعد المعلمة طالبة في مقعدها، وفي الوقت نفسه توقف همساً في الصف الخلفي بنظرة وإشارة دون أن تقطع المساعدة. المهارة:",["التداخل (معالجة أمرين في وقت واحد)","اليقظة","تنبيه المجموعة","السلاسة"],"التداخل overlapping عند كونين هو القدرة على إدارة موقفين متزامنين. اليقظة هي الوعي، أما التداخل فهو الفعل المتزامن."],["L14","","يقصد بأثر الموجة في إدارة الصف عند كونين أن:",["طريقة معالجة المعلم لسلوك طالب واحد تؤثر في سلوك بقية الطلاب","الفوضى تنتقل من طالب إلى آخر بالتقليد","تكرار القاعدة يثبتها لدى الطلاب","العقوبات تتدرج في الشدة"],"أثر الموجة ripple effect: حين يعالج المعلم سلوك طالب بوضوح وهدوء، يضبط الآخرون سلوكهم تلقائياً."],["L14","m","يفقد المعلم دقائق كثيرة كلما انتقل من الشرح إلى العمل في مجموعات. الإجراء الأنسب:",["تدريب الطلاب على إجراء روتيني ثابت للانتقال مع تحديد الأدوار والأماكن مسبقاً","إلغاء العمل في مجموعات حفاظاً على الوقت","معاقبة من يتأخر في الانتقال","تمديد الحصة لتعويض الوقت الضائع"],"الانتقالات السلسة من مهارات إدارة الوقت الأكاديمي وتُبنى بإجراءات روتينية مدرَّبة. الإلغاء يضحي بالاستراتيجية، والعقاب يعالج العرض."],["L14","m","أي ترتيب للمقاعد أنسب لحصة قائمة على نقاش مفتوح يتبادل فيه الطلاب الآراء؟",["حرف U أو دائرة بحيث يرى الطلاب بعضهم","صفوف متوازية تواجه السبورة","مجموعات متباعدة منعزلة","مقاعد فردية على جدران الصف"],"ترتيب المقاعد يتبع نوع النشاط: الصفوف للعرض، والمجموعات للتعاون، وحرف U للنقاش الذي يتطلب تواصلاً بصرياً بين الجميع."],["L14","","عند تكوين مجموعات تعاونية لمهمة مشتركة، الأفضل أن تكون المجموعات:",["غير متجانسة في المستوى وبأدوار محددة لكل عضو","متجانسة في المستوى يختارها الطلاب بأنفسهم","كبيرة العدد لتقليل عدد المجموعات","متغيرة الأعضاء كل عشر دقائق"],"عدم التجانس يحقق معاونة الأفراد لبعضهم (الهدف الأول للتعاوني) والأدوار تضمن المسؤولية الفردية. العدد المناسب 4–6."],["L14","","في نشاط جماعي لاحظ المعلم أن طالباً واحداً ينجز كل العمل بينما يتفرج الباقون. الإجراء الأنسب:",["توزيع أدوار محددة على الأعضاء ومحاسبة كل طالب على جزئه","حل المجموعة وتكليف كل طالب بالعمل فردياً","مكافأة الطالب النشط أمام المجموعة","تقليل حجم المهمة المطلوبة"],"المسؤولية الفردية والاعتماد المتبادل شرطا التعلم التعاوني، وتتحققان بالأدوار ومحاسبة كل عضو. حل المجموعة تخلٍّ عن الاستراتيجية."],["L14","","دور المعلم أثناء عمل الطلاب في مجموعات:",["ميسّر يتنقل بين المجموعات ويوجهها بالأسئلة","ملقّن يشرح المهمة من مكانه","مراقب صامت لا يتدخل حتى النهاية","مصحح يتابع الدفاتر في مكتبه"],"في التعلم النشط المعلم ميسّر ومرشد: يتابع ويسأل ويوجه دون أن يسيطر أو ينسحب."],["L14","","كلف المعلم طلابه بواجب صفي مدته 15 دقيقة، فأنهاه أحدهم قبل الوقت وبدأ يتحدث مع زميله. الإجراء المناسب:",["تزويده بنشاط إثرائي مرتبط بالدرس","توبيخه أمام زملائه","تكليفه بإعادة حل الواجب","تجاهله حتى ينتهي الوقت"],"الطالب الذي ينهي عمله مبكراً يحتاج مهمة لا عقوبة؛ النشاط الإثرائي يستثمر وقته ويمنع التشويش. الإعادة عقاب على الإنجاز."],["L14","m","نشب شجار بين طالبين أثناء الحصة. أول ما يفعله المعلم:",["يحافظ على هدوئه ويفصل بينهما ويشغل بقية الطلاب بنشاط ثم يعالج الأمر","يوقف الحصة ويحقق معهما أمام الجميع","يستدعي مدير المدرسة فوراً","يعاقب الطالبين معاً دون سؤال"],"السيطرة على الأزمة: هدوء، عزل المتسببين، إشغال الآخرين، ثم معالجة فردية. التحقيق العلني يصعّد، والاستدعاء الفوري تصعيد قبل المعالجة."],["L14","","من مهارات إدارة الوقت الأكاديمي في الحصة:",["إجراءات روتينية ثابتة لبدء الحصة وإنهائها","تمديد الشرح على حساب النشاط","تأجيل التهيئة إلى آخر الحصة","الاستطراد لإبعاد الملل"],"الروتين الثابت يوفر الوقت الضائع في البدايات والنهايات. الاستطراد والتمديد يهدران الوقت."],["L14","m","معلم جديد يرغب في بناء خطة لإدارة صفه. أنسب خطوة يبدأ بها:",["مراقبة المعلمين الفعالين في المدرسة والاستفادة من خبراتهم","قراءة كتب عن التعامل مع الأسر والمجتمع","مناقشة الصعوبات مع المدير وطلب تقويم متكرر","التعاون مع المعلمين الجدد فقط ومناقشة صعوباتهم"],"الخبرة الصفية الحية للمعلمين الفعالين أقرب مصدر للمعلم الجديد. الجدد يفتقرون إلى الخبرة نفسها، والكتب عن الأسر بعيدة عن إدارة الصف."],["L14","m","كلما أنجز الطالب واجبه كتب المعلم عبارة ثناء في دفتره، فازداد التزامه بالواجب. الإجراء:",["تعزيز موجب","تعزيز سالب","عقاب سالب","انطفاء"],"أُضيف مثير سارّ (الثناء) بعد السلوك فزاد، وهذا تعزيز موجب."],["L14","","وبّخ المعلم طالباً أمام زملائه بعد مقاطعته، فقلّت مقاطعاته. من حيث التصنيف السلوكي هذا:",["عقاب موجب","عقاب سالب","تعزيز سالب","تكلفة استجابة"],"أُضيف مثير منفّر (التوبيخ) فقلّ السلوك، وهذا عقاب موجب. تربوياً التوبيخ العلني مرفوض وإن كان فعالاً مؤقتاً."],["L14","","سكب طالب العصير على أرضية الفصل، فطلبت منه المعلمة تنظيف المكان الذي سكبه فيه فقط. الأسلوب:",["التصحيح البسيط","التصحيح الزائد","تكلفة الاستجابة","الإقصاء"],"إزالة الضرر بقدر الخطأ دون أعمال إضافية هو التصحيح البسيط؛ لو كُلف بتنظيف بقية الفصل لصار تصحيحاً زائداً."],["L14","h","سأل المعلم سؤالاً فوقف طالب يلوح بيده صائحاً «أنا أعرف»، فلم يمنحه المعلم فرصة الإجابة، وأعطاها لمن رفع يده بهدوء. ما فعله المعلم:",["إطفاء السلوك غير المرغوب مع تعزيز السلوك البديل","عقاب موجب","تكلفة استجابة","تشكيل"],"حجب التعزيز (فرصة الإجابة) عن الصياح هو الإطفاء، وإعطاء الفرصة للهادئ تعزيز تفاضلي للبديل. لم يُضف منفّر ولم يُسحب معزز مكتسب."],["L14","h","«الانطفاء» من الأنماط التي يستخدمها المعلم لتحقيق بيئة صفية فعالة، ويُقصد به:",["تجاهل المعلم للسلوك غير المناسب حتى يتلاشى","كف المعلم السلوكيات غير المناسبة في وقت مبكر","تأنيب المعلم للمتعلم الذي أصدر السلوك منفرداً","إبعاد المتعلم الذي أصدر السلوك من الموقف التعليمي"],"الانطفاء حجب التعزيز عن السلوك فيتلاشى، وأبرز صوره التجاهل المقصود. الإبعاد إقصاء، والتأنيب عقاب موجب."],["L14","m","قال المعلم لطلابه: «من ينهي تمارين الصفحة يحصل على عشر دقائق في ركن القراءة الحرة». يطبق المعلم:",["مبدأ بريماك","الاقتصاد الرمزي","تكلفة الاستجابة","التحصين التدريجي"],"نشاط محبب (القراءة الحرة) اشتُرط بإنهاء نشاط أقل حباً (التمارين)، وهذا بريماك. الاقتصاد الرمزي يحتاج رموزاً تُجمع وتُستبدل."],["L14","h","يجمع الطلاب نجوماً عند كل سلوك إيجابي ثم يستبدلونها في نهاية الأسبوع بجوائز. هذا النظام:",["الاقتصاد الرمزي","مبدأ بريماك","العقد السلوكي","التعزيز المتقطع"],"المعززات الرمزية (النجوم) التي تُستبدل لاحقاً بمعززات حقيقية هي الاقتصاد الرمزي."],["L14","m","عند تعليم طفل الكتابة يعزز المعلم أولاً مسكه القلم صحيحاً، ثم الكتابة على السطر، ثم استقامة الحروف حتى يتقن. الأسلوب:",["التشكيل","التسلسل","التلقين","النمذجة"],"تعزيز التقريبات المتتابعة نحو السلوك النهائي هو التشكيل (تدرج في الاستجابة). التسلسل تعزيز كل حلقة من حلقات مرتبطة تكوّن سلوكاً عاماً."],["L14","h","تعزيز المتعلم عند تأدية كل حلقة من حلقات السلسلة السلوكية يسمى:",["التسلسل","التشكيل","الإفاضة","التلقين"],"التسلسل يتعامل مع حلقات مترابطة تُعزز واحدة واحدة، بخلاف التشكيل الذي يعزز تقريبات سلوك واحد."],["L14","m","أي الآتي يزيد فاعلية التعزيز؟",["أن يكون فورياً عقب السلوك مباشرة","أن يؤجل إلى نهاية الأسبوع ليجمع السلوكيات","أن يكون معززاً واحداً لجميع الطلاب","أن يُقدم بغض النظر عن السلوك"],"الفورية أهم شروط التعزيز لأنها تربطه بالسلوك مباشرة. التنوع ومراعاة الفروق شرطان آخران، وتقديمه بلا سلوك يفقده معناه."],["L14","","لاكتساب الطالب سلوكاً جديداً يُفضل أن يكون التعزيز:",["متواصلاً في كل مرة ثم ينتقل إلى المتقطع","متقطعاً من البداية","مؤجلاً حتى يثبت السلوك","رمزياً فقط"],"المتواصل يبني السلوك الجديد، ثم المتقطع يحافظ عليه ويجعله أكثر مقاومة للانطفاء."],["L14","","جميع ما يلي يقلل السلوك غير المرغوب ما عدا:",["التعزيز السالب","تكلفة الاستجابة","الإقصاء","الانطفاء"],"التعزيز السالب يزيد السلوك المرغوب بإزالة منفّر. البدائل الثلاثة تقلل السلوك: اثنان عقاب سالب والثالث حجب تعزيز."],["L14","","أعفى المعلم طالباً من الواجب المنزلي لأنه شارك بفاعلية طوال الحصة. الإجراء:",["تعزيز سالب","تعزيز موجب","عقاب سالب","انطفاء"],"أُزيل مثير يراه الطالب منفّراً (الواجب) بعد سلوك مرغوب لزيادته، وهذا تعزيز سالب."],["L14","m","تجاهل المعلم تشويش طالب، ثم أثنى عليه فور أن انشغل بالعمل الصفي. الإجراء:",["التعزيز التفاضلي للسلوك البديل","العقاب السالب","التشكيل","التلقين"],"الجمع بين إطفاء السلوك غير المرغوب وتعزيز نقيضه هو التعزيز التفاضلي، وهو أفعل من الإطفاء وحده."],["L14","","أي الآتي ممنوع تربوياً ونظامياً في التعامل مع مخالفات الطلاب؟",["العقاب البدني والتشهير","تكلفة الاستجابة","الإقصاء المؤقت","التصحيح الزائد"],"ميثاق الأخلاقيات ولائحة السلوك يمنعان العقاب البدني والنفسي والإهانة. البدائل الأخرى أساليب تعديل سلوك مقبولة بضوابط."],["L14","","طالب يرفع يده دائماً ويجيب إجابات صحيحة، لكن المعلم نادراً ما يناديه مفضلاً الطلاب الصامتين، فقلّ رفعه ليده بعد أسابيع. التفسير:",["انطفاء السلوك لغياب التعزيز","عقاب سالب","تعزيز سالب","تعميم"],"السلوك الذي لا يُعزز يتلاشى، وهذا الانطفاء. لم يُسحب شيء يملكه الطالب فلا عقاب سالب."],["L14","m","أخرج المعلم طالباً ليقف في الممر عشر دقائق كلما شوّش. التصنيف السلوكي لهذا الإجراء وحكمه التربوي:",["إقصاء (عقاب سالب)، وإخراج الطالب من الفصل مرفوض لأنه يحرمه من التعلم ويخلّ بالإشراف عليه","تعزيز سالب وهو مقبول","انطفاء وهو الأسلوب الأمثل","تكلفة استجابة وهو مقبول"],"الإخراج عزل عن بيئة الصف فهو إقصاء من حيث التصنيف، لكنه يفقد الطالب التعلم ويتركه بلا إشراف وقد يعززه إن كان يكره الحصة؛ لذلك لا يُستخدم الإقصاء إلا داخل الصف ولمدة قصيرة، والطرد كعقوبة مرفوض في اللائحة."],["L14","","ليتجنب المعلم إشباع الطالب من المعزز، عليه أن:",["ينوّع المعززات ويقدمها بما يتناسب مع الاستجابة","يقدم المعزز نفسه بعد كل استجابة","يزيد كمية المعزز باستمرار","يوقف التعزيز نهائياً"],"الإشباع يُضعف أثر المعزز، والحل التنويع (لفظي، رمزي، نشاط) والتناسب مع حجم الاستجابة."],["L14","h","لدى أحد المعلمين طالب خجول. التصرف التربوي السليم معه:",["دعمه وتشجيعه على المشاركة تدريجياً","ترك الحرية له في المشاركة من عدمها","مراعاة ظروفه بعدم إشراكه","تحويله إلى المرشد الطلابي"],"الدعم والتدرج يبنيان ثقته. ترك الحرية أو عدم إشراكه يثبتان خجله، والتحويل الفوري تصعيد قبل محاولة المعلم."],["L14","","سمع المعلم طالباً يسب زميله لأول مرة أثناء نشاط جماعي. الخطوة الأولى:",["إيقاف السلوك فوراً وتنبيه الطالب بأن السب مرفوض وله عواقب إن تكرر","إبلاغ ولي أمره بالحادثة في اليوم نفسه","إحالته إلى المرشد الطلابي","تجاهل الموقف لأنه الأول"],"أول حادثة يعالجها المعلم مباشرة بالتنبيه وتوضيح العواقب (منطق دليل الهيئة). الإبلاغ والإحالة خطوات لاحقة عند التكرار، والتجاهل لا يصلح مع العنف اللفظي على زميل."],["L14","m","تكرر اعتداء الطالب نفسه لفظياً على زملائه رغم تنبيه المعلم وتطبيقه العواقب المتفق عليها. الإجراء الآن:",["إحالة الحالة إلى المرشد الطلابي وإشعار الإدارة وولي الأمر وفق اللائحة","تنبيهه مرة أخرى بالأسلوب نفسه","معاقبة الصف كله حتى يضغط عليه زملاؤه","نقل الطلاب المعتدى عليهم إلى فصل آخر"],"بعد استنفاد إجراءات المعلم يأتي التصعيد المنظم (المرشد ثم الإدارة وولي الأمر). العقاب الجماعي مرفوض، ونقل الضحايا يعاقبهم."],["L14","","طالب يتعرض للتنمر ويميل إلى الصمت والعزلة. الإجراء الأنسب تجاهه:",["دعمه ببناء الثقة وتعليمه مهارات اجتماعية مع ضمان حمايته","مواجهته مع المتنمر أمام الصف لتسوية الخلاف","مطالبته بالدفاع عن نفسه بالمثل","تجاهل الأمر لأنه سيتجاوزه مع الوقت"],"المعتدى عليه يحتاج حماية وثقة ومهارات. المواجهة العلنية تزيد الأذى، والرد بالمثل يوسع العنف."],["L14","","من العلامات التي تدل على تعرض الطالب للتنمر:",["الانطواء المفاجئ وكثرة التغيب وتراجع التحصيل","زيادة المشاركة الصفية","ارتفاع تقدير الذات","المبادرة إلى قيادة المجموعات"],"الضحية تنسحب وتتجنب المدرسة وتتراجع درجاتها وقد تشكو آلاماً جسدية متكررة."],["L14","m","جميع ما يلي من ممارسات البيئة الصفية الآمنة ما عدا:",["العقاب الجماعي للصف عند مخالفة بعض الطلاب","وضوح القواعد والعواقب وثباتها","معالجة المخالفة على انفراد","تعزيز السلوك البديل المرغوب"],"العقاب الجماعي يظلم الملتزمين ويهدم الثقة بالمعلم، وهو ممنوع تربوياً. البدائل الأخرى أركان البيئة الآمنة."],["L14","","في حصة مختبر العلوم لاحظ المعلم طالباً يعبث بمواد كيميائية. الخطوة الأولى:",["إيقافه فوراً وإبعاد المواد عنه ثم تذكير الصف بقواعد السلامة","تسجيل مخالفة في سجل السلوك","إبلاغ ولي الأمر بالحادثة","إخراجه من المختبر بقية الفصل الدراسي"],"الخطر الفوري يُوقف أولاً قبل أي إجراء إداري. التسجيل والإبلاغ خطوات لاحقة، والحرمان الطويل عقوبة غير متناسبة."],["L14","m","طالب محبط قليل الدافعية يبدو شارداً ولا يبذل جهداً في أي مهمة. أول ما يفعله المعلم:",["استكشاف سبب إحجامه عن الجهد ثم كسر دائرة الفشل بمهام متدرجة","تحويله فوراً إلى المرشد الطلابي","إبلاغ ولي الأمر بإهماله","تجاهله حتى يبادر بنفسه"],"فهم السبب أول خطوة في أي تعديل سلوك، ثم تُبنى خبرات نجاح صغيرة. التحويل والإبلاغ قبل محاولة المعلم تصعيد مبكر."],["L14","","من مبادئ لائحة السلوك والمواظبة في التعامل مع المخالفات:",["تعزيز الانضباط الذاتي والتدرج في الإجراءات","العقوبة الفورية القصوى لأي مخالفة","إشراك الطلاب في معاقبة زملائهم","حرمان المخالف من الدراسة"],"اللائحة تصنف المخالفات بدرجات وتتدرج في الإجراءات وتهدف إلى الانضباط الذاتي لا الردع فقط."],["L14","","يصدر طلاب الصف ضوضاء كلما انشغل المعلم بمجموعة واحدة. الإجراء الأنسب:",["الاتفاق مع الصف على إشارة صامتة تعني خفض الصوت وتعزيز الالتزام بها","رفع صوت المعلم فوق أصواتهم","معاقبة الصف كله بواجب إضافي","إيقاف العمل بالمجموعات نهائياً"],"الإشارة المتفق عليها إجراء صفي يضبط الصوت دون قطع النشاط أو عقاب جماعي. رفع الصوت يرفع ضوضاء الصف."],["L14","","أي الآتي ليس من الإجراءات المناسبة عند تكرار المخالفة من الطالب نفسه؟",["التشهير به في الطابور الصباحي ليرتدع","تطبيق العواقب المتفق عليها بثبات","إشراك المرشد الطلابي في دراسة الحالة","التواصل مع ولي الأمر"],"التشهير إهانة علنية ممنوعة وتولد العناد. التكرار يستدعي الثبات في العواقب والتصعيد المنظم."],["L14","m","طالبان يتبادلان الشتائم في الفناء وتجمّع حولهما الطلاب. الخطوة الأولى للمعلم المناوب:",["الفصل بينهما فوراً وتفريق المتجمعين ثم الاستماع لكل منهما على انفراد","إبلاغ ولي أمر كل منهما هاتفياً من مكانه","تسجيل مخالفة لكليهما دون سماعهما","الطلب من الطلاب المتجمعين الحكم بينهما"],"إيقاف الموقف وإزالة الجمهور (المعزز للعدوان) أولاً، ثم التحقق الهادئ. التسجيل والإبلاغ بعد فهم ما حدث."],["L14","","أراد معلم ترتيب أماكن جلوس الطلاب وأدوات الفصل. العامل الذي يأخذه بعين الاعتبار أولاً:",["أنواع الأنشطة التعليمية التي سيستخدمها","مستويات إنجاز الطلاب","الخلفيات الاجتماعية والثقافية للطلاب","أطوال الطلاب فقط"],"التنظيم الفيزيائي يتبع النشاط: صفوف للعرض ومجموعات للتعاون. الترتيب حسب الإنجاز أو الخلفية يوسم الطلاب ويضر بالبيئة الآمنة."],["L14","m","يلاحظ المعلم أن طالباً يأتي إلى المدرسة بكدمات متكررة ويتهرب من الحديث عنها. الإجراء المهني:",["إبلاغ المرشد الطلابي وإدارة المدرسة لاتخاذ الإجراء النظامي","استجواب الطالب أمام زملائه لمعرفة السبب","الاتصال بوالده وتوبيخه","تجاهل الأمر لأنه شأن أسري"],"الاشتباه في إيذاء خارج صلاحية المعلم ويتطلب جهات مختصة بسرية. الاستجواب العلني يؤذي الطالب، والاتصال المباشر بالوالد قد يعرضه لخطر أكبر."],["L14","","يحقق المعلم أثراً إيجابياً أكبر في ضبط سلوك طلابه عندما:",["يكون قدوة في السلوك الذي يطلبه منهم","يكثر من التهديد بالعقوبات","يعتمد على العقاب الجماعي","يحيل كل مخالفة إلى الإدارة"],"الطلاب يتأثرون بسلوك المعلم أكثر من أقواله (النمذجة)؛ المعلم الذي يحترم القواعد يجعلها مقبولة."],["L14","","طالب مشاغب تكررت مخالفاته البسيطة، فقرر المعلم أن يبدأ بأسلوب بنّاء قبل التصعيد. الأنسب:",["عقد سلوكي يحدد السلوك المطلوب والمكافأة والعواقب بالاتفاق معه","إنذار كتابي فوري وإحالة للإدارة","تجاهل كل مخالفاته مهما كانت","نقله إلى فصل آخر"],"العقد السلوكي يشركه في المسؤولية ويحدد التوقعات والعواقب بوضوح. الإحالة تصعيد، والتجاهل لا يصلح مع المتكرر."],["L14","m","زمن الانتظار المناسب بعد طرح السؤال الصفي:",["3–5 ثوانٍ","أقل من ثانية","15–20 ثانية","دقيقة كاملة"],"دراسات ماري رو: 3–5 ثوانٍ تكفي للتفكير دون أن يتحول الصمت إلى إحراج."],["L14","","سؤال المعلم: «ما رأيك في تصرف الشخصية في القصة؟ ولماذا؟» نوعه:",["مفتوح يتطلب تفكيراً متباعداً","مغلق له إجابة واحدة","سابر يبني على إجابة سابقة","تجميعي"],"الرأي والتبرير يحتملان إجابات متعددة، وهذا السؤال المفتوح. المغلق يستدعي معلومة واحدة."],["L14","","استماع المعلم للطالب الذي يعاني من مشكلة في جو يتصف بالدفء والتقبل يساعد الطالب على:",["الشعور بالأمن النفسي والتعبير عن مشكلته بحرية","تحقيق الذات وفق هرم ماسلو","التفوق الدراسي الفوري","التنافس مع زملائه"],"الإنصات المتقبل يوفر الأمن والانتماء، وهما شرط البوح. تحقيق الذات قمة الهرم ولا يتحقق بموقف استماع واحد."],["L14","m","أي التعليقات الآتية يمثل تغذية راجعة وصفية؟",["«ترتيب أفكارك واضح، وتحتاج إلى دليل يدعم الفقرة الثانية»","«ممتاز»","«ضعيف، راجع الدرس»","«7 من 10»"],"الوصفية تسمي ما أُنجز وما يُحسَّن وكيف. «ممتاز» تعزيز عام، والدرجة حكم بلا توجيه."],["L14","","استراتيجية «نجمتان وأمنية» في التغذية الراجعة تعني:",["ذكر نقطتي قوة ونقطة تحسين تُصاغ بصيغة أمنية","منح نجمتين لكل إجابة صحيحة","تأجيل التغذية الراجعة إلى نهاية الوحدة","مقارنة الطالب بزميلين متفوقين"],"نجمتان = إيجابيتان، أمنية = جانب تحسين بصيغة لطيفة؛ تحافظ على الدافعية مع توجيه التطوير."],["L14","m","الطالب الخجول يستجيب على نحو أفضل لنوع التواصل:",["غير اللفظي كالابتسامة والإيماءة المشجعة","اللفظي العلني أمام الصف","الكتابي الرسمي فقط","التوبيخ الخفيف لتحفيزه"],"الإشارات غير اللفظية تشجع دون أن تضعه في بؤرة الاهتمام. التواصل العلني يزيد توتره."],["L14","","نمط الاتصال الصفي الذي يتفاعل فيه جميع الطلاب مع بعضهم ومع المعلم بتوجيهه:",["متعدد الاتجاهات (مفتوح)","وحيد الاتجاه","ثنائي الاتجاه","ثلاثي الاتجاه"],"المفتوح نمط التعلم التعاوني؛ وحيد الاتجاه محاضرة، وثنائي الاتجاه مناقشة بين المعلم وطالب."],["L14","m","أثناء إجابة طالب متلعثم بدأ زملاؤه يضحكون. الإجراء الأنسب:",["إيقاف الضحك بحزم وإتاحة الوقت للطالب لإكمال إجابته ثم تعزيز محاولته","نقل السؤال إلى طالب أفضل تخفيفاً عنه","إنهاء النقاش والانتقال إلى نقطة أخرى","الطلب من الطالب الجلوس"],"الأمان النفسي يقتضي حماية الطالب من السخرية وإكمال فرصته. نقل السؤال أو إجلاسه يؤكد للجميع أن الضحك نجح."],["L14","","من مؤشرات الإنصات النشط لدى المعلم:",["إعادة صياغة ما قاله الطالب للتأكد من فهمه","مقاطعة الطالب لتصحيح خطئه فوراً","النظر إلى الدفتر أثناء حديث الطالب","الانتقال فوراً إلى سؤال آخر"],"إعادة الصياغة والإيماء وعدم المقاطعة تُشعر الطالب أنه مسموع ومفهوم."],["L14","","في صف يضم طلاباً من خلفيات ثقافية ولغوية متنوعة، أفضل ممارسة صفية للمعلم:",["إشراك جميع الطلاب في مناقشة الدرس مع إظهار الاحترام لكل طالب","تجميع طلاب كل خلفية في مجموعة واحدة","تجنب الحديث عن الاختلافات نهائياً","إعفاء بعضهم من المشاركة مراعاة لظروفهم"],"احترام التنوع يعني إشراك الجميع باحترام. التجميع حسب الخلفية والإعفاء يعزلان ويوسمان."],["L14","","يبدأ المعلم حصته بالوقوف عند الباب وتحية الطلاب بأسمائهم. يحقق ذلك:",["بيئة إيجابية وشعوراً بالانتماء","ضبطاً صارماً للصف","تقويماً تشخيصياً","تعزيزاً سالباً"],"العلاقة الإيجابية تبدأ بالتحية والاسم؛ وهي أبسط إجراءات البيئة الداعمة في الابتدائية خاصة."],["L14","m","أرسل ولي أمر رسالة غاضبة على منصة التواصل يتهم فيها المعلم بالتحيز ضد ابنه. الإجراء الأنسب:",["طلب لقاء هادئ للاستماع إليه أولاً ثم عرض الحقائق والاتفاق على متابعة","الرد برسالة دفاعية مفصلة تثبت خطأ الطالب","تجاهل الرسالة لأنها غير مهذبة","تحويلها إلى المدير فوراً دون رد"],"الإنصات أولاً قاعدة التعامل مع ولي الأمر الغاضب، ثم الحقائق بهدوء. الرد الدفاعي يصعّد، والتجاهل والتحويل الفوري تخلٍّ عن التواصل."],["L14","","جميع ما يلي يعزز ثقافة تواصل داعمة للتعلم ما عدا:",["السخرية الخفيفة من الإجابات الخاطئة لكسر الجمود","زمن انتظار كافٍ بعد السؤال","تنويع الأسئلة بين مغلقة ومفتوحة","التغذية الراجعة الوصفية"],"أي سخرية تولد خوفاً من الخطأ، وهو أكبر معوقات التفاعل اللفظي."],["L14","m","يريد المعلم تعزيز تعلم طلابه خارج الصف عبر مجموعات تعلم افتراضية. الشرط الأهم لنجاحها:",["أن تكون تحت إشراف المعلم وتوجيهه بأهداف تعلم واضحة","أن تكون مفتوحة لأي شخص خارج المدرسة","أن تُخصص للتسلية والترفيه","أن يديرها الطلاب دون أي متابعة"],"مؤشر الهيئة: مجموعات افتراضية مع زملائهم تحت إشراف المعلم وتوجيهه. غياب الإشراف يفقدها هدفها التعليمي."],["L14","","وصف الطلاب معلمهم بأنه «يسمعنا ويفهمنا حتى لو اختلف معنا». تصف هذه العبارة:",["ثقافة تواصل آمنة تقوم على الإنصات والاحترام","نمطاً فوضوياً في الإدارة","ضعفاً في الضبط الصفي","تعزيزاً مادياً"],"الاستماع مع الاحتفاظ بالرأي ليس تساهلاً؛ هو جوهر الثقافة الداعمة للتعلم التي يشعر فيها الطالب بالقبول."],["L14","m","ينادي المعلم الطلاب المتطوعين وحدهم، فتركزت المشاركة في ثلاثة طلاب. الإجراء الأنسب لتوسيع المشاركة:",["توزيع الأسئلة على الجميع بأسلوب عشوائي مع زمن انتظار وتدرج في الصعوبة","الاكتفاء بالمتطوعين لأنهم الأكثر رغبة","خصم درجات من غير المشاركين","طرح أسئلة أصعب على المتطوعين"],"التوزيع العادل مع زمن الانتظار يرسل رسالة أن الجميع متوقع منهم المشاركة. الخصم يولد الخوف، والاكتفاء بالمتطوعين يهمّش البقية."],["L01","h","رُفع الأذان أثناء شرح المعلم. التصرف الذي يجسد القدوة الحسنة:",["يتوقف عن الشرح ويردد الأذان مع طلابه","يستمر في الشرح حتى لا يضيع وقت الحصة","يروي لهم قصة قصيرة عن فضل الأذان","يذكّرهم بواجب المسلم تجاه الأذان ثم يكمل الشرح"],"القدوة سلوك عملي يراه الطلاب، والترديد مع الأذان نمذجة مباشرة للقيمة. البديل «يوضح واجب المسلم» وعظ لفظي أضعف أثراً من الفعل، والاستمرار في الشرح يفقد الموقف التربوي."],["L01","","النظام الذي يجرّم التنصت والابتزاز والتشهير والدخول غير المشروع عبر الشبكة:",["نظام مكافحة الجرائم المعلوماتية","لائحة السلوك والمواظبة","لائحة الوظائف التعليمية","ميثاق أخلاقيات مهنة التعليم"],"نظام مكافحة الجرائم المعلوماتية (1428هـ) هو المرجع الجزائي للجرائم الإلكترونية. لائحة السلوك تنظم سلوك الطلاب داخل المدرسة لا الجرائم العامة."],["L01","","سُئل المعلم في الصف عن مسألة فقهية خلافية تعددت فيها آراء العلماء. التصرف الأنسب:",["يبين أن المسألة خلافية ويحيل الطلاب إلى المصادر الموثوقة والجهات المختصة دون فرض رأيه","يرجح رأيه الشخصي ويطلب من الطلاب الالتزام به","يرفض الإجابة ويطلب عدم إثارة مثل هذه الأسئلة","يفتح نقاشاً مفتوحاً ليصوّت الطلاب على الرأي الأصح"],"الحياد في القضايا الخلافية من أخلاقيات المهنة. فرض الرأي يخالف الحياد، والرفض يقمع السؤال، والتصويت يجعل الفتوى بالأغلبية."],["L01","m","الوسطية كما يقصدها ميثاق أخلاقيات مهنة التعليم تعني:",["الاعتدال بين الغلو والتفريط في الأقوال والأحكام والتعامل","التوسط بين الطلاب عند الخلاف","اختيار الرأي الذي يرضي أغلبية الطلاب","الامتناع عن الحديث في أمور الدين داخل الصف"],"الوسطية موقف بين طرفين: الغلو (الزيادة) والتفريط (التقصير). البديل «إرضاء الأغلبية» ميوعة لا وسطية، والامتناع عن الدين يناقض رسالة التعليم."],["L01","m","الرقيب الحقيقي على سلوك المعلم بعد الله سبحانه وتعالى، كما ينص الميثاق، هو:",["ضميره اليقظ وحسه الناقد","المشرف التربوي","مدير المدرسة","تقويم الأداء الوظيفي"],"الميثاق يقدم الرقابة الذاتية على كل رقابة خارجية مهما تنوعت أساليبها. المشرف والمدير والتقويم رقابة خارجية."],["L01","","لاحظ المعلم أن بعض طلابه يسخرون من زميل لهم بسبب لهجته ومنطقته. الإجراء الأنسب لتعزيز الهوية الوطنية الجامعة:",["يوظف الموقف لبيان أن تنوع المناطق واللهجات ثراء لوطن واحد ويدعم ذلك بشواهد","يعاقب الساخرين أمام زملائهم ليكونوا عبرة","يطلب من الطالب تغيير لهجته ليندمج مع زملائه","يتجاهل الموقف لأنه مزاح أطفال"],"الهوية الوطنية الجامعة تُبنى بتحويل الموقف إلى درس في وحدة الوطن مع تنوعه. العقاب العلني يخالف الميثاق، وطلب تغيير اللهجة يحمّل الضحية المسؤولية."],["L01","m","أراد معلم تعزيز الهوية الوطنية في درسه. الأسلوب الأكثر فاعلية:",["عرض شواهد وإحصاءات ومنجزات وطنية مرتبطة بموضوع الدرس","إلقاء موعظة عن واجب حب الوطن","تكليف الطلاب بحفظ عبارات عن الوطن","تعليق صور الرموز الوطنية في الصف"],"تعزيز الهوية يكون بالشواهد لا بالوعظ؛ الحقائق والمنجزات تقنع العقل وتحرك الوجدان. الموعظة والحفظ والصور وسائل شكلية أو تلقينية."],["L01","","يميل أحد الطلاب إلى التشدد في أحكامه على زملائه ويصف من يخالفه بالفسق. التدخل الأنسب:",["يحاوره بالأدلة مبيناً سماحة الإسلام ووسطيته ويكون قدوة في التسامح","يثني على تدينه ويطلب من زملائه الاقتداء به","يمنعه من الحديث في الدين داخل الصف","يحيله مباشرة إلى المرشد الطلابي دون حوار"],"الغلو يُعالج بالحوار والدليل والقدوة، وهو دور المعلم أولاً. الثناء يعزز الغلو، والمنع قمع، والإحالة قبل الحوار تخطٍّ لدور المعلم."],["L01","","من أهداف رؤية المملكة 2030 في التعليم:",["تنمية الشراكة المجتمعية وسد الفجوة بين مخرجات التعليم وسوق العمل","قصر التعليم على المسار الأكاديمي","إلغاء التعليم الأهلي","تقليص مراحل التعليم العام"],"الرؤية تستهدف جودة المخرجات وربطها بسوق العمل وتنمية الشراكة المجتمعية والتعلم مدى الحياة. البدائل الأخرى لا علاقة لها بأهدافها."],["L01","","برنامج من برامج رؤية 2030 يستهدف بناء المواطن بالقيم والمهارات من الطفولة المبكرة وحتى التعلم مدى الحياة:",["برنامج تنمية القدرات البشرية","برنامج جودة الحياة","برنامج التحول الوطني","برنامج الإسكان"],"برنامج تنمية القدرات البشرية هو المعني بإعداد مواطن تنافسي عالمياً بالقيم والمعارف والمهارات. جودة الحياة والإسكان والتحول الوطني برامج بأهداف أخرى."],["L01","","يستشهد الميثاق بقول «الحكمة ضالة المؤمن أنى وجدها فهو أحق الناس بها» في سياق:",["التفاعل الإيجابي مع الثقافات الأخرى","الالتزام بالأنظمة واللوائح","العدل بين الطلاب","التطوير المهني الذاتي"],"ورد النص في مادة المعلم والمجتمع عند الحديث عن تنمية أهمية التفاعل الإيجابي مع الثقافات الأخرى لدى الطلاب."],["L01","","أثناء درس عن الأعياد سأل طالب غير سعودي عن عيد يحتفل به في بلده. التصرف الأنسب:",["يتيح له الحديث باختصار ويربط ذلك باحترام الثقافات مع تأكيد الثوابت","يطلب منه الاقتصار على ما ورد في المنهج","يؤجل سؤاله إلى ما بعد الحصة ولا يعود إليه","يحوّل الحديث إلى نقد عادات بلده"],"التفاعل الإيجابي مع الثقافات مع الحفاظ على الثوابت هو جوهر التنوع الثقافي في المعيار. التأجيل دون عودة تجاهل، والنقد إساءة."],["L01","","المعلم الذي يكون «قدوة لطلابه خاصة وللمجتمع عامة» يدل سلوكه على التزامه بـ:",["القيم الإسلامية وأخلاقيات المهنة","اللوائح الإدارية للمدرسة","متطلبات التطوير المهني","مبادئ الشراكة المجتمعية"],"القدوة نص صريح في مادة المعلم وطلابه من الميثاق، وهي من القيم والأخلاقيات لا من اللوائح الإدارية."],["L01","","المعلم الذي يحذر طلابه من مخاطر الغلو والتطرف ويبين لهم قيمة الاعتدال يحقق بنداً في:",["ميثاق أخلاقيات مهنة التعليم","لائحة الوظائف التعليمية","لائحة السلوك والمواظبة","قواعد القبول والتسجيل"],"مادة «المعلم وأداؤه المهني» في الميثاق تنص على أن المعلم يغرس مبدأ الاعتدال والتسامح والتعايش بعيداً عن الغلو والتطرف. اللوائح الأخرى تنظيمية لا قيمية."],["L01","","جميع ما يلي من رموز الهوية الوطنية السعودية ما عدا:",["شعار المدرسة","العلم الوطني","النشيد الوطني","يوم التأسيس"],"العلم والنشيد ويوم التأسيس رموز وطنية جامعة، أما شعار المدرسة فرمز مؤسسي محلي لا وطني."],["L01","","طلب طالب من المعلم رأيه في خلاف سياسي متداول في وسائل التواصل. الأنسب:",["يلتزم الحياد ويوجه الطلاب إلى المصادر الرسمية","يعرض رأيه الشخصي بصراحة","يسمح بنقاش مفتوح بين الطلاب حول القضية","يسخر من الطرف الذي يخالفه"],"الحياد في القضايا الخلافية واجب مهني، والتوجيه للمصادر الرسمية يحمي الطلاب من التضليل. النقاش المفتوح في قضية خلافية يحوّل الصف إلى ساحة لغير ما يُعنى بتعليمهم."],["L01","m","المعلم الذي يصحح لطالب معلومة مغلوطة عن تاريخ الوطن بعرض الوثائق والمصادر يستخدم في تعزيز الهوية أسلوب:",["الشواهد والأدلة","الوعظ المباشر","التلقين","الترهيب"],"عرض الوثائق شاهد يقنع ويبني الهوية على المعرفة. الوعظ والتلقين لا يصححان مفهوماً خاطئاً راسخاً."],["L01","","يتداول الطلاب على هواتفهم مقطعاً مسيئاً لأحد زملائهم. أول ما ينبغي على المعلم:",["إيقاف التداول وتوعيتهم بأن ذلك جريمة معلوماتية ثم إبلاغ المرشد والإدارة","مصادرة الهواتف جميعاً وإتلاف المقطع","تجاهل الأمر لأنه حدث خارج الحصة","معاقبة من صوّر المقطع أمام زملائه"],"حماية الطالب المتضرر وإيقاف الانتشار أولاً مع التوعية بالنظام، ثم الإحالة للجهات المختصة. المصادرة والإتلاف تجاوز للصلاحيات، والعقاب العلني يخالف الميثاق."],["L01","m","تنمية الإحساس بالانتماء للدين والوطن وأهمية التفاعل الإيجابي مع الثقافات الأخرى من بنود الميثاق في مادة:",["المعلم والمجتمع","المعلم وطلابه","المعلم والأسرة","المعلم والمجتمع المدرسي"],"هذا البند هو أول بنود مادة «المعلم والمجتمع». مادة «المعلم وطلابه» تتناول العدل والقدوة وتجنب العقاب."],["L01","","في يوم التأسيس، أي الأنشطة يعزز الهوية الوطنية بصورة أعمق؟",["مشروع طلابي يبحث فيه الطلاب تاريخ الدولة ويعرضونه بالشواهد","ارتداء الزي التراثي دون محتوى معرفي","حفظ تاريخ الحدث لاختبار قصير","عرض مقطع مرئي دون مناقشة"],"المشروع يجعل الطالب يبني المعرفة بنفسه ويربطها بالشواهد. الزي والحفظ والعرض الصامت مظاهر لا تبني الانتماء."],["L01","m","ميل المعلم إلى التهاون في تطبيق القيم بحجة التيسير يقع في:",["التفريط","الغلو","الوسطية","الحياد"],"التفريط هو التقصير والتهاون، وهو الطرف المقابل للغلو. الحياد مصطلح يخص القضايا الخلافية لا تطبيق القيم."],["L01","","معلم يتحدث في الصف بازدراء عن شعوب أخرى. سلوكه يتعارض مع:",["قيم التسامح والتعايش والتفاعل الإيجابي مع الثقافات التي نص عليها الميثاق","لائحة الوظائف التعليمية","قواعد الانضباط الصفي","تعليمات الأنشطة غير الصفية"],"الازدراء يناقض الوسطية والتسامح المنصوص عليهما في الميثاق. اللوائح الأخرى تنظيمية ولا تعالج القيم."],["L01","m","قيمة «حب الوطن» عندما تصبح جزءاً من شخصية الطالب يتصرف بها تلقائياً تكون في مستوى كراثول:",["تمثّل القيمة","الاستقبال","الاستجابة","التنظيم"],"أعلى مستويات المجال الوجداني أن تصبح القيمة طابعاً للشخصية. التنظيم يسبقه (ترتيب القيم في نسق)، والاستقبال والاستجابة أدنى."],["L01","","طلاب في المرحلة الثانوية يشككون في جدوى بعض أنظمة الدولة. الاستجابة التربوية الأنسب:",["حوار هادئ يعرض الحقائق والشواهد ويبين قنوات التعبير النظامية","تجاهل حديثهم لأنه خارج المنهج","التهديد بالإبلاغ عنهم","مجاراتهم في النقد لكسب ثقتهم"],"المراهق يحتاج حواراً بالشواهد وتوجيهاً إلى القنوات النظامية، وهذا جوهر تعزيز الهوية. التهديد يقطع الثقة، والمجاراة تخل بالحياد والقدوة."],["L02","","صدرت وثيقة سياسة التعليم في المملكة العربية السعودية عام:",["1390هـ","1427هـ","1440هـ","1373هـ"],"صدرت بقرار مجلس الوزراء رقم 779 عام 1390هـ. 1427هـ عام الميثاق، و1440هـ عام لائحة الوظائف التعليمية، و1373هـ تأسيس وزارة المعارف."],["L02","","صدر ميثاق أخلاقيات مهنة التعليم عن وزارة التربية والتعليم عام:",["1427هـ","1390هـ","1440هـ","1428هـ"],"الميثاق صدر عام 1427هـ. 1428هـ عام نظام مكافحة الجرائم المعلوماتية، فلا تخلط بينهما."],["L02","m","الرخصة المهنية للمعلم وثيقة تصدرها:",["هيئة تقويم التعليم والتدريب","وزارة التعليم","إدارة التعليم بالمنطقة","المعهد الوطني للتطوير المهني التعليمي"],"اللائحة تعرّف الرخصة بأنها وثيقة تصدرها الهيئة وفق معايير محددة. الوزارة جهة التوظيف لا جهة الترخيص."],["L02","","الدرجة المطلوبة في اختبار الرخصة المهنية للحصول على رتبة معلم متقدم:",["70 فأعلى","50 فأعلى","80 فأعلى","60 فأعلى"],"ممارس 50 فأعلى، متقدم 70 فأعلى، خبير 80 فأعلى، وتُطلب الدرجة في الاختبارين معاً."],["L02","","مدة صلاحية الرخصة المهنية للمعلم:",["خمس سنوات","ثلاث سنوات","عشر سنوات","سنتان"],"الرخصة سارية خمس سنوات من الإصدار أو التجديد أو الترقية، ويُطلب إصدارها خلال 12 شهراً من إعلان أحدث نتيجة."],["L02","m","حصل معلم على 82 في الاختبار التربوي العام و74 في اختبار التخصص. أعلى رتبة يمكنه الحصول عليها:",["معلم متقدم","معلم خبير","معلم ممارس","معلم خبير بعد سنة"],"الدرجة تُحسب بأدنى الاختبارين لأن المستوى مطلوب في كليهما؛ 74 تحقق متقدم (70 فأعلى) ولا تحقق خبير (80). لا يوجد تعويض أو درجة موزونة."],["L02","","من شروط الترقية من رتبة معلم ممارس إلى معلم متقدم وفق اللائحة:",["رخصة سارية بالمستوى المطلوب وتقويم أداء جيد جداً فأعلى آخر ثلاث سنوات وإكمال سنوات الرتبة","اجتياز الاختبار بأي درجة وموافقة مدير المدرسة","حضور عدد محدد من الدورات التدريبية فقط","تزكية من المشرف التربوي"],"الشروط الثلاثة مجتمعة: الرخصة بالمستوى، والتقويم جيد جداً فأعلى لثلاث سنوات، وسنوات الرتبة (6 بكالوريوس، 5 ماجستير، 4 دكتوراه)."],["L02","m","النصاب التعليمي الأسبوعي للمعلم الخبير:",["18 حصة","24 حصة","22 حصة","20 حصة"],"ممارس 24، متقدم 22، خبير 18؛ يقل النصاب بارتفاع الرتبة لإتاحة وقت لمهام التطوير والإسناد."],["L02","","تعرّف لائحة الوظائف التعليمية «التطوير المهني» بأنه:",["عملية منظمة لتنمية المعارف والمهارات العلمية والتربوية وفق المعايير المهنية","الدورات التدريبية التي تقيمها إدارة التعليم","ما يحصل عليه المعلم من مؤهلات أكاديمية","تقويم الأداء الوظيفي السنوي"],"التعريف يربط التطوير بالمعايير المهنية ويجعله عملية منظمة مستمرة لا مجرد دورات أو شهادات."],["L02","","يُعد المعيّن ابتداءً على الوظائف التعليمية تحت التجربة لمدة:",["سنتين","سنة","ستة أشهر","ثلاث سنوات"],"مدة التجربة سنتان يُقوَّم خلالها مرة على الأقل، وإذا لم تثبت صلاحيته تنتهي خدمته."],["L02","","عدد سنوات الرتبة المطلوبة لترقية معلم يحمل البكالوريوس إلى الرتبة التالية:",["ست سنوات","أربع سنوات","خمس سنوات","ثلاث سنوات"],"6 سنوات للبكالوريوس، 5 للماجستير، 4 للدكتوراه. ثلاث سنوات هي مدة التقويم المطلوبة (جيد جداً) لا سنوات الرتبة."],["L02","m","«الحصص التي يقضيها شاغل الوظيفة التعليمية في التخطيط والتقويم وإدارة الأنشطة والمشاركة في التطوير المهني» تسمى في اللائحة:",["الأنشطة اللاصفية","الحصص الصفية","النصاب التعليمي","الحصص الاحتياطية"],"اللائحة تسمي كل ما هو خارج التدريس المباشر أنشطة لاصفية. النصاب هو مجموع الحصص الصفية التدريسية."],["L02","","تُسلَّم نسخة من الدليل التنظيمي لقواعد السلوك والمواظبة ويؤخذ توقيعه بالعلم من:",["ولي الأمر","المرشد الطلابي","معلم الفصل","وكيل شؤون الطلاب"],"اللائحة تشترط إعلام ولي الأمر بالقواعد وتوقيعه عليها ليكون شريكاً في الالتزام، ثم يوقع لاحقاً على العقود السلوكية والتعهدات."],["L02","","تُطبق لائحة السلوك والمواظبة على طلاب المرحلتين المتوسطة والثانوية إذا وقعت المخالفة:",["في الطرقات المحيطة بالمدرسة بمرأى أحد منسوبيها","داخل أسوار المدرسة فقط","في أي مكان خارج المدرسة","في حافلة النقل المدرسي فقط"],"نطاق اللائحة: داخل المدرسة، والأنشطة الخارجية، والحافلات، ويضاف للمتوسطة والثانوية محيط المدرسة بمرأى منسوبيها. «أي مكان» توسيع غير منصوص."],["L02","m","تتعامل مع المشكلة السلوكية لطالب من برامج ذوي الاحتياجات الخاصة في المدرسة:",["لجنة التوجيه والإرشاد مع قسم التربية الخاصة","معلم الفصل منفرداً دون الرجوع لأحد","مدير المدرسة مباشرة دون اللجنة","ولي الأمر وحده في المنزل"],"اللائحة تخص هذه الفئة بإجراء تكاملي بين اللجنة والتربية الخاصة لمراعاة خصائصهم."],["L02","","أفشى معلم في مجلس عام معلومات عن ظروف أسرة أحد طلابه. سلوكه يخالف في الميثاق:",["صون كرامة الطالب وحفظ أسراره وأسرة طالبه","واجب النمو المهني","العمل بروح الفريق","التعاون مع المجتمع المحلي"],"السرية من واجبات المعلم تجاه طلابه وأسرهم. البدائل الأخرى واجبات مهنية لا علاقة لها بالخصوصية."],["L02","m","اتخذ معلم من حصته ساحة لمناقشة قضايا لا علاقة لها بتعليم طلابه في تخصصه. يخالف بذلك بند الميثاق الذي ينص على أن المعلم:",["يستثمر أوقات طلابه ولا يتخذ الدروس ساحة لغير تعليمهم","قدوة لطلابه خاصة وللمجتمع عامة","شريك الوالدين في التربية والتنشئة","أمين على كيان الوطن ووحدته"],"نص المادة الخامسة صريح في استثمار وقت الطالب وعدم تحويل الدرس إلى منبر لغير التعليم."],["L02","","يعاقب معلم طلابه بالضرب والتوبيخ النفسي. موقف الميثاق:",["الطالب ينفر من المدرسة التي يُستخدم فيها العقاب البدني والنفسي، والمربي القدير يتجنبهما","العقاب البدني جائز إذا كان خفيفاً","العقاب النفسي مقبول بديلاً عن البدني","يحق للمعلم اختيار أسلوب العقاب بحرية"],"الميثاق يرفض العقاب البدني والنفسي معاً. البديل «النفسي مقبول» فخ لأن النص يذكرهما معاً."],["L02","","«المعلم شريك الوالدين في التربية والتنشئة» بند من مادة:",["المعلم والأسرة","المعلم وطلابه","المعلم والمجتمع المدرسي","المعلم وأداؤه المهني"],"المادة الثامنة (المعلم والأسرة) تجعل المعلم شريكاً للوالدين ويوطد الثقة بين البيت والمدرسة."],["L02","","يرى الميثاق أن أساس العلاقة بين المعلم وزملائه وبين المعلم والإدارة هو:",["الثقة المتبادلة والعمل بروح الفريق الواحد","المنافسة على التميز","الالتزام الرسمي بالمراسلات","التسلسل الإداري الصارم"],"مادة المعلم والمجتمع المدرسي تنص على الثقة وروح الفريق. المنافسة الفردية تناقض ثقافة التعاون."],["L02","m","المعلم الذي يتابع كل جديد في تخصصه وفنون التدريس يدرك أن النمو المهني في الميثاق:",["واجب أساس والثقافة الذاتية المستمرة منهج حياة","خيار شخصي مرتبط بالرغبة","مسؤولية إدارة التعليم وحدها","مطلوب للترقية فقط"],"المادة الرابعة تجعل النمو المهني واجباً أساسياً على المعلم نفسه، لا خياراً ولا مسؤولية الإدارة."],["L02","","يرفض معلم تنفيذ تعميم من الوزارة بحجة أنه لا يقتنع به. تصرفه يخالف:",["الالتزام بالأنظمة والتعليمات الرسمية","حق المعلم في التظلم من القرارات","مبدأ التطوير المهني الذاتي المستمر","قواعد ضبط الصف وإدارته"],"الميثاق يعد احترام قواعد السلوك الوظيفي والالتزام بالأنظمة ركناً أساسياً. الاعتراض يكون عبر قنوات التظلم لا بالامتناع."],["L02","","تنص الغاية من التعليم في وثيقة السياسة على:",["فهم الإسلام فهماً صحيحاً متكاملاً وغرس العقيدة الإسلامية","إعداد الطالب لمتطلبات سوق العمل فقط","حفظ المقررات الدراسية واستظهارها","تخريج أكبر عدد ممكن من الطلاب"],"الغاية في المادة 28 تبدأ بفهم الإسلام وغرس العقيدة ثم القيم والمعارف والمهارات. سوق العمل هدف من أهداف رؤية 2030 لا الغاية الأصلية للوثيقة."],["L02","","مراحل التعليم العام وفق وثيقة سياسة التعليم:",["ابتدائي ست سنوات ومتوسط ثلاث وثانوي ثلاث","ابتدائي خمس ومتوسط أربع وثانوي ثلاث","ابتدائي ست ومتوسط ثلاث وثانوي أربع","ابتدائي أربع ومتوسط أربع وثانوي أربع"],"السلم التعليمي اثنا عشر صفاً: 6 + 3 + 3."],["L02","m","يجوز لمدير المدرسة قبول طفل يقل عمره عن ست سنوات ولا يحمل شهادة من رياض الأطفال بما لا يزيد على:",["تسعين يوماً، بعد قبول جميع من أتم السادسة","سنة كاملة بموافقة ولي الأمر","ستة أشهر دون أي شرط","ثلاثين يوماً بعد اختبار قبول"],"الاستثناء العام تسعون يوماً مشروط بقبول من أتموا السادسة أولاً. ويرتفع الحد إلى مائة وثمانين يوماً فقط لمن يقدم شهادة انتظام فصلين في رياض الأطفال، وهذا هو الفخ في بديل «ستة أشهر»."],["L02","","معلم يتهاون في الحضور المبكر لحصصه ويغادر قبل انتهائها. سلوكه يتعارض أولاً مع:",["احترام قواعد السلوك الوظيفي والالتزام بالأنظمة","مبدأ الشراكة المجتمعية","متطلبات البحث الإجرائي","تنمية الهوية الوطنية"],"المواظبة من قواعد السلوك الوظيفي التي عدها الميثاق ركناً في تحقيق أهداف المؤسسة."],["L02","m","طُلب من معلم تسليم درجات طلابه لجهة خارجية تجري دراسة. الإجراء الصحيح:",["الرجوع إلى إدارة المدرسة وتسليم البيانات عبر القنوات الرسمية فقط","تسليمها مباشرة لأنها لغرض البحث العلمي","رفض أي تعاون مع الجهات الخارجية","تسليمها بعد حذف الأسماء دون الرجوع للإدارة"],"بيانات الطلاب لا تخرج إلا بإذن الإدارة ووفق النظام. حذف الأسماء لا يغني عن الإذن، والرفض المطلق يعطل التعاون البحثي المشروع."],["L02","","بالتعديل الذي أُقر عام 1446هـ على لائحة الوظائف التعليمية أصبحت الرخصة المهنية:",["إلزامية لمزاولة التعليم اعتباراً من فبراير 2026","اختيارية لجميع المعلمين على رأس العمل","مطلوبة للترقية بين الرتب فقط","مرتبطة باستحقاق العلاوة السنوية"],"التعديل (القرار الوزاري 63694 بتاريخ 5/5/1446هـ) جعل الرخصة شرطاً لمزاولة المهنة من 1 فبراير 2026 وألغى ربطها بالعلاوة، مع إعفاء من بلغ الخمسين من العمر قبل ذلك التاريخ."],["L02","m","طالب يقل عمره عن ست سنوات بأربعين يوماً تقدم للصف الأول الابتدائي. وفق سياسة القبول:",["يجوز قبوله بعد قبول جميع الأطفال الذين أتموا السادسة","لا يجوز قبوله بأي حال","يُقبل مباشرة مثل أقرانه","يُقبل بعد اجتياز اختبار ذكاء"],"أربعون يوماً ضمن حد التسعين يوماً (ومن باب أولى ضمن حد المائة والثمانين لحامل شهادة الروضة)، فيجوز قبوله لكن بعد من أتموا السادسة. القبول المباشر يخالف شرط الأولوية."],["L02","","يرى معلم أن واجباته تقتصر على الشرح داخل الصف ويرفض المشاركة في نشاطات المدرسة. يعد الميثاق المشاركة في نشاطات المدرسة:",["ركناً أساسياً في تحقيق أهداف المؤسسة التعليمية","عملاً تطوعياً اختيارياً","من صلاحيات رائد النشاط وحده","مرتبطة بالمكافآت فقط"],"مادة المعلم والمجتمع المدرسي تجعل المشاركة في نشاطات المدرسة ركناً أساسياً إلى جانب الالتزام بالأنظمة."],["L02","","من الأسس العامة التي تقوم عليها سياسة التعليم في المملكة:",["الإيمان بالله رباً وبالإسلام ديناً وبمحمد صلى الله عليه وسلم نبياً ورسولاً","مجانية التعليم الجامعي","إلزامية التعليم الثانوي","اعتماد اللغة الإنجليزية لغة للتدريس"],"الأساس الأول في الوثيقة هو الإيمان بالله والإسلام والرسالة المحمدية، ثم التصور الإسلامي للكون والحياة والإنسان."],["L02","","يحق للمعلم التظلم من نتيجة تقويم الأداء الوظيفي:",["وفق إجراءات التظلم الواردة في إطار العمل التنظيمي","بالامتناع عن العمل حتى يُعدَّل","عبر وسائل التواصل الاجتماعي","بطلب إعادة التقويم من زميل آخر"],"اللائحة تنظم التظلم بإجراءات رسمية. الامتناع عن العمل أو التشهير مخالفة للسلوك الوظيفي."],["L02","m","المصطلح الذي تعرّفه اللائحة بأنه «كل ما يجب على شاغلي الوظائف التعليمية معرفته وممارسته وفق قيم ومسؤوليات مهنة التعليم»:",["المعايير المهنية","الرخصة المهنية","النصاب التعليمي","التطوير المهني"],"هذا تعريف المعايير المهنية الصادرة عن الهيئة. الرخصة وثيقة، والتطوير عملية، والنصاب حصص."],["L02","","عند ارتكاب طالب مخالفة سلوكية يُستدعى ولي أمره ويُطلب توقيعه على:",["العقد السلوكي أو التعهد الذي يحصل عليه الطالب","شهادة حسن سيرة وسلوك","طلب نقل الطالب","تقويم أداء المعلم"],"لائحة السلوك تشترط توقيع ولي الأمر على العقد السلوكي وأي تعهد ليكون شريكاً في المتابعة."],["L02","","صرّح معلم لطلابه بأن بعض اللوائح «تعليمات ورقية لا تلزمه». الأثر التربوي الأخطر لسلوكه:",["زعزعة احترام الطلاب للأنظمة وفقدانهم القدوة في الالتزام","إضاعة وقت الحصة","إضعاف علاقته بالإدارة","تأخر خطته الدراسية"],"المعلم قدوة؛ استهانته بالنظام تُعلّم الطلاب الاستهانة به. البدائل الأخرى آثار جانبية أقل خطورة."],["L03","h","تبادل الزيارات الصفية بصفة دورية بين معلمي المدرسة يعد شكلاً من أشكال:",["تطوير الأداء المهني","مجتمعات التعلم المهنية الافتراضية","أخلاقيات مهنة التعليم","تحقيق مفهوم المدرسة المتعلمة"],"الزيارات أسلوب مباشر لتطوير الأداء. «الافتراضية» خاطئة لأن الزيارة حضورية، والمدرسة المتعلمة مفهوم أوسع لا يقتصر على الزيارات."],["L03","h","من أساليب التطوير المهني الذاتي للمعلم:",["التعليم المبرمج","الزيارات المتبادلة","الاجتماعات المهنية","الدرس النموذجي"],"التعليم المبرمج والحقائب والقراءة أساليب ذاتية يقوم بها المعلم وحده. الزيارات والاجتماعات والدرس النموذجي أساليب جماعية أو موجهة."],["L03","h","يطلب المعلم في عامه الأول من زملائه الأكثر خبرة زيارته في الفصل وتقديم النقد البناء له. أهم فائدة تحصل من ذلك:",["تقدم له المعرفة والخبرة بأساليب التدريس المتنوعة","تسهم في اعتياده على عملية التقويم وإحساسه بالراحة فيها","تساعده على تطبيق المبادئ التدريسية بفاعلية في جو الفصل","توصل لزملائه رغبته في أن يكون عضواً فاعلاً في الفريق"],"سؤال من دليل الهيئة: المعلم الجديد يفتقر إلى الخبرة بالأساليب، وزيارة الخبراء تطلعه على الأساليب الناجحة. البدائل الأخرى فوائد ثانوية."],["L04","h","يلتقي معلمو الصف الخامس بانتظام لمناقشة الاستراتيجيات التي تساعد الطلاب الذين يجدون صعوبة في الرياضيات. الفائدة المرجوة من هذا اللقاء مساعدة المعلمين على:",["تقديم تعليم مناسب لجميع أنواع ومستويات الطلاب","مكافأة المعلمين الذين يستخدمون طرقاً فعالة","التأكيد على أن بعض المعلمين أفضل من غيرهم","تبادل الآراء حول إزالة الشعور بالإحباط لديهم"],"سؤال من دليل الهيئة (3.1): مجتمع التعلم يركز على تعلم الطلاب. إزالة الإحباط بديل يركز على المعلم لا على أثر اللقاء في الطالب."],["L04","h","أحد أساليب تنمية أداء المعلمين يساعد بصورة كبيرة على التكيف مع المواقف والممارسات التعليمية المختلفة:",["مجموعات التعلم المهنية","اللقاءات الدورية مع أولياء الأمور","التنافس في العطاء بين المعلمين","المؤتمرات والورش التربوية"],"مجتمعات التعلم تتيح تجريب الاستراتيجيات في مواقف مختلفة وتبادل الخبرات باستمرار. المؤتمرات موسمية، والتنافس يناقض ثقافة التعاون."],["L04","h","تعتمد الشراكة بين المدرسة والمجتمع على أطراف مثل إدارة المدرسة وأولياء الأمور والقطاعين الحكومي والخاص والجامعات، ويعتمد نجاحها على الاحترام المتبادل وتقدير جهود المعلمين وتعزيز المسؤولية المتبادلة. ما سبق يعني:",["مقومات الشراكة بين المدرسة والأسرة والمجتمع","خصائص الشراكة المجتمعية بين الأسرة والمدرسة","المسؤولية المجتمعية وعلاقتها بالشراكة المجتمعية","متطلبات تفعيل الشراكة بين المدرسة والأسرة"],"الأطراف وشروط النجاح هي مقومات (أركان) الشراكة. الخصائص تصف طبيعتها، والمتطلبات إجراءات تفعيلها."],["L04","h","عند إعداد المعلم للأنشطة غير الصفية ينبغي مراعاة أن تكون:",["اختيارية بما يتناسب مع إمكانيات المتعلمين","مطبقة داخل المدرسة فقط","موحدة للطلاب جميعهم","مقتصرة على محتويات الكتاب المدرسي"],"فلسفة النشاط غير الصفي تقوم على الميول والطوعية والفروق الفردية. التوحيد والإلزام والحصر في الكتاب تناقضها."],["L04","","من المبادئ الأساسية لمجتمعات التعلم المهنية:",["تشارك الرؤية والقيم والأهداف والتركيز على تعلم الطلاب","التنافس الفردي بين المعلمين","الاعتماد على التدريب الخارجي فقط","تقويم المعلمين بعضهم لبعض لأغراض الترقية"],"المبادئ الأربعة: رؤية مشتركة، ثقافة تعاون، تركيز على تعلم الطلاب، تركيز على النتائج. التنافس والتقويم للترقية يناقضان ثقافة التعاون."],["L04","","من أوعية مجتمعات التعلم المهنية:",["التدريب بالأقران والتوأمة المهنية والبحوث الإجرائية","الاختبارات الوطنية","اجتماعات أولياء الأمور","تقويم الأداء الوظيفي"],"الأوعية هي صيغ عمل المجتمع المهني: التدريب المباشر، الورش، المؤتمرات، البحوث الإجرائية، التدريب بالأقران، التوأمة، الشبكات، مجموعات التخصص."],["L04","","من عوامل نجاح مجتمعات التعلم المهنية:",["القيادة الداعمة على مستوى المدرسة وإدارة التعليم","زيادة عدد الحصص لكل معلم","حصر العضوية في المعلمين الجدد","الاكتفاء باللقاءات الافتراضية"],"عوامل النجاح: نظام فاعل للتطبيق، قيادة داعمة، بنية تنظيمية داعمة. زيادة الحصص تحرم المعلم من وقت التعاون."],["L04","","تُعرَّف الشراكة المجتمعية بأنها:",["إتاحة الفرصة لأكبر عدد من أولياء الأمور ومؤسسات المجتمع للإسهام بالفكر والمشورة والموارد في تطوير التعليم","تبرعات مالية تقدمها الشركات للمدارس","اجتماعات دورية بين المدير والمعلمين","زيارات الطلاب للمصانع والمؤسسات"],"الشراكة أوسع من المال؛ تشمل الفكر والمشورة والموارد البشرية، والعلاقة تبادلية. التبرعات صورة واحدة منها."],["L04","m","أكثر ما يجعل العلاقة بين المدرسة وأولياء الأمور فاعلة ومستمرة:",["التركيز على إظهار الجانب الإيجابي لأداء الأبناء وعدم استدعاء ولي الأمر عند المشكلات فقط","استدعاء ولي الأمر عند كل مخالفة","إرسال التقارير في نهاية العام فقط","الاكتفاء بالتواصل عبر الطالب"],"العلاقة التي تُبنى على المشكلات فقط تجعل ولي الأمر يتجنب المدرسة. التواصل الإيجابي المستمر والدعوة للفعاليات يبنيان الثقة."],["L04","","اشتكى طالب لوالده من معلمه، فحضر الوالد طالباً مناقشة الأمر. ما ينبغي أن يراعيه المعلم في اللقاء:",["الاستماع لشكوى ولي الأمر أولاً ثم عرض الحقائق بأدلة من أعمال الطالب دون مناقشة الطالب أمامه","مواجهة الطالب أمام والده بأخطائه","رفض اللقاء وإحالته إلى الإدارة","إنهاء اللقاء سريعاً لتجنب الجدل"],"الإنصات ثم الأدلة الموثقة مع الحفاظ على سرية اللقاء وعدم الحديث أمام الطفل. المواجهة أمام الوالد تحرج الطالب وتفقد الثقة."],["L04","","من مزايا مجتمعات التعلم المهنية للمعلمين المستجدين:",["توفير البيئة الداعمة والإسناد","إعفاؤهم من النصاب التعليمي","تقليل متطلبات التخطيط","تأجيل تقويم أدائهم"],"الأدبيات تذكر الإسناد والبيئة الداعمة للمستجدين كمزية صريحة. الإعفاءات ليست من وظائف مجتمع التعلم."],["L04","","تريد المدرسة إشراك المجتمع المحلي في دعم برامجها. الجهات التي تُعد من المجتمع المحيط بالمدرسة:",["الجهات الحكومية والأهلية والأفراد القادرون على الدعم","وزارة التعليم وإداراتها فقط","المدارس الأخرى في المدينة فقط","الطلاب وأولياء الأمور فقط"],"المجتمع المحيط يشمل كل من حول المدرسة من جهات وأفراد قادرين على الدعم، والعلاقة تبادلية."],["L04","","المعلم الذي يرحب بإسهام أولياء الأمور بخبراتهم ومهنهم في دعم برامج التعلم يحقق أحد مؤشرات معيار:",["التفاعل مع أولياء الأمور (3.2)","التطوير المهني المستمر (2)","الالتزام بالأخلاق المهنية واللوائح (1.3)","التقويم (10)"],"نص المؤشر: يشجع أولياء الأمور على الإسهام بخبراتهم وعلمهم في دعم برامج التعلم والأنشطة غير الصفية."],["L04","","من النتائج التي تحققها الشراكة المجتمعية الفاعلة:",["توجهات أفضل نحو المدرسة وانخفاض معدل التسرب وارتفاع معنويات المعلمين","زيادة الأعباء الإدارية على المعلم","تقليص دور المدرسة لصالح الأسرة","الاعتماد على التبرعات في رواتب المعلمين"],"النتائج الموثقة: تحصيل أعلى، تسرب أقل، دعم أكبر من أولياء الأمور، معنويات أعلى. البدائل الأخرى آثار سلبية أو غير واردة."],["L02","n","قرأ معلم خبر نشر نظام التعليم العام في أم القرى بتاريخ 1448/2/10هـ، ثم قال لزملائه إن أحكامه مطبقة من يوم نشره. أي العبارات الآتية تصحح كلامه؟",["لم يُطبَّق بعد؛ فالعمل به يبدأ بعد 180 يوماً من تاريخ نشره","النظام مطبق من تاريخ صدور المرسوم الملكي، لا من تاريخ نشره في الجريدة الرسمية","النظام يُعمل به بعد سنة كاملة من تاريخ النشر","النظام لا يُعمل به إلا بعد صدور جميع لوائحه التنفيذية"],"تنص المادة 68 على أن النظام يُعمل به بعد 180 يوماً من تاريخ نشره في الجريدة الرسمية. والمدة تُحسب من تاريخ النشر، لا من تاريخ المرسوم. والسنة مدة أخرى تخص الفترة الانتقالية للوثائق الملغاة."],["L02","n","في الفترة بين نشر نظام التعليم العام وبدء العمل به، أي جهة نص قرار الموافقة على النظام على أنها تمارس اختصاصاتها من تاريخ النشر؟",["مجلس شؤون التعليم العام","إدارات التعليم في المناطق","هيئة تقويم التعليم والتدريب","لجنة المخالفات المنصوص عليها في النظام"],"البند الثاني من قرار مجلس الوزراء رقم 103، ومثله البند الثاني من المرسوم م/36، ينص على أن مجلس شؤون التعليم العام يمارس اختصاصاته من تاريخ نشر النظام في الجريدة الرسمية. أما بقية أحكام النظام فيبدأ العمل بها بعد 180 يوماً (المادة 68)."],["L02","n","سألت معلمة جديدة عن وضع «السياسة العامة للتعليم» بعد صدور نظام التعليم العام. ما الإجابة الصحيحة؟",["أُلغيت بقرار الموافقة على النظام، مع بقاء أحكامها سارية حتى يُقرّ المجلس بديلها خلال سنة","بقيت سارية دون تغيير، لأن مواد النظام لم تذكرها بالاسم ولم تنص على إلغائها صراحة","ألغيت فوراً من تاريخ نشر النظام في الجريدة الرسمية دون أي فترة انتقالية لأحكامها","دُمجت نصوصها كاملة في المادة الثانية من النظام، فأصبحت أهداف التعليم العام فيه هي نصوص السياسة نفسها"],"قرار مجلس الوزراء رقم 103 (البند 4) ألغى السياسة العامة للتعليم الصادرة بالقرار 779 وتاريخ 1389/9/16هـ. وفي البند 5 أبقى أحكامها سارية حتى يقر مجلس شؤون التعليم العام البديل، خلال مدة لا تتجاوز سنة من نفاذ النظام."],["L02","n","وفق تعريفات نظام التعليم العام، تمتد مرحلة «الطفولة المبكرة»:",["من بداية الحضانة حتى نهاية الصف الثالث","من بداية الحضانة حتى نهاية رياض الأطفال","من الولادة حتى سن السادسة","من رياض الأطفال حتى نهاية الصف السادس"],"عرّفت المادة 1 الطفولة المبكرة بأنها التعليم والرعاية من بداية الحضانة حتى نهاية الصف الثالث. والخيار الذي يقف عند نهاية الروضة خطأ شائع، لأن المرحلة في النظام تشمل الصفوف الثلاثة الأولى."],["L02","n","مدير مدرسة يتابع انتظام الطلاب في سنوات الإلزام. وفق نظام التعليم العام، سن التعليم الإلزامي هي:",["من السنة السادسة حتى الخامسة عشرة","من السنة السادسة حتى نهاية الصف الثاني عشر","من رياض الأطفال حتى الخامسة عشرة","من السنة السابعة حتى الثامنة عشرة"],"تنص المادة 4/1 على أن سن التعليم الإلزامي تبدأ من السنة السادسة حتى الخامسة عشرة. أما «حتى نهاية الصف الثاني عشر» فهو حد التعليم العام كله (المادة 1)، لا حد الإلزام."],["L02","n","لاحظت مرشدة طلابية أن طالباً في الحادية عشرة انقطع عن المدرسة لأن والده يشغّله في متجره. ما الذي ينص عليه نظام التعليم العام في هذه الحالة؟",["تتخذ الوزارة مع الجهات المختصة الإجراءات النظامية تجاه من تسبب في انقطاعه","يُترك الأمر لولي الأمر لأنه صاحب القرار في تعليم ابنه ما دام ينفق عليه","يُحوَّل الطالب إلى برامج الانتساب ليجمع بين العمل والدراسة بدلاً من الحضور اليومي","تكتفي المدرسة بتسجيل غيابه وإنذار ولي أمره حتى يتجاوز الطالب سن الإلزام"],"الطالب في سن الإلزام (من 6 إلى 15 سنة، المادة 4/1). والمادة 4/2 تنص على أن الوزارة، بالتنسيق مع الجهات المختصة، تتخذ الإجراءات النظامية تجاه من يتسبب في حرمان الطفل من التعليم أو انقطاعه عنه خلال سنوات الإلزام."],["L02","n","يُعدّ الشخص «معلماً» بحسب تعريف نظام التعليم العام إذا كان:",["مرخصاً له بالعمل في مهنة التعليم العام","حاصلاً على مؤهل جامعي تربوي في أي تخصص","معيَّناً على وظيفة تعليمية في مدرسة حكومية","يدرّس مقرراً دراسياً في أي مؤسسة تعليمية"],"عرّفت المادة 1 المعلم بأنه «من يُرخَّص له بالعمل في مهنة التعليم العام»، فالتعريف مربوط بالترخيص. أما المؤهل والتعيين والتدريس الفعلي فلا تكفي وحدها بحسب نص التعريف."],["L02","n","في ورشة عن مصطلحات النظام، عرضت المدربة هذا التعريف: «المحتوى الذي تتضمنه الخطة الدراسية، ويدرسه الطلاب». أي مصطلح يطابقه؟",["المقرر الدراسي","المنهج التعليمي","البرنامج التعليمي","الإطار الوطني للمناهج"],"في المادة 1: المقرر الدراسي هو المحتوى. أما المنهج التعليمي فهو أهداف مخطط لها تحقق نواتج مقصودة يُتأكد منها بالتقويم، والبرنامج التعليمي نشاط يُنظَّم في إطار المنهج لتحقيق أهداف محددة في مجال محدد."],["L02","n","صمّم معلم نشاطاً يحلل فيه طلابه مقطعاً منتشراً في وسائل التواصل يحمل معلومات مضللة، ويناقشون كيف يتحققون من مصدره. أي هدف من أهداف نظام التعليم العام يخدمه هذا النشاط مباشرة؟",["تنمية الوعي الفكري، والتعامل الواعي مع المحتوى الإعلامي","تعلم لغة أجنبية واحدة على الأقل، وتنمية مهاراتها الأساسية لدى الطلاب","تنمية حب العمل والانضباط والإنتاجية، والوعي بالعادات الصحية","ترسيخ الهوية الوطنية، والاعتزاز بتاريخ الوطن ورموزه، ومعرفة جغرافيته"],"الفقرة 7 من المادة 2 تنص على تنمية الوعي الفكري، وتطوير مهارات التحصن من التيارات والتوجهات المنحرفة، والتعامل الواعي مع المحتوى الإعلامي بمختلف صوره. والنشاط يدرب الطلاب على ذلك مباشرة."],["L02","n","أرادت مدرسة أهلية أن تدرّس بعض المواد بلغة أجنبية إضافة إلى العربية. ما حكم ذلك في نظام التعليم العام؟",["العربية هي الأساس، ويجوز التعليم بلغة إضافية وفق ضوابط يقرها المجلس","يُمنع التعليم بغير اللغة العربية منعاً تاماً في جميع مراحل التعليم العام","يجوز التعليم بأي لغة تختارها المدرسة دون ضوابط","يجوز ذلك في المدارس الحكومية وحدها، بقرار يصدره مدير التعليم في المنطقة"],"تنص المادة 5 على أن اللغة العربية هي اللغة الأساس للتعليم العام، وأنه يجوز التعليم بلغة إضافية وفق ضوابط يقرها مجلس شؤون التعليم العام."],["L02","n","من يرأس «مجلس شؤون التعليم العام» الذي أنشأه النظام؟",["وزير التعليم","رئيس هيئة تقويم التعليم والتدريب","نائب الوزير للتعليم العام","رئيس المركز الوطني للمناهج"],"تنص المادة 7 على إنشاء المجلس برئاسة الوزير، ويكون نائب الوزير للتعليم العام نائباً للرئيس، ورئيس هيئة تقويم التعليم والتدريب عضواً فيه."],["L02","n","أي جهة تختص بتحديد سن القبول في التعليم العام بحسب النظام؟",["مجلس شؤون التعليم العام","وزارة التعليم","مجلس الوزراء","إدارات التعليم في المناطق"],"الفقرة 2 من المادة 8 تجعل تحديد سن القبول من اختصاص المجلس، وكذلك اقتراح تعديل حدّي سنوات الإلزام (المادة 8/3)."],["L02","n","كلّفت الوزارة معلماً في مدرسة حكومية بتدريس مقرر من خارج تخصصه. ما الإطار الذي ينظم هذا التكليف في نظام التعليم العام؟",["قواعد يقرها المجلس، تشمل المزايا المالية والمتطلبات المهنية لتأهيل المعلم","لا يجيز النظام تكليف معلم المدرسة الحكومية بأي مقرر يخرج عن تخصصه","يقرره مدير المدرسة منفرداً بحسب احتياج الجدول الدراسي ونصاب المعلمين فيها","يكون التكليف بموافقة المعلم الكتابية فقط، دون قواعد عامة يقرها المجلس أو الوزارة"],"المادة 46 تجيز للوزارة تكليف معلمين في المؤسسات الحكومية بتدريس مقررات خارج تخصصاتهم وفق القواعد الواردة في الفقرة 4 من المادة 8. وهذه القواعد يقرها المجلس، وتتضمن المزايا المالية والمتطلبات المهنية اللازمة."],["L02","n","طلب ولي أمر أن يدرس ابنه في الصف السابع عن بُعد طوال العام، بحجة أن التقنية متاحة. ما الذي ينص عليه نظام التعليم العام؟",["التعليم حضوري في كل المراحل، والتقنية جزء منه وفق ضوابط التعليم الإلكتروني","يحق لولي الأمر اختيار التعليم عن بُعد بديلاً كاملاً عن الحضور في أي مرحلة دراسية","التعليم عن بُعد هو الأصل في المرحلة المتوسطة، والحضور إلى المدرسة اختياري للطالب","يُحال الطلب إلى المؤسسات التعليمية الافتراضية لتقبله دون أي ضوابط"],"تنص المادة 24 على أن التعليم حضوري في جميع مراحل التعليم العام، وأن للوزارة الاستفادة من تقنيات التعليم بوصفها جزءاً من التعليم الحضوري وفق ضوابط استخدام التعليم الإلكتروني المعتمدة."],["L02","n","التحق طالب ضعيف بصر بفصل عادي في مدرسة حكومية. وفق نظام التعليم العام، كيف يُقوَّم تحصيله؟",["بأساليب تراعي خصائصه وقدراته، مع توفير التقنيات المساعدة","بالاختبار نفسه الذي يؤديه زملاؤه في الفصل، دون أي تعديل أو تقنية مساعدة","يُعفى من التقويم كلياً ما دام مدموجاً في الفصل العادي","يُنقل إلى مركز متخصص ليُقوَّم هناك ثم يعود إلى فصله"],"تنص المادة 20 على دمج الطلاب ذوي الإعاقة في المؤسسات التعليمية، وتوفير الوسائل المناسبة لهم، وتقويمهم بأساليب تراعي خصائصهم واحتياجاتهم وقدراتهم، مع توفير التقنيات المساعدة والتكيفية. أما المراكز المتخصصة فهي لمن يتعذر دمجه (المادة 21)."],["L02","n","رشّحت مدرسة طالباً متفوقاً لتسريع انتقاله إلى المرحلة التالية. أي مما يلي من متطلبات ضوابط التسريع التي ينص عليها النظام؟",["إجراءات تقويم شاملة والتنسيق مع أولياء الأمور","الاكتفاء بمعدل الطالب في السنة الأخيرة","موافقة معلم المادة التي تفوق فيها الطالب","اجتياز الطالب اختباراً دولياً معتمداً"],"تنص المادة 23 على أن ضوابط التسريع تشمل معايير واضحة لتحديد الطلاب المؤهلين، وإجراءات تقويم شاملة، وتدريب المعلمين، وتعزيز التنسيق مع أولياء الأمور، بما يضمن استمرار التفوق والتكيف مع المرحلة الجديدة."],["L02","n","أي الجهات الآتية تشترك في إعداد الإطار الوطني لمناهج التعليم العام بحسب النظام؟",["الوزارة وهيئة تقويم التعليم والتدريب مع المركز الوطني للمناهج","الوزارة وحدها، دون مشاركة هيئة التقويم أو المركز الوطني للمناهج","مجلس شؤون التعليم العام بالاشتراك مع وزارة الثقافة ووزارة الإعلام","المركز الوطني للمناهج وإدارات التعليم في المناطق"],"تنص المادة 27 على أن الوزارة وهيئة تقويم التعليم والتدريب تشتركان مع المركز الوطني للمناهج في إعداد الإطار الوطني لمناهج التعليم العام."],["L02","n","مدرسة أهلية تطبق برنامجاً دولياً، وتسأل عن الاعتماد المدرسي. ما الذي يلزمها به نظام التعليم العام؟",["الاعتماد المدرسي من هيئة تقويم التعليم والتدريب، أو من هيئة دولية تعتمدها","الاعتماد المدرسي اختياري للمدارس التي تطبق برامج دولية سبق أن اعتمدتها الوزارة","يكفي اعتماد الوزارة للبرنامج الدولي، ويغني ذلك عن أي اعتماد مدرسي من جهة أخرى","تختار المدرسة أي هيئة اعتماد دولية تشاء دون أن تعتمدها هيئة التقويم"],"تنص المادة 30/2 على أن المؤسسات التعليمية الخاصة ملزمة بالحصول على الاعتماد المدرسي من هيئة تقويم التعليم والتدريب، أو من إحدى الهيئات الدولية التي تعتمدها الهيئة. واعتماد الوزارة للبرنامج الدولي (المادة 28) أمر مستقل عن ذلك."],["L02","n","مدرسة عالمية خاصة قررت الاستغناء عن مواد الهوية الوطنية لأن برنامجها الدولي لا يتضمنها. ما حكم ذلك في نظام التعليم العام؟",["لا يجوز؛ فالوزارة تشرف بما يضمن تدريس مواد الهوية الوطنية المعتمدة","يجوز ما دامت المدرسة حاصلة على اعتماد مدرسي من هيئة دولية معترف بها","يجوز للمدارس التي تطبق برامج دولية فقط، لأن الوزارة اعتمدت برنامجها","يجوز إذا وافق أولياء الأمور كتابياً على إعفاء أبنائهم"],"تنص المادة 31 على أن الوزارة تشرف على المؤسسات التعليمية الخاصة بما يضمن تحقيق أمور، منها (الفقرة 4) تدريس مواد الهوية الوطنية التي يعتمدها المركز الوطني للمناهج."],["L02","n","تقدّم مستثمر بطلب ترخيص مدرسة أهلية. بماذا يُلزم النظامُ الوزارةَ عند الرد على طلبه؟",["قرار مكتوب خلال 30 يوماً، والرفض يكون مسبَّباً مع حق التظلم","تبلغه الوزارة بقرارها شفهياً خلال 90 يوماً، دون أن تذكر أسباب الرفض","يُعدّ الطلب مقبولاً حكماً إذا لم ترد الوزارة عليه خلال 60 يوماً","يصدر القرار من مجلس شؤون التعليم العام في أول اجتماع له"],"تنص المادة 32/2 على أن الوزارة تبلغ طالب الترخيص بقرارها كتابةً خلال 30 يوماً من تقديم طلبه، وإذا صدر القرار بالرفض وجب أن يكون مسبباً، ولطالب الترخيص حق التظلم."],["L02","n","ثبت على مدرسة أهلية ارتكاب مخالفة لأحكام النظام. أي مما يلي من الجزاءات التي يجوز تطبيقها عليها بحسب نظام التعليم العام؟",["غرامة لا تقل عن 5,000 ريال ولا تزيد على 50,000 ريال","غرامة لا تقل عن 50,000 ريال ولا تزيد على 500,000 ريال","إغلاقها فوراً وتوزيع طلابها على المدارس الحكومية في اليوم نفسه","سحب رخص معلميها المهنية"],"تحدد المادة 60 جزاءات المؤسسات الخاصة بحسب تصنيف المجلس لجسامة المخالفة: الإنذار، وإيقاف تسجيل الطلاب، وغرامة من 5,000 إلى 50,000 ريال، وإلغاء الترخيص مع إكمال العام الدراسي للطلاب المقيدين على نفقة المالك."],["L02","n","رفضت مدرسة تسليم شهادة النجاح لطالب أنهى السنة بنجاح حتى يعيد كتاباً مفقوداً. ما حكم ذلك في ضوء نظام التعليم العام؟",["يخالف حق الطالب في تسلّم شهادة النجاح دون قيد أو شرط","تصرف نظامي، لأن المحافظة على الكتب وإعادتها من واجبات الطالب","يجوز إذا أبلغت المدرسة ولي الأمر كتابياً بسبب حجب الشهادة","يجوز حجبها حتى يدفع ولي الأمر قيمة الكتاب"],"من حقوق الطالب في المادة 38/1 (الفقرة ز) تسلّم شهادة النجاح بعد إتمام السنة الدراسية دون قيد أو شرط. وموضوع الكتاب تعالجه المدرسة بطريق آخر، ولا يُربط بالشهادة."],["L02","n","ألزم معلم طلابه بشراء أدوات باهظة لمشروع لم يرد في الخطة الدراسية ولا في تعليمات الوزارة، وهدّد بحسم درجات من لا يحضرها. أي حق للطالب في نظام التعليم العام يخالفه هذا التصرف؟",["ألا يُكلَّف بعمل ناتج عن اجتهاد فردي لا يتفق مع النظام","الرعاية الصحية الأولية داخل المؤسسة التعليمية عند الحاجة إليها","الحصول على جوائز وحوافز مادية ومعنوية عند تميزه","تسلم شهادة النجاح بعد إتمام السنة الدراسية دون قيد أو شرط"],"تنص المادة 38/1 (الفقرة د) على حق الطالب في ألا يُكلَّف بأي عمل ناتج عن اجتهاد فردي من المعلم أو الكادر الإداري داخل المؤسسة التعليمية لا يتفق مع أحكام النظام واللوائح."],["L02","n","تقدمت طالبة بشكوى إلى وكيلة المدرسة من تعامل إحدى زميلاتها معها. أي إجراء يحقق حق الطالبة كما نص عليه نظام التعليم العام؟",["سماع شكواها، وقيدها، واتخاذ الإجراء اللازم حيالها","سماعها شفهياً ونصحها بالصبر على زميلتها","إحالتها إلى ولي أمرها ليتابع الشكوى خارج المدرسة","تأجيل النظر فيها إلى نهاية الفصل الدراسي"],"من حقوق الطالب في المادة 38/1 (الفقرة ج): سماع شكواه، وقيدها، واتخاذ الإجراء اللازم حيالها. فالإجراء الكامل له ثلاث خطوات، والاكتفاء بالسماع أو التأجيل لا يحققه."],["L02","n","أي مما يلي من الالتزامات التي ينص عليها نظام التعليم العام على الطالب؟",["عدم الإضرار بالمدرسة وتجهيزاتها ومرافقها","المشاركة في لجان تقويم المعلمين","تحمّل تكاليف النقل المدرسي في المؤسسات الحكومية","اختيار المقررات الدراسية التي يرغب فيها"],"تنص المادة 38/2 على التزامات الطالب: احترام المعلمين والهيئة الإدارية وزملائه، والحضور والانصراف في الأوقات المحددة، وبذل الجهد والتعاون البنّاء، وعدم الإضرار بالمدرسة وتجهيزاتها، والالتزام بقواعد السلوك والمواظبة."],["L02","n","ينشر معلم في حسابه الشخصي محتوى يسخر فيه من طلابه وزملائه، ويقول إن ذلك خارج وقت الدوام فلا علاقة للمدرسة به. أي مادة في نظام التعليم العام يخالفها؟",["المادة 49؛ إذ على المعلم الابتعاد عما يمس شرف المهنة داخل المدرسة وخارجها","لا يخالف شيئاً، لأن واجبات المعلم في النظام مقصورة على اليوم الدراسي داخل المدرسة","المادة 38، لأنها تحدد واجبات المعلم داخل الفصل الدراسي فقط","المادة 60، لأنها تنظم جزاءات المؤسسات التعليمية الخاصة المخالفة للنظام"],"تنص المادة 49/3 على أن على المعلم تمثيل القدوة الحسنة للطلاب خُلقاً، والالتزام بقيم الهوية الوطنية، والابتعاد عن كل ما يمس شرف المهنة داخل المدرسة وخارجها، والالتزام بميثاق أخلاقيات مهنة التعليم."],["L02","n","معلم يخصّ الطلاب المتفوقين بالأسئلة والمشاركة، ويتجاهل الطلاب ذوي المستوى المنخفض. أي واجب من واجبات المعلم في نظام التعليم العام يقصّر فيه؟",["مراعاة الفروق الفردية وتحقيق أعلى مستويات العدالة في التعامل مع الطلاب","استثمار اليوم الدراسي في أداء المهمات المنوطة به وتطوير إمكاناته","الإسهام في البحوث والدراسات التي تخدم القضايا التعليمية","تدريس المقررات المسندة إليه وفق الأهداف والبرامج المعتمدة"],"تنص المادة 49/2 على أن يراعي المعلم طبيعة الطلاب واهتماماتهم واستعدادهم ومستويات تفكيرهم والفروق الفردية بينهم، وأن يحقق أعلى مستويات العدالة في التعامل معهم، ويعزز ثقتهم بأنفسهم."],["L02","n","أي مما يلي من الحقوق التي نص نظام التعليم العام على أن توفرها الوزارة للمعلم في المؤسسات الحكومية؟",["برامج التدريب والتطوير المهني، ومنها تقنيات التعليم الحديثة","الإعفاء من تدريس أي مقرر يخرج عن تخصصه متى طلب ذلك كتابياً من مديره","اختيار طلاب فصله بنفسه بحسب مستوياتهم وقدراتهم التحصيلية","تحديد سن القبول في مدرسته وفق احتياجات الحي"],"تنص المادة 48 على أن توفر الوزارة للمعلم في المؤسسات الحكومية: البيئة التعليمية المناسبة، وبرامج التدريب والتطوير المهني ومنها تقنيات التعليم الحديثة وأساليب التعليم التفاعلي، وفرص الإسهام في تطوير التعليم، والجوائز والحوافز عند التميز."],["L02","n","وقعت مشاجرة عنيفة أمام بوابة المدرسة بعد الانصراف، أُصيب فيها أحد طلابها. ما الذي يوجبه نظام التعليم العام على إدارة المدرسة؟",["إبلاغ الجهة المختصة عن الاعتداء لاستكمال الإجراءات النظامية","الصلح بين أسرتي الطالبين وإغلاق الموضوع داخلياً","عدم التدخل لأن الواقعة حدثت خارج مبنى المدرسة","الاكتفاء بإبلاغ ولي أمر الطالب المصاب"],"تنص المادة 65 على أن على إدارة المؤسسة التعليمية إبلاغ الجهة المختصة عن أي اعتداء أو إيذاء يقع داخل المؤسسة أو في محيطها على أي من طلابها أو منسوبيها، لاستكمال الإجراءات النظامية. ومحيط المدرسة داخل في النص."],["L02","n","تعرّض أحد معلمي المدرسة لاعتداء من شخص داخل فنائها. هل يشمل واجب الإبلاغ في نظام التعليم العام هذه الحالة؟",["نعم؛ الواجب يشمل الاعتداء على أي من الطلاب أو منسوبي المؤسسة","لا؛ الواجب يقتصر على الاعتداء على الطلاب","لا؛ يكتفي المعلم برفع شكوى شخصية","نعم بشرط أن يطلب المعلم ذلك كتابياً"],"المادة 65 تنص على الإبلاغ عن أي اعتداء أو إيذاء يقع على أي من طلاب المؤسسة أو منسوبيها، والمعلم من منسوبيها. والمُلزَم بالإبلاغ إدارة المؤسسة، دون أن يُعلَّق الواجب على طلب كتابي."],["L02","n","ثبت على معلم في مدرسة حكومية ارتكاب مخالفة جسيمة تخل بالنظام العام. ما الجزاء الذي ينص عليه نظام التعليم العام؟",["إنهاء خدمته، ومنعه من العودة إلى المجال التعليمي في القطاعين العام والخاص","الإنذار في المرة الأولى، ثم إنهاء الخدمة إذا تكررت منه المخالفة","نقله إلى مدرسة أخرى في المنطقة نفسها، مع إنذاره كتابياً بالفصل عند التكرار","حسم من راتبه مع بقائه في عمله ومنعه من الترقية مدة سنة"],"تنص المادة 59/2 على أنه إذا ثبت ارتكاب مخالفة جسيمة تنهى خدمته، ولا يسمح له بالعودة للعمل في المجال التعليمي في القطاعين العام والخاص. أما الإنهاء عند التكرار فهو حكم المخالفة غير الجسيمة (المادة 59/1)."],["L02","n","وُجدت قرائن على أن معلماً ارتكب ما يخل باللحمة الوطنية، ولم يُفصل في المخالفة بعد. ما الذي يجيزه نظام التعليم العام في هذه المرحلة؟",["تدابير عاجلة يتخذها الوزير أو من يفوضه، ككف يده مؤقتاً","إنهاء خدمته فوراً قبل التحقيق في المخالفة وثبوتها عليه","الانتظار حتى يصدر حكم قضائي نهائي دون اتخاذ أي إجراء","نقله إلى مدرسة أخرى بقرار من مدير المدرسة إلى حين التحقيق"],"تنص المادة 58 على أنه إذا وُجدت قرائن تدل على ارتكاب ما يخل بالنظام العام أو اللحمة الوطنية، فللوزير أو من يفوضه اتخاذ تدابير عاجلة لحماية البيئة التعليمية إلى أن يُفصل في المخالفة، منها منعه من أي عمل داخل المؤسسة وتكليفه بعمل خارجها، أو كف يده مؤقتاً في المؤسسة الحكومية."],["L02","n","صدر قرار جزاء بحق معلمة في مدرسة حكومية، وأرادت التظلم منه. ما الذي ينص عليه نظام التعليم العام؟",["لها التظلم أمام الجهة القضائية المختصة خلال 60 يوماً من تاريخ علمها به","لها التظلم أمام مدير المدرسة خلال 30 يوماً","لها التظلم أمام مجلس شؤون التعليم العام خلال 90 يوماً","لا يجوز التظلم من قرارات لجنة المخالفات"],"تنص المادة 63 على أنه يجوز لمن صدر في حقه قرار بالجزاء التظلم منه أمام الجهة القضائية المختصة خلال 60 يوماً من تاريخ العلم به."],["L02","n","أرادت مدرسة تفعيل مشاركة أولياء الأمور في تحقيق أهدافها. ما الأساس الذي ينص عليه نظام التعليم العام لذلك؟",["ضوابط تضعها الوزارة تعزز الشراكة بين المؤسسة التعليمية والأسرة","اجتهاد كل مدرسة بحسب ظروفها دون إطار عام تضعه الوزارة","لائحة يصدرها مجلس الوزراء لكل منطقة تعليمية على حدة","اتفاقيات تبرمها المدرسة مع القطاع الخاص لتمويل مشاركة الأسر"],"تنص المادة 50 على أن تضع الوزارة الضوابط اللازمة التي تعزز الشراكة بين المؤسسة التعليمية والأسرة، بما يمكّن أولياء الأمور من المشاركة والإسهام في تحقيق أهداف التعليم العام."],["L02","n","بحسب الأحكام الختامية لنظام التعليم العام، من يضع اللوائح اللازمة لتنفيذ أحكامه، وكيف تصدر؟",["تضعها الوزارة بالتنسيق مع الجهات المعنية، وتصدر بقرار الوزير","يضعها مجلس الوزراء، وتصدر بمرسوم ملكي بعد الرفع بها","تضعها هيئة الخبراء بمجلس الوزراء، وتصدر بقرار من مجلس الوزراء","تضعها كل إدارة تعليم لمنطقتها، وتصدر بقرار من مديرها"],"تنص المادة 67 على أنه مع عدم الإخلال باختصاصات المجلس، تضع الوزارة بالتنسيق مع من تراه من الجهات ذات العلاقة ما يلزم من لوائح لتنفيذ أحكام النظام، وتصدر بقرار من الوزير. أما لوائح بعينها، كلوائح المؤسسات الخاصة والافتراضية وذوي الإعاقة والحضانة، فيقرها المجلس (المادة 8)."],["L01","n","أرادت معلمة دراسات اجتماعية تعزيز اعتزاز طالباتها بالتراث الثقافي الوطني ضمن درس عن البيئة المحلية. أي الأنشطة الآتية أكثر تحقيقاً لهذا الهدف؟",["مقابلة كبار السن في أسرهن لتوثيق حرفة تقليدية وعرضها على الزميلات","تعليق صور المعالم التراثية على جدار الفصل طوال الفصل الدراسي دون نقاش","إلقاء محاضرة مفصلة عن أهمية التراث الوطني في نهاية الحصة","توزيع مطوية جاهزة عن التراث تقرؤها الطالبات في المنزل"],"مؤشر 1.2 للممارس يطلب توظيف خبرات ومواقف وأنشطة تعليمية تدعم الاعتزاز بالتراث؛ المقابلة والتوثيق والعرض خبرة نشطة يبني فيها الطالب الاعتزاز بنفسه، بينما الصور والمحاضرة والمطوية تعرض التراث دون إشراك فعلي."],["L01","n","يوافق يوم التأسيس الذي يحتفي به المعلم مع طلابه في 22 فبراير ذكرى:",["تأسيس الدولة السعودية الأولى على يد الإمام محمد بن سعود عام 1139هـ","توحيد المملكة العربية السعودية وإعلان اسمها على يد الملك عبدالعزيز عام 1351هـ","اعتماد العلم الوطني بشكله الحالي","دخول الملك عبدالعزيز الرياض واستردادها عام 1319هـ"],"يوم التأسيس (22 فبراير) لذكرى تأسيس الدولة السعودية الأولى عام 1139هـ (1727م). ذكرى التوحيد هي اليوم الوطني (23 سبتمبر)، والعلم له يوم العلم (11 مارس)."],["L04","n","لاحظ معلم أن معظم أولياء أمور فصله لا يحضرون اللقاءات المسائية، وعلم أن كثيراً منهم يعملون في الفترة المسائية. الإجراء الأنسب للتغلب على هذا المعوق:",["تنويع قنوات التواصل ومواعيده، كاللقاءات الافتراضية والرسائل الدورية","الاكتفاء بإرسال الدرجات النهائية إلى أولياء الأمور في آخر الفصل الدراسي","تسجيل أسماء الغائبين ورفعها للإدارة","إلغاء التواصل مع أولياء الأمور لعدم جدواه"],"مؤشر 3.2: يستخلص أبرز معوقات التواصل مع أولياء الأمور ويشارك في التغلب عليها. المعوق هنا الوقت، وعلاجه المرونة في القنوات والمواعيد."],["L04","n","أي الممارسات الآتية تعد من معوقات التواصل مع أولياء الأمور التي تصدر عن المدرسة نفسها؟",["الاقتصار على استدعاء ولي الأمر عند وقوع مشكلات من ابنه","إرسال رسائل إيجابية دورية عن تقدم الطالب","كتابة التقارير لأولياء الأمور بلغة بسيطة خالية من المصطلحات","عقد مجالس أولياء الأمور في مواعيد مناسبة لظروف عملهم"],"ربط التواصل بالمشكلات فقط يولّد لدى الأسرة تجربة سلبية فتتجنب المدرسة. البدائل الأخرى حلول لا معوقات."],["L04","n","يدرّس معلم رياضيات موضوع النسبة المئوية، ولاحظ ارتفاع استهلاك المياه في الحي حسب نشرة محلية. التوظيف الأنسب لهذه القضية في التدريس:",["حساب الطلاب نسب الهدر من بيانات استهلاك أسرهم واقتراح طرق للترشيد","تخصيص الحصة لموعظة عن الإسراف بدل الدرس","ذكر القضية في التهيئة باختصار، ثم العودة إلى تمارين الكتاب المعتادة","تكليف الطلاب بكتابة موضوع إنشائي عن أهمية المياه"],"مؤشر 3.3: يتقصى القضايا المحلية ويوظفها في التدريس بصورة تعزز وظيفة المعرفة؛ أي يستخدم الطالب المعرفة الرياضية لفهم مشكلة واقعية واقتراح حل. البدائل الأخرى تفصل القضية عن هدف الدرس."],["L04","n","عند اختيار قضية محلية لتوظيفها في درس، أي الضوابط الآتية أولى بالمراعاة؟",["أن ترتبط بأهداف الدرس وتناسب الطلاب وتتجنب التشهير بأحد","أن تكون أكثر القضايا إثارة للجدل في وسائل التواصل الاجتماعي","أن يختارها الطلاب دون أي توجيه من المعلم","أن تكون بعيدة عن بيئة الطلاب وواقعهم حتى لا تحرج أحداً منهم"],"توظيف القضية يخدم الهدف التعليمي ويراعي المرحلة والقيم؛ الإثارة والجدل ليسا معياراً، والبعد عن بيئة الطالب يناقض فكرة القضية المحلية."],["L07","n","لاحظ معلم أن طالباً متفوقاً تراجع تحصيله فجأة وأصبح شارداً منطوياً منذ أسابيع، وعلم أن والديه انفصلا مؤخراً. الإجراء الأول الأنسب:",["حوار فردي هادئ مع الطالب ثم التنسيق مع الموجه الطلابي","مناقشة ظروفه الأسرية أمام زملائه ليتعاطفوا معه ويدعموه","خصم درجات المشاركة لتحفيزه على الانتباه","الانتظار حتى نهاية الفصل لعل الحالة تتحسن"],"مؤشر 5.1: يبين تأثير الأحداث اليومية الضاغطة على التعلم وكيفية التعامل معها؛ البداية احتواء فردي يحفظ السرية ثم الإحالة للمختص. التشهير والعقاب والتأجيل تفاقم المشكلة."],["L07","n","أي المؤشرات الآتية تستدعي من المعلم أكبر قدر من الانتباه بوصفها علامة على تأثر الطالب بحدث ضاغط؟",["تغير مفاجئ في سلوك الطالب أو تحصيله مقارنة بحاله السابقة","حماس الطالب الزائد في الأنشطة الجماعية وحرصه على المشاركة","ميل طالب المرحلة المتوسطة إلى الأقران وتأثره بآرائهم","كثرة أسئلة طفل الصفوف الأولية"],"العلامة التحذيرية هي التغير المفاجئ عن المعتاد؛ أما الميل للأقران في المراهقة وحب السؤال عند الصغار فسلوك نمائي طبيعي."],["L07","n","انتقل طالب حديثاً إلى المدرسة من مدينة أخرى، ويبدو قلقاً ومعزولاً في الفسحة. أنسب ما يقدمه المعلم لدعمه:",["تعريفه بالفصل وتكليف زميل مرافق يساعده على الاندماج","تكليفه بتقديم نفسه أمام الصف كاملاً في أول حصة يحضرها","تركه حتى يتكيف وحده دون تدخل","إحالته مباشرة إلى لجنة التوجيه الطلابي بوصفه حالة سلوكية"],"الانتقال حدث ضاغط شائع؛ والدعم يكون بالتعريف والزميل المرافق والإشراك المتدرج. الإحالة المباشرة للجنة سابقة لأوانها، والعرض أمام الصف قد يزيد قلقه."],["L07","n","أي المجموعات الآتية تمثل مؤشرات محتملة على إهمال الطالب؟",["جوع مستمر ورداءة النظافة وغياب متكرر وحاجات صحية مهملة","كثرة الحركة في الفصل وحب الكلام","تفوق دراسي مع خجل اجتماعي بسيط","انشغال بالأقران وتغير الاهتمامات والمزاج في مرحلة المراهقة"],"الإهمال عدم توفير حاجات الطالب الأساسية أو التقصير فيها (الجسدية والصحية والعاطفية والتعليمية...) كما عرفته قواعد السلوك والمواظبة، وعلاماته تتعلق بهذه الحاجات؛ والبقية سلوكيات قد تكون نمائية."],["L07","n","حالة إيذاء ثبت أنها تتطلب تدخلاً عاجلاً. الجهة التي نصت قواعد السلوك والمواظبة على إبلاغها فوراً:",["مركز بلاغات وزارة الموارد البشرية (1919)","المشرف التربوي للمادة في مكتب التعليم","مجلس أولياء الأمور والمعلمين في المدرسة","لجنة التحصيل الدراسي بالمدرسة لدراسة الحالة"],"المادة 29: إبلاغ مركز بلاغات وزارة الموارد البشرية والتنمية الاجتماعية (رقم 1919) فوراً إذا تطلبت الحالة تدخلاً عاجلاً، إضافة إلى الجهات الأمنية إذا اقتضى الأمر."],["L07","n","أي العبارات الآتية تصف إجراءات التعامل مع حالات الإيذاء والإهمال كما وردت في قواعد السلوك والمواظبة 1447؟",["تُتخذ بشكل عاجل وسري وفق خطورة الحالة دون تدرج","تبدأ بالتنبيه الشفهي ثم تتدرج كالمخالفات السلوكية","يتولاها المعلم وحده دون إشراك الإدارة","تؤجَّل إلى نهاية الفصل لجمع أدلة كافية"],"نصت المادة 29 على أن إجراءات الإيذاء لا تتطلب التدرج بل تُتخذ وفقاً لخطورة الحالة، بشكل عاجل وسري يضمن سلامة الطالب ويمنع تفاقم الحالة."],["L08","n","كلف معلم طلابه بمشروع يتطلب طباعة ملونة وأدوات مكلفة، فلم ينجزه عدد من الطلاب لظروف أسرهم الاقتصادية. الإجراء الأنسب لمراعاة الخلفيات الاقتصادية:",["إتاحة بدائل منخفضة التكلفة واستخدام مصادر المدرسة","خصم درجات من لم ينجز المشروع ليتعلموا الالتزام بالمواعيد","إعفاء هؤلاء الطلاب من المشروع نهائياً","مطالبة أولياء الأمور بتوفير الأدوات خلال يومين"],"مؤشر 5.2: يميز الاختلافات العائدة للخلفيات الاجتماعية والاقتصادية واحتياجاتها التعليمية التي ينبغي تلبيتها؛ وتلبيتها بتوفير البدائل والمصادر، لا بالعقاب ولا بإعفاء يحرم الطالب من التعلم."],["L08","n","في فصل يضم طلاباً من بيئات ثقافية مختلفة بينهم وافدون حديثاً، أي الممارسات الآتية تمثل التدريس المستجيب ثقافياً؟",["توظيف أمثلة من بيئات الطلاب مع توقعات عالية للجميع ودعم لغوي","خفض المستوى المطلوب من الطلاب الوافدين مراعاةً لظروفهم اللغوية","اختيار أمثلة من بيئة الأغلبية فقط لتوحيد الفهم داخل الفصل","تجنب أي إشارة إلى خلفيات الطلاب الثقافية"],"التدريس المستجيب ثقافياً يجعل ثقافة الطالب وخبرته جسراً للتعلم مع الحفاظ على توقعات عالية؛ خفض التوقعات قالب نمطي، وتجاهل التنوع يحرم الطالب من الربط."],["L08","n","ينص الإطار الوطني لمعايير مناهج التعليم العام على مبدأ «تكافؤ فرص التعلم». أي الممارسات الآتية أقرب إلى هذا المبدأ؟",["تقديم فرص تعلم متنوعة تراعي الفروق والقدرات والخلفيات لجميع الطلاب","تقديم المهام نفسها بالطريقة نفسها والزمن نفسه لجميع الطلاب دون استثناء","تخصيص الأنشطة الإثرائية للمتفوقين وحدهم","توزيع الطلاب على فصول ثابتة حسب مستوى أسرهم"],"تكافؤ الفرص في الإطار الوطني: فرص متكافئة ومتنوعة تراعي الفروق الفردية والقدرات والخلفيات الثقافية والاجتماعية لجميع الفئات؛ والتطابق في المعاملة ليس تكافؤاً."],["L08","n","وفق الدليل التنظيمي للتربية الخاصة، لا تبدأ إجراءات القياس والتشخيص للطالب إلا بعد:",["أخذ موافقة ولي الأمر خطياً بعد إشعاره رسمياً","موافقة المعلم المستشار","انتهاء العام الدراسي","حصول الطالب على درجة متدنية في الاختبار النهائي"],"نص الدليل التنظيمي على أن القياس والتشخيص يتم بعد أخذ موافقة ولي الأمر خطياً وإشعاره رسمياً بالإجراءات؛ فالأسرة شريك أساسي."],["L08","n","أي الآتي لا يُعد من أعضاء لجنة الخطط التعليمية الفردية كما حددها الدليل التنظيمي للتربية الخاصة؟",["المشرف التربوي لمادة الطالب","معلم التربية الخاصة","ولي أمر الطالب أو من ينوب عنه","معلم التعليم العام"],"تتكون اللجنة من قائد المدرسة ووكيلها للشؤون التعليمية ومعلم التربية الخاصة ومعلم التعليم العام والمرشد الطلابي أو الأخصائي الاجتماعي والمختصين حسب الحاجة وولي الأمر والطالب قدر الإمكان؛ ولم يُذكر المشرف التربوي."],["L08","n","أي العناصر الآتية تُبنى عليه أولاً صياغة أهداف الخطة التربوية الفردية؟",["مستوى أدائه الحالي بنقاط قوته واحتياجاته","أهداف المنهج العام للصف كما هي دون أي تعديل","رغبة ولي الأمر في نجاح ابنه","متوسط أداء زملائه في الفصل"],"الخطة الفردية تبدأ بوصف مستوى الأداء الحالي المستخلص من نتائج التشخيص، ومنه تُشتق الأهداف طويلة المدى ثم قصيرة المدى القابلة للقياس."],["L09","n","يحرص معلم على بيئة صفية خالية من السخرية والخوف من الخطأ، مع تقديم مهام تتحدى الطلاب. يستند هذا التوجه إلى مبدأ التعلم المستند إلى الدماغ القائل إن التعلم:",["يتعزز بالتحدي ويُكبح بالتهديد","يحدث بالتكرار الآلي وحده","لا يتأثر بالانفعالات","يتم بمعالجة الأجزاء منفصلة عن الكل"],"من مبادئ كين وكين: التعلم يتعزز بالتحدي ويُكبح بالتهديد، والانفعالات أساسية في التعلم، والدماغ يعالج الأجزاء والكل معاً؛ ومنها عنصر الاسترخاء اليقظ."],["L09","n","بعد شرح المفهوم الجديد، يطلب معلم من الطلاب تلخيصه بكلماتهم وتطبيقه على موقف حقيقي ومناقشة ما تعلموه. يمثل هذا الإجراء في نموذج التعلم المستند إلى الدماغ عنصر:",["المعالجة النشطة","الاسترخاء اليقظ","الانغماس المنظم","التعزيز السلبي"],"العناصر الثلاثة: الاسترخاء اليقظ (بيئة آمنة متحدية)، والانغماس المنظم (خبرات حقيقية غنية)، والمعالجة النشطة (تأمل وتلخيص وتطبيق يثبت المعنى)."],["L09","n","طالب يدرك الموقف ككل، ويتأثر بالسياق الاجتماعي، ويفضل العمل في مجموعة مع تعليمات واضحة من المعلم. وفق أسلوب ويتكن المعرفي يوصف بأنه:",["معتمد على المجال","مستقل عن المجال الإدراكي","متروٍّ (تأملي)","مندفع (متسرع)"],"المعتمد على المجال يدرك كلياً ويتأثر بالمحيط ويفضل التوجيه والعمل الجماعي، والمستقل يحلل ويفصل الجزء عن الكل ويفضل العمل الفردي. والتروي والاندفاع بُعد آخر (كاجان)."],["L09","n","طالب يجيب عن الأسئلة فور سماعها فيقع في أخطاء كثيرة رغم قدرته. أنسب أسلوب لمساعدته وفق بُعد الاندفاع والتروي:",["تدريبه على التوقف وفحص البدائل قبل الإجابة","حرمانه من المشاركة الشفهية حتى يتعلم الانضباط","تكليفه بأسئلة أسرع لاستثمار سرعته","نقله إلى مجموعة الطلاب الأضعف"],"الأسلوب المندفع يستجيب بسرعة وبأخطاء أكثر، ويُعالج بتعليم التوقف والتفكير وفحص البدائل وتمديد وقت الانتظار، لا بالعقاب أو التصنيف."],["L09","n","يفضّل طالب المذاكرة في مكان هادئ بإضاءة قوية، ويحتاج إلى مهام منظمة بخطوات واضحة ليثابر عليها. يربط هذا الوصف تفضيلات أسلوب تعلمه بعوامل:",["بيئية وانفعالية","معرفية فقط","وراثية ثابتة","اجتماعية فقط"],"نموذج دن ودن يربط أسلوب التعلم بعناصر بيئية (الصوت، الإضاءة) وانفعالية (المثابرة، الحاجة إلى التنظيم) واجتماعية وجسمية ونفسية؛ ومؤشر 5.3 يطلب بيان اعتماد أساليب التعلم على العوامل المعرفية والانفعالية والبيئية."],["L10","n","طالب يقرأ السؤال كاملاً ويتأكد من فهمه ويخطط قبل أن يبدأ الحل بدل الإجابة المتسرعة. يمارس هذا الطالب عادة العقل:",["التحكم بالتهور","الإقدام على مخاطر مسؤولة","إيجاد الدعابة","الاستجابة بدهشة ورهبة"],"التحكم بالتهور من عادات العقل عند كوستا وكاليك: التأني والتفكير وفهم المهمة قبل البدء."],["L10","n","حاول طالب حل مسألة بثلاث طرق لم تنجح، فلم يستسلم وجرب طريقة رابعة حتى وصل إلى الحل. عادة العقل التي يظهرها:",["المثابرة","التفكير التبادلي","الإصغاء بتفهم وتعاطف","جمع البيانات باستخدام جميع الحواس"],"المثابرة: الاستمرار في المهمة حتى إكمالها وعدم الاستسلام بسهولة وتجريب بدائل."],["L10","n","تُعرَّف عادات العقل بأنها:",["نمط من السلوكيات الذكية عند مواجهة مشكلات لا يُعرف حلها فوراً","مجموعة معارف نظرية يحفظها الطالب عن مهارات التفكير وتصنيفاتها","قدرات عقلية فطرية ثابتة لا تتأثر بالتعليم ولا بالتدريب","خطوات ثابتة لحل المسائل الرياضية"],"عادات العقل عند كوستا وكاليك ميل لتوظيف السلوك الذكي عند مواجهة مشكلة غير معروفة الحل، وهي قابلة للتعلم والتنمية بالنمذجة والممارسة."],["L10","n","طالبة تكرر «أنا لا أفهم الرياضيات أبداً» فتتجنب المحاولة. أنسب ما يفعله المعلم لتعديل اتجاهها نحو المادة:",["تصميم خبرات نجاح متدرجة وربط المادة بمواقف من حياتها","تذكيرها بأهمية الرياضيات لمستقبلها في بداية كل حصة","مقارنتها بزميلاتها المتفوقات لتحفيزها","إعفاؤها من كل المهام الصعبة لحمايتها من الإحباط والقلق"],"مؤشر 5.3: يبين تأثير الاتجاهات والقيم على التعلم وكيفية استخدامها لدعمه؛ الاتجاه السلبي يُعدّل بخبرات نجاح وربط بالحياة، لا بالوعظ أو المقارنة أو خفض التوقعات."],["L10","n","«اعتقاد الطالب بأهمية القراءة، وشعوره بالمتعة فيها، وميله إلى استعارة الكتب». تمثل هذه العبارات على الترتيب مكونات الاتجاه:",["المعرفي ثم الوجداني ثم السلوكي","الوجداني ثم السلوكي ثم المعرفي","السلوكي ثم المعرفي ثم الوجداني","المعرفي ثم السلوكي ثم الوجداني"],"للاتجاه ثلاثة مكونات: معرفي (معتقدات وأفكار)، ووجداني (مشاعر)، وسلوكي (ميل للفعل)."],["L11","n","أي الآتي يمثل المداخل العامة للتدريس الأربعة التي تتناولها مؤشرات المعيار السابع؟",["السلوكي والمعرفي والإنساني (الشخصي) والاجتماعي","الإلقائي والحواري والاستقرائي والاستنباطي (القياسي)","التعاوني والتنافسي والفردي والجماعي","التشخيصي والتكويني والختامي والتتبعي"],"مؤشرات 7.1 للممارس تتناول أسس المدخل السلوكي والمعرفي والإنساني أو الشخصي والاجتماعي؛ البقية طرق تدريس أو أنماط عمل أو أنواع تقويم."],["L11","n","تكمن أهمية معرفة المعلم بالأسس النظرية للمداخل العامة للتدريس في أنها تساعده على:",["اختيار ما يحفز المتعلمين وينمي قدراتهم ويعدل سلوكهم","حفظ أسماء رواد كل مدخل ونظرياتهم وتواريخ ظهورها","الالتزام بمدخل واحد في جميع الدروس طوال العام الدراسي","تقليل الحاجة إلى التخطيط للدروس"],"نص مؤشر 7.1: يحدد الأسس والمبادئ النظرية للمداخل ويبرز أهميتها في تحفيز المتعلمين وتنمية مهاراتهم وقدراتهم وتعديل سلوكهم وتنمية مهاراتهم الاجتماعية."],["L11","n","قسّم معلم مهارة الكتابة على الحاسب إلى خطوات صغيرة متتابعة، ولا ينتقل الطالب إلى خطوة حتى يتقن سابقتها، مع تعزيز فوري لكل إجابة صحيحة. المدخل الذي يستند إليه:",["السلوكي","الإنساني","الاجتماعي","المعرفي"],"تحليل المهمة إلى خطوات صغيرة والتعزيز الفوري والتعلم للإتقان من أسس المدخل السلوكي الذي يركز على تعديل السلوك واستجابة المتعلم للمهام."],["L11","n","عرض معلم على طلابه ظاهرة محيرة، وطلب منهم طرح الأسئلة وجمع البيانات حتى يصلوا إلى التفسير بأنفسهم دون أن يقدمه لهم. المدخل الذي يمثله هذا الأسلوب:",["المعرفي","السلوكي","الإنساني","الاجتماعي"],"المدخل المعرفي يستند إلى أساليب تمكّن المتعلم من التفكير والبحث والاكتشاف ذاتياً والتوصل إلى المعارف بجهده (مؤشر 7.1)."],["L11","n","يبدأ معلم درسه بمنظم متقدم يعرض فيه الفكرة العامة التي ستُبنى عليها تفاصيل الدرس. يعكس ذلك اهتمام المدخل المعرفي بـ:",["تنظيم البنية المعرفية وربط الجديد بالسابق","تعزيز الاستجابات الصحيحة فوراً لتثبيتها","تنمية الوعي بالذات والمسؤولية","نمذجة السلوك الاجتماعي المرغوب أمام الطلاب"],"المنظم المتقدم (أوزوبل)
