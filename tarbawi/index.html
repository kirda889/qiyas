["L02","","بالتعديل الذي أُقر عام 1446هـ على لائحة الوظائف التعليمية أصبحت الرخصة المهنية:",["إلزامية لمزاولة التعليم اعتباراً من فبراير 2026","اختيارية لجميع المعلمين على رأس العمل","مطلوبة للترقية بين الرتب فقط","مرتبطة باستحقاق العلاوة السنوية"],"التعديل (القرار الوزاري 63694 بتاريخ 5/5/1446هـ) جعل الرخصة شرطاً لمزاولة المهنة من 1 فبراير 2026 وألغى ربطها بالعلاوة، مع إعفاء من بلغ الخمسين من العمر قبل ذلك التاريخ."],
["L02","m","طالب يقل عمره عن ست سنوات بأربعين يوماً تقدم للصف الأول الابتدائي. وفق سياسة القبول:",["يجوز قبوله بعد قبول جميع الأطفال الذين أتموا السادسة","لا يجوز قبوله بأي حال","يُقبل مباشرة مثل أقرانه","يُقبل بعد اجتياز اختبار ذكاء"],"أربعون يوماً ضمن حد التسعين يوماً (ومن باب أولى ضمن حد المائة والثمانين لحامل شهادة الروضة)، فيجوز قبوله لكن بعد من أتموا السادسة. القبول المباشر يخالف شرط الأولوية."],
["L02","","يرى معلم أن واجباته تقتصر على الشرح داخل الصف ويرفض المشاركة في نشاطات المدرسة. يعد الميثاق المشاركة في نشاطات المدرسة:",["ركناً أساسياً في تحقيق أهداف المؤسسة التعليمية","عملاً تطوعياً اختيارياً","من صلاحيات رائد النشاط وحده","مرتبطة بالمكافآت فقط"],"مادة المعلم والمجتمع المدرسي تجعل المشاركة في نشاطات المدرسة ركناً أساسياً إلى جانب الالتزام بالأنظمة."],
["L02","","من الأسس العامة التي تقوم عليها سياسة التعليم في المملكة:",["الإيمان بالله رباً وبالإسلام ديناً وبمحمد صلى الله عليه وسلم نبياً ورسولاً","مجانية التعليم الجامعي","إلزامية التعليم الثانوي","اعتماد اللغة الإنجليزية لغة للتدريس"],"الأساس الأول في الوثيقة هو الإيمان بالله والإسلام والرسالة المحمدية، ثم التصور الإسلامي للكون والحياة والإنسان."],
["L02","","يحق للمعلم التظلم من نتيجة تقويم الأداء الوظيفي:",["وفق إجراءات التظلم الواردة في إطار العمل التنظيمي","بالامتناع عن العمل حتى يُعدَّل","عبر وسائل التواصل الاجتماعي","بطلب إعادة التقويم من زميل آخر"],"اللائحة تنظم التظلم بإجراءات رسمية. الامتناع عن العمل أو التشهير مخالفة للسلوك الوظيفي."],
["L02","m","المصطلح الذي تعرّفه اللائحة بأنه «كل ما يجب على شاغلي الوظائف التعليمية معرفته وممارسته وفق قيم ومسؤوليات مهنة التعليم»:",["المعايير المهنية","الرخصة المهنية","النصاب التعليمي","التطوير المهني"],"هذا تعريف المعايير المهنية الصادرة عن الهيئة. الرخصة وثيقة، والتطوير عملية، والنصاب حصص."],
["L02","","عند ارتكاب طالب مخالفة سلوكية يُستدعى ولي أمره ويُطلب توقيعه على:",["العقد السلوكي أو التعهد الذي يحصل عليه الطالب","شهادة حسن سيرة وسلوك","طلب نقل الطالب","تقويم أداء المعلم"],"لائحة السلوك تشترط توقيع ولي الأمر على العقد السلوكي وأي تعهد ليكون شريكاً في المتابعة."],
["L02","","صرّح معلم لطلابه بأن بعض اللوائح «تعليمات ورقية لا تلزمه». الأثر التربوي الأخطر لسلوكه:",["زعزعة احترام الطلاب للأنظمة وفقدانهم القدوة في الالتزام","إضاعة وقت الحصة","إضعاف علاقته بالإدارة","تأخر خطته الدراسية"],"المعلم قدوة؛ استهانته بالنظام تُعلّم الطلاب الاستهانة به. البدائل الأخرى آثار جانبية أقل خطورة."],
// ===== L03: التطوير المهني المستمر والبحث الإجرائي =====
["L03","hm","أول خطوات البحث الإجرائي:",["الإحساس بالمشكلة وتحديدها","جمع البيانات","صياغة الفرضيات","تصميم الخطة الإجرائية"],"الشعور بالمشكلة هو الحافز الأساسي، ولا يمكن جمع بيانات ولا صياغة فرض قبل تحديد ما يُبحث. جمع البيانات بديل جذاب لكنه الخطوة الثانية."],
["L03","h","أراد معلم تحديد أسباب ضعف طلابه في المهارات الإملائية، فحصر الأخطاء المتكررة ثم وجّه استبانة للطلاب وأولياء الأمور وبعض زملائه، ودرس نتائجها ووصل إلى توصيات. ما قام به يُعد:",["بحثاً إجرائياً","تقويماً ذاتياً","استبانة تقويم","موقفاً تعليمياً"],"مشكلة واقعية في صفه + جمع بيانات بأدوات + توصيات للتحسين = بحث إجرائي. الاستبانة أداة واحدة من البحث لا البحث نفسه."],
["L03","hm","يعتمد منهج البحث الإجرائي على فهم رئيس لأدوار المعلم. أي مما يلي يعبر عن هذا الفهم؟",["يسهم البحث الإجرائي في تطوير ممارسات المعلم وحل المشكلات","يصعب على المعلم القيام بالبحوث الإجرائية في التعليم","يجري المعلم البحوث الإجرائية لنشرها وكسب نقاط وظيفية","تقتصر حاجة المعلم إلى البحث الإجرائي على المشكلات الكبرى"],"البحث الإجرائي أداة المعلم الباحث لتحسين ممارسته. النشر لكسب النقاط يحوّل الغاية إلى وسيلة، وقصره على المشكلات الكبرى يناقض طبيعته المحلية اليومية."],
["L03","h","أي المواقف الآتية مثال على قيام المعلم بالتأمل الذاتي لتطوير أدائه المهني؟",["تصوير جزء من أدائه التدريسي ومراجعة الفيديو لاحقاً لمعرفة نقاط القوة والضعف","مشاركة زميل أكثر خبرة في تقديم حصص صفية للاستفادة من خبرته","طلب مراجعة زميل لخطته التدريسية وتقديم تغذية راجعة","كتابة وصف شامل للمادة وأنشطتها وتقديمه للإدارة"],"التأمل الذاتي يقوم به المعلم على ممارسته بنفسه، والفيديو أداة من أدواته. طلب رأي الزميل تقويم أقران، ومشاركة الخبير تعلم بالملاحظة."],
["L03","hm","التأمل في الأداء المهني ومحاولة تبريره بطرح حل واحد يعكس مستوى التأمل:",["التفسيري","الوصفي","الحواري","الناقد"],"المستوى التفسيري = تبرير العمل بحل واحد. الوصفي يكتفي بوصف ما حدث، والحواري يختبر عدة حلول، والناقد جماعي مع الزملاء."],
["L03","h","أثناء تخطيط معلم للارتقاء بمستواه المهني ناقش جوانب أدائه مع زملائه الخبراء بغرض تحسين الناتج التعليمي. ما قام به يشير إلى التأمل:",["الناقد","الوصفي","التفسيري","الحواري"],"التأمل الناقد تأمل جماعي قائم على مشاركة الزملاء. بعض مفاتيح الملخصات المتداولة تقول «الحواري»، والصحيح وفق المرجع أن الحواري حوار داخلي يجريه المعلم مع نفسه لاختبار الفروض، أما مناقشة الزملاء فهي الناقد."],
["L03","hm","عندما يبحث المعلم عن الاستفادة من المصادر الخارجية المجتمعية أثناء تأمله الذاتي لتطوير أدائه، فإنه يعمل ضمن محور أداة سوات:",["الفرص","التهديدات","نقاط القوة","نقاط الضعف"],"المصادر الخارجية الداعمة = فرص (خارجي إيجابي). التهديدات خارجية سلبية، والقوة والضعف عوامل داخلية."],
["L03","h","يعد تبادل الزيارات بين الزملاء أثناء التدريس من الوسائل المساعدة على:",["النمو المهني","تقويم المعلم","تطوير المناهج","تقويم طرائق التدريس"],"الزيارات التبادلية أسلوب نمو مهني يتبادل فيه المعلمون الخبرات. «تقويم المعلم» بديل يركز على المساءلة ويتطلب تهيئة نفسية مضادة لروح التبادل."],
["L03","h","تبادل الزيارات الصفية بصفة دورية بين معلمي المدرسة يعد شكلاً من أشكال:",["تطوير الأداء المهني","مجتمعات التعلم المهنية الافتراضية","أخلاقيات مهنة التعليم","تحقيق مفهوم المدرسة المتعلمة"],"الزيارات أسلوب مباشر لتطوير الأداء. «الافتراضية» خاطئة لأن الزيارة حضورية، والمدرسة المتعلمة مفهوم أوسع لا يقتصر على الزيارات."],
["L03","hm","من أساليب التنمية المهنية التي تهدف إلى إكساب المعلم مهارات التعلم الذاتي:",["القراءة الموجهة","التدريس المصغر","الدروس التطبيقية","الاجتماعات الدورية"],"القراءة الموجهة تدرب المعلم على أن يتعلم بنفسه من الكتب والمقالات. التدريس المصغر لمهارة تدريسية، والدروس التطبيقية والاجتماعات أساليب جماعية."],
["L03","h","من أساليب التطوير المهني الذاتي للمعلم:",["التعليم المبرمج","الزيارات المتبادلة","الاجتماعات المهنية","الدرس النموذجي"],"التعليم المبرمج والحقائب والقراءة أساليب ذاتية يقوم بها المعلم وحده. الزيارات والاجتماعات والدرس النموذجي أساليب جماعية أو موجهة."],
["L03","hm","مذكرات خاصة بالمعلم متصلة بعملية التدريس يكتب فيها آراءه حول ما نفذه من أنشطة وبرامج تسهم في رفع تحصيل طلابه ونموه المهني، تسمى:",["التأمل في التدريس","التعلم الذاتي","التقويم الختامي","التقويم العلاجي"],"كتابة الآراء والمرئيات حول الممارسة بعد تنفيذها هي التأمل في التدريس. التقويم الختامي والعلاجي يخصان الطلاب لا ممارسة المعلم."],
["L03","h","يطلب المعلم في عامه الأول من زملائه الأكثر خبرة زيارته في الفصل وتقديم النقد البناء له. أهم فائدة تحصل من ذلك:",["تقدم له المعرفة والخبرة بأساليب التدريس المتنوعة","تسهم في اعتياده على عملية التقويم وإحساسه بالراحة فيها","تساعده على تطبيق المبادئ التدريسية بفاعلية في جو الفصل","توصل لزملائه رغبته في أن يكون عضواً فاعلاً في الفريق"],"سؤال من دليل الهيئة: المعلم الجديد يفتقر إلى الخبرة بالأساليب، وزيارة الخبراء تطلعه على الأساليب الناجحة. البدائل الأخرى فوائد ثانوية."],
["L03","hm","قضى معلم جديد أسبوعه الأول في المدرسة. الخطوة التي تساعده في تحسين خطته لإدارة الصف:",["مراقبة المعلمين الفاعلين في المدرسة والاستفادة من خبراتهم","زيارة المكتبة للاطلاع على كتب في التعامل مع أولياء الأمور","مناقشة الصعوبات مع مدير المدرسة وطلب تقويم متكرر","التعاون مع معلمين جدد ومناقشة الصعوبات التي واجهوها"],"سؤال من دليل الهيئة (المعيار 2.2): التعلم من الممارسة الفاعلة أسرع أثراً. المعلمون الجدد يفتقرون للخبرة مثله، والمكتبة بعيدة عن إدارة الصف."],
["L03","h","أي مما يأتي لا يُعد من أهداف التطوير المهني المستمر للمعلمين؟",["تطوير البيئة المادية للصف","تطوير قدرات المعلمين ومهاراتهم","تحسين الأداء الأكاديمي للطلاب","الارتقاء بمستوى الكوادر التربوية"],"التطوير المهني يستهدف المعلم وأثره في الطلاب؛ البيئة المادية (أثاث وتجهيزات) مسؤولية إدارية لا مهنية."],
["L03","hm","أي العبارات الآتية لا ينتمي إلى مبادئ التطوير المهني؟",["ضرورة التعامل مع التطوير المهني كنتائج وليس كعمليات","التخطيط الجماعي للتطوير المهني مما يجعله أكثر قبولاً","إيجاد بيئة مهنية وتنظيمية مشجعة للتطوير","ضرورة قياس أثر التطوير المهني على المستهدفين"],"التطوير المهني عملية مستمرة لا حدث ينتهي بنتيجة. البدائل الأخرى مبادئ صحيحة."],
["L03","h","حضور المعلم دورة تدريبية في تخطيط الدروس وإدارة الصف يدل على سعيه للتطوير المهني في مجال:",["المهارات المهنية","المعرفة التخصصية","الثقافة العامة","المهارات العامة"],"التخطيط وإدارة الصف مهارات مهنة التدريس، لا معرفة بمحتوى التخصص ولا ثقافة عامة."],
["L03","hm","آراء طلابك والتغذية الراجعة من زملائك المعلمين كلاهما من وسائل معرفة وتحديد:",["الاحتياجات التدريبية","الأهداف التربوية","العلاقات الإيجابية","الصلاحيات التربوية"],"تقويم الطلاب والزملاء يكشف الفجوة بين الأداء الحالي والمطلوب، وهي الاحتياج التدريبي الذي تُبنى عليه خطة التطوير."],
["L03","h","طُلب من معلم أثناء الخدمة التقدم لإحدى الدورات التدريبية. التصرف الأنسب:",["يدرس مدى مناسبة الدورة له علمياً وعملياً","يسارع بالتقدم إليها دون تردد","يتعرف أولاً على رغبة زملائه في التقدم","يعتذر عنها بحجة الانشغال"],"الخطة المهنية تُبنى على الاحتياج، فيقارن المعلم الدورة باحتياجاته. المسارعة بلا دراسة أو التهرب كلاهما غير مهني."],
["L03","h","من المفيد أن يشجع المعلم طلابه على التأمل في تعلمهم. جميع الأسئلة الآتية موجهات لهذا التأمل ما عدا:",["ماذا أفعل لأتفوق على زملائي في المرة القادمة؟","ما الذي تعلمته وما الذي لم أتعلمه حتى الآن؟","كيف أحسّن مستوى تعلمي القادم؟","ما الصعوبات التي واجهتني وكيف تجاوزتها؟"],"التأمل يوجه الطالب إلى تعلمه هو، أما التفوق على الزملاء فمقارنة تنافسية لا تأمل."],
["L03","hm","تدنت نتائج طلاب أحد المعلمين بشكل ملحوظ في الاختبار الفصلي. الموقف المهني المسؤول:",["يتحمل مسؤولية النتائج كاملة ويضع خطة لرفع مستوى الطلاب","يدافع عن النتائج لأن الطلاب ضعاف ولا يمكن أن يحرزوا أفضل منها","يطلب لقاء أولياء الأمور لبحث أسباب التدني وتحميلهم المسؤولية","يطلب من الإدارة نقله إلى صفوف أخرى"],"المسؤولية المهنية تبدأ من المعلم نفسه. تحميل أولياء الأمور بديل يبدو تواصلاً لكنه تنصل، والدفاع عن النتائج عزو خارجي."],
["L03","","مؤسس البحث الإجرائي وصاحب الدورة (تخطيط، فعل، ملاحظة، تأمل):",["كيرت لوين","جون ديوي","جان بياجيه","سكنر"],"كيرت لوين هو من صاغ البحث الإجرائي ودورته الحلزونية. ديوي صاحب خطوات حل المشكلات، وبياجيه النمو المعرفي، وسكنر الإشراط الإجرائي (لا علاقة له بالبحث الإجرائي رغم تشابه الاسم)."],
["L03","","من خصائص البحث الإجرائي:",["محلي محدد لا يهدف إلى تعميم نتائجه","يتطلب عينة عشوائية ممثلة لمجتمع الدراسة","يجريه باحث خارجي متخصص","يهدف إلى بناء نظرية علمية جديدة"],"البحث الإجرائي يتعامل مع ظاهرة في بيئة محددة ويجريه الممارس نفسه. العينة العشوائية والتعميم وبناء النظرية من سمات البحث الأكاديمي."],
["L03","","الفرق الجوهري بين البحث الإجرائي والبحث الأكاديمي أن الإجرائي:",["يجريه الممارس لحل مشكلة في سياقه دون هدف التعميم","يستخدم أدوات إحصائية أكثر تعقيداً","يُنشر في المجلات المحكمة فقط","يتطلب موافقة لجنة أخلاقيات"],"الباحث في الإجرائي هو صاحب المشكلة، وغايته التحسين الموضعي. البدائل الأخرى أقرب إلى سمات البحث الأكاديمي."],
["L03","","لاحظ معلم أن طلاب الصف الرابع لا يتقنون جدول الضرب. الصياغة الأنسب لمشكلة بحثه الإجرائي:",["ما المعوقات التي تمنع طلاب الصف الرابع من إتقان جدول الضرب، وما طرق علاجها؟","أثر طرق التدريس على تحصيل الرياضيات في المملكة","لماذا ضعف مستوى التعليم في الرياضيات؟","تعميم استراتيجية جديدة على جميع مدارس المنطقة"],"المشكلة الإجرائية محددة وواقعية وقابلة للحل في حدود الإمكانات. البدائل الأخرى عامة أو تهدف للتعميم."],
["L03","m","بعد أن طبق المعلم حلاً لمشكلة في صفه وقوّمه، الخطوة التالية في دورة البحث الإجرائي:",["التأمل في النتائج وتعديل الممارسة أو تجريب حل آخر إذا لم ينجح","إنهاء البحث ونشره مباشرة","تعميم الحل على بقية مدارس المنطقة","العودة إلى تحديد المشكلة دون أي تعديل"],"الدورة حلزونية: بعد التقويم يأتي التأمل ثم إعادة التخطيط بحل معدل. التعميم ليس من أهدافه."],
["L03","","أي الآتي أداة من أدوات التأمل الجماعي لا الذاتي؟",["البحث الإجرائي","بطاقة التأمل","نافذة جوهاري","تصوير الدرس بالفيديو"],"البحث الإجرائي وملف الإنجاز الجماعي ومؤتمرات التأمل أدوات جماعية؛ البطاقة والنافذة والفيديو أدوات ذاتية."],
["L03","m","في نافذة جوهاري، المنطقة التي يراها الزملاء والطلاب في سلوك المعلم ولا يراها هو تُضيَّق بـ:",["طلب التغذية الراجعة وتقبل النصح والنقد","الإفصاح عن المشاعر لمن يثق به","زيادة القراءة في التخصص","التدريب على مهارات جديدة"],"هذه المنطقة العمياء، ولا يراها المعلم إلا بعيون الآخرين عبر التغذية الراجعة. الإفصاح يضيّق المنطقة الخاصة لا العمياء."],
["L03","","يحتفظ معلم بأفكاره ومشاعره حول مهنته ولا يطلع عليها أحداً. هذه في نافذة جوهاري:",["المنطقة الخاصة","المنطقة العامة","المنطقة العمياء","المنطقة المجهولة"],"ما يعرفه المعلم عن نفسه ويخفيه عن الآخرين هو المنطقة الخاصة، والحل الإفصاح لمن يثق به لتنتقل إلى العامة."],
["L03","m","أنشأت الوزارة منصة رقمية جديدة للتدريب يمكن للمعلم الاستفادة منها. تُصنَّف في تحليل سوات:",["فرصة","نقطة قوة","تهديد","نقطة ضعف"],"عامل خارجي إيجابي = فرصة. نقاط القوة داخلية تخص المعلم نفسه."],
["L03","","يصف معلم في بطاقة تأمله ما حدث في الحصة دون تفسير أو حلول. مستوى تأمله:",["الوصفي","التفسيري","الحواري","الناقد"],"الوصفي يجيب عن سؤال «ماذا حدث؟» فقط. التفسيري يضيف تبريراً بحل واحد."],
["L03","m","يجري معلم حواراً داخلياً مع نفسه يختبر فيه عدة حلول لمشكلة ضعف المشاركة في صفه. مستوى تأمله:",["الحواري","الوصفي","التفسيري","الناقد"],"اختبار الحلول والفروض عبر حوار داخلي هو المستوى الحواري. الناقد يتطلب مشاركة الزملاء، والتفسيري حلاً واحداً."],
["L03","","موقف تدريسي حقيقي يتدرب فيه المعلم على مهارة تدريسية واحدة أمام عدد قليل من الطلاب في وقت قصير ويتلقى تغذية راجعة:",["التدريس المصغر","الدرس النموذجي","بحث الدرس","التعليم المبرمج"],"التدريس المصغر: مهارة واحدة، 5–20 دقيقة، 1–10 طلاب، تصوير وتغذية راجعة. الدرس النموذجي درس متكامل لنقل الخبرة."],
["L03","m","نهج تطوير مهني يُسمى «التطوير القائم على المدرسة»، يمارس فيه فريق من المعلمين بدعم قادة المدرسة دورة من سبع مراحل تبدأ بضبط الهدف البعيد:",["بحث الدرس","التدريس المصغر","البحث الإجرائي","القراءة الموجهة"],"بحث الدرس (Lesson Study) هدفه بعيد المدى ومراحله سبع تنتهي بكتابة التقرير. البحث الإجرائي يبدأ بالإحساس بمشكلة لا بهدف بعيد."],
["L03","","يحضر عدد من المعلمين درساً متكاملاً يقدمه معلم متميز بحضور المشرف لنقل خبرته إليهم. هذا الأسلوب:",["الدرس النموذجي","التدريس المصغر","الزيارة التبادلية","حلقة النقاش"],"الدرس النموذجي درس تطبيقي كامل يُقدَّم للعرض. الزيارة التبادلية ثنائية بين زميلين، والمصغر تدريب على مهارة."],
["L03","","تتألف التنمية المهنية للمعلم من التدريب المهني والتربية المهنية و:",["المساندة المهنية","التقويم المهني","الرقابة المهنية","الترقية المهنية"],"المكونات الثلاثة: تدريب (مهارات)، تربية (معتقدات وقيم)، مساندة (استقرار وظيفي)."],
["L03","","«توفير مناخ الاستقرار الوظيفي وتحسين ظروف العمل والتوطين داخل المدارس» هو تعريف:",["المساندة المهنية","التدريب المهني","التربية المهنية","التأمل الذاتي"],"المساندة تهتم بالبيئة والاستقرار، لا بالمهارات (تدريب) ولا بالمعتقدات (تربية)."],
["L03","m","يريد معلم بناء خطة لتطوير أدائه المهني في ضوء المعايير. الخطوة الأولى الصحيحة:",["رصد ممارسته الحالية ومقارنتها بالمعايير المهنية لتحديد الفجوة","التسجيل في أكبر عدد من الدورات المتاحة","طلب تقويم من مدير المدرسة","قراءة كتاب في تخصصه"],"خطة التطوير تبدأ بتشخيص الفجوة بين الواقع والمعيار. الدورات والقراءة وسائل تأتي بعد تحديد الاحتياج."],
["L03","h","يشارك معلم باستمرار في الأنشطة غير الصفية الهادفة داخل المدرسة وخارجها. يدل ذلك على أنه:",["يملك اتجاهاً إيجابياً نحو مهنة التدريس","يتقبل الأفكار الجديدة","يحافظ على تراث المجتمع","يسعى إلى الترقية"],"المشاركة التطوعية المستمرة دليل على اتجاه وجداني إيجابي نحو المهنة. تقبل الأفكار الجديدة والسعي للترقية لا يُستدل عليهما من الموقف، والأنشطة غير الصفية ليست أسلوب تطوير مهني بذاتها."],
["L03","","من مميزات التأمل الذاتي للمعلم أنه:",["يدفع المعلم إلى تغيير سلوكه لا مجرد اكتساب المعلومات","يغني عن التدريب والتطوير","يُجرى مرة واحدة في بداية العام","يقتصر على المعلمين الجدد"],"التأمل يحوّل المعرفة إلى تغيير في الممارسة، وهو مستمر في مراحل التخطيط والتنفيذ والتقويم ولكل المعلمين."],
["L03","","يحدث التأمل الذاتي في مراحل التدريس:",["التخطيط والتنفيذ والتقويم","التخطيط فقط","التنفيذ فقط","التقويم فقط"],"التأمل يرافق المراحل الثلاث: قبل الدرس وأثناءه وبعده."],
["L03","","المعلم الذي ينتظر أن تقيم له الإدارة دورات ولا يقرأ ولا يبحث بنفسه يخالف مبدأ:",["المسؤولية الذاتية عن النمو المهني","العمل بروح الفريق","الشراكة المجتمعية","الحياد المهني"],"الميثاق والأدبيات تجعل المعلم مسؤولاً عن نموه ولا ينتظر الدورات. البدائل الأخرى مبادئ لا علاقة لها بالموقف."],
["L03","","اقترح المشرف على معلم الاشتراك في مجلة علمية محكمة في تخصصه. الفائدة الأساسية لهذا الأسلوب في النمو المهني:",["الاطلاع المنتظم على أحدث البحوث التي راجعها متخصصون","الحصول على ساعات تدريب معتمدة للترقية","التدرب العملي على مهارة تدريسية محددة","تقويم أداء المعلم من جهة خارجية"],"المجلة المحكمة مصدر معرفة محدَّث وموثوق لأن بحوثها تمر بتحكيم المتخصصين، وهي من أساليب النمو التي يرشد إليها المشرف. التدرب على مهارة محددة يكون بالتدريس المصغر، والتقويم ليس وظيفة المجلة."],
["L03","","يسجل معلم ملاحظاته التأملية بعد كل درس ويحتفظ بنماذج من أعماله وأعمال طلابه وأدلة نموه في مجلد منظم. الأداة:",["ملف الإنجاز","السجل القصصي","قائمة الشطب","الاستبانة"],"ملف الإنجاز تجميع منظم لأعمال المعلم وأدلة نموه ويُستخدم للتأمل. السجل القصصي ملاحظات عن الطلاب، والشطب والاستبانة أدوات قياس."],
["L03","","يرغب معلم في تطوير مهارة طرح الأسئلة الصفية تحديداً. الأسلوب الأنسب:",["التدريس المصغر مع تغذية راجعة على هذه المهارة","حضور محاضرة عامة عن التدريس الفعال","قراءة كتاب في فلسفة التربية","الاشتراك في لجنة الجدول المدرسي"],"مهارة واحدة محددة = التدريس المصغر. المحاضرة العامة والكتاب الفلسفي لا يتدربان على المهارة عملياً."],
// ===== L04: التفاعل مع مجتمعات التعلم وأولياء الأمور والمجتمع =====
["L04","hm","تلقى معلم مكالمة من والد طالب منزعج يرى أن ابنه عوقب بطريقة غير عادلة، فطلب المعلم موعداً لمقابلته. يحقق المعلم هدفه من المقابلة إذا بدأها بـ:",["إتاحة الفرصة للأب للتعبير عن رأيه ومشاعره ووصف فهمه لما حصل","وصف وجهة نظره بالتفصيل وأسباب رد فعله","مراجعة قوانين المدرسة والفصل التي خالفها ابنه","طلب رأي الأب في رد الفعل الذي يراه أنسب للموقف"],"سؤال من دليل الهيئة: الخطوة الأولى للتفاعل الإيجابي هي الإنصات. عرض وجهة النظر ومراجعة القوانين خطوات صحيحة لكن لاحقة، وطلب اقتراح العقوبة يفترض الذنب قبل الفهم."],
["L04","h","أرسل ولي أمر بريداً إلكترونياً يسأل المعلم إن كان ابنه يعاني صعوبات تعلم. الرد المناسب:",["طلب موعد اجتماع بين ولي الأمر ومختص صعوبات التعلم في المدرسة","تقديم معلومات لولي الأمر عن خدمات تدريس ذوي صعوبات التعلم","مناقشة التدخلات النظامية ودور ولي الأمر في المتابعة مع المعلم","توصية ولي الأمر بمراقبة واجبات ابنه وعاداته السلوكية"],"سؤال من دليل الهيئة (3.2): التشخيص ليس من صلاحية المعلم، فيحيل إلى المختص. مناقشة التدخلات تفترض تشخيصاً لم يحدث بعد."],
["L04","hm","يرغب المعلم خالد في التحدث مع أولياء أمور طلابه ومناقشتهم وتبادل الآراء حول تقدم الطلاب. أفضل طريقة لتحقيق هدفه:",["عقد اجتماع لمناقشة الأهداف المشتركة مع أولياء الأمور حول أداء أبنائهم","كتابة ملاحظات إيجابية وإرسالها لأولياء الأمور","ضمان استلام أولياء الأمور تقارير الأداء وتوقيعها وإعادتها","إلزام الطلاب بدفتر متابعة يومي يوقعه أولياء الأمور"],"سؤال من دليل الهيئة: «المناقشة وتبادل الآراء» تحتاج لقاءً تفاعلياً. الملاحظات والتقارير والدفتر اتصال باتجاه واحد."],
["L04","h","يلتقي معلمو الصف الخامس بانتظام لمناقشة الاستراتيجيات التي تساعد الطلاب الذين يجدون صعوبة في الرياضيات. الفائدة المرجوة من هذا اللقاء مساعدة المعلمين على:",["تقديم تعليم مناسب لجميع أنواع ومستويات الطلاب","مكافأة المعلمين الذين يستخدمون طرقاً فعالة","التأكيد على أن بعض المعلمين أفضل من غيرهم","تبادل الآراء حول إزالة الشعور بالإحباط لديهم"],"سؤال من دليل الهيئة (3.1): مجتمع التعلم يركز على تعلم الطلاب. إزالة الإحباط بديل يركز على المعلم لا على أثر اللقاء في الطالب."],
["L04","hm","بعد اطلاع معلم على النتائج المتدنية لطلابه في اختبار الشهر الأول قرر التواصل مع أولياء الأمور للوقوف على الأسباب والتعامل معها. الطريقة الأنسب:",["مجالس أولياء الأمور","الرسائل الرقمية","المكالمات الهاتفية","النشرات التوعوية"],"المشكلة جماعية تحتاج لقاءً جماعياً تفاعلياً لبحث الأسباب. المكالمات فردية مرهقة، والرسائل والنشرات باتجاه واحد لا تكشف الأسباب."],
["L04","h","تهدف عملية إرسال التقارير المنظمة لأولياء الأمور عبر القنوات المتاحة أساساً إلى:",["توضيح مستوى الطالب وتقدمه","إبراز جهود المعلم والمدرسة","تحقيق مبدأ الثواب والعقاب","استقبال تغذية راجعة من ولي الأمر"],"التقارير وسيلة إعلام ولي الأمر بمستوى ابنه. إبراز جهود المعلم بديل يركز على المعلم، والتغذية الراجعة نتيجة ثانوية."],
["L04","hm","صادفك مساءً أحد أولياء الأمور وعبّر عن استيائه من تعرض ابنه المتكرر للتنمر في المدرسة. الاستجابة الأفضل:",["أستمع للمشكلة ثم أخبره بمتابعة ذلك مع المرشد الطلابي في المدرسة","أوضح له أن المدرسة لا تملك الصلاحيات وأنصحه بالاتصال بالجهات المختصة","آخذ الأمر ببساطة وأخبره أن هذا جزء طبيعي من الحياة المدرسية","أخبره بضرورة مراجعة الإدارة لأن ذلك ليس من طبيعة عملي"],"الإنصات أولاً ثم الإحالة إلى القناة النظامية (المرشد) لأن التنمر متكرر. التهوين والتنصل يفقدان ثقة ولي الأمر."],
["L04","h","أحد أساليب تنمية أداء المعلمين يساعد بصورة كبيرة على التكيف مع المواقف والممارسات التعليمية المختلفة:",["مجموعات التعلم المهنية","اللقاءات الدورية مع أولياء الأمور","التنافس في العطاء بين المعلمين","المؤتمرات والورش التربوية"],"مجتمعات التعلم تتيح تجريب الاستراتيجيات في مواقف مختلفة وتبادل الخبرات باستمرار. المؤتمرات موسمية، والتنافس يناقض ثقافة التعاون."],
["L04","hm","من صور التفاعل الإيجابي الذي يقوم به المعلم مع أولياء الأمور استخدام تقنيات التواصل لإطلاعهم على:",["خططه التدريسية وتعلم الطلاب","أهداف المقررات الدراسية","أهدافه المعرفية ذات الأولوية","تنظيم العمل التعليمي والإرشادي"],"المعيار ينص على إدارة تواصل منتظم مع أولياء الأمور يتعلق بالخطط التدريسية وتعلم الطلاب. أهداف المقررات معلومات عامة لا تواصل عن الطالب."],
["L04","h","تعتمد الشراكة بين المدرسة والمجتمع على أطراف مثل إدارة المدرسة وأولياء الأمور والقطاعين الحكومي والخاص والجامعات، ويعتمد نجاحها على الاحترام المتبادل وتقدير جهود المعلمين وتعزيز المسؤولية المتبادلة. ما سبق يعني:",["مقومات الشراكة بين المدرسة والأسرة والمجتمع","خصائص الشراكة المجتمعية بين الأسرة والمدرسة","المسؤولية المجتمعية وعلاقتها بالشراكة المجتمعية","متطلبات تفعيل الشراكة بين المدرسة والأسرة"],"الأطراف وشروط النجاح هي مقومات (أركان) الشراكة. الخصائص تصف طبيعتها، والمتطلبات إجراءات تفعيلها."],
["L04","hm","استشارك مدير المدرسة في كيفية تشكيل مجتمعات التعلم المهنية. تنصحه بتنظيم المعلمين حسب:",["الصفوف التي يدرسونها","سنوات خبرتهم في التعليم","فئات أعمارهم الحقيقية","متوسط أعداد الطلاب"],"مجتمع التعلم يركز على تعلم طلاب محددين، فالتنظيم حسب الصف أو التخصص يجمع من يشتركون في المشكلات نفسها. الخبرة والعمر لا علاقة لهما بتعلم الطلاب."],
["L04","h","يتعاون المعلمون في المدرسة بشكل تبادلي من أجل تطوير أدائهم والتنمية المستدامة من خلال:",["مجتمعات التعلم المهنية","مراجعة المادة الدراسية","التعاون مع المدير","التخطيط المستمر والفعال"],"التعاون التبادلي المستدام بين المعلمين هو جوهر مجتمعات التعلم المهنية. البدائل الأخرى مهام فردية أو إدارية."],
["L04","hm","المفهوم الخاطئ حول مجتمعات التعلم المهنية أنها:",["تُعنى بالجوانب النظرية للتعلم","تؤدي إلى تقدم في مستوى تحصيل الطلاب","توفر فرص التنمية المهنية داخل المدرسة","تشجع الإبداع والمشاركة في المعارف"],"مجتمعات التعلم عملية تطبيقية تحلل تعلم الطلاب وتجرب الاستراتيجيات؛ وصفها بالنظرية خاطئ. البدائل الأخرى من مزاياها الموثقة."],
["L04","h","الهدف الرئيس من تكوين مجتمعات التعلم في بيئة المدرسة:",["تفعيل تعاون المعلمين لتحسين تعلم الطلاب","تيسير تعاون الطلاب على تحسين تعلمهم","زيادة درجات الطلاب في الاختبارات التحصيلية","تحسين أداء الإدارة المدرسية في تيسير الأعمال"],"الفاعل في مجتمع التعلم هو المعلمون والغاية تعلم الطلاب. «تعاون الطلاب» فخ يبدل الفاعل، و«زيادة الدرجات» نتيجة ضيقة لا الهدف."],
["L04","h","تبنّى مجتمع تعلم مهني في إحدى المدارس طريقة تعتمد على تحليل نتائج اختبار إحدى المواد لتحسين تعلم الطلاب. جميع الأسئلة الآتية تساعد في تحقيق هذا الهدف عدا:",["من هم الطلاب الذين حصلوا على أعلى الدرجات؟","كيف اختلفت إجابات الطلاب بين الفصول المتعددة؟","ما أكثر الأسئلة التي أجاب عنها الطلاب جيداً؟","ما أكثر الأسئلة التي أجاب عنها الطلاب خطأ؟"],"التحليل لتحسين التعلم يبحث في الأسئلة والفصول ليكشف جوانب الضعف في التدريس. معرفة المتفوقين لا تقدم معلومة عن التعلم أو التدريس."],
["L04","hm","عرضت إحدى المدارس على معلميها تحليلاً لنتائج طلابها في الاختبارات الوطنية لثلاث سنوات للاستفادة منه. المقترح الأنسب لتوظيف هذا التحليل:",["تعديل خطط التدريس والأنشطة في ضوء النتائج","إطلاع أولياء الأمور على النتائج","تدريب الطلاب على الأسئلة السابقة","عرض النتائج في رسوم بيانية للطلاب"],"توظيف النتائج يعني تغيير الممارسة التدريسية. التدريب على الأسئلة السابقة يعالج الأعراض، والإطلاع والعرض مجرد إبلاغ."],
["L04","h","تنظم المدارس اجتماعات ولقاءات دورية مع أولياء الأمور. واحدة مما يأتي لا تُعد من مزايا هذه الاجتماعات:",["إشراك أولياء الأمور في تقويم المعلمين وتوضيح أوجه القصور في أدائهم","المشاركة بين المعلم وولي الأمر في خطة لتحسين تعلم الطالب","إتاحة الفرصة لأولياء الأمور لتعريف المعلمين بأنشطة أبنائهم خارج المدرسة","التغلب على سوء فهم أولياء الأمور لتقدم أبنائهم وتوقعاتهم"],"تقويم المعلمين من اختصاص الإشراف والإدارة لا أولياء الأمور. البدائل الأخرى مزايا حقيقية تخدم الطالب."],
["L04","hm","عند كتابة تقارير الطلاب الخاصة بأولياء الأمور ينبغي مراعاة أن:",["تُكتب بلغة بسيطة وموجزة","تستخدم المصطلحات العلمية التربوية","تتضمن عبارات ثناء عامة","تقتصر على نقاط الضعف"],"ولي الأمر غير متخصص، فالوضوح والإيجاز شرط الفهم. الثناء العام لا يفيد، والاقتصار على الضعف يحبط."],
["L04","h","ما تضعه في حسبانك أولاً بوصفك معلماً حينما تكتب تقريراً لولي الأمر:",["ماذا أريد من ولي الأمر أن يعرف؟","كيف يمكن توصيل المعلومات الجديدة لولي الأمر؟","ماذا يعرف ولي الأمر سابقاً عن موضوع التقرير؟","كيف يمكن لولي الأمر استخدام التقرير؟"],"الهدف من التقرير (الرسالة الأساسية) يحدد محتواه، وبقية الأسئلة تُبنى عليه. طريقة التوصيل وما يعرفه سابقاً اعتبارات تالية."],
["L04","h","التطبيق الذي يمكن للمعلم استخدامه للتواصل الإيجابي المنتظم مع أولياء الأمور وإطلاعهم على سلوك أبنائهم وتقدمهم دون الحاجة إلى استدعائهم:",["ClassDojo","Google Classroom","Kahoot","Excel"],"ClassDojo يرسل لولي الأمر نقاط السلوك والتقدم وصور الأعمال أولاً بأول (وRemind تطبيق مشابه للرسائل). Google Classroom منصة مهام للطلاب، وKahoot للمسابقات، وExcel جداول."],
["L04","hm","جاء إلى المدرسة ولي أمر غاضب من تدني مستوى ابنه الدراسي. التصرف الصحيح للتعامل معه:",["مواجهته بهدوء ومنطق وحياد وعرض مستوى ابنه بالأدلة","امتصاص غضبه برفع درجات الطالب","تحويله إلى المرشد الطلابي","تحويله إلى مدير المدرسة"],"الموقف أكاديمي يخص المعلم مباشرة، فيعالجه بالهدوء والبيانات. رفع الدرجات مخالفة، والإحالة للمرشد أو المدير تنصل من دور المعلم."],
["L04","h","إذا حضر أحد أولياء الأمور إلى المدرسة فإن المعلم:",["يهتم بلقائه ويستقبله","يحيله إلى إدارة المدرسة","يصارحه بمشكلات ولده فوراً","يعتذر عن لقائه لانشغاله"],"استقبال ولي الأمر واجب وبند في تقويم الأداء الوظيفي. المصارحة الفورية بالمشكلات قبل الترحيب والإنصات تنفّر."],
["L04","h","استعان المعلم بأولياء أمور يفعّلون العملية التعليمية ويدعمونها. العضوية التي تُمنح لهم:",["مجلس المدرسة","لجنة التوجيه والإرشاد","لجنة رعاية السلوك","لجنة التميز"],"مجلس المدرسة هو الوعاء النظامي لمشاركة أولياء الأمور في القرار. لجان التوجيه والسلوك مختصة بالعاملين في المدرسة."],
["L04","hm","يتواصل معلم هاتفياً مع والد طالب كثيراً ما يخالف لائحة القواعد السلوكية. الممارسة التي تزيد احتمال تعاون الأب مع المعلم:",["تزويد الأب باللائحة لتدريب ابنه في المنزل على كيفية الالتزام بها","المقارنة بين سلوك الابن والتزام أخيه الأكبر في المدرسة نفسها","التذكير بتدهور التحصيل الدراسي للابن ثم مناقشة أسبابه","إطلاع الأب على سجل مخالفات ابنه منذ بداية العام"],"إعطاء الأب دوراً عملياً إيجابياً يجعله شريكاً. المقارنة بالأخ والشكوى وسرد المخالفات تضع الأب في موقف دفاعي."],
["L04","h","عند إعداد المعلم للأنشطة غير الصفية ينبغي مراعاة أن تكون:",["اختيارية بما يتناسب مع إمكانيات المتعلمين","مطبقة داخل المدرسة فقط","موحدة للطلاب جميعهم","مقتصرة على محتويات الكتاب المدرسي"],"فلسفة النشاط غير الصفي تقوم على الميول والطوعية والفروق الفردية. التوحيد والإلزام والحصر في الكتاب تناقضها."],
["L04","hm","أي مما يأتي يناقض فلسفة الأنشطة غير الصفية؟",["جعلها إلزامية على جميع الطلاب","ارتباطها بميول الطلاب واهتماماتهم","تنفيذ بعضها خارج أسوار المدرسة","مشاركة أولياء الأمور في دعمها"],"النشاط غير الصفي طوعي بطبيعته، والإلزام يحوله إلى حصة. الميول والتنفيذ خارج المدرسة ودعم الأسرة من سماته."],
["L04","h","أقيمت فعاليات اجتماعية عامة في الحي الذي تقع فيه المدرسة، واختلف المعلمون حول المشاركة فيها. أي مما يلي يصف المشاركة في هذه الفعاليات؟",["تكسب المعلم خبرات تدعم تعلم طلابه وتفاعلهم مع المجتمع","تضعف شخصية المعلم عند طلابه","تخرج عن الإطار المهني ومتطلبات عمل المعلم","تكسب المعلم مهارات مهنية لا علاقة لها بطلابه"],"التفاعل مع المجتمع المحلي معيار مهني (3.3) وأثره يعود على الطلاب. البديل الأخير يفصل الخبرة عن الطالب وهو ما يناقض غاية المعيار."],
["L04","hm","طلب معلم من طلابه تنظيف الحديقة والمسجد المجاورين للمدرسة. أفضل طريقة يتصرف بها المعلم معهم:",["يطلب منهم تقريراً بما عملوا ويقيّمهم","يكافئهم بالخروج من المدرسة مبكراً يوم النشاط","يتركهم دون رقابة لتنمية حس المسؤولية لديهم","يستثني المتفوقين دراسياً من النشاط"],"التقرير والتقييم يجعلان النشاط خبرة تعلم موثقة. المكافأة بالانصراف المبكر تعزيز في غير محله، وترك الطلاب بلا رقابة إخلال بالمسؤولية."],
["L04","h","يحرص معلم فيزياء على تتبع الفعاليات المحلية والدولية للمشاركة بمنجزات طلابه، ويعمل على دعم الطلاب وحث أولياء أمورهم على المشاركة بمنجزاتهم. ما سبق يؤكد:",["رغبة المعلم في دعم طلابه للافتخار بمنجزاتهم","حرص المعلم على التواصل مع أولياء الأمور","حث الطلاب على متابعة الفعاليات المحلية والدولية","عدم فاعلية منجزات الطلاب إذا لم تُعرض في المحافل"],"محور الموقف هو الطالب ومنجزه. التواصل مع أولياء الأمور وسيلة وليس الغاية، والبديل الأخير حكم متطرف."],
["L04","hm","يتميز معلم بتنفيذ ما يُطلب منه ويبادر بالأعمال التطوعية، مما أثار زملاءه عليه بسبب مقارنات الإدارة. الإجراء الذي يعينه على تجنب النزاع مع زملائه:",["اقتراح مبادرات جماعية للعمل مع الزملاء كفريق","تبليغ إدارة المدرسة بعدم المقارنة بينهم","تجنب الاحتكاك قدر المستطاع ومعاملتهم بشكل رسمي","حثهم على الالتحاق بالدورات التدريبية التي تقيمها الوزارة"],"روح الفريق التي ينص عليها الميثاق تحوّل المنافسة إلى تعاون. التبليغ يصعّد، والتعامل الرسمي يعزل، والحث على الدورات تعالٍ."],
["L04","h","إذا تعرض المعلم لنقد من زملائه فعليه أن يتعامل مع الموقف بـ:",["الصبر حتى لا يفقد زملاءه","الحزم حتى لا يتكرر الموقف","عدم الاهتمام والاكتراث","توثيق الموقف لحين الحاجة إليه"],"الثقة المتبادلة والعمل بروح الفريق تقتضيان الصبر وتقبل النقد. الحزم يصعّد، والتوثيق يفترض الخصومة."],
["L04","h","لاحظت الإدارة أن طلاباً لا يحضرون كتبهم وأدواتهم، فعقد المدير اجتماعاً مع المعلمين. الخطوة الصحيحة للوصول إلى الحل:",["إبلاغ أولياء الأمور","إبلاغ إدارة التعليم","معاقبة عدد من الطلاب","مشاركة جميع المتعلمين في نشاط"],"المشكلة منزلية (تجهيز الأدوات) فالشريك الطبيعي ولي الأمر. التصعيد لإدارة التعليم مبالغ، والعقاب لا يعالج السبب."],
["L04","hm","بادر المعلمون الأقدم والأكثر خبرة بدعوة المعلمين حديثي التعيين لحضور الحصص الدراسية معهم. يعد ذلك طريقة جيدة لـ:",["التطوير المهني","ورش العمل التخصصية","تعزيز تعلم الطلاب","الشراكة المجتمعية"],"حضور الجدد حصص الخبراء تعلم بالملاحظة وإسناد مهني داخل مجتمع التعلم. الورش أسلوب آخر، والشراكة المجتمعية خارج المدرسة."],
["L04","h","يعزز المعلم علاقته بأولياء الأمور والطلاب. يندرج ذلك تحت:",["المسؤولية المهنية","تعزيز التعلم","دعم التعلم","المعرفة المهنية"],"التفاعل مع أولياء الأمور من مجال «القيم والمسؤوليات المهنية» في المعايير. المعرفة المهنية مجال آخر يخص المتعلم وطرق التدريس."],
["L04","h","عندما تشارك زملاءك المعلمين في مراجعة أعمالكم من خلال المناقشات واللقاءات فهذا يعد ممارسة تساعد على:",["حل المشكلات المرتبطة بقضايا التدريس","تعديل المقررات المدرسية المرتبطة بالتخصص","وضع معايير تربوية للتعلم النشط","اقتراح حلول متنوعة لقضايا المدرسة الإدارية"],"المراجعة المشتركة للأعمال تستهدف ممارسات التدريس مباشرة. تعديل المقررات ووضع المعايير خارج صلاحية مجموعة المعلمين."],
["L04","","من المبادئ الأساسية لمجتمعات التعلم المهنية:",["تشارك الرؤية والقيم والأهداف والتركيز على تعلم الطلاب","التنافس الفردي بين المعلمين","الاعتماد على التدريب الخارجي فقط","تقويم المعلمين بعضهم لبعض لأغراض الترقية"],"المبادئ الأربعة: رؤية مشتركة، ثقافة تعاون، تركيز على تعلم الطلاب، تركيز على النتائج. التنافس والتقويم للترقية يناقضان ثقافة التعاون."],
["L04","","من أوعية مجتمعات التعلم المهنية:",["التدريب بالأقران والتوأمة المهنية والبحوث الإجرائية","الاختبارات الوطنية","اجتماعات أولياء الأمور","تقويم الأداء الوظيفي"],"الأوعية هي صيغ عمل المجتمع المهني: التدريب المباشر، الورش، المؤتمرات، البحوث الإجرائية، التدريب بالأقران، التوأمة، الشبكات، مجموعات التخصص."],
["L04","","من عوامل نجاح مجتمعات التعلم المهنية:",["القيادة الداعمة على مستوى المدرسة وإدارة التعليم","زيادة عدد الحصص لكل معلم","حصر العضوية في المعلمين الجدد","الاكتفاء باللقاءات الافتراضية"],"عوامل النجاح: نظام فاعل للتطبيق، قيادة داعمة، بنية تنظيمية داعمة. زيادة الحصص تحرم المعلم من وقت التعاون."],
["L04","","تُعرَّف الشراكة المجتمعية بأنها:",["إتاحة الفرصة لأكبر عدد من أولياء الأمور ومؤسسات المجتمع للإسهام بالفكر والمشورة والموارد في تطوير التعليم","تبرعات مالية تقدمها الشركات للمدارس","اجتماعات دورية بين المدير والمعلمين","زيارات الطلاب للمصانع والمؤسسات"],"الشراكة أوسع من المال؛ تشمل الفكر والمشورة والموارد البشرية، والعلاقة تبادلية. التبرعات صورة واحدة منها."],
["L04","m","أكثر ما يجعل العلاقة بين المدرسة وأولياء الأمور فاعلة ومستمرة:",["التركيز على إظهار الجانب الإيجابي لأداء الأبناء وعدم استدعاء ولي الأمر عند المشكلات فقط","استدعاء ولي الأمر عند كل مخالفة","إرسال التقارير في نهاية العام فقط","الاكتفاء بالتواصل عبر الطالب"],"العلاقة التي تُبنى على المشكلات فقط تجعل ولي الأمر يتجنب المدرسة. التواصل الإيجابي المستمر والدعوة للفعاليات يبنيان الثقة."],
["L04","","اشتكى طالب لوالده من معلمه، فحضر الوالد طالباً مناقشة الأمر. ما ينبغي أن يراعيه المعلم في اللقاء:",["الاستماع لشكوى ولي الأمر أولاً ثم عرض الحقائق بأدلة من أعمال الطالب دون مناقشة الطالب أمامه","مواجهة الطالب أمام والده بأخطائه","رفض اللقاء وإحالته إلى الإدارة","إنهاء اللقاء سريعاً لتجنب الجدل"],"الإنصات ثم الأدلة الموثقة مع الحفاظ على سرية اللقاء وعدم الحديث أمام الطفل. المواجهة أمام الوالد تحرج الطالب وتفقد الثقة."],
["L04","","من مزايا مجتمعات التعلم المهنية للمعلمين المستجدين:",["توفير البيئة الداعمة والإسناد","إعفاؤهم من النصاب التعليمي","تقليل متطلبات التخطيط","تأجيل تقويم أدائهم"],"الأدبيات تذكر الإسناد والبيئة الداعمة للمستجدين كمزية صريحة. الإعفاءات ليست من وظائف مجتمع التعلم."],
["L04","","تريد المدرسة إشراك المجتمع المحلي في دعم برامجها. الجهات التي تُعد من المجتمع المحيط بالمدرسة:",["الجهات الحكومية والأهلية والأفراد القادرون على الدعم","وزارة التعليم وإداراتها فقط","المدارس الأخرى في المدينة فقط","الطلاب وأولياء الأمور فقط"],"المجتمع المحيط يشمل كل من حول المدرسة من جهات وأفراد قادرين على الدعم، والعلاقة تبادلية."],
["L04","","المعلم الذي يرحب بإسهام أولياء الأمور بخبراتهم ومهنهم في دعم برامج التعلم يحقق أحد مؤشرات معيار:",["التفاعل مع أولياء الأمور (3.2)","التطوير المهني المستمر (2)","الالتزام بالأخلاق المهنية واللوائح (1.3)","التقويم (10)"],"نص المؤشر: يشجع أولياء الأمور على الإسهام بخبراتهم وعلمهم في دعم برامج التعلم والأنشطة غير الصفية."],
["L04","","من النتائج التي تحققها الشراكة المجتمعية الفاعلة:",["توجهات أفضل نحو المدرسة وانخفاض معدل التسرب وارتفاع معنويات المعلمين","زيادة الأعباء الإدارية على المعلم","تقليص دور المدرسة لصالح الأسرة","الاعتماد على التبرعات في رواتب المعلمين"],"النتائج الموثقة: تحصيل أعلى، تسرب أقل، دعم أكبر من أولياء الأمور، معنويات أعلى. البدائل الأخرى آثار سلبية أو غير واردة."]

// م 2.1.2 أهداف التطوير من مؤشرات الرتبة
["L03","n","حلّل معلم مؤشرات رتبة المعلم الممارس فوجد أن أداءه في «إشراك المتعلمين في إعداد محكات التقويم» دون المطلوب. الخطوة التالية الأنسب في بناء خطة تطويره:",["صياغة هدف تطوير محدد قابل للقياس مرتبط بهذا المؤشر","التسجيل في أقرب دورة تدريبية متاحة في أي مجال","انتظار زيارة المشرف ليحدد له احتياجاته","تغيير طريقة تدريسه كاملة دون تحديد هدف"],"مؤشر 2.1: يحدد أهداف التطوير في ضوء تحليل متطلبات المعايير المهنية لرتبة الممارس ومؤشراتها؛ فبعد تحديد الفجوة تأتي صياغة الهدف. الدورة العشوائية لا ترتبط بالاحتياج، وانتظار المشرف ينقل المسؤولية عن المعلم."],

// م 2.1.3 خطة قابلة للتطبيق
["L03","n","وضع معلم خطة لتطوير مهاراته في التقويم التكويني تتضمن حضور ست دورات في التقويم خارج مدينته وقراءة عشرين كتاباً عنه خلال شهر واحد مع نصابه الكامل. أبرز ما ينقص هذه الخطة:",["قابلية التطبيق وواقعية الزمن والموارد","وضوح المجال الذي يريد تطويره","ارتباطها بالتعلم مدى الحياة","تنوع أنشطة التطوير فيها"],"مؤشر 2.1 للممارس: يرسم خطة قابلة للتطبيق لتطوير أدائه وفقاً لأهدافه واحتياجاته؛ الخطة هنا متنوعة الأنشطة لكنها غير واقعية زمنياً."],
["L03","n","بعد أن حدد المعلم هدف تطويره وأنشطته وزمن تنفيذها، بقي عليه لاستكمال عناصر خطته أن يحدد:",["مؤشرات النجاح والشواهد التي تثبت تحقق الهدف","أسماء الزملاء الذين لم يحققوا الهدف نفسه","الدرجة التي يتوقع أن يحصل عليها في تقويم الأداء","المواد التي يدرسها زملاؤه في القسم"],"عناصر خطة التطوير: الاحتياج، الهدف، الأنشطة والمصادر، الزمن، ثم مؤشرات النجاح وأدلة التحقق، فالمتابعة والتقويم."],

["L04","n","أي الممارسات الآتية تعد من معوقات التواصل مع أولياء الأمور التي تصدر عن المدرسة نفسها؟",["الاقتصار على استدعاء ولي الأمر عند وقوع مشكلات من ابنه","إرسال رسائل إيجابية دورية عن تقدم الطالب","كتابة التقارير بلغة بسيطة خالية من المصطلحات","عقد مجالس أولياء الأمور في مواعيد مناسبة"],"ربط التواصل بالمشكلات فقط يولّد لدى الأسرة تجربة سلبية فتتجنب المدرسة. البدائل الأخرى حلول لا معوقات."],
// م 3.3.2 القضايا المحلية في التدريس
["L04","n","يدرّس معلم رياضيات موضوع النسبة المئوية، ولاحظ ارتفاع استهلاك المياه في الحي حسب نشرة محلية. التوظيف الأنسب لهذه القضية في التدريس:",["تحليل الطلاب لبيانات استهلاك أسرهم الحقيقية وحساب نسب الهدر واقتراح طرق للترشيد","تخصيص الحصة لموعظة عن الإسراف بدل الدرس","ذكر القضية في التهيئة ثم العودة إلى تمارين الكتاب","تكليف الطلاب بكتابة موضوع إنشائي عن المياه"],"مؤشر 3.3: يتقصى القضايا المحلية ويوظفها في التدريس بصورة تعزز وظيفة المعرفة؛ أي يستخدم الطالب المعرفة الرياضية لفهم مشكلة واقعية واقتراح حل. البدائل الأخرى تفصل القضية عن هدف الدرس."],
["L04","n","عند اختيار قضية محلية لتوظيفها في درس، أي الضوابط الآتية أولى بالمراعاة؟",["أن ترتبط بأهداف الدرس وتناسب عمر الطلاب وتتجنب التشهير بأشخاص أو جهات","أن تكون أكثر القضايا إثارة للجدل في وسائل التواصل","أن يختارها الطلاب دون أي توجيه من المعلم","أن تكون بعيدة عن بيئة الطلاب حتى لا تحرجهم"],"توظيف القضية يخدم الهدف التعليمي ويراعي المرحلة والقيم؛ الإثارة والجدل ليسا معياراً، والبعد عن بيئة الطالب يناقض فكرة القضية المحلية."],
// م 4.1.1 الحقيقة والرأي والحجة
["L05","n","أي العبارات الآتية تمثل رأياً لا حقيقة؟",["تُعد القراءة الورقية أمتع من القراءة على الشاشة","يتكون العام الهجري من اثني عشر شهراً","تقع مدينة أبها في جنوب غرب المملكة","يغلي الماء النقي عند 100 درجة مئوية عند مستوى سطح البحر"],"الحقيقة قابلة للتحقق بالقياس أو المصادر، والرأي حكم شخصي يختلف فيه الناس؛ و«أمتع» لفظ تقويمي يدل على رأي."],
["L05","n","«بلغ عدد المشاركين في المسابقة 120 طالباً، وهو إقبال ضعيف لا يليق بمدرسة كبيرة». ما الذي تتضمنه هذه الجملة؟",["حقيقة يتبعها رأي","رأي تتبعه حقيقة","حقيقتان متتابعتان","رأيان متتابعان"],"العدد قابل للتحقق فهو حقيقة، ووصفه بأنه «ضعيف لا يليق» حكم تقويمي فهو رأي جاء بعدها."],
["L05","n","كتب أحدهم: «ينبغي تقليل الواجبات المنزلية؛ لأن ابن صديقي يتعب منها». أدق وصف للحجة التي قدمها:",["حجة ضعيفة لأنها تعميم من حالة واحدة","حجة قوية لأنها مبنية على تجربة واقعية","حقيقة علمية لا تحتاج إلى دليل","رأي لا يتضمن أي حجة"],"الحجة القوية ذات صلة وكافية؛ والاستدلال بحالة واحدة تعميم متسرع. والعبارة رأي («ينبغي») مقرون بحجة ضعيفة، لا رأي بلا حجة."],
// م 4.1.3 بنية النصوص وتصنيفها
["L05","n","نص يبدأ بعرض قضية، ثم يسوق الكاتب أدلة وإحصاءات تؤيد موقفه، ويرد على الرأي المخالف، وينتهي بخلاصة تدعو إلى تبني موقفه. نوع هذا النص:",["حجاجي (إقناعي)","سردي","وصفي","إرشادي"],"بنية النص الحجاجي: قضية ← حجج وأدلة ← رد على المخالف ← نتيجة. السردي يحكي أحداثاً، والوصفي يرسم صورة، والإرشادي يقدم خطوات."],
["L05","n","«أولاً: أغلق النوافذ. ثانياً: اخرج بهدوء من الباب الأقرب. ثالثاً: توجه إلى نقطة التجمع». تصنَّف هذه الفقرة نصاً:",["إرشادياً","تفسيرياً","سردياً","حجاجياً"],"النص الإرشادي يوجّه القارئ لأداء عمل بخطوات مرتبة وأفعال أمر وأدوات ترتيب."],
["L05","n","نص يعرّف ظاهرة التصحر، ويبين أسبابها ونتائجها، ويقارن بين أساليب مكافحتها بلغة موضوعية دون إبداء رأي. نوع النص وبنيته الغالبة:",["تفسيري قائم على السبب والنتيجة والمقارنة","وصفي قائم على الصور والتشبيهات","سردي قائم على تتابع الأحداث","حجاجي قائم على الدفاع عن موقف"],"النص التفسيري (المعلوماتي) يشرح بموضوعية، ومن أنماط بنائه التعريف والسبب والنتيجة والمقارنة؛ وغياب الرأي ينفي الحجاجي."],
// م 4.2.2 كتابة نص مدعوم بالشواهد
["L05","n","«للقراءة فوائد عظيمة للطالب. ويحب كثير من الطلاب كرة القدم. كما تنمي القراءة مفرداته وتوسع خياله». أبرز عيب في هذه الفقرة:",["الإخلال بوحدة الفقرة بجملة خارجة عن فكرتها","غياب الجملة الرئيسة","الإكثار من الشواهد والأدلة","خلوها من أدوات الربط"],"وحدة الفقرة تعني أن كل جملها تخدم فكرة واحدة، وجملة كرة القدم لا علاقة لها بفوائد القراءة. الجملة الرئيسة موجودة في أولها، وأدوات الربط موجودة (الواو، كما)."],
["L05","n","كتب معلم فقرة فكرتها أن الأنشطة الصفية القصيرة ترفع انتباه الطلاب. أي الجمل الآتية أنسب لدعم هذه الفكرة بشاهد؟",["فقد ارتفعت نسبة الطلاب المنتبهين في فصلي من 60% إلى 85% بعد إدخال نشاط مدته خمس دقائق في منتصف الحصة","وأنا أرى أن الأنشطة مفيدة جداً للجميع","والأنشطة أنواع كثيرة يصعب حصرها","ومع ذلك يفضّل بعض المعلمين الشرح المتواصل"],"الشاهد يخدم الفكرة مباشرة ويقدم دليلاً قابلاً للتحقق؛ البديل الثاني رأي، والثالث خارج الفكرة، والرابع استدراك يضعفها."],
["L05","n","«ارتفعت درجات الطلاب في الاختبار الثاني، ____ أعاد المعلم شرح المفاهيم الصعبة بطريقة مختلفة». أداة الربط المناسبة للفراغ:",["لأن","لكن","على سبيل المثال","في المقابل"],"العلاقة بين الجملتين نتيجة وسببها، فيناسبها أداة التعليل «لأن». «لكن» و«في المقابل» للاستدراك والتقابل، و«على سبيل المثال» للتمثيل."],
// م 4.2.3 الكتابة الوظيفية: التقارير والمحاضر
["L05","n","كُلف معلم بتوثيق اجتماع مجتمع التعلم المهني في مدرسته. أي العناصر الآتية لا يُعد من مكونات المحضر؟",["رأي الكاتب الشخصي في أداء الحاضرين","أسماء الحاضرين والغائبين","القرارات والتوصيات والمكلف بتنفيذها","تاريخ الاجتماع ووقته ومكانه"],"المحضر وثيقة موضوعية تسجل ما دار في الاجتماع: التاريخ والمكان والحاضرين وجدول الأعمال والمناقشات والقرارات والتوقيعات، ولا مكان فيه لرأي الكاتب الشخصي."],
["L05","n","أعدّ معلم تقريراً عن رحلة علمية نفذها مع طلابه لرفعه إلى مدير المدرسة. الترتيب الصحيح لأجزاء التقرير:",["العنوان ← المقدمة ← عرض الإجراءات والوقائع ← النتائج ← التوصيات","التوصيات ← العنوان ← النتائج ← المقدمة","المقدمة ← التوصيات ← العرض ← العنوان","الحاضرون ← جدول الأعمال ← القرارات ← التوقيعات"],"هيكل التقرير: عنوان، مقدمة بالهدف، عرض للإجراءات والوقائع، نتائج، توصيات، ثم اسم المعد وتاريخه. البديل الأخير هيكل المحضر لا التقرير."],
// م 4.3.1 التحدث ولغة الجسد
["L05","n","يشرح معلم درسه وهو ينظر إلى ورقة التحضير معظم الوقت ويقف في مكان واحد خلف المكتب. أي التوجيهات الآتية أنسب لتحسين حديثه الصفي؟",["التواصل البصري مع جميع الطلاب والحركة الهادفة في الصف مع إشارات متسقة مع الكلام","رفع صوته طوال الحصة لضمان الانتباه","تسريع الشرح لإنهاء المحتوى في وقت أقل","الاكتفاء بقراءة الدرس من الكتاب بصوت واضح"],"مؤشر 4.3: يتحدث بثقة وطلاقة ويوظف لغة الجسد بأسلوب مناسب؛ التواصل البصري والحركة الهادفة والإيماءات المتسقة تقوي الرسالة، ورفع الصوت الدائم والتسرع يضعفان التواصل."],
["L05","n","قالت معلمة لطالبتها «أحسنتِ» وهي تعقد حاجبيها وتلتفت عنها. الأثر المتوقع لهذا الموقف:",["تضعف الرسالة لتعارض اللغة اللفظية مع غير اللفظية","تقوى الرسالة لأن الكلمة إيجابية","لا أثر للغة الجسد ما دامت الكلمة صحيحة","تفهم الطالبة أن المعلمة راضية تماماً"],"عند تعارض اللفظ مع الإشارة يميل المتلقي غالباً إلى تصديق الرسالة غير اللفظية فتضعف الرسالة اللفظية؛ لذا يجب أن تتسق لغة الجسد مع الكلام."],
// م 4.3.2 القراءة الجهرية والصامتة
["L05","n","أرادت معلمة أن يستوعب طلابها الفكرة العامة لنص طويل بسرعة قبل مناقشته. نوع القراءة الأنسب في هذه المرحلة:",["القراءة الصامتة","القراءة الجهرية الفردية","القراءة الجهرية الجماعية","القراءة النموذجية المتكررة"],"القراءة الصامتة أسرع وأعمق في الفهم وتتيح لكل طالب التركيز في المعنى؛ أما الجهرية فتخدم صحة النطق والأداء."],
["L05","n","أثناء القراءة الجهرية أخطأ طالب في ضبط كلمة في منتصف الجملة. التصرف الأنسب من المعلم:",["تركه يكمل الجملة ثم تنبيهه إلى الخطأ وتصويبه بلطف","مقاطعته فوراً عند كل خطأ وتصحيحه","تجاهل الخطأ كلياً حفاظاً على مشاعره","سحب القراءة منه وإعطاؤها لطالب متمكن"],"المقاطعة عند كل خطأ تربك القارئ وتقطع المعنى، والتجاهل يثبت الخطأ؛ الأنسب تركه يكمل المعنى ثم التصويب بأسلوب يحفظ ثقته."],
["L05","n","أي المهارات الآتية تخص القراءة الجهرية تحديداً؟",["تمثيل المعنى بنبرة الصوت ومراعاة علامات الترقيم في الوقف","فهم الفكرة العامة دون تحريك الشفاه","سرعة مسح النص بحثاً عن معلومة","تلخيص النص في جملة واحدة"],"تمثيل المعنى بالتنغيم والوقف عند علامات الترقيم وإخراج الحروف من مخارجها مهارات أداء صوتي للجهرية؛ والبقية مهارات فهم تخدمها الصامتة."],
// م 4.5.1 تصميم الاستبانة وضبطها
["L06","n","وردت في استبانة عن رضا الطلاب العبارة: «المعلم واضح في شرحه ومتعاون مع الطلاب». أبرز خطأ في صياغتها:",["تتضمن فكرتين في عبارة واحدة","تستخدم لغة بسيطة","تتعلق بموضوع الاستبانة","صيغت بأسلوب الإثبات"],"من معايير صياغة عبارات الاستبانة أن تقيس كل عبارة فكرة واحدة؛ فقد يكون المعلم واضحاً غير متعاون، فلا يعرف المستجيب بماذا يجيب."],
["L06","n","طبّق باحث استبانته على 15 معلماً من مجتمع الدراسة لا ينتمون إلى عينته الأساسية، ليكتشف العبارات الغامضة ويحسب زمن الإجابة والثبات قبل التطبيق النهائي. تسمى هذه المجموعة:",["العينة الاستطلاعية","العينة العشوائية الطبقية","لجنة التحكيم","المجموعة الضابطة"],"العينة الاستطلاعية (التجريبية) مجموعة صغيرة من مجتمع الدراسة وخارج عينتها الأساسية تُضبط بها الأداة قبل التطبيق. المحكمون مختصون يقيّمون صدق العبارات."],
// م 5.1.3 مشكلات النمو والأحداث الضاغطة
["L07","n","لاحظ معلم أن طالباً متفوقاً تراجع تحصيله فجأة وأصبح شارداً منطوياً منذ أسابيع، وعلم أن والديه انفصلا مؤخراً. الإجراء الأول الأنسب:",["حوار فردي هادئ مع الطالب يشعره بالاهتمام ثم التنسيق مع الموجه الطلابي","مناقشة ظروفه أمام زملائه ليتعاطفوا معه","خصم درجات المشاركة لتحفيزه على الانتباه","الانتظار حتى نهاية الفصل لعل الحالة تتحسن"],"مؤشر 5.1: يبين تأثير الأحداث اليومية الضاغطة على التعلم وكيفية التعامل معها؛ البداية احتواء فردي يحفظ السرية ثم الإحالة للمختص. التشهير والعقاب والتأجيل تفاقم المشكلة."],
["L07","n","أي المؤشرات الآتية تستدعي من المعلم أكبر قدر من الانتباه بوصفها علامة على تأثر الطالب بحدث ضاغط؟",["تغير مفاجئ وملحوظ في سلوك الطالب أو تحصيله مقارنة بحاله السابقة","حماس الطالب الزائد في الأنشطة الجماعية","ميل طالب المرحلة المتوسطة إلى الأقران","كثرة أسئلة طفل الصفوف الأولية"],"العلامة التحذيرية هي التغير المفاجئ عن المعتاد؛ أما الميل للأقران في المراهقة وحب السؤال عند الصغار فسلوك نمائي طبيعي."],
["L07","n","انتقل طالب حديثاً إلى المدرسة من مدينة أخرى، ويبدو قلقاً ومعزولاً في الفسحة. أنسب ما يقدمه المعلم لدعمه:",["تعريفه بالفصل وقواعده وتكليف زميل مرافق يساعده على الاندماج تدريجياً","تكليفه بتقديم نفسه أمام الصف في أول حصة","تركه حتى يتكيف وحده دون تدخل","إحالته مباشرة إلى لجنة التوجيه الطلابي"],"الانتقال حدث ضاغط شائع؛ والدعم يكون بالتعريف والزميل المرافق والإشراك المتدرج. الإحالة المباشرة للجنة سابقة لأوانها، والعرض أمام الصف قد يزيد قلقه."],
// م 5.1.4 مؤشرات الاضطرابات الانفعالية والاعتداء والإهمال
["L07","n","أي المجموعات الآتية تمثل مؤشرات محتملة على إهمال الطالب؟",["جوع مستمر ورداءة النظافة والملبس وغياب متكرر وحاجات صحية غير معالجة","كثرة الحركة في الفصل وحب الكلام","تفوق دراسي مع خجل اجتماعي بسيط","انشغال بالأقران وتغير الاهتمامات في المراهقة"],"الإهمال عدم توفير حاجات الطالب الأساسية أو التقصير فيها (الجسدية والصحية والعاطفية والتعليمية...) كما عرفته قواعد السلوك والمواظبة، وعلاماته تتعلق بهذه الحاجات؛ والبقية سلوكيات قد تكون نمائية."],
["L07","n","حالة إيذاء ثبت أنها تتطلب تدخلاً عاجلاً. الجهة التي نصت قواعد السلوك والمواظبة على إبلاغها فوراً:",["مركز بلاغات وزارة الموارد البشرية والتنمية الاجتماعية (1919)","المشرف التربوي للمادة","مجلس أولياء الأمور","لجنة التحصيل الدراسي بالمدرسة"],"المادة 29: إبلاغ مركز بلاغات وزارة الموارد البشرية والتنمية الاجتماعية (رقم 1919) فوراً إذا تطلبت الحالة تدخلاً عاجلاً، إضافة إلى الجهات الأمنية إذا اقتضى الأمر."],
["L07","n","أي العبارات الآتية تصف إجراءات التعامل مع حالات الإيذاء والإهمال كما وردت في قواعد السلوك والمواظبة 1447؟",["تُتخذ بشكل عاجل وسري وفقاً لخطورة الحالة ولا تتطلب التدرج","تبدأ بالتنبيه الشفهي ثم تتدرج كالمخالفات السلوكية","يتولاها المعلم وحده دون إشراك الإدارة","تؤجَّل إلى نهاية الفصل لجمع أدلة كافية"],"نصت المادة 29 على أن إجراءات الإيذاء لا تتطلب التدرج بل تُتخذ وفقاً لخطورة الحالة، بشكل عاجل وسري يضمن سلامة الطالب ويمنع تفاقم الحالة."],
// م 5.2.1 الخلفيات الاجتماعية والاقتصادية والثقافية
["L08","n","كلف معلم طلابه بمشروع يتطلب طباعة ملونة وأدوات مكلفة، فلم ينجزه عدد من الطلاب لظروف أسرهم الاقتصادية. الإجراء الأنسب لمراعاة الخلفيات الاقتصادية:",["إتاحة بدائل منخفضة التكلفة واستخدام مصادر المدرسة لإنجاز المشروع","خصم درجات من لم ينجز المشروع ليتعلموا الالتزام","إعفاء هؤلاء الطلاب من المشروع نهائياً","مطالبة أولياء الأمور بتوفير الأدوات خلال يومين"],"مؤشر 5.2: يميز الاختلافات العائدة للخلفيات الاجتماعية والاقتصادية واحتياجاتها التعليمية التي ينبغي تلبيتها؛ وتلبيتها بتوفير البدائل والمصادر، لا بالعقاب ولا بإعفاء يحرم الطالب من التعلم."],
["L08","n","في فصل يضم طلاباً من بيئات ثقافية مختلفة بينهم وافدون حديثاً، أي الممارسات الآتية تمثل التدريس المستجيب ثقافياً؟",["توظيف أمثلة من بيئات الطلاب المتنوعة مع توقعات عالية للجميع ودعم لغوي لمن يحتاجه","خفض المستوى المطلوب من الطلاب الوافدين","اختيار أمثلة من بيئة الأغلبية فقط لتوحيد الفهم","تجنب أي إشارة إلى خلفيات الطلاب الثقافية"],"التدريس المستجيب ثقافياً يجعل ثقافة الطالب وخبرته جسراً للتعلم مع الحفاظ على توقعات عالية؛ خفض التوقعات قالب نمطي، وتجاهل التنوع يحرم الطالب من الربط."],
["L08","n","ينص الإطار الوطني لمعايير مناهج التعليم العام على مبدأ «تكافؤ فرص التعلم». أي الممارسات الآتية أقرب إلى هذا المبدأ؟",["تقديم فرص تعلم متنوعة تراعي الفروق والقدرات والخلفيات الثقافية والاجتماعية لجميع الطلاب","تقديم المهام نفسها بالطريقة نفسها لجميع الطلاب","تخصيص الأنشطة الإثرائية للمتفوقين وحدهم","توزيع الطلاب على فصول ثابتة حسب مستوى أسرهم"],"تكافؤ الفرص في الإطار الوطني: فرص متكافئة ومتنوعة تراعي الفروق الفردية والقدرات والخلفيات الثقافية والاجتماعية لجميع الفئات؛ والتطابق في المعاملة ليس تكافؤاً."],
// م 5.4.3 إجراءات التعامل مع الفئات الخاصة والجهات المشاركة
["L08","n","وفق الدليل التنظيمي للتربية الخاصة، لا تبدأ إجراءات القياس والتشخيص للطالب إلا بعد:",["أخذ موافقة ولي الأمر خطياً بعد إشعاره رسمياً","موافقة المعلم المستشار","انتهاء العام الدراسي","حصول الطالب على درجة متدنية في الاختبار النهائي"],"نص الدليل التنظيمي على أن القياس والتشخيص يتم بعد أخذ موافقة ولي الأمر خطياً وإشعاره رسمياً بالإجراءات؛ فالأسرة شريك أساسي."],
["L08","n","أي الآتي لا يُعد من أعضاء لجنة الخطط التعليمية الفردية كما حددها الدليل التنظيمي للتربية الخاصة؟",["المشرف التربوي لمادة الطالب","معلم التربية الخاصة","ولي أمر الطالب أو من ينوب عنه","معلم التعليم العام"],"تتكون اللجنة من قائد المدرسة ووكيلها للشؤون التعليمية ومعلم التربية الخاصة ومعلم التعليم العام والمرشد الطلابي أو الأخصائي الاجتماعي والمختصين حسب الحاجة وولي الأمر والطالب قدر الإمكان؛ ولم يُذكر المشرف التربوي."],
["L08","n","أي العناصر الآتية تُبنى عليه أولاً صياغة أهداف الخطة التربوية الفردية؟",["مستوى الأداء الحالي للطالب بنقاط قوته واحتياجاته","أهداف المنهج العام للصف دون تعديل","رغبة ولي الأمر في نجاح ابنه","متوسط أداء زملائه في الفصل"],"الخطة الفردية تبدأ بوصف مستوى الأداء الحالي المستخلص من نتائج التشخيص، ومنه تُشتق الأهداف طويلة المدى ثم قصيرة المدى القابلة للقياس."],
// م 5.3.1 نتائج الأبحاث المعاصرة (التعلم المستند إلى الدماغ)
["L09","n","يحرص معلم على بيئة صفية خالية من السخرية والخوف من الخطأ، مع تقديم مهام تتحدى الطلاب. يستند هذا التوجه إلى مبدأ التعلم المستند إلى الدماغ القائل إن التعلم:",["يتعزز بالتحدي ويُكبح بالتهديد","يحدث بالتكرار الآلي وحده","لا يتأثر بالانفعالات","يتم بمعالجة الأجزاء منفصلة عن الكل"],"من مبادئ كين وكين: التعلم يتعزز بالتحدي ويُكبح بالتهديد، والانفعالات أساسية في التعلم، والدماغ يعالج الأجزاء والكل معاً؛ ومنها عنصر الاسترخاء اليقظ."],
["L09","n","بعد شرح المفهوم الجديد، يطلب معلم من الطلاب تلخيصه بكلماتهم وتطبيقه على موقف حقيقي ومناقشة ما تعلموه. يمثل هذا الإجراء في نموذج التعلم المستند إلى الدماغ عنصر:",["المعالجة النشطة","الاسترخاء اليقظ","الانغماس المنظم","التعزيز السلبي"],"العناصر الثلاثة: الاسترخاء اليقظ (بيئة آمنة متحدية)، والانغماس المنظم (خبرات حقيقية غنية)، والمعالجة النشطة (تأمل وتلخيص وتطبيق يثبت المعنى)."],
// م 5.3.2 أساليب التعلم المعرفية وعواملها
["L09","n","طالب يدرك الموقف ككل، ويتأثر بالسياق الاجتماعي، ويفضل العمل في مجموعة مع تعليمات واضحة من المعلم. وفق أسلوب ويتكن المعرفي يوصف بأنه:",["معتمد على المجال","مستقل عن المجال","متروٍّ","مندفع"],"المعتمد على المجال يدرك كلياً ويتأثر بالمحيط ويفضل التوجيه والعمل الجماعي، والمستقل يحلل ويفصل الجزء عن الكل ويفضل العمل الفردي. والتروي والاندفاع بُعد آخر (كاجان)."],
["L09","n","طالب يجيب عن الأسئلة فور سماعها فيقع في أخطاء كثيرة رغم قدرته. أنسب أسلوب لمساعدته وفق بُعد الاندفاع والتروي:",["تدريبه على التوقف وفحص البدائل قبل الإجابة مع منحه وقت انتظار كافياً","حرمانه من المشاركة حتى يتعلم الانضباط","تكليفه بأسئلة أسرع لاستثمار سرعته","نقله إلى مجموعة الطلاب الأضعف"],"الأسلوب المندفع يستجيب بسرعة وبأخطاء أكثر، ويُعالج بتعليم التوقف والتفكير وفحص البدائل وتمديد وقت الانتظار، لا بالعقاب أو التصنيف."],
["L09","n","يفضّل طالب المذاكرة في مكان هادئ بإضاءة قوية، ويحتاج إلى مهام منظمة بخطوات واضحة ليثابر عليها. يربط هذا الوصف تفضيلات أسلوب تعلمه بعوامل:",["بيئية وانفعالية","معرفية فقط","وراثية ثابتة","اجتماعية فقط"],"نموذج دن ودن يربط أسلوب التعلم بعناصر بيئية (الصوت، الإضاءة) وانفعالية (المثابرة، الحاجة إلى التنظيم) واجتماعية وجسمية ونفسية؛ ومؤشر 5.3 يطلب بيان اعتماد أساليب التعلم على العوامل المعرفية والانفعالية والبيئية."],
// م 5.3.3 العادات العقلية
["L10","n","طالب يقرأ السؤال كاملاً ويتأكد من فهمه ويخطط قبل أن يبدأ الحل بدل الإجابة المتسرعة. يمارس هذا الطالب عادة العقل:",["التحكم بالتهور","الإقدام على مخاطر مسؤولة","إيجاد الدعابة","الاستجابة بدهشة ورهبة"],"التحكم بالتهور من عادات العقل عند كوستا وكاليك: التأني والتفكير وفهم المهمة قبل البدء."],
["L10","n","حاول طالب حل مسألة بثلاث طرق لم تنجح، فلم يستسلم وجرب طريقة رابعة حتى وصل إلى الحل. عادة العقل التي يظهرها:",["المثابرة","التفكير التبادلي","الإصغاء بتفهم وتعاطف","جمع البيانات باستخدام جميع الحواس"],"المثابرة: الاستمرار في المهمة حتى إكمالها وعدم الاستسلام بسهولة وتجريب بدائل."],
["L10","n","تُعرَّف عادات العقل بأنها:",["نمط من السلوكيات الذكية يوظفه المتعلم عند مواجهة مشكلات لا يعرف حلها فوراً","مجموعة معارف يحفظها الطالب عن مهارات التفكير","قدرات عقلية فطرية لا تتأثر بالتعليم","خطوات ثابتة لحل المسائل الرياضية"],"عادات العقل عند كوستا وكاليك ميل لتوظيف السلوك الذكي عند مواجهة مشكلة غير معروفة الحل، وهي قابلة للتعلم والتنمية بالنمذجة والممارسة."],
// م 5.3.4 أثر الاتجاهات والقيم
["L10","n","طالبة تكرر «أنا لا أفهم الرياضيات أبداً» فتتجنب المحاولة. أنسب ما يفعله المعلم لتعديل اتجاهها نحو المادة:",["تصميم خبرات نجاح متدرجة وربط المادة بمواقف حياتية تهمها","تذكيرها بأهمية الرياضيات في المستقبل كل حصة","مقارنتها بزميلاتها المتفوقات لتحفيزها","إعفاؤها من المهام الصعبة لحمايتها من الإحباط"],"مؤشر 5.3: يبين تأثير الاتجاهات والقيم على التعلم وكيفية استخدامها لدعمه؛ الاتجاه السلبي يُعدّل بخبرات نجاح وربط بالحياة، لا بالوعظ أو المقارنة أو خفض التوقعات."],
["L10","n","«اعتقاد الطالب بأهمية القراءة، وشعوره بالمتعة فيها، وميله إلى استعارة الكتب». تمثل هذه العبارات على الترتيب مكونات الاتجاه:",["المعرفي ثم الوجداني ثم السلوكي","الوجداني ثم السلوكي ثم المعرفي","السلوكي ثم المعرفي ثم الوجداني","المعرفي ثم السلوكي ثم الوجداني"],"للاتجاه ثلاثة مكونات: معرفي (معتقدات وأفكار)، ووجداني (مشاعر)، وسلوكي (ميل للفعل)."],
// م 7.1.1 أسس المداخل العامة وأهميتها
["L11","n","أي الآتي يمثل المداخل العامة للتدريس الأربعة التي تتناولها مؤشرات المعيار السابع؟",["السلوكي والمعرفي والإنساني (الشخصي) والاجتماعي","المحاضرة والمناقشة والاستقراء والاستنباط","التعاوني والتنافسي والفردي والجماعي","التشخيصي والتكويني والختامي والتتبعي"],"مؤشرات 7.1 للممارس تتناول أسس المدخل السلوكي والمعرفي والإنساني أو الشخصي والاجتماعي؛ البقية طرق تدريس أو أنماط عمل أو أنواع تقويم."],
["L11","n","تكمن أهمية معرفة المعلم بالأسس النظرية للمداخل العامة للتدريس في أنها تساعده على:",["اختيار ما يحفز المتعلمين وينمي قدراتهم ويعدل سلوكهم ومهاراتهم الاجتماعية","حفظ أسماء رواد كل مدخل","الالتزام بمدخل واحد في جميع الدروس","تقليل الحاجة إلى التخطيط للدروس"],"نص مؤشر 7.1: يحدد الأسس والمبادئ النظرية للمداخل ويبرز أهميتها في تحفيز المتعلمين وتنمية مهاراتهم وقدراتهم وتعديل سلوكهم وتنمية مهاراتهم الاجتماعية."],
// م 7.1.2 المدخل السلوكي
["L11","n","قسّم معلم مهارة الكتابة على الحاسب إلى خطوات صغيرة متتابعة، ولا ينتقل الطالب إلى خطوة حتى يتقن سابقتها، مع تعزيز فوري لكل إجابة صحيحة. المدخل الذي يستند إليه:",["السلوكي","الإنساني","الاجتماعي","المعرفي"],"تحليل المهمة إلى خطوات صغيرة والتعزيز الفوري والتعلم للإتقان من أسس المدخل السلوكي الذي يركز على تعديل السلوك واستجابة المتعلم للمهام."],
// م 7.1.3 المدخل المعرفي
["L11","n","عرض معلم على طلابه ظاهرة محيرة، وطلب منهم طرح الأسئلة وجمع البيانات حتى يصلوا إلى التفسير بأنفسهم دون أن يقدمه لهم. المدخل الذي يمثله هذا الأسلوب:",["المعرفي","السلوكي","الإنساني","الاجتماعي"],"المدخل المعرفي يستند إلى أساليب تمكّن المتعلم من التفكير والبحث والاكتشاف ذاتياً والتوصل إلى المعارف بجهده (مؤشر 7.1)."],
["L11","n","يبدأ معلم درسه بمنظم متقدم يعرض فيه الفكرة العامة التي ستُبنى عليها تفاصيل الدرس. يعكس ذلك اهتمام المدخل المعرفي بـ:",["تنظيم البنية المعرفية للمتعلم وربط الجديد بالسابق","تعزيز الاستجابات الصحيحة فوراً","تنمية الوعي بالذات والمسؤولية","نمذجة السلوك الاجتماعي المرغوب"],"المنظم المتقدم (أوزوبل) من نماذج المدخل المعرفي الذي يهتم بالعمليات العقلية وتنظيم المعرفة وربطها بالخبرة السابقة."],
// م 7.1.4 المدخل الإنساني (الشخصي)
["L11","n","يشارك معلم طلابه في تحديد أهداف تعلمهم الشخصية، ويصغي لمشاعرهم بتعاطف، ويطلب منهم تقويم تقدمهم بأنفسهم، مؤدياً دور الميسر. المدخل الذي يستند إليه:",["الإنساني (الشخصي)","السلوكي","المعرفي","الاجتماعي"],"المدخل الإنساني أو الشخصي يعنى بتأثير الجوانب الوجدانية والشخصية على التعلم، ويشجع الاستقلالية المنتجة والوعي بالذات والإحساس بالمسؤولية؛ ومن نماذجه التدريس غير الموجه لروجرز."],
["L11","n","يرتبط نموذج «التدريس غير الموجه» الذي يكون فيه المعلم ميسراً متقبلاً للمتعلم باسم:",["كارل روجرز","ألبرت باندورا","بنجامين بلوم","ديفيد أوزوبل"],"روجرز رائد علم النفس الإنساني وصاحب التدريس غير الموجه. باندورا للتعلم الاجتماعي، وبلوم للتعلم للإتقان، وأوزوبل للتعلم ذي المعنى والمنظم المتقدم."],
// م 7.1.5 المدخل الاجتماعي ونمذجة السلوك
["L11","n","يؤدي المعلم أمام طلابه طريقة الحوار المهذب مع المخالف، ثم يطلب منهم محاكاتها في مواقف لعب أدوار جماعية يتبادلون فيها الملاحظات. المدخل الذي يمثله هذا الإجراء:",["الاجتماعي","السلوكي","المعرفي","الإنساني"],"المدخل الاجتماعي يوظف نمذجة السلوك والتفاعل بين المتعلمين لدعم النظم التفاعلية وبناء ثقافة صفية إيجابية (مؤشر 7.1)، ويستند إلى التعلم الاجتماعي لباندورا."],
// م 7.2.1 الطرق المباشرة: العروض العملية
["L11","n","يريد معلم علوم تعليم طلابه خطوات تجربة تتضمن مادة قابلة للاشتعال ولا تتوفر أدواتها إلا بنسخة واحدة. الطريقة المباشرة الأنسب:",["العرض العملي من المعلم مع الشرح والتأكيد على قواعد السلامة","تقسيم الطلاب إلى مجموعات تنفذ التجربة في الوقت نفسه","المحاضرة مع وصف لفظي للتجربة دون أدوات","تكليف الطلاب بتنفيذها في المنزل"],"العرض العملي يناسب التجارب الخطرة أو التي لا تتوفر أدواتها للجميع، ويجمع بين الأداء والشرح؛ وتنفيذ تجربة فيها مادة قابلة للاشتعال في المنزل أو في مجموعات يعرض الطلاب للخطر."],
["L11","n","أي الإجراءات الآتية أهم قبل تنفيذ العرض العملي أمام الطلاب؟",["تجريب العرض مسبقاً وترتيب المكان بحيث يراه جميع الطلاب","توزيع ورقة الاختبار على الطلاب","إخفاء هدف العرض لزيادة التشويق","تنفيذ الخطوات بسرعة لتوفير وقت الحصة"],"نجاح العرض العملي يتطلب تجريبه مسبقاً، وتوضيح هدفه، وضمان رؤية الجميع، والأداء خطوة خطوة ببطء مع الشرح."],
// م 7.2.4 التدريس البنائي: التغيير المفاهيمي
["L11","n","وفق نموذج التغيير المفاهيمي، أول شرط ليتخلى الطالب عن تصوره البديل هو:",["شعوره بعدم الرضا عن تصوره الحالي","حفظه التعريف العلمي الصحيح","إعادة المعلم شرح المفهوم عدة مرات","حصوله على درجة منخفضة في الاختبار"],"شروط بوسنر وزملائه: عدم الرضا عن التصور الحالي، ثم أن يكون المفهوم الجديد واضحاً ومعقولاً ومثمراً."],
["L11","n","يعتقد طلاب أن الجسم الثقيل يسقط أسرع من الخفيف. طلب المعلم توقعاتهم، ثم أسقط أمامهم كرتين متماثلتين في الحجم مختلفتين في الكتلة من الارتفاع نفسه فوصلتا إلى الأرض معاً تقريباً، ثم ناقشهم في تفسير ما لاحظوه. الإجراء الذي استخدمه لإحداث التغيير المفاهيمي:",["إحداث تناقض معرفي بين التوقع والملاحظة","التعزيز الفوري للإجابة الصحيحة","التلقين المباشر للقانون العلمي","تقسيم المهارة إلى خطوات صغيرة"],"كشف التصور القبلي ثم تقديم حدث يخالف التوقع يولد عدم الرضا (التناقض المعرفي) الذي يمهد لتبني المفهوم العلمي؛ وهي استراتيجية توقع – لاحظ – فسر."],
// م 8.1.1 ربط أهداف التعلم بمعايير المنهج
["L12","n","يبدأ معلم تخطيط وحدته بتحديد نواتج التعلم المستهدفة من معايير المنهج، ثم يحدد الأدلة التي تثبت تحققها، ثم يصمم الأنشطة. يمثل هذا التسلسل:",["التصميم العكسي","التخطيط الخطي من صفحات الكتاب","تحليل المهمة","التعلم للإتقان"],"التصميم العكسي يبدأ بالنتائج المرغوبة ثم أدلة التقويم ثم خبرات التعلم؛ وهو تطبيق لمؤشر 8.1: ربط أهداف التعلم بمعايير المنهج في تسلسل منطقي."],
["L12","n","وفق الإطار الوطني لمعايير مناهج التعليم العام، تمثل «معايير الأداء»:",["نواتج التعلم المتوقعة من المتعلم في نهاية كل صف أو مستوى","وصفاً عاماً لما ينبغي أن يتعلمه المتعلم في المجال","معايير تقويم أداء المعلم في الفصل","الحد الأدنى لدرجة النجاح في المادة"],"الإطار الوطني: معايير المحتوى وصف عام لما ينبغي أن يتعلمه المتعلم في كل مجال، ومعايير الأداء تمثل نواتج التعلم المتوقعة بعد دراسته المجال في نهاية كل صف أو مستوى."],
["L12","n","هدف درس ينص على «أن يقارن الطالب بين نوعين من الصخور»، لكن تقويم الدرس اقتصر على سؤال «اذكر أنواع الصخور». المشكلة في هذا التخطيط:",["عدم المحاذاة بين الهدف والتقويم في المستوى المعرفي","صياغة الهدف بفعل غير قابل للقياس","كثرة أدوات التقويم في الدرس","ارتباط الهدف بمعايير المنهج"],"المحاذاة تعني أن الهدف والنشاط والتقويم تقيس الشيء نفسه وبالمستوى نفسه؛ «يقارن» أعلى من «يذكر» فلا يقيسه سؤال تذكر، و«يقارن» فعل قابل للقياس."],
// م 8.1.4 شروط اختيار مصادر التعلم
["L12","n","وجد معلم مقطع فيديو جذاباً عن موضوع درسه، لكنه يتضمن معلومات علمية قديمة وإعلانات تجارية متكررة. القرار الأنسب وفق شروط اختيار مصادر التعلم:",["استبعاده والبحث عن مصدر دقيق حديث من جهة موثوقة","عرضه لأنه يجذب انتباه الطلاب","عرضه دون تعليق على الأخطاء لتوفير الوقت","تكليف الطلاب بمشاهدته في المنزل بدل الحصة"],"من شروط اختيار المصدر: الدقة العلمية والحداثة وموثوقية الناشر وخلوه من المحتوى غير المناسب؛ والجاذبية وحدها ليست معياراً (مؤشر 8.1)."],
["L12","n","أي الآتي يُعد الشرط الأول والأساسي عند اختيار مصدر تعلم لدرس ما؟",["ارتباط المصدر بأهداف الدرس","حداثة الجهاز المستخدم في عرضه","ارتفاع تكلفته ودلالتها على جودته","كثرة المؤثرات البصرية فيه"],"المصدر وسيلة لتحقيق الهدف، فارتباطه بالهدف أول الشروط، ثم مناسبته للمتعلمين ودقته وإتاحته وأمانه وتكلفته."],
["L12","n","اختار معلم تطبيقاً تفاعلياً لدرسه، ثم تذكر أن في فصله طالباً ضعيف البصر وأن شبكة المدرسة ضعيفة. الإجراء الأنسب قبل الحصة:",["تجريب التطبيق على أجهزة المدرسة وتجهيز نسخة مكبرة وبديل لا يعتمد على الشبكة","إلغاء استخدام أي مصدر رقمي في الدرس","تنفيذ الدرس كما خُطط له وحل المشكلات عند ظهورها","إعفاء الطالب ضعيف البصر من النشاط"],"من شروط اختيار المصادر الإتاحة وسهولة الوصول لجميع الطلاب وملاءمتها للإمكانات المتاحة؛ والتجريب المسبق والبديل يضمنان تحقيق الهدف للجميع."],
// م 8.3.5 التعليم الشامل
["L13","n","أي العبارات الآتية تميز التعليم الشامل عن الدمج؟",["الشمول يكيّف البيئة والمنهج والتدريس ليستوعب تنوع جميع المتعلمين، والدمج يضع الطالب في النظام القائم ليتكيف معه","الشمول يعزل ذوي الاحتياجات في فصول خاصة، والدمج يضعهم مع أقرانهم","الشمول يقتصر على الموهوبين، والدمج يقتصر على ذوي الإعاقة","لا فرق بينهما في المفهوم ولا في الممارسة"],"التعليم الشامل يغير النظام نفسه ليناسب الجميع ويعد التنوع أمراً طبيعياً، بينما الدمج يُلحق الطالب بالنظام القائم ويطلب منه التكيف."],
["L13","n","خطط معلم درسه منذ البداية بحيث يعرض المحتوى نصاً وصورة وصوتاً، ويتيح للطلاب إظهار تعلمهم كتابةً أو شفهياً أو بمنتج، وينوع أساليب التحفيز. يطبق المعلم:",["مبادئ التصميم الشامل للتعلم","التعليم المبرمج","التدريس المباشر","التعلم للإتقان"],"التصميم الشامل للتعلم من ممارسات التعليم الشامل: وسائل متعددة للتمثيل وللتعبير والأداء وللمشاركة والتحفيز، يُخطط لها من البداية لا بعد ظهور المشكلة."],
// م 8.4.1 الأولويات
["L13","n","وفق مؤشرات المعيار الثامن، تشمل الأولويات المتصلة بالأبعاد المشتركة في المناهج:",["المواطنة المسؤولة ومكانة المملكة الريادية والتنمية المستدامة","تقوى الله والوسطية والشغف المعرفي","حل المشكلات والاعتماد على الذات","القراءة والكتابة والحساب"],"مؤشر 8.4 الأول: خبرات تستهدف تنمية الأولويات المتصلة بالمواطنة المسؤولة ومكانة المملكة الريادية والتنمية المستدامة؛ البديل الثاني من القيم، والثالث من المهارات."],
["L13","n","يدرّس معلم علوم درساً عن الطاقة، فكلف طلابه بتحليل فاتورة كهرباء المدرسة واقتراح خطة لترشيد الاستهلاك. الأولوية التي ينميها بصورة مباشرة:",["التنمية المستدامة","الشغف المعرفي","تقدير الذات","مكانة المملكة الريادية"],"ترشيد الموارد والحفاظ عليها للأجيال القادمة من صور التنمية المستدامة، وهي إحدى الأولويات في مؤشر 8.4."],
// م 8.4.2 القيم الست
["L13","n","أي المجموعات الآتية تمثل القيم الست التي نص عليها مؤشر المعيار الثامن للأبعاد المشتركة؟",["تقوى الله، الوسطية والاعتدال، تقدير الذات، الشغف المعرفي، تقدير العمل وإتقانه، المسؤولية","الصدق، الأمانة، التعاون، النظافة، الطاعة، الكرم","المواطنة، الريادة، الاستدامة، الإبداع، الابتكار، التميز","حل المشكلات، الاعتماد على الذات، التواصل، القيادة، التفكير، العمل الجماعي"],"نص مؤشر 8.4: يراعي عند تطبيق الأنشطة تنمية قيم تقوى الله، والوسطية والاعتدال، وتقدير الذات، والشغف المعرفي، وتقدير العمل وإتقانه، والمسؤولية."],
["L13","n","يطرح معلم أسئلة مفتوحة تثير الفضول، ويشجع طلابه على البحث عن إجابات خارج الكتاب ومشاركة اكتشافاتهم. القيمة التي ينميها أساساً من القيم الست في الأبعاد المشتركة:",["الشغف المعرفي","تقوى الله","الوسطية والاعتدال","تقدير العمل وإتقانه"],"الشغف المعرفي حب الاستطلاع والرغبة الذاتية في المعرفة والبحث، ويُنمّى بالأسئلة المفتوحة والمشروعات البحثية."],
["L13","n","تراجع معلمة مع طالباتها مشروعاتهن مرحلة بعد مرحلة، وتطلب منهن تجويدها حتى تبلغ أفضل صورة ممكنة قبل التسليم. القيمة التي تعززها:",["تقدير العمل وإتقانه","الشغف المعرفي","الوسطية والاعتدال","تقدير الذات"],"تجويد العمل ومراجعته حتى يبلغ أفضل صورة تجسيد لقيمة تقدير العمل وإتقانه."],
// م 8.4.3 المهارات
["L13","n","أي الأنشطة الآتية أقرب إلى تنمية مهارة «الاعتماد على الذات» الواردة في مؤشرات الأبعاد المشتركة؟",["تكليف الطالب بتخطيط مهمته وتنفيذها وتقويمها بنفسه مع دعم عند الحاجة","تقديم المعلم الحل كاملاً ثم مطالبة الطالب بنسخه","حل الطالب التمارين بمساعدة ولي أمره في كل خطوة","انتظار الطالب تعليمات المعلم قبل كل خطوة"],"الاعتماد على الذات ينمو حين يتولى الطالب التخطيط والتنفيذ والتقويم بنفسه، مع دعم يتلاشى تدريجياً."],
["L13","n","يعرض معلم على طلابه مشكلة واقعية في المدرسة، ويطلب منهم تحديدها وجمع المعلومات عنها واقتراح حلول وتجريب أفضلها. المهارة التي يستهدفها من مهارات إطار المناهج:",["حل المشكلات","الحفظ والاستظهار","القراءة الجهرية","الإصغاء بتفهم"],"مؤشر 8.4: يقدم أنشطة ومهام تساعد المتعلمين على استخدام استراتيجيات تنمي المهارات المحددة في إطار المناهج، ومنها حل المشكلات بخطواته."],
// م 9.2.4 القدوة وحدود العلاقة المهنية والتراجع عن الخطأ
["L14","n","اكتشف معلم بعد انتهاء الحصة أنه شرح قاعدة بصورة خاطئة. التصرف الذي يتفق مع مؤشرات المعيار التاسع:",["الاعتراف بالخطأ في بداية الحصة التالية وتصحيحه للطلاب","تجاهل الخطأ حفاظاً على مكانته أمام الطلاب","تصحيحه في ورقة الاختبار دون إشارة إلى ما حدث","انتظار أن يكتشف الطلاب الخطأ بأنفسهم"],"مؤشر 9.2 للممارس: يتراجع عن الخطأ ويصححه عند حدوثه؛ والاعتراف يعزز الثقة ويعلّم الأمانة العلمية ولا ينقص من مكانة المعلم."],
["L14","n","طلب طالب من معلمه التواصل معه عبر حسابه الشخصي في وسائل التواصل لمناقشة أمور خاصة. التصرف الأنسب الذي يحفظ حدود العلاقة المهنية:",["توجيهه بلطف إلى القنوات المدرسية المعتمدة وإحالة الأمور الخاصة للموجه الطلابي عند الحاجة","قبول الطلب لتقوية العلاقة مع الطالب","رفض الطلب بحدة أمام زملائه","تجاهل الطلب دون أي رد"],"مؤشر 9.2: يبقي علاقته مع المتعلمين ضمن حدود العلاقات المهنية؛ التوجيه للقنوات المعتمدة يحفظ الحدود دون جرح الطالب، والأمور الخاصة مجالها الموجه الطلابي."],
["L14","n","وفق قواعد السلوك والمواظبة 1447، أي الأدوار الآتية من أدوار المعلم المنصوص عليها؟",["تمثيل القدوة الحسنة للسلوك الإيجابي في القول والفعل","توثيق درجات السلوك ورصدها في نظام نور","إصدار قرار نقل الطالب المخالف إلى مدرسة أخرى","حسم درجات المواظبة على الطالب المتغيب"],"من أدوار المعلم في القواعد: تمثيل القدوة الحسنة في القول والفعل وتعزيز الانضباط الذاتي؛ أما توثيق درجات السلوك وحسم المواظبة فمن أدوار إدارة المدرسة، وقرار النقل تصدره الجهة المختصة في إدارة التعليم."],
// قواعد السلوك والمواظبة 1447: دور المعلم في المخالفات (9.2)
["L14","n","تأخر طالب في المرحلة المتوسطة عن دخول الحصة لأول مرة. وفق قواعد السلوك والمواظبة 1447، الإجراء الذي يتخذه المعلم:",["تنبيه شفهي أول للطالب بأسلوب تربوي يوضح أضرار السلوك","حسم درجتين من درجات السلوك الإيجابي","استدعاء ولي الأمر وأخذ تعهد خطي","تحويله فوراً إلى لجنة التوجيه الطلابي"],"التأخر في الدخول إلى الحصص من مشكلات الدرجة الأولى، والإجراء الأول فيها التنبيه الشفهي من المعلم بأسلوب تربوي؛ وللمعلم مباشرة الإجراءات الثلاثة الأولى منها."],
["L14","n","خرج طالب من الفصل دون استئذان أثناء الحصة. وفق قواعد السلوك والمواظبة 1447، دور المعلم في هذه الحالة:",["رصد المشكلة وتسليم اسم الطالب لإدارة المدرسة لأنها من الدرجة الثانية","حسم درجة السلوك بنفسه وإبلاغ الطالب","إخراج الطالب من الصف بقية اليوم","الاكتفاء بالتنبيه الشفهي دون توثيق"],"الدخول أو الخروج من الفصل دون استئذان من مشكلات الدرجة الثانية، وعلى المعلم رصد مشكلات الدرجة الثانية فأعلى التي باشرها وتسليم الأسماء للإدارة التي تتخذ الإجراءات؛ وإقصاء الطالب خارج الصف ممارسة ممنوعة."],
["L14","n","أي الممارسات الآتية نصت قواعد السلوك والمواظبة 1447 على تجنبها عند التعامل مع الطالب المخالف؟",["تكليفه بنسخ الواجب المدرسي عدة مرات عقاباً","تمكينه من فرص تعويض الدرجات المحسومة","إشعار ولي أمره بالإجراءات المتخذة","مراعاة مناسبة الإجراء لمرحلته العمرية"],"من الممارسات غير التربوية الممنوعة: الإيذاء الجسدي أو النفسي، التسبب في انقطاعه عن التعليم، حرمانه من الإفطار، تكليفه بنسخ الواجب عدة مرات كعقاب، استفزازه، السخرية منه، وإقصاؤه خارج الصف."],
// م 9.3.2 جاهزية مصادر التعلم وإتاحتها
["L14","n","خطط معلم لنشاط على الأجهزة اللوحية، لكن المتوفر منها 10 أجهزة لفصل فيه 30 طالباً. الإجراء الأنسب لضمان إتاحة المصدر للجميع:",["تنظيم مجموعات يتناوب أفرادها على الأجهزة بأدوار محددة مع مهمة موازية لغير المستخدمين","إعطاء الأجهزة للطلاب المتفوقين فقط","إلغاء النشاط كاملاً","السماح لمن يملك جهازاً شخصياً فقط بالمشاركة"],"مؤشر 9.3: يتأكد من جاهزية مصادر التعلم وإمكانية وصول جميع المتعلمين إليها؛ والتناوب المنظم يحقق العدالة والإتاحة."],
["L14","n","قبل حصة تعتمد على عرض مرئي، أي الإجراءات الآتية يحقق مؤشر جاهزية مصادر التعلم؟",["فحص الجهاز والعرض مسبقاً وتجهيز بديل عند تعطل التقنية","تشغيل الجهاز لأول مرة أمام الطلاب","الاعتماد على الطلاب لإصلاح أي عطل","تأجيل العرض إذا تعطل الجهاز إلى الأسبوع التالي"],"جاهزية المصدر تعني التأكد منه قبل الحصة ووجود خطة بديلة تحفظ وقت التعلم."],
// م 9.3.4 الأمن والسلامة
["L14","n","انطلق إنذار الحريق أثناء الحصة. أول ما يفعله المعلم:",["إخراج الطلاب بهدوء وانتظام عبر مسار الإخلاء المحدد دون أخذ الحقائب","السماح للطلاب بجمع أغراضهم قبل الخروج","التحقق بنفسه من مصدر الإنذار قبل إخراج الطلاب","إبقاء الطلاب في الفصل حتى تصل تعليمات الإدارة"],"عند الإنذار تُنفذ خطة الإخلاء فوراً بهدوء وعبر المسار المحدد دون الانشغال بالأغراض، ثم يُتحقق من عدد الطلاب في نقطة التجمع."],
["L14","n","قبل تنفيذ تجربة في المختبر، أي الإجراءات الآتية أولى بتحقيق عوامل الأمن والسلامة؟",["شرح تعليمات السلامة وارتداء النظارات والقفازات الواقية والتأكد من وسم المواد","السماح للطلاب بتذوق المواد للتعرف عليها","البدء بالتجربة مباشرة ثم شرح التعليمات في نهايتها","ترك الطلاب ينفذون التجربة دون إشراف لتنمية استقلاليتهم"],"مؤشر 9.3: يهيئ البيئة التعليمية بطريقة تحقق عوامل الأمن والسلامة؛ وفي المختبر تسبق التعليماتُ وأدواتُ الوقاية ووسمُ المواد والإشرافُ الدائم أيَّ تجربة."],
["L14","n","أخبر طالب معلمه بنيته إيذاء نفسه وبدا مضطرباً. وفق إجراءات الحالات عالية الخطورة في قواعد السلوك والمواظبة 1447، أنسب تصرف:",["التعامل معه بهدوء وأخذ كلامه بجدية وعدم تركه بمفرده مع إبلاغ الإدارة فوراً","مطالبته بالعودة إلى مقعده حتى نهاية الحصة","توجيه أسئلة كثيرة له لمعرفة كل التفاصيل قبل إبلاغ أحد","إخبار زملائه بحالته ليراقبوه"],"المادة 30: التعامل مع الحالة بهدوء وأخذ أقوالها بجدية، وتجنب الضغط عليها بكثرة الأسئلة، ووضعها في مكان آمن وعدم تركها بمفردها، ومراعاة خصوصيتها، وتبليغ الجهات المختصة فوراً."],
// قواعد السلوك والمواظبة 1447: الدرجات والمواظبة (1.3)
["L02","n","وفق قواعد السلوك والمواظبة 1447، كيف توزع درجة السلوك البالغة 100 درجة؟",["80 درجة للسلوك الإيجابي و20 درجة للسلوك المتميز","50 درجة للسلوك و50 درجة للمواظبة","100 درجة للسلوك الإيجابي تُحسم منها المخالفات فقط","60 درجة للسلوك داخل الفصل و40 درجة خارجه"],"تخصص 100 درجة للسلوك: 80 للسلوك الإيجابي يستحقها الطالب تلقائياً بداية كل فصل وتُحسم عند المخالفة، و20 للسلوك المتميز الذي يعكس القيم الإسلامية والهوية الوطنية."],
["L02","n","تغيب طالب يوماً دون عذر مقبول. أثر ذلك على درجة مواظبته وفق قواعد السلوك والمواظبة 1447:",["حسم درجة واحدة من درجات المواظبة عن ذلك اليوم","حسم خمس درجات من درجات المواظبة","حرمانه من دخول الاختبار مباشرة","لا يؤثر الغياب في الدرجة إلا بعد أسبوع"],"تُحسم درجة واحدة من درجات المواظبة عن غياب كل يوم دراسي بدون عذر؛ ويُحرم الطالب من الانتقال إذا تجاوز غيابه بدون عذر 10% من أيام العام."],
["L02","n","وفق قواعد السلوك والمواظبة 1447، أي الآتي لا يدخل في مهام الموجه الطلابي؟",["رصد درجات السلوك وتنفيذ إجراءات الحسم على الطالب المخالف","دراسة حالة الطالب المخالف بعد تنفيذ الإجراء","متابعة الطلبة متكرري الغياب بالتنسيق مع وكيل شؤون الطلبة","توعية الطلبة المخالفين بحقهم في فرص تعويض الدرجات"],"نصت الأحكام العامة على عدم إشراك الموجه الطلابي في رصد درجات السلوك ولا في تنفيذ الإجراءات أو حسم درجات المواظبة، والاكتفاء بدوره في دراسة الحالة وعلاجها."],
// م 10.1.2 خطة التقويم: الرسمي والاعتيادي ودورتا التقويم
["L15","n","أثناء الشرح طلب معلم من الطلاب رفع بطاقات (نعم/لا) للإجابة عن سؤال سريع، فلاحظ أن نصفهم أخطأ فأعاد شرح الفكرة بمثال آخر. يمثل هذا الإجراء:",["تقويماً غير رسمي (اعتيادياً) ضمن دورة التقويم قصيرة المدى","تقويماً رسمياً ضمن دورة التقويم طويلة المدى","تقويماً ختامياً لإصدار حكم نهائي","تقويماً معيارياً لترتيب الطلاب"],"التقويم غير الرسمي يجري تلقائياً أثناء التدريس دون درجة وغرضه تعديل التدريس فوراً، وتعديل الشرح داخل الحصة دورة تقويم قصيرة المدى (مؤشر 10.1)."],
["L15","n","أي الأمثلة الآتية يمثل تقويماً رسمياً؟",["اختبار قصير معلن مسبقاً بزمن ودرجة محددين تُرصد نتائجه","ملاحظة المعلم لتفاعل الطلاب أثناء النقاش","سؤال شفهي عابر لتفقد الفهم","إشارة الطلاب بالإبهام لمدى فهمهم"],"التقويم الرسمي مخطط ومنظم وموثق بشروط محددة ويُبنى عليه حكم؛ البقية أساليب غير رسمية تجري ضمن التدريس."],
["L15","n","وفق لائحة تقويم الطالب 2025 وإجراءاتها التنفيذية، توزع درجة المادة (100) في الصفوف من الثالث الابتدائي إلى الثالث الثانوي للمواد التي تقوم تكوينياً وختامياً على النحو الآتي:",["60 درجة للتقويمات التكوينية و40 درجة لاختبار نهاية الفترة","40 درجة للتقويمات التكوينية و60 درجة لاختبار نهاية الفترة","50 درجة للأعمال و50 درجة للاختبار","100 درجة لاختبار نهاية الفترة فقط"],"نصت الإجراءات التنفيذية على 60 درجة للتقويمات التكوينية بحسب أدوات التقويم ووحدات المقرر، و40 درجة لاختبار نهاية كل فترة دراسية."],
["L15","n","طالب في الصف الثاني الثانوي حصل في إحدى المواد على 62 من 100 في الفترة الدراسية، لكنه حصل في اختبار نهاية الفترة التحريري على 6 من 40. وفق لائحة تقويم الطالب 2025، وضعه في المادة:",["لا يُعد ناجحاً لعدم تحقيقه النسبة الشرطية (20% من درجة الاختبار التحريري)","يُعد ناجحاً لأن مجموعه تجاوز النهاية الصغرى 50%","يُعد ناجحاً لأن الاختبار التحريري لا يدخل في شروط النجاح","يعيد الصف كاملاً دون دور ثانٍ"],"شرطا النجاح في المقرر بالمرحلة الثانوية: النهاية الصغرى (50%)، والنسبة الشرطية (20% من درجة الاختبار التحريري نهاية الفترة)؛ و20% من 40 = 8 درجات و6 أقل منها، فلا يُعد ناجحاً رغم تجاوز مجموعه 50، ويُختبر في الدور الثاني الذي لا تُطبق فيه النسبة الشرطية."],
// م 10.2.5 تسهيلات الاختبار لذوي الاحتياجات الخاصة
["L15","n","طالب لديه صعوبات تعلم في القراءة يعرف الإجابات لكنه يعجز عن قراءة أسئلة اختبار العلوم. التسهيل المناسب وفق الإجراءات التنفيذية للائحة تقويم الطالب:",["قراءة الأسئلة له بصوت عال للتأكد من فهمه المطلوب قبل الإجابة","إعفاؤه من اختبار العلوم كاملاً","تخفيض درجة الاختبار إلى النصف","إعطاؤه أسئلة أسهل من أسئلة زملائه دون الرجوع لخطته"],"نصت الإجراءات التنفيذية على أنه إذا كانت قراءة الأسئلة مشكلة لدى طالب صعوبات التعلم فيجب أن تُقرأ له بصوت عال؛ والتسهيل يغير طريقة الأداء لا المستوى المقيس."],
["L15","n","وفق الإجراءات التنفيذية للائحة تقويم الطالب، أي الآتي يُراعى في جميع حالات تقويم الطالب ذي الإعاقة؟",["ألا يُختبر في أكثر من مادة تحريرية في اليوم الواحد مع منحه الزمن المناسب","أن يُختبر مع زملائه في الوقت نفسه وبالشروط نفسها دون استثناء","أن تُخفض درجة النجاح إلى النصف في جميع المواد","أن يتولى معلم التعليم العام وحده إعداد أسئلته"],"نصت القاعدة السابعة على ألا يُختبر الطالب ذو الإعاقة في أكثر من مادة تحريرية في اليوم الواحد مع إعطائه الزمن المناسب وتقديم الدعم، ويتولى معلم التربية الخاصة الإشراف على تقويمه بالتعاون مع معلم التعليم العام."],
["L15","n","طالب أصم في فصل دمج يكتب إجابات صحيحة المضمون لكنها تتضمن أخطاء إملائية ونحوية. وفق الإجراءات التنفيذية للائحة تقويم الطالب، يصحح معلم الدراسات الاجتماعية إجابته بحيث:",["لا يحاسبه على الأخطاء الإملائية والنحوية ويقيّم المضمون","يحسم درجة عن كل خطأ إملائي","يطلب منه إعادة الإجابة شفهياً","يعطيه صفراً في الأسئلة التي فيها أخطاء لغوية"],"نصت الإجراءات على ألا يتأثر تقويم الطالب الأصم بالتركيب البنائي للغته المكتوبة، وعدم محاسبته على الأخطاء الإملائية أو النحوية في جميع المواد."],
["L15","n","طالب لديه فرط حركة وتشتت انتباه يجد صعوبة في البقاء على مقعده طوال الاختبار. أي التسهيلات الآتية نصت عليها الإجراءات التنفيذية للائحة تقويم الطالب؟",["السماح له بالتوقف والتحرك وتوزيع الاختبار على فترات قصيرة في ركن بعيد عن المشتتات","إخراجه من قاعة الاختبار عند كثرة حركته","إعفاؤه من الاختبار والاكتفاء بالأعمال","إلزامه بالجلوس حتى نهاية الوقت ليتعود الانضباط"],"نصت القاعدة السابعة لذوي فرط الحركة وتشتت الانتباه على توزيع محتوى الاختبار على فترات قصيرة، والسماح بالتوقف والتحرك، والاختبار في ركن خاص بعيداً عن المشتتات."],
// م 10.3.1 نماذج الرصد وتحليل البيانات ببرامج تقنية
["L16","n","رصد معلم نتائج طلابه في برنامج جداول، فوجد أن نسبة الإتقان في معيار «حل المسائل الكلامية» بلغت 35% من الصف، بينما تجاوزت 80% في بقية المعايير. القرار الأنسب في ضوء هذا المؤشر:",["إعادة تدريس المعيار للصف بطريقة مختلفة ثم إعادة تقويمه","إعداد خطة علاجية فردية لطالبين أو ثلاثة فقط","الانتقال إلى الوحدة التالية لأن معظم المعايير متقنة","حذف أسئلة هذا المعيار من الاختبارات القادمة"],"انخفاض الإتقان لدى أغلب الصف في معيار بعينه مؤشر على حاجة التدريس نفسه إلى التعديل؛ أما انخفاضه لدى قلة فتعالجه خطط فردية (مؤشر 10.3: استخلاص المؤشرات الأساسية للأداء وتوظيفها)."],
["L16","n","في الصفين الأول والثاني الابتدائي، تنص الإجراءات التنفيذية للائحة تقويم الطالب على أن يدوّن المعلم تقويمه للطالب في المعايير:",["بشكل يومي في سجل متابعة تقويم الطالب ثم يرصد الخلاصة في النظام الرقمي نهاية الفترة","مرة واحدة نهاية العام في النظام الرقمي","في دفتر خاص لا يطلع عليه أحد","عند طلب ولي الأمر فقط"],"نصت الإجراءات على أن يدون المعلم تقويمه بشكل يومي في سجل متابعة تقويم الطالب، ثم يرصد خلاصة تقويمه وملحوظاته في النظام الرقمي نهاية الفترة موثقة بشواهد في ملف إنجاز الطالب."],
["L16","n","أراد معلم أن يرى بسرعة في جدول درجات طلابه من لم يبلغ مستوى الإتقان في كل معيار. أنسب خاصية في برنامج الجداول لذلك:",["التنسيق الشرطي لتلوين الخلايا الأقل من حد الإتقان","ترتيب الطلاب أبجدياً","تغيير نوع الخط وحجمه","دمج الخلايا في رأس الجدول"],"التنسيق الشرطي يلوّن الخلايا وفق شرط محدد (مثل أقل من 75%)، فيستخلص المعلم بسرعة الطلاب والمعايير المحتاجة إلى علاج."]
]);

// أسئلة الدليلين الرسميين كما وردت حرفياً (البدائل بترتيب الدليل، فهرس الإجابة 0–3، الشرح، المصدر).
// "1441" = دليل المتقدم للاختبار التربوي العام — هيئة تقويم التعليم والتدريب 1441هـ (10 نماذج مشروحة + 23 سؤالاً تدريبياً).
// "1436" = دليل الاختبار العام للمعلمين — المركز الوطني للقياس 1436هـ (12 نموذجاً مشروحاً + 25 سؤالاً تدريبياً مع معامل الصعوبة).
window.OFFICIAL = [

// ───────────── دليل الهيئة 1441 — النماذج المشروحة ─────────────
["L13","إستراتيجية التعلم التي يبحث فيها الطلاب عبر الإنترنت بحثًا جماعيًّا للوصول إلى المعلومات من مصادر موثوقة ومعدة سابقًا من طرف المعلم هي:",["الرحلات الميدانية.","الرحلات المعرفية.","التعلم المبرمج.","التعلم المدمج."],1,"الرحلات المعرفية (الويب كويست) تقوم على بحث جماعي عبر الإنترنت في مصادر اختارها المعلم مسبقًا. الرحلات الميدانية أنشطة خارج الصف، والتعلم المبرمج فردي ذاتي لا جماعي، والتعلم المدمج يدمج الإلكتروني بالصفي التقليدي. (المعيار 8.3)","1441"],
["L13","لدعم عمليات التعلم بالاستقصاء، يُدرب المعلم طلابه على:",["الملاحظة وتنظيم البيانات.","استخدام وسائل التواصل التقني.","تقويم جودة الحلول التي يتوصل لها.","سرعة إنجاز المهام بنسبة مقبولة من الأخطاء."],0,"الاستقصاء يولّد المعرفة بالبحث وطرح الأسئلة عبر عمليات عقلية أساسها الملاحظة والتصنيف والقياس والتنبؤ. تقويم جودة الحلول مستوى لاحق يأتي بعد البحث، والتواصل التقني أداة بلا عملية عقلية، والإتقان السريع يتعلق بمعرفة سابقة. (المعيار 9.4)","1441"],
["L12","(قدرة المتعلم على نقد وتبرير الأفكار بالنسبة لهدف معين)، يصنف هذا الهدف وفقًا لتصنيف بلوم في مستوى:",["الفهم.","التحليل.","التركيب.","التقويم."],3,"النقد والتبرير وإصدار الأحكام هي جوهر مستوى التقويم. التحليل يفكك المعلومات ويوضح العلاقات بينها، والتركيب يجمع الأفكار في بناء جديد، والفهم يصف ويفسر فقط. (المعيار 10.1)","1441"],
