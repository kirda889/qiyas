["L14","","أعطى المعلم طالباً مولعاً بالتحدث في غير وقته فرصة طويلة للحديث حتى ملّ وفقد السلوك جاذبيته. الأسلوب:",["الإشباع","الانطفاء","الإقصاء","التصحيح الزائد"],"الإشباع تقديم المثير أو السماح بالسلوك بكثرة حتى يفقد قيمته. الانطفاء تجاهل، والإقصاء عزل، والتصحيح الزائد إصلاح الضرر وزيادة."],
["L14","m","استعان المعلم بقصص واقعية وأنشطة خدمية في المجتمع لتعديل سلوك طالب لا يقدر الممتلكات العامة. الأسلوب:",["الإرشاد بالواقع","الغمر","تكلفة الاستجابة","السحب التدريجي"],"الإرشاد بالواقع يوظف المواقف والأنشطة الواقعية. الغمر مواجهة الخوف، وتكلفة الاستجابة سحب معزز، والسحب التدريجي تلاشي المساعدة."],
["L14","","طالب يمارس حمية غذائية ويقيّد نفسه عن الحلويات رغم رغبته. هذا مثال على:",["ضبط الذات","الإقصاء","العقاب السالب","الانطفاء"],"ضبط الذات مجاهدة النفس وتقييدها ذاتياً. الإقصاء والعقاب السالب إجراءان خارجيان من المعلم."],
["L14","m","بعد أن أتقن بعض الطلاب الهدف، كلفهم المعلم بنشاط إضافي أعمق لتثبيت التعلم، وكلّف غير المتقنين بتدريبات أساسية. النشاطان على الترتيب:",["تعزيزي، وعلاجي","علاجي، وتعزيزي","إثرائي، وتعزيزي","صفي، ولاصفي"],"النشاط التعزيزي لمن أتقن لتثبيت التعلم، والعلاجي لمن لم يتقن. الإثرائي للموهوبين يتجاوز المنهج."],
["L14","h","اقترب المعلم من طالب شارد وخفّض نبرة صوته ونظر إليه مباشرة دون أن يتكلم فانتبه. نوع الاتصال:",["غير لفظي","لفظي كتابي","لفظي شفهي","أحادي الاتجاه"],"الاقتراب (اللغة التقاربية) والنبرة (الموازية) والنظر (لغة الجسد) كلها اتصال غير لفظي. اللفظي كلمات منطوقة أو مكتوبة."],
["L14","m","استخدام المعلم المسافة والقرب المكاني من الطالب لإيصال رسالة يسمى في الاتصال غير اللفظي:",["اللغة التقاربية","اللغة الموازية","لغة الجسد","الاتصال اللفظي"],"التقاربية تخص المسافة المكانية، والموازية نبرة الصوت وسرعته، ولغة الجسد التعبيرات والإيماءات."],
["L14","","لاحظ المعلم أن الطلاب يسمعونه لكن أذهانهم شاردة فلا يستوعبون. هذا يمثل من معوقات الاتصال:",["شرود الذهن لدى المستقبل","ضعف القناة","غياب المرسل","انعدام التغذية الراجعة"],"شرود الذهن معوق يخص المستقبل. القناة والمرسل والتغذية الراجعة عناصر أخرى في الاتصال."],
["L14","m","أعاد المعلم أوراق التقويم بعد تلوين ما حقق معايير النجاح باللون الوردي وما يحتاج تحسيناً بالأصفر. استراتيجية التغذية الراجعة:",["التخطيط باللونين","نجمتان وأمنية","الكرسي الساخن","بطاقة الخروج"],"التخطيط باللونين تغذية راجعة بصرية بلونين. نجمتان وأمنية نقطتا قوة ونقطة تحسين لفظياً، وبطاقة الخروج أداة تقويم تكويني."],
// ===== L15 التقويم =====
["L15","hm","رصد معلم الأحياء درجة كل طالب ثم حكم عليها في ضوء معيار الوزارة وكتب على ورقة كل طالب الوسائل التي تعزز مستواه. ما قام به المعلم هو:",["تقويم تربوي","قياس تربوي","مقارنة تربوية","مراجعة تربوية"],"الحكم في ضوء معيار مع اقتراح وسائل التحسين هو التقويم (حكم + علاج). القياس رصد الدرجة فقط."],
["L15","h","أي الآتي لا يُعد من الأسئلة الموضوعية؟",["أسئلة الإجابة القصيرة (المقالية المقيدة)","الاختيار من متعدد","الصواب والخطأ","المطابقة"],"الإجابة القصيرة والمقالي المقيد يتأثران بذاتية المصحح نسبياً فلا يُعدان موضوعيين. الاختيار من متعدد والصواب والخطأ والمطابقة والإكمال موضوعية."],
["L15","h","لمعرفة مستوى تحصيل طالب منقول حديثاً مقارنة بترتيبه بين زملائه في الصف الجديد، يستخدم المعلم تقويماً:",["معياري المرجع","محكي المرجع","ذاتي المرجع","تشخيصياً"],"معياري المرجع يقارن الطالب بأقرانه ويحدد ترتيبه. محكي المرجع يقارن بمستوى إتقان، والذاتي بأدائه السابق."],
["L15","m","قارن المعلم درجة الطالب في اختبار نهاية الوحدة بدرجته في الاختبار القبلي لنفس الطالب ليحكم على تقدمه. نوع التقويم بالمرجع:",["ذاتي المرجع","معياري المرجع","محكي المرجع","ختامي"],"ذاتي المرجع يقارن الطالب بنفسه عبر الزمن. معياري بالأقران، ومحكي بمحك إتقان."],
["L15","","أجرى المعلم اختباراً بعد شهرين من انتهاء الوحدة واختبارها النهائي ليتأكد من بقاء أثر التعلم. نوع التقويم:",["تتبعي","تشخيصي","تكويني","قبلي"],"التتبعي يُجرى بعد فترة من الختامي لقياس الاحتفاظ. التشخيصي والقبلي قبل التعلم، والتكويني أثناءه."],
["L15","m","تقويم تجريه الوزارة والهيئة على المدرسة من خارجها، وتقويم تجريه المدرسة لنفسها. يسميان على الترتيب:",["خارجياً، وداخلياً","داخلياً، وخارجياً","معيارياً، ومحكياً","ختامياً، وتكوينياً"],"التصنيف حسب الجهة المقوّمة: خارجي من خارج المدرسة، وداخلي من داخلها، ومتعدد الأطراف يجمعهما."],
["L15","hm","قرأ المشرف أسئلة اختبار أعده المعلم فوجدها متنوعة بين الموضوعية والمقالية القصيرة لكنها تركز على موضوعات دون أخرى. النصيحة الواجب توجيهها:",["بناء جدول مواصفات للاختبار","زيادة عدد الأسئلة لتشمل كامل المقرر","توزيع الأسئلة بالتساوي بين الموضوعات","وضع سؤال عن كل هدف سلوكي"],"جدول المواصفات يوزع الأسئلة وفق الأوزان النسبية للموضوعات والمستويات فيحقق الشمول وصدق المحتوى. التوزيع بالتساوي يتجاهل أهمية كل موضوع."],
["L15","h","تحقيق صدق المحتوى في الاختبار التحصيلي يكون بـ:",["بناء جدول المواصفات","إعادة تطبيق الاختبار","حساب معامل الصعوبة","زيادة عدد الطلاب"],"جدول المواصفات يضمن تمثيل الاختبار للمحتوى والأهداف. إعادة التطبيق للثبات، والصعوبة لتحليل الفقرات."],
["L15","h","يعتمد تقويم الأقران على نشاطين رئيسيين هما:",["الملاحظة والتواصل","المقابلة والاختبار","الاختبار والتواصل","الملاحظة والمقابلة"],"تقويم الأقران يقوم على ملاحظة الطالب عمل زميله والتواصل معه بالتغذية الراجعة، وهو مكمل للتقويم الذاتي."],
["L15","hm","من منظور التقويم من أجل التعلم، إذا وجد المعلم أن أداء طلابه في الاختبار منخفض فعليه أن:",["يراجع خططه واستراتيجيات تدريسه في ضوء النتائج","يسأل الطلبة عن مشكلاتهم الاجتماعية","يحفز الطلاب لبذل مجهود أكبر في الاختبارات التالية","يعيد الاختبار بأسئلة أسهل"],"التقويم من أجل التعلم يوظف النتائج لتعديل التدريس. التحفيز وحده أو تسهيل الاختبار لا يعالج سبب الضعف."],
["L15","m","أراد المعلم قياس اتجاهات طلابه نحو مادة الفيزياء بعبارات يختار الطالب أمام كل منها درجة موافقته من «أوافق بشدة» إلى «لا أوافق بشدة». الأداة:",["مقياس ليكرت للاتجاهات","قائمة الشطب","الاختبار التحصيلي","السجل القصصي"],"ليكرت مقياس تقرير ذاتي خماسي للاتجاهات (نواتج وجدانية). قائمة الشطب نعم/لا للمهارات، والتحصيلي معرفي."],
["L15","","لقياس الميول المهنية للطلاب يستخدم المرشد مقاييس مثل:",["سترونج وكودر","ستانفورد بينيه ووكسلر","TIMSS وPISA","ليكرت وثيرستون للاتجاهات"],"سترونج وكودر مقياسا ميول مهنية. ستانفورد ووكسلر للذكاء، وTIMSS وPISA اختبارات دولية."],
["L15","m","اختبار يناسب الصفوف الأولية ومادة القرآن الكريم وينعدم فيه الغش، لكنه يستغرق وقتاً ويتأثر بذاتية المعلم. هو الاختبار:",["الشفوي","الموضوعي","المقالي","الأدائي"],"الاختبار الشفوي يكشف النطق والتعبير ولا مجال فيه للغش، وعيوبه الوقت والذاتية. الموضوعي سريع التصحيح، والمقالي كتابي."],
["L15","","من مواصفات الاختبار الجيد أن يغطي جوانب المحتوى والأهداف كلها بأوزانها. هذه الخاصية:",["الشمول","الموضوعية","الثبات","التمييز"],"الشمول تغطية المحتوى وفق جدول المواصفات. الموضوعية استقلال عن المصحح، والثبات استقرار، والتمييز كشف الفروق."],
["L15","m","من أهم ما يضمن العدالة في التقويم البديل:",["إعلان المحكات مسبقاً وإتاحة فرص متساوية","الاعتماد على اختبار واحد","إخفاء معايير التصحيح عن الطلاب","تقويم الطلاب بأدوات مختلفة دون معيار"],"العدالة تتطلب محكات معلنة وفرصاً متكافئة وتعدد الأدوات بمعيار واحد."],
["L15","h","يعتمد المعلم على طريقة التقويم القائم على الأداء عندما يطلب من الطلاب:",["توظيف مهاراتهم في مواقف حياتية حقيقية","الإجابة عن أسئلة اختيار من متعدد","استظهار التعريفات","حل اختبار صواب وخطأ"],"التقويم القائم على الأداء يقيس توظيف المهارة في مهمة واقعية. الاختيار من متعدد والصواب والخطأ اختبارات تقليدية ورقية."],
// ===== L16 القياس =====
["L16","hm","أفضل معامل تمييز للفقرة في الاختبار التحصيلي هو:",["0.30 فأكثر","سالب","صفر","0.25 فأقل"],"التمييز المقبول 0.30 فأكثر (ممتاز من 0.40). السالب يعني أن الضعاف أجابوا أفضل فتُحذف الفقرة، والصفر لا تمييز."],
["L16","h","في فصل عدد طلابه 25 أجاب 14 طالباً عن فقرة إجابة صحيحة. معامل صعوبة الفقرة:",["0.56","0.44","0.25","0.14"],"الصعوبة (السهولة) = 14 ÷ 25 = 0.56 فقرة متوسطة. 0.44 نسبة المخطئين."],
["L16","m","سؤال مقالي درجته 10، أجاب عنه 20 طالباً وكان مجموع درجاتهم فيه 120. معامل صعوبة السؤال:",["0.60","0.12","6.0","0.83"],"في المقالي: مجموع الدرجات ÷ (عدد الطلاب × درجة السؤال) = 120 ÷ (20 × 10) = 0.60."],
["L16","","الصدق الذي يبحث في كفاية عدد الأسئلة لتمثيل المادة الدراسية يسمى الصدق:",["العيني","التنبؤي","الظاهري","التلازمي"],"الصدق العيني وجه من صدق المحتوى يخص كفاية العينة من الفقرات. التنبؤي والتلازمي للمحك، والظاهري شكل الاختبار."],
["L16","m","أي العوامل الآتية يرفع معامل ثبات الاختبار؟",["زيادة عدد الفقرات المتجانسة","زيادة التخمين","غموض صياغة الأسئلة","اضطراب الطلاب أثناء التطبيق"],"طول الاختبار بفقرات متجانسة متوسطة الصعوبة يزيد الثبات، أما التخمين والغموض والاضطراب فتخفضه."],
["L16","h","إذا كان معظم طلاب الصف قد حصلوا على درجات مرتفعة في اختبار وقليل منهم على درجات منخفضة، فإن منحنى التوزيع:",["ملتوٍ التواءً سالباً وذيله جهة اليسار","ملتوٍ التواءً موجباً وذيله جهة اليمين","اعتدالي تماماً","مدبب بلا التواء"],"تجمع الدرجات في الجهة العليا يجعل الذيل القليل جهة اليسار (المنخفضة) فالالتواء سالب. الموجب درجات منخفضة وذيل يمين."],
["L16","m","منحنى درجات قمته حادة لأن معظم الدرجات متقاربة حول المتوسط. يوصف هذا المنحنى بأنه:",["مدبب (التفرطح موجب)","مفرطح","ملتوٍ موجباً","ملتوٍ سالباً"],"التفرطح يصف شكل القمة: مدبب عند تقارب الدرجات ومفرطح عند تشتتها. الالتواء يصف انحراف الذيل لا القمة."],
["L16","h","أنسب وقت لتقديم التغذية الراجعة عن الاختبار الفصلي:",["في الحصة التالية للاختبار مباشرة","في نهاية الفصل الدراسي","قبل الاختبار النهائي بيوم","مع إعلان النتائج النهائية فقط"],"التغذية الراجعة أنفع ما كانت أقرب زمنياً إلى الأداء ليربط الطالب الخطأ بسببه ويصححه؛ وهذا مفتاح الملخصات المتداولة أيضاً."],
["L16","","من خصائص التغذية الراجعة الفعالة أن تكون:",["فورية ومستمرة وشاملة لجوانب الأداء","عامة ومؤجلة","مركزة على شخصية الطالب","مقتصرة على الدرجة الرقمية"],"التغذية الراجعة الجيدة فورية ودائمة وشاملة ومحددة وتخص المهمة لا الشخص."],
["L16","m","العلاقة بين الصدق والثبات أن:",["الاختبار الصادق ثابت بالضرورة، والثابت قد لا يكون صادقاً","الثابت صادق بالضرورة","لا علاقة بينهما","الثبات أشمل من الصدق"],"الصدق يتضمن الثبات؛ فمن يقيس ما وُضع له يعطي نتائج مستقرة، أما الاتساق فلا يضمن قياس الهدف."],
["L16","hm","درجات طالب في الاجتماعيات والعلوم 41 و35، ومتوسط فصله 35 و25، والانحراف المعياري 3 و5 على الترتيب. مقارنة بمجموعته كان أداؤه:",["متساوياً في المادتين","أفضل في الاجتماعيات","أفضل في العلوم","لا يمكن الحكم"],"ز الاجتماعيات = (41−35)÷3 = 2، وز العلوم = (35−25)÷5 = 2؛ فالأداء النسبي متساوٍ رغم اختلاف الدرجات الخام."],
// ===== دفعة ثانية: عناصر ضعيفة متبقية =====
["L11","m","معلم يحتكر الحديث طوال الحصة ويملي المعلومات والطلاب متلقون صامتون. يمثل دور المعلم:",["التقليدي (الملقن)","الميسّر","المفوّض","المرشد"],"المعلم التقليدي ناقل للمعلومة والطالب سلبي. الميسر يدعم عند الحاجة، والمفوض يفوض المسؤولية، والمرشد يوجه."],
["L11","","من وسائل التعلم الذاتي التي يتعلم بها الطالب دون تدخل مباشر من المعلم:",["التعليم المبرمج والحقائب التعليمية","المحاضرة والإلقاء","العرض العملي","المناقشة الجماعية"],"التعليم المبرمج والحقائب والموديولات والحاسوب وسائل تعلم ذاتي. المحاضرة والعرض والمناقشة طرق يقودها المعلم."],
["L07","h","عرض معلم الروضة على الأطفال كرات خشبية بعضها أبيض وبعضها أخضر وسألهم: أيهما أكثر، الكرات البيضاء أم الخشبية؟ فأجابوا: البيضاء. يدل ذلك على أن الطفل في مرحلة:",["ما قبل العمليات ويركز على بعد واحد","العمليات المحسوسة ويدرك التصنيف","العمليات المجردة","الحس حركية"],"تجربة بياجيه تكشف عجز طفل ما قبل العمليات عن تضمين الفئة الجزئية في الكلية لتركيزه على بعد واحد. في المحسوسة يدرك أن الخشبية أكثر."],
["L07","m","من العوامل المؤثرة في النمو: الوراثة والبيئة والنضج والتعلم وإفرازات:",["الغدد","الأقران","المعلم","التقنية"],"الغدد الصماء (كالنخامية والدرقية) من العوامل البيولوجية المؤثرة في النمو الجسمي والانفعالي."],
["L07","","يرى برونر أن تسريع تعليم الطفل مفهوماً معقداً ممكن بشرط:",["أن يكون مستعداً من الناحية الفسيولوجية ويُقدَّم بتمثيل يناسبه","أن يتجاوز الطفل سن الحادية عشرة","أن يتعلمه بالتلقين والتكرار","أن يُقدَّم رمزياً دائماً"],"برونر يرى إمكان تعليم أي مفهوم لأي طفل بصورة أمينة تناسب تمثيله (عملي، أيقوني، رمزي) إذا كان مستعداً، بخلاف بياجيه الذي يربط التعلم بالمرحلة."],
["L11","m","يرى معلم أن مهمته ضبط سلوك الطلاب وتعديله بالتعزيز والتعليم المبرمج، ويرى زميله أن التدريس يبدأ من مشاعر الطالب وإدراكاته الذاتية. المدخلان على الترتيب:",["السلوكي، والإنساني (الشخصي)","المعرفي، والاجتماعي","الاجتماعي، والسلوكي","الإنساني، والمعرفي"],"السلوكي ضبط وتعزيز، والإنساني أو الشخصي يركز على الإدراكات الفردية والوجدان. المعرفي يهتم بالبنية المعرفية والاكتشاف، والاجتماعي بالتفاعل الجماعي."],
["L11","","في المدخل المعرفي، المدخل الذي يهتم بمفاهيم العلم الكبرى وطرق البحث فيه لا بمحتوى الكتاب المدرسي هو مدخل:",["بنية العلم","المادة الدراسية","الضبط","النشاط"],"مدخل بنية العلم يركز على المفاهيم الكبرى وطرائق العلماء، بينما مدخل المادة الدراسية يهتم بمحتوى الكتاب. الضبط سلوكي والنشاط لديوي."],
["L11","m","تصنف طرق التدريس وفق الاحتكاك بين المعلم والمتعلم إلى:",["مباشرة (وجهاً لوجه) وغير مباشرة","عامة وخاصة","جمعية وفردية","استقرائية واستنباطية"],"وفق الاحتكاك: مباشرة وغير مباشرة. وفق حاجة التخصص: عامة وخاصة. وفق عدد المتعلمين: جمعية وفردية."],
["L11","","من رواد التعلم التعاوني الذين وضعوا أسسه النظرية:",["ديوي وباركر ودويتش","سكنر وبافلوف وواطسون","بياجيه وكوهلر","أوزوبل وبرونر"],"ديوي وباركر ودويتش ثم جونسون وجونسون رواد التعلم التعاوني. البدائل الأخرى رواد السلوكية والمعرفية."],
["L11","m","برنامج تعليمي ذاتي متكامل يجمع بين الحقائب التعليمية ومبدأ التعلم للإتقان ويتضمن اختبارات قبلية وبعدية. يسمى:",["المجمعات التعليمية","التدريس المصغر","لعب الأدوار","العصف الذهني"],"المجمعات التعليمية نظام تعلم ذاتي متكامل. التدريس المصغر لتدريب المعلمين، ولعب الأدوار والعصف استراتيجيات جماعية."],
["L11","","من أهداف التعليم الفردي:",["مراعاة الفروق الفردية والتعلم للإتقان وتنمية الاستقلالية","توحيد سرعة التعلم لجميع الطلاب","زيادة التنافس بين الطلاب","تقليل دور الطالب في تعلمه"],"التعليم الفردي يراعي الفروق ويسعى للإتقان والاستقلالية والإبداع. التوحيد والتنافس يناقضانه."],
["L13","m","يسمح المعلم للطالب بالانتقال بين المجموعات بحسب المهمة واستعداده، فيكون عضواً في مجموعات مختلفة خلال الأسبوع. الاستراتيجية:",["المجموعات المرنة","التجميع الثابت حسب الذكاء","جيكسو","الرؤوس المرقمة"],"المجموعات المرنة تتغير بحسب المهمة والاستعداد بدل التصنيف الثابت، وهي من أدوات التعليم المتمايز."],
["L13","","نموذج تدريس يبدأ بتمهيد ثم اكتشاف ثنائي ثم أنشطة تعاونية في مجموعات ثم إتاحة الفرص وينتهي بتقويم ذاتي فردي. هو نموذج:",["التعلم البنائي الاجتماعي","فكر‑زاوج‑شارك","التعلم للإتقان","التعليم المبرمج"],"نموذج التعلم البنائي الاجتماعي يبدأ ثنائياً وينتهي فردياً، بخلاف فكر‑زاوج‑شارك الذي يبدأ فردياً ثم ثنائياً ثم جماعياً."],
["L15","m","من وظائف التقويم التربوي:",["تشخيص الضعف وتوجيه التعلم وتطوير المناهج ودعم القرارات","تصنيف الطلاب نهائياً دون علاج","الاكتفاء برصد الدرجات","معاقبة المقصرين"],"التقويم يشخص ويوجه ويحكم ويطور ويدعم القرارات. الرصد وحده قياس، والتصنيف النهائي والعقاب يناقضان غرضه."],
["L15","","أدوات يصف فيها الطالب بنفسه اتجاهاته وميوله مثل مقاييس ليكرت ومقاييس الميول تسمى:",["التقارير الذاتية","الاختبارات التحصيلية","اختبارات الأداء","قوائم الشطب"],"التقارير الذاتية تقيس النواتج الوجدانية بإجابة الطالب عن نفسه. التحصيلية معرفية، والأداء مهارية، وقوائم الشطب ملاحظة المعلم."],
["L15","m","أي مما يأتي يمثل أساساً من أسس التقويم السليم؟",["أن يُبنى على أهداف واضحة ويكون مستمراً وشاملاً","أن يقتصر على اختبار نهائي واحد","أن يُسند إلى المشرف فقط","أن يركز على الحفظ دون المهارات"],"أسس التقويم: وضوح الأهداف، الاستمرار، الشمول، التعاون، العلمية. الاقتصار على اختبار واحد يخالف الاستمرار والشمول."]
]);

// المعيار 5 — بنك أسئلة L07–L10 (البديل الأول هو الصحيح ويُخلط آلياً)
// ===== L07: خصائص النمو ومراحله =====
window.QB = (window.QB || []).concat([
["L07","hm","قدرة الطفل على التصنيف والترتيب والاعتماد على المحسوسات في تفكيره تأتي، حسب تصنيف بياجيه للنمو العقلي، في مرحلة:",["العمليات المحسوسة (المادية)","ما قبل العمليات","الحس-حركية","العمليات المجردة"],"التصنيف والترتيب والاحتفاظ والمعكوسية هي عمليات منطقية تُجرى على أشياء محسوسة، وهذا جوهر مرحلة العمليات المحسوسة (7–11). ما قبل العمليات تسبقها ولا يملك الطفل فيها هذه العمليات."],
["L07","h","مرحلة العمليات المجردة عند بياجيه تبدأ تقريباً من سن:",["11–12 سنة فأكثر","7 سنوات","من الولادة حتى سنتين","2–7 سنوات"],"العمليات المجردة (الصورية) تبدأ مع بداية المراهقة نحو 11–12 سنة وتستمر. 0–2 حس-حركية، 2–7 ما قبل العمليات، 7–11 محسوسة."],
["L07","h","أصبح سامي، طالب الصف الثاني الابتدائي، قادراً على إدراك أن (4+2=6) هي نفسها (6−2=4). في أي مرحلة من مراحل بياجيه يكون سامي؟",["العمليات المحسوسة","ما قبل العمليات","العمليات المجردة","الحس-حركية"],"إدراك المعكوسية (إرجاع العملية إلى أصلها) علامة دخول مرحلة العمليات المحسوسة (7–11). ما قبل العمليات تتميز بغياب المعكوسية والاحتفاظ، والمجردة تتطلب تفكيراً افتراضياً لا مجرد عمليات على أعداد محسوسة."],
["L07","hm","تظهر روح العمل الجماعي والانتماء إلى جماعة الأقران بوضوح، ويسميها بعضهم «سن الجماعة»، في مرحلة:",["الطفولة المتأخرة (9–12)","الطفولة المتوسطة (6–9)","المراهقة المتوسطة","الطفولة المبكرة"],"الطفولة المتأخرة (الصفوف العليا من الابتدائية) هي سن الجماعة والتطبيع الاجتماعي والعمل الجماعي. في المراهقة يغلب الانتماء للأقران أيضاً لكن مع تمرد وبحث عن هوية، أما الطفولة المتوسطة فالطفل ما زال متمركزاً نسبياً."],
["L07","h","تعلّم طفل في الروضة مسك القلم بطريقة صحيحة. يُعد هذا التعلم من مظاهر النمو:",["الجسمي (الحركي)","العقلي","الانفعالي","الاجتماعي"],"مسك القلم مهارة حركية دقيقة تتبع النمو الجسمي الحركي. النمو العقلي يتعلق بالمفاهيم والتفكير، لا بالتحكم العضلي."],
["L07","h","وفق تصنيف إريكسون لمراحل النمو النفسي الاجتماعي، السن التي يتعرض فيها الإنسان لأزمة اضطراب الهوية هي:",["12–18 سنة","6–12 سنة","18–30 سنة","3–6 سنوات"],"أزمة الهوية مقابل تشتت الهوية هي أزمة المراهقة (12–18). أزمة 6–12 هي الاجتهاد مقابل الدونية، و18–30 الألفة مقابل العزلة."],
["L07","h","يرى إريكسون أن الفرد يحاول الإنجاز ويحب الاكتشاف ويسعى إلى تقدير الآخرين له في مرحلة:",["الطفولة المتوسطة والمتأخرة (6–12)","الطفولة المبكرة","المراهقة المبكرة","الشباب المبكر"],"هذه سمات أزمة الاجتهاد (الكفاءة) مقابل الدونية في سن المدرسة الابتدائية: الطفل ينجز ويريد الاعتراف بإنجازه. المراهقة أزمتها الهوية، والطفولة المبكرة المبادرة مقابل الذنب."],
["L07","h","يريد طالب في الثانوية أن يصبح طبيباً لأن والديه يريدان ذلك، دون أن يفكر في بدائل أخرى. وفق حالات الهوية عند مارسيا، فإن الطالب في حالة:",["الهوية المنغلقة (التبني المبكر)","تشتت الهوية","تعليق الهوية","تحقيق الهوية"],"الانغلاق أو التبني المبكر: التزام بهوية فرضها الآخرون دون استكشاف. التشتت لا التزام ولا استكشاف، والتعليق استكشاف بلا التزام، والتحقيق التزام بعد استكشاف."],
["L07","h","من الخصائص المميزة للنمو في مرحلة المراهقة المبكرة (المتوسطة):",["طفرة نمو جسمي مع تقلب انفعالي وبداية التفكير المجرد","بطء النمو الجسمي واستقرار انفعالي","اكتمال التفكير المجرد واستقرار الهوية","التمركز حول الذات وعدم إدراك الاحتفاظ"],"المراهقة المبكرة تتميز بطفرة النمو والبلوغ والتقلب الانفعالي وبداية التجريد. استقرار الهوية واكتمال التجريد يأتيان لاحقاً، والتمركز حول الذات من ما قبل العمليات."],
["L07","hm","أي المراحل العمرية أكثر حساسية للنقد القاسي أمام الأقران، بحيث يحتاج المعلم فيها إلى مناقشة الطالب على انفراد؟",["المراهقة","الطفولة المتوسطة","الطفولة المبكرة","الرشد"],"المراهق في طور بناء هويته وصورته أمام أقرانه، فالنقد العلني يجرحه ويولّد عناداً. أطفال الطفولة المتوسطة أقل تأثراً بصورة الأقران."],
["L07","h","تبدأ القدرة على استخدام التعميم والتجريد في التفكير بوضوح لدى طلاب المرحلة:",["المتوسطة","الابتدائية الدنيا","رياض الأطفال","الابتدائية العليا"],"التجريد والتعميم من سمات العمليات المجردة التي تبدأ مع المراهقة المبكرة (المتوسطة). الابتدائية بكل صفوفها في طور المحسوسات."],
["L07","h","وفقاً لنظرية بياجيه في النمو المعرفي، ينبغي أن يركز بناء مناهج المرحلة الابتدائية على:",["مفاهيم واقعية محسوسة قريبة من بيئة الطفل","قوانين مجردة تُستنتج منها الأمثلة","نصوص طويلة تُقسم إلى فقرات","حفظ المصطلحات العلمية بدقة"],"طفل الابتدائية في مرحلة العمليات المحسوسة، فيتعلم بالأمثلة والمواد الملموسة من بيئته. القوانين المجردة تناسب مرحلة العمليات المجردة."],
["L07","","دراسة نمو المفاهيم الأساسية عند الأطفال مثل مفهوم الزمن والمكان والعدد ارتبطت باسم:",["بياجيه","ثورندايك","باندورا","سكنر"],"بياجيه رائد نظرية النمو المعرفي ودرس كيف يبني الطفل مفاهيم العدد والزمن والمكان والسببية. الآخرون من رواد نظريات التعلم السلوكية والاجتماعية."],
["L07","h","يخطط المعلم درسه وفق الخصائص المعرفية لمرحلة طلابه، ويشجعهم على اكتشاف المعرفة بأنفسهم. هذا تطبيق لمبادئ نظرية:",["بياجيه","ثورندايك","كلارك هل","الجشطلت"],"ملاءمة التدريس للمرحلة المعرفية والاكتشاف النشط من تطبيقات بياجيه. ثورندايك وهل سلوكيان، والجشطلت تركز على الإدراك الكلي والاستبصار."],
["L07","m","أعطى معلم أطفال الروضة كرتين من الصلصال متساويتين ثم بسط إحداهما، فقال الأطفال إن المبسوطة «أكثر». يدل ذلك على أن الأطفال:",["لم يدركوا مفهوم الاحتفاظ بعد","يفتقرون إلى الانتباه","في مرحلة العمليات المحسوسة","يعانون صعوبة في الإدراك البصري"],"الحكم على الكمية بالشكل الظاهري يعني غياب الاحتفاظ، وهو سمة ما قبل العمليات. لو كانوا في المحسوسة لأدركوا أن الكمية ثابتة. ليست مشكلة انتباه أو إدراك بصري."],
["L07","m","لاحظ معلم أن طفلاً في الصف الأول يتحدث عن الشمس بأنها «تغضب وتختبئ خلف الغيوم». هذا مظهر لـ:",["الإحيائية في مرحلة ما قبل العمليات","اضطراب في التفكير يحتاج إحالة","خيال إبداعي مرتفع يستحق الإثراء","التفكير الافتراضي المبكر"],"إضفاء الحياة والمشاعر على الجمادات هو الإحيائية، وهي طبيعية في ما قبل العمليات. ليست اضطراباً ولا دليلاً على موهبة، والتفكير الافتراضي من المرحلة المجردة."],
["L07","","الطفل الذي يُخفي المعلم لعبته تحت قطعة قماش فيبحث عنها هناك قد أدرك مفهوم:",["دوام الشيء","الاحتفاظ","المعكوسية","التمركز حول الذات"],"البحث عن الشيء المخفي يعني إدراك أنه موجود رغم غيابه عن البصر؛ وهذا دوام الشيء، إنجاز نهاية الحس-حركية. الاحتفاظ والمعكوسية يأتيان في المحسوسة."],
["L07","","أثناء النقاش في الصف الثالث الابتدائي طلب المعلم من الطلاب تصور «ماذا لو كانت الجاذبية نصف قيمتها الحالية؟» فعجز معظمهم عن الإجابة. التفسير الأقرب:",["المهمة تتطلب تفكيراً افتراضياً لا يتوفر في مرحلة العمليات المحسوسة","الطلاب يفتقرون إلى الدافعية","المعلم لم يستخدم التعزيز الكافي","الطلاب لم يحفظوا قانون الجاذبية"],"التفكير في الافتراضات الخيالية (ماذا لو) من سمات العمليات المجردة، وطلاب الثالث الابتدائي في المحسوسة. ليست مشكلة دافعية أو حفظ أو تعزيز."],
["L07","m","طلبت معلمة الصف الأول من الطلاب إخبارها بما تراه زميلتهم الجالسة في الجهة المقابلة من المجسم، فوصفوا ما يرونه هم. هذا يعكس:",["التمركز حول الذات","ضعف الذاكرة قصيرة المدى","عدم فهم التعليمات","ضعف الإدراك البصري"],"العجز عن تبني منظور الآخر هو التمركز حول الذات (تجربة الجبال الثلاثة لبياجيه)، وهو سمة ما قبل العمليات لا عيب في الذاكرة أو الفهم."],
["L07","m","يفضّل معلم العلوم في الصف الخامس أن يبدأ كل مفهوم بتجربة يمسك فيها الطلاب الأدوات بأيديهم قبل أن يشرح القاعدة. هذا الإجراء يراعي:",["أن طلابه في مرحلة العمليات المحسوسة","أن طلابه في مرحلة العمليات المجردة","أزمة الهوية لدى طلابه","مرحلة الكمون عند فرويد"],"طالب الخامس الابتدائي (10–11 سنة) في مرحلة المحسوسات، فالتجربة الملموسة قبل القاعدة أنسب. الكمون تفسير فرويدي لا يتصل باختيار الطريقة."],
["L07","m","طالب في الصف الرابع يُحبط بسرعة ويقول «أنا لا أستطيع» كلما أخطأ. وفق إريكسون، الإجراء الأنسب للمعلم:",["تكليفه بمهام متدرجة يمكنه إنجازها والاعتراف بإنجازه","إعفاؤه من المهام الصعبة حتى يكبر","مقارنته بزميل متفوق ليتحفز","توجيهه إلى المرشد الطلابي فوراً"],"أزمة الابتدائية الاجتهاد مقابل الدونية، ويُحل القطب الإيجابي بخبرات إنجاز وتقدير. الإعفاء يرسخ الدونية، والمقارنة تزيدها، والإحالة سابقة لأوانها."],
["L07","","يرفض طالب في الصف الثاني المتوسط نصائح معلمه ويجادل في كل توجيه ويحرص على موافقة أقرانه. التفسير الأقرب لسلوكه:",["سلوك طبيعي لمرحلة البحث عن الهوية والاستقلال","اضطراب سلوكي يستدعي الإحالة","ضعف في الانتباه","نقص في مطالب نمو الطفولة المتوسطة"],"المجادلة والاستقلال والتأثر بالأقران من خصائص المراهقة المبكرة (أزمة الهوية). التعامل معه بالاحتواء والحوار لا الإحالة."],
["L07","m","أي الإجراءات أنسب لمعلم الصف الأول الابتدائي لمراعاة قصر مدة الانتباه لدى طلابه؟",["تقسيم الحصة إلى أنشطة قصيرة متنوعة تتخللها حركة","مطالبتهم بالجلوس الهادئ طوال الحصة لتعويدهم","إطالة الشرح مع رفع الصوت","تأجيل الأنشطة إلى نهاية الحصة"],"الطفل في الطفولة المتوسطة انتباهه قصير وحاجته للحركة كبيرة، فالتنويع والأنشطة القصيرة أنسب. الجلوس الطويل والشرح المطوّل يناقضان خصائص المرحلة."],
["L07","m","يحرص معلم الثانوية على ربط دروسه بالتخصصات الجامعية والمهن المستقبلية وإعطاء طلابه أدواراً قيادية. هذا الإجراء يراعي من خصائص طلابه:",["اهتمام المراهق بالمستقبل والهوية المهنية وحاجته إلى الاستقلال","حاجتهم إلى التعلم بالمحسوسات","سن الجماعة وروح العمل الجماعي","التمركز حول الذات"],"اختيار المهنة والاستعداد لها من مطالب نمو المراهقة (هافجهرست) وتكوين الهوية (إريكسون). المحسوسات للابتدائية، وسن الجماعة للطفولة المتأخرة."],
["L07","m","أراد معلم أن يفهم كيف يبرر طلابه أحكامهم على موقف صعب فعرض عليهم قصة فيها تعارض بين إنقاذ حياة وخرق قانون. هذا الأسلوب يرتبط بنظرية:",["كولبرج في النمو الأخلاقي","بياجيه في النمو المعرفي","إريكسون في النمو النفسي الاجتماعي","فرويد في النمو النفسي الجنسي"],"المعضلات الأخلاقية (قصة هاينز) هي أداة كولبرج لتحديد مرحلة التفكير الأخلاقي من خلال التبرير لا الاختيار. بياجيه يستخدم مهام الاحتفاظ، وإريكسون الأزمات."],
["L07","","يقول طالب: «أنا لا أغش في الاختبار لأن المعلم سيعاقبني إذا رآني». وفق كولبرج، هذا الطالب في مرحلة:",["الطاعة وتجنب العقاب (ما قبل التقليدي)","القانون والنظام (التقليدي)","العقد الاجتماعي (ما بعد التقليدي)","الولد الطيب (التقليدي)"],"ربط الصواب بتجنب العقاب هو المرحلة الأولى من المستوى ما قبل التقليدي. الالتزام بالقانون لذاته مرحلة 4، وإرضاء الآخرين مرحلة 3."],
["L07","m","يلتزم طالب بنظام المدرسة ويقول: «لو خالف الجميع الأنظمة لعمّت الفوضى». وفق كولبرج، تبريره من مرحلة:",["القانون والنظام","الطاعة وتجنب العقاب","المنفعة المتبادلة","المبادئ الأخلاقية العالمية"],"الحفاظ على النظام الاجتماعي والقانون لذاته هو المرحلة الرابعة (المستوى التقليدي). المبادئ العالمية تتجاوز القانون إلى العدل والكرامة."],
["L07","","يحكم الطالب في المرحلة الثالثة عند كولبرج على السلوك بأنه صحيح عندما:",["يرضي الآخرين ويحظى بموافقتهم","يجنّبه العقاب","يحقق له منفعة مقابل منفعة","يتفق مع مبادئ العدل العامة"],"المرحلة الثالثة «الولد الطيب»: الصواب ما يرضي المحيطين ويكسب موافقتهم. تجنب العقاب مرحلة 1، والمنفعة مرحلة 2، ومبادئ العدل مرحلة 6."],
["L07","","المرحلة التي يميل فيها الطفل، وفق فرويد، إلى الهدوء النسبي للدوافع والانشغال بالتعلم والأقران، وتوافق سن المدرسة الابتدائية، هي:",["الكمون","الفمية","القضيبية","التناسلية"],"مرحلة الكمون (6–12) فيها تهدأ الدوافع ويتجه الطفل إلى التحصيل والصداقات. الفمية للرضاعة، والقضيبية 3–6، والتناسلية للمراهقة."],
["L07","","المكوّن الذي يمثل الضمير والمثل العليا في بناء الشخصية عند فرويد هو:",["الأنا الأعلى","الهو","الأنا","الليبيدو"],"الأنا الأعلى يحمل القيم والضمير المكتسبة من الوالدين. الهو مبدأ اللذة، والأنا مبدأ الواقع يوازن بينهما."],
["L07","h","المفهوم الذي يشير إلى المهام التي ينبغي على الفرد إنجازها في مرحلة عمرية محددة، ويؤدي نجاحه فيها إلى السعادة والنجاح في المهام اللاحقة، ويرتبط باسم هافجهرست، هو:",["مطالب النمو","الأزمات النفسية الاجتماعية","المخططات العقلية","مراحل النمو الأخلاقي"],"مطالب النمو مصطلح هافجهرست. الأزمات لإريكسون، والمخططات لبياجيه، والنمو الأخلاقي لكولبرج."],
["L07","","من مطالب النمو في مرحلة الطفولة المتوسطة عند هافجهرست:",["تعلم القراءة والكتابة والحساب والمهارات الجسمية للألعاب","اختيار المهنة والاستعداد لها","الاستقلال الانفعالي عن الوالدين","تقبل التغيرات الجسمية للبلوغ"],"القراءة والكتابة والحساب ومهارات اللعب مطالب الطفولة المتوسطة. اختيار المهنة والاستقلال الانفعالي وتقبل الجسم من مطالب المراهقة."],
["L07","","النمو يسير من الرأس إلى القدمين، فيتحكم الطفل في رأسه ورقبته قبل ساقيه. يُسمى هذا الاتجاه:",["الرأسي–الذيلي","المركزي–الطرفي","من العام إلى الخاص","من الخاص إلى العام"],"الرأسي–الذيلي يصف تقدم النمو من الرأس إلى الأسفل. المركزي–الطرفي من الجذع إلى الأطراف، ومن العام إلى الخاص يصف الحركات الكلية قبل الدقيقة."],
["L07","m","يقبض الرضيع على اللعبة بكفه كاملة قبل أن يصبح قادراً على التقاطها بإصبعين. هذا مثال على مبدأ:",["النمو يسير من العام إلى الخاص","النمو يسير بمعدل ثابت","النمو مستقل عن النضج","الفروق الفردية في النمو"],"القبض الكلي ثم الدقيق يجسد مبدأ من العام (الحركات الكلية) إلى الخاص (الحركات الدقيقة). النمو لا يسير بمعدل ثابت ولا يستقل عن النضج."],
["L07","m","حاولت معلمة روضة تدريب أطفال في الثالثة على الكتابة بين السطور فلم تنجح رغم التكرار. السبب الأقرب:",["عدم اكتمال النضج العضلي الدقيق اللازم للمهارة","ضعف دافعية الأطفال","قلة التعزيز المقدم","صعوبات تعلم لدى الأطفال"],"المهارة تحتاج نضجاً في العضلات الدقيقة والتآزر لا يكتمل في هذا العمر؛ التدريب قبل النضج لا يفيد. ليست مشكلة دافعية أو تعزيز، ولا يُشخص الأطفال بصعوبات تعلم في هذه السن."],
["L07","","التغير الداخلي البيولوجي الذي يحدث تلقائياً دون تدريب ويحدد استعداد الطفل للتعلم يُسمى:",["النضج","التعلم","الانتقال","التكيف"],"النضج تغير داخلي لا يحتاج خبرة، بخلاف التعلم الناتج عن الخبرة والتدريب. التكيف مصطلح بياجيه للتمثل والمواءمة."],
["L07","","جميع ما يلي من مبادئ النمو ما عدا:",["يسير بمعدل واحد ثابت في جميع المراحل","يسير من العام إلى الخاص","يتأثر بتفاعل الوراثة والبيئة","مظاهره متكاملة يؤثر بعضها في بعض"],"النمو مستمر لكن بمعدلات متفاوتة: سريع في الطفولة المبكرة والمراهقة وبطيء في الطفولة المتوسطة. الباقي مبادئ صحيحة."],
["L07","","جميع ما يلي من خصائص مرحلة ما قبل العمليات عند بياجيه ما عدا:",["إدراك الاحتفاظ والمعكوسية","التمركز حول الذات","الإحيائية","ظهور اللغة واللعب الرمزي"],"الاحتفاظ والمعكوسية إنجازا مرحلة العمليات المحسوسة لا ما قبلها. التمركز والإحيائية والرمز من سمات ما قبل العمليات."],
["L07","","أي مما يلي ليس من أزمات النمو الثماني عند إريكسون؟",["الاحتفاظ مقابل التمركز","الثقة مقابل عدم الثقة","المبادرة مقابل الذنب","الإنتاجية مقابل الركود"],"الاحتفاظ والتمركز مفهومان عند بياجيه لا أزمتان عند إريكسون. الثلاثة الأخرى من أزماته الثماني."],
["L07","","أي مما يلي لا يُعد من خصائص المراهقة؟",["بطء النمو الجسمي واستقراره","التقلب الانفعالي","الاهتمام بالمظهر وصورة الذات","الميل إلى المثالية ونقد الكبار"],"المراهقة تتميز بطفرة نمو جسمي سريعة لا ببطئه. التقلب الانفعالي والاهتمام بالمظهر والمثالية من سماتها المعروفة."],
["L07","","يعتمد طالب في الصف الثاني الثانوي على وضع فروض واختبارها عقلياً قبل حل مسألة فيزياء. هذا السلوك يُصنّف ضمن:",["التفكير الافتراضي الاستنباطي في مرحلة العمليات المجردة","التفكير الحسي الحركي","التفكير ما قبل الإجرائي","التفكير المتمركز حول الذات"],"وضع الفروض واختبارها عقلياً جوهر العمليات المجردة. الحسي الحركي للرضيع، وما قبل الإجرائي للطفولة المبكرة."],
["L07","","قيام الطفل في السنة الأولى من عمره برمي الأشياء وتذوقها وضربها ببعضها يُصنّف على أنه:",["استكشاف للبيئة عبر الحواس والحركة في المرحلة الحس-حركية","سلوك عدواني يحتاج تعديلاً","تعلم بالملاحظة","مظهر لفرط الحركة"],"الرضيع يعرف العالم بالحواس والأفعال الحركية؛ الرمي والتذوق استكشاف طبيعي. ليس عدواناً ولا فرط حركة ولا تعلماً بالملاحظة."],
["L07","m","معلم في المرحلة المتوسطة لاحظ أن طلابه يميلون إلى مقارنة أنفسهم بأقرانهم والتأثر بأحكامهم. الإجراء الأنسب لتوظيف هذه الخاصية:",["استخدام التعلم التعاوني والأقران نماذج إيجابية","منع الحديث بين الطلاب داخل الصف","المقارنة العلنية بين درجات الطلاب لتحفيزهم","تجاهل تأثير الأقران لأنه مؤقت"],"تأثير الأقران في المراهقة قوي، فتوظيفه بالتعاون والنمذجة الإيجابية يخدم التعلم. المقارنة العلنية تجرح وتُحبط، والمنع غير واقعي."],
["L07","","الفروق بين الجنسين في موعد البلوغ تتمثل في أن:",["البنات يسبقن الأولاد بنحو سنة إلى سنتين","الأولاد يسبقون البنات بنحو سنتين","الجنسين يبلغان في السن نفسها","لا علاقة للجنس بموعد البلوغ"],"تبدأ طفرة البلوغ عند البنات أبكر من الأولاد بنحو سنة إلى سنتين، وهذا يفسر تفاوت الأحجام في الصفوف العليا من الابتدائية."],
["L07","m","يصنّف طفل كل الحيوانات ذات الأربع أرجل على أنها «قطط». عندما يفرّق لاحقاً بين القط والكلب ويكوّن مفهومين، يكون قد قام بعملية:",["المواءمة","التمثل","الاحتفاظ","التعميم"],"تعديل المخطط القائم وإنشاء مفهوم جديد هو المواءمة. تسمية الكلب قطاً كانت تمثلاً (إدخال الجديد في مخطط قائم). التعميم مصطلح سلوكي."],
["L07","m","يقول طالب في الصف السادس «أعمل الواجب لأن المعلم يثق بي ولا أريد أن أخيب ظنه». هذا التبرير يُصنّف وفق كولبرج ضمن المستوى:",["التقليدي","ما قبل التقليدي","ما بعد التقليدي","الأخلاق الذاتية"],"إرضاء الآخرين والحفاظ على صورة الولد الطيب هو المستوى التقليدي (المرحلة 3). ما قبل التقليدي يرتبط بالعقاب والمنفعة، وما بعده بالمبادئ."],
["L07","","المرحلة التي تُعد فيها اللغة والرموز واللعب الإيهامي من أهم إنجازاتها، ويغيب فيها إدراك الاحتفاظ، هي:",["ما قبل العمليات","الحس-حركية","العمليات المحسوسة","العمليات المجردة"],"ظهور الوظيفة الرمزية (اللغة واللعب الإيهامي) مع غياب الاحتفاظ سمة ما قبل العمليات (2–7)."],
["L07","","تريد معلمة أن تختار أسلوباً لتعليم مفهوم الكسور لطلاب الصف الثالث. الأنسب وفق خصائص مرحلتهم:",["تقسيم تفاحة أو قطع ورقية وتناولها بأيديهم","شرح تعريف الكسر لفظياً ثم حل تمارين مجردة","عرض قاعدة عامة واستنباط الأمثلة منها","طلب تخيّل الكسر ذهنياً دون أدوات"],"طالب الثالث في المحسوسات، فالتعامل اليدوي مع المواد (التمثيل العملي عند برونر) هو الأنسب. الشرح اللفظي المجرد والاستنباط من قاعدة يناسبان مراحل أعلى."],
["L07","","العوامل المؤثرة في النمو المعرفي عند بياجيه هي النضج والخبرة والتفاعل الاجتماعي و:",["الموازنة (التوازن العقلي)","التعزيز","النمذجة","الاستبصار"],"الموازنة هي العامل الرابع الذي ينظم التمثل والمواءمة عند بياجيه. التعزيز سلوكي، والنمذجة لباندورا، والاستبصار للجشطلت."],
["L07","m","لاحظ معلم أن طالباً في الصف الخامس يتفوق في كرة القدم ويقود فريقه، لكنه يخجل من القراءة أمام الزملاء. أفضل توظيف لخصائص مرحلته:",["إسناد أدوار قيادية في أنشطة جماعية ترتبط بالقراءة تدريجياً","منعه من الرياضة حتى يتحسن في القراءة","إجباره على القراءة أمام الصف ليتعود","تجاهل الخجل لأنه سيزول مع العمر"],"الطفولة المتأخرة سن الجماعة والقيادة، فتوظيف قوته الاجتماعية جسر لمهارة القراءة. المنع والإجبار يضران بأزمة الكفاءة، والتجاهل لا يعالج."]
]);
// ===== L08: الفروق الفردية وذوو الاحتياجات الخاصة والموهوبون =====
window.QB = (window.QB || []).concat([
["L08","hm","سبب تدني مستوى التحصيل لدى الطالب ذي صعوبات التعلم هو:",["اضطراب في العمليات الذهنية (النفسية الأساسية)","انخفاض معامل الذكاء","عدم وجود دافعية نحو التعلم","عدم القدرة على المشاركة في الأنشطة"],"صعوبات التعلم اضطراب في الانتباه أو الإدراك أو الذاكرة أو التفكير مع ذكاء عادي. انخفاض الذكاء يميز بطء التعلم، وضعف الدافعية يميز التأخر الدراسي."],
["L08","hm","راشد وفيصل في الصف الثالث الابتدائي؛ راشد لديه انخفاض في جميع المواد مع ذكاء حدّي، وفيصل لديه ضعف في الرياضيات واللغة العربية فقط مع ذكاء عادي. التصنيف الأقرب:",["راشد بطيء تعلم وفيصل لديه صعوبات تعلم","كلاهما بطيء تعلم","كلاهما لديه صعوبات تعلم","راشد لديه صعوبات تعلم وفيصل بطيء تعلم"],"الضعف العام مع ذكاء حدّي = بطء تعلم، والضعف في مادة أو مادتين مع ذكاء عادي = صعوبات تعلم (محك التباين)."],
["L08","h","طالبة ذكاؤها عادي، وتحصيلها منخفض في جميع المواد بسبب كثرة الغياب وإهمال الأسرة وضعف الدافعية. حالتها الأقرب:",["تأخر دراسي","صعوبات تعلم","بطء تعلم","إعاقة فكرية"],"التأخر الدراسي: ذكاء عادي وتدنٍ ناتج عن عوامل خارجية (إهمال، غياب، دافعية). صعوبات التعلم اضطراب داخلي في العمليات، وبطء التعلم ذكاء حدّي."],
["L08","h","أراد معلم ترتيب البيئة الصفية لأطفال التوحد. من أفضل الأساليب الرائدة عالمياً لتحقيق ذلك أسلوب التعلم:",["المنظم","الذاتي","التعاوني","بالاكتشاف"],"أطفال التوحد يحتاجون روتيناً ثابتاً وجداول بصرية وبيئة واضحة الحدود، وهذا جوهر التعلم المنظم (TEACCH). التعاوني والاكتشاف يزيدان الغموض الذي يربكهم."],
["L08","h","من صعوبات التعلم النمائية لدى الطالب صعوبات:",["الإدراك","القراءة","الحساب","الكتابة"],"النمائية تخص العمليات الأساسية: الانتباه والإدراك والذاكرة والتفكير واللغة. القراءة والكتابة والحساب صعوبات أكاديمية."],
["L08","h","المحك الذي يُستخدم للكشف عن صعوبة تعلم في مجال أكاديمي عبر الفجوة بين القدرة العقلية والتحصيل الفعلي هو محك:",["التباين","الاستبعاد","التربية الخاصة","النضج"],"محك التباين (التفاوت) يقارن القدرة المتوقعة بالتحصيل الفعلي. محك الاستبعاد يستبعد الإعاقات والعوامل البيئية، ومحك التربية الخاصة يعني عدم الاستفادة من التعليم العادي."],
["L08","h","تظهر الفروق الفردية بأكبر مدى لها في الصفات:",["الانفعالية والشخصية","الجسمية","الحسية","الحركية"],"المدى الأوسع للفروق في السمات الانفعالية والشخصية ثم العقلية، والأضيق في الجسمية."],
["L08","h","استجاب الطلاب على فقرة بمقياس (موافق بشدة – موافق – لا أدري – غير موافق – غير موافق بشدة). عمّ تعبّر الفروق الفردية الناتجة عن استجاباتهم؟",["الاتجاهات","القدرات","التحصيل","الاستعداد"],"مقياس ليكرت يقيس درجة القبول أو الرفض نحو موضوع، أي الاتجاهات. القدرات والتحصيل تُقاس باختبارات أداء."],
["L08","h","العوامل التي تمثل الفروق الفردية بين الطلاب والمرتبطة بسلوكيات الأسرة والمجتمع هي العوامل:",["المكتسبة","الطبيعية (الوراثية)","المشتركة","الفطرية"],"ما يأتي من الأسرة والمجتمع والتعليم عوامل مكتسبة (بيئية)، مقابل الطبيعية الوراثية."],
["L08","h","من أسباب الفروق الفردية ما يلي ما عدا:",["أنماط التعلم","الاستعداد الفطري","العوامل الوراثية","العوامل البيئية"],"أنماط التعلم مظهر من مظاهر الفروق لا سبباً لها. الوراثة والبيئة والاستعداد الفطري أسباب."],
["L08","hm","تميل الطالبة أمل إلى التأمل في قضايا الحياة وفهم ذاتها، بينما تميل زميلتها أسماء إلى حل الألغاز الرياضية. وفق جاردنر، نوع ذكاء الطالبتين:",["أمل ذاتي وأسماء منطقي رياضي","أمل اجتماعي وأسماء مكاني","أمل مكاني وأسماء اجتماعي","أمل منطقي وأسماء ذاتي"],"التأمل الذاتي من الذكاء الضمن شخصي (الذاتي)، والألغاز والأرقام من المنطقي الرياضي. الاجتماعي يتعلق بفهم الآخرين، والمكاني بالصور والأبعاد."],
["L08","h","قسّم معلم طلابه إلى (سمعي، بصري، حسي حركي). اعتمد المعلم في تقسيمه على:",["أنماط التعلم","الذكاءات المتعددة","نظريات التعلم","أنماط الشخصية"],"سمعي/بصري/حسي هو تصنيف أنماط التعلم (VARK). الذكاءات المتعددة تصنيف جاردنر (لغوي، منطقي…)."],
["L08","h","المتعلم الذي يفضّل تلقي المعلومات عن طريق القراءة والرسوم التوضيحية والخرائط نمطه:",["بصري","سمعي","حسي حركي","اجتماعي"],"الصور والرسوم والخرائط والقراءة مدخل النمط البصري. السمعي يفضل الشرح والمناقشة، والحسي التجربة والحركة."],
["L08","h","من الخصائص الشخصية والانفعالية التي تصف الأطفال الموهوبين:",["الحساسية المفرطة","نوبات الغضب المؤقتة","البحث عن اهتمام الآخرين","ضعف الثقة بالنفس"],"الموهوبون يتسمون بحساسية مفرطة وكمالية ونضج أخلاقي مبكر وحس دعابة وقيادية. نوبات الغضب والبحث عن الاهتمام ليست سمات مميزة لهم."],
["L08","h","وُضعت فصول خاصة لذوي الإعاقة داخل مبنى المدرسة العادية يتشاركون فيه المرافق دون أن يدرسوا مع أقرانهم العاديين. هذا النوع من الدمج يُسمى الدمج:",["المكاني","الاجتماعي","الأكاديمي الكلي","الشامل"],"الدمج المكاني أدنى صور الدمج: مشاركة المبنى والمرافق فقط. الاجتماعي يضيف مشاركة الأنشطة والفسحة، والأكاديمي الكلي يعني الدراسة في الفصل العادي مع خدمات مساندة، والشامل دمج كل الفئات في كل جوانب الحياة المدرسية."],
["L08","h","يمكن التنبؤ بأن درجة طالب حصل على 110 في اختبار ذكاء، عند إعادة قياسه بعد سنوات، ستكون غالباً:",["قريبة من 110 لأن نسبة الذكاء ثابتة نسبياً","أعلى بكثير لأنها ترتفع بالعمر","أقل بكثير لأنها تنخفض بالعمر","لا يمكن التنبؤ بها إطلاقاً"],"نسبة الذكاء محسوبة بالنسبة لأقران العمر فتبقى ثابتة نسبياً عبر الزمن، مع تغيرات طفيفة."],
["L08","h","إذا أخطأ أحد الطلاب من ذوي الاحتياجات الخاصة أمام زملائه، فالإجراء الأنسب للمعلم:",["تصحيح الخطأ بهدوء مع الاعتراف بمحاولته وتشجيعه","تجاهل الخطأ وعدم التصحيح مراعاة لحالته","إعفاؤه من المشاركة مستقبلاً","تكليف زميل بالإجابة عنه دائماً"],"يُعامل كبقية الطلاب في التصحيح الهادئ مع التشجيع. التجاهل يحرمه التعلم، والإعفاء والتفويض الدائم يرسخان الدونية."],
["L08","hm","لكي يحقق المعلم التنوع في استراتيجيات التدريس داخل الصف، فإن الغاية التي يراد تحقيقها من هذا التنوع:",["استخدام التعليم المتمايز الذي يراعي الفروق الفردية","اكتشاف الطلاب الموهوبين فقط","تجريب الأنشطة المختلفة لاستغلال وقت الحصة","إظهار تمكن المعلم من الطرق"],"التنوع يخدم الفروق الفردية فيجد كل طالب مدخله؛ وهذا جوهر التمايز. اكتشاف الموهوبين نتيجة جانبية، واستغلال الوقت والاستعراض ليسا غاية."],
["L08","","تريد معلمة الصف الخامس تحقيق هدف واحد (فهم دورة الماء) لطلاب متفاوتين، فقدمت المحتوى بنص وفيديو ومجسم، وسمحت للطلاب باختيار منتج (ملصق، عرض، تجربة). هذا تطبيق لـ:",["التعليم المتمايز","التعلم للإتقان","التعليم المبرمج","التعلم التعاوني"],"هدف واحد مع تنويع المحتوى والعملية والمنتج وفق الاستعداد والاهتمام هو التمايز (توملينسون). الإتقان يركز على الزمن حتى الإتقان، والمبرمج خطوات صغيرة."],
["L08","m","الأبعاد التي يمكن للمعلم أن يمايز فيها وفق توملينسون هي المحتوى والعملية والمنتج و:",["بيئة التعلم","الأهداف العامة للمقرر","درجات الاختبار النهائي","المنهج الرسمي"],"أبعاد التمايز الأربعة: المحتوى، العملية، المنتج، بيئة التعلم. الأهداف والمنهج الرسمي لا تتغير بين الطلاب."],
["L08","m","أي الممارسات تتعارض مع فلسفة التعليم المتمايز؟",["تقسيم الطلاب دائماً إلى مجموعات ثابتة حسب ذكائهم","تنويع طرق عرض المحتوى","السماح بمنتجات مختلفة لإثبات التعلم","تكوين مجموعات مرنة تتغير بحسب المهمة"],"التمايز يقوم على مجموعات مرنة لا تصنيف دائم يوصم الطالب. الباقي من ممارساته."],
["L08","","يرغب معلم في أن يبقى طلابه الموهوبون في صفهم مع تعميق خبراتهم بمشاريع بحثية وتوسيع موضوعات المنهج. الأسلوب الذي يستخدمه:",["الإثراء","التعجيل","التجميع","الدمج الجزئي"],"الإثراء يعمّق (رأسي) أو يوسّع (أفقي) الخبرة داخل الصف نفسه. التعجيل يغيّر الزمن أو الصف (قبول مبكر، تخطي صفوف، ضغط المنهج)، والتجميع يعزلهم في مجموعات خاصة، والدمج الجزئي مصطلح يخص ذوي الإعاقة."],
["L08","m","نقلت مدرسة طالباً موهوباً من الصف الرابع إلى السادس مباشرة بعد تقييم شامل. يُصنّف هذا الإجراء ضمن:",["التعجيل (تخطي الصفوف)","الإثراء الرأسي","التجميع","الدمج الجزئي"],"تخطي الصفوف أحد صور التعجيل مع القبول المبكر وضغط المنهج. الإثراء يبقي الطالب في صفه."],
["L08","","أي الآتي يُعد من صور التعجيل الدراسي للموهوبين؟",["ضغط المنهج ودراسته في زمن أقل","تكليف الطالب بتمارين إضافية من النوع نفسه","جعل الطالب مساعداً للمعلم","إعفاؤه من الواجبات"],"ضغط المنهج صورة من التعجيل. التمارين المكررة والمساعدة والإعفاء ممارسات خاطئة مع الموهوب."],
["L08","","وفق نموذج رنزولي للحلقات الثلاث، تتكوّن الموهبة من تفاعل:",["قدرة فوق المتوسط والإبداع والالتزام بالمهمة","الذكاء والتحصيل والوراثة","الطلاقة والمرونة والأصالة","الذاكرة والانتباه والإدراك"],"حلقات رنزولي: قدرة فوق المتوسط، إبداع، التزام بالمهمة (الدافعية). الطلاقة والمرونة مكونات الإبداع وحده."],
["L08","m","يريد معلم ترشيح طلاب لبرنامج الموهوبين. الإجراء الأدق:",["الاعتماد على محكات متعددة: قدرات وتحصيل وإبداع وملاحظة الأداء","اختيار أعلى الطلاب في درجات الاختبار النهائي فقط","اختيار الأكثر هدوءاً والتزاماً","اختيار من يطلب أولياء أمورهم ذلك"],"الكشف عن الموهبة يتطلب محكات متعددة لأن التحصيل وحده قد يخفي موهوباً ذا صعوبات أو ملل. الهدوء وطلب الأهل ليسا محكين."],
["L08","","موهوب في الصف الثاني المتوسط يشعر بالملل ويسبب إزعاجاً لأنه ينهي المهام قبل زملائه. الإجراء الأنسب:",["تقديم مهام أعمق وأكثر تحدياً ترتبط بالدرس","تكليفه بحل المزيد من التمارين نفسها","معاقبته على الإزعاج","نقله إلى آخر الصف ليشغل نفسه"],"الملل سببه عدم التحدي، فالحل إثراء رأسي بمهام أعمق. التمارين المكررة تزيد الملل، والعقاب يعالج العرض لا السبب."],
["L08","","من الخصائص العقلية للطالب الموهوب:",["نمو لغوي مبكر وذاكرة قوية وفضول غير عادي","بطء في اكتساب المفردات","الحاجة إلى تكرار كثير لفهم المفاهيم","تجنب الأسئلة والمشكلات المعقدة"],"الموهوب يتميز بالنمو اللغوي المبكر والذاكرة والفضول وحب التحدي. الباقي عكس خصائصه."],
["L08","m","لاحظ معلم أن طالباً في الصف الثاني الابتدائي يقلب الحروف عند القراءة (ب/ت، د/ذ) ويقرأ ببطء شديد رغم ذكائه الواضح وفهمه عند الاستماع. الحالة الأقرب:",["عسر القراءة (ديسلكسيا)","بطء تعلم","إعاقة بصرية","تأخر دراسي"],"قلب الحروف وبطء القراءة مع ذكاء عادي وفهم سمعي جيد علامات الديسلكسيا (صعوبة أكاديمية). بطء التعلم ضعف عام، والإعاقة البصرية تظهر في كل مهام الرؤية."],
["L08","","صعوبة الكتابة ورداءة الخط وتنظيم الحروف مع سلامة الذكاء تُسمى:",["ديسغرافيا","ديسلكسيا","ديسكالكوليا","ديسفازيا"],"الديسغرافيا عسر الكتابة. الديسلكسيا قراءة، والديسكالكوليا حساب، والديسفازيا اضطراب لغوي."],
["L08","m","أي الإجراءات أنسب لمعلم لديه طالب مشخص بصعوبات تعلم في القراءة داخل الصف العادي؟",["تكييف المهام (نصوص أقصر، وقت أطول، قراءة التعليمات له) والتنسيق مع معلم غرفة المصادر","إعفاؤه من كل مهام القراءة","نقله إلى معهد للتربية الفكرية","تكليفه بالقراءة أمام الصف ليتدرب"],"ذو الصعوبات يبقى في صفه مع تكييفات وخدمة غرفة المصادر. الإعفاء يحرمه، والتربية الفكرية للإعاقة العقلية، والقراءة العلنية تحرجه."],
["L08","","طالب لا يستطيع الجلوس في مكانه، يقاطع كثيراً، ويجيب قبل اكتمال السؤال، وينسى أدواته باستمرار. السمات تشير إلى:",["فرط الحركة وتشتت الانتباه","التوحد","بطء التعلم","الإعاقة الفكرية"],"النشاط الزائد والاندفاعية وضعف الانتباه هي الثلاثية المميزة لاضطراب فرط الحركة وتشتت الانتباه. التوحد يتميز بقصور التواصل والسلوك النمطي."],
["L08","hm","أي الإجراءات أنسب للتقليل من النشاط الحركي الزائد لدى طالب في الصفوف الدنيا؟",["إجلاسه قرب المعلم وتكليفه بمهام قصيرة متنوعة تتخللها حركة هادفة","عزله في آخر الصف بعيداً عن الزملاء","معاقبته كلما تحرك","منعه من الفسحة حتى يهدأ"],"القرب من المعلم يقلل المشتتات، والمهام القصيرة والحركة الهادفة تصرّف طاقته. العزل والعقاب والحرمان من الفسحة تزيد المشكلة."],
["L08","m","طفل في الروضة لا يستجيب لاسمه، ويتجنب التواصل البصري، ويكرر رصف المكعبات بالطريقة نفسها ويضطرب عند تغيير الروتين. المعلمة تشتبه في:",["اضطراب طيف التوحد","فرط الحركة","الإعاقة السمعية فقط","صعوبات التعلم"],"قصور التواصل الاجتماعي والسلوك النمطي ومقاومة التغيير هي السمات المميزة للتوحد. الإعاقة السمعية لا تفسر السلوك النمطي، وصعوبات التعلم لا تُشخص في الروضة بهذه الصورة."],
["L08","","لاحظ معلم الصف الأول علامات تشير إلى إعاقة محتملة لدى طالب. الخطوة الأولى الصحيحة:",["تسجيل ملاحظاته وإحالة الطالب إلى المختص في المدرسة","إبلاغ ولي الأمر بأن ابنه معاق","تشخيص الحالة بنفسه وتعديل المنهج","تجاهل الأمر لأن الطفل ما زال صغيراً"],"دور معلم الصف العادي الملاحظة والإحالة؛ التشخيص للمختص. إخبار الأهل بحكم غير مؤكد ضار، والتجاهل يضيّع التدخل المبكر."],
["L08","m","لديك طالب ضعيف السمع في صفك. الإجراء الأنسب:",["إجلاسه في المقدمة ومواجهته عند الكلام واستخدام الوسائل البصرية","إجلاسه في الخلف لتقليل الإحراج","رفع الصوت طوال الحصة فقط","إعفاؤه من الأنشطة الشفهية"],"المقدمة ومواجهة الوجه (لقراءة الشفاه) والوسائل البصرية تعوض القصور السمعي. رفع الصوت وحده غير كافٍ، والإعفاء يحرمه."],
["L08","","الطريقة التي يعتمد عليها المكفوفون في القراءة والكتابة هي:",["برايل","لغة الإشارة","قراءة الشفاه","الكتابة الصوتية"],"برايل نظام نقاط بارزة للمكفوفين. لغة الإشارة وقراءة الشفاه للصم وضعاف السمع."],
["L08","","تُعرَّف الإعاقة الفكرية (العقلية) بانخفاض الذكاء عن 70 تقريباً مع قصور في:",["السلوك التكيفي قبل سن الثامنة عشرة","القدرات الحركية فقط","الحواس البصرية والسمعية","التحصيل في مادة واحدة"],"التعريف يشترط انخفاض الذكاء وقصور السلوك التكيفي خلال فترة النمو. القصور في مادة واحدة يشير إلى صعوبات التعلم."],
["L08","","متلازمة داون سببها:",["خلل كروموسومي (نسخة زائدة من الكروموسوم 21)","حرمان بيئي في الطفولة","إصابة في الرأس بعد الولادة","سوء تغذية الأم فقط"],"متلازمة داون اضطراب وراثي كروموسومي يسبب إعاقة فكرية بدرجات متفاوتة."],
["L08","m","أي الفئات التالية تُعد من ذوي الاحتياجات الخاصة؟",["الموهوبون","الطلاب المتوسطون في التحصيل","الطلاب كثيرو الغياب","الطلاب الجدد في المدرسة"],"ذوو الاحتياجات الخاصة كل من ينحرف عن المتوسط ويحتاج خدمات خاصة، وتشمل الموهوبين لا ذوي الإعاقة فقط."],
["L08","","الطالب الذي تتراوح نسبة ذكائه بين 70 و85 تقريباً ويتدنى تحصيله في جميع المواد يُصنّف:",["بطيء التعلم","ذا صعوبات تعلم","متأخراً دراسياً","معاقاً فكرياً"],"الفئة الحدية 70–85 مع تدنٍ عام هي بطء التعلم. الإعاقة الفكرية دون 70، وصعوبات التعلم والتأخر الدراسي بذكاء عادي."],
["L08","","معلمة لديها طالبة بطيئة التعلم. أي الإجراءات أنسب؟",["تبسيط المادة وتجزئتها وإعطاؤها وقتاً أطول مع تكرار وتعزيز","تكليفها بالمهام نفسها بالسرعة نفسها احتراماً للمساواة","تحويلها إلى معهد التربية الفكرية","إعفاؤها من الاختبارات"],"بطيء التعلم يحتاج تبسيطاً وتجزئة ووقتاً وتكراراً داخل الصف العادي. المعاهد للإعاقة الفكرية، والإعفاء لا يعلّم."],
["L08","","أي العبارات تصف الفروق الفردية وصفاً صحيحاً؟",["فروق كمية في الدرجة تتوزع توزيعاً اعتدالياً","فروق نوعية تجعل كل فرد فئة مستقلة","تقتصر على القدرات العقلية","تنتج عن الوراثة وحدها"],"الفروق كمية (درجة لا نوع) وتوزيعها اعتدالي، وتشمل كل السمات، وتنتج عن تفاعل الوراثة والبيئة."],
["L08","m","طالب متفوق في اللغة العربية وضعيف جداً في الرياضيات. هذا مثال على:",["الفروق داخل الفرد","الفروق بين الأفراد","صعوبات التعلم بالضرورة","بطء التعلم"],"تفاوت قدرات الطالب نفسه بين مجال وآخر هو الفروق داخل الفرد. لا يُحكم بصعوبات تعلم إلا بتشخيص."],
["L08","","أي طرق التدريس التالية أقل مراعاة للفروق الفردية؟",["المحاضرة والإلقاء","التعليم المبرمج","الموديولات التعليمية","الصف المقلوب"],"المحاضرة تقدم المحتوى نفسه بالسرعة نفسها للجميع. المبرمج والموديولات والصف المقلوب تتيح السير بالسرعة الذاتية."],
["L08","m","عرض معلم الدرس شرحاً شفهياً ثم خريطة مفاهيم ثم نشاطاً يدوياً. ما الأساس التربوي لهذا التنويع؟",["مراعاة أنماط التعلم المختلفة (سمعي، بصري، حسي)","تطبيق جداول التعزيز المتغيرة","إشباع الحاجات الفسيولوجية","تحقيق الانطفاء التدريجي"],"تنويع قنوات العرض يخاطب الأنماط السمعية والبصرية والحسية. التعزيز والانطفاء مفاهيم سلوكية لا تتصل بالعرض."],
["L08","","يحب طالب تصنيف النباتات والحشرات ويقضي وقته في ملاحظة الطيور. وفق جاردنر، يبرز لديه الذكاء:",["الطبيعي","المكاني","الجسمي الحركي","الذاتي"],"الاهتمام بالكائنات الحية وتصنيفها من الذكاء الطبيعي. المكاني للأشكال والأبعاد، والجسمي للحركة."],
["L08","m","طالبة تفهم مشاعر زميلاتها وتحل خلافاتهن وتقود مجموعتها بسهولة. يبرز لديها الذكاء:",["الاجتماعي (بين الأشخاص)","الذاتي (ضمن الشخص)","اللغوي","المنطقي الرياضي"],"فهم الآخرين والتأثير فيهم هو الذكاء الاجتماعي. الذاتي يخص فهم النفس."],
["L08","","المدى الذي يُعرَّف بأنه الفرق بين أقل درجة وأعلى درجة في توزيع صفة ما يصف:",["اتساع الفروق الفردية في تلك الصفة","متوسط الفروق الفردية","ثبات الصفة عبر الزمن","صدق قياس الصفة"],"المدى مقياس تشتت يبين اتساع الفروق بين الأفراد في الصفة."],
["L08","m","أي المواقف يدل على أن المعلم يطبق الدمج الأكاديمي الكلي؟",["طالب من ذوي الإعاقة يدرس كل المواد في الفصل العادي مع خدمات مساندة","طالب يدرس في فصل خاص داخل المدرسة ويشارك الزملاء في الفسحة فقط","طالب يدرس في معهد مستقل","طالب يخرج إلى غرفة المصادر معظم اليوم"],"الدمج الكلي يعني تلقي كل التعليم في الفصل العادي مع دعم. المشاركة في الفسحة فقط دمج اجتماعي، والمعهد عزل، وغرفة المصادر معظم اليوم دمج جزئي."],
["L08","","أفضل أداة للاستدلال على وجود صعوبات تعلم معرفية لدى المتعلم مقارنةً بقدرته:",["الاختبارات التحصيلية والتشخيصية","مقياس الاتجاه","استبانة الميول","مقياس تقدير الذات"],"الفجوة بين القدرة والتحصيل تُكشف بالاختبارات التحصيلية والتشخيصية. مقاييس الاتجاه والميول والذات لا تقيس التحصيل."],
["L08","","الوثيقة المكتوبة التي تحدد الأهداف والخدمات والتعديلات لطالب من ذوي الاحتياجات الخاصة تُسمى:",["الخطة التربوية الفردية","جدول المواصفات","الخطة الفصلية","السجل القصصي"],"الخطة التربوية الفردية تُعدّ لكل طالب من ذوي الاحتياجات الخاصة. جدول المواصفات لبناء الاختبار، والخطة الفصلية لعموم الصف."],
["L08","","طالب يرفض كل تغيير في ترتيب مقاعد الصف ويصاب بنوبة انزعاج عند تغيير الجدول. أنسب إجراء للمعلم:",["تثبيت الروتين وإعلام الطالب مسبقاً بأي تغيير بجدول بصري","تغيير الترتيب باستمرار ليعتاد","تجاهل انزعاجه حتى يتوقف","معاقبته على النوبات"],"مقاومة التغيير سمة التوحد، والتعامل معها بالروتين والتهيئة المسبقة بالجداول البصرية (التعلم المنظم). التغيير المستمر والعقاب يزيدان الاضطراب."],
["L08","","أي العبارات صحيحة عن الموهوبين داخل الفصول العادية؟",["قد يعانون الملل وضعف التحدي ما لم تُقدم لهم أنشطة إثرائية","لا يحتاجون أي خدمات خاصة لأنهم متفوقون","يُكتشفون دائماً بدرجات الاختبار","ينبغي عزلهم دائماً في فصول خاصة"],"الموهوب يحتاج إثراءً وإلا ملّ وربما انخفض تحصيله. التحصيل وحده لا يكشف كل الموهوبين، والعزل الدائم ليس الخيار الأفضل."],
["L08","m","تلاحظ معلمة أن طالبة موهوبة تنتقد عملها بقسوة وتتوتر من أي خطأ صغير ولا تسلّم المهمة إلا «مثالية». هذا يعكس من خصائص الموهوبين:",["الكمالية والحساسية المفرطة","بطء التعلم","ضعف الدافعية","العجز المتعلم"],"الكمالية والحساسية المفرطة من الخصائص الانفعالية للموهوبين وقد تسبب القلق. العجز المتعلم توقف عن المحاولة، وهي عكس ذلك."]
]);
// ===== L09: نظريات التعلم =====
window.QB = (window.QB || []).concat([
["L09","hm","كان الطلاب يجيبون إجابات صحيحة دون أن يعزز المعلم إجاباتهم، فأدى ذلك إلى تراخيهم عن المشاركة لاحقاً. المبدأ الذي يفسر تناقص المشاركة هو:",["الانطفاء","الكف","العقاب السالب","التمييز"],"وقف التعزيز عن استجابة كانت تُعزز فتتلاشى تدريجياً هو الانطفاء (في الإشراط الإجرائي). الكف منع مؤقت للسلوك بمثير أقوى أو ضبط ذاتي، والعقاب السالب سحب معزز قائم بعد السلوك بقصد إضعافه، أما هنا فلم يُسحب شيء بل امتنع التعزيز. الموقف إجرائي لا كلاسيكي لأن التعزيز يلي استجابة إرادية."],
["L09","h","عرض المعلم فيلماً يبين تجاذب وتنافر بعض الأجسام تمهيداً لدراسة الشحنات الكهربائية. ما قام به المعلم حسب نظرية التعلم ذي المعنى يُسمى:",["منظماً متقدماً","تثبيتاً","تعزيزاً","كفاية ذاتية"],"المادة التمهيدية العامة التي تُعرض قبل الدرس لربطه بالبنية المعرفية هي المنظم المتقدم عند أوزوبل. التعزيز سلوكي والكفاية الذاتية لباندورا."],
["L09","h","يرى أن للمتعلم أسلوباً خاصاً في استقبال المعلومات ومعالجتها على طريقة بنيته المعرفية، وأن التعلم ذو المعنى يحدث بربط الجديد بالقديم:",["أوزوبل","سكنر","برونر","فيجوتسكي"],"أوزوبل صاحب التعلم ذي المعنى بالاستقبال والبنية المعرفية. برونر اكتشاف، وفيجوتسكي اجتماعي، وسكنر سلوكي."],
["L09","hm","يستخدم معلم التاريخ خريطة المملكة لتوضيح طرق التجارة القديمة. وفق أنماط التمثيل عند برونر، يستخدم المعلم النمط:",["الأيقوني (التصويري)","العملي (الحركي)","الرمزي","اللفظي المجرد"],"الخرائط والصور تمثيل أيقوني. العملي يكون بالتعامل اليدوي، والرمزي باللغة والرموز."],
["L09","h","شاهد الطلاب فيديو يوضح طريقة التطريز ثم طبقوها، أو أدى المعلم الوضوء أمام طلابه ليقلدوه. هذا تطبيق لنظرية:",["التعلم الاجتماعي (باندورا)","الإشراط الإجرائي","الجشطلت","التعلم ذي المعنى"],"التعلم بملاحظة نموذج (حي أو رمزي) وتقليده هو النمذجة عند باندورا."],
["L09","h","أدرك الطالب الشكل الدائري ككل رغم وجود فجوة صغيرة فيه. هذا يتفق مع نظرية:",["الجشطلت","السلوكية","البنائية الاجتماعية","معالجة المعلومات"],"إدراك الكل وإكمال الناقص (قانون الإغلاق) من قوانين الإدراك عند الجشطلت: الكل أكبر من مجموع أجزائه."],
["L09","h","النظرية التي ترى أن الطالب متلقٍ سلبي والمعلم ملقّن يتحكم في المثيرات والتعزيز هي:",["السلوكية","البنائية","المعرفية","الإنسانية"],"السلوكية تفسر التعلم بالمثير والاستجابة والتعزيز، والمتعلم فيها سلبي. البنائية والمعرفية تجعلانه نشطاً."],
["L09","h","كتاب إلكتروني يقدم المعلومة بالنص والصورة معاً ليُخزنها الطالب لفظياً وبصرياً. هذا يستند إلى:",["نظرية الترميز المزدوج (المنحى المعرفي)","الإشراط الكلاسيكي","قانون الأثر","التعزيز البديل"],"تخزين المعلومة في نظامين لفظي وبصري هو الترميز المزدوج (بايفيو) من نظريات معالجة المعلومات."],
["L09","h","ترى نظرية التعلم أن التعلم يحدث من خلال التفاعل الاجتماعي والتعاون والحوار مع الأكثر خبرة. هذه هي:",["البنائية الاجتماعية (فيجوتسكي)","البنائية المعرفية (بياجيه)","السلوكية (سكنر)","الجشطلت"],"فيجوتسكي يرى التعلم اجتماعياً أولاً عبر الحوار والمساعدة في منطقة النمو القريب. بياجيه يركز على البناء الفردي."],
["L09","h","تُستخدم النمذجة (باندورا) بصورة خاصة في:",["تكوين الاتجاهات والقيم والمهارات الاجتماعية","حفظ جداول الضرب","تعليم المفاهيم المجردة بالاستقبال","قياس الذكاء"],"الاتجاهات والقيم تُكتسب بملاحظة القدوة أكثر من التلقين. الحفظ يناسب التسميع، والمفاهيم المجردة أوزوبل."],
["L09","hm","من أنواع التعلم عند أوزوبل جميع ما يلي ما عدا:",["التعلم بالتلقي القائم على الاكتشاف","التعلم بالتلقي القائم على المعنى","التعلم بالتلقي القائم على الاستظهار","التعلم بالاكتشاف القائم على المعنى"],"أوزوبل يصنف التعلم على بعدين: تلقي/اكتشاف، وذو معنى/استظهار. «تلقي قائم على اكتشاف» جمع بين ضدين من البعد نفسه."],
["L09","h","واحدة مما يلي من مراحل النمو المعرفي (التمثيل) عند برونر:",["المرحلة الأيقونية","مرحلة العمليات المادية","مرحلة الاستراتيجيات","مرحلة الكمون"],"مراحل برونر: العملية، الأيقونية، الرمزية. العمليات المادية لبياجيه، والكمون لفرويد."],
["L09","h","يعتقد طالب الثالث الثانوي أن القلق من اختبار قياس أمر لا مفر منه بعد تجارب سابقة. من منظور السلوكية، يمثل هذا الشعور استجابة:",["مكتسبة (مشروطة)","فطرية","طبيعية غير مشروطة","استبصارية"],"القلق ارتبط بمثير (قاعة الاختبار) بالخبرة فصار استجابة شرطية متعلمة. الفطرية وغير المشروطة لا تحتاج خبرة، والاستبصار من الجشطلت."],
["L09","h","وفق بياجيه، عملية تغيير الخبرات الخارجية بالاعتماد على البنى المعرفية الموجودة لدى الفرد لتنسجم مع بنائه الداخلي تُسمى:",["التمثل","المواءمة","الموازنة","التكيف"],"التمثل إدخال الجديد في المخطط القائم (تغيير الخبرة لتناسب البنية). المواءمة تغيير البنية لتناسب الخبرة، والتكيف يجمعهما."],
["L09","h","مسح رأس الطالب والابتسام له بعد سلوكه الحسن يُعد من المعززات:",["الاجتماعية","المادية","الرمزية","النشاطية"],"اللمسة والابتسامة والمدح معززات اجتماعية. المادية هدايا، والرمزية نجوم تُستبدل، والنشاطية وقت لعب."],
["L09","h","قالت معلمة لطلابها: «من ينهي الواجب يحصل على وقت للعب في المعمل». هذا تطبيق لـ:",["مبدأ بريماك","التعزيز السالب","الإقصاء","الاستبصار"],"استخدام نشاط محبب لتعزيز نشاط أقل تفضيلاً هو مبدأ بريماك (معزز نشاطي). التعزيز السالب إزالة منفر."],
["L09","h","الاستراتيجية التي يعزز فيها المعلم الخطوات التقريبية المتتابعة نحو السلوك النهائي تُسمى:",["التشكيل","النمذجة","التلقين","الإطفاء"],"التشكيل = تعزيز التقريبات المتتابعة (سكنر). النمذجة تعلم بالملاحظة، والتلقين إعطاء الاستجابة جاهزة."],
["L09","hm","يبرر الطالب صالح اعتداءه المتكرر على زملائه بأنه «نوع من المزاح المقبول». وفق نظرية باندورا في الانفصال الأخلاقي، يستخدم الطالب آلية:",["التهذيب اللفظي (التسمية الملطفة)","تقليل العواقب","تعميم المسؤولية","إلقاء اللوم على المعلم"],"تسمية السلوك المؤذي باسم لطيف (مزاح) هي آلية التهذيب اللفظي. تقليل العواقب إنكار الضرر، وتعميم المسؤولية توزيعها على الجماعة."],
["L09","h","التعليم المبرمج الذي يجزئ المادة إلى خطوات صغيرة مع تغذية راجعة فورية من تطبيقات:",["سكنر (الإشراط الإجرائي)","أوزوبل","الجشطلت","فيجوتسكي"],"التعليم المبرمج الخطي لسكنر (والمتشعب لكراودر) يقوم على الاستجابة النشطة والتعزيز الفوري."],
["L09","h","النظرية التي عدّت الإدراك أساس التعلم، وأن الحل يأتي فجأة بإعادة تنظيم عناصر الموقف (الاستبصار)، وصاحب تجربتها كوهلر:",["الجشطلت","المحاولة والخطأ","الإشراط الإجرائي","التعلم الاجتماعي"],"الاستبصار (قرد كوهلر والعصا والموز) جوهر الجشطلت. المحاولة والخطأ لثورندايك تدريجية لا مفاجئة."],
["L09","h","وضع عالم كل من قانون الأثر وقانون التدريب وقانون الاستعداد، وفسر التعلم بالمحاولة والخطأ:",["ثورندايك","بافلوف","سكنر","واطسون"],"قوانين الأثر والتكرار والاستعداد لثورندايك (تجربة القط). بافلوف كلاسيكي، سكنر إجرائي، واطسون مؤسس السلوكية."],
["L09","h","منطقة النمو القريب (المجاور) عند فيجوتسكي تعني:",["الفرق بين ما ينجزه الطالب وحده وما ينجزه بمساعدة الأكثر خبرة","المرحلة العمرية التالية للطالب","ما يستطيع الطالب إنجازه وحده فقط","المسافة بين الصف والمنزل"],"المنطقة هي المدى بين الأداء المستقل والأداء بالمساعدة، وهي الهدف الأمثل للتدريس والسقالات."],
["L09","h","من أدوار المعلم وفق النظرية البنائية:",["ميسّر ينظم بيئة تعلم يبني فيها الطالب معرفته","ملقّن ينقل المعرفة ويتحكم في التعزيز","مصدر وحيد للمعلومات","مراقب للاستجابات الظاهرة فقط"],"البنائية تجعل المعلم ميسراً والطالب بانياً نشطاً. الأدوار الأخرى سلوكية."],
["L09","","لاحظ معلم أن طالباً يرفع يده كثيراً فشكره أمام زملائه، فازداد رفعه ليده. الإجراء الذي قام به المعلم:",["تعزيز موجب","تعزيز سالب","عقاب سالب","انطفاء"],"الشكر مثير سارّ أُضيف بعد السلوك فزاد، وهذا التعزيز الموجب. التعزيز السالب إزالة منفّر، والعقاب السالب سحب معزّز."],
["L09","hm","قال معلم لطالب: «لأنك شاركت بفاعلية اليوم سألغي الإنذار الذي سجلته عليك أمس»، فزادت مشاركته. هذا الإجراء:",["تعزيز سالب","تعزيز موجب","عقاب سالب","تكلفة استجابة"],"إزالة مثير منفّر (الإنذار) بعد السلوك المرغوب فزاد = تعزيز سالب. لو خُصمت درجات بعد سلوك سيئ لكان تكلفة استجابة."],
["L09","h","لم يؤدِّ طالب واجبه، فحرمه المعلم من حصة الرياضة التي كان ينتظرها ذلك اليوم، فقلّ إهماله للواجبات بعدها. يُصنّف هذا الإجراء:",["تكلفة استجابة (عقاب سالب)","تعزيز سالب","عقاب موجب","تشكيل"],"سحب امتياز مكتسب (حصة الرياضة) بعد السلوك غير المرغوب فقلّ السلوك = تكلفة الاستجابة، وهي صورة من العقاب السالب. التعزيز السالب إزالة منفّر فيزيد السلوك، والعقاب الموجب إضافة منفّر."],
["L09","hm","أتلف طالب مقعداً فطلب منه المعلم الاعتذار وإصلاح المقعد وإحضار مقعد بديل وتنظيف المكان. يُسمى هذا الإجراء:",["التصحيح الزائد","الإقصاء","الانطفاء","التعزيز التفاضلي"],"التصحيح الزائد: إعادة الوضع إلى أفضل مما كان مع تكرار السلوك الصحيح. الإقصاء عزل مؤقت، والانطفاء تجاهل."],
["L09","m","يصرخ طالب لجذب الانتباه، فاتفق المعلم مع الصف على تجاهل صراخه تماماً والالتفات إليه عندما يتكلم بهدوء. الإجراء مع الصراخ:",["انطفاء","عقاب موجب","تعزيز سالب","إقصاء"],"وقف التعزيز (الانتباه) عن السلوك فيتلاشى = انطفاء، مع تعزيز السلوك البديل (تعزيز تفاضلي). الإقصاء يتطلب إبعاده."],
["L09","","أخرج المعلم طالباً مشاغباً من مجموعة اللعب ليجلس وحده دقائق بعيداً عن النشاط. يُصنّف هذا:",["إقصاء (وقت مستقطع)","تكلفة استجابة","تعزيز سالب","انطفاء"],"الإبعاد المؤقت عن مصدر التعزيز هو الإقصاء. تكلفة الاستجابة خسارة شيء مكتسب كالدرجات."],
["L09","m","يعطي معلم نجمة بعد كل خمس إجابات صحيحة بالضبط. جدول التعزيز المستخدم:",["نسبة ثابتة","نسبة متغيرة","فترة ثابتة","فترة متغيرة"],"التعزيز بعد عدد ثابت من الاستجابات = نسبة ثابتة. الفترة ترتبط بالزمن، والمتغيرة بعدد غير منتظم."],
["L09","","يفاجئ المعلم طلابه باختبارات قصيرة في أوقات غير متوقعة فيستمر استذكارهم طوال الفصل. جدول التعزيز الأقرب:",["فترة متغيرة","فترة ثابتة","نسبة ثابتة","تعزيز مستمر"],"الاختبارات في أوقات زمنية غير منتظمة = فترة متغيرة، وتحافظ على أداء مستمر. الفترة الثابتة (كل أسبوع) تجعل الاستذكار يتركز قبل الموعد."],
["L09","","أي جداول التعزيز أكثر مقاومة للانطفاء ويُنتج أعلى معدل استجابة؟",["النسبة المتغيرة","النسبة الثابتة","الفترة الثابتة","التعزيز المستمر"],"النسبة المتغيرة (كألعاب الحظ) الأقوى وأكثرها مقاومة للانطفاء. المستمر أسرع تعلماً لكنه أسرع انطفاءً."],
["L09","m","يلاحظ معلم أن طلابه يذاكرون بكثافة قبل اختبار الشهر فقط ثم يتوقفون بعده. هذا النمط ينتج عن جدول تعزيز:",["الفترة الثابتة","النسبة المتغيرة","الفترة المتغيرة","المستمر"],"التعزيز بعد زمن ثابت يُنتج نمط «الحافة»: ارتفاع الأداء قبل الموعد وانخفاضه بعده."],
["L09","m","يريد معلم تعليم طفل في الروضة كتابة اسمه. بدأ بتعزيزه عند مسك القلم، ثم عند رسم خط، ثم عند كتابة حرف، حتى كتب الاسم كاملاً. الإجراء:",["تشكيل","تسلسل","نمذجة","تعميم"],"تعزيز التقريبات المتتابعة نحو السلوك النهائي هو التشكيل. التسلسل ربط خطوات مكتملة، والنمذجة ملاحظة نموذج."],
["L09","","يستخدم معلم بطاقات نقاط يجمعها الطلاب ويستبدلونها آخر الأسبوع بامتيازات. هذا النظام:",["الاقتصاد الرمزي","التعزيز السالب","مبدأ بريماك","العقد السلوكي"],"الرموز القابلة للاستبدال بمعززات هي الاقتصاد الرمزي. بريماك نشاط محبب يعزز نشاطاً آخر، والعقد اتفاق مكتوب."],
["L09","m","يشعر طالب بالخوف من حصة الرياضيات بعد تعرضه للتوبيخ المتكرر فيها، وبدأ يخاف من كل حصة تُعرض فيها أرقام. انتقال الخوف إلى الحصص المشابهة يُسمى:",["التعميم","التمييز","الانطفاء","الاسترجاع التلقائي"],"إصدار الاستجابة الشرطية لمثيرات تشبه المثير الأصلي هو التعميم. التمييز عكسه."],
["L09","","تعلم طفل الخوف من الطبيب ذي المعطف الأبيض، لكنه لا يخاف من والده عندما يلبس معطفاً أبيض. هذا يدل على:",["التمييز","التعميم","الانطفاء","الإشراط من الدرجة الثانية"],"الاستجابة للمثير الأصلي دون المشابه هي التمييز."],
["L09","m","توقف طالب عن الخوف من قاعة الاختبار بعد عدة اختبارات مرت دون توبيخ، ثم عاد الخوف فجأة بعد إجازة طويلة. عودة الخوف تُسمى:",["الاسترجاع التلقائي","التعميم","التمييز","الكف"],"عودة الاستجابة المنطفئة بعد فترة راحة هي الاسترجاع التلقائي عند بافلوف."],
["L09","","في الإشراط الكلاسيكي، صوت الجرس الذي صار يستدعي اللعاب بعد اقترانه بالطعام يُسمى:",["مثيراً شرطياً","مثيراً غير شرطي","استجابة شرطية","استجابة غير شرطية"],"الجرس مثير محايد صار شرطياً. الطعام غير شرطي، واللعاب للجرس استجابة شرطية."],
["L09","m","يعلّم معلم جدول الضرب بتكرار التسميع مع مدح كل إجابة صحيحة ومراعاة الاستعداد. يستند هذا إلى قوانين:",["ثورندايك (الأثر والتدريب والاستعداد)","الجشطلت","فيجوتسكي","أوزوبل"],"التكرار (قانون التدريب)، والمدح (قانون الأثر)، والاستعداد هي قوانين ثورندايك."],
["L09","","مؤسس المدرسة السلوكية الذي أجرى تجربة الطفل ألبرت وقال إن الانفعالات تُتعلم بالإشراط:",["واطسون","بافلوف","ثورندايك","تولمان"],"واطسون مؤسس السلوكية ومعه تجربة ألبرت الصغير. تولمان معرفي (التعلم الكامن)."],
["L09","","فئران تولمان التي تجولت في المتاهة دون تعزيز ثم تحسن أداؤها فجأة عند تقديم الطعام تمثل ظاهرة:",["التعلم الكامن (تولمان)","الاستبصار","الانطفاء","التعزيز البديل"],"التعلم حدث دون تعزيز وظهر عند وجود الدافع: التعلم الكامن والخرائط المعرفية عند تولمان."],
["L09","m","بعد محاولات عديدة فاشلة، توقف طالب عن حل لغز هندسي، ثم صاح فجأة «فهمت!» ورسم الحل كاملاً. التعلم هنا بـ:",["الاستبصار","المحاولة والخطأ","التشكيل","التلقين"],"الحل المفاجئ بعد إعادة تنظيم الموقف هو الاستبصار (الجشطلت/كوهلر). المحاولة والخطأ تدريجي."],
["L09","","يبدأ معلم كل وحدة بعرض خريطة مفاهيم عامة تبين علاقة الدرس الجديد بما سبق، ثم يفصّل. ما يقوم به المعلم:",["منظم متقدم (أوزوبل)","تعزيز متقطع","استبصار","سقالات"],"الإطار العام المقدّم قبل الدرس لربطه بالبنية المعرفية هو المنظم المتقدم. السقالات دعم أثناء الأداء."],
["L09","m","يكتفي طلاب بحفظ تعريف الاحتكاك دون ربطه بما يعرفونه عن الحركة. وفق أوزوبل، نوع تعلمهم:",["تعلم صمّ (استظهاري) بالاستقبال","تعلم ذو معنى بالاستقبال","تعلم ذو معنى بالاكتشاف","تعلم كامن"],"الحفظ دون ربط بالبنية المعرفية هو التعلم الاستظهاري (الصمّ) بالاستقبال. ذو المعنى يربط الجديد بالقديم."],
["L09","","يعرض معلم العلوم المفهوم بمجسم يتعامل معه الطلاب بأيديهم، ثم بصور ورسوم، ثم بالمعادلة الرمزية. هذا التدرج وفق:",["برونر (العملي ثم الأيقوني ثم الرمزي)","بياجيه (الحس-حركي ثم المجرد)","سكنر (التعليم المبرمج)","باندورا (النمذجة)"],"التدرج من التمثيل العملي إلى الأيقوني إلى الرمزي هو ترتيب برونر لأنماط التمثيل."],
["L09","","المنهج الذي تعود فيه المفاهيم الأساسية بعمق أكبر في كل صف دراسي يُسمى عند برونر:",["المنهج الحلزوني","المنهج المحوري","منهج النشاط","المنهج المدمج"],"الحلزوني تنظيم برونر لتكرار المفاهيم بتعمق متزايد."],
["L09","m","يطلب معلم من طلابه حفظ رقم مكوّن من عشرة أرقام فيفشل معظمهم، ثم يعرضه مقسماً إلى ثلاث مجموعات فينجحون. الاستراتيجية التي ساعدتهم:",["التجميع (التقطيع)","التسميع","التنظيم الهرمي","الترميز المزدوج"],"تجميع الوحدات المتفرقة في وحدات أكبر يوسع سعة الذاكرة العاملة (7±2). التسميع تكرار، والتنظيم الهرمي للمفاهيم."],
["L09","","سعة الذاكرة قصيرة المدى (العاملة) تقدَّر بنحو:",["7±2 وحدات","غير محدودة","وحدة واحدة","50 وحدة"],"ميلر: 7±2 وحدات لمدة 15–30 ثانية. غير المحدودة هي طويلة المدى."],
["L09","m","تعلم طالب قائمة كلمات فرنسية ثم قائمة إسبانية، فوجد أن الإسبانية جعلته ينسى الفرنسية. نوع التداخل:",["تداخل بعدي (رجعي)","تداخل قبلي","اضمحلال","كبت"],"التعلم الجديد (الإسبانية) أعاق تذكر القديم (الفرنسية) = تداخل بعدي. القبلي القديم يعيق الجديد."],
["L09","","عندما يكتب المعلم أرقاماً على السبورة ويطلب حفظها بسرعة دون ورقة، ثم يمسحها، فإن ما يختبره لدى الطلاب هو:",["الذاكرة قصيرة المدى (العاملة)","الذاكرة طويلة المدى","الذاكرة الإجرائية","الذاكرة الحسية فقط"],"الاحتفاظ بالمعلومات ثوانٍ قليلة ومعالجتها دون تثبيت عمل الذاكرة العاملة."],
["L09","hm","يسأل المعلم الطالب بعد حل المسألة: «كيف توصلت إلى هذه الإجابة؟ وهل هناك طريقة أفضل؟». المعلم ينمي لدى الطالب:",["ما وراء المعرفة","التفكير التقاربي","الذاكرة الحسية","التعلم الكامن"],"الوعي بعمليات التفكير ومراقبتها وتقويمها هو ما وراء المعرفة (فلافل)."],
["L09","","مراحل التعلم بالملاحظة عند باندورا بالترتيب:",["الانتباه ← الاحتفاظ ← الإنتاج ← الدافعية","الدافعية ← الانتباه ← الاحتفاظ ← الإنتاج","الاحتفاظ ← الانتباه ← الدافعية ← الإنتاج","الإنتاج ← الانتباه ← الاحتفاظ ← الدافعية"],"يبدأ الملاحظ بالانتباه للنموذج ثم الاحتفاظ بالصورة ثم إنتاج السلوك ثم الدافعية لأدائه."],
["L09","","رأى طالب زميله يُكافأ على ترتيب أدواته فبدأ يرتب أدواته هو أيضاً. ما حدث له:",["تعزيز بديل","تعزيز موجب مباشر","استبصار","تمييز"],"زيادة سلوك الملاحظ بعد رؤية النموذج يُعزز هي التعزيز البديل (باندورا). التعزيز المباشر يقتضي أن يُكافأ هو."],
["L09","m","طالب يعتقد أنه لن ينجح في الرياضيات مهما حاول، رغم قدرته. وفق باندورا، أفضل طريقة لرفع كفاءته الذاتية:",["إتاحة خبرات نجاح متدرجة وإبراز نماذج مشابهة له نجحت","إخباره بأنه ذكي فقط","تقليل التوقعات منه","مقارنته بالمتفوقين"],"أقوى مصادر الكفاءة الذاتية خبرات الإتقان ثم الخبرات البديلة. الإقناع اللفظي وحده ضعيف، والمقارنة تضعفها."],
["L09","m","يسمي طفل في الروضة الحمار الوحشي «حصاناً مخططاً». وفق بياجيه، الطفل يقوم بـ:",["التمثل","المواءمة","الموازنة","التعميم الشرطي"],"إدخال الخبرة الجديدة في مخطط قائم (الحصان) دون تعديله هو التمثل. لو كوّن مفهوماً جديداً لكان مواءمة."],
["L09","","لاحظ معلم أن طالباً يستطيع حل مسألة من خطوتين وحده، ويحل مسألة من أربع خطوات بتلميحات منه. وفق فيجوتسكي، ينبغي أن يوجه المعلم تدريسه إلى:",["مسائل الأربع خطوات مع دعم يتناقص تدريجياً","مسائل الخطوتين فقط حتى يتقنها تماماً","مسائل من ثماني خطوات ليتحدى نفسه","ترك الطالب يختار بنفسه دائماً"],"التدريس الفعال يستهدف منطقة النمو القريب (ما ينجزه بالمساعدة) مع سقالات تُسحب تدريجياً. ما يتقنه وحده لا يطوره، والبعيد جداً يُحبط."],
["L09","m","تقدم معلمة لطلابها قائمة تحقق وأسئلة موجهة ونماذج أثناء كتابة أول تقرير علمي، ثم تقلل هذه المساعدات في التقارير التالية. ما تقوم به:",["السقالات التعليمية","التعليم المبرمج","التعزيز المتقطع","الإثراء"],"الدعم المؤقت المتناقص مع تقدم المتعلم هو السقالات (فيجوتسكي/برونر)."],
["L09","","يتحدث طفل مع نفسه بصوت مسموع وهو يركب الأحجية: «هذه هنا… لا، هناك». وفق فيجوتسكي، هذا الحديث الذاتي:",["أداة لتنظيم التفكير وتوجيه السلوك ويُعد تطوراً طبيعياً","دليل على تمركز حول الذات يجب علاجه","مظهر لتشتت الانتباه","سلوك يجب إيقافه حفاظاً على الهدوء"],"فيجوتسكي يرى الحديث الذاتي وسيلة لضبط الذات وتوجيه الفعل ويتحول لاحقاً إلى حديث داخلي. بياجيه عدّه تمركزاً، لكن السؤال عن فيجوتسكي."],
["L09","hm","تعلم طالب القراءة فأصبح يقرأ أي جملة جديدة. يمثل ذلك انتقال أثر التعلم:",["الإيجابي","السلبي","الصفري","العكسي"],"التعلم السابق سهّل الأداء الجديد = انتقال إيجابي. السلبي عندما يعيق القديم الجديد."],
["L09","","اعتاد طالب القيادة في بلد تسير فيه السيارات على اليسار، فأخطأ كثيراً عند القيادة في المملكة. هذا مثال على:",["انتقال أثر سلبي","انتقال أثر إيجابي","انتقال صفري","تعميم إيجابي"],"العادة القديمة أعاقت الأداء الجديد = انتقال سلبي."],
["L09","m","تعلم الطلاب الجمع ثم انتقلوا إلى الضرب الذي يبنى عليه. نوع انتقال أثر التعلم:",["رأسي","أفقي","سلبي","صفري"],"تعلم مهارة أعلى مستوى تبنى على سابقة = انتقال رأسي. الأفقي مهارة بالمستوى نفسه في سياق آخر."],
["L09","","فسّر ثورندايك انتقال أثر التعلم بوجود:",["عناصر متطابقة بين الموقفين","استبصار في الموقف الجديد","دافعية داخلية مرتفعة","منظم متقدم"],"نظرية العناصر المتطابقة لثورندايك: ينتقل الأثر بقدر تشابه عناصر الموقفين. جد فسّره بالتعميم."],
["L09","","أي العبارات الآتية لا تنطبق على التعزيز السالب؟",["يقلل من احتمال تكرار السلوك","يزيد من احتمال تكرار السلوك","يتضمن إزالة مثير منفّر","يحدث بعد صدور الاستجابة"],"التعزيز بنوعيه يزيد السلوك؛ التقليل وظيفة العقاب. الالتباس الشائع هو عدّ «السالب» عقاباً."],
["L09","","جميع ما يلي من مفاهيم النظرية البنائية ما عدا:",["جداول التعزيز","منطقة النمو القريب","التمثل والمواءمة","السقالات"],"جداول التعزيز من الإشراط الإجرائي. الباقي من بياجيه وفيجوتسكي."],
["L09","","أي مما يلي ليس من استراتيجيات نقل المعلومات إلى الذاكرة طويلة المدى؟",["تكديس المعلومات دفعة واحدة قبل الاختبار","التسميع الموزع","التجميع","الربط بالمعرفة السابقة (الإتقان)"],"التكديس يرهق الذاكرة العاملة ويضعف التخزين. التسميع الموزع والتجميع والربط استراتيجيات فعالة."],
["L09","m","يعرض معلم طالباً متميزاً في النظافة نموذجاً أمام الصف ويمدحه، فيلاحظ تحسن نظافة الطلاب الآخرين. التفسير النظري لذلك:",["التعلم بالملاحظة والتعزيز البديل","الانطفاء","الإشراط الكلاسيكي","التعلم الكامن"],"رؤية نموذج يُعزز يزيد السلوك عند الملاحظين (باندورا)."],
["L09","","بعد أن شرح المعلم مفهوماً معقداً عشرين دقيقة متواصلة لاحظ أن الطلاب توقفوا عن المتابعة. التفسير وفق معالجة المعلومات:",["تجاوز الحمل المعرفي سعة الذاكرة العاملة","انطفاء الاستجابة","ضعف قانون الاستعداد","غياب المواءمة"],"المعلومات المتواصلة الكثيفة تفوق سعة الذاكرة العاملة (الحمل المعرفي الزائد)، فالحل التقسيم والتوقف للمعالجة."]
]);
// ===== L10: الدافعية والذكاء والتفكير والإبداع =====
window.QB = (window.QB || []).concat([
["L10","h","صاحب نظرية هرمية الحاجات الإنسانية هو:",["ماسلو","باندورا","فرويد","ماكدوجل"],"ماسلو رتب الحاجات في هرم من الفسيولوجية إلى تحقيق الذات. باندورا اجتماعي وفرويد تحليلي."],
["L10","hm","من الحاجات الأساسية (الدنيا) للمتعلم وفق هرم ماسلو:",["الطعام","التقدير","التفوق","تحقيق الذات"],"الحاجات الفسيولوجية (طعام، نوم) قاعدة الهرم وتُشبع أولاً. التقدير وتحقيق الذات في الأعلى."],
["L10","h","لكي يحافظ المعلم على مستوى مرتفع من الدافعية لدى طالب تعرض لخبرات إخفاق، فإنه استناداً إلى النظريات المعرفية في الدافعية (العزو) يقوم بـ:",["توجيه الطالب إلى عزو الفشل إلى نقص الجهد المبذول لا إلى القدرة","تعزيز أي تقدم يحققه مادياً","توفير بيئة خالية من أي نقد","تشجيعه على تكرار المحاولات دون تفسير"],"نظرية العزو (واينر): عزو الفشل إلى الجهد (متغير قابل للضبط) يدفع للمحاولة، وعزوه إلى القدرة يُحبط. التعزيز المادي سلوكي لا معرفي."],
["L10","h","وفق واينر، السبب الذي يُعد داخلياً وثابتاً وغير قابل للضبط هو:",["القدرة","الجهد","الحظ","صعوبة المهمة"],"القدرة داخلية ثابتة غير قابلة للضبط. الجهد داخلي متغير قابل للضبط، والحظ خارجي متغير، وصعوبة المهمة خارجية ثابتة."],
["L10","hm","حاول طالب كتابة موضوع تعبير مرتين فحصل على درجة منخفضة فيهما، فغضب ومزّق ورقته وقال: «لن أكتب اليوم»، مع أنه يشارك شفهياً بنشاط ويحاول في بقية المهام وما زال يعتقد أنه قادر على التحسن. الحالة الأقرب:",["إحباط","عجز متعلم","بطء تعلم","تردد"],"الإحباط انفعال مؤقت يعقب إعاقة الوصول إلى هدف ويقتصر على الموقف، مع بقاء الاعتقاد بالقدرة والمحاولة في مواقف أخرى. العجز المتعلم أعمّ وأثبت: توقف عن المحاولة لاعتقاد راسخ أن الجهد لا يغيّر النتيجة. بطء التعلم ضعف عام مع ذكاء حدّي، والتردد صعوبة اتخاذ القرار. (بعض الملخصات المتداولة تجعل الإجابة: الإحباط.)"],
["L10","h","طالب كرر الفشل في الرياضيات حتى صار يقول «مهما ذاكرت سأرسب» ولم يعد يحاول رغم قدرته. هذه الحالة تُسمى:",["العجز المتعلم","الدافعية الخارجية","الكفاءة الذاتية","القلق المتوسط"],"العجز المتعلم (سليجمان): توقف عن المحاولة بعد فشل متكرر لاعتقاد أن النتيجة خارج السيطرة."],
["L10","hm","أراد معلم رفع تقدير الذات لدى طالب ضعيف الثقة. الإجراء الأنسب:",["إشراكه في مجموعة متميزة وإسناد دور ينجح فيه","إعفاؤه من المهام الصعبة","مقارنته بزملائه المتفوقين","تأجيل التعامل حتى يتحسن تحصيله"],"الانتماء إلى مجموعة ناجحة ودور يُنجزه يرفع الكفاءة الذاتية وتقدير الذات. الإعفاء والمقارنة يخفضانها."],
["L10","h","طالبة تدرس لأنها تستمتع بفهم الموضوع وتفضل المهام الصعبة بلا مكافأة. دافعيتها:",["داخلية","خارجية","اجتماعية","سلبية"],"الدافعية الداخلية من المهمة نفسها (فضول وإتقان). الخارجية من الدرجة أو المكافأة."],
["L10","","كان طالب يرسم في البيت لمتعته، ثم بدأ المعلم يعطيه درجات على كل رسمة، فلما توقفت الدرجات توقف عن الرسم. يفسر ذلك:",["المكافآت الخارجية المفرطة أضعفت الدافعية الداخلية","الانطفاء في الإشراط الكلاسيكي","تدني الذكاء المكاني","العجز المتعلم"],"أثر التبرير الزائد: المكافأة الخارجية على نشاط محبب داخلياً تُحوّل الدافع إلى خارجي فيزول بزوالها."],
["L10","m","يقول طالب بعد نجاحه: «نجحت لأن الاختبار كان سهلاً». وفق واينر، عزا نجاحه إلى سبب:",["خارجي ثابت","داخلي ثابت","داخلي متغير","خارجي متغير"],"صعوبة المهمة سبب خارجي ثابت. الحظ خارجي متغير، والجهد داخلي متغير، والقدرة داخلية ثابتة."],
["L10","","يأتي طالب إلى المدرسة دون إفطار ويبدو خائفاً من زملاء يتنمرون عليه، ولا تنفع معه المكافآت لرفع تحصيله. وفق ماسلو، الخطوة الأولى:",["إشباع حاجاته الفسيولوجية وحاجة الأمن أولاً","زيادة المكافآت والدرجات","تكليفه بمهام تحقق ذاته","تجاهل الأمر لأنه خارج الصف"],"الحاجات الدنيا (طعام، أمن) تسبق الحاجات العليا؛ لا تعلم مع جوع أو خوف."],
["L10","","وفق قانون يركس–دودسون، العلاقة بين مستوى القلق (الاستثارة) والأداء:",["منحنى مقلوب: الأداء الأفضل عند الاستثارة المتوسطة","خطية موجبة: كلما زاد القلق تحسن الأداء","خطية سالبة: كلما زاد القلق ساء الأداء","لا علاقة بينهما"],"الاستثارة المتوسطة تُحسّن الأداء، أما المنخفضة جداً أو المرتفعة جداً فتضعفه."],
["L10","m","طالب لا يبالي بالاختبار إطلاقاً فيؤدي ضعيفاً، وآخر يرتعش من شدة القلق فينسى ما حفظ. ما ينصح به المعلم لكليهما وفق يركس–دودسون:",["رفع قلق الأول قليلاً وتهدئة الثاني للوصول إلى مستوى متوسط","إزالة القلق تماماً عند الاثنين","زيادة القلق عند الاثنين","تجاهل عامل القلق"],"الأداء الأمثل عند الاستثارة المتوسطة، فالمنخفض يُرفع والمرتفع يُخفض."],
["L10","","يختار طالب ذو دافع إنجاز مرتفع المهام التي:",["متوسطة الصعوبة وتتحدى قدراته","سهلة جداً لضمان النجاح","مستحيلة ليُعذر عند الفشل","يختارها له الآخرون"],"وفق ماكليلاند وأتكنسون، ذو دافع الإنجاز المرتفع يفضل المهام متوسطة الصعوبة، ومنخفضه يختار السهل جداً أو الصعب جداً."],
["L10","m","طالب هدفه من المذاكرة أن يحصل على أعلى درجة ليُظهر تفوقه، وآخر هدفه أن يفهم ويتحسن حتى لو أخطأ. وفق دويك، الأول توجهه:",["أداء، والثاني توجهه إتقان","إتقان، والثاني توجهه أداء","داخلي، والثاني خارجي","تجنب، والثاني اقتراب"],"توجه الأداء يسعى لإثبات القدرة والظهور، وتوجه الإتقان يسعى للتعلم ويرى الخطأ فرصة."],
["L10","m","أي الممارسات أكثر دعماً لدافعية الطلاب في الصف؟",["تغذية راجعة فورية وصفية وأهداف قريبة قابلة للتحقيق","مقارنة درجات الطلاب علناً","مكافآت مادية لكل إجابة","تأجيل التغذية الراجعة إلى نهاية الفصل"],"التغذية الفورية الوصفية والأهداف القريبة ترفع الكفاءة الذاتية. المقارنة تُحبط، والمكافآت المفرطة تضعف الداخلية، والتأجيل يفقد الأثر."],
["L10","","مصادر الكفاءة الذاتية عند باندورا هي خبرات الإتقان والخبرات البديلة والإقناع اللفظي و:",["الحالة الفسيولوجية والانفعالية","الذكاء الموروث","المستوى الاقتصادي","جداول التعزيز"],"المصدر الرابع هو الحالة الفسيولوجية والانفعالية (القلق، التعب) التي يفسرها الفرد كمؤشر على قدرته."],
["L10","","واضع أول اختبار للذكاء وصاحب مفهوم العمر العقلي:",["بينيه","سبيرمان","وكسلر","جاردنر"],"بينيه (1905) وضع أول مقياس للذكاء مع سيمون. وكسلر لاحق، وسبيرمان نظرية العاملين."],
["L10","","نسبة الذكاء تُحسب بالعلاقة:",["العمر العقلي ÷ العمر الزمني × 100","العمر الزمني ÷ العمر العقلي × 100","العمر العقلي − العمر الزمني","العمر العقلي + العمر الزمني ÷ 2"],"معادلة ستيرن/تيرمان: ن.ذ = ع.ع ÷ ع.ز × 100؛ فطفل عمره العقلي 12 وزمنه 10 نسبته 120."],
["L10","","طفل عمره الزمني 8 سنوات وعمره العقلي 10 سنوات. نسبة ذكائه:",["125","80","100","180"],"10 ÷ 8 × 100 = 125. القسمة العكسية تعطي 80 خطأً."],
["L10","m","حصل طالب على 68 في اختبار ذكاء مقنن ولديه قصور واضح في مهارات الحياة اليومية. التصنيف الأقرب:",["إعاقة فكرية","بطء تعلم","صعوبات تعلم","موهبة"],"أقل من 70 مع قصور في السلوك التكيفي = إعاقة فكرية. بطء التعلم 70–85، وصعوبات التعلم ذكاء عادي."],
["L10","","نظرية الذكاء التي تفترض عاملاً عاماً (g) يشترك في جميع القدرات وعوامل خاصة (s):",["سبيرمان","ثيرستون","جاردنر","ستيرنبرغ"],"سبيرمان صاحب نظرية العاملين. ثيرستون قدرات أولية، جاردنر متعددة، ستيرنبرغ ثلاثي."],
["L10","h","صاحب نظرية القدرات العقلية الأولية (الفهم اللفظي، العددية، المكانية، الذاكرة، الاستدلال…):",["ثيرستون","سبيرمان","جيلفورد","كاتل"],"ثيرستون حدد سبع قدرات أولية. جيلفورد بنية العقل، وكاتل السائل والمتبلور."],
["L10","h","النظرية التي تصنف الذكاء إلى تحليلي وإبداعي وعملي:",["ستيرنبرغ (الذكاء الثلاثي)","جاردنر (الذكاءات المتعددة)","جولمان (الذكاء الوجداني)","سبيرمان (العاملان)"],"ستيرنبرغ: تحليلي (مدرسي)، إبداعي (مواقف جديدة)، عملي (الحياة)."],
["L10","h","القدرة على فهم انفعالات الذات والآخرين وإدارتها والتعاطف وبناء العلاقات تُسمى عند جولمان:",["الذكاء الوجداني (العاطفي)","الذكاء الاجتماعي عند جاردنر","الذكاء السائل","الذكاء المتبلور"],"جولمان صاحب الذكاء الوجداني بمكوناته الخمسة. الاجتماعي عند جاردنر أحد الذكاءات المتعددة فقط."],
["L10","","طالب يحل مسائل جديدة غير مألوفة بسرعة لكنه ضعيف في المعلومات العامة والمفردات. وفق كاتل، يبرز لديه الذكاء:",["السائل","المتبلور","الوجداني","العملي"],"السائل قدرة فطرية على حل المشكلات الجديدة، والمتبلور معارف مكتسبة (مفردات ومعلومات)."],
["L10","","نظرية بنية العقل التي صنفت القدرات في أبعاد (العمليات × المحتوى × النواتج) وفرقت بين التفكير التقاربي والتباعدي لـ:",["جيلفورد","جاردنر","ثيرستون","بينيه"],"جيلفورد صاحب نموذج بنية العقل (120–180 قدرة) والتفكير التباعدي أساس الإبداع."],
["L10","h","طلب المعلم من الطلاب تحليل معلومات ووجهات نظر متعددة حول قضية ثم الحكم على أقواها بالأدلة. نوع التفكير المستهدف:",["الناقد","الإبداعي","التقاربي","الحدسي"],"تحليل الحجج وتقويمها بمعايير هو التفكير الناقد. الإبداعي يولّد أفكاراً جديدة."],
["L10","hm","كلّف المعلم طلابه بتقييم مواقع الإنترنت من حيث دقة المعلومات ومصداقية مصدرها. المهارة المستهدفة:",["التفكير الناقد","التفكير الإبداعي","ما وراء المعرفة","الطلاقة"],"الحكم على المصداقية والدقة من مهارات التفكير الناقد (تقويم المصادر)."],
["L10","h","مهارات التفكير الإبداعي الأساسية هي:",["الطلاقة والمرونة والأصالة والتوسع (الإفاضة)","الاستنباط والاستقراء والتفسير","التخطيط والمراقبة والتقويم","التذكر والفهم والتطبيق"],"مكونات الإبداع عند جيلفورد وتورانس. الاستنباط والاستقراء للناقد، والتخطيط والمراقبة لما وراء المعرفة، والتذكر والفهم مستويات بلوم الدنيا."],
["L10","hm","نموذج أنماط التفكير الأربعة (تحليلي، منظم، شعوري، تخيّلي) وفق السيطرة الدماغية يُنسب إلى:",["هيرمان","كولب","ماكارثي","ديبونو"],"مقياس هيرمان للسيطرة الدماغية بأرباعه الأربعة. كولب دورة التعلم الخبراتي، ومكارثي 4MAT، وديبونو القبعات وكورت."],
["L10","hm","تُستخدم استراتيجية جدول التعلم KWL (ماذا أعرف؟ ماذا أريد أن أعرف؟ ماذا تعلمت؟) لتنمية التفكير:",["ما وراء المعرفي (فوق المعرفي)","الإبداعي","المنطقي","الحدسي"],"KWL يجعل الطالب يخطط ويراقب ويقوّم تعلمه، وهذا جوهر ما وراء المعرفة. بعض مفاتيح الملخصات المتداولة تقول «الناقد» لأنها تنمي الناقد أيضاً، لكن الوظيفة الأساسية ما وراء معرفية."],
["L10","","طلب المعلم من طلابه اقتراح أكبر عدد ممكن من استخدامات علبة الكرتون في دقيقتين. المهارة الإبداعية المستهدفة:",["الطلاقة","المرونة","الأصالة","التوسع"],"الطلاقة كمية الأفكار في زمن محدد. المرونة تنوعها، والأصالة ندرتها، والتوسع التفاصيل."],
["L10","m","قدم طالب أفكاراً لاستخدام علبة الكرتون تنوعت بين التخزين والديكور واللعب والزراعة، بينما اقتصر زميله على أفكار التخزين. يتفوق الأول في:",["المرونة","الطلاقة","الأصالة","الحساسية للمشكلات"],"تنوع فئات الأفكار وتغيير الزاوية هو المرونة، بغض النظر عن عددها."],
["L10","","قدمت طالبة فكرة لم يذكرها أحد في الصف ولم تخطر على بال المعلم. المهارة الإبداعية التي تبرز لديها:",["الأصالة","الطلاقة","المرونة","الإفاضة"],"الأصالة ندرة الفكرة وجدّتها."],
["L10","m","بعد أن طرح طالب فكرة مشروع، أضاف إليها تفاصيل الخطوات والأدوات والرسوم التوضيحية. المهارة:",["الإفاضة (التوسع)","الطلاقة","المرونة","الأصالة"],"إضافة التفاصيل والتوضيحات إلى الفكرة هي الإفاضة."],
["L10","","مراحل العملية الإبداعية بالترتيب:",["الإعداد ← الاحتضان ← الإلهام ← التحقق","الإلهام ← الإعداد ← الاحتضان ← التحقق","الاحتضان ← الإعداد ← التحقق ← الإلهام","الإعداد ← الإلهام ← الاحتضان ← التحقق"],"والاس: جمع المعلومات (إعداد)، ثم تركها تختمر (احتضان)، ثم ومضة الفكرة (إلهام)، ثم اختبارها (تحقق)."],
["L10","","توقف باحث عن التفكير في مشكلة عالقة وذهب للمشي، ثم خطر له الحل فجأة. المرحلة التي كان فيها قبل خطور الحل:",["الاحتضان","الإعداد","التحقق","الإلهام"],"ترك المشكلة تختمر لا شعورياً هو الاحتضان الذي يسبق الإلهام."],
