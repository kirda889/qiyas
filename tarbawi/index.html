لاستعداد"],"body":["النضج تغيرات داخلية بيولوجية تحدث تلقائياً دون تدريب، والتعلم تغير شبه دائم ينتج عن الخبرة والممارسة. والنضج **شرط** للتعلم؛ و**الاستعداد** بلوغ مستوى النضج والخبرة الذي يسمح بتعلم مهارة معينة."],"pts":["التعليم قبل الاستعداد يضيع الجهد ويولد الإحباط.","المشي يعتمد على النضج أساساً، والقراءة على النضج والتعلم معاً."],"ex":["طفل في الرابعة لم تنضج عضلاته الدقيقة: تبدأ المعلمة بأنشطة تهيئة (قص، تتبع خطوط كبيرة) قبل الكتابة الصغيرة."],"traps":["«التعلم شرط للنضج» عكس الصحيح."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.1؛ أدبيات علم نفس النمو","aka":["النضج","الاستعداد"]},"ar.l07.havighurst":{"k":"النظريات","t":["Havighurst — Developmental Tasks","هافجهرست: مطالب النمو"],"body":["لكل مرحلة عمرية **مطالب نمو**: مهام ينبغي إتقانها في وقتها، تنشأ من النضج وتوقعات المجتمع وقيم الفرد؛ إنجازها يقود إلى النجاح في المطالب التالية، والإخفاق يصعّبها. وهو صاحب فكرة **اللحظة القابلة للتعلم**.","الفرق الحاسم: بياجيه **معرفي**، إريكسون **نفسي اجتماعي**، كولبرج **أخلاقي**، فرويد **نفسي جنسي**، هافجهرست **مطالب نمو**."],"pts":["الطفولة المتوسطة: القراءة والكتابة والحساب، ومهارات الألعاب، والتعامل مع الأقران، وتكوين الضمير والقيم.","المراهقة: تقبل الجسم، والاستقلال الانفعالي عن الوالدين، واختيار مهنة والاستعداد لها."],"traps":["«مهام ينبغي إنجازها في مرحلة» = هافجهرست، و«أزمة بين قطبين» = إريكسون."],"src":"Havighurst, Developmental Tasks and Education؛ المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.1","aka":["هافجهرست","مطالب النمو"]},"ar.l07.piaget":{"k":"النظريات","t":["Piaget — Cognitive Development","بياجيه: مراحل النمو المعرفي"],"body":["الطفل عند جان بياجيه **يبني معرفته بنفسه** من تفاعله مع البيئة، وتفكيره يختلف عن تفكير الراشد في النوع. ويمر الجميع بأربع مراحل **ثابتة الترتيب**، وعوامل الانتقال: النضج والخبرة والتفاعل الاجتماعي و[[الموازنة|ar.l09.adapt]]."],"pts":["**الحس-حركية (0–2)**: الحواس والحركة، وتنتهي بإدراك دوام الشيء.","**ما قبل العمليات (2–7)**: لغة ورموز ولعب إيهامي، مع التمركز حول الذات والإحيائية وغياب الاحتفاظ.","**العمليات المحسوسة (7–11)**: الاحتفاظ والمعكوسية والتصنيف، ومنطق على المحسوس فقط.","**العمليات المجردة (11+)**: تفكير افتراضي استنباطي واختبار فروض.","درس **المفاهيم الأساسية** (الزمن، المكان، العدد، السببية)؛ والتطبيق: **تعليم يناسب مرحلة النمو**، وطالب **المتوسطة والثانوية** تناسبه المناقشة والفروض.","تجربة الكرات الخشبية: طفل ما قبل العمليات لا يدرك **علاقة الجزء بالكل** (تضمين الفئات)؛ و**العمليات المحسوسة/المادية (7–11)** و**العمليات المجردة/الصورية (11 فأكثر)**."],"ex":["طالب الصف الثالث يحل «5 + 3» بالمكعبات ويتعثر في «س + 3 = 8»؛ لأنه في المحسوسات، فيمثل المعلم المجهول بصندوق مغلق قبل الرمز."],"traps":["الصف الرابع = العمليات المحسوسة حتى لو كان الطالب ذكياً.","التمركز حول الذات حدّ معرفي وليس أنانية."],"src":"Piaget & Inhelder, The Psychology of the Child؛ المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.1","aka":["بياجيه","مراحل بياجيه","النمو المعرفي","التمركز حول الذات"]},"ar.l07.conservation":{"k":"بياجيه","t":["Conservation vs. Object Permanence","الاحتفاظ ودوام الشيء"],"body":["**دوام الشيء** إدراك أن الشيء موجود وإن غاب عن الحواس، ويكتمل في نهاية الحس-حركية. و**الاحتفاظ** إدراك أن الكمية ثابتة رغم تغير الشكل، ويظهر في العمليات المحسوسة مع **المعكوسية** (إرجاع العملية ذهنياً)."],"pts":["يُكتسب الاحتفاظ تدريجياً: العدد أولاً، ثم الكتلة والسائل، ثم الوزن، ثم الحجم آخرها.","غياب الاحتفاظ سببه التمركز على بُعد واحد (الطول دون العرض)."],"ex":["تُباعد أزرار أحد صفين متساويين فيقول طالب الصف الثاني «ما زالت 7»: احتفاظ العدد."],"traps":["دوام الشيء عن **وجود** الشيء (نهاية الحس-حركية)، والاحتفاظ عن **ثبات الكمية** (بداية المحسوسة)."],"src":"Piaget & Inhelder, The Psychology of the Child","aka":["الاحتفاظ","دوام الشيء","المعكوسية"]},"ar.l07.erikson":{"k":"النظريات","t":["Erikson — Psychosocial Development","إريكسون: النمو النفسي الاجتماعي"],"body":["النمو عند إريك إريكسون **ثماني أزمات** نفسية اجتماعية من المهد إلى الشيخوخة؛ كل أزمة صراع بين قطبين، وحلها الإيجابي يمهد لما بعدها. ويركز على الأنا والمجتمع بدل الدوافع الجنسية، ويمد النمو طوال العمر."],"pts":["**الثقة مقابل عدم الثقة (0–1)** ← **الاستقلال مقابل الخجل والشك (1–3)** ← **المبادرة مقابل الذنب (3–6)**.","**الاجتهاد (الكفاءة) مقابل الدونية (6–12 = الابتدائية)**: إنجاز يُقدَّر؛ وتسمى **الكفاية (الإنجاز) مقابل الشعور بالنقص**.","**الهوية مقابل تشتت الهوية (12–18 = المراهقة)**: «من أنا؟».","**الألفة مقابل العزلة** ← **الإنتاجية مقابل الركود** ← **التكامل مقابل اليأس**."],"ex":["مهام قصيرة متدرجة ومدح للجهد المحدد وعرض أعمال الجميع في الصف الخامس تبني الاجتهاد وتقي من الدونية."],"traps":["المبادرة/الذنب لما قبل المدرسة لا للابتدائية.","إريكسون أزمات، وهافجهرست مطالب."],"src":"Erikson, Childhood and Society؛ المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.1","aka":["إريكسون","الاجتهاد مقابل الدونية","الهوية مقابل تشتت الهوية"]},"ar.l07.marcia":{"k":"النظريات","t":["Marcia — Identity Statuses","مارسيا: حالات الهوية"],"body":["جيمس مارسيا فصّل أزمة الهوية بمعيارين: هل **استكشف** المراهق البدائل؟ وهل **التزم** بخيار؟","حالاته الأربع: **التشتت**، **التبني المبكر/الانغلاق**، **التعليق/التأجيل**، **تحقيق الهوية**."],"pts":["**التشتت**: لا استكشاف ولا التزام.","**الانغلاق (التبني المبكر)**: التزام بلا استكشاف؛ هوية فرضها الوالدان.","**التعليق**: استكشاف بلا التزام بعد.","**التحقيق**: استكشاف ثم التزام عن قناعة."],"ex":["«سأدرس الطب لأن أبي قرر ذلك» دون بحث في غيره: انغلاق."],"traps":["الانغلاق ليس تحقيقاً للهوية رغم الالتزام؛ ينقصه الاستكشاف."],"src":"Marcia, Ego Identity Status (1966)","aka":["مارسيا","تعليق الهوية","الهوية المنغلقة"]},"ar.l07.kohlberg":{"k":"النظريات","t":["Kohlberg — Moral Development","كولبرج: مراحل النمو الأخلاقي"],"body":["لورنس كولبرج عرض **معضلات أخلاقية** (أشهرها معضلة هاينز) وصنّف **التبرير** لا الاختيار؛ فاثنان يختاران الشيء نفسه قد يكونان في مرحلتين مختلفتين. وانتهى إلى ثلاثة مستويات في كل منها مرحلتان بترتيب ثابت.","**ما قبل التقليدي** (الطفولة): **العقاب** (1) أو **المصلحة والمنفعة المتبادلة** (2)؛ **التقليدي**: «الولد الطيب» (3) و**القانون والنظام** (4)؛ **ما بعد التقليدي**: **العقد الاجتماعي** (5) و**المبادئ الأخلاقية العالمية** (6)."],"pts":["**ما قبل التقليدي**: (1) تجنب العقاب، (2) المصلحة المتبادلة.","**التقليدي**: (3) إرضاء الآخرين «الولد الطيب»، (4) القانون والنظام.","**ما بعد التقليدي**: (5) العقد الاجتماعي، (6) المبادئ الأخلاقية العالمية.","مناقشة المعضلات ترفع مستوى التبرير."],"traps":["«الولد الطيب» 3 و«القانون والنظام» 4، وكلاهما تقليدي.","الحكم وحده لا يحدد المرحلة."],"src":"Kohlberg, Essays on Moral Development؛ المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.1","aka":["كولبرج","المعضلة الأخلاقية"],"ex":["لماذا لا نغش؟ «حتى لا يُخصم مني» (1)، «حتى لا يزعل أبي» (3)، «لأن نظام المدرسة يمنعه» (4)، «لأن الغش ظلم لمن اجتهد» (مبدأ العدل)."]},"ar.l07.freud":{"k":"النظريات","t":["Freud — Psychosexual Stages","فرويد: المراحل النفسية الجنسية"],"body":["سيجموند فرويد مؤسس التحليل النفسي: الشخصية تتشكل مبكراً عبر مراحل نفسية جنسية، وتتكون من **الهو** (اللذة) و**الأنا** (الواقع، المنظم) و**الأنا الأعلى** (الضمير).","مراحله: **الفمية** (0–1)، **الشرجية** (1–3)، **القضيبية** (3–6)، **الكمون** (6–12 = الابتدائية)، **التناسلية** (المراهقة)؛ والشخصية **الهو** و**الأنا** و**الأنا الأعلى**."],"pts":["الفمية (0–1) ← الشرجية (1–3) ← القضيبية (3–6) ← **الكمون (6–12)** ← التناسلية.","الكمون: تهدأ الدوافع ويتجه الطفل إلى التعلم والمهارات والأقران."],"traps":["الكمون ليس سكوناً عن التعلم بل من أنشط مراحله.","الابتدائية: كمون عند فرويد، واجتهاد/دونية عند إريكسون."],"src":"Freud, Three Essays on the Theory of Sexuality","aka":["فرويد","مرحلة الكمون","الأنا الأعلى"]},"ar.l07.abuse":{"k":"الحماية","t":["Abuse & Neglect — Reporting","الإيذاء والإهمال: إجراء الإبلاغ"],"body":["تنص المادة 29 من قواعد السلوك والمواظبة على أن إجراءات حالات الإيذاء أو الإهمال تُتخذ **بشكل عاجل وسري** و**لا تتطلب التدرج**، بل بحسب خطورة الحالة. والعلامة الواحدة ليست دليلاً قاطعاً؛ المعلم يلاحظ ويوثق ويبلغ."],"pts":["إبلاغ **مدير المدرسة فوراً وبسرية**.","إحالة إلى **لجنة التوجيه الطلابي** لتقدير الخطورة (شديدة/متوسطة/بسيطة) ومستوى الخدمة (عاجلة/غير عاجلة)، ثم محضر رسمي واستدعاء ولي الأمر (ويُراعى اختيار الطالب لشخص مناسب إذا كان ولي الأمر هو المتسبب).","إبلاغ **مركز بلاغات وزارة الموارد البشرية والتنمية الاجتماعية (1919)** فوراً إذا تطلبت الحالة تدخلاً عاجلاً.","إذا كان المصدر أحد منسوبي المدرسة تُرفع الحالة إلى **إدارة التعليم**؛ ولمنسوبي المدرسة التبليغ إلى 1919 مباشرة عند تراخي الإدارة."],"traps":["المعلم لا يحقق بنفسه ولا يواجه الأسرة ولا يعد الطالب بالكتمان.","إجراءات الإيذاء لا تتدرج كالمخالفات السلوكية."],"src":"قواعد السلوك والمواظبة لطلبة التعليم العام، الإصدار الخامس 1447هـ، المادة 29","aka":["الإيذاء","الإهمال","مركز البلاغات"]},"ar.l08.gardner":{"k":"النظريات","t":["Gardner — Multiple Intelligences","جاردنر: الذكاءات المتعددة"],"body":["هوارد جاردنر رفض أن يكون الذكاء قدرة واحدة يقيسها اختبار واحد، ورأى أنه **أنواع مستقلة نسبياً** (ثمانية بعد إضافة الطبيعي)، يملك كل طالب خليطاً منها بدرجات مختلفة؛ فينوّع المعلم مداخل الدرس."],"pts":["لغوي، منطقي رياضي، مكاني (بصري)، جسمي حركي، موسيقي.","**اجتماعي (بين شخصي)**: فهم الآخرين؛ **ذاتي (ضمن شخصي)**: فهم الذات والتأمل.","**طبيعي**: تصنيف الكائنات والظواهر الطبيعية."],"ex":["طالبة تكتب مذكرات تحلل فيها مشاعرها وأهدافها: ذكاء ذاتي."],"traps":["فهم الذات = ذاتي، وفهم الآخرين = اجتماعي.","بصري/سمعي/حسي تصنيف أنماط تعلم لا ذكاءات."],"src":"Gardner, Frames of Mind؛ المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.2","aka":["جاردنر","الذكاءات المتعددة","الذكاء الذاتي","الذكاء الاجتماعي"]},"ar.l08.ld":{"k":"الفئات الخاصة","t":["Learning Disabilities","صعوبات التعلم"],"body":["اضطراب في عملية نفسية أساسية (الانتباه، الإدراك، الذاكرة، التفكير، اللغة) يظهر في تدنٍّ أكاديمي مع ذكاء عادي أو فوق العادي. ويحدد الدليل التنظيمي للتربية الخاصة الأهلية بـ**تباين واضح بين قدرات الطالب وتحصيله** في جانب أكاديمي (كالقراءة والكتابة والعد والاستدلال الرياضي) أو اضطراب في عملية نفسية، و**ألا تكون ناتجة** عن عوق عقلي أو اضطراب سلوكي أو أسباب حسية أو ظروف التعلم أو الرعاية الأسرية."],"pts":["نمائية (العمليات نفسها) وأكاديمية: الديسلكسيا قراءة، والديسغرافيا كتابة، والديسكالكوليا حساب.","بطء التعلم: ذكاء حدّي 70–85 وتدنٍّ في كل المواد؛ والتأخر الدراسي: ذكاء عادي وسبب خارجي.","يبقى الطالب في الفصل العادي ويتلقى دعماً في غرفة المصادر وفق خطة فردية."],"traps":["سبب تدني ذي الصعوبات اضطراب العمليات، لا انخفاض الذكاء ولا ضعف الدافعية."],"src":"الدليل التنظيمي للتربية الخاصة (وزارة التعليم)، أهلية ذوي صعوبات التعلم","aka":["صعوبات التعلم","محك التباين","محك الاستبعاد","بطء التعلم","التأخر الدراسي"]},"ar.l08.id":{"k":"الفئات الخاصة","t":["Intellectual Disability","الإعاقة الفكرية"],"body":["في الأدبيات: انخفاض ملحوظ في الأداء العقلي العام (دون 70 تقريباً) **مع قصور في السلوك التكيفي** في فترة النمو. ويحدد الدليل التنظيمي للتربية الخاصة الأهلية بألا تزيد درجة الذكاء على **75 على مقياس وكسلر أو 69 على ستانفورد بينيه (الصورة الخامسة)** أو ما يعادلهما، مع **قصور في مجالين على الأقل** من المهارات التكيفية.","**الإعاقة الفكرية (العقلية)**: ذكاء **أقل من 70** مع قصور في **السلوك التكيفي** قبل سن 18."],"pts":["الشرطان معاً: انخفاض الذكاء وقصور التكيف.","التدريس: أهداف وظيفية وخطوات صغيرة وتكرار وتعزيز فوري."],"traps":["لا يُحكم بالإعاقة من اختبار ذكاء وحده؛ الدليل يمنع الاكتفاء بمقياس واحد."],"src":"الدليل التنظيمي للتربية الخاصة (وزارة التعليم)، أهلية ذوي العوق العقلي","aka":["الإعاقة الفكرية","الإعاقة العقلية","السلوك التكيفي"]},"ar.l08.autism":{"k":"الفئات الخاصة","t":["Autism Spectrum Disorder","اضطراب طيف التوحد"],"body":["قصور مستمر في التواصل والتفاعل الاجتماعي مع سلوكيات نمطية تتكرر ومقاومة لتغيير الروتين. ويوزع الدليل التنظيمي الخدمات بالشدة: البسيط يُدمج في مدارس التعليم العام مع **غرفة المصادر**، وما لا يمكن دمجه في الصف العام يُخدم في **فصول خاصة ملحقة** بمدارس التعليم العام، والمتوسط والشديد المصاحب لإعاقات أخرى في **مراكز التوحد ومعاهد التربية الفكرية**."],"pts":["بيئة منظمة ثابتة: روتين وجداول بصرية وحدود واضحة (التعلم المنظم).","تعليمات قصيرة من خطوة واحدة، وتنبيه مسبق قبل أي تغيير.","أفضل أسلوب لترتيب بيئته **التعلم المنظم** (TEACCH).","**التوحد (اضطراب طيف التوحد)**: قصور في **التواصل والتفاعل الاجتماعي**، وسلوكيات **نمطية متكررة**، و**مقاومة التغيير**، ويظهر قبل الثالثة."],"traps":["البيئة المناسبة منظمة ثابتة لا «غنية بالمثيرات المتغيرة»."],"src":"الدليل التنظيمي للتربية الخاصة (وزارة التعليم)، أهلية ذوي اضطراب طيف التوحد","aka":["التوحد","اضطراب طيف التوحد","التعلم المنظم"]},"ar.l08.iep":{"k":"التربية الخاصة","t":["Assessment & the IEP","التشخيص والخطة التربوية الفردية"],"body":["القياس والتشخيص يجمع المعلومات بأدوات رسمية وغير رسمية من مصادر متعددة بفريق متعدد التخصصات. والخطة التربوية الفردية وثيقة تصف الخدمات التربوية والمساندة التي يحتاجها الطالب، يعدها فريق في المدرسة ويراجعها دورياً."],"pts":["التشخيص **بعد موافقة ولي الأمر خطياً**، ويرد ولي الأمر خلال مدة لا تتجاوز **14 يوماً** من الإشعار الخطي.","**عدم الاكتفاء بنتائج مقياس واحد**، وحفظ سرية المعلومات، والملاحظة عند الحاجة لمدة فصل دراسي كامل.","عناصر الخطة: الأداء الحالي ← أهداف طويلة وقصيرة قابلة للقياس ← الخدمات ومسؤولوها ← المواعيد ← التقويم.","الفريق: قائد المدرسة، ومعلما التربية الخاصة والتعليم العام، والموجه الطلابي، والمختصون، وولي الأمر، والطالب قدر الإمكان."],"ex":["هدف قصير جيد: «يقرأ 20 كلمة من كلمات الصف بدقة 90% خلال 6 أسابيع»؛ و«يتحسن في القراءة» غير قابل للقياس."],"traps":["معلم الصف يلاحظ ويحيل ويشارك، ولا يشخص."],"src":"الدليل التنظيمي للتربية الخاصة (وزارة التعليم)، القياس والتشخيص","aka":["الخطة التربوية الفردية","الإحالة","لجنة الخطط التعليمية"]},"ar.l08.inclusion":{"k":"التربية الخاصة","t":["Inclusion & Universal Access","الدمج والبيئة الأقل تقييداً والمواءمات"],"body":["الدمج تعليم ذوي الإعاقة في مدارس التعليم العام مع الخدمات الخاصة، في **البيئة الأقل تقييداً**: أقرب مكان إلى الفصل العام يحقق احتياج الطالب (فصل عام مع معلم مستشار أو متجول ← غرفة المصادر ← فصل خاص ← معهد).","ويحدد **دليل الوصول الشامل 1444** أساليب تعديل المنهج: الحجم، والوقت، والمدخل، والمخرج، وصعوبة المفهوم، والدعم، والتوقعات، والمنهج البديل."],"pts":["**مواءمات الاختبار**: تغيير آلية التطبيق دون تغيير بنيته (مكان منفرد، خط عريض، وقت إضافي).","**تعديلات الاختبار**: تغيير بنيته نفسها (تبسيط الأسئلة، شروح إضافية، آلة حاسبة).","أنواع الدمج: **مكاني**، **اجتماعي**، **أكاديمي (جزئي أو كلي)**، و**شامل**."],"traps":["المواءمة تغير طريقة التطبيق، والتعديل يغير الاختبار."],"src":"دليل ومعايير الوصول الشامل لذوي الإعاقة في المنشآت التعليمية 1444هـ؛ الدليل التنظيمي للتربية الخاصة (وزارة التعليم)","aka":["الدمج","البيئة الأقل تقييداً","الوصول الشامل","غرفة المصادر"]},"ar.l08.gifted":{"k":"الموهوبون","t":["Gifted Students — 1447 Rules","الموهوبون: التعريف وفصولهم"],"body":["تعرّف **القواعد التنظيمية لفصول ومدارس الموهوبين 1447هـ** الموهوبين بأنهم من لديهم **استعدادات وقدرات فوق عادية أو أداء متميز عن أقرانهم** في مجال أو أكثر يقدره المجتمع، ويحتاجون رعاية لا يوفرها المنهج العادي. وتعرّف **الإثراء** بخبرات متنوعة متعمقة لا يوفرها المنهج، و**التلمذة** بتواصل الموهوب مع متخصصين وخبراء."],"pts":["فصول الموهوبين **عامة** (إشراف إدارة التعليم) أو **تخصصية** (مع جهة مشاركة).","الفصل من 15 إلى 20 طالباً، ويُغلق إذا قل عن 12 طالباً لسنتين متتاليتين.","القبول باجتياز **مقاييس معتمدة** مع **أكثر من أداة** (سجل المنجزات، المقابلة، استمارات الترشيح، توصية المعلم).","الإثراء رأسي (تعميق) أو أفقي (توسيع)."],"traps":["الكشف لا يكون بالتحصيل وحده.","مزيد من التمارين نفسها ليس إثراءً."],"src":"القواعد التنظيمية لفصول ومدارس الموهوبين 1447هـ (المواد 1، 4، 5، 9)","aka":["الموهبة","الموهوب","الإثراء","التلمذة"]},"ar.l08.renzulli":{"k":"الموهوبون","t":["Renzulli & Gagné","مفهوم الموهبة: رنزولي وجانييه"],"body":["عند **جوزيف رنزولي** ينشأ السلوك الموهوب من تقاطع **ثلاث حلقات**: قدرة فوق المتوسط، وإبداع، والتزام بالمهمة؛ فلا يكفي الذكاء وحده.","وفرّق **فرانسوا جانييه** بين **الموهبة** (قدرة فطرية غير مدربة) و**التفوق** (أداء مكتسب يتحقق حين تُنمّى الموهبة بالتدريب وعوامل الشخص والبيئة)."],"pts":["الالتزام بالمهمة عنصر دافعي: مثابرة طويلة في مجال يحبه.","عند جانييه: كل متفوق موهوب، وليس كل موهوب متفوقاً.","الموهوب أداء **متميز عن أقرانه**: **قدرة فوق المتوسط** + **إبداع** + **التزام بالمهمة**؛ وعند جانييه كل **متفوق موهوب**."],"traps":["التحصيل المرتفع ليس من حلقات رنزولي الثلاث.","جانييه هنا فرانسوا صاحب نموذج الموهبة، لا روبرت صاحب شروط التعلم."],"src":"Renzulli, The Three-Ring Conception of Giftedness؛ Gagné, DMGT","aka":["رنزولي","الحلقات الثلاث","جانييه","التفوق"]},"ar.l08.accel":{"k":"الموهوبون","t":["Acceleration","التسريع (التعجيل)"],"body":["التسريع أسلوب للاستجابة لتفوق الطلبة، وأشكاله: القبول المبكر في الصف الأول، والتسريع في المادة أو المحتوى (ومنه ضغط المنهج)، والترفيع إلى صف أعلى. ويطبقه **الدليل التنظيمي لنظام التسريع** في المرحلتين الابتدائية والمتوسطة."],"pts":["مرتان في المسيرة: من **الرابع إلى السادس الابتدائي**، ومن **الأول إلى الثالث المتوسط**.","الترشيح: درجة القطع في مقياس موهبة، و**97% فأكثر في كل مادة**، و**98% معدلاً عاماً** في المتوسطة، وموافقة ولي الأمر والطالب.","اجتياز اختبار التسريع: **75%** معدلاً عاماً و**50%** في كل مادة.","التسريع يغير مستوى الطالب أو زمنه، والإثراء يبقيه في صفه."],"traps":["التسريع ليس حذف مواد."],"src":"الدليل التنظيمي لنظام التسريع (وزارة التعليم)، البنود 1-6 و1-9","aka":["التسريع","التعجيل","ضغط المنهج"]},"ar.l08.diff":{"k":"التدريس","t":["Tomlinson — Differentiated Instruction","التعليم المتمايز"],"body":["عند **كارول آن توملينسون** يُنوَّع التعليم وفق **استعداد** الطلاب و**اهتماماتهم** و**أنماط تعلمهم** مع بقاء **الهدف واحداً**، فيمايز المعلم في المحتوى أو العملية أو المنتج أو بيئة التعلم، بمجموعات مرنة تتغير بحسب المهمة."],"pts":["الصيغة: هدف واحد + مسارات متعددة = وصول الجميع.","أدواته: المهام المتدرجة، والمراكز، وعقود التعلم، وخيارات المنتج.","يُمايَز **المحتوى** أو **العملية** أو **المنتج** أو **بيئة التعلم** وفق **استعداد** الطالب و**اهتماماته** و**نمطه**؛ و**هدف واحد** + **مسارات متعددة** بـ**مجموعات مرنة**."],"ex":["هدف واحد (شرح أسباب الصيام): مجموعة تلخص نصاً، وأخرى تملأ مخططاً بعد مقطع، وثالثة تعد ملصقاً، ثم يُقوَّم الجميع بالمعيار نفسه."],"traps":["التمايز ليس تصنيفاً دائماً حسب الذكاء ولا أهدافاً مختلفة."],"src":"Tomlinson, The Differentiated Classroom؛ المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.2","aka":["التعليم المتمايز","المجموعات المرنة"]},"ar.l09.pavlov":{"k":"السلوكية","t":["Pavlov — Classical Conditioning","بافلوف: الإشراط الكلاسيكي"],"body":["قرن إيفان بافلوف صوتاً محايداً بالطعام (مثير غير شرطي يستدعي اللعاب) مرات عدة، حتى صار الصوت وحده **مثيراً شرطياً** يستدعي **استجابة شرطية**. وعلى أساسه أثبت **واطسون** في تجربة الطفل ألبرت أن الخوف يُتعلم بالاقتران.","**بافلوف – الإشراط الكلاسيكي**: السلوكية تفسر التعلم بـ**الارتباط بين المثير والاستجابة**، والمتعلم **متلقٍ سلبي**. وفي الكلاسيكي المثير **يسبق** والاستجابة **لا إرادية**، وقلق القاعدة **مكتسبة (مشروطة)**: **مثير محايد** + **غير شرطي** ← **مثيراً شرطياً** ← **استجابة شرطية**."],"pts":["**الانطفاء**: تكرار المثير الشرطي دون غير الشرطي.","**الاسترجاع التلقائي**: عودة الاستجابة المنطفئة بعد راحة.","**التعميم**: الاستجابة لمثيرات مشابهة؛ **التمييز**: للمثير الأصلي فقط."],"ex":["خوف طالبة من قاعة الاختبار المقترنة بالرسوب يضعف حين تُعقد فيها أنشطة ناجحة آمنة مرة بعد مرة."],"traps":["قلق الاختبار استجابة مكتسبة لا فطرية."],"src":"Pavlov, Conditioned Reflexes؛ Watson & Rayner (1920)","aka":["بافلوف","الإشراط الكلاسيكي","المثير الشرطي","واطسون"]},"ar.l09.skinner":{"k":"السلوكية","t":["Skinner — Operant Conditioning","سكنر: الإشراط الإجرائي"],"body":["السلوك الإجرائي عند ب. ف. سكنر يصدر طوعاً ثم **تتحكم فيه نتائجه** (صندوق سكنر). مفتاحه أربع خانات: التعزيز يزيد السلوك والعقاب يقلله، والموجب إضافة والسالب إزالة.","**التعزيز الموجب** إضافة سارّ، و**التعزيز السالب** إزالة منفّر، و**العقاب الموجب** إضافة منفّر، و**العقاب السالب** سحب معزّز؛ و**التعزيز بعد الاستجابة** هو مفتاح التعلم."],"pts":["**تعزيز سالب**: إزالة منفّر فيزيد السلوك (إعفاء من واجب لمن أنجز).","**عقاب سالب**: سحب سار فيقل السلوك؛ ومنه تكلفة الاستجابة والإقصاء.","**الانطفاء الإجرائي**: إيقاف التعزيز فيتلاشى السلوك.","**التشكيل**: تعزيز التقريبات المتتابعة؛ و**مبدأ بريماك**: النشاط المحبب يعزز غير المحبب.","تطبيقاته: التعليم المبرمج، وتعديل السلوك، والاقتصاد الرمزي."],"traps":["التعزيز السالب ليس عقاباً؛ كل تعزيز يزيد السلوك.","إجابات صحيحة بلا تعزيز ثم تراجع المشاركة = انطفاء إجرائي لا إشراط كلاسيكي."],"src":"Skinner, Science and Human Behavior؛ المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار 5.3","aka":["سكنر","الإشراط الإجرائي","التعزيز السالب","العقاب السالب","التشكيل","مبدأ بريماك"]},"ar.l09.schedules":{"k":"السلوكية","t":["Schedules of Reinforcement","جداول التعزيز"],"body":["**المستمر** (بعد كل استجابة) أسرع تعلماً وأسرع انطفاءً، و**المتقطع** أثبت. والمتقطع أربعة: نسبة (عدد استجابات) أو فترة (زمن)، ثابتة أو متغيرة."],"pts":["**نسبة ثابتة**: نجمة كل 5 إجابات صحيحة.","**نسبة متغيرة**: بعد عدد غير منتظم؛ أعلى أداء وأقوى مقاومة للانطفاء.","**فترة ثابتة**: اختبار كل أسبوع؛ يرتفع الأداء قبيل الموعد.","**فترة متغيرة**: اختبارات قصيرة مفاجئة؛ أداء منتظم."],"traps":["الاختبار المفاجئ فترة متغيرة لا نسبة متغيرة؛ المعيار الزمن."],"src":"Ferster & Skinner, Schedules of Reinforcement","aka":["جداول التعزيز","جدول النسبة المتغيرة","التعزيز المتقطع"]},"ar.l09.bandura":{"k":"التعلم الاجتماعي","t":["Bandura — Observational Learning","باندورا: التعلم بالملاحظة"],"body":["أثبت ألبرت باندورا في تجربة **دمية بوبو** أن الأطفال يقلدون نموذجاً شاهدوه دون تعزيز مباشر. وتقوم نظريته على **الحتمية التبادلية** بين الفرد وسلوكه وبيئته، فهي جسر بين السلوكية والمعرفية."],"pts":["المراحل: الانتباه ← الاحتفاظ ← الإنتاج ← الدافعية.","**التعزيز البديل**: رؤية النموذج يُكافأ تزيد السلوك؛ والتعزيز الذاتي رضا الفرد عن أدائه.","النماذج: حية، ورمزية (فيديو، قصة)، ولفظية.","**الانفصال الأخلاقي**: تبرير السلوك المؤذي، كتسمية الاعتداء «مزاحاً» (التهذيب اللفظي)."],"ex":["طالب يرى زميله يُكرَّم لأنه أعاد محفظة وجدها فيزداد حرصه على الأمانة: تعزيز بديل."],"traps":["النمذجة ملاحظة (باندورا)، والتشكيل تعزيز تقريبات (سكنر)."],"src":"Bandura, Social Foundations of Thought and Action","aka":["باندورا","النمذجة","التعزيز البديل","الحتمية التبادلية"]},"ar.l09.gestalt":{"k":"المعرفية","t":["Gestalt — Insight","الجشطلت والاستبصار"],"body":["أسس **فرتهايمر** الجشطلت مع كوفكا وكوهلر، وشعارها: الكل أكبر من مجموع أجزائه. وفي تجربة **كوهلر** ركّب القرد عصوين فجأة ليجلب الموز: **الاستبصار**، أي إدراك مفاجئ للعلاقات بإعادة تنظيم الموقف."],"pts":["قوانين الإدراك: الشكل والأرضية، والتقارب، والتشابه، والإغلاق، والاستمرار.","الاستبصار مفاجئ ويبقى طويلاً وينتقل إلى مواقف مشابهة."],"traps":["الاستبصار مفاجئ، والمحاولة والخطأ (ثورندايك) تدريجي."],"src":"Köhler, The Mentality of Apes","aka":["الجشطلت","الاستبصار","كوهلر"]},"ar.l09.ausubel":{"k":"المعرفية","t":["Ausubel — Meaningful Reception Learning","أوزوبل: التعلم ذو المعنى"],"body":["أهم عامل في التعلم عند ديفيد أوزوبل **ما يعرفه المتعلم مسبقاً**: التعلم ذو المعنى يحدث حين تُربط المعلومة الجديدة بالبنية المعرفية، والحفظ المنفصل تعلم صم. ويمهد للدرس بـ**المنظم المتقدم**: مادة أعم وأشمل تُعرض قبله."],"pts":["المنظم المتقدم **شارح** (لغير المألوف) أو **مقارن** (يربط بالمألوف).","**التمايز التدريجي**: من العام إلى الخاص؛ و**التوفيق التكاملي**: ربط المفاهيم وإزالة التعارض.","أنماط التعلم: (استقبال/اكتشاف) × (ذو معنى/صم)."],"ex":["مقطع عن تجاذب المغناطيس وتنافره قبل درس الشحنات الكهربائية: منظم متقدم مقارن."],"traps":["المنظم المتقدم يربط معرفياً قبل الدرس، والتهيئة الحافزة تثير الانتباه فقط."],"src":"Ausubel, The Psychology of Meaningful Verbal Learning","aka":["أوزوبل","المنظم المتقدم","التعلم ذو المعنى"]},"ar.l09.bruner":{"k":"المعرفية","t":["Bruner — Discovery Learning","برونر: التعلم بالاكتشاف"],"body":["جيروم برونر رأى أن الطالب يتعلم أعمق حين **يكتشف** المبدأ بنفسه، والأنسب صفياً الاكتشاف الموجه. ويمر تمثيل المعرفة بثلاث مراحل: **عملي** (بالأشياء) ← **أيقوني** (بالصور) ← **رمزي** (باللغة والرموز)."],"pts":["**المنهج الحلزوني**: المفاهيم تعود عبر الصفوف بعمق متزايد.","يمكن تعليم أي موضوع لأي طفل بصورة أمينة تناسب تفكيره.","شارك في صياغة مفهوم السقالات مع وود وروس."],"ex":["مكعبات تبني مستطيلات (عملي) ← رسمها على ورق مربعات (أيقوني) ← «المساحة = الطول × العرض» (رمزي)."],"traps":["المنهج الحلزوني لبرونر، والمنظم المتقدم لأوزوبل."],"src":"Bruner, The Process of Education","aka":["برونر","التعلم بالاكتشاف","المنهج الحلزوني"]},"ar.l09.memory":{"k":"معالجة المعلومات","t":["Information Processing & Memory","معالجة المعلومات والذاكرة"],"body":["نموذج **أتكنسون وشيفرين**: ذاكرة **حسية** (سعة كبيرة ومدة قصيرة جداً) ← **عاملة/قصيرة المدى** (نحو 7±2 وحدات، 15–30 ثانية) ← **طويلة المدى** (غير محدودة). والانتباه بوابة الانتقال، والعمليات: ترميز ← تخزين ← استرجاع."],"pts":["النقل للطويلة: التسميع، والتجميع (التقطيع)، والتفصيل بالربط، والتنظيم، والوسائل التذكرية.","التداخل **القبلي**: القديم يعيق الجديد؛ و**البعدي**: الجديد يعيق القديم.","**الترميز المزدوج** (بايفيو): لفظي + بصري أقوى؛ و**الحمل المعرفي** (سويلر): لا تُثقل الذاكرة العاملة.","التدريب الموزع أفضل للاحتفاظ من المكثف."],"ex":["«055 – 123 – 4567» أسهل حفظاً من «0551234567»: تجميع يقلل الوحدات."],"traps":["اسم التداخل بحسب اتجاه الإعاقة: الجديد يعيق القديم = بعدي."],"src":"Atkinson & Shiffrin (1968)؛ Miller (1956)؛ Paivio؛ Sweller","aka":["معالجة المعلومات","الذاكرة العاملة","التداخل البعدي","الترميز المزدوج"]},"ar.l09.adapt":{"k":"البنائية","t":["Piaget — Assimilation & Accommodation","بياجيه: التمثل والمواءمة والموازنة"],"body":["ينظم العقل خبراته في **مخططات (سكيما)**. و**التمثل** إدخال الخبرة الجديدة في مخطط قائم دون تغييره، و**المواءمة** تعديل المخطط أو بناء جديد حين لا تناسبه الخبرة. و**الموازنة** تستعيد التوازن بعد **اختلال التوازن** (الحيرة) فيرتقي التفكير.","**بياجيه (البنائية المعرفية)**: التعلم **تكيّف** = **تمثل** + **مواءمة**، تحركه **الموازنة** بعد **اختلال التوازن**؛ والمتعلم **يبني** معرفته على **خبراته السابقة**."],"pts":["اختلال التوازن فرصة تعلم؛ لذلك يطرح المعلم مواقف محيرة تناسب المرحلة."],"ex":["طفل يسمي الخفاش طائراً (تمثل)، ثم يعرف أنه يرضع صغاره فيحتار (اختلال)، فيعدل: «ليس كل ما يطير طائراً» (مواءمة)."],"traps":["التمثل إضافة إلى مخطط قائم، والمواءمة تعديله.","الموازنة عملية منظمة لا مرحلة نمو."],"src":"Piaget, The Origins of Intelligence in Children","aka":["التمثل","المواءمة","الموازنة","المخطط","السكيما"]},"ar.l09.vygotsky":{"k":"البنائية","t":["Vygotsky — ZPD & Scaffolding","فيجوتسكي: منطقة النمو القريب"],"body":["التعلم عند ليف فيجوتسكي **اجتماعي أولاً ثم فردي**، واللغة أداة التفكير، والحديث الذاتي وسيلة لتنظيمه. و**منطقة النمو القريب** المسافة بين ما ينجزه الطالب **وحده** وما ينجزه **بمساعدة** الأكثر خبرة؛ والتدريس الفعال يستهدفها.","**فيجوتسكي (البنائية الاجتماعية)**: **اجتماعي أولاً**، و**اللغة أداة التفكير**، و**الحديث الذاتي** تطور لا عيب؛ و**منطقة النمو القريب (المجاور)** بين **وحده** و**بمساعدة**، و**السقالات (الدعائم)** تُسحب."],"pts":["**السقالات**: دعم مؤقت متدرج (نموذج، تلميح، سؤال) يُسحب مع التقدم؛ صاغ المصطلح وود وبرونر وروس.","تطبيقاته: التعلم التعاوني، والأقران، والتدريس التبادلي."],"traps":["منطقة النمو القريب ما يُنجز بالمساعدة لا وحده.","الدعم الدائم ليس سقالة؛ السقالة تُسحب."],"src":"Vygotsky, Mind in Society؛ Wood, Bruner & Ross (1976)","aka":["فيجوتسكي","منطقة النمو القريب","السقالات","الحديث الذاتي"],"ex":["طالبة تعجز وحدها عن كتابة فقرة، وتنجح ببدايات جمل وأسئلة توجيهية تُسحب تدريجياً: سقالات داخل منطقة النمو القريب."]},"ar.l10.maslow":{"k":"الدافعية","t":["Maslow — Hierarchy of Needs","ماسلو: هرم الحاجات"],"body":["رتب أبراهام ماسلو الحاجات في هرم لا تبرز فيه الحاجة الأعلى حتى تُشبع الأدنى: **فسيولوجية ← أمن ← انتماء ← تقدير ← تحقيق الذات**. وفي الصورة السباعية تُضاف **المعرفية** ثم **الجمالية** قبل تحقيق الذات."],"pts":["الدنيا حاجات نقص، والعليا حاجات نمو.","الطالب الجائع أو الخائف: ابدأ بالحاجة الدنيا قبل الأكاديمية."],"ex":["طالب يتعرض للتنمر: يبدأ المعلم بالأمن (إيقاف التنمر وإبلاغ الإدارة) ثم الانتماء (زميل مرافق) قبل حوافز الدرجات."],"traps":["المعرفية والجمالية قبل تحقيق الذات لا بعده."],"src":"Maslow, Motivation and Personality","aka":["ماسلو","هرم الحاجات","تحقيق الذات"]},"ar.l10.weiner":{"k":"الدافعية","t":["Weiner — Attribution & Learned Helplessness","واينر: العزو، والعجز المتعلم"],"body":["يدرس برنارد واينر تفسير الطالب لأسباب نجاحه وفشله على ثلاثة أبعاد: **الموقع** (داخلي/خارجي)، و**الثبات**، و**القابلية للضبط**. والعزو السيئ حين يتكرر يقود إلى **العجز المتعلم** (سليجمان): التوقف عن المحاولة رغم القدرة.","الأبعاد: **الموقع** و**الثبات** و**الضبط**؛ و**القدرة** داخلي ثابت، و**الجهد** متغير قابل للضبط، و**صعوبة المهمة** خارجي ثابت، و**الحظ** خارجي متغير. فيوجّه المعلم إلى **الجهد والاستراتيجية**، و**الإحباط** غير **العجز المتعلم** (سليجمان)."],"pts":["**القدرة**: داخلية ثابتة غير قابلة للضبط.","**الجهد**: داخلي متغير قابل للضبط؛ أفضل عزو للفشل.","**صعوبة المهمة**: خارجية ثابتة؛ **الحظ**: خارجي متغير.","الإحباط انفعال مؤقت، والعجز المتعلم توقف عن المحاولة.","**واينر – العزو**: عزو الفشل إلى **نقص الجهد** يدفع للمحاولة، وإلى **ضعف القدرة** يولّد الإحباط والعجز."],"traps":["عزو الفشل إلى القدرة يحبط، وإلى الجهد يحفّز."],"src":"Weiner, An Attributional Theory of Motivation and Emotion؛ Seligman, Helplessness","aka":["واينر","نظرية العزو","العزو","العجز المتعلم"]},"ar.l10.selfeff":{"k":"الدافعية","t":["Bandura — Self-Efficacy","الكفاءة الذاتية"],"body":["اعتقاد الفرد بقدرته على إنجاز **مهمة محددة** بنجاح (ألبرت باندورا). تؤثر في اختيار المهام والجهد والمثابرة والقلق، وتختلف عن تقدير الذات العام."],"pts":["مصادرها: **خبرات الإتقان** (أقواها)، والخبرات البديلة، والإقناع اللفظي، والحالة الفسيولوجية والانفعالية.","تُبنى بمهام متدرجة تضمن نجاحاً مبكراً ونماذج من الأقران."],"ex":["طالب يخاف الإلقاء: جملتان أمام مجموعته، ثم دقيقة أمام نصف الفصل، ثم عرض كامل."],"traps":["الكفاءة الذاتية خاصة بالمهمة وليست تقدير الذات العام."],"src":"Bandura, Self-Efficacy: The Exercise of Control","aka":["الكفاءة الذاتية"]},"ar.l10.achieve":{"k":"الدافعية","t":["Achievement Motivation & Yerkes–Dodson","دافع الإنجاز وقانون يركس–دودسون"],"body":["صاحب دافع الإنجاز المرتفع (ماكليلاند وأتكنسون) يفضل المهام **متوسطة الصعوبة**. وقانون **يركس–دودسون**: العلاقة بين الاستثارة (القلق) والأداء منحنى مقلوب؛ الأداء الأفضل عند استثارة **متوسطة**، والمهام الصعبة تحتاج استثارة أقل."],"pts":["**توجه الإتقان** (يسعى للتعلم) أفضل من **توجه الأداء** (يسعى للظهور).","**العقلية النامية** (دويك): الذكاء ينمو بالجهد؛ ومدح الجهد والاستراتيجية يبنيها."],"traps":["الأداء الأفضل عند قلق متوسط لا عند انعدامه."],"src":"McClelland؛ Atkinson (1957)؛ Dweck, Mindset؛ Yerkes & Dodson (1908)","aka":["دافع الإنجاز","قانون يركس–دودسون","توجه الإتقان","العقلية النامية"]},"ar.l10.factor":{"k":"الذكاء","t":["Factor Theories of Intelligence","النظريات العاملية في الذكاء"],"body":["**سبيرمان**: عامل عام (g) في كل الأنشطة وعوامل خاصة (s). **ثيرستون**: سبع قدرات أولية. **جيلفورد**: بنية العقل (عمليات × محتوى × نواتج = 120 ثم 180 قدرة) وصاحب التمييز بين التقاربي والتباعدي. **كاتل**: ذكاء سائل ومتبلور."],"pts":["قدرات ثيرستون: فهم لفظي، طلاقة لفظية، عددية، مكانية، ذاكرة، سرعة إدراكية، استدلال.","**السائل**: حل المشكلات الجديدة؛ يتراجع مع العمر. **المتبلور**: معارف مكتسبة؛ يزداد.","نسبة الذكاء = العمر العقلي ÷ الزمني × 100 (بينيه للعمر العقلي)؛ عقلي 10 وزمني 8 = 125."],"traps":["المتبلور يزداد مع العمر والسائل يتراجع."],"src":"Spearman (1904)؛ Thurstone, Primary Mental Abilities؛ Guilford, The Nature of Human Intelligence؛ Cattell (1963)","aka":["سبيرمان","ثيرستون","جيلفورد","بنية العقل","كاتل","الذكاء السائل","الذكاء المتبلور"]},"ar.l10.sternberg":{"k":"الذكاء","t":["Sternberg — Triarchic Theory","ستيرنبرغ: الذكاء الثلاثي"],"body":["رأى روبرت ستيرنبرغ أن الاختبارات التقليدية تقيس جانباً واحداً، واقترح ثلاثة أنواع متكاملة يسميها مجتمعة الذكاء الناجح."],"pts":["**التحليلي**: التحليل والمقارنة؛ ما تقيسه الاختبارات المدرسية.","**الإبداعي**: التعامل مع الجديد وتوليد الأفكار.","**العملي**: التكيف وحل مشكلات الحياة؛ «ذكاء الشارع»."],"ex":["طالب متوسط في الاختبار اللفظي يدير مقصف المدرسة بنجاح: ذكاء عملي."],"traps":["الثلاثي لستيرنبرغ لا يُخلط بذكاءات جاردنر الثمانية."],"src":"Sternberg, Beyond IQ","aka":["ستيرنبرغ","الذكاء الثلاثي","الذكاء العملي"]},"ar.l10.meta":{"k":"التفكير","t":["Flavell — Metacognition","ما وراء المعرفة"],"body":["**التفكير في التفكير** (جون فلافل): وعي الفرد بعملياته المعرفية والتحكم فيها بثلاث مهارات: **التخطيط** قبل المهمة، و**المراقبة** أثناءها، و**التقويم** بعدها.","**التفكير في التفكير**: **التخطيط** ← **المراقبة** ← **التقويم**."],"pts":["أسئلتها: ما خطتي؟ هل فهمت ما قرأت؟ كيف وصلت إلى الإجابة؟ هل هذه أفضل طريقة؟","استراتيجياتها: التفكير بصوت مسموع، وجدول KWL، والتقويم الذاتي، والمذكرات التأملية."],"traps":["القراءة الصامتة والحفظ مهارات معرفية؛ مراجعة الفهم أثناء القراءة ما وراء معرفية."],"src":"Flavell, Metacognition and Cognitive Monitoring (1979)","aka":["ما وراء المعرفة","التفكير في التفكير"]},"ar.l10.creative":{"k":"الإبداع","t":["Creative Thinking — Guilford & Torrance","التفكير الإبداعي ومكوناته"],"body":["أساس الإبداع عند **جيلفورد** التفكير التباعدي، ووضع **تورانس** اختبارات تقيس مكوناته: **الطلاقة** (عدد الأفكار)، و**المرونة** (تنوع فئاتها)، و**الأصالة** (ندرتها)، و**الإفاضة** (تفاصيلها)، ومعها **الحساسية للمشكلات**.","**التفكير الإبداعي** نشاط عقلي هادف يُنتج حلولاً **جديدة وأصيلة**، أساسه **التفكير التباعدي**؛ ومراحل والاس: **الإعداد** ← **الاحتضان/الكمون** ← **الإلهام/الإشراق** ← **التحقق**."],"pts":["مراحل والاس: إعداد ← احتضان ← إلهام ← تحقق.","العصف الذهني (أوزبورن): الكم قبل الكيف، وإرجاء الحكم، والترحيب بالغريب، والبناء على أفكار الآخرين.","معوقات: الخوف من الخطأ، والنقد المبكر، والجمود الذهني."],"traps":["الإلهام بعد الاحتضان لا قبله.","نقد الأفكار أثناء طرحها يخالف قواعد العصف الذهني."],"src":"Guilford (1950)؛ Torrance Tests of Creative Thinking؛ Wallas, The Art of Thought؛ Osborn, Applied Imagination","aka":["التفكير الإبداعي","الطلاقة","المرونة","الأصالة","الإفاضة","العصف الذهني"]},"ar.l10.debono":{"k":"برامج التفكير","t":["de Bono — Six Hats & CoRT","ديبونو: القبعات الست وكورت"],"body":["إدوارد ديبونو دعا إلى تعليم التفكير مباشرة، وصاغ **التفكير الجانبي** (الخروج من الأنماط المعتادة). والقبعات الست تفصل أنماط التفكير فيلبس الجميع القبعة نفسها في الوقت نفسه، وبرنامج **كورت** يعلم مهارات التفكير بأدوات مثل PMI."],"pts":["**البيضاء** حقائق، **الحمراء** مشاعر وحدس، **السوداء** حذر ومخاطر.","**الصفراء** فوائد، **الخضراء** إبداع وبدائل، **الزرقاء** ضبط التفكير والخلاصة.","PMI: إيجابيات وسلبيات ونقاط مثيرة للاهتمام.","تمييز: «ستفشل لأن…» = **سوداء**، «أشعر أنها لا تعجبني» = **حمراء**، «ما الأرقام؟» = **بيضاء**، «لنلخص ما توصلنا إليه» = **زرقاء**؛ وتفصل **الأنا** عن الفكرة."],"traps":["«أشعر أنها ستفشل» بلا تبرير = حمراء لا سوداء.","الزرقاء إدارة التفكير نفسه."],"src":"de Bono, Six Thinking Hats؛ CoRT Thinking Program","aka":["ديبونو","القبعات الست","برنامج كورت","التفكير الجانبي"]},"ar.l11.terms":{"k":"مداخل التدريس","t":["Approach, Strategy, Method, Style","المدخل والاستراتيجية والطريقة والأسلوب"],"body":["المدخل يحدد **لماذا** نعلّم بهذه الصورة، والاستراتيجية **الخطة**، والطريقة **الإجراء**، والأسلوب **البصمة الشخصية**. ونموذج التدريس تصور نظري لخطواته، وصنّف جويس وويل النماذج في أربع عائلات."],"pts":["**المدخل**: إطار فكري (البنائي، القصصي، البيئي، التكاملي).","**الاستراتيجية**: خطة شاملة مرنة تضم عدة طرق وأساليب.","**الطريقة**: إجراءات يشترك فيها المعلمون (المحاضرة، المناقشة، الاكتشاف)؛ و**الأسلوب** طابع شخصي في تنفيذها.","**التقنية أو الوسيلة**: أداة تخدم الطريقة، وليست طريقة.","عائلات جويس وويل: معالجة المعلومات، والاجتماعية، والشخصية، والسلوكية."],"ex":["معلمة تتبنى المدخل البنائي، فتختار استراتيجية دورة التعلم، وتنفذ الاستكشاف بطريقة الاكتشاف الموجه، بأسلوبها الهادئ في طرح الأسئلة."],"traps":["معلمان بالطريقة نفسها وأداء مختلف = **أسلوبان**.","السبورة الذكية أو المقطع المرئي **تقنية** لا طريقة."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار السابع؛ جويس وويل، نماذج التدريس","aka":["المدخل","الاستراتيجية","الطريقة","الأسلوب"]},"ar.l11.approaches":{"k":"مؤشر 7.1","t":["Four Teaching Approaches","المداخل الأربعة للتدريس"],"body":["يطلب مؤشر 7.1 أن يحدد المعلم **الأسس النظرية** للمداخل العامة للتدريس، ويبرز أهميتها في تحفيز المتعلمين وتنمية مهاراتهم وتعديل سلوكهم وتنمية مهاراتهم الاجتماعية."],"pts":["**السلوكي** (سكنر): سلوك ظاهر، وتحليل المهمة، وتعزيز فوري؛ نماذجه الإتقان والتعليم المباشر والمبرمج.","**المعرفي** (الجشطلت، بياجيه، برونر، أوزوبل): تفكير واكتشاف؛ نماذجه الاكتشاف والاستقصاء والمنظم المتقدم.","**الإنساني** (روجرز، ماسلو): الوعي بالذات والاستقلالية والمسؤولية؛ نموذجه التدريس غير الموجه.","**الاجتماعي** (باندورا، فيجوتسكي): التفاعل والنمذجة؛ نماذجه التعاوني ولعب الأدوار والتقصي الجماعي.","**نمذجة السلوك**: المعلم أو زميل يؤدي السلوك المرغوب ليحاكيه الطلاب، مع تعزيز من يتقنه.","**المدخل الإنساني (الشخصي)** يعنى **بالجوانب الوجدانية والشخصية** ويشجع **الاستقلالية المنتجة** و**الإحساس بالمسؤولية**؛ ونموذجه **التدريس غير الموجه** (روجرز): المعلم ميسّر يتقبل الطالب ويصغي له بتعاطف، ويشاركه تحديد أهدافه وتقويم تقدمه في مناخ آمن."],"ex":["«يُجلس المعلم الطالب بجوار زميل متقن ليحاكيه» = اجتماعي؛ «يترك الطالب يختار موضوع بحثه ويقوّم تقدمه بنفسه» = إنساني."],"traps":["التدريس غير الموجه **لروجرز** ومدخله **إنساني**.","النمذجة **اجتماعي** (باندورا)، والاكتشاف **معرفي** (برونر)."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، مؤشر 7.1 لرتبة الممارس","aka":["المدخل السلوكي","المدخل المعرفي","المدخل الإنساني","المدخل الاجتماعي"]},"ar.l11.induct":{"k":"طرق العرض","t":["Inductive & Deductive Methods","الاستقراء والاستنباط"],"body":["الاستقراء **من الجزء إلى الكل**: أمثلة يلاحظها الطالب ثم يستنتج القاعدة. والاستنباط **من الكل إلى الجزء**: قاعدة يعرضها المعلم ثم تُطبق على أمثلة. وجمع هربارت الاتجاهين في خمس خطوات: التمهيد، العرض، الربط، الاستنتاج، التطبيق."],"pts":["الاستقراء يناسب بناء **المفاهيم والتعميمات** ويبقى أثره أطول، لكنه أبطأ.","الاستنباط أسرع ويناسب التدريب على **تطبيق القاعدة**، لكنها قد تُنسى.","التعلم في الطرق المباشرة (الإلقاء والعرض) **استقبالي**.","الاستقراء يربط **النظرية بالتطبيق** ويبذل فيه الطالب جهداً ويصلح للمجموعات الكبيرة، وعيبه طول الوقت؛ والاستنباط سريع لكن يقل فيه الدافع."],"traps":["كلمة «يستنتج» لا تعني الاستنباط؛ استنتاج القاعدة من الأمثلة **استقراء**.","الطريقة الهربارتية تبدأ **بالتمهيد** لا بالعرض."],"src":"مراجع طرق التدريس العامة (الطريقة الهربارتية الاستدلالية)","aka":["الاستقراء","الاستنباط","الطريقة الهربارتية"],"ex":["معلم يكتب «كتبَ الطالبُ – حضرَ المعلمُ – نجحَ المجتهدُ» ويسأل عن حركة آخر الكلمة بعد الفعل حتى يستنتج الطلاب أن الفاعل مرفوع: هذا استقراء. ولو بدأ بالقاعدة ثم طلب أمثلة لكان استنباطاً."]},"ar.l11.discovery":{"k":"المدخل المعرفي","t":["Discovery Learning — Bruner","التعلم بالاكتشاف (برونر)"],"body":["يرى برونر أن ما يصل إليه الطالب بجهده أبقى مما يُعطى له جاهزاً؛ فيعرض المعلم مواد وأسئلة ويترك الطالب ينظم المعلومات حتى يصل إلى المفهوم. والاستقصاء أوسع منه: يصوغ الطالب سؤاله ويجمع الأدلة ويفسرها كالباحث."],"pts":["**الموجه**: المعلم يحدد المشكلة والأدوات والأسئلة؛ يناسب الصغار.","**شبه الموجه**: المعلم يحدد المشكلة مع بعض التوجيهات.","**الحر**: الطالب يحدد المشكلة والأدوات والإجراءات.","من أفكار برونر أيضاً **المنهج الحلزوني**."],"ex":["معلمة تعطي الطالبات مغناطيساً وأشياء متنوعة وتسأل: ما الذي ينجذب؟ وما المشترك بينها؟ حتى يصلن إلى أنه يجذب بعض الفلزات كالحديد: اكتشاف موجه."],"traps":["في **الحر** يحدد الطالب الأدوات والإجراءات، وفي **الموجه** يحددها المعلم.","الاكتشاف ينتهي **بمفهوم** لا بمنتج."],"src":"برونر، التعلم بالاكتشاف؛ المعايير التربوية العامة، مؤشر 7.1 (المدخل المعرفي)","aka":["الاكتشاف","التعلم بالاكتشاف","الاستقصاء"]},"ar.l11.problem":{"k":"طرق التدريس","t":["Problem Solving — Dewey","حل المشكلات (ديوي)"],"body":["جعل ديوي التفكير العلمي طريقة تدريس: موقف غامض فيه **هدف** و**مانع**، يتجاوزه الطالب بخطوات منظمة فيحدث **التعلم**."],"pts":["الخطوات: الشعور بالمشكلة ← تحديدها ← جمع البيانات ← وضع الفروض ← اختبارها ← النتيجة والتعميم.","**الفرض** تفسير مؤقت يُختبر بالأدلة.","المشكلات **محددة البنية** و**مفتوحة البنية**؛ والثانية أساس التعلم القائم على المشكلات.","**المشكلة** موقف غامض يحتوي **مانعاً** و**هدفاً** ويؤدي إلى **تعلم**."],"traps":["الخطوة الأولى **الشعور بالمشكلة**، والتحديد ثانية.","حل المشكلات لديوي، والمشروعات لتلميذه **كلباترك**."],"src":"ديوي، كيف نفكر؛ المعايير التربوية العامة، المعيار السابع","aka":["حل المشكلات"]},"ar.l11.project":{"k":"طرق التدريس","t":["Project Method — Kilpatrick","طريقة المشروعات (كلباترك)"],"body":["طوّر كلباترك، تلميذ ديوي، طريقة المشروعات: عمل هادف ممتد يختاره الطلاب ويخططونه وينفذونه، وينتهي **بمنتج ملموس** يُعرض ويُقوَّم. وذكر دليل المعلم في التعليم الإلكتروني 1447 «التعلم الإلكتروني القائم على المشاريع» ضمن الاستراتيجيات المقترحة."],"pts":["الخطوات: اختيار ← تخطيط ← تنفيذ ← تقويم، ثم كتابة **تقرير**.","أنواعه عند كلباترك: إنشائية، واستمتاعية، ولحل مشكلة، ولكسب مهارة.","فردي أو جماعي، والمعلم مرشد ومتابع."],"traps":["انتهى العمل **بمنتج** = مشروع؛ انتهى **بمفهوم** = اكتشاف."],"src":"كلباترك، طريقة المشروع؛ دليل المعلم في التعليم الإلكتروني، الإصدار الثاني 1447","aka":["طريقة المشروعات","المشروعات"]},"ar.l11.programmed":{"k":"المدخل السلوكي","t":["Programmed Instruction — Skinner","التعليم المبرمج"],"body":["تطبيق مباشر للإشراط الإجرائي عند سكنر: المادة **إطارات** صغيرة متدرجة، يستجيب الطالب في كل إطار فيعرف صحة إجابته فوراً (**تعزيز**)، ثم ينتقل **بخطوه الذاتي**. ومنه خرجت الحقائب والموديولات وعقود التعلم."],"pts":["**الخطية** (سكنر): مسار واحد للجميع.","**المتشعبة** (كراودر): عند الخطأ إطار علاجي ثم عودة.","**الفردي**: المهام نفسها لكل طالب منفرداً؛ **التفريدي**: مهام مختلفة بحسب الميول.","عيبه: لا ينمي التفاعل الاجتماعي ولا يناسب الأهداف الوجدانية."],"traps":["التعليم المبرمج **سلوكي**، لا معرفي.","المتشعب **لكراودر**، والخطي **لسكنر**."],"src":"سكنر، الإشراط الإجرائي والتعليم المبرمج","aka":["التعليم المبرمج"]},"ar.l11.coop":{"k":"الاستراتيجيات الاجتماعية","t":["Cooperative Learning — Johnson & Johnson","التعلم التعاوني"],"body":["التعلم التعاوني بنية تجعل نجاح الفرد مرتبطاً بنجاح المجموعة، وتجعل كل فرد مسؤولاً عن نصيبه. وإذا غاب أحد عناصره الخمسة عند جونسون وجونسون صار عملاً جماعياً تقليدياً."],"pts":["**الاعتماد الإيجابي المتبادل**: ننجح معاً أو نخفق معاً.","**المسؤولية الفردية**: يُقوَّم كل عضو على إسهامه.","**التفاعل وجهاً لوجه** و**المهارات الاجتماعية**.","**معالجة عمل المجموعة**: تقويم أدائها وتحسينه.","مجموعات **غير متجانسة** (4–6) بأدوار محددة."],"traps":["مجموعة ينجز فيها طالب واحد العمل كله تفتقد **المسؤولية الفردية**."],"src":"جونسون وجونسون، عناصر التعلم التعاوني","aka":["التعلم التعاوني"]},"ar.l11.jigsaw":{"k":"الاستراتيجيات الاجتماعية","t":["Jigsaw & STAD","جيكسو وفرق التحصيل"],"body":["في جيكسو (أرونسون) يُقسّم الدرس أجزاء، فيأخذ كل عضو في **المجموعة الأم** جزءاً، ويتعمق فيه مع أصحاب الجزء نفسه في **مجموعة الخبراء**، ثم يعود ليعلّمه لمجموعته. وفي فرق التحصيل STAD (سلافين) يُختبر كل طالب فردياً، وتُحسب نقاط الفريق من **مقدار تحسن** أعضائه."],"pts":["في جيكسو لا يكتمل الدرس إلا بكل الأجزاء، فيقوى الاعتماد المتبادل.","في STAD يرفع الطالب الأضعف نقاط فريقه إذا تحسّن."],"traps":["جيكسو = **مجموعات خبراء**؛ STAD = **اختبار فردي ودرجة فريق من التحسن**."],"src":"أرونسون (جيكسو)؛ سلافين (فرق التحصيل)","aka":["جيكسو","فرق التحصيل"],"ex":["معلمة تقسم درس «مناطق المملكة» أربعة أجزاء: تأخذ كل طالبة جزءاً، وتتعمق فيه مع صاحبات الجزء نفسه من المجموعات الأخرى، ثم تعود لتشرحه لمجموعتها الأم، ويُختم الدرس باختبار فردي."]},"ar.l11.conceptual":{"k":"التدريس البنائي","t":["Conceptual Change — Posner et al.","التغيير المفاهيمي"],"body":["التصورات البديلة أفكار كوّنها الطالب من خبرته اليومية تخالف العلم، وتقاوم التغيير لأنها تبدو له منطقية. واقترح بوسنر وزملاؤه أنه لا يستبدلها إلا بأربعة شروط."],"pts":["**عدم الرضا** عن التصور الحالي.","المفهوم الجديد **واضح**، و**معقول**، و**مثمر** يفسر مواقف جديدة.","الخطوات: كشف التصورات ← تناقض معرفي ← المفهوم العلمي ← التطبيق.","أدوات الكشف: اختبار تشخيصي ثنائي الشق، ومقابلة، وخرائط مفاهيم، وتوقع – لاحظ – فسّر.","خطوات التدريس: **كشف التصورات القبلية** ← **تناقض معرفي** بحدث يخالف التوقع ← المفهوم العلمي ← تطبيقه ← مقارنة الطالب بين تصوره القديم والجديد."],"traps":["إعادة الشرح دون إحداث **عدم الرضا** لا تغير التصور غالباً.","نموذج بوسنر للتصورات البديلة، لا للتعلم التعاوني."],"src":"بوسنر وزملاؤه، نموذج التغيير المفاهيمي؛ المعايير التربوية العامة، مؤشر 7.2","aka":["التغيير المفاهيمي","التغير المفاهيمي","التصورات البديلة","نموذج بوسنر"],"ex":["يتوقع الطلاب أن الكرة الحديدية تسقط أسرع من كرة بلاستيكية بالحجم نفسه، فيُسقطهما المعلم معاً فتصلان في وقت واحد تقريباً؛ المفاجأة تُحدث عدم الرضا، ثم يقدم المفهوم العلمي (توقع – لاحظ – فسّر)."]},"ar.l12.behav":{"k":"الأهداف","t":["Behavioral Objective — Mager","الهدف السلوكي ومكوناته"],"body":["عبارة تصف ما سيستطيع الطالب أداءه بعد الدرس بصورة تُرى وتُقاس. اشترط فيها روبرت ماجر سلوكاً ظاهراً، وشرطاً يُؤدى فيه، ومعياراً للإتقان. ويعدد دليل الاختبارات 2025 خصائص الهدف قبل بناء جدول المواصفات."],"pts":["يصف سلوك **الطالب** لا المعلم، و**الناتج** لا النشاط.","واضح لا يقبل إلا تفسيراً واحداً، و**بسيط** يتعلق بعملية واحدة.","فعله **قابل للملاحظة والقياس** (يعدد، يحل، يقارن)، لا «يفهم، يدرك، يعرف».","يشتمل على الحد الأدنى للأداء المقبول، وواقعي قابل للتحقيق."],"ex":["«أن يحدد الطالب **على خريطة صمّاء** (شرط) مواقع **خمس** مدن سعودية **على الأقل** (معيار)».","«أن يتعرف الطالب على أهمية الماء» فعلها غير قابل للقياس؛ وبعد التعديل: «أن يذكر الطالب ثلاث فوائد للماء دون الرجوع إلى الكتاب»."],"traps":["«أن يقرأ الطالب الدرس» نشاط لا ناتج.","«أن يعدد الطالب ويشرح أنواع الصخور» هدف مركب."],"src":"ماجر، صياغة الأهداف التعليمية؛ دليل الاختبارات: الأسس الفنية والعمليات الإجرائية 2025 (صياغة الأهداف بصورة سلوكية إجرائية)","aka":["الهدف السلوكي","الهدف الإجرائي"]},"ar.l12.smart":{"k":"الأهداف","t":["SMART Objectives","الأهداف الذكية SMART"],"body":["اختصار إنجليزي لخمس صفات يُفحص بها الهدف قبل اعتماده، يتقاطع مع شروط الهدف السلوكي ويضيف **الصلة** و**الإطار الزمني**."],"pts":["**S** محدد: سلوك واحد واضح.","**M** قابل للقياس: نعرف متى تحقق.","**A** قابل للتحقيق: يتحدى الطالب وهو في متناوله.","**R** وثيق الصلة بناتج التعلم والمعيار.","**T** محدد بزمن: نهاية الحصة أو الأسبوع."],"ex":["«أن يقرأ الطالب نصاً من 100 كلمة قراءة جهرية بأخطاء لا تزيد على 3 في نهاية الأسبوع الرابع»."],"traps":["هدف قابل للقياس لكنه مستحيل لمعظم الطلاب يخالف شرط **قابلية التحقيق**."],"src":"مراجع التخطيط للتدريس (معايير SMART)","aka":["SMART","الأهداف الذكية"]},"ar.l12.bloom":{"k":"المجال المعرفي","t":["Bloom's Taxonomy (1956)","تصنيف بلوم الأصلي"],"body":["نشر بلوم وزملاؤه عام 1956 تصنيفاً هرمياً لأهداف المجال المعرفي في ستة مستويات، كل مستوى يقوم على ما قبله. ويعتمده دليل الاختبارات 2025 في بناء جدول المواصفات."],"pts":["**المعرفة**: استرجاع حقائق ومصطلحات.","**الفهم**: تفسير وتلخيص وترجمة وإعطاء مثال؛ و**التطبيق**: استخدام القاعدة في موقف جديد.","**التحليل**: تفكيك إلى أجزاء وإدراك العلاقات.","**التركيب**: بناء جديد من الأجزاء؛ و**التقويم**: حكم بمعيار، وهو القمة.","الدنيا: تذكر وفهم وتطبيق؛ العليا: تحليل وتركيب وتقويم."],"traps":["في الأصلي القمة **التقويم**، وفي المعدل **الإبداع**."],"src":"بلوم وآخرون (1956)؛ دليل الاختبارات 2025 (تصنيف بلوم المعرفي)","aka":["تصنيف بلوم","بلوم"]},"ar.l12.revised":{"k":"المجال المعرفي","t":["Revised Taxonomy — Anderson & Krathwohl (2001)","التصنيف المعدل وبعد المعرفة"],"body":["جعل أندرسون وكراثوول التصنيف **ثنائي البعد**: بعد العمليات المعرفية (ستة أفعال، الإبداع في قمتها)، وبعد المعرفة (أربعة أنواع). والتقاؤهما يكوّن جدولاً من 24 خلية يُوصف فيه الهدف بفعله ونوع معرفته معاً."],"pts":["**حقائقية**: مصطلحات وتفاصيل (رمز عنصر، تاريخ حدث).","**مفاهيمية**: تصنيفات ومبادئ ونظريات (مفهوم الكثافة).","**إجرائية**: خطوات وطرائق ومتى تُستخدم (خطوات حل معادلة).","**ما وراء معرفية**: وعي الطالب بتفكيره واستراتيجياته (كيف أذاكر؟)."],"ex":["«أن يطبق الطالب خطوات القسمة المطولة» = تطبيق × معرفة إجرائية."],"traps":["«ما وراء المعرفي» نوع معرفة، وليس مستوى سابعاً."],"src":"أندرسون وكراثوول (2001)، التصنيف المعدل","aka":["التصنيف المعدل","بعد المعرفة"]},"ar.l12.verbs":{"k":"المجال المعرفي","t":["Action Verbs by Level","أفعال مستويات بلوم"],"body":["الفعل أسرع مفتاح للتصنيف، بشرط النظر إلى **المهمة كاملة**؛ فـ«اشرح» قد تكون تذكراً إذا كان الشرح محفوظاً حرفياً."],"pts":["**تذكر**: يعدد، يسمي، يعرّف. **فهم**: يشرح، يفسر، يلخص، يعطي مثالاً.","**تطبيق**: يحل، يستخدم، يحسب في موقف جديد.","**تحليل**: يقارن، يميز، يفكك، يبين السبب.","**تقويم**: يحكم، ينقد، يبرر، يفاضل بمعيار.","**إبداع (تركيب)**: يصمم، يقترح، يؤلف، يخطط."],"ex":["«أيهما أفضل للترشيد: المصابيح الموفرة أم إطفاء الأجهزة؟ برّر» تقويم؛ «صمّم ملصقاً لحملة الترشيد» إبداع."],"traps":["«يقارن» و«يميز» **تحليل** لا فهم.","«يقترح» **تركيب**، و«ينقد» **تقويم**."],"src":"دليل الاختبارات 2025 (الأفعال المرتبطة بمستويات بلوم)","aka":["أفعال بلوم"]},"ar.l12.krath":{"k":"المجال الوجداني","t":["Affective Domain — Krathwohl","المجال الوجداني (كراثوول)"],"body":["خمسة مستويات تقيس **درجة استدخال القيمة**: من الانتباه لها إلى أن تصير سمة ثابتة توجه السلوك."],"pts":["**الاستقبال**: الانتباه والإصغاء.","**الاستجابة**: المشاركة برضا والتطوع.","**التقييم**: تقدير القيمة وتبنيها والدفاع عنها.","**التنظيم**: ترتيب القيم في منظومة عند تعارضها.","**التميز بالقيمة (الوسم)**: القيمة جزء ثابت من الشخصية."],"ex":["طالب يسلّم محفظة وجدها (استجابة)، ثم يدافع عن الأمانة في نقاش (تقييم)، حتى يُعرف بين زملائه بالأمين (تميز بالقيمة).","«أن يشارك الطالب تطوعاً في حملة تنظيف الفصل» = استجابة."],"traps":["**التركيب** و**التقمص** ليسا من مستويات كراثوول.","«يقدّر جهود العلماء» هدف **وجداني**."],"src":"كراثوول وبلوم وماسيا، تصنيف الأهداف: المجال الوجداني","aka":["كراثوول","المجال الوجداني"]},"ar.l12.simpson":{"k":"المجال النفس‑حركي","t":["Psychomotor Domain — Simpson","المجال النفس‑حركي (سمبسون)"],"body":["تصنيف سمبسون أشهر تصنيفات المهارات الحركية بسبعة مستويات، تبدأ بالإحساس والملاحظة وتنتهي بابتكار أداء جديد. ويقابله ديف (التقليد ← المعالجة ← الدقة ← الترابط ← التطبيع) وهارو."],"pts":["**الإدراك الحسي** ← **الاستعداد** ← **الاستجابة الموجهة** (تقليد ومحاولة وخطأ).","**الآلية**: أداء بثقة وعادة.","**الاستجابة المعقدة**: أداء ماهر سريع دقيق.","**التكيف**: تعديل المهارة لموقف جديد؛ ثم **الإبداع**."],"ex":["طالب يقلد التصويب بتوجيه المعلم (استجابة موجهة)، ثم يصوب بثقة (آلية)، ثم يغير طريقته حين يتغير موقع المدافع (تكيف).","«أن يغسل يديه بالخطوات الصحيحة بإتقان دون تذكير» = آلية."],"traps":["**الإدراك والاستعداد** أدنى النفس‑حركي، و**الاستقبال والاستجابة** أدنى الوجداني.","**التطبيع** أعلى مستويات ديف لا سمبسون."],"src":"تصنيفات سمبسون وديف وهارو للمجال النفس‑حركي","aka":["سمبسون","المجال النفس‑حركي"]},"ar.l12.set":{"k":"مهارات التدريس","t":["Set Induction & Closure","التهيئة والغلق"],"body":["التهيئة دقائق تنقل الطالب إلى داخل الدرس: تجذب الانتباه، وتربط الجديد بالسابق، وتوضح ما سنفعله. والغلق يقابلها في آخر الحصة فيجمع الأفكار ويثبتها."],"pts":["**الحافزة**: تثير الاهتمام (سؤال مثير، قصة، تجربة مفاجئة).","**التوجيهية**: تربط بالسابق وتوجه الانتباه (قريبة من المنظم المتقدم عند أوزوبل).","**الانتقالية**: بين أجزاء الدرس؛ **التقويمية**: تتأكد من إتقان السابق قبل الانتقال.","**الغلق**: تلخيص وربط وتثبيت، كبطاقة خروج أو سؤال جامع."],"ex":["«تعلمنا أمس أن للهواء وزناً، واليوم نرى كيف يدفع الأجسام» تهيئة توجيهية؛ و«لماذا لم ينسكب الماء من الكوب المقلوب؟» تهيئة حافزة."],"traps":["التي **تربط بالسابق** توجيهية، والتي **تثير الاهتمام فقط** حافزة."],"src":"مراجع مهارات التدريس (التهيئة والغلق)","aka":["التهيئة","الغلق","التهيئة الحافزة","التهيئة التوجيهية"]},"ar.l12.gagne":{"k":"خطة الدرس","t":["Gagné's Nine Events of Instruction","أحداث التدريس التسعة (جانييه)"],"body":["رتب روبرت جانييه الحصة الفعالة في تسعة أحداث متتابعة تقابل عمليات التعلم الداخلية، فيظهر موقع كل عنصر من عناصر الخطة."],"pts":["1) جذب الانتباه 2) إخبار المتعلمين بالأهداف 3) استثارة التعلم السابق.","4) عرض المحتوى 5) توجيه التعلم.","6) استدعاء الأداء 7) تقديم التغذية الراجعة.","8) تقويم الأداء 9) تعزيز الاحتفاظ والانتقال."],"traps":["الحدث الأول **جذب الانتباه** لا عرض المحتوى.","التغذية الراجعة **بعد الأداء** وقبل التقويم."],"src":"جانييه، شروط التعلم","aka":["جانييه","أحداث التدريس التسعة"]},"ar.l12.feedback":{"k":"التقويم من أجل التعلم","t":["Feedback","التغذية الراجعة"],"body":["معلومات يتلقاها الطالب عن أدائه تبين ما أحسن فيه، وما يحتاج إلى تحسين، وكيف. ومن مرتكزات لائحة تقويم الطالب 2025 تعزيز **التقويم من أجل التعلم** في الصف، والتغذية الراجعة قلبه."],"pts":["**فورية** أو في أقرب وقت، و**محددة ووصفية**.","**تركز على المهمة لا الشخص**، ومستمرة بلغة بسيطة.","أفضل صورها **تقدير مع تعليق** يوضح ما أُحسن وما يُحسَّن.","التعزيز تراكم **وجداني**، والتغذية الراجعة تراكم **معرفي**."],"ex":["بدل «أحسنت»: «رتبت خطوات الحل صحيحاً، وأخطأت في إشارة العدد في السطر الثالث؛ راجع ضرب السالب في السالب»."],"traps":["«ممتاز» وحدها تعزيز عام، **ليست** تغذية راجعة كافية."],"src":"لائحة تقويم الطالب في التعليم العام 2025، المادة 3 (مرتكزات تقويم الطالب)","aka":["التغذية الراجعة"]},"ar.l13.flipped":{"k":"نماذج التعلم","t":["Flipped Classroom","الصف المقلوب"],"body":["ينتقل الشرح إلى **المنزل** عبر مقطع قصير أو قراءة، وينتقل التطبيق إلى **الحصة** حيث المعلم حاضر ليساعد، فيُستثمر وقت الحصة في التفاعل والتفكير العالي. وأدرجه دليل المعلم في التعليم الإلكتروني 1447 ضمن الاستراتيجيات التي يفعّلها المعلم."],"pts":["قبل الحصة: مقطع قصير مع سؤال تحقق.","في الحصة: حل مسائل ونقاش ومشروع وتصحيح أخطاء.","من لم يشاهد المقطع يحتاج بديلاً سريعاً في بداية الحصة."],"ex":["معلم كيمياء يرفع على منصة مدرستي مقطعاً مدته ست دقائق عن موازنة المعادلات، ثم يوزع الطلاب في الحصة على مجموعات تحل معادلات متدرجة الصعوبة."],"traps":["المقلوب: الشرح **في المنزل** والتطبيق **في الفصل**؛ والمدمج مزيج حضوري وإلكتروني بأي صورة."],"src":"دليل المعلم في التعليم الإلكتروني، الإصدار الثاني 1447","aka":["الصف المقلوب","الفصل المقلوب"]},"ar.l13.pbl":{"k":"نماذج التعلم","t":["Problem-Based & Project-Based Learning","التعلم القائم على المشكلات والمشروعات"],"body":["في **التعلم القائم على المشكلات** يبدأ الدرس بمشكلة واقعية **غير محددة البنية** بلا حل واحد، فيتعلم الطلاب المحتوى وهم يبحثون عن حل. وفي **القائم على المشروعات** يعمل الطلاب مدة أطول على مهمة تنتهي **بمنتج** يُعرض. وذكرهما دليل المعلم في التعليم الإلكتروني 1447 لتنمية مهارات القرن 21."],"pts":["المشكلات: البداية **مشكلة**، والنهاية حل مقترح مبرر.","المشروعات: البداية **سؤال محوري**، والنهاية **منتج**.","المعلم ميسّر يقوّم بسلالم تقدير معلنة."],"traps":["المسألة الرياضية ذات الحل الواحد ليست مثالاً على التعلم القائم على المشكلات؛ مشكلته **مفتوحة البنية**."],"src":"دليل المعلم في التعليم الإلكتروني، الإصدار الثاني 1447","aka":["التعلم القائم على المشكلات","التعلم القائم على المشروعات"]},"ar.l13.5e":{"k":"النموذج البنائي","t":["5E Learning Cycle — Bybee","دورة التعلم الخماسية"],"body":["أصلها ثلاثي عند كاربلس (استكشاف، تقديم المفهوم، تطبيق)، وطوّرها بايبي إلى خمس مراحل يبدأ اسم كل منها بحرف E. وسمتها الأهم أن الطلاب **يجربون قبل أن يُشرح لهم**."],"pts":["**الانشغال**: إثارة الاهتمام وكشف المعرفة السابقة.","**الاستكشاف**: نشاط عملي قبل الشرح.","**التفسير**: الطلاب يفسرون والمعلم يقدم المصطلح.","**التوسع**: تطبيق المفهوم في موقف جديد.","**التقويم**: في كل مرحلة وفي النهاية."],"traps":["الخماسية تبدأ **بالانشغال**، والثلاثية لكاربلس **بالاستكشاف**.","التطبيق في موقف جديد مرحلة **التوسع** لا التفسير."],"src":"بايبي، نموذج 5E؛ كاربلس، دورة التعلم","aka":["دورة التعلم","5E"]},"ar.l13.diff":{"k":"مؤشر 8.3","t":["Differentiated Instruction — Tomlinson","التعليم المتمايز"],"body":["تعرّف توملينسون التمايز بأنه استجابة المعلم المخططة لاختلاف طلابه: الهدف ومعايير النجاح واحدة، والطرق إليها تختلف بحسب **الاستعداد** و**الاهتمامات** و**نمط التعلم**."],"pts":["**المحتوى**: ما يتعلمه الطالب أو مستوى المادة ومصادرها.","**العملية**: الأنشطة التي يفهم بها المفهوم نفسه.","**المنتج**: كيف يُظهر ما تعلمه.","**البيئة**: ترتيب المكان والمجموعات والجو الصفي.","يبدأ عادة بتقويم قبلي يوجه تقسيم المجموعات المرنة."],"ex":["درس «الكسور المتكافئة»: مجموعة بقطع ملموسة، وأخرى برسوم، وثالثة بمسائل حياتية؛ الهدف واحد والعملية مختلفة."],"traps":["التمايز **لا يعني** خفض الهدف للضعفاء ولا زيادة التمارين المتشابهة للمتفوقين."],"src":"توملينسون، الصف المتمايز؛ المعايير التربوية العامة، مؤشر 8.3","aka":["التعليم المتمايز","التدريس المتمايز"]},"ar.l13.elearn":{"k":"التقنية في التعليم","t":["E-learning & the Teacher's Role","أنماط التعليم الإلكتروني ودور المعلم"],"body":["تعرّف لائحة تقويم الطالب 2025 التعليم الإلكتروني بأنه توظيف تقنيات التعليم والمعلومات والاتصالات لرفع كفاية العملية التعليمية بجميع أنماطها وضبط جودتها. ويحدد دليل المعلم في التعليم الإلكتروني (الإصدار الثاني 1447) دور المعلم عبر منصة مدرستي وقنوات عين."],"pts":["**المتزامن**: في الوقت نفسه من أماكن مختلفة (الفصل الافتراضي)؛ **غير المتزامن**: في أوقات مختلفة (مسجل، واجبات).","قبل الدراسة: التحقق من الدخول إلى المنصة، والاطلاع على أدلتها وعلى **آداب السلوك الرقمي** والتحقق من اطلاع الطلاب عليها.","أثناء الدراسة: إعداد الدرس والخطة الأسبوعية، والحصة المتزامنة، و**رصد الحضور**، وإسناد الواجبات والاختبارات وتصحيحها مع **التغذية الراجعة**.","أدوات التقييم في الدليل: التقييم الإلكتروني، والتقييم الذاتي المفتوح عبر بنوك الأسئلة، والاختبارات المركزية.","الأصل الحضور في المدرسة، والالتحاق بالتعليم الإلكتروني استثناء في حالات خاصة (الإجراءات التنفيذية للائحة تقويم الطالب، القاعدة السادسة)."],"traps":["المقطع المسجل الذي يشاهده الطالب متى شاء **غير متزامن** وإن كان بصوت معلمه."],"src":"دليل المعلم في التعليم الإلكتروني، الإصدار الثاني 1447؛ لائحة تقويم الطالب 2025 (التعريفات)؛ الإجراءات التنفيذية للائحة تقويم الطالب، القاعدة السادسة","aka":["التعليم الإلكتروني","التعليم المتزامن","التعليم غير المتزامن"]},"ar.l13.samr":{"k":"دمج التقنية","t":["SAMR & TPACK","نموذجا SAMR وTPACK"],"body":["**SAMR** (بونتيدورا) يقيس عمق أثر التقنية في المهمة: درجتان **تحسين** ودرجتان **تحويل**. و**TPACK** (ميشرا وكوهلر) يصف معرفة المعلم المطلوبة: المحتوى، وطرق التدريس، والتقنية، وتقاطعها."],"pts":["**الاستبدال**: بديل مباشر بلا تغيير وظيفي.","**التعزيز**: بديل مع تحسين وظيفي (مدقق إملائي، تعليق فوري).","**التعديل**: إعادة تصميم كبيرة للمهمة.","**إعادة التعريف**: مهمة لم تكن ممكنة دون تقنية."],"traps":["الاستبدال **لا يغير** المهمة.","TPACK عن **معارف المعلم**، وSAMR عن مستوى **المهمة**."],"src":"بونتيدورا (SAMR)؛ ميشرا وكوهلر (TPACK)","aka":["SAMR","TPACK"],"ex":["كتابة الفقرة في مستند بدل الورق استبدال؛ وحين يعلّق الزملاء عليها فوراً تعزيز؛ وحين يتبادل الطلاب الرسائل مع طلاب مدرسة في مدينة أخرى صارت المهمة مستحيلة دون تقنية: إعادة تعريف."]},"ar.l13.curr":{"k":"المنهج","t":["Curriculum: Concept & Types","المنهج: مفهومه وأنواعه"],"body":["المنهج **التقليدي** هو المقرر والمعلومات، و**الحديث** جميع الخبرات المخططة التي تقدمها المدرسة داخلها وخارجها لتحقيق النمو الشامل؛ فالمنهج أعم من المقرر، والمقرر أعم من الكتاب. وعناصره: الأهداف ← المحتوى ← الطرق والأنشطة ← التقويم."],"pts":["**الرسمي (المعلن)**: الوثيقة المكتوبة المعتمدة.","**الخفي** (جاكسون): ما يُتعلم ضمناً من المناخ والعلاقات دون تخطيط.","**الفارغ (المحذوف)** (آيزنر): ما لم يُدرج عمداً.","تنظيمات بارزة: النشاط (ديوي)، والحلزوني (برونر)، والمحوري، والمجالات الواسعة."],"traps":["الخفي **غير مخطط**، والفارغ **حُذف عمداً**."],"src":"مراجع المناهج (جاكسون، آيزنر، ديوي، برونر)","aka":["المنهج","المنهج الخفي","المنهج الفارغ"],"ex":["لاحظ الطلاب أن معلمهم يحضر قبل الجرس ويعتذر إذا تأخر دقيقة، فصاروا يحترمون الوقت دون أن يرد ذلك في أي درس: منهج خفي."]},"ar.l13.udl":{"k":"مؤشر 8.3","t":["Inclusive Education & UDL","التعليم الشامل والتصميم الشامل للتعلم"],"body":["يطلب مؤشر 8.3 أن يطبق المعلم **ممارسات التعليم الشامل وأسس التدريس المتمايز** لتحسين تقدم كل طالب. والتعليم الشامل يعلّم الجميع معاً في الفصل العام، ويكيّف البيئة والمنهج والتدريس والتقويم ليشارك الجميع."],"pts":["**الدمج** يطلب من الطالب التكيف مع النظام؛ **الشمول** يغيّر النظام.","مبادئ UDL: وسائل متعددة **للتمثيل**، و**للتعبير والأداء**، و**للمشاركة والتحفيز**.","التمايز أداة من أدوات الشمول، والشمول أوسع منه.","ممارسات شاملة: توقعات عالية للجميع، ومجموعات مرنة، وتقنيات مساعدة، ودعم الأقران، وتسهيلات في الواجبات والاختبارات، وتعاون مع معلم التربية الخاصة."],"ex":["درس يُقدَّم بنص ومقطع مرئي مصحوب بنص مكتوب ومجسم، وتُظهر الطالبات فهمهن برسم أو تسجيل صوتي أو فقرة: تخطيط مسبق يناسب ضعيفة السمع والموهوبة معاً."],"traps":["الشمول **ليس** خفض الأهداف ولا عزل ذوي الاحتياج في ركن الصف."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، مؤشر 8.3","aka":["التعليم الشامل","التصميم الشامل للتعلم","UDL"]},"ar.l13.cross":{"k":"المعيار الثامن","t":["Cross-Curricular Dimensions","الأبعاد المشتركة بين المناهج"],"body":["مهارات وقيم لا تملكها مادة بعينها، بل تُنمّى عبر كل المواد بخبرات مباشرة أو ضمنية. والمعتمد في مؤشرات المعيار الثامن: أولويات + قيم ست + مهارات."],"pts":["**الأولويات**: المواطنة المسؤولة، ومكانة المملكة الريادية، والتنمية المستدامة.","**القيم الست** (مؤشر 8.4): تقوى الله، والوسطية والاعتدال، وتقدير الذات، والشغف المعرفي، وتقدير العمل وإتقانه، والمسؤولية.","**المهارات**: حل المشكلات، والاعتماد على الذات، والمسؤولية، والتعامل باحترام مع الآخرين.","التضمين **الضمني** بالمواقف أقوى من الوعظ المباشر.","**الشغف المعرفي**: حب الاستطلاع والرغبة الذاتية في المعرفة؛ يُنمّى بالأسئلة المفتوحة والمشكلات الحقيقية والمشروعات البحثية.","قائمة مختصرة شائعة الاستعمال: **الهوية الوطنية والقيم**، **مهارات التفكير العليا**، **المهارات الحياتية**، **الثقافة الرقمية**، **مهارات اللغة والتواصل**؛ والمعتمد نص المؤشرات أعلاه."],"ex":["طالبات يقسن استهلاك الماء في دورات مياه المدرسة أسبوعاً ثم يعرضن حلولاً على الإدارة: تنمية مستدامة (أولوية)، ومسؤولية (قيمة)، وحل مشكلات (مهارة).","معلم الرياضيات الذي يدرج نشاطاً عن الميزانية الأسرية ينمي **المهارات الحياتية**، ومعلم الإنجليزية الذي يربط الدرس باليوم الوطني ينمي **الهوية الوطنية**؛ ومعلم العلوم الذي يحلل فاتورة كهرباء المدرسة لاقتراح ترشيدها ينمي التنمية المستدامة والمسؤولية معاً."],"traps":["الأبعاد المشتركة مسؤولية **كل** المعلمين.","القيم الست تبدأ **بتقوى الله** وتنتهي **بالمسؤولية**."],"src":"المعايير التربوية العامة (هيئة تقويم التعليم والتدريب)، المعيار الثامن (مؤشر 8.4)","aka":["الأبعاد المشتركة","القيم الست"]},"ar.l14.expect":{"k":"مؤشر 9.1","t":["High Expectations — Pygmalion Effect","التوقعات العالية وأثر بجماليون"],"body":["في دراسة روزنثال وجاكوبسون (1968) أُخبر معلمون أن طلاباً اختيروا عشوائياً «سيزدهرون»، فتقدم هؤلاء فعلاً أكثر من غيرهم؛ لأن المعلم يعامل من يتوقع منه الكثير بطريقة مختلفة: ينتظره أكثر، ويكلفه بمهام أصعب، ويعطيه تغذية راجعة أدق. هذه **النبوءة التي تحقق ذاتها**."],"pts":["التوقع العالي = إيمان بقدرة **كل** طالب + مهمة تتحداه + دعم حتى يحققها.","التوقع المثالي غير الواقعي يُحبط ويقلل الدافعية.","قارن الطالب **بأدائه السابق** لا بأقرانه.","الدافعية **الداخلية** أقوى وأبقى من الخارجية، والإفراط في المكافآت المادية قد يضعفها.","لإثارة الدافعية: ربط الدرس بحياة الطالب، و**أهداف قصيرة قابلة للتحقيق**، وتنويع الأنشطة، و**تغذية راجعة فورية وصفية**، ومهام فيها تحدٍّ مناسب.","مؤشرات الدافعية: يعمل بجد ولو بلا درجات، ويختار المهام الصعبة، و**يستثمر أخطاءه**، ويثابر؛ والمعلم يجمع **التحدي والدعم**."],"traps":["التوقعات العالية تعكس **الإيمان بقدرة الطلاب**، لا رغبة المعلم في التنافس.","الأثر يعمل في الاتجاهين: التوقع **المنخفض** يخفض التحصيل أيضاً."],"src":"روزنثال وجاكوبسون (1968)؛ المعايير التربوية العامة، مؤشر 9.1","aka":["أثر بجماليون","التوقعات العالية"]},"ar.l14.attrib":{"k":"الدافعية","t":["Attribution — Weiner; Self-Efficacy — Bandura","العزو والكفاءة الذاتية"],"body":["يصنف واينر أسباب النجاح والفشل بثلاثة أبعاد: داخلي أو خارجي، ثابت أو متغير، قابل للضبط أو غير قابل. وإذا تكرر الفشل ونُسب إلى سبب ثابت خارج السيطرة قد يصل الطالب إلى **العجز المتعلم** (سليجمان). أما **الكفاءة الذاتية** (باندورا) فاعتقاد الطالب بقدرته على مهمة محددة."],"pts":["**الجهد**: داخلي متغير قابل للضبط ← أفضل عزو لأنه يدفع إلى المثابرة.","**القدرة**: داخلية ثابتة ← عزو الفشل إليها يولد الإحباط.","مصادر الكفاءة الذاتية من الأقوى: **خبرات الإتقان** ← رؤية نجاح الأقران ← الإقناع اللفظي ← الحالة الانفعالية.","العلاج: مهام متدرجة ونجاح مبكر، وربط النجاح بالجهد والاستراتيجية.","**تقدير الذات** يتراجع عند متدني التحصيل؛ يُرفع بتحديد **جوانب القوة** وتعزيزها ومهام ينجحون فيها، لا بخفض المطلوب.","الطالب الذي يتجنب مهمة بحجة ضعفه السابق فيها يعاني **إحباطاً**."],"ex":["طالبة تقول «أنا غبية في العلوم». تعيد المعلمة توجيه العزو: «أخطاؤك في سؤالي الحسابات، وهذه مهارة تتحسن بالتدريب؛ لنضع خطة أسبوع»."],"traps":["أقوى مصادر الكفاءة الذاتية **خبرات الإتقان** لا الإقناع اللفظي.","العزو لواينر، والعجز المتعلم لسليجمان."],"src":"واينر، نظرية العزو؛ باندورا، الكفاءة الذاتية؛ سليجمان، العجز المتعلم","aka":["نظرية العزو","العزو","العجز المتعلم","الكفاءة الذاتية"]},"ar.l14.kounin":{"k":"إدارة الصف","t":["Kounin's Classroom Management","مفاهيم كونين في إدارة الصف"],"body":["حلل جاكوب كونين تسجيلات حصص كثيرة، فوجد أن الصفوف المنضبطة لا يميزها أسلوب العقاب، بل إدارة سير الدرس التي تمنع المشكلة قبل أن تبدأ وتبقي الطلاب منشغلين."],"pts":["**اليقظة**: وعي المعلم بكل ما يجري وإشعار الطلاب بذلك، فيتدخل مبكراً.","**التداخل**: معالجة أمرين في وقت واحد دون توقف الدرس.","**الزخم والسلاسة**: إيقاع مناسب وانتقالات بلا توقف أو قفز.","**تنبيه المجموعة**: إبقاء الجميع مستعدين (السؤال قبل تحديد المجيب).","**أثر الموجة**: معالجة سلوك طالب تؤثر في بقية الصف."],"traps":["**التداخل** معالجة أمرين معاً، و**اليقظة** الوعي بكل ما يجري."],"src":"كونين، الانضباط وإدارة الجماعة في الصف","aka":["كونين","اليقظة","التداخل","أثر الموجة"],"ex":["معلم يشرح ويلاحظ طالبين يتهامسان في آخر الصف، فيتحرك نحوهما ويضع يده على طاولتهما دون أن يتوقف عن الشرح: توقف الهمس ولم ينقطع الدرس (يقظة وتداخل)."]},"ar.l14.canter":{"k":"إدارة الصف","t":["Assertive Discipline — Canter","الانضباط الحازم (كانتر)"],"body":["بنى لي ومارلين كانتر نموذجهما على مبدأ: للمعلم حق أن يعلّم، ولكل طالب حق أن يتعلم في صف آمن هادئ. ويميزان ثلاثة أساليب استجابة: **غير الحازم** (متردد لا يتابع)، و**العدائي** (يهدد ويهين)، و**الحازم** (واضح هادئ ثابت)."],"pts":["خطة الانضباط: **قواعد** قليلة واضحة، و**تقدير إيجابي** لمن يلتزم، و**عواقب** متدرجة معلنة مسبقاً.","تُطبق العاقبة بهدوء في كل مرة، بلا تفاوض لحظة المخالفة.","التقدير الإيجابي أساس الخطة، لا العقوبة."],"ex":["معلم يعلن في أول يوم عواقب متدرجة (تنبيه أول، فتنبيه ثانٍ، فتدوين وإشعار ولي الأمر)، ويرسل رسائل شكر أسبوعية لأولياء أمور الملتزمين، وحين يخالف طالب يقول بهدوء: «هذا التنبيه الأول» ويكمل."],"traps":["الحازم **ليس** العدائي؛ الصراخ والتهديد أسلوب عدائي."],"src":"كانتر، الانضباط الحازم","aka":["كانتر","الانضباط الحازم"]},"ar.l14.reinf":{"k":"تعديل السلوك","t":["Reinforcement & Punishment","التعزيز والعقاب"],"body":["يعرّف برنامج تعزيز السلوك الإيجابي 1445 التعزيز بأنه تقديم مثير إيجابي محبب، أو إزالة مثير سلبي مؤلم، بعد السلوك المرغوب **مباشرة**، مما يزيد احتمال تكراره. ويضرب مثلاً للتعزيز السلبي بطالب يحضّر دروسه ليتجنب توبيخ المعلم."],"pts":["أنواع المعززات في البرنامج: غذائية، و**اجتماعية** (أسهلها وأكثرها تأثيراً)، ومادية، ونشاطية، ورمزية.","الترتيب المقترح: الاجتماعية أولاً، فإن لم تُجدِ فالنشاطية، ثم المادية.","عوامل فعالية التعزيز: الفورية، والثبات، والكمية المناسبة، وتجنب الإشباع، والتنويع.","العقاب البدني والنفسي والإهانة ممنوعة في قواعد السلوك والمواظبة 1447."],"traps":["«سالب» تعني **إزالة** لا «سيئ»؛ والتعزيز السالب **يزيد** السلوك.","الإكثار من المعزز نفسه يؤدي إلى **الإشباع** فيفقد أثره."],"src":"برنامج تعزيز السلوك الإيجابي 1445 (مفهوم التعزيز، أنواع المعززات، العوامل المؤثرة)؛ قواعد السلوك والمواظبة 1447، المادة 28","aka":["التعزيز","التعزيز الموجب","التعزيز السالب","العقاب"]},"ar.l14.schedules":{"k":"تعديل السلوك","t":["Schedules of Reinforcement","جداول التعزيز"],"body":["جداول التعزيز قواعد تنظم العلاقة بين السلوك والمعززات: متى أقدم التعزيز ومتى أؤجله؟ والاختيار يتبع مرحلة السلوك: **اكتسابه** أو **المحافظة عليه** (برنامج تعزيز السلوك الإيجابي 1445)."],"pts":["**المستمر (المتواصل)**: في كل مرة يحدث السلوك؛ لمرحلة **الاكتساب**، ومحذوره الإشباع.","**المتقطع**: في بعض المرات؛ **الأكثر فاعلية ومقاومة للانطفاء**، ولا يُستخدم في مرحلة الاكتساب.","**الفترة**: تعزيز أول استجابة بعد مرور زمن ثابت أو متغير.","**النسبة**: تعزيز بعد عدد محدد من الاستجابات، ثابت أو متغير."],"ex":["طفل في الصف الأول يُعزَّز عند كل نطق صحيح للحرف (مستمر)، وبعد أن يتقنه يمدحه المعلم بين حين وآخر دون نمط ثابت (متقطع) فيبقى السلوك."],"traps":["لاكتساب سلوك جديد **المستمر**، وللمحافظة عليه **المتقطع**."],"src":"برنامج تعزيز السلوك الإيجابي 1445 (جداول التعزيز)","aka":["جداول التعزيز","التعزيز المتقطع","التعزيز المتواصل"]},"ar.l14.extinct":{"k":"تعديل السلوك","t":["Extinction, Response Cost & Time-out","الانطفاء وتكلفة الاستجابة والإقصاء"],"body":["ثلاث طرق لإضعاف السلوك غير المرغوب: في **الانطفاء** نوقف التعزيز الذي كان يحصل عليه، وفي **تكلفة الاستجابة** يخسر شيئاً كسبه، وفي **الإقصاء** يُبعد مؤقتاً عن الموقف المعزز."],"pts":["الانطفاء (التجاهل المقصود) يُقرن **بالتعزيز التفاضلي** للسلوك البديل، وقد يزيد السلوك مؤقتاً قبل أن يتلاشى.","تكلفة الاستجابة والإقصاء كلاهما **عقاب سالب**.","تمنع قواعد السلوك والمواظبة 1447 **إقصاء الطالب خارج الصف الدراسي**."],"ex":["طالب يصيح «أنا أعرف!» دون رفع يد؛ يتجاهله المعلم ويختار من رفع يده ويشكره. بعد أيام قلّ الصياح: انطفاء مع تعزيز تفاضلي."],"traps":["التجاهل **انطفاء** لا عقاب.","إخراج الطالب من الفصل عقاباً ممارسة **ممنوعة**."],"src":"قواعد السلوك والمواظبة 1447، المادة 28 (البند 29)؛ مراجع تعديل السلوك","aka":["الانطفاء","تكلفة الاستجابة","الإقصاء"]},"ar.l14.premack":{"k":"تعديل السلوك","t":["Premack, Token Economy, Shaping & Modeling","بريماك والاقتصاد الرمزي والتشكيل والنمذجة"],"body":["من أساليب تعزيز السلوك في برنامج تعزيز السلوك الإيجابي 1445: **مبدأ بريماك** (نشاط محبب يُشترط بإنهاء نشاط أقل حباً)، و**الاقتصاد الرمزي** (رموز تُجمع ثم تُستبدل)، و**النمذجة**، و**التشكيل**، و**التسلسل**."],"pts":["الاقتصاد الرمزي يناسب **الابتدائية**، والمعززات الاجتماعية أكثر فاعلية في المتوسطة والثانوية؛ ويُحدد مسبقاً موعد الاستبدال وعدد الرموز.","**التشكيل**: تعزيز التقريبات المتتابعة نحو السلوك النهائي (تدرج في الاستجابة).","**التسلسل**: تجزئة المهمة إلى حلقات متسلسلة وتعزيز كل حلقة.","**النمذجة**: حية، ومصورة، وخيالية (القصص)."],"ex":["طالب لا يكتب إلا كلمة في التعبير؛ يعزز المعلم جملة، ثم جملتين، ثم فقرة قصيرة حتى يصل إلى الفقرة الكاملة: تشكيل."],"traps":["بريماك نشاط **محبب** مشروط بنشاط **أقل حباً**، وليس مكافأة مادية.","التشكيل تدرج في **الاستجابة**، والسحب التدريجي تدرج في **المساعدة**."],"src":"برنامج تعزيز السلوك الإيجابي 1445 (أساليب تعزيز السلوك والخطوات الإجرائية)","aka":["مبدأ بريماك","الاقتصاد الرمزي","التشكيل","النمذجة"]},"ar.l14.rules1447":{"k":"تنظيم رسمي","t":["Student Behavior & Attendance Rules 1447","قواعد السلوك والمواظبة 1447: دور المعلم"],"body":["قواعد السلوك والمواظبة لطلبة التعليم العام (الإصدار الخامس 1447هـ) تخصص للسلوك 100 درجة من الثالث الابتدائي إلى الثالث الثانوي: **80** للسلوك الإيجابي يُعد كل طالب مستحقاً لها تلقائياً بداية كل فصل وتُحسم عند المخالفة مع فرص للتعويض، و**20** للسلوك المتميز. ومسمياتها الحالية: الموجه الطلابي ولجنة التوجيه الطلابي."],"pts":["من دور المعلم: **تمثيل القدوة الحسنة** في القول والفعل، وتعزيز الانضباط الذاتي، والمساهمة في توضيح القواعد.","يباشر **الإجراءات الثلاثة الأولى** في مشكلات الدرجة الأولى، ويحيل من لم يستجب إلى الإدارة.","في الابتدائية: تنبيه شفهي أول ← تنبيه ثانٍ مع حصر أسباب السلوك ← تدوين المشكلة وتوقيع الطالب وإشعار ولي الأمر هاتفياً وحسم درجة من الإدارة مع فرص التعويض، ثم التحويل إلى الموجه الطلابي.","يرصد الغياب في كل حصة، ويرصد مشكلات الدرجة الثانية فأعلى التي باشرها ويسلم الأسماء للإدارة.","ممنوع: الإيذاء الجسدي أو النفسي، والحرمان من الإفطار، و**نسخ الواجب عدة مرات عقاباً**، والسخرية من شخصية الطالب، و**إقصاؤه خارج الصف**.","تدرج في الإجراءات وتعزيز للانضباط الذاتي، ودرجات للمخالفات، وإحالة المخالفات المتكررة (الفصل، الفناء، الحافلة) إلى **وكيل شؤون الطلاب**، و**لجنة التوجيه والإرشاد** (لجنة التوجيه الطلابي حالياً)."],"traps":["المعلم يباشر **ثلاثة** إجراءات فقط في الدرجة الأولى.","المسمى الحالي **الموجه الطلابي** (المرشد الطلابي سابقاً)."],"src":"قواعد السلوك والمواظبة لطلبة التعليم العام، الإصدار الخامس 1447هـ: المادة 5، ودور المعلم، والمادة 6، والمادة 28","aka":["قواعد السلوك والمواظبة","لائحة السلوك والمواظبة"]},"ar.l14.questions":{"k":"مؤشر 9.4","t":["Questioning, Wait Time & Probing","الأسئلة الصفية وزمن الانتظار والسبر"],"body":["السؤال أكثر ما يفعله المعلم في الحصة. وجدت ماري بد رو أن المعلمين ينتظرون عادة أقل من ثانية بعد السؤال، وأن رفع الانتظار إلى 3–5 ثوانٍ يطيل الإجابات ويحسنها ويزيد مشاركة الأقل جرأة."],"pts":["اطرح السؤال **ثم** اختر المجيب ليبقى الجميع منتبهاً.","زمن انتظار **بعد السؤال**، وآخر **بعد إجابة الطالب** قبل التعليق.","السبر: **توضيحي** (وضّح أكثر)، و**تبريري** (لماذا؟)، و**مشجع** (أسئلة تقود من الخطأ إلى الصواب)، و**محوّل** (إلى طالب آخر).","إجابة ناقصة ← سبر توضيحي؛ خاطئة ← سبر مشجع؛ لا إجابة ← إعادة صياغة."],"ex":["طالبة تقول إن الليل والنهار يحدثان بدوران الشمس حول الأرض؛ تسألها المعلمة: «ماذا تفعل الأرض حول نفسها في يوم كامل؟» فتصل إلى دوران الأرض حول محورها: سبر مشجع."],"traps":["بعد الإجابة الخاطئة **سبر مشجع**، لا تصحيح فوري ولا نقل السؤال مباشرة لغيرها."],"src":"رو، زمن الانتظار؛ المعايير التربوية العامة، مؤشر 9.4","aka":["زمن الانتظار","الأسئلة السابرة","السبر المشجع"]},"ar.l15.terms":{"k":"مفاهيم التقويم","t":["Measurement, Evaluation & Assessment","القياس والتقييم والتقويم"],"body":["**القياس** وصف كمي بالأرقام دون حكم، و**التقييم** حكم على قيمة الأداء في ضوء محك، و**التقويم** حكم يتبعه تعديل وعلاج. وتعرّف لائحة تقويم الطالب 2025 التقويم بأنه «عملية منهجية منظمة لجمع المعلومات وتحليلها واستخلاص نتائجها وإصدار أحكام وبناء خطط علاجية وتطويرية في ضوئها»."],"pts":["الترتيب: قياس ← تقييم ← تقويم.","**الاختبار** أداة قياس، وليس نوعاً من التقويم.","**المقنن**: يعده متخصصون بظروف وتعليمات موحدة ومعايير لتفسير الدرجات.","من خصائص التقويم الصفي الفعال في دليل الاختبارات 2025: الموضوعية، والصدق، والثبات، والشمولية، والتنوع، والتمييز، والاستمرارية."],"traps":["الحكم مع علاج = **تقويم** لا تقييم.","اختبار المعلم الجيد **ليس مقنناً** ما لم يُعد بظروف موحدة ومعايير."],"src":"لائحة تقويم الطالب في التعليم العام 2025، المادة 1؛ دليل الاختبارات 2025 (خصائص التقويم الصفي الفعال)","aka":["القياس","التقييم","التقويم"]},"ar.l15.types":{"k":"أنواع التقويم","t":["Diagnostic, Formative & Summative","القبلي والتكويني والختامي"],"body":["تعرّف لائحة تقويم الطالب 2025 الأنواع الثلاثة تعريفاً رسمياً، وتنص في مرتكزاتها على تعزيز **التقويم من أجل التعلم** وتشجيع **التقويم الذاتي**."],"pts":["**القبلي (ويسمى التشخيصي)**: في بداية العام أو الفترة أو المقرر أو الوحدة أو الدرس، للوقوف على استعداد الطالب ومعارفه ومهاراته السابقة.","**التكويني**: عمليات مستمرة خلال الفترة أو العام لتجويد التعلم وبنائه؛ غرضه تحسين التعلم وتعديل التدريس.","**الختامي**: في ختام فترات التعلم لإصدار الحكم على مستوى الطالب.","في دليل الاختبارات 2025: دور المعلم في القبلي **تشخيص**، وفي التكويني **دعم وتيسير** والطالب فيه **تفاعلي**، وفي الختامي **تقييم**.","**التتبعي** بعد التقويم النهائي بفترة لمعرفة بقاء أثر التعلم، و**الانتقائي** لاختيار الطلاب لبرنامج أو مسار؛ وبحسب **الجهة المقوّمة**: **داخلي** (المدرسة)، **خارجي** (الوزارة أو الهيئة)، **متعدد الأطراف**.","**تقويم التعلم** = ختامي، **التقويم من أجل التعلم** = تكويني يقدم أدلة للمعلم والمتعلم، **التقويم كتعلم** = يراقب الطالب تعلمه بنفسه؛ والفائدة الأساسية للتكويني **مراقبة تقدم الطلاب وفاعلية تدريسه وتعديله**."],"ex":["بطاقة خروج تكشف أن نصف الصف أخطأ في وحدة القياس، فيبدأ المعلم الحصة التالية بمراجعة قصيرة: تقويم **تكويني** لأنه عدّل التدريس."],"traps":["«أثناء التدريس» و«تغذية راجعة» و«تعديل» تدل على **التكويني**."],"src":"لائحة تقويم الطالب في التعليم العام 2025، المادتان 1 و3؛ دليل الاختبارات 2025 (أنواع التقويم التربوي)","aka":["التقويم القبلي","التقويم التكويني","التقويم الختامي","التقويم التشخيصي"]},"ar.l15.ref":{"k":"أنواع التقويم","t":["Criterion- vs Norm-Referenced","محكي المرجع ومعياري المرجع"],"body":["الدرجة لا معنى لها حتى نقارنها بشيء. وتعرّف لائحة تقويم الطالب 2025 المحكية بأنها مقارنة أداء الطالب **بمحك خارجي محدد مسبقاً** دون النظر إلى أقرانه، والمعيارية بأنها المقارنة بين أدائه و**أداء أقرانه**."],"pts":["المحكي يجيب: هل أتقن؟ (رخصة القيادة، مستويات الأداء للصفين الأول والثاني).","المعياري يجيب: ما ترتيبه؟ (الانتقاء والمفاضلة، الرتب المئينية، الدرجات المعيارية).","ذاتي المرجع يجيب: هل تحسن عن نفسه؟ (قبلي وبعدي).","دليل الاختبارات 2025: المعياري يميز بين مستويات الطلاب وفق منحنى التوزيع الاعتدالي.","نتائج المحكي قائمة بالأهداف المتحققة، ونتائج المعياري رتب مئينية ودرجات معيارية؛ والمعياري للانتقاء والتصفية والمفاضلة.","**التقويم الذاتي** يشرك الطالب في وضع المحكات والحكم على عمله، و**تقويم الأقران** يحكم فيه الطلاب على أعمال بعضهم بمحكات معدة مسبقاً."],"traps":["«زملائه» أو «ترتيبه» = **معياري**؛ «أتقن/لم يتقن» = **محكي**."],"src":"لائحة تقويم الطالب في التعليم العام 2025، المادة 1؛ دليل الاختبارات 2025 (أساليب تفسير النتائج)","aka":["محكي المرجع","معياري المرجع","ذاتي المرجع"]},"ar.l15.authentic":{"k":"التقويم البديل","t":["Authentic (Alternative) Assessment","التقويم البديل (الأصيل)"],"body":["يعرّفه دليل الاختبارات 2025 بأنه نهج يقيس التعلم بطرق غير تقليدية كالمشاريع والاختبارات العملية، ويقيس استخدام الطالب للمعرفة في حياته ومهارات كالعمل الجماعي وتنظيم الوقت، ويتطلب **الدمج** بينه وبين التقويم التقليدي للوصول إلى حكم دقيق."],"pts":["**تقويم الأداء**: مهمة فعلية (تجربة، عرض، رسالة حقيقية).","**قائمة الشطب**: وجود السلوك أو غيابه دون تدريج.","**سلم التقدير**: عددي (1–5) أو لفظي (دائماً… نادراً).","**السجل القصصي** يكتبه المعلم عن سلوك محدد كما حدث، و**سجل سير التعلم** يكتبه الطالب.","يُسمى **التقويم البديل / الأصيل / الواقعي**؛ ومن شروطه: **العدالة** (فرص متساوية ومحكات معلنة مسبقاً) والتعدد في الأدوات؛ و**تقويم الأداء** مثل كتابة سيرة ذاتية وطلب توظيف حقيقي."],"traps":["الاختبار الكتابي **لا يقيس** المهارة العملية؛ الوضوء والتجربة بالملاحظة وقائمة الشطب."],"src":"دليل الاختبارات: الأسس الفنية والعمليات الإجرائية 2025 (التقويم البديل)","aka":["التقويم البديل","التقويم الأصيل","قائمة الشطب","سلم التقدير"]},"ar.l15.rubric":{"k":"أدوات التقويم","t":["Rubrics","سلم التقدير الوصفي (الروبرك)"],"body":["جدول يضع **معايير** الأداء في جانب و**مستويات** الجودة في جانب، ويصف كل خلية بعبارة تقول كيف يبدو الأداء في هذا المستوى، مع درجة لكل مستوى. يُعلن قبل المهمة، فيعرف الطلاب المطلوب ويقوّمون أنفسهم به."],"pts":["**التحليلي**: درجة لكل معيار ← تغذية راجعة تفصيلية.","**الكلي**: درجة واحدة لوصف عام ← أسرع وأقل تفصيلاً.","قائمة الشطب «موجود أم لا»، وسلم التقدير «بأي درجة»، والروبرك «كيف يبدو كل مستوى»."],"ex":["معيار «تنظيم الفقرة»: 4 = جملة مفتاحية وثلاث جمل داعمة مترابطة وخاتمة؛ 3 = جمل داعمة مع ضعف في الربط؛ 2 = جمل غير مرتبة؛ 1 = جمل متفرقة بلا فكرة رئيسة."],"traps":["السلم العددي بلا أوصاف **ليس** روبرك."],"src":"دليل الاختبارات 2025 (أساليب التقويم وأدواته)","aka":["الروبرك","سلم التقدير الوصفي"]},"ar.l15.portfolio":{"k":"أدوات التقويم","t":["Portfolio","ملف الإنجاز"],"body":["جمع منظم وهادف لشواهد تعلم الطالب يبين جهوده وتقدمه، لكل قطعة فيه سبب، ويكتب الطالب تأمله عليها؛ فهدفه الأساسي **التأمل الذاتي** ومتابعة التقدم. وفي الإجراءات التنفيذية للائحة تقويم الطالب يُوثَّق مستوى طالب الصفين الأول والثاني بشواهد في «ملف إنجاز الطالب»."],"pts":["أنواعه: ملف عمل (المسودات)، وملف عرض (أفضل الأعمال)، وملف تقويم (شواهد على معايير).","مكوناته: أعمال مؤرخة، وتأملات الطالب، وتقويم المعلم.","يُقوَّم بروبرك معلن ويُراجع دورياً مع الطالب."],"traps":["هدفه **التأمل ومتابعة التقدم**، لا التخزين والأرشفة."],"src":"الإجراءات التنفيذية للائحة تقويم الطالب، القاعدة الثانية","aka":["ملف الإنجاز","البورتفوليو"]},"ar.l15.objective":{"k":"أنواع الأسئلة","t":["Objective Items & Writing Rules","الأسئلة الموضوعية وقواعد صياغتها"],"body":["لها إجابة واحدة محددة سلفاً فلا تتأثر بذاتية المصحح: الاختيار من متعدد، والصواب والخطأ، والمطابقة، والإكمال. تغطي محتوى واسعاً ويسرع تصحيحها، لكنها عرضة للتخمين وتحتاج وقتاً في الإعداد ولا تقيس التعبير."],"pts":["**الاختيار من متعدد**: مقدمة تحمل المشكلة كاملة، وبدائل متجانسة معقولة متقاربة الطول، وموقع الإجابة متغير، وتجنب «جميع ما سبق» و«لا شيء مما سبق».","**الصواب والخطأ**: فكرة واحدة، بلا كلمات جزم (دائماً، أبداً، جميع) ولا نفي مزدوج.","**المطابقة**: قائمتان متجانستان، والاستجابات **أكثر** من المقدمات.","**الإكمال**: فراغ واحد مهم قرب آخر الجملة، دون نقل حرفي من الكتاب."],"ex":["«كل المعادن تتمدد بالحرارة دائماً» تصبح «يتمدد الحديد عند تسخينه»: حذفنا كلمتي الجزم اللتين تكشفان الإجابة."],"traps":["لتقليل التخمين **نزيد** البدائل الفعالة لا نقللها.","الإجابة القصيرة والمقالي المقيد **ليسا** موضوعيين؛ والإكمال موضوعي."],"src":"دليل الاختبارات 2025 (الاختبارات التحريرية)","aka":["الأسئلة الموضوعية","الاختيار من متعدد"]},"ar.l15.tos":{"k":"بناء الاختبار","t":["Table of Specifications","جدول المواصفات"],"body":["يعرّفه دليل الاختبارات 2025 بأنه مخطط تفصيلي **ثنائي البعد** يربط موضوعات المحتوى بالأهداف، ويبين الوزن النسبي لكل موضوع ولكل مستوى. يُبنى بعد تحديد الأهداف وتحليل المحتوى وقبل كتابة الأسئلة، ووظيفته الأولى **صدق المحتوى**."],"pts":["وزن الموضوع = (عدد أهدافه أو صفحاته أو حصصه ÷ المجموع) × 100.","أسئلة الخلية = العدد الكلي × وزن الموضوع × وزن المستوى.","لا تقل فقرات كل ناتج تعلم عن 3–4 فقرات، وتُرتب بحسب النوع ثم من الأسهل إلى الأصعب.","**مثال**: 50 سؤالاً لثلاث وحدات حصصها 4 و8 و8 (من 20) ← 10 و20 و20 سؤالاً؛ وبأوزان مستويات 20% و40% و40% تصبح الوحدة الأولى 2 و4 و4، والثانية والثالثة 4 و8 و8 لكل منهما (المجموع 50).","اختبار أسئلته متنوعة لكنه **يركز على موضوعات دون أخرى** ← الحل جدول مواصفات؛ ويتحقق صدق المحتوى بالجدول أو بتحكيم المختصين."],"traps":["يحقق **صدق المحتوى**، لا الثبات ولا الموضوعية.","الخطوة الأولى في بناء الاختبار **تحديد الأهداف** لا الجدول."],"src":"دليل الاختبارات: الأسس الفنية والعمليات الإجرائية 2025 (إعداد جداول المواصفات؛ عدد الفقرات وترتيبها)","aka":["جدول المواصفات"],"ex":["وحدة من 6 حصص من أصل 20 في اختبار من 40 سؤالاً: 6 ÷ 20 × 40 = 12 سؤالاً."]},"ar.l15.reg":{"k":"تنظيم رسمي","t":["Student Assessment Regulation 2025","لائحة تقويم الطالب 2025: الدرجات والنجاح"],"body":["تحكم لائحة تقويم الطالب في التعليم العام (2025) وإجراءاتها التنفيذية ودليل توزيع درجات المواد الدراسية 2025 أرقام التقويم: لكل مادة **100 درجة** في كل فترة."],"pts":["المواد المقوَّمة تكوينياً وختامياً (من الثالث الابتدا
