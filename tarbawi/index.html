اللقاء:",["الاستماع لشكوى ولي الأمر أولاً ثم عرض الحقائق بأدلة من أعمال الطالب دون مناقشة الطالب أمامه","مواجهة الطالب أمام والده بأخطائه","رفض اللقاء وإحالته إلى الإدارة","إنهاء اللقاء سريعاً لتجنب الجدل"],"الإنصات ثم الأدلة الموثقة مع الحفاظ على سرية اللقاء وعدم الحديث أمام الطفل. المواجهة أمام الوالد تحرج الطالب وتفقد الثقة."],["L04","","من مزايا مجتمعات التعلم المهنية للمعلمين المستجدين:",["توفير البيئة الداعمة والإسناد","إعفاؤهم من النصاب التعليمي","تقليل متطلبات التخطيط","تأجيل تقويم أدائهم"],"الأدبيات تذكر الإسناد والبيئة الداعمة للمستجدين كمزية صريحة. الإعفاءات ليست من وظائف مجتمع التعلم."],["L04","","تريد المدرسة إشراك المجتمع المحلي في دعم برامجها. الجهات التي تُعد من المجتمع المحيط بالمدرسة:",["الجهات الحكومية والأهلية والأفراد القادرون على الدعم","وزارة التعليم وإداراتها فقط","المدارس الأخرى في المدينة فقط","الطلاب وأولياء الأمور فقط"],"المجتمع المحيط يشمل كل من حول المدرسة من جهات وأفراد قادرين على الدعم، والعلاقة تبادلية."],["L04","","المعلم الذي يرحب بإسهام أولياء الأمور بخبراتهم ومهنهم في دعم برامج التعلم يحقق أحد مؤشرات معيار:",["التفاعل مع أولياء الأمور (3.2)","التطوير المهني المستمر (2)","الالتزام بالأخلاق المهنية واللوائح (1.3)","التقويم (10)"],"المعيار الفرعي 3.2 (التفاعل مع أولياء الأمور) يتضمن مؤشر توظيف التواصل الإيجابي في تحفيز أولياء الأمور على الإسهام بخبراتهم وعلمهم وقدراتهم في دعم برامج التعلم (من مؤشرات المعلم المتقدم). أما 1.3 فيخص الأخلاق المهنية واللوائح، والمعيار 2 التطوير المهني، والمعيار 10 التقويم."],["L04","","من النتائج التي تحققها الشراكة المجتمعية الفاعلة:",["توجهات أفضل نحو المدرسة وانخفاض معدل التسرب وارتفاع معنويات المعلمين","زيادة الأعباء الإدارية على المعلم","تقليص دور المدرسة لصالح الأسرة","الاعتماد على التبرعات في رواتب المعلمين"],"النتائج الموثقة: تحصيل أعلى، تسرب أقل، دعم أكبر من أولياء الأمور، معنويات أعلى. البدائل الأخرى آثار سلبية أو غير واردة."],["L02","n","قرأ معلم خبر نشر نظام التعليم العام في أم القرى بتاريخ 1448/2/10هـ، ثم قال لزملائه إن أحكامه مطبقة من يوم نشره. أي العبارات الآتية تصحح كلامه؟",["لم يُطبَّق بعد؛ فالعمل به يبدأ بعد 180 يوماً من تاريخ نشره","النظام مطبق من تاريخ صدور المرسوم الملكي، لا من تاريخ نشره في الجريدة الرسمية","النظام يُعمل به بعد سنة كاملة من تاريخ النشر","النظام لا يُعمل به إلا بعد صدور جميع لوائحه التنفيذية"],"تنص المادة 68 على أن النظام يُعمل به بعد 180 يوماً من تاريخ نشره في الجريدة الرسمية. والمدة تُحسب من تاريخ النشر، لا من تاريخ المرسوم. والسنة مدة أخرى تخص الفترة الانتقالية للوثائق الملغاة."],["L02","n","في الفترة بين نشر نظام التعليم العام وبدء العمل به، أي جهة نص قرار الموافقة على النظام على أنها تمارس اختصاصاتها من تاريخ النشر؟",["مجلس شؤون التعليم العام","إدارات التعليم في المناطق","هيئة تقويم التعليم والتدريب","لجنة المخالفات المنصوص عليها في النظام"],"البند الثاني من قرار مجلس الوزراء رقم 103، ومثله البند الثاني من المرسوم م/36، ينص على أن مجلس شؤون التعليم العام يمارس اختصاصاته من تاريخ نشر النظام في الجريدة الرسمية. أما بقية أحكام النظام فيبدأ العمل بها بعد 180 يوماً (المادة 68)."],["L02","n","سألت معلمة جديدة عن وضع «السياسة العامة للتعليم» بعد صدور نظام التعليم العام. ما الإجابة الصحيحة؟",["أُلغيت بقرار الموافقة على النظام، مع بقاء أحكامها سارية حتى يُقرّ المجلس بديلها خلال سنة","بقيت سارية دون تغيير، لأن مواد النظام لم تذكرها بالاسم ولم تنص على إلغائها صراحة","ألغيت فوراً من تاريخ نشر النظام في الجريدة الرسمية دون أي فترة انتقالية لأحكامها","دُمجت نصوصها كاملة في المادة الثانية من النظام، فأصبحت أهداف التعليم العام فيه هي نصوص السياسة نفسها"],"قرار مجلس الوزراء رقم 103 (البند 4) ألغى السياسة العامة للتعليم الصادرة بالقرار 779 وتاريخ 1389/9/16هـ. وفي البند 5 أبقى أحكامها سارية حتى يقر مجلس شؤون التعليم العام البديل، خلال مدة لا تتجاوز سنة من نفاذ النظام."],["L02","n","وفق تعريفات نظام التعليم العام، تمتد مرحلة «الطفولة المبكرة»:",["من بداية الحضانة حتى نهاية الصف الثالث","من بداية الحضانة حتى نهاية رياض الأطفال","من الولادة حتى سن السادسة","من رياض الأطفال حتى نهاية الصف السادس"],"عرّفت المادة 1 الطفولة المبكرة بأنها التعليم والرعاية من بداية الحضانة حتى نهاية الصف الثالث. والخيار الذي يقف عند نهاية الروضة خطأ شائع، لأن المرحلة في النظام تشمل الصفوف الثلاثة الأولى."],["L02","n","مدير مدرسة يتابع انتظام الطلاب في سنوات الإلزام. وفق نظام التعليم العام، سن التعليم الإلزامي هي:",["من السنة السادسة حتى الخامسة عشرة","من السنة السادسة حتى نهاية الصف الثاني عشر","من رياض الأطفال حتى الخامسة عشرة","من السنة السابعة حتى الثامنة عشرة"],"تنص المادة 4/1 على أن سن التعليم الإلزامي تبدأ من السنة السادسة حتى الخامسة عشرة. أما «حتى نهاية الصف الثاني عشر» فهو حد التعليم العام كله (المادة 1)، لا حد الإلزام."],["L02","n","لاحظت مرشدة طلابية أن طالباً في الحادية عشرة انقطع عن المدرسة لأن والده يشغّله في متجره. ما الذي ينص عليه نظام التعليم العام في هذه الحالة؟",["تتخذ الوزارة مع الجهات المختصة الإجراءات النظامية تجاه من تسبب في انقطاعه","يُترك الأمر لولي الأمر لأنه صاحب القرار في تعليم ابنه ما دام ينفق عليه","يُحوَّل الطالب إلى برامج الانتساب ليجمع بين العمل والدراسة بدلاً من الحضور اليومي","تكتفي المدرسة بتسجيل غيابه وإنذار ولي أمره حتى يتجاوز الطالب سن الإلزام"],"الطالب في سن الإلزام (من 6 إلى 15 سنة، المادة 4/1). والمادة 4/2 تنص على أن الوزارة، بالتنسيق مع الجهات المختصة، تتخذ الإجراءات النظامية تجاه من يتسبب في حرمان الطفل من التعليم أو انقطاعه عنه خلال سنوات الإلزام."],["L02","n","يُعدّ الشخص «معلماً» بحسب تعريف نظام التعليم العام إذا كان:",["مرخصاً له بالعمل في مهنة التعليم العام","حاصلاً على مؤهل جامعي تربوي في أي تخصص","معيَّناً على وظيفة تعليمية في مدرسة حكومية","يدرّس مقرراً دراسياً في أي مؤسسة تعليمية"],"عرّفت المادة 1 المعلم بأنه «من يُرخَّص له بالعمل في مهنة التعليم العام»، فالتعريف مربوط بالترخيص. أما المؤهل والتعيين والتدريس الفعلي فلا تكفي وحدها بحسب نص التعريف."],["L02","n","في ورشة عن مصطلحات النظام، عرضت المدربة هذا التعريف: «المحتوى الذي تتضمنه الخطة الدراسية، ويدرسه الطلاب». أي مصطلح يطابقه؟",["المقرر الدراسي","المنهج التعليمي","البرنامج التعليمي","الإطار الوطني للمناهج"],"في المادة 1: المقرر الدراسي هو المحتوى. أما المنهج التعليمي فهو أهداف مخطط لها تحقق نواتج مقصودة يُتأكد منها بالتقويم، والبرنامج التعليمي نشاط يُنظَّم في إطار المنهج لتحقيق أهداف محددة في مجال محدد."],["L02","n","صمّم معلم نشاطاً يحلل فيه طلابه مقطعاً منتشراً في وسائل التواصل يحمل معلومات مضللة، ويناقشون كيف يتحققون من مصدره. أي هدف من أهداف نظام التعليم العام يخدمه هذا النشاط مباشرة؟",["تنمية الوعي الفكري، والتعامل الواعي مع المحتوى الإعلامي","تعلم لغة أجنبية واحدة على الأقل، وتنمية مهاراتها الأساسية لدى الطلاب","تنمية حب العمل والانضباط والإنتاجية، والوعي بالعادات الصحية","ترسيخ الهوية الوطنية، والاعتزاز بتاريخ الوطن ورموزه، ومعرفة جغرافيته"],"الفقرة 7 من المادة 2 تنص على تنمية الوعي الفكري، وتطوير مهارات التحصن من التيارات والتوجهات المنحرفة، والتعامل الواعي مع المحتوى الإعلامي بمختلف صوره. والنشاط يدرب الطلاب على ذلك مباشرة."],["L02","n","أرادت مدرسة أهلية أن تدرّس بعض المواد بلغة أجنبية إضافة إلى العربية. ما حكم ذلك في نظام التعليم العام؟",["العربية هي الأساس، ويجوز التعليم بلغة إضافية وفق ضوابط يقرها المجلس","يُمنع التعليم بغير اللغة العربية منعاً تاماً في جميع مراحل التعليم العام","يجوز التعليم بأي لغة تختارها المدرسة دون ضوابط","يجوز ذلك في المدارس الحكومية وحدها، بقرار يصدره مدير التعليم في المنطقة"],"تنص المادة 5 على أن اللغة العربية هي اللغة الأساس للتعليم العام، وأنه يجوز التعليم بلغة إضافية وفق ضوابط يقرها مجلس شؤون التعليم العام."],["L02","n","من يرأس «مجلس شؤون التعليم العام» الذي أنشأه النظام؟",["وزير التعليم","رئيس هيئة تقويم التعليم والتدريب","نائب الوزير للتعليم العام","رئيس المركز الوطني للمناهج"],"تنص المادة 7 على إنشاء المجلس برئاسة الوزير، ويكون نائب الوزير للتعليم العام نائباً للرئيس، ورئيس هيئة تقويم التعليم والتدريب عضواً فيه."],["L02","n","أي جهة تختص بتحديد سن القبول في التعليم العام بحسب النظام؟",["مجلس شؤون التعليم العام","وزارة التعليم","مجلس الوزراء","إدارات التعليم في المناطق"],"الفقرة 2 من المادة 8 تجعل تحديد سن القبول من اختصاص المجلس، وكذلك اقتراح تعديل حدّي سنوات الإلزام (المادة 8/3)."],["L02","n","كلّفت الوزارة معلماً في مدرسة حكومية بتدريس مقرر من خارج تخصصه. ما الإطار الذي ينظم هذا التكليف في نظام التعليم العام؟",["قواعد يقرها المجلس، تشمل المزايا المالية والمتطلبات المهنية لتأهيل المعلم","لا يجيز النظام تكليف معلم المدرسة الحكومية بأي مقرر يخرج عن تخصصه","يقرره مدير المدرسة منفرداً بحسب احتياج الجدول الدراسي ونصاب المعلمين فيها","يكون التكليف بموافقة المعلم الكتابية فقط، دون قواعد عامة يقرها المجلس أو الوزارة"],"المادة 46 تجيز للوزارة تكليف معلمين في المؤسسات الحكومية بتدريس مقررات خارج تخصصاتهم وفق القواعد الواردة في الفقرة 4 من المادة 8. وهذه القواعد يقرها المجلس، وتتضمن المزايا المالية والمتطلبات المهنية اللازمة."],["L02","n","طلب ولي أمر أن يدرس ابنه في الصف السابع عن بُعد طوال العام، بحجة أن التقنية متاحة. ما الذي ينص عليه نظام التعليم العام؟",["التعليم حضوري في كل المراحل، والتقنية جزء منه وفق ضوابط التعليم الإلكتروني","يحق لولي الأمر اختيار التعليم عن بُعد بديلاً كاملاً عن الحضور في أي مرحلة دراسية","التعليم عن بُعد هو الأصل في المرحلة المتوسطة، والحضور إلى المدرسة اختياري للطالب","يُحال الطلب إلى المؤسسات التعليمية الافتراضية لتقبله دون أي ضوابط"],"تنص المادة 24 على أن التعليم حضوري في جميع مراحل التعليم العام، وأن للوزارة الاستفادة من تقنيات التعليم بوصفها جزءاً من التعليم الحضوري وفق ضوابط استخدام التعليم الإلكتروني المعتمدة."],["L02","n","التحق طالب ضعيف بصر بفصل عادي في مدرسة حكومية. وفق نظام التعليم العام، كيف يُقوَّم تحصيله؟",["بأساليب تراعي خصائصه وقدراته، مع توفير التقنيات المساعدة","بالاختبار نفسه الذي يؤديه زملاؤه في الفصل، دون أي تعديل أو تقنية مساعدة","يُعفى من التقويم كلياً ما دام مدموجاً في الفصل العادي","يُنقل إلى مركز متخصص ليُقوَّم هناك ثم يعود إلى فصله"],"تنص المادة 20 على دمج الطلاب ذوي الإعاقة في المؤسسات التعليمية، وتوفير الوسائل المناسبة لهم، وتقويمهم بأساليب تراعي خصائصهم واحتياجاتهم وقدراتهم، مع توفير التقنيات المساعدة والتكيفية. أما المراكز المتخصصة فهي لمن يتعذر دمجه (المادة 21)."],["L02","n","رشّحت مدرسة طالباً متفوقاً لتسريع انتقاله إلى المرحلة التالية. أي مما يلي من متطلبات ضوابط التسريع التي ينص عليها النظام؟",["إجراءات تقويم شاملة والتنسيق مع أولياء الأمور","الاكتفاء بمعدل الطالب في السنة الأخيرة","موافقة معلم المادة التي تفوق فيها الطالب","اجتياز الطالب اختباراً دولياً معتمداً"],"تنص المادة 23 على أن ضوابط التسريع تشمل معايير واضحة لتحديد الطلاب المؤهلين، وإجراءات تقويم شاملة، وتدريب المعلمين، وتعزيز التنسيق مع أولياء الأمور، بما يضمن استمرار التفوق والتكيف مع المرحلة الجديدة."],["L02","n","أي الجهات الآتية تشترك في إعداد الإطار الوطني لمناهج التعليم العام بحسب النظام؟",["الوزارة وهيئة تقويم التعليم والتدريب مع المركز الوطني للمناهج","الوزارة وحدها، دون مشاركة هيئة التقويم أو المركز الوطني للمناهج","مجلس شؤون التعليم العام بالاشتراك مع وزارة الثقافة ووزارة الإعلام","المركز الوطني للمناهج وإدارات التعليم في المناطق"],"تنص المادة 27 على أن الوزارة وهيئة تقويم التعليم والتدريب تشتركان مع المركز الوطني للمناهج في إعداد الإطار الوطني لمناهج التعليم العام."],["L02","n","مدرسة أهلية تطبق برنامجاً دولياً، وتسأل عن الاعتماد المدرسي. ما الذي يلزمها به نظام التعليم العام؟",["الاعتماد المدرسي من هيئة تقويم التعليم والتدريب، أو من هيئة دولية تعتمدها","الاعتماد المدرسي اختياري للمدارس التي تطبق برامج دولية سبق أن اعتمدتها الوزارة","يكفي اعتماد الوزارة للبرنامج الدولي، ويغني ذلك عن أي اعتماد مدرسي من جهة أخرى","تختار المدرسة أي هيئة اعتماد دولية تشاء دون أن تعتمدها هيئة التقويم"],"تنص المادة 30/2 على أن المؤسسات التعليمية الخاصة ملزمة بالحصول على الاعتماد المدرسي من هيئة تقويم التعليم والتدريب، أو من إحدى الهيئات الدولية التي تعتمدها الهيئة. واعتماد الوزارة للبرنامج الدولي (المادة 28) أمر مستقل عن ذلك."],["L02","n","مدرسة عالمية خاصة قررت الاستغناء عن مواد الهوية الوطنية لأن برنامجها الدولي لا يتضمنها. ما حكم ذلك في نظام التعليم العام؟",["لا يجوز؛ فالوزارة تشرف بما يضمن تدريس مواد الهوية الوطنية المعتمدة","يجوز ما دامت المدرسة حاصلة على اعتماد مدرسي من هيئة دولية معترف بها","يجوز للمدارس التي تطبق برامج دولية فقط، لأن الوزارة اعتمدت برنامجها","يجوز إذا وافق أولياء الأمور كتابياً على إعفاء أبنائهم"],"تنص المادة 31 على أن الوزارة تشرف على المؤسسات التعليمية الخاصة بما يضمن تحقيق أمور، منها (الفقرة 4) تدريس مواد الهوية الوطنية التي يعتمدها المركز الوطني للمناهج."],["L02","n","تقدّم مستثمر بطلب ترخيص مدرسة أهلية. بماذا يُلزم النظامُ الوزارةَ عند الرد على طلبه؟",["قرار مكتوب خلال 30 يوماً، والرفض يكون مسبَّباً مع حق التظلم","تبلغه الوزارة بقرارها شفهياً خلال 90 يوماً، دون أن تذكر أسباب الرفض","يُعدّ الطلب مقبولاً حكماً إذا لم ترد الوزارة عليه خلال 60 يوماً","يصدر القرار من مجلس شؤون التعليم العام في أول اجتماع له"],"تنص المادة 32/2 على أن الوزارة تبلغ طالب الترخيص بقرارها كتابةً خلال 30 يوماً من تقديم طلبه، وإذا صدر القرار بالرفض وجب أن يكون مسبباً، ولطالب الترخيص حق التظلم."],["L02","n","ثبت على مدرسة أهلية ارتكاب مخالفة لأحكام النظام. أي مما يلي من الجزاءات التي يجوز تطبيقها عليها بحسب نظام التعليم العام؟",["غرامة لا تقل عن 5,000 ريال ولا تزيد على 50,000 ريال","غرامة لا تقل عن 50,000 ريال ولا تزيد على 500,000 ريال","إغلاقها فوراً وتوزيع طلابها على المدارس الحكومية في اليوم نفسه","سحب رخص معلميها المهنية"],"تحدد المادة 60 جزاءات المؤسسات الخاصة بحسب تصنيف المجلس لجسامة المخالفة: الإنذار، وإيقاف تسجيل الطلاب، وغرامة من 5,000 إلى 50,000 ريال، وإلغاء الترخيص مع إكمال العام الدراسي للطلاب المقيدين على نفقة المالك."],["L02","n","رفضت مدرسة تسليم شهادة النجاح لطالب أنهى السنة بنجاح حتى يعيد كتاباً مفقوداً. ما حكم ذلك في ضوء نظام التعليم العام؟",["يخالف حق الطالب في تسلّم شهادة النجاح دون قيد أو شرط","تصرف نظامي، لأن المحافظة على الكتب وإعادتها من واجبات الطالب","يجوز إذا أبلغت المدرسة ولي الأمر كتابياً بسبب حجب الشهادة","يجوز حجبها حتى يدفع ولي الأمر قيمة الكتاب"],"من حقوق الطالب في المادة 38/1 (الفقرة ز) تسلّم شهادة النجاح بعد إتمام السنة الدراسية دون قيد أو شرط. وموضوع الكتاب تعالجه المدرسة بطريق آخر، ولا يُربط بالشهادة."],["L02","n","ألزم معلم طلابه بشراء أدوات باهظة لمشروع لم يرد في الخطة الدراسية ولا في تعليمات الوزارة، وهدّد بحسم درجات من لا يحضرها. أي حق للطالب في نظام التعليم العام يخالفه هذا التصرف؟",["ألا يُكلَّف بعمل ناتج عن اجتهاد فردي لا يتفق مع النظام","الرعاية الصحية الأولية داخل المؤسسة التعليمية عند الحاجة إليها","الحصول على جوائز وحوافز مادية ومعنوية عند تميزه","تسلم شهادة النجاح بعد إتمام السنة الدراسية دون قيد أو شرط"],"تنص المادة 38/1 (الفقرة د) على حق الطالب في ألا يُكلَّف بأي عمل ناتج عن اجتهاد فردي من المعلم أو الكادر الإداري داخل المؤسسة التعليمية لا يتفق مع أحكام النظام واللوائح."],["L02","n","تقدمت طالبة بشكوى إلى وكيلة المدرسة من تعامل إحدى زميلاتها معها. أي إجراء يحقق حق الطالبة كما نص عليه نظام التعليم العام؟",["سماع شكواها، وقيدها، واتخاذ الإجراء اللازم حيالها","سماعها شفهياً ونصحها بالصبر على زميلتها","إحالتها إلى ولي أمرها ليتابع الشكوى خارج المدرسة","تأجيل النظر فيها إلى نهاية الفصل الدراسي"],"من حقوق الطالب في المادة 38/1 (الفقرة ج): سماع شكواه، وقيدها، واتخاذ الإجراء اللازم حيالها. فالإجراء الكامل له ثلاث خطوات، والاكتفاء بالسماع أو التأجيل لا يحققه."],["L02","n","أي مما يلي من الالتزامات التي ينص عليها نظام التعليم العام على الطالب؟",["عدم الإضرار بالمدرسة وتجهيزاتها ومرافقها","المشاركة في لجان تقويم المعلمين","تحمّل تكاليف النقل المدرسي في المؤسسات الحكومية","اختيار المقررات الدراسية التي يرغب فيها"],"تنص المادة 38/2 على التزامات الطالب: احترام المعلمين والهيئة الإدارية وزملائه، والحضور والانصراف في الأوقات المحددة، وبذل الجهد والتعاون البنّاء، وعدم الإضرار بالمدرسة وتجهيزاتها، والالتزام بقواعد السلوك والمواظبة."],["L02","n","ينشر معلم في حسابه الشخصي محتوى يسخر فيه من طلابه وزملائه، ويقول إن ذلك خارج وقت الدوام فلا علاقة للمدرسة به. أي مادة في نظام التعليم العام يخالفها؟",["المادة 49؛ إذ على المعلم الابتعاد عما يمس شرف المهنة داخل المدرسة وخارجها","لا يخالف شيئاً، لأن واجبات المعلم في النظام مقصورة على اليوم الدراسي داخل المدرسة","المادة 38، لأنها تحدد واجبات المعلم داخل الفصل الدراسي فقط","المادة 60، لأنها تنظم جزاءات المؤسسات التعليمية الخاصة المخالفة للنظام"],"تنص المادة 49/3 على أن على المعلم تمثيل القدوة الحسنة للطلاب خُلقاً، والالتزام بقيم الهوية الوطنية، والابتعاد عن كل ما يمس شرف المهنة داخل المدرسة وخارجها، والالتزام بميثاق أخلاقيات مهنة التعليم."],["L02","n","معلم يخصّ الطلاب المتفوقين بالأسئلة والمشاركة، ويتجاهل الطلاب ذوي المستوى المنخفض. أي واجب من واجبات المعلم في نظام التعليم العام يقصّر فيه؟",["مراعاة الفروق الفردية وتحقيق أعلى مستويات العدالة في التعامل مع الطلاب","استثمار اليوم الدراسي في أداء المهمات المنوطة به وتطوير إمكاناته","الإسهام في البحوث والدراسات التي تخدم القضايا التعليمية","تدريس المقررات المسندة إليه وفق الأهداف والبرامج المعتمدة"],"تنص المادة 49/2 على أن يراعي المعلم طبيعة الطلاب واهتماماتهم واستعدادهم ومستويات تفكيرهم والفروق الفردية بينهم، وأن يحقق أعلى مستويات العدالة في التعامل معهم، ويعزز ثقتهم بأنفسهم."],["L02","n","أي مما يلي من الحقوق التي نص نظام التعليم العام على أن توفرها الوزارة للمعلم في المؤسسات الحكومية؟",["برامج التدريب والتطوير المهني، ومنها تقنيات التعليم الحديثة","الإعفاء من تدريس أي مقرر يخرج عن تخصصه متى طلب ذلك كتابياً من مديره","اختيار طلاب فصله بنفسه بحسب مستوياتهم وقدراتهم التحصيلية","تحديد سن القبول في مدرسته وفق احتياجات الحي"],"تنص المادة 48 على أن توفر الوزارة للمعلم في المؤسسات الحكومية: البيئة التعليمية المناسبة، وبرامج التدريب والتطوير المهني ومنها تقنيات التعليم الحديثة وأساليب التعليم التفاعلي، وفرص الإسهام في تطوير التعليم، والجوائز والحوافز عند التميز."],["L02","n","وقعت مشاجرة عنيفة أمام بوابة المدرسة بعد الانصراف، أُصيب فيها أحد طلابها. ما الذي يوجبه نظام التعليم العام على إدارة المدرسة؟",["إبلاغ الجهة المختصة عن الاعتداء لاستكمال الإجراءات النظامية","الصلح بين أسرتي الطالبين وإغلاق الموضوع داخلياً","عدم التدخل لأن الواقعة حدثت خارج مبنى المدرسة","الاكتفاء بإبلاغ ولي أمر الطالب المصاب"],"تنص المادة 65 على أن على إدارة المؤسسة التعليمية إبلاغ الجهة المختصة عن أي اعتداء أو إيذاء يقع داخل المؤسسة أو في محيطها على أي من طلابها أو منسوبيها، لاستكمال الإجراءات النظامية. ومحيط المدرسة داخل في النص."],["L02","n","تعرّض أحد معلمي المدرسة لاعتداء من شخص داخل فنائها. هل يشمل واجب الإبلاغ في نظام التعليم العام هذه الحالة؟",["نعم؛ الواجب يشمل الاعتداء على أي من الطلاب أو منسوبي المؤسسة","لا؛ الواجب يقتصر على الاعتداء على الطلاب","لا؛ يكتفي المعلم برفع شكوى شخصية","نعم بشرط أن يطلب المعلم ذلك كتابياً"],"المادة 65 تنص على الإبلاغ عن أي اعتداء أو إيذاء يقع على أي من طلاب المؤسسة أو منسوبيها، والمعلم من منسوبيها. والمُلزَم بالإبلاغ إدارة المؤسسة، دون أن يُعلَّق الواجب على طلب كتابي."],["L02","n","ثبت على معلم في مدرسة حكومية ارتكاب مخالفة جسيمة تخل بالنظام العام. ما الجزاء الذي ينص عليه نظام التعليم العام؟",["إنهاء خدمته، ومنعه من العودة إلى المجال التعليمي في القطاعين العام والخاص","الإنذار في المرة الأولى، ثم إنهاء الخدمة إذا تكررت منه المخالفة","نقله إلى مدرسة أخرى في المنطقة نفسها، مع إنذاره كتابياً بالفصل عند التكرار","حسم من راتبه مع بقائه في عمله ومنعه من الترقية مدة سنة"],"تنص المادة 59/2 على أنه إذا ثبت ارتكاب مخالفة جسيمة تنهى خدمته، ولا يسمح له بالعودة للعمل في المجال التعليمي في القطاعين العام والخاص. أما الإنهاء عند التكرار فهو حكم المخالفة غير الجسيمة (المادة 59/1)."],["L02","n","وُجدت قرائن على أن معلماً ارتكب ما يخل باللحمة الوطنية، ولم يُفصل في المخالفة بعد. ما الذي يجيزه نظام التعليم العام في هذه المرحلة؟",["تدابير عاجلة يتخذها الوزير أو من يفوضه، ككف يده مؤقتاً","إنهاء خدمته فوراً قبل التحقيق في المخالفة وثبوتها عليه","الانتظار حتى يصدر حكم قضائي نهائي دون اتخاذ أي إجراء","نقله إلى مدرسة أخرى بقرار من مدير المدرسة إلى حين التحقيق"],"تنص المادة 58 على أنه إذا وُجدت قرائن تدل على ارتكاب ما يخل بالنظام العام أو اللحمة الوطنية، فللوزير أو من يفوضه اتخاذ تدابير عاجلة لحماية البيئة التعليمية إلى أن يُفصل في المخالفة، منها منعه من أي عمل داخل المؤسسة وتكليفه بعمل خارجها، أو كف يده مؤقتاً في المؤسسة الحكومية."],["L02","n","صدر قرار جزاء بحق معلمة في مدرسة حكومية، وأرادت التظلم منه. ما الذي ينص عليه نظام التعليم العام؟",["لها التظلم أمام الجهة القضائية المختصة خلال 60 يوماً من تاريخ علمها به","لها التظلم أمام مدير المدرسة خلال 30 يوماً","لها التظلم أمام مجلس شؤون التعليم العام خلال 90 يوماً","لا يجوز التظلم من قرارات لجنة المخالفات"],"تنص المادة 63 على أنه يجوز لمن صدر في حقه قرار بالجزاء التظلم منه أمام الجهة القضائية المختصة خلال 60 يوماً من تاريخ العلم به."],["L02","n","أرادت مدرسة تفعيل مشاركة أولياء الأمور في تحقيق أهدافها. ما الأساس الذي ينص عليه نظام التعليم العام لذلك؟",["ضوابط تضعها الوزارة تعزز الشراكة بين المؤسسة التعليمية والأسرة","اجتهاد كل مدرسة بحسب ظروفها دون إطار عام تضعه الوزارة","لائحة يصدرها مجلس الوزراء لكل منطقة تعليمية على حدة","اتفاقيات تبرمها المدرسة مع القطاع الخاص لتمويل مشاركة الأسر"],"تنص المادة 50 على أن تضع الوزارة الضوابط اللازمة التي تعزز الشراكة بين المؤسسة التعليمية والأسرة، بما يمكّن أولياء الأمور من المشاركة والإسهام في تحقيق أهداف التعليم العام."],["L02","n","بحسب الأحكام الختامية لنظام التعليم العام، من يضع اللوائح اللازمة لتنفيذ أحكامه، وكيف تصدر؟",["تضعها الوزارة بالتنسيق مع الجهات المعنية، وتصدر بقرار الوزير","يضعها مجلس الوزراء، وتصدر بمرسوم ملكي بعد الرفع بها","تضعها هيئة الخبراء بمجلس الوزراء، وتصدر بقرار من مجلس الوزراء","تضعها كل إدارة تعليم لمنطقتها، وتصدر بقرار من مديرها"],"تنص المادة 67 على أنه مع عدم الإخلال باختصاصات المجلس، تضع الوزارة بالتنسيق مع من تراه من الجهات ذات العلاقة ما يلزم من لوائح لتنفيذ أحكام النظام، وتصدر بقرار من الوزير. أما لوائح بعينها، كلوائح المؤسسات الخاصة والافتراضية وذوي الإعاقة والحضانة، فيقرها المجلس (المادة 8)."],["L01","n","أرادت معلمة دراسات اجتماعية تعزيز اعتزاز طالباتها بالتراث الثقافي الوطني ضمن درس عن البيئة المحلية. أي الأنشطة الآتية أكثر تحقيقاً لهذا الهدف؟",["مقابلة كبار السن في أسرهن لتوثيق حرفة تقليدية وعرضها على الزميلات","تعليق صور المعالم التراثية على جدار الفصل طوال الفصل الدراسي دون نقاش","إلقاء محاضرة مفصلة عن أهمية التراث الوطني في نهاية الحصة","توزيع مطوية جاهزة عن التراث تقرؤها الطالبات في المنزل"],"مؤشر 1.2 للممارس يطلب توظيف خبرات ومواقف وأنشطة تعليمية تدعم الاعتزاز بالتراث؛ المقابلة والتوثيق والعرض خبرة نشطة يبني فيها الطالب الاعتزاز بنفسه، بينما الصور والمحاضرة والمطوية تعرض التراث دون إشراك فعلي."],["L01","n","يوافق يوم التأسيس الذي يحتفي به المعلم مع طلابه في 22 فبراير ذكرى:",["تأسيس الدولة السعودية الأولى على يد الإمام محمد بن سعود عام 1139هـ","توحيد المملكة العربية السعودية وإعلان اسمها على يد الملك عبدالعزيز عام 1351هـ","اعتماد العلم الوطني بشكله الحالي","دخول الملك عبدالعزيز الرياض واستردادها عام 1319هـ"],"يوم التأسيس (22 فبراير) لذكرى تأسيس الدولة السعودية الأولى عام 1139هـ (1727م). ذكرى التوحيد هي اليوم الوطني (23 سبتمبر)، والعلم له يوم العلم (11 مارس)."],["L04","n","لاحظ معلم أن معظم أولياء أمور فصله لا يحضرون اللقاءات المسائية، وعلم أن كثيراً منهم يعملون في الفترة المسائية. الإجراء الأنسب للتغلب على هذا المعوق:",["تنويع قنوات التواصل ومواعيده، كاللقاءات الافتراضية والرسائل الدورية","الاكتفاء بإرسال الدرجات النهائية إلى أولياء الأمور في آخر الفصل الدراسي","تسجيل أسماء الغائبين ورفعها للإدارة","إلغاء التواصل مع أولياء الأمور لعدم جدواه"],"مؤشر 3.2: يستخلص أبرز معوقات التواصل مع أولياء الأمور ويشارك في التغلب عليها. المعوق هنا الوقت، وعلاجه المرونة في القنوات والمواعيد."],["L04","n","أي الممارسات الآتية تعد من معوقات التواصل مع أولياء الأمور التي تصدر عن المدرسة نفسها؟",["الاقتصار على استدعاء ولي الأمر عند وقوع مشكلات من ابنه","إرسال رسائل إيجابية دورية عن تقدم الطالب","كتابة التقارير لأولياء الأمور بلغة بسيطة خالية من المصطلحات","عقد مجالس أولياء الأمور في مواعيد مناسبة لظروف عملهم"],"ربط التواصل بالمشكلات فقط يولّد لدى الأسرة تجربة سلبية فتتجنب المدرسة. البدائل الأخرى حلول لا معوقات."],["L04","n","يدرّس معلم رياضيات موضوع النسبة المئوية، ولاحظ ارتفاع استهلاك المياه في الحي حسب نشرة محلية. التوظيف الأنسب لهذه القضية في التدريس:",["حساب الطلاب نسب الهدر من بيانات استهلاك أسرهم واقتراح طرق للترشيد","تخصيص الحصة لموعظة عن الإسراف بدل الدرس","ذكر القضية في التهيئة باختصار، ثم العودة إلى تمارين الكتاب المعتادة","تكليف الطلاب بكتابة موضوع إنشائي عن أهمية المياه"],"مؤشر 3.3: يتقصى القضايا المحلية ويوظفها في التدريس بصورة تعزز وظيفة المعرفة؛ أي يستخدم الطالب المعرفة الرياضية لفهم مشكلة واقعية واقتراح حل. البدائل الأخرى تفصل القضية عن هدف الدرس."],["L04","n","عند اختيار قضية محلية لتوظيفها في درس، أي الضوابط الآتية أولى بالمراعاة؟",["أن ترتبط بأهداف الدرس وتناسب الطلاب وتتجنب التشهير بأحد","أن تكون أكثر القضايا إثارة للجدل في وسائل التواصل الاجتماعي","أن يختارها الطلاب دون أي توجيه من المعلم","أن تكون بعيدة عن بيئة الطلاب وواقعهم حتى لا تحرج أحداً منهم"],"توظيف القضية يخدم الهدف التعليمي ويراعي المرحلة والقيم؛ الإثارة والجدل ليسا معياراً، والبعد عن بيئة الطالب يناقض فكرة القضية المحلية."],["L07","n","لاحظ معلم أن طالباً متفوقاً تراجع تحصيله فجأة وأصبح شارداً منطوياً منذ أسابيع، وعلم أن والديه انفصلا مؤخراً. الإجراء الأول الأنسب:",["حوار فردي هادئ مع الطالب ثم التنسيق مع الموجه الطلابي","مناقشة ظروفه الأسرية أمام زملائه ليتعاطفوا معه ويدعموه","خصم درجات المشاركة لتحفيزه على الانتباه","الانتظار حتى نهاية الفصل لعل الحالة تتحسن"],"مؤشر 5.1: يبين تأثير الأحداث اليومية الضاغطة على التعلم وكيفية التعامل معها؛ البداية احتواء فردي يحفظ السرية ثم الإحالة للمختص. التشهير والعقاب والتأجيل تفاقم المشكلة."],["L07","n","أي المؤشرات الآتية تستدعي من المعلم أكبر قدر من الانتباه بوصفها علامة على تأثر الطالب بحدث ضاغط؟",["تغير مفاجئ في سلوك الطالب أو تحصيله مقارنة بحاله السابقة","حماس الطالب الزائد في الأنشطة الجماعية وحرصه على المشاركة","ميل طالب المرحلة المتوسطة إلى الأقران وتأثره بآرائهم","كثرة أسئلة طفل الصفوف الأولية"],"العلامة التحذيرية هي التغير المفاجئ عن المعتاد؛ أما الميل للأقران في المراهقة وحب السؤال عند الصغار فسلوك نمائي طبيعي."],["L07","n","انتقل طالب حديثاً إلى المدرسة من مدينة أخرى، ويبدو قلقاً ومعزولاً في الفسحة. أنسب ما يقدمه المعلم لدعمه:",["تعريفه بالفصل وتكليف زميل مرافق يساعده على الاندماج","تكليفه بتقديم نفسه أمام الصف كاملاً في أول حصة يحضرها","تركه حتى يتكيف وحده دون تدخل","إحالته مباشرة إلى لجنة التوجيه الطلابي بوصفه حالة سلوكية"],"الانتقال حدث ضاغط شائع؛ والدعم يكون بالتعريف والزميل المرافق والإشراك المتدرج. الإحالة المباشرة للجنة سابقة لأوانها، والعرض أمام الصف قد يزيد قلقه."],["L07","n","أي المجموعات الآتية تمثل مؤشرات محتملة على إهمال الطالب؟",["جوع مستمر ورداءة النظافة وغياب متكرر وحاجات صحية مهملة","كثرة الحركة في الفصل وحب الكلام","تفوق دراسي مع خجل اجتماعي بسيط","انشغال بالأقران وتغير الاهتمامات والمزاج في مرحلة المراهقة"],"الإهمال عدم توفير حاجات الطالب الأساسية أو التقصير فيها (الجسدية والصحية والعاطفية والتعليمية...) كما عرفته قواعد السلوك والمواظبة، وعلاماته تتعلق بهذه الحاجات؛ والبقية سلوكيات قد تكون نمائية."],["L07","n","حالة إيذاء ثبت أنها تتطلب تدخلاً عاجلاً. الجهة التي نصت قواعد السلوك والمواظبة على إبلاغها فوراً:",["مركز بلاغات وزارة الموارد البشرية (1919)","المشرف التربوي للمادة في مكتب التعليم","مجلس أولياء الأمور والمعلمين في المدرسة","لجنة التحصيل الدراسي بالمدرسة لدراسة الحالة"],"المادة 29: إبلاغ مركز بلاغات وزارة الموارد البشرية والتنمية الاجتماعية (رقم 1919) فوراً إذا تطلبت الحالة تدخلاً عاجلاً، إضافة إلى الجهات الأمنية إذا اقتضى الأمر."],["L07","n","أي العبارات الآتية تصف إجراءات التعامل مع حالات الإيذاء والإهمال كما وردت في قواعد السلوك والمواظبة 1447؟",["تُتخذ بشكل عاجل وسري وفق خطورة الحالة دون تدرج","تبدأ بالتنبيه الشفهي ثم تتدرج كالمخالفات السلوكية","يتولاها المعلم وحده دون إشراك الإدارة","تؤجَّل إلى نهاية الفصل لجمع أدلة كافية"],"نصت المادة 29 على أن إجراءات الإيذاء لا تتطلب التدرج بل تُتخذ وفقاً لخطورة الحالة، بشكل عاجل وسري يضمن سلامة الطالب ويمنع تفاقم الحالة."],["L08","n","كلف معلم طلابه بمشروع يتطلب طباعة ملونة وأدوات مكلفة، فلم ينجزه عدد من الطلاب لظروف أسرهم الاقتصادية. الإجراء الأنسب لمراعاة الخلفيات الاقتصادية:",["إتاحة بدائل منخفضة التكلفة واستخدام مصادر المدرسة","خصم درجات من لم ينجز المشروع ليتعلموا الالتزام بالمواعيد","إعفاء هؤلاء الطلاب من المشروع نهائياً","مطالبة أولياء الأمور بتوفير الأدوات خلال يومين"],"مؤشر 5.2: يميز الاختلافات العائدة للخلفيات الاجتماعية والاقتصادية واحتياجاتها التعليمية التي ينبغي تلبيتها؛ وتلبيتها بتوفير البدائل والمصادر، لا بالعقاب ولا بإعفاء يحرم الطالب من التعلم."],["L08","n","في فصل يضم طلاباً من بيئات ثقافية مختلفة بينهم وافدون حديثاً، أي الممارسات الآتية تمثل التدريس المستجيب ثقافياً؟",["توظيف أمثلة من بيئات الطلاب مع توقعات عالية للجميع ودعم لغوي","خفض المستوى المطلوب من الطلاب الوافدين مراعاةً لظروفهم اللغوية","اختيار أمثلة من بيئة الأغلبية فقط لتوحيد الفهم داخل الفصل","تجنب أي إشارة إلى خلفيات الطلاب الثقافية"],"التدريس المستجيب ثقافياً يجعل ثقافة الطالب وخبرته جسراً للتعلم مع الحفاظ على توقعات عالية؛ خفض التوقعات قالب نمطي، وتجاهل التنوع يحرم الطالب من الربط."],["L08","n","ينص الإطار الوطني لمعايير مناهج التعليم العام على مبدأ «تكافؤ فرص التعلم». أي الممارسات الآتية أقرب إلى هذا المبدأ؟",["تقديم فرص تعلم متنوعة تراعي الفروق والقدرات والخلفيات لجميع الطلاب","تقديم المهام نفسها بالطريقة نفسها والزمن نفسه لجميع الطلاب دون استثناء","تخصيص الأنشطة الإثرائية للمتفوقين وحدهم","توزيع الطلاب على فصول ثابتة حسب مستوى أسرهم"],"تكافؤ الفرص في الإطار الوطني: فرص متكافئة ومتنوعة تراعي الفروق الفردية والقدرات والخلفيات الثقافية والاجتماعية لجميع الفئات؛ والتطابق في المعاملة ليس تكافؤاً."],["L08","n","وفق الدليل التنظيمي للتربية الخاصة، لا تبدأ إجراءات القياس والتشخيص للطالب إلا بعد:",["أخذ موافقة ولي الأمر خطياً بعد إشعاره رسمياً","موافقة المعلم المستشار","انتهاء العام الدراسي","حصول الطالب على درجة متدنية في الاختبار النهائي"],"نص الدليل التنظيمي على أن القياس والتشخيص يتم بعد أخذ موافقة ولي الأمر خطياً وإشعاره رسمياً بالإجراءات؛ فالأسرة شريك أساسي."],["L08","n","أي الآتي لا يُعد من أعضاء لجنة الخطط التعليمية الفردية كما حددها الدليل التنظيمي للتربية الخاصة؟",["المشرف التربوي لمادة الطالب","معلم التربية الخاصة","ولي أمر الطالب أو من ينوب عنه","معلم التعليم العام"],"تتكون اللجنة من قائد المدرسة ووكيلها للشؤون التعليمية ومعلم التربية الخاصة ومعلم التعليم العام والمرشد الطلابي أو الأخصائي الاجتماعي والمختصين حسب الحاجة وولي الأمر والطالب قدر الإمكان؛ ولم يُذكر المشرف التربوي."],["L08","n","أي العناصر الآتية تُبنى عليه أولاً صياغة أهداف الخطة التربوية الفردية؟",["مستوى أدائه الحالي بنقاط قوته واحتياجاته","أهداف المنهج العام للصف كما هي دون أي تعديل","رغبة ولي الأمر في نجاح ابنه","متوسط أداء زملائه في الفصل"],"الخطة الفردية تبدأ بوصف مستوى الأداء الحالي المستخلص من نتائج التشخيص، ومنه تُشتق الأهداف طويلة المدى ثم قصيرة المدى القابلة للقياس."],["L09","n","يحرص معلم على بيئة صفية خالية من السخرية والخوف من الخطأ، مع تقديم مهام تتحدى الطلاب. يستند هذا التوجه إلى مبدأ التعلم المستند إلى الدماغ القائل إن التعلم:",["يتعزز بالتحدي ويُكبح بالتهديد","يحدث بالتكرار الآلي وحده","لا يتأثر بالانفعالات","يتم بمعالجة الأجزاء منفصلة عن الكل"],"من مبادئ كين وكين: التعلم يتعزز بالتحدي ويُكبح بالتهديد، والانفعالات أساسية في التعلم، والدماغ يعالج الأجزاء والكل معاً؛ ومنها عنصر الاسترخاء اليقظ."],["L09","n","بعد شرح المفهوم الجديد، يطلب معلم من الطلاب تلخيصه بكلماتهم وتطبيقه على موقف حقيقي ومناقشة ما تعلموه. يمثل هذا الإجراء في نموذج التعلم المستند إلى الدماغ عنصر:",["المعالجة النشطة","الاسترخاء اليقظ","الانغماس المنظم","التعزيز السلبي"],"العناصر الثلاثة: الاسترخاء اليقظ (بيئة آمنة متحدية)، والانغماس المنظم (خبرات حقيقية غنية)، والمعالجة النشطة (تأمل وتلخيص وتطبيق يثبت المعنى)."],["L09","n","طالب يدرك الموقف ككل، ويتأثر بالسياق الاجتماعي، ويفضل العمل في مجموعة مع تعليمات واضحة من المعلم. وفق أسلوب ويتكن المعرفي يوصف بأنه:",["معتمد على المجال","مستقل عن المجال الإدراكي","متروٍّ (تأملي)","مندفع (متسرع)"],"المعتمد على المجال يدرك كلياً ويتأثر بالمحيط ويفضل التوجيه والعمل الجماعي، والمستقل يحلل ويفصل الجزء عن الكل ويفضل العمل الفردي. والتروي والاندفاع بُعد آخر (كاجان)."],["L09","n","طالب يجيب عن الأسئلة فور سماعها فيقع في أخطاء كثيرة رغم قدرته. أنسب أسلوب لمساعدته وفق بُعد الاندفاع والتروي:",["تدريبه على التوقف وفحص البدائل قبل الإجابة","حرمانه من المشاركة الشفهية حتى يتعلم الانضباط","تكليفه بأسئلة أسرع لاستثمار سرعته","نقله إلى مجموعة الطلاب الأضعف"],"الأسلوب المندفع يستجيب بسرعة وبأخطاء أكثر، ويُعالج بتعليم التوقف والتفكير وفحص البدائل وتمديد وقت الانتظار، لا بالعقاب أو التصنيف."],["L09","n","يفضّل طالب المذاكرة في مكان هادئ بإضاءة قوية، ويحتاج إلى مهام منظمة بخطوات واضحة ليثابر عليها. يربط هذا الوصف تفضيلات أسلوب تعلمه بعوامل:",["بيئية وانفعالية","معرفية فقط","وراثية ثابتة","اجتماعية فقط"],"نموذج دن ودن يربط أسلوب التعلم بعناصر بيئية (الصوت، الإضاءة) وانفعالية (المثابرة، الحاجة إلى التنظيم) واجتماعية وجسمية ونفسية؛ ومؤشر 5.3 يطلب بيان اعتماد أساليب التعلم على العوامل المعرفية والانفعالية والبيئية."],["L10","n","طالب يقرأ السؤال كاملاً ويتأكد من فهمه ويخطط قبل أن يبدأ الحل بدل الإجابة المتسرعة. يمارس هذا الطالب عادة العقل:",["التحكم بالتهور","الإقدام على مخاطر مسؤولة","إيجاد الدعابة","الاستجابة بدهشة ورهبة"],"التحكم بالتهور من عادات العقل عند كوستا وكاليك: التأني والتفكير وفهم المهمة قبل البدء."],["L10","n","حاول طالب حل مسألة بثلاث طرق لم تنجح، فلم يستسلم وجرب طريقة رابعة حتى وصل إلى الحل. عادة العقل التي يظهرها:",["المثابرة","التفكير التبادلي","الإصغاء بتفهم وتعاطف","جمع البيانات باستخدام جميع الحواس"],"المثابرة: الاستمرار في المهمة حتى إكمالها وعدم الاستسلام بسهولة وتجريب بدائل."],["L10","n","تُعرَّف عادات العقل بأنها:",["نمط من السلوكيات الذكية عند مواجهة مشكلات لا يُعرف حلها فوراً","مجموعة معارف نظرية يحفظها الطالب عن مهارات التفكير وتصنيفاتها","قدرات عقلية فطرية ثابتة لا تتأثر بالتعليم ولا بالتدريب","خطوات ثابتة لحل المسائل الرياضية"],"عادات العقل عند كوستا وكاليك ميل لتوظيف السلوك الذكي عند مواجهة مشكلة غير معروفة الحل، وهي قابلة للتعلم والتنمية بالنمذجة والممارسة."],["L10","n","طالبة تكرر «أنا لا أفهم الرياضيات أبداً» فتتجنب المحاولة. أنسب ما يفعله المعلم لتعديل اتجاهها نحو المادة:",["تصميم خبرات نجاح متدرجة وربط المادة بمواقف من حياتها","تذكيرها بأهمية الرياضيات لمستقبلها في بداية كل حصة","مقارنتها بزميلاتها المتفوقات لتحفيزها","إعفاؤها من كل المهام الصعبة لحمايتها من الإحباط والقلق"],"مؤشر 5.3: يبين تأثير الاتجاهات والقيم على التعلم وكيفية استخدامها لدعمه؛ الاتجاه السلبي يُعدّل بخبرات نجاح وربط بالحياة، لا بالوعظ أو المقارنة أو خفض التوقعات."],["L10","n","«اعتقاد الطالب بأهمية القراءة، وشعوره بالمتعة فيها، وميله إلى استعارة الكتب». تمثل هذه العبارات على الترتيب مكونات الاتجاه:",["المعرفي ثم الوجداني ثم السلوكي","الوجداني ثم السلوكي ثم المعرفي","السلوكي ثم المعرفي ثم الوجداني","المعرفي ثم السلوكي ثم الوجداني"],"للاتجاه ثلاثة مكونات: معرفي (معتقدات وأفكار)، ووجداني (مشاعر)، وسلوكي (ميل للفعل)."],["L11","n","أي الآتي يمثل المداخل العامة للتدريس الأربعة التي تتناولها مؤشرات المعيار السابع؟",["السلوكي والمعرفي والإنساني (الشخصي) والاجتماعي","الإلقائي والحواري والاستقرائي والاستنباطي (القياسي)","التعاوني والتنافسي والفردي والجماعي","التشخيصي والتكويني والختامي والتتبعي"],"مؤشرات 7.1 للممارس تتناول أسس المدخل السلوكي والمعرفي والإنساني أو الشخصي والاجتماعي؛ البقية طرق تدريس أو أنماط عمل أو أنواع تقويم."],["L11","n","تكمن أهمية معرفة المعلم بالأسس النظرية للمداخل العامة للتدريس في أنها تساعده على:",["اختيار ما يحفز المتعلمين وينمي قدراتهم ويعدل سلوكهم","حفظ أسماء رواد كل مدخل ونظرياتهم وتواريخ ظهورها","الالتزام بمدخل واحد في جميع الدروس طوال العام الدراسي","تقليل الحاجة إلى التخطيط للدروس"],"نص مؤشر 7.1: يحدد الأسس والمبادئ النظرية للمداخل ويبرز أهميتها في تحفيز المتعلمين وتنمية مهاراتهم وقدراتهم وتعديل سلوكهم وتنمية مهاراتهم الاجتماعية."],["L11","n","قسّم معلم مهارة الكتابة على الحاسب إلى خطوات صغيرة متتابعة، ولا ينتقل الطالب إلى خطوة حتى يتقن سابقتها، مع تعزيز فوري لكل إجابة صحيحة. المدخل الذي يستند إليه:",["السلوكي","الإنساني","الاجتماعي","المعرفي"],"تحليل المهمة إلى خطوات صغيرة والتعزيز الفوري والتعلم للإتقان من أسس المدخل السلوكي الذي يركز على تعديل السلوك واستجابة المتعلم للمهام."],["L11","n","عرض معلم على طلابه ظاهرة محيرة، وطلب منهم طرح الأسئلة وجمع البيانات حتى يصلوا إلى التفسير بأنفسهم دون أن يقدمه لهم. المدخل الذي يمثله هذا الأسلوب:",["المعرفي","السلوكي","الإنساني","الاجتماعي"],"المدخل المعرفي يستند إلى أساليب تمكّن المتعلم من التفكير والبحث والاكتشاف ذاتياً والتوصل إلى المعارف بجهده (مؤشر 7.1)."],["L11","n","يبدأ معلم درسه بمنظم متقدم يعرض فيه الفكرة العامة التي ستُبنى عليها تفاصيل الدرس. يعكس ذلك اهتمام المدخل المعرفي بـ:",["تنظيم البنية المعرفية وربط الجديد بالسابق","تعزيز الاستجابات الصحيحة فوراً لتثبيتها","تنمية الوعي بالذات والمسؤولية","نمذجة السلوك الاجتماعي المرغوب أمام الطلاب"],"المنظم المتقدم (أوزوبل) من نماذج المدخل المعرفي الذي يهتم بالعمليات العقلية وتنظيم المعرفة وربطها بالخبرة السابقة."],["L11","n","يشارك معلم طلابه في تحديد أهداف تعلمهم الشخصية، ويصغي لمشاعرهم بتعاطف، ويطلب منهم تقويم تقدمهم بأنفسهم، مؤدياً دور الميسر. المدخل الذي يستند إليه:",["الإنساني (الشخصي)","السلوكي","المعرفي","الاجتماعي"],"المدخل الإنساني أو الشخصي يعنى بتأثير الجوانب الوجدانية والشخصية على التعلم، ويشجع الاستقلالية المنتجة والوعي بالذات والإحساس بالمسؤولية؛ ومن نماذجه التدريس غير الموجه لروجرز."],["L11","n","يرتبط نموذج «التدريس غير الموجه» الذي يكون فيه المعلم ميسراً متقبلاً للمتعلم باسم:",["كارل روجرز","ألبرت باندورا","بنجامين بلوم","ديفيد أوزوبل"],"روجرز رائد علم النفس الإنساني وصاحب التدريس غير الموجه. باندورا للتعلم الاجتماعي، وبلوم للتعلم للإتقان، وأوزوبل للتعلم ذي المعنى والمنظم المتقدم."],["L11","n","يؤدي المعلم أمام طلابه طريقة الحوار المهذب مع المخالف، ثم يطلب منهم محاكاتها في مواقف لعب أدوار جماعية يتبادلون فيها الملاحظات. المدخل الذي يمثله هذا الإجراء:",["الاجتماعي","السلوكي","المعرفي","الإنساني"],"المدخل الاجتماعي يوظف نمذجة السلوك والتفاعل بين المتعلمين لدعم النظم التفاعلية وبناء ثقافة صفية إيجابية (مؤشر 7.1)، ويستند إلى التعلم الاجتماعي لباندورا."],["L11","n","يريد معلم علوم تعليم طلابه خطوات تجربة تتضمن مادة قابلة للاشتعال ولا تتوفر أدواتها إلا بنسخة واحدة. الطريقة المباشرة الأنسب:",["العرض العملي من المعلم مع التأكيد على قواعد السلامة","تقسيم الطلاب إلى مجموعات تنفذ التجربة في الوقت نفسه","المحاضرة مع وصف لفظي للتجربة دون أدوات","تكليف الطلاب بتنفيذها في المنزل"],"العرض العملي يناسب التجارب الخطرة أو التي لا تتوفر أدواتها للجميع، ويجمع بين الأداء والشرح؛ وتنفيذ تجربة فيها مادة قابلة للاشتعال في المنزل أو في مجموعات يعرض الطلاب للخطر."],["L11","n","أي الإجراءات الآتية أهم قبل تنفيذ العرض العملي أمام الطلاب؟",["تجريب العرض مسبقاً وترتيب المكان ليراه الجميع","توزيع ورقة الاختبار على الطلاب","إخفاء هدف العرض لزيادة التشويق","تنفيذ الخطوات بسرعة لتوفير وقت الحصة للتطبيق الفردي"],"نجاح العرض العملي يتطلب تجريبه مسبقاً، وتوضيح هدفه، وضمان رؤية الجميع، والأداء خطوة خطوة ببطء مع الشرح."],["L11","n","وفق نموذج التغيير المفاهيمي، أول شرط ليتخلى الطالب عن تصوره البديل هو:",["شعوره بعدم الرضا عن تصوره الحالي","حفظه التعريف العلمي الصحيح","إعادة المعلم شرح المفهوم عدة مرات","حصوله على درجة منخفضة في الاختبار"],"شروط بوسنر وزملائه: عدم الرضا عن التصور الحالي، ثم أن يكون المفهوم الجديد واضحاً ومعقولاً ومثمراً."],["L11","n","يعتقد طلاب أن الجسم الثقيل يسقط أسرع من الخفيف. طلب المعلم توقعاتهم، ثم أسقط أمامهم كرتين متماثلتين في الحجم مختلفتين في الكتلة من الارتفاع نفسه فوصلتا إلى الأرض معاً تقريباً، ثم ناقشهم في تفسير ما لاحظوه. الإجراء الذي استخدمه لإحداث التغيير المفاهيمي:",["إحداث تناقض معرفي بين التوقع والملاحظة","التعزيز الفوري للإجابة الصحيحة","التلقين المباشر للقانون العلمي","تقسيم المهارة إلى خطوات صغيرة"],"كشف التصور القبلي ثم تقديم حدث يخالف التوقع يولد عدم الرضا (التناقض المعرفي) الذي يمهد لتبني المفهوم العلمي؛ وهي استراتيجية توقع – لاحظ – فسر."],["L12","n","يبدأ معلم تخطيط وحدته بتحديد نواتج التعلم المستهدفة من معايير المنهج، ثم يحدد الأدلة التي تثبت تحققها، ثم يصمم الأنشطة. يمثل هذا التسلسل:",["التصميم العكسي","التخطيط الخطي من صفحات الكتاب","تحليل المهمة","التعلم للإتقان"],"التصميم العكسي يبدأ بالنتائج المرغوبة ثم أدلة التقويم ثم خبرات التعلم؛ وهو تطبيق لمؤشر 8.1: ربط أهداف التعلم بمعايير المنهج في تسلسل منطقي."],["L12","n","وفق الإطار الوطني لمعايير مناهج التعليم العام، تمثل «معايير الأداء»:",["نواتج التعلم المتوقعة في نهاية كل صف أو مستوى","وصفاً عاماً لما ينبغي أن يتعلمه المتعلم في المجال","معايير تقويم أداء المعلم في الفصل","الحد الأدنى لدرجة النجاح في المادة"],"الإطار الوطني: معايير المحتوى وصف عام لما ينبغي أن يتعلمه المتعلم في كل مجال، ومعايير الأداء تمثل نواتج التعلم المتوقعة بعد دراسته المجال في نهاية كل صف أو مستوى."],["L12","n","هدف درس ينص على «أن يقارن الطالب بين نوعين من الصخور»، لكن تقويم الدرس اقتصر على سؤال «اذكر أنواع الصخور». المشكلة في هذا التخطيط:",["عدم المحاذاة المعرفية بين الهدف والتقويم","صياغة الهدف بفعل غير قابل للقياس والملاحظة","كثرة أدوات التقويم في الدرس","ارتباط الهدف بمعايير المنهج"],"المحاذاة تعني أن الهدف والنشاط والتقويم تقيس الشيء نفسه وبالمستوى نفسه؛ «يقارن» أعلى من «يذكر» فلا يقيسه سؤال تذكر، و«يقارن» فعل قابل للقياس."],["L12","n","وجد معلم مقطع فيديو جذاباً عن موضوع درسه، لكنه يتضمن معلومات علمية قديمة وإعلانات تجارية متكررة. القرار الأنسب وفق شروط اختيار مصادر التعلم:",["استبعاده والبحث عن مصدر دقيق وحديث","عرضه لأنه يجذب انتباه الطلاب","عرضه دون تعليق على الأخطاء لتوفير الوقت","تكليف الطلاب بمشاهدته في المنزل بدل الحصة"],"من شروط اختيار المصدر: الدقة العلمية والحداثة وموثوقية الناشر وخلوه من المحتوى غير المناسب؛ والجاذبية وحدها ليست معياراً (مؤشر 8.1)."],["L12","n","أي الآتي يُعد الشرط الأول والأساسي عند اختيار مصدر تعلم لدرس ما؟",["ارتباط المصدر بأهداف الدرس","حداثة الجهاز المستخدم في عرضه","ارتفاع تكلفته ودلالتها على جودته","كثرة المؤثرات البصرية فيه"],"المصدر وسيلة لتحقيق الهدف، فارتباطه بالهدف أول الشروط، ثم مناسبته للمتعلمين ودقته وإتاحته وأمانه وتكلفته."],["L12","n","اختار معلم تطبيقاً تفاعلياً لدرسه، ثم تذكر أن في فصله طالباً ضعيف البصر وأن شبكة المدرسة ضعيفة. الإجراء الأنسب قبل الحصة:",["تجريبه على أجهزة المدرسة وتجهيز نسخة مكبرة وبديل دون شبكة","إلغاء استخدام أي مصدر رقمي في الدرس","تنفيذ الدرس كما خُطط له تماماً، ثم حل المشكلات عند ظهورها أثناء الحصة","إعفاء الطالب ضعيف البصر من النشاط"],"من شروط اختيار المصادر الإتاحة وسهولة الوصول لجميع الطلاب وملاءمتها للإمكانات المتاحة؛ والتجريب المسبق والبديل يضمنان تحقيق الهدف للجميع."],["L13","n","أي العبارات الآتية تميز التعليم الشامل عن الدمج؟",["الشمول يكيّف البيئة والمنهج لتنوع الجميع، والدمج يُلحق الطالب بالنظام القائم","الشمول يعزل ذوي الاحتياجات في فصول خاصة، والدمج يضعهم مع أقرانهم في الفصل العادي","الشمول يقتصر على الموهوبين والمتفوقين، والدمج يقتصر على الطلاب ذوي الإعاقة","لا فرق بينهما في المفهوم ولا في الممارسة"],"التعليم الشامل يغير النظام نفسه ليناسب الجميع ويعد التنوع أمراً طبيعياً، بينما الدمج يُلحق الطالب بالنظام القائم ويطلب منه التكيف."],["L13","n","خطط معلم درسه منذ البداية بحيث يعرض المحتوى نصاً وصورة وصوتاً، ويتيح للطلاب إظهار تعلمهم كتابةً أو شفهياً أو بمنتج، وينوع أساليب التحفيز. يطبق المعلم:",["مبادئ التصميم الشامل للتعلم","التعليم المبرمج الخطي","نموذج التدريس المباشر الصريح","استراتيجية التعلم للإتقان"],"التصميم الشامل للتعلم من ممارسات التعليم الشامل: وسائل متعددة للتمثيل وللتعبير والأداء وللمشاركة والتحفيز، يُخطط لها من البداية لا بعد ظهور المشكلة."],["L13","n","وفق مؤشرات المعيار الثامن، تشمل الأولويات المتصلة بالأبعاد المشتركة في المناهج:",["المواطنة المسؤولة وريادة المملكة والتنمية المستدامة","تقوى الله والوسطية والاعتدال والشغف المعرفي وتقدير الذات","حل المشكلات والاعتماد على الذات والتواصل والعمل الجماعي","القراءة والكتابة والحساب والمهارات الرقمية"],"مؤشر 8.4 الأول: خبرات تستهدف تنمية الأولويات المتصلة بالمواطنة المسؤولة ومكانة المملكة الريادية والتنمية المستدامة؛ البديل الثاني من القيم، والثالث من المهارات."],["L13","n","يدرّس معلم علوم درساً عن الطاقة، فكلف طلابه بتحليل فاتورة كهرباء المدرسة واقتراح خطة لترشيد الاستهلاك. الأولوية التي ينميها بصورة مباشرة:",["التنمية المستدامة","الشغف المعرفي","تقدير الذات","مكانة المملكة الريادية"],"ترشيد الموارد والحفاظ عليها للأجيال القادمة من صور التنمية المستدامة، وهي إحدى الأولويات في مؤشر 8.4."],["L13","n","أي المجموعات الآتية تمثل القيم الست التي نص عليها مؤشر المعيار الثامن للأبعاد المشتركة؟",["تقوى الله، الوسطية والاعتدال، تقدير الذات، الشغف المعرفي، تقدير العمل وإتقانه، المسؤولية","الصدق، الأمانة، التعاون، النظافة، الطاعة، الكرم","المواطنة، الريادة، الاستدامة، الإبداع، الابتكار، التميز","حل المشكلات، الاعتماد على الذات، التواصل الفعال، القيادة، التفكير الناقد، العمل ضمن فريق"],"نص مؤشر 8.4: يراعي عند تطبيق الأنشطة تنمية قيم تقوى الله، والوسطية والاعتدال، وتقدير الذات، والشغف المعرفي، وتقدير العمل وإتقانه، والمسؤولية."],["L13","n","يطرح معلم أسئلة مفتوحة تثير الفضول، ويشجع طلابه على البحث عن إجابات خارج الكتاب ومشاركة اكتشافاتهم. القيمة التي ينميها أساساً من القيم الست في الأبعاد المشتركة:",["الشغف المعرفي","تقوى الله","الوسطية والاعتدال","تقدير العمل وإتقانه"],"الشغف المعرفي حب الاستطلاع والرغبة الذاتية في المعرفة والبحث، ويُنمّى بالأسئلة المفتوحة والمشروعات البحثية."],["L13","n","تراجع معلمة مع طالباتها مشروعاتهن مرحلة بعد مرحلة، وتطلب منهن تجويدها حتى تبلغ أفضل صورة ممكنة قبل التسليم. القيمة التي تعززها:",["تقدير العمل وإتقانه","الشغف المعرفي","الوسطية والاعتدال","تقدير الذات"],"تجويد العمل ومراجعته حتى يبلغ أفضل صورة تجسيد لقيمة تقدير العمل وإتقانه."],["L13","n","أي الأنشطة الآتية أقرب إلى تنمية مهارة «الاعتماد على الذات» الواردة في مؤشرات الأبعاد المشتركة؟",["تكليف الطالب بتخطيط مهمته وتنفيذها وتقويمها بنفسه","تقديم المعلم الحل كاملاً ثم مطالبة الطالب بنسخه","حل الطالب التمارين بمساعدة ولي أمره في كل خطوة من خطوات الحل","انتظار الطالب تعليمات المعلم قبل كل خطوة"],"الاعتماد على الذات ينمو حين يتولى الطالب التخطيط والتنفيذ والتقويم بنفسه، مع دعم يتلاشى تدريجياً."],["L13","n","يعرض معلم على طلابه مشكلة واقعية في المدرسة، ويطلب منهم تحديدها وجمع المعلومات عنها واقتراح حلول وتجريب أفضلها. المهارة التي يستهدفها من مهارات إطار المناهج:",["حل المشكلات","الحفظ والاستظهار","القراءة الجهرية","الإصغاء بتفهم"],"مؤشر 8.4: يقدم أنشطة ومهام تساعد المتعلمين على استخدام استراتيجيات تنمي المهارات المحددة في إطار المناهج، ومنها حل المشكلات بخطواته."],["L14","n","اكتشف معلم بعد انتهاء الحصة أنه شرح قاعدة بصورة خاطئة. التصرف الذي يتفق مع مؤشرات المعيار التاسع:",["الاعتراف بالخطأ في الحصة التالية وتصحيحه","تجاهل الخطأ حفاظاً على مكانته أمام الطلاب","تصحيحه في ورقة الاختبار دون إشارة إلى ما حدث","انتظار أن يكتشف الطلاب الخطأ بأنفسهم"],"مؤشر 9.2 للممارس: يتراجع عن الخطأ ويصححه عند حدوثه؛ والاعتراف يعزز الثقة ويعلّم الأمانة العلمية ولا ينقص من مكانة المعلم."],["L14","n","طلب طالب من معلمه التواصل معه عبر حسابه الشخصي في وسائل التواصل لمناقشة أمور خاصة. التصرف الأنسب الذي يحفظ حدود العلاقة المهنية:",["توجيهه بلطف إلى القنوات المدرسية المعتمدة والموجه الطلابي","قبول الطلب والتواصل معه عبر حسابه الخاص لتقوية العلاقة وكسب ثقته","رفض الطلب بحدة أمام زملائه ليكون عبرة لغيره","تجاهل الطلب دون أي رد"],"مؤشر 9.2: يبقي علاقته مع المتعلمين ضمن حدود العلاقات المهنية؛ التوجيه للقنوات المعتمدة يحفظ الحدود دون جرح الطالب، والأمور الخاصة مجالها الموجه الطلابي."],["L14","n","وفق قواعد السلوك والمواظبة 1447، أي الأدوار الآتية من أدوار المعلم المنصوص عليها؟",["تمثيل القدوة الحسنة في القول والفعل","توثيق درجات السلوك ورصدها في نظام نور","إصدار قرار نقل الطالب المخالف إلى مدرسة أخرى","حسم درجات المواظبة على الطالب المتغيب"],"من أدوار المعلم في القواعد: تمثيل القدوة الحسنة في القول والفعل وتعزيز الانضباط الذاتي؛ أما توثيق درجات السلوك وحسم المواظبة فمن أدوار إدارة المدرسة، وقرار النقل تصدره الجهة المختصة في إدارة التعليم."],["L14","n","تأخر طالب في المرحلة المتوسطة عن دخول الحصة لأول مرة. وفق قواعد السلوك والمواظبة 1447، الإجراء الذي يتخذه المعلم:",["تنبيه شفهي أول بأسلوب تربوي يوضح أضرار السلوك","حسم درجتين من درجات السلوك الإيجابي","استدعاء ولي الأمر وأخذ تعهد خطي عليه بعدم التكرار","تحويله فوراً إلى لجنة التوجيه الطلابي"],"التأخر في الدخول إلى الحصص من مشكلات الدرجة الأولى، والإجراء الأول فيها التنبيه الشفهي من المعلم بأسلوب تربوي؛ وللمعلم مباشرة الإجراءات الثلاثة الأولى منها."],["L14","n","خرج طالب من الفصل دون استئذان أثناء الحصة. وفق قواعد السلوك والمواظبة 1447، دور المعلم في هذه الحالة:",["رصدها وتسليم اسم الطالب للإدارة لأنها من الدرجة الثانية","حسم درجات السلوك بنفسه مباشرة، ثم إبلاغ الطالب وولي أمره بذلك","إخراج الطالب من الصف بقية اليوم","الاكتفاء بالتنبيه الشفهي دون توثيق"],"الدخول أو الخروج من الفصل دون استئذان من مشكلات الدرجة الثانية، وعلى المعلم رصد مشكلات الدرجة الثانية فأعلى التي باشرها وتسليم الأسماء للإدارة التي تتخذ الإجراءات؛ وإقصاء الطالب خارج الصف ممارسة ممنوعة."],["L14","n","أي الممارسات الآتية نصت قواعد السلوك والمواظبة 1447 على تجنبها عند التعامل مع الطالب المخالف؟",["تكليفه بنسخ الواجب المدرسي عدة مرات عقاباً","تمكينه من فرص تعويض الدرجات المحسومة","إشعار ولي أمره بالإجراءات المتخذة","مراعاة مناسبة الإجراء لمرحلته العمرية"],"من الممارسات غير التربوية الممنوعة: الإيذاء الجسدي أو النفسي، التسبب في انقطاعه عن التعليم، حرمانه من الإفطار، تكليفه بنسخ الواجب عدة مرات كعقاب، استفزازه، السخرية منه، وإقصاؤه خارج الصف."],["L14","n","خطط معلم لنشاط على الأجهزة اللوحية، لكن المتوفر منها 10 أجهزة لفصل فيه 30 طالباً. الإجراء الأنسب لضمان إتاحة المصدر للجميع:",["مجموعات تتناوب على الأجهزة بأدوار محددة مع مهمة موازية","إعطاء الأجهزة للطلاب المتفوقين فقط لضمان إنجاز النشاط","إلغاء النشاط كاملاً","السماح لمن يملك جهازاً شخصياً فقط بالمشاركة في النشاط الرقمي"],"مؤشر 9.3: يتأكد من جاهزية مصادر التعلم وإمكانية وصول جميع المتعلمين إليها؛ والتناوب المنظم يحقق العدالة والإتاحة."],["L14","n","قبل حصة تعتمد على عرض مرئي، أي الإجراءات الآتية يحقق مؤشر جاهزية مصادر التعلم؟",["فحص الجهاز والعرض مسبقاً وتجهيز بديل","تشغيل الجهاز لأول مرة أمام الطلاب","الاعتماد على الطلاب لإصلاح أي عطل","تأجيل العرض إذا تعطل الجهاز إلى الأسبوع التالي"],"جاهزية المصدر تعني التأكد منه قبل الحصة ووجود خطة بديلة تحفظ وقت التعلم."],["L14","n","انطلق إنذار الحريق أثناء الحصة. أول ما يفعله المعلم:",["إخراج الطلاب بهدوء عبر مسار الإخلاء دون أخذ الحقائب","السماح للطلاب بجمع أغراضهم قبل الخروج","التحقق بنفسه من مصدر الإنذار قبل إخراج الطلاب","إبقاء الطلاب في الفصل مع إغلاق الباب حتى تصل تعليمات الإدارة"],"عند الإنذار تُنفذ خطة الإخلاء فوراً بهدوء وعبر المسار المحدد دون الانشغال بالأغراض، ثم يُتحقق من عدد الطلاب في نقطة التجمع."],["L14","n","قبل تنفيذ تجربة في المختبر، أي الإجراءات الآتية أولى بتحقيق عوامل الأمن والسلامة؟",["شرح تعليمات السلامة وارتداء أدوات الوقاية ووسم المواد","السماح للطلاب بتذوق المواد للتعرف عليها","البدء بالتجربة مباشرة ثم شرح التعليمات في نهايتها","ترك الطلاب ينفذون التجربة دون إشراف لتنمية استقلاليتهم"],"مؤشر 9.3: يهيئ البيئة التعليمية بطريقة تحقق عوامل الأمن والسلامة؛ وفي المختبر تسبق التعليماتُ وأدواتُ الوقاية ووسمُ المواد والإشرافُ الدائم أيَّ تجربة."],["L14","n","أخبر طالب معلمه بنيته إيذاء نفسه وبدا مضطرباً. وفق إجراءات الحالات عالية الخطورة في قواعد السلوك والمواظبة 1447، أنسب تصرف:",["أخذ كلامه بجدية وعدم تركه بمفرده مع إبلاغ الإدارة فوراً","مطالبته بالعودة إلى مقعده بهدوء حتى نهاية الحصة ثم الحديث معه","توجيه أسئلة كثيرة له لمعرفة كل التفاصيل قبل إبلاغ أحد","إخبار زملائه بحالته ليراقبوه"],"المادة 30: التعامل مع الحالة بهدوء وأخذ أقوالها بجدية، وتجنب الضغط عليها بكثرة الأسئلة، ووضعها في مكان آمن وعدم تركها بمفردها، ومراعاة خصوصيتها، وتبليغ الجهات المختصة فوراً."],["L02","n","وفق قواعد السلوك والمواظبة 1447، كيف توزع درجة السلوك البالغة 100 درجة؟",["80 درجة للسلوك الإيجابي و20 درجة للسلوك المتميز","50 درجة للسلوك و50 درجة للمواظبة","100 درجة للسلوك الإيجابي تُحسم منها المخالفات فقط","60 درجة للسلوك داخل الفصل و40 درجة خارجه"],"تخصص 100 درجة للسلوك: 80 للسلوك الإيجابي يستحقها الطالب تلقائياً بداية كل فصل وتُحسم عند المخالفة، و20 للسلوك المتميز الذي يعكس القيم الإسلامية والهوية الوطنية."],["L02","n","تغيب طالب يوماً دون عذر مقبول. أثر ذلك على درجة مواظبته وفق قواعد السلوك والمواظبة 1447:",["حسم درجة واحدة من درجات المواظبة","حسم خمس درجات من درجات المواظبة","حرمانه من دخول الاختبار مباشرة","لا يؤثر الغياب في الدرجة إلا بعد أسبوع"],"تُحسم درجة واحدة من درجات المواظبة عن غياب كل يوم دراسي بدون عذر؛ ويُحرم الطالب من الانتقال إذا تجاوز غيابه بدون عذر 10% من أيام العام."],["L02","n","وفق قواعد السلوك والمواظبة 1447، أي الآتي لا يدخل في مهام الموجه الطلابي؟",["رصد درجات السلوك وتنفيذ إجراءات الحسم على الطالب المخالف","دراسة حالة الطالب المخالف بعد تنفيذ الإجراء","متابعة الطلبة متكرري الغياب بالتنسيق مع وكيل شؤون الطلبة","توعية الطلبة المخالفين بحقهم في فرص تعويض الدرجات"],"نصت الأحكام العامة على عدم إشراك الموجه الطلابي في رصد درجات السلوك ولا في تنفيذ الإجراءات أو حسم درجات المواظبة، والاكتفاء بدوره في دراسة الحالة وعلاجها."],["L15","n","أثناء الشرح طلب معلم من الطلاب رفع بطاقات (نعم/لا) للإجابة عن سؤال سريع، فلاحظ أن نصفهم أخطأ فأعاد شرح الفكرة بمثال آخر. يمثل هذا الإجراء:",["تقويماً غير رسمي ضمن دورة التقويم قصيرة المدى","تقويماً رسمياً ضمن دورة التقويم طويلة المدى","تقويماً ختامياً لإصدار حكم نهائي على تعلم الطلاب","تقويماً معيارياً لترتيب الطلاب"],"التقويم غير الرسمي يجري تلقائياً أثناء التدريس دون درجة وغرضه تعديل التدريس فوراً، وتعديل الشرح داخل الحصة دورة تقويم قصيرة المدى (مؤشر 10.1)."],["L15","n","أي الأمثلة الآتية يمثل تقويماً رسمياً؟",["اختبار قصير معلن مسبقاً بزمن ودرجة محددين","ملاحظة المعلم لتفاعل الطلاب أثناء النقاش","سؤال شفهي عابر لتفقد الفهم","إشارة الطلاب بالإبهام لمدى فهمهم أثناء الشرح"],"التقويم الرسمي مخطط ومنظم وموثق بشروط محددة ويُبنى عليه حكم؛ البقية أساليب غير رسمية تجري ضمن التدريس."],["L15","n","وفق لائحة تقويم الطالب 2025 وإجراءاتها التنفيذية، توزع درجة المادة (100) في الصفوف من الثالث الابتدائي إلى الثالث الثانوي للمواد التي تقوم تكوينياً وختامياً على النحو الآتي:",["60 درجة للتقويمات التكوينية و40 درجة لاختبار نهاية الفترة","40 درجة للتقويمات التكوينية و60 درجة لاختبار نهاية الفترة","50 درجة للأعمال و50 درجة للاختبار","100 درجة لاختبار نهاية الفترة فقط"],"نصت الإجراءات التنفيذية على 60 درجة للتقويمات التكوينية بحسب أدوات التقويم ووحدات المقرر، و40 درجة لاختبار نهاية كل فترة دراسية."],["L15","n","طالب في الصف الثاني الثانوي حصل في إحدى المواد على 62 من 100 في الفترة الدراسية، لكنه حصل في اختبار نهاية الفترة التحريري على 6 من 40. وفق لائحة تقويم الطالب 2025، وضعه في المادة:",["لا يُعد ناجحاً لعدم تحقيقه 20% من درجة الاختبار التحريري","يُعد ناجحاً لأن مجموعه تجاوز النهاية الصغرى 50% من الدرجة","يُعد ناجحاً لأن الاختبار التحريري لا يدخل في شروط النجاح","يعيد الصف كاملاً دون دور ثانٍ"],"شرطا النجاح في المقرر بالمرحلة الثانوية: النهاية الصغرى (50%)، والنسبة الشرطية (20% من درجة الاختبار التحريري نهاية الفترة)؛ و20% من 40 = 8 درجات و6 أقل منها، فلا يُعد ناجحاً رغم تجاوز مجموعه 50، ويُختبر في الدور الثاني الذي لا تُطبق فيه النسبة الشرطية."],["L15","n","طالب لديه صعوبات تعلم في القراءة يعرف الإجابات لكنه يعجز عن قراءة أسئلة اختبار العلوم. التسهيل المناسب وفق الإجراءات التنفيذية للائحة تقويم الطالب:",["قراءة الأسئلة له بصوت مسموع قبل الإجابة","إعفاؤه من اختبار العلوم كاملاً","تخفيض درجة الاختبار إلى النصف","إعطاؤه أسئلة أسهل من أسئلة زملائه دون الرجوع لخطته"],"نصت الإجراءات التنفيذية على أنه إذا كانت قراءة الأسئلة مشكلة لدى طالب صعوبات التعلم فيجب أن تُقرأ له بصوت عال؛ والتسهيل يغير طريقة الأداء لا المستوى المقيس."],["L15","n","وفق الإجراءات التنفيذية للائحة تقويم الطالب، أي الآتي يُراعى في جميع حالات تقويم الطالب ذي الإعاقة؟",["ألا يُختبر في أكثر من مادة تحريرية في اليوم مع زمن مناسب","أن يُختبر مع زملائه في الوقت نفسه وبالشروط نفسها دون استثناء","أن تُخفض درجة النجاح إلى النصف في جميع المواد","أن يتولى معلم التعليم العام وحده إعداد أسئلته"],"نصت القاعدة السابعة على ألا يُختبر الطالب ذو الإعاقة في أكثر من مادة تحريرية في اليوم الواحد مع إعطائه الزمن المناسب وتقديم الدعم، ويتولى معلم التربية الخاصة الإشراف على تقويمه بالتعاون مع معلم التعليم العام."],["L15","n","طالب أصم في فصل دمج يكتب إجابات صحيحة المضمون لكنها تتضمن أخطاء إملائية ونحوية. وفق الإجراءات التنفيذية للائحة تقويم الطالب، يصحح معلم الدراسات الاجتماعية إجابته بحيث:",["يقيّم المضمون ولا يحاسبه على الأخطاء اللغوية","يحسم درجة عن كل خطأ إملائي","يطلب منه إعادة الإجابة شفهياً","يعطيه صفراً في الأسئلة التي فيها أخطاء لغوية"],"نصت الإجراءات على ألا يتأثر تقويم الطالب الأصم بالتركيب البنائي للغته المكتوبة، وعدم محاسبته على الأخطاء الإملائية أو النحوية في جميع المواد."],["L15","n","طالب لديه فرط حركة وتشتت انتباه يجد صعوبة في البقاء على مقعده طوال الاختبار. أي التسهيلات الآتية نصت عليها الإجراءات التنفيذية للائحة تقويم الطالب؟",["السماح له بالتحرك وتوزيع الاختبار على فترات قصيرة","إخراجه من قاعة الاختبار عند كثرة حركته","إعفاؤه من الاختبار والاكتفاء بالأعمال","إلزامه بالجلوس حتى نهاية الوقت ليتعود الانضباط والهدوء"],"نصت القاعدة السابعة لذوي فرط الحركة وتشتت الانتباه على توزيع محتوى الاختبار على فترات قصيرة، والسماح بالتوقف والتحرك، والاختبار في ركن خاص بعيداً عن المشتتات."],["L16","n","رصد معلم نتائج طلابه في برنامج جداول، فوجد أن نسبة الإتقان في معيار «حل المسائل الكلامية» بلغت 35% من الصف، بينما تجاوزت 80% في بقية المعايير. القرار الأنسب في ضوء هذا المؤشر:",["إعادة تدريس المعيار للصف بطريقة مختلفة ثم إعادة تقويمه","إعداد خطة علاجية فردية لطالبين أو ثلاثة فقط","الانتقال إلى الوحدة التالية لأن معظم المعايير متقنة","حذف أسئلة هذا المعيار من الاختبارات القادمة"],"انخفاض الإتقان لدى أغلب الصف في معيار بعينه مؤشر على حاجة التدريس نفسه إلى التعديل؛ أما انخفاضه لدى قلة فتعالجه خطط فردية (مؤشر 10.3: استخلاص المؤشرات الأساسية للأداء وتوظيفها)."],["L16","n","في الصفين الأول والثاني الابتدائي، تنص الإجراءات التنفيذية للائحة تقويم الطالب على أن يدوّن المعلم تقويمه للطالب في المعايير:",["يومياً في سجل المتابعة، ثم يرصد الخلاصة في النظام الرقمي نهاية الفترة","مرة واحدة في نهاية العام الدراسي، مباشرة في النظام الرقمي دون سجل يومي","في دفتر خاص لا يطلع عليه أحد","عند طلب ولي الأمر فقط"],"نصت الإجراءات على أن يدون المعلم تقويمه بشكل يومي في سجل متابعة تقويم الطالب، ثم يرصد خلاصة تقويمه وملحوظاته في النظام الرقمي نهاية الفترة موثقة بشواهد في ملف إنجاز الطالب."],["L16","n","أراد معلم أن يرى بسرعة في جدول درجات طلابه من لم يبلغ مستوى الإتقان في كل معيار. أنسب خاصية في برنامج الجداول لذلك:",["التنسيق الشرطي لتلوين ما دون حد الإتقان","ترتيب الطلاب أبجدياً حسب أسمائهم","تغيير نوع الخط وحجمه في جميع أعمدة الدرجات","دمج الخلايا في رأس الجدول وتلوينه"],"التنسيق الشرطي يلوّن الخلايا وفق شرط محدد (مثل أقل من 75%)، فيستخلص المعلم بسرعة الطلاب والمعايير المحتاجة إلى علاج."]];
window.QREPLY = {"y8vo9m":["24 أكتوبر 2026","وصلتنا بلاغات بأن السؤال غير واضح. الإجابة كانت صحيحة، لكن أعدنا صياغته ليذكر الصورة السباعية للهرم صراحة، فالهرم الخماسي المشهور ليس فيه شيء بين التقدير وتحقيق الذات. شكراً لكل من بلّغ."],"1qnxlc4":["24 أكتوبر 2026","الإجابة 0.56 صحيحة: معامل الصعوبة يُحسب بنسبة من أجاب إجابة صحيحة (دليل الاختبارات للوزارة 2025). ولأن جملة التعريف في الدليل نفسه تذكر نسبة المخطئين، حذفنا البديل 0.44 حتى لا يكون للسؤال جوابان."],"1d6utx1":["24 أكتوبر 2026","راجعناه على الدليل التنظيمي للتربية الخاصة، ونصه: «تتم عملية القياس والتشخيص بعد أخذ موافقة ولي الأمر خطياً وبعد إشعاره رسمياً». الإجابة صحيحة."],"p6427r":["24 أكتوبر 2026","الإجابة صحيحة: المنازل تُعدّ من اليمين (آحاد، عشرات، مئات، آحاد ألوف، عشرات ألوف، مئات ألوف). الرقم 5 الذي على يسار 7 في منزلة مئات الألوف، أما الرقم 5 الآخر ففي الآحاد."],"18vs1n7":["23 أكتوبر 2026","راجعناه على وثيقة سياسة التعليم: الإجابة صحيحة، فالجهة العليا تقرّ الخطط وتشرف، والتنفيذ (إعداد المعلمين وتدريبهم وبناء المقررات) للوزارة والجامعات. وأضفنا في الشرح أن الوثيقة تسمّيها «المجلس الأعلى للتعليم» (المادة 231)."],"17oz8yr":["23 أكتوبر 2026","راجعناه: الإجابة صحيحة. التعامل المهني المحترم وفق مقتضيات العمل هو الوسطية، أما الدعوة في كل لقاء أو تقليل التعامل لاختلاف الدين فيخالفان التسامح والتعايش."],"tqz26h":["23 أكتوبر 2026","راجعناه على وثيقة سياسة التعليم (المواد 56 و188 و191): الإجابة صحيحة، فالرعاية شاملة لكل الفئات بخطة مدروسة، بلا تفضيل فئة على أخرى."],"1ij78f9":["23 أكتوبر 2026","راجعناه: الإجابة الأنسب الحوار الهادئ الذي يبيّن أن حب الوطن لا يتعارض مع الانتماء للأمة. البدائل الأخرى تُسكت الطالب أو تنفي انتماءه، وهذا يخالف الوسطية."],"9f63c8":["23 أكتوبر 2026","الإجابة صحيحة: السؤال يطلب ما لا يساعد على تحسين التعلم. معرفة أصحاب أعلى الدرجات لا تكشف ضعفاً في التدريس، بخلاف تحليل الأسئلة والفروق بين الفصول."],"10nrzay":["23 أكتوبر 2026","صحّحنا هذا السؤال بعد بلاغ وصلنا: ميزة الطريقة الاستقرائية أنها تعوّد الطالب الوصول إلى القاعدة بنفسه من الأمثلة، أما تقديم القاعدة أولاً فمن الطريقة القياسية. شكراً للمبلّغ."]};
window.OFFICIAL = [["L13","إستراتيجية التعلم التي يبحث فيها الطلاب عبر الإنترنت بحثًا جماعيًّا للوصول إلى المعلومات من مصادر موثوقة ومعدة سابقًا من طرف المعلم هي:",["الرحلات الميدانية.","الرحلات المعرفية.","التعلم المبرمج.","التعلم المدمج."],1,"الرحلات المعرفية (الويب كويست) تقوم على بحث جماعي عبر الإنترنت في مصادر اختارها المعلم مسبقًا. الرحلات الميدانية أنشطة خارج الصف، والتعلم المبرمج فردي ذاتي لا جماعي، والتعلم المدمج يدمج الإلكتروني بالصفي التقليدي. (المعيار 8.3)","1441"],["L13","لدعم عمليات التعلم بالاستقصاء، يُدرب المعلم طلابه على:",["الملاحظة وتنظيم البيانات.","استخدام وسائل التواصل التقني.","تقويم جودة الحلول التي يتوصل لها.","سرعة إنجاز المهام بنسبة مقبولة من الأخطاء."],0,"الاستقصاء يولّد المعرفة بالبحث وطرح الأسئلة عبر عمليات عقلية أساسها الملاحظة والتصنيف والقياس والتنبؤ. تقويم جودة الحلول مستوى لاحق يأتي بعد البحث، والتواصل التقني أداة بلا عملية عقلية، والإتقان السريع يتعلق بمعرفة سابقة. (المعيار 9.4)","1441"],["L12","(قدرة المتعلم على نقد وتبرير الأفكار بالنسبة لهدف معين)، يصنف هذا الهدف وفقًا لتصنيف بلوم في مستوى:",["الفهم.","التحليل.","التركيب.","التقويم."],3,"النقد والتبرير وإصدار الأحكام هي جوهر مستوى التقويم. التحليل يفكك المعلومات ويوضح العلاقات بينها، والتركيب يجمع الأفكار في بناء جديد، والفهم يصف ويفسر فقط. (المعيار 10.1)","1441"],["L13","عند طرح الأسئلة الصفية على الطلاب بهدف استثارة تفكيرهم، ينبغي على المعلم أن يركز على:",["أن يكون للسؤال إجابة واحدة صحيحة.","أن يطرح السؤال بلغة صحيحة وسليمة.","الأسئلة المباشرة التي تبحث عن حقائق محددة.","الأسئلة المفتوحة التي لا تبحث عن إجابة محددة."],3,"الأسئلة المفتوحة تتعلق بمستويات التفكير العليا فتستثير التفكير. البديلان (أ، ب) من اشتراطات صياغة الأسئلة عمومًا، والأسئلة المباشرة ترتبط بمستوى الحفظ والتذكر. (المعيار 8.3)","1441"],["L12","أي من التصنيفات الآتية يتناول المستويات العليا للأهداف النفس حركية؟",["الاستقبال - الاستجابة - التقمص.","الملاحظة - التقليد - التجريب.","الممارسة – الإتقان - الإبداع.","التقدير - التنظيم - التجسيد."],2,"الممارسة والإتقان والإبداع هي المستويات الثلاثة العليا في المجال النفس حركي. (ب) هي مستوياته الدنيا، أما (أ) و(د) فهما المستويات الدنيا والعليا للمجال الوجداني. (المعيار 10.1)","1441"],["L14","حضر معلم الصف الرابع الابتدائي موقفًا تعرض فيه أحد الطلاب للعنف اللفظي (الشتم) لأول مرة في الفصل من قِبَل مجموعة من الطلاب. أي من الآتي تكون الخطوة الأولى التي يتخذها المعلم كتصرف مباشر في مثل هذا الموقف عامة؟",["مساعدة الطالب المعنف على تعلم المهارات الاجتماعية المناسبة لعمره.","إبلاغ الإداريين والأهل بالحادثة ليتم التدخل بالأسلوب الملائم.","إشعار الطلاب المعتدين بأن سلوكهم مرفوض وستتبعه إجراءات تأديبية.","توفير نموذج للسلوك المقبول والذي يفترض على جميع الطلاب اتباعه."],2,"الخطوة الأولى في موقف يحدث لأول مرة هي إشعار المعتدين فورًا بأن سلوكهم مرفوض لتحقيق البيئة الآمنة. (أ) و(ب) خطوتان لاحقتان، و(د) إجراء عام في لائحة السلوك لا يعالج الموقف نفسه. (المعيار 9.3)","1441"],["L09","استخدام الخبرات السابقة في موقف تعليمي جديد يسمى:",["تعزيز التعلم.","الدافعية للتعلم.","انتقال أثر التعلم.","النضج المرافق للتعلم."],2,"انتقال أثر التعلم هو توظيف معلومات أو خبرات سابقة في أداء مهام في مواقف جديدة. التعزيز يدعم السلوك ليتكرر، والدافعية حالة داخلية تحرك السلوك نحو الهدف، والنضج تغيرات بيولوجية داخلية مع النمو. (المعيار 5.2)","1441"],["L04","تلقى أحد معلمي الصف الأول الثانوي مكالمة هاتفية من والد أحد طلابه وقد كان منزعجًا من حادثة حصلت لابنه في فصل هذا المعلم ويرى أن ابنه تمت معاقبته بطريقة غير عادلة، فاستجاب المعلم وطلب موعدًا لمقابلة الأب للاهتمام بالمشكلة وهو يرغب في اتخاذ خطوات لضمان التواصل الفعال مع الأب والوصول إلى مقابلة مجدية. يستطيع المعلم أن يحقق هدفه من المقابلة إذا بدأها بما يأتي:",["يطلب من الأب توضيح ردة فعله التي يظن أنها الأنسب للتعامل مع الموقف.","يتيح الفرصة للأب للتعبير عن رأيه ومشاعره ووصف فهمه لما حصل.","يراجع مع الأب قوانين المدرسة والفصل التي خالفها ابنه في ذلك الموقف.","يصف للأب بالتفصيل وجهة نظره فيما يتعلق بالحادثة وأسباب ردة الفعل."],1,"الخطوة الأولى للتفاعل الإيجابي مع ولي الأمر هي السماح له بالتعبير عن رأيه ومشاعره تجاه المشكلة. البدائل (أ، ج، د) خطوات لاحقة تأتي بعد معرفة رأي ولي الأمر وخلفيته عن الموقف. (المعيار 3.2)","1441"],["L03","يطلب المعلم في عامه الأول ـ أحيانًا ـ من زملائه الأكثر خبرة زيارته في الفصل وتقديم النقد البنّاء له. أي من الآتي تُعد أهم فائدة تحصل من هذه الطريقة؟",["تسهم في اعتياد المعلم على عملية التقويم وإحساسه بالراحة فيها.","تساعد المعلم على تعلم تطبيق المبادئ التدريسية بفاعلية في جو الفصل.","تقدم للمعلم المعرفة والخبرة بأساليب التدريس المتنوعة.","توصل لزملاء المعلم رغبته في أن يكون عضوًا فاعلًا في الفريق."],2,"المعلم الجديد يفتقر للخبرة بالأساليب التدريسية، وزيارة الزملاء له تطلعه على الأساليب الناجحة التي يستخدمونها من واقع خبراتهم. اعتياد التقويم أو إظهار الرغبة في الانتماء فوائد أقل، و(ب) لم تتضح علاقته المباشرة بالزيارة. (المعيار 2.1)","1441"],["L05","(إن الصفوة الممتازة من مثقفي الأمة العربية مشدودة إلى مجلات ودوريات تصدر في العالم العربي وتقوم بعملية التوصيل. وسر ذلك الشد والشوق والانبهار أن تلك المجلات والدوريات تعيش واقع عصرها في تغيراته الفكرية والأدبية والفنية، فتربط قارئها بما يحقق له معنى المعاصرة والمعايشة والمتابعة، وتوقظ في المكتفي بروائع تراث أمته الشعور بالتطلع إلى الإضافة بأخذ المزية وترك المجمل). الفكرة الرئيسة في هذا النص هي:",["اهتمام المثقفين بالمجلات والدوريات.","دور المجلات والدوريات في إبراز روائع التراث.","سبب اهتمام المثقفين بالمجلات والدوريات.","انقطاع صلة المثقفين بالتراث وانبهارهم بالمجلات."],2,"النص بمجمله يفسر «سر» اهتمام المثقفين بالمجلات، فالفكرة الرئيسة هي السبب لا مجرد الاهتمام. (أ) فكرة عامة لم يتناولها النص إلا كسبب، و(ب) ليس في النص ما يدل على إبراز التراث، و(د) تعارض ما ذكره النص عن الاهتمام بالتراث. (المعيار 4.1)","1441"],["L09","يقوم خالد وهو طالب يدرس في الصف الأول الابتدائي بالتحدّث مع نفسه غالبًا أثناء حلّه للمسائل والأنشطة الصفيّة. هذا الحديث للنفس يُشير إلى أن الطفل:",["يستخدم إستراتيجية تساعده في توجيه عملية التفكير.","يُظهر عدم النضج الاجتماعي.","يطوّر عادة يجب علاجها إذا استمرت.","يوظّف إستراتيجية لجذب انتباه الآخرين له."],0,"الحديث الذاتي عند فيجوتسكي وسيلة ينظم بها الطفل تفكيره ويوجه سلوكه أثناء حل المشكلات، وهو طبيعي في هذه السن. اعتباره عدم نضج أو عادة تحتاج علاجًا خطأ شائع. (المعيار 5.2)","1441"],["L13","أيٌ مما يأتي يُعَدُّ ميزة لاستخدام إستراتيجيات تدريسية متنوعة؟",["انخفاض احتمالية كره الطلاب لمواضيع أو مواد محددة.","منح المعلمين مرونة أكبر في تحضير الدروس والأنشطة.","إعطاء الطلاب فرصة لتعميم المعرفة الجديدة وتطبيقها.","تقليل شعور المعلمين بالضغط الناتج عن كثرة الموضوعات."],0,"التنويع في الإستراتيجيات يراعي أنماط الطلاب وميولهم فيقل الملل والنفور من المادة، وهذه ميزة تعود على المتعلم. (ج) ميزة الممارسة والتطبيق لا التنويع بحد ذاته، و(ب) و(د) تركزان على راحة المعلم لا على تعلم الطالب. (المعيار 8.3)","1441"],["L11","يعرض معلم التاريخ موضوع الهجرة النبوية من خلال تصميم نشاط قائم على الأسئلة باستخدام مراكز للتعلّم موزعة في صالة الأنشطة الدراسية بحيث يمر الطلاب على كل مركز منها في مجموعات تعاونية ويقومون بالقراءة أو الاستماع للتسجيل ومشاهدة لمقاطع ورسوم متحركة، وإكمال الأنشطة والأسئلة المتعلقة بالموضوع. أثناء تطبيق هذا النوع من الأنشطة، فإن أنسب دور يمكن للمعلم تأديته هو:",["المراقب بحيث يراقب الطلاب ويقوّم تقدّمهم.","النموذج الذي يشرح للطلاب الطرق المناسبة لأداء مهامهم.","المسهل الذي يقدم الدعم والإيضاحات للطلاب عند حاجتهم لها.","المدرب الذي يحلل أداء الطلاب ويقترح طرقًا لتحسينه."],2,"في مراكز التعلم التعاونية يكون التعلم متمركزًا حول الطالب، ودور المعلم ميسّر يقدم الدعم عند الحاجة. المراقب والمدرب يركزان على التقويم والتصحيح، والنموذج الشارح يعيد المعلم إلى مركز العملية. (المعيار 7.2)","1441"],["L14","أي الأعمال الآتية التي يؤديها المعلم يكون لها الأثر الأكبر في دعم طلاب الصف الثالث الثانوي عندما يكون أداؤهم جيدًا؟",["وضع ملصق مكتوب عليه عبارة «أحسنت» على أعمال الطلاب.","تسجيل أسماء الطلاب المكرمين أسبوعيًّا؛ لضمان عدم تجاهل أي طالب.","تقديم تعليقات إيجابية على الجوانب المميزة لديهم بشكل فردي.","خفض عدد الواجبات والمهام المطلوبة تشجيعًا لهم."],2,"التغذية الراجعة الفردية المحددة على الجوانب المميزة هي أقوى أشكال التعزيز لطلاب المرحلة الثانوية. الملصقات والقوائم الأسبوعية تعزيز عام غير محدد، وخفض الواجبات يقلل فرص التعلم. (المعيار 9.4)","1441"],["L09","الخطوة التي يجب على المعلم اتباعها لتعزيز قدرة الطلاب على تعلّم أي مهارة من خلال أسلوب الملاحظة هي:",["تعريف الطلاب بأصعب جوانب المهارة المقصودة.","شرح ترتيب الخطوات شفهيًّا للطلاب حسب ترتيبها في المهارة.","ضمان تركيز انتباه الطلاب على الجوانب المهمة في المهارة الموضحة.","تقديم أمثلة حيّة للطلاب على تطبيقات هذه المهارة في أرض الواقع."],3,"التعلم بالملاحظة (باندورا) يقوم أساسًا على وجود نموذج حي يؤدي المهارة أمام المتعلم ليقلده، فلا تعلم بالملاحظة بلا نموذج. (ج) مغرٍ لأن الانتباه أول عمليات النمذجة، لكنه شرط عند المتعلم يأتي بعد توفير النموذج؛ و(ب) شرح لفظي لا ملاحظة. (المعيار 10.2)","1441"],["L08","عُين أحد معلمي اللغة الإنجليزية لتدريس فصل يشتمل على عدد كبير من متعلمي اللغة الإنجليزية ذوي خلفيات لغوية متنوعة. يستطيع المعلم أن يعزز عملية التعلم لديهم على أفضل وجه عن طريق:",["جمع الطلاب ذوي المستوى المتقارب ليقدموا أنشطة في مجموعات صغيرة.","استخدام الأسئلة التي تتيح للطلاب تقديم إجابات مختصرة.","اتباع طريقة ثابتة لتقديم المفاهيم المهمة في الدرس للطلاب.","إتاحة الفرصة للطلاب ليتحدثوا عن محتوى الدرس."],0,"مراعاة الفروق الفردية تقتضي تجميع الطلاب في مجموعات متقاربة المستوى لتلقي أنشطة تناسب كل مجموعة. الإجابات المختصرة والطريقة الثابتة تتجاهل التنوع، و(د) مغرٍ لكنه لا يراعي اختلاف المستويات اللغوية. (المعيار 5.2)","1441"],["L14","أي العوامل الآتية يجب أن يأخذها المعلم بعين الاعتبار عندما يُرتب أماكن جلوس الطلاب والأدوات في الفصل؟",["مستويات إنجاز الطلاب.","طبيعة المادة والمهارات التي سيدرسها.","أنواع الأنشطة التعليمية التي سيستخدمها المعلم.","الخلفيات الاجتماعية والثقافية للطلاب."],2,"ترتيب البيئة المادية للصف يتبع نوع النشاط (فردي، مجموعات، نقاش، عرض). الترتيب بحسب مستوى الإنجاز أو الخلفية الاجتماعية يوصم الطلاب، وطبيعة المادة أعم من أن تحدد ترتيب المقاعد. (المعيار 9.3)","1441"],["L11","غالبًا ما يقدم أحد معلمي التاريخ مادته للطلاب على شكل قصة تقدم أوصافًا حيّة لشخصيات تاريخية ملهمة كافحت لتحقيق إنجازات عظيمة أو تصحيح أخطاء مجتمعية. أي من الجمل الآتية تصف أكثر النتائج احتمالًا عند استخدام هذه الإستراتيجية؟",["سيربط الطلاب بين فروع المادة العلمية مما يعيق فهمهم للمفاهيم الواسعة.","سيؤدي ذلك لاستخدام الطلاب لمخيلتهم وتنمية قدرتهم على تطبيق مهارات التفكير الإبداعي.","سيكون محتوى المادة أكثر سهولة للطلاب مما يزيد من استيعابهم لها.","سيصبح محتوى المادة أكثر ارتباطًا بحياة الطلاب مما يزيد من قدرتهم على تذكر المعلومات الواقعية."],3,"القصة تربط الحقائق التاريخية بحياة البشر وتجاربهم فتصبح ذات معنى وأسهل في التذكر. (ب) مغرٍ لكن الاستماع لقصة يقدمها المعلم لا ينمي التفكير الإبداعي بالضرورة، و(ج) السهولة ليست نتيجة مؤكدة. (المعيار 7.2)","1441"],["L10","أي مما يأتي يساعد المعلم في تعزيز التفكير الإبداعي لدى طلاب المرحلة المتوسطة بعد قراءة قصة خيالية مختارة؟",["يعيد الطلاب كتابة القصة لتغيير نهايتها.","يستخدم الطلاب الإنترنت لتحديد معلومات عن الكاتب.","يرسم الطلاب صورة لبطل القصة.","يصور الطلاب مقطعَ فيديو لإعادة تمثيل أحداث مختارة من القصة."],0,"إعادة كتابة القصة بنهاية جديدة تتطلب إنتاج أفكار أصيلة وهذا جوهر الإبداع. البحث عن الكاتب استدعاء معلومات، والرسم أو التمثيل إعادة إنتاج لما في القصة لا إضافة جديدة. (المعيار 8.2)","1441"],["L04","قام ولي أمر طالب بإرسال بريد إلكتروني لمعلم ولده، يسأله عن ابنه إن كان يعاني من صعوبات تعلم. الرد المناسب الذي ترى أنه سيقدمه المعلم في هذه الحالة هو:",["طلب موعد اجتماع بين ولي الأمر ومختص صعوبات التعلّم في المدرسة.","تقديم معلومات لولي الأمر عن خدمات تدريس الطلاب ذوي صعوبات التعلّم.","مناقشة عملية التدخلات النظامية ودور ولي الأمر في المراقبة والتقويم مع معلمه.","توصية ولي الأمر بمراقبة أداء ابنه في واجباته المدرسية وعاداته السلوكية."],0,"تشخيص صعوبات التعلم ليس من اختصاص معلم الصف، فالرد المهني إحالة ولي الأمر إلى المختص داخل المدرسة. البدائل الأخرى تفترض وجود الصعوبة قبل تشخيصها أو تقدم معلومات عامة لا تجيب عن السؤال. (المعيار 3.2)","1441"],["L03","ما الخطوة التي تقوم بها كمعلّم جديد بعد أن قضيت الأسبوع الأول في المدرسة لتساعدك في تحسين خطتك لإدارة الصف؟",["زيارة المكتبة للاطلاع على كتب ودراسات تساعد في توجيه التعامل مع أولياء الأمور.","مناقشة الصعوبات التي تراها مع مدير المدرسة وطلب تقويم متكرر لتحسين أدائك.","مراقبة المعلمين الفاعلين في المدرسة والاستفادة من خبراتهم في دعم مهاراتك التدريسية.","التعاون مع معلمين جدد آخرين في المدرسة ومناقشة الصعوبات التي واجهوها في المدرسة."],2,"التطوير المهني الأنفع للمعلم الجديد هو التعلم من الممارسة الناجحة لزملاء ذوي خبرة في السياق نفسه. المكتبة تركز على أولياء الأمور لا الإدارة الصفية، والمعلمون الجدد لا يملكون الخبرة، ومدير المدرسة خطوة أقل مباشرة. (المعيار 2.2)","1441"],["L04","يلتقي معلمو الصف الخامس الابتدائي بانتظام في إحدى المدارس لمناقشة الإستراتيجيات التدريسية التي تساعد الطلاب الذين لديهم صعوبة في مادة الرياضيات. الفائدة المرجوّة من هذا اللقاء مساعدة المعلمين على:",["تقديم تعليم مناسب لجميع أنواع ومستويات الطلاب.","مكافأة المعلمين الذين يستخدمون طرق تدريس فعّالة.","التأكيد على أن بعض المعلمين يستخدمون طرقًا تدريسية أفضل من غيرهم.","استشارة بعضهم بعضًا وتبادل الآراء حول إزالة الشعور بالإحباط لديهم."],0,"هذا مجتمع تعلم مهني هدفه تحسين تعلم الطلاب بتبادل الإستراتيجيات، لا المكافأة ولا المقارنة بين المعلمين. (د) يركز على مشاعر المعلمين لا على الطالب. (المعيار 3.1)","1441"],["L04","يرغب المعلّم (خالد) في التحدّث إلى أولياء أمور طلابه ومناقشتهم وتبادل الآراء معهم حول تقدّم الطلاب في الأداء. ما أفضل طريقة يمكن للمعلّم أن يطبقها لتحقيق هدفه؟",["كتابة ملاحظات إيجابية وإرسالها لأولياء الأمور حول مدى تقدّم أبنائهم.","عقد اجتماع لمناقشة الأهداف المشتركة مع أولياء الأمور حول أداء أبنائهم.","ضمان استلام أولياء الأمور تقارير الأداء لأبنائهم وتوقيعها وإعادتها للمعلم.","إلزام الطلاب بالمحافظة على دفتر المتابعة اليومية وتوقيعه من أولياء أمورهم."],1,"الهدف «مناقشة وتبادل آراء» ولا يحققه إلا تواصل ثنائي الاتجاه كالاجتماع. الملاحظات والتقارير ودفتر المتابعة تواصل في اتجاه واحد من المعلم إلى البيت. (المعيار 3.2)","1441"],["L14","لاحظت أثناء شرحك لدرس معيّن لطلابك عدم انتباه عدد من الطلاب ونوم أحدهم. ما التصرّف المناسب الذي تراه لمعالجة هذا الموقف؟",["تذكير الطلاب بأن عدم الانتباه للدرس سيكون له عواقب وخيمة.","التغافل عن هؤلاء الطلاب وعدم إرباك خطة سير الدرس.","عمل نشاط قصير لكسر الروتين عند الطلاب ثم العودة لشرح موضوع الدرس.","نقل أماكن جلوس الطلاب الذين لم ينتبهوا للدرس إلى المقاعد الأمامية."],2,"عدم الانتباه الجماعي مؤشر على ملل الدرس، والعلاج تغيير النشاط لاستعادة الانتباه ثم المتابعة. التهديد ونقل المقاعد يعالجان الطالب لا السبب، والتغافل يترك المشكلة. (المعيار 9.2)","1441"],["L15","طلب أحد المعلمين من طلابه في الصف الثالث الثانوي، كجزء من تقويم الأداء لديهم، أن يكمل كل طالب نموذج طلب توظيف على موقع إلكتروني مع إرفاق سيرته الذاتية. هذا النوع من الأسلوب التقويمي يسمح للطالب بأن:",["يطبق ما تعلّمه نظريًّا على أرض الواقع.","يحدد مهاراته التقنية التي يحتاجها.","يطبق إستراتيجيات ما وراء المعرفة.","يحدد أهدافه التعليمية التي يرغب في تحقيقها من المادة."],0,"هذا تقويم أصيل (واقعي) يقيس الأداء في مهمة من الحياة الحقيقية، فميزته تطبيق المتعلَّم في الواقع. تحديد المهارات أو الأهداف أو ما وراء المعرفة ليست غاية هذه المهمة. (المعيار 10.2)","1441"],["L14","اتبع معلم الصف الأول المتوسط خطوات معينة مع طلابه قبل أن يبدؤوا في تنفيذ مشاريعهم البحثية في مجموعات بغرض ضمان تنفيذ البحوث بسهولة. أي من الخطوات الآتية تعدّ أكثر فائدة لتحقيق هدفه؟",["الاجتماع بالطلاب في بداية العمل وعند نهايته لتقويم العمل.","عمل قائمة بالمهارات الأكاديمية اللازمة لإكمال المشروعات البحثية بنجاح.","وضع جدول يحدد أوقات الاجتماع بكل مجموعة بحثية؛ لمناقشتهم والإجابة عن أسئلتهم.","طلب المعلم من بقية زملائه معلمي الصف الأول المتوسط دمج بعض مهارات البحث في دروسهم."],2,"الهدف سهولة التنفيذ، وأكثر ما يضمنها متابعة منتظمة لكل مجموعة في جدول معلن يُجاب فيه عن أسئلتهم أثناء العمل. الاجتماع في البداية والنهاية فقط يترك فترة التنفيذ بلا دعم، وقائمة المهارات تخطيط لا متابعة. (المعيار 9.2)","1441"],["L14","اتفق المعلمون في إحدى المدارس المتوسطة في أحد اجتماعاتهم لمناقشة مشكلة التسرّب من المدرسة، على أهمية تحديد طرق لإدارة صفوفهم بصورة أكثر فاعلية. عند مناقشة هذه المشكلة يجب على المعلمين أن يأخذوا بعين الاعتبار أن الهدف الرئيس لإدارة بيئة تعلّم طلابهم هو تنظيم:",["الأنشطة المدرسية لضمان التركيز على الأنشطة التي يبادر بها الطلاب.","الوقت في جدول يتيح للطلاب معرفة أقصى وقت يستغرقه الدرس مسبقًا.","الوقت لضمان تنفيذ أنشطة تتيح المشاركة الجماعية والفردية بالتساوي.","الأنشطة بطرق تعزز حس الطلاب الانتمائي والمشاركة في عضوية مجتمع تعلّم متعاون."],3,"التسرب مرتبط بضعف الانتماء، فالهدف الرئيس لإدارة بيئة التعلم بناء شعور الطالب بالانتماء والعضوية في مجتمع متعاون. تنظيم الوقت والأنشطة بالتساوي وسائل إجرائية لا هدف رئيس. (المعيار 8.2)","1441"],["L13","درّب معلم اللغة العربية للصف الأول الثانوي طلابه على استخدام أساليب متنوعة للقراءة: القراءة السريعة للاطلاع، القراءة السريعة للبحث عن معلومة، القراءة لمعرفة الفكرة الرئيسة للنص، وغيرها. هذا التدريب الذي قدمه المعلم يساعد طلابه على:",["تقويم فاعلية الأساليب الأدبية في القصص الخيالية التي يدرسونها.","تعديل طريقة قراءتهم لتناسب الغرض منها للتعامل مع النصوص المختلفة.","استخدام إستراتيجيات التقويم الذاتي لتحسين مستويات القراءة.","تحليل صحة الحجج ودقة الجمل المساندة في الكتابة المقنعة لهم."],1,"كل أسلوب قراءة ذُكر مرتبط بغرض مختلف (اطلاع، بحث، فكرة رئيسة)، فالمهارة المكتسبة هي اختيار طريقة القراءة بحسب الغرض. التقويم الذاتي وتحليل الحجج ونقد الأساليب الأدبية مهارات أخرى لم يدرّب عليها. (المعيار 8.3)","1441"],["L15","عندما يرغب المعلم في بناء اختبار تشخيصي تحريري لطلابه، فإن الهدف الأساسي من الاختبار هو أن:",["يتحدّى الطلاب في تطبيق معارفهم ومهاراتهم بطرق جديدة عليهم.","يحدّد نقاط القوة والضعف لدى الطلاب وحاجاتهم التعليمية.","يوضّح الفروق الفردية بين الطلاب فيما يتعلق بالمعارف والمهارات المستهدفة.","يقدم معلومات عن إمكانات الطلاب المستقبلية إضافة إلى إنجازاتهم الحالية."],1,"الاختبار التشخيصي يكشف نقاط القوة والضعف والحاجات قبل التدريس أو عند تعثر التعلم. إظهار الفروق الفردية وظيفة الاختبار التحصيلي معياري المرجع، والتنبؤ بالإمكانات وظيفة اختبارات الاستعداد. (المعيار 10.2)","1441"],["L13","طلب معلم الأحياء من طلابه البحث في الإنترنت لجمع معلومات ضرورية لعمل تقارير بحثية متنوّعة. يمكن للطلاب أن يقوّموا المعلومات التي وجدوها في أحد المواقع من حيث دقتها وصحتها من خلال:",["عدد الروابط الموجودة على الموقع وسرعة تحديثها.","وجود معلومات مُعدّ الموقع وإمكانية التأكّد منها.","وضوح المعلومات المعروضة في الموقع.","تقديم المعلومات بطريقة جديّة ومنظمة."],1,"مصداقية المصدر الرقمي تُحكم بمعرفة جهة الإعداد وإمكانية التحقق منها. الوضوح والتنظيم وكثرة الروابط مظاهر شكلية لا تثبت الدقة. (المعيار 9.3)","1441"],["L14","أي الأعمال الآتية يقوم بها المعلم لكي يضمن إيجاد بيئة إيجابية في أحد صفوف المرحلة الابتدائية التي يدرسها؟",["وضع أهداف تعليمية موحدة لجميع الطلاب.","تقديم دروس سهلة لجميع الطلاب.","إلقاء التحية على الطلاب عند دخول الفصل.","منح الطلاب حرية تكوين المجموعات أثناء الأنشطة الجماعية."],2,"البيئة الإيجابية تبدأ بعلاقة دافئة وإشعار الطلاب بالترحيب، والتحية اليومية أبسط تطبيق لذلك. الأهداف الموحدة تتجاهل الفروق، والدروس السهلة تخفض التوقعات، وحرية المجموعات قد تقصي بعض الطلاب. (المعيار 9.3)","1441"],["L10","أكمل طلاب الصف الثالث المتوسط دراسة وحدة في مادة التاريخ عن المستكشفين الأوائل لأوروبا. أيّ من الأنشطة الآتية يساعد في إظهار أعلى مستوى لمهارة التفكير الناقد عند الطلاب؟",["وضع خط زمني لتسلسل الأحداث خلال فترة التوسع باتجاه الغرب.","إكمال اختبار قصير من فقرات الاختيار من متعدد في نهاية الوحدة.","كتابة مقال من وجهة نظر المستكشفين الأوائل في تلك الفترة.","رسم صورة تخيلية لأحد المستكشفين الأوائل في تلك الفترة."],2,"كتابة مقال من منظور شخصية تاريخية تتطلب تحليل الأحداث وتفسير دوافعها والحكم عليها، وهي مستويات عليا. الخط الزمني والاختبار القصير تذكّر وترتيب، والرسم التخيلي نشاط إبداعي لا ناقد. (المعيار 8.2)","1441"],["L02","تلقى أحد المعلمين اتصالًا من أخصائي نفسي من عيادة خارج المدرسة يطلب فيه معلومات عن أحد طلاب الصف الأول المتوسط، ما الخطوة الأولى التي يجب على المعلم اتباعها؟",["التحدّث مع إدارة المدرسة بذلك الشأن واتباع تعليماتها.","تصوير سجلات الأداء الأكاديمي للطالب في ذلك العام وإرسالها.","استشارة معلمين آخرين لإعداد سجل غير رسمي للطالب وإرساله.","إبلاغ الطالب وأخذ إذنه بالموافقة لإرسال المعلومات المطلوبة."],0,"معلومات الطالب سرية، وأي جهة خارجية تُحال إلى إدارة المدرسة التي تملك صلاحية الإفصاح وفق اللوائح. إرسال السجلات أو إعداد سجل غير رسمي إخلال بالسرية، وإذن الطالب القاصر لا يكفي. (المعيار 1.3)","1441"],["L08","تضم إحدى المدارس طلابًا من خلفيات متنوعة، ذات ظروف اقتصادية مختلفة، بحيث تتفاوت الخلفية المعرفية بين الطلاب بسبب اطلاع بعضهم على مصادر تعليمية وثقافية أكثر من غيرهم. في مثل هذه الظروف، ينبغي للمعلم أن يدرك أن الطلاب تزيد احتمالية اختلافهم عن بعضهم بسبب اختلاف ظروفهم الاقتصادية في الآتي:",["طرق التعلّم المفضّلة لديهم.","قدرتهم على التعلّم بشكل عام.","خلفياتهم المعرفية وخبراتهم.","دافعيتهم والتزامهم بمهام التعلّم."],2,"الظروف الاقتصادية تؤثر في توفر مصادر المعرفة ونوعيتها، فتختلف الخلفية المعرفية والخبرات. لا يوجد ارتباط مباشر مثبت بين المستوى الاقتصادي والقدرة على التعلم أو أنماط التعلم أو الدافعية. (المعيار القديم 1.3)","1436"],["L13","قبل أن يقوم طلاب الصف الخامس بقراءة درس الزواحف في كتاب العلوم، ناقشهم المعلم حول الموضوع ووضع قائمة من الأسئلة المرتبطة بالزواحف التي يودون معرفة إجاباتها. هذه المناقشة القبلية للطلاب سوف تعزز لديهم فهم الدرس من خلال:",["تسهيل استخدام الطلاب لمهارات التفكير التحليلي.","وضع غرض واضح للقراءة وتنشيط المعرفة العامة.","زيادة استخدام الطلاب لاستراتيجيات مراقبة الذات.","تقديم مصطلحات غير معروفة لمحتوى المادة وربطها بالمفاهيم المعروفة."],1,"المناقشة القبلية وقائمة الأسئلة توجه القراءة نحو غرض محدد وتنشط المعرفة السابقة (التهيئة). الأسئلة قد تكون لحقائق لا للتحليل، ومراقبة الذات ليست مستهدفة، والمصطلحات الجديدة جزء ضيق مما تناولته المناقشة. (المعيار القديم 4.2)","1436"],["L13","يرغب أحد المعلمين في استخدام برنامج تطبيقي جديد لأحد الأنشطة الصفيّة، لكن قبل استخدام التطبيق لأول مرّة يُستحسن أن يقوم المعلم بالآتي:",["يوضح للطلاب الغرض من استخدام البرنامج لإثارة اهتمامهم.","يجرب مميزات البرنامج المتعددة للتأكّد من أنها تعمل كما يجب.","يراجع البرنامج مع معلمين آخرين لتحديد مدى ملاءمته للطلاب.","يعيد كتابة وثيقة الدعم الفني لضمان فهم الطلاب لها بسهولة."],2,"مراجعة البرنامج مع زملاء تحكم على مناسبته للطلاب والنشاط بقرار جماعي قبل التطبيق. (ب) مغرٍ لكنه يتأكد من أن البرنامج يعمل لا من مناسبته للطلاب، و(أ) و(د) يفترضان أن البرنامج مناسب قبل التحقق. (المعيار القديم 4.3)","1436"],["L13","أي الآتي يُعد أهم مبدأ يؤخذ بعين الاعتبار عند طرح أسئلة مهارات التحليل والتقويم على طلاب المرحلة الابتدائية؟",["أن يكون السؤال عن المعارف وله إجابة واحدة صحيحة.","أن يراعي المعلم مستوى انتباه الطلاب في الفصل وإزعاجهم.","أن يتوقع المعلم ردود فعل الطلاب ويحكم عليهم قبل أن يجيبوا على السؤال.","أن يُصاغ السؤال بأسلوب يستثير تفكير الطلبة ويحفزهم على إبداء الرأي."],3,"أسئلة التحليل والتقويم تستثير التفكير وتفتح باب الرأي والإجابات غير الم
