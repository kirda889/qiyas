11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"33\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"55\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"77\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"99\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"121\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"143\" cy=\"11\" r=\"7\" fill=\"none\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"2\"/><circle cx=\"165\" cy=\"11\" r=\"7\" fill=\"none\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"2\"/><circle cx=\"187\" cy=\"11\" r=\"7\" fill=\"none\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"2\"/><circle cx=\"209\" cy=\"11\" r=\"7\" fill=\"none\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"2\"/></svg></div>\n<div><div class=\"a-ucr a-ucx\"><b>حالة أو حالتان</b><span>تعميم متسرّع</span></div><svg direction=\"ltr\" viewBox=\"0 0 220 22\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\" fill=\"none\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"2\"/><circle cx=\"33\" cy=\"11\" r=\"7\" fill=\"none\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"2\"/><circle cx=\"55\" cy=\"11\" r=\"7\" fill=\"none\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"2\"/><circle cx=\"77\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"99\" cy=\"11\" r=\"7\" fill=\"none\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"2\"/><circle cx=\"121\" cy=\"11\" r=\"7\" fill=\"none\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"2\"/><circle cx=\"143\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"165\" cy=\"11\" r=\"7\" fill=\"none\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"2\"/><circle cx=\"187\" cy=\"11\" r=\"7\" fill=\"none\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"2\"/><circle cx=\"209\" cy=\"11\" r=\"7\" fill=\"none\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"2\"/></svg></div>\n</div>\n<div class=\"a-cnote\">● حالة فُحصت &nbsp; ○ حالة لم تُفحص</div>\n<div class=\"a-foot a-f15\">كثرة الحالات لا تجعله تاماً ما دام <b>بعضها</b> لم يُفحص.</div>", "mr06-1": "<h2>قارن كل شكلين متتاليين</h2>\n<div class=\"a-ucq\">\n<div><b>حركة</b><svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"54\" height=\"54\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><path d=\"M44,22 L52,37 L36,37 Z\" fill=\"currentColor\"/></svg><i>←</i><svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"54\" height=\"54\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><path d=\"M30,22 L38,37 L22,37 Z\" fill=\"currentColor\"/></svg><span>انتقلت العلامة</span></div>\n<div><b>دوران</b><svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"54\" height=\"54\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><g><path d=\"M30,47 V13\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M30,13 L45,19 L30,25 Z\" fill=\"currentColor\"/></g></svg><i>←</i><svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"54\" height=\"54\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><g transform=\"rotate(90 30 30)\"><path d=\"M30,47 V13\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M30,13 L45,19 L30,25 Z\" fill=\"currentColor\"/></g></svg><span>دار ربع دورة</span></div>\n<div><b>عدد</b><svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"54\" height=\"54\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><rect x=\"14\" y=\"26\" width=\"9\" height=\"9\" fill=\"currentColor\"/><rect x=\"26\" y=\"26\" width=\"9\" height=\"9\" fill=\"currentColor\"/><rect x=\"38\" y=\"26\" width=\"9\" height=\"9\" fill=\"currentColor\"/></svg><i>←</i><svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"54\" height=\"54\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><rect x=\"20\" y=\"26\" width=\"9\" height=\"9\" fill=\"currentColor\"/><rect x=\"32\" y=\"26\" width=\"9\" height=\"9\" fill=\"currentColor\"/></svg><span>نقص واحد</span></div>\n<div><b>تناوب</b><svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"54\" height=\"54\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><path d=\"M30,13 L47,45 L13,45 Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linejoin=\"round\"/></svg><i>←</i><svg viewBox=\"0 0 60 60\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"54\" height=\"54\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><path d=\"M30,13 L47,45 L13,45 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linejoin=\"round\"/></svg><span>مصمت ثم مفرغ</span></div>\n</div>\n<div class=\"a-cnote\">السلسلة تُقرأ <b>من اليمين</b>: ماذا تغيّر بين الشكلين؟</div>\n<div class=\"a-foot a-f15\">تحقق من القاعدة على <b>كل الخطوات</b>، لا على أول خطوتين.</div>", "mr06-2": "<h2>سلاسل الحروف: حوّلها إلى أرقام</h2>\n<div class=\"a-ccd\"><p class=\"a-chd\">بالترتيب الهجائي، لا الأبجدي (أبجد هوّز)</p>\n<div class=\"a-ucz\"><span><b>أ</b><i><span class=\"a-ltr\">1</span></i></span><span><b>ب</b><i><span class=\"a-ltr\">2</span></i></span><span><b>ت</b><i><span class=\"a-ltr\">3</span></i></span><span><b>ث</b><i><span class=\"a-ltr\">4</span></i></span><span class=\"a-ucj\"><b>ج</b><i><span class=\"a-ltr\">5</span></i></span><span><b>ح</b><i><span class=\"a-ltr\">6</span></i></span><span><b>خ</b><i><span class=\"a-ltr\">7</span></i></span><span class=\"a-ucj\"><b>د</b><i><span class=\"a-ltr\">8</span></i></span><span><b>ذ</b><i><span class=\"a-ltr\">9</span></i></span><span><b>ر</b><i><span class=\"a-ltr\">10</span></i></span><span class=\"a-ucj\"><b>ز</b><i><span class=\"a-ltr\">11</span></i></span><span><b>س</b><i><span class=\"a-ltr\">12</span></i></span><span><b>ش</b><i><span class=\"a-ltr\">13</span></i></span><span class=\"a-ucj\"><b>ص</b><i><span class=\"a-ltr\">14</span></i></span><span><b>ض</b><i><span class=\"a-ltr\">15</span></i></span><span><b>ط</b><i><span class=\"a-ltr\">16</span></i></span><span class=\"a-uck\"><b>ظ</b><i><span class=\"a-ltr\">17</span></i></span><span><b>ع</b><i><span class=\"a-ltr\">18</span></i></span><span><b>غ</b><i><span class=\"a-ltr\">19</span></i></span><span><b>ف</b><i><span class=\"a-ltr\">20</span></i></span><span><b>ق</b><i><span class=\"a-ltr\">21</span></i></span><span><b>ك</b><i><span class=\"a-ltr\">22</span></i></span><span><b>ل</b><i><span class=\"a-ltr\">23</span></i></span><span><b>م</b><i><span class=\"a-ltr\">24</span></i></span><span><b>ن</b><i><span class=\"a-ltr\">25</span></i></span><span><b>هـ</b><i><span class=\"a-ltr\">26</span></i></span><span><b>و</b><i><span class=\"a-ltr\">27</span></i></span><span><b>ي</b><i><span class=\"a-ltr\">28</span></i></span></div>\n<div class=\"a-ucs2\"><span class=\"a-ucn\"><b>ج</b><span><span class=\"a-ltr\">5</span></span></span><span class=\"a-uch2\"><span>بعد <span class=\"a-ltr\">3</span></span><svg viewBox=\"0 0 26 12\" aria-hidden=\"true\"><path d=\"M23,10 Q13,-3 3,10\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\"/><path d=\"M1,6 L3,11 L8,9\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\" stroke-linejoin=\"round\"/></svg></span><span class=\"a-ucn\"><b>د</b><span><span class=\"a-ltr\">8</span></span></span><span class=\"a-uch2\"><span>بعد <span class=\"a-ltr\">3</span></span><svg viewBox=\"0 0 26 12\" aria-hidden=\"true\"><path d=\"M23,10 Q13,-3 3,10\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\"/><path d=\"M1,6 L3,11 L8,9\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\" stroke-linejoin=\"round\"/></svg></span><span class=\"a-ucn\"><b>ز</b><span><span class=\"a-ltr\">11</span></span></span><span class=\"a-uch2\"><span>بعد <span class=\"a-ltr\">3</span></span><svg viewBox=\"0 0 26 12\" aria-hidden=\"true\"><path d=\"M23,10 Q13,-3 3,10\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\"/><path d=\"M1,6 L3,11 L8,9\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\" stroke-linejoin=\"round\"/></svg></span><span class=\"a-ucn\"><b>ص</b><span><span class=\"a-ltr\">14</span></span></span><span class=\"a-uch2\"><span>بعد <span class=\"a-ltr\">3</span></span><svg viewBox=\"0 0 26 12\" aria-hidden=\"true\"><path d=\"M23,10 Q13,-3 3,10\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\"/><path d=\"M1,6 L3,11 L8,9\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\" stroke-linejoin=\"round\"/></svg></span><span class=\"a-ucn a-q\"><b>ظ</b><span><span class=\"a-ltr\">17</span></span></span></div></div>\n<div class=\"a-foot a-f15\">الفرق <span class=\"a-ltr\">3</span> ثابت، فالتالي <span class=\"a-ltr\">17</span>، وهو <b>الظاء</b>.</div>", "mv08-1": "<h2>علاقات تتكرر</h2>\n<div class=\"a-ucw\">\n<div class=\"a-uco\"><b>أداة ووظيفتها</b></div>\n<div><b>صانع ومصنوع</b><span>حدّاد : باب</span></div>\n<div class=\"a-uco\"><b>مادة ومصنوع</b></div>\n<div><b>جزء وكل</b><span>درج : خزانة</span></div>\n<div><b>سبب ونتيجة</b><span>إسراف : دَين</span></div>\n<div class=\"a-uco\"><b>تدرّج في الشدة</b></div>\n<div><b>ضد</b><span>كرم : بخل</span></div>\n<div><b>من يعمل ومكان عمله</b><span>طيّار : قمرة</span></div>\n</div>\n<div class=\"a-cnote\">لا تحفظ القائمة، بل استعملها <b>لتسمّي العلاقة</b> بسرعة.</div>\n<div class=\"a-foot a-f15\">لم تجد العلاقة فيها؟ <b>الجملة الرابطة</b> تكفي.</div>", "mv08-2": "<h2>الترتيب يقلب العلاقة</h2>\n<div class=\"a-ccd\">\n<div class=\"a-ucp\"><span>حدّاد</span><div class=\"a-ucar\">يصنع<svg viewBox=\"0 0 84 18\" aria-hidden=\"true\"><path d=\"M80,9 H6 M14,2 L5,9 L14,16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div><span>باب</span></div>\n<p class=\"a-ucv2 a-ucy2\">✓ الحدّاد يصنع الباب</p>\n<div class=\"a-ucp a-ucno\"><span>باب</span><div class=\"a-ucar\">يصنع<svg viewBox=\"0 0 84 18\" aria-hidden=\"true\"><path d=\"M80,9 H6 M14,2 L5,9 L14,16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M20,17 L64,1\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg></div><span>حدّاد</span></div>\n<p class=\"a-ucv2 a-ucn2\" style=\"margin-bottom:0\">✗ مقلوب: الباب لا يصنع الحدّاد</p>\n</div>\n<div class=\"a-cnote\">اقرأ الخيار بترتيب السؤال: الأولى مكان الأولى، والثانية مكان الثانية.</div>\n<div class=\"a-foot a-f15\">العلاقة نفسها بين الكلمتين، لكنها <b>مقلوبة</b>، فاستبعده.</div>", "mr07-1": "<h2>ستة تحويلات لشكل واحد</h2>\n<div class=\"a-uer\"><svg direction=\"ltr\" viewBox=\"-2 -2 60 60\" role=\"img\" aria-label=\"الشكل الأصل: عمود من أربعة بنتوء يسار وقدم يمين، النقطة في الرأس والحلقة في القدم\"><rect x=\"21.0\" y=\"0.0\" width=\"14\" height=\"14\" class=\"a-cxe a-cks\" fill=\"#F4EEDF\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><rect x=\"7.0\" y=\"14.0\" width=\"14\" height=\"14\" class=\"a-cxe a-cks\" fill=\"#F4EEDF\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><rect x=\"21.0\" y=\"14.0\" width=\"14\" height=\"14\" class=\"a-cxe a-cks\" fill=\"#F4EEDF\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><rect x=\"21.0\" y=\"28.0\" width=\"14\" height=\"14\" class=\"a-cxe a-cks\" fill=\"#F4EEDF\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><rect x=\"21.0\" y=\"42.0\" width=\"14\" height=\"14\" class=\"a-cxe a-cks\" fill=\"#F4EEDF\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><rect x=\"35.0\" y=\"42.0\" width=\"14\" height=\"14\" class=\"a-cxe a-cks\" fill=\"#F4EEDF\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><circle cx=\"28.0\" cy=\"7.0\" r=\"3.6\" class=\"a-uef\" fill=\"#1B231E\"/><circle cx=\"42.0\" cy=\"49.0\" r=\"3.9\" fill=\"none\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.8\"/></svg><span>الأصل<small>النقطة في الرأس، والحلقة في القدم</small></span></div>\n<div class=\"a-ueg\"><div class=\"a-uet1\"><svg direction=\"ltr\" viewBox=\"-2 -2 60 60\" role=\"img\" aria-label=\"ربع دورة مع عقارب الساعة\"><rect x=\"28.0\" y=\"7.0\" width=\"14\" height=\"14\" class=\"a-cxe a-cks\" fill=\"#F4EEDF\" stroke=\"#1B231E\" stro =\"a-udfl a-udpl\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><line x1=\"60\" y1=\"8\" x2=\"60\" y2=\"76\" class=\"a-udpl\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"32\" cy=\"17\" r=\"6.5\" class=\"a-udmk\"/></svg><span class=\"a-udp\">النقطة: أعلى يسار</span><span class=\"a-udc a-ud1\">تبدّلت جهة واحدة</span></div>\n<div><b>بعد نصف دورة</b><svg direction=\"ltr\" viewBox=\"0 0 84 84\" aria-hidden=\"true\"><polygon points=\"60,76 16,76 60,42\" class=\"a-udfl a-udpl\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><line x1=\"60\" y1=\"76\" x2=\"60\" y2=\"8\" class=\"a-udpl\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"32\" cy=\"67\" r=\"6.5\" class=\"a-udmk\"/></svg><span class=\"a-udp\">النقطة: أسفل يسار</span><span class=\"a-udc a-ud9\">تبدّلت الجهتان</span></div>\n</div>\n<div class=\"a-cnote\" style=\"margin-top:8px\">صورة الشكل غير المتناظر في المرآة <b>مقلوبة الجهة</b>، فلا تدوير يرجعها إلى الأصل.</div>\n<div class=\"a-foot a-f15\">تتبّع علامة واحدة: <b>أين ذهب</b> اليمين واليسار، والأعلى والأسفل؟</div>", "ms02-2": "<h2>مرآتان متعامدتان تساويان نصف دورة</h2>\n<div class=\"a-ccd a-udnc\"><svg direction=\"ltr\" viewBox=\"0 0 330 222\" role=\"img\" aria-label=\"علم بنقطة في أعلى يمينه، صورته في مرآة جانبية بنقطة في أعلى يساره، ثم في مرآة أفقية بنقطة في أسفل يساره، وهي نصف دورة من الأصل\"><polygon points=\"256,14 300,14 256,48\" class=\"a-udfl a-udpl\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><line x1=\"256\" y1=\"14\" x2=\"256\" y2=\"82\" class=\"a-udpl\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"284\" cy=\"23\" r=\"6.5\" class=\"a-udmk\"/><polygon points=\"160,14 116,14 160,48\" class=\"a-udfl a-udpl\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><line x1=\"160\" y1=\"14\" x2=\"160\" y2=\"82\" class=\"a-udpl\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"132\" cy=\"23\" r=\"6.5\" class=\"a-udmk\"/><polygon points=\"160,204 116,204 160,170\" class=\"a-udfl a-udpl\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><line x1=\"160\" y1=\"204\" x2=\"160\" y2=\"136\" class=\"a-udpl\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"132\" cy=\"195\" r=\"6.5\" class=\"a-udmk\"/><line x1=\"208.0\" y1=\"0\" x2=\"208.0\" y2=\"96\" class=\"a-udmr\" stroke-width=\"3\" stroke-dasharray=\"7 5\"/><line x1=\"94\" y1=\"109.0\" x2=\"190\" y2=\"109.0\" class=\"a-udmr\" stroke-width=\"3\" stroke-dasharray=\"7 5\"/><path d=\"M268,98 Q262,176 196,176\" class=\"a-udar\" stroke-width=\"3\" fill=\"none\"/><path d=\"M204,169 L195,176 L204,183\" class=\"a-udar\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\"/></svg>\n<div class=\"a-udlg\"><div>الأصل: أعلى يمين</div><div>مرآة جانبية: أعلى يسار</div></div>\n<div class=\"a-udlg\" style=\"margin-top:4px\"><div>ثم مرآة أفقية: أسفل يسار</div><div class=\"a-udz\">نصف دورة من الأصل: أسفل يسار</div></div></div>\n<div class=\"a-cnote\">الخط المتقطع هو المرآة. المرآة الواحدة تبدّل <b>جهة واحدة</b>، والثانية تبدّل الجهة الأخرى.</div>\n<div class=\"a-foot a-f15\">صورة في مرآة جانبية ثم أفقية = <b>نصف دورة</b> للأصل.</div>", "ms04-1": "<h2>الترتيب حول الزاوية لا يتغير</h2>\n<div class=\"a-ud2 a-udnc\">\n<div><span class=\"a-udh a-udk\">في الشبكة</span><svg direction=\"ltr\" viewBox=\"-4 -4 132 132\" aria-hidden=\"true\"><rect x=\"62\" y=\"0\" width=\"62\" height=\"62\" class=\"a-udcell\" stroke-width=\"2.5\"/><circle cx=\"93\" cy=\"31\" r=\"13\" class=\"a-udsym\" stroke-width=\"4\"/><rect x=\"62\" y=\"62\" width=\"62\" height=\"62\" class=\"a-udcell\" stroke-width=\"2.5\"/><circle cx=\"93\" cy=\"93\" r=\"5.9\" class=\"a-udsyf\"/><rect x=\"0\" y=\"62\" width=\"62\" height=\"62\" class=\"a-udcell\" stroke-width=\"2.5\"/><rect x=\"18\" y=\"80\" width=\"26\" height=\"26\" class=\"a-udsyf\"/><path d=\"M70.2,39.4 A24,24 0 1 1 39.4,70.2\" class=\"a-udar\" stroke-width=\"3.5\"/><path d=\"M37.8,80.4 L39.4,70.2 L47.2,77.0\" class=\"a-udar\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/></svg><p class=\"a-udcap\">الحلقة ← النقطة ← المربع الأسود</p></div>\n<div><span class=\"a-udh a-udk\">في المكعب</span><svg direction=\"ltr\" viewBox=\"0 0 128 128\" aria-hidden=\"true\"><polygon points=\"64.0,62.0 29.4,42.0 64.0,22.0 98.6,42.0\" class=\"a-udcell\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><g transform=\"matrix(-0.3464 -0.2000 0.3464 -0.2000 64.0 62.0)\"><circle cx=\"50\" cy=\"50\" r=\"22\" class=\"a-udsym\" stroke-width=\"4\" vector-effect=\"non-scaling-stroke\"/></g><polygon points=\"64.0,62.0 98.6,42.0 98.6,82.0 64.0,102.0\" class=\"a-udcell\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><g transform=\"matrix(0.3464 -0.2000 0.0000 0.4000 64.0 62.0)\"><circle cx=\"50\" cy=\"50\" r=\"11\" class=\"a-udsyf\"/></g><polygon points=\"64.0,62.0 64.0,102.0 29.4,82.0 29.4,42.0\" class=\"a-udcell\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><g transform=\"matrix(0.0000 0.4000 -0.3464 -0.2000 64.0 62.0)\"><rect x=\"28\" y=\"28\" width=\"44\" height=\"44\" class=\"a-udsyf\"/></g><path d=\"M39.1,15.2 A53,53 0 1 1 11.5,69.4\" class=\"a-udar\" stroke-width=\"3.5\"/><path d=\"M7.8,79.0 L11.5,69.4 L17.7,77.6\" class=\"a-udar\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/></svg><p class=\"a-udcap\">الأعلى ← الأيمن ← الأيسر</p></div>\n</div>\n<div class=\"a-cnote\" style=\"margin-top:8px\">مع عقارب الساعة في الاثنين: الحلقة أعلى، والنقطة يمين، والمربع الأسود يسار. <b>والترتيب المعكوس</b> صورة مرآة، لا تُصنع من الشبكة.</div>\n<div class=\"a-foot a-f15\">ثلاثة وجوه حول زاوية في الشبكة = <b>رأس واحد</b> في المكعب، بالترتيب نفسه.</div>", "ms04-2": "<h2>حافتان عند الزاوية تصيران حافة واحدة</h2>\n<div class=\"a-ud2 a-udnc\">\n<div><span class=\"a-udh a-udx\">قبل الطيّ</span><svg direction=\"ltr\" viewBox=\"-4 -4 132 132\" aria-hidden=\"true\"><rect x=\"62\" y=\"0\" width=\"62\" height=\"62\" class=\"a-udcell\" stroke-width=\"2.5\"/><circle cx=\"93\" cy=\"31\" r=\"13\" class=\"a-udsym\" stroke-width=\"4\"/><rect x=\"62\" y=\"62\" width=\"62\" height=\"62\" class=\"a-udcell\" stroke-width=\"2.5\"/><circle cx=\"93\" cy=\"93\" r=\"5.9\" class=\"a-udsyf\"/><rect x=\"0\" y=\"62\" width=\"62\" height=\"62\" class=\"a-udcell\" stroke-width=\"2.5\"/><rect x=\"18\" y=\"80\" width=\"26\" height=\"26\" class=\"a-udsyf\"/><line x1=\"62\" y1=\"2\" x2=\"62\" y2=\"60\" class=\"a-udedge\" stroke-width=\"7\" stroke-linecap=\"round\"/><line x1=\"2\" y1=\"62\" x2=\"60\" y2=\"62\" class=\"a-udedge\" stroke-width=\"7\" stroke-linecap=\"round\"/><path d=\"M56,22 Q20,22 22,56\" class=\"a-udar\" stroke-width=\"3\" stroke-dasharray=\"5 4\"/><path d=\"M15,48 L22,57 L29,48\" class=\"a-udar\" stroke-width=\"3\" stroke-linejoin=\"round\"/></svg><p class=\"a-udcap\">حافة الحلقة اليسرى، وحافة المربع الأسود العليا</p></div>\n<div><span class=\"a-udh a-udk\">بعد الطيّ</span><svg direction=\"ltr\" viewBox=\"0 0 128 128\" aria-hidden=\"true\"><polygon points=\"64.0,62.0 29.4,42.0 64.0,22.0 98.6,42.0\" class=\"a-udcell\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><g transform=\"matrix(-0.3464 -0.2000 0.3464 -0.2000 64.0 62.0)\"><circle cx=\"50\" cy=\"50\" r=\"22\" class=\"a-udsym\" stroke-width=\"4\" vector-effect=\"non-scaling-stroke\"/></g><polygon points=\"64.0,62.0 98.6,42.0 98.6,82.0 64.0,102.0\" class=\"a-udcell\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><g transform=\"matrix(0.3464 -0.2000 0.0000 0.4000 64.0 62.0)\"><circle cx=\"50\" cy=\"50\" r=\"11\" class=\"a-udsyf\"/></g><polygon points=\"64.0,62.0 64.0,102.0 29.4,82.0 29.4,42.0\" class=\"a-udcell\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><g transform=\"matrix(0.0000 0.4000 -0.3464 -0.2000 64.0 62.0)\"><rect x=\"28\" y=\"28\" width=\"44\" height=\"44\" class=\"a-udsyf\"/></g><line x1=\"64\" y1=\"62\" x2=\"29.4\" y2=\"42.0\" class=\"a-udedge\" stroke-width=\"7\" stroke-linecap=\"round\"/></svg><p class=\"a-udcap\">حافة واحدة بين الحلقة والمربع الأسود</p></div>\n</div>\n<div class=\"a-cnote\" style=\"margin-top:8px\">لا وجه بينهما عند الزاوية، فالحافتان المتلاقيتان <b>تلتصقان</b>: الحلقة والمربع الأسود جاران في المكعب.</div>\n<div class=\"a-foot a-f15\">بهذا تعرف جيران الوجه في المكعب، <b>ولو لم يتلاصقا</b> في الشبكة.</div>"};

  var allSub=n<8&&G.every(function(g){return g.ar&&g.ar.length<=26});

  function at(i){return i<H?{r:i,c:0}:{r:H-1-(i-H),c:1}}
  G.forEach(function(g,i){var p=at(i),col=g.c||PAL[i%PAL.length],sub=(m.type==="steps"&&g.ar&&g.ar.length<=22)?g.ar:"";sub=sub&&md(sub);
    cells.push('<div class="sn-node" style="grid-row:'+(2*p.r+1)+';grid-column:'+(2*p.c+1)+';--c:'+col+'"><span class="sn-n">'+(i+1)+'</span><b>'+esc(g.n)+'</b>'+(sub?'<small>'+sub+'</small>':'')+(g.tag&&n<7?'<em>'+md(g.tag)+'</em>':'')+'</div>');

      if(q.c!==p.c)cells.push('<span class="sn-ar" style="grid-row:'+(2*p.r+1)+';grid-column:2">←</span>');
      else if(q.r>p.r)cells.push('<span class="sn-ar" style="grid-row:'+(2*p.r+2)+';grid-column:'+(2*p.c+1)+'">↓</span>');
      else cells.push('<span class="sn-ar" style="grid-row:'+(2*q.r+2)+';grid-column:'+(2*p.c+1)+'">↑</span>')}});
  (m.back||[]).forEach(function(bk){var a=at(bk[0]),b=at(bk[1]);
    if(a.r===b.r&&Math.abs(a.c-b.c)===1)cells.push('<span class="sn-ar sn-back" style="grid-row:'+(2*a.r+1)+';grid-column:2">'+(b.c>a.c?'⇠':'⇢')+'</span>');
    else if(a.c===b.c&&Math.abs(a.r-b.r)===1)cells.push('<span class="sn-ar sn-back" style="grid-row:'+(2*Math.min(a.r,b.r)+2)+';grid-column:'+(2*a.c+1)+'">'+(b.r<a.r?'⇡':'⇣')+'</span>');

  /* الدورة المتكررة: سهم من آخر خطوة (أعلى اليسار) إلى الأولى (أعلى اليمين) */
  if(m.loop&&n%2===0)cells.push('<span class="sn-ar sn-loop" style="grid-row:1;grid-column:2">→</span>');

  var s1='<div class="in mp">'+(x.h&&x.h!==(tt[1]||tt[0])&&x.h!=="خريطة الدرس"?'<div class="kick r">'+esc(x.h)+'</div>':'')+'<h2 class="h sn-t r">'+esc(tt[1]||tt[0])+'</h2>'+
    '<div class="sn r" style="grid-template-columns:repeat('+(2*C-1)+',auto);grid-template-rows:repeat('+(2*R-1)+',auto)">'+cells.join("")+'</div>'+
    (m.loop&&m.loop[0]?'<p class="mloop r">'+esc(m.loop[0])+'</p>':'')+(m.lead?'<p class="lead mlead r">'+md(m.lead)+'</p>':'')+(BK.length?'<p class="sn-br r">'+BK.join(' · ')+'</p>':'')+(br?'<p class="sn-br r">'+br+'</p>':'')+'<p class="sn-hint r">التعريفات في الشريحة التالية</p></div>';
  if(m.type==="steps")s1=ladder(x);
  var s2='<div class="in"><div class="kick r">تعريفات · '+esc(tt[1]||tt[0])+'</div><dl class="defs r">'+G.map(function(g,i){var col=g.c||PAL[i%PAL.length];
    return '<div style="--c:'+col+'"><dt>'+esc(g.n)+(g.who?' <i>· '+esc(g.who)+'</i>':'')+(g.d?'<button type="button" class="dgo qx-dl" data-deep="'+esc(g.d)+'" aria-label="للاستزادة">＋</button>':'')+'</dt><dd>'+(g.why?'':[g.idea?md(g.idea):'',g.ar&&g.ar!==g.idea?md(g.ar):''].filter(Boolean).join(' · '))+(g.tag?' <span class="dtag">'+md(g.tag)+'</span>':'')+
      (g.items&&g.items.length?'<span class="ditems">'+g.items.map(function(it){return esc(it.n)+(it.who?' ('+esc(it.who)+')':'')+(it.ar?': '+md(it.ar):'')}).join(' · ')+'</span>':'')+
      (g.kw&&g.kw.length?'<span class="ditems">'+g.kw.map(esc).join(' · ')+'</span>':'')+(g.why?'<span class="dwhy">'+md(g.why)+'</span>':'')+(g.trap?'<span class="dtrap">'+md(g.trap)+'</span>':'')+'</dd></div>'}).join("")+'</dl>'+(m.trap?'<p class="dtrap r">'+md(m.trap)+'</p>':'')+(m.note?'<p class="lead r">'+md(m.note)+'</p>':'')+'</div>';
  return [s1,s2];
}
