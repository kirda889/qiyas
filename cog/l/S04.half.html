<script>/* نماذج قسم الخرائط المفاهيمية (2026-11-12) مضمّنة كشرائح art؛ التصميم والقرار لقسم التنسيق */
window.ART={"mv03-1": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><line x1=\"2\" y1=\"30\" x2=\"12\" y2=\"30\" stroke=\"#A8813F\" stroke-width=\"3\"/><rect x=\"15\" y=\"16\" width=\"14\" height=\"16\" rx=\"3\" fill=\"#1F6B4C\"/><line x1=\"32\" y1=\"30\" x2=\"42\" y2=\"30\" stroke=\"#A8813F\" stroke-width=\"3\"/></svg>إكمال الجمل 1</p>\n<h2>من أين يأتي الدليل؟</h2>\n<div class=\"a-card\">\n    <div class=\"a-sent\">كانت تعليمات النموذج<span class=\"a-bl\">&nbsp;</span>، فملأه الموظفون <span class=\"a-cl\">دون أن يسألوا</span></div>\n  <div class=\"a-ky\"><span class=\"a-tp\" style=\"background:var(--grn)\">نتيجة</span>تشرح الفراغ، فتوقّع «واضحة».</div>\n</div>\n<div class=\"a-card\">\n    <div class=\"a-sent\"><span class=\"a-cl\">تعطّل نظام الحجز ساعتين</span>، فصار الطابور<span class=\"a-bl\">&nbsp;</span></div>\n  <div class=\"a-ky\"><span class=\"a-tp\" style=\"background:var(--blu)\">سبب</span>يؤدي إلى الفراغ، فتوقّع «طويلاً».</div>\n</div>\n<div class=\"a-card\">\n    <div class=\"a-sent\">كان المدير<span class=\"a-bl\">&nbsp;</span>: <span class=\"a-cl\">يستمع لكل رأي ولا يقاطع أحداً</span></div>\n  <div class=\"a-ky\"><span class=\"a-tp\" style=\"background:var(--gold)\">وصف</span>يفسّر الفراغ، فتوقّع «صبوراً».</div>\n</div>\n<div class=\"a-foot\">الدليل في <b>الجملة</b>، فلا تبحث عنه في الخيارات.</div>", "mv03-2": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><line x1=\"2\" y1=\"30\" x2=\"12\" y2=\"30\" stroke=\"#A8813F\" stroke-width=\"3\"/><rect x=\"15\" y=\"16\" width=\"14\" height=\"16\" rx=\"3\" fill=\"#1F6B4C\"/><line x1=\"32\" y1=\"30\" x2=\"42\" y2=\"30\" stroke=\"#A8813F\" stroke-width=\"3\"/></svg>إكمال الجمل 1</p>\n<h2>الأداة: تُبقي الاتجاه أم تعكسه؟</h2>\n<div class=\"a-lane a-keep\">\n  <div><div class=\"a-tl\">تُبقي الاتجاه</div><div class=\"a-ch\"><span>و</span><span>فـ</span><span>لذلك</span><span>لأنّ</span></div></div>\n  <div class=\"a-pm\"><i class=\"a-p\">+</i>←<i class=\"a-p\">+</i></div>\n</div>\n<p class=\"a-cap\">«راجع التقرير مرتين، <b>فخلا</b> من الأخطاء»: شحنة واحدة.</p>\n<div class=\"a-lane a-flip\" style=\"margin-top:6px\">\n  <div><div class=\"a-tl\">تعكس الاتجاه</div><div class=\"a-ch\"><span>لكنّ</span><span>رغم</span><span>مع أنّ</span><span>إلا أنّ</span><span>بينما</span></div></div>\n  <div class=\"a-pm\"><i class=\"a-p\">+</i>←<i class=\"a-n\">−</i></div>\n</div>\n<p class=\"a-cap\">«راجع التقرير مرتين، <b>لكنّ</b> فيه أخطاء»: شحنتان متعاكستان.</p>\n<div class=\"a-bal\" style=\"margin-top:6px\"><b>«بل» بعد النفي:</b> الفراغ يخالف <b>المنفي</b> ويحلّ محلّه من الجهة الأخرى، فاسأل أولاً: ما المنفي؟</div>\n<div class=\"a-foot\">الأداة بين الدليل والفراغ هي التي تخبرك: <b>مثله أم عكسه</b>.</div>", "mn02-1": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><rect x=\"3\" y=\"14\" width=\"38\" height=\"16\" rx=\"4\" fill=\"#F4EEDF\" stroke=\"#A8813F\" stroke-width=\"2.5\"/><rect x=\"3\" y=\"14\" width=\"14\" height=\"16\" rx=\"4\" fill=\"#1F6B4C\"/><line x1=\"17\" y1=\"14\" x2=\"17\" y2=\"30\" stroke=\"#A8813F\" stroke-width=\"2\"/><line x1=\"29\" y1=\"14\" x2=\"29\" y2=\"30\" stroke=\"#A8813F\" stroke-width=\"2\"/></svg>الكسور والعشريات</p>\n<h2>الرقم المعطى ليس الكل</h2>\n<p class=\"a-lead\">الأول ثلاثة أثمان السعر، والثاني الباقي: <span class=\"a-ltr\">2,000</span></p>\n<div class=\"a-card\">\n  <div class=\"a-bar\"><span class=\"a-g\">400</span><span class=\"a-g\">400</span><span class=\"a-g\">400</span><span class=\"a-gr\">400</span><span class=\"a-gr\">400</span><span class=\"a-gr\">400</span><span class=\"a-gr\">400</span><span class=\"a-gr\">400</span></div>\n  <div class=\"a-brc\" style=\"grid-template-columns:3fr 5fr;gap:6px\"><span style=\"color:var(--gold)\">الأول: 3 أقسام</span><span style=\"color:var(--grn)\">الثاني: 5 أقسام = <span class=\"a-ltr\">2,000</span></span></div>\n</div>\n<div class=\"a-card\">\n  <p class=\"a-cap\">القسم: <span class=\"a-ltr\">2,000 ÷ 5 = 400</span></p>\n  <p class=\"a-cap\">الأول: <span class=\"a-ltr\">400 × 3 = 1,200</span></p>\n  <p class=\"a-cap\">السعر كله: <span class=\"a-ltr\">400 × 8 = 3,200</span></p>\n</div>\n<div class=\"a-trap\"><b class=\"a-x\">✗</b><span>ثلاثة أثمان <span class=\"a-ltr\">2,000</span>: هذا خطأ، لأن <span class=\"a-ltr\">2,000</span> نصيب الثاني لا الكل.</span></div>\n<div class=\"a-foot\">اسأل قبل أي حساب: هل الرقم المعطى هو <b>الكل</b>؟</div>", "mn02-2": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><rect x=\"3\" y=\"14\" width=\"38\" height=\"16\" rx=\"4\" fill=\"#F4EEDF\" stroke=\"#A8813F\" stroke-width=\"2.5\"/><rect x=\"3\" y=\"14\" width=\"14\" height=\"16\" rx=\"4\" fill=\"#1F6B4C\"/><line x1=\"17\" y1=\"14\" x2=\"17\" y2=\"30\" stroke=\"#A8813F\" stroke-width=\"2\"/><line x1=\"29\" y1=\"14\" x2=\"29\" y2=\"30\" stroke=\"#A8813F\" stroke-width=\"2\"/></svg>الكسور والعشريات</p>\n<h2>كسر من الباقي، لا من الكل</h2>\n<p class=\"a-lead\">ميزانية <span class=\"a-ltr\">6,000</span>: ثلثها للأجهزة، ثم ربع <b>الباقي</b> للتدريب.</p>\n<div class=\"a-card\">\n  <div class=\"a-bar\"><span class=\"a-g\"></span><span class=\"a-g\"></span><span class=\"a-g\"></span><span class=\"a-g\"></span><span class=\"a-tq\"></span><span class=\"a-tq\"></span><span class=\"a-lt\"></span><span class=\"a-lt\"></span><span class=\"a-lt\"></span><span class=\"a-lt\"></span><span class=\"a-lt\"></span><span class=\"a-lt\"></span></div>\n  <div class=\"a-brc\" style=\"grid-template-columns:4fr 2fr 6fr;gap:6px\"><span style=\"color:var(--gold)\">الأجهزة<br><span class=\"a-ltr\">1/3</span><br><span class=\"a-ltr\">2,000</span></span><span style=\"color:var(--teal)\">التدريب<br><span class=\"a-ltr\">1/6</span><br><span class=\"a-ltr\">1,000</span></span><span style=\"color:var(--mut)\">الباقي<br><span class=\"a-ltr\">1/2</span><br><span class=\"a-ltr\">3,000</span></span></div>\n</div>\n<div class=\"a-card\">\n  <p class=\"a-cap\">بعد الثلث يبقى <span class=\"a-ltr\">2/3</span>، وربعه: <span class=\"a-ltr\">1/4 × 2/3 = 1/6</span></p>\n  <p class=\"a-cap\">ويبقى بعدهما: <span class=\"a-ltr\">2/3 × 3/4 = 1/2</span></p>\n</div>\n<div class=\"a-trap a-note\"><b class=\"a-x\">!</b><span>لو قال «ربع <b>الميزانية</b>» فالكسران من الكل: اجمعهما <span class=\"a-ltr\">1/3 + 1/4 = 7/12</span></span></div>\n<div class=\"a-foot\">«من الباقي» = اضرب الكسرين، و«من الكل» = اجمعهما.</div>", "mr02-1": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><circle cx=\"16\" cy=\"22\" r=\"12\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"3\"/><circle cx=\"28\" cy=\"22\" r=\"12\" fill=\"#1F6B4C\" fill-opacity=\".5\"/></svg>كل وبعض ولا</p>\n<h2>ثلاث كلمات، ثلاث رسمات</h2>\n<div class=\"a-vrow\"><svg viewBox=\"0 0 118 70\" role=\"img\" aria-label=\"دائرة أ داخل دائرة ب\"><circle cx=\"59\" cy=\"35\" r=\"32\" fill=\"#EEF0F7\" stroke=\"#33449A\" stroke-width=\"1.6\"/><circle cx=\"66\" cy=\"38\" r=\"15\" fill=\"#1F6B4C\" fill-opacity=\".85\"/><text x=\"66\" y=\"43\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">أ</text><text x=\"38\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#33449A\">ب</text></svg><div><b>«كل أ ب»</b><p>أ كلها <b style=\"display:inline\">داخل</b> ب.</p></div></div>\n<div class=\"a-vrow\"><svg viewBox=\"0 0 118 70\" role=\"img\" aria-label=\"دائرتان منفصلتان أ وب\"><circle cx=\"86\" cy=\"35\" r=\"24\" fill=\"#1F6B4C\" fill-opacity=\".85\"/><circle cx=\"30\" cy=\"35\" r=\"24\" fill=\"#EEF0F7\" stroke=\"#33449A\" stroke-width=\"1.6\"/><text x=\"86\" y=\"40\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#fff\">أ</text><text x=\"30\" y=\"40\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#33449A\">ب</text></svg><div><b>«لا أ ب»</b><p>منفصلتان: لا فرد مشترك.</p></div></div>\n<div class=\"a-vrow\"><svg viewBox=\"0 0 118 70\" role=\"img\" aria-label=\"دائرتان متقاطعتان أ وب، وفي التقاطع نقطة\"><circle cx=\"74\" cy=\"35\" r=\"26\" fill=\"#1F6B4C\" fill-opacity=\".35\" stroke=\"#1F6B4C\" stroke-width=\"1.6\"/><circle cx=\"44\" cy=\"35\" r=\"26\" fill=\"#EEF0F7\" fill-opacity=\".7\" stroke=\"#33449A\" stroke-width=\"1.6\"/><circle cx=\"59\" cy=\"35\" r=\"5\" fill=\"#9B2C2C\"/><text x=\"88\" y=\"40\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#1F6B4C\">أ</text><text x=\"30\" y=\"40\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#33449A\">ب</text></svg><div><b>«بعض أ ب»</b><p>تتقاطعان: فرد واحد على الأقل في التقاطع.</p></div></div>\n<span class=\"a-chipnote\">«لا» و«بعض» تنعكسان، و«كل» لا تنعكس.</span>\n<div class=\"a-foot\">ارسم الجملة قبل أن تحكم: الرسمة تُظهر ما تقوله، ولا تزيد عليه.</div>", "mr02-2": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><circle cx=\"16\" cy=\"22\" r=\"12\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"3\"/><circle cx=\"28\" cy=\"22\" r=\"12\" fill=\"#1F6B4C\" fill-opacity=\".5\"/></svg>كل وبعض ولا</p>\n<h2>«كل أ ب، وبعض ب ج»: رسمتان تصحّان</h2>\n<div class=\"a-pair2\">\n  <figure><svg viewBox=\"0 0 170 130\" role=\"img\" aria-label=\"أ داخل ب، وج تتقاطع مع ب داخل أ\"><circle cx=\"90\" cy=\"65\" r=\"58\" fill=\"#EEF0F7\" stroke=\"#33449A\" stroke-width=\"1.6\"/><circle cx=\"100\" cy=\"58\" r=\"30\" fill=\"#1F6B4C\" fill-opacity=\".3\" stroke=\"#1F6B4C\" stroke-width=\"1.6\"/><text x=\"112\" y=\"50\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#1F6B4C\">أ</text><text x=\"138\" y=\"110\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#33449A\">ب</text><circle cx=\"62\" cy=\"70\" r=\"26\" fill=\"#A8813F\" fill-opacity=\".35\" stroke=\"#A8813F\" stroke-width=\"1.6\"/><text x=\"44\" y=\"98\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#7A5D24\">ج</text></svg><figcaption>تقاطع ب وج داخل أ</figcaption></figure>\n  <figure><svg viewBox=\"0 0 170 130\" role=\"img\" aria-label=\"أ داخل ب، وج تتقاطع مع ب خارج أ\"><circle cx=\"90\" cy=\"65\" r=\"58\" fill=\"#EEF0F7\" stroke=\"#33449A\" stroke-width=\"1.6\"/><circle cx=\"100\" cy=\"58\" r=\"30\" fill=\"#1F6B4C\" fill-opacity=\".3\" stroke=\"#1F6B4C\" stroke-width=\"1.6\"/><text x=\"112\" y=\"50\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#1F6B4C\">أ</text><text x=\"138\" y=\"110\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#33449A\">ب</text><circle cx=\"34\" cy=\"96\" r=\"24\" fill=\"#A8813F\" fill-opacity=\".35\" stroke=\"#A8813F\" stroke-width=\"1.6\"/><text x=\"20\" y=\"118\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#7A5D24\">ج</text></svg><figcaption>تقاطع ب وج خارج أ</figcaption></figure>\n</div>\n<p class=\"a-cap\" style=\"margin-top:6px\">الجملتان صحيحتان في الرسمتين، والرسمتان تختلفان في أ وج.</p>\n<div class=\"a-verdict\">«بعض أ ج»؟ لا يمكن معرفته</div>\n<div class=\"a-foot\">إذا صحّت الجملتان في رسمتين يختلف فيهما الحكم، فالحكم <b>لا يمكن معرفته</b>.</div>", "mv05-1": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><rect x=\"7\" y=\"3\" width=\"30\" height=\"38\" rx=\"4\" fill=\"#F4EEDF\" stroke=\"#A8813F\" stroke-width=\"3\"/><g stroke=\"#1F6B4C\" stroke-width=\"3\" stroke-linecap=\"round\"><line x1=\"13\" y1=\"13\" x2=\"31\" y2=\"13\"/><line x1=\"13\" y1=\"22\" x2=\"31\" y2=\"22\"/><line x1=\"13\" y1=\"31\" x2=\"25\" y2=\"31\"/></g></svg>الفكرة الرئيسة والعنوان</p>\n<h2>القطعة خريطة: كلمتان لكل فقرة</h2>\n<div class=\"a-pm2\">\n  <div class=\"a-pr\"><div class=\"a-ln\"><i></i><i></i></div><div class=\"a-tg2\">العوائق مبكراً</div></div>\n  <div class=\"a-trn\">«و»: تضيف فائدة ↓</div>\n  <div class=\"a-pr\"><div class=\"a-ln\"><i></i><i></i></div><div class=\"a-tg2\">رسائل أقل</div></div>\n  <div class=\"a-trn\">«غير أنّ»: تفتح جهة أخرى ↓</div>\n  <div class=\"a-pr\"><div class=\"a-ln\"><i></i><i></i></div><div class=\"a-tg2 a-w\">شرط القِصر</div></div>\n</div>\n<div class=\"a-main\">الاجتماع الصباحي ينفع الفريق ما دام قصيراً منتظماً<small>الفكرة الرئيسة: تجمع الثلاث</small></div>\n<div class=\"a-foot\">آخر فقرة ليست فائدة جديدة، بل <b>شرط</b> للفائدتين.</div>", "mv05-2": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><rect x=\"7\" y=\"3\" width=\"30\" height=\"38\" rx=\"4\" fill=\"#F4EEDF\" stroke=\"#A8813F\" stroke-width=\"3\"/><g stroke=\"#1F6B4C\" stroke-width=\"3\" stroke-linecap=\"round\"><line x1=\"13\" y1=\"13\" x2=\"31\" y2=\"13\"/><line x1=\"13\" y1=\"22\" x2=\"31\" y2=\"22\"/><line x1=\"13\" y1=\"31\" x2=\"25\" y2=\"31\"/></g></svg>الفكرة الرئيسة والعنوان</p>\n<h2>الموضوع قبل «لكنّ»، والحكم بعدها</h2>\n<div class=\"a-half\">\n  <div class=\"a-bx a-tp\"><small>الموضوع</small>الشهادة تفتح باب الوظيفة،</div>\n  <div class=\"a-pv\">«لكنّ» ↓</div>\n  <div class=\"a-bx a-jd\"><small>الحكم</small>الإتقان هو الذي يُبقي صاحبها فيها</div>\n</div>\n<div class=\"a-okno\">\n  <div class=\"a-y\"><b>✓</b><span>الفكرة: الإتقان شرط البقاء في العمل.</span></div>\n  <div class=\"a-n\"><b>✗</b><span>«أهمية الشهادات»: موضوع الجملة لا حكمها.</span></div>\n</div>\n<div class=\"a-foot\">الفكرة في القطعة القصيرة هي <b>الحكم</b>، لا ما تتكلم عنه.</div>", "mn03-1": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"6\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"3.5\"/><circle cx=\"32\" cy=\"32\" r=\"6\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"3.5\"/><line x1=\"34\" y1=\"8\" x2=\"10\" y2=\"36\" stroke=\"#1F6B4C\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>النسبة المئوية 1</p>\n<h2><span class=\"a-ltr\">35%</span> من <span class=\"a-ltr\">600</span>: ابنِها من العُشر</h2>\n<div class=\"a-card\">\n  <div class=\"a-ten\"><span class=\"a-on\">60</span><span class=\"a-on\">60</span><span class=\"a-on\">60</span><span class=\"a-hf\"><i class=\"a-g\"></i><i></i></span><span></span><span></span><span></span><span></span><span></span><span></span></div>\n  <p class=\"a-cap\" style=\"margin-top:6px\">كل مربع عُشر: <span class=\"a-ltr\">600 ÷ 10 = 60</span>. الأخضر ثلاثة أعشار، والذهبي نصف عُشر.</p>\n</div>\n<div class=\"a-card\">\n  <p class=\"a-cap\">ثلاثة أعشار (<span class=\"a-ltr\">30%</span>): <span class=\"a-ltr\">60 × 3 = 180</span></p>\n  <p class=\"a-cap\">ونصف عُشر (<span class=\"a-ltr\">5%</span>): <span class=\"a-ltr\">60 ÷ 2 = 30</span></p>\n  <p class=\"a-cap\"><b>المجموع:</b> <span class=\"a-ltr\">180 + 30 = 210</span></p>\n</div>\n<div class=\"a-foot\">ابدأ بالعُشر لأنه قسمة على 10 بلا حساب، ثم اسأل: كم عُشراً؟ وهل بقي نصف عُشر؟</div>", "mn03-2": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"6\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"3.5\"/><circle cx=\"32\" cy=\"32\" r=\"6\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"3.5\"/><line x1=\"34\" y1=\"8\" x2=\"10\" y2=\"36\" stroke=\"#1F6B4C\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>النسبة المئوية 1</p>\n<h2>ما المطلوب: الجزء، أم النسبة، أم الكل؟</h2>\n<div class=\"a-c3\">\n  <div><b>الجزء</b><p>«<span class=\"a-ltr\">35%</span> من <span class=\"a-ltr\">600</span>» ← ابنِه من العُشر: <span class=\"a-ltr\">210</span></p></div>\n  <div><b>النسبة</b><p>«ما نسبة <span class=\"a-ltr\">18</span> من <span class=\"a-ltr\">60</span>؟» ← <span class=\"a-ltr\">18 ÷ 60 × 100 = 30%</span></p></div>\n  <div><b>الكل</b><p>«<span class=\"a-ltr\">30%</span> من الموظفين <span class=\"a-ltr\">24</span>» ← <span class=\"a-ltr\">24 ÷ 30 × 100 = 80</span></p></div>\n</div>\n<span class=\"a-chipnote\" style=\"margin-top:8px\">الجزء بعد «نسبة»، والكل بعد «من».</span>\n<div class=\"a-foot\">الرقم المعطى جزء؟ فالكل <b>أكبر منه</b> ما دامت النسبة أقل من <span class=\"a-ltr\">100%</span>.</div>", "mv02-1": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><line x1=\"6\" y1=\"22\" x2=\"38\" y2=\"22\" stroke=\"#A8813F\" stroke-width=\"3\"/><circle cx=\"6\" cy=\"22\" r=\"5\" fill=\"#1B231E\"/><circle cx=\"38\" cy=\"22\" r=\"5\" fill=\"#fff\" stroke=\"#1B231E\" stroke-width=\"2.5\"/></svg>المتضادات والكلمة الشاذة</p>\n<h2>الضد في الطرف المقابل</h2>\n<div class=\"a-card\">\n  <div class=\"a-axr\"><span class=\"a-w a-me\">الشجاع</span><span class=\"a-w a-syn\">المقدام</span><hr><span class=\"a-w a-op\">الجبان</span></div>\n  <div class=\"a-lbl\"><span>الكلمة</span><span style=\"color:var(--red)\">مرادف مدسوس ✗</span><span></span><span style=\"color:var(--grn)\">الضد ✓</span></div>\n  <span class=\"a-far\"><b>البخيل:</b> بعيد، خارج المحور ✗</span>\n</div>\n<div class=\"a-card\">\n  <div class=\"a-axr\"><span class=\"a-w a-me\">سافر</span><span></span><hr style=\"border-top-style:dashed\"><span class=\"a-w a-op\">أقام</span></div>\n  <div class=\"a-lbl\"><span>الكلمة</span><span></span><span style=\"text-align:center\"><span class=\"a-w a-gap\" style=\"display:inline-block;border-radius:10px;padding:2px 8px;font-size:15px;font-weight:800\">لم يسافر</span></span><span style=\"color:var(--grn)\">الضد ✓</span></div>\n  <p class=\"a-cap\">«لم يسافر» نفي: غياب المعنى، لا معنى قائم في الجهة الأخرى.</p>\n</div>\n<div class=\"a-foot\">المرادف بجانب الكلمة، والضد في <b>الطرف المقابل</b> على المحور نفسه.</div>", "mv02-2": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><line x1=\"6\" y1=\"22\" x2=\"38\" y2=\"22\" stroke=\"#A8813F\" stroke-width=\"3\"/><circle cx=\"6\" cy=\"22\" r=\"5\" fill=\"#1B231E\"/><circle cx=\"38\" cy=\"22\" r=\"5\" fill=\"#fff\" stroke=\"#1B231E\" stroke-width=\"2.5\"/></svg>المتضادات والكلمة الشاذة</p>\n<h2>الرابط الأدق يُخرج كلمة واحدة</h2>\n<div class=\"a-flt\"><div class=\"a-hd2\">«حيوانات»<small>واسع: لا يُخرج أحداً</small></div>\n  <div class=\"a-an\"><span>أسد</span><span>نمر</span><span>ذئب</span><span>حصان</span></div></div>\n<div class=\"a-flt\" style=\"border-color:var(--grn)\"><div class=\"a-hd2\">«مفترسة»<small>أدق: يُخرج كلمة واحدة</small></div>\n  <div class=\"a-an\"><span>أسد</span><span>نمر</span><span>ذئب</span><span class=\"a-out\">حصان</span></div></div>\n<p class=\"a-cap\"><b>الشاذة: «حصان»</b>، لأنها وحدها ليست مفترسة.</p>\n<div class=\"a-trap\"><b class=\"a-x\">!</b><span>خرجت كلمتان؟ فالرابط <b>ضيق</b>: وسّعه حتى تخرج واحدة فقط.</span></div>\n<div class=\"a-foot\">ابحث عن رابط يجمع ثلاثاً بالضبط، لا رابط يجمع الأربع.</div>", "mn05-1": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><rect x=\"3\" y=\"14\" width=\"10\" height=\"16\" rx=\"3\" fill=\"#A8813F\"/><rect x=\"15\" y=\"14\" width=\"26\" height=\"16\" rx=\"3\" fill=\"#1F6B4C\"/></svg>النسبة والتناسب</p>\n<h2><span class=\"a-ltr\">1,800</span> بنسبة <span class=\"a-ltr\">2 : 7</span>: اجمع، ثم اقسم، ثم اضرب</h2>\n<div class=\"a-card\">\n  <div class=\"a-bar a-nine\"><span class=\"a-g\">200</span><span class=\"a-g\">200</span><span class=\"a-gr\">200</span><span class=\"a-gr\">200</span><span class=\"a-gr\">200</span><span class=\"a-gr\">200</span><span class=\"a-gr\">200</span><span class=\"a-gr\">200</span><span class=\"a-gr\">200</span></div>\n  <div class=\"a-brc\" style=\"grid-template-columns:2fr 7fr;gap:6px\"><span style=\"color:var(--gold)\">الأول</span><span style=\"color:var(--grn)\">الثاني</span></div>\n  <p class=\"a-cap\" style=\"margin-top:6px\">الأجزاء <span class=\"a-ltr\">2 + 7 = 9</span>، والجزء <span class=\"a-ltr\">1,800 ÷ 9 = 200</span></p>\n  <p class=\"a-cap\">الأول <span class=\"a-ltr\">2 × 200 = 400</span>، والثاني <span class=\"a-ltr\">7 × 200 = 1,400</span></p>\n</div>\n<div class=\"a-card\">\n  <p class=\"a-h\">وإذا أعطاك فرق النصيبين: <span class=\"a-ltr\">250</span></p>\n  <div class=\"a-bar a-nine\"><span class=\"a-g\"></span><span class=\"a-g\"></span><span class=\"a-gr\"></span><span class=\"a-gr\"></span><span class=\"a-gr a-dif\"></span><span class=\"a-gr a-dif\"></span><span class=\"a-gr a-dif\"></span><span class=\"a-gr a-dif\"></span><span class=\"a-gr a-dif\"></span></div>\n  <p class=\"a-cap\" style=\"margin-top:6px\">الفرق <b>5 أجزاء</b> (المحدّدة بالأحمر): <span class=\"a-ltr\">250 ÷ 5 = 50</span> للجزء.</p>\n</div>\n<div class=\"a-foot\">المبلغ مقسوماً على مجموع الأجزاء يعطي <b>قيمة الجزء</b>.</div>", "mn05-2": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><rect x=\"3\" y=\"14\" width=\"10\" height=\"16\" rx=\"3\" fill=\"#A8813F\"/><rect x=\"15\" y=\"14\" width=\"26\" height=\"16\" rx=\"3\" fill=\"#1F6B4C\"/></svg>النسبة والتناسب</p>\n<h2>القسمة ثابتة، أم الضرب؟</h2>\n<div class=\"a-pv2\">\n  <div class=\"a-pn a-dr\"><div class=\"a-h5\">طردي<span>↑↑</span></div><div class=\"a-k5\">يزيدان معاً، والقسمة ثابتة</div>\n    <p><span class=\"a-ltr\">6</span> ساعات ← <span class=\"a-ltr\">270</span></p><p>الساعة: <span class=\"a-ltr\">270 ÷ 6 = 45</span></p><p><span class=\"a-ltr\">10</span> ساعات ← <span class=\"a-ltr\">450</span></p></div>\n  <div class=\"a-pn a-iv\"><div class=\"a-h5\">عكسي<span>↑↓</span></div><div class=\"a-k5\">أحدهما يزيد والآخر ينقص، والضرب ثابت</div>\n    <p><span class=\"a-ltr\">5 × 12 = 60</span> يوم عمل</p><p><span class=\"a-ltr\">6</span> موظفين: <span class=\"a-ltr\">60 ÷ 6</span></p><p>= <span class=\"a-ltr\">10</span> أيام</p></div>\n</div>\n<div class=\"a-trap a-note\" style=\"margin-top:10px\"><b class=\"a-x\">!</b><span>اسأل قبل أن تحسب: <b>يزيد المطلوب أم ينقص؟</b> موظفون أكثر يعني أياماً أقل.</span></div>\n<div class=\"a-foot\">إن خرج جوابك أكثر من <span class=\"a-ltr\">12</span> يوماً مع موظفين أكثر، فقد حللتها كأنها طردية.</div>", "mv04-1": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><line x1=\"2\" y1=\"30\" x2=\"12\" y2=\"30\" stroke=\"#A8813F\" stroke-width=\"3\"/><rect x=\"15\" y=\"16\" width=\"14\" height=\"16\" rx=\"3\" fill=\"#1F6B4C\"/><line x1=\"32\" y1=\"30\" x2=\"42\" y2=\"30\" stroke=\"#A8813F\" stroke-width=\"3\"/></svg>إكمال الجمل 2</p>\n<h2>فراغان: من أربعة إلى اثنين إلى واحد</h2>\n<p class=\"a-lead\">الخيار كلمتان، ويسقط كله إذا فشلت <b>كلمة واحدة</b>.</p>\n<div class=\"a-card\">\n  <div class=\"a-ghd\"><span></span><span>الفراغ الأوضح</span><span>الفراغ الآخر</span><span></span></div>\n  <div class=\"a-opg\"><span class=\"a-l\">(أ)</span><i class=\"a-ok\">✓</i><i class=\"a-ok\">✓</i><span class=\"a-st a-ok\">✓</span></div>\n  <div class=\"a-opg\"><span class=\"a-l\">(ب)</span><i class=\"a-ok\">✓</i><i class=\"a-no\">✗</i><span class=\"a-st\">يسقط ثانياً</span></div>\n  <div class=\"a-opg a-out\"><span class=\"a-l\">(ج)</span><i class=\"a-no\">✗</i><i></i><span class=\"a-st\">يسقط أولاً</span></div>\n  <div class=\"a-opg a-out\"><span class=\"a-l\">(د)</span><i class=\"a-no\">✗</i><i></i><span class=\"a-st\">يسقط أولاً</span></div>\n</div>\n<p class=\"a-cap\">الفراغ الأوضح أسقط خيارين دون أن تنظر في الفراغ الآخر، ثم حسم الآخر بين الباقيين.</p>\n<div class=\"a-foot\">لا تحلّ الفراغات بترتيبها في الجملة: ابدأ بالذي <b>دليله أوضح</b>.</div>", "mv04-2": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><line x1=\"2\" y1=\"30\" x2=\"12\" y2=\"30\" stroke=\"#A8813F\" stroke-width=\"3\"/><rect x=\"15\" y=\"16\" width=\"14\" height=\"16\" rx=\"3\" fill=\"#1F6B4C\"/><line x1=\"32\" y1=\"30\" x2=\"42\" y2=\"30\" stroke=\"#A8813F\" stroke-width=\"3\"/></svg>إكمال الجمل 2</p>\n<h2>كلمات تأتي معاً</h2>\n<div class=\"a-card\"><div class=\"a-chips2\"><span>عقد اجتماعاً</span><span>أبرم عقداً</span><span>رفع تقريراً</span></div></div>\n<div class=\"a-card\">\n  <div class=\"a-lnk2\"><span>اطّلع</span><i>←</i><span class=\"a-pr\">على</span><span>اعتذر</span><i>←</i><span class=\"a-pr\">عن</span><span>أسهم</span><i>←</i><span class=\"a-pr\">في</span></div></div>\n<div class=\"a-sent\">… الطرفان العقد بعد أسبوع</div>\n<div class=\"a-two3\"><span class=\"a-ok\">أبرم ✓</span><span class=\"a-no\">صنع ✗</span></div>\n<p class=\"a-cap\" style=\"margin-top:4px\">«العقد» تستدعي «أبرم»، فتسقط «صنع» ولو قرب معناها.</p>\n<div class=\"a-foot\">إذا جاء أحد الطرفين في الجملة، <b>ضاقت</b> الخيارات.</div>", "mn04-1": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"6\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"3.5\"/><circle cx=\"32\" cy=\"32\" r=\"6\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"3.5\"/><line x1=\"34\" y1=\"8\" x2=\"10\" y2=\"36\" stroke=\"#1F6B4C\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>الزيادة والنقص والخصم</p>\n<h2>اضرب في الباقي من المئة</h2>\n<div class=\"a-card\"><p class=\"a-h\">خصم <span class=\"a-ltr\">20%</span></p>\n  <div class=\"a-pbar\"><span class=\"a-k\" style=\"flex:80\">يبقى&nbsp;<span class=\"a-ltr\">80%</span></span><span class=\"a-d\" style=\"flex:20\"><span class=\"a-ltr\">20%</span></span></div>\n  <p class=\"a-cap\"><span class=\"a-ltr\">80% × 450 = 360</span></p></div>\n<div class=\"a-card\"><p class=\"a-h\">زيادة <span class=\"a-ltr\">15%</span></p>\n  <div class=\"a-pbar\"><span class=\"a-k\" style=\"flex:100\"><span class=\"a-ltr\">100%</span></span><span class=\"a-a\" style=\"flex:15\"><span class=\"a-ltr\">15%</span></span></div>\n  <p class=\"a-cap\">يصير <span class=\"a-ltr\">115%</span>: <span class=\"a-ltr\">115% × 200 = 230</span></p></div>\n<div class=\"a-foot\">الزيادة <b>تُضاف</b> إلى المئة، والنقص <b>يُطرح</b> منها، ثم تضرب في الناتج.</div>", "mn04-2": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"6\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"3.5\"/><circle cx=\"32\" cy=\"32\" r=\"6\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"3.5\"/><line x1=\"34\" y1=\"8\" x2=\"10\" y2=\"36\" stroke=\"#1F6B4C\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>الزيادة والنقص والخصم</p>\n<h2>زيادة <span class=\"a-ltr\">20%</span> ثم نقص <span class=\"a-ltr\">20%</span> لا ترجعك</h2>\n<div class=\"a-stair\"><div class=\"a-s0\"><span class=\"a-ltr\">500</span><small>الأصل</small></div><div class=\"a-s1\"><span class=\"a-ltr\">600</span><small><span class=\"a-ltr\">+20%</span></small></div><div class=\"a-s2\"><span class=\"a-ltr\">480</span><small><span class=\"a-ltr\">−20%</span></small></div></div>\n<div class=\"a-stl\"><span>البداية</span><span>من <span class=\"a-ltr\">500</span></span><span>من <span class=\"a-ltr\">600</span> لا من <span class=\"a-ltr\">500</span></span></div>\n<div class=\"a-card\" style=\"margin-top:8px\">\n  <p class=\"a-cap\">النسبة الثانية تُحسب من قيمة <b>جديدة</b>، فالنتيجة <span class=\"a-ltr\">480</span> لا <span class=\"a-ltr\">500</span>.</p>\n  <p class=\"a-cap\">وخصمان <span class=\"a-ltr\">20%</span> ثم <span class=\"a-ltr\">10%</span>: <span class=\"a-ltr\">80% × 90% = 72%</span>، فالخصم <span class=\"a-ltr\">28%</span> لا <span class=\"a-ltr\">30%</span>.</p>\n</div>\n<div class=\"a-foot\">إلا إذا قال السؤال إن النسبتين من السعر <b>الأصلي</b>، فعندها تُجمعان.</div>", "mr04-1": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><rect x=\"4\" y=\"4\" width=\"36\" height=\"36\" rx=\"4\" fill=\"#F4EEDF\" stroke=\"#A8813F\" stroke-width=\"2.5\"/><line x1=\"16\" y1=\"4\" x2=\"16\" y2=\"40\" stroke=\"#A8813F\" stroke-width=\"2\"/><line x1=\"28\" y1=\"4\" x2=\"28\" y2=\"40\" stroke=\"#A8813F\" stroke-width=\"2\"/><line x1=\"4\" y1=\"16\" x2=\"40\" y2=\"16\" stroke=\"#A8813F\" stroke-width=\"2\"/><line x1=\"4\" y1=\"28\" x2=\"40\" y2=\"28\" stroke=\"#A8813F\" stroke-width=\"2\"/><circle cx=\"22\" cy=\"22\" r=\"4\" fill=\"#1F6B4C\"/></svg>التوزيع وجدول الاستبعاد</p>\n<h2>اشطب ما يُنفى، ثم ثبّت ما بقي</h2>\n<p class=\"a-lead\">بدر ليس في 1 ولا 3، وأحمد ليس في 1.</p>\n<div class=\"a-gt3\">\n  <span></span><span class=\"a-hd\">مكتب 1</span><span class=\"a-hd\">مكتب 2</span><span class=\"a-hd\">مكتب 3</span>\n  <span class=\"a-nm\">بدر</span><span class=\"a-c a-x\">✗</span><span class=\"a-c a-v\">✓<sup>1</sup></span><span class=\"a-c a-x\">✗</span>\n  <span class=\"a-nm\">أحمد</span><span class=\"a-c a-x\">✗</span><span class=\"a-c a-x\">✗</span><span class=\"a-c a-v\">✓<sup>2</sup></span>\n  <span class=\"a-nm\">جمال</span><span class=\"a-c a-v\">✓<sup>3</sup></span><span class=\"a-c a-x\">✗</span><span class=\"a-c a-x\">✗</span>\n</div>\n<p class=\"a-cap\" style=\"margin-top:8px\">الرقم الصغير ترتيب التثبيت: بدر لم يبقَ له إلا 2، فشُطب 2 من أحمد فبقي له 3، وبقي 1 لجمال.</p>\n<div class=\"a-foot\">كلما ثبّتَّ اسماً، <b>اشطب عموده</b> من الباقين، ثم ارجع إلى الشروط.</div>", "mr04-2": "<p class=\"a-tag a-tg\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 44 44\" aria-hidden=\"true\"><rect x=\"4\" y=\"4\" width=\"36\" height=\"36\" rx=\"4\" fill=\"#F4EEDF\" stroke=\"#A8813F\" stroke-width=\"2.5\"/><line x1=\"16\" y1=\"4\" x2=\"16\" y2=\"40\" stroke=\"#A8813F\" stroke-width=\"2\"/><line x1=\"28\" y1=\"4\" x2=\"28\" y2=\"40\" stroke=\"#A8813F\" stroke-width=\"2\"/><line x1=\"4\" y1=\"16\" x2=\"40\" y2=\"16\" stroke=\"#A8813F\" stroke-width=\"2\"/><line x1=\"4\" y1=\"28\" x2=\"40\" y2=\"28\" stroke=\"#A8813F\" stroke-width=\"2\"/><circle cx=\"22\" cy=\"22\" r=\"4\" fill=\"#1F6B4C\"/></svg>التوزيع وجدول الاستبعاد</p>\n<h2>حتماً، أم ممكن، أم لا يمكن؟</h2>\n<p class=\"a-lead\">«هند بعد رنا»، و«سعد ليس في 1»: بقي توزيعان فقط.</p>\n<div class=\"a-dist\">\n  <div><b>التوزيع الأول</b><p>1 رنا · 2 هند · 3 سعد</p></div>\n  <div><b>التوزيع الثاني</b><p>1 رنا · 2 سعد · 3 هند</p></div>\n</div>\n<div class=\"a-vr3\">\n  <div><span>«رنا في 1»: في الاثنين</span><b class=\"a-h\">حتماً</b></div>\n  <div><span>«هند في 3»: في واحد</span><b class=\"a-mm\">ممكن</b></div>\n  <div><span>«هند في 1»: في لا واحد</span><b class=\"a-nn\">لا يمكن</b></div>\n</div>\n<div class=\"a-foot\">اقرأ السؤال بدقة: «حتماً» غير «يمكن» غير «لا يمكن».</div>", "mr03-1": "<h2>«لا… إلا»: شرط لازم لا كافٍ</h2>\n<div class=\"a-cfk\">\n<div class=\"a-cfa\"><svg viewBox=\"0 0 66 40\" aria-hidden=\"true\"><circle cx=\"15\" cy=\"20\" r=\"10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M25,20 H60 M52,20 V31 M43,20 V28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><b>«إذا» مفتاح</b><span>يفتح وحده</span><em>شرط كافٍ</em></div>\n<div class=\"a-cfl\"><svg viewBox=\"0 0 40 48\" aria-hidden=\"true\"><path d=\"M11,22 V14 A9,9 0 0 1 29,14 V22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><rect x=\"5\" y=\"22\" width=\"30\" height=\"23\" rx=\"4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><circle cx=\"20\" cy=\"31\" r=\"3.5\" fill=\"currentColor\"/><path d=\"M20,33 V39\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg><b>«لا… إلا» قفل</b><span>لا يُفتح بدونه، ولا يفتح وحده</span><em>شرط لازم</em></div>\n</div>\n<div class=\"a-ccd\"><p class=\"a-chd\">«لا تُصرف البدلات إلا بعد اعتماد المدير»</p>\n<div class=\"a-crow\"><span class=\"a-cs\">اعتماد المدير</span><i>=</i><span class=\"a-cy\">القفل: لا صرف بدونه</span></div>\n<div class=\"a-crow\" style=\"margin-bottom:0\"><span class=\"a-cs\">صُرفت بدلات سعد</span><i>←</i><span class=\"a-cy\">اعتمدها المدير حتماً</span></div>\n</div>\n<div class=\"a-foot a-f15\">في «لا… إلا» ابدأ من النتيجة: ما صُرف <b>مرّ بالقفل</b> حتماً.</div>", "mr03-2": "<h2>ارسم الحدود، وضع القيمة مكانها</h2>\n<div class=\"a-ccd\"><p class=\"a-chd\">الفئة أ من <span class=\"a-ltr\">100</span> فأكثر، والفئة ب من <span class=\"a-ltr\">50</span> حتى ما قبل <span class=\"a-ltr\">100</span></p><svg direction=\"ltr\" viewBox=\"0 0 336 120\" role=\"img\" aria-label=\"خط من 0 إلى 130: الفئة ب من 50 حتى ما قبل 100، والفئة أ من 100 فأكثر، وسالم عند 100\"><rect x=\"134.0\" y=\"48\" width=\"120.0\" height=\"14\" rx=\"3\" fill=\"#EEF0F7\"/><rect x=\"254.0\" y=\"48\" width=\"72.0\" height=\"14\" rx=\"3\" class=\"a-cxl\" fill=\"#E3F0E8\"/><line x1=\"14.0\" y1=\"55\" x2=\"326.0\" y2=\"55\" stroke=\"#1B231E\" stroke-width=\"2\"/><circle cx=\"134.0\" cy=\"55\" r=\"7\" fill=\"#33449A\"/><circle cx=\"254.0\" cy=\"55\" r=\"7\" fill=\"#1F6B4C\"/><g font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\"><text x=\"134.0\" y=\"84\" fill=\"#33449A\">50</text><text x=\"254.0\" y=\"84\" fill=\"#1F6B4C\" class=\"a-cxn\">100</text><text x=\"14.0\" y=\"84\" fill=\"#56605A\">0</text></g><g font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" direction=\"rtl\"><text x=\"194.0\" y=\"38\" fill=\"#33449A\">الفئة ب</text><text x=\"290.0\" y=\"38\" fill=\"#1F6B4C\" class=\"a-cxn\">الفئة أ</text></g><path d=\"M254.0,102 L254.0,91\" stroke=\"#7A5D24\" stroke-width=\"2\"/><path d=\"M250.0,96 L254.0,90 L258.0,96\" fill=\"none\" stroke=\"#7A5D24\" stroke-width=\"2\"/><text x=\"254.0\" y=\"118\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#7A5D24\" direction=\"rtl\">سالم</text></svg></div>\n<div class=\"a-c2c\"><div class=\"a-ckl\"><svg class=\"a-cgr\" direction=\"ltr\" viewBox=\"0 0 120 22\" aria-hidden=\"true\"><line x1=\"23\" y1=\"11\" x2=\"110\" y2=\"11\" stroke=\"currentColor\" stroke-width=\"3\"/><path d=\"M104,5 L112,11 L104,17\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><circle cx=\"16\" cy=\"11\" r=\"6\" fill=\"currentColor\" stroke=\"currentColor\" stroke-width=\"2.5\"/></svg><b>«<span class=\"a-ltr\">100</span> فأكثر»</b><span>نقطة ممتلئة: المئة داخلها</span></div><div class=\"a-cka\"><svg class=\"a-cgr\" direction=\"ltr\" viewBox=\"0 0 120 22\" aria-hidden=\"true\"><line x1=\"23\" y1=\"11\" x2=\"110\" y2=\"11\" stroke=\"currentColor\" stroke-width=\"3\"/><path d=\"M104,5 L112,11 L104,17\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><circle cx=\"16\" cy=\"11\" r=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"/></svg><b>«أكثر من <span class=\"a-ltr\">100</span>»</b><span>نقطة فارغة: تبدأ بعد المئة</span></div></div>\n<div class=\"a-cnote\" style=\"margin-top:8px\">باع سالم <span class=\"a-ltr\">100</span> بالضبط، و«فأكثر» تشمل الحد، فهو في <b>الفئة أ</b>.</div>\n<div class=\"a-foot a-f15\">اسأل عن كلمة الحد: هل المئة <b>داخلها</b> أم خارجها؟</div>", "mv06-1": "<h2>«ما عدا»: الخيار الذي بلا سطر</h2>\n<div class=\"a-cpg\">\n<div><b>الفقرة <span class=\"a-ltr\">1</span></b><span>الحجز المسبق عبر الهاتف</span></div>\n<div><b>الفقرة <span class=\"a-ltr\">2</span></b><span>الانتظار: من ساعتين إلى ربع ساعة</span></div>\n<div><b>الفقرة <span class=\"a-ltr\">3</span></b><span>نافذة لمن لم يحجز</span></div>\n</div>\n<div class=\"a-cop\"><span class=\"a-o\">حجز المواعيد مسبقاً</span><i>←</i><span class=\"a-t a-y\">✓ الفقرة <span class=\"a-ltr\">1</span></span></div>\n<div class=\"a-cop\"><span class=\"a-o\">قصر الانتظار</span><i>←</i><span class=\"a-t a-y\">✓ الفقرة <span class=\"a-ltr\">2</span></span></div>\n<div class=\"a-cop a-cx\"><span class=\"a-o\">تمديد ساعات الدوام</span><i>←</i><span class=\"a-t\">✗ لا سطر له</span></div>\n<div class=\"a-cop\"><span class=\"a-o\">خدمة من لم يحجز</span><i>←</i><span class=\"a-t a-y\">✓ الفقرة <span class=\"a-ltr\">3</span></span></div>\n<div class=\"a-foot a-f15\">علّم كل خيار وجدت سطره، و<b>الباقي</b> هو جواب «ما عدا».</div>", "mv06-2": "<h2>«يُفهم»: ما يلزم من السطر</h2>\n<div class=\"a-cok\">✓ يعيد صياغة سطر، أو يلزم منه أو من سطرين معاً</div>\n<div class=\"a-cinf\"><p class=\"a-q\">القطعة: <b>«ربع ساعة في المتوسط»</b></p>\n<div class=\"a-a a-cfy\"><span>✓ «صار الانتظار أقصر بكثير»</span><span class=\"a-tg\">يلزم منه</span></div>\n<div class=\"a-a\"><span>✗ «انتهى الانتظار تماماً»</span><span class=\"a-tg\">مبالغة</span></div></div>\n<div class=\"a-cinf\"><p class=\"a-q\">القطعة: <b>«وجدوه صعباً في البداية»</b></p><div class=\"a-a\"><span>✗ «كبار السن يرفضون التقنية»</span><span class=\"a-tg\">تعميم</span></div></div>\n<div class=\"a-foot a-f15\">اسأل عن كل خيار: <b>أي سطر</b> يقول هذا، أو يجعله لازماً؟</div>", "mv07-1": "<h2>الضمير: على ماذا يعود؟</h2>\n<div class=\"a-cstep\"><span>طابق العدد والجنس</span><i>←</i><span>ضع الاسم مكانه</span><i>←</i><span>استقام المعنى؟</span></div>\n<div class=\"a-ccd\"><p class=\"a-chd\">جمع غير العاقل يعود عليه ضمير المفردة<small>«ها» مفردة مؤنثة، فتعود على «الإدارات»</small></p><svg viewBox=\"0 0 336 72\" role=\"img\" aria-label=\"الضمير ها في بعضها يعود على الإدارات\"><rect x=\"218\" y=\"34\" width=\"110\" height=\"34\" rx=\"9\" fill=\"#E3F0E8\" class=\"a-cxl\"/><rect x=\"8\" y=\"34\" width=\"96\" height=\"34\" rx=\"9\" fill=\"#F4EEDF\"/><g font-size=\"16\" font-weight=\"800\" text-anchor=\"middle\" direction=\"rtl\"><text x=\"273\" y=\"57\" fill=\"#1F6B4C\" class=\"a-cxn\">الإدارات</text><text x=\"168\" y=\"57\" fill=\"#56605A\">…</text><text x=\"56\" y=\"57\" fill=\"#1B231E\">بعضها</text></g><path d=\"M40,32 Q150,-6 262,32\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2.2\"/><path d=\"M254,24 L263,33 L251,35\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2.2\"/></svg></div>\n<div class=\"a-ccd\"><p class=\"a-chd\">اسم الإشارة قد يعود على فكرة كاملة<small>لا على كلمة، بل على ما وصفته الفقرة قبله</small></p><svg viewBox=\"0 0 336 64\" role=\"img\" aria-label=\"هذا التحوّل يعود على فكرة الفقرة كلها\"><g fill=\"#EEE9DE\" class=\"a-cxe\"><rect x=\"150\" y=\"4\" width=\"178\" height=\"9\" rx=\"4.5\" class=\"a-cxe\"/><rect x=\"164\" y=\"18\" width=\"164\" height=\"9\" rx=\"4.5\" class=\"a-cxe\"/><rect x=\"178\" y=\"32\" width=\"150\" height=\"9\" rx=\"4.5\" class=\"a-cxe\"/></g><path d=\"M142,2 L134,2 L134,43 L142,43\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2.2\"/><rect x=\"8\" y=\"32\" width=\"100\" height=\"30\" rx=\"9\" fill=\"#F4EEDF\"/><text x=\"58\" y=\"52\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#1B231E\" direction=\"rtl\">هذا التحوّل</text><path d=\"M108,46 Q126,46 132,24\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\"/></svg></div>\n<div class=\"a-foot a-f15\">المرجع: <b>أقرب اسم يطابقه</b> ويستقيم معه المعنى، لا أقرب اسم فقط.</div>", "mv07-2": "<h2>أداة الربط: ماذا تفيد؟</h2>\n<div class=\"a-cg4\">\n  <div class=\"a-cq1\"><p class=\"a-h\" style=\"margin:0 0 3px\">نتيجة<i>⇠</i></p><p class=\"a-w\" style=\"margin:0\">«ومن ثمّ»، «لذلك»، «فـ»</p></div>\n  <div class=\"a-cq2\"><p class=\"a-h\" style=\"margin:0 0 3px\">استدراك أو عكس<i>↶</i></p><p class=\"a-w\" style=\"margin:0\">«غير أنّ»، «لكنّ»، «بل»</p></div>\n  <div class=\"a-cq3\"><p class=\"a-h\" style=\"margin:0 0 3px\">تعليل<i>⇢</i></p><p class=\"a-w\" style=\"margin:0\">«لأنّ»، «إذ»</p></div>\n  <div class=\"a-cq4\"><p class=\"a-h\" style=\"margin:0 0 3px\">إضافة<i>+</i></p><p class=\"a-w\" style=\"margin:0\">«كما»، «أيضاً»</p></div>\n</div>\n<div class=\"a-ccd\"><div class=\"a-cex\">\n  <span class=\"a-s\">غيّر وقته وشكله</span>\n  <span class=\"a-k\">↓ «ومن ثمّ» ↓</span>\n  <span class=\"a-s\">صار المدير يقرأ ما يحتاجه في دقائق</span>\n  <span class=\"a-r\">الثانية نتيجة للأولى، فالأداة تفيد النتيجة</span>\n</div></div>\n<div class=\"a-foot a-f15\">اقرأ الجملة قبلها وبعدها: <b>نتيجة؟ سبب؟ تقييد؟ إضافة؟</b></div>", "mn10-1": "<h2>النسبة قد تكون كسراً</h2>\n<div class=\"a-ccd\"><div class=\"a-cser\"><span class=\"a-tn\"><span class=\"a-ltr\">3</span></span><span class=\"a-hp\"><span class=\"a-ltr\">× 2</span><svg viewBox=\"0 0 26 12\" aria-hidden=\"true\"><path d=\"M23,10 Q13,-3 3,10\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\"/><path d=\"M1,6 L3,11 L8,9\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\" stroke-linejoin=\"round\"/></svg></span><span class=\"a-tn\"><span class=\"a-ltr\">6</span></span><span class=\"a-hp\"><span class=\"a-ltr\">× 2</span><svg viewBox=\"0 0 26 12\" aria-hidden=\"true\"><path d=\"M23,10 Q13,-3 3,10\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\"/><path d=\"M1,6 L3,11 L8,9\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\" stroke-linejoin=\"round\"/></svg></span><span class=\"a-tn\"><span class=\"a-ltr\">12</span></span><span class=\"a-hp\"><span class=\"a-ltr\">× 2</span><svg viewBox=\"0 0 26 12\" aria-hidden=\"true\"><path d=\"M23,10 Q13,-3 3,10\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\"/><path d=\"M1,6 L3,11 L8,9\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\" stroke-linejoin=\"round\"/></svg></span><span class=\"a-tn\"><span class=\"a-ltr\">24</span></span><span class=\"a-hp\"><span class=\"a-ltr\">× 2</span><svg viewBox=\"0 0 26 12\" aria-hidden=\"true\"><path d=\"M23,10 Q13,-3 3,10\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\"/><path d=\"M1,6 L3,11 L8,9\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\" stroke-linejoin=\"round\"/></svg></span><span class=\"a-tn a-q\"><span class=\"a-ltr\">48</span></span></div>\n<p class=\"a-chd\" style=\"text-align:center;margin:2px 0 8px\">كل حد ضعف سابقه</p>\n<div class=\"a-cser\"><span class=\"a-tn\"><span class=\"a-ltr\">16</span></span><span class=\"a-hp\"><span class=\"a-ltr\">× 1.5</span><svg viewBox=\"0 0 26 12\" aria-hidden=\"true\"><path d=\"M23,10 Q13,-3 3,10\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\"/><path d=\"M1,6 L3,11 L8,9\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\" stroke-linejoin=\"round\"/></svg></span><span class=\"a-tn\"><span class=\"a-ltr\">24</span></span><span class=\"a-hp\"><span class=\"a-ltr\">× 1.5</span><svg viewBox=\"0 0 26 12\" aria-hidden=\"true\"><path d=\"M23,10 Q13,-3 3,10\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\"/><path d=\"M1,6 L3,11 L8,9\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\" stroke-linejoin=\"round\"/></svg></span><span class=\"a-tn\"><span class=\"a-ltr\">36</span></span><span class=\"a-hp\"><span class=\"a-ltr\">× 1.5</span><svg viewBox=\"0 0 26 12\" aria-hidden=\"true\"><path d=\"M23,10 Q13,-3 3,10\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\"/><path d=\"M1,6 L3,11 L8,9\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\" stroke-linejoin=\"round\"/></svg></span><span class=\"a-tn\"><span class=\"a-ltr\">54</span></span><span class=\"a-hp\"><span class=\"a-ltr\">× 1.5</span><svg viewBox=\"0 0 26 12\" aria-hidden=\"true\"><path d=\"M23,10 Q13,-3 3,10\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\"/><path d=\"M1,6 L3,11 L8,9\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"2\" stroke-linejoin=\"round\"/></svg></span><span class=\"a-tn a-q\"><span class=\"a-ltr\">81</span></span></div>\n<p class=\"a-chd\" style=\"text-align:center;margin:2px 0 0\">كل حد مرة ونصف سابقه</p></div>\n<div class=\"a-cfm\" style=\"margin:0 0 8px\"><span class=\"a-ltr\">24 ÷ 16 = 36 ÷ 24 = 54 ÷ 36 = 1.5</span></div>\n<div class=\"a-cnote\">القسمة لم تخرج عدداً صحيحاً؟ <b>لا تترك النسبة</b>: جرّب الكسر.</div>\n<div class=\"a-foot a-f15\">النسبة الكسرية تُختبر على <b>كل</b> الحدود، لا على حدّين.</div>", "mn10-2": "<h2>النسبة نفسها تزيد بانتظام</h2>\n<div class=\"a-ccd\"><p class=\"a-chd\">اكتب النسب تحت السلسلة<small>كما كتبت الفروق في «سلاسل الأرقام 1»</small></p>\n  <div class=\"a-cgrd\"><span class=\"a-tn\" style=\"grid-row:1;grid-column:1\"><span class=\"a-ltr\">2</span></span><span class=\"a-tn\" style=\"grid-row:1;grid-column:2\"><span class=\"a-ltr\">2</span></span><span class=\"a-tn\" style=\"grid-row:1;grid-column:3\"><span class=\"a-ltr\">4</span></span><span class=\"a-tn\" style=\"grid-row:1;grid-column:4\"><span class=\"a-ltr\">12</span></span><span class=\"a-tn\" style=\"grid-row:1;grid-column:5\"><span class=\"a-ltr\">48</span></span><span class=\"a-tn a-q\" style=\"grid-row:1;grid-column:6\"><span class=\"a-ltr\">240</span></span><span class=\"a-rt\" style=\"grid-row:2;grid-column:1 / span 2\"><span class=\"a-ltr\">× 1</span></span><span class=\"a-rt\" style=\"grid-row:2;grid-column:2 / span 2\"><span class=\"a-ltr\">× 2</span></span><span class=\"a-rt\" style=\"grid-row:2;grid-column:3 / span 2\"><span class=\"a-ltr\">× 3</span></span><span class=\"a-rt\" style=\"grid-row:2;grid-column:4 / span 2\"><span class=\"a-ltr\">× 4</span></span><span class=\"a-rt a-q\" style=\"grid-row:2;grid-column:5 / span 2\"><span class=\"a-ltr\">× 5</span></span></div></div>\n<div class=\"a-ccd\"><p class=\"a-chd\">النسب <span class=\"a-ltr\">1، 2، 3، 4</span> تزيد واحداً، فالتالية <span class=\"a-ltr\">5</span></p>\n  <div class=\"a-cfm\"><span class=\"a-ltr\">48 × 5 = 240</span></div></div>\n<div class=\"a-cnote\">نمط النسب: <b>ثابتة</b>، أو تزيد واحداً، أو تتناوب.</div>\n<div class=\"a-foot a-f15\">لم تثبت النسبة؟ ابحث عن <b>نمطها</b> قبل أن تتركها.</div>", "ms03-1": "<h2>ستة وجوه، ثلاثة أزواج</h2>\n<div class=\"a-ccd\"><div class=\"a-cnet\"><svg direction=\"ltr\" viewBox=\"0 0 128 98\" role=\"img\" aria-label=\"شبكة مكعب: الوجهان المتقابلان بلون واحد\"><rect x=\"4\" y=\"4\" width=\"30\" height=\"30\" fill=\"#1F6B4C\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.8\"/><rect x=\"34\" y=\"4\" width=\"30\" height=\"30\" fill=\"#33449A\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.8\"/><rect x=\"34\" y=\"34\" width=\"30\" height=\"30\" fill=\"#C9A86A\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.8\"/><rect x=\"64\" y=\"34\" width=\"30\" height=\"30\" fill=\"#1F6B4C\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.8\"/><rect x=\"94\" y=\"34\" width=\"30\" height=\"30\" fill=\"#C9A86A\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.8\"/><rect x=\"64\" y=\"64\" width=\"30\" height=\"30\" fill=\"#33449A\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.8\"/></svg><svg direction=\"ltr\" viewBox=\"0 0 130 128\" role=\"img\" aria-label=\"مكعب يظهر منه ثلاثة وجوه، كل وجه من زوج مختلف\"><path d=\"M15,45 L65,20 L115,45 L65,70 Z\" fill=\"#1F6B4C\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.8\"/><path d=\"M15,45 L65,70 L65,122 L15,97 Z\" fill=\"#33449A\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.8\"/><path d=\"M65,70 L115,45 L115,97 L65,122 Z\" fill=\"#C9A86A\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.8\"/></svg></div>\n  <p class=\"a-chd\" style=\"text-align:center;margin:6px 0 0\">اللون الواحد = وجهان متقابلان</p></div>\n<div class=\"a-cleg\">\n  <div>كل وجه <b>يقابله وجه واحد</b> لا يلمسه، ويجاور الأربعة الباقية.</div>\n  <div>«أي وجه يقابل؟» و«أي وجه لا يجاور؟» سؤال واحد.</div>\n</div>\n<div class=\"a-foot a-f15\">المتلاصقان في الشبكة <b>متجاوران</b> بعد الطيّ، فأسقطهما من «يقابل».</div>", "ms03-2": "<h2>ثلاث علامات تُسقط الشبكة</h2>\n<div class=\"a-cn4\">\n<div class=\"a-bad\"><svg direction=\"ltr\" viewBox=\"0 0 59 59\" aria-hidden=\"true\"><rect x=\"4\" y=\"4\" width=\"17\" height=\"17\" fill=\"#F6E1E1\" class=\"a-cxr\" stroke=\"#9B2C2C\" stroke-width=\"2.2\"/><rect x=\"21\" y=\"4\" width=\"17\" height=\"17\" fill=\"#F6E1E1\" class=\"a-cxr\" stroke=\"#9B2C2C\" stroke-width=\"2.2\"/><rect x=\"38\" y=\"4\" width=\"17\" height=\"17\" fill=\"#F4EEDF\" class=\"a-cxe a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><rect x=\"4\" y=\"21\" width=\"17\" height=\"17\" fill=\"#F6E1E1\" class=\"a-cxr\" stroke=\"#9B2C2C\" stroke-width=\"2.2\"/><rect x=\"21\" y=\"21\" width=\"17\" height=\"17\" fill=\"#F6E1E1\" class=\"a-cxr\" stroke=\"#9B2C2C\" stroke-width=\"2.2\"/><rect x=\"4\" y=\"38\" width=\"17\" height=\"17\" fill=\"#F4EEDF\" class=\"a-cxe a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/></svg><b>✗ مربع من مربعين في مربعين</b></div>\n<div class=\"a-bad\"><svg direction=\"ltr\" viewBox=\"0 0 93 42\" aria-hidden=\"true\"><rect x=\"4\" y=\"4\" width=\"17\" height=\"17\" fill=\"#F6E1E1\" class=\"a-cxr\" stroke=\"#9B2C2C\" stroke-width=\"2.2\"/><rect x=\"21\" y=\"4\" width=\"17\" height=\"17\" fill=\"#F6E1E1\" class=\"a-cxr\" stroke=\"#9B2C2C\" stroke-width=\"2.2\"/><rect x=\"38\" y=\"4\" width=\"17\" height=\"17\" fill=\"#F6E1E1\" class=\"a-cxr\" stroke=\"#9B2C2C\" stroke-width=\"2.2\"/><rect x=\"55\" y=\"4\" width=\"17\" height=\"17\" fill=\"#F6E1E1\" class=\"a-cxr\" stroke=\"#9B2C2C\" stroke-width=\"2.2\"/><rect x=\"72\" y=\"4\" width=\"17\" height=\"17\" fill=\"#F6E1E1\" class=\"a-cxr\" stroke=\"#9B2C2C\" stroke-width=\"2.2\"/><rect x=\"38\" y=\"21\" width=\"17\" height=\"17\" fill=\"#F4EEDF\" class=\"a-cxe a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/></svg><b>✗ خمسة في صف</b></div>\n<div class=\"a-bad\"><svg direction=\"ltr\" viewBox=\"0 0 76 42\" aria-hidden=\"true\"><rect x=\"4\" y=\"4\" width=\"17\" height=\"17\" fill=\"#F6E1E1\" class=\"a-cxr\" stroke=\"#9B2C2C\" stroke-width=\"2.2\"/><rect x=\"55\" y=\"4\" width=\"17\" height=\"17\" fill=\"#F6E1E1\" class=\"a-cxr\" stroke=\"#9B2C2C\" stroke-width=\"2.2\"/><rect x=\"4\" y=\"21\" width=\"17\" height=\"17\" fill=\"#F4EEDF\" class=\"a-cxe a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><rect x=\"21\" y=\"21\" width=\"17\" height=\"17\" fill=\"#F4EEDF\" class=\"a-cxe a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><rect x=\"38\" y=\"21\" width=\"17\" height=\"17\" fill=\"#F4EEDF\" class=\"a-cxe a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><rect x=\"55\" y=\"21\" width=\"17\" height=\"17\" fill=\"#F4EEDF\" class=\"a-cxe a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/></svg><b>✗ جناحان على جهة واحدة بينهما فراغ</b></div>\n<div class=\"a-good\"><svg direction=\"ltr\" viewBox=\"0 0 76 59\" aria-hidden=\"true\"><rect x=\"4\" y=\"4\" width=\"17\" height=\"17\" fill=\"#1F6B4C\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><rect x=\"21\" y=\"4\" width=\"17\" height=\"17\" fill=\"#1F6B4C\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><rect x=\"21\" y=\"21\" width=\"17\" height=\"17\" fill=\"#1F6B4C\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><rect x=\"38\" y=\"21\" width=\"17\" height=\"17\" fill=\"#1F6B4C\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><rect x=\"38\" y=\"38\" width=\"17\" height=\"17\" fill=\"#1F6B4C\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><rect x=\"55\" y=\"38\" width=\"17\" height=\"17\" fill=\"#1F6B4C\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/></svg><b>✓ تُطوى</b></div>\n</div>\n<div class=\"a-cnote\" style=\"margin-top:8px\">لم تسقط؟ تحقق بالمتقابلات: وجه له مقابلان، أو وجه بلا مقابل، <b>فلا تُطوى</b>.</div>\n<div class=\"a-foot a-f15\">ستة مربعات متصلة لا تكفي: <b><span class=\"a-ltr\">11</span> شكلاً</b> فقط تُطوى مكعباً.</div>", "mn06-1": "<h2>السرعة المتوسطة: الأبطأ يثقل وزنه</h2>\n<div class=\"a-ccd\"><p class=\"a-chd\">ذهب <span class=\"a-ltr\">60</span> كيلومتراً، ثم رجع الطريق نفسه</p>\n<div class=\"a-uatl\"><div class=\"a-uag\"><b>ذهاب بسرعة <span class=\"a-ltr\">60</span></b>ساعة واحدة</div><div class=\"a-uab\"><b>رجوع بسرعة <span class=\"a-ltr\">30</span></b>ساعتان: الأبطأ يأخذ وقتاً أطول</div></div>\n<p class=\"a-uacap\">الزمن الكلي: ثلاث ساعات، ثلثاها للرحلة الأبطأ</p></div>\n<div class=\"a-uarw\"><b>المسافة الكلية</b><span><span class=\"a-ltr\">120</span> كيلومتراً</span></div>\n<div class=\"a-uarw\"><b>الزمن الكلي</b><span><span class=\"a-ltr\">3</span> ساعات</span></div>\n<div class=\"a-cfm\" style=\"margin:4px 0 8px\"><span class=\"a-ltr\">120 ÷ 3 = 40</span></div>\n<div class=\"a-uax\">✗ متوسط السرعتين <s><span class=\"a-ltr\">45</span></s></div>\n<div class=\"a-foot a-f15\">الرحلة الأبطأ <b>يثقل وزنها</b>، فلا تأخذ متوسط السرعتين.</div>", "mn06-2": "<h2>التقابل واللحاق</h2>\n<div class=\"a-uamv\"><svg direction=\"ltr\" viewBox=\"0 0 320 74\" role=\"img\" aria-label=\"سيارتان تتقابلان: كل واحدة تتجه نحو الأخرى\">\n<line x1=\"10\" y1=\"34\" x2=\"310\" y2=\"34\" stroke=\"#56605A\" class=\"a-cks\" stroke-width=\"2\"/>\n<circle cx=\"40\" cy=\"34\" r=\"11\" fill=\"#33449A\"/><path d=\"M58,34 H96 M88,27 L96,34 L88,41\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<circle cx=\"280\" cy=\"34\" r=\"11\" fill=\"#1F6B4C\"/><path d=\"M262,34 H224 M232,27 L224,34 L232,41\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<text x=\"40\" y=\"66\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" class=\"a-uafi\">80</text>\n<text x=\"280\" y=\"66\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" class=\"a-uafi\">70</text>\n<text x=\"160\" y=\"22\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" direction=\"rtl\" class=\"a-cxg\">تقابل</text>\n</svg>\n<p>المسافة تقصر <b>بمجموع</b> السرعتين</p>\n<div class=\"a-cfm\" style=\"margin-top:4px\"><span class=\"a-ltr\">225 ÷ (70 + 80) = 1.5</span> ساعة</div></div>\n<div class=\"a-uamv\"><svg direction=\"ltr\" viewBox=\"0 0 320 64\" role=\"img\" aria-label=\"سيارتان في اتجاه واحد: الخلفية أسرع تلحق الأمامية\">\n<line x1=\"10\" y1=\"34\" x2=\"310\" y2=\"34\" stroke=\"#56605A\" class=\"a-cks\" stroke-width=\"2\"/>\n<circle cx=\"40\" cy=\"34\" r=\"11\" fill=\"#1F6B4C\"/><path d=\"M58,34 H140 M132,27 L140,34 L132,41\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<circle cx=\"210\" cy=\"34\" r=\"11\" fill=\"#33449A\"/><path d=\"M228,34 H262 M254,27 L262,34 L254,41\" fill=\"none\" stroke=\"#A8813F\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<text x=\"95\" y=\"60\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" direction=\"rtl\" class=\"a-uafi\">أسرع</text>\n<text x=\"245\" y=\"60\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" direction=\"rtl\" class=\"a-uafi\">أبطأ</text>\n<text x=\"160\" y=\"18\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" direction=\"rtl\" class=\"a-cxg\">لحاق</text>\n</svg>\n<p>المسافة تقصر <b>بفرق</b> السرعتين</p></div>\n<div class=\"a-foot a-f15\">متعاكسان؟ <b>اجمع</b> السرعتين. اتجاه واحد؟ <b>اطرح</b>.</div>", "mn07-1": "<h2>الحل بعكس العمليات</h2>\n<div class=\"a-ccd\"><p class=\"a-chd\">الجملة: من العدد إلى النتيجة</p>\n<div class=\"a-uagr\"><div class=\"a-uan\">س</div><div class=\"a-uaop\"><span class=\"a-ltr\">× 3</span><i>←</i></div><div class=\"a-uan a-uaz\"></div><div class=\"a-uaop\"><span class=\"a-ltr\">+ 5</span><i>←</i></div><div class=\"a-uan\"><span class=\"a-ltr\">26</span></div></div>\n<p class=\"a-chd\" style=\"margin-top:10px\">الحل: من النتيجة إلى العدد، بالعكس</p>\n<div class=\"a-uagr\"><div class=\"a-uan a-uaq\"><span class=\"a-ltr\">7</span></div><div class=\"a-uaop a-uadn\"><span class=\"a-ltr\">÷ 3</span><i>→</i></div><div class=\"a-uan\"><span class=\"a-ltr\">21</span></div><div class=\"a-uaop a-uadn\"><span class=\"a-ltr\">− 5</span><i>→</i></div><div class=\"a-uan\"><span class=\"a-ltr\">26</span></div></div></div>\n<div class=\"a-cnote\">تحقق بالرجوع: <span class=\"a-ltr\">7 × 3 + 5 = 26</span></div>\n<div class=\"a-foot a-f15\">ابدأ من <b>آخر</b> عملية: الجمع يصير طرحاً، والضرب يصير قسمة.</div>", "mn07-2": "<h2>عبارات تنقلب</h2>\n<div class=\"a-ccd\"><p class=\"a-chd\">«أقل من س بـ <span class=\"a-ltr\">4</span>»</p>\n<div class=\"a-uach\"><span class=\"a-uay\">✓ س − <span class=\"a-ltr\">4</span></span><span class=\"a-uaw\">✗ <s><span class=\"a-ltr\">4</span> − س</s></span></div>\n<p class=\"a-uacap\" style=\"margin-top:4px\">ترتيب الجملة غير ترتيب الطرح</p></div>\n<div class=\"a-ccd\"><p class=\"a-chd\">مع العدد <span class=\"a-ltr\">5</span>: من يأتي أولاً؟</p>\n<div class=\"a-uaor\"><b>«ضعف العدد <em>ثم</em> أضف <span class=\"a-ltr\">3</span>»</b><span><span class=\"a-ltr\">5 × 2 + 3 = 13</span></span></div>\n<div class=\"a-uaor\"><b>«أضف <span class=\"a-ltr\">3</span> إلى العدد <em>ثم</em> ضاعفه»</b><span><span class=\"a-ltr\">(5 + 3) × 2 = 16</span></span></div></div>\n<div class=\"a-foot a-f15\">اكتب العمليات بترتيب الجملة، وفي الطرح انتبه: <b>من يُطرح منه؟</b></div>", "mn08-1": "<h2>القيمة المضافة: اعمل بالمجاميع</h2>\n<div class=\"a-ccd\"><p class=\"a-chd\">المتوسط × العدد = المجموع</p>\n<div class=\"a-uasm\"><b>قبل</b><span>أربع قيم متوسطها <span class=\"a-ltr\">50</span></span><span><span class=\"a-ltr\">200</span></span></div>\n<div class=\"a-uasm\"><b>بعد</b><span>خمس قيم متوسطها <span class=\"a-ltr\">52</span></span><span><span class=\"a-ltr\">52 × 5 = 260</span></span></div></div>\n<div class=\"a-cfm\" style=\"margin:0 0 8px\">المضاف: <span class=\"a-ltr\">260 − 200 = 60</span></div>\n<div class=\"a-cnote\">الفخ: أن تطرح المتوسطين، أو تأخذ <b>متوسط المتوسطين</b>.</div>\n<div class=\"a-foot a-f15\">حوّل المتوسط إلى <b>مجموع</b>، واطرح، ثم ارجع إلى المتوسط في الآخر.</div>", "mn08-2": "<h2>الاحتمال المتمم</h2>\n<div class=\"a-ccd a-uabar\"><p class=\"a-chd\">صندوق فيه <span class=\"a-ltr\">8</span> كرات: <span class=\"a-ltr\">2</span> حمراء، <span class=\"a-ltr\">3</span> زرقاء، <span class=\"a-ltr\">3</span> خضراء</p>\n<svg direction=\"ltr\" viewBox=\"0 0 326 104\" role=\"img\" aria-label=\"شريط من ثماني خانات: ثلاث زرقاء في اليمين، وخمس ليست زرقاء\">\n<path d=\"M203.5,34 V26 H318.5 V34\" fill=\"none\" stroke=\"#33449A\" stroke-width=\"2.5\"/>\n<path d=\"M6,78 V86 H200 V78\" fill=\"none\" stroke=\"#1F6B4C\" stroke-width=\"2.5\"/>\n<text x=\"261\" y=\"17\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" direction=\"rtl\" class=\"a-uafi\">زرقاء</text>\n<text x=\"103\" y=\"102\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" direction=\"rtl\" class=\"a-cxn\">ليست زرقاء</text>\n<rect x=\"282.5\" y=\"40\" width=\"36\" height=\"28\" rx=\"5\" fill=\"#33449A\"/><rect x=\"243.0\" y=\"40\" width=\"36\" height=\"28\" rx=\"5\" fill=\"#33449A\"/><rect x=\"203.5\" y=\"40\" width=\"36\" height=\"28\" rx=\"5\" fill=\"#33449A\"/><rect x=\"164.0\" y=\"40\" width=\"36\" height=\"28\" rx=\"5\" fill=\"#9B2C2C\"/><rect x=\"124.5\" y=\"40\" width=\"36\" height=\"28\" rx=\"5\" fill=\"#9B2C2C\"/><rect x=\"85.0\" y=\"40\" width=\"36\" height=\"28\" rx=\"5\" fill=\"#1F6B4C\"/><rect x=\"45.5\" y=\"40\" width=\"36\" height=\"28\" rx=\"5\" fill=\"#1F6B4C\"/><rect x=\"6.0\" y=\"40\" width=\"36\" height=\"28\" rx=\"5\" fill=\"#1F6B4C\"/></svg></div>\n<div class=\"a-uarw\"><b>زرقاء</b><span><span class=\"a-ltr\">3/8</span></span></div>\n<div class=\"a-uarw\"><b>ليست زرقاء</b><span><span class=\"a-ltr\">1 − 3/8 = 5/8</span></span></div>\n<div class=\"a-foot a-f15\">ألّا يقع الحدث = <b>واحد ناقص</b> احتمال وقوعه.</div>", "mn11-1": "<h2>سلسلتان متداخلتان: اقرأ كل ثاني حد</h2>\n<div class=\"a-ccd\"><p class=\"a-chd\">الحدود، وتحت كل حد موضعه</p>\n<div class=\"a-uasr\"><div><div class=\"a-uac a-uao\"><span class=\"a-ltr\">2</span></div><span><span class=\"a-ltr\">1</span></span></div><div><div class=\"a-uac a-uae\"><span class=\"a-ltr\">10</span></div><span><span class=\"a-ltr\">2</span></span></div><div><div class=\"a-uac a-uao\"><span class=\"a-ltr\">4</span></div><span><span class=\"a-ltr\">3</span></span></div><div><div class=\"a-uac a-uae\"><span class=\"a-ltr\">20</span></div><span><span class=\"a-ltr\">4</span></span></div><div><div class=\"a-uac a-uao\"><span class=\"a-ltr\">6</span></div><span><span class=\"a-ltr\">5</span></span></div><div><div class=\"a-uac a-uae\"><span class=\"a-ltr\">30</span></div><span><span class=\"a-ltr\">6</span></span></div><div><div class=\"a-uac a-uak\">؟</div><span><span class=\"a-ltr\">7</span></span></div></div></div>\n<div class=\"a-ccd\"><div class=\"a-uapl a-uao\"><b>المواضع الفردية</b><span><span class=\"a-ltr\">2</span></span><span><span class=\"a-ltr\">4</span></span><span><span class=\"a-ltr\">6</span></span><i>←</i><span class=\"a-uaq\"><span class=\"a-ltr\">8</span></span></div>\n<div class=\"a-uapl a-uae\"><b>المواضع الزوجية</b><span><span class=\"a-ltr\">10</span></span><span><span class=\"a-ltr\">20</span></span><span><span class=\"a-ltr\">30</span></span></div></div>\n<div class=\"a-cnote\">الناقص في الموضع السابع، <b>وهو فردي</b>، فيكمل سلسلة الفردية وحدها.</div>\n<div class=\"a-foot a-f15\">حدّد موضع الناقص أولاً: <b>فردي أم زوجي؟</b></div>", "mn11-2": "<h2>عمليتان تتناوبان</h2>\n<div class=\"a-ccd\"><p class=\"a-chd\">اكتب العملية تحت كل خطوة</p>\n<div class=\"a-uass\"><div class=\"a-uac\"><span class=\"a-ltr\">4</span></div><div class=\"a-uaop\"><i>←</i><span class=\"a-ltr\">+ 3</span></div><div class=\"a-uac\"><span class=\"a-ltr\">7</span></div><div class=\"a-uaop a-uadn\"><i>←</i><span class=\"a-ltr\">× 2</span></div><div class=\"a-uac\"><span class=\"a-ltr\">14</span></div><div class=\"a-uaop\"><i>←</i><span class=\"a-ltr\">+ 3</span></div><div class=\"a-uac\"><span class=\"a-ltr\">17</span></div><div class=\"a-uaop a-uadn\"><i>←</i><span class=\"a-ltr\">× 2</span></div><div class=\"a-uac\"><span class=\"a-ltr\">34</span></div><div class=\"a-uaop\"><i>←</i><span class=\"a-ltr\">+ 3</span></div><div class=\"a-uac a-uaq\"><span class=\"a-ltr\">37</span></div></div>\n<p class=\"a-uacap\" style=\"margin-top:4px\">جمع، ثم ضرب، ثم جمع، ثم ضرب…</p></div>\n<div class=\"a-uarw\"><b>النمط</b><span>زائد <span class=\"a-ltr\">3</span>، ثم في <span class=\"a-ltr\">2</span>، ويتكرر</span></div>\n<div class=\"a-uarw\"><b>التالية</b><span>زائد <span class=\"a-ltr\">3</span>: <span class=\"a-ltr\">34 + 3 = 37</span></span></div>\n<div class=\"a-foot a-f15\">العملية تتبدل؟ اكتبها <b>تحت كل خطوة</b> فيظهر التكرار.</div>", "mn12-1": "<h2>ثلاثة قبل الأرقام، ثم خانتان</h2>\n<div class=\"a-ubk\"><span class=\"a-ubk1\">العنوان</span><span class=\"a-ubk2\">الوحدة</span><span class=\"a-ubk3\">رؤوس الأعمدة</span><span class=\"a-ubk4\">رؤوس الصفوف</span></div>\n<div class=\"a-ccd\">\n<p class=\"a-ubcap\"><span class=\"a-ubk1\">المعاملات المنجزة في فرعين</span><span class=\"a-ubk2\">بالمئات</span></p>\n<table class=\"a-ubt\"><tr><th>الربع</th><th>الفرع الشمالي</th><th>الفرع الجنوبي</th></tr><tr><td class=\"a-ubrh\">الربع الأول</td><td class=\"a-ubpk\"><span class=\"a-ltr\">12</span></td><td class=\"a-ubpk\"><span class=\"a-ltr\">8</span></td></tr><tr><td class=\"a-ubrh\">الربع الثاني</td><td><span class=\"a-ltr\">15</span></td><td><span class=\"a-ltr\">10</span></td></tr><tr><td class=\"a-ubrh\">الربع الثالث</td><td><span class=\"a-ltr\">9</span></td><td><span class=\"a-ltr\">14</span></td></tr><tr><td class=\"a-ubrh\">الربع الرابع</td><td><span class=\"a-ltr\">14</span></td><td><span class=\"a-ltr\">16</span></td></tr></table>\n</div>\n<div class=\"a-cnote\">في جدول «بالمئات» الرقم <span class=\"a-ltr\">12</span> يعني <span class=\"a-ltr\">1200</span>، والخيار <span class=\"a-ltr\">12</span> <b>فخ</b> ينتظر من نسي الوحدة.</div>\n<div class=\"a-foot a-f15\">أغلب أسئلة الجدول تحتاج <b>خانتين أو ثلاثاً</b>، لا الجدول كله.</div>", "mn12-2": "<h2>زيادة أكبر أم نسبة أكبر؟</h2>\n<div class=\"a-ub2\" style=\"margin-bottom:8px\"><div class=\"a-ubb\"><b>«أكبر زيادة»</b><span>الفرق</span></div><div class=\"a-ubn\"><b>«أكبر نسبة زيادة»</b><span>الفرق على القديم</span></div></div>\n<div class=\"a-ubrw\"><p>زيادة <span class=\"a-ltr\">4</span> من <span class=\"a-ltr\">10</span></p><div class=\"a-ubbar\"><span class=\"a-ubb0\" style=\"width:45.0px\"></span><span class=\"a-ubb1\" style=\"width:18.0px\"></span></div><div class=\"a-cfm\"><span class=\"a-ltr\">4 ÷ 10 = 40%</span></div></div>\n<div class=\"a-ubrw\"><p>زيادة <span class=\"a-ltr\">6</span> من <span class=\"a-ltr\">60</span></p><div class=\"a-ubbar\"><span class=\"a-ubb0\" style=\"width:270.0px\"></span><span class=\"a-ubb1\" style=\"width:27.0px\"></span></div><div class=\"a-cfm\"><span class=\"a-ltr\">6 ÷ 60 = 10%</span></div></div>\n<div class=\"a-cnote\">الذهبي هو الزيادة، والرمادي هو <b>القديم</b> الذي تقسم عليه.</div>\n<div class=\"a-foot a-f15\">الثانية أكبر زيادة وأصغر نسبة، لأن <b>قاعدتها كبيرة</b>.</div>", "mn13-1": "<h2>اقرأ الرسم بهذا الترتيب</h2>\n<div class=\"a-ubch\"><span>العنوان</span><i>←</i><span>الوحدة</span><i>←</i><span>مقياس المحور</span><i>←</i><span>الرقم</span></div>\n<div class=\"a-ub3\">\n<div><svg viewBox=\"0 0 72 50\" aria-hidden=\"true\"><path d=\"M4,46 H68\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"2\"/><rect x=\"10\" y=\"26\" width=\"12\" height=\"20\" class=\"a-cxl\" fill=\"#E3F0E8\"/><rect x=\"30\" y=\"12\" width=\"12\" height=\"34\" fill=\"#1F6B4C\"/><rect x=\"50\" y=\"20\" width=\"12\" height=\"26\" class=\"a-cxl\" fill=\"#E3F0E8\"/></svg><b>الأعمدة</b><span>تقارن كميات</span></div>\n<div><svg viewBox=\"0 0 72 50\" aria-hidden=\"true\"><path d=\"M4,46 H68\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"2\"/><path d=\"M8,36 L26,22 L44,28 L64,8\" fill=\"none\" class=\"a-ubgs\" stroke=\"#A8813F\" stroke-width=\"3\" stroke-linejoin=\"round\"/><circle cx=\"8\" cy=\"36\" r=\"3.5\" fill=\"#1F6B4C\"/><circle cx=\"26\" cy=\"22\" r=\"3.5\" fill=\"#1F6B4C\"/><circle cx=\"44\" cy=\"28\" r=\"3.5\" fill=\"#1F6B4C\"/><circle cx=\"64\" cy=\"8\" r=\"3.5\" fill=\"#1F6B4C\"/></svg><b>الخط</b><span>يتتبع التغيّر</span></div>\n<div><svg viewBox=\"0 0 72 50\" aria-hidden=\"true\"><circle cx=\"36\" cy=\"25\" r=\"22\" class=\"a-cxl\" fill=\"#E3F0E8\"/><path d=\"M36,25 L36,3 A22,22 0 0 1 56.9,31.8 Z\" fill=\"#1F6B4C\"/><path d=\"M36,25 L56.9,31.8 A22,22 0 0 1 22.1,42 Z\" fill=\"#C9A86A\"/><circle cx=\"36\" cy=\"25\" r=\"22\" fill=\"none\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/></svg><b>الدائرة</b><span>تقسم الكل</span></div>\n</div>\n<div class=\"a-cnote\" style=\"margin-bottom:6px\">الوحدة «<b>بالآلاف</b>» تغيّر معنى كل رقم على الرسم.</div>\n<div class=\"a-cnote\">لا رقم على العمود؟ اقرأه من <b>مقياس المحور</b>: خطوته قد تكون خمسة أو عشرة.</div>\n<div class=\"a-foot a-f15\">ابدأ بالعنوان والوحدة، و<b>آخر</b> ما تقرؤه الرقم.</div>", "mn13-2": "<h2>فرق واحد، ونسبتان</h2>\n<div class=\"a-ccd\"><svg direction=\"ltr\" viewBox=\"0 0 330 158\" role=\"img\" aria-label=\"عمودان من 10 إلى 16، وعمودان من 20 إلى 26، والزيادة 6 في الحالتين\"><path d=\"M14,150 H322\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"2\"/><rect x=\"28\" y=\"105.0\" width=\"40\" height=\"45.0\" class=\"a-ubcf\" fill=\"#DAD6CC\"/><text x=\"48\" y=\"99.0\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#1B231E\" class=\"a-ubtx\">10</text><rect x=\"76\" y=\"105.0\" width=\"40\" height=\"45.0\" class=\"a-ubcf\" fill=\"#DAD6CC\"/><rect x=\"76\" y=\"78.0\" width=\"40\" height=\"27.0\" fill=\"#C9A86A\"/><text x=\"96\" y=\"72.0\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#1B231E\" class=\"a-ubtx\">16</text><rect x=\"196\" y=\"60.0\" width=\"40\" height=\"90.0\" class=\"a-ubcf\" fill=\"#DAD6CC\"/><text x=\"216\" y=\"54.0\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#1B231E\" class=\"a-ubtx\">20</text><rect x=\"244\" y=\"60.0\" width=\"40\" height=\"90.0\" class=\"a-ubcf\" fill=\"#DAD6CC\"/><rect x=\"244\" y=\"33.0\" width=\"40\" height=\"27.0\" fill=\"#C9A86A\"/><text x=\"264\" y=\"27.0\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#1B231E\" class=\"a-ubtx\">26</text><text x=\"126\" y=\"96.5\" font-size=\"15\" font-weight=\"800\" class=\"a-ubgf\" fill=\"#7A5D24\">+6</text><text x=\"294\" y=\"51.5\" font-size=\"15\" font-weight=\"800\" class=\"a-ubgf\" fill=\"#7A5D24\">+6</text></svg><p class=\"a-chd\" style=\"text-align:center;margin:2px 0 0\">الزيادة <span class=\"a-ltr\">6</span> في الحالتين، والقديم مختلف</p></div>\n<div class=\"a-ub2\" style=\"margin-bottom:8px\">\n<div class=\"a-ubg\"><b><span class=\"a-ltr\">6</span> من <span class=\"a-ltr\">10</span></b><span>قديم صغير: نسبة أكبر</span></div>\n<div class=\"a-ubb\"><b><span class=\"a-ltr\">6</span> من <span class=\"a-ltr\">20</span></b><span>قديم ضعفه: نسبة نصفها</span></div>\n</div>\n<div class=\"a-foot a-f15\">الميلان المتساويان فرقان متساويان، <b>لا نسبتان</b>.</div>", "mn14-1": "<h2>حوله أم داخله؟</h2>\n<div class=\"a-ccd\"><svg direction=\"ltr\" viewBox=\"0 0 300 160\" role=\"img\" aria-label=\"مستطيل حدّه مضيء وهو المحيط، وداخله مظلل وهو المساحة\"><rect x=\"40\" y=\"34\" width=\"220\" height=\"104\" rx=\"3\" fill=\"none\" class=\"a-ubgs\" stroke=\"#C9A86A\" stroke-width=\"16\" stroke-opacity=\".28\"/><rect x=\"40\" y=\"34\" width=\"220\" height=\"104\" rx=\"3\" class=\"a-cxl\" fill=\"#E3F0E8\"/><rect x=\"40\" y=\"34\" width=\"220\" height=\"104\" rx=\"3\" fill=\"none\" class=\"a-ubgs\" stroke=\"#A8813F\" stroke-width=\"5\"/><text x=\"150\" y=\"92\" font-size=\"16\" font-weight=\"800\" text-anchor=\"middle\" class=\"a-cxn\" fill=\"#1F6B4C\" direction=\"rtl\">المساحة: داخله</text><text x=\"150\" y=\"20\" font-size=\"16\" font-weight=\"800\" text-anchor=\"middle\" class=\"a-ubgf\" fill=\"#7A5D24\" direction=\"rtl\">المحيط: حوله</text><path d=\"M150,25 V30\" class=\"a-ubgs\" stroke=\"#A8813F\" stroke-width=\"2\"/></svg></div>\n<div class=\"a-ub2\" style=\"margin-bottom:8px\">\n<div class=\"a-ubg\"><b>الإطار</b><span>محيط: طول الحدّ حول الشكل</span></div>\n<div class=\"a-ubn\"><b>السجاد</b><span>مساحة: ما يغطيه من داخله</span></div>\n</div>\n<div class=\"a-cnote\">المحيط <b>طول</b> تمشيه على الحد، والمساحة <b>سطح</b> تغطيه.</div>\n<div class=\"a-foot a-f15\">اسأل قبل القانون: المطلوب <b>حول</b> الشكل أم داخله؟</div>", "mn14-2": "<h2>اقتطاع مربع من الركن: مساحة تنقص</h2>\n<div class=\"a-ccd\"><svg direction=\"ltr\" viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"مستطيل اقتُطع من ركنه مربع: المساحة تنقص، والضلعان الجديدان بطول المقتطعين فيبقى المحيط\"><path d=\"M40,20 H220 V80 H280 V160 H40 Z\" class=\"a-cxl\" fill=\"#E3F0E8\"/><rect x=\"220\" y=\"20\" width=\"60\" height=\"60\" fill=\"none\" class=\"a-ubrs\" stroke=\"#9B2C2C\" stroke-width=\"1.5\" stroke-dasharray=\"3 4\"/><path d=\"M220,20 H280 V80\" fill=\"none\" class=\"a-ubrs\" stroke=\"#9B2C2C\" stroke-width=\"4\" stroke-dasharray=\"7 5\"/><path d=\"M220,20 H40 V160 H280 V80\" fill=\"none\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"3\"/><path d=\"M220,20 V80 H280\" fill=\"none\" class=\"a-ubns\" stroke=\"#1F6B4C\" stroke-width=\"5\"/><path d=\"M268,28 V72\" fill=\"none\" class=\"a-ubns\" stroke=\"#1F6B4C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M262,65 L268,73 L274,65\" fill=\"none\" class=\"a-ubns\" stroke=\"#1F6B4C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M272,34 H228\" fill=\"none\" class=\"a-ubns\" stroke=\"#1F6B4C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M235,28 L227,34 L235,40\" fill=\"none\" class=\"a-ubns\" stroke=\"#1F6B4C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"130\" y=\"96\" font-size=\"16\" font-weight=\"800\" text-anchor=\"middle\" class=\"a-cxn\" fill=\"#1F6B4C\" direction=\"rtl\">الباقي</text></svg>\n<p class=\"a-chd\" style=\"text-align:center;margin:2px 0 0\">الأحمر خرج من الحد، والأخضر دخل بدله</p></div>\n<div class=\"a-crow\"><span class=\"a-cs\">المساحة</span><i>←</i><span class=\"a-ubdn\">تنقص بقدر المربع</span></div>\n<div class=\"a-crow\"><span class=\"a-cs\">المحيط</span><i>←</i><span class=\"a-cy\">لا يتغير: ضلعان بطول المقتطعين</span></div>\n<div class=\"a-foot a-f15\">الشكل المركّب: احسب الكامل، ثم <b>اطرح</b> المقتطع من مساحته.</div>", "mz01-1": "<h2>حدّ السؤال الواحد: دقيقتان</h2>\n<div class=\"a-ccd\"><svg direction=\"ltr\" viewBox=\"0 0 340 82\" role=\"img\" aria-label=\"شريط وقت السؤال من بدايته، وعند الدقيقتين علامة حمراء\"><rect x=\"20\" y=\"36\" width=\"300\" height=\"14\" rx=\"7\" class=\"a-cxe\" fill=\"#EAE7E0\"/><rect x=\"70\" y=\"36\" width=\"250\" height=\"14\" rx=\"7\" class=\"a-cxl\" fill=\"#E3F0E8\"/><path d=\"M200,37 L190,43 L200,49\" fill=\"none\" class=\"a-ubns\" stroke=\"#1F6B4C\" stroke-width=\"2.5\"/><path d=\"M70,12 V58\" class=\"a-ubrs\" stroke=\"#9B2C2C\" stroke-width=\"3\"/><path d=\"M70,12 L94,18 L70,24 Z\" class=\"a-ubrf\" fill=\"#9B2C2C\"/><text x=\"70\" y=\"76\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" class=\"a-ubrf\" fill=\"#9B2C2C\" direction=\"rtl\">دقيقتان</text><text x=\"320\" y=\"76\" font-size=\"15\" font-weight=\"800\" text-anchor=\"start\" fill=\"#56605A\" class=\"a-ubtm\" direction=\"rtl\">بداية السؤال</text></svg>\n<div class=\"a-ubst\"><span>اختر أرجح خيار</span><i>←</i><span>علّم</span><i>←</i><span>انتقل</span></div></div>\n<div class=\"a-ccd\"><p class=\"a-chd\" style=\"margin:0 0 2px\">قطعة القراءة</p>\n<div class=\"a-ubpt\">وقت القطعة كلها</div>\n<div class=\"a-ubpb\"><span>سؤال</span><span>سؤال</span><span>سؤال</span><span>سؤال</span></div>\n<p class=\"a-chd\" style=\"margin:4px 0 0\"><small>يُقسم وقتها على أسئلتها كلها، لا على أولها.</small></p></div>\n<div class=\"a-foot a-f15\">لا تحبس نفسك عند سؤال واحد أكثر من <b>دقيقتين</b>.</div>", "mz01-2": "<h2>جولتان داخل القسم</h2>\n<div class=\"a-ccd\"><p class=\"a-ubrd\"><b>الجولة الأولى:</b> أجب ما تعرفه بسرعة، وعلّم الصعب وتجاوزه.</p><svg direction=\"ltr\" viewBox=\"0 0 340 52\" aria-hidden=\"true\"><path d=\"M326,10 H22\" fill=\"none\" class=\"a-ubgs\" stroke=\"#A8813F\" stroke-width=\"2.5\"/><path d=\"M30,4 L20,10 L30,16\" fill=\"none\" class=\"a-ubgs\" stroke=\"#A8813F\" stroke-width=\"2.5\"/><circle cx=\"316\" cy=\"38\" r=\"8\" fill=\"#1F6B4C\"/><circle cx=\"290\" cy=\"38\" r=\"8\" fill=\"#1F6B4C\"/><circle cx=\"264\" cy=\"38\" r=\"8\" fill=\"none\" class=\"a-ubrs\" stroke=\"#9B2C2C\" stroke-width=\"2.5\"/><path d=\"M256,30 V18 L268,22 L256,26\" class=\"a-ubrf\" fill=\"#9B2C2C\"/><path d=\"M256,30 V18\" class=\"a-ubrs\" stroke=\"#9B2C2C\" stroke-width=\"2\"/><circle cx=\"238\" cy=\"38\" r=\"8\" fill=\"#1F6B4C\"/><circle cx=\"212\" cy=\"38\" r=\"8\" fill=\"#1F6B4C\"/><circle cx=\"186\" cy=\"38\" r=\"8\" fill=\"#1F6B4C\"/><circle cx=\"160\" cy=\"38\" r=\"8\" fill=\"none\" class=\"a-ubrs\" stroke=\"#9B2C2C\" stroke-width=\"2.5\"/><path d=\"M152,30 V18 L164,22 L152,26\" class=\"a-ubrf\" fill=\"#9B2C2C\"/><path d=\"M152,30 V18\" class=\"a-ubrs\" stroke=\"#9B2C2C\" stroke-width=\"2\"/><circle cx=\"134\" cy=\"38\" r=\"8\" fill=\"#1F6B4C\"/><circle cx=\"108\" cy=\"38\" r=\"8\" fill=\"#1F6B4C\"/><circle cx=\"82\" cy=\"38\" r=\"8\" fill=\"none\" class=\"a-ubrs\" stroke=\"#9B2C2C\" stroke-width=\"2.5\"/><path d=\"M74,30 V18 L86,22 L74,26\" class=\"a-ubrf\" fill=\"#9B2C2C\"/><path d=\"M74,30 V18\" class=\"a-ubrs\" stroke=\"#9B2C2C\" stroke-width=\"2\"/><circle cx=\"56\" cy=\"38\" r=\"8\" fill=\"#1F6B4C\"/><circle cx=\"30\" cy=\"38\" r=\"8\" fill=\"#1F6B4C\"/></svg></div>\n<div class=\"a-ccd\"><p class=\"a-ubrd\"><b>الجولة الثانية:</b> ارجع إلى ما علّمته بالوقت الباقي.</p><svg direction=\"ltr\" viewBox=\"0 0 340 52\" aria-hidden=\"true\"><path d=\"M330,28 Q299.0,2 268,26\" fill=\"none\" class=\"a-ubgs\" stroke=\"#A8813F\" stroke-width=\"2.5\"/><path d=\"M277,22 L268,27 L273,34\" fill=\"none\" class=\"a-ubgs\" stroke=\"#A8813F\" stroke-width=\"2.5\"/><path d=\"M260,28 Q212.0,2 164,26\" fill=\"none\" class=\"a-ubgs\" stroke=\"#A8813F\" stroke-width=\"2.5\"/><path d=\"M173,22 L164,27 L169,34\" fill=\"none\" class=\"a-ubgs\" stroke=\"#A8813F\" stroke-width=\"2.5\"/><path d=\"M156,28 Q121.0,2 86,26\" fill=\"none\" class=\"a-ubgs\" stroke=\"#A8813F\" stroke-width=\"2.5\"/><path d=\"M95,22 L86,27 L91,34\" fill=\"none\" class=\"a-ubgs\" stroke=\"#A8813F\" stroke-width=\"2.5\"/><circle cx=\"316\" cy=\"38\" r=\"8\" class=\"a-cxe\" fill=\"#EAE7E0\"/><circle cx=\"290\" cy=\"38\" r=\"8\" class=\"a-cxe\" fill=\"#EAE7E0\"/><circle cx=\"264\" cy=\"38\" r=\"9\" fill=\"#C9A86A\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><circle cx=\"238\" cy=\"38\" r=\"8\" class=\"a-cxe\" fill=\"#EAE7E0\"/><circle cx=\"212\" cy=\"38\" r=\"8\" class=\"a-cxe\" fill=\"#EAE7E0\"/><circle cx=\"186\" cy=\"38\" r=\"8\" class=\"a-cxe\" fill=\"#EAE7E0\"/><circle cx=\"160\" cy=\"38\" r=\"9\" fill=\"#C9A86A\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><circle cx=\"134\" cy=\"38\" r=\"8\" class=\"a-cxe\" fill=\"#EAE7E0\"/><circle cx=\"108\" cy=\"38\" r=\"8\" class=\"a-cxe\" fill=\"#EAE7E0\"/><circle cx=\"82\" cy=\"38\" r=\"9\" fill=\"#C9A86A\" class=\"a-cks\" stroke=\"#1B231E\" stroke-width=\"1.5\"/><circle cx=\"56\" cy=\"38\" r=\"8\" class=\"a-cxe\" fill=\"#EAE7E0\"/><circle cx=\"30\" cy=\"38\" r=\"8\" class=\"a-cxe\" fill=\"#EAE7E0\"/></svg></div>\n<div class=\"a-cnote\">لا تفترض أنك ترجع إلى قسم أنهيته: تعليمات التنقل تعرفها <b>يوم الاختبار</b>.</div>\n<div class=\"a-foot a-f15\">السؤال السهل في آخر القسم له <b>الدرجة نفسها</b>.</div>", "mr05-1": "<h2>اتجاهان للاستدلال</h2>\n<div class=\"a-ucd\">\n<div class=\"a-uca\"><p class=\"a-uch\">الاستنباط</p>\n<div class=\"a-ucc\"><b>حكم عام</b><span>«كل موظفي القسم يحملون بطاقة»</span></div>\n<span class=\"a-ucv-l\"><svg class=\"a-ucv\" viewBox=\"0 0 26 34\" aria-hidden=\"true\"><path d=\"M13,2 V30 M5,22 L13,31 L21,22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>ينزل</span>\n<div class=\"a-ucc\"><b>حالة خاصة</b><span>«وسعد منهم، إذن سعد يحملها»</span></div>\n<p class=\"a-uct\">النتيجة: يقين</p></div>\n<div class=\"a-ucb\"><p class=\"a-uch\">الاستقراء</p>\n<div class=\"a-ucc\"><b>حكم عام</b><span>«إذن الدورة تحسّن المتدربين»</span></div>\n<span class=\"a-ucv-l\"><svg class=\"a-ucv\" viewBox=\"0 0 26 34\" aria-hidden=\"true\"><path d=\"M13,32 V4 M5,12 L13,3 L21,12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>يصعد</span>\n<div class=\"a-ucc\"><b>حالات مشاهدة</b><span>«تحسّن خمسة متدربين بعد الدورة»</span></div>\n<p class=\"a-uct\">النتيجة: احتمال</p></div>\n</div>\n<div class=\"a-foot a-f15\">اسأل: هل يمكن أن تصحّ المقدمات وتخطئ النتيجة؟ إن لم يمكن فهو <b>استنباط</b>.</div>", "mr05-2": "<h2>الاستقراء التام والناقص</h2>\n<div class=\"a-ucl\">\n<div><div class=\"a-ucr a-ucg\"><b>تام: كل الحالات</b><span>يقيني</span></div><svg direction=\"ltr\" viewBox=\"0 0 220 22\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"33\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"55\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"77\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"99\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"121\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"143\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"165\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"187\" cy=\"11\" r=\"7\" class=\"a-cxn\"/><circle cx=\"209\" cy=\"11\" r=\"7\" class=\"a-cxn\"/></svg>\n<p class=\"a-ucs\">«فحص المدير ملفات موظفيه العشرة كلها»</p></div>\n<div><div class=\"a-ucr a-ucy\"><b>ناقص: بعضها</b><span>محتمل</span></div><svg direction=\"ltr\" viewBox=\"0 0 220 22\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"
